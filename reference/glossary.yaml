# Glossary of the terms this guide teaches: the source of truth for guide/99-reference/01-glossary.md
# (built by source/glossary/build_glossary.py) and, later, for flashcards.
# Sorted alphabetically by term. Fields are described in source/glossary/build_glossary.py.

- term: 7 Rs
  definition: >-
    AWS's seven migration strategies: retire, retain, rehost, relocate, repurchase, replatform, and
    refactor or re-architect. AWS's 2016 list had six; relocate was added later.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in:
    - guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
    - guide/13-moving-to-aws/05-sim-portfolio-sorter.md
  confused_with: [AWS Cloud Adoption Framework]
  not_to_confuse: >-
    The 7 Rs decide what happens to one application; the CAF works on the whole organization's
    outcomes and readiness, and uses the 7 Rs in its portfolio management.
  module: "13"

- term: abstracted service
  definition: >-
    AWS's name for the most managed kind of service, such as Amazon S3 or Amazon DynamoDB, where AWS
    runs the infrastructure, operating system and platform and you work only with your data and its
    settings.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in: [guide/05-storing-data/06-choosing-a-database.md]
  confused_with: [managed service]
  not_to_confuse: >-
    Abstracted services are the far end of managed services: you never see a server or a database
    engine, only the service's data and settings.
  module: "04"

- term: abuse
  definition: >-
    Using a computing resource to harm others, such as spam, network attacks, port scans or hosting
    stolen or illegal content. Abuse from AWS resources goes to the AWS Trust & Safety team, not to
    AWS Support.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: abuse report
  definition: >-
    A report to AWS Trust & Safety, through its abuse form, that an AWS resource is harming you,
    with evidence such as the attacked address, times with time zone and log lines. Trust & Safety
    also sends them to resource owners.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: accelerated computing
  definition: >-
    EC2 instance types with GPUs or other special chips, for work such as machine learning, graphics
    and floating-point calculations. Its letters include P, G, Inf and Trn.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [compute optimized, HPC optimized]
  not_to_confuse: >-
    Accelerated computing adds special chips such as GPUs; compute optimized adds ordinary
    processors, and HPC optimized is for very large, tightly linked computations.
  module: "06"

- term: accepted risk
  definition: >-
    A risk the business decides not to fix, written down with the reason and who decided, such as
    staying on Basic Support. AWS's guidance asks for this when a business chooses not to act.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  confused_with: [high-risk issue]
  not_to_confuse: >-
    A high-risk issue is a finding to deal with; an accepted risk is a finding the business has
    decided, in writing, not to fix.
  module: "14"

- term: access control list
  abbreviation: ACL
  definition: >-
    An older way to grant access to an S3 bucket or object. New buckets have ACLs turned off, and
    AWS recommends policies instead.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [network ACL]
  not_to_confuse: >-
    An S3 access control list grants access to buckets and objects; a network ACL is a firewall
    that filters traffic at the edge of a subnet.
  module: "05"

- term: access key
  definition: >-
    A long-term credential, an access key ID plus a secret access key, letting a program act as an
    IAM user or the root user without a password or MFA. Avoid it where a role or keyless sign-in
    works.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: access reports
  definition: >-
    IAM's reports on who can use what, and whether they have: last accessed information, the
    credential report and the AWS Organizations access report. The exam guide names them for
    reporting.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  module: "09"

- term: Account Factory
  definition: >-
    The AWS Control Tower feature that creates new accounts from an approved template, already
    governed by the landing zone's controls.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: account team
  definition: >-
    The AWS people assigned to a customer, such as an account manager and a solutions architect. An
    existing customer asks its account team for a solutions architect.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md]
  module: "12"

- term: account-specific event
  definition: >-
    An AWS Health Dashboard event about your own account or resources, such as scheduled maintenance
    on one of your servers.
  taught_in: guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md]
  confused_with: [public event]
  not_to_confuse: >-
    An account-specific event is about your resources; a public event is a service issue not tied to
    any account.
  module: "03"

- term: Action (policy element)
  definition: >-
    The part of a policy statement that names what may be done, written as service:action, such as
    s3:GetObject.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: agent (contact center)
  definition: >-
    A person who answers customers' calls, chats and messages in a contact center, such as a staff
    member taking the calls Amazon Connect Customer routes to them.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [bot]
  not_to_confuse: >-
    An agent is a person answering customers; a bot, built with Lex, is a program that can answer
    first and hand over to an agent.
  module: "10"

- term: agility
  definition: >-
    The ability to get new resources, and try new ideas, quickly and cheaply: a new resource takes
    minutes rather than weeks, and you can delete it afterward.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  also_in: [guide/02-why-the-cloud/06-lab-01-first-resource.md]
  confused_with: [elasticity, global reach]
  not_to_confuse: >-
    Agility is how fast you can get something new; elasticity is more or less of the same thing
    driven by demand, and global reach is about where you run.
  module: "02"

- term: alarm
  definition: >-
    A CloudWatch rule that watches one metric against a threshold, period by period, and acts when
    its state changes, for example by notifying an SNS topic or scaling an Auto Scaling group.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: alarm state
  definition: >-
    Where a CloudWatch alarm stands: OK (below the threshold), ALARM (beyond it) or
    INSUFFICIENT_DATA (not enough data to decide). OK doesn't prove the alarm's email will arrive.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: alias record
  definition: >-
    A Route 53 record that points a name, even the bare domain such as bakery.example, at an AWS
    resource such as a CloudFront distribution, a load balancer or an S3 website bucket, whose
    addresses can change.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: Align phase
  definition: >-
    The second CAF phase: finding capability gaps across the six perspectives and dependencies
    between teams, surfacing concerns, and planning how to close the gaps.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: Always Free offer
  definition: >-
    A monthly allowance on a service, such as Lambda's requests, that renews every month with no end
    date, on both the Free and Paid plans.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  confused_with: [short-term trial]
  not_to_confuse: >-
    An Always Free offer renews every month on both plans; a short-term trial runs for a limited
    time after you activate the service, on the Paid plan only.
  module: "11"

- term: Amazon API Gateway
  definition: >-
    A service for publishing APIs at any scale with no servers of your own. It receives each call,
    checks who is calling and how often, and passes it to the code behind it, with caching, stages
    and monitoring.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [Application Load Balancer, Amazon CloudFront]
  not_to_confuse: >-
    API Gateway manages an API (who may call, how often, which version); a load balancer only spreads
    requests across healthy targets, and CloudFront delivers and caches content.
  module: "07"

- term: Amazon Athena
  definition: >-
    A serverless AWS service that runs standard SQL directly on files in S3, such as CSV, JSON or
    Parquet, applying the table layout as it reads. You pay per query, by the data it scans.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  also_in: [guide/10-data-ai-and-more/04-lab-13-athena-query.md]
  confused_with: [Amazon Redshift, Amazon EMR, AWS Glue, Amazon OpenSearch Service]
  not_to_confuse: >-
    Athena queries files where they sit, with nothing to run; Redshift is a warehouse you load for
    repeated reports, EMR runs your own Spark or Hadoop code, Glue prepares data, and OpenSearch
    Service searches indexed text.
  module: "10"

- term: Amazon Aurora
  definition: >-
    AWS's own relational database engine, compatible with MySQL and PostgreSQL and managed through
    Amazon RDS. Storage grows automatically and is copied across several Availability Zones, its
    replicas can be the automatic failover target, and it has a serverless option.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/06-choosing-a-database.md]
  confused_with: [Amazon RDS]
  not_to_confuse: >-
    Aurora is AWS's MySQL- and PostgreSQL-compatible engine with more performance and availability
    built in; choose another RDS engine when software needs Oracle, SQL Server, Db2, MariaDB or
    plain MySQL or PostgreSQL.
  module: "05"

- term: Amazon Bedrock
  definition: >-
    An AWS service offering foundation models from Amazon and other AI companies through an API, for
    building generative AI applications without training a model. Amazon Q is built on it; it isn't
    on the exam's in-scope list.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon SageMaker AI]
  not_to_confuse: >-
    Bedrock gives you ready foundation models to build a generative AI app around; SageMaker AI is
    for building and training a model of your own.
  module: "10"

- term: Amazon CloudFront
  definition: >-
    AWS's content delivery network. A distribution serves cached copies from the edge location
    nearest each user, fetching from your origin over AWS's network when it has no fresh copy;
    origin access control lets it read a private bucket.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  also_in: [guide/03-aws-around-the-world/04-the-edge.md]
  confused_with: [Amazon Route 53, AWS Global Accelerator]
  not_to_confuse: >-
    CloudFront caches and delivers content; Route 53 only answers where a site is, and Global
    Accelerator carries traffic over AWS's network without caching.
  module: "07"

- term: Amazon CloudWatch
  definition: >-
    AWS's monitoring service for resources and applications: metrics, logs, alarms and dashboards.
    It answers how the workload is running and whether anything is wrong.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md, guide/09-protecting-and-governing/01-who-did-what.md]
  confused_with: [AWS CloudTrail, AWS Config, AWS X-Ray]
  not_to_confuse: >-
    CloudWatch measures how resources and code run and alerts on it; CloudTrail records who did what
    to the account, Config records how each resource was set, and X-Ray follows one request through
    every part.
  module: "08"

- term: Amazon Cognito
  definition: >-
    An AWS service that handles sign-up and sign-in for the customers of your web or mobile app,
    including with accounts such as Google, and can give app users temporary, limited AWS
    credentials.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  confused_with: [AWS IAM Identity Center]
  not_to_confuse: >-
    Cognito signs in your app's customers; IAM Identity Center signs in your own staff.
  module: "04"

- term: Amazon Comprehend
  definition: >-
    A ready-made AI service that reads text and describes it: its sentiment, the entities it
    mentions, key phrases, its language and any personal data. It doesn't change the text.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Textract, Amazon Rekognition, Amazon Translate]
  not_to_confuse: >-
    Comprehend finds meaning in text you already have; Textract pulls text and structure out of
    documents, Rekognition describes images and video, and Translate rewrites text in another
    language.
  module: "10"

- term: Amazon Connect Customer
  definition: >-
    AWS's cloud contact center, previously called Amazon Connect: phone numbers, queues, routing and
    flows, with agents answering by voice, chat and other channels, and no telephone hardware to
    buy.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  exam_name: Amazon Connect
  confused_with: [Amazon Lex]
  not_to_confuse: >-
    Connect Customer owns the phone line, flows, queues and agents; Lex builds the bot that
    understands what a caller wants, which a flow can hand callers to.
  module: "10"

- term: Amazon Data Firehose
  definition: >-
    An AWS service, formerly Amazon Kinesis Data Firehose, that delivers streaming data to a
    destination such as S3, Redshift or OpenSearch Service with no code or servers. It buffers data
    and can convert it on the way.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [Amazon Kinesis Data Streams, Amazon SQS]
  not_to_confuse: >-
    Firehose delivers streaming data to a store for you and keeps nothing for other readers; Data
    Streams holds records for your own programs to read and replay, and SQS queues jobs for workers.
  module: "10"

- term: Amazon Detective
  definition: >-
    A service for investigating a finding: it links CloudTrail events, VPC Flow Logs and GuardDuty
    findings in a behavior graph, so you can see a problem's root cause and how far it spread,
    without writing queries.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  confused_with: [Amazon GuardDuty]
  not_to_confuse: >-
    GuardDuty detects and raises the alarm; Detective starts from the alarm and investigates how it
    happened and what else was touched.
  module: "09"

- term: Amazon DocumentDB
  definition: >-
    AWS's managed document database, compatible with MongoDB's drivers and tools, for data that is
    naturally a document, such as a product catalog. Its full name is Amazon DocumentDB (with
    MongoDB compatibility).
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [Amazon DynamoDB]
  not_to_confuse: >-
    DocumentDB is the choice when the team uses MongoDB tools; DynamoDB also stores documents and
    needs no servers, but has no MongoDB compatibility.
  module: "05"

- term: Amazon DynamoDB
  definition: >-
    AWS's main NoSQL database: serverless, fully managed, key-value and document, with single-digit
    millisecond responses at any scale. You fetch items by key, with no joins or maintenance
    windows; data is copied across several Availability Zones by default.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/05-storing-data/08-lab-06-a-dynamodb-table.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [Amazon RDS, Amazon ElastiCache, Amazon DocumentDB]
  not_to_confuse: >-
    DynamoDB is a main store for items fetched by key, answering in milliseconds; RDS joins linked
    tables, ElastiCache is an in-memory cache answering in microseconds, and DocumentDB is for teams
    using MongoDB tools.
  module: "05"

- term: Amazon EBS
  definition: >-
    Amazon Elastic Block Store, AWS's block storage: volumes that attach to an EC2 instance in their
    Availability Zone like a local drive. Data is copied within that zone, persists when the
    instance stops, and is backed up with snapshots.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [instance store, Amazon EFS]
  not_to_confuse: >-
    An EBS volume persists apart from its instance and keeps its data through a stop, while instance
    store is erased by a stop; and an EBS volume serves one instance, while EFS is shared by many.
  module: "05"

- term: Amazon EC2
  definition: >-
    Amazon Elastic Compute Cloud, AWS's service for renting virtual servers, called instances, that
    start in minutes and are billed while running. You choose the image, instance type, storage,
    network and how you sign in, and run the operating system.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [AWS Elastic Beanstalk, Amazon Lightsail]
  not_to_confuse: >-
    On EC2 you build and run every part yourself; Elastic Beanstalk sets up EC2 and the parts around
    it from your code, and Lightsail sells a simple server at a fixed monthly price.
  module: "06"

- term: Amazon EC2 Auto Scaling
  definition: >-
    AWS's service for sizing EC2 instance groups to demand, between a minimum and maximum, replacing
    unhealthy instances and spreading them across Availability Zones. It gives EC2 elasticity at no
    extra charge; the exam guide lists AWS Auto Scaling instead.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [Elastic Load Balancing, AWS Auto Scaling]
  not_to_confuse: >-
    EC2 Auto Scaling changes how many instances run, while Elastic Load Balancing chooses which
    instance gets each request, and AWS Auto Scaling sets up scaling for several resource types at
    once.
  module: "06"

- term: Amazon ECR
  definition: >-
    Amazon Elastic Container Registry, AWS's store for container images, in private repositories
    controlled with IAM or in public ones. It can scan images for known flaws, but it runs nothing.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  confused_with: [Amazon ECS, AWS Fargate]
  not_to_confuse: >-
    ECR only stores images; ECS or EKS decides where containers run, and Fargate is the compute
    they run on.
  module: "06"

- term: Amazon ECS
  definition: >-
    Amazon Elastic Container Service, AWS's own container orchestrator. You describe your app in a
    task definition, and ECS starts tasks and keeps services running on EC2 instances or on AWS
    Fargate; ECS itself has no charge.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  confused_with: [Amazon EKS, AWS Fargate, Amazon ECR]
  not_to_confuse: >-
    ECS and EKS both orchestrate, ECS AWS's own way and EKS with Kubernetes; Fargate is compute
    they place containers on, and ECR stores the images.
  module: "06"

- term: Amazon EFS
  definition: >-
    Amazon Elastic File System, AWS's own Linux file system, shared over NFS by EC2 instances,
    containers, Lambda functions and on-premises servers. It grows and shrinks automatically;
    Regional file systems span several Availability Zones, One Zone ones use one.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [Amazon FSx, Amazon EBS]
  not_to_confuse: >-
    EFS is AWS's own NFS file system for Linux; FSx runs a familiar third-party file system, such as
    Windows File Server over SMB, and EBS is a disk for one server.
  module: "05"

- term: Amazon EKS
  definition: >-
    Amazon Elastic Kubernetes Service, which runs Kubernetes with a control plane AWS manages, on
    EC2 instances or on AWS Fargate. Choose it when your team already uses Kubernetes; it is charged
    per cluster per hour, plus the compute underneath.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  confused_with: [Amazon ECS, AWS Fargate]
  not_to_confuse: >-
    EKS orchestrates with Kubernetes and ECS orchestrates AWS's own way; Fargate is not an
    orchestrator but compute that either one can use.
  module: "06"

- term: Amazon Elastic VMware Service
  abbreviation: Amazon EVS
  definition: >-
    An AWS service that runs VMware's software on AWS infrastructure, so VMware workloads can be
    relocated without changing how they're run. It isn't on the exam's service list.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: Amazon ElastiCache
  definition: >-
    AWS's in-memory service: usually a cache answering repeated reads in microseconds in front of
    slower databases, and a store for short-lived data like sessions. It runs Valkey, Memcached or
    Redis OSS, serverless or on nodes you choose.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [Amazon DynamoDB, DynamoDB Accelerator]
  not_to_confuse: >-
    ElastiCache sits in front of a main store and answers from memory in microseconds; DynamoDB is a
    main store answering in milliseconds, and DAX is a cache for DynamoDB only.
  module: "05"

- term: Amazon EMR
  definition: >-
    A managed platform, formerly Amazon Elastic MapReduce, for running big-data frameworks such as
    Apache Spark and Hadoop with your own code on very large datasets, on clusters you configure or
    with EMR Serverless.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [Amazon Athena, Amazon Redshift]
  not_to_confuse: >-
    EMR runs your own big-data code on Spark or Hadoop with full control; Athena runs SQL on files
    in S3 with nothing to manage, and Redshift is a warehouse for repeated reports.
  module: "10"

- term: Amazon EventBridge
  definition: >-
    A service that receives events from AWS services, your own applications and SaaS partners, and
    sends each one to targets by rules on what it says. It can also run tasks on a schedule.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md]
  confused_with: [Amazon SNS]
  not_to_confuse: >-
    With SNS, your code publishes to a topic it chose and every subscriber hears it; with
    EventBridge, AWS services feed a bus on their own and rules route each event by its content.
  module: "08"

- term: Amazon FSx
  definition: >-
    A family of fully managed third-party file systems: FSx for Windows File Server (SMB shares
    joined to Active Directory), NetApp ONTAP, OpenZFS and Lustre. Pick the one you run today;
    applications move unchanged. Lustre is outside exam scope.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [Amazon EFS]
  not_to_confuse: >-
    FSx keeps a file system you already know, and FSx for Windows File Server is the answer for
    Windows shared folders; EFS is AWS's own NFS file system for Linux, which AWS doesn't support on
    Windows EC2 instances.
  module: "05"

- term: Amazon Glacier
  definition: >-
    The original, separate archive service that stores archives in vaults, with its own API. It is
    closed to new customers, and AWS recommends the S3 Glacier storage classes for new archives.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [S3 Glacier storage classes, backup vault]
  not_to_confuse: >-
    Amazon Glacier keeps archives in vaults and takes no new customers; the S3 Glacier storage
    classes keep objects in ordinary S3 buckets, and an AWS Backup vault is unrelated.
  module: "05"

- term: Amazon GuardDuty
  definition: >-
    A threat detection service that reads CloudTrail management events, VPC Flow Logs and DNS logs,
    with nothing else to set up, and raises findings on malicious or suspicious activity, such as
    stolen credentials. It blocks nothing.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [Amazon Inspector, Amazon Macie, Amazon Detective]
  not_to_confuse: >-
    GuardDuty reports attacks happening now, from activity; Inspector reports weaknesses in
    software, Macie reports sensitive data in S3, and Detective investigates a finding afterward.
  module: "09"

- term: Amazon Inspector
  definition: >-
    A vulnerability management service that finds EC2 instances, container images in Amazon ECR and
    Lambda functions on its own, and scans them continuously for known software flaws and unintended
    network exposure. It reports findings; it blocks nothing.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/07-connecting-it/02-filtering-traffic.md, guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  confused_with: [Amazon GuardDuty, security group, network ACL]
  not_to_confuse: >-
    Inspector reports what could be attacked and changes nothing; GuardDuty reports attacks actually
    happening, and security groups and network ACLs are the filters you fix.
  module: "09"

- term: Amazon Inspector Classic
  definition: >-
    The older version of Amazon Inspector, used through assessment templates, an Inspector agent and
    scheduled runs. It has been shut down (see the lesson); treat that way of working as out of
    date.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  confused_with: [Amazon Inspector]
  not_to_confuse: >-
    Inspector Classic needed templates, an agent and schedules and is gone; today's Inspector finds
    workloads and rescans them on its own whenever software or published flaws change.
  module: "09"

- term: Amazon Kendra
  definition: >-
    An intelligent search service over company documents, closed to new customers since 2026-07-30
    and removed from the 2026 exam guide. AWS points to Amazon Bedrock Knowledge Bases; treat Kendra
    as a distractor.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: Amazon Kinesis
  definition: >-
    A family of AWS services for data that arrives continuously, including Amazon Kinesis Data
    Streams, Amazon Data Firehose and Kinesis Video Streams. When a question says "Kinesis", work
    out which member it means.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: Amazon Kinesis Data Streams
  definition: >-
    A Kinesis service that holds streaming records for your own programs, called consumers, to read
    within seconds. Several consumers can read the same records, which stay after reading (24 hours
    by default, longer at extra cost), allowing replay.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  also_in: [guide/10-data-ai-and-more/03-people-apps-and-devices.md]
  confused_with: [Amazon Data Firehose, Amazon SQS]
  not_to_confuse: >-
    Data Streams keeps records for programs you write, which several can read and replay; Firehose
    delivers data to a store with no code, and SQS hands each message to one worker, which deletes
    it.
  module: "10"

- term: Amazon Lex
  definition: >-
    An AWS service for building bots that hold a conversation in text or by voice: a bot works out
    the customer's intent, asks for missing slots and replies. The current version is Lex V2.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  also_in: [guide/10-data-ai-and-more/03-people-apps-and-devices.md]
  confused_with: [Amazon Polly, Amazon Connect Customer]
  not_to_confuse: >-
    Lex builds the bot that understands a request; Polly only turns text into speech, and Connect
    Customer runs the contact center (phone numbers, queues, agents) that a Lex bot can work inside.
  module: "10"

- term: Amazon Lightsail
  definition: >-
    AWS's simplest way to put a website or small app online: one monthly price bundling a virtual
    server, storage, static IP address and data transfer allowance, often started from a ready-made
    image. Instances are billed even when stopped.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  confused_with: [Amazon EC2, AWS Elastic Beanstalk]
  not_to_confuse: >-
    Lightsail sells a simple server at a predictable price; EC2 bills each part separately with
    every choice open, and Elastic Beanstalk builds a scaling setup from your code.
  module: "06"

- term: Amazon Machine Image
  abbreviation: AMI
  definition: >-
    The template an EC2 instance starts from: an operating system plus any software already
    installed. Every instance started from one AMI is identical, which is how Auto Scaling adds
    servers that are ready at once.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md, guide/06-running-applications/02-auto-scaling-and-load-balancers.md]
  confused_with: [instance type]
  not_to_confuse: >-
    The AMI decides what software runs on an instance; the instance type decides how much hardware
    it gets.
  module: "06"

- term: Amazon Macie
  definition: >-
    A service that inventories your S3 buckets and uses machine learning and pattern matching to
    find sensitive data, such as personally identifiable information, inside objects. It also flags
    risky bucket settings, such as public access.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md, guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  confused_with: [Amazon GuardDuty, Amazon Inspector]
  not_to_confuse: >-
    Macie asks what is inside your S3 data; GuardDuty asks whether activity looks malicious, and
    Inspector asks whether your software has known flaws.
  module: "09"

- term: Amazon Neptune
  definition: >-
    AWS's managed graph database, for data where the connections matter most, such as recommendation
    engines, fraud detection and knowledge graphs.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [Amazon RDS, Amazon DocumentDB]
  not_to_confuse: >-
    Neptune is built to follow relationships many links deep; a relational database can store the
    links but such queries grow complex and slow, and DocumentDB keeps self-contained documents.
  module: "05"

- term: Amazon OpenSearch Service
  definition: >-
    A managed AWS service, successor to Amazon Elasticsearch Service, that runs the OpenSearch
    search and analytics engine for log analytics, application monitoring and website search. It
    indexes every word, so searches return at once.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [Amazon Athena]
  not_to_confuse: >-
    OpenSearch Service finds words and patterns in text it has already indexed; Athena reads files
    to answer a SQL question.
  module: "10"

- term: Amazon Polly
  definition: >-
    A ready-made AI service that turns text into lifelike speech in many languages and voices,
    billed by the character. You can store the audio and replay it at no extra charge.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  also_in: [guide/10-data-ai-and-more/05-lab-14-polly-text-to-speech.md]
  confused_with: [Amazon Transcribe, Amazon Lex]
  not_to_confuse: >-
    Polly only speaks, text in and audio out; Transcribe does the opposite, and Lex holds a whole
    conversation, working out what a person wants.
  module: "10"

- term: Amazon Q
  definition: >-
    A brand for AWS's generative AI assistants, not one product: Amazon Q Developer, Amazon Q
    Business (closed to new customers) and Q features inside other services. The exam guide lists
    just "Amazon Q".
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: Amazon Q Business
  definition: >-
    A generative AI assistant that answered employees' questions from their company's own documents
    and systems. It is closed to new customers, and AWS points them to Amazon Quick.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Q Developer]
  not_to_confuse: >-
    Q Business worked over company documents and is closed to new customers; Q Developer helps
    people build and run on AWS, and is still available in the console.
  module: "10"

- term: Amazon Q Developer
  definition: >-
    AWS's generative AI assistant for people who build and run on AWS: it answers questions about
    AWS and your resources, and explains and writes code. Its code-editor plugins and paid
    subscriptions end on 2027-04-30.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Q Business]
  not_to_confuse: >-
    Q Developer helps people build and run on AWS, in the console and in code; Q Business answered
    staff questions from company documents and is closed to new customers.
  module: "10"

- term: Amazon Quick
  definition: >-
    A wider AWS product that grew out of Amazon QuickSight. It contains Quick Sight for dashboards
    along with AI agents, automation and research tools, and AWS points would-be Amazon Q Business
    customers to it.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  also_in: [guide/10-data-ai-and-more/02-ai-and-ml.md]
  confused_with: [Amazon Quick Sight]
  not_to_confuse: >-
    Amazon Quick is the whole product; Quick Sight is its business intelligence part, the dashboards
    the exam asks about.
  module: "10"

- term: Amazon Quick Sight
  definition: >-
    AWS's business intelligence service, formerly Amazon QuickSight: it connects to sources such as
    Athena, Redshift or uploaded files and builds interactive dashboards for business users. It is
    now part of Amazon Quick.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [Amazon Athena, Amazon Quick]
  not_to_confuse: >-
    Quick Sight shows results as dashboards for people in the business; Athena runs the query
    underneath, and Amazon Quick is the wider product that now contains Quick Sight.
  module: "10"

- term: Amazon RDS
  definition: >-
    Amazon Relational Database Service: managed relational databases. AWS installs and patches the
    operating system and engine, handles backups and failover; you choose settings, control access
    and tune queries. AWS recommends it for most relational databases, with several engines plus
    Aurora.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/06-choosing-a-database.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [Amazon Aurora, Amazon DynamoDB, Amazon Redshift]
  not_to_confuse: >-
    RDS runs familiar relational engines for transactional work; Aurora is AWS's own engine in the
    RDS family, DynamoDB is serverless NoSQL fetched by key, and Redshift is a data warehouse for
    analysis.
  module: "05"

- term: Amazon Redshift
  definition: >-
    AWS's fully managed data warehouse, running SQL analysis over very large amounts of data from
    many sources, on clusters you size or serverless. The exam guide lists it under analytics; it
    isn't the database that runs a website.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/10-data-ai-and-more/01-analytics-in-five-verbs.md]
  confused_with: [Amazon RDS, read replica, Amazon Athena]
  not_to_confuse: >-
    Redshift studies the business with large queries over data loaded into it; RDS and Aurora run
    the business, a read replica suits smaller reports, and Athena queries files in S3 where they
    sit.
  module: "05"

- term: Amazon Rekognition
  definition: >-
    A ready-made AI service that analyzes images and video: it finds objects, scenes and text, flags
    unsafe content, and analyzes and compares faces.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Textract, Amazon Comprehend]
  not_to_confuse: >-
    Rekognition describes what a picture shows; Textract reads documents and returns their
    structure, such as a receipt's total, and Comprehend analyzes text you already have.
  module: "10"

- term: Amazon Resource Name
  abbreviation: ARN
  definition: >-
    The unique name of a resource in AWS, used in policies to say which resource a statement covers.
    A bucket's ARN, for example, is arn:aws:s3::: followed by the bucket name.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md]
  module: "04"

- term: Amazon Route 53
  definition: >-
    AWS's DNS service. It registers domain names, answers DNS questions using routing policies such
    as latency or failover, and checks the health of sites so it can send users away from one that
    fails; it never carries your content.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  also_in: [guide/03-aws-around-the-world/04-the-edge.md]
  confused_with: [Amazon CloudFront, load balancer]
  not_to_confuse: >-
    Route 53 only tells users where to go, while CloudFront delivers the content and a load balancer
    sits in the path of every request to spread it across servers in one Region.
  module: "07"

- term: Amazon S3
  definition: >-
    Amazon Simple Storage Service, AWS's object storage: it keeps files, which it calls objects, in
    containers called buckets, reached through a web API, with no capacity to plan. AWS runs it
    across several Availability Zones for you.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/02-why-the-cloud/06-lab-01-first-resource.md, guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md, guide/05-storing-data/02-s3-in-practice.md, guide/05-storing-data/03-storage-classes-and-lifecycle.md]
  module: "05"

- term: Amazon SageMaker AI
  definition: >-
    A fully managed service, formerly Amazon SageMaker, for building, training and deploying your
    own machine learning models. AWS runs the servers; the data, the model and the skills are yours.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [ready-made AI service, Amazon Bedrock]
  not_to_confuse: >-
    SageMaker AI is for training your own model when nothing fits; a ready-made service already has
    AWS's trained model, and Bedrock offers foundation models to build on without training.
  module: "10"

- term: Amazon SES
  definition: >-
    Amazon Simple Email Service: an email platform that sends and receives email using your own
    verified addresses and domains, for order confirmations, newsletters and other mail to
    customers.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/10-data-ai-and-more/03-people-apps-and-devices.md]
  confused_with: [Amazon SNS]
  not_to_confuse: >-
    SES sends mail you design from your own domain to customers; an SNS email subscription sends
    plain-text alerts from an AWS address to people who subscribed and confirmed.
  module: "08"

- term: Amazon SNS
  definition: >-
    Amazon Simple Notification Service: it pushes each message published to a topic to every
    subscriber at once, such as email addresses, phone numbers, SQS queues and Lambda functions.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in:
    - guide/08-building-and-operating/03-watching-workloads.md
    - guide/08-building-and-operating/06-lab-11-alarm-on-errors.md
  confused_with: [Amazon SQS, Amazon EventBridge, Amazon SES]
  not_to_confuse: >-
    SNS pushes each message at once to every subscriber; SQS holds it until one worker pulls it,
    EventBridge routes events by rules on their content, and SES sends your own mail to customers.
  module: "08"

- term: Amazon SQS
  definition: >-
    Amazon Simple Queue Service: a managed queue. Producers send messages, which wait until a
    consumer asks for them, processes them and deletes them; each message goes to one consumer.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/10-data-ai-and-more/01-analytics-in-five-verbs.md]
  confused_with: [Amazon SNS, Amazon Kinesis Data Streams, Amazon Data Firehose]
  not_to_confuse: >-
    SQS holds each message until one consumer pulls and deletes it; SNS pushes it to every
    subscriber at once, Kinesis Data Streams keeps records for several programs to replay, and
    Firehose delivers data to a store.
  module: "08"

- term: Amazon Textract
  definition: >-
    A ready-made AI service that reads documents: typed and handwritten text, form fields and
    tables. It also pulls the vendor, total and line items from receipts and invoices, and reads
    identity documents.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Rekognition, Amazon Comprehend]
  not_to_confuse: >-
    Textract returns a document's text and structure; Rekognition describes scenes and objects in
    pictures, and Comprehend finds meaning in text, such as Textract's output.
  module: "10"

- term: Amazon Transcribe
  definition: >-
    A ready-made AI service that turns speech into text, from a recording in S3 or live audio. It
    can label who is speaking and remove personal data from transcripts.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Polly, Amazon Translate]
  not_to_confuse: >-
    Transcribe writes down speech; Polly turns text into speech, and Translate changes the language
    of text it is given.
  module: "10"

- term: Amazon Translate
  definition: >-
    A ready-made AI service that turns text in one language into another, using neural machine
    translation, in real time or in batches.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon Comprehend, Amazon Transcribe]
  not_to_confuse: >-
    Translate rewrites text in another language; Comprehend can only tell you which language a text
    is in, and Transcribe turns speech into text.
  module: "10"

- term: Amazon VPC
  definition: >-
    Amazon Virtual Private Cloud: your account's own virtual network in one Region, isolated from
    everyone else's. You choose its address range, subnets, route tables and gateways; the VPC
    itself costs nothing, though some parts and data transfer do.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  module: "07"

- term: Amazon Web Services
  abbreviation: AWS
  definition: >-
    The company that rents computing power, storage and many other IT services over the internet:
    the cloud provider this guide is about.
  taught_in: guide/00-start-here/01-welcome.md
  also_in: [guide/02-why-the-cloud/01-what-cloud-computing-is.md]
  module: "00"

- term: Amazon WorkSpaces
  definition: >-
    An AWS service that gives each user a virtual desktop, running Windows or Linux in AWS, streamed
    to their own device as pixels. It bills monthly, or hourly with AutoStop, which suits part-time
    staff.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [Amazon WorkSpaces Applications, Amazon WorkSpaces Secure Browser, AWS Client VPN]
  not_to_confuse: >-
    WorkSpaces gives a whole desktop; WorkSpaces Applications streams one or a few apps, Secure
    Browser only a web browser, and Client VPN gives a device a network path but no computer.
  module: "10"

- term: Amazon WorkSpaces Applications
  definition: >-
    The AWS service formerly called Amazon AppStream 2.0: it streams individual desktop applications
    from AWS to a user's browser or client, so many people can use the same program without a
    desktop each.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  exam_name: Amazon AppStream 2.0
  confused_with: [Amazon WorkSpaces, Amazon WorkSpaces Secure Browser]
  not_to_confuse: >-
    WorkSpaces Applications streams chosen programs; WorkSpaces gives each person a whole desktop,
    and Secure Browser gives only a web browser for web apps.
  module: "10"

- term: Amazon WorkSpaces Secure Browser
  definition: >-
    An AWS service, formerly WorkSpaces Web, that gives users an isolated web browser that runs in
    AWS, streamed to their own browser, for internal websites and SaaS apps. It is closed to new
    customers from 2026-10-29.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [Amazon WorkSpaces, Amazon WorkSpaces Applications]
  not_to_confuse: >-
    Secure Browser gives only a web browser, for web apps; WorkSpaces Applications streams desktop
    programs, and WorkSpaces gives a whole desktop.
  module: "10"

- term: analytics workload
  definition: >-
    Work that studies the business: fewer, much larger queries over large amounts of data, such as
    total sales by month over years. A data warehouse such as Amazon Redshift is built for it.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [transactional workload]
  not_to_confuse: >-
    Analytics work reads large amounts of data in each query; transactional work makes many small
    changes, and running heavy analytics on the transactional database slows the business down.
  module: "05"

- term: anycast
  definition: >-
    Announcing the same address from many places, so each user reaches the nearest one. AWS Global
    Accelerator announces its addresses this way from AWS's edge locations.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: API
  definition: >-
    Application programming interface: a defined set of requests one program can send another, and
    the responses it returns. Every AWS service has one, which the console, the AWS CLI and programs
    all use.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  also_in:
    - guide/07-connecting-it/03-names-and-the-edge.md
    - guide/08-building-and-operating/01-four-ways-in.md
  module: "01"

- term: API key
  definition: >-
    In API Gateway, a key given to each outside developer so their calls can be counted against
    their usage plan.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: application
  definition: >-
    A program that does a job for people, such as a website or a spreadsheet. Applications run on
    the operating system, which uses the hardware for them.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [operating system]
  not_to_confuse: >-
    An application does a job for people, such as pricing an order; the operating system runs the
    computer and shares its hardware between applications.
  module: "01"

- term: application layer attack
  definition: >-
    An attack made of normal-looking web requests, such as thousands of requests a second for the
    order page, an HTTP flood. AWS calls it a layer 7 attack.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  confused_with: [network layer attack]
  not_to_confuse: >-
    An application layer attack sends normal-looking web requests that only WAF can read and limit;
    a network layer attack floods raw traffic, which Shield Standard absorbs.
  module: "09"

- term: Application Load Balancer
  abbreviation: ALB
  definition: >-
    The Elastic Load Balancing type for web requests (HTTP, HTTPS and gRPC). It can route by the page
    address, such as /orders or /photos, and can send requests to Lambda functions.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  confused_with: [Network Load Balancer, Gateway Load Balancer]
  not_to_confuse: >-
    Choose an ALB for web traffic, a Network Load Balancer for TCP or UDP connections at very high
    speed or with a fixed IP address, and a Gateway Load Balancer for traffic through appliances.
  module: "06"

- term: application portfolio
  definition: >-
    All the applications an organization runs, with the facts that decide what to do with each. The
    7 Rs are applied to it one application at a time.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: application streaming
  definition: >-
    Running a desktop application in AWS and sending only its picture to the user's browser or
    client, so nothing is installed on the device. Amazon WorkSpaces Applications (AppStream 2.0)
    does this.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: archive
  definition: >-
    Data kept cheaply and safely after you stop using it, in case it's needed. Retiring an
    application often means archiving its data first.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  confused_with: [backup]
  not_to_confuse: >-
    An archive keeps data you no longer use; a backup exists to restore a system that is still in
    use.
  module: "13"

- term: argument
  definition: >-
    A value a command works on, such as the new bucket's name in aws s3 mb
    s3://example-bakery-photos.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [option]
  not_to_confuse: >-
    An argument is the value the command acts on; an option is a setting written as a name with two
    dashes and then its value.
  module: "01"

- term: array
  definition: >-
    In JSON, a list of values in order inside square brackets, such as the actions in a policy
    statement. Its items can be any value, even objects.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [JSON object]
  not_to_confuse: >-
    An array, in square brackets, is a list of values in order; an object, in curly braces, holds
    named values.
  module: "01"

- term: Artifact agreement
  definition: >-
    A contract with AWS that you review, accept, track and end in AWS Artifact, for one account or a
    whole organization, such as the Business Associate Addendum.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  confused_with: [Artifact report]
  not_to_confuse: >-
    An Artifact agreement is a contract you accept, which can change your account's plan; an
    Artifact report is AWS's audit evidence, which you only download.
  module: "09"

- term: Artifact report
  definition: >-
    A security or compliance document about AWS in AWS Artifact, such as a SOC report or an ISO
    certificate from an independent auditor. Some are confidential, so you accept terms before
    downloading.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [Artifact agreement]
  not_to_confuse: >-
    An Artifact report is AWS's evidence, which you download and hand to an auditor; an Artifact
    agreement is a contract with AWS that you accept and keep to.
  module: "09"

- term: artificial intelligence
  abbreviation: AI
  definition: >-
    Computer systems doing tasks that once needed a person, such as understanding speech or reading
    a page. Machine learning is the most common way to build it today.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [machine learning]
  not_to_confuse: >-
    AI is the goal, computers doing tasks that needed a person; machine learning is one way to get
    there, by learning patterns from many examples.
  module: "10"

- term: assume a role
  definition: >-
    To take on a role's permissions for a session, receiving temporary credentials. The role's trust
    policy says who may do it.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  module: "04"

- term: asynchronous
  definition: >-
    Describes handing work over and moving on without waiting; the answer, if any, comes later. A
    queue, topic or event bus between two parts makes this possible.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [synchronous]
  not_to_confuse: >-
    In an asynchronous call the caller hands the work over and moves on; in a synchronous one it
    waits for the answer and fails if the other side fails.
  module: "08"

- term: asynchronous replication
  definition: >-
    Sending each change to a copy just after it is written to the primary, so the copy can fall
    behind. Read replicas are kept this way.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [synchronous replication]
  not_to_confuse: >-
    Asynchronous replication lets the copy lag, so the latest changes can be lost in a failure;
    synchronous replication keeps it in step.
  module: "05"

- term: attachment (Transit Gateway)
  definition: >-
    One network's connection to a transit gateway, such as a VPC or a VPN connection, each attached
    once. Each attachment bills by the hour.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: attestation
  definition: >-
    An independent auditor's written finding that controls exist and work, such as a SOC 2 report.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: attribute
  definition: >-
    One named value in a DynamoDB item, such as Quantity or GiftNote, with a type such as String or
    Number. Items in one table needn't have the same attributes.
  taught_in: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
  confused_with: [item]
  not_to_confuse: >-
    An attribute is one named value; an item is the whole record that holds its attributes.
  module: "05"

- term: audit
  definition: >-
    An independent check that controls exist and work, done by an auditor. AWS makes its auditors'
    reports available to customers.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md, guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/05-compliance-and-governance.md]
  confused_with: [compliance]
  not_to_confuse: >-
    An audit is the check; compliance is meeting the rules the check looks for.
  module: "04"

- term: authentication
  definition: >-
    Proving who you are, for example by signing in.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  confused_with: [authorization]
  not_to_confuse: >-
    Authentication asks who you are; authorization asks, on every request, whether that identity may
    do that action.
  module: "04"

- term: authenticator app
  definition: >-
    A phone app that shows a six-digit code that keeps changing, used as a second factor. AWS ranks
    it after passkeys and security keys, because its codes can be typed into a fake page.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  confused_with: [passkey]
  not_to_confuse: >-
    An authenticator app's code can be typed into a fake sign-in page and used at once; a passkey is
    tied to the real site, so a fake page gets nothing.
  module: "01"

- term: authorization
  definition: >-
    AWS checking, on every request, whether your identity may do that one action on that one
    resource. If AWS knows who you are and still says no, authorization is what failed.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  confused_with: [authentication]
  not_to_confuse: >-
    Authorization decides what an identity may do, request by request; authentication only proves
    who it is.
  module: "04"

- term: auto scaling
  definition: >-
    A feature that watches demand and adds or removes servers by rules you set; the usual way AWS
    delivers elasticity. The exam guide lists AWS Auto Scaling, but the service that adds and
    removes servers is Amazon EC2 Auto Scaling.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  also_in: [guide/06-running-applications/02-auto-scaling-and-load-balancers.md]
  confused_with: [load balancer]
  not_to_confuse: >-
    Auto scaling changes how many servers there are; a load balancer spreads requests across the
    servers there are.
  module: "02"

- term: Auto Scaling group
  definition: >-
    A set of identical EC2 instances that Amazon EC2 Auto Scaling manages as one unit, between a
    minimum and a maximum capacity, launched from a launch template and spread across the
    Availability Zones you choose.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  module: "06"

- term: automated backup
  definition: >-
    Amazon RDS's daily snapshot plus a log of every change, for restoring to any second within the
    retention period you set. They're deleted with the database unless you retain them; every
    restore creates a new database.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/05-storing-data/05-managed-or-self-managed-databases.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [snapshot, Multi-AZ deployment]
  not_to_confuse: >-
    Automated backups go with a deleted database unless retained, and then last only until retention
    ends, while a manual snapshot stays until you delete it; unlike a Multi-AZ standby, a backup can
    undo a mistaken delete.
  module: "05"

- term: automation
  definition: >-
    Having software do a repeated task, such as building, starting or stopping servers, instead of a
    person doing it by hand. It cuts mistakes and staff time, keeps copies consistent, and stops
    forgotten resources billing.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in: [guide/02-why-the-cloud/04-what-a-data-center-really-costs.md]
  module: "08"

- term: AutoStop
  definition: >-
    An Amazon WorkSpaces setting for hourly billing that stops a desktop after the user disconnects,
    so hourly charges pause; the monthly part of the fee still applies.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: Availability Zone
  abbreviation: AZ
  definition: >-
    One or more data centers inside a Region, with their own power, networking and connections, kept
    physically apart from the other Availability Zones so they fail separately.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/02-why-the-cloud/03-telling-the-benefits-apart.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [Region, data center, edge location]
  not_to_confuse: >-
    An Availability Zone is inside a Region and holds one or more data centers; an edge location is
    a separate, smaller site outside the Regions that delivers content close to users.
  module: "03"

- term: awareness and training
  definition: >-
    Teaching people to work securely. A shared control: AWS trains its own employees, and you must
    train yours.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  module: "04"

- term: AWS Amplify
  definition: >-
    AWS tools and services for building, connecting and hosting web and mobile apps. Amplify Hosting
    builds and deploys every change committed to a Git repository; its libraries add back ends such
    as sign-in and data.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [AWS Elastic Beanstalk, Amazon Lightsail]
  not_to_confuse: >-
    Amplify serves front-end and mobile developers, hosting sites deployed from Git; Elastic
    Beanstalk runs server-side applications on EC2 instances, and Lightsail rents a simple server at
    a fixed price.
  module: "10"

- term: AWS Application Discovery Service
  definition: >-
    An AWS service that collects data about on-premises servers and databases, their use and the
    connections between them, to group them into applications. It is closed to new customers, and
    AWS points to AWS Transform.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  confused_with: [AWS Migration Hub]
  not_to_confuse: >-
    Discovery Service collects inventory, use and dependencies; Migration Hub only tracks each
    application's migration status, and neither moves anything.
  module: "13"

- term: AWS Artifact
  definition: >-
    A free, self-service portal in the console for AWS's own compliance documents and for agreements
    with AWS. Its reports are about AWS's controls; they don't show whether you are compliant.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  module: "09"

- term: AWS Audit Manager
  definition: >-
    A service that gathered evidence about your resources against frameworks such as PCI DSS. It can
    no longer be set up in new accounts (see the lesson), and AWS points to Config conformance
    packs; treat it as a wrong answer.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md, guide/09-protecting-and-governing/05-compliance-and-governance.md, guide/09-protecting-and-governing/09-sim-config-timeline.md]
  confused_with: [conformance pack]
  not_to_confuse: >-
    Audit Manager can't be set up in new accounts; conformance packs in AWS Config are AWS's pointer
    for checks against a framework, and no service makes you compliant on its own.
  module: "09"

- term: AWS Auto Scaling
  definition: >-
    The service the exam guide lists for auto scaling: it sets up scaling for several kinds of
    resource at once, such as groups of EC2 instances and DynamoDB tables. Groups of EC2 instances
    are run by Amazon EC2 Auto Scaling.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  confused_with: [Amazon EC2 Auto Scaling]
  not_to_confuse: >-
    AWS Auto Scaling coordinates scaling across several resource types; Amazon EC2 Auto Scaling
    runs the groups of instances, and either name answers "auto scaling provides elasticity".
  module: "06"

- term: AWS Backup
  definition: >-
    A service backing up many AWS services, and some on-premises systems, across accounts from one
    backup plan. It copies backups across Regions or accounts, keeps them encrypted in backup vaults
    lockable with Vault Lock, and reports that backups happen.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/05-storing-data/02-s3-in-practice.md, guide/05-storing-data/05-managed-or-self-managed-databases.md]
  confused_with: [AWS Elastic Disaster Recovery, snapshot, Tape Gateway]
  not_to_confuse: >-
    AWS Backup brings back data from recovery points under one set of rules; Elastic Disaster
    Recovery brings back whole running servers in minutes, a snapshot covers one resource, and Tape
    Gateway serves existing tape backup software.
  module: "05"

- term: AWS Batch
  definition: >-
    A service that runs many batch jobs, each packaged as a container, from a job queue. It launches
    EC2 or Fargate compute while jobs wait and removes it when the queue is empty, with no extra
    charge beyond that compute.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  confused_with: [AWS Lambda]
  not_to_confuse: >-
    Batch runs queued jobs of any length on containers; Lambda runs short functions started by
    events.
  module: "06"

- term: AWS blogs
  definition: >-
    AWS's dated posts by topic, such as the AWS News Blog for announcements and the AWS Security
    Blog for security walk-throughs. A post describes the world on the day it was written.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  module: "12"

- term: AWS Budgets
  definition: >-
    An AWS service that tracks cost or usage against a target you set and alerts by email or SNS
    when actual or forecasted cost crosses a threshold. It stops nothing unless you add a budget
    action.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/08-sim-guardrail-timeline.md]
  confused_with: [AWS Cost and Usage Report, AWS Cost Explorer, AWS Pricing Calculator]
  not_to_confuse: >-
    Budgets alerts when spending passes a limit you set; the Pricing Calculator estimates before you
    build, Cost Explorer shows where money went and forecasts, and the CUR delivers every line item.
  module: "11"

- term: AWS Business Support+
  definition: >-
    The first paid Support plan, and AWS's recommended minimum for production: technical cases
    around the clock by phone, web and chat, all Trusted Advisor checks, and the AWS Health API. It
    is charged per account.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [Basic Support, AWS Enterprise Support, Business Support, Developer Support]
  not_to_confuse: >-
    Business Support+ adds 24/7 technical cases to Basic but no named TAM, which starts with
    Enterprise Support; it replaces the retiring Developer and Business Support plans.
  module: "12"

- term: AWS Certificate Manager
  abbreviation: ACM
  definition: >-
    An AWS service that creates, stores and renews public and private TLS certificates for services
    such as Elastic Load Balancing, CloudFront and API Gateway, so a certificate doesn't expire
    unnoticed and take a site down.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Key Management Service]
  not_to_confuse: >-
    ACM manages TLS certificates, which protect data in transit; AWS KMS manages encryption keys,
    mostly for data at rest.
  module: "09"

- term: AWS CLI
  definition: >-
    The AWS Command Line Interface: a free, open-source program that sends instructions to AWS as
    typed commands. Saved in a script, commands suit quick, bulk and routine tasks.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  also_in:
    - guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    - guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [AWS CloudShell]
  not_to_confuse: >-
    The AWS CLI is the program that sends the commands; CloudShell is a command line in the browser,
    already signed in, where the CLI comes installed.
  module: "08"

- term: AWS Client VPN
  definition: >-
    One of the AWS VPN services: a managed service that lets individual people connect their own
    devices, encrypted over the internet, to a VPC, after signing in and subject to authorization
    rules.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [AWS Site-to-Site VPN]
  not_to_confuse: >-
    Client VPN connects one person's device, each connecting for themselves; Site-to-Site VPN joins a
    whole network through its router.
  module: "07"

- term: AWS Cloud Adoption Framework
  abbreviation: AWS CAF
  definition: >-
    AWS's guidance for changing a whole organization to use the cloud well: four business outcomes,
    four transformation domains, six perspectives of capabilities and four repeated phases. It's
    advice, not a service.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [7 Rs]
  not_to_confuse: >-
    The CAF works on the whole organization's readiness and outcomes; the 7 Rs decide what happens
    to one application, and are used inside the CAF's portfolio management.
  module: "13"

- term: AWS CloudFormation
  definition: >-
    AWS's infrastructure as code service. It reads a template, works out the order, and builds the
    resources as a stack, which it can update with a preview and delete in one step.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in:
    - guide/08-building-and-operating/01-four-ways-in.md
    - guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
  confused_with: [AWS Service Catalog, AWS Elastic Beanstalk]
  not_to_confuse: >-
    CloudFormation builds whatever a template describes; Service Catalog decides who may launch
    which approved templates, and Elastic Beanstalk builds the setup for your application code
    without a template of your own.
  module: "08"

- term: AWS CloudHSM
  definition: >-
    An AWS service that gives you single-tenant hardware security modules in a cluster in your own
    VPC. AWS maintains the hardware; you create the users and keys inside them, outside IAM, and
    carry more of the work.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [AWS Key Management Service]
  not_to_confuse: >-
    Choose CloudHSM only when a rule requires single-tenant HSMs under your exclusive control;
    otherwise AWS KMS, which also runs on validated HSMs, is the default.
  module: "09"

- term: AWS CloudShell
  definition: >-
    A command line that opens in the browser from the console, already signed in with your console
    credentials, with the AWS CLI installed. The guide's labs use it, but it's outside the CLF-C02
    exam's scope.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  also_in:
    - guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    - guide/08-building-and-operating/06-lab-11-alarm-on-errors.md
    - guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [AWS CLI]
  not_to_confuse: >-
    CloudShell is a place to run commands, in the browser and already signed in; the AWS CLI is the
    program that sends them, and it also runs on your own computer.
  module: "08"

- term: AWS CloudTrail
  definition: >-
    The AWS service that records each action taken on your account, by a person, a role or an AWS
    service, through any way in, as an event: who acted, what they did, when and from where.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/02-why-the-cloud/06-lab-01-first-resource.md, guide/08-building-and-operating/01-four-ways-in.md, guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [Amazon CloudWatch, AWS Config, AWS X-Ray]
  not_to_confuse: >-
    CloudTrail records who did what to the account; CloudWatch measures how resources and code are
    running, AWS Config records how each resource was set, and X-Ray follows single requests through
    an application.
  module: "08"

- term: AWS CodeBuild
  definition: >-
    A fully managed build service: it compiles source code, runs tests and produces packages ready
    to deploy, with no build servers to set up or manage. You pay for build minutes.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [AWS CodePipeline]
  not_to_confuse: >-
    CodeBuild does one job, building and testing code; CodePipeline runs the whole release as stages
    in order, calling CodeBuild for the build and test stages.
  module: "08"

- term: AWS CodePipeline
  definition: >-
    A continuous delivery service that models a release as a pipeline of stages, such as source,
    build, test, approval and deploy, and runs each change through them in order.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [AWS CodeBuild]
  not_to_confuse: >-
    CodePipeline runs the whole release as stages in order; CodeBuild does the building and testing
    inside some of those stages.
  module: "08"

- term: AWS Compute Optimizer
  definition: >-
    An AWS service that, once you opt in, analyzes resources' configuration and CloudWatch metrics
    and reports each as optimized, over-provisioned, under-provisioned or idle, with better sizes.
    It recommends; you make changes.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md]
  confused_with: [AWS Trusted Advisor, Amazon EC2 Auto Scaling]
  not_to_confuse: >-
    Compute Optimizer gives deep, metric-based advice on each resource's size; Trusted Advisor runs
    broad checks in several categories, and Auto Scaling changes how many instances run.
  module: "13"

- term: AWS Config
  definition: >-
    An AWS service that keeps an inventory of your resources and a history of each one's settings,
    and checks them against rules you choose. Recording is off until you turn it on, and it charges
    per item recorded.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/09-sim-config-timeline.md, guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md]
  confused_with: [AWS CloudTrail, Amazon CloudWatch]
  not_to_confuse: >-
    Config records how each resource was set and whether that follows your rules; CloudTrail records
    who did what, and CloudWatch measures how things are running.
  module: "09"

- term: AWS Control Tower
  definition: >-
    A service built on AWS Organizations, Service Catalog and IAM Identity Center that sets up a
    best-practice multi-account landing zone and keeps it governed with controls, Account Factory
    and a dashboard.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Organizations]
  not_to_confuse: >-
    Control Tower sets up and watches a governed multi-account environment for you; AWS
    Organizations, which it is built on, gives you accounts, OUs, SCPs and one bill to design
    yourself.
  module: "09"

- term: AWS Cost and Usage Report
  abbreviation: CUR
  definition: >-
    AWS's most detailed cost and usage data: every line item, by hour, day or month, optionally with
    resource IDs and tag columns, delivered as files to your S3 bucket. It's now created through AWS
    Data Exports.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/04-many-accounts-one-bill.md]
  confused_with: [AWS Budgets, AWS Cost Explorer, AWS Pricing Calculator]
  not_to_confuse: >-
    The CUR delivers every raw line item as files to query yourself; Cost Explorer charts and
    forecasts, Budgets alerts on a limit, and the Pricing Calculator estimates before you build.
  module: "11"

- term: AWS Cost Anomaly Detection
  definition: >-
    A free AWS service that learns your normal spending pattern with machine learning and alerts
    when spending departs from it, naming likely root causes. Like Budgets, it never stops anything.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/08-sim-guardrail-timeline.md]
  confused_with: [AWS Budgets]
  not_to_confuse: >-
    Anomaly detection compares spending with what is normal for you, so it catches a small new cost
    early; a budget compares it with a limit you chose, so it catches slow growth.
  module: "11"

- term: AWS Cost Explorer
  definition: >-
    An AWS tool that charts your costs and usage, filtered and grouped by service, account, Region,
    tag and more, forecasts future spending, and recommends Savings Plans and Reserved Instances.
    History and forecast lengths are in the lesson.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in:
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
    - guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md
  confused_with: [AWS Budgets, AWS Cost and Usage Report, AWS Pricing Calculator]
  not_to_confuse: >-
    Cost Explorer shows where money went and where it's heading; the Pricing Calculator estimates
    before you build, Budgets alerts on a limit, and the CUR delivers raw line items as files.
  module: "11"

- term: AWS Customer Incident Response Team
  abbreviation: AWS CIRT
  definition: >-
    AWS's incident responders, who help when someone has broken into your account, at no extra
    charge on any Support plan. You reach them with a support case from that account, marked as an
    urgent security incident.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  confused_with: [AWS Security Incident Response]
  not_to_confuse: >-
    The AWS CIRT helps any customer with a break-in, through a support case; AWS Security Incident
    Response is included with Enterprise Support and Unified Operations, and costs extra on Business
    Support+.
  module: "12"

- term: AWS Data Exports
  definition: >-
    The Billing and Cost Management feature that creates exports of billing, cost and carbon
    emissions data, such as CUR 2.0, delivered as files to your S3 bucket.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: AWS Data Transfer Terminal
  definition: >-
    AWS sites where you bring your own storage devices and upload data to AWS over a fast
    connection. AWS points new customers to it, not Snowball, for physical transfers.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: AWS Database Migration Service
  abbreviation: AWS DMS
  definition: >-
    A service that moves database data into AWS, or between on-premises and cloud databases, while
    the source keeps running. It copies the data once, then can copy every change until you switch
    over, or keep both in step indefinitely.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in:
    - guide/13-moving-to-aws/02-seven-migration-strategies.md
    - guide/13-moving-to-aws/03-migration-tools.md
  confused_with: [AWS Schema Conversion Tool, AWS Transform MGN]
  not_to_confuse: >-
    DMS moves the data inside a database; SCT only converts the schema, when the engine changes, and
    MGN copies whole servers onto EC2.
  module: "05"

- term: AWS DataSync
  definition: >-
    A service moving large amounts of data over the network between on-premises storage, other
    clouds and AWS storage such as S3, EFS and FSx. AWS's current answer for one-time online moves,
    though the exam guide omits it.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  confused_with: [AWS Storage Gateway, AWS Snowball]
  not_to_confuse: >-
    DataSync moves data once, over the network; Storage Gateway is a lasting link that on-premises
    software uses every day, and Snowball's shipped devices are being retired.
  module: "05"

- term: AWS Direct Connect
  definition: >-
    A dedicated connection from your network to AWS at a Direct Connect location, off the public
    internet, for consistent performance and high bandwidth; private but unencrypted without MACsec
    or a VPN, and slower to set up than a VPN.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [AWS Site-to-Site VPN]
  not_to_confuse: >-
    Direct Connect is private and consistent but not encrypted by itself; a Site-to-Site VPN is
    encrypted and quick to set up but runs over the internet, and often serves as Direct Connect's
    backup.
  module: "07"

- term: AWS Directory Service
  definition: >-
    An AWS service for Microsoft Active Directory: a managed directory on AWS, or a connector that
    passes sign-ins to your existing on-premises directory.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  confused_with: [AWS IAM Identity Center]
  not_to_confuse: >-
    Directory Service runs or connects an Active Directory; IAM Identity Center gives staff single
    sign-on to AWS accounts and can use such a directory as its identity source.
  module: "04"

- term: AWS documentation
  definition: >-
    AWS's reference pages for each service, at docs.aws.amazon.com: user and developer guides, API
    and CLI references, tutorials and code examples. When an older whitepaper or blog post disagrees
    with it, trust the documentation.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  module: "12"

- term: AWS Elastic Beanstalk
  definition: >-
    AWS's platform as a service: it builds and runs the setup for your code in your account (EC2
    instances or an EKS cluster, load balancing, Auto Scaling, health monitoring). It costs nothing
    beyond those resources and isn't serverless.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  confused_with: [Amazon EC2, Amazon Lightsail, AWS Lambda]
  not_to_confuse: >-
    Beanstalk assembles ordinary EC2 resources in your account and bills them by use; on EC2 you
    assemble them yourself, Lightsail sells a bundle at a fixed price, and Lambda has no servers in
    your account at all.
  module: "06"

- term: AWS Elastic Disaster Recovery
  abbreviation: AWS DRS
  definition: >-
    A service continuously replicating whole servers' disks to a low-cost staging area in an AWS
    Region, ready to launch recovery servers within minutes. It protects physical servers, virtual
    machines, other clouds and EC2 instances, working as a pilot light.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  confused_with: [AWS Backup, snapshot, AWS Transform MGN]
  not_to_confuse: >-
    Elastic Disaster Recovery gives back running servers within minutes and keeps copying; AWS
    Backup and snapshots give back data only, and MGN's similar copying ends at a one-time cutover.
  module: "05"

- term: AWS Enterprise Support
  definition: >-
    The Support plan for business-critical workloads. On top of Business Support+ it adds a
    designated Technical Account Manager, faster reply targets, Well-Architected reviews, Trusted
    Advisor Priority and AWS Security Incident Response.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Business Support+, AWS Unified Operations, Enterprise On-Ramp]
  not_to_confuse: >-
    Enterprise Support is the first plan with a named TAM; Unified Operations adds domain
    specialists, the fastest targets and 24/7 workload monitoring, and Enterprise On-Ramp is a
    retiring plan whose customers move to Enterprise.
  module: "12"

- term: AWS European Sovereign Cloud
  definition: >-
    A separate, independent AWS cloud for Europe, aimed at public bodies and highly regulated
    industries with strict sovereignty needs.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  module: "03"

- term: AWS Fargate
  definition: >-
    Serverless compute for containers, used by Amazon ECS or Amazon EKS: you set each task's CPU and
    memory, and AWS supplies, isolates and patches the servers. It runs containers as long as a task
    runs, but has no GPUs.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  confused_with: [Amazon ECS, Amazon EKS, AWS Lambda]
  not_to_confuse: >-
    Fargate doesn't orchestrate: ECS or EKS decides where containers run and places them on Fargate;
    and Fargate runs containers that keep running, while Lambda runs short functions started by
    events.
  module: "06"

- term: AWS Firewall Manager
  definition: >-
    A central manager, not a firewall: you write a policy once, and it applies AWS WAF, Shield
    Advanced, security group and network ACL settings in every account of an organization, including
    new ones, and reports what doesn't comply.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS WAF, AWS Shield]
  not_to_confuse: >-
    Firewall Manager writes no rules of its own; it copies WAF, Shield Advanced and security group
    policies to every account, while WAF and Shield do the protecting.
  module: "09"

- term: AWS Free Tier
  definition: >-
    AWS's offer for trying services without paying. Since 2025-07-15, new customers get credits
    and choose a Free plan or a Paid plan, with Always Free allowances on both (amounts in the
    lesson).
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  confused_with: [legacy Free Tier]
  not_to_confuse: >-
    Today's Free Tier gives credits and a choice of Free or Paid plan; the legacy Free Tier, for
    accounts created before 2025-07-15, gave 12 months of free usage instead.
  module: "11"

- term: AWS Global Accelerator
  definition: >-
    A service whose fixed anycast IP addresses bring users' traffic onto AWS's network at the
    nearest edge, then to the best healthy Regional endpoint. It caches nothing, handles any TCP or
    UDP traffic, and switches Regions without DNS delays.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  also_in: [guide/03-aws-around-the-world/04-the-edge.md]
  confused_with: [Amazon CloudFront]
  not_to_confuse: >-
    Global Accelerator speeds the path to your application without caching, so every request reaches
    it; CloudFront keeps copies of content near users and answers from them.
  module: "07"

- term: AWS Glue
  definition: >-
    AWS's serverless data integration service: it finds data with crawlers, describes it in the Glue
    Data Catalog, and cleans or converts it with ETL jobs. It prepares data for queries; it doesn't
    answer them.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [Amazon Athena]
  not_to_confuse: >-
    Glue discovers, catalogs and transforms data; Athena runs the SQL query, reading its table
    definitions from Glue's Data Catalog.
  module: "10"

- term: AWS Glue Data Catalog
  definition: >-
    AWS Glue's central list of your data: for each set of files, a table definition giving where
    they are and their column names and types. Athena, EMR and Redshift Spectrum read their table
    definitions from it.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  also_in: [guide/10-data-ai-and-more/04-lab-13-athena-query.md]
  module: "10"

- term: AWS Health
  definition: >-
    The AWS service that reports events on AWS's side that can affect you: service issues, planned
    maintenance and account notices. You read them in the AWS Health Dashboard, through Amazon
    EventBridge or with the AWS Health API.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [AWS Trusted Advisor, Amazon CloudWatch]
  not_to_confuse: >-
    AWS Health reports problems on AWS's side; Trusted Advisor checks your own settings, and
    CloudWatch watches how your own resources are performing.
  module: "12"

- term: AWS Health API
  definition: >-
    The programmatic way into AWS Health, so your own tools can ask for your account's events. It
    needs Business Support+ or a higher plan; on Basic it refuses the call, though EventBridge still
    delivers events.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/05-lab-17-support-center-tour.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Health Dashboard]
  not_to_confuse: >-
    The Health Dashboard is for people in a browser and free on every plan, while the Health API is
    for programs and needs a paid Support plan; both read the same events.
  module: "12"

- term: AWS Health Dashboard
  definition: >-
    AWS Health's console page, free on every plan with no setup, with two views: Service health for
    public events and Your account health for events affecting your resources. Older material calls
    these the Service and Personal Health Dashboards.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md, guide/08-building-and-operating/03-watching-workloads.md, guide/12-getting-help/01-support-plans.md, guide/12-getting-help/03-where-to-find-answers.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [AWS Health API]
  not_to_confuse: >-
    The Health Dashboard is for people in a browser and free on every plan, while the Health API is
    for programs and needs a paid Support plan; both read the same events.
  module: "12"

- term: AWS Health event
  definition: >-
    One notice from AWS Health: a problem with an AWS service, planned maintenance, or another
    notice that can affect your resources. It is either a public event or an account-specific event.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  module: "12"

- term: AWS IAM Identity Center
  definition: >-
    AWS's recommended way to give a workforce single sign-on to many AWS accounts and business
    applications, with temporary credentials through permission sets. It was called AWS Single
    Sign-On (AWS SSO) until 2022.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  confused_with: [AWS Identity and Access Management, Amazon Cognito, AWS Directory Service]
  not_to_confuse: >-
    Identity Center is for your staff across many accounts; IAM holds identities inside one account,
    Cognito signs in your app's customers, and Directory Service runs Microsoft Active Directory.
  module: "04"

- term: AWS Identity and Access Management
  abbreviation: IAM
  definition: >-
    The AWS service that holds an account's identities and their permissions. It is a global
    service, not tied to one Region.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md]
  confused_with: [AWS IAM Identity Center]
  not_to_confuse: >-
    IAM holds the identities and permissions inside one account; IAM Identity Center gives a
    workforce single sign-on across many accounts.
  module: "04"

- term: AWS IoT Core
  definition: >-
    An AWS service that lets connected devices talk securely to AWS services and to each other. Each
    device proves its identity, usually with a certificate, and IoT rules route its messages to
    services such as S3 or SNS.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [Amazon Kinesis Data Streams]
  not_to_confuse: >-
    IoT Core connects and authenticates devices and routes their messages; Kinesis Data Streams
    streams data once it's in AWS, but doesn't connect or manage devices.
  module: "10"

- term: AWS IP address ranges
  definition: >-
    The IP address ranges AWS uses, published as the file ip-ranges.json that anyone can download
    and search, for example to check whether an address attacking you belongs to AWS.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  module: "12"

- term: AWS Key Management Service
  abbreviation: AWS KMS
  definition: >-
    The AWS service that creates and controls the keys that encrypt your data, on validated hardware
    security modules, and records each use of your keys in CloudTrail. Most AWS storage services
    integrate with it.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS CloudHSM, AWS Certificate Manager]
  not_to_confuse: >-
    AWS KMS is a shared, managed key service and the usual default; CloudHSM gives you single-tenant
    HSMs under your exclusive control, and ACM manages TLS certificates for data in transit.
  module: "09"

- term: AWS Knowledge Center
  definition: >-
    AWS's official articles and videos answering the questions customers ask most, such as "How do
    I…?", written and kept current by AWS. It is part of AWS re:Post, not a separate site.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [AWS re:Post, AWS Prescriptive Guidance, AWS Support Center]
  not_to_confuse: >-
    The Knowledge Center is AWS's articles on common problems; re:Post's other answers come from
    anyone, Prescriptive Guidance plans bigger jobs, and Support Center answers about your own
    account.
  module: "12"

- term: AWS Lambda
  definition: >-
    AWS's serverless service running your code, as functions, each time an event triggers it, with
    no servers to manage. It suits short, event-driven work, scales by running copies side by side,
    and bills per request and GB-second.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/06-running-applications/05-lab-07-a-lambda-function.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [AWS Fargate, AWS Batch]
  not_to_confuse: >-
    Lambda runs short functions started by events, up to a time limit per run (see the lesson);
    Fargate runs containers for as long as they need, and Batch runs queues of long jobs.
  module: "06"

- term: AWS License Manager
  definition: >-
    An AWS service that tracks the software licenses you use and bring, across accounts, and can
    stop launches that would exceed what you own. It also shares Marketplace licenses and switches
    license types without redeploying.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/12-getting-help/04-partners-and-paid-help.md]
  module: "13"

- term: AWS managed key
  definition: >-
    A KMS key, named like aws/ebs or aws/rds, that an AWS service creates in your account. You can
    see it, read its policy and see each use in CloudTrail, but not change it; AWS rotates it
    yearly.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [AWS owned key, customer managed key]
  not_to_confuse: >-
    An AWS managed key is in your account and visible but controlled by AWS; an AWS owned key stays
    in AWS's accounts unseen, and a customer managed key is one you create and control.
  module: "09"

- term: AWS managed policy
  definition: >-
    A policy that AWS writes and updates and every customer can use. It's a quick start, but it may
    grant more than your case needs.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  confused_with: [customer managed policy, inline policy]
  not_to_confuse: >-
    AWS managed policies are written by AWS for everyone; customer managed policies are yours and
    attach to many identities; inline policies live in one identity and are deleted with it.
  module: "04"

- term: AWS Managed Services
  abbreviation: AMS
  definition: >-
    An offering in which AWS operates a customer's infrastructure for an extra fee. The exam guide
    lists it as out of scope, so expect it only as a wrong answer.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  confused_with: [managed service provider]
  not_to_confuse: >-
    AWS Managed Services is AWS itself running your infrastructure for a fee; a managed service
    provider is a partner company that does that work.
  module: "12"

- term: AWS Management Console
  definition: >-
    AWS's web application for working with every AWS service by pointing and clicking. It suits
    looking around, learning and one-time tasks; it keeps the result, not the steps, so it can't
    rebuild or copy a setup exactly.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  also_in: [guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md]
  confused_with: [AWS CLI, AWS SDK, infrastructure as code]
  not_to_confuse: >-
    All four reach the same services under the same permissions: the console is a person clicking,
    the CLI typed or scripted commands, an SDK a program's own calls, and infrastructure as code a
    template of the end result.
  module: "08"

- term: AWS Marketplace
  definition: >-
    A curated catalog of software, data and services from other companies, billed on your AWS bill,
    with cost management, governance and entitlement features for buyers. A product bought there is
    still yours to configure.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md, guide/09-protecting-and-governing/04-the-front-door.md, guide/09-protecting-and-governing/05-compliance-and-governance.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: AWS Migration Acceleration Program
  abbreviation: MAP
  definition: >-
    AWS's program for organizations migrating at scale, in three phases (assess, mobilize, and
    migrate and modernize). It offers tools, training, partner expertise and funding toward early
    migration costs.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: AWS Migration Hub
  definition: >-
    An AWS service that tracks the status of each application's migration in one place, whichever
    tool does the moving; it moves nothing. It is closed to new customers, and AWS points to AWS
    Transform.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  confused_with: [AWS Application Discovery Service]
  not_to_confuse: >-
    Migration Hub tracks progress across tools; Discovery Service collects the server inventory and
    dependencies used to plan the moves.
  module: "13"

- term: AWS News Blog
  definition: >-
    The AWS blog that announces new services and features, in dated posts.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  module: "12"

- term: AWS Organizations
  definition: >-
    An AWS service that joins several AWS accounts into one organization under a management account,
    with organizational units, policies such as service control policies, and one consolidated bill.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Control Tower]
  not_to_confuse: >-
    Organizations is the foundation that groups accounts, sets policies and gives one bill; Control
    Tower is built on it and sets up and watches a best-practice multi-account environment for you.
  module: "09"

- term: AWS Outposts
  definition: >-
    AWS hardware, services and tools in your own data center or site, operated and maintained by AWS
    as an extension of a Region, for hybrid systems whose data must stay on premises. You provide
    the building, power and network connection.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in: [guide/06-running-applications/04-simpler-paths.md]
  confused_with: [Local Zone]
  not_to_confuse: >-
    Outposts is in your own building; a Local Zone is an AWS site in a big city.
  module: "03"

- term: AWS owned key
  definition: >-
    A KMS key that lives in AWS's own accounts, which a service uses to encrypt your data by
    default. You can't see it, control who uses it or audit its use.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [AWS managed key, customer managed key]
  not_to_confuse: >-
    An AWS owned key stays in AWS's accounts out of your sight; an AWS managed key sits in your
    account where you can see its use, and a customer managed key is yours to control.
  module: "09"

- term: AWS Partner
  definition: >-
    A company outside AWS, in the AWS Partner Network, that sells software or services to AWS
    customers: independent software vendors sell software, and system integrators sell services.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  also_in: [guide/12-getting-help/03-where-to-find-answers.md]
  confused_with: [AWS Professional Services]
  not_to_confuse: >-
    A partner is another company in the AWS Partner Network; Professional Services is part of AWS,
    though either can be hired to do a project.
  module: "12"

- term: AWS Partner Network
  abbreviation: APN
  definition: >-
    AWS's global community of partner companies. Joining is free, and members get partner training
    and certification, events, selling with AWS through Marketplace and co-selling, and programs and
    incentives.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: AWS Partner Solutions Finder
  definition: >-
    AWS's search tool for finding a partner by industry, use case, workload, solution or AWS
    Specialization.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: AWS Prescriptive Guidance
  definition: >-
    Material from AWS experts for bigger jobs such as migrating, modernizing or setting up security:
    guides for planning, and patterns with hands-on steps and code for building.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  confused_with: [AWS documentation, AWS Knowledge Center]
  not_to_confuse: >-
    Prescriptive Guidance tells you how to carry out a plan, often across several services;
    documentation explains how one service works, and the Knowledge Center fixes one common problem.
  module: "12"

- term: AWS Pricing Calculator
  definition: >-
    A free AWS web tool that estimates what services will cost before you use them, from your
    assumptions about hours, GB and requests. It leaves out tax, and shared estimates sit on public
    servers.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in:
    - guide/11-paying-for-aws/05-lab-15-pricing-calculator.md
    - guide/13-moving-to-aws/04-the-business-case.md
  confused_with: [AWS Budgets, AWS Cost and Usage Report, AWS Cost Explorer]
  not_to_confuse: >-
    The Pricing Calculator estimates a design before it exists; Budgets alerts against a limit while
    it runs, Cost Explorer analyzes and forecasts real costs, and the CUR delivers every line item
    as files.
  module: "11"

- term: AWS PrivateLink
  definition: >-
    Private access from a VPC to one service, from AWS, a partner or another team, through an
    interface endpoint with a private address in your subnet, without joining networks or using an
    internet gateway, NAT gateway or public address.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  also_in: [guide/07-connecting-it/01-your-own-network.md]
  confused_with: [VPC peering, AWS Transit Gateway]
  not_to_confuse: >-
    PrivateLink exposes one service, and only the consumer can start connections; peering and
    Transit Gateway join whole networks both ways.
  module: "07"

- term: AWS Professional Services
  definition: >-
    AWS's own consulting organization, hired under a paid contract to design, build, migrate and
    manage workloads on AWS, often alongside AWS Partners.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/03-where-to-find-answers.md]
  confused_with: [AWS solutions architect, AWS Partner, AWS Support]
  not_to_confuse: >-
    Professional Services is AWS's own paid consultants doing the project; a solutions architect
    advises for free, a partner is another company that can do the work, and Support fixes problems
    with AWS.
  module: "12"

- term: AWS re:Post
  definition: >-
    AWS's public question-and-answer site, where anyone can ask and community members, AWS staff and
    recognized experts answer. It is free on every Support plan; never post keys or other secrets
    there.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [AWS Knowledge Center, AWS Support Center, AWS re:Post Private]
  not_to_confuse: >-
    Anyone answers re:Post's questions, in public; the Knowledge Center is AWS's own articles inside
    re:Post, Support Center is a private case about your account, and re:Post Private is a separate,
    retiring product.
  module: "12"

- term: AWS re:Post Private
  definition: >-
    A separate, private knowledge site for one organization's own teams, which AWS is retiring (see
    the lesson). The exam's re:Post is the public site.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  confused_with: [AWS re:Post]
  not_to_confuse: >-
    re:Post Private was one organization's private site and is being retired; re:Post is AWS's
    public question-and-answer site that every customer can use.
  module: "12"

- term: AWS Resource Access Manager
  abbreviation: AWS RAM
  definition: >-
    A service that shares a resource you create once, such as VPC subnets or a transit gateway,
    with chosen accounts, your organization or its OUs. The sharing account keeps owning it; the
    others use it within the share's permissions.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: AWS Schema Conversion Tool
  abbreviation: AWS SCT
  definition: >-
    A program you download that converts a database's schema (tables, views, stored procedures and
    functions) for a different engine, and lists what you must convert by hand. DMS Schema
    Conversion does the same job inside the AWS DMS console.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  confused_with: [AWS Database Migration Service]
  not_to_confuse: >-
    SCT translates the structure when the engine changes and moves no data; DMS moves the data.
  module: "05"

- term: AWS SDK
  definition: >-
    A set of code libraries for one programming language that lets a program call AWS services. It
    signs each request, picks up the temporary credentials of the role the code runs with, and
    retries brief failures.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  confused_with: [AWS CLI]
  not_to_confuse: >-
    The CLI is for people typing or scripting commands in a terminal; an SDK is for a program's own
    code that calls AWS while it runs, such as saving each receipt.
  module: "08"

- term: AWS Secrets Manager
  definition: >-
    An AWS service that stores secrets, such as database passwords and API keys, always encrypted,
    and can rotate them automatically on a schedule.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  confused_with: [Parameter Store]
  not_to_confuse: >-
    Secrets Manager is built for secrets and can rotate them; Parameter Store is built for
    configuration values and doesn't rotate them.
  module: "04"

- term: AWS Security Blog
  definition: >-
    AWS's blog on security: how to set up security features, and what's new.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  confused_with: [AWS Security Bulletins]
  not_to_confuse: >-
    The Security Blog explains how to use security features; Security Bulletins announce newly found
    vulnerabilities that affect AWS services and say whether you must act.
  module: "09"

- term: AWS Security Bulletins
  definition: >-
    AWS's notices of newly found vulnerabilities that affect AWS services, each marked Important,
    when customers must act, or Informational.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  confused_with: [AWS Security Blog]
  not_to_confuse: >-
    Security Bulletins announce vulnerabilities that affect AWS services; the Security Blog explains
    how to set up security features and what's new.
  module: "09"

- term: AWS Security Center
  definition: >-
    AWS's security home page, where it describes its security services and how it approaches
    security. The exam guide calls it AWS Security Center.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: AWS Security Hub
  definition: >-
    Today, a newer unified product built on Security Hub CSPM that correlates findings from it,
    GuardDuty, Inspector, Macie and others into exposure findings. The exam guide's Security Hub is
    the original, now Security Hub CSPM.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  confused_with: [AWS Security Hub CSPM]
  not_to_confuse: >-
    The unified Security Hub joins findings into combined risks; Security Hub CSPM, the original
    product, runs the standards checks and is what the exam guide means.
  module: "09"

- term: AWS Security Hub CSPM
  definition: >-
    The original AWS Security Hub, renamed: it checks your settings against security standards such
    as CIS and PCI DSS, scores them, and collects other services' findings in one place. Most checks
    need AWS Config.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  exam_name: AWS Security Hub
  confused_with: [AWS Security Hub, AWS Trusted Advisor]
  not_to_confuse: >-
    Security Hub CSPM checks settings against named standards and gathers findings, as the exam's
    Security Hub does; the unified Security Hub correlates findings, and Trusted Advisor checks
    AWS's own best practices.
  module: "09"

- term: AWS Security Incident Response
  definition: >-
    AWS help to prepare for, respond to and recover from security incidents such as an account
    takeover or ransomware. It is included with Enterprise Support and Unified Operations, and an
    extra fee on Business Support+.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Customer Incident Response Team]
  not_to_confuse: >-
    Security Incident Response comes with the higher Support plans; the AWS CIRT helps any customer
    whose account has been broken into, at no extra charge, through a support case.
  module: "12"

- term: AWS Security Token Service
  abbreviation: AWS STS
  definition: >-
    The AWS service that issues temporary credentials.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: AWS Service Catalog
  definition: >-
    A service where administrators publish approved templates as products, and other people launch
    only those, within set limits and through a launch role, without wider permissions of their own.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  confused_with: [AWS CloudFormation]
  not_to_confuse: >-
    CloudFormation is the engine that builds stacks from templates; Service Catalog is the shop
    front with rules, deciding who may launch which approved templates.
  module: "08"

- term: AWS Shield
  definition: >-
    AWS's protection against DDoS attacks, in two tiers: Shield Standard, automatic for every
    customer, and Shield Advanced, a paid subscription.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS WAF, AWS Firewall Manager]
  not_to_confuse: >-
    Shield absorbs floods without reading them; WAF reads each web request and applies your rules,
    and Firewall Manager writes no rules but repeats WAF, Shield Advanced and security group
    policies in every account.
  module: "09"

- term: AWS Shield Advanced
  definition: >-
    The paid tier of AWS Shield, a yearly subscription for resources you choose. It adds automatic
    application layer mitigation through AWS WAF, the Shield Response Team, DDoS cost protection and
    detailed attack reports.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Shield Standard]
  not_to_confuse: >-
    Shield Advanced is a paid subscription with people, web-request mitigation and bill protection;
    Shield Standard is the automatic, free protection against common network floods.
  module: "09"

- term: AWS Shield Standard
  definition: >-
    The tier of AWS Shield that every AWS customer has automatically, at no additional charge. It
    defends against common network and transport layer attacks, best where CloudFront, Route 53 or
    Global Accelerator is the front door.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Shield Advanced]
  not_to_confuse: >-
    Shield Standard is automatic and free against common network floods; Shield Advanced is a paid
    yearly subscription adding web-request mitigation, the Shield Response Team and DDoS cost
    protection.
  module: "09"

- term: AWS Site-to-Site VPN
  definition: >-
    One of the AWS VPN services: it connects a whole network, such as an office, to AWS through
    encrypted IPsec tunnels across the public internet. It can be set up in minutes, but it is
    encrypted, not private.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [AWS Direct Connect, AWS Client VPN]
  not_to_confuse: >-
    Site-to-Site VPN is quick and encrypted but shares the internet's path, while Direct Connect is
    a private line taking longer to set up; Site-to-Site joins a network, while Client VPN joins one
    person's device.
  module: "07"

- term: AWS Skill Builder
  definition: >-
    AWS's platform for digital training, with many free courses, and hands-on labs in a paid
    subscription.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: AWS Snowball
  definition: >-
    A rugged storage device AWS shipped for moving large amounts of data into AWS. Closed to new
    customers, nearing end of support and dropped from the current exam guide: treat it as a wrong
    answer (dates in the lesson).
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  confused_with: [AWS DataSync]
  not_to_confuse: >-
    Snowball moved data on a shipped device and is being retired; DataSync moves data over the
    network and is what AWS points new customers to.
  module: "05"

- term: AWS solutions architect
  definition: >-
    An AWS technical adviser who helps customers design systems on AWS, for example through
    architecture and Well-Architected reviews, at no charge. A role, not a product: they advise but
    don't build.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  also_in: [guide/12-getting-help/03-where-to-find-answers.md]
  confused_with: [AWS Professional Services, AWS Support]
  not_to_confuse: >-
    A solutions architect advises on design at no charge but doesn't build; Professional Services is
    hired to do the work, and AWS Support fixes problems with AWS services.
  module: "12"

- term: AWS Specialization
  definition: >-
    AWS's validation, against a technical bar, of a partner's expertise in one area. The
    specializations include AWS Competency and AWS Managed Service Provider.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: AWS Step Functions
  definition: >-
    A service that runs workflows, called state machines: steps carried out in order and tracked to
    the end, with choices, retries, parallel steps and waits for a person's approval.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [Amazon SQS, AWS Lambda]
  not_to_confuse: >-
    Step Functions coordinates several steps in order and keeps its place, even for days; Lambda
    runs one step's code, and SQS only holds messages, knowing nothing of steps.
  module: "08"

- term: AWS Storage Gateway
  definition: >-
    A hybrid storage service, usually a virtual machine on premises, letting local software use
    storage as before, with the data in AWS. It caches frequently used data locally and sends
    changes to AWS. Types: S3 File, Volume and Tape Gateway.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [AWS DataSync, AWS Backup]
  not_to_confuse: >-
    Storage Gateway is a lasting link that on-premises software uses every day; DataSync moves data
    once, and AWS Backup manages backups of resources already in AWS.
  module: "05"

- term: AWS Support
  definition: >-
    AWS's own help service for its customers, sold as Support plans. It helps with AWS services and
    your account, but doesn't write or debug your code, administer your systems or log in to them.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/03-where-to-find-answers.md, guide/12-getting-help/04-partners-and-paid-help.md]
  confused_with: [AWS solutions architect, AWS Professional Services, AWS Partner]
  not_to_confuse: >-
    AWS Support fixes problems with AWS services and your account; a solutions architect advises on
    design at no charge, and Professional Services or a partner is hired to do the work.
  module: "12"

- term: AWS Support Center
  definition: >-
    The place in the AWS console where you open and follow support cases and ask for quota
    increases; AWS's documentation calls it the Support Center Console. Any IAM identity with
    permission can use it, not only the root user.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/03-where-to-find-answers.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [AWS re:Post, AWS Knowledge Center, AWS Prescriptive Guidance]
  not_to_confuse: >-
    Support Center is the only one that sees your account, through a private case; re:Post's
    community answers, the Knowledge Center's AWS articles and Prescriptive Guidance are public and
    written for every customer.
  module: "12"

- term: AWS Support Plans console
  definition: >-
    The console page that shows which Support plan an account is on and where plans are changed.
    Changing the plan needs IAM permissions, not the root user, and a paid plan starts a monthly
    fee.
  taught_in: guide/12-getting-help/05-lab-17-support-center-tour.md
  module: "12"

- term: AWS Transform
  definition: >-
    An AWS service, launched in 2025, that uses AI agents to help plan and carry out migrations and
    modernization. AWS points new customers there for discovery and tracking; the exam guide doesn't
    list it.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: AWS Transform MGN
  definition: >-
    AWS's rehost service, formerly AWS Application Migration Service: it copies whole servers block
    by block while they keep running, then launches them as EC2 instances at cutover.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  also_in: [guide/13-moving-to-aws/02-seven-migration-strategies.md]
  exam_name: AWS Application Migration Service
  confused_with: [AWS Database Migration Service, AWS Elastic Disaster Recovery]
  not_to_confuse: >-
    MGN moves whole servers onto EC2 once and stops at cutover; DMS moves only the data inside a
    database, and Elastic Disaster Recovery keeps copying servers for recovery.
  module: "13"

- term: AWS Transit Gateway
  definition: >-
    A hub that VPCs, VPN connections and Direct Connect links each attach to once, with route tables
    deciding which networks reach which. It replaces a tangle of peering connections between many
    networks, and bills per attachment-hour and per GB.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [VPC peering, AWS PrivateLink]
  not_to_confuse: >-
    Transit Gateway connects many networks through one hub and is transitive; peering joins just two
    VPCs, and PrivateLink reaches one service.
  module: "07"

- term: AWS Trust & Safety team
  definition: >-
    The AWS team that handles reports of abuse coming from AWS resources, through AWS's abuse form.
    It deals with the resource's owner and shares details only with that owner's permission.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  also_in: [guide/12-getting-help/04-partners-and-paid-help.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  exam_name: AWS Trust and Safety team
  confused_with: [AWS Support]
  not_to_confuse: >-
    Trust & Safety takes reports of abuse from an AWS resource, on any plan; AWS Support can't, but
    handles an intruder in your own account through a support case.
  module: "12"

- term: AWS Trust Center
  definition: >-
    AWS's page that gathers its security, compliance and privacy commitments in one place.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: AWS Trusted Advisor
  definition: >-
    An AWS service that checks your account against AWS's best practices in six categories, such as
    cost optimization, security and service limits, and recommends changes; it fixes nothing. Your
    Support plan decides which checks you see.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md, guide/09-protecting-and-governing/08-sim-security-findings-tour.md, guide/12-getting-help/01-support-plans.md, guide/12-getting-help/05-lab-17-support-center-tour.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Security Hub CSPM, Amazon Inspector, AWS Health]
  not_to_confuse: >-
    Trusted Advisor compares your account with AWS's own best practices; Security Hub CSPM checks
    named standards such as CIS, Inspector finds software flaws, and AWS Health reports problems on
    AWS's side.
  module: "12"

- term: AWS Unified Operations
  definition: >-
    The top Support plan, for mission-critical workloads: the fastest first-reply targets for
    critical incidents, designated domain specialist engineers alongside a TAM, and 24/7 monitoring
    of your workloads. You sign up through AWS sales.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Enterprise Support]
  not_to_confuse: >-
    Both include a designated TAM; only Unified Operations adds domain specialist engineers, reply
    targets of minutes for critical incidents and 24/7 workload monitoring.
  module: "12"

- term: AWS WAF
  definition: >-
    A web application firewall. It reads each HTTP and HTTPS request sent to a resource such as
    CloudFront, an Application Load Balancer or API Gateway, and allows, blocks, counts or
    challenges it by the rules in a web ACL.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [AWS Shield, security group, AWS Firewall Manager]
  not_to_confuse: >-
    WAF reads the content of web requests; Shield absorbs floods without reading them, a security
    group sees only addresses and ports, and Firewall Manager applies WAF rules across accounts.
  module: "09"

- term: AWS Well-Architected Framework
  definition: >-
    AWS's published guidance, as a set of whitepapers, for designing and running workloads well in
    the cloud. It is organized into six pillars, each with design principles and best practices.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [AWS Well-Architected Tool]
  not_to_confuse: >-
    The Framework is the guidance; the Well-Architected Tool is the console service that reviews one
    workload against it.
  module: "02"

- term: AWS Well-Architected Tool
  definition: >-
    A service in the AWS console that reviews one workload against the Well-Architected Framework's
    questions, flags risks and saves milestones. It is a different service from AWS Trusted Advisor,
    which runs automatic checks on an account.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  also_in:
    - guide/12-getting-help/02-tools-that-watch-your-account.md
    - guide/12-getting-help/04-partners-and-paid-help.md
    - guide/14-capstone/01-the-capstone-review.md
    - guide/14-capstone/02-lab-18-well-architected-tool-review.md
  confused_with: [AWS Well-Architected Framework]
  not_to_confuse: >-
    The Tool is the service that runs a review; the Framework is the guidance the review is based
    on.
  module: "02"

- term: AWS whitepapers
  definition: >-
    AWS's longer papers on one topic across services, such as the Well-Architected Framework or
    disaster recovery, alongside decision guides and reference architectures. Check the date: some
    are marked for historical reference only.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  module: "12"

- term: AWS X-Ray
  definition: >-
    A service that traces requests through an application: each part a request touched and how long
    it took, to find the slow or failing part. AWS now shows it as part of CloudWatch; see the
    lesson.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [Amazon CloudWatch, AWS CloudTrail]
  not_to_confuse: >-
    X-Ray follows one request across the parts it touches; CloudWatch measures how resources and
    code run overall, and CloudTrail records who did what to the account.
  module: "08"

- term: AWS-generated tag
  definition: >-
    A cost allocation tag that AWS creates and applies, such as aws:createdBy for who created a
    resource. Only the management account activates it, and it covers only resources created
    afterward.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in: [guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md]
  confused_with: [user-defined tag]
  not_to_confuse: >-
    AWS-generated tags are applied by AWS, show the aws: prefix and cover only resources created
    after activation; user-defined tags are applied by you and show the user: prefix.
  module: "11"

- term: AZ ID
  definition: >-
    An identifier, such as use1-az1, that names the same physical Availability Zone in every
    account. To agree on a place across accounts, compare AZ IDs, not AZ names.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md]
  confused_with: [AZ name]
  not_to_confuse: >-
    An AZ ID is the same in every account; an AZ name is your account's label for a zone and may
    differ from another account's.
  module: "03"

- term: AZ name
  definition: >-
    An Availability Zone's name in your account: the Region code plus a letter, such as us-east-1a.
    In AWS's oldest Regions, older accounts may map the same name to different physical zones.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md]
  confused_with: [AZ ID]
  not_to_confuse: >-
    An AZ name such as us-east-1a can point to different places in different accounts; an AZ ID such
    as use1-az1 means the same physical place in every account.
  module: "03"

- term: back end
  definition: >-
    What runs behind an app's front end: its data, sign-in and business logic. AWS Amplify's
    libraries and tools add back-end features without wiring each AWS service by hand.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [front end]
  not_to_confuse: >-
    The back end holds the data, sign-in and logic out of sight; the front end is the web pages or
    phone app people actually use.
  module: "10"

- term: backup
  definition: >-
    A saved copy of data as it was at one moment. A point-in-time backup lets you go back to that
    moment, which is the only way to undo a deletion that replication has already copied.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md, guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/05-managed-or-self-managed-databases.md]
  confused_with: [replication]
  not_to_confuse: >-
    A backup stops changing, so it can take you back to before a mistake; replication keeps copying
    every change, mistakes included.
  module: "03"

- term: backup and restore
  definition: >-
    The cheapest and slowest disaster recovery strategy: only backups of the data and setup are kept
    in the recovery Region, and everything else is rebuilt after the disaster. Recovery typically
    takes hours.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md, guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [pilot light]
  not_to_confuse: >-
    Backup and restore keeps only backups and rebuilds everything; a pilot light also keeps data
    copied continuously and core parts such as the database running.
  module: "03"

- term: backup plan
  definition: >-
    In AWS Backup, the rules for what to back up, how often, how long to keep each backup and where
    to copy it. You assign resources to it, for example by tag.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  module: "05"

- term: backup vault
  definition: >-
    In AWS Backup, the container that holds backups, encrypted and unchangeable. It has nothing to
    do with the vaults of the older Amazon Glacier service.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [Amazon Glacier]
  not_to_confuse: >-
    A backup vault holds AWS Backup's recovery points and is current; a Glacier vault belongs to the
    older Amazon Glacier service, closed to new customers.
  module: "05"

- term: bandwidth
  definition: >-
    How much data a network connection can carry each second, counted in megabits or gigabits per
    second (Mbps, Gbps).
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: baseline usage
  definition: >-
    The level a workload never drops below, such as two servers running every hour of the year. It's
    the part of a workload that a commitment fits.
  taught_in: guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  module: "11"

- term: basic monitoring
  definition: >-
    The free default for EC2 metrics in CloudWatch, such as CPU use, network traffic and disk
    activity, sent every 5 minutes.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [detailed monitoring]
  not_to_confuse: >-
    Basic monitoring sends EC2's metrics every 5 minutes at no charge; detailed monitoring sends the
    same metrics every minute, for a charge.
  module: "08"

- term: Basic Support
  definition: >-
    The free Support plan on every AWS account: account and billing cases, quota increase requests,
    documentation and re:Post, some Trusted Advisor checks and the AWS Health Dashboard. It can't
    open technical cases.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md, guide/12-getting-help/05-lab-17-support-center-tour.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  confused_with: [AWS Business Support+]
  not_to_confuse: >-
    Basic is free and handles account, billing and quota cases only; Business Support+ is the
    cheapest plan that adds technical cases with AWS engineers.
  module: "12"

- term: batch
  definition: >-
    A large amount of data handled at once, such as yesterday's orders exported overnight, rather
    than record by record as it arrives.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [streaming data, batch job]
  not_to_confuse: >-
    A batch is data moved or processed in one go rather than as a stream; a batch job is a program
    that runs to completion unattended, such as a nightly report.
  module: "10"

- term: batch job
  definition: >-
    A program that runs to completion with no one interacting with it, such as a nightly report or
    a simulation.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: behavior graph
  definition: >-
    Amazon Detective's linked picture of which identities, addresses and resources did what, and
    when, built from activity logs and GuardDuty findings.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  module: "09"

- term: benefits management
  definition: >-
    The CAF Governance perspective capability that makes sure a cloud investment's promised benefits
    are realized, measuring them against a plan.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: best practice
  definition: >-
    A specific recommended action in the Well-Architected Framework, with an ID that shows its
    pillar and question.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  also_in:
    - guide/14-capstone/01-the-capstone-review.md
    - guide/14-capstone/02-lab-18-well-architected-tool-review.md
  confused_with: [design principle]
  not_to_confuse: >-
    A best practice is a specific action with an ID; a design principle is a broad idea that guides
    many decisions.
  module: "02"

- term: billing data lag
  definition: >-
    The delay between using something and its cost reaching the tools that watch it, such as Budgets
    and Cost Anomaly Detection, so their alerts arrive hours after the spending.
  taught_in: guide/11-paying-for-aws/08-sim-guardrail-timeline.md
  module: "11"

- term: blast radius
  definition: >-
    How far a failure reaches: one server, a data center, an Availability Zone, or a whole Region.
    It decides which protection you need.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md]
  module: "03"

- term: block storage
  definition: >-
    Storage that a server sees as its own disk: the server's operating system formats it and keeps
    its files on it. On AWS it is an Amazon EBS volume or EC2 instance store.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [file storage, object storage]
  not_to_confuse: >-
    Block storage is a disk for one server; file storage is a folder tree that many servers share
    over the network, and object storage keeps whole objects in a bucket reached through a web API.
  module: "05"

- term: block-level replication
  definition: >-
    Copying a server's disks piece by piece, below the level of files, then copying every change, so
    the copy matches the disk, operating system included.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: bot
  definition: >-
    A program that holds a conversation with a person, in text or by voice, such as one that takes
    cake orders. Amazon Lex builds them.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  also_in: [guide/10-data-ai-and-more/03-people-apps-and-devices.md]
  confused_with: [agent (contact center)]
  not_to_confuse: >-
    A bot is a program that answers first; an agent is a person in a contact center, who takes over
    when the bot can't help.
  module: "10"

- term: bottleneck
  definition: >-
    The resource a program runs out of first: processor, memory, disk speed or special chips. It is
    the first thing to find when choosing an EC2 instance family.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/01-on-ramp/01-computers-and-servers.md]
  module: "06"

- term: bring your own license
  abbreviation: BYOL
  definition: >-
    Using software licenses you already own on AWS, so AWS charges only for the infrastructure.
    License terms decide how, such as License Mobility or Dedicated Hosts, and compliance is yours.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in:
    - guide/11-paying-for-aws/02-purchasing-options.md
    - guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md
  confused_with: [license-included]
  not_to_confuse: >-
    BYOL reuses licenses you own under their terms, with compliance yours; license-included buys the
    license by the hour from AWS, which handles compliance.
  module: "13"

- term: bucket
  definition: >-
    A container for files (objects) in Amazon S3.
  taught_in: guide/02-why-the-cloud/06-lab-01-first-resource.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md, guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md, guide/05-storing-data/01-block-file-object.md, guide/05-storing-data/02-s3-in-practice.md]
  confused_with: [object]
  not_to_confuse: >-
    A bucket is the container; objects are the files stored in it.
  module: "02"

- term: bucket policy
  definition: >-
    A resource-based policy attached to an S3 bucket. Because it can let other identities or
    accounts in, it deserves the same review as an identity's policies.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md, guide/05-storing-data/02-s3-in-practice.md]
  module: "04"

- term: budget action
  definition: >-
    Something AWS Budgets does when a threshold is crossed, automatically or after approval: apply
    an IAM policy, attach an SCP, or stop chosen EC2 or RDS instances. It never deletes anything.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/08-sim-guardrail-timeline.md]
  module: "11"

- term: budget threshold
  definition: >-
    A point at which an AWS budget sends an alert, such as 85% of its amount, measured on actual or
    forecasted cost.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: bundle (Lightsail)
  definition: >-
    Amazon Lightsail's name for a plan that packs a server, storage and data transfer into one
    price.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: burstable instance
  definition: >-
    An EC2 instance, of the T types, that runs at a baseline level of processor use and bursts above
    it using credits earned while quiet. It suits web servers and test systems that are mostly idle.
  taught_in: guide/06-running-applications/01-ec2.md
  module: "06"

- term: Business Associate Addendum
  abbreviation: BAA
  definition: >-
    An agreement with AWS, accepted in AWS Artifact, that United States healthcare businesses
    typically need before they handle protected health information on AWS.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: business case
  definition: >-
    A document comparing the costs and benefits of the options for a decision, over years, so the
    people paying can choose. A migration case counts every cost of staying and of moving.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  module: "13"

- term: business continuity
  definition: >-
    Keeping the business running through a major disruption, not just restoring it afterward; one of
    the reasons to use more than one Region.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  confused_with: [disaster recovery]
  not_to_confuse: >-
    Business continuity keeps the business going during a disruption; disaster recovery brings the
    workload back after it.
  module: "03"

- term: business intelligence
  abbreviation: BI
  definition: >-
    Tools that turn data into reports and charts for the people who run a business, often as a
    dashboard: one screen of charts kept up to date. Amazon Quick Sight is AWS's.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: business outcome
  definition: >-
    A result the business wants from the cloud, not a technical one. The CAF names four: reduce
    business risk, improve ESG performance, grow revenue and increase operational efficiency.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: Business perspective
  definition: >-
    The CAF perspective for strategy and outcomes: deciding what to change, in what order and why
    it's worth it, through capabilities such as strategy, portfolio and innovation management.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [Governance perspective]
  not_to_confuse: >-
    Business decides whether and in what order to change; Governance oversees the change once
    decided, measuring benefits, controlling spending and licenses, and managing risk.
  module: "13"

- term: Business Support
  definition: >-
    A retiring Support plan, closed to new subscriptions, that ends on a set date (see the lesson).
    Its customers aren't moved automatically: they choose Business Support+ to keep technical help.
  taught_in: guide/12-getting-help/01-support-plans.md
  confused_with: [AWS Business Support+]
  not_to_confuse: >-
    Business Support is the retiring plan that older material and some AWS pages still name;
    Business Support+ is the current plan that replaces it.
  module: "12"

- term: byte
  definition: >-
    The basic unit of data size, about one letter of text. Larger sizes are counted in megabytes,
    gigabytes and terabytes: millions, billions and trillions of bytes.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: cache
  definition: >-
    A stored copy kept close by so it can be served again quickly. To cache something is to keep
    such a copy.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/06-choosing-a-database.md, guide/07-connecting-it/03-names-and-the-edge.md]
  confused_with: [origin]
  not_to_confuse: >-
    The cache is the nearby copy; the origin is where the original lives, and where the cache
    fetches from when it has no copy.
  module: "03"

- term: capability (AWS CAF)
  definition: >-
    Something an organization is able to do well, such as managing its cloud spending, built from
    people, processes and tools. The CAF groups its capabilities into six perspectives.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: capacity
  definition: >-
    How much work a system can do.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  confused_with: [demand]
  not_to_confuse: >-
    Capacity is the work a system can do; demand is the work asked of it, and the gap between them
    is idle capacity or lost sales.
  module: "02"

- term: Capacity Reservation
  definition: >-
    EC2 capacity held for one instance type in one Availability Zone, so launches succeed when
    needed. It bills at the On-Demand rate whether used or not, and gives no discount of its own.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [zonal Reserved Instance]
  not_to_confuse: >-
    A Capacity Reservation guarantees capacity with no discount and, for immediate use, no long
    commitment; a zonal Reserved Instance holds capacity and discounts it, for a one- or three-year
    commitment.
  module: "11"

- term: capital expense
  abbreviation: CapEx
  definition: >-
    Money spent up front on things that last for years, such as servers or a building.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  also_in: [guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md]
  confused_with: [operating expense, fixed expense]
  not_to_confuse: >-
    Capital versus operating is about when you pay (up front or as you go); fixed versus variable is
    about whether use drives the cost.
  module: "02"

- term: case severity
  definition: >-
    How serious you say a problem is when you open a technical support case, from general guidance
    to a business-critical system down. It sets which first-response target applies.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md]
  confused_with: [severity]
  not_to_confuse: >-
    Case severity is how serious you say your problem is when you open a support case; a finding's
    severity is a security service's estimate of how urgent a finding is.
  module: "12"

- term: certificate (TLS)
  definition: >-
    A digital document that proves to a browser that a site is who it claims to be, and makes TLS
    possible. Certificates expire, so they must be renewed.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  confused_with: [encryption key]
  not_to_confuse: >-
    A certificate proves a site's identity so TLS can protect data in transit; an encryption key is
    the secret number that scrambles data, for example at rest.
  module: "09"

- term: certificate authority
  definition: >-
    An organization that issues certificates, only after checking that the requester owns or
    controls the name. It checks control of the name, not the honesty of the business behind it.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: change data capture
  definition: >-
    Copying each new change from a source database after the first full copy, so the target stays in
    step until you switch over. AWS DMS does it, and it is how the exam's database replication
    migration strategy works.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: change set
  definition: >-
    A preview of what an update to a CloudFormation stack would add, change, replace or remove,
    shown before anything happens. It doesn't promise that the update will succeed.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  confused_with: [drift detection]
  not_to_confuse: >-
    A change set previews a change you're about to make through the template; drift detection
    reports changes already made by hand, outside the template.
  module: "08"

- term: check category (Trusted Advisor)
  definition: >-
    One of Trusted Advisor's six groups of checks: cost optimization, performance, security, fault
    tolerance, service limits and operational excellence. Older material often lists five, leaving
    out operational excellence.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [pillar]
  not_to_confuse: >-
    Check categories are folders of automatic checks on your account; Well-Architected pillars are
    guidance you apply in a review, and sustainability has no category.
  module: "12"

- term: CIDR block
  definition: >-
    A way to write a range of IP addresses, such as 10.0.0.0/16 for every address starting 10.0. A
    smaller number after the slash means a bigger range; 0.0.0.0/0 means every address.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  module: "07"

- term: ciphertext
  definition: >-
    Data scrambled by encryption, which can't be read without the right key.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  confused_with: [plaintext]
  not_to_confuse: >-
    Ciphertext is scrambled and useless without the key; plaintext is the readable data before
    encryption or after decryption.
  module: "09"

- term: Classic Load Balancer
  definition: >-
    The previous generation of Elastic Load Balancing. AWS recommends moving to a current type, so
    recognize the name but don't choose it for new work.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  confused_with: [Application Load Balancer]
  not_to_confuse: >-
    The Classic Load Balancer is not a current peer of the ALB, NLB and GWLB; it is the older
    generation they replace.
  module: "06"

- term: client
  definition: >-
    A computer or program that sends a request to a server and gets back a response, such as a
    browser asking a website for a page. The client always speaks first.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [server]
  not_to_confuse: >-
    A client sends requests and a server waits for them and answers, but the same computer can be
    either, depending on what it is doing.
  module: "01"

- term: client-side encryption
  definition: >-
    Encrypting data yourself before you upload it, and managing the keys and tools yourself.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [server-side encryption]
  not_to_confuse: >-
    Client-side encryption happens before the data leaves you; server-side encryption is done by S3
    as it stores the data.
  module: "05"

- term: close-out
  definition: >-
    The final sweep of an account when its work is done: find every leftover by tag, by name and on
    the bill, delete on purpose, keep the guardrails, and check the bill again the next day.
  taught_in: guide/14-capstone/03-lab-19-close-out.md
  module: "14"

- term: closed to new customers
  definition: >-
    A stage in a service's retirement: customers who already use it keep using it, but new customers
    can't start. This guide still teaches such a service while the exam lists it, but never uses it
    in a lab.
  taught_in: guide/00-start-here/04-aws-changes-fast.md
  confused_with: [end of support, shut down]
  not_to_confuse: >-
    Closed to new customers means existing users carry on; end of support means a stop date has been
    set; shut down means the service is gone.
  module: "00"

- term: cloud computing
  definition: >-
    Renting IT resources from a provider on demand, over the internet, and paying as you go. All
    three features are needed: renting a server for a fixed term in someone else's building, for
    example, isn't cloud computing.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  module: "02"

- term: cloud deployment
  definition: >-
    A deployment model in which every part of a system runs in the cloud, whether it was built there
    or moved there.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  confused_with: [hybrid deployment]
  not_to_confuse: >-
    In a cloud deployment every part runs at a cloud provider, even if there are two providers; in a
    hybrid deployment some connected parts don't run in the cloud at all.
  module: "02"

- term: cloud financial management
  definition: >-
    Tracking and controlling cloud spending once it starts, including the licenses you own and those
    included with cloud resources: a CAF Governance capability, and a Well-Architected cost
    optimization design principle.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in:
    - guide/11-paying-for-aws/03-estimate-watch-analyze.md
    - guide/13-moving-to-aws/05-sim-portfolio-sorter.md
  module: "13"

- term: cloud provider
  definition: >-
    A company that owns data centers and rents IT resources to others over the internet. AWS is one.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  module: "02"

- term: cloud readiness
  definition: >-
    How well an organization can use the cloud to change, which the CAF says rests on its
    capabilities.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: cloud-native
  definition: >-
    Designed to use cloud features such as managed services, automatic scaling and serverless
    computing, rather than only running on cloud servers.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  module: "13"

- term: CloudTrail Lake
  definition: >-
    CloudTrail's feature for storing events and querying them with SQL. It is closed to new
    customers (see the lesson), and AWS points them to Amazon CloudWatch; CloudTrail itself and its
    trails are unaffected.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  module: "09"

- term: CloudWatch agent
  definition: >-
    Software you install on EC2 instances or on-premises servers to send CloudWatch measurements
    from inside the operating system, such as memory used, and log files. Its metrics are billed as
    custom metrics.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: CloudWatch Logs Insights
  definition: >-
    A CloudWatch feature for searching and summarizing log data with queries, such as every line
    containing an error in the last hour.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [metric filter]
  not_to_confuse: >-
    Logs Insights searches log lines when you ask it a question; a metric filter keeps counting
    matching lines as a metric that an alarm can watch.
  module: "08"

- term: code
  definition: >-
    The instructions of a program, written in a programming language such as Python.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: column
  definition: >-
    One fact that every record in a database table has, such as the pickup date. Each column has a
    type, such as date, which the database engine enforces.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [row]
  not_to_confuse: >-
    A column is one fact that every record has; a row is one whole record.
  module: "01"

- term: command
  definition: >-
    A line you type at a command line for the computer to run. In the AWS CLI, the word after aws,
    usually a service such as s3, is called the command.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: command line
  definition: >-
    A way to work with a computer by typing commands instead of clicking. It runs exactly what you
    type, often at once and with no undo.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: commitment
  definition: >-
    A promise to pay for a set amount of use for a term of one or three years, whether you use it or
    not, in return for a lower rate. Savings Plans and Reserved Instances are commitments.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  module: "11"

- term: Common Vulnerabilities and Exposures
  abbreviation: CVE
  definition: >-
    A public, numbered entry for one known software flaw. Scanners such as Amazon Inspector match
    installed software against these entries.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  module: "09"

- term: compensatory scoring
  definition: >-
    Passing on your total score for the whole exam, not domain by domain, so strength in one domain
    can make up for weakness in another.
  taught_in: guide/00-start-here/03-the-exam-at-a-glance.md
  module: "00"

- term: compliance
  definition: >-
    Meeting the rules that apply to you, from laws, regulators, industry standards or contracts.
    Each such rule is a compliance requirement, and one can rule out a Region however cheap or close
    it is.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  also_in: [guide/03-aws-around-the-world/02-choosing-a-region.md, guide/09-protecting-and-governing/05-compliance-and-governance.md]
  confused_with: [audit]
  not_to_confuse: >-
    Compliance is meeting the rules; an audit is the independent check that your controls exist and
    work.
  module: "04"

- term: compliance program
  definition: >-
    A standard, law or framework that AWS is audited against or aligns with, such as SOC 2, ISO
    27001, PCI DSS or HIPAA. Which ones apply to you depends on your industry and country.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: compute
  definition: >-
    Processing power to run programs; one of the main IT resources.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  module: "02"

- term: compute environment
  definition: >-
    In AWS Batch, the set of servers jobs run on: EC2 instances, On-Demand or Spot, or Fargate. In a
    managed compute environment AWS provisions the servers; in an unmanaged one you run them.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: compute optimized
  definition: >-
    EC2 instance types with more processor power for their memory, for work that keeps the
    processors busy, such as batch processing, media transcoding and game servers. Its letter is C.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [memory optimized, accelerated computing, general purpose (instance family)]
  not_to_confuse: >-
    Compute optimized adds ordinary processor power; memory optimized adds memory, and accelerated
    computing adds GPUs or other special chips.
  module: "06"

- term: Compute Savings Plan
  definition: >-
    The most flexible Savings Plan: it discounts EC2 in any family, size, Region, operating system
    or tenancy, and also Fargate and Lambda, for a smaller maximum discount.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [EC2 Instance Savings Plan]
  not_to_confuse: >-
    A Compute Savings Plan keeps applying when you change family, Region or compute service; an EC2
    Instance Savings Plan stays with one family in one Region for a deeper discount.
  module: "11"

- term: Condition (policy element)
  definition: >-
    An optional part of a policy statement that adds "only when", such as only when the request was
    made with MFA.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: Config rule
  definition: >-
    An AWS Config check that compares each resource with a setting you want and marks it compliant
    or noncompliant, such as the AWS managed rule restricted-ssh. It changes nothing unless you
    attach a fix.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/09-sim-config-timeline.md]
  confused_with: [conformance pack]
  not_to_confuse: >-
    A Config rule checks one setting; a conformance pack bundles many rules, with optional fixes,
    deployed and reported on as one unit.
  module: "09"

- term: configuration item
  definition: >-
    AWS Config's point-in-time record of one resource's settings, saved each time the resource
    changes and linked to the CloudTrail event behind the change. It stays true until the next item
    replaces it.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/09-sim-config-timeline.md]
  confused_with: [event (CloudTrail)]
  not_to_confuse: >-
    A configuration item records what a resource looked like after a change; a CloudTrail event
    records the request that made the change, and who sent it.
  module: "09"

- term: configuration management
  definition: >-
    Keeping systems set up correctly. A shared control: AWS keeps its own devices set up, and you
    keep your operating systems, databases, applications and AWS resource settings set up.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  module: "04"

- term: configuration recorder
  definition: >-
    The AWS Config setting that turns recording on and chooses which resource types to record.
    Config records nothing until you set it up, and it keeps recording, and charging, until you stop
    it.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/09-sim-config-timeline.md]
  module: "09"

- term: conformance pack
  definition: >-
    A set of AWS Config rules, with optional fixes, deployed and reported on as one unit, also
    across an organization. AWS points former Audit Manager users to it; it checks only what a rule
    can test.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md, guide/09-protecting-and-governing/09-sim-config-timeline.md]
  confused_with: [Config rule, AWS Audit Manager]
  not_to_confuse: >-
    A conformance pack bundles many Config rules into one unit; a Config rule checks one setting,
    and Audit Manager, an older evidence service, can't be set up in new accounts.
  module: "09"

- term: consolidated billing
  definition: >-
    The AWS Organizations feature by which the management account receives and pays one bill for
    every account in the organization, sees each account's charges, and gets combined volume pricing
    and shared commitment discounts.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in:
    - guide/09-protecting-and-governing/05-compliance-and-governance.md
    - guide/09-protecting-and-governing/10-sim-organizations-and-scps.md
  module: "11"

- term: constraint (Service Catalog)
  definition: >-
    A limit on launching a Service Catalog product. A template constraint narrows choices, such as
    instance types; a launch constraint names an IAM role that builds the product, so users need no
    permissions on the services underneath.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  module: "08"

- term: consumer
  definition: >-
    The part of an application that receives messages or records and processes them, such as a
    packing worker taking orders from an SQS queue, or your own program reading a Kinesis data
    stream.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/10-data-ai-and-more/01-analytics-in-five-verbs.md]
  module: "08"

- term: contact center
  definition: >-
    The system a business uses to handle customer calls, chats and messages; the people who answer
    are agents. Amazon Connect Customer is AWS's cloud contact center.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: container
  definition: >-
    A standard package of an application's code with the libraries and settings it depends on, so it
    runs the same on a laptop or on AWS. It is software, not a place to store data like an S3
    bucket.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/01-on-ramp/04-data-centers-and-virtualization.md]
  module: "06"

- term: container image
  definition: >-
    The template a container starts from, built once so that every container started from it is
    identical. Images are kept in a container registry.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: container registry
  definition: >-
    A store of container images, from which an orchestrator pulls an image when it starts a
    container. Amazon ECR is AWS's.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: content delivery network
  abbreviation: CDN
  definition: >-
    A network of servers in many places that keeps copies of content near users, so it arrives
    faster. Amazon CloudFront is AWS's CDN.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in: [guide/07-connecting-it/03-names-and-the-edge.md]
  confused_with: [Domain Name System]
  not_to_confuse: >-
    A CDN delivers the content itself from nearby copies; DNS only tells users where to find it.
  module: "03"

- term: continuous delivery
  abbreviation: CD
  definition: >-
    Preparing every code change that passes its tests for release automatically, while a person, a
    test or a rule decides when it goes live. AWS CodePipeline runs this process.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [continuous integration]
  not_to_confuse: >-
    Continuous delivery carries every passing change up to release; continuous integration is the
    earlier part, building and testing every change soon after it's made.
  module: "08"

- term: continuous integration
  abbreviation: CI
  definition: >-
    Building and testing every code change automatically, soon after it's made. On AWS, AWS
    CodeBuild does this step.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [continuous delivery]
  not_to_confuse: >-
    Continuous integration builds and tests every change; continuous delivery goes on to prepare
    every passing change for release, while a person, test or rule decides when it goes live.
  module: "08"

- term: control plane
  definition: >-
    The part of an orchestration system that makes the decisions about where containers run. In
    Amazon EKS, AWS manages the Kubernetes control plane for you.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: Control Tower control
  definition: >-
    A plain-language rule that AWS Control Tower applies to a whole OU: preventive, built from SCPs
    and RCPs; detective, from Config rules; or proactive, checking CloudFormation resources before
    creation. AWS used to call them guardrails.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in:
    - guide/09-protecting-and-governing/06-a-defense-map.md
    - guide/09-protecting-and-governing/10-sim-organizations-and-scps.md
  confused_with: [IT control]
  not_to_confuse: >-
    A Control Tower control is a specific rule applied to an OU; an IT control is any checkable
    safeguard, such as a rule, process or setting, that lowers a risk.
  module: "09"

- term: Convertible Reserved Instance
  definition: >-
    A Reserved Instance you can exchange for another Convertible one with a different family,
    operating system or tenancy, of equal or higher value, in the same Region. It discounts less
    than Standard and can't be sold.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [Standard Reserved Instance]
  not_to_confuse: >-
    A Convertible Reserved Instance gives up some discount for the right to exchange it; a Standard
    one discounts more and can be sold, but never exchanged.
  module: "11"

- term: core
  definition: >-
    One processing unit inside a processor. A processor with several cores can work on several
    things at once.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: cost allocation tag
  definition: >-
    A tag key activated for billing, so Cost Explorer, Budgets, anomaly monitors and the CUR can
    group costs by it. The two types are AWS-generated and user-defined.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in: [guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md]
  confused_with: [tag]
  not_to_confuse: >-
    Any tag labels a resource so you can find it; only a key activated as a cost allocation tag
    reaches billing tools, and only for usage from activation on.
  module: "11"

- term: cost category
  definition: >-
    A set of ordered rules that assigns each cost to a name the business uses, such as a team, by
    account, tag, service, Region and more. It appears in Cost Explorer, Budgets and the CUR.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  module: "11"

- term: cost driver
  definition: >-
    The quantity that makes a charge go up, such as hours run, GB stored, requests made or GB sent
    out. Each line of a bill is a driver's quantity times its rate.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: cost monitor
  definition: >-
    In AWS Cost Anomaly Detection, the setting that says what to watch: all AWS services, or chosen
    accounts, cost allocation tags or cost categories.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: cost optimization pillar
  definition: >-
    The Well-Architected pillar that asks whether a workload delivers its value at the lowest cost.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [sustainability pillar]
  not_to_confuse: >-
    Both pillars fight waste, but cost optimization measures money and sustainability measures
    resources and energy.
  module: "02"

- term: crawler
  definition: >-
    An AWS Glue program that scans your data, works out its columns and adds tables to the Glue Data
    Catalog, so nobody has to type them in.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: credential report
  definition: >-
    A downloadable IAM file (CSV) listing every IAM user in the account and the state of their
    credentials: password and its last use, MFA, and each access key's last rotation and use.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  module: "09"

- term: credentials
  definition: >-
    What an identity shows to prove who it is: a password, an MFA device, an access key, or a
    temporary token.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  module: "04"

- term: credits (Free Tier)
  definition: >-
    Money AWS gives a new customer at sign-up, with more for completing short activities, that pays
    for usage beyond the Always Free allowances. Amounts and expiry are in the lesson.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: cross-account role
  definition: >-
    A role in the account that owns the resources, whose trust policy names another account that may
    assume it. People there get temporary credentials, with no second IAM user.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  confused_with: [resource-based policy]
  not_to_confuse: >-
    With a cross-account role, the other account's users assume a role in your account; with a
    resource-based policy, they use one resource directly without assuming anything.
  module: "04"

- term: cross-site scripting
  definition: >-
    Planting a script in a web page so that it runs in other visitors' browsers. AWS WAF has rules
    that match it.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  confused_with: [SQL injection]
  not_to_confuse: >-
    Cross-site scripting attacks other visitors' browsers through a page; SQL injection attacks the
    site's own database through a form field.
  module: "09"

- term: CUR 2.0
  definition: >-
    The current version of the Cost and Usage Report, created as an export in AWS Data Exports,
    which AWS calls the recommended way to get this data. The original report is now the legacy
    export.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/04-many-accounts-one-bill.md]
  module: "11"

- term: current version
  definition: >-
    The newest version of an object in a versioned bucket, which is what people see. After a plain
    delete, the current version is a delete marker.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  confused_with: [noncurrent version]
  not_to_confuse: >-
    The current version is what a plain request returns; noncurrent versions are older ones kept
    underneath, still stored and billed.
  module: "05"

- term: custom key store
  definition: >-
    An AWS KMS feature that keeps KMS keys in your own CloudHSM cluster, so services that use KMS,
    such as S3 and RDS, can use keys held in HSMs only you control.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: custom metric
  definition: >-
    A metric that your own code or the CloudWatch agent sends to CloudWatch, such as orders failed
    or an instance's memory use. Custom metrics are charged.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: customer gateway device
  definition: >-
    Your router or firewall at the office end of a Site-to-Site VPN. Setting it up and using both
    tunnels is your side of the line.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [virtual private gateway]
  not_to_confuse: >-
    The customer gateway device is your end of the VPN; the virtual private gateway is AWS's end,
    attached to a VPC.
  module: "07"

- term: customer managed key
  definition: >-
    A KMS key you create. You write its key policy, choose its rotation and can disable or delete
    it; each use shows in CloudTrail. It carries a monthly fee.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [AWS managed key, AWS owned key]
  not_to_confuse: >-
    Only a customer managed key lets you write the key policy and decide who may decrypt; AWS
    controls an AWS managed key, and an AWS owned key isn't even visible to you.
  module: "09"

- term: customer managed policy
  definition: >-
    A permissions policy you write and manage yourself, which you can attach to many identities; the
    usual way to apply least privilege.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md, guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md]
  exam_name: custom policy
  confused_with: [AWS managed policy, inline policy]
  not_to_confuse: >-
    A customer managed policy is yours and reusable; an AWS managed policy is AWS's and shared by
    every customer, and an inline policy belongs to one identity only.
  module: "04"

- term: customer-specific control
  definition: >-
    A control that depends only on what you build, so only you can do it, such as keeping certain
    data in certain protected areas.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  confused_with: [inherited control, shared control]
  not_to_confuse: >-
    A customer-specific control is yours alone because it comes from what you build; an inherited
    control is AWS's alone, and a shared control is done by both sides on their own things.
  module: "04"

- term: cutover
  definition: >-
    The planned moment you switch users from the old system to the new one in AWS. Copying can run
    for days; cutover is a short switch.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: dashboard (CloudWatch)
  definition: >-
    A CloudWatch screen of chosen graphs, numbers and alarms, so someone can see a workload's health
    at a glance. It shows data; it sends nothing.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [AWS Health Dashboard]
  not_to_confuse: >-
    A CloudWatch dashboard shows the metrics and alarms you choose about your own workload; the AWS
    Health Dashboard shows events about AWS's services and your account, with no setup.
  module: "08"

- term: data catalog
  definition: >-
    A list of what data you have, where it is and what its columns are: metadata about the data, not
    the data itself. The AWS Glue Data Catalog is AWS's.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: data center
  definition: >-
    A building that holds servers, storage and network equipment, with the power and cooling they
    need.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in:
    - guide/02-why-the-cloud/01-what-cloud-computing-is.md
    - guide/01-on-ramp/04-data-centers-and-virtualization.md
  confused_with: [Availability Zone]
  not_to_confuse: >-
    A data center is one building; an Availability Zone is one or more data centers, and on AWS you
    choose Availability Zones, never buildings.
  module: "03"

- term: data classification
  definition: >-
    Sorting data by how sensitive it is, which comes before choosing how to protect it. Amazon Macie
    helps by finding sensitive data in S3.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: data event
  definition: >-
    A CloudTrail event for an action on the data inside a resource, such as reading an object in a
    bucket. Data events aren't recorded unless you turn them on, and they are charged.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/09-sim-config-timeline.md]
  confused_with: [management event]
  not_to_confuse: >-
    Data events record actions on the data inside a resource and must be turned on, for a charge;
    management events record changes to resources and settings and are in Event history by default.
  module: "08"

- term: data in use
  definition: >-
    Data in memory while a program works on it: a third state beside data at rest and data in
    transit, beyond the scope of this exam.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: data key
  definition: >-
    The key a service actually encrypts your data with. The service gets it from AWS KMS and stores
    it only in encrypted form, protected by your KMS key.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [KMS key]
  not_to_confuse: >-
    A data key encrypts the data itself and is stored, encrypted, beside it; the KMS key stays
    inside KMS and protects the data keys.
  module: "09"

- term: data lake
  definition: >-
    One central store that keeps data of many kinds in its original form, for analysis later. On AWS
    it's usually an S3 bucket, which services such as Athena query in place.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [data warehouse]
  not_to_confuse: >-
    A data lake keeps raw files in their original form, usually in S3; a data warehouse such as
    Redshift holds data loaded into it and organized for repeated, complex reports.
  module: "10"

- term: data model
  definition: >-
    The shape a database gives your data: relational tables, key-value items, documents, a graph,
    data held in memory, or a data warehouse. Each AWS database is built for one shape.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: data pipeline
  definition: >-
    The path data takes from where it's created to the screen where someone reads the answer. On AWS
    each analytics service does one step: ingest, catalog, query, search or visualize.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: data point
  definition: >-
    One value of a CloudWatch metric at one moment. An alarm combines each period's data points into
    one value with a statistic.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: data residency
  definition: >-
    Where data is physically stored.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  confused_with: [data sovereignty]
  not_to_confuse: >-
    Data residency is only where the data sits; data sovereignty is whose control and laws the data
    is under, which often decides where it may sit.
  module: "03"

- term: data scanned
  definition: >-
    How much data an Athena query read, shown in its statistics. Athena bills each query by it, with
    a minimum per query (see the lesson), so storing data so queries read less costs less.
  taught_in: guide/10-data-ai-and-more/04-lab-13-athena-query.md
  module: "10"

- term: data sovereignty
  definition: >-
    Keeping data under the control and the laws that apply to it, which often means keeping it in
    particular countries. AWS gives no single definition; the exam lists it as a reason to use more
    than one Region.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  confused_with: [data residency]
  not_to_confuse: >-
    Data sovereignty is about whose control and laws apply to the data; data residency is just where
    it is stored.
  module: "03"

- term: data transfer
  definition: >-
    Data moving into, within or out of AWS, billed per GB by direction. Data in from the internet is
    free, but data out to the internet, between Regions and across Availability Zones is charged
    (see the lesson).
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  also_in:
    - guide/07-connecting-it/01-your-own-network.md
    - guide/11-paying-for-aws/01-how-aws-charges.md
  module: "07"

- term: data transfer out
  definition: >-
    Data leaving AWS for the internet, or leaving one Availability Zone or Region for another. Out
    is the direction that usually costs; data in from the internet is free.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: data warehouse
  definition: >-
    A database built to analyze large amounts of historical data gathered from many sources, through
    fewer, much larger queries. Amazon Redshift is AWS's; it studies the business rather than
    running it.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/10-data-ai-and-more/01-analytics-in-five-verbs.md]
  confused_with: [data lake]
  not_to_confuse: >-
    A data warehouse holds data loaded and organized for repeated, complex reports; a data lake
    keeps raw data of many kinds in its original form, usually in S3.
  module: "05"

- term: database
  definition: >-
    An organized store of records, run by a database engine that keeps them in order, lets many
    people change them at once without losing work, and answers questions about them; one of the
    main IT resources.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  also_in:
    - guide/02-why-the-cloud/01-what-cloud-computing-is.md
    - guide/05-storing-data/05-managed-or-self-managed-databases.md
    - guide/05-storing-data/06-choosing-a-database.md
  confused_with: [file]
  not_to_confuse: >-
    A database puts one engine in charge of many small records; a file is one whole thing each
    program opens and saves itself, and a spreadsheet is a file.
  module: "01"

- term: database engine
  definition: >-
    The database software itself, such as MySQL, PostgreSQL or Microsoft SQL Server.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in:
    - guide/05-storing-data/06-choosing-a-database.md
    - guide/01-on-ramp/03-files-vs-databases.md
  module: "05"

- term: database migration
  definition: >-
    Moving a database into AWS from somewhere else, such as an on-premises server, or between
    databases. AWS DMS moves the data, and AWS SCT converts the schema when the engine changes.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: database replication
  definition: >-
    Copying a database to AWS while the source keeps running, then copying every new change until
    the switch-over, as AWS DMS does. The exam names it as a migration strategy; it's a technique
    used inside one.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  module: "13"

- term: Database Savings Plan
  definition: >-
    A Savings Plan for database services such as Aurora, RDS, DynamoDB and ElastiCache, across
    engines, sizes and Regions. It comes with a one-year term and no upfront payment only.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  module: "11"

- term: DB instance
  definition: >-
    Amazon RDS's name for one running database server, whose size you choose and pay for while it
    runs.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  module: "05"

- term: DDoS cost protection
  definition: >-
    A Shield Advanced feature: credits for the extra charges an attack causes, such as servers that
    Auto Scaling launched to absorb it, requested through AWS Support.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  module: "09"

- term: dead-letter queue
  definition: >-
    A queue that collects messages that keep failing, so one bad message doesn't block the rest and
    someone can look at it later.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: decoupling
  definition: >-
    Putting something, such as a queue, topic or event bus, between two parts so each can fail, slow
    down or grow without breaking the other. Parts joined this way are loosely coupled.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: dedicated connection
  definition: >-
    A Direct Connect connection on a physical port for you alone, at a fixed speed.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [hosted connection]
  not_to_confuse: >-
    A dedicated connection is your own port at a Direct Connect location; a hosted connection comes
    to you through an AWS Direct Connect Partner.
  module: "07"

- term: Dedicated Host
  definition: >-
    A whole physical EC2 server for your use, billed per host, that shows its sockets, cores and
    host ID and keeps your instances on it. It suits software licensed per socket or core.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    - guide/13-moving-to-aws/04-the-business-case.md
  confused_with: [Dedicated Instance]
  not_to_confuse: >-
    A Dedicated Host is a whole server you can see, for licenses counted per socket or core; a
    Dedicated Instance only guarantees hardware no other customer uses, and shows nothing of it.
  module: "11"

- term: Dedicated Instance
  definition: >-
    An EC2 instance on hardware used only by your account, billed per instance plus a Region fee.
    AWS places it, shows you nothing of the hardware, and may move it after a stop and start.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [Dedicated Host]
  not_to_confuse: >-
    A Dedicated Instance meets a rule against shared hardware without showing it; a Dedicated Host
    is a whole server you can see and control, for licenses counted per socket or core.
  module: "11"

- term: default VPC
  definition: >-
    The VPC AWS creates in each Region of every account, with a public subnet in every Availability
    Zone, an internet gateway and automatic public IPv4 addresses. It's handy for a first test, but
    every subnet in it is public.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  module: "07"

- term: defense in depth
  definition: >-
    Several independent layers of controls, from the edge to the organization, so that an attacker
    must beat all of them and a mistake in one is caught by another.
  taught_in: guide/09-protecting-and-governing/06-a-defense-map.md
  module: "09"

- term: delete marker
  definition: >-
    A placeholder S3 puts on top of an object when you delete it in a versioned bucket without
    naming a version. The object looks gone, but its versions are still there; deleting the marker
    brings it back.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  module: "05"

- term: demand
  definition: >-
    How much work customers ask a system to do, such as orders per hour.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  confused_with: [capacity]
  not_to_confuse: >-
    Demand is the work asked of a system; capacity is the work it can do.
  module: "02"

- term: demand curve
  definition: >-
    A chart of demand over time. Drawn against a flat line for the capacity you own, it shows idle
    capacity below the line and lost sales above it.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  module: "02"

- term: denial-of-service attack
  abbreviation: DoS
  definition: >-
    An attempt to make a site or service unavailable to its real users, usually by overwhelming it.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  module: "09"

- term: dependency
  definition: >-
    A link between servers or applications, such as an ordering app that calls a database. Servers
    that depend on each other usually move together in one wave.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: deployment model
  definition: >-
    Where the parts of a system run. AWS names three: cloud, hybrid and on-premises. "Public,
    private, community" is a different vocabulary, not AWS's.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  module: "02"

- term: design principle
  definition: >-
    A short, named idea in the Well-Architected Framework that guides decisions, such as "stop
    guessing your capacity needs". There are general principles and principles for each pillar.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [best practice]
  not_to_confuse: >-
    A design principle is a broad guiding idea; a best practice is a specific recommended action
    with an ID.
  module: "02"

- term: desired capacity
  definition: >-
    How many instances an Auto Scaling group should run right now, always between its minimum and
    maximum. A scaling policy, a schedule or a person changes it, and the group launches or
    terminates instances to match.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [minimum capacity, maximum capacity]
  not_to_confuse: >-
    The desired capacity moves with demand; the minimum and maximum are the fixed limits it moves
    between.
  module: "06"

- term: detailed monitoring
  definition: >-
    An EC2 option that sends the same CloudWatch metrics as basic monitoring every minute instead of
    every 5, for a charge.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [basic monitoring]
  not_to_confuse: >-
    Detailed monitoring sends EC2's metrics every minute, for a charge; basic monitoring, the free
    default, sends them every 5 minutes.
  module: "08"

- term: detective control
  definition: >-
    A control that notices and records something after it happens, such as a CloudTrail record, a
    GuardDuty finding or an AWS Config rule.
  taught_in: guide/09-protecting-and-governing/06-a-defense-map.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md]
  confused_with: [preventive control]
  not_to_confuse: >-
    A detective control finds and records a problem afterward; a preventive control stops it
    beforehand, and a sound plan pairs the two for every threat.
  module: "09"

- term: Developer Support
  definition: >-
    A retiring Support plan, closed to new subscriptions, that ends on a set date (see the lesson).
    Today's equivalent is Business Support+; customers who don't choose it fall back to Basic.
  taught_in: guide/12-getting-help/01-support-plans.md
  confused_with: [AWS Business Support+]
  not_to_confuse: >-
    Developer Support is a retiring plan from older material; Business Support+ is the current plan
    that replaces it, and a Developer customer moves only by choosing it.
  module: "12"

- term: Device Shadow
  definition: >-
    AWS IoT Core's stored copy of each device's last reported state, so apps can read it, or set a
    desired state, even while the device is offline.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: Direct Connect location
  definition: >-
    A data center where AWS's network and customers' networks meet, so a cable can join them for AWS
    Direct Connect.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: disaster
  definition: >-
    An event bigger than an ordinary failure. AWS names natural, technical and human kinds, so
    deleting the wrong data counts if it stops the business.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  module: "03"

- term: disaster recovery
  abbreviation: DR
  definition: >-
    Getting a whole workload working again after a disaster, usually from a separate copy in another
    Region, within limits the business sets as its RTO and RPO.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/02-choosing-a-region.md, guide/03-aws-around-the-world/06-sim-blast-radius.md]
  confused_with: [high availability, business continuity]
  not_to_confuse: >-
    Disaster recovery brings the whole workload back from a separate copy after a larger event; high
    availability keeps it running through one part failing.
  module: "03"

- term: discount sharing
  definition: >-
    Letting one account's unused Reserved Instance or Savings Plans discount cover matching usage in
    other accounts of the same organization. It's on unless the management account turns it off.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  module: "11"

- term: distributed denial-of-service attack
  abbreviation: DDoS
  definition: >-
    A denial-of-service attack from many machines at once, often thousands of hijacked devices, so
    blocking one address doesn't stop it. It comes as network floods or as floods of web requests.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/00-brief.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  module: "09"

- term: distribution
  definition: >-
    Your Amazon CloudFront setup: which origins it serves, such as an S3 bucket or a web server, and
    how it caches their content.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: DNS record
  definition: >-
    One entry in a hosted zone that maps a name to an answer, such as an address.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: DNS resolver
  definition: >-
    The DNS server, usually your internet service provider's, that finds a name's address for your
    device by asking other DNS servers, then keeps the answer for a while so later lookups are
    instant.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: Docker
  definition: >-
    A widely used tool for building and running containers.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: document database
  definition: >-
    A database in which each record is a self-contained document, usually JSON, and different
    documents can have different fields. Amazon DocumentDB is AWS's, and DynamoDB also stores
    documents.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/01-on-ramp/03-files-vs-databases.md]
  confused_with: [key-value database]
  not_to_confuse: >-
    A document database keeps self-contained documents whose fields can vary and can be searched by
    those fields; a key-value database fetches each item by its key.
  module: "05"

- term: domain
  definition: >-
    One of the four broad subject areas the CLF-C02 exam guide divides the exam into, each with its
    own share of the questions.
  taught_in: guide/00-start-here/03-the-exam-at-a-glance.md
  confused_with: [task statement, domain name]
  not_to_confuse: >-
    A domain is a broad subject area of the exam and a task statement is one specific thing a domain
    tests, while a domain name is a website's name on the internet.
  module: "00"

- term: domain name
  definition: >-
    A name people use to reach a site, such as bakery.example, which DNS turns into an address.
    Amazon Route 53 can register domain names and answer DNS questions for them.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  confused_with: [domain]
  not_to_confuse: >-
    A domain name is a site's name on the internet; an exam domain is one of the broad subject areas
    of the CLF-C02 exam.
  module: "07"

- term: Domain Name System
  abbreviation: DNS
  definition: >-
    The internet's address book: it turns a name like example.com into the network address of a
    server. Amazon Route 53 is AWS's DNS service.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in:
    - guide/07-connecting-it/03-names-and-the-edge.md
    - guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [content delivery network]
  not_to_confuse: >-
    DNS only answers where something is; a CDN delivers the content.
  module: "03"

- term: drift
  definition: >-
    A difference between a stack's resources as they are now and as its template describes them,
    usually from a change made by hand. Copies built later from the template won't have it.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  module: "08"

- term: drift detection
  definition: >-
    A CloudFormation feature that compares a stack's resources with its template and reports each as
    in sync, modified or deleted. It reports drift; it doesn't fix it.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  confused_with: [change set]
  not_to_confuse: >-
    Drift detection reports changes already made by hand, outside the template; a change set
    previews a change you're about to make through the template.
  module: "08"

- term: drill
  definition: >-
    A practice recovery that doesn't disturb the real system, to prove a recovery plan works.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  module: "05"

- term: durability
  definition: >-
    Stored data being kept safe from loss over time, so it will still exist later. It protects
    against failing hardware, not against someone deleting the data.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  also_in: [guide/03-aws-around-the-world/03-surviving-failure.md, guide/05-storing-data/01-block-file-object.md, guide/05-storing-data/02-s3-in-practice.md]
  confused_with: [high availability]
  not_to_confuse: >-
    Durability means the data still exists later; availability means it is reachable right now.
  module: "02"

- term: DynamoDB Accelerator
  abbreviation: DAX
  definition: >-
    An in-memory cache built only for DynamoDB, which turns its millisecond reads into microsecond
    reads.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [Amazon ElastiCache]
  not_to_confuse: >-
    DAX caches DynamoDB only; ElastiCache is a general in-memory cache that can sit in front of
    other stores, such as an RDS database.
  module: "05"

- term: EBS snapshot
  definition: >-
    A point-in-time copy of an EBS volume that exists on its own and outlives the volume. Stored
    Regionally, it can create volumes in any AZ of its Region and be copied to another Region or
    account; billed separately.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  module: "05"

- term: EC2 Instance Connect
  definition: >-
    A way to sign in to a Linux EC2 instance with your IAM identity and a key that lasts only
    seconds, without leaving SSH open to everyone. Each connection is logged in CloudTrail.
  taught_in: guide/06-running-applications/01-ec2.md
  module: "06"

- term: EC2 Instance Savings Plan
  definition: >-
    A Savings Plan for one EC2 instance family in one Region, in any size, operating system or
    tenancy. It gives a deeper maximum discount than a Compute Savings Plan.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [Compute Savings Plan]
  not_to_confuse: >-
    An EC2 Instance Savings Plan discounts more but stays with one family in one Region; a Compute
    Savings Plan follows any family, Region, Fargate and Lambda.
  module: "11"

- term: economies of scale
  definition: >-
    The lower cost per unit that a very large operation reaches by buying, building and running
    things in bulk. AWS says its scale leads to lower pay-as-you-go prices.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  module: "02"

- term: edge location
  definition: >-
    A small AWS site in a city, separate from the Regions, running services that deliver content and
    traffic close to internet users, such as Amazon CloudFront, Amazon Route 53 and AWS Global
    Accelerator; also called a point of presence (PoP).
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md, guide/07-connecting-it/03-names-and-the-edge.md]
  confused_with: [Region, Availability Zone, Local Zone]
  not_to_confuse: >-
    Edge locations deliver content and answer requests near users but don't run your servers; your
    servers run in a Region's Availability Zones, or in a Local Zone when they must be in a
    particular city.
  module: "03"

- term: Effect (policy element)
  definition: >-
    The part of a policy statement that says whether it allows or denies: Allow or Deny.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: Elastic IP address
  definition: >-
    A fixed public IPv4 address that you keep in your account and attach to an instance or a NAT
    gateway. Unlike the address an instance gets automatically, it survives a stop, and it is
    charged until you release it.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/07-connecting-it/01-your-own-network.md]
  confused_with: [public IP address]
  not_to_confuse: >-
    An Elastic IP address stays yours until you release it; an automatic public IP address is
    released when the instance stops, so it comes back different.
  module: "06"

- term: Elastic Load Balancing
  abbreviation: ELB
  definition: >-
    AWS's load balancing service: one front door spreading incoming traffic across healthy targets,
    such as EC2 instances, containers and IP addresses, in one or more Availability Zones. AWS
    scales the load balancer itself, and it bills by the hour.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [Amazon EC2 Auto Scaling]
  not_to_confuse: >-
    Elastic Load Balancing decides which healthy target gets each request; Amazon EC2 Auto Scaling
    decides how many instances there are.
  module: "06"

- term: elasticity
  definition: >-
    Capacity that grows when demand rises and shrinks when it falls, so you don't pay for capacity
    you no longer need. On AWS it is usually automatic, through auto scaling.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  also_in: [guide/02-why-the-cloud/07-sim-demand-curve.md, guide/06-running-applications/02-auto-scaling-and-load-balancers.md]
  confused_with: [scalability, agility]
  not_to_confuse: >-
    Elasticity is capacity following demand up and down; scalability is only the ability to grow,
    and agility is how quickly you can get something new.
  module: "02"

- term: encryption
  definition: >-
    Scrambling readable data (plaintext) into ciphertext with an encryption key, so that only
    someone with the right key can turn it back.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  module: "09"

- term: encryption at rest
  definition: >-
    Scrambling stored data, on disks, in databases and in backups, so that only someone with the key
    can read it. S3 does it for every new object, but anyone your policies allow gets the data
    decrypted.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/05-storing-data/02-s3-in-practice.md, guide/01-on-ramp/06-everyday-security.md]
  confused_with: [encryption in transit]
  not_to_confuse: >-
    Encryption at rest protects data where it is stored; encryption in transit protects it while it
    travels over the network, for example by HTTPS.
  module: "09"

- term: encryption in transit
  definition: >-
    Scrambling data while it travels over the network, for example with TLS, the protection behind
    HTTPS, so that anyone who intercepts it can't read it.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in:
    - guide/05-storing-data/02-s3-in-practice.md
    - guide/07-connecting-it/04-connecting-networks-and-offices.md
    - guide/01-on-ramp/06-everyday-security.md
  confused_with: [encryption at rest, private connection]
  not_to_confuse: >-
    Encryption in transit protects data on the move and encryption at rest protects it where it is
    stored, while a private connection only keeps data off the internet's path; none of them decides
    who may read it.
  module: "09"

- term: encryption key
  definition: >-
    A long secret number used to encrypt and decrypt data. It can be copied without anyone noticing,
    which is why AWS's key services are built never to hand keys out.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  confused_with: [key (S3)]
  not_to_confuse: >-
    An encryption key is a secret number that scrambles data; an S3 key is just the name of an
    object in a bucket.
  module: "09"

- term: end of support
  definition: >-
    The stage after a service closes to new customers, when AWS announces the date it will stop,
    often about a year ahead.
  taught_in: guide/00-start-here/04-aws-changes-fast.md
  confused_with: [closed to new customers, shut down]
  not_to_confuse: >-
    End of support sets the date a service stops; closed to new customers only stops new sign-ups,
    and shut down means the date has passed and the service is gone.
  module: "00"

- term: end-user computing
  definition: >-
    The exam's name for services that give people a computer, an app or a browser that runs in AWS:
    Amazon WorkSpaces, WorkSpaces Applications and WorkSpaces Secure Browser.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: endpoint
  definition: >-
    Where an application or API receives traffic, such as a service's web address, a load balancer
    or an EC2 instance. AWS Global Accelerator sends each user's traffic to the best healthy
    endpoint in a Region.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  also_in: [guide/01-on-ramp/05-apis-command-line-and-json.md]
  confused_with: [VPC endpoint]
  not_to_confuse: >-
    An endpoint is where an application receives traffic; a VPC endpoint is a private path from your
    VPC out to an AWS service.
  module: "07"

- term: endpoint service
  definition: >-
    A service that its owner publishes through AWS PrivateLink, behind a Network Load Balancer, so
    other VPCs can reach it through interface endpoints.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: Enterprise On-Ramp
  definition: >-
    A retiring Support plan that sat between Business and Enterprise and ends on a set date (see the
    lesson). AWS is moving its customers to Enterprise Support automatically.
  taught_in: guide/12-getting-help/01-support-plans.md
  confused_with: [AWS Enterprise Support]
  not_to_confuse: >-
    Enterprise On-Ramp is a retiring plan from older material; Enterprise Support continues, and
    On-Ramp customers are being moved into it.
  module: "12"

- term: entitlement
  definition: >-
    Your right to use a product you've bought, recorded as a license. In AWS Marketplace,
    subscribing creates licenses, which AWS License Manager can share with your other accounts.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: entity
  definition: >-
    A named thing a text mentions, such as a person, place, organization or date. Amazon Comprehend
    finds entities, for example a delivery partner's name in reviews.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: environment (Elastic Beanstalk)
  definition: >-
    In AWS Elastic Beanstalk, the set of AWS resources that runs one version of your application.
    Its resources keep billing until you delete it.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: environmental, social and governance
  abbreviation: ESG
  definition: >-
    How an organization treats the planet, people and its own management. Improving ESG performance
    is one of the CAF's four business outcomes.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: Envision phase
  definition: >-
    The first CAF phase: showing how the cloud will speed up business outcomes, and choosing
    opportunities, each tied to a stakeholder and a measurable outcome.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: ephemeral port
  definition: >-
    The temporary high-numbered port the client end of a conversation uses, to which replies are
    sent. A network ACL needs a rule allowing these ports for replies; a security group doesn't.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md, guide/07-connecting-it/06-sim-packet-journey.md]
  module: "07"

- term: estimate
  definition: >-
    A cost worked out from assumptions about something that doesn't exist yet, as the AWS Pricing
    Calculator produces. It's only as good as its inputs.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  also_in: [guide/11-paying-for-aws/05-lab-15-pricing-calculator.md]
  confused_with: [forecast]
  not_to_confuse: >-
    An estimate prices something not yet built, from your assumptions; a forecast predicts future
    cost from your own past usage.
  module: "11"

- term: estimate link
  definition: >-
    The public address that reopens a saved Pricing Calculator estimate. Anyone who has it can read
    the estimate, so keep names and account IDs out of it.
  taught_in: guide/11-paying-for-aws/05-lab-15-pricing-calculator.md
  module: "11"

- term: event
  definition: >-
    Something that happened, such as a file landing in S3, a web request or a server stopping,
    passed on as data. Events start Lambda functions, and Amazon EventBridge routes them to targets
    by rules.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/08-building-and-operating/04-connecting-parts-shipping-software.md]
  confused_with: [event (CloudTrail)]
  not_to_confuse: >-
    An event in Lambda or EventBridge is a signal that something happened, which starts code or is
    routed onward; a CloudTrail event is the record of an action someone took on your account.
  module: "06"

- term: event (CloudTrail)
  definition: >-
    In AWS CloudTrail, the record of one action taken on your account: who acted, what they did, to
    which resource, when and from where.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [event]
  not_to_confuse: >-
    A CloudTrail event records an action someone took on your account; an event in Lambda or
    EventBridge is a signal that something happened, which starts code or is routed to targets.
  module: "08"

- term: event bus
  definition: >-
    The place in Amazon EventBridge where events arrive to be matched against rules. Every account
    has a default event bus that receives events from AWS services automatically.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: Event history
  definition: >-
    The part of AWS CloudTrail that is on in every account without setup and shows recent account
    activity, one Region at a time. See the lab for how far back it goes.
  taught_in: guide/02-why-the-cloud/06-lab-01-first-resource.md
  also_in: [guide/08-building-and-operating/03-watching-workloads.md, guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [trail]
  not_to_confuse: >-
    Event history is on from the start but keeps only recent management events; a trail must be
    created beforehand and keeps events in your bucket as long as you choose.
  module: "02"

- term: event record
  definition: >-
    The full entry, written in JSON, that CloudTrail keeps for one event: who acted, when, which
    service and action, in which Region, from which address, and on which resource.
  taught_in: guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md
  module: "09"

- term: EventBridge Scheduler
  definition: >-
    An Amazon EventBridge capability that runs a task on a timetable, such as every night at 23:00,
    or once at a set time.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: execution role
  definition: >-
    The IAM role AWS Lambda assumes while a function runs, which decides what the code may touch.
    By default it allows only writing the function's logs.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  module: "06"

- term: expiration action
  definition: >-
    A lifecycle action that deletes objects a number of days after creation, such as when a
    retention period ends. In a versioned bucket, expiring the current version only adds a delete
    marker; removing noncurrent versions takes its own action.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [transition action]
  not_to_confuse: >-
    An expiration action deletes objects; a transition action moves them to another class, and
    either one billed before a class's minimum stay is over costs the rest of that stay.
  module: "05"

- term: explicit deny
  definition: >-
    A Deny statement in any policy that applies to a request. It beats every allow, wherever the
    allow is.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md, guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  confused_with: [implicit deny]
  not_to_confuse: >-
    An explicit deny is written in a policy and always wins; an implicit deny is just the default
    when nothing allows.
  module: "04"

- term: exposure finding
  definition: >-
    A finding from the unified AWS Security Hub that combines several related problems into one real
    risk, such as a flawed package on a server reachable from the internet, and shows how an
    attacker could get in.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md]
  module: "09"

- term: external table
  definition: >-
    A table definition, such as one made in Athena, that only describes data kept elsewhere: the
    columns, the separator and the S3 folder to read. Dropping it deletes the definition, not the
    files.
  taught_in: guide/10-data-ai-and-more/04-lab-13-athena-query.md
  module: "10"

- term: extract, transform, load
  abbreviation: ETL
  definition: >-
    Taking data out of a source, cleaning or reshaping it, and putting it where it will be analyzed.
    AWS Glue runs ETL jobs, for example to remove duplicate rows or convert CSV files to Parquet.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: failback
  definition: >-
    Moving work back to the original site once it is fixed, after a failover.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [failover]
  not_to_confuse: >-
    Failover moves users to a working copy when the original fails; failback moves them back once
    the original is fixed.
  module: "05"

- term: failover
  definition: >-
    Switching users from a failed copy of a system to a working one.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/04-the-edge.md, guide/05-storing-data/05-managed-or-self-managed-databases.md]
  module: "03"

- term: failover routing
  definition: >-
    A Route 53 routing policy that sends users to the main site while its health check passes, and
    to a standby when it fails, with no one acting.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [latency routing, weighted routing]
  not_to_confuse: >-
    Failover routing asks whether the main site is healthy; latency routing asks which Region is
    fastest for the user, and weighted routing what share goes where.
  module: "07"

- term: fan-out
  definition: >-
    Publishing a message once and having it copied to many receivers, as an SNS topic does for its
    subscribers, often several SQS queues that each hold it for their own worker.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: federation
  definition: >-
    Letting people sign in with an account held somewhere else, such as a company directory, and
    giving them temporary access to AWS through a role, with no IAM user. AWS recommends it for
    people.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: FIFO queue
  definition: >-
    An SQS queue type, first in, first out, that keeps messages in the order sent and processes each
    exactly once, with lower throughput than a standard queue.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [standard queue]
  not_to_confuse: >-
    A FIFO queue keeps the order and processes each message exactly once; a standard queue gives
    more throughput but may deliver a message twice or out of order.
  module: "08"

- term: file
  definition: >-
    A named piece of data kept in storage, such as a photo or a document, that a program opens and
    saves as a whole.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [database]
  not_to_confuse: >-
    A file is one whole thing that each program opens and saves itself; a database holds many small
    records that one engine lets many people search and change at once.
  module: "01"

- term: file format
  definition: >-
    How a file's contents are laid out, usually shown by the ending of its name: .jpg for a photo,
    .pdf for a document, .csv for a table as plain text.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  module: "01"

- term: file path
  definition: >-
    A file's full location in a file system, its folders and then its name, such as
    photos/cakes/birthday-cake.jpg.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  module: "01"

- term: file storage
  definition: >-
    A shared file system, with folders and file names, that many servers use over the network at the
    same time, through NFS or SMB. On AWS it is Amazon EFS or Amazon FSx.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [block storage, object storage]
  not_to_confuse: >-
    File storage is mounted by many servers at once as folders and files; block storage is one
    server's disk, and object storage answers web requests for whole objects.
  module: "05"

- term: file system
  definition: >-
    The way an operating system keeps files: a tree of folders and files, each with a name and a
    path.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [file storage]
  not_to_confuse: >-
    A file system is how files are arranged in folders; file storage is a shared file system that
    many servers use over the network at once.
  module: "01"

- term: finding
  definition: >-
    A security service's report of one possible problem, naming the resource, what was seen and how
    severe the service thinks it is. The services that raise findings report; they don't block.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  also_in: [guide/09-protecting-and-governing/08-sim-security-findings-tour.md, guide/07-connecting-it/02-filtering-traffic.md]
  module: "09"

- term: finding type
  definition: >-
    A name for the kind of problem a finding reports. GuardDuty's names give the kind of threat and
    the resource, such as UnauthorizedAccess:EC2/SSHBruteForce.
  taught_in: guide/09-protecting-and-governing/08-sim-security-findings-tour.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md]
  module: "09"

- term: firewall
  definition: >-
    Something that lets network traffic through or stops it according to rules. In a VPC, security
    groups and network ACLs are firewalls.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  module: "07"

- term: first-response time
  definition: >-
    How soon AWS aims to send the first reply to a new support case, set by your plan and the case
    severity. It's a target, not a guarantee, and not the time to fix the problem.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/06-sim-support-plan-chooser.md]
  module: "12"

- term: fixed expense
  definition: >-
    A cost that stays the same however much you use, such as servers you have bought, or rent.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  also_in: [guide/02-why-the-cloud/04-what-a-data-center-really-costs.md]
  confused_with: [variable expense, capital expense]
  not_to_confuse: >-
    Fixed or variable asks whether a cost changes with use; capital or operating asks whether you
    pay up front or as you go, so rent is fixed but operating.
  module: "02"

- term: flow (Connect Customer)
  definition: >-
    A step-by-step plan in Amazon Connect Customer deciding what happens to each contact, such as
    handing a caller to a Lex bot or putting them in a queue for an agent.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: folder
  definition: >-
    A named container in a file system that holds files and other folders; also called a directory.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  module: "01"

- term: forecast
  definition: >-
    A prediction of future cost from your past usage, as AWS Cost Explorer gives with a prediction
    interval. It needs some history to work from.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  confused_with: [estimate]
  not_to_confuse: >-
    A forecast predicts from your own past usage; an estimate prices something that doesn't exist
    yet, from your assumptions.
  module: "11"

- term: forecasted cost
  definition: >-
    AWS Budgets' prediction of cost for the whole budget period. An alert on it warns before the
    money is spent, not after.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: foundation model
  definition: >-
    A very large machine learning model trained on broad data, which many generative AI applications
    are built on. Amazon Bedrock offers foundation models from Amazon and other AI companies.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: Free plan
  definition: >-
    The Free Tier plan that never charges you: selected services only, with no Savings Plans or
    Reserved Instances. It ends a set time after sign-up or when the credits run out, and the
    account then closes.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  also_in:
    - guide/11-paying-for-aws/02-purchasing-options.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  confused_with: [Paid plan]
  not_to_confuse: >-
    The Free plan can't charge you and closes the account when it ends; the Paid plan offers every
    service and bills normal rates once the credits are used.
  module: "11"

- term: front end
  definition: >-
    The part of an app people see and touch, such as web pages or a phone app. AWS Amplify builds
    and hosts front ends.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [back end]
  not_to_confuse: >-
    The front end is what users see and touch; the back end runs behind it, holding the data,
    sign-in and business logic.
  module: "10"

- term: FullAWSAccess
  definition: >-
    The SCP AWS attaches by default to the root, every OU and every account, allowing every action.
    Remove it from a level without a replacement and every action below that level fails.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: function (AWS Lambda)
  definition: >-
    The code you upload to AWS Lambda, as a .zip file or a container image, which runs each time an
    event triggers it. Don't count on state between runs: a reused environment may keep data, but
    nothing guarantees it.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/06-running-applications/05-lab-07-a-lambda-function.md]
  module: "06"

- term: gateway endpoint
  definition: >-
    A VPC endpoint for Amazon S3 or Amazon DynamoDB only, reached through an entry in a route table.
    It has no charge.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  confused_with: [interface endpoint, NAT gateway]
  not_to_confuse: >-
    A gateway endpoint is a free route to S3 or DynamoDB; an interface endpoint is a billed address
    in your subnet that reaches many services through PrivateLink.
  module: "07"

- term: Gateway Load Balancer
  abbreviation: GWLB
  definition: >-
    The Elastic Load Balancing type that passes network traffic through third-party virtual
    appliances, such as firewalls or intrusion detection systems, and lets them scale.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  confused_with: [Application Load Balancer, Network Load Balancer]
  not_to_confuse: >-
    A GWLB is chosen for appliances that inspect traffic, not for serving users; ALB and NLB spread
    users' requests across your servers.
  module: "06"

- term: GB-month
  definition: >-
    One GB stored for one month: the unit most AWS storage is billed in, prorated for the time the
    data was actually kept.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: GB-second
  definition: >-
    The unit Lambda bills compute in: the memory given to a function, in GB, times the seconds it
    runs. Fargate bills memory in the same way.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/06-running-applications/05-lab-07-a-lambda-function.md]
  module: "06"

- term: general purpose (instance family)
  definition: >-
    EC2 instance types with a balance of processor, memory and network, for work where nothing in
    particular runs out first, such as web servers and small databases. Its letters include M and T.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [compute optimized, memory optimized]
  not_to_confuse: >-
    General purpose is the answer when no one resource runs out first; a clear processor or memory
    bottleneck points to compute optimized or memory optimized.
  module: "06"

- term: generative AI
  definition: >-
    AI that produces new content, such as text, code or images, rather than labeling what it's
    given. AWS examples include the Amazon Q assistants and the foundation models in Amazon Bedrock.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: geolocation routing
  definition: >-
    A Route 53 routing policy that chooses the answer by where the user is, by country or continent,
    for content or rules that differ by location.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [latency routing]
  not_to_confuse: >-
    Geolocation routing follows a rule about the user's location; latency routing follows measured
    speed, so it can't guarantee a country is served from a given Region.
  module: "07"

- term: GiB
  definition: >-
    Gibibyte: a unit based on powers of two, 1,073,741,824 bytes, about 7% more than a gigabyte. AWS
    often states server memory in it, such as 8 GiB.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in: [guide/06-running-applications/01-ec2.md]
  confused_with: [gigabyte]
  not_to_confuse: >-
    A GiB is 1,073,741,824 bytes; a gigabyte is exactly a billion, so the GiB is about 7% bigger.
  module: "01"

- term: gigabyte
  abbreviation: GB
  definition: >-
    A billion bytes. A megabyte (MB) is a million bytes and a terabyte (TB) a trillion; a phone
    photo is a few MB.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [GiB]
  not_to_confuse: >-
    A gigabyte is exactly a billion bytes; a GiB is based on powers of two and is about 7% bigger.
  module: "01"

- term: global reach
  definition: >-
    The ability to run a system in many parts of the world, close to its users, so they get lower
    latency. AWS calls this advantage "go global in minutes".
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  confused_with: [agility]
  not_to_confuse: >-
    Global reach is about where you run; agility is about how fast you got something new, wherever
    it is.
  module: "02"

- term: global service
  definition: >-
    A service not tied to one Region, such as IAM, Amazon Route 53 or Amazon CloudFront.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  confused_with: [Regional service, zonal resource]
  not_to_confuse: >-
    A global service isn't tied to any Region; a Regional service runs inside one Region, and a
    zonal resource inside one Availability Zone.
  module: "03"

- term: global table
  definition: >-
    A DynamoDB table copied across several Regions, for users around the world and for surviving the
    loss of a Region.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: Governance perspective
  definition: >-
    The CAF perspective for control and oversight: running the cloud program so benefits arrive and
    risks stay small, through capabilities such as program, benefits, risk and cloud financial
    management.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [Business perspective]
  not_to_confuse: >-
    Governance asks whether the change is going as planned and within budget; Business asks whether
    it's worth doing and in what order.
  module: "13"

- term: graph database
  definition: >-
    A database that stores things (nodes) and the connections between them (edges), for questions
    about relationships many links deep, such as recommendations or fraud rings. Amazon Neptune is
    AWS's.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: guardrail
  definition: >-
    A limit that holds whatever else is granted, such as an explicit deny that keeps working even if
    a broader policy is attached later.
  taught_in: guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md]
  module: "04"

- term: guest operating system
  definition: >-
    The operating system, such as Linux or Windows, that runs inside your virtual server. On Amazon
    EC2 you install its updates and security patches.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in:
    - guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    - guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md
    - guide/01-on-ramp/04-data-centers-and-virtualization.md
  confused_with: [host operating system]
  not_to_confuse: >-
    The guest operating system is inside your virtual server and yours on EC2; the host operating
    system is under the virtualization layer and AWS's.
  module: "04"

- term: guide (Prescriptive Guidance)
  definition: >-
    A Prescriptive Guidance document with planning and implementation advice, best practices and
    tools, written for architects, managers, technical leads and executives.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  confused_with: [pattern (Prescriptive Guidance)]
  not_to_confuse: >-
    A guide is planning advice for architects, managers and executives; a pattern is hands-on steps
    and code for the people building one task.
  module: "12"

- term: handler
  definition: >-
    The part of a Lambda function's code that Lambda runs on each invocation, receiving the event's
    data.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  module: "06"

- term: hardware
  definition: >-
    The physical parts of a computer, such as its processor, memory, storage and network connection.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [software]
  not_to_confuse: >-
    Hardware is the physical parts you could touch; software is the programs that run on them.
  module: "01"

- term: hardware refresh
  definition: >-
    Replacing servers and network equipment when they wear out, go out of support, or become too
    slow; a recurring up-front cost of running your own IT.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  module: "02"

- term: hardware security module
  abbreviation: HSM
  definition: >-
    A tamper-resistant device that stores keys and does cryptography. AWS KMS runs on validated HSMs
    shared by many customers; AWS CloudHSM gives you HSMs that only you use.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: health check
  definition: >-
    A regular test of whether a server or endpoint is answering correctly. Load balancers send
    traffic only to passing targets; Auto Scaling replaces failing instances, using the load
    balancer's checks only once they're turned on for the group.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/07-connecting-it/03-names-and-the-edge.md]
  module: "06"

- term: heterogeneous migration
  definition: >-
    A database migration that changes the engine, such as Oracle to Aurora PostgreSQL: convert the
    schema first with AWS SCT or DMS Schema Conversion, then move the data with AWS DMS.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [homogeneous migration]
  not_to_confuse: >-
    A heterogeneous migration changes the engine, so it uses SCT and then DMS; a homogeneous
    migration keeps the engine and uses DMS alone.
  module: "05"

- term: high availability
  definition: >-
    A system's ability to keep working, with little or no downtime, when some of its parts fail. On
    AWS you get it mainly by running copies in two or more Availability Zones.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  also_in: [guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md, guide/03-aws-around-the-world/03-surviving-failure.md, guide/05-storing-data/05-managed-or-self-managed-databases.md]
  confused_with: [durability, disaster recovery]
  not_to_confuse: >-
    High availability keeps a system working through a part failing; durability keeps stored data
    from being lost, and disaster recovery brings a whole workload back after a larger event.
  module: "02"

- term: high-risk issue
  abbreviation: HRI
  definition: >-
    In a Well-Architected review, a choice that might do the business significant harm; a
    medium-risk issue (MRI) would do less. Each best practice's page gives a level, which a written
    business reason can lower.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  also_in:
    - guide/02-why-the-cloud/05-the-well-architected-framework.md
    - guide/14-capstone/02-lab-18-well-architected-tool-review.md
  confused_with: [accepted risk]
  not_to_confuse: >-
    A high-risk issue is a finding to deal with; an accepted risk is one the business has decided,
    in writing, not to fix.
  module: "14"

- term: homogeneous migration
  definition: >-
    A database migration that keeps the same engine, such as SQL Server to RDS for SQL Server, so
    the schema fits as it is and AWS DMS alone can move the data.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [heterogeneous migration]
  not_to_confuse: >-
    A homogeneous migration keeps the engine and needs only DMS; a heterogeneous migration changes
    the engine and needs the schema converted first.
  module: "05"

- term: host
  definition: >-
    In virtualization, the physical server that virtual machines run on, under its hypervisor. On
    Amazon EC2 the host is AWS's, and a stopped instance usually starts again on a different one.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: host operating system
  definition: >-
    The operating system on the physical machine, beneath the virtualization layer. AWS runs and
    patches it.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in: [guide/01-on-ramp/04-data-centers-and-virtualization.md]
  confused_with: [guest operating system]
  not_to_confuse: >-
    The host operating system runs the physical machine and is AWS's; the guest operating system
    runs inside your virtual server, and on EC2 it is yours to patch.
  module: "04"

- term: hosted connection
  definition: >-
    A Direct Connect connection provided through an AWS Direct Connect Partner rather than on a port
    of your own.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [dedicated connection]
  not_to_confuse: >-
    A hosted connection comes through a partner; a dedicated connection is a physical port for you
    alone.
  module: "07"

- term: hosted zone
  definition: >-
    In Route 53, the set of DNS records for one domain, such as bakery.example. A public hosted zone
    answers anyone on the internet; a private one answers only inside the VPCs you choose.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: hot standby
  definition: >-
    A variation of multi-site active/active: a full second copy in another Region that takes no
    customers until a failover.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  confused_with: [warm standby, multi-site active/active]
  not_to_confuse: >-
    A hot standby is full size but idle until failover; a warm standby is smaller and must scale up,
    and in multi-site active/active every copy serves customers.
  module: "03"

- term: hourly item
  definition: >-
    In a cost estimate, a line made of a time-based charge: it bills for every hour the resource
    exists, so a busy noon and an empty night cost the same.
  taught_in: guide/11-paying-for-aws/05-lab-15-pricing-calculator.md
  module: "11"

- term: HPC optimized
  definition: >-
    EC2 instance types for high performance computing: very large, tightly linked computations such
    as complex simulations. Its letters are Hpc.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [accelerated computing]
  not_to_confuse: >-
    HPC optimized is for huge computations spread over many linked processors; accelerated computing
    is for work done on GPUs or other special chips.
  module: "06"

- term: HTTP
  definition: >-
    The web's request-and-response protocol. A request names a URL and a method; the response
    carries the page and a status code. Plain HTTP sends everything as readable text, normally on
    port 80.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [HTTPS]
  not_to_confuse: >-
    HTTP sends readable text that anyone on the path could read or change; HTTPS runs HTTP inside
    TLS, adding encryption and proof of the server's identity.
  module: "01"

- term: HTTP method
  definition: >-
    The word in an HTTP request that says what to do: GET asks for something, POST or PUT sends
    something to store, and DELETE removes it. AWS charges some requests by kind, such as S3's GET
    and PUT.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: HTTPS
  definition: >-
    HTTP run inside TLS, which adds encryption, so nobody on the path can read the conversation, and
    proof of identity, a certificate showing the server holds the site's name. It normally uses port
    443.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  also_in:
    - guide/01-on-ramp/05-apis-command-line-and-json.md
    - guide/01-on-ramp/06-everyday-security.md
  confused_with: [HTTP]
  not_to_confuse: >-
    HTTPS encrypts the conversation and proves the server's name; plain HTTP does neither, and a
    padlock proves the connection and the name, not the business's honesty.
  module: "01"

- term: hub and spoke
  definition: >-
    A network layout in which every network connects once to a central hub, such as a transit
    gateway, instead of to every other network in a mesh.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: hybrid deployment
  definition: >-
    A deployment model in which some parts of a system run in the cloud and others don't, and the
    parts are connected. Most often it joins the cloud to equipment an organization already runs
    on-premises.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  confused_with: [cloud deployment, on-premises deployment]
  not_to_confuse: >-
    Hybrid needs parts in both places, connected; all parts in the cloud is a cloud deployment, and
    all parts in your own buildings is an on-premises deployment.
  module: "02"

- term: hybrid storage
  definition: >-
    Storage for a setup where some systems run on premises and some in the cloud, such as AWS
    Storage Gateway letting software in your building use AWS storage.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  module: "05"

- term: hypervisor
  definition: >-
    The software on a host that creates virtual machines, gives each its share of processor, memory
    and disk, and keeps them apart. On AWS it is AWS's responsibility.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: IAM Access Analyzer
  definition: >-
    An IAM feature that checks policies as you write them and warns about errors and overly broad
    statements (policy validation), and can draft a policy from what an identity actually did
    (policy generation).
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md, guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md]
  module: "04"

- term: IAM policy simulator
  definition: >-
    An IAM tool that works out whether requests would be allowed or denied by the policies you
    choose, without sending real requests. Its results can differ from the live account, so check
    for real afterward.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md, guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md]
  module: "04"

- term: IAM role
  definition: >-
    A set of permissions not tied to one person, with no password or keys of its own. Whoever you
    allow can assume it for temporary session credentials; programs on AWS, other accounts and
    federated people reach an account this way.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  confused_with: [IAM user, IAM user group]
  not_to_confuse: >-
    A role is assumed for a session with temporary credentials; an IAM user has long-term
    credentials of its own, and a group is only a way to share policies among users.
  module: "04"

- term: IAM user
  definition: >-
    A named identity for one person or program, with long-term credentials: a console password,
    access keys, or both.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  confused_with: [IAM role, root user]
  not_to_confuse: >-
    An IAM user has its own long-term credentials; an IAM role has none and gives temporary
    credentials to whoever assumes it.
  module: "04"

- term: IAM user group
  definition: >-
    A set of IAM users; a policy attached to the group applies to every member. A group isn't a
    principal: nobody signs in as one, resource-based policies can't name one, and groups can't
    contain groups.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md]
  confused_with: [IAM role]
  not_to_confuse: >-
    A group gives the same permissions to several IAM users; a role is something people or programs
    assume to get temporary credentials.
  module: "04"

- term: identity
  definition: >-
    Something AWS recognizes and attaches permissions to: the root user, an IAM user, an IAM user
    group or an IAM role. One person can use several identities, and one role can be used by many
    people or programs.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  confused_with: [principal]
  not_to_confuse: >-
    Every principal is an identity, but not every identity is a principal: an IAM user group holds
    permissions but can't make a request.
  module: "04"

- term: identity provider
  abbreviation: IdP
  definition: >-
    The system that holds people's accounts and confirms who they are, which AWS trusts in
    federation.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: identity-based policy
  definition: >-
    A policy attached to a user, group or role that says what that identity may do, to which
    resources. It names no principal: it applies to whoever holds it.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  confused_with: [resource-based policy]
  not_to_confuse: >-
    An identity-based policy follows the identity and names no principal; a resource-based policy
    sits on the resource and must name who it applies to.
  module: "04"

- term: idle application
  definition: >-
    An application averaging 5 to 20% CPU and memory use over 90 days. Low use is a reason to ask
    whether to retire or retain it, not an answer.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  confused_with: [zombie application]
  not_to_confuse: >-
    An idle application averages 5 to 20% use; a zombie averages below 5%, and in both cases
    business value, not the number, decides.
  module: "13"

- term: idle capacity
  definition: >-
    Capacity you pay for but don't use, such as servers bought for the busiest day that do no work
    on the other days.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  also_in: [guide/02-why-the-cloud/04-what-a-data-center-really-costs.md, guide/02-why-the-cloud/07-sim-demand-curve.md]
  confused_with: [lost sales]
  not_to_confuse: >-
    Idle capacity is paid-for capacity left unused when demand is below it; lost sales are customers
    turned away when demand is above it.
  module: "02"

- term: idle cost
  definition: >-
    Money paid for capacity nobody used, such as a server or NAT gateway billing by the hour
    overnight with no customers. Time-based charges create it.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: image
  definition: >-
    A saved template of an operating system and software that a virtual machine starts from, so
    every one started from the same image is identical. Amazon EC2 calls its images AMIs.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: implicit deny
  definition: >-
    The default result when no policy allows a request: nothing has to say "no".
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md]
  confused_with: [explicit deny]
  not_to_confuse: >-
    An implicit deny is only the absence of an allow, and an allow overrides it; an explicit deny is
    a Deny statement, and it overrides every allow.
  module: "04"

- term: improvement plan
  definition: >-
    The list of risks a review decided to fix, in order, each with its fix, cost and owner. The
    Well-Architected Tool's Improvement plan tab lists risky questions and missing best practices,
    without costs, order or owners.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  also_in:
    - guide/14-capstone/02-lab-18-well-architected-tool-review.md
    - guide/02-why-the-cloud/05-the-well-architected-framework.md
  module: "14"

- term: in-memory database
  definition: >-
    A database that keeps data in memory rather than on disk, so it answers in microseconds; usually
    a cache in front of a slower store. Amazon ElastiCache is AWS's, which the exam calls
    memory-based.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: inbound rule
  definition: >-
    A firewall rule for traffic arriving at a resource or subnet.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  confused_with: [outbound rule]
  not_to_confuse: >-
    Inbound rules cover traffic arriving and outbound rules cover traffic leaving; on a stateless
    network ACL a reply needs a rule for its own direction.
  module: "07"

- term: independent software vendor
  abbreviation: ISV
  definition: >-
    A company that makes and sells its own software, here software that runs on or works with AWS,
    often sold through AWS Marketplace. Older material calls this a Technology Partner.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  confused_with: [system integrator]
  not_to_confuse: >-
    An ISV sells software it makes; a system integrator sells services, designing, building and
    connecting systems for customers.
  module: "12"

- term: infrastructure
  definition: >-
    The hardware, software, networks and buildings that run AWS's services.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  module: "04"

- term: infrastructure as a service
  abbreviation: IaaS
  definition: >-
    A cloud model in which the provider supplies basic building blocks (computers, storage and
    networking) and you manage the most: operating systems, software and data. Amazon EC2 is AWS's
    example.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [platform as a service, software as a service]
  not_to_confuse: >-
    IaaS gives you building blocks to run yourself; PaaS gives you a place to run your application,
    and SaaS a finished application, so the provider runs more at each step.
  module: "02"

- term: infrastructure as code
  abbreviation: IaC
  definition: >-
    Describing the resources you want, with their settings, in a text file, a template, and letting
    a service build them. The same file builds the same setup every time; on AWS the service is AWS
    CloudFormation.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  also_in:
    - guide/08-building-and-operating/02-iac-and-automation.md
    - guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
  module: "08"

- term: ingest
  definition: >-
    To bring data into a system, either as streaming data that arrives continuously or in batches.
    Amazon Kinesis Data Streams and Amazon Data Firehose are the exam's ingest services.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: inherited control
  definition: >-
    A control AWS fully carries out and you benefit from, such as physical and environmental
    controls on its buildings. Your evidence for it is AWS's audit reports.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  confused_with: [shared control, customer-specific control]
  not_to_confuse: >-
    An inherited control is AWS's alone; a shared control is a kind of work both sides do on their
    own things, and a customer-specific control exists only because of what you build.
  module: "04"

- term: inline policy
  definition: >-
    A policy written directly into one identity and deleted with it. Use one only for a strict
    one-to-one case.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  confused_with: [customer managed policy, AWS managed policy]
  not_to_confuse: >-
    An inline policy belongs to one identity and dies with it; managed policies, AWS's or yours,
    stand alone and can attach to many identities.
  module: "04"

- term: instance
  definition: >-
    One virtual server in Amazon EC2, started from an AMI with the hardware of its instance type.
    You pay for its running time, and separately for its disks and public addresses.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md]
  module: "06"

- term: instance family
  definition: >-
    In AWS's naming, the part of an instance type's name before the dot, such as m7g, whose sizes
    share one balance of hardware. AWS sorts families into categories, such as memory optimized;
    choose the category from the bottleneck.
  taught_in: guide/06-running-applications/01-ec2.md
  exam_name: Amazon EC2 instance types
  confused_with: [instance type]
  not_to_confuse: >-
    A family, such as m7g, is a group of types with the same balance of resources; an instance type,
    such as m7g.large, is one size in that family.
  module: "06"

- term: instance size flexibility
  definition: >-
    A Regional Reserved Instance's discount covering any size in the same instance family, counted
    in normalization factors. It applies to Linux on shared tenancy, not to zonal reservations.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: instance state
  definition: >-
    Where an EC2 instance is in its life: pending, running, stopped or terminated. You pay for
    instance time only while it is running.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md]
  module: "06"

- term: instance store
  definition: >-
    Temporary block storage on disks physically attached to an EC2 instance's host, included in its
    price; not every instance type has it. Data survives a reboot, not a stop, hibernation or
    termination: use only for caches and scratch data.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [Amazon EBS]
  not_to_confuse: >-
    Instance store belongs to the physical host and loses its data on a stop; an EBS volume persists
    apart from the instance and can be backed up with snapshots.
  module: "05"

- term: instance type
  definition: >-
    A named size of EC2 hardware, such as m7g.large: its virtual processors, memory, storage and
    network speed. Before the dot, the name gives the family (series, generation and options); after
    it, the size.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [purchasing option, Amazon Machine Image]
  not_to_confuse: >-
    An instance type is the hardware; a purchasing option such as On-Demand or Spot is only how you
    pay for that hardware, and the AMI is the software it runs.
  module: "06"

- term: instance-hour
  definition: >-
    One instance running for one hour: the unit for adding up compute use, as when comparing an
    Auto Scaling group with a fixed fleet over a day.
  taught_in: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
  module: "06"

- term: instrumenting
  definition: >-
    Making an application send trace data to X-Ray, in your own code or through an integrated AWS
    service such as Lambda. Without it, X-Ray has no traces.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: intent (Amazon Lex)
  definition: >-
    Something a customer wants from a Lex bot, such as checking an order, given with example phrases
    so the bot can recognize it.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [slot (Amazon Lex)]
  not_to_confuse: >-
    An intent is what the customer wants, such as placing an order; a slot is a detail the bot must
    collect to do it, such as the order number.
  module: "10"

- term: interface endpoint
  definition: >-
    A VPC endpoint, built on AWS PrivateLink, that puts a network interface with a private IP
    address in your subnet to reach one of many AWS, partner or other accounts' services. Billed
    hourly in each Availability Zone, plus per GB.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/04-connecting-networks-and-offices.md]
  confused_with: [gateway endpoint]
  not_to_confuse: >-
    An interface endpoint reaches many services and is billed; a gateway endpoint reaches only S3
    and DynamoDB, through a route, for free.
  module: "07"

- term: internet
  definition: >-
    A network of networks: homes, businesses and providers joined by routers, so data can travel
    between any of them. No single company carries it all the way.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: internet gateway
  definition: >-
    The part attached to a VPC that connects it to the internet in both directions, so either side
    can start a connection. AWS runs it as a highly available component, and it has no charge.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  confused_with: [NAT gateway]
  not_to_confuse: >-
    Through an internet gateway the internet can start connections in, at no charge; through a NAT
    gateway only your private servers can start connections out, and it bills by the hour and per
    GB.
  module: "07"

- term: Internet of Things
  abbreviation: IoT
  definition: >-
    Physical devices, such as sensors and machines, that connect to the internet to send data or
    receive commands. AWS IoT Core connects them to AWS.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: internet service provider
  abbreviation: ISP
  definition: >-
    A company that connects a home or business to the internet.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: interruption notice
  definition: >-
    The two-minute warning EC2 gives before it stops, hibernates or terminates a Spot Instance
    because it needs the capacity back.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: invalidation
  definition: >-
    Removing a file from CloudFront's edge caches before its cache time runs out, for example after
    fixing a wrong price list.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: invocation
  definition: >-
    One run of a Lambda function. Lambda bills each invocation as a request, plus its memory times
    its run time.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in: [guide/06-running-applications/05-lab-07-a-lambda-function.md]
  module: "06"

- term: IOPS
  definition: >-
    Reads and writes per second: one of the two ways storage speed is counted. The other is
    throughput.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [throughput]
  not_to_confuse: >-
    IOPS counts how many separate reads and writes happen each second; throughput counts how much
    data moves each second.
  module: "01"

- term: IoT rule
  definition: >-
    An AWS IoT Core setting with a SQL-like filter on incoming device messages, which sends matching
    data to other AWS services such as Lambda, S3, DynamoDB or SNS.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  confused_with: [rule (EventBridge)]
  not_to_confuse: >-
    An IoT rule filters messages arriving from devices in IoT Core; an EventBridge rule matches
    events on an event bus and sends them to targets.
  module: "10"

- term: IP address
  definition: >-
    The number that identifies a device on a network, such as 10.0.1.25. It can be private, working
    only inside one network, or public, reachable across the internet.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  module: "07"

- term: IPsec
  definition: >-
    The standard AWS Site-to-Site VPN uses to build its encrypted tunnels.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: IPv4
  definition: >-
    The most common version of IP address: four numbers from 0 to 255 separated by dots, such as
    192.0.2.10. All of its 4.3 billion addresses have been handed out.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [IPv6]
  not_to_confuse: >-
    IPv4 addresses are four numbers separated by dots, and they have run out; IPv6 addresses are
    groups of letters and digits separated by colons, with vastly more of them.
  module: "01"

- term: IPv6
  definition: >-
    The newer version of IP address: up to eight groups of letters and digits separated by colons,
    such as 2001:db8:85a3::8a2e:370:7334. It has vastly more addresses than IPv4.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [IPv4]
  not_to_confuse: >-
    IPv6 addresses are groups separated by colons, with plenty to go around; IPv4 addresses are four
    numbers separated by dots, and they have run out.
  module: "01"

- term: iSCSI
  definition: >-
    A protocol for using disks over a network, read and written as blocks. Volume Gateway and Tape
    Gateway present their storage over it.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [NFS, SMB]
  not_to_confuse: >-
    iSCSI presents disks, as blocks; NFS and SMB present shared folders of files.
  module: "05"

- term: IT control
  definition: >-
    A safeguard, such as a rule, a process or a setting, that lowers a risk to computer systems and
    that someone can check.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  module: "04"

- term: IT resources
  definition: >-
    What computers provide to the people and programs that use them. The main ones are compute,
    storage and databases, and cloud providers rent them out.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  module: "02"

- term: item
  definition: >-
    One record in a DynamoDB table, stored under a unique key and made of attributes. Items in the
    same table don't need the same attributes.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/05-storing-data/08-lab-06-a-dynamodb-table.md]
  confused_with: [attribute]
  not_to_confuse: >-
    An item is a whole record; an attribute is one named value inside it.
  module: "05"

- term: job queue
  definition: >-
    In AWS Batch, the list that holds submitted jobs until Batch runs them.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: JSON
  definition: >-
    JavaScript Object Notation: a text format for data, with name-value pairs in curly-brace objects
    and lists in square-bracket arrays. It is the AWS CLI's default output, the format of IAM
    policies, and common in document databases.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  also_in: [guide/05-storing-data/06-choosing-a-database.md]
  module: "01"

- term: JSON object
  definition: >-
    A set of name-value pairs inside curly braces, separated by commas, with none after the last. A
    whole JSON document is usually one object.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [array]
  not_to_confuse: >-
    An object, in curly braces, holds named values; an array, in square brackets, holds a list of
    values in order, and either can hold the other.
  module: "01"

- term: key (S3)
  definition: >-
    An object's name in its S3 bucket, such as cakes/birthday.jpg, by which programs store and fetch
    it.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  confused_with: [partition key]
  not_to_confuse: >-
    An S3 key names one object in a bucket; a DynamoDB partition key picks the group of items an
    item belongs to.
  module: "05"

- term: key pair
  definition: >-
    A public key, which anyone may have, and a private key, which only its owner keeps. Data locked
    with the public key opens only with the private key, which can also prove who its owner is.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md
  module: "01"

- term: key policy
  definition: >-
    The resource-based policy on a KMS key that says who may use and manage the key. You write it
    for a customer managed key; you can read an AWS managed key's but not change it.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: key rotation
  definition: >-
    Making new key material for a KMS key on a schedule, while keeping the old material to decrypt
    older data, so nothing has to be re-encrypted.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [rotation]
  not_to_confuse: >-
    Key rotation renews a KMS key's material and still decrypts old data; rotation in Secrets
    Manager replaces a secret, such as a password, with a new one.
  module: "09"

- term: key-value database
  definition: >-
    A database that stores each item under a unique key and fetches it by that key, fast at any
    scale. Amazon DynamoDB is AWS's.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/01-on-ramp/03-files-vs-databases.md]
  confused_with: [document database]
  not_to_confuse: >-
    A key-value database fetches whole items by one key; a document database stores self-contained
    documents whose fields can vary, and DynamoDB supports both.
  module: "05"

- term: KMS key
  definition: >-
    A key in AWS KMS that protects your data, usually by encrypting the data keys that services use.
    It comes in three kinds: AWS owned, AWS managed and customer managed.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [data key]
  not_to_confuse: >-
    A KMS key never leaves KMS unencrypted and protects data keys; a data key encrypts the data
    itself and is stored, encrypted, beside it.
  module: "09"

- term: Kubernetes
  definition: >-
    A widely used open-source system for orchestrating containers. Amazon EKS runs it for you, so
    teams can keep their existing Kubernetes tools.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: landing zone
  definition: >-
    A multi-account AWS environment set up following security and compliance best practices, as AWS
    Control Tower builds it, with OUs, logging and sign-in in place.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: last accessed information
  definition: >-
    IAM's report, on the Last Accessed tab of a user, group, role or policy, of which services it
    may use and when it last tried each. It counts attempts, and covers identity-based policies
    only.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md, guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: latency
  definition: >-
    The delay between a request and its answer. Distance is one of its main causes, so running close
    to users lowers it.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  also_in: [guide/02-why-the-cloud/03-telling-the-benefits-apart.md]
  module: "03"

- term: latency routing
  definition: >-
    A Route 53 routing policy that sends each user to the Region that answers them fastest.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [geolocation routing]
  not_to_confuse: >-
    Latency routing picks the fastest Region, which is usually but not always the nearest; when a
    rule says where a user's country must be served, use geolocation routing.
  module: "07"

- term: launch (EC2 instance)
  definition: >-
    To start a new EC2 instance, choosing its AMI, instance type, storage, network and security
    group, and how you sign in. The instance bills from launch until you terminate it.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md]
  module: "06"

- term: Launch phase
  definition: >-
    The third CAF phase: delivering pilots in production and showing value step by step.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: launch template
  definition: >-
    The recipe an Auto Scaling group uses for each new instance: the AMI, the instance type, the
    security group and other launch settings.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/08-building-and-operating/02-iac-and-automation.md]
  confused_with: [template (CloudFormation)]
  not_to_confuse: >-
    A launch template describes one EC2 instance, so Auto Scaling can launch identical copies; a
    CloudFormation template describes a whole set of resources and can contain a launch template.
  module: "06"

- term: legacy Free Tier
  definition: >-
    The Free Tier as it worked before 2025-07-15, when new accounts got 12 months of free usage on
    many services. Accounts created before that date stay on it.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  confused_with: [AWS Free Tier]
  not_to_confuse: >-
    The legacy Free Tier gave 12 months of free usage to accounts created before 2025-07-15;
    today's Free Tier gives credits and a choice of Free or Paid plan.
  module: "11"

- term: lens
  definition: >-
    An extra set of review questions in the Well-Architected Tool for a particular kind of workload
    or industry.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  also_in: [guide/14-capstone/02-lab-18-well-architected-tool-review.md]
  module: "02"

- term: License Mobility
  definition: >-
    A Software Assurance right to move eligible Microsoft licenses, such as SQL Server, to a cloud
    provider's shared servers, such as ordinary EC2 instances. Windows Server isn't eligible.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md]
  module: "13"

- term: license-included
  definition: >-
    Buying software such as Windows Server or SQL Server in the hourly price of an EC2 instance or
    database. You pay as you go, and AWS handles license compliance.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md]
  confused_with: [bring your own license]
  not_to_confuse: >-
    License-included puts the license in AWS's hourly price and AWS handles compliance; with BYOL
    you use licenses you own, pay AWS only for infrastructure, and compliance is yours.
  module: "13"

- term: lifecycle rule
  definition: >-
    One rule in a bucket's S3 Lifecycle configuration: which objects it covers, and its transition
    and expiration actions.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  module: "05"

- term: line item
  definition: >-
    One row of a bill: one product, one kind of usage, one operation, for one period. The Cost and
    Usage Report holds every one.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: load balancer
  definition: >-
    One front door that spreads users' requests across servers, called targets, in one or more
    Availability Zones and skips any that fail its health checks. Elastic Load Balancing is AWS's.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md]
  confused_with: [auto scaling]
  not_to_confuse: >-
    A load balancer decides which server gets each request; auto scaling decides how many servers
    there are.
  module: "06"

- term: local route
  definition: >-
    The route every route table has for the VPC's own address range, which keeps traffic for those
    addresses inside the VPC and lets its subnets reach each other.
  taught_in: guide/07-connecting-it/05-lab-09-build-a-small-vpc.md
  also_in: [guide/07-connecting-it/01-your-own-network.md]
  module: "07"

- term: Local Zone
  definition: >-
    An extension of a Region in a large city running selected services, such as compute and storage,
    for users who need single-digit-millisecond latency or data that must stay in that city. You
    turn one on before using it.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  confused_with: [edge location, AWS Outposts, Wavelength Zone]
  not_to_confuse: >-
    A Local Zone runs your servers at an AWS site in a big city; an edge location runs only AWS's
    networking services, Outposts is AWS hardware in your own building, and a Wavelength Zone sits
    inside a 5G network.
  module: "03"

- term: log file integrity validation
  definition: >-
    A CloudTrail feature that lets you prove a trail's log files weren't changed or deleted after
    CloudTrail delivered them.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  module: "09"

- term: log group
  definition: >-
    In Amazon CloudWatch Logs, a set of log streams that share settings, such as how long their data
    is kept. A Lambda function writes to its own log group.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  also_in: [guide/08-building-and-operating/03-watching-workloads.md]
  confused_with: [log stream]
  not_to_confuse: >-
    A log group holds many streams and their shared settings; a log stream is one run of lines from
    one source.
  module: "06"

- term: log retention
  definition: >-
    How long CloudWatch Logs keeps a log group's data before deleting it. By default logs never
    expire, so set a period that fits your needs.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  also_in: [guide/08-building-and-operating/03-watching-workloads.md]
  module: "06"

- term: log stream
  definition: >-
    In Amazon CloudWatch Logs, a run of log lines from one source, kept inside a log group.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  confused_with: [log group]
  not_to_confuse: >-
    A log stream is one source's lines; the log group around it sets how long they are kept.
  module: "06"

- term: long-term credentials
  definition: >-
    Credentials that keep working until someone changes or deletes them: passwords and access keys.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  confused_with: [temporary credentials]
  not_to_confuse: >-
    Long-term credentials work until someone removes them; temporary credentials expire on their
    own, which is why AWS prefers them.
  module: "04"

- term: lost sales
  definition: >-
    Customers you can't serve because demand is above your capacity.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  also_in: [guide/02-why-the-cloud/07-sim-demand-curve.md]
  confused_with: [idle capacity]
  not_to_confuse: >-
    Lost sales happen when demand is above capacity; idle capacity is the waste when demand is below
    it.
  module: "02"

- term: lost update
  definition: >-
    Losing a change because two people each saved a whole copy of a shared file, and the last save
    replaced the other's. Nobody is warned; a database avoids it by changing single records.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  module: "01"

- term: machine learning
  abbreviation: ML
  definition: >-
    The most common way to build AI today: instead of writing every rule, people show a computer
    many examples and it learns the patterns, producing a model.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [artificial intelligence]
  not_to_confuse: >-
    Machine learning is a method, learning patterns from examples; artificial intelligence is the
    broader goal of computers doing tasks that needed a person.
  module: "10"

- term: MACsec
  definition: >-
    Encryption between your device and the Direct Connect location, on connections that support it.
    It is one way to make a private Direct Connect path encrypted too.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: main route table
  definition: >-
    The route table AWS creates with a VPC, used by every subnet you don't link to another route
    table. It starts with only the local route and is deleted with the VPC.
  taught_in: guide/07-connecting-it/05-lab-09-build-a-small-vpc.md
  also_in: [guide/07-connecting-it/01-your-own-network.md]
  module: "07"

- term: managed database
  definition: >-
    A database a provider runs for you, such as Amazon RDS: AWS installs and patches the software,
    takes backups and provides failover, while you choose the settings, control access and tune
    queries.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  confused_with: [self-managed database]
  not_to_confuse: >-
    A managed database leaves the operating system, patches and backups to AWS; a self-managed
    database on EC2 leaves them all to you.
  module: "05"

- term: managed platform updates
  definition: >-
    An Elastic Beanstalk setting that applies new patch and minor platform versions, with operating
    system and language updates, in a weekly maintenance window. Major version upgrades stay yours
    to start.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: managed rule group
  definition: >-
    A ready-made set of AWS WAF rules, from AWS or from sellers in AWS Marketplace, kept up to date
    by its authors, such as rules against SQL injection.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  module: "09"

- term: managed service
  definition: >-
    A service where AWS runs the servers and software underneath and you use it through its
    settings, such as Amazon RDS or Amazon S3. The more AWS runs, the less you have to secure.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in: [guide/05-storing-data/05-managed-or-self-managed-databases.md]
  confused_with: [abstracted service]
  not_to_confuse: >-
    Every abstracted service is managed, but not every managed service is abstracted: on Amazon RDS
    you still choose and tune a database engine, while on Amazon S3 you only handle data and
    settings.
  module: "04"

- term: managed service provider
  definition: >-
    A partner that runs a customer's systems day to day, such as watching and patching servers. AWS
    Managed Service Provider is one of the AWS Specializations.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  confused_with: [managed service, AWS Managed Services]
  not_to_confuse: >-
    A managed service provider is a partner that runs your systems; a managed service is an AWS
    service whose servers AWS runs, and AWS Managed Services is AWS operating your infrastructure.
  module: "12"

- term: management account
  definition: >-
    The account that creates an AWS organization and pays every member account's bill. Service
    control policies don't apply to it, so keep workloads and everyday users out of it.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md, guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  confused_with: [member account]
  not_to_confuse: >-
    The management account creates and pays for the organization and sits outside every SCP; a
    member account is limited by the SCPs above it, root user included.
  module: "09"

- term: management event
  definition: >-
    A CloudTrail event for an action that creates, changes or deletes resources and settings, such
    as changing a function's memory. Event history shows recent ones at no charge.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [data event]
  not_to_confuse: >-
    Management events record changes to resources and settings and appear in Event history by
    default; data events record actions on the data inside, such as reading objects, and you turn
    them on and pay.
  module: "08"

- term: maximum capacity
  definition: >-
    The most instances an Auto Scaling group may run. It caps the cost if a fault or a flood of
    traffic drives demand up.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [minimum capacity, desired capacity]
  not_to_confuse: >-
    The maximum is the ceiling the group never passes; the desired capacity is how many it runs now,
    which a scaling policy moves between the minimum and the maximum.
  module: "06"

- term: member account
  definition: >-
    Any account in an AWS organization other than the management account. Service control policies
    limit every user and role in it, including its root user.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  confused_with: [management account]
  not_to_confuse: >-
    A member account is limited by the SCPs above it, root user included; the management account
    creates and pays for the organization and no SCP applies to it.
  module: "09"

- term: memory
  abbreviation: RAM
  definition: >-
    Fast, short-term space for the programs and data a computer is using right now. It needs
    constant power, so a restart empties it. People often say memory when they mean storage; in
    computing it never does.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in: [guide/06-running-applications/01-ec2.md]
  confused_with: [storage]
  not_to_confuse: >-
    Memory holds the work in progress and empties when the power goes off; storage is bigger and
    slower, and keeps files and data with the power off.
  module: "01"

- term: memory optimized
  definition: >-
    EC2 instance types with a lot of memory for their processors, for work that holds large data
    sets in memory, such as in-memory databases and analytics. Its letters include R and X.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [compute optimized, storage optimized]
  not_to_confuse: >-
    Memory optimized is for data that must fit in RAM; compute optimized is for processor-bound
    work, and storage optimized for fast reads and writes to local disks.
  module: "06"

- term: message
  definition: >-
    A small piece of data one part of an application sends another, such as an order to pack. The
    sender is the producer and the receiver is the consumer.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: metadata
  definition: >-
    Facts about stored data rather than the data itself, such as an S3 object's type. Each S3 object
    is stored with its metadata.
  taught_in: guide/05-storing-data/01-block-file-object.md
  module: "05"

- term: metric
  definition: >-
    One measurement tracked over time, such as a function's errors or a server's CPU use. Many AWS
    services send metrics to CloudWatch on their own; each metric lives in one Region.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: metric filter
  definition: >-
    A CloudWatch Logs setting that turns log lines matching a pattern into a metric, so an alarm can
    watch, for example, how often a card is declined.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  confused_with: [CloudWatch Logs Insights]
  not_to_confuse: >-
    A metric filter keeps counting matching log lines as a metric an alarm can watch; Logs Insights
    searches log lines when you ask it a question.
  module: "08"

- term: MFA Delete
  definition: >-
    A versioning setting that requires a code from the account's MFA device to delete an object
    version permanently. Only the root user can turn it on, and not in the console.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [S3 Object Lock]
  not_to_confuse: >-
    MFA Delete only adds an MFA code to permanent deletes; Object Lock forbids deletes until a set
    date.
  module: "05"

- term: Migration Evaluator
  definition: >-
    An AWS service that builds a migration business case from measured data about your current
    servers: it finds over-sized ones, matches each to an EC2 instance and projects costs, including
    license options.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  also_in:
    - guide/13-moving-to-aws/04-the-business-case.md
    - guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md
  confused_with: [AWS Pricing Calculator]
  not_to_confuse: >-
    Migration Evaluator starts from data about the servers you run today and sizes them for you; the
    Pricing Calculator prices only the AWS setup you describe.
  module: "13"

- term: Migration Readiness Assessment
  definition: >-
    AWS's process for finding how ready an organization is to migrate, and planning how to close the
    gaps, using the CAF. It comes at the start of a large migration.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: migration strategy
  definition: >-
    The approach used to move one workload into the AWS Cloud. AWS lists seven, the 7 Rs; database
    replication is a technique used inside one, not an eighth.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  module: "13"

- term: migration wave
  definition: >-
    A group of applications, or of servers that depend on each other, moved together; waves follow
    one another, usually starting with simpler applications to build skill.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  module: "13"

- term: milestone
  definition: >-
    A saved record of a workload's review in the Well-Architected Tool, which can't be changed
    afterward, so a later review can be compared with it to show progress. Deleting the workload
    deletes its milestones.
  taught_in: guide/14-capstone/02-lab-18-well-architected-tool-review.md
  also_in:
    - guide/02-why-the-cloud/05-the-well-architected-framework.md
    - guide/14-capstone/01-the-capstone-review.md
  module: "14"

- term: minimum billable object size
  definition: >-
    The smallest size some S3 storage classes bill an object as; a smaller object is billed as that
    size. It makes those classes expensive for many tiny files.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [minimum storage duration]
  not_to_confuse: >-
    The minimum billable size charges small objects as larger ones; the minimum storage duration
    charges early leavers for the full stay.
  module: "05"

- term: minimum capacity
  definition: >-
    The fewest instances an Auto Scaling group may run. Set it to at least one per Availability
    Zone you use, so the loss of one zone still leaves servers running.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [maximum capacity, desired capacity]
  not_to_confuse: >-
    The minimum is the floor kept for availability, the maximum is the ceiling that caps the cost,
    and the desired capacity is the number the group aims for right now, between the two.
  module: "06"

- term: minimum storage duration
  definition: >-
    The shortest stay an S3 storage class bills for. Delete, overwrite or move an object out of the
    class earlier, and you pay for the rest of the stay; see the lesson for each class's minimum.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md, guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  confused_with: [minimum billable object size]
  not_to_confuse: >-
    The minimum storage duration is about time, billing a short stay as the full minimum; the
    minimum billable object size is about size, billing a small object as a larger one.
  module: "05"

- term: missing data treatment
  definition: >-
    An alarm setting that says how a period with no data counts, such as not breaching. Without it,
    a metric with no data, such as a function nobody ran overnight, can leave the alarm in
    INSUFFICIENT_DATA.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: model (machine learning)
  definition: >-
    What machine learning produces: a learned set of patterns that takes an input and gives an
    answer, such as "this review is negative". Training is the step that builds it.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [data model]
  not_to_confuse: >-
    A machine learning model is learned patterns that give answers; a data model is the shape a
    database gives your data, such as tables or key-value items.
  module: "10"

- term: modernize
  definition: >-
    To improve an application's design or technology, usually after it has moved to AWS, for example
    by replatforming or refactoring it.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  module: "13"

- term: monolith
  definition: >-
    An application built as one large program, so any change means testing and releasing the whole
    thing. A monolith that slows delivery is a reason to refactor.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  module: "13"

- term: MQTT
  definition: >-
    A lightweight protocol that small devices use to publish short messages to named topics. Devices
    usually speak it to AWS IoT Core; HTTPS also works.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: Multi-AZ deployment
  definition: >-
    An Amazon RDS setup with a synchronously replicated standby in a second Availability Zone that
    serves no queries and takes over automatically if the primary fails. It is high availability,
    not a backup: a mistaken delete reaches the standby too.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [multi-Region, read replica]
  not_to_confuse: >-
    Multi-AZ keeps a synchronous standby that fails over by itself inside one Region; a read replica
    serves reads and must be promoted by hand, and multi-Region runs copies in separate Regions.
  module: "05"

- term: multi-factor authentication
  abbreviation: MFA
  definition: >-
    A second proof of identity besides the password, so a stolen password isn't enough on its own.
    AWS recommends passkeys or security keys first.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  module: "04"

- term: multi-Region
  definition: >-
    Running a workload, or copies of it, in more than one Region: for disaster recovery, business
    continuity, users far apart, or data sovereignty. It costs more and is harder, and several
    Availability Zones are often enough.
  taught_in: guide/03-aws-around-the-world/02-choosing-a-region.md
  confused_with: [Multi-AZ deployment]
  not_to_confuse: >-
    Multi-Region uses separate Regions; Multi-AZ uses several Availability Zones inside one Region,
    which AWS says meets most resilience goals.
  module: "03"

- term: multi-Region trail
  definition: >-
    A CloudTrail trail that covers every Region enabled in your account. AWS recommends it, and
    trails created in the console are multi-Region.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  module: "09"

- term: multi-site active/active
  definition: >-
    The most expensive disaster recovery strategy: full copies in two or more Regions, all serving
    customers, so recovery is near zero. It still needs backups, because it copies data mistakes
    too.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md]
  confused_with: [hot standby, warm standby]
  not_to_confuse: >-
    In multi-site active/active every copy serves customers every day; a hot standby is a full copy
    that waits, and a warm standby is a smaller copy that must scale up.
  module: "03"

- term: name-value pair
  definition: >-
    One named value in JSON: a name in double quotes, a colon, then the value, such as "cupcakes":
    14.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: NAT gateway
  definition: >-
    A gateway that lets servers in private subnets reach the internet while outsiders can't connect
    in. The usual, zonal kind sits in one AZ's public subnet with an Elastic IP address. Billed hourly
    and per GB.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  confused_with: [internet gateway, gateway endpoint]
  not_to_confuse: >-
    A NAT gateway carries private servers' traffic out to the internet and bills hourly; an internet
    gateway is free and works both ways, and a free gateway endpoint is the cheaper path when
    traffic only goes to S3 or DynamoDB.
  module: "07"

- term: nesting
  definition: >-
    Putting a JSON object or array inside another, which shows that things belong together.
    Indenting the nested lines is only for people; programs ignore it.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: network
  definition: >-
    Computers connected so that they can exchange data, such as the devices on a home Wi-Fi.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: network ACL
  abbreviation: NACL
  definition: >-
    Network access control list: a stateless firewall at a subnet's edge, with numbered allow and
    deny rules checked lowest first until one matches, ending in a catch-all deny. The default
    allows everything; a new custom one denies everything.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md, guide/07-connecting-it/06-sim-packet-journey.md]
  confused_with: [security group, access control list]
  not_to_confuse: >-
    A network ACL guards a whole subnet, can deny and checks replies again, while a security group
    guards one resource, only allows and lets replies through; an S3 ACL is unrelated and grants
    access to buckets and objects.
  module: "07"

- term: network connection
  definition: >-
    The part of a computer that sends data to other computers and receives data from them.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: network layer attack
  definition: >-
    A flood of traffic aimed at the network itself, such as a SYN flood or UDP reflection. AWS calls
    these network and transport layer, or layer 3 and 4, attacks; Shield Standard defends against
    the common ones.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  confused_with: [application layer attack]
  not_to_confuse: >-
    A network layer attack floods raw traffic, which Shield absorbs; an application layer attack
    sends normal-looking web requests, which only a service that reads them, such as WAF, can stop.
  module: "09"

- term: Network Load Balancer
  abbreviation: NLB
  definition: >-
    The Elastic Load Balancing type for connections (TCP, UDP and TLS), for very high volume with
    very low delay, or when clients need a fixed IP address.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  confused_with: [Application Load Balancer, Gateway Load Balancer]
  not_to_confuse: >-
    An NLB works with connections and can have a fixed IP address; an ALB understands web requests
    and their addresses, and a GWLB passes traffic through appliances.
  module: "06"

- term: NFS
  definition: >-
    A common way for computers to share files over a network, used mostly by Linux. Amazon EFS and
    S3 File Gateway can use it.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [SMB, iSCSI]
  not_to_confuse: >-
    NFS shares files, mostly for Linux; SMB shares files, mostly for Windows, and iSCSI presents
    disks as blocks rather than files.
  module: "05"

- term: noncompliant
  definition: >-
    AWS Config's result for a resource that fails a rule, such as a security group that lets SSH in
    from anywhere under the restricted-ssh rule.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/09-sim-config-timeline.md]
  module: "09"

- term: noncurrent version
  definition: >-
    An older version of an object in a versioned bucket, kept under the current one and billed in
    full. Lifecycle rules can delete noncurrent versions a set number of days after they stop being
    current.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/03-storage-classes-and-lifecycle.md, guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  confused_with: [current version]
  not_to_confuse: >-
    A noncurrent version is kept but hidden behind the current one, which is what people see.
  module: "05"

- term: normalization factor
  definition: >-
    The units in which instance size flexibility counts sizes: small is 1, medium 2, large 4, xlarge
    8 and so on, so one reservation can cover part or all of a bigger instance.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: NoSQL
  definition: >-
    Databases that use a model other than relational tables, such as key-value or documents. Amazon
    DynamoDB is AWS's main NoSQL database.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/05-storing-data/08-lab-06-a-dynamodb-table.md]
  confused_with: [relational database, SQL]
  not_to_confuse: >-
    NoSQL databases are shaped around how the data will be read and don't join tables; relational
    databases link tables with a fixed schema and join them in SQL.
  module: "05"

- term: object
  definition: >-
    Amazon S3's name for a file stored in a bucket, together with its key (its name in the bucket)
    and its metadata.
  taught_in: guide/02-why-the-cloud/06-lab-01-first-resource.md
  also_in: [guide/05-storing-data/01-block-file-object.md]
  confused_with: [bucket]
  not_to_confuse: >-
    An object is one stored file; a bucket is the container that holds objects.
  module: "02"

- term: object storage
  definition: >-
    Storage for whole files, called objects, each with a key and metadata, kept in a bucket and
    reached through a web API, with no disk to attach or folder to mount. Amazon S3 is AWS's object
    storage.
  taught_in: guide/05-storing-data/01-block-file-object.md
  confused_with: [block storage, file storage]
  not_to_confuse: >-
    Object storage hands whole objects to any allowed program over the web; block storage is
    attached to one server, and file storage is mounted as shared folders.
  module: "05"

- term: on demand
  definition: >-
    Getting a resource when you ask for it, within minutes, with no order, delivery or installation
    to wait for. One of the three features of cloud computing.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md]
  module: "02"

- term: on-demand capacity
  definition: >-
    A DynamoDB capacity mode that bills per read and write request, with no capacity to plan: the
    table scales up for a spike and back down, and an idle table pays only for its storage.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/05-storing-data/08-lab-06-a-dynamodb-table.md]
  confused_with: [provisioned capacity]
  not_to_confuse: >-
    On-demand capacity bills each request with nothing to plan; provisioned capacity bills by the
    hour for the reads and writes per second you set, which can cost less for steady traffic.
  module: "05"

- term: On-Demand Instance
  definition: >-
    The EC2 purchasing option with no commitment: you pay the published rate for the time an
    instance runs, and stop paying when it stops. It's the yardstick for every discount, and suits
    short, unpredictable or new work.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  confused_with: [Reserved Instance, Spot Instance]
  not_to_confuse: >-
    On-Demand commits you to nothing at the full rate; a Reserved Instance trades a term commitment
    for a lower rate, and a Spot Instance is cheaper still but AWS can take it back.
  module: "11"

- term: on-premises
  definition: >-
    In a building you own or control. On-premises IT means buying, housing and running your own
    servers instead of renting capacity from a cloud provider.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/02-why-the-cloud/04-what-a-data-center-really-costs.md]
  module: "02"

- term: on-premises cost categories
  definition: >-
    The seven groups of cost in running your own IT: hardware and its refresh, space, power,
    cooling, network, staff and licenses. Most are fixed, and the hardware is paid for up front.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  module: "02"

- term: on-premises deployment
  definition: >-
    A deployment model in which every part of a system runs on equipment in the organization's own
    buildings.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  confused_with: [hybrid deployment, private cloud]
  not_to_confuse: >-
    On-premises means every part is in your own buildings, even when software shares the servers out
    flexibly (a private cloud); once a connected part runs at a cloud provider, it is hybrid.
  module: "02"

- term: on-premises network
  definition: >-
    The network in a building you run, such as an office or data center.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: one-time migration cost
  definition: >-
    Money spent once to move: planning, tools, people's time, training, and running old and new
    systems side by side during the move.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  module: "13"

- term: one-time operation
  definition: >-
    A task done once, or rarely, where nobody needs to repeat it exactly. One item suits the
    console; many items, even once, suit the CLI.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  confused_with: [repeatable process]
  not_to_confuse: >-
    A one-time operation needn't be repeated exactly, so the console or a CLI command will do; a
    repeatable process must give the same result every run, so it belongs in a script or a template.
  module: "08"

- term: open source
  definition: >-
    Software whose code is published for anyone to use and change, such as Linux.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: operating expense
  abbreviation: OpEx
  definition: >-
    Money spent on running costs as you go, such as rent, electricity, salaries or a monthly cloud
    bill.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  also_in: [guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md]
  confused_with: [capital expense, variable expense]
  not_to_confuse: >-
    Operating versus capital is about paying as you go or up front; variable versus fixed is about
    whether the amount follows use, and rent is operating yet fixed.
  module: "02"

- term: operating system
  definition: >-
    The main program that runs a computer: it starts and stops other programs, shares the processor
    and memory between them, reads and writes files, and controls who may sign in. Servers mostly
    run Linux or Windows Server.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in: [guide/01-on-ramp/04-data-centers-and-virtualization.md]
  confused_with: [application]
  not_to_confuse: >-
    The operating system runs the computer and shares its hardware out; an application runs on top
    of it and does a job for people, such as taking orders.
  module: "01"

- term: operational excellence pillar
  definition: >-
    The Well-Architected pillar that asks whether you can run a workload well day to day, see what
    it is doing, and keep improving how you work.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  module: "02"

- term: Operations perspective
  definition: >-
    The CAF perspective for health and availability: keeping services running at the level the
    business agreed, through capabilities such as observability, incident and problem management,
    and patch management.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: opt-in Region
  definition: >-
    A Region that starts switched off in an account until someone turns it on, and may be hidden
    while off. Regions AWS launched after 2019-03-20 work this way.
  taught_in: guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md
  also_in: [guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md]
  module: "03"

- term: option
  definition: >-
    A setting added to a command, written as a name that starts with two dashes and then its value,
    such as --region us-east-1.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [argument]
  not_to_confuse: >-
    An option is a named setting, starting with two dashes; an argument is the value the command
    acts on, such as a bucket's name.
  module: "01"

- term: orchestration
  definition: >-
    Deciding where containers run and how many copies there are, and replacing copies that fail.
    Amazon ECS and Amazon EKS orchestrate; AWS Fargate does not.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: organization
  definition: >-
    A group of AWS accounts joined in AWS Organizations: one management account and its member
    accounts, arranged in organizational units under a root.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: organization trail
  definition: >-
    A CloudTrail trail created from an AWS Organizations management account that logs every account
    in the organization. Member accounts can't change or delete it.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  module: "09"

- term: organizational unit
  abbreviation: OU
  definition: >-
    A group of accounts in an AWS organization, like a folder, which can sit inside another OU. A
    policy attached to an OU applies to every account below it.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  module: "09"

- term: Organizations access report
  definition: >-
    An IAM access report, run from an organization's management account, that shows when the
    services its service control policies allow were last used in each account.
  taught_in: guide/09-protecting-and-governing/01-who-did-what.md
  module: "09"

- term: origin
  definition: >-
    The place where the original content lives, such as an S3 bucket in a Region, from which a CDN
    fetches what it hasn't cached.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  also_in: [guide/07-connecting-it/03-names-and-the-edge.md]
  confused_with: [cache]
  not_to_confuse: >-
    The origin holds the original content; a cache holds nearby copies of it.
  module: "03"

- term: origin access control
  abbreviation: OAC
  definition: >-
    A CloudFront feature that lets only your distribution read a private S3 bucket, so customers see
    the content through CloudFront while the bucket stays private with Block Public Access on.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: outbound rule
  definition: >-
    A firewall rule for traffic leaving a resource or subnet. A new security group has one outbound
    rule that lets everything out.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  confused_with: [inbound rule]
  not_to_confuse: >-
    Outbound rules on a security group cover conversations the resource starts, not replies; on a
    network ACL they also decide whether replies may leave.
  module: "07"

- term: packet
  definition: >-
    One small piece of data traveling across a network, labeled with where it comes from and where
    it is going.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in:
    - guide/07-connecting-it/06-sim-packet-journey.md
    - guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "07"

- term: Paid plan
  definition: >-
    The Free Tier plan with every service, short-term trials, Savings Plans and Reserved Instances.
    Usage beyond the credits is billed at normal rates, and moving to it can't be undone.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  also_in: [guide/11-paying-for-aws/04-many-accounts-one-bill.md]
  confused_with: [Free plan]
  not_to_confuse: >-
    The Paid plan can bill you and never closes for lack of credits; the Free plan can't bill you,
    offers fewer services and closes the account when it ends.
  module: "11"

- term: parameter (CloudFormation)
  definition: >-
    A value a template asks for when you create a stack, such as an environment name or a bucket
    name, so one template fits several uses, like production and a test copy.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in: [guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md]
  confused_with: [Parameter Store]
  not_to_confuse: >-
    A CloudFormation parameter is a value given when a stack is created; Parameter Store is a
    Systems Manager capability that keeps configuration values for your code to read.
  module: "08"

- term: Parameter Store
  definition: >-
    A capability of AWS Systems Manager that keeps configuration values, such as settings, IDs and
    addresses, out of your code, optionally encrypted.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  confused_with: [AWS Secrets Manager]
  not_to_confuse: >-
    Parameter Store holds configuration; Secrets Manager holds secrets and can rotate them, so
    "rotate automatically" points to Secrets Manager.
  module: "04"

- term: partition key
  definition: >-
    The part of a DynamoDB item's key that picks which group the item belongs to, such as a cart ID.
    A query finds every item that shares one partition key.
  taught_in: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
  confused_with: [sort key, key (S3)]
  not_to_confuse: >-
    The partition key picks the group and the sort key tells the items in that group apart, together
    making each item's full key; an S3 key is simply an object's name in its bucket.
  module: "05"

- term: Partner Path
  definition: >-
    The route a company takes into the AWS Partner Network, by what it offers, such as the Software,
    Services or Training Path. Paths replaced the older technology and consulting partner types.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: passkey
  definition: >-
    A second factor kept in your device or password manager, unlocked by fingerprint, face or PIN
    and tied to the real site's address, so a fake page gets nothing. AWS recommends passkeys and
    security keys first.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  confused_with: [authenticator app]
  not_to_confuse: >-
    A passkey works only on the real site, so a fake page gets nothing; an authenticator app's code
    can be typed into a fake page and used at once.
  module: "01"

- term: password manager
  definition: >-
    An app that creates, stores and fills in a long random password for each account, protected by
    one strong main password and MFA. Many fill a password only on its own site, which helps against
    fake pages.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  module: "01"

- term: password policy
  definition: >-
    An account's rules for IAM user passwords, such as minimum length, required character types and
    expiry. It doesn't cover the root user or access keys.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: password reuse
  definition: >-
    Using the same password on more than one account. When one site leaks it, attackers try it on
    other sites and get into every account that shares it.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  module: "01"

- term: patch
  definition: >-
    A software update that fixes a flaw, often a security flaw.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in: [guide/01-on-ramp/01-computers-and-servers.md]
  module: "04"

- term: patch management
  definition: >-
    Keeping software updated with fixes. A shared control: AWS patches its infrastructure, and you
    patch your guest operating systems and applications.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  module: "04"

- term: pattern (Prescriptive Guidance)
  definition: >-
    A Prescriptive Guidance document with hands-on steps, architectures, tools and code for one
    migration, optimization or modernization task, written for the people building it.
  taught_in: guide/12-getting-help/03-where-to-find-answers.md
  confused_with: [guide (Prescriptive Guidance)]
  not_to_confuse: >-
    A pattern is hands-on steps and code for one task; a guide is planning advice for architects,
    managers and executives.
  module: "12"

- term: pay as you go
  definition: >-
    Paying only for what you use, for as long as you use it; when you delete a resource, you stop
    paying for it. One of the three features of cloud computing.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md]
  module: "02"

- term: payment option
  definition: >-
    How you pay for a commitment: All Upfront, Partial Upfront or No Upfront (monthly). Paying more
    upfront generally saves more.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: penetration test
  definition: >-
    A planned, authorized attack on your own systems to find weaknesses before a real attacker does.
    Testing your own resources in listed services needs no approval; DoS tests and testing AWS
    itself are forbidden.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  module: "09"

- term: People perspective
  definition: >-
    The CAF perspective for culture and change: skills, roles and organizational change, through
    capabilities such as cloud fluency, workforce transformation and change acceleration.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: performance efficiency pillar
  definition: >-
    The Well-Architected pillar that asks whether you use the right kind and amount of resources to
    meet your needs as demand and technology change.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [reliability pillar]
  not_to_confuse: >-
    Performance efficiency is about the right resources for the job; reliability is about something
    failing and recovering.
  module: "02"

- term: performance risk
  definition: >-
    AWS Compute Optimizer's rating, from very low to very high, of how likely a recommended instance
    type is to fall short of the workload.
  taught_in: guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md
  module: "13"

- term: period (CloudWatch alarm)
  definition: >-
    The stretch of time, such as 1 or 5 minutes, over which a CloudWatch alarm judges its metric,
    one period at a time.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: permission set
  definition: >-
    IAM Identity Center's bundle of permissions. Identity Center creates the matching IAM roles in
    the accounts you assign it to.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  module: "04"

- term: permissions boundary
  definition: >-
    A limit on what an identity's own policies can grant. It grants nothing by itself.
  taught_in: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
  also_in: [guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md]
  confused_with: [service control policy]
  not_to_confuse: >-
    A permissions boundary caps one identity; a service control policy caps every identity in a
    member account.
  module: "04"

- term: persistent
  definition: >-
    Kept when the server stops or is deleted; the opposite is temporary. An EBS volume is
    persistent, and instance store is temporary.
  taught_in: guide/05-storing-data/01-block-file-object.md
  module: "05"

- term: personal data
  definition: >-
    Information about a person, such as names, addresses and card numbers. Comprehend can find it in
    text and Transcribe can remove it from transcripts; keep it in private, encrypted storage.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [personally identifiable information]
  not_to_confuse: >-
    Personal data is any information about a person, including card numbers; PII is the part that
    identifies someone, such as a name or ID number, and is what Macie finds in S3.
  module: "10"

- term: personally identifiable information
  abbreviation: PII
  definition: >-
    Information that identifies a person, such as a name, an address or an ID number: one kind of
    sensitive data that Amazon Macie finds in S3.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  confused_with: [personal data]
  not_to_confuse: >-
    PII identifies a person, such as a name or ID number, and is what Macie finds in S3; personal
    data is any information about a person, including card numbers, as Comprehend and Transcribe
    handle it.
  module: "09"

- term: perspective (AWS CAF)
  definition: >-
    One of six groups of related capabilities in the CAF, each owned by related stakeholders:
    Business, People, Governance, Platform, Security and Operations.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [transformation domain]
  not_to_confuse: >-
    A perspective groups capabilities owned by related people; a transformation domain is one of the
    four areas that change, and process is a domain, never a perspective.
  module: "13"

- term: phishing
  definition: >-
    Tricking someone into giving away a password or code, often with a fake sign-in page or an
    urgent message.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  module: "01"

- term: phishing-resistant
  definition: >-
    Describes a second factor that a fake sign-in page can't steal, because it works only on the
    real site's address. Passkeys and security keys are; codes by text message or authenticator app
    aren't.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  module: "01"

- term: physical server
  definition: >-
    A real computer you could touch, as opposed to a virtual one. In virtualization it is called the
    host.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: pillar
  definition: >-
    One of the Well-Architected Framework's six areas of concern, each a way of judging a workload:
    operational excellence, security, reliability, performance efficiency, cost optimization and
    sustainability.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  module: "02"

- term: pilot (AWS CAF)
  definition: >-
    A small first project run for real in production, in the CAF's Launch phase, chosen so its
    lessons shape what follows.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: pilot light
  definition: >-
    A disaster recovery strategy that copies data continuously to the recovery Region and keeps core
    parts, such as the database, running, with app servers off until needed. Recovery typically
    takes tens of minutes; data loss can be much less.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md, guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [warm standby, backup and restore]
  not_to_confuse: >-
    Ask whether it could serve a customer right now: a pilot light can't until its app servers are
    switched on, while a warm standby can, at reduced size.
  module: "03"

- term: pipeline (CodePipeline)
  definition: >-
    In AWS CodePipeline, the model of a release: a series of stages that each code change passes
    through in order, stopping if one fails.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: pixel streaming
  definition: >-
    Sending only a moving picture of a screen to the user's device while the software runs
    elsewhere; keyboard and mouse input goes the other way. The WorkSpaces family works this way,
    keeping data off the device.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: plaintext
  definition: >-
    Readable data: data before it is encrypted, or after it is decrypted.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/06-everyday-security.md]
  confused_with: [ciphertext]
  not_to_confuse: >-
    Plaintext is readable by anyone who gets it; ciphertext is scrambled and useless without the
    right key.
  module: "09"

- term: platform (Elastic Beanstalk)
  definition: >-
    The operating system, language and web server software that Elastic Beanstalk runs your code
    on, such as a version of Python.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: platform as a service
  abbreviation: PaaS
  definition: >-
    A cloud model in which the provider runs the hardware and operating system and gives you a place
    to run your application; you manage the application and its data.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/06-running-applications/04-simpler-paths.md]
  confused_with: [infrastructure as a service, software as a service]
  not_to_confuse: >-
    PaaS runs your own application for you; IaaS leaves the operating system to you, and SaaS gives
    you someone else's finished application.
  module: "02"

- term: Platform perspective
  definition: >-
    The CAF perspective for infrastructure and applications: building and standardizing the cloud
    environment, through capabilities such as platform architecture, provisioning and orchestration,
    and CI/CD.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: point-in-time recovery
  definition: >-
    Restoring data to how it was at a chosen moment within the retention period, as RDS automated
    backups and DynamoDB's backups allow. On RDS the restore creates a new database.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/06-choosing-a-database.md]
  module: "05"

- term: policy
  definition: >-
    A document, usually written in JSON, that lists permissions as statements allowing or denying
    actions on resources. Nothing is allowed until a policy allows it.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: policy version
  definition: >-
    A saved earlier text of a managed policy. When you edit the policy, IAM keeps the old text as a
    version and lets you choose which version is the default.
  taught_in: guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
  module: "04"

- term: polling
  definition: >-
    Asking a queue for messages when you're ready for them, as SQS consumers do. SQS never pushes a
    message to anyone.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: port
  definition: >-
    A number that says which program on a computer traffic is for: a web server listens on 443 for
    HTTPS, and SSH logins use 22.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  module: "07"

- term: portfolio (Service Catalog)
  definition: >-
    A collection of AWS Service Catalog products that administrators grant to IAM users, groups or
    roles.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  module: "08"

- term: portfolio management
  definition: >-
    The CAF Business perspective capability that chooses and orders initiatives for their value,
    using discovery tools and the 7 Rs to sort existing applications and build a business case.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/02-seven-migration-strategies.md]
  module: "13"

- term: prediction interval
  definition: >-
    The range a forecast's real figure should fall in, which Cost Explorer sets at 80%: four times
    out of five. Steadier history gives a narrower range.
  taught_in: guide/11-paying-for-aws/03-estimate-watch-analyze.md
  module: "11"

- term: predictive scaling
  definition: >-
    A way of scaling that forecasts traffic from past daily or weekly patterns and adds capacity
    before the rise arrives.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [scheduled scaling, target tracking]
  not_to_confuse: >-
    Predictive scaling acts on a forecast learned from past patterns; scheduled scaling acts at times
    you set, and target tracking reacts once the load has changed.
  module: "06"

- term: prefix
  definition: >-
    The start of an S3 object's key, such as exports/, which works like a folder. A lifecycle rule
    can be limited to objects with a given prefix.
  taught_in: guide/05-storing-data/07-lab-05-versions-and-lifecycle.md
  also_in: [guide/05-storing-data/03-storage-classes-and-lifecycle.md]
  module: "05"

- term: preventive control
  definition: >-
    A control that stops something from happening, such as a security group rule, a WAF rule or an
    SCP.
  taught_in: guide/09-protecting-and-governing/06-a-defense-map.md
  also_in: [guide/09-protecting-and-governing/05-compliance-and-governance.md]
  confused_with: [detective control]
  not_to_confuse: >-
    A preventive control stops something before it happens; a detective control finds and records it
    afterward, and you need both because preventive controls fail quietly.
  module: "09"

- term: primary
  definition: >-
    In a database with copies, the copy that takes the writes.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [standby, read replica]
  not_to_confuse: >-
    The primary takes the writes; a standby waits to take over, and a read replica answers read-only
    queries.
  module: "05"

- term: primary key
  definition: >-
    A column whose value is different for every row of a table, such as an order number, so it picks
    out exactly one record. Another table can hold it to link to that row.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  module: "01"

- term: principal
  definition: >-
    An identity that can make a request to AWS: the root user, an IAM user or an IAM role.
    Resource-based policies name the principals they apply to.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md]
  confused_with: [identity]
  not_to_confuse: >-
    A principal is an identity that can make a request; an IAM user group is an identity but not a
    principal.
  module: "04"

- term: principle of least privilege
  definition: >-
    Giving each identity only the permissions it needs for its task: specific actions, on specific
    resources, under specific conditions, so that less can go wrong if it is misused.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in:
    - guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
    - guide/01-on-ramp/06-everyday-security.md
  module: "04"

- term: prioritized group sharing
  definition: >-
    A discount sharing setting in which a commitment serves its owner, then a group of accounts you
    define, then the rest of the organization.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  confused_with: [restricted group sharing]
  not_to_confuse: >-
    Prioritized group sharing lets an unused discount leave the group after serving it; restricted
    group sharing keeps it in the group even if it goes unused.
  module: "11"

- term: private cloud
  definition: >-
    AWS's name for an on-premises deployment in which software shares the organization's own servers
    out flexibly. It is still on-premises, and AWS notes it lacks many of the cloud's benefits.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  confused_with: [cloud deployment, on-premises deployment]
  not_to_confuse: >-
    A private cloud runs on the organization's own equipment, so it is an on-premises deployment;
    building one is not moving to the cloud.
  module: "02"

- term: private connection
  definition: >-
    In networking, a connection whose path doesn't use the public internet at all, such as AWS
    Direct Connect. It describes the path, not whether the data is encrypted.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [encryption in transit]
  not_to_confuse: >-
    Private is about the path and encrypted is about the protection: a VPN is encrypted but not
    private, and Direct Connect is private but not encrypted unless you add it.
  module: "07"

- term: private IP address
  definition: >-
    An IP address that works only inside a private network, such as a VPC. Every server in a VPC has
    one.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  confused_with: [public IP address]
  not_to_confuse: >-
    A private address is reachable only inside the network; a public address can be reached across
    the internet, when a route allows it.
  module: "07"

- term: Private Marketplace
  definition: >-
    AWS Marketplace's governance feature: administrators give each part of an organization a catalog
    of approved products. It blocks new subscriptions to anything else but doesn't control what can
    be deployed.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: private offer
  definition: >-
    An AWS Marketplace offer with pricing and terms negotiated for one buyer, instead of the
    product's public price.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: private subnet
  definition: >-
    A subnet whose route table has no route to an internet gateway, so the internet can't reach what
    is in it, even a server with a public address. It is where a database belongs.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  confused_with: [public subnet]
  not_to_confuse: >-
    A private subnet has no route to an internet gateway; it can still reach out through a NAT
    gateway or an endpoint, but nothing on the internet can start a connection in.
  module: "07"

- term: processor
  abbreviation: CPU
  definition: >-
    The central processing unit: the part of a computer that carries out a program's instructions,
    one after another, very fast. A processor with several cores can work on several things at once.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: Procurement insights
  definition: >-
    AWS Marketplace's cost management dashboard, showing Marketplace costs and agreements across all
    the accounts in an organization.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  module: "12"

- term: producer
  definition: >-
    The part of an application that sends messages, for example to an SQS queue or an SNS topic.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: product (Service Catalog)
  definition: >-
    An approved setup in AWS Service Catalog, defined by a CloudFormation template or a Terraform
    configuration. Launching it builds a stack; a new version reaches everyone who can use it.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  module: "08"

- term: product detail page
  definition: >-
    AWS Marketplace's page for one product: what it is, who sells it, how it's delivered and how
    it's priced.
  taught_in: guide/12-getting-help/05-lab-17-support-center-tour.md
  module: "12"

- term: programmatic access
  definition: >-
    Using AWS from code or commands rather than console clicks. The exam's examples are APIs, SDKs
    and the AWS CLI.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  module: "08"

- term: promote
  definition: >-
    To turn a read replica into a separate database that accepts writes, for example to recover in
    another Region. Someone has to do it and point the application at the new database.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  module: "05"

- term: prompt
  definition: >-
    The text a shell shows, often $, when it is ready for your next command.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: protocol
  definition: >-
    A set of rules both ends of a conversation follow, such as HTTP for web requests, TCP and UDP
    for packets, or NFS, SMB and iSCSI for storage.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  module: "01"

- term: provisioned capacity
  definition: >-
    A DynamoDB capacity mode in which you set the reads and writes per second and pay for them by
    the hour, which can cost less for steady, predictable traffic.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [on-demand capacity]
  not_to_confuse: >-
    Provisioned capacity is paid by the hour whether it is used or not; on-demand capacity is paid
    per request.
  module: "05"

- term: public event
  definition: >-
    An AWS service issue shown in the AWS Health Dashboard that isn't tied to any one account.
  taught_in: guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md]
  confused_with: [account-specific event]
  not_to_confuse: >-
    A public event is a service issue for everyone; an account-specific event concerns your own
    account or resources.
  module: "03"

- term: public IP address
  definition: >-
    An IP address that can be reached across the internet. An EC2 instance can get a public IPv4
    address automatically, which is released when it stops; AWS charges by the hour for every public
    IPv4 address, in use or idle.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md
    - guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [Elastic IP address, private IP address, public subnet]
  not_to_confuse: >-
    An automatic public address changes after a stop while an Elastic IP address stays yours, and
    neither makes a subnet public: only a route to an internet gateway does.
  module: "07"

- term: public subnet
  definition: >-
    A subnet whose route table has a route to an internet gateway. A server in it also needs a
    public IP address to use that route.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  confused_with: [private subnet, public IP address]
  not_to_confuse: >-
    A subnet is public because of its route to an internet gateway, not because its servers have
    public addresses; a private subnet has no such route.
  module: "07"

- term: purchasing account
  definition: >-
    The account that bought a Reserved Instance or Savings Plan, also called the owner account. Its
    own matching usage gets the discount first.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  module: "11"

- term: purchasing option
  definition: >-
    How you pay for EC2 capacity: On-Demand, Savings Plans, Reserved Instances or Spot Instances,
    or, for a rule or a guarantee, Dedicated Hosts, Dedicated Instances or Capacity Reservations. It
    never changes the instance type.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  exam_name: Amazon EC2 instance types
  confused_with: [instance type]
  not_to_confuse: >-
    A purchasing option is how you pay; an instance type is the hardware you pay for, and the same
    type can be bought any way.
  module: "11"

- term: query
  definition: >-
    A question sent to a database, such as which orders are for pickup on December 24, which the
    engine answers with the matching records. SQL is the standard language for relational queries.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [query (DynamoDB)]
  not_to_confuse: >-
    A query is any question sent to a database; a DynamoDB query is one particular read that finds
    the items sharing one partition key.
  module: "01"

- term: query (DynamoDB)
  definition: >-
    A DynamoDB read that finds every item sharing one partition key, optionally narrowed by a
    condition on the sort key, such as loading one customer's cart.
  taught_in: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
  module: "05"

- term: query result location
  definition: >-
    The S3 location where Amazon Athena writes each query's answer as files. You pay S3 for those
    files until you delete them.
  taught_in: guide/10-data-ai-and-more/04-lab-13-athena-query.md
  module: "10"

- term: queue
  definition: >-
    A place where messages wait until a consumer asks for them. In Amazon SQS, each message goes to
    one consumer, which deletes it when done.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [topic]
  not_to_confuse: >-
    A queue holds each message until one consumer pulls it; a topic pushes each message at once to
    every subscriber and keeps nothing for later.
  module: "08"

- term: rack
  definition: >-
    A tall metal frame that holds many servers, one above another, in a server room or data center.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in: [guide/01-on-ramp/04-data-centers-and-virtualization.md]
  module: "01"

- term: rate
  definition: >-
    The price of one unit of something you use, such as an instance-hour or a GB stored for a month.
    Rates differ by Region, change over time and sometimes fall as volume grows.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: rate-based rule
  definition: >-
    An AWS WAF rule that limits how many requests one client address may send in a time window: the
    usual answer to a small flood of web requests.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  module: "09"

- term: read replica
  definition: >-
    A read-only copy of an Amazon RDS database, updated asynchronously, so it can lag. It takes
    read-heavy work off the primary and can be promoted to a separate database, but outside Aurora
    it doesn't take over automatically.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/06-choosing-a-database.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [Multi-AZ deployment, standby, automated backup]
  not_to_confuse: >-
    A read replica serves reads and must be promoted by hand, losing any lag; a Multi-AZ standby
    serves nothing and fails over automatically with every change, and only a backup can undo a
    mistaken delete.
  module: "05"

- term: ready-made AI service
  definition: >-
    An AWS service whose model AWS has already trained, such as Comprehend, Textract or Polly. You
    send input through an API and get a result back, with no machine learning skills.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [Amazon SageMaker AI]
  not_to_confuse: >-
    A ready-made service answers a common need with AWS's trained model and nothing to train;
    SageMaker AI is for building, training and hosting your own model when nothing ready-made fits.
  module: "10"

- term: recovery point
  definition: >-
    In AWS Backup, one saved backup of a resource, kept in a backup vault.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [recovery point objective]
  not_to_confuse: >-
    A recovery point is one saved backup; the recovery point objective is how much data the business
    accepts losing, measured back to the last saved copy.
  module: "05"

- term: recovery point objective
  abbreviation: RPO
  definition: >-
    The most data the business accepts losing, measured as the time between the last saved copy and
    the failure. It looks back from the failure.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md]
  confused_with: [recovery time objective]
  not_to_confuse: >-
    RPO is the data you can lose, measured back to the last saved copy; RTO is how long you can be
    without service.
  module: "03"

- term: recovery Region
  definition: >-
    The second Region where a disaster recovery plan keeps its copy of the workload. It inherits the
    data's rules, so it must be inside any area the data has to stay in.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/04-the-edge.md]
  module: "03"

- term: recovery time objective
  abbreviation: RTO
  definition: >-
    The longest the business accepts a service being down after a failure. It looks forward from the
    failure.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md]
  confused_with: [recovery point objective]
  not_to_confuse: >-
    RTO is time without service; RPO is how much data you accept losing, measured back from the
    failure (P for a point in your data, T for time).
  module: "03"

- term: redundancy
  definition: >-
    Having more than one of something, such as power supplies, cooling or network connections, so
    that one failure doesn't stop the whole.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: refactor
  definition: >-
    The migration strategy, also called re-architect, that redesigns an application to use
    cloud-native features when strong business demand requires it. AWS calls it the most complex and
    costly strategy.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [rehost, relocate, replatform]
  not_to_confuse: >-
    Refactor changes the application's design; replatform changes only what it runs on, and rehost
    and relocate move it unchanged.
  module: "13"

- term: Region
  definition: >-
    A geographic area holding several Availability Zones (the lesson gives the minimum), isolated
    from other Regions; resources stay in their Region unless you copy them. Each has a name and
    code, such as US East (N. Virginia), us-east-1.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/00-start-here/05-before-your-first-lab.md, guide/02-why-the-cloud/03-telling-the-benefits-apart.md, guide/03-aws-around-the-world/02-choosing-a-region.md, guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  confused_with: [Availability Zone, edge location, Local Zone]
  not_to_confuse: >-
    A Region is a whole area holding several Availability Zones; an Availability Zone is one or more
    data centers inside it, and edge locations and Local Zones are smaller sites outside the
    Regions.
  module: "03"

- term: Region code
  definition: >-
    A Region's short code, such as us-east-1 or eu-central-1, used in commands, settings and
    resource names.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md]
  module: "03"

- term: Regional Reserved Instance
  definition: >-
    A Reserved Instance whose discount applies in any Availability Zone of its Region and, for Linux
    on shared tenancy, to any size in the same family. It reserves no capacity.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  confused_with: [zonal Reserved Instance]
  not_to_confuse: >-
    A Regional Reserved Instance follows your instances across AZs and sizes but reserves nothing; a
    zonal one reserves capacity in one AZ, for exact matches only.
  module: "11"

- term: Regional service
  definition: >-
    A service AWS runs across several Availability Zones of a Region for you, behind one Regional
    address, such as Amazon S3 or AWS Lambda.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  confused_with: [zonal resource, global service]
  not_to_confuse: >-
    A Regional service is spread across one Region's Availability Zones; a zonal resource lives in a
    single Availability Zone, and a global service isn't tied to one Region.
  module: "03"

- term: rehost
  definition: >-
    The migration strategy, also called lift and shift, that moves each server to AWS unchanged, as
    an Amazon EC2 instance running the same software. Optimizing comes later.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in:
    - guide/13-moving-to-aws/03-migration-tools.md
    - guide/13-moving-to-aws/05-sim-portfolio-sorter.md
  confused_with: [refactor, relocate, replatform]
  not_to_confuse: >-
    Rehost moves servers one by one onto EC2 with nothing changed; relocate moves a whole platform,
    replatform changes what the application runs on, and refactor redesigns it.
  module: "13"

- term: relational database
  definition: >-
    A database that keeps data in tables of rows and columns that link to each other, queried in
    SQL, and changes several tables together in one transaction. On AWS it is Amazon RDS or Amazon
    Aurora.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in:
    - guide/05-storing-data/06-choosing-a-database.md
    - guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [NoSQL]
  not_to_confuse: >-
    A relational database links tables with a fixed schema and joins them; NoSQL databases use other
    models, such as items fetched by key or documents, and don't join tables.
  module: "05"

- term: reliability pillar
  definition: >-
    The Well-Architected pillar that asks whether a workload does its job correctly whenever it is
    needed, and recovers when something fails. High availability and durability belong here.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [performance efficiency pillar]
  not_to_confuse: >-
    Reliability is about failing and recovering; performance efficiency is about using the right
    kind and amount of resources.
  module: "02"

- term: relocate
  definition: >-
    The migration strategy that moves many servers at once from an on-premises platform, such as
    VMware, to a cloud version of the same platform, or moves a resource to another VPC, Region or
    account.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  confused_with: [refactor, rehost, replatform]
  not_to_confuse: >-
    Relocate moves a whole platform, or a resource between VPCs, Regions or accounts, unchanged;
    rehost moves servers onto EC2 one by one, and replatform and refactor change the application.
  module: "13"

- term: repeatable process
  definition: >-
    A task that will be done again, where each run must give the same result, such as building an
    identical copy of a setup. Write it down: a template for whole setups, a script for routine
    tasks.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  confused_with: [one-time operation]
  not_to_confuse: >-
    A repeatable process must give the same result every run, so it belongs in a script or a
    template; a one-time operation needn't be repeated, so the console or one CLI command will do.
  module: "08"

- term: replatform
  definition: >-
    The migration strategy, also called lift, tinker and shift, that moves an application with a few
    changes to what it runs on, such as moving a SQL Server database onto Amazon RDS.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in:
    - guide/13-moving-to-aws/03-migration-tools.md
    - guide/13-moving-to-aws/05-sim-portfolio-sorter.md
  confused_with: [refactor, rehost, relocate]
  not_to_confuse: >-
    Replatform changes what the application runs on, not its code; rehost and relocate change
    nothing, and refactor redesigns the application itself.
  module: "13"

- term: replay
  definition: >-
    Reading records in a Kinesis data stream again after they were first read, for example after
    fixing a bug. It works because records stay in the stream for its retention period.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: replication
  definition: >-
    Copying every change to a second place as it happens. It copies mistakes, deletions and
    corruption too, so it doesn't replace backups.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md, guide/05-storing-data/05-managed-or-self-managed-databases.md]
  confused_with: [backup]
  not_to_confuse: >-
    A replica shows the data as it is now, mistakes included; a backup shows it as it was, so only a
    backup can undo damage.
  module: "03"

- term: replication lag
  definition: >-
    How far a copy kept by asynchronous replication, such as a read replica, is behind its primary.
    It varies, and changes not yet copied are lost if the copy has to take over.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  module: "05"

- term: repurchase
  definition: >-
    The migration strategy, also called drop and shop, that replaces an application with a different
    product or version, often software as a service.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: request
  definition: >-
    What a client sends a server to ask for something, such as a web page, or to save an order. The
    server sends back a response.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in:
    - guide/01-on-ramp/02-networks-ip-dns-https.md
    - guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: request charge
  definition: >-
    A charge per call or per run, such as per thousand S3 reads or per Lambda invocation. It follows
    use exactly, so a service nobody uses charges nothing for requests.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: Reserved Instance
  abbreviation: RI
  definition: >-
    An EC2 purchasing option in which you commit to one instance configuration for one or three
    years in return for a lower rate. It's a billing discount on matching running instances, not a
    machine.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    - guide/11-paying-for-aws/05-lab-15-pricing-calculator.md
  confused_with: [On-Demand Instance, Spot Instance, Savings Plans]
  not_to_confuse: >-
    A Reserved Instance commits to one configuration for a lower rate; a Savings Plan commits to
    dollars per hour more flexibly, On-Demand commits to nothing, and Spot can be interrupted.
  module: "11"

- term: Resource (policy element)
  definition: >-
    The part of a policy statement that names which resources it covers, by their ARNs; * means all.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: resource control policy
  abbreviation: RCP
  definition: >-
    An AWS Organizations policy that caps what anyone, even someone outside the organization, can do
    to resources in member accounts.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  confused_with: [service control policy]
  not_to_confuse: >-
    An RCP caps what anyone can do to the resources in member accounts; an SCP caps what the users
    and roles in member accounts can do.
  module: "09"

- term: resource map
  definition: >-
    A tab in the VPC console that draws how a VPC's parts connect: subnets, route tables and
    gateways.
  taught_in: guide/07-connecting-it/05-lab-09-build-a-small-vpc.md
  module: "07"

- term: resource timeline
  definition: >-
    The AWS Config console view of one resource's configuration items and rule results over time,
    which can also show the CloudTrail events behind each change.
  taught_in: guide/09-protecting-and-governing/09-sim-config-timeline.md
  module: "09"

- term: resource-based policy
  definition: >-
    A policy attached to a resource, such as an S3 bucket, that says who may do what to that
    resource, so it must name a principal. Within one account an allow here is enough; across
    accounts both sides must allow.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  also_in: [guide/08-building-and-operating/04-connecting-parts-shipping-software.md]
  confused_with: [identity-based policy, cross-account role]
  not_to_confuse: >-
    A resource-based policy sits on the resource and names who may use it; an identity-based policy
    sits on the identity and names what it may use.
  module: "04"

- term: response
  definition: >-
    What a server sends back to answer a client's request: the result, such as a page, or an error.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in:
    - guide/01-on-ramp/02-networks-ip-dns-https.md
    - guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: restore (S3 Glacier)
  definition: >-
    For S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive, a request that makes a temporary
    readable copy of an object, which you must wait for before you can read it.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  module: "05"

- term: restricted group sharing
  definition: >-
    A discount sharing setting in which a commitment's discount never leaves a group of accounts you
    define, even if it goes unused.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  confused_with: [prioritized group sharing]
  not_to_confuse: >-
    Restricted group sharing keeps a discount inside the group even when it is wasted; prioritized
    group sharing serves the group first, then the rest of the organization.
  module: "11"

- term: retain
  definition: >-
    The migration strategy of keeping an application where it is for now, for reasons such as
    compliance, high risk, dependencies, a recent upgrade, special hardware or a SaaS version still
    to come.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: retire
  definition: >-
    The migration strategy of decommissioning or archiving an application so its servers can be shut
    down, for example when it has no business value, no recent users or unsupported software.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: retrieval fee
  definition: >-
    A charge per GB each time you read data from some S3 storage classes: Standard-IA, One Zone-IA
    and the Glacier classes. It can make a cold class cost more than S3 Standard for data that is
    read often.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  module: "05"

- term: review question
  definition: >-
    One of the Well-Architected Framework's numbered questions for a pillar, such as REL 10 on fault
    isolation. Each question has its own best practices, and a full review answers them all.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  also_in: [guide/14-capstone/02-lab-18-well-architected-tool-review.md]
  confused_with: [best practice]
  not_to_confuse: >-
    A review question, such as REL 10, asks about one area of a pillar; its best practices, such as
    REL10-BP01, are the specific actions that answer it.
  module: "14"

- term: review scope
  definition: >-
    A written statement of what a review covers and what it leaves out: a boundary, not the size of
    the job. It tells the owner what wasn't looked at.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  module: "14"

- term: rightsizing
  definition: >-
    Choosing the type, size and number of resources that meet your needs at the lowest cost, and
    repeating the choice as usage, prices and resource types change.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  also_in:
    - guide/13-moving-to-aws/04-the-business-case.md
    - guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md
  module: "02"

- term: rollback (CloudFormation)
  definition: >-
    Undoing a failed stack operation, returning to the state before it started. A failed create
    deletes what it made; a failed update returns to the last working state.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in: [guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md]
  module: "08"

- term: root (AWS Organizations)
  definition: >-
    The top of an organization's tree, above every organizational unit and account. A policy
    attached to it, such as an SCP, applies to every member account.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/09-protecting-and-governing/10-sim-organizations-and-scps.md]
  confused_with: [root user]
  not_to_confuse: >-
    The organization root is the top of the account tree, where policies attach; the root user is
    the all-powerful sign-in identity of one account.
  module: "09"

- term: root user
  definition: >-
    The identity created with an AWS account from the sign-up email and password, with complete
    account access. IAM policies can't be attached to it, so keep it for root-only tasks, protected
    by MFA, with no access keys.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  confused_with: [IAM user]
  not_to_confuse: >-
    The root user's power can't be narrowed by IAM policies; even an IAM admin user gets its power
    from policies and can't do root-only tasks.
  module: "04"

- term: root volume
  definition: >-
    The EBS volume that holds an EC2 instance's operating system. It is usually set to be deleted
    when the instance is terminated; if it isn't, it keeps billing until you delete it.
  taught_in: guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md
  also_in: [guide/06-running-applications/01-ec2.md]
  module: "06"

- term: root-only task
  definition: >-
    A task that needs the root user's credentials. Such tasks change the account itself or rescue it
    from a lockout; see the lesson for the current list.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  module: "04"

- term: rotation
  definition: >-
    Replacing a secret with a new one on a schedule. Of AWS's two stores, only Secrets Manager does
    it automatically.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: route
  definition: >-
    One line in a route table: a destination, which is a range of addresses, and a target, such as
    an internet gateway, a NAT gateway or an endpoint. When two routes match, the more specific one
    wins.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  module: "07"

- term: route table
  definition: >-
    A list of routes that decides where traffic leaving a subnet goes. Every subnet uses exactly one;
    if you don't choose one, it uses the VPC's main route table.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  module: "07"

- term: router
  definition: >-
    A device that passes data from one network toward another, reading each packet's address. A home
    router is often the Wi-Fi box.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: routing policy
  definition: >-
    The rule that tells Route 53 how to choose its answer when a user could be sent to more than one
    place. Each policy, such as failover, latency, geolocation or weighted, answers a different
    question.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: row
  definition: >-
    One record in a database table, such as one order. Each row has a primary key that no other row
    shares.
  taught_in: guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [column]
  not_to_confuse: >-
    A row is one record; a column is one fact that every record in the table has, such as the pickup
    date.
  module: "01"

- term: rule (EventBridge)
  definition: >-
    An EventBridge setting holding a pattern, such as "an EC2 instance stopped", that sends each
    matching event on a bus to the rule's targets.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: runaway cost
  definition: >-
    Spending that keeps growing because something nobody is watching keeps running, such as
    forgotten instances and a NAT gateway left on over a weekend.
  taught_in: guide/11-paying-for-aws/08-sim-guardrail-timeline.md
  module: "11"

- term: S3 Block Public Access
  definition: >-
    S3 settings that override any bucket policy or ACL making data public. Settable per
    organization, account and bucket; the strictest combination wins. New buckets have them on;
    check account-level settings, which started off in new accounts (see the lesson).
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [bucket policy, encryption at rest]
  not_to_confuse: >-
    A bucket policy grants or denies access and encryption protects the stored bytes; Block Public
    Access overrides any grant to the public, whatever the policy says, and doesn't affect access
    given to named identities.
  module: "05"

- term: S3 File Gateway
  definition: >-
    The Storage Gateway type that presents a shared folder over NFS or SMB and stores each file as
    an object in an S3 bucket, keeping recently used files in a local cache. Its full name is Amazon
    S3 File Gateway.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [Volume Gateway, Tape Gateway]
  not_to_confuse: >-
    S3 File Gateway looks like a shared folder of files; Volume Gateway looks like disks, and Tape
    Gateway like a tape library for backup software.
  module: "05"

- term: S3 Glacier Deep Archive
  definition: >-
    S3's cheapest storage class, for records read less than once a year and kept for years, such as
    for compliance, replacing tape. Objects must be restored before reading, taking many hours, and
    it has S3's longest minimum stay.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 Glacier Flexible Retrieval, S3 Glacier Instant Retrieval]
  not_to_confuse: >-
    Deep Archive is the cheapest to store but the slowest to get back; Flexible Retrieval restores
    in minutes to hours, and Instant Retrieval reads in milliseconds.
  module: "05"

- term: S3 Glacier Flexible Retrieval
  definition: >-
    The S3 Glacier class for backups and disaster recovery copies read once or twice a year. You
    restore an object before reading it, which takes minutes to hours depending on the option; the
    class was formerly named S3 Glacier.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 Glacier Instant Retrieval, S3 Glacier Deep Archive]
  not_to_confuse: >-
    Flexible Retrieval needs a restore of minutes to hours; Instant Retrieval needs none but costs
    more to store, and Deep Archive costs less but its restores take many hours.
  module: "05"

- term: S3 Glacier Instant Retrieval
  definition: >-
    The S3 Glacier class for archive data read about once a quarter that must come back in
    milliseconds, with no restore step. It charges per GB read and has a minimum stay; see the
    lesson.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  confused_with: [S3 Glacier Flexible Retrieval, S3 Glacier Deep Archive, S3 Standard-IA]
  not_to_confuse: >-
    Instant Retrieval reads in milliseconds like Standard-IA, for data read even less often;
    Flexible Retrieval and Deep Archive cost less to store but need a restore first, taking minutes
    to hours and many hours.
  module: "05"

- term: S3 Glacier storage classes
  definition: >-
    S3 archive storage classes, for data you must keep but rarely read: S3 Glacier Instant
    Retrieval, S3 Glacier Flexible Retrieval and S3 Glacier Deep Archive. They're ordinary classes
    in ordinary buckets; pick by how fast you need data back.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  exam_name: Amazon S3 Glacier
  confused_with: [Amazon Glacier]
  not_to_confuse: >-
    The S3 Glacier storage classes live in S3 buckets and use the S3 API and lifecycle rules; Amazon
    Glacier is the older, separate vault service, closed to new customers.
  module: "05"

- term: S3 Intelligent-Tiering
  definition: >-
    An S3 storage class for unknown or changing access patterns: S3 moves each object to cheaper
    tiers when unread for a while, and back when read. No retrieval fees, but small per-object
    monitoring fees; tiny objects are never moved.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  confused_with: [S3 Standard-IA, S3 One Zone-IA, S3 Lifecycle]
  not_to_confuse: >-
    Intelligent-Tiering moves each object by its reads, for unpredictable patterns; Standard-IA and
    One Zone-IA suit data you know is read about monthly and charge per GB read, and lifecycle rules
    you set move objects by age.
  module: "05"

- term: S3 Lifecycle
  definition: >-
    Rules on an S3 bucket that transition objects to colder storage classes, or expire (delete)
    them, a number of days after creation. Rules can cover the whole bucket or a prefix or tag, and
    can act on noncurrent versions.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 Intelligent-Tiering]
  not_to_confuse: >-
    Lifecycle rules move objects by age on a schedule you set, for data whose cooling you know;
    Intelligent-Tiering moves each object by its own reads, for data you can't predict.
  module: "05"

- term: S3 Object Lock
  definition: >-
    An S3 feature that stops object versions from being deleted or overwritten until a date you set:
    write once, read many (WORM). In its compliance mode nobody, not even the root user, can remove
    the protection early.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/03-storage-classes-and-lifecycle.md]
  confused_with: [versioning, MFA Delete, Vault Lock]
  not_to_confuse: >-
    Object Lock forbids deletes until a date; versioning keeps old versions that someone with
    permission can still delete, MFA Delete only demands an MFA code for such deletes, and Vault
    Lock protects AWS Backup vaults rather than S3 objects.
  module: "05"

- term: S3 One Zone-IA
  definition: >-
    An S3 storage class like Standard-IA but cheaper, storing data in a single Availability Zone, so
    the data can be lost if that zone is destroyed. Use it only for infrequently read data you can
    recreate.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/01-block-file-object.md]
  confused_with: [S3 Standard-IA]
  not_to_confuse: >-
    One Zone-IA keeps data in one Availability Zone and suits data you can recreate; Standard-IA
    costs more but survives the loss of a zone.
  module: "05"

- term: S3 Replication
  definition: >-
    An S3 feature that copies new objects automatically to another bucket, in another Region
    (Cross-Region Replication) or the same Region (Same-Region Replication), in the same account or
    another.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [versioning]
  not_to_confuse: >-
    S3 Replication keeps a copy in another bucket, which protects against losing the first bucket;
    versioning keeps earlier versions inside the same bucket, which protects against overwrites and
    deletes.
  module: "05"

- term: S3 Standard
  definition: >-
    The default S3 storage class, for data read often: no minimum stay and no retrieval fee, with
    copies across several Availability Zones and the highest designed availability of the classes
    (see the lesson for the figures).
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 Standard-IA]
  not_to_confuse: >-
    Standard costs more to store but nothing to read; Standard-IA is cheaper to store, charges per
    GB read and is designed for lower availability, with the same durability.
  module: "05"

- term: S3 Standard-IA
  definition: >-
    An S3 storage class for infrequent access: data read about monthly that must still return in
    milliseconds. Cheaper to store than S3 Standard but charged per GB read, with a minimum stay, a
    minimum billed size and lower designed availability.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 One Zone-IA, S3 Intelligent-Tiering, S3 Standard]
  not_to_confuse: >-
    Standard-IA keeps copies across several Availability Zones for a known monthly pattern; One
    Zone-IA is cheaper but in one zone, Intelligent-Tiering suits unknown patterns, and Standard has
    higher designed availability.
  module: "05"

- term: SageMaker AI Savings Plan
  definition: >-
    A Savings Plan for SageMaker AI instances in any family, size, Region or component.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: sampling (X-Ray)
  definition: >-
    X-Ray tracing some requests rather than all, to keep costs down. Its default rule records the
    first request each second and a small share of the rest.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: Savings Plans
  definition: >-
    A commitment to spend a set amount per hour on eligible usage for one or three years, charged at
    lower rates. Commitment unused in an hour is lost. AWS recommends them over Reserved Instances.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  exam_name: AWS Savings Plans
  confused_with: [Reserved Instance]
  not_to_confuse: >-
    A Savings Plan commits to dollars per hour and follows your usage as it changes; a Reserved
    Instance commits to one instance configuration, and only a zonal one reserves capacity.
  module: "11"

- term: scalability
  definition: >-
    In plain words, a system's ability to grow to handle more work. AWS gives no formal definition,
    and "scalability is manual, elasticity is automatic" is a myth.
  taught_in: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
  confused_with: [elasticity]
  not_to_confuse: >-
    Scalability means a system can grow; elasticity means capacity follows demand in both
    directions, which is the answer when a scenario shows capacity rising and falling.
  module: "02"

- term: Scale phase
  definition: >-
    The fourth CAF phase: expanding pilots to the size the business needs and making sure the
    benefits are realized and kept, before the cycle repeats.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: scaled score
  definition: >-
    A score adjusted so that every version of the exam is equally hard to pass. The exam reports
    pass or fail on this scale; see the lesson for the range and the pass mark.
  taught_in: guide/00-start-here/03-the-exam-at-a-glance.md
  module: "00"

- term: scaling policy
  definition: >-
    A rule that changes an Auto Scaling group's desired capacity as load changes, for example "keep
    average processor use near 50%".
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  module: "06"

- term: scheduled action
  definition: >-
    One planned change to an Auto Scaling group's capacity at a time you set, such as raising the
    minimum before a busy morning. Scheduled scaling is made of these.
  taught_in: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
  module: "06"

- term: scheduled scaling
  definition: >-
    A way of scaling that changes an Auto Scaling group's capacity at times you set, such as before
    opening hours. Each planned change is a scheduled action.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [target tracking, predictive scaling]
  not_to_confuse: >-
    Scheduled scaling follows a timetable you write; predictive scaling writes its own forecast from
    past traffic, and target tracking reacts to the load it measures.
  module: "06"

- term: schema
  definition: >-
    The fixed layout a relational database expects: which tables, which columns and which types. AWS
    SCT converts it when a database moves to a different engine.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  module: "05"

- term: schema on read
  definition: >-
    Applying a table's layout when files are queried rather than when they're stored, so the files
    themselves never change. Amazon Athena works this way on files in S3.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [schema]
  not_to_confuse: >-
    A relational database's schema is fixed before data goes in, and data must fit it; with schema
    on read, a layout is applied to unchanged files only as a query reads them.
  module: "10"

- term: scoring rubric
  definition: >-
    A table that describes weak, good and strong work for each part of a task. The capstone review
    is scored with one instead of a mastery check.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  also_in: [guide/14-capstone/00-brief.md]
  module: "14"

- term: script
  definition: >-
    A text file holding a list of commands that a computer runs in order. Running it again repeats
    the steps, which may fail or make duplicates, because a script doesn't know what the end result
    should be.
  taught_in: guide/08-building-and-operating/01-four-ways-in.md
  confused_with: [template (CloudFormation)]
  not_to_confuse: >-
    A script lists steps to run in order; a CloudFormation template describes the end result, so
    CloudFormation works out the order, compares what exists, and builds the same setup again.
  module: "08"

- term: search index
  definition: >-
    A structure listing which words appear in which records, so a search finds them fast. Amazon
    OpenSearch Service builds one over text and logs.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  module: "10"

- term: secret
  definition: >-
    Any value that grants access, such as a password, an API key or a token.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: security group
  definition: >-
    A stateful firewall around a resource, such as an EC2 instance, with allow rules only: a new one
    lets nothing in and everything out, and replies to allowed requests pass automatically. AWS
    provides it; its rules are yours to write.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md, guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md, guide/06-running-applications/01-ec2.md, guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md, guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  confused_with: [network ACL]
  not_to_confuse: >-
    A security group guards one resource, only allows and lets replies through; a network ACL guards
    a whole subnet, can deny, and checks replies again.
  module: "07"

- term: security in the cloud
  definition: >-
    Your side of the shared responsibility model: your data, your settings, who can reach them, and
    any software you run. How much it includes depends on the service.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  confused_with: [security of the cloud]
  not_to_confuse: >-
    Security in the cloud is what you put there and how you set it up; security of the cloud is the
    infrastructure underneath, which AWS protects.
  module: "04"

- term: security key
  definition: >-
    A small hardware key that works like a passkey: you touch it to prove who you are, and it won't
    work on a fake sign-in page. AWS recommends passkeys and security keys first for MFA.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in: [guide/04-shared-responsibility-and-access/05-credentials-and-federation.md]
  module: "01"

- term: security layer
  definition: >-
    One place in the path from the internet to your data where you can put controls: the edge, the
    network, compute, data, identity and account, or the organization.
  taught_in: guide/09-protecting-and-governing/06-a-defense-map.md
  module: "09"

- term: security of the cloud
  definition: >-
    AWS's side of the shared responsibility model: the infrastructure that runs its services, from
    the host operating system and virtualization layer down to the buildings.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  confused_with: [security in the cloud]
  not_to_confuse: >-
    Security of the cloud is the infrastructure AWS protects; security in the cloud is your data,
    settings, access and any software you run.
  module: "04"

- term: Security perspective
  definition: >-
    The CAF perspective for compliance and assurance: protecting data, identities and systems and
    proving compliance, through capabilities such as identity and access management, threat
    detection and incident response.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: security pillar
  definition: >-
    The Well-Architected pillar that asks whether data, systems and accounts are protected. It is
    generally not traded away for other pillars.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  module: "02"

- term: security standard
  definition: >-
    A published list of recommended settings, such as the CIS AWS Foundations Benchmark or PCI DSS.
    A service can check your settings against one and report each setting that fails.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  module: "09"

- term: self-managed database
  definition: >-
    A database you install and run yourself, for example on EC2, so the operating system, patches,
    backups, replication and failover are yours. Choose it only for a real reason, such as an engine
    RDS lacks or needing operating system access.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/06-choosing-a-database.md]
  confused_with: [managed database]
  not_to_confuse: >-
    On a self-managed database you run everything from the operating system up; on a managed
    database AWS runs that, and you keep your data, access and query tuning.
  module: "05"

- term: sensitive data
  definition: >-
    Data that needs extra protection, such as personal or financial details and credentials. Amazon
    Macie finds it in S3.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  module: "09"

- term: sentiment
  definition: >-
    The feeling a piece of text expresses: positive, negative, neutral or mixed. Amazon Comprehend
    detects it, for example to find the angry customer reviews.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: server
  definition: >-
    A computer that runs all the time and answers requests from other computers, its clients, over a
    network. Being a server is a job, not a kind of machine; a website runs on one or more.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in: [guide/02-why-the-cloud/01-what-cloud-computing-is.md]
  confused_with: [client]
  not_to_confuse: >-
    A server waits for requests and answers them, while a client sends the requests; the same
    laptop can be either.
  module: "01"

- term: server-month
  definition: >-
    One server running for one month: a unit for comparing the cost of owning capacity with renting
    it.
  taught_in: guide/02-why-the-cloud/07-sim-demand-curve.md
  also_in: [guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md]
  module: "02"

- term: server-side encryption
  definition: >-
    Encryption that the storage service, such as S3, applies as it stores your data and removes when
    an allowed caller reads it. Its kinds differ in who holds the key: SSE-S3, SSE-KMS or SSE-C.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [client-side encryption]
  not_to_confuse: >-
    With server-side encryption S3 encrypts the data after receiving it; with client-side encryption
    you encrypt it before uploading and manage the keys and tools yourself.
  module: "05"

- term: serverless
  definition: >-
    A way of running things where AWS provisions, scales and patches the servers out of sight and
    you pay for what you use, as with AWS Lambda and Fargate. Your code, images, data and
    permissions are still yours to secure.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  also_in:
    - guide/06-running-applications/04-simpler-paths.md
    - guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "06"

- term: service (Amazon ECS)
  definition: >-
    In Amazon ECS, a setting that keeps a chosen number of tasks running, replacing any that stop,
    for apps that run all the time such as a web API.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: service control policy
  abbreviation: SCP
  definition: >-
    A policy set in AWS Organizations that caps what users and roles in a member account can do,
    including that account's root user. It grants nothing, and it doesn't apply to the
    organization's management account.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  also_in: [guide/04-shared-responsibility-and-access/09-sim-policy-playground.md, guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md, guide/09-protecting-and-governing/10-sim-organizations-and-scps.md, guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [identity-based policy, permissions boundary, resource control policy]
  not_to_confuse: >-
    An SCP caps every user and role in a member account, root included, and grants nothing; an IAM
    identity-based policy grants access, a permissions boundary caps one identity, and an RCP caps
    access to resources.
  module: "09"

- term: Service health
  definition: >-
    The public view of the AWS Health Dashboard: events for every service and Region that aren't
    about any one account, open to anyone without signing in. Older material calls it the Service
    Health Dashboard.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [Your account health]
  not_to_confuse: >-
    Service health shows public events to anyone, with no sign-in; Your account health, after you
    sign in, adds the events that affect your own resources.
  module: "12"

- term: service link
  definition: >-
    The network connection between an AWS Outpost and the AWS Region it extends.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: service quota
  definition: >-
    The most of something an account may have or use, such as how many of a resource it can run in a
    Region. Older pages call quotas limits; you ask for more in Support Center or the Service Quotas
    console.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: service-linked role
  definition: >-
    A role an AWS service creates and owns so it can act for you. You can view its permissions but
    not edit them.
  taught_in: guide/04-shared-responsibility-and-access/03-identities.md
  module: "04"

- term: Services in Scope
  definition: >-
    AWS's page listing, for each compliance program, which AWS services were included in the
    assessment. A service missing from the list isn't forbidden; you decide whether it will handle
    regulated data.
  taught_in: guide/09-protecting-and-governing/05-compliance-and-governance.md
  module: "09"

- term: SES sandbox
  definition: >-
    The limited state every new Amazon SES account starts in, separately in each Region: it sends
    only to verified addresses, in small numbers, until you request production access.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/10-data-ai-and-more/03-people-apps-and-devices.md]
  module: "08"

- term: severity
  definition: >-
    A security service's estimate of how urgent a finding is, such as Low, Medium, High or Critical.
    Your knowledge of the business still decides what to handle first.
  taught_in: guide/09-protecting-and-governing/08-sim-security-findings-tour.md
  also_in: [guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md]
  confused_with: [case severity]
  not_to_confuse: >-
    A finding's severity is a security service's estimate of how urgent it is; case severity is how
    serious you say your problem is when you open a support case.
  module: "09"

- term: shared control
  definition: >-
    A kind of control that applies on both sides, with AWS and you each doing it for your own
    things: patch management, configuration management, and awareness and training. "Shared" doesn't
    mean done together.
  taught_in: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
  also_in: [guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md]
  confused_with: [inherited control, customer-specific control]
  not_to_confuse: >-
    In a shared control the kind of work is shared but each specific task belongs to one side; an
    inherited control is all AWS's, and a customer-specific control is all yours.
  module: "04"

- term: shared responsibility model
  definition: >-
    AWS's description of which security work AWS does and which you do. AWS secures the cloud
    itself; you secure what you put in it, and the line moves with the service you choose.
  taught_in: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
  also_in: [guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md, guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md]
  module: "04"

- term: shell
  definition: >-
    The program that reads what you type at a command line, runs the program you named, shows its
    output, then waits for the next line.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [terminal]
  not_to_confuse: >-
    The shell reads and runs your commands; the terminal is only the window you type them in.
  module: "01"

- term: shell variable
  definition: >-
    A short name that holds a value for the rest of a command-line session, such as a bucket name,
    so you type the value only once.
  taught_in: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
  module: "08"

- term: Shield Response Team
  abbreviation: SRT
  definition: >-
    AWS engineers who specialize in DDoS response, available around the clock to Shield Advanced
    subscribers who also have a qualifying Support plan (see the lesson). With permission, they can
    change your WAF rules during an attack.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/12-getting-help/01-support-plans.md]
  module: "09"

- term: short-term trial
  definition: >-
    A Free Tier offer that starts when you first activate a service and lasts a limited time.
    Short-term trials are available on the Paid plan only.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  confused_with: [Always Free offer]
  not_to_confuse: >-
    A short-term trial ends a limited time after you activate the service, on the Paid plan only; an
    Always Free offer renews every month on both plans.
  module: "11"

- term: shut down
  definition: >-
    The last stage of a service's retirement: the service no longer exists. A shut-down service
    appears in this guide only so you can reject it as a wrong answer.
  taught_in: guide/00-start-here/04-aws-changes-fast.md
  confused_with: [closed to new customers, end of support]
  not_to_confuse: >-
    A shut-down service is gone for everyone; a service closed to new customers, or with an end of
    support announced, still works for existing customers.
  module: "00"

- term: single point of failure
  definition: >-
    One part whose failure stops the whole system. Availability Zones are designed not to share one.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  module: "03"

- term: single sign-on
  definition: >-
    One sign-in, with MFA, that gives access to many accounts and applications. AWS IAM Identity
    Center provides it for a workforce.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  module: "04"

- term: six advantages of cloud computing
  definition: >-
    AWS's list of the cloud's main benefits: trade fixed expense for variable expense; benefit from
    massive economies of scale; stop guessing capacity; increase speed and agility; stop spending
    money running and maintaining data centers; go global in minutes.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  also_in: [guide/02-why-the-cloud/01-what-cloud-computing-is.md, guide/02-why-the-cloud/03-telling-the-benefits-apart.md]
  module: "02"

- term: slot (Amazon Lex)
  definition: >-
    A detail a Lex bot must collect to fulfill an intent, such as the order number or pickup time;
    the bot asks for any that are missing.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  confused_with: [intent (Amazon Lex)]
  not_to_confuse: >-
    A slot is a detail the bot collects, such as the order number; the intent is what the customer
    wants done with it, such as checking that order.
  module: "10"

- term: SMB
  definition: >-
    A common way for computers to share files over a network, used mostly by Windows. Amazon FSx for
    Windows File Server and S3 File Gateway can use it.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  confused_with: [NFS, iSCSI]
  not_to_confuse: >-
    SMB is the usual Windows way to share files and NFS the usual Linux way, so Windows shared
    folders point to SMB; iSCSI presents disks, not files.
  module: "05"

- term: snapshot
  definition: >-
    A point-in-time copy of one disk or database, such as an EBS volume or an RDS database, which
    you restore to create a new one as it was then. Each service has its own snapshots, schedules
    and settings.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/05-storing-data/01-block-file-object.md, guide/05-storing-data/05-managed-or-self-managed-databases.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [AWS Backup, AWS Elastic Disaster Recovery]
  not_to_confuse: >-
    A snapshot brings back one resource's data; AWS Backup runs backups of many resources under one
    plan, and Elastic Disaster Recovery brings back whole running servers within minutes.
  module: "05"

- term: software
  definition: >-
    The programs that run on a computer, written as code. The operating system and applications are
    both software.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [hardware]
  not_to_confuse: >-
    Software is the programs; hardware is the physical parts they run on.
  module: "01"

- term: software as a service
  abbreviation: SaaS
  definition: >-
    A cloud model in which the provider runs a finished application entirely, such as web-based
    email; you manage only how you use it and your data in it.
  taught_in: guide/02-why-the-cloud/01-what-cloud-computing-is.md
  also_in: [guide/13-moving-to-aws/02-seven-migration-strategies.md]
  confused_with: [infrastructure as a service, platform as a service]
  not_to_confuse: >-
    SaaS is a finished application you only use; PaaS runs an application you wrote, and IaaS gives
    you building blocks to run yourself.
  module: "02"

- term: Software Assurance
  definition: >-
    A Microsoft program, paid on top of a license, that adds rights such as License Mobility.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md]
  module: "13"

- term: sort key
  definition: >-
    The second part of a DynamoDB item's key, which tells apart the items that share a partition
    key, such as the product in a cart.
  taught_in: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
  confused_with: [partition key]
  not_to_confuse: >-
    The sort key distinguishes items within one group; the partition key chooses the group.
  module: "05"

- term: source server
  definition: >-
    A server you are moving or protecting, in your data center or in another cloud, whose disks MGN
    or Elastic Disaster Recovery copies.
  taught_in: guide/13-moving-to-aws/03-migration-tools.md
  module: "13"

- term: speech synthesis
  definition: >-
    Turning text into spoken audio, as Amazon Polly does. Polly returns the audio right away, so
    nothing is stored in your account unless you save it.
  taught_in: guide/10-data-ai-and-more/05-lab-14-polly-text-to-speech.md
  module: "10"

- term: split charge rule
  definition: >-
    A cost category rule that divides one value's costs among others, proportionally, evenly or by
    fixed percentages, so shared costs such as a logging account are spread fairly.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  module: "11"

- term: Spot Instance
  definition: >-
    An EC2 purchasing option that uses spare EC2 capacity at a large discount, with no commitment,
    but AWS can interrupt it after a two-minute warning. It suits flexible work that can stop and
    restart.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/06-running-applications/01-ec2.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  confused_with: [On-Demand Instance, Reserved Instance]
  not_to_confuse: >-
    A Spot Instance can be taken back by AWS, so it suits interruptible work only; On-Demand and
    Reserved Instances run until you stop them.
  module: "11"

- term: Spot price
  definition: >-
    The hourly price of a Spot Instance, set by EC2 for each instance type in each Availability
    Zone, which moves gradually with long-term supply and demand.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: SQL
  definition: >-
    The standard language for querying relational databases. Data warehouses such as Amazon Redshift
    use it too.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in:
    - guide/05-storing-data/05-managed-or-self-managed-databases.md
    - guide/01-on-ramp/03-files-vs-databases.md
  confused_with: [NoSQL]
  not_to_confuse: >-
    SQL is a query language, used by relational databases and Redshift alike; NoSQL describes
    databases built on models other than relational tables.
  module: "05"

- term: SQL injection
  definition: >-
    Typing database commands into a form field so that the site's database runs them. It arrives
    like an honest request, so only something that reads requests, such as AWS WAF, can stop it.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [cross-site scripting]
  not_to_confuse: >-
    SQL injection attacks the site's database through a form; cross-site scripting plants a script
    that runs in other visitors' browsers.
  module: "09"

- term: SQL Server edition
  definition: >-
    The version of Microsoft SQL Server you license, such as Enterprise or Standard. Enterprise has
    more features and costs much more, so check whether its features are used.
  taught_in: guide/13-moving-to-aws/04-the-business-case.md
  also_in: [guide/13-moving-to-aws/06-sim-rightsizing-and-licensing.md]
  module: "13"

- term: SSE-C
  definition: >-
    Server-side encryption with a key you supply with each request. New buckets have it turned off
    until you deliberately enable it.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [SSE-S3, SSE-KMS]
  not_to_confuse: >-
    With SSE-C you send the key every time; with SSE-S3 and SSE-KMS the key stays in AWS.
  module: "05"

- term: SSE-KMS
  definition: >-
    Server-side encryption with a key in AWS Key Management Service (AWS KMS), where you control who
    may use the key. Choose it when you must show who can decrypt the data; it adds AWS KMS request
    charges.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [SSE-S3, SSE-C]
  not_to_confuse: >-
    SSE-KMS lets you control, and show, who can use the key; SSE-S3 leaves the key entirely to S3,
    and SSE-C has you send the key with each request.
  module: "05"

- term: SSE-S3
  definition: >-
    Server-side encryption with keys that S3 manages. It is S3's default, applied automatically to
    every new object at no extra charge, and you can't turn encryption off for new uploads.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  confused_with: [SSE-KMS, SSE-C]
  not_to_confuse: >-
    SSE-S3 uses keys S3 manages for you; SSE-KMS uses a key in AWS KMS whose use you control, and
    SSE-C uses a key you send with each request.
  module: "05"

- term: stack (CloudFormation)
  definition: >-
    The set of resources CloudFormation creates from one template, created, changed and deleted as
    one unit. Deleting the stack deletes its resources, except any set to be kept.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in: [guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md]
  confused_with: [StackSet]
  not_to_confuse: >-
    A stack is one template's resources in one account and Region; a StackSet creates and updates
    stacks from one template across several accounts and Regions together.
  module: "08"

- term: stack event
  definition: >-
    One line on a CloudFormation stack's Events tab: one step CloudFormation took, with its time and
    status, such as a failed create and its reason.
  taught_in: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
  module: "08"

- term: StackSet
  definition: >-
    A way to create and update stacks from one CloudFormation template across several accounts and
    Regions together, such as an organization's standard setup.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  confused_with: [stack (CloudFormation)]
  not_to_confuse: >-
    A StackSet manages stacks from one template across many accounts and Regions at once; a stack is
    one template's resources in one account and Region.
  module: "08"

- term: stage (API Gateway)
  definition: >-
    A named version of an API in API Gateway, such as test or production.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [stage (CodePipeline)]
  not_to_confuse: >-
    An API Gateway stage is a named version of a live API, such as test or production; a
    CodePipeline stage is one step a code change passes through on its way to release.
  module: "07"

- term: stage (CodePipeline)
  definition: >-
    One step of a release in AWS CodePipeline, such as source, build, test, approval or deploy. A
    failed stage stops the release before it reaches customers.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [stage (API Gateway)]
  not_to_confuse: >-
    A CodePipeline stage is one step a code change passes through on its way to release; an API
    Gateway stage is a named version of a live API, such as test or production.
  module: "08"

- term: staging area
  definition: >-
    In Elastic Disaster Recovery and AWS Transform MGN, the low-cost storage and very little compute
    in an AWS Region that receive the continuous copies of your servers, ready to launch from.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  also_in: [guide/13-moving-to-aws/03-migration-tools.md]
  module: "05"

- term: stakeholder
  definition: >-
    A person with a say in, or a stake in, a change, such as the CFO. Many appear in more than one
    CAF perspective, so a job title doesn't settle the perspective.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  module: "13"

- term: standard queue
  definition: >-
    The default SQS queue type: nearly unlimited throughput, each message delivered at least once
    (occasionally twice), and order kept only on a best-effort basis.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [FIFO queue]
  not_to_confuse: >-
    A standard queue gives the most throughput but may deliver a message twice or out of order; a
    FIFO queue keeps the order and processes each message exactly once.
  module: "08"

- term: Standard Reserved Instance
  definition: >-
    The Reserved Instance with the bigger discount and less freedom: you can modify some attributes,
    such as its Availability Zone or size, and sell it on the Reserved Instance Marketplace, but not
    exchange it.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/11-paying-for-aws/07-sim-purchasing-option-tree.md]
  confused_with: [Convertible Reserved Instance]
  not_to_confuse: >-
    A Standard Reserved Instance discounts more and can be sold but not exchanged; a Convertible one
    discounts less but can be exchanged for another family, operating system or tenancy.
  module: "11"

- term: standby
  definition: >-
    A second copy, such as a database in another Availability Zone, that takes over if the first
    fails. Amazon RDS adds one when you turn on a Multi-AZ deployment.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  also_in: [guide/03-aws-around-the-world/03-surviving-failure.md, guide/05-storing-data/05-managed-or-self-managed-databases.md, guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [warm standby, read replica]
  not_to_confuse: >-
    A standby database in another Availability Zone gives in-Region high availability, serving no
    queries; a read replica serves reads but doesn't take over automatically; a warm standby is a
    smaller working copy of a workload in another Region.
  module: "03"

- term: state machine
  definition: >-
    A Step Functions workflow: a series of steps, each called a state, run in order and tracked to
    the end. Standard workflows can run for up to a year; Express ones are short and high-volume.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  module: "08"

- term: stateful
  definition: >-
    Describes a filter that remembers each conversation, so a reply to an allowed request passes
    without a rule of its own. Security groups are stateful.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  confused_with: [stateless]
  not_to_confuse: >-
    A stateful filter lets replies through on its own; a stateless one judges every packet,
    replies included, by its rules alone.
  module: "07"

- term: stateless
  definition: >-
    Describes a filter that remembers nothing, so it judges every packet, replies included, by its
    rules alone. Network ACLs are stateless; the Well-Architected Framework also uses the word for
    applications that keep no session data on their servers.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  confused_with: [stateful]
  not_to_confuse: >-
    A stateless filter needs rules for both halves of every conversation; a stateful one allows the
    reply because it remembers the request.
  module: "07"

- term: statement
  definition: >-
    One permission inside a policy: an Effect, an Action, a Resource, and an optional Condition. A
    policy can hold several.
  taught_in: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
  module: "04"

- term: static IP address
  definition: >-
    An internet address that doesn't change. AWS Global Accelerator gives an application static
    addresses that stay the same while you move the endpoints behind them.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: statistic (CloudWatch)
  definition: >-
    How CloudWatch combines a period's data points into one value, such as Sum, which adds them up,
    or Average.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: status code
  definition: >-
    The number in an HTTP response that says how the request went, such as 200 (OK) or 404 (not
    found).
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: stop (EC2 instance)
  definition: >-
    To shut an EC2 instance down so it can be started again later. Instance time stops being
    billed, but its EBS volumes and any Elastic IP address are still charged, and instance store is
    erased.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md]
  confused_with: [terminate (EC2 instance)]
  not_to_confuse: >-
    A stopped instance can be started again and still costs money for its disks; a terminated
    instance is gone for good, with its volumes deleted if they are set to be.
  module: "06"

- term: storage
  definition: >-
    Long-term space for files and data, on a disk or SSD, that keeps its contents with the power
    off; one of the main IT resources. It is bigger and slower than memory.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  also_in:
    - guide/02-why-the-cloud/01-what-cloud-computing-is.md
    - guide/05-storing-data/01-block-file-object.md
  confused_with: [memory]
  not_to_confuse: >-
    Storage keeps data with the power off; memory holds only the work in progress and is emptied by
    a restart.
  module: "01"

- term: storage charge
  definition: >-
    A charge per GB kept per month, prorated for how long the data was kept. EBS bills the size you
    set, not the data you wrote.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  module: "11"

- term: storage class
  definition: >-
    A setting on each S3 object that decides how it is stored, how fast you get it back and how it
    is billed. New objects go to S3 Standard unless you choose otherwise.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  module: "05"

- term: storage optimized
  definition: >-
    EC2 instance types with large, fast local disks, for work that reads and writes a lot of data on
    them, such as high-throughput databases. Its letters include I, D and H.
  taught_in: guide/06-running-applications/01-ec2.md
  confused_with: [memory optimized]
  not_to_confuse: >-
    Storage optimized means heavy, fast use of large local disks, not just more space: for more
    space, attach a bigger EBS volume or use S3, and for data held in RAM choose memory optimized.
  module: "06"

- term: streaming data
  definition: >-
    Data that arrives continuously, a little at a time, such as clicks on a website, and is handled
    seconds after it happens.
  taught_in: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
  confused_with: [batch]
  not_to_confuse: >-
    Streaming data flows in all the time and is handled as it arrives; a batch is a large amount
    handled at once, such as yesterday's orders.
  module: "10"

- term: subcommand
  definition: >-
    In the AWS CLI, the part after the command that says what to do, such as ls (list) in aws s3 ls.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  module: "01"

- term: subnet
  definition: >-
    A slice of a VPC's address range that sits entirely in one Availability Zone; you launch servers
    and databases into subnets. High availability therefore needs subnets in at least two zones.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  also_in: [guide/07-connecting-it/05-lab-09-build-a-small-vpc.md]
  module: "07"

- term: subscription (Amazon SNS)
  definition: >-
    The link between an SNS topic and one endpoint, such as an email address, an SQS queue or a
    Lambda function. An email subscription delivers nothing until its owner confirms it.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: support case
  definition: >-
    One request for help, opened in AWS Support Center and tracked until it's closed. Every plan can
    open account and billing cases and quota increase requests; technical cases need a paid plan.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/02-tools-that-watch-your-account.md, guide/12-getting-help/03-where-to-find-answers.md, guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: Support plan
  definition: >-
    The level of AWS Support an account subscribes to. Every account has one; the free one is Basic,
    and each paid plan includes everything in the plans below it.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/06-sim-support-plan-chooser.md]
  module: "12"

- term: sustainability pillar
  definition: >-
    The Well-Architected pillar that asks whether you use as few resources, and as little energy, as
    you can.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  confused_with: [cost optimization pillar]
  not_to_confuse: >-
    Sustainability measures resources and energy; cost optimization measures money, though the two
    usually point the same way.
  module: "02"

- term: synchronous
  definition: >-
    Describes a call where the caller waits for the answer, as a browser waits for a page. If the
    other side fails, the caller fails with it.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  confused_with: [asynchronous]
  not_to_confuse: >-
    In a synchronous call the caller waits and fails with the other side; in an asynchronous one it
    hands the work over, often through a queue or topic, and moves on.
  module: "08"

- term: synchronous replication
  definition: >-
    Writing each change to a copy at the same moment as to the primary, so the copy is always up to
    date and each write waits for both. A Multi-AZ standby is kept this way.
  taught_in: guide/05-storing-data/05-managed-or-self-managed-databases.md
  also_in: [guide/05-storing-data/10-sim-multi-az-vs-read-replica.md]
  confused_with: [asynchronous replication]
  not_to_confuse: >-
    Synchronous replication keeps the copy always in step but makes each write slightly slower;
    asynchronous replication sends changes just after, so the copy can lag.
  module: "05"

- term: system integrator
  definition: >-
    A partner company that sells services: it designs, builds, migrates and connects systems for
    customers, and some also run them day to day. Older material calls this a Consulting Partner.
  taught_in: guide/12-getting-help/04-partners-and-paid-help.md
  confused_with: [independent software vendor]
  not_to_confuse: >-
    A system integrator sells services; an independent software vendor sells software it makes.
  module: "12"

- term: table
  definition: >-
    A named collection of related records in a database: rows and columns in a relational database,
    items in DynamoDB. In DynamoDB you choose only the key in advance, and items needn't share their
    other attributes.
  taught_in: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
  also_in:
    - guide/05-storing-data/05-managed-or-self-managed-databases.md
    - guide/05-storing-data/06-choosing-a-database.md
    - guide/01-on-ramp/03-files-vs-databases.md
  module: "05"

- term: tag
  definition: >-
    A label you attach to an AWS resource, made of a key and a value that you choose. Tags let one
    search find everything with that label, in every Region.
  taught_in: guide/00-start-here/05-before-your-first-lab.md
  also_in:
    - guide/02-why-the-cloud/06-lab-01-first-resource.md
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
  module: "00"

- term: tag activation
  definition: >-
    Choosing, in the billing console of a management or standalone account, which tag keys billing
    tools use. It labels usage from then on, not before.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in: [guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md]
  module: "11"

- term: tag backfill
  definition: >-
    A management account's request to apply its current cost allocation tag activations to past
    months, back to a limit, but only where the resource carried the tag at the time.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in: [guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md]
  module: "11"

- term: Tag Editor
  definition: >-
    A console tool that finds resources by their tags across Regions, which makes it a quick check
    that a lab left nothing behind. AWS has said tag management is moving to the AWS Resource
    Explorer console; see the lab.
  taught_in: guide/02-why-the-cloud/06-lab-01-first-resource.md
  also_in:
    - guide/03-aws-around-the-world/05-lab-02-see-the-global-infrastructure.md
    - guide/14-capstone/03-lab-19-close-out.md
  module: "02"

- term: Tape Gateway
  definition: >-
    The Storage Gateway type that presents a virtual tape library over iSCSI to existing backup
    software. Tapes are stored in S3 and archived to the S3 Glacier classes, so physical tapes can
    go without changing backup jobs.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [AWS Backup, S3 File Gateway]
  not_to_confuse: >-
    Tape Gateway lets existing backup software keep writing tapes; AWS Backup is AWS's own service
    that runs backups of resources by a plan, and S3 File Gateway is for people saving files.
  module: "05"

- term: target
  definition: >-
    Where AWS passes work on to. For a load balancer, a target is a server, container, IP address or
    Lambda function receiving requests; for an EventBridge rule, a service, such as a Lambda
    function or SNS topic, receiving matching events.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/08-building-and-operating/04-connecting-parts-shipping-software.md]
  module: "06"

- term: target tracking
  definition: >-
    A way of scaling that adds or removes instances to keep a measure, such as average processor
    use, near a value you set. It suits most websites.
  taught_in: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
  also_in: [guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md]
  confused_with: [scheduled scaling, predictive scaling]
  not_to_confuse: >-
    Target tracking reacts to load as it happens; scheduled scaling changes capacity at times you
    set, and predictive scaling adds capacity before a forecast rise.
  module: "06"

- term: task (Amazon ECS)
  definition: >-
    In Amazon ECS, running containers that do a piece of work, started from a task definition. A
    task can run for a while and stop, or a service can keep it running.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: task definition
  definition: >-
    In Amazon ECS, the description of an app's containers, such as which image to use and how much
    CPU and memory they get, from which ECS starts tasks.
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: task statement
  definition: >-
    One of the specific things a domain of the exam tests, numbered within its domain. The exam
    guide lists them, and each page of this guide names the ones it covers.
  taught_in: guide/00-start-here/03-the-exam-at-a-glance.md
  confused_with: [domain]
  not_to_confuse: >-
    A task statement is one specific thing the exam tests; a domain is the broad subject area that
    groups several of them.
  module: "00"

- term: TCP
  definition: >-
    One of the internet's two core protocols, with IP: it splits data into packets, puts them back
    in order at the far end, and has any that go missing sent again.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [UDP]
  not_to_confuse: >-
    TCP confirms that every packet arrives, in order; UDP skips those checks to be faster.
  module: "01"

- term: Technical Account Manager
  abbreviation: TAM
  definition: >-
    A named person at AWS assigned to your company, who learns your setup, guides your plans and
    pulls in AWS specialists. Enterprise Support is the first plan that includes one.
  taught_in: guide/12-getting-help/01-support-plans.md
  also_in: [guide/12-getting-help/04-partners-and-paid-help.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  module: "12"

- term: template (CloudFormation)
  definition: >-
    A YAML or JSON text file that describes the resources you want and their settings.
    CloudFormation builds a stack from it and works out the order itself, so the same file builds
    the same setup in any Region.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  also_in:
    - guide/08-building-and-operating/01-four-ways-in.md
    - guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
  confused_with: [launch template]
  not_to_confuse: >-
    A CloudFormation template describes a whole set of resources; a launch template describes one
    EC2 instance, so Auto Scaling can launch identical copies, and a CloudFormation template can
    contain one.
  module: "08"

- term: temporary credentials
  definition: >-
    Credentials AWS issues for a limited time, from minutes to hours, and then stops accepting. AWS
    STS issues them, and roles and federation are built on them.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in:
    - guide/04-shared-responsibility-and-access/03-identities.md
    - guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    - guide/08-building-and-operating/01-four-ways-in.md
  confused_with: [long-term credentials]
  not_to_confuse: >-
    Temporary credentials expire on their own; long-term credentials, such as access keys, work
    until someone deletes them.
  module: "04"

- term: tenancy
  definition: >-
    Whether your instance shares physical hardware with other AWS customers (shared, the default) or
    runs on hardware used only by you (dedicated).
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in: [guide/01-on-ramp/04-data-centers-and-virtualization.md]
  module: "11"

- term: term (commitment)
  definition: >-
    The length of a Savings Plan or Reserved Instance commitment, one or three years; three earns
    the bigger discount. When a Reserved Instance's term ends, it doesn't renew.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  module: "11"

- term: terminal
  definition: >-
    The window you type commands in.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  confused_with: [shell]
  not_to_confuse: >-
    The terminal is the window you type in; the shell is the program that reads your typing and runs
    the commands.
  module: "01"

- term: terminate (EC2 instance)
  definition: >-
    To delete an EC2 instance for good. It also deletes the volumes set to delete on termination
    and any instance store data, and ends the instance's charges.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md]
  confused_with: [stop (EC2 instance)]
  not_to_confuse: >-
    Terminating is permanent and ends the charges; stopping can be undone and leaves the disks
    billed.
  module: "06"

- term: test event
  definition: >-
    Sample input that you save in the Lambda console and send to a function, standing in for what a
    real event would send.
  taught_in: guide/06-running-applications/05-lab-07-a-lambda-function.md
  module: "06"

- term: threat
  definition: >-
    Someone or something actively trying to cause harm, such as an attacker using stolen
    credentials. Amazon GuardDuty reports threats.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  confused_with: [vulnerability]
  not_to_confuse: >-
    A threat is harmful activity, possibly happening now; a vulnerability is a weakness that does
    nothing until someone uses it.
  module: "09"

- term: threshold (CloudWatch alarm)
  definition: >-
    The line a CloudWatch alarm compares its metric with, such as 3 or more errors in a period.
    Breaching it for the set number of periods moves the alarm to ALARM.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  module: "08"

- term: throttling
  definition: >-
    Capping how fast calls may arrive, so a spike doesn't overwhelm the code behind an API.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: throughput
  definition: >-
    How much data storage reads or writes each second: one of the two ways storage speed is counted.
    The other is IOPS.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  confused_with: [IOPS]
  not_to_confuse: >-
    Throughput counts how much data moves each second; IOPS counts how many separate reads and
    writes happen.
  module: "01"

- term: time to live
  abbreviation: TTL
  definition: >-
    How long other DNS servers may keep a copy of a DNS answer before asking again. Until copies
    expire, some users still go to the old place, so a DNS switch isn't instant.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: time-based charge
  definition: >-
    A charge for every second or hour a resource exists or runs, whether or not it does any work, as
    for EC2 instances, NAT gateways, load balancers and public IPv4 addresses.
  taught_in: guide/11-paying-for-aws/01-how-aws-charges.md
  also_in: [guide/11-paying-for-aws/05-lab-15-pricing-calculator.md]
  module: "11"

- term: token
  definition: >-
    A short-lived pass issued after you sign in, which stops working by itself, so the access
    expires without anyone having to remove it.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  module: "01"

- term: topic
  definition: >-
    A named channel in Amazon SNS. Each message published to it is pushed at once to all its
    subscriptions.
  taught_in: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
  also_in: [guide/08-building-and-operating/06-lab-11-alarm-on-errors.md]
  confused_with: [queue]
  not_to_confuse: >-
    A topic pushes each message at once to every subscriber and keeps nothing; a queue holds each
    message until one consumer pulls it.
  module: "08"

- term: total cost of ownership
  abbreviation: TCO
  definition: >-
    Every cost of owning and running something over its whole life, not only the purchase price. A
    server's TCO is usually far above its price tag.
  taught_in: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
  also_in: [guide/13-moving-to-aws/04-the-business-case.md]
  module: "02"

- term: trace
  definition: >-
    The record X-Ray keeps of everything one request did, as segments with start and end times, so
    you can see which call took the time.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: trace map
  definition: >-
    An X-Ray drawing of the parts of an application that call each other, from the client to the
    services behind it, so slow or failing links stand out.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  module: "08"

- term: trade-off
  definition: >-
    Accepting less of one good thing to get more of another, such as less reliability in a test
    environment to save money. The Framework expects trade-offs, but security and operational
    excellence are generally not traded away.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  also_in: [guide/14-capstone/01-the-capstone-review.md]
  module: "02"

- term: trail
  definition: >-
    A CloudTrail setting that delivers events to an S3 bucket you choose, and optionally to
    CloudWatch Logs and EventBridge, so you can keep account activity as long as you need.
  taught_in: guide/08-building-and-operating/03-watching-workloads.md
  also_in: [guide/09-protecting-and-governing/01-who-did-what.md, guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md]
  confused_with: [Event history]
  not_to_confuse: >-
    A trail must be created beforehand and keeps events in your bucket as long as you choose; Event
    history is on from the start but keeps only recent management events.
  module: "08"

- term: training (machine learning)
  definition: >-
    The step that builds a machine learning model from many examples. AWS has already trained the
    models behind its ready-made AI services; with Amazon SageMaker AI you train your own.
  taught_in: guide/10-data-ai-and-more/02-ai-and-ml.md
  module: "10"

- term: transaction
  definition: >-
    A set of changes, such as an order and its lines, that a relational database applies together:
    all succeed or all fail, so nothing is half-saved.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  also_in: [guide/01-on-ramp/03-files-vs-databases.md]
  module: "05"

- term: transactional email
  definition: >-
    Email an application sends to one customer, such as an order confirmation or a password reset.
    Amazon SES sends it, along with marketing email and newsletters.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: transactional workload
  definition: >-
    Work that runs the business: many small reads and writes all day, each touching a few rows, such
    as saving an order. Amazon RDS and Amazon Aurora are built for it.
  taught_in: guide/05-storing-data/06-choosing-a-database.md
  confused_with: [analytics workload]
  not_to_confuse: >-
    Transactional work is many small requests that change data; analytics work is fewer, larger
    queries that read much of it, and both can use SQL.
  module: "05"

- term: transformation domain
  definition: >-
    One of the four areas the CAF says change, each enabling the next: technology, process,
    organization and product. Process is a domain, not a perspective.
  taught_in: guide/13-moving-to-aws/01-the-cloud-adoption-framework.md
  confused_with: [perspective (AWS CAF)]
  not_to_confuse: >-
    A transformation domain is an area that changes (technology, process, organization, product); a
    perspective groups the capabilities that make change possible, and process is never one.
  module: "13"

- term: transition action
  definition: >-
    A lifecycle action that moves objects to another storage class a number of days after they were
    created, or after they became noncurrent. Each transition is a billed request.
  taught_in: guide/05-storing-data/03-storage-classes-and-lifecycle.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [expiration action]
  not_to_confuse: >-
    A transition action moves an object to another class; an expiration action deletes it.
  module: "05"

- term: transitive
  definition: >-
    Passing along: traffic can travel through one network to reach a third. VPC peering is not
    transitive; a transit gateway is.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: Transport Layer Security
  abbreviation: TLS
  definition: >-
    The protocol that encrypts web traffic and other network connections; the S in HTTPS. A
    certificate lets the client check that the server is who it claims to be.
  taught_in: guide/09-protecting-and-governing/02-encryption.md
  also_in: [guide/01-on-ramp/02-networks-ip-dns-https.md]
  module: "09"

- term: trigger
  definition: >-
    The connection that tells AWS Lambda which events start a function, for example "a new object
    in this bucket".
  taught_in: guide/06-running-applications/03-containers-and-serverless.md
  module: "06"

- term: trust policy
  definition: >-
    The resource-based policy on a role that says who may assume it. The role's separate permissions
    policy says what it may do.
  taught_in: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
  also_in: [guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md, guide/04-shared-responsibility-and-access/09-sim-policy-playground.md]
  module: "04"

- term: Trusted Advisor check
  definition: >-
    One automatic test Trusted Advisor runs on your account, such as whether the root user has MFA.
    AWS adds and retires checks, so learn the categories and which plans see which checks, not a
    count.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  module: "12"

- term: Trusted Advisor Priority
  definition: >-
    A Trusted Advisor feature on Enterprise Support and Unified Operations: your AWS account team
    picks out the recommendations that matter most for your business, so you work on those first.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/01-support-plans.md, guide/12-getting-help/06-sim-support-plan-chooser.md]
  module: "12"

- term: tunnel
  definition: >-
    An encrypted connection carried across another network, such as the internet. Each Site-to-Site
    VPN connection comes with a second tunnel, for high availability.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  module: "07"

- term: UDP
  definition: >-
    A protocol that sends packets without confirming that they arrive, which makes it faster than
    TCP. Live video, calls and games often use it.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  confused_with: [TCP]
  not_to_confuse: >-
    UDP is faster because it doesn't check delivery; TCP confirms that every packet arrives and puts
    them back in order.
  module: "01"

- term: uninterruptible power supply
  abbreviation: UPS
  definition: >-
    A bank of batteries in a data center that takes over the instant the mains electricity fails,
    powering the servers until the backup generators are running.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  module: "01"

- term: unscored question
  definition: >-
    A question AWS is trying out that doesn't count toward your score. You can't tell which
    questions they are, so answer every one.
  taught_in: guide/00-start-here/03-the-exam-at-a-glance.md
  module: "00"

- term: URL
  definition: >-
    A web address, such as https://bakery.example/order, which an HTTP request names.
  taught_in: guide/01-on-ramp/02-networks-ip-dns-https.md
  module: "01"

- term: usage plan
  definition: >-
    In API Gateway, an allowance of calls given to an outside developer, tied to their API key.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  module: "07"

- term: user-defined tag
  definition: >-
    A cost allocation tag you create and apply yourself, with Tag Editor, the console or the API.
    Reports show it with the user: prefix, and keys are case-sensitive.
  taught_in: guide/11-paying-for-aws/04-many-accounts-one-bill.md
  also_in: [guide/11-paying-for-aws/06-lab-16-cost-allocation-tags.md]
  confused_with: [AWS-generated tag]
  not_to_confuse: >-
    You apply user-defined tags yourself, prefixed user: in reports; AWS applies AWS-generated tags
    such as aws:createdBy, and only the management account can activate those.
  module: "11"

- term: variable expense
  definition: >-
    A cost that rises and falls with how much you use, such as servers rented by the hour. Trading
    fixed expense for variable expense is the first of AWS's six advantages of cloud computing.
  taught_in: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
  also_in: [guide/02-why-the-cloud/04-what-a-data-center-really-costs.md]
  confused_with: [fixed expense, operating expense]
  not_to_confuse: >-
    Variable or fixed asks whether a cost follows use; operating or capital asks when you pay, so a
    flat monthly fee is an operating expense but not a variable one.
  module: "02"

- term: Vault Lock
  definition: >-
    An AWS Backup feature that stops backups in a vault being deleted before their retention ends, a
    defense against mistakes and ransomware. In governance mode, permitted users can remove it; in
    compliance mode, after its grace period, no one can.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [S3 Object Lock]
  not_to_confuse: >-
    Vault Lock protects backups in an AWS Backup vault; S3 Object Lock protects object versions in
    an S3 bucket.
  module: "05"

- term: vCPU
  definition: >-
    A virtual processor: the unit in which EC2 instance types, and Fargate tasks, state their
    processing power.
  taught_in: guide/06-running-applications/01-ec2.md
  also_in: [guide/06-running-applications/03-containers-and-serverless.md]
  module: "06"

- term: version control
  definition: >-
    A system, such as Git, that keeps every version of a file with who changed it and when, so an
    earlier version can be brought back. Templates belong in it, like code.
  taught_in: guide/08-building-and-operating/02-iac-and-automation.md
  module: "08"

- term: version ID
  definition: >-
    The identifier S3 gives each version of an object in a versioned bucket. Deleting by version ID
    removes that version for good.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/07-lab-05-versions-and-lifecycle.md]
  module: "05"

- term: versioning
  definition: >-
    An S3 bucket setting keeping every version of each object under its key so overwrites and
    deletes can be undone. Off by default; once on, it can be suspended but never disabled, and each
    version is billed in full.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  also_in: [guide/05-storing-data/03-storage-classes-and-lifecycle.md, guide/05-storing-data/07-lab-05-versions-and-lifecycle.md, guide/05-storing-data/09-sim-lifecycle-cost-timeline.md]
  confused_with: [S3 Replication, backup, S3 Object Lock]
  not_to_confuse: >-
    Versioning keeps earlier versions inside the same bucket, so it undoes mistakes but is lost with
    the bucket; replication or a backup keeps a copy somewhere else, and only Object Lock stops
    someone with permission deleting a version for good.
  module: "05"

- term: virtual desktop
  definition: >-
    A complete desktop, with start menu, apps and files, that runs on a server somewhere else and
    appears on your screen. Amazon WorkSpaces provides them.
  taught_in: guide/10-data-ai-and-more/03-people-apps-and-devices.md
  module: "10"

- term: virtual machine
  abbreviation: VM
  definition: >-
    A computer made of software, running on a host with its own guest operating system. Cloud
    providers call it a virtual server, and Amazon EC2 calls it an instance.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  confused_with: [container]
  not_to_confuse: >-
    A virtual machine carries a whole operating system of its own; a container packages one
    application and shares its machine's operating system, and often runs inside a virtual machine.
  module: "01"

- term: virtual private gateway
  definition: >-
    The AWS end of a Site-to-Site VPN, attached to one VPC. To reach many VPCs, a VPN ends on a
    transit gateway instead.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [customer gateway device]
  not_to_confuse: >-
    The virtual private gateway is AWS's end of the VPN; the customer gateway device is the router at
    your office.
  module: "07"

- term: virtual private network
  abbreviation: VPN
  definition: >-
    A way to carry a network's traffic across the internet in an encrypted tunnel. It is encrypted,
    but still over the internet, so it isn't a private connection.
  taught_in: guide/01-on-ramp/06-everyday-security.md
  also_in: [guide/07-connecting-it/04-connecting-networks-and-offices.md]
  confused_with: [private connection]
  not_to_confuse: >-
    A VPN encrypts traffic that still crosses the internet; a private connection keeps traffic off
    the internet's path but isn't encrypted unless you add it.
  module: "01"

- term: virtual private server
  abbreviation: VPS
  definition: >-
    A virtual server rented on its own, usually at a monthly price. Amazon Lightsail's servers are
    of this kind, though Lightsail calls them instances.
  taught_in: guide/06-running-applications/04-simpler-paths.md
  module: "06"

- term: virtual server
  definition: >-
    A cloud provider's name for a virtual machine: what you rent instead of a physical server.
    Amazon EC2 calls one an instance.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  also_in: [guide/01-on-ramp/01-computers-and-servers.md]
  module: "01"

- term: virtualization
  definition: >-
    Software that imitates hardware, so that one physical server runs several virtual machines, kept
    apart by a hypervisor. AWS runs the virtualization layer and the host operating system beneath
    it.
  taught_in: guide/01-on-ramp/04-data-centers-and-virtualization.md
  also_in: [guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md]
  module: "01"

- term: VMware
  definition: >-
    A widely used software platform that runs many virtual machines on shared physical servers.
    Moving it whole to AWS is the common case of relocate.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  also_in: [guide/13-moving-to-aws/05-sim-portfolio-sorter.md]
  module: "13"

- term: voice engine
  definition: >-
    The kind of speech model behind an Amazon Polly voice, such as Standard, Neural, Generative or
    Long-Form. More natural-sounding engines cost more per character; see the lesson.
  taught_in: guide/10-data-ai-and-more/05-lab-14-polly-text-to-speech.md
  module: "10"

- term: volume
  definition: >-
    One block storage disk, of a size you choose, such as an Amazon EBS volume attached to an EC2
    instance.
  taught_in: guide/05-storing-data/01-block-file-object.md
  also_in: [guide/05-storing-data/04-hybrid-storage-and-backup.md]
  module: "05"

- term: Volume Gateway
  definition: >-
    The Storage Gateway type presenting disks to on-premises servers over iSCSI. Cached mode keeps
    all data in S3 and frequently used data locally; stored mode keeps it all on premises, with
    point-in-time EBS snapshots in AWS.
  taught_in: guide/05-storing-data/04-hybrid-storage-and-backup.md
  confused_with: [S3 File Gateway, Tape Gateway]
  not_to_confuse: >-
    Volume Gateway presents disks, and its two modes differ in where the full dataset lives; S3 File
    Gateway presents a folder, and Tape Gateway presents tapes.
  module: "05"

- term: VPC endpoint
  definition: >-
    A private path from a VPC to an AWS service, such as Amazon S3, that keeps traffic on AWS's
    network with no internet gateway or NAT gateway. It comes in two kinds, gateway and interface.
  taught_in: guide/07-connecting-it/01-your-own-network.md
  confused_with: [endpoint]
  not_to_confuse: >-
    A VPC endpoint is a private path from your VPC to a service; an endpoint, as Global Accelerator
    uses the word, is where an application receives traffic.
  module: "07"

- term: VPC Flow Logs
  definition: >-
    A VPC feature that records information about the traffic to and from your network interfaces,
    for troubleshooting and security analysis. It records traffic; it doesn't block any.
  taught_in: guide/07-connecting-it/02-filtering-traffic.md
  module: "07"

- term: VPC peering
  definition: >-
    A connection joining two VPCs, in the same or different accounts and Regions, so they talk over
    private addresses like one network. It is one-to-one, not transitive, address ranges must not
    overlap, and it costs nothing to keep.
  taught_in: guide/07-connecting-it/04-connecting-networks-and-offices.md
  confused_with: [AWS Transit Gateway, AWS PrivateLink]
  not_to_confuse: >-
    Peering joins two whole VPCs, each pair needing its own connection; Transit Gateway joins many
    networks through one hub, and PrivateLink exposes one service without joining networks.
  module: "07"

- term: vulnerability
  definition: >-
    A weakness an attacker could use, such as an unpatched software flaw or a port left open. It
    does nothing until someone uses it; Amazon Inspector finds them.
  taught_in: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
  confused_with: [threat]
  not_to_confuse: >-
    A vulnerability is a weakness that could be attacked; a threat is someone actually trying to
    cause harm.
  module: "09"

- term: warm standby
  definition: >-
    A disaster recovery strategy that keeps a smaller but complete working copy in the recovery
    Region, which only has to scale up to take over. Recovery typically takes minutes.
  taught_in: guide/03-aws-around-the-world/03-surviving-failure.md
  also_in: [guide/03-aws-around-the-world/06-sim-blast-radius.md]
  confused_with: [pilot light, hot standby, standby]
  not_to_confuse: >-
    A warm standby can serve customers at once at reduced size; a pilot light can't until its app
    servers start, and a hot standby is a full-size copy that takes no customers until failover.
  module: "03"

- term: Wavelength Zone
  definition: >-
    AWS compute and storage placed inside telecom carriers' 5G networks, for very low latency to
    mobile devices. The CLF-C02 exam guide lists AWS Wavelength as out of scope, so know it only to
    reject it.
  taught_in: guide/03-aws-around-the-world/04-the-edge.md
  confused_with: [Local Zone]
  not_to_confuse: >-
    A Wavelength Zone is inside a mobile carrier's 5G network; a Local Zone is in a big city for any
    nearby users.
  module: "03"

- term: web ACL
  definition: >-
    Web access control list: the set of rules AWS WAF applies to requests, each matching something
    about a request and taking an action. AWS's newer console calls it a protection pack.
  taught_in: guide/09-protecting-and-governing/04-the-front-door.md
  also_in: [guide/09-protecting-and-governing/06-a-defense-map.md]
  confused_with: [network ACL, access control list]
  not_to_confuse: >-
    A web ACL holds WAF rules that read web requests; a network ACL filters addresses and ports at a
    subnet's edge, and an S3 access control list grants access to buckets.
  module: "09"

- term: web server
  definition: >-
    A server that sends web pages back to the browsers that request them.
  taught_in: guide/01-on-ramp/01-computers-and-servers.md
  module: "01"

- term: weighted routing
  definition: >-
    A Route 53 routing policy that sends a share of users to each place you choose, such as 10 in 100
    to a new version of a site.
  taught_in: guide/07-connecting-it/03-names-and-the-edge.md
  confused_with: [failover routing]
  not_to_confuse: >-
    Weighted routing splits users by shares you set; failover routing sends everyone to the main site
    until its health check fails.
  module: "07"

- term: workload
  definition: >-
    The set of parts (code, settings and AWS resources) that together deliver something of value,
    such as a shop's ordering site.
  taught_in: guide/02-why-the-cloud/05-the-well-architected-framework.md
  also_in:
    - guide/14-capstone/01-the-capstone-review.md
    - guide/14-capstone/02-lab-18-well-architected-tool-review.md
  module: "02"

- term: workload inventory
  definition: >-
    A list of every part of a workload and how it is set up: the starting point of a review. Read it
    for what is missing as well as what is there, since gaps are often the findings.
  taught_in: guide/14-capstone/01-the-capstone-review.md
  also_in: [guide/14-capstone/00-brief.md]
  module: "14"

- term: write once, read many
  abbreviation: WORM
  definition: >-
    Storage that, once written, can be read but not changed or deleted for a set time. S3 Object
    Lock provides it.
  taught_in: guide/05-storing-data/02-s3-in-practice.md
  module: "05"

- term: YAML
  definition: >-
    A text format for the same kind of data as JSON, written without braces and quotes, in which
    indentation carries meaning. CloudFormation templates can be written in it.
  taught_in: guide/01-on-ramp/05-apis-command-line-and-json.md
  also_in: [guide/08-building-and-operating/02-iac-and-automation.md]
  module: "01"

- term: Your account health
  definition: >-
    The signed-in view of the AWS Health Dashboard: events that affect your own resources, such as
    maintenance planned on a server you run, plus the public events. Older material calls it the
    Personal Health Dashboard.
  taught_in: guide/12-getting-help/02-tools-that-watch-your-account.md
  also_in: [guide/12-getting-help/05-lab-17-support-center-tour.md]
  confused_with: [Service health]
  not_to_confuse: >-
    Your account health shows events about your own resources once you sign in; Service health shows
    only public events and needs no sign-in.
  module: "12"

- term: zombie application
  definition: >-
    An application averaging below 5% CPU and memory use over 90 days: in AWS's guidance, a reason
    to consider retiring it, though business value decides.
  taught_in: guide/13-moving-to-aws/02-seven-migration-strategies.md
  confused_with: [idle application]
  not_to_confuse: >-
    A zombie application averages below 5% use over 90 days; an idle one averages 5 to 20%, and
    either may still have business value.
  module: "13"

- term: zonal Reserved Instance
  definition: >-
    A Reserved Instance bought for one Availability Zone: it reserves capacity there, and its
    discount applies only to exactly matching instances in that AZ.
  taught_in: guide/11-paying-for-aws/02-purchasing-options.md
  also_in:
    - guide/11-paying-for-aws/04-many-accounts-one-bill.md
    - guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
  confused_with: [Regional Reserved Instance]
  not_to_confuse: >-
    A zonal Reserved Instance reserves capacity in one AZ and fits only exact matches; a Regional
    one reserves nothing but applies in any AZ and, for Linux, to any size in the family.
  module: "11"

- term: zonal resource
  definition: >-
    A resource that lives in one Availability Zone and fails with it, such as an EC2 virtual server.
    For high availability you put copies in other Availability Zones yourself.
  taught_in: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
  confused_with: [Regional service, global service]
  not_to_confuse: >-
    A zonal resource sits in one Availability Zone you choose; a Regional service is spread across
    Availability Zones for you, and a global service isn't tied to one Region.
  module: "03"
