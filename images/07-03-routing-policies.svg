<svg xmlns="http://www.w3.org/2000/svg" width="680" height="544" viewBox="0 0 680 544" role="img" aria-labelledby="t d">
<title id="t">Four Route 53 routing policies compared as small diagrams</title>
<desc id="d">Four panels. Latency: which Region answers this user fastest? A customer in Munich gets Frankfurt, which has the lowest delay for them, not N. Virginia, which is far away. Geolocation: where is this user? Users in the US go to N. Virginia and users in Germany go to Frankfurt; the rule follows the user's location. Failover: is the main site healthy? The primary fails its health check, so the customer is sent to the standby; health checks decide and no person has to act. Weighted: what share goes where? 90 in 100 customers go to the current site and 10 in 100 to a new version; both answers are used, in proportion. A note says Route 53 only answers with an address, and that four more policies, simple, geoproximity, IP-based and multivalue answer, are in the table in the lesson.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --edge-fill:#fbe1d6; --prem-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --edge-fill:#4d2716; --prem-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .edgeb { fill: var(--edge-fill); stroke: var(--s2); stroke-width: 1.5; }
  .prem { fill: var(--prem-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .q { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrlab { fill: var(--ink); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .num { fill: var(--ink); font-size: 11px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .flow { stroke: var(--ink); stroke-width: 2; fill: none; }
  .flowx { stroke: var(--muted); stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; }
  .head-ink { fill: var(--ink); }
  .head-mut { fill: var(--muted); }
</style>
<rect width="680" height="544" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Four Route 53 routing policies, four different questions</text>
<text class="sub" x="16" y="48">Solid arrow: the answer Route 53 gives. Dashed arrow: an answer it doesn't give that user.</text>
<rect class="panel" x="16" y="64" width="318" height="196" rx="8"/>
<text class="head" x="28" y="86">Latency</text>
<text class="q" x="28" y="104">Which Region answers this user fastest?</text>
<rect class="aws" x="202" y="122" width="120" height="46" rx="6"/>
<text class="boxt" x="262.0" y="140" text-anchor="middle">N. Virginia</text>
<text class="cells" x="262.0" y="156.0" text-anchor="middle">far from this user</text>
<rect class="aws" x="202" y="192" width="120" height="46" rx="6"/>
<text class="boxt" x="262.0" y="210" text-anchor="middle">Frankfurt</text>
<text class="cells" x="262.0" y="226.0" text-anchor="middle">lowest delay here</text>
<circle class="prem" cx="66" cy="176" r="9"/>
<text class="small" x="66" y="200.0" text-anchor="middle">Customer</text>
<text class="small" x="66" y="214.0" text-anchor="middle">in Munich</text>
<path class="flowx" d="M78.0,170.0 L194.2,146.6"/>
<path class="head-mut" d="M202.0,145.0 L191.2,142.1 L193.2,151.9 Z"/>
<path class="flow" d="M78.0,182.0 L194.3,212.9"/>
<path class="head-ink" d="M202.0,215.0 L193.6,207.6 L191.1,217.3 Z"/>
<rect class="panel" x="346" y="64" width="318" height="196" rx="8"/>
<text class="head" x="358" y="86">Geolocation</text>
<text class="q" x="358" y="104">Where is this user? Send them by the rule</text>
<rect class="aws" x="532" y="122" width="120" height="46" rx="6"/>
<text class="boxt" x="592.0" y="140" text-anchor="middle">N. Virginia</text>
<text class="cells" x="592.0" y="156.0" text-anchor="middle">everyone else</text>
<rect class="aws" x="532" y="192" width="120" height="46" rx="6"/>
<text class="boxt" x="592.0" y="210" text-anchor="middle">Frankfurt</text>
<text class="cells" x="592.0" y="226.0" text-anchor="middle">users in Germany</text>
<circle class="prem" cx="396" cy="140" r="9"/>
<text class="small" x="396" y="164.0" text-anchor="middle">Users in the US</text>
<circle class="prem" cx="396" cy="200" r="9"/>
<text class="small" x="396" y="224.0" text-anchor="middle">Users in Germany</text>
<path class="flow" d="M408.0,140.0 L524.0,144.7"/>
<path class="head-ink" d="M532.0,145.0 L522.2,139.6 L521.8,149.6 Z"/>
<path class="flow" d="M408.0,200.0 L524.1,214.0"/>
<path class="head-ink" d="M532.0,215.0 L522.7,208.8 L521.5,218.8 Z"/>
<text class="small" x="358" y="250">The rule follows the user's location.</text>
<rect class="panel" x="16" y="272" width="318" height="196" rx="8"/>
<text class="head" x="28" y="294">Failover</text>
<text class="q" x="28" y="312">Is the main site healthy? If not, the standby</text>
<rect class="aws" x="202" y="330" width="120" height="46" rx="6"/>
<text class="boxt" x="262.0" y="348" text-anchor="middle">Primary</text>
<text class="cells" x="262.0" y="364.0" text-anchor="middle">fails health check</text>
<rect class="aws" x="202" y="400" width="120" height="46" rx="6"/>
<text class="boxt" x="262.0" y="418" text-anchor="middle">Standby</text>
<text class="cells" x="262.0" y="434.0" text-anchor="middle">takes the traffic</text>
<circle class="prem" cx="66" cy="384" r="9"/>
<text class="small" x="66" y="408.0" text-anchor="middle">Customer</text>
<path class="flowx" d="M78.0,378.0 L194.2,354.6"/>
<path class="head-mut" d="M202.0,353.0 L191.2,350.1 L193.2,359.9 Z"/>
<path class="flow" d="M78.0,390.0 L194.3,420.9"/>
<path class="head-ink" d="M202.0,423.0 L193.6,415.6 L191.1,425.3 Z"/>
<text class="small" x="28" y="458">Health checks decide; no person has to act.</text>
<rect class="panel" x="346" y="272" width="318" height="196" rx="8"/>
<text class="head" x="358" y="294">Weighted</text>
<text class="q" x="358" y="312">What share goes where? You set the split</text>
<rect class="aws" x="532" y="330" width="120" height="46" rx="6"/>
<text class="boxt" x="592.0" y="348" text-anchor="middle">Current site</text>
<text class="cells" x="592.0" y="364.0" text-anchor="middle">90 in 100 users</text>
<rect class="aws" x="532" y="400" width="120" height="46" rx="6"/>
<text class="boxt" x="592.0" y="418" text-anchor="middle">New version</text>
<text class="cells" x="592.0" y="434.0" text-anchor="middle">10 in 100 users</text>
<circle class="prem" cx="396" cy="384" r="9"/>
<text class="small" x="396" y="408.0" text-anchor="middle">Customers</text>
<path class="flow" d="M408.0,378.0 L524.2,354.6"/>
<path class="head-ink" d="M532.0,353.0 L521.2,350.1 L523.2,359.9 Z"/>
<path class="flow" d="M408.0,390.0 L524.3,420.9"/>
<path class="head-ink" d="M532.0,423.0 L523.6,415.6 L521.1,425.3 Z"/>
<text class="small" x="358" y="458">Both answers are used, in proportion.</text>
<text class="small" x="16" y="492.0">Route 53 only answers with an address; the customer's browser then connects there. Four more policies</text>
<text class="small" x="16" y="509.0">(simple, geoproximity, IP-based, multivalue answer) are in the table in the lesson.</text>
<text class="note" x="16" y="530">Our summary of AWS's "Choosing a routing policy" page, checked 2026-10-23. Regions are the bakery's.</text>
</svg>
