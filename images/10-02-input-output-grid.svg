<svg xmlns="http://www.w3.org/2000/svg" width="680" height="646" viewBox="0 0 680 646" role="img" aria-labelledby="t d">
<title id="t">Ready-made AI services and SageMaker AI, by what goes in and what comes out</title>
<desc id="d">A grid of rows, each reading input, AWS service, output. Text in: customer reviews or emails go to Amazon Comprehend, which returns sentiment, names, places, key phrases and personal data; text in one language goes to Amazon Translate, which returns the same text in another language; text to be read aloud goes to Amazon Polly, which returns natural-sounding speech. Sound in: recorded or live speech goes to Amazon Transcribe, which returns a written transcript. A conversation: a customer typing or talking goes to Amazon Lex, a bot that works out what they want and replies. Pictures in: photos or video go to Amazon Rekognition, which returns objects, scenes, faces and unsafe content; scans of receipts, forms and PDFs go to Amazon Textract, which returns text, form fields, tables and receipt totals. Nothing ready-made fits: your own data goes to Amazon SageMaker AI, which gives a model you build, train and deploy. The first seven are ready-made and need no machine learning skills.</desc>

