<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="t d">
<title id="t">The parts of the AWS Cloud Adoption Framework and how they relate</title>
<desc id="d">Three layers, read from the bottom up, and a column of phases. Bottom layer, six perspectives, each with its number of capabilities: Business (8), strategy and outcomes; People (7), culture and change; Governance (7), control and oversight; Platform (7), infrastructure and applications; Security (9), compliance and assurance; Operations (9), health and availability. An arrow labeled enable leads up to the middle layer, four transformation domains in a chain, each enabling the next: Technology (migrate and modernize), Process (digitize, automate, optimize; highlighted, with the note that process is a domain, not a perspective), Organization (teams around products), Product (new offers and revenue models). An arrow labeled deliver leads up to the top layer, four business outcomes: reduce business risk (reliability, performance, security); improve ESG performance (sustainability, transparency); grow revenue (new products, customers, markets); increase operational efficiency (lower costs, more productivity). On the right, four phases in order: Envision (pick outcomes), Align (find gaps), Launch (run pilots), Scale (expand, sustain), then back to Envision for the next round.</desc>

