<text class="small" x="204" y="220" text-anchor="end">2 × m7i.xlarge, license-included</text>
<path class="s1" d="M214.0,190.0 L262.1,190.0 Q266.1,190.0 266.1,194.0 L266.1,220.0 Q266.1,224.0 262.1,224.0 L214.0,224.0 Z"><title>C. Rightsized, Standard: $1,264</title></path>
