<svg xmlns="http://www.w3.org/2000/svg" width="680" height="465" viewBox="0 0 680 465" role="img" aria-labelledby="t d">
<title id="t">AWS Lambda and AWS Fargate compared side by side</title>
<desc id="d">Two panels. What is the same: no servers to manage, AWS scales them, you pay for what runs. AWS Lambda runs a function when an event arrives. You hand over function code, as a .zip file or a container image. An event starts it: a file upload, a web request, a message or a schedule. It runs up to 15 minutes per invocation. You size its memory, from 128 MB to 10,240 MB, and CPU grows with it. It bills per request plus memory times run time, in GB-seconds. It is not for long or always-on work, or when you need full control of the operating system. AWS Fargate runs containers for ECS or EKS. You hand over a container image through ECS or EKS. ECS or EKS starts a task or keeps a service running. It runs as long as the task runs, minutes or months. You size vCPU and memory for each task. It bills per second for vCPU, memory and storage, with a 1-minute minimum. It is not for GPU work, which needs EC2, or for event-driven code that needs no container.</desc>

