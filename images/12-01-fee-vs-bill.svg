<svg xmlns="http://www.w3.org/2000/svg" width="700" height="438" viewBox="0 0 700 438" role="img" aria-labelledby="t d">
<title id="t">Monthly Support fee against the monthly AWS bill for Business Support+ and Enterprise Support</title>
<desc id="d">A line chart. The horizontal axis is the monthly AWS bill from $0 to $20,000; the vertical axis is the monthly Support fee from $0 to $6,000. Enterprise Support is a flat line at its $5,000 minimum across the whole range; it stays there until the bill passes $50,000. Business Support+ starts at its $29 minimum, rises at 9% of the bill to $900 at a $10,000 bill, then at 7% to $1,600 at a $20,000 bill. A dot marks the bakery's made-up bill of $1,200 a month, where Business Support+ costs $108. Unified Operations starts at $50,000 a month, off the scale. Prices as of 2026-10-24, from AWS Support Plan Pricing.</desc>

