<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="t d">
<title id="t">What a user sees with WorkSpaces, WorkSpaces Applications and WorkSpaces Secure Browser</title>
<desc id="d">Three panels. In each, the service runs in AWS and only pixels, pictures of the screen, stream to the user's device. Amazon WorkSpaces: the screen shows a whole desktop with a taskbar and several windows; the user gets their own Windows or Linux desktop with any app they need and files kept. WorkSpaces Applications, the exam's AppStream 2.0: the screen shows one application, a stock app, in a window; chosen apps in a window or browser tab. WorkSpaces Secure Browser: the screen shows one web browser open at an internal web address; internal websites and web apps only; closed to new customers from 2026-10-29.</desc>

