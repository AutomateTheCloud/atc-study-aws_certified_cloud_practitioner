<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" aria-labelledby="t d">
<title id="t">AWS Marketplace's cost management, governance and entitlement features compared</title>
<desc id="d">Three columns compared on four rows. Cost management: the question, what is each team spending on Marketplace products; the feature, highlighted, the Procurement insights dashboard and cost allocation tags in Cost Explorer; what it does, shows costs and agreements across the organization's accounts, and tags split usage by team; its limit, tags appear in Cost Explorer only after you activate them. Governance: can staff buy only products we've approved; the feature, Private Marketplace; what it does, approved catalogs per organization, OU or account, and users can request more for admins to approve; its limit, it blocks new subscriptions only and doesn't control what can be deployed. Entitlement: who may use what we bought, and where; the feature, licenses created at subscription, shared through AWS License Manager; what it does, shares subscriptions with other accounts in the organization and tracks license use; its limit, sharing covers AMI, container, machine learning and data products.</desc>

