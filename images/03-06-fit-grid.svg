<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" aria-labelledby="t d">
<title id="t">Which disaster recovery strategy meets each business's recovery time objective</title>
<desc id="d">A grid of three made-up businesses against AWS's four strategies, ordered from cheapest to most expensive: backup and restore (hours), pilot light (tens of minutes), warm standby (minutes) and multi-site active/active (real time). The bakery, RTO within a day: backup and restore is the choice, the cheapest that meets it; the other three meet it but cost more. Ticket website, RTO about 5 minutes: backup and restore and pilot light are too slow; warm standby is the choice; multi-site meets it but costs more. Payment service, RTO near zero (no noticeable outage): the first three are too slow; multi-site active/active is the choice. Every business also needs point-in-time backups.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --no-fill:#f1f0ec; --ok-fill:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --no-fill:#252523; --ok-fill:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .no { fill: var(--no-fill); stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; }
  .ok { fill: var(--ok-fill); stroke: var(--s1); stroke-width: 1; }
  .pick { fill: var(--ok-fill); stroke: var(--s2); stroke-width: 3; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .rowl { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .rows { fill: var(--ink2); font-size: 11.5px; }
  .cellt { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 11.5px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="354" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Which strategy meets each business's recovery time?</text>
<text class="sub" x="16" y="48">Choose the cheapest strategy that meets the objective. Businesses and objectives are made up.</text>
