<svg xmlns="http://www.w3.org/2000/svg" width="680" height="474" viewBox="0 0 680 474" role="img" aria-labelledby="t d">
<title id="t">The seven migration strategies, grouped by what happens to the application</title>
<desc id="d">Three groups of cards. Doesn't move: Retire, switch it off and archive the data you must keep; Retain, keep it where it is, for now, and revisit later. Moves without changing the application: Rehost, lift and shift, each server as it is onto Amazon EC2; Relocate, highlighted, move a whole platform such as VMware to its AWS version, or move a resource to another VPC, Region or account. A note says relocate is the seventh R, added after AWS's 2016 list of six, and older material may leave it out. Changes on the way: Replatform, lift, tinker and shift, a few changes such as moving the database onto Amazon RDS; Repurchase, drop and shop, replace it with a different product, often software as a service; Refactor, re-architect, redesign it to use cloud-native features. The grouping is ours; the seven names are AWS's.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --hi-fill:#fbe1d6; --card-fill:#f1f0ec; --zone1:#ecebe6; --zone2:#f5f4f0; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --hi-fill:#4d2716; --card-fill:#252523; --zone1:#2a2a28; --zone2:#222221; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
