<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="t d">
<title id="t">RPO and RTO on a time line of one failure</title>
<desc id="d">A time line from 00:00 to 16:00 with three events, made up for teaching. At 02:00, the last good backup: the recovery point. At 10:00, the bakery's order database is lost and orders stop. At 14:00, the site is taking orders again: service restored. A span from 02:00 to 10:00 is labeled 'Data lost: 8 hours of orders'. A span from 10:00 to 14:00 is labeled 'Downtime: 4 hours'. Below: RPO is the most data loss the business accepts, measured back from the failure; RTO is the most downtime the business accepts, measured forward from the failure.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ha-fill:#d9e8fb; --dr-fill:#fbe1d6; --bk-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ha-fill:#1b3554; --dr-fill:#4d2716; --bk-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .ha { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .dr { fill: var(--dr-fill); stroke: var(--s2); stroke-width: 1.5; }
  .bk { fill: var(--bk-fill); stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .step { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .tag { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .span-rpo { stroke: var(--s2); stroke-width: 3; fill: none; stroke-linecap: round; }
  .span-rto { stroke: var(--s1); stroke-width: 3; fill: none; stroke-linecap: round; }
  .ev { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .evline { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
</style>
<rect width="680" height="350" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">RPO looks back from the failure; RTO looks forward</text>
<text class="sub" x="16" y="48">The bakery's order database, one bad day. Times are made up for teaching.</text>
<line class="axis" x1="60" x2="640" y1="230" y2="230"/>
<line class="axis" x1="60.0" x2="60.0" y1="230" y2="235"/>
<text class="tick" x="60.0" y="250" text-anchor="middle">00:00</text>
<line class="axis" x1="132.5" x2="132.5" y1="230" y2="235"/>
<text class="tick" x="132.5" y="250" text-anchor="middle">02:00</text>
<line class="axis" x1="205.0" x2="205.0" y1="230" y2="235"/>
<text class="tick" x="205.0" y="250" text-anchor="middle">04:00</text>
<line class="axis" x1="277.5" x2="277.5" y1="230" y2="235"/>
<text class="tick" x="277.5" y="250" text-anchor="middle">06:00</text>
<line class="axis" x1="350.0" x2="350.0" y1="230" y2="235"/>
<text class="tick" x="350.0" y="250" text-anchor="middle">08:00</text>
<line class="axis" x1="422.5" x2="422.5" y1="230" y2="235"/>
<text class="tick" x="422.5" y="250" text-anchor="middle">10:00</text>
<line class="axis" x1="495.0" x2="495.0" y1="230" y2="235"/>
<text class="tick" x="495.0" y="250" text-anchor="middle">12:00</text>
<line class="axis" x1="567.5" x2="567.5" y1="230" y2="235"/>
<text class="tick" x="567.5" y="250" text-anchor="middle">14:00</text>
<line class="axis" x1="640.0" x2="640.0" y1="230" y2="235"/>
<text class="tick" x="640.0" y="250" text-anchor="middle">16:00</text>
<line class="evline" x1="132.5" x2="132.5" y1="100" y2="230"/>
<circle class="ev" cx="132.5" cy="230" r="6"/>
<text class="cellt" x="132.5" y="72.0" text-anchor="middle">Last good</text>
<text class="cellt" x="132.5" y="88.0" text-anchor="middle">backup</text>
<text class="small" x="132.5" y="268" text-anchor="middle">the recovery point</text>
<line class="evline" x1="422.5" x2="422.5" y1="100" y2="230"/>
<circle class="ev" cx="422.5" cy="230" r="6"/>
<text class="cellt" x="422.5" y="72.0" text-anchor="middle">The database</text>
<text class="cellt" x="422.5" y="88.0" text-anchor="middle">is lost</text>
<text class="small" x="422.5" y="268" text-anchor="middle">orders stop</text>
<line class="evline" x1="567.5" x2="567.5" y1="100" y2="230"/>
<circle class="ev" cx="567.5" cy="230" r="6"/>
<text class="cellt" x="567.5" y="72.0" text-anchor="middle">Site taking</text>
<text class="cellt" x="567.5" y="88.0" text-anchor="middle">orders again</text>
<text class="small" x="567.5" y="268" text-anchor="middle">service restored</text>
<line class="span-rpo" x1="132.5" x2="422.5" y1="140" y2="140"/>
<text class="cellt" x="277.5" y="130" text-anchor="middle">Data lost: 8 hours of orders</text>
<line class="span-rto" x1="422.5" x2="567.5" y1="190" y2="190"/>
<text class="cellt" x="495.0" y="180" text-anchor="middle">Downtime: 4 hours</text>
<text class="lab" x="16" y="296">RPO: the most data loss the business accepts, measured back from the failure.</text>
<text class="lab" x="16" y="314">RTO: the most downtime the business accepts, measured forward from the failure.</text>
<text class="note" x="16" y="336">Recovery point objective (RPO) and recovery time objective (RTO), as AWS defines them.</text>
</svg>
