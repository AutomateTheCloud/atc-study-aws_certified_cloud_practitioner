<svg xmlns="http://www.w3.org/2000/svg" width="680" height="418" viewBox="0 0 680 418" role="img" aria-labelledby="t d">
<title id="t">Monthly cost of NAT gateways compared with a gateway endpoint</title>
<desc id="d">Horizontal stacked bars of US dollars for a month of 730 hours, US East (N. Virginia) prices as of 2026-10-24. One NAT gateway, 10 GB processed: $36.95 (NAT gateway hours $32.85, Elastic IP $3.65, data processed $0.45). One NAT gateway, 200 GB processed: $45.50 (NAT gateway hours $32.85, Elastic IP $3.65, data processed $9.00). Two NAT gateways (one per AZ), 200 GB in total: $82.00 (NAT gateway hours $65.70, Elastic IP $7.30, data processed $9.00). Gateway endpoint instead, for 200 GB to S3: $0.00, no charge. The hourly part is most of the bill at low traffic, and doubles with a second gateway. Data transfer to the internet is charged on top.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --pub-fill:#d9e8fb; --priv-fill:#f1f0ec; --bad-fill:#fbe1d6; --s3c:#1baf7a; }
  @media (prefers-color-scheme: dark) {
