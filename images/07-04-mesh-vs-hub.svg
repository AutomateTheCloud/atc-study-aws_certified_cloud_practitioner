<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" aria-labelledby="t d">
<title id="t">VPC peering mesh compared with a Transit Gateway hub</title>
<desc id="d">Two panels, each with five VPCs labeled A to E in a ring. VPC peering: every pair is joined by its own line, 10 connections in all; every pair needs its own connection, because traffic can't hop through a middle VPC: peering is not transitive. Transit Gateway: each VPC has one line to a transit gateway in the middle, 5 attachments in all; each network attaches once, and the gateway's route tables decide who reaches whom. A table below: for 3 networks, 3 peering connections or 3 attachments; for 5, 10 or 5; for 10, 45 or 10; for 20, 190 or 20. A full mesh of n networks needs n times n minus 1, divided by 2, connections.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --link-fill:#fbe1d6; --prem-fill:#f1f0ec; --net-fill:#ecebe6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --link-fill:#4d2716; --prem-fill:#252523; --net-fill:#262624; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
