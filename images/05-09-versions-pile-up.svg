<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" aria-labelledby="t d">
<title id="t">GB stored when a 10 GB file is overwritten every night in a versioned bucket</title>
<desc id="d">Line chart over 60 nights. With no rule for older versions, every overwrite keeps the old 10 GB version, so storage climbs in a straight line to 600 GB on night 60 and keeps growing. With a lifecycle rule that permanently deletes older versions 7 days after they stop being current, storage rises to 80 GB by night 8 and stays there.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --c-std:#184f95; --c-ia:#2a78d6; --c-gfr:#6da7ec; --c-gda:#9ec5f4; --t-std:#ffffff; --t-ia:#ffffff; --t-gfr:#0b0b0b; --t-gda:#0b0b0b; --s3c:#1baf7a; }
  @media (prefers-color-scheme: dark) {
