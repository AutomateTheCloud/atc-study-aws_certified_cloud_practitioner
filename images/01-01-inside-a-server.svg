<svg xmlns="http://www.w3.org/2000/svg" width="680" height="402" viewBox="0 0 680 402" role="img" aria-labelledby="t d">
<title id="t">The parts of a server: hardware, operating system, applications</title>
<desc id="d">A box labeled one of the bakery's servers, in three layers. At the bottom, four hardware parts: processor, does the work; memory, holds the work in progress and is emptied when the power goes off; storage, keeps files and data with the power off; network connection, sends and receives data. In the middle, highlighted, the operating system, such as Linux or Windows, shares the parts out to the programs. At the top, two applications: the bakery's website and order records. Outside the box on the right, customers' phones and laptops send requests to the network connection and receive answers.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
