  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .arrlab { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
</style>
<rect width="680" height="402" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Inside one of the bakery's servers</text>
<text class="sub" x="16" y="48">Four hardware parts, the operating system on them, and the programs on top</text>
<text class="zlab" x="28" y="96">Applications</text>
<rect class="plain" x="28.0" y="104.0" width="233.0" height="40.0" rx="6"/>
<text class="cellt" x="144.5" y="129" text-anchor="middle">The bakery's website</text>
<rect class="plain" x="271.0" y="104.0" width="233.0" height="40.0" rx="6"/>
<text class="cellt" x="387.5" y="129" text-anchor="middle">Order records</text>
<text class="zlab" x="28" y="168">Operating system</text>
<rect class="hi" x="28.0" y="176.0" width="476.0" height="50.0" rx="6"/>
<text class="cellt" x="266.0" y="197" text-anchor="middle">Operating system, such as Linux or Windows</text>
<text class="small" x="266.0" y="215" text-anchor="middle">shares the parts out to the programs</text>
<text class="zlab" x="28" y="250">Hardware</text>
<rect class="n" x="28.0" y="258.0" width="113.0" height="90.0" rx="6"/>
