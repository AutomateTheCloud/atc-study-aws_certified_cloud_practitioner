<text class="cellt" x="205.5" y="278.0" text-anchor="middle">Memory</text>
<text class="small" x="205.5" y="295.0" text-anchor="middle">Holds the work</text>
<text class="small" x="205.5" y="310.0" text-anchor="middle">in progress;</text>
<text class="small" x="205.5" y="325.0" text-anchor="middle">emptied when the</text>
<text class="small" x="205.5" y="340.0" text-anchor="middle">power goes off</text>
<rect class="n" x="270.0" y="258.0" width="113.0" height="90.0" rx="6"/>
<text class="cellt" x="326.5" y="278.0" text-anchor="middle">Storage</text>
<text class="small" x="326.5" y="295.0" text-anchor="middle">Keeps files and</text>
<text class="small" x="326.5" y="310.0" text-anchor="middle">data with the</text>
<text class="small" x="326.5" y="325.0" text-anchor="middle">power off</text>
<rect class="n" x="391.0" y="258.0" width="113.0" height="90.0" rx="6"/>
<text class="cellt" x="447.5" y="278.0" text-anchor="middle">Network</text>
<text class="cellt" x="447.5" y="293.0" text-anchor="middle">connection</text>
<text class="small" x="447.5" y="310.0" text-anchor="middle">Sends and</text>
<text class="small" x="447.5" y="325.0" text-anchor="middle">receives data</text>
<rect class="frame" x="16.0" y="70.0" width="500.0" height="290.0" rx="10"/>
<text class="head" x="504" y="88" text-anchor="end">One of the bakery's servers</text>
<rect class="plain" x="570.0" y="264.0" width="94.0" height="92.0" rx="6"/>
<text class="cellt" x="617.0" y="294.0" text-anchor="middle">Customers'</text>
<text class="cellt" x="617.0" y="310.0" text-anchor="middle">phones and</text>
<text class="cellt" x="617.0" y="326.0" text-anchor="middle">laptops</text>
<line class="arrow" x1="569.0" y1="292.0" x2="517.0" y2="292.0"/>
<path class="arrowhead" d="M525.0,297.0 L525.0,287.0 L517.0,292.0 Z"/>
<line class="arrow" x1="517.0" y1="332.0" x2="569.0" y2="332.0"/>
<path class="arrowhead" d="M561.0,327.0 L561.0,337.0 L569.0,332.0 Z"/>
<text class="arrlab" x="543.0" y="284" text-anchor="middle">requests</text>
<text class="arrlab" x="543.0" y="350" text-anchor="middle">answers</text>
<line class="arrow" x1="504.0" y1="292" x2="516" y2="292"/>
<line class="arrow" x1="504.0" y1="332" x2="516" y2="332"/>
<text class="note" x="16" y="386">Programs ask the operating system; it uses the hardware for them. The bakery is made up for teaching.</text>
</svg>
