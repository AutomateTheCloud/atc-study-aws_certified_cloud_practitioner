  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="680" height="540" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Abuse is about whose resource misbehaves</text>
<text class="sub" x="16" y="48">Three security problems, three different doors</text>
<rect class="ok" x="16.0" y="66.0" width="300.0" height="131.0" rx="8"/>
<text class="key" x="28" y="84">WHAT HAPPENS</text>
<text class="cellt" x="28" y="102.0">1. Traffic from someone else's AWS</text>
<text class="cellt" x="28" y="118.0">resource is attacking you</text>
<text class="small" x="28" y="138.0">Scans, login floods, spam or stolen content,</text>
<text class="small" x="28" y="153.0">from an address in AWS's published ranges</text>
<rect class="ok" x="360.0" y="66.0" width="304.0" height="131.0" rx="8"/>
<text class="key" x="372" y="84">WHERE TO GO</text>
<text class="cellt" x="372" y="102.0">AWS Trust &amp; Safety, through the</text>
<text class="cellt" x="372" y="118.0">abuse report form</text>
<text class="small" x="372" y="138.0">It investigates and deals with the</text>
<text class="small" x="372" y="153.0">resource's owner; it shares details only</text>
<text class="small" x="372" y="168.0">with that owner's permission</text>
<line class="arrow" x1="320.0" y1="131.5" x2="356.0" y2="131.5"/>
<path class="arrowhead" d="M348.0,126.5 L348.0,136.5 L356.0,131.5 Z"/>
<rect class="n" x="16.0" y="211.0" width="300.0" height="116.0" rx="8"/>
<text class="key" x="28" y="229">WHAT HAPPENS</text>
<text class="cellt" x="28" y="247.0">2. AWS tells you that your resource is</text>
<text class="cellt" x="28" y="263.0">causing abuse</text>
<text class="small" x="28" y="283.0">An abuse report from AWS Trust &amp; Safety</text>
<text class="small" x="28" y="298.0">about one of your resources</text>
<rect class="plain" x="360.0" y="211.0" width="304.0" height="116.0" rx="8"/>
<text class="key" x="372" y="229">WHERE TO GO</text>
<text class="cellt" x="372" y="247.0">Answer Trust &amp; Safety, and fix the</text>
<text class="cellt" x="372" y="263.0">resource</text>
<text class="small" x="372" y="283.0">AWS Support can't help with questions about</text>
<text class="small" x="372" y="298.0">Trust &amp; Safety notifications</text>
<line class="arrow" x1="320.0" y1="269.0" x2="356.0" y2="269.0"/>
<path class="arrowhead" d="M348.0,264.0 L348.0,274.0 L356.0,269.0 Z"/>
<rect class="n" x="16.0" y="341.0" width="300.0" height="131.0" rx="8"/>
<text class="key" x="28" y="359">WHAT HAPPENS</text>
<text class="cellt" x="28" y="377.0">3. Someone is inside your own account</text>
<text class="small" x="28" y="397.0">Unknown users, keys or resources; a</text>
<text class="small" x="28" y="412.0">GuardDuty finding about your credentials</text>
<rect class="plain" x="360.0" y="341.0" width="304.0" height="131.0" rx="8"/>
<text class="key" x="372" y="359">WHERE TO GO</text>
<text class="cellt" x="372" y="377.0">A support case opened from that account,</text>
<text class="cellt" x="372" y="393.0">marked as an urgent security incident</text>
<text class="small" x="372" y="413.0">AWS's incident responders (AWS CIRT) can</text>
<text class="small" x="372" y="428.0">help, at no extra charge, on any Support</text>
<text class="small" x="372" y="443.0">plan</text>
<line class="arrow" x1="320.0" y1="406.5" x2="356.0" y2="406.5"/>
<path class="arrowhead" d="M348.0,401.5 L348.0,411.5 L356.0,406.5 Z"/>
<text class="note" x="16" y="494">From the Knowledge Center article "How do I report abuse of AWS resources?" and the AWS Prescriptive Guidance</text>
<text class="note" x="16" y="510">page "Security incident response and resources", checked 2026-10-24.</text>
</svg>
