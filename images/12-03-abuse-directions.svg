<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img" aria-labelledby="t d">
<title id="t">Three security problems and where each one goes</title>
<desc id="d">Three rows, each with what happens on the left, an arrow, and where to go on the right. Row 1, highlighted: traffic from someone else's AWS resource is attacking you, such as scans, login floods, spam or stolen content from an address in AWS's published ranges. Go to AWS Trust &amp; Safety through the abuse report form; it investigates and deals with the resource's owner, and shares details only with that owner's permission. Row 2: AWS tells you that your resource is causing abuse, in an abuse report from Trust &amp; Safety about one of your resources. Answer Trust &amp; Safety and fix the resource; AWS Support can't help with questions about Trust &amp; Safety notifications. Row 3: someone is inside your own account, such as unknown users, keys or resources, or a GuardDuty finding about your credentials. Open a support case from that account, marked as an urgent security incident; AWS's incident responders, the AWS CIRT, can help at no extra charge on any Support plan.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ok-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ok-fill:#1b3554; --n-fill:#252523; }
  }
