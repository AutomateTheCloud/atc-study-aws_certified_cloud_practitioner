<svg xmlns="http://www.w3.org/2000/svg" width="680" height="616" viewBox="0 0 680 616" role="img" aria-labelledby="t d">
<title id="t">Six security layers from the edge to the organization, with a watch across all of them</title>
<desc id="d">Six bands, each drawn slightly inside the one above, from the internet at the top to the organization at the bottom. 1, Edge, where traffic first reaches AWS: Route 53, CloudFront, Shield Standard and Advanced, AWS WAF. 2, Network, the bakery's VPC: public and private subnets, route tables, network ACLs, security groups. 3, Compute, servers and functions: patched images and guest operating systems, Amazon Inspector scans. 4, Data, what is stored and sent: encryption with KMS keys and ACM certificates, S3 Block Public Access and versioning, Macie, backups. 5, Identity and account, who can do what: IAM least privilege, MFA, roles instead of access keys, root user protection. 6, Organization, rules over every account: separate accounts, SCPs, Control Tower controls, Firewall Manager. A highlighted vertical band on the right, labeled watch and prove across every layer, lists CloudTrail, AWS Config, CloudWatch, GuardDuty and Security Hub: records, findings and alarms that show what got through.</desc>

