<text class="note" x="16" y="554">Each layer is drawn inside the one above it. Lessons: 07.01 to 07.03 and 09.04 (edge and network),</text>
<text class="note" x="16" y="570">Module 06 and 09.03 (compute), 05.02 and 09.02 (data), Module 04 and 09.01 (identity and account),</text>
<text class="note" x="16" y="586">09.05 (organization). The bakery is made up for teaching.</text>
</svg>
