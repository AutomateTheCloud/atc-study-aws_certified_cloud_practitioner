<text class="zlab" x="58" y="502">rules over every account</text>
<text class="small" x="222" y="484.0">Separate accounts, SCPs, Control Tower</text>
<text class="small" x="222" y="499.0">controls, Firewall Manager</text>
<rect class="watch" x="530.0" y="92.0" width="134.0" height="436.0" rx="8"/>
<text class="cellt" x="597.0" y="118" text-anchor="middle">Watch and prove</text>
<text class="zlab" x="597.0" y="136" text-anchor="middle">across every layer</text>
