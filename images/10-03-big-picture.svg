<svg xmlns="http://www.w3.org/2000/svg" width="680" height="464" viewBox="0 0 680 464" role="img" aria-labelledby="t d">
<title id="t">Seven services grouped by who is on the other end</title>
<desc id="d">Four groups. Staff at a screen, such as seasonal staff or an accountant: Amazon WorkSpaces gives a whole desktop; WorkSpaces Applications, the exam's AppStream 2.0, gives one application; WorkSpaces Secure Browser gives one browser and is closed to new customers from 2026-10-29. Customers on the phone, in chat or by email: Amazon Connect Customer, the exam's Amazon Connect, is a contact center; Amazon SES is email at scale. App users of the bakery's web and phone app: AWS Amplify builds and hosts the front end. Devices such as freezer sensors: AWS IoT Core connects devices and routes their messages.</desc>

<style>
