<svg xmlns="http://www.w3.org/2000/svg" width="720" height="342" viewBox="0 0 720 342" role="img" aria-labelledby="t d">
<title id="t">A year of the bakery's web servers paid three ways</title>
<desc id="d">Horizontal bar chart, US dollars for a year of t3.small Linux servers in US East (N. Virginia) as of 2026-10-24. All On-Demand: On-Demand $440.34, total $440.34; Commit to the base, peak On-Demand: Reserved base $227.76 plus On-Demand peak $75.92, total $303.68; Commit to the peak (6 all year): Reserved, mostly unused $683.28, total $683.28. Committing to the base is cheapest; committing to the peak costs more than On-Demand.</desc>

<style>
