<svg xmlns="http://www.w3.org/2000/svg" width="680" height="684" viewBox="0 0 680 684" role="img" aria-labelledby="t d">
<title id="t">Five shapes of message: SQS, SNS, EventBridge, Step Functions and SES</title>
<desc id="d">Five panels, each with a service, the shape of message it handles, a small diagram and a bakery example. Amazon SQS, a queue: work waits until a worker pulls it. The web server sends orders into an SQS queue, and a packing worker pulls them; example: orders wait for the packing worker even if it is down for an hour. Amazon SNS, a topic: one message pushed to every subscriber. The order function publishes to an SNS topic, which pushes to the owner's email, a kitchen queue and an invoice function; example: order failed reaches the owner, the kitchen and invoicing at once. Amazon EventBridge, an event bus: events routed by rules on what they say. AWS services, your apps and SaaS partners send events to an event bus with rules, which sends matching events to targets; example: when an EC2 instance stops, tell the owner, and a sales report at 23:00. AWS Step Functions, a workflow: several steps in order, tracked to the end. Four steps: take deposit, check baker, owner approves (highlighted), book the bake; a state machine with retries and waits. Amazon SES, email out: email from your own domain to customers. The order website sends through Amazon SES to customers' inboxes, from the bakery's own domain; example: the order confirmation each customer receives.</desc>

