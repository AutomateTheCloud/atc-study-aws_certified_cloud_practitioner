<svg xmlns="http://www.w3.org/2000/svg" width="680" height="555" viewBox="0 0 680 555" role="img" aria-labelledby="t d">
<title id="t">What you manage on Amazon EC2, on ECS or EKS with EC2 instances, on ECS or EKS with AWS Fargate, and on AWS Lambda</title>
<desc id="d">A grid of six rows by four compute options, each cell saying who does the work. Your code and its libraries, data and permissions: you, on all four. Language runtime, such as a Python version: you on EC2 (installed on the server), you on ECS or EKS with EC2 or Fargate (inside your container image), AWS on Lambda (it updates managed runtimes; you move off retired ones). Starting, stopping and spreading copies of the app: you on EC2, with Auto Scaling; AWS on the two container options (ECS or EKS does it, to your settings); AWS on Lambda (a copy per event). Choosing servers, type and how many: you on EC2 and on ECS or EKS with EC2; AWS on Fargate (you only set CPU and memory per task) and on Lambda (you only set memory). Server operating system and its patches: you on EC2 and on ECS or EKS with EC2; AWS on Fargate and Lambda. Hardware, buildings and power: AWS on all four. Rows that are yours: 5 of 6 on EC2, 4 of 6 on ECS or EKS with EC2, 2 of 6 on Fargate, 1 of 6 on Lambda. Notes: the top row never moves; ECS Managed Instances and EKS Auto Mode are middle options in which AWS patches and scales the EC2 instances.</desc>

<style>
