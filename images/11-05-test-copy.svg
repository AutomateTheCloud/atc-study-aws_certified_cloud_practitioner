<line class="seg-gap" x1="538.6" x2="538.6" y1="100" y2="140"/>
<text class="vlab" x="566.9" y="125">$57.30</text>
<text class="tick" x="196.0" y="157">Servers $30.37 · Load balancer $16.43 · Public IPv4 $7.30 · Disks $3.20</text>
<text class="lab" x="186" y="213" text-anchor="end">Trimmed</text>
<text class="tick" x="186" y="229" text-anchor="end">1 server, 40 h a week</text>
<rect class="s1" x="196.0" y="196" width="22.9" height="40"><title>Server: $3.62</title></rect>
<path class="s1l" d="M218.9,196.0 L225.1,196.0 Q229.1,196.0 229.1,200.0 L229.1,232.0 Q229.1,236.0 225.1,236.0 L218.9,236.0 Z"><title>Disk: $1.60</title></path>
<line class="seg-gap" x1="218.9" x2="218.9" y1="196" y2="236"/>
<text class="vlab" x="237.1" y="221">$5.22</text>
<text class="tick" x="196.0" y="253">Server $3.62 · Disk $1.60</text>
<text class="note" x="16" y="328">Draft: 2 t3.small servers, a load balancer and 2 public IPv4 addresses for 730 hours, 2 disks of 20 GB.</text>
<text class="note" x="16" y="343">Trimmed: 1 t3.small server for 40 of the week's 168 hours (about 174 hours a month) and its 20 GB disk,</text>
<text class="note" x="16" y="358">which bills all month even while the server is stopped. AWS Price List, retrieved 2026-10-24.</text>
