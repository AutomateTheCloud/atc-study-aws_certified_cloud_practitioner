<svg xmlns="http://www.w3.org/2000/svg" width="680" height="377" viewBox="0 0 680 377" role="img" aria-labelledby="t d">
<title id="t">The test copy's monthly cost before and after removing the hourly items it doesn't need</title>
<desc id="d">Two stacked horizontal bars in dollars per month. The nephew's draft, a copy of the live site, totals $57.30: servers $30.37, load balancer $16.43, public IPv4 $7.30, all charged every hour, plus disks $3.20. The trimmed copy, one server running 40 hours a week, totals $5.22: server $3.62 and disk $1.60. US East (N. Virginia), On-Demand, prices as of 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .vlab { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .seg-gap { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="680" height="377" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">The test copy for the new feature, before and after</text>
<text class="sub" x="16" y="48">Monthly cost, On-Demand, US East (N. Virginia), as of 2026-10-24</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Charged every hour it exists</text>
<rect class="s1l" x="250" y="66" width="12" height="12" rx="2"/>
<text x="268" y="76">Charged for the size you set</text>
<line class="axis" x1="196.0" x2="196.0" y1="94" y2="268"/>
<text class="tick" x="196.0" y="284" text-anchor="middle">$0</text>
<line class="grid" x1="259.3" x2="259.3" y1="94" y2="268"/>
<text class="tick" x="259.3" y="284" text-anchor="middle">$10</text>
<line class="grid" x1="322.7" x2="322.7" y1="94" y2="268"/>
<text class="tick" x="322.7" y="284" text-anchor="middle">$20</text>
<line class="grid" x1="386.0" x2="386.0" y1="94" y2="268"/>
<text class="tick" x="386.0" y="284" text-anchor="middle">$30</text>
<line class="grid" x1="449.3" x2="449.3" y1="94" y2="268"/>
<text class="tick" x="449.3" y="284" text-anchor="middle">$40</text>
<line class="grid" x1="512.7" x2="512.7" y1="94" y2="268"/>
<text class="tick" x="512.7" y="284" text-anchor="middle">$50</text>
<line class="grid" x1="576.0" x2="576.0" y1="94" y2="268"/>
<text class="tick" x="576.0" y="284" text-anchor="middle">$60</text>
<text class="tick" x="386.0" y="302" text-anchor="middle">Dollars per month</text>
<text class="lab" x="186" y="117" text-anchor="end">Nephew's draft</text>
<text class="tick" x="186" y="133" text-anchor="end">a copy of the live site</text>
<rect class="s1" x="196.0" y="100" width="192.3" height="40"><title>Servers: $30.37</title></rect>
<rect class="s1" x="388.3" y="100" width="104.1" height="40"><title>Load balancer: $16.43</title></rect>
<line class="seg-gap" x1="388.3" x2="388.3" y1="100" y2="140"/>
<rect class="s1" x="492.4" y="100" width="46.2" height="40"><title>Public IPv4: $7.30</title></rect>
