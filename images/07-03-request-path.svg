<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img" aria-labelledby="t d">
<title id="t">How the bakery's requests flow through Route 53, CloudFront and API Gateway</title>
<desc id="d">Three areas from left to right: people and outside systems, edge locations, and the US East (N. Virginia) Region. Step 1: the customer's browser asks Amazon Route 53, at the edge, where bakery.example is. Step 2: Route 53 answers with an address at CloudFront. Step 3: the browser sends the page or photo request to Amazon CloudFront at an edge location near the customer, which keeps copies of content. Step 4, dashed: only when it has no fresh copy, CloudFront fetches from an origin in the Region, either the S3 photo bucket or the web server on EC2. Step 5: a delivery partner's app calls Amazon API Gateway in the Region, which runs the Lambda order functions to look up the order. Orange boxes run at edge locations; blue boxes run in a Region.</desc>

