<svg xmlns="http://www.w3.org/2000/svg" width="680" height="534" viewBox="0 0 680 534" role="img" aria-labelledby="t d">
<title id="t">Who does each database task: on-premises, a database on EC2, and Amazon RDS</title>
<desc id="d">A grid of 11 tasks by three setups. On-premises: you do all 11. Database on EC2: AWS does server maintenance, hardware lifecycle, and power, network and cooling (3 of 11); you do application optimization, scaling, high availability, database backups, database software patching and install, and operating system patching and installation. Amazon RDS: AWS does 10 of 11; you keep application optimization, which AWS calls query tuning. A dashed line in each column marks where your tasks end, and it moves up from the bottom (on-premises) to near the top (RDS).</desc>

<style>
