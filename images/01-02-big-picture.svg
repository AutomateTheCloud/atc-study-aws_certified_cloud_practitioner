<svg xmlns="http://www.w3.org/2000/svg" width="680" height="502" viewBox="0 0 680 502" role="img" aria-labelledby="t d">
<title id="t">Four steps from a phone to a web page</title>
<desc id="d">A customer's phone on the left and the bakery's web server, 192.0.2.10, on the right, with four numbered steps between them. 1, look up the name: the phone asks DNS where bakery.example is, and DNS answers 192.0.2.10. 2, travel to the address: packets cross the home network, the ISP and the internet, via routers, to 192.0.2.10 port 443. 3, highlighted, secure the line: the server sends its certificate, saying it holds the name bakery.example, and both sides agree how to encrypt. 4, ask and answer: inside an encrypted connection marked with a padlock, the request 'send me the order page' goes to the server and the page comes back.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
