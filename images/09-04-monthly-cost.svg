<svg xmlns="http://www.w3.org/2000/svg" width="680" height="340" viewBox="0 0 680 340" role="img" aria-labelledby="t d">
<title id="t">Monthly cost of Shield Standard, AWS WAF, Firewall Manager and Shield Advanced</title>
<desc id="d">Horizontal bar chart in US dollars a month. Shield Standard: $0, included for every customer. AWS WAF for the bakery's example setup of one web ACL, four rules or rule groups and 2 million requests: $10.20, a bar too thin to see. Firewall Manager, one policy: $100 per policy per Region, and it needs an organization. Shield Advanced: $3,000 plus data transfer fees, with a 1-year subscription, the full width of the chart. A year of Shield Advanced is at least $36,000, about 290 times the bakery's WAF bill. Shield Advanced covers the standard WAF fees for the resources it protects, and Firewall Manager fees for its WAF and Shield Advanced policies. Sources: the Shield, WAF and Firewall Manager pricing pages, checked 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; --alt-fill:#fbe1d6; --zone:#f6f5f1; }
