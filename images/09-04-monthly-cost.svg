<text class="lab" x="184" y="142" text-anchor="end">AWS WAF, the bakery's setup</text>
<path class="s1" d="M196.0,128.0 L196.0,128.0 Q198.0,128.0 198.0,130.0 L198.0,146.0 Q198.0,148.0 196.0,148.0 L196.0,148.0 Z"><title>AWS WAF, the bakery's setup: $10.20 a month</title></path>
<text class="val" x="206.0" y="143">$10.20: 1 web ACL, 4 rules, 2 million requests</text>
<text class="lab" x="184" y="182" text-anchor="end">Firewall Manager, 1 policy</text>
<path class="s1" d="M196.0,168.0 L202.0,168.0 Q206.0,168.0 206.0,172.0 L206.0,184.0 Q206.0,188.0 202.0,188.0 L196.0,188.0 Z"><title>Firewall Manager, 1 policy: $100.00 a month</title></path>
<text class="val" x="214.0" y="183">$100 per policy per Region (needs an organization)</text>
<text class="lab" x="184" y="222" text-anchor="end">Shield Advanced</text>
<path class="s1" d="M196.0,208.0 L492.0,208.0 Q496.0,208.0 496.0,212.0 L496.0,224.0 Q496.0,228.0 492.0,228.0 L196.0,228.0 Z"><title>Shield Advanced: $3,000.00 a month</title></path>
<text class="val" x="196" y="244">$3,000 + data transfer fees; 1-year subscription</text>
<line class="axis" x1="196" x2="196" y1="84" y2="248"/>
<text class="small" x="16" y="268.0">A year of Shield Advanced is at least $36,000, about 290 times the bakery's WAF bill. Shield Advanced covers the</text>
<text class="small" x="16" y="285.0">standard WAF fees for the resources it protects, and Firewall Manager fees for its WAF and Shield Advanced policies.</text>
<text class="note" x="16" y="306.0">Shield, WAF and Firewall Manager pricing pages, checked 2026-10-24. WAF: $5 per web ACL, $1 per rule or rule</text>
<text class="note" x="16" y="321.0">group, $0.60 per million requests, a month. The bakery's numbers are made up; check AWS Pricing Calculator.</text>
