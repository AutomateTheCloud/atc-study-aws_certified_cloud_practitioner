<svg xmlns="http://www.w3.org/2000/svg" width="680" height="396" viewBox="0 0 680 396" role="img" aria-labelledby="t d">
<title id="t">How long Data Firehose, SQS and Kinesis Data Streams can hold data</title>
<desc id="d">A range chart on a time axis that grows by large steps: 1 second, 1 minute, 1 hour, 1 day, 1 week, 1 year. Amazon Data Firehose: from a moment up to 900 seconds (15 minutes), while it buffers before delivering. Amazon SQS: settable from 1 minute to 14 days, with a default of 4 days, marked. Kinesis Data Streams: from 24 hours, the default, marked, up to 365 days. Notes: Firehose doesn't store data for readers; SQS deletes a message sooner when a worker finishes with it; Data Streams keeps records after they are read, for the whole period.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; --st-fill:#ecebe6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; --st-fill:#262624; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .store { fill: var(--st-fill); stroke: var(--axis); stroke-width: 1.2; stroke-dasharray: 6 4; }
  .band { fill: none; stroke: var(--axis); stroke-width: 1; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .verb { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .arrlab { fill: var(--ink2); font-size: 11.5px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .num { fill: var(--surface); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--s1); stroke: var(--s1); stroke-width: 1.5; }
  .range { fill: var(--s1); }
  .dflt { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="680" height="396" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How long each one can hold your data</text>
<text class="sub" x="16" y="48">The range you can set for each, on a time scale where each step is much longer than the last</text>
<line class="grid" x1="172.0" x2="172.0" y1="86" y2="266"/>
<text class="tick" x="172.0" y="284" text-anchor="middle">1 second</text>
<line class="grid" x1="285.3" x2="285.3" y1="86" y2="266"/>
<text class="tick" x="285.3" y="284" text-anchor="middle">1 minute</text>
<line class="grid" x1="398.7" x2="398.7" y1="86" y2="266"/>
<text class="tick" x="398.7" y="284" text-anchor="middle">1 hour</text>
<line class="grid" x1="486.7" x2="486.7" y1="86" y2="266"/>
<text class="tick" x="486.7" y="284" text-anchor="middle">1 day</text>
<line class="grid" x1="540.5" x2="540.5" y1="86" y2="266"/>
<text class="tick" x="540.5" y="284" text-anchor="middle">1 week</text>
<line class="grid" x1="650.0" x2="650.0" y1="86" y2="266"/>
<text class="tick" x="650.0" y="284" text-anchor="middle">1 year</text>
<line class="axis" x1="172" x2="650" y1="266" y2="266"/>
<text class="cellt" x="16" y="117">Amazon Data Firehose</text>
<rect class="range" x="172.0" y="106" width="188.3" height="14" rx="4"/>
<text class="small" x="172.0" y="138">buffers up to 900 seconds, then delivers</text>
<text class="cellt" x="16" y="175">Amazon SQS</text>
<rect class="range" x="285.3" y="164" width="274.4" height="14" rx="4"/>
<circle class="dflt" cx="525.0" cy="171" r="6"/>
<text class="small" x="285.3" y="196">1 minute to 14 days; default 4 days</text>
<text class="cellt" x="16" y="233">Kinesis Data Streams</text>
<rect class="range" x="486.7" y="222" width="163.3" height="14" rx="4"/>
<circle class="dflt" cx="486.7" cy="229" r="6"/>
<text class="small" x="400.0" y="254">24 hours (default) to 365 days</text>
<circle class="dflt" cx="22" cy="306" r="6"/>
<text class="small" x="34" y="310">the default setting</text>
<text class="note" x="16" y="334">Firehose doesn't store data for readers; it holds it only until it delivers. SQS deletes a message sooner</text>
<text class="note" x="16" y="350">when a worker finishes with it. Data Streams keeps records after they're read, for the whole period.</text>
<text class="note" x="16" y="366">Values as of 2026-10-24, from the Kinesis Data Streams and Amazon SQS documentation and the Firehose FAQ.</text>
</svg>
