<svg xmlns="http://www.w3.org/2000/svg" width="680" height="535" viewBox="0 0 680 535" role="img" aria-labelledby="t d">
<title id="t">The parts of a small JSON document</title>
<desc id="d">A JSON document for a made-up bakery order, with notes. The whole document is one object in curly braces. "order_id": "1042" is a name and value pair: a name in double quotes, a colon, then its value, with commas between pairs; here the value is text in quotes. "cupcakes": 14 is a number, with no quotes. "paid": true is a true-or-false value, lowercase, no quotes. "toppings": ["sprinkles", "lemon icing"] is an array, a list in square brackets. "customer" holds a nested object with a name, Sam, and a pickup day, Saturday. "note": null means no value, and as the last pair it has no comma after it. A footnote says spaces and line breaks between parts don't matter in JSON.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .codebg { fill: none; stroke: var(--axis); stroke-width: 1; }
  .code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: var(--ink); font-size: 15px; }
  .code-s { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: var(--ink); font-size: 13px; }
  .code-dim { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace; fill: var(--muted); font-size: 15px; }
  .key { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .brk { stroke: var(--s1); stroke-width: 2; fill: none; }
  .mark { fill: none; stroke: var(--s1); stroke-width: 1.5; }
</style>
<rect width="680" height="535" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Anatomy of a JSON document</text>
<text class="sub" x="16" y="48">A made-up bakery order: names on the left of each colon, values on the right</text>
<rect class="codebg" x="16" y="70" width="372" height="348" rx="6"/>
<text class="code-s" x="28" y="94" xml:space="preserve">{</text>
<text class="code-s" x="28" y="124" xml:space="preserve">  "order_id": "1042",</text>
<text class="code-s" x="28" y="154" xml:space="preserve">  "cupcakes": 14,</text>
<text class="code-s" x="28" y="184" xml:space="preserve">  "paid": true,</text>
<text class="code-s" x="28" y="214" xml:space="preserve">  "toppings": ["sprinkles", "lemon icing"],</text>
<text class="code-s" x="28" y="244" xml:space="preserve">  "customer": {</text>
<text class="code-s" x="28" y="274" xml:space="preserve">    "name": "Sam",</text>
<text class="code-s" x="28" y="304" xml:space="preserve">    "pickup": "Saturday"</text>
<text class="code-s" x="28" y="334" xml:space="preserve">  },</text>
<text class="code-s" x="28" y="364" xml:space="preserve">  "note": null</text>
<text class="code-s" x="28" y="394" xml:space="preserve">}</text>
<line class="lead" stroke-dasharray="2 3" x1="198.4" x2="388" y1="120" y2="120"/>
<line class="lead" x1="388" x2="404" y1="120" y2="120"/>
<text class="key" x="412" y="124">NAME : VALUE</text>
<text class="small" x="412" y="139.0">A name in double quotes, a colon,</text>
<text class="small" x="412" y="153.0">then its value. Commas separate the</text>
<text class="small" x="412" y="167.0">pairs.</text>
<line class="lead" stroke-dasharray="2 3" x1="167.1" x2="388" y1="150" y2="150"/>
<line class="lead" x1="388" x2="404" y1="150" y2="185"/>
<text class="key" x="412" y="189">NUMBER</text>
<text class="small" x="412" y="204.0">No quotes. "14" in quotes would be</text>
<text class="small" x="412" y="218.0">text.</text>
<line class="lead" stroke-dasharray="2 3" x1="151.4" x2="388" y1="180" y2="180"/>
<line class="lead" x1="388" x2="404" y1="180" y2="236"/>
<text class="key" x="412" y="240">TRUE OR FALSE</text>
<text class="small" x="412" y="255.0">Written in lowercase, with no</text>
<text class="small" x="412" y="269.0">quotes.</text>
<line class="lead" stroke-dasharray="2 3" x1="370.7" x2="388" y1="210" y2="210"/>
<line class="lead" x1="388" x2="404" y1="210" y2="287"/>
<text class="key" x="412" y="291">ARRAY</text>
<text class="small" x="412" y="306.0">A list in square brackets, in order,</text>
<text class="small" x="412" y="320.0">separated by commas.</text>
<line class="lead" stroke-dasharray="2 3" x1="151.4" x2="388" y1="240" y2="240"/>
<line class="lead" x1="388" x2="404" y1="240" y2="338"/>
<text class="key" x="412" y="342">NESTED OBJECT</text>
<text class="small" x="412" y="357.0">An object inside an object: the</text>
<text class="small" x="412" y="371.0">customer's two details.</text>
<line class="lead" stroke-dasharray="2 3" x1="143.6" x2="388" y1="360" y2="360"/>
<line class="lead" x1="388" x2="404" y1="360" y2="389"/>
<text class="key" x="412" y="393">NULL</text>
<text class="small" x="412" y="408.0">Means "no value". Last pair: no</text>
<text class="small" x="412" y="422.0">comma after it.</text>
<line class="lead" stroke-dasharray="2 3" x1="41.8" x2="388" y1="390" y2="390"/>
<line class="lead" x1="388" x2="404" y1="390" y2="440"/>
<text class="key" x="412" y="444">OBJECT</text>
<text class="small" x="412" y="459.0">Curly braces hold the whole</text>
<text class="small" x="412" y="473.0">document: one object.</text>
<text class="sub" x="16" y="521.0">Spaces and line breaks between parts don't matter in JSON; they only make it easier to read.</text>
</svg>
