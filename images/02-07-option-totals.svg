<svg xmlns="http://www.w3.org/2000/svg" width="680" height="356" viewBox="0 0 680 356" role="img" aria-labelledby="t d">
<title id="t">Yearly total for the bakery's four options</title>
<desc id="d">Horizontal bar chart, made-up figures. A, keep 3 owned servers: $5,400 to run plus about $8,000 of lost orders, about $13,400. B, own 6 servers: $10,800. C, cloud matching each month's need: $6,250. D, cloud with 6 servers left running all year: $18,000.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-ink2 { stroke: var(--ink2); stroke-width: 2; fill: none; stroke-linecap: round; }
</style>
<rect width="680" height="356" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A year for the bakery under each option</text>
<text class="sub" x="16" y="48">Made-up figures: $150 a server-month owned, $250 rented, about $8,000 of lost orders</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Yearly cost to run</text>
<rect class="s2" x="170" y="66" width="12" height="12" rx="2"/>
<text x="188" y="76">Lost orders</text>
<text class="lab" x="16" y="114">A: Keep 3 owned servers</text>
<rect class="s1" x="16" y="122" width="127.6" height="20"><title>A: Keep 3 owned servers: $5,400 to run</title></rect>
<path class="s2" d="M145.6,122.0 L333.6,122.0 Q337.6,122.0 337.6,126.0 L337.6,138.0 Q337.6,142.0 333.6,142.0 L145.6,142.0 Z"><title>A: Keep 3 owned servers: about $8,000 of lost orders</title></path>
<text class="lab" x="345.6" y="137">$5,400 + about $8,000 lost</text>
<text class="lab" x="16" y="172">B: Own 6 servers, enough for the peak</text>
<path class="s1" d="M16.0,180.0 L271.2,180.0 Q275.2,180.0 275.2,184.0 L275.2,196.0 Q275.2,200.0 271.2,200.0 L16.0,200.0 Z"><title>B: Own 6 servers, enough for the peak: $10,800 to run</title></path>
<text class="lab" x="283.2" y="195">$10,800</text>
<text class="lab" x="16" y="230">C: Cloud, matching each month's need</text>
<path class="s1" d="M16.0,238.0 L162.0,238.0 Q166.0,238.0 166.0,242.0 L166.0,254.0 Q166.0,258.0 162.0,258.0 L16.0,258.0 Z"><title>C: Cloud, matching each month's need: $6,250 to run</title></path>
<text class="lab" x="174.0" y="253">$6,250</text>
<text class="lab" x="16" y="288">D: Cloud, but 6 servers left running all year</text>
<path class="s1" d="M16.0,296.0 L444.0,296.0 Q448.0,296.0 448.0,300.0 L448.0,312.0 Q448.0,316.0 444.0,316.0 L16.0,316.0 Z"><title>D: Cloud, but 6 servers left running all year: $18,000 to run</title></path>
<text class="lab" x="456.0" y="311">$18,000</text>
<line class="axis" x1="16" x2="16" y1="118" y2="332"/>
</svg>
