<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="t d">
<title id="t">Three frames: a failed instance is skipped by the load balancer and replaced by Auto Scaling</title>
<desc id="d">Three numbered frames, each with a load balancer above two Availability Zones, a and b. Frame 1, both instances healthy: requests go to instance 1 in AZ a and instance 2 in AZ b; the load balancer splits requests between the two AZs. Frame 2, instance 1 fails its health check, marked with a cross: it gets no requests, and instance 2 carries the site. Frame 3, Auto Scaling replaces it: a new instance 3, highlighted, runs in AZ a, registers with the load balancer and takes requests again, alongside instance 2.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --crit:#d03b3b; --crit-fill:#fae3e3; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --crit:#d03b3b; --crit-fill:#3d1d1d; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .boxdash { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .group { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 9 4; }
  .wire { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .flow { stroke: var(--s1); stroke-width: 2; fill: none; }
  .crit { fill: var(--crit-fill); stroke: var(--crit); stroke-width: 1.5; }
  .ci { stroke: var(--crit); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .num { fill: var(--surface); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--ink); }
  .dash-ink { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  .dash-muted { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
</style>
<rect width="700" height="400" fill="var(--surface)" style="fill:var(--surface)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--s1)"/></marker></defs>
<text class="title" x="16" y="28">When an instance fails, both services act</text>
<text class="sub" x="16" y="48">Three moments in one Auto Scaling group behind a load balancer, minimum 2, one per AZ</text>
<rect class="panel" x="16" y="64" width="216" height="300" rx="8"/>
<circle cx="38" cy="86" r="11" style="fill:var(--ink)"/>
<text class="num" x="38" y="91" text-anchor="middle">1</text>
<text class="cellt" x="56" y="91.0">Both instances healthy</text>
<rect class="box" x="34" y="128" width="180" height="30" rx="5"/>
<text class="small" x="124.0" y="147" text-anchor="middle">Load balancer</text>
<rect class="zone" x="30" y="180" width="90" height="84" rx="6"/>
<text class="note" x="75" y="258" text-anchor="middle">AZ a</text>
<rect class="box" x="36" y="204" width="78" height="34" rx="5"/>
<text class="small" x="75.0" y="225" text-anchor="middle">Instance 1</text>
<line class="flow" x1="75" y1="158" x2="75" y2="202" marker-end="url(#ab)"/>
<rect class="zone" x="130" y="180" width="90" height="84" rx="6"/>
<text class="note" x="175" y="258" text-anchor="middle">AZ b</text>
<rect class="box" x="136" y="204" width="78" height="34" rx="5"/>
<text class="small" x="175.0" y="225" text-anchor="middle">Instance 2</text>
<line class="flow" x1="175" y1="158" x2="175" y2="202" marker-end="url(#ab)"/>
<text class="small" x="30" y="290.0">The load balancer splits</text>
<text class="small" x="30" y="306.0">requests between the two AZs.</text>
<rect class="panel" x="242" y="64" width="216" height="300" rx="8"/>
<circle cx="264" cy="86" r="11" style="fill:var(--ink)"/>
<text class="num" x="264" y="91" text-anchor="middle">2</text>
<text class="cellt" x="282" y="91.0">Instance 1 fails its</text>
<text class="cellt" x="282" y="107.0">health check</text>
<rect class="box" x="260" y="128" width="180" height="30" rx="5"/>
<text class="small" x="350.0" y="147" text-anchor="middle">Load balancer</text>
<rect class="zone" x="256" y="180" width="90" height="84" rx="6"/>
<text class="note" x="301" y="258" text-anchor="middle">AZ a</text>
<rect class="crit" x="262" y="204" width="78" height="34" rx="5"/>
<text class="small" x="301.0" y="225" text-anchor="middle">Instance 1</text>
<path class="ci" d="M327,205 L337,215 M337,205 L327,215"/>
<text class="small" x="301" y="176" text-anchor="middle">no requests</text>
<rect class="zone" x="356" y="180" width="90" height="84" rx="6"/>
<text class="note" x="401" y="258" text-anchor="middle">AZ b</text>
<rect class="box" x="362" y="204" width="78" height="34" rx="5"/>
<text class="small" x="401.0" y="225" text-anchor="middle">Instance 2</text>
<line class="flow" x1="401" y1="158" x2="401" y2="202" marker-end="url(#ab)"/>
<text class="small" x="256" y="290.0">The load balancer stops</text>
<text class="small" x="256" y="306.0">sending it requests. Instance</text>
<text class="small" x="256" y="322.0">2 carries the site.</text>
<rect class="panel" x="468" y="64" width="216" height="300" rx="8"/>
<circle cx="490" cy="86" r="11" style="fill:var(--ink)"/>
<text class="num" x="490" y="91" text-anchor="middle">3</text>
<text class="cellt" x="508" y="91.0">Auto Scaling replaces it</text>
<rect class="box" x="486" y="128" width="180" height="30" rx="5"/>
<text class="small" x="576.0" y="147" text-anchor="middle">Load balancer</text>
<rect class="zone" x="482" y="180" width="90" height="84" rx="6"/>
<text class="note" x="527" y="258" text-anchor="middle">AZ a</text>
<rect class="hi" x="488" y="204" width="78" height="34" rx="5"/>
<text class="small" x="527.0" y="225" text-anchor="middle">Instance 3</text>
<line class="flow" x1="527" y1="158" x2="527" y2="202" marker-end="url(#ab)"/>
<rect class="zone" x="582" y="180" width="90" height="84" rx="6"/>
<text class="note" x="627" y="258" text-anchor="middle">AZ b</text>
<rect class="box" x="588" y="204" width="78" height="34" rx="5"/>
<text class="small" x="627.0" y="225" text-anchor="middle">Instance 2</text>
<line class="flow" x1="627" y1="158" x2="627" y2="202" marker-end="url(#ab)"/>
<text class="small" x="482" y="290.0">The new instance registers</text>
<text class="small" x="482" y="306.0">with the load balancer and</text>
<text class="small" x="482" y="322.0">takes requests again.</text>
<text class="note" x="16" y="386">Blue arrows: requests. Our summary of the EC2 Auto Scaling and Elastic Load Balancing user guides, checked 2026-10-24.</text>
</svg>
