<svg xmlns="http://www.w3.org/2000/svg" width="680" height="358" viewBox="0 0 680 358" role="img" aria-labelledby="t d">
<title id="t">Peak CPU and peak memory over three weeks for four of the chain's servers</title>
<desc id="d">Horizontal bars, two per server, on a scale from 0 to 100 percent. web-1: CPU 18%, memory 31%. test-1: CPU 25%, memory 28%. stock-1: CPU 97%, memory 88%. stock-2: CPU 9%; memory has no data because the CloudWatch agent isn't installed.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
</style>
<rect width="680" height="358" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Peak use over three weeks, by server</text>
<text class="sub" x="16" y="48">Percent of the instance's CPU and memory at the busiest moment. Made-up data.</text>
<rect class="s1" x="16" y="64" width="12" height="12" rx="2"/>
<text x="34" y="74">Peak CPU</text>
<rect class="s2" x="120" y="64" width="12" height="12" rx="2"/>
<text x="138" y="74">Peak memory</text>
<line class="axis" x1="110.0" x2="110.0" y1="86" y2="324"/>
<text class="tick" x="110.0" y="342" text-anchor="middle">0%</text>
<line class="grid" x1="235.0" x2="235.0" y1="86" y2="324"/>
<text class="tick" x="235.0" y="342" text-anchor="middle">25%</text>
<line class="grid" x1="360.0" x2="360.0" y1="86" y2="324"/>
<text class="tick" x="360.0" y="342" text-anchor="middle">50%</text>
<line class="grid" x1="485.0" x2="485.0" y1="86" y2="324"/>
<text class="tick" x="485.0" y="342" text-anchor="middle">75%</text>
<line class="grid" x1="610.0" x2="610.0" y1="86" y2="324"/>
<text class="tick" x="610.0" y="342" text-anchor="middle">100%</text>
<text class="lab" x="100" y="120" text-anchor="end">web-1</text>
<path class="s1" d="M110.0,98.0 L196.0,98.0 Q200.0,98.0 200.0,102.0 L200.0,110.0 Q200.0,114.0 196.0,114.0 L110.0,114.0 Z"/>
<text class="tick" x="206.0" y="110">18%</text>
<path class="s2" d="M110.0,118.0 L261.0,118.0 Q265.0,118.0 265.0,122.0 L265.0,130.0 Q265.0,134.0 261.0,134.0 L110.0,134.0 Z"/>
<text class="tick" x="271.0" y="130">31%</text>
<text class="lab" x="100" y="178" text-anchor="end">test-1</text>
<path class="s1" d="M110.0,156.0 L231.0,156.0 Q235.0,156.0 235.0,160.0 L235.0,168.0 Q235.0,172.0 231.0,172.0 L110.0,172.0 Z"/>
<text class="tick" x="241.0" y="168">25%</text>
<path class="s2" d="M110.0,176.0 L246.0,176.0 Q250.0,176.0 250.0,180.0 L250.0,188.0 Q250.0,192.0 246.0,192.0 L110.0,192.0 Z"/>
<text class="tick" x="256.0" y="188">28%</text>
<text class="lab" x="100" y="236" text-anchor="end">stock-1</text>
<path class="s1" d="M110.0,214.0 L591.0,214.0 Q595.0,214.0 595.0,218.0 L595.0,226.0 Q595.0,230.0 591.0,230.0 L110.0,230.0 Z"/>
<text class="tick" x="601.0" y="226">97%</text>
<path class="s2" d="M110.0,234.0 L546.0,234.0 Q550.0,234.0 550.0,238.0 L550.0,246.0 Q550.0,250.0 546.0,250.0 L110.0,250.0 Z"/>
<text class="tick" x="556.0" y="246">88%</text>
<text class="lab" x="100" y="294" text-anchor="end">stock-2</text>
<path class="s1" d="M110.0,272.0 L151.0,272.0 Q155.0,272.0 155.0,276.0 L155.0,284.0 Q155.0,288.0 151.0,288.0 L110.0,288.0 Z"/>
<text class="tick" x="161.0" y="284">9%</text>
<text class="tick" x="116" y="304">memory: no data (no CloudWatch agent)</text>
</svg>
