<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" aria-labelledby="t d">
<title id="t">Total spent over three years: owning 6 servers, the cloud matched to demand, and the cloud left at peak size</title>
<desc id="d">Line chart of the total spent so far, month 1 to month 36, made-up figures. Owning 6 servers jumps to $12,940 in month 1, because the hardware is paid up front, then rises slowly to $29,340. The cloud matched to demand starts at $350 and rises in steps with the bakery's busy months to $22,350. The cloud left at peak size rises by $1,600 every month, passes owning in month 11, and reaches $57,600.</desc>

