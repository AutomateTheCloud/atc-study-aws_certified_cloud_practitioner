<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">The parts of the instance type name m7g.large</title>
<desc id="d">The name m7g.large in large letters, with four labeled parts. m: the series, general purpose. 7: the generation, 7th, where a higher number is newer. g: an option, extra letters, here an AWS Graviton (Arm) processor. large, after the dot: the size, how much of the family's hardware. Together, m7g is the family.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .wire { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .big { fill: var(--ink); font-size: 56px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .bighi { fill: var(--s1); font-size: 56px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .mono { fill: var(--ink); font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .brace { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .s3 { fill: var(--s3); }
</style>
<rect width="680" height="300" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Reading an instance type name</text>
<text class="sub" x="16" y="48">Before the dot: the family, made of series, generation and options. After the dot: the size.</text>
<text class="big" x="269.0" y="132" text-anchor="middle" style="fill:var(--muted)">.</text>
<text class="big" x="167.0" y="132" text-anchor="middle" textLength="30">m</text>
<path class="brace" d="M153.0,146 L153.0,154 L181.0,154 L181.0,146"/>
<line class="brace" x1="167.0" y1="154" x2="100.0" y2="190"/>
<text class="cellt" x="40" y="208">Series</text>
<text class="small" x="40" y="226.0">m: general purpose</text>
<text class="big" x="201.0" y="132" text-anchor="middle" textLength="30">7</text>
<path class="brace" d="M187.0,146 L187.0,154 L215.0,154 L215.0,146"/>
<line class="brace" x1="201.0" y1="154" x2="240.0" y2="190"/>
<text class="cellt" x="180" y="208">Generation</text>
<text class="small" x="180" y="226.0">7th; a higher number is</text>
<text class="small" x="180" y="241.0">newer</text>
<text class="big" x="235.0" y="132" text-anchor="middle" textLength="30">g</text>
<path class="brace" d="M221.0,146 L221.0,154 L249.0,154 L249.0,146"/>
<line class="brace" x1="235.0" y1="154" x2="390.0" y2="190"/>
<text class="cellt" x="330" y="208">Option</text>
<text class="small" x="330" y="226.0">extra letters; here an</text>
<text class="small" x="330" y="241.0">AWS Graviton (Arm)</text>
<text class="small" x="330" y="256.0">processor</text>
<text class="big" x="371.0" y="132" text-anchor="middle" textLength="166">large</text>
<path class="brace" d="M289.0,146 L289.0,154 L453.0,154 L453.0,146"/>
<line class="brace" x1="371.0" y1="154" x2="560.0" y2="190"/>
<text class="cellt" x="500" y="208">Size</text>
<text class="small" x="500" y="226.0">how much of the family's</text>
<text class="small" x="500" y="241.0">hardware</text>
<text class="note" x="16" y="286">Source: EC2 Instance Types Guide, naming conventions. Checked 2026-10-24.</text>
</svg>
