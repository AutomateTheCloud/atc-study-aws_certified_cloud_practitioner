<text class="cells" x="26" y="302.0" text-anchor="start">application's migration</text>
<rect class="aws" x="237" y="86" width="206" height="72" rx="6"/>
<text class="boxt" x="247" y="104" text-anchor="start">Application Migration</text>
<text class="cells" x="247" y="120.0" text-anchor="start">Service, now AWS Transform</text>
<text class="cells" x="247" y="134.0" text-anchor="start">MGN: whole servers</text>
<rect class="aws" x="237" y="170" width="206" height="72" rx="6"/>
<text class="boxt" x="247" y="188" text-anchor="start">AWS DMS</text>
<text class="cells" x="247" y="204.0" text-anchor="start">Database data; SCT or DMS</text>
<text class="cells" x="247" y="218.0" text-anchor="start">Schema Conversion first if</text>
<text class="cells" x="247" y="232.0" text-anchor="start">the engine changes</text>
<rect class="aws" x="237" y="254" width="206" height="72" rx="6"/>
<text class="boxt" x="247" y="272" text-anchor="start">AWS DataSync</text>
<text class="cells" x="247" y="288.0" text-anchor="start">Files and objects over</text>
<text class="cells" x="247" y="302.0" text-anchor="start">the network (not Snowball)</text>
<rect class="aws" x="458" y="86" width="206" height="72" rx="6"/>
<text class="boxt" x="468" y="104" text-anchor="start">Elastic Disaster Recovery</text>
<text class="cells" x="468" y="120.0" text-anchor="start">Keeps copying servers;</text>
