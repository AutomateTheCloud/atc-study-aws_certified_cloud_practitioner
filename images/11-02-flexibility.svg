<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486" role="img" aria-labelledby="t d">
<title id="t">Which usage changes Compute and EC2 Instance Savings Plans and Regional and zonal Reserved Instances keep covering</title>
<desc id="d">A table of ten rows and four columns, as of 2026-10-24. Change instance family: Compute Savings Plan Yes, EC2 Instance Savings Plan No: one family, Regional Reserved Instance No, Zonal Reserved Instance No. Change instance size: Compute Savings Plan Yes, EC2 Instance Savings Plan Yes, Regional Reserved Instance Yes*, Zonal Reserved Instance No. Change Availability Zone: Compute Savings Plan Yes, EC2 Instance Savings Plan Yes, Regional Reserved Instance Yes, Zonal Reserved Instance No. Change Region: Compute Savings Plan Yes, EC2 Instance Savings Plan No: one Region, Regional Reserved Instance No, Zonal Reserved Instance No. Change operating system: Compute Savings Plan Yes, EC2 Instance Savings Plan Yes, Regional Reserved Instance No, Zonal Reserved Instance No. Change tenancy: Compute Savings Plan Yes, EC2 Instance Savings Plan Yes, Regional Reserved Instance No, Zonal Reserved Instance No. Covers Fargate and Lambda: Compute Savings Plan Yes, EC2 Instance Savings Plan No, Regional Reserved Instance No, Zonal Reserved Instance No. Reserves capacity: Compute Savings Plan No, EC2 Instance Savings Plan No, Regional Reserved Instance No, Zonal Reserved Instance Yes, in one AZ. You commit to: Compute Savings Plan $ per hour, EC2 Instance Savings Plan $ per hour, Regional Reserved Instance one configuration, Zonal Reserved Instance one configuration. Discount, up to: Compute Savings Plan 66%, EC2 Instance Savings Plan 72%, Regional Reserved Instance 72% (Standard), Zonal Reserved Instance 72% (Standard). Size flexibility for Regional Reserved Instances applies to Linux/Unix on default tenancy only.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; --no-fill:#f6f5f2; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --s3:#199e70; --no-fill:#1f1f1e; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .no { fill: var(--no-fill); stroke: var(--grid); stroke-width: 1; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .yes { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .avg { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .unit { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .unit-od { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .s3 { fill: var(--s3); }
</style>
