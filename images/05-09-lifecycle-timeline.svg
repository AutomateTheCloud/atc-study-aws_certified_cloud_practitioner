<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" aria-labelledby="t d">
<title id="t">Four lifecycle plans for 300 GB of nightly backups, by age in days</title>
<desc id="d">Four horizontal bars on a day axis from 0 to 365, each ending at a line marked 'Deleted on day 365'. Plan A, Standard all year: S3 Standard from day 0 to 365. Plan B, three steps: S3 Standard to day 30, S3 Standard-IA from day 30 to 90, S3 Glacier Flexible Retrieval from day 90 to 365. Plan C: S3 Glacier Deep Archive from day 0 to 365. Plan D: S3 Standard to day 30, then S3 Glacier Deep Archive to day 365.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --c-std:#184f95; --c-ia:#2a78d6; --c-gfr:#6da7ec; --c-gda:#9ec5f4; --t-std:#ffffff; --t-ia:#ffffff; --t-gfr:#0b0b0b; --t-gda:#0b0b0b; --s3c:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --c-std:#9ec5f4; --c-ia:#5598e7; --c-gfr:#256abf; --c-gda:#184f95; --t-std:#0b0b0b; --t-ia:#0b0b0b; --t-gfr:#ffffff; --t-gda:#ffffff; --s3c:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .STD { fill: var(--c-std); } .IA { fill: var(--c-ia); } .GFR { fill: var(--c-gfr); } .GDA { fill: var(--c-gda); }
  .tSTD { fill: var(--t-std); font-size: 11.5px; } .tIA { fill: var(--t-ia); font-size: 11.5px; }
  .tGFR { fill: var(--t-gfr); font-size: 11.5px; } .tGDA { fill: var(--t-gda); font-size: 11.5px; }
  .plan { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .plans { fill: var(--ink2); font-size: 11.5px; }
  .exp { stroke: var(--s2); stroke-width: 2.5; }
  .expt { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .fail { fill: var(--muted); font-size: 11.5px; font-style: italic; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s3 { stroke: var(--s3c); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .dot-s3 { fill: var(--s3c); stroke: var(--surface); stroke-width: 2; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="342" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Four lifecycle plans for one month of nightly backups</text>
<text class="sub" x="16" y="48">Where 300 GB of backups sit as they age, until a rule deletes them on day 365</text>
<text class="plan" x="16" y="89">Plan A</text>
<text class="plans" x="16" y="104">Standard all year</text>
<rect class="STD" x="191.0" y="74" width="448.0" height="34" rx="3"><title>Plan A: S3 Standard, day 0 to 365</title></rect>
<text class="tSTD" x="415.0" y="95" text-anchor="middle">S3 Standard</text>
<text class="plan" x="16" y="139">Plan B</text>
<text class="plans" x="16" y="154">Three steps</text>
<rect class="STD" x="191.0" y="124" width="35.0" height="34" rx="3"><title>Plan B: S3 Standard, day 0 to 30</title></rect>
<text class="tSTD" x="208.5" y="145" text-anchor="middle">Std</text>
<rect class="IA" x="228.0" y="124" width="72.0" height="34" rx="3"><title>Plan B: Standard-IA, day 30 to 90</title></rect>
<text class="tIA" x="264.0" y="145" text-anchor="middle">IA</text>
<rect class="GFR" x="302.0" y="124" width="337.0" height="34" rx="3"><title>Plan B: Glacier Flexible Retrieval, day 90 to 365</title></rect>
<text class="tGFR" x="470.5" y="145" text-anchor="middle">Glacier Flexible Retrieval</text>
<text class="plan" x="16" y="189">Plan C</text>
<text class="plans" x="16" y="204">Deep Archive from day 0</text>
<rect class="GDA" x="191.0" y="174" width="448.0" height="34" rx="3"><title>Plan C: Glacier Deep Archive, day 0 to 365</title></rect>
<text class="tGDA" x="415.0" y="195" text-anchor="middle">Glacier Deep Archive</text>
<text class="plan" x="16" y="239">Plan D</text>
<text class="plans" x="16" y="254">Standard, then Deep Archive</text>
<rect class="STD" x="191.0" y="224" width="35.0" height="34" rx="3"><title>Plan D: S3 Standard, day 0 to 30</title></rect>
<text class="tSTD" x="208.5" y="245" text-anchor="middle">Std</text>
<rect class="GDA" x="228.0" y="224" width="411.0" height="34" rx="3"><title>Plan D: Glacier Deep Archive, day 30 to 365</title></rect>
<text class="tGDA" x="433.5" y="245" text-anchor="middle">Glacier Deep Archive</text>
<line class="exp" x1="640.0" x2="640.0" y1="66" y2="264"/>
<text class="expt" x="636.0" y="62" text-anchor="end">Deleted on day 365</text>
<line class="axis" x1="190" x2="640" y1="264" y2="264"/>
<line class="axis" x1="190.0" x2="190.0" y1="264" y2="269"/>
<text class="tick" x="190.0" y="284" text-anchor="middle">0</text>
<line class="axis" x1="227.0" x2="227.0" y1="264" y2="269"/>
<text class="tick" x="227.0" y="284" text-anchor="middle">30</text>
<line class="axis" x1="301.0" x2="301.0" y1="264" y2="269"/>
<text class="tick" x="301.0" y="284" text-anchor="middle">90</text>
<line class="axis" x1="411.9" x2="411.9" y1="264" y2="269"/>
<text class="tick" x="411.9" y="284" text-anchor="middle">180</text>
<line class="axis" x1="640.0" x2="640.0" y1="264" y2="269"/>
<text class="tick" x="640.0" y="284" text-anchor="middle">365</text>
<text class="tick" x="190" y="302">Age of the backups, in days</text>
<text class="note" x="16" y="328">Std = S3 Standard; IA = S3 Standard-IA. Colder classes cost less to store but more, and longer, to read back.</text>
</svg>
