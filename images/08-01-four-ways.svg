<svg xmlns="http://www.w3.org/2000/svg" width="770" height="395" viewBox="0 0 770 395" role="img" aria-labelledby="t d">
<title id="t">The four ways into AWS compared</title>
<desc id="d">Four columns, the AWS Management Console, the AWS CLI, the AWS SDKs and infrastructure as code, compared on four rows. How you work: clicking through pages in a web browser; typing commands and saving them as a script; calls written inside your program's code; a template file that describes the end state. Best for: seeing what exists, learning, and tasks done once; quick or bulk tasks from a terminal such as CloudShell; applications that use AWS while they run; building, changing and copying whole setups. Repeatable, highlighted: no, the steps live in someone's memory; yes if saved as a script, which repeats steps, not the end state; yes, the program makes the same calls every time it runs; yes, the same file builds the same setup anywhere. Exam clue words: visual, browser, one-time; command line, terminal, script; application code, programming language; template, repeatable, identical environments. Notes: on AWS the infrastructure as code service is AWS CloudFormation; AWS CloudShell is a place to run the CLI.</desc>

