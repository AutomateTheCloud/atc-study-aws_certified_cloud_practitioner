<svg xmlns="http://www.w3.org/2000/svg" width="680" height="558" viewBox="0 0 680 558" role="img" aria-labelledby="t d">
<title id="t">The blast-radius ladder: how far a failure reaches, and what protects against it</title>
<desc id="d">Four rungs, from the largest failure at the top to the smallest at the bottom; each box is wider the further the failure reaches. A whole Region: a disaster or a large outage makes the Region unusable; protection is a copy of the site, or at least of its data, in another Region; this is disaster recovery. One Availability Zone: a flood or fire takes out every data center in the AZ; protection is servers and the database running in two or more AZs; high availability. One data center: a power or cooling failure in one building; the same protection, more than one AZ, because an AZ may be just one data center; high availability. One server: a disk fails or the server crashes; protection is a second server and automatic replacement; high availability. A separate dashed box, off the ladder: a mistake or an attack on the data itself, such as a deleted orders table, reaches every live copy at once; only a point-in-time backup from before the mistake undoes it.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ha-fill:#d9e8fb; --dr-fill:#fbe1d6; --bk-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ha-fill:#1b3554; --dr-fill:#4d2716; --bk-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .ha { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .dr { fill: var(--dr-fill); stroke: var(--s2); stroke-width: 1.5; }
  .bk { fill: var(--bk-fill); stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .step { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .tag { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .span-rpo { stroke: var(--s2); stroke-width: 3; fill: none; stroke-linecap: round; }
  .span-rto { stroke: var(--s1); stroke-width: 3; fill: none; stroke-linecap: round; }
  .ev { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .evline { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
</style>
<rect width="680" height="558" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How far a failure reaches, and what keeps the site running</text>
<text class="sub" x="16" y="48">Each rung is a bigger failure. Protection on a lower rung doesn't cover the rungs above it.</text>
<text class="head" x="28" y="74">What fails</text>
<text class="head" x="222" y="74">What keeps the bakery's site running</text>
<rect class="dr" x="16.0" y="86" width="648.0" height="91" rx="6"/>
<text class="cellt" x="28.0" y="105">A whole Region</text>
<text class="cells" x="28.0" y="122.0">A disaster or a large</text>
<text class="cells" x="28.0" y="137.0">outage makes the Region</text>
<text class="cells" x="28.0" y="152.0">unusable</text>
<text class="small" x="222.0" y="105.0">A copy of the site, or at least of its</text>
<text class="small" x="222.0" y="120.0">data, in another Region</text>
<text class="tag" x="222.0" y="167">Disaster recovery</text>
<rect class="ha" x="36.0" y="185" width="608.0" height="76" rx="6"/>
<text class="cellt" x="48.0" y="204">One Availability Zone</text>
<text class="cells" x="48.0" y="221.0">A flood or a fire takes out</text>
<text class="cells" x="48.0" y="236.0">every data center in the AZ</text>
<text class="small" x="242.0" y="204.0">Servers and the database running in two</text>
<text class="small" x="242.0" y="219.0">or more AZs</text>
<text class="tag" x="242.0" y="251">High availability</text>
<rect class="ha" x="56.0" y="269" width="568.0" height="76" rx="6"/>
<text class="cellt" x="68.0" y="288">One data center</text>
<text class="cells" x="68.0" y="305.0">A power or cooling failure</text>
<text class="cells" x="68.0" y="320.0">in one building</text>
<text class="small" x="262.0" y="288.0">The same answer: more than one AZ (an AZ</text>
<text class="small" x="262.0" y="303.0">may be just one data center)</text>
<text class="tag" x="262.0" y="335">High availability</text>
<rect class="ha" x="76.0" y="353" width="528.0" height="76" rx="6"/>
<text class="cellt" x="88.0" y="372">One server</text>
<text class="cells" x="88.0" y="389.0">A disk fails or the server</text>
<text class="cells" x="88.0" y="404.0">crashes</text>
<text class="small" x="282.0" y="372.0">A second server, and automatic</text>
<text class="small" x="282.0" y="387.0">replacement of the failed one</text>
<text class="tag" x="282.0" y="419">High availability</text>
<rect class="bk" x="16" y="445" width="648" height="77" rx="6"/>
<text class="cellt" x="28" y="464">Off the ladder: the data</text>
<text class="cells" x="28" y="481.0">A mistake or an attack on the data itself, such as a</text>
<text class="cells" x="28" y="496.0">deleted orders table, isn't on the ladder: it</text>
<text class="cells" x="28" y="511.0">reaches every live copy at once.</text>
<text class="small" x="416" y="464.0">A point-in-time backup from before</text>
<text class="small" x="416" y="479.0">the mistake. Only a backup undoes</text>
<text class="small" x="416" y="494.0">it.</text>
<text class="note" x="16" y="544">Our summary of AWS's disaster recovery whitepaper (2021) and Regions and AZs pages, checked 2026-10-24.</text>
</svg>
