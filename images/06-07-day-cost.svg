<svg xmlns="http://www.w3.org/2000/svg" width="680" height="244" viewBox="0 0 680 244" role="img" aria-labelledby="t d">
<title id="t">One day's web-tier cost: a fixed fleet of six against Auto Scaling</title>
<desc id="d">Horizontal stacked bars, prices as of 2026-10-24. Fixed fleet of 6 instances, 144 instance-hours: $3.00 of instances plus $0.54 of load balancer hours, $3.54. Auto Scaling, 76 instance-hours: $1.58 plus $0.54, $2.12. Load balancer capacity units and data transfer are left out.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-dash { stroke: var(--ink2); stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
</style>
<rect width="680" height="244" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">One December Saturday: what the web tier costs</text>
<text class="sub" x="16" y="48">t3.small at $0.0208 an hour, ALB at $0.0225 an hour; US East (N. Virginia), as of 2026-10-24</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Instances</text>
<rect class="s2" x="120" y="66" width="12" height="12" rx="2"/>
<text x="138" y="76">Load balancer hours (same in both)</text>
<text class="lab" x="16" y="114">Fixed fleet: 6 instances, 144 instance-hours</text>
<rect class="s1" x="16" y="122" width="310.8" height="20"><title>Fixed fleet: 6 instances, 144 instance-hours: instances $3.00</title></rect>
<path class="s2" d="M328.8,122.0 L381.2,122.0 Q385.2,122.0 385.2,126.0 L385.2,138.0 Q385.2,142.0 381.2,142.0 L328.8,142.0 Z"><title>Load balancer: $0.54</title></path>
<text class="lab" x="393.2" y="137">$3.54 ($3.00 + $0.54)</text>
<text class="lab" x="16" y="174">Auto Scaling: 76 instance-hours</text>
<rect class="s1" x="16" y="182" width="163.1" height="20"><title>Auto Scaling: 76 instance-hours: instances $1.58</title></rect>
<path class="s2" d="M181.1,182.0 L233.5,182.0 Q237.5,182.0 237.5,186.0 L237.5,198.0 Q237.5,202.0 233.5,202.0 L181.1,202.0 Z"><title>Load balancer: $0.54</title></path>
<text class="lab" x="245.5" y="197">$2.12 ($1.58 + $0.54)</text>
<line class="axis" x1="16" x2="16" y1="118" y2="220"/>
</svg>
