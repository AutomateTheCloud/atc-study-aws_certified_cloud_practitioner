<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" aria-labelledby="t d">
<title id="t">Athena, Redshift, EMR or Glue: who does what</title>
<desc id="d">Four columns compared on three rows. Main job, highlighted: Amazon Athena runs SQL on files where they sit; Amazon Redshift is a data warehouse that stores data for analysis and runs SQL on it; Amazon EMR runs Spark, Hadoop and similar frameworks; AWS Glue catalogs and prepares data (ETL) and is not for asking questions. Where the data is: Athena, in S3, left unchanged; Redshift, loaded into Redshift; EMR, usually S3, read by your code; Glue, wherever it connects, and its catalog describes it. Choose it when: Athena, ad hoc questions about files in S3; Redshift, regular complex reports over years of data from many sources; EMR, custom big-data code with full control; Glue, to make data findable and clean before others query it.</desc>

