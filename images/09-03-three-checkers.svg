<svg xmlns="http://www.w3.org/2000/svg" width="680" height="431" viewBox="0 0 680 431" role="img" aria-labelledby="t d">
<title id="t">Trusted Advisor, Security Hub CSPM and Amazon Inspector compared</title>
<desc id="d">A grid with three columns and four rows. Looks at: Trusted Advisor, your account and its resources; Security Hub CSPM, your resources' settings; Amazon Inspector, the software inside EC2 instances, Lambda functions and container images, and network paths to them. Compares with, highlighted: Trusted Advisor, AWS's own best practices in six categories; Security Hub CSPM, named standards such as AWS Foundational Security Best Practices, CIS, PCI DSS and NIST; Inspector, published vulnerabilities (CVEs) and open network paths. Example finding: Trusted Advisor, the root user has no MFA; Security Hub CSPM, EBS volumes aren't encrypted by default, so a control fails; Inspector, a package on the web server has a critical CVE. Who gets it: Trusted Advisor, all plans get a few security checks and paid Support plans get all checks; Security Hub CSPM, anyone who turns it on, though its console was blocked on a new Free plan account when we checked on 2026-10-23; Inspector, anyone who turns it on, and its free trial needs the Paid plan.</desc>

