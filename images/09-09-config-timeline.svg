<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" aria-labelledby="t d">
<title id="t">A week of web-sg's history: CloudTrail requests, Config configuration items and restricted-ssh compliance</title>
<desc id="d">A timeline from Monday, October 12, to Sunday, October 18, with three lanes. CloudTrail lane: on Wednesday at 14:05, sam-dev, AuthorizeSecurityGroupIngress; on Friday at 10:40, lee-ops, RevokeSecurityGroupIngress. Config lane: item 1, port 443, until Wednesday 14:06; item 2, ports 443 and 22, until Friday 10:41; item 3, port 443, after that. Rule lane, restricted-ssh: compliant until Wednesday 14:07, then a hatched, thickly outlined stretch labeled noncompliant for about 44.5 hours until Friday 10:42, then compliant, with a periodic check marked on Saturday at 03:00. A note says each request comes one minute before the configuration item it caused, and the rule ran one minute after that.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ok-fill:#f1f0ec; --bad-fill:#fbe1d6; --item:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ok-fill:#252523; --bad-fill:#4d2716; --item:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .okb { fill: var(--ok-fill); stroke: var(--muted); stroke-width: 1; }
  .badb { fill: url(#hatch); stroke: var(--ink); stroke-width: 2.5; }
  .item { fill: var(--item); stroke: var(--s1); stroke-width: 1.2; }
  .lane { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .lab2 { fill: var(--ink); font-size: 12px; }
  .lab2b { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .small { fill: var(--ink2); font-size: 11.5px; }
  .mark { fill: var(--ink); }
  .note { fill: var(--muted); font-size: 11.5px; }
  .hatchbg { fill: var(--bad-fill); }
  .hatchln { stroke: var(--s2); stroke-width: 1.5; }
</style>
<rect width="680" height="392" fill="var(--surface)" style="fill:var(--surface)"/>
<defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="hatchbg" width="8" height="8"/><line class="hatchln" x1="0" y1="0" x2="0" y2="8"/></pattern></defs>
<text class="title" x="16" y="28">A week in the life of web-sg</text>
<text class="sub" x="16" y="48">Times in UTC. The week, the people and the times are made up.</text>
<line class="grid" x1="150.0" x2="150.0" y1="70" y2="330"/>
<text class="tick" x="186.4" y="348" text-anchor="middle">Mon 12</text>
<line class="grid" x1="222.9" x2="222.9" y1="70" y2="330"/>
<text class="tick" x="259.3" y="348" text-anchor="middle">Tue 13</text>
<line class="grid" x1="295.7" x2="295.7" y1="70" y2="330"/>
<text class="tick" x="332.1" y="348" text-anchor="middle">Wed 14</text>
<line class="grid" x1="368.6" x2="368.6" y1="70" y2="330"/>
<text class="tick" x="405.0" y="348" text-anchor="middle">Thu 15</text>
<line class="grid" x1="441.4" x2="441.4" y1="70" y2="330"/>
<text class="tick" x="477.9" y="348" text-anchor="middle">Fri 16</text>
<line class="grid" x1="514.3" x2="514.3" y1="70" y2="330"/>
<text class="tick" x="550.7" y="348" text-anchor="middle">Sat 17</text>
<line class="grid" x1="587.1" x2="587.1" y1="70" y2="330"/>
<text class="tick" x="623.6" y="348" text-anchor="middle">Sun 18</text>
<line class="grid" x1="660.0" x2="660.0" y1="70" y2="330"/>
<line class="axis" x1="150" x2="660.0" y1="330" y2="330"/>
<text class="lane" x="16" y="104.0">CloudTrail:</text>
<text class="lane" x="16" y="120.0">requests</text>
<path class="mark" d="M338.5,103 L345.5,110 L338.5,117 L331.5,110 Z"/>
<text class="lab2b" x="338.5" y="96" text-anchor="end">sam-dev</text>
<text class="small" x="346.5" y="132" text-anchor="end">AuthorizeSecurityGroupIngress</text>
<path class="mark" d="M473.8,103 L480.8,110 L473.8,117 L466.8,110 Z"/>
<text class="lab2b" x="473.8" y="96" text-anchor="start">lee-ops</text>
<text class="small" x="465.8" y="132" text-anchor="start">RevokeSecurityGroupIngress</text>
<text class="lane" x="16" y="184.0">Config:</text>
<text class="lane" x="16" y="200.0">configuration items</text>
<rect class="item" x="151.0" y="176" width="186.5" height="28" rx="4"/>
<text class="lab2" x="244.3" y="194" text-anchor="middle">Item 1: port 443</text>
<rect class="item" x="339.5" y="176" width="133.3" height="28" rx="4"/>
<text class="lab2" x="406.2" y="194" text-anchor="middle">Item 2: 443 and 22</text>
<rect class="item" x="474.9" y="176" width="184.1" height="28" rx="4"/>
<text class="lab2" x="566.9" y="194" text-anchor="middle">Item 3: port 443</text>
<text class="lane" x="16" y="264.0">Config rule:</text>
<text class="lane" x="16" y="280.0">restricted-ssh</text>
<rect class="okb" x="151" y="256" width="186.6" height="28" rx="4"/>
<text class="lab2" x="244.3" y="274" text-anchor="middle">COMPLIANT</text>
<rect class="badb" x="339.6" y="256" width="133.3" height="28" rx="4"/>
<rect class="okb" x="474.9" y="256" width="184.1" height="28" rx="4"/>
<text class="lab2" x="567.0" y="274" text-anchor="middle">COMPLIANT</text>
<text class="lab2b" x="406.2" y="302" text-anchor="middle">NONCOMPLIANT for about 44.5 hours</text>
<line class="lead" x1="523.4" x2="523.4" y1="248" y2="284"/>
<text class="small" x="527.4" y="246">periodic check</text>
<text class="note" x="16" y="374">Each CloudTrail request comes one minute before the configuration item it caused, and the rule ran one minute after that.</text>
</svg>
