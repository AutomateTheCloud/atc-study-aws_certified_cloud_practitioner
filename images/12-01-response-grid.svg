<svg xmlns="http://www.w3.org/2000/svg" width="700" height="377" viewBox="0 0 700 377" role="img" aria-labelledby="t d">
<title id="t">First-response targets for technical support cases, by severity and plan</title>
<desc id="d">A grid with five severity rows and four plan columns. Basic has a dash in every row: it has no technical cases. Business-critical system down, highlighted: Business Support+ under 30 minutes, Enterprise Support under 15 minutes, Unified Operations under 5 minutes from an Incident Management Engineer. Every other row is the same for the three paid plans: production system down under 1 hour; production system impaired under 4 hours; system impaired under 12 hours; general guidance under 24 hours. A note quotes AWS: it will make every reasonable effort to respond to the initial request within these times. Checked 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; --none-fill:#fbfbf9; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; --none-fill:#1f1f1e; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 2; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .none { fill: var(--none-fill); stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 3; }
  .boxt { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .price { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .tag { fill: var(--ink); font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-ink { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="700" height="377" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">First-response targets by case severity</text>
<text class="sub" x="16" y="48">Technical cases only; checked 2026-10-24. Only the highlighted row differs between the paid plans</text>
<text class="head" x="274.5" y="80" text-anchor="middle">Basic</text>
<text class="head" x="391.5" y="72" text-anchor="middle">Business</text>
<text class="head" x="391.5" y="88" text-anchor="middle">Support+</text>
<text class="head" x="508.5" y="72" text-anchor="middle">Enterprise</text>
<text class="head" x="508.5" y="88" text-anchor="middle">Support</text>
<text class="head" x="625.5" y="72" text-anchor="middle">Unified</text>
<text class="head" x="625.5" y="88" text-anchor="middle">Operations</text>
<text class="head" x="16" y="124.0">Business-critical system down</text>
<rect class="none" x="219.0" y="101" width="111.0" height="36" rx="5"/>
<text class="cells" x="274.5" y="124.0" text-anchor="middle">—</text>
<rect class="hi" x="336.0" y="101" width="111.0" height="36" rx="5"/>
