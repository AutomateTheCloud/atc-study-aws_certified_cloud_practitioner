<text class="cells" x="274.5" y="166.0" text-anchor="middle">—</text>
<rect class="n" x="336.0" y="143" width="111.0" height="36" rx="5"/>
<text class="cells" x="391.5" y="166.0" text-anchor="middle">Under 1 hour</text>
<rect class="n" x="453.0" y="143" width="111.0" height="36" rx="5"/>
<text class="cells" x="508.5" y="166.0" text-anchor="middle">Under 1 hour</text>
<rect class="n" x="570.0" y="143" width="111.0" height="36" rx="5"/>
<text class="cells" x="625.5" y="166.0" text-anchor="middle">Under 1 hour</text>
<text class="head" x="16" y="208.0">Production system impaired</text>
<rect class="none" x="219.0" y="185" width="111.0" height="36" rx="5"/>
<text class="cells" x="274.5" y="208.0" text-anchor="middle">—</text>
<rect class="n" x="336.0" y="185" width="111.0" height="36" rx="5"/>
<text class="cells" x="391.5" y="208.0" text-anchor="middle">Under 4 hours</text>
<rect class="n" x="453.0" y="185" width="111.0" height="36" rx="5"/>
<text class="cells" x="508.5" y="208.0" text-anchor="middle">Under 4 hours</text>
<rect class="n" x="570.0" y="185" width="111.0" height="36" rx="5"/>
<text class="cells" x="625.5" y="208.0" text-anchor="middle">Under 4 hours</text>
<text class="head" x="16" y="250.0">System impaired</text>
<rect class="none" x="219.0" y="227" width="111.0" height="36" rx="5"/>
<text class="cells" x="274.5" y="250.0" text-anchor="middle">—</text>
<rect class="n" x="336.0" y="227" width="111.0" height="36" rx="5"/>
<text class="cells" x="391.5" y="250.0" text-anchor="middle">Under 12 hours</text>
<rect class="n" x="453.0" y="227" width="111.0" height="36" rx="5"/>
<text class="cells" x="508.5" y="250.0" text-anchor="middle">Under 12 hours</text>
<rect class="n" x="570.0" y="227" width="111.0" height="36" rx="5"/>
<text class="cells" x="625.5" y="250.0" text-anchor="middle">Under 12 hours</text>
<text class="head" x="16" y="292.0">General guidance</text>
<rect class="none" x="219.0" y="269" width="111.0" height="36" rx="5"/>
<text class="cells" x="274.5" y="292.0" text-anchor="middle">—</text>
<rect class="n" x="336.0" y="269" width="111.0" height="36" rx="5"/>
<text class="cells" x="391.5" y="292.0" text-anchor="middle">Under 24 hours</text>
<rect class="n" x="453.0" y="269" width="111.0" height="36" rx="5"/>
<text class="cells" x="508.5" y="292.0" text-anchor="middle">Under 24 hours</text>
<rect class="n" x="570.0" y="269" width="111.0" height="36" rx="5"/>
<text class="cells" x="625.5" y="292.0" text-anchor="middle">Under 24 hours</text>
<text class="note" x="16" y="330.0">Basic: no technical cases at all, so no technical response target. Account, billing and quota cases are open</text>
<text class="note" x="16" y="345.0">to every plan. Unified Operations' 5 minutes comes from an Incident Management Engineer.</text>
<text class="note" x="16" y="360.0">AWS: "We will make every reasonable effort to respond to your initial request within the corresponding timeframes."</text>
</svg>
