<circle class="dot-ink" cx="261.1" cy="283.5" r="5"><title>Day 13: forecast passes $150, $54.68 so far</title></circle>
<text class="ctb" x="251.1" y="273.5" text-anchor="end">A</text>
<circle class="dot-ink" cx="443.0" cy="195.9" r="5"><title>Day 25: actual passes $127.50 (85%), $128.88 so far</title></circle>
<text class="ctb" x="433.0" y="185.9" text-anchor="end">B</text>
<circle class="dot-ink" cx="503.7" cy="166.7" r="5"><title>Day 29: actual passes $150 (100%), $153.61 so far</title></circle>
<text class="ctb" x="493.7" y="156.7" text-anchor="end">C</text>
<circle class="dot-s1" cx="534.0" cy="152.1" r="5"/>
<text class="lab" x="544.0" y="156.1">$165.98</text>
<text class="lab" x="544" y="187.0">$150</text>
<text class="note" x="16" y="410.0">A: forecast alert, soon after the instance starts (the day is illustrative). B and C: actual-cost alerts at 85% and 100%.</text>
<text class="note" x="16" y="425.0">Budgets data updates up to three times a day, so each email arrives hours after the line is crossed.</text>
<text class="note" x="16" y="440.0">No alert stops the instance: the line keeps rising to $165.98 until someone terminates it.</text>
</svg>
