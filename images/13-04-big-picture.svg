<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="t d">
<title id="t">Three-year costs of staying on-premises, moving as it is, and moving rightsized and relicensed</title>
<desc id="d">Stacked column chart, made-up figures for teaching. Stay on-premises, $930k: hardware and refresh $240k, facilities $180k, staff $300k, licenses $210k. Move as it is, $1,070k: AWS usage $450k, licenses $260k, staff $210k, one-time migration $150k. Move, rightsized and relicensed, $750k: AWS usage $250k, licenses $140k, staff $210k, one-time migration $150k.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hw:#52514e; --fac:#898781; --staff:#c3c2b7; --s3:#1baf7a; --win:#898781; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hw:#c3c2b7; --fac:#898781; --staff:#52514e; --s3:#199e70; --win:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hw { fill: var(--hw); } .fac { fill: var(--fac); } .staff { fill: var(--staff); }
  .s3 { fill: var(--s3); } .win { fill: var(--win); }
  .gap { stroke: var(--surface); stroke-width: 2; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .valb { fill: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .na { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .hiring { fill: none; stroke: var(--s2); stroke-width: 2.5; }
</style>
