<svg xmlns="http://www.w3.org/2000/svg" width="680" height="567" viewBox="0 0 680 567" role="img" aria-labelledby="t d">
<title id="t">Data Streams, Firehose or SQS: three ways data waits</title>
<desc id="d">Three columns compared on six rows. Kinesis Data Streams: a stream of records, kept in the order they arrive; read by your own programs, and several can read the same records; after it's read, the record stays, so another program can read or replay it; holds data 24 hours by default, up to 365 days; you write or choose the programs that read it; choose it for custom real-time processing, several readers, or replay. Amazon Data Firehose: a delivery service for streaming data; Firehose itself reads it and delivers it to S3, Redshift, OpenSearch Service and others; after delivery nothing is kept for other readers; it holds data only while it buffers, up to 900 seconds; you configure it rather than write code; choose it to land streaming data in a store with no code. Amazon SQS: a queue of messages between parts of an application; each message goes to one worker program at a time; the worker deletes the message when its job is done; holds messages 4 days by default, from 1 minute to 14 days; your programs send and receive messages; choose it to hand work from one part of an application to another. The row about what happens after the data is read is highlighted.</desc>

