<rect width="680" height="567" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Data Streams, Firehose or SQS: three ways data waits</text>
<text class="sub" x="16" y="48">All three accept data from producers; read down a column, across a row to compare</text>
<rect class="n" x="128.0" y="66.0" width="173.3" height="32.0" rx="6"/>
<text class="cellt" x="136.0" y="87">Kinesis Data Streams</text>
<rect class="n" x="309.3" y="66.0" width="173.3" height="32.0" rx="6"/>
<text class="cellt" x="317.33333333333337" y="87">Amazon Data Firehose</text>
<rect class="n" x="490.7" y="66.0" width="173.3" height="32.0" rx="6"/>
<text class="cellt" x="498.6666666666667" y="87">Amazon SQS</text>
<line class="grid" x1="16" x2="664" y1="106" y2="106"/>
<text class="rowl" x="16" y="125.0">What it is</text>
<text class="small" x="136.0" y="125.0">A stream of records,</text>
<text class="small" x="136.0" y="140.0">kept in the order they</text>
<text class="small" x="136.0" y="155.0">arrive</text>
<text class="small" x="317.33333333333337" y="125.0">A delivery service for</text>
<text class="small" x="317.33333333333337" y="140.0">streaming data</text>
<text class="small" x="498.6666666666667" y="125.0">A queue of messages</text>
<text class="small" x="498.6666666666667" y="140.0">between parts of an</text>
<text class="small" x="498.6666666666667" y="155.0">application</text>
<line class="grid" x1="16" x2="664" y1="169" y2="169"/>
<text class="rowl" x="16" y="188.0">Who reads the</text>
<text class="rowl" x="16" y="203.0">data</text>
<text class="small" x="136.0" y="188.0">Your own programs;</text>
<text class="small" x="136.0" y="203.0">several can read the</text>
<text class="small" x="136.0" y="218.0">same records</text>
<text class="small" x="317.33333333333337" y="188.0">Firehose itself: it</text>
<text class="small" x="317.33333333333337" y="203.0">delivers to S3,</text>
<text class="small" x="317.33333333333337" y="218.0">Redshift, OpenSearch</text>
<text class="small" x="317.33333333333337" y="233.0">Service and others</text>
<text class="small" x="498.6666666666667" y="188.0">A worker program; each</text>
<text class="small" x="498.6666666666667" y="203.0">message goes to one</text>
<text class="small" x="498.6666666666667" y="218.0">worker at a time</text>
<rect class="hi" x="125.0" y="249.0" width="179.3" height="59.0" rx="5"/>
<rect class="hi" x="306.3" y="249.0" width="179.3" height="59.0" rx="5"/>
<rect class="hi" x="487.7" y="249.0" width="179.3" height="59.0" rx="5"/>
<line class="grid" x1="16" x2="664" y1="247" y2="247"/>
<text class="rowl" x="16" y="266.0">After it's read</text>
<text class="cellt" x="136.0" y="266.0">Records stay: another</text>
<text class="cellt" x="136.0" y="281.0">program can read them,</text>
<text class="cellt" x="136.0" y="296.0">or replay them</text>
<text class="cellt" x="317.33333333333337" y="266.0">Delivered to the</text>
<text class="cellt" x="317.33333333333337" y="281.0">destination; nothing is</text>
<text class="cellt" x="317.33333333333337" y="296.0">kept for other readers</text>
<text class="cellt" x="498.6666666666667" y="266.0">The worker deletes the</text>
<text class="cellt" x="498.6666666666667" y="281.0">message when its job is</text>
<text class="cellt" x="498.6666666666667" y="296.0">done</text>
<line class="grid" x1="16" x2="664" y1="310" y2="310"/>
<text class="rowl" x="16" y="329.0">How long it</text>
<text class="rowl" x="16" y="344.0">holds data</text>
<text class="small" x="136.0" y="329.0">24 hours by default, up</text>
<text class="small" x="136.0" y="344.0">to 365 days</text>
<text class="small" x="317.33333333333337" y="329.0">Only while it buffers,</text>
<text class="small" x="317.33333333333337" y="344.0">up to 900 seconds, then</text>
<text class="small" x="317.33333333333337" y="359.0">it delivers</text>
<text class="small" x="498.6666666666667" y="329.0">4 days by default; from</text>
<text class="small" x="498.6666666666667" y="344.0">1 minute to 14 days</text>
<line class="grid" x1="16" x2="664" y1="373" y2="373"/>
<text class="rowl" x="16" y="392.0">Do you write</text>
<text class="rowl" x="16" y="407.0">code?</text>
<text class="small" x="136.0" y="392.0">Yes: you write or choose</text>
<text class="small" x="136.0" y="407.0">the programs that read</text>
<text class="small" x="136.0" y="422.0">it</text>
<text class="small" x="317.33333333333337" y="392.0">No: you configure it</text>
<text class="small" x="498.6666666666667" y="392.0">Yes: your programs send</text>
<text class="small" x="498.6666666666667" y="407.0">and receive messages</text>
<line class="grid" x1="16" x2="664" y1="436" y2="436"/>
<text class="rowl" x="16" y="455.0">Choose it when</text>
<text class="small" x="136.0" y="455.0">Custom real-time</text>
<text class="small" x="136.0" y="470.0">processing, several</text>
<text class="small" x="136.0" y="485.0">readers, replay</text>
<text class="small" x="317.33333333333337" y="455.0">Land streaming data in a</text>
<text class="small" x="317.33333333333337" y="470.0">store, with no code</text>
<text class="small" x="498.6666666666667" y="455.0">Hand work from one part</text>
<text class="small" x="498.6666666666667" y="470.0">of an application to</text>
<text class="small" x="498.6666666666667" y="485.0">another</text>
<line class="grid" x1="16" x2="664" y1="499" y2="499"/>
<text class="note" x="16" y="521">Retention periods as of 2026-10-24. From the Kinesis Data Streams, Data Firehose and Amazon SQS</text>
<text class="note" x="16" y="537">documentation and FAQs.</text>
