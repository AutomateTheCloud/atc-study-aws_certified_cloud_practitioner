<svg xmlns="http://www.w3.org/2000/svg" width="680" height="457" viewBox="0 0 680 457" role="img" aria-labelledby="t d">
<title id="t">Cumulative cost of a forgotten weekend, with and without someone acting on the first alert</title>
<desc id="d">A line chart of dollars spent from Friday 18:00 to Monday 08:00. Four m7i.large instances, their disks and a NAT gateway cost about $0.45 an hour. Dotted vertical lines mark billing data refreshes at 06:00 and 18:00 each day. The orange line, nobody acts, rises steadily to $28.01. The blue line, you read the first email at Saturday 08:00 and delete everything, stops rising at $6.32. Marked points: at Saturday 06:00 the zero-spend budget and the billing alarm email, based on data up to Friday 22:00, $1.81; at Saturday 18:00 the $5 budget sends its 85% and 100% alerts, based on data up to Saturday 10:00, $7.23. Made-up timings within AWS's documented ranges.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .refresh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 4; }
  .dot-ink { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .ann { fill: var(--ink); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
