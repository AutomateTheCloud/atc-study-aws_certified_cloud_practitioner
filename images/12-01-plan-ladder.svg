<svg xmlns="http://www.w3.org/2000/svg" width="700" height="524" viewBox="0 0 700 524" role="img" aria-labelledby="t d">
<title id="t">The four current AWS Support plans as rising steps</title>
<desc id="d">Four steps rise from left to right, each adding to the one before it. Basic: free for every account; cases about your account and bill, service quota increase requests, documentation, whitepapers and re:Post, some Trusted Advisor checks and the AWS Health Dashboard, but no technical cases. Business Support+, highlighted as the step where technical help starts: from $29 a month; technical cases 24/7 by phone, web and chat, under 30 minutes for a business-critical system down, all Trusted Advisor checks, the AWS Health API and Support API, and AI help that uses your account's context. Enterprise Support: from $5,000 a month; a designated Technical Account Manager, under 15 minutes for business-critical cases, Well-Architected reviews, Trusted Advisor Priority and Security Incident Response included. Unified Operations: from $50,000 a month; a TAM plus designated domain specialists, under 5 minutes for critical incidents from an Incident Management Engineer, 24/7 workload monitoring and critical workload reviews. Prices are monthly minimums as of 2026-10-24. Response times are targets for a first reply, not guarantees.</desc>

