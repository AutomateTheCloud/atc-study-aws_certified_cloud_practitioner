<svg xmlns="http://www.w3.org/2000/svg" width="680" height="374" viewBox="0 0 680 374" role="img" aria-labelledby="t d">
<title id="t">Four ways to use AI on AWS, from a finished assistant to your own model</title>
<desc id="d">Four cards left to right, with an arrow underneath from less to build, less to run and less control, to more to build and run and more control. A finished assistant: Amazon Q Developer; you ask and it answers and writes code; nothing to build; no ML skills. A ready-made service, highlighted: Comprehend, Textract, Polly, Lex and others; you call an API; AWS trained the model; no ML skills. Models to build on: Amazon Bedrock; foundation models from several companies; you build a generative AI app around one. Your own model: Amazon SageMaker AI; you bring data and ML skills, and build, train and deploy; most work, most control. A note says Amazon Bedrock isn't on the exam's in-scope list, and is shown because Amazon Q is built on it and AWS points some closed services to it.</desc>

