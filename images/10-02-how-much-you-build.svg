<text class="title" x="16" y="28">The further right, the more you build, and the more you control</text>
<text class="sub" x="16" y="48">Four ways to use AI on AWS. Start from the left; move right only when the left can't do the job.</text>
<rect class="aws" x="16" y="68" width="156" height="182" rx="8"/>
<text class="colh" x="26" y="88" style="font-size:10.5px">FINISHED ASSISTANT</text>
<text class="boxt" x="26" y="110.0">Amazon</text>
<text class="boxt" x="26" y="126.0">Q Developer</text>
<text class="cells" x="26" y="148.0">You ask; it answers</text>
<text class="cells" x="26" y="164.0">and writes code</text>
