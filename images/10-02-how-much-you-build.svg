<text class="cells" x="26" y="212.0">No ML skills</text>
<rect class="hi" x="180" y="68" width="156" height="182" rx="8"/>
<text class="colh" x="190" y="88" style="font-size:10.5px">READY-MADE SERVICE</text>
<text class="boxt" x="190" y="110.0">Comprehend, Textract,</text>
<text class="boxt" x="190" y="126.0">Polly, Lex and more</text>
<text class="cells" x="190" y="148.0">You call an API</text>
<text class="cells" x="190" y="164.0">AWS trained the model</text>
<text class="cells" x="190" y="180.0"></text>
<text class="cells" x="190" y="196.0">Nothing to train</text>
<text class="cells" x="190" y="212.0">No ML skills</text>
<rect class="aws" x="344" y="68" width="156" height="182" rx="8"/>
<text class="colh" x="354" y="88" style="font-size:10.5px">MODELS TO BUILD ON</text>
<text class="boxt" x="354" y="110.0">Amazon</text>
<text class="boxt" x="354" y="126.0">Bedrock</text>
<text class="cells" x="354" y="148.0">Foundation models</text>
<text class="cells" x="354" y="164.0">from several companies</text>
<text class="cells" x="354" y="180.0"></text>
<text class="cells" x="354" y="196.0">You build a generative</text>
<text class="cells" x="354" y="212.0">AI app around one</text>
<rect class="aws" x="508" y="68" width="156" height="182" rx="8"/>
<text class="colh" x="518" y="88" style="font-size:10.5px">YOUR OWN MODEL</text>
<text class="boxt" x="518" y="110.0">Amazon</text>
<text class="boxt" x="518" y="126.0">SageMaker AI</text>
<text class="cells" x="518" y="148.0">You bring data and</text>
