<text class="boxt" x="26" y="152">Trusted Advisor</text>
<text class="cells" x="26" y="170.0">Best-practice checks on the</text>
<text class="cells" x="26" y="185.0">account; a few security</text>
<text class="cells" x="26" y="200.0">checks free on Basic</text>
<text class="cells" x="26" y="215.0">Support. Its results stay</text>
