<text class="cells" x="26" y="308.0">unintended network exposure</text>
<text class="cells" x="26" y="323.0">in EC2 instances, Lambda</text>
<text class="cells" x="26" y="338.0">functions and container</text>
<text class="cells" x="26" y="353.0">images</text>
<text class="tag" x="238" y="100">DURING</text>
<text class="q" x="238" y="120">Is someone at it now?</text>
<rect class="n" x="238" y="132" width="196" height="128" rx="6"/>
<text class="boxt" x="248" y="152">Amazon GuardDuty</text>
<text class="cells" x="248" y="170.0">Suspicious activity found</text>
<text class="cells" x="248" y="185.0">in CloudTrail events, VPC</text>
<text class="cells" x="248" y="200.0">Flow Logs and DNS logs:</text>
<text class="cells" x="248" y="215.0">stolen credentials, crypto</text>
<text class="cells" x="248" y="230.0">mining, calls from known</text>
<text class="cells" x="248" y="245.0">bad addresses</text>
<text class="tag" x="460" y="100">AFTER</text>
<text class="q" x="460" y="120">How did it happen?</text>
<rect class="n" x="460" y="132" width="196" height="113" rx="6"/>
<text class="boxt" x="470" y="152">Amazon Detective</text>
<text class="cells" x="470" y="170.0">Starts from a finding and</text>
<text class="cells" x="470" y="185.0">investigates it: what</text>
<text class="cells" x="470" y="200.0">happened, what else was</text>
<text class="cells" x="470" y="215.0">touched, using up to a year</text>
<text class="cells" x="470" y="230.0">of history</text>
<line class="arrow" x1="114.0" y1="370.0" x2="114.0" y2="406.0"/>
<path class="arrowhead" d="M119.0,398.0 L109.0,398.0 L114.0,406.0 Z"/>
<text class="small" x="122.0" y="398">findings</text>
<line class="arrow" x1="336.0" y1="262.0" x2="336.0" y2="406.0"/>
<path class="arrowhead" d="M341.0,398.0 L331.0,398.0 L336.0,406.0 Z"/>
