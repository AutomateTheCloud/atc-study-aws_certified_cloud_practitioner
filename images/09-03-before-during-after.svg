<line class="arrow" x1="436.0" y1="162.0" x2="458.0" y2="162.0"/>
<path class="arrowhead" d="M450.0,157.0 L450.0,167.0 L458.0,162.0 Z"/>
<rect class="hi" x="16" y="408" width="648" height="82" rx="6"/>
<text class="boxt" x="28" y="430">AWS Security Hub: where the findings meet</text>
<text class="cells" x="28" y="448.0">Security Hub CSPM (the original Security Hub) runs its own checks of your settings against standards such</text>
<text class="cells" x="28" y="463.0">as CIS and PCI DSS, collects the other services' findings in one place, and scores you. The newer, unified</text>
<text class="cells" x="28" y="478.0">Security Hub correlates them into exposures: which problems combine into real risk.</text>
<text class="note" x="16" y="512.0">Amazon Macie (lesson 09.02) also sends its findings here: sensitive data in S3. From the AWS documentation for</text>
<text class="note" x="16" y="527.0">each service, checked 2026-10-24. Trusted Advisor's checks depend on your Support plan.</text>
