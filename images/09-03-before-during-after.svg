<svg xmlns="http://www.w3.org/2000/svg" width="680" height="546" viewBox="0 0 680 546" role="img" aria-labelledby="t d">
<title id="t">Which AWS detection service answers which question, before, during and after an attack</title>
<desc id="d">A time line runs left to right in three columns. Before an attack, the question is: is there a hole? Trusted Advisor runs best-practice checks on the account, a few security checks free on Basic Support, and its results stay in its own console. Amazon Inspector finds known software flaws and unintended network exposure in EC2 instances, Lambda functions and container images. During an attack, the question is: is someone at it now? Amazon GuardDuty finds suspicious activity in CloudTrail events, VPC Flow Logs and DNS logs, such as stolen credentials, crypto mining and calls from known bad addresses. After, the question is: how did it happen? Amazon Detective starts from a finding, shown by an arrow from GuardDuty, and investigates it using up to a year of history. Arrows labeled findings lead down from Inspector and GuardDuty to a highlighted band: AWS Security Hub, where the findings meet. Security Hub CSPM, the original Security Hub, runs its own checks of your settings against standards such as CIS and PCI DSS, collects the other services' findings in one place and scores you; the newer unified Security Hub correlates them into exposures. Macie's findings about sensitive data in S3 also arrive there.</desc>

