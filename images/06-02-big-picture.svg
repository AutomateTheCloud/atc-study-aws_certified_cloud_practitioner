<svg xmlns="http://www.w3.org/2000/svg" width="700" height="560" viewBox="0 0 700 560" role="img" aria-labelledby="t d">
<title id="t">A load balancer in front of an Auto Scaling group that spans two Availability Zones</title>
<desc id="d">Customers' browsers send orders over HTTPS to an Application Load Balancer that sits in both Availability Zones of the US East (N. Virginia) Region. The load balancer sends requests to four instances. An Auto Scaling group, minimum 2 and maximum 8, spans both AZs: instance 1 in AZ a and instance 2 in AZ b are the minimum, one per AZ; instances 3 in AZ a and 4 in AZ b are dashed, added when orders rise and removed when they fall. Below, a launch template (AMI plus instance type plus security group) is the recipe the group launches each new instance from. Summary: the load balancer decides which healthy instance gets each request; the Auto Scaling group decides how many instances run, and in which AZs.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --crit:#d03b3b; --crit-fill:#fae3e3; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --crit:#d03b3b; --crit-fill:#3d1d1d; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .boxdash { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .group { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-dasharray: 9 4; }
  .wire { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .flow { stroke: var(--s1); stroke-width: 2; fill: none; }
  .crit { fill: var(--crit-fill); stroke: var(--crit); stroke-width: 1.5; }
  .ci { stroke: var(--crit); stroke-width: 2.5; fill: none; stroke-linecap: round; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .num { fill: var(--surface); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--ink); }
  .dash-ink { stroke: var(--ink); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
  .dash-muted { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 3 3; fill: none; }
</style>
<rect width="700" height="560" fill="var(--surface)" style="fill:var(--surface)"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--ink2)"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:var(--s1)"/></marker></defs>
<text class="title" x="16" y="28">Auto Scaling decides how many; the load balancer decides which</text>
<text class="sub" x="16" y="48">The bakery's order site in two Availability Zones (made-up sizes)</text>
<rect class="box" x="260" y="64" width="180" height="32" rx="6"/>
<text class="cellt" x="350" y="85" text-anchor="middle">Customers' browsers</text>
<line class="flow" x1="350" y1="96" x2="350" y2="146" marker-end="url(#ab)"/>
<text class="small" x="360" y="124">orders, over HTTPS</text>
<rect class="zone" x="16" y="112" width="668" height="372" rx="10"/>
<text class="small" x="28" y="130">Region: US East (N. Virginia)</text>
<rect class="hi" x="110" y="148" width="480" height="40" rx="6"/>
<text class="cellt" x="350" y="173" text-anchor="middle">Application Load Balancer, in both AZs</text>
<rect class="zone" x="96" y="200" width="240" height="196" rx="8"/>
<text class="small" x="108" y="218">Availability Zone a</text>
<rect class="zone" x="364" y="200" width="240" height="196" rx="8"/>
<text class="small" x="376" y="218">Availability Zone b</text>
<rect class="group" x="110" y="230" width="480" height="150" rx="8"/>
<text class="cellt" x="124" y="250">Auto Scaling group: minimum 2, maximum 8</text>
<rect class="box" x="140" y="290" width="84" height="34" rx="5"/>
<text class="small" x="182.0" y="311" text-anchor="middle">Instance 1</text>
<line class="flow" x1="257.6" y1="188" x2="182" y2="288" marker-end="url(#ab)"/>
<rect class="boxdash" x="240" y="290" width="84" height="34" rx="5"/>
<text class="small" x="282.0" y="311" text-anchor="middle">Instance 3</text>
<line class="flow" x1="312.6" y1="188" x2="282" y2="288" marker-end="url(#ab)"/>
<rect class="box" x="408" y="290" width="84" height="34" rx="5"/>
<text class="small" x="450.0" y="311" text-anchor="middle">Instance 2</text>
<line class="flow" x1="405.0" y1="188" x2="450" y2="288" marker-end="url(#ab)"/>
<rect class="boxdash" x="508" y="290" width="84" height="34" rx="5"/>
<text class="small" x="550.0" y="311" text-anchor="middle">Instance 4</text>
<line class="flow" x1="460.0" y1="188" x2="550" y2="288" marker-end="url(#ab)"/>
<text class="note" x="124" y="344.0">Solid: the minimum, one per AZ.</text>
<text class="note" x="124" y="358.0">Dashed: added when orders rise,</text>
<text class="note" x="124" y="372.0">removed when they fall.</text>
<rect class="panel" x="110" y="424" width="480" height="44" rx="6"/>
<text class="cellt" x="350" y="443" text-anchor="middle">Launch template</text>
<text class="small" x="350" y="460" text-anchor="middle">AMI + instance type + security group: the recipe for each new instance</text>
<line class="wire" x1="350" y1="424" x2="350" y2="382" marker-end="url(#ah)"/>
<text class="small" x="358" y="408">launches from</text>
<text class="lab" x="16" y="506.0">Load balancer: which healthy instance gets each request.</text>
<text class="lab" x="16" y="525.0">Auto Scaling group: how many instances run, and in which AZs.</text>
</svg>
