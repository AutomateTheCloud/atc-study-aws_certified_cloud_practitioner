<svg xmlns="http://www.w3.org/2000/svg" width="680" height="432" viewBox="0 0 680 432" role="img" aria-labelledby="t d">
<title id="t">January's daily cost: a flat base, then a new r7g.large instance from 11 January</title>
<desc id="d">Stacked column chart of 31 days of January. Every day has about $3.61 of 'everything else', made up to match the $112 lesson 11.01 expected for the month. From 11 January each column adds $2.57 for one r7g.large instance, at $0.1071 an hour in US East (N. Virginia) as of 2026-10-24. A marker on about 12 January (illustrative) shows when Cost Anomaly Detection would alert.</desc>

