<svg xmlns="http://www.w3.org/2000/svg" width="680" height="614" viewBox="0 0 680 614" role="img" aria-labelledby="t d">
<title id="t">An analytics pipeline in five verbs, with the AWS services for each</title>
<desc id="d">Top to bottom. Step 1, ingest: Amazon Kinesis Data Streams, which holds a stream of records for your own programs, and Amazon Data Firehose, which delivers a stream to a store with no code. Records flow down, seconds after they happen, and land in Amazon S3, the data lake, as files such as CSV, JSON or Parquet. Files flow down to step 2, catalog, highlighted: AWS Glue, whose Data Catalog holds a table definition for each set of files, with crawlers to find them and ETL jobs to clean them. Tables flow down to step 3, query: Amazon Athena, SQL on files in S3 with no servers; Amazon Redshift, a data warehouse for big reports; Amazon EMR, Spark and Hadoop clusters. Query results flow down to step 5, visualize: Amazon Quick Sight, dashboards and charts for people in the business. A side branch runs from Firehose to step 4, search: Amazon OpenSearch Service, which finds words and patterns in text and logs and has its own dashboards; the arrow is labeled log records, for searching. A note says real pipelines skip or repeat steps, Redshift can load data itself, and Quick Sight can read from Redshift or OpenSearch Service.</desc>

