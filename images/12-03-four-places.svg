<svg xmlns="http://www.w3.org/2000/svg" width="720" height="508" viewBox="0 0 720 508" role="img" aria-labelledby="t d">
<title id="t">AWS re:Post, the Knowledge Center, Prescriptive Guidance and Support Center compared</title>
<desc id="d">Four columns compared on four rows. Who answers: re:Post questions, anyone, including community members, AWS staff and recognized experts; Knowledge Center, AWS, as official articles and videos; Prescriptive Guidance, AWS experts, as guides and patterns; Support Center, AWS Support staff in a case only you and AWS see. Sees your account, highlighted: re:Post, no, it is a public site, so describe the problem and never post keys or secrets; Knowledge Center, no, the same article for every customer; Prescriptive Guidance, no, written for many organizations; Support Center, yes, the case is opened from your account and is about your account. Best for: re:Post, an unusual problem nobody has written up; Knowledge Center, a common problem fixed step by step; Prescriptive Guidance, planning a change or building a tested design; Support Center, billing and account questions, and technical cases on a paid plan. Cost: re:Post is free with every plan and paid plans get prioritized responses; Knowledge Center is free, as part of re:Post; Prescriptive Guidance is free to read; Support Center account and billing cases come with every plan, technical cases need a paid plan.</desc>

