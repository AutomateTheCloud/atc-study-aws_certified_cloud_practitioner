<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="t d">
<title id="t">What Rekognition, Textract and Comprehend each return for the same receipt photo</title>
<desc id="d">At the top, a made-up photo of a supplier receipt: Mill and Co., 2026-10-02, flour 25 kg $41.00, butter 10 kg $43.20, total $84.20. Arrows lead to three panels. Amazon Rekognition sees a picture: labels such as paper and text, with a confidence score, and words it spots in the image as loose lines; verdict: no vendor, total or line items. Amazon Textract, highlighted, reads a document: vendor Mill and Co., date 2026-10-02, total $84.20, and line items flour and butter with prices; verdict: fits the request. Amazon Comprehend needs text, not a photo; given Textract's text, it finds entities such as an organization, a date, a quantity and any personal data; verdict: a second step, not the first. The outputs are illustrations, not real API responses.</desc>

<style>
