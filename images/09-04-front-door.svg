<svg xmlns="http://www.w3.org/2000/svg" width="680" height="543" viewBox="0 0 680 543" role="img" aria-labelledby="t d">
<title id="t">The layers of protection between the internet and the bakery's web servers</title>
<desc id="d">Left: the internet, with customers, bots and attackers. Middle: a zone labeled AWS edge locations, holding Route 53, which answers DNS for bakery.example, and CloudFront, which serves pages and photos, with an AWS WAF web ACL attached that checks each web request (layer 2, highlighted). Right: a zone labeled US East (N. Virginia), the bakery's VPC, holding an Application Load Balancer, with a second WAF web ACL marked for use if traffic doesn't come through CloudFront (layer 2, highlighted), and a dashed ring for the network ACL and security group (layer 3) around the web servers, EC2 instances in an Auto Scaling group across two Availability Zones. Arrows: from the internet to Route 53 for the address and to CloudFront; from CloudFront to the load balancer; from the load balancer to the web servers. A band underneath the edge and Region zones: layer 1, AWS Shield Standard, on for everyone at no charge, absorbing common network floods at the edge and in the Region. A band across the top: layer 4, AWS Firewall Manager, applying the same WAF rules, Shield Advanced and security group policies to every account in an organization. Key: 1, Shield, network and transport floods such as SYN floods and UDP reflection; 2, WAF, bad web requests such as SQL injection, cross-site scripting, request floods and blocked addresses or countries; 3, network ACL and security group, only the ports and addresses you allow; 4, Firewall Manager, the same protections in every account, including new ones.</desc>

