<svg xmlns="http://www.w3.org/2000/svg" width="680" height="492" viewBox="0 0 680 492" role="img" aria-labelledby="t d">
<title id="t">An SNS email subscription compared with Amazon SES</title>
<desc id="d">Two columns compared on six rows. Who receives it: SNS, addresses subscribed to a topic, each owner clicks a confirmation link first; SES, any recipient once the account leaves the sandbox, and before that only verified addresses. Who it's from: SNS, an SNS no-reply address, with only a display name set per topic; SES, your own verified address or domain. What it looks like: SNS, plain text of the message, the email body can't be customized; SES, whatever you design, such as an HTML receipt with the bakery's logo. Before the first send: SNS, create a topic, subscribe the address and wait for the confirmation; SES, verify your domain and ask for production access, because new accounts start in the sandbox, per Region. Meant for: SNS, internal alerts to people who asked for them, not marketing; SES, transactional and marketing email to customers. At the bakery: SNS sends orders are failing to the owner; SES sends your order 1043 is confirmed to each customer. A note gives the SES sandbox limits as of 2026-10-24: verified recipients only, at most 200 messages in 24 hours and 1 a second.</desc>

