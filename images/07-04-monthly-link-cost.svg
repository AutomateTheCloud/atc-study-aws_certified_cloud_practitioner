<svg xmlns="http://www.w3.org/2000/svg" width="680" height="345" viewBox="0 0 680 345" role="img" aria-labelledby="t d">
<title id="t">Monthly cost of connection options before any data moves, US East (N. Virginia)</title>
<desc id="d">Horizontal bar chart of US dollars for a 730-hour month, before any data moves. VPC peering connection: $0, no hourly charge; you pay for data moved. Interface endpoint in one Availability Zone: $7.30, plus $0.01 per GB processed. Site-to-Site VPN connection: $36.50, plus data transfer out and public IPv4 addresses on its tunnel endpoints. Transit Gateway attachment: $36.50, plus $0.02 per GB processed. Client VPN with one subnet associated: $73.00, plus $0.05 an hour per connected user. Direct Connect is not shown; it charges per port-hour by port speed and type, plus data transfer out. From the AmazonVPC price list published 2026-10-16, as of 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --link-fill:#fbe1d6; --prem-fill:#f1f0ec; --net-fill:#ecebe6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --link-fill:#4d2716; --prem-fill:#252523; --net-fill:#262624; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .link { fill: var(--link-fill); stroke: var(--s2); stroke-width: 1.5; }
  .prem { fill: var(--prem-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .net { fill: var(--net-fill); stroke: var(--axis); stroke-width: 1; }
  .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .cellhi { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .cell { fill: var(--prem-fill); stroke: var(--axis); stroke-width: 1; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrlab { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrsub { fill: var(--ink2); font-size: 11px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .flow { stroke: var(--ink); stroke-width: 2; fill: none; }
  .flowp { stroke: var(--s1); stroke-width: 3; fill: none; }
  .flowt { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 8 4; }
  .mesh { stroke: var(--ink2); stroke-width: 1.5; }
  .node { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .hub { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .zero { stroke: var(--s1); stroke-width: 2; }
  .other { fill: var(--muted); }
  .head-ink { fill: var(--ink); }
</style>
<rect width="680" height="345" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">What each link costs a month just for being there</text>
<text class="sub" x="16" y="48">US dollars for a 730-hour month in US East (N. Virginia), before any data moves</text>
<text class="lab" x="204" y="102" text-anchor="end">VPC peering connection</text>
<line class="zero" x1="216" x2="216" y1="88" y2="108"/>
<text class="val" x="226" y="103">$0 — no hourly charge; you pay for data moved</text>
<text class="lab" x="204" y="140" text-anchor="end">Interface endpoint, 1 AZ</text>
<path class="s1" d="M216.0,126.0 L229.3,126.0 Q233.3,126.0 233.3,130.0 L233.3,142.0 Q233.3,146.0 229.3,146.0 L216.0,146.0 Z"><title>Interface endpoint, 1 AZ: $0.01 an hour, about $7.30 a month</title></path>
<text class="val" x="241.3" y="141">$7.30 + $0.01 per GB processed</text>
<text class="lab" x="204" y="178" text-anchor="end">Site-to-Site VPN connection</text>
<path class="s1" d="M216.0,164.0 L298.7,164.0 Q302.7,164.0 302.7,168.0 L302.7,180.0 Q302.7,184.0 298.7,184.0 L216.0,184.0 Z"><title>Site-to-Site VPN connection: $0.05 an hour, about $36.50 a month</title></path>
<text class="val" x="310.7" y="179">$36.50 + data out, tunnel IPv4 addresses</text>
<text class="lab" x="204" y="216" text-anchor="end">Transit Gateway attachment</text>
<path class="s1" d="M216.0,202.0 L298.7,202.0 Q302.7,202.0 302.7,206.0 L302.7,218.0 Q302.7,222.0 298.7,222.0 L216.0,222.0 Z"><title>Transit Gateway attachment: $0.05 an hour, about $36.50 a month</title></path>
<text class="val" x="310.7" y="217">$36.50 + $0.02 per GB processed</text>
<text class="lab" x="204" y="254" text-anchor="end">Client VPN, 1 subnet</text>
<path class="s1" d="M216.0,240.0 L385.4,240.0 Q389.4,240.0 389.4,244.0 L389.4,256.0 Q389.4,260.0 385.4,260.0 L216.0,260.0 Z"><title>Client VPN, 1 subnet: $0.10 an hour, about $73.00 a month</title></path>
<text class="val" x="397.4" y="255">$73.00 + $0.05 an hour per connected user</text>
<line class="axis" x1="216" x2="216" y1="84" y2="266"/>
<text class="small" x="16" y="288.0">Hourly rate × 730 hours (our arithmetic). Direct Connect isn't shown: it charges per port-hour, set by the</text>
<text class="small" x="16" y="305.0">port's speed and type, plus data transfer out; see its pricing page.</text>
<text class="note" x="16" y="326.0">From the AmazonVPC price list published 2026-10-16, as of 2026-10-24. Prices change; check AWS Pricing Calculator.</text>
</svg>
