<svg xmlns="http://www.w3.org/2000/svg" width="680" height="358" viewBox="0 0 680 358" role="img" aria-labelledby="t d">
<title id="t">How long four kinds of credential keep working</title>
<desc id="d">Horizontal bars on an axis from 0 to 24 hours. Access key on an IAM user: long-term; no end: works until someone deletes it; IAM user password, default policy: long-term; no end: the default never expires it; aws login on your computer: temporary; renewed every 15 minutes, for up to 12 hours; CloudShell session: temporary; about 12 hours at most; ends after 20 to 30 idle minutes. The two long-term bars run past the right edge with an arrow; the two temporary bars stop at 12 hours.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: none; stroke: var(--axis); stroke-width: 1; }
  .hl { fill: none; stroke: var(--s1); stroke-width: 2; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrow-s2 { fill: var(--s2); }
</style>
<rect width="680" height="358" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How long a credential keeps working, once issued</text>
<text class="sub" x="16" y="48">Hours, over one day. Long-term credentials run off the end of the chart.</text>
<rect class="s2" x="16" y="64" width="12" height="12" rx="2"/>
<text x="34" y="74">Long-term</text>
<rect class="s1" x="112" y="64" width="12" height="12" rx="2"/>
<text x="130" y="74">Temporary</text>
<line class="axis" x1="236.0" x2="236.0" y1="92" y2="324"/>
<text class="tick" x="236.0" y="342" text-anchor="middle">0 h</text>
<line class="grid" x1="327.0" x2="327.0" y1="92" y2="324"/>
<text class="tick" x="327.0" y="342" text-anchor="middle">6 h</text>
<line class="grid" x1="418.0" x2="418.0" y1="92" y2="324"/>
<text class="tick" x="418.0" y="342" text-anchor="middle">12 h</text>
<line class="grid" x1="509.0" x2="509.0" y1="92" y2="324"/>
<text class="tick" x="509.0" y="342" text-anchor="middle">18 h</text>
<line class="grid" x1="600.0" x2="600.0" y1="92" y2="324"/>
<text class="tick" x="600.0" y="342" text-anchor="middle">24 h</text>
<text class="lab" x="226" y="115" text-anchor="end">Access key on an IAM user</text>
<path class="s2" d="M236.0,102.0 L618.0,102.0 Q618.0,102.0 618.0,102.0 L618.0,120.0 Q618.0,120.0 618.0,120.0 L236.0,120.0 Z"/>
<path class="arrow-s2" d="M618.0,98 L632.0,111.0 L618.0,124 Z"/>
<text class="small" x="236" y="136">No end: works until someone deletes it</text>
<text class="lab" x="226" y="173" text-anchor="end">IAM user password, default policy</text>
<path class="s2" d="M236.0,160.0 L618.0,160.0 Q618.0,160.0 618.0,160.0 L618.0,178.0 Q618.0,178.0 618.0,178.0 L236.0,178.0 Z"/>
<path class="arrow-s2" d="M618.0,156 L632.0,169.0 L618.0,182 Z"/>
<text class="small" x="236" y="194">No end: the default never expires it</text>
<text class="lab" x="226" y="231" text-anchor="end">aws login on your computer</text>
<path class="s1" d="M236.0,218.0 L414.0,218.0 Q418.0,218.0 418.0,222.0 L418.0,232.0 Q418.0,236.0 414.0,236.0 L236.0,236.0 Z"/>
<text class="small" x="236" y="252">Renewed every 15 minutes, for up to 12 hours</text>
<text class="lab" x="226" y="289" text-anchor="end">CloudShell session</text>
<path class="s1" d="M236.0,276.0 L414.0,276.0 Q418.0,276.0 418.0,280.0 L418.0,290.0 Q418.0,294.0 414.0,294.0 L236.0,294.0 Z"/>
<text class="small" x="236" y="310">About 12 hours at most; ends after 20 to 30 idle minutes</text>
</svg>
