<svg xmlns="http://www.w3.org/2000/svg" width="680" height="588" viewBox="0 0 680 588" role="img" aria-labelledby="t d">
<title id="t">Six shapes of data and the AWS database built for each</title>
<desc id="d">Six cards in two rows of three, each with a small drawing of the shape. Relational: tables with rows and columns, linked to each other; bakery example, orders, customers and order lines; Amazon RDS and Amazon Aurora. Key-value: look up one item by its key, fast, at any scale; shopping carts by cart ID; Amazon DynamoDB. Document: records stored as JSON documents whose fields can vary; a product catalog where each cake has different options; Amazon DocumentDB, and DynamoDB also stores documents. In-memory: copies of hot data held in memory, answered in microseconds; the home page's best sellers and sign-in sessions; Amazon ElastiCache. Graph: things and the relationships between them; customers who bought this cake also bought; Amazon Neptune. Data warehouse: years of data from many sources, for analysis; sales by month, product and shop over three years; Amazon Redshift, for analytics, not the shop's daily work.</desc>

