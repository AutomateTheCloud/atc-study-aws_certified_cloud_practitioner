<svg xmlns="http://www.w3.org/2000/svg" width="680" height="398" viewBox="0 0 680 398" role="img" aria-labelledby="t d">
<title id="t">The order of checks for a request from the internet to a web server, and for the server's reply</title>
<desc id="d">Two rows of boxes joined by arrows. Request in: the internet gateway translates the public IP to the private IP; the route table's local route delivers the packet to the subnet; the network ACL checks its inbound rules, numbered, first match wins; the security group checks its inbound rules, which can only allow; the packet reaches the web server. Reply out: from the web server, the security group lets the reply out without a rule because it remembers the request (drawn dashed); the network ACL checks its outbound rules again, because it forgets (drawn with a thick outline and labeled as the check people forget); the route table sends 0.0.0.0/0 to the gateway; the internet gateway translates the private IP back to the public IP. A note says traffic between two subnets passes the sender's security group and network ACL going out, then the receiver's network ACL and security group coming in.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --az-fill:#d9e8fb; --you-fill:#fbe1d6; --card:#fcfcfb; --no-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --az-fill:#1b3554; --you-fill:#4d2716; --card:#1a1a19; --no-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .vpc { fill: none; stroke: var(--ink); stroke-width: 2; }
  .net { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .az { fill: var(--az-fill); stroke: var(--s1); stroke-width: 1.2; }
  .you { fill: var(--you-fill); stroke: var(--s2); stroke-width: 1.5; }
  .card { fill: var(--card); stroke: var(--ink2); stroke-width: 1; }
  .gw { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
  .ok { fill: var(--card); stroke: var(--ink2); stroke-width: 1; }
  .stop { fill: var(--you-fill); stroke: var(--ink); stroke-width: 3; }
  .auto { fill: var(--no-fill); stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  .hl { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .link { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .flow { stroke: var(--ink); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink); }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .bold { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .small { fill: var(--ink2); font-size: 12px; }
  .tiny { fill: var(--ink2); font-size: 11px; }
  .chip { fill: var(--ink); font-size: 11.5px; }
  .chipb { fill: var(--ink); font-size: 11.5px; font-weight: 700; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="398" fill="var(--surface)" style="fill:var(--surface)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 Z"/></marker></defs>
<text class="title" x="16" y="28">The checks a request and its reply pass through</text>
<text class="sub" x="16" y="48">A customer's request to the web server, and the server's reply</text>
<text class="head" x="16" y="82">Request in</text>
<rect class="ok" x="16" y="96" width="116" height="74" rx="6"/>
<text class="bold" x="74.0" y="118.0" text-anchor="middle">Internet gateway</text>
<text class="tiny" x="74.0" y="134.0" text-anchor="middle">public IP → private</text>
<text class="tiny" x="74.0" y="147.0" text-anchor="middle">IP</text>
<line class="flow" x1="134" y1="133" x2="147" y2="133" marker-end="url(#arr)"/>
<rect class="ok" x="149" y="96" width="116" height="74" rx="6"/>
<text class="bold" x="207.0" y="118.0" text-anchor="middle">Route table</text>
<text class="tiny" x="207.0" y="134.0" text-anchor="middle">local route</text>
<text class="tiny" x="207.0" y="147.0" text-anchor="middle">delivers it</text>
<line class="flow" x1="267" y1="133" x2="280" y2="133" marker-end="url(#arr)"/>
<rect class="ok" x="282" y="96" width="116" height="74" rx="6"/>
<text class="bold" x="340.0" y="118.0" text-anchor="middle">Network ACL,</text>
<text class="bold" x="340.0" y="132.0" text-anchor="middle">inbound</text>
<text class="tiny" x="340.0" y="148.0" text-anchor="middle">numbered rules,</text>
<text class="tiny" x="340.0" y="161.0" text-anchor="middle">first match</text>
<line class="flow" x1="400" y1="133" x2="413" y2="133" marker-end="url(#arr)"/>
<rect class="ok" x="415" y="96" width="116" height="74" rx="6"/>
<text class="bold" x="473.0" y="118.0" text-anchor="middle">Security group,</text>
<text class="bold" x="473.0" y="132.0" text-anchor="middle">inbound</text>
<text class="tiny" x="473.0" y="148.0" text-anchor="middle">allow rules only</text>
<line class="flow" x1="533" y1="133" x2="546" y2="133" marker-end="url(#arr)"/>
<rect class="you" x="548" y="96" width="116" height="74" rx="6"/>
<text class="bold" x="606.0" y="118.0" text-anchor="middle">Web server</text>
<text class="head" x="16" y="210">Reply out</text>
<rect class="you" x="16" y="224" width="116" height="74" rx="6"/>
<text class="bold" x="74.0" y="246.0" text-anchor="middle">Web server</text>
<line class="flow" x1="134" y1="261" x2="147" y2="261" marker-end="url(#arr)"/>
<rect class="auto" x="149" y="224" width="116" height="74" rx="6"/>
<text class="bold" x="207.0" y="246.0" text-anchor="middle">Security group</text>
<text class="tiny" x="207.0" y="262.0" text-anchor="middle">reply allowed: it</text>
<text class="tiny" x="207.0" y="275.0" text-anchor="middle">remembers</text>
<line class="flow" x1="267" y1="261" x2="280" y2="261" marker-end="url(#arr)"/>
<rect class="hl" x="282" y="224" width="116" height="74" rx="6"/>
<text class="bold" x="340.0" y="246.0" text-anchor="middle">Network ACL,</text>
<text class="bold" x="340.0" y="260.0" text-anchor="middle">outbound</text>
<text class="tiny" x="340.0" y="276.0" text-anchor="middle">checked again: it</text>
<text class="tiny" x="340.0" y="289.0" text-anchor="middle">forgets</text>
<line class="flow" x1="400" y1="261" x2="413" y2="261" marker-end="url(#arr)"/>
<rect class="ok" x="415" y="224" width="116" height="74" rx="6"/>
<text class="bold" x="473.0" y="246.0" text-anchor="middle">Route table</text>
<text class="tiny" x="473.0" y="262.0" text-anchor="middle">0.0.0.0/0 → gateway</text>
<line class="flow" x1="533" y1="261" x2="546" y2="261" marker-end="url(#arr)"/>
<rect class="ok" x="548" y="224" width="116" height="74" rx="6"/>
<text class="bold" x="606.0" y="246.0" text-anchor="middle">Internet gateway</text>
<text class="tiny" x="606.0" y="262.0" text-anchor="middle">private IP → public</text>
<text class="tiny" x="606.0" y="275.0" text-anchor="middle">IP</text>
<text class="bold" x="282" y="318">↑ The check people forget: it needs a rule for the reply.</text>
<text class="note" x="16" y="346.0">Dashed: passes without a rule, because a security group is stateful. Thick outline: a stateless network</text>
<text class="note" x="16" y="362.0">ACL checks the reply like any other packet. Traffic between two subnets passes the sender's security</text>
<text class="note" x="16" y="378.0">group and network ACL going out, then the receiver's network ACL and security group coming in.</text>
</svg>
