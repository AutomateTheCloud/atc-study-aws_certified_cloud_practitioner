<rect class="s1" x="591.0" y="266.7" width="31.0" height="73.3"><title>Nov: 2 base servers</title></rect>
<path class="s2" d="M591.0,264.7 L591.0,234.0 Q591.0,230.0 595.0,230.0 L618.0,230.0 Q622.0,230.0 622.0,234.0 L622.0,264.7 Z"><title>Nov: 1 extra</title></path>
<text class="val" x="606.5" y="224.0" text-anchor="middle">+1</text>
<rect class="s1" x="642.7" y="266.7" width="31.0" height="73.3"><title>Dec: 2 base servers</title></rect>
<path class="s2" d="M642.7,264.7 L642.7,124.0 Q642.7,120.0 646.7,120.0 L669.7,120.0 Q673.7,120.0 673.7,124.0 L673.7,264.7 Z"><title>Dec: 4 extra</title></path>
<text class="val" x="658.2" y="114.0" text-anchor="middle">+4</text>
<text class="note" x="16" y="388">Made-up teaching figures from Modules 02 and 06. Inside each day the group also shrinks at night;</text>
<text class="note" x="16" y="404">this chart counts each month at its busiest hour, as Module 06 did.</text>
