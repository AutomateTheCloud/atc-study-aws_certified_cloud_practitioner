<rect class="s1" x="126.0" y="266.7" width="31.0" height="73.3"><title>Feb: 2 base servers</title></rect>
<rect class="s1" x="177.7" y="266.7" width="31.0" height="73.3"><title>Mar: 2 base servers</title></rect>
<rect class="s1" x="229.3" y="266.7" width="31.0" height="73.3"><title>Apr: 2 base servers</title></rect>
