<text class="tick" x="89.8" y="358" text-anchor="middle">Jan</text>
<text class="tick" x="141.5" y="358" text-anchor="middle">Feb</text>
<text class="tick" x="193.2" y="358" text-anchor="middle">Mar</text>
<text class="tick" x="244.8" y="358" text-anchor="middle">Apr</text>
<text class="tick" x="296.5" y="358" text-anchor="middle">May</text>
<text class="tick" x="348.2" y="358" text-anchor="middle">Jun</text>
