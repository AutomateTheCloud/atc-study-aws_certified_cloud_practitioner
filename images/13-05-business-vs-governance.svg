<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380" role="img" aria-labelledby="t d">
<title id="t">Business and Governance perspectives of the AWS Cloud Adoption Framework compared</title>
<desc id="d">Two panels. Business asks whether the organization is investing in the right things for the business; example capabilities: strategy management, portfolio management, product management; the chain's concern c, which projects help win five times the café customers. Governance asks whether the work is on plan, on budget and within its risk limits, and whether it is paying off; example capabilities: program and project management, benefits management, risk management, cloud financial management; the chain's concerns a, how to know the move paid off, and g, how to track the schedule and the risks.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --g1:#f1f0ec; --g2:#d9e8fb; --g3:#fbe1d6; --card:#fcfcfb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --g1:#252523; --g2:#1b3554; --g3:#4d2716; --card:#1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .g1 { fill: var(--g1); stroke: var(--muted); stroke-width: 1; }
  .g2 { fill: var(--g2); stroke: var(--s1); stroke-width: 1.2; }
  .g3 { fill: var(--g3); stroke: var(--s2); stroke-width: 1.2; }
  .card { fill: var(--card); stroke: var(--ink2); stroke-width: 1; }
  .flow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .chip { fill: var(--ink); font-size: 12px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="380" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Business or Governance? Two perspectives learners mix up</text>
<text class="sub" x="16" y="48">Example capabilities from the AWS CAF overview (2021); the concerns are from Decision 2.</text>
<rect class="g3" x="16" y="64" width="316" height="300" rx="8"/>
<text class="head" x="30" y="88">Business</text>
<text class="boxt" x="30" y="112.0">Are we investing in the right things for</text>
<text class="boxt" x="30" y="129.0">the business?</text>
<text class="small" x="30" y="154">Example capabilities</text>
<text class="chip" x="38" y="174">• Strategy management</text>
<text class="chip" x="38" y="192">• Portfolio management</text>
<text class="chip" x="38" y="210">• Product management</text>
<rect class="card" x="26" y="282" width="296" height="72" rx="5"/>
<text class="small" x="36" y="300">The chain's concerns</text>
<text class="chip" x="36" y="318.0">c: Which projects help us win five times the</text>
<text class="chip" x="36" y="334.0">café customers?</text>
<rect class="g2" x="348" y="64" width="316" height="300" rx="8"/>
<text class="head" x="362" y="88">Governance</text>
<text class="boxt" x="362" y="112.0">Is the work on plan, on budget and</text>
<text class="boxt" x="362" y="129.0">within its risk limits, and is it paying</text>
<text class="boxt" x="362" y="146.0">off?</text>
<text class="small" x="362" y="171">Example capabilities</text>
<text class="chip" x="370" y="191">• Program and project management</text>
<text class="chip" x="370" y="209">• Benefits management</text>
<text class="chip" x="370" y="227">• Risk management</text>
<text class="chip" x="370" y="245">• Cloud financial management</text>
<rect class="card" x="358" y="282" width="296" height="72" rx="5"/>
<text class="small" x="368" y="300">The chain's concerns</text>
<text class="chip" x="368" y="318.0">a: How will we know the move paid off?</text>
<text class="chip" x="368" y="334.0">g: How do we track the schedule and the risks?</text>
</svg>
