<svg xmlns="http://www.w3.org/2000/svg" width="680" height="476" viewBox="0 0 680 476" role="img" aria-labelledby="t d">
<title id="t">The four disaster recovery strategies as a staircase of cost against recovery time</title>
<desc id="d">Four boxes rise like stairs from left to right. Moving right, running cost and complexity rise, and typical recovery time falls. Backup and restore, recovery in hours: backups of data and setup are copied to the recovery Region, and everything else is rebuilt after the disaster. Pilot light, tens of minutes: data is copied continuously and the database runs; app servers are off until needed. Warm standby, minutes: a smaller copy of the whole site is always running and is scaled up to take over. Multi-site active/active, real time or near zero: full copies in two or more Regions all serve customers at once. The axes have no scale: AWS gives the order, not prices.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ha-fill:#d9e8fb; --dr-fill:#fbe1d6; --bk-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ha-fill:#1b3554; --dr-fill:#4d2716; --bk-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .ha { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .dr { fill: var(--dr-fill); stroke: var(--s2); stroke-width: 1.5; }
  .bk { fill: var(--bk-fill); stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .step { fill: var(--ha-fill); stroke: var(--s1); stroke-width: 1.5; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .tag { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .span-rpo { stroke: var(--s2); stroke-width: 3; fill: none; stroke-linecap: round; }
  .span-rto { stroke: var(--s1); stroke-width: 3; fill: none; stroke-linecap: round; }
  .ev { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .evline { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
</style>
<rect width="680" height="476" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">The four disaster recovery strategies</text>
<text class="sub" x="16" y="48">Each step costs more to run and is more complex, and recovers faster with less data lost</text>
<rect class="step" x="70" y="208" width="140" height="150" rx="6"/>
<text class="cellt" x="80" y="228.0">Backup and restore</text>
<text class="cells" x="80" y="248.0">Backups of data and</text>
<text class="cells" x="80" y="263.0">setup copied there.</text>
<text class="cells" x="80" y="278.0">Everything else is</text>
<text class="cells" x="80" y="293.0">rebuilt after the</text>
<text class="cells" x="80" y="308.0">disaster.</text>
<text class="tick" x="140.0" y="378" text-anchor="middle">Hours</text>
<rect class="step" x="216" y="162" width="140" height="150" rx="6"/>
<text class="cellt" x="226" y="182.0">Pilot light</text>
<text class="cells" x="226" y="202.0">Data copied</text>
<text class="cells" x="226" y="217.0">continuously; the</text>
<text class="cells" x="226" y="232.0">database runs. App</text>
<text class="cells" x="226" y="247.0">servers are off until</text>
<text class="cells" x="226" y="262.0">needed.</text>
<text class="tick" x="286.0" y="378" text-anchor="middle">Tens of minutes</text>
<rect class="step" x="362" y="116" width="140" height="150" rx="6"/>
<text class="cellt" x="372" y="136.0">Warm standby</text>
<text class="cells" x="372" y="156.0">A smaller copy of the</text>
<text class="cells" x="372" y="171.0">whole site, always</text>
<text class="cells" x="372" y="186.0">running. Scale it up</text>
<text class="cells" x="372" y="201.0">to take over.</text>
<text class="tick" x="432.0" y="378" text-anchor="middle">Minutes</text>
<rect class="step" x="508" y="70" width="140" height="150" rx="6"/>
<text class="cellt" x="518" y="90.0">Multi-site</text>
<text class="cellt" x="518" y="106.0">active/active</text>
<text class="cells" x="518" y="126.0">Full copies in two or</text>
<text class="cells" x="518" y="141.0">more Regions, all</text>
<text class="cells" x="518" y="156.0">serving customers at</text>
<text class="cells" x="518" y="171.0">once.</text>
<text class="tick" x="578.0" y="378" text-anchor="middle">Real time (near zero)</text>
<line class="axis" x1="70" x2="648" y1="362" y2="362"/>
<line class="arrow" x1="70" y1="402" x2="648" y2="402"/>
<path class="arrowhead" d="M640,397 L640,407 L648,402 Z"/>
<text class="small" x="70" y="420">Typical recovery time: slower</text>
<text class="small" x="648" y="420" text-anchor="end">faster, and less data lost</text>
<line class="arrow" x1="46" y1="358" x2="46" y2="74"/>
<path class="arrowhead" d="M41,82 L51,82 L46,74 Z"/>
<text class="small" transform="translate(38,214) rotate(-90)" text-anchor="middle">Running cost and complexity: higher</text>
<text class="note" x="16" y="446">Order and typical ranges from AWS's disaster recovery whitepaper (2021), checked 2026-10-24.</text>
<text class="note" x="16" y="462">No prices: the steps show order only. Real times depend on how well the plan is built and tested.</text>
</svg>
