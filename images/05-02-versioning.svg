<svg xmlns="http://www.w3.org/2000/svg" width="700" height="383" viewBox="0 0 700 383" role="img" aria-labelledby="t d">
<title id="t">S3 versioning in four moments: upload, overwrite, delete and restore</title>
<desc id="d">Four panels, left to right, for one key, cakes/birthday.jpg. The top of each stack is what people see. 1, upload: one version, v1, the current one. 2, overwrite: v2 is current, and v1 is kept underneath as a noncurrent version. 3, delete: a delete marker goes on top and is current; the photo looks gone, but v1 and v2 are still stored. 4, restore: delete the marker, and v2 is current again, with v1 underneath. Below: every version is a whole copy, and S3 bills each one; three versions of a 2 MB photo are 6 MB of storage.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --off-fill:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --off-fill:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .on { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .off { fill: var(--off-fill); stroke: var(--s2); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .ver { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .cur { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 2; }
  .marker { fill: var(--off-fill); stroke: var(--s2); stroke-width: 2; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .tag { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .num { fill: var(--surface); font-size: 12px; font-weight: 700; }
  .numc { fill: var(--ink); }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="700" height="383" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">With versioning on, an overwrite or a delete can be undone</text>
<text class="sub" x="16" y="48">One key, cakes/birthday.jpg, in four moments. The top of each stack is what people see.</text>
<rect class="panel" x="16" y="74" width="160" height="250" rx="8"/>
<text class="head" x="28" y="98">1. Upload</text>
<rect class="cur" x="28" y="204" width="136" height="30" rx="5"/>
<text class="cellt" x="38" y="224">v1: first photo</text>
<text class="tag" x="158" y="199" text-anchor="end">current</text>
<text class="small" x="28" y="264.0">One version, the</text>
<text class="small" x="28" y="280.0">current one.</text>
<line class="arrow" x1="177" y1="199" x2="187" y2="199"/>
<path class="arrowhead" d="M183,195 L183,203 L188,199 Z"/>
<rect class="panel" x="188" y="74" width="160" height="250" rx="8"/>
<text class="head" x="200" y="98">2. Overwrite</text>
<rect class="cur" x="200" y="168" width="136" height="30" rx="5"/>
<text class="cellt" x="210" y="188">v2: new photo</text>
<text class="tag" x="330" y="163" text-anchor="end">current</text>
<rect class="ver" x="200" y="204" width="136" height="30" rx="5"/>
<text class="cellt" x="210" y="224">v1: first photo</text>
<text class="small" x="200" y="264.0">v1 is kept underneath</text>
<text class="small" x="200" y="280.0">as a noncurrent</text>
<text class="small" x="200" y="296.0">version.</text>
<line class="arrow" x1="349" y1="199" x2="359" y2="199"/>
<path class="arrowhead" d="M355,195 L355,203 L360,199 Z"/>
<rect class="panel" x="360" y="74" width="160" height="250" rx="8"/>
<text class="head" x="372" y="98">3. Delete</text>
<rect class="marker" x="372" y="132" width="136" height="30" rx="5"/>
<text class="cellt" x="382" y="152">Delete marker</text>
<text class="tag" x="502" y="127" text-anchor="end">current</text>
<rect class="ver" x="372" y="168" width="136" height="30" rx="5"/>
<text class="cellt" x="382" y="188">v2: new photo</text>
<rect class="ver" x="372" y="204" width="136" height="30" rx="5"/>
<text class="cellt" x="382" y="224">v1: first photo</text>
<text class="small" x="372" y="264.0">A marker goes on top.</text>
<text class="small" x="372" y="280.0">The photo looks gone;</text>
<text class="small" x="372" y="296.0">v1 and v2 are still</text>
<text class="small" x="372" y="312.0">stored.</text>
<line class="arrow" x1="521" y1="199" x2="531" y2="199"/>
<path class="arrowhead" d="M527,195 L527,203 L532,199 Z"/>
<rect class="panel" x="532" y="74" width="160" height="250" rx="8"/>
<text class="head" x="544" y="98">4. Restore</text>
<rect class="cur" x="544" y="168" width="136" height="30" rx="5"/>
<text class="cellt" x="554" y="188">v2: new photo</text>
<text class="tag" x="674" y="163" text-anchor="end">current</text>
<rect class="ver" x="544" y="204" width="136" height="30" rx="5"/>
<text class="cellt" x="554" y="224">v1: first photo</text>
<text class="small" x="544" y="264.0">Delete the marker, and</text>
<text class="small" x="544" y="280.0">v2 is current again.</text>
<text class="small" x="16" y="348.0">Every version is a whole copy, and S3 bills each one. Three versions of a 2 MB photo are 6 MB of storage.</text>
<text class="note" x="16" y="369">Our drawing of the S3 User Guide, "Retaining multiple versions of objects with S3 Versioning", checked 2026-10-24.</text>
</svg>
