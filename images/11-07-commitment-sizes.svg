<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 680 346" role="img" aria-labelledby="t d">
<title id="t">A year of the bakery's web servers with no commitment, a baseline commitment and a peak-sized commitment</title>
<desc id="d">Three stacked horizontal bars in dollars per year, assuming every day is as busy as the December Saturday. No commitment, all On-Demand: $576.99. Commit to 2 servers, the baseline: $227.76 of Reserved Instances plus $212.58 On-Demand, $440.34 in all, the lowest. Commit to 6 servers, the noon peak: $683.28, all commitment, the highest, because most of it pays for servers that sit idle outside the peak. Prices for t3.small in US East (N. Virginia) as of 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .seg-gap { stroke: var(--surface); stroke-width: 2; }
  .vlab { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ann { fill: var(--ink); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="346" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How big a commitment? A year of the bakery's web servers</text>
<text class="sub" x="16" y="48">Worst case for small commitments: every day as busy as the December Saturday</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">1-year Standard RIs, No Upfront, paid used or not</text>
<rect class="s2" x="380" y="66" width="12" height="12" rx="2"/>
<text x="398" y="76">On-Demand hours above the commitment</text>
<line class="axis" x1="160.0" x2="160.0" y1="94" y2="252"/>
<text class="tick" x="160.0" y="268" text-anchor="middle">$0</text>
<line class="grid" x1="220.0" x2="220.0" y1="94" y2="252"/>
<text class="tick" x="220.0" y="268" text-anchor="middle">$100</text>
<line class="grid" x1="280.0" x2="280.0" y1="94" y2="252"/>
<text class="tick" x="280.0" y="268" text-anchor="middle">$200</text>
<line class="grid" x1="340.0" x2="340.0" y1="94" y2="252"/>
<text class="tick" x="340.0" y="268" text-anchor="middle">$300</text>
<line class="grid" x1="400.0" x2="400.0" y1="94" y2="252"/>
<text class="tick" x="400.0" y="268" text-anchor="middle">$400</text>
<line class="grid" x1="460.0" x2="460.0" y1="94" y2="252"/>
<text class="tick" x="460.0" y="268" text-anchor="middle">$500</text>
<line class="grid" x1="520.0" x2="520.0" y1="94" y2="252"/>
<text class="tick" x="520.0" y="268" text-anchor="middle">$600</text>
<line class="grid" x1="580.0" x2="580.0" y1="94" y2="252"/>
<text class="tick" x="580.0" y="268" text-anchor="middle">$700</text>
<text class="tick" x="370.0" y="286" text-anchor="middle">Dollars per year</text>
<text class="lab" x="150" y="115" text-anchor="end">No commitment</text>
<text class="tick" x="150" y="130" text-anchor="end">all On-Demand</text>
<path class="s2" d="M160.0,100.0 L502.2,100.0 Q506.2,100.0 506.2,104.0 L506.2,130.0 Q506.2,134.0 502.2,134.0 L160.0,134.0 Z"><title>No commitment, On-Demand: $576.99</title></path>
<text class="vlab" x="514.2" y="122">$576.99</text>
<text class="lab" x="150" y="171" text-anchor="end">Commit to 2</text>
<text class="tick" x="150" y="186" text-anchor="end">the baseline</text>
<rect class="s1" x="160.0" y="156" width="136.7" height="34"><title>Commit to 2, commitment: $227.76</title></rect>
<path class="s2" d="M296.7,156.0 L420.2,156.0 Q424.2,156.0 424.2,160.0 L424.2,186.0 Q424.2,190.0 420.2,190.0 L296.7,190.0 Z"><title>Commit to 2, On-Demand: $212.58</title></path>
<line class="seg-gap" x1="296.7" x2="296.7" y1="156" y2="190"/>
<text class="vlab" x="432.2" y="178">$440.34</text>
<text class="lab" x="150" y="227" text-anchor="end">Commit to 6</text>
<text class="tick" x="150" y="242" text-anchor="end">the noon peak</text>
<path class="s1" d="M160.0,212.0 L566.0,212.0 Q570.0,212.0 570.0,216.0 L570.0,242.0 Q570.0,246.0 566.0,246.0 L160.0,246.0 Z"><title>Commit to 6, commitment: $683.28</title></path>
<text class="vlab" x="578.0" y="234">$683.28</text>
<text class="note" x="16" y="312">t3.small, US East (N. Virginia), Linux: On-Demand $0.0208 an hour; 1-year Standard RI, No Upfront, $0.013 an hour</text>
<text class="note" x="16" y="327">effective. AWS Price List, retrieved 2026-10-24. On quieter days the On-Demand part shrinks; the commitment doesn't.</text>
</svg>
