<svg xmlns="http://www.w3.org/2000/svg" width="680" height="668" viewBox="0 0 680 668" role="img" aria-labelledby="t d">
<title id="t">The network Lab 09 builds: one VPC with a public and a private subnet in two Availability Zones</title>
<desc id="d">Outside everything, the internet, joined by a two-way arrow to an internet gateway named clf-lab09-igw on the edge of the VPC. A dashed box marks the Region, US East (N. Virginia), us-east-1. Inside it, the VPC clf-lab09-vpc, with the address range 10.0.0.0/16. The VPC holds two Availability Zone columns. In us-east-1a, the public subnet clf-lab09-public-a, 10.0.1.0/24, uses route table clf-lab09-public-rt with two routes: 10.0.0.0/16 to local, and 0.0.0.0/0 to the internet gateway. That second route is highlighted, an arrow runs to it from the internet gateway, and a label says this one route makes the subnet public. Its network ACL, clf-lab09-public-nacl, denies 203.0.113.0/24, allows HTTPS in and allows replies out. In us-east-1b, the private subnet clf-lab09-private-b, 10.0.4.0/24, uses the main route table made with the VPC, with only the local route and no route to the internet, and the default network ACL, which allows all traffic. Below the subnets, still inside the VPC, two security groups, which belong to the VPC and are attached to resources: clf-lab09-web-sg allows HTTPS on port 443 in from anywhere; clf-lab09-db-sg allows port 5432 in only from clf-lab09-web-sg. A note says the lab builds no NAT gateway ($0.045 an hour) and no Elastic IP or other public IPv4 address ($0.005 an hour), US East (N. Virginia) prices as of 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --az-fill:#d9e8fb; --you-fill:#fbe1d6; --card:#fcfcfb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --az-fill:#1b3554; --you-fill:#4d2716; --card:#1a1a19; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .region { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .vpc { fill: none; stroke: var(--ink); stroke-width: 2; }
  .az { fill: var(--az-fill); stroke: var(--s1); stroke-width: 1.2; }
  .you { fill: var(--you-fill); stroke: var(--s2); stroke-width: 1.5; }
  .card { fill: var(--card); stroke: var(--ink2); stroke-width: 1; }
  .hl { fill: var(--card); stroke: var(--ink); stroke-width: 3; }
  .none { fill: var(--card); stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .gw { fill: var(--card); stroke: var(--ink); stroke-width: 2; }
  .flow { stroke: var(--ink); stroke-width: 2; fill: none; }
  .arrowhead { fill: var(--ink); }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .bold { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .small { fill: var(--ink2); font-size: 12px; }
  .tiny { fill: var(--ink2); font-size: 11px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="668" fill="var(--surface)" style="fill:var(--surface)"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 Z"/></marker></defs>
<text class="title" x="16" y="28">The network you build in Lab 09</text>
<text class="sub" x="16" y="48">One VPC, two subnets in two Availability Zones, and nothing that bills by the hour</text>
<rect class="card" x="150" y="62" width="180" height="28" rx="14"/>
<text class="boxt" x="240" y="81" text-anchor="middle">The internet</text>
<rect class="region" x="16" y="112" width="648" height="500" rx="10"/>
<text class="small" x="652" y="130" text-anchor="end">Region: US East (N. Virginia), us-east-1</text>
<rect class="vpc" x="32" y="142" width="616" height="458" rx="8"/>
<text class="boxt" x="634" y="164" text-anchor="end">VPC clf-lab09-vpc</text>
<text class="small" x="634" y="180" text-anchor="end">10.0.0.0/16, about 65,000 private addresses</text>
<line class="flow" x1="240" y1="90" x2="240" y2="126" marker-start="url(#arr)" marker-end="url(#arr)"/>
<rect class="gw" x="130" y="128" width="220" height="30" rx="5"/>
<text class="boxt" x="240" y="148" text-anchor="middle">Internet gateway clf-lab09-igw</text>
<rect class="az" x="48" y="196" width="292" height="276" rx="7"/>
<text class="small" x="60" y="214">Availability Zone us-east-1a</text>
<rect class="az" x="340" y="196" width="292" height="276" rx="7"/>
<text class="small" x="352" y="214">Availability Zone us-east-1b</text>
<rect class="you" x="60" y="224" width="268" height="236" rx="6"/>
<text class="boxt" x="72" y="244">Public subnet clf-lab09-public-a</text>
<text class="small" x="72" y="260">10.0.1.0/24</text>
<rect class="card" x="72" y="272" width="244" height="82" rx="5"/>
<text class="small" x="82" y="290">Route table clf-lab09-public-rt</text>
<rect class="card" x="80" y="298" width="228" height="22" rx="4"/>
<text class="small" x="88" y="313">10.0.0.0/16 → local</text>
<rect class="hl" x="80" y="324" width="228" height="22" rx="4"/>
<text class="bold" x="88" y="339">0.0.0.0/0 → internet gateway</text>
<text class="bold" x="72" y="374.0">The route to the internet gateway</text>
<text class="bold" x="72" y="389.0">makes this subnet public.</text>
<text class="tiny" x="72" y="420.0">Network ACL clf-lab09-public-nacl: deny</text>
<text class="tiny" x="72" y="434.0">203.0.113.0/24, allow HTTPS in, allow</text>
<text class="tiny" x="72" y="448.0">replies out</text>
<rect class="you" x="352" y="224" width="268" height="236" rx="6"/>
<text class="boxt" x="364" y="244">Private subnet clf-lab09-private-b</text>
<text class="small" x="364" y="260">10.0.4.0/24</text>
<rect class="card" x="364" y="272" width="244" height="82" rx="5"/>
<text class="small" x="374" y="290">Main route table (made with the VPC)</text>
<rect class="card" x="372" y="298" width="228" height="22" rx="4"/>
<text class="small" x="380" y="313">10.0.0.0/16 → local</text>
<rect class="none" x="372" y="324" width="228" height="22" rx="4"/>
<text class="small" x="380" y="339">no route to the internet</text>
<text class="bold" x="364" y="374.0">No route to the internet gateway: this</text>
<text class="bold" x="364" y="389.0">subnet is private.</text>
<text class="tiny" x="364" y="420.0">Default network ACL (made with the VPC):</text>
<text class="tiny" x="364" y="434.0">allows all traffic in and out</text>
<path class="flow" d="M334,158 L334,335 L318,335" marker-end="url(#arr)"/>
<rect class="card" x="48" y="486" width="584" height="100" rx="7"/>
<text class="small" x="60" y="506">Security groups belong to the VPC and are attached to resources, such as a server (none in this lab)</text>
<rect class="you" x="60" y="518" width="274" height="56" rx="6"/>
<text class="boxt" x="72" y="540">clf-lab09-web-sg</text>
<text class="small" x="72" y="560">In: HTTPS (443) from anywhere</text>
<rect class="you" x="346" y="518" width="274" height="56" rx="6"/>
<text class="boxt" x="358" y="540">clf-lab09-db-sg</text>
<text class="small" x="358" y="560">In: port 5432 only from clf-lab09-web-sg</text>
<text class="note" x="16" y="636.0">Not built: a NAT gateway ($0.045 an hour) or an Elastic IP or other public IPv4 address ($0.005 an</text>
<text class="note" x="16" y="652.0">hour). US East (N. Virginia) prices as of 2026-10-24.</text>
</svg>
