<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="t d">
<title id="t">Four ways to hold an encryption key on AWS, from least effort to most control</title>
<desc id="d">An arrow runs from AWS does more of the work, on the left, to you control and do more, on the right. Four cards sit along it; the third, customer managed key, is highlighted. The service's own key (AWS owned keys; S3's keys in SSE-S3): who controls use: The AWS service; seen in cloudtrail?: No; fee to keep it: None; bakery: Photo bucket. AWS managed key (aws/ebs, aws/rds and so on): who controls use: AWS; you can read the policy; seen in cloudtrail?: Yes; fee to keep it: None; requests may be billed; bakery: Server disks. Customer managed key (a KMS key you create): who controls use: You, in its key policy; seen in cloudtrail?: Yes; fee to keep it: $1 a month, plus requests; bakery: Tax archive. AWS CloudHSM (HSMs only you use): who controls use: You, with HSM users outside IAM; seen in cloudtrail?: No; its audit logs go to CloudWatch Logs; fee to keep it: Hourly, per HSM, used or not; bakery: Not needed. A note says client-side encryption, where you encrypt before sending, sits beyond the right edge.</desc>

<style>
