<text class="cells" x="26" y="182.0">keys in SSE-S3</text>
<text class="key" x="26" y="210.0">WHO CONTROLS USE</text>
<text class="keyl" x="26" y="226.0">The AWS service</text>
<text class="key" x="26" y="270.0">SEEN IN CLOUDTRAIL?</text>
<text class="keyl" x="26" y="286.0">No</text>
<text class="key" x="26" y="345.0">FEE TO KEEP IT</text>
<text class="keyl" x="26" y="361.0">None</text>
<text class="key" x="26" y="405.0">BAKERY</text>
<text class="keyl" x="26" y="421.0">Photo bucket</text>
<rect class="card" x="180.0" y="112.0" width="156.0" height="326.0" rx="8"/>
<text class="boxt" x="190" y="134.0">AWS managed key</text>
<text class="cells" x="190" y="168.0">aws/ebs, aws/rds and so</text>
<text class="cells" x="190" y="182.0">on</text>
<text class="key" x="190" y="210.0">WHO CONTROLS USE</text>
<text class="keyl" x="190" y="226.0">AWS; you can read</text>
<text class="keyl" x="190" y="241.0">the policy</text>
<text class="key" x="190" y="270.0">SEEN IN CLOUDTRAIL?</text>
<text class="keyl" x="190" y="286.0">Yes</text>
<text class="key" x="190" y="345.0">FEE TO KEEP IT</text>
<text class="keyl" x="190" y="361.0">None; requests may</text>
<text class="keyl" x="190" y="376.0">be billed</text>
<text class="key" x="190" y="405.0">BAKERY</text>
<text class="keyl" x="190" y="421.0">Server disks</text>
<rect class="hl" x="344.0" y="112.0" width="156.0" height="326.0" rx="8"/>
<text class="boxt" x="354" y="134.0">Customer managed</text>
<text class="boxt" x="354" y="150.0">key</text>
<text class="cells" x="354" y="168.0">a KMS key you create</text>
<text class="key" x="354" y="210.0">WHO CONTROLS USE</text>
<text class="keyl" x="354" y="226.0">You, in its key</text>
<text class="keyl" x="354" y="241.0">policy</text>
<text class="key" x="354" y="270.0">SEEN IN CLOUDTRAIL?</text>
<text class="keyl" x="354" y="286.0">Yes</text>
<text class="key" x="354" y="345.0">FEE TO KEEP IT</text>
<text class="keyl" x="354" y="361.0">$1 a month, plus</text>
<text class="keyl" x="354" y="376.0">requests</text>
<text class="key" x="354" y="405.0">BAKERY</text>
<text class="keyl" x="354" y="421.0">Tax archive</text>
<rect class="card" x="508.0" y="112.0" width="156.0" height="326.0" rx="8"/>
<text class="boxt" x="518" y="134.0">AWS CloudHSM</text>
<text class="cells" x="518" y="168.0">HSMs only you use</text>
<text class="key" x="518" y="210.0">WHO CONTROLS USE</text>
<text class="keyl" x="518" y="226.0">You, with HSM users</text>
<text class="keyl" x="518" y="241.0">outside IAM</text>
<text class="key" x="518" y="270.0">SEEN IN CLOUDTRAIL?</text>
