<text class="keyl" x="518" y="301.0">go to CloudWatch</text>
<text class="keyl" x="518" y="316.0">Logs</text>
<text class="key" x="518" y="345.0">FEE TO KEEP IT</text>
<text class="keyl" x="518" y="361.0">Hourly, per HSM,</text>
<text class="keyl" x="518" y="376.0">used or not</text>
<text class="key" x="518" y="405.0">BAKERY</text>
