<rect width="680" height="490" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Who holds the key: from least effort to most control</text>
<text class="sub" x="16" y="48">All four encrypt the data equally well; they differ in control, visibility, cost and work</text>
<line class="spec" x1="20" x2="652" y1="76" y2="76"/>
<path class="head-ink" d="M664,76 L652,70 L652,82 Z"/>
<text class="small" x="20" y="96">AWS does more of the work</text>
<text class="small" x="664" y="96" text-anchor="end">You control, and do, more</text>
<rect class="card" x="16.0" y="112.0" width="156.0" height="326.0" rx="8"/>
<text class="boxt" x="26" y="134.0">The service's own</text>
