<svg xmlns="http://www.w3.org/2000/svg" width="680" height="448" viewBox="0 0 680 448" role="img" aria-labelledby="t d">
<title id="t">Internet gateway compared with NAT gateway</title>
<desc id="d">Two panels. Left, internet gateway: the internet, then an internet gateway, then a public subnet holding a web server with a public IPv4 address. Arrows run both ways between each pair, labeled either side can start. Notes: who can start, the internet or your server; it is attached to the VPC; there is no charge for the gateway itself. Right, NAT gateway: the internet, an internet gateway, a public subnet holding a NAT gateway with an Elastic IP address, and below it a private subnet holding a server with no public address. Arrows run upward only, from the server to the NAT gateway, to the internet gateway, to the internet, labeled only the server starts. A dashed arrow from the internet is crossed out before it reaches the NAT gateway, labeled can't start a connection in. Notes: who can start, only your private server; it lives in a public subnet, often one per AZ; cost $0.045 an hour plus $0.045 per GB processed, US East (N. Virginia) as of 2026-10-24, with the Elastic IP and data transfer charged on top.</desc>

