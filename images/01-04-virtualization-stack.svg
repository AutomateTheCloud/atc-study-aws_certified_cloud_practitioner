<text class="cellt" x="122.0" y="124.0" text-anchor="middle">Application</text>
<text class="cells" x="122.0" y="139.0" text-anchor="middle">The bakery's website</text>
<rect class="you" x="30.0" y="174.0" width="184.0" height="58.0" rx="5"/>
<text class="cellt" x="122.0" y="192.0" text-anchor="middle">Guest operating system</text>
<text class="cells" x="122.0" y="207.0" text-anchor="middle">Linux</text>
<rect class="frame" x="228" y="74" width="204" height="180" rx="8"/>
<text class="head" x="330.0" y="94" text-anchor="middle">Virtual server 2</text>
<rect class="you" x="238.0" y="106.0" width="184.0" height="58.0" rx="5"/>
<text class="cellt" x="330.0" y="124.0" text-anchor="middle">Application</text>
<text class="cells" x="330.0" y="139.0" text-anchor="middle">The bakery's order</text>
<text class="cells" x="330.0" y="153.0" text-anchor="middle">database</text>
<rect class="you" x="238.0" y="174.0" width="184.0" height="58.0" rx="5"/>
<text class="cellt" x="330.0" y="192.0" text-anchor="middle">Guest operating system</text>
<text class="cells" x="330.0" y="207.0" text-anchor="middle">Linux</text>
<rect class="frame" x="436" y="74" width="204" height="180" rx="8"/>
<text class="head" x="538.0" y="94" text-anchor="middle">Virtual server 3</text>
<rect class="other" x="446.0" y="106.0" width="184.0" height="58.0" rx="5"/>
<text class="cellt" x="538.0" y="124.0" text-anchor="middle">Application</text>
<text class="cells" x="538.0" y="139.0" text-anchor="middle">Another customer's app</text>
<rect class="other" x="446.0" y="174.0" width="184.0" height="58.0" rx="5"/>
<text class="cellt" x="538.0" y="192.0" text-anchor="middle">Guest operating system</text>
<text class="cells" x="538.0" y="207.0" text-anchor="middle">Windows</text>
<line class="theline" x1="16" x2="644" y1="270" y2="270"/>
<text class="linelab" x="24" y="290">On a cloud server such as Amazon EC2: the customer runs what is above the line,</text>
<text class="linelab" x="24" y="307">the provider runs everything below it</text>
<rect class="hl" x="24.0" y="322.0" width="612.0" height="52.0" rx="5"/>
<text class="cellt" x="330.0" y="340.0" text-anchor="middle">Hypervisor (the virtualization layer)</text>
<text class="cells" x="330.0" y="355.0" text-anchor="middle">Gives each virtual server its share of processor, memory and disk, and keeps them apart</text>
<rect class="aws" x="24.0" y="384.0" width="612.0" height="52.0" rx="5"/>
<text class="cellt" x="330.0" y="402.0" text-anchor="middle">Physical server (the host)</text>
<text class="cells" x="330.0" y="417.0" text-anchor="middle">Processors, memory, disks and network card, in a rack in a data center</text>
<text class="note" x="16" y="458.0">Solid orange: the bakery's virtual servers. Dashed gray: another customer's, on the same host.</text>
</svg>
