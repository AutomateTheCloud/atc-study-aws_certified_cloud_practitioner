<svg xmlns="http://www.w3.org/2000/svg" width="680" height="519" viewBox="0 0 680 519" role="img" aria-labelledby="t d">
<title id="t">The Business and Governance perspectives of the AWS CAF compared</title>
<desc id="d">Two columns, Business perspective with eight capabilities and Governance perspective with seven, compared on five rows. Focus: Business is strategy and outcomes, making sure cloud spending speeds up the business's goals; Governance is control and oversight, running the cloud initiatives so the benefits arrive and the risks stay small. Common stakeholders: Business, CEO, CFO, COO, CIO and CTO; Governance, chief transformation officer, CIO, CTO, CFO, chief data officer and chief risk officer. The question it answers: Business, what should we change, in what order, and why is it worth it; Governance, is the change being delivered as planned, are the benefits real, and is spending under control. Portfolio and money, highlighted: Business has portfolio management, choosing and ordering the initiatives and using the 7 Rs to build the business case; Governance has cloud financial management, benefits management and application portfolio management, tracking spend and licenses, measuring results and keeping the inventory. All capabilities: Business, strategy management, portfolio management, innovation management, product management, strategic partnership, data monetization, business insights, data science; Governance, program and project management, benefits management, risk management, cloud financial management, application portfolio management, data governance, data curation. The subtitle notes that the CFO and CIO appear in both, so sort a concern by the capability it needs, not the job title.</desc>

