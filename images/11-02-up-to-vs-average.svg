<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514" role="img" aria-labelledby="t d">
<title id="t">The maximum discount AWS states for each purchasing option, with averages where AWS gives them</title>
<desc id="d">Horizontal bar chart, percent off On-Demand, as of 2026-10-24. Spot Instances: up to 90%; Standard Reserved Instances: up to 72%, averages 40% for 1 year and 60% for 3 years; EC2 Instance Savings Plans: up to 72%; Dedicated Host Reservations: up to 70%; Convertible Reserved Instances: up to 66%, averages 31% for 1 year and 54% for 3 years; Compute Savings Plans: up to 66%; SageMaker AI Savings Plans: up to 64%; Database Savings Plans: up to 35%; Capacity Reservations: no discount; On-Demand (the baseline): no discount. Maximums need the longest term and most upfront payment; older material says up to 75%.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; --no-fill:#f6f5f2; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --s3:#199e70; --no-fill:#1f1f1e; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .no { fill: var(--no-fill); stroke: var(--grid); stroke-width: 1; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .yes { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .avg { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .unit { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .unit-od { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .s3 { fill: var(--s3); }
</style>
<rect width="720" height="514" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">"Up to" is a ceiling, not the discount you get</text>
<text class="sub" x="16" y="48">Largest discount off On-Demand that AWS states for each option, as of 2026-10-24</text>
<rect class="s1l" x="16" y="70" width="12" height="12" rx="2"/>
<text x="34" y="80">Stated maximum ("up to")</text>
<circle class="avg" cx="230" cy="75" r="6"/>
<text x="242" y="80">Stated average: 1-year term, then 3-year term</text>
<line class="axis" x1="230.0" x2="230.0" y1="100" y2="444"/>
<text class="tick" x="230.0" y="462" text-anchor="middle">0%</text>
<line class="grid" x1="335.0" x2="335.0" y1="100" y2="444"/>
<text class="tick" x="335.0" y="462" text-anchor="middle">25%</text>
<line class="grid" x1="440.0" x2="440.0" y1="100" y2="444"/>
<text class="tick" x="440.0" y="462" text-anchor="middle">50%</text>
<line class="grid" x1="545.0" x2="545.0" y1="100" y2="444"/>
<text class="tick" x="545.0" y="462" text-anchor="middle">75%</text>
<line class="grid" x1="650.0" x2="650.0" y1="100" y2="444"/>
<text class="tick" x="650.0" y="462" text-anchor="middle">100%</text>
<text class="lab" x="16" y="126">Spot Instances</text>
<path class="s1l" d="M230.0,111.0 L604.0,111.0 Q608.0,111.0 608.0,115.0 L608.0,127.0 Q608.0,131.0 604.0,131.0 L230.0,131.0 Z"><title>Spot Instances: up to 90%</title></path>
<text class="val" x="616.0" y="126">up to 90%</text>
<text class="lab" x="16" y="160">Standard Reserved Instances</text>
<path class="s1l" d="M230.0,145.0 L528.4,145.0 Q532.4,145.0 532.4,149.0 L532.4,161.0 Q532.4,165.0 528.4,165.0 L230.0,165.0 Z"><title>Standard Reserved Instances: up to 72%</title></path>
<text class="val" x="540.4" y="160">up to 72%</text>
<circle class="avg" cx="398.0" cy="155" r="6"><title>Standard Reserved Instances: average 40%</title></circle>
<circle class="avg" cx="482.0" cy="155" r="6"><title>Standard Reserved Instances: average 60%</title></circle>
<text class="small" x="388.0" y="160" text-anchor="end">avg 40%, 60%</text>
<text class="lab" x="16" y="194">EC2 Instance Savings Plans</text>
<path class="s1l" d="M230.0,179.0 L528.4,179.0 Q532.4,179.0 532.4,183.0 L532.4,195.0 Q532.4,199.0 528.4,199.0 L230.0,199.0 Z"><title>EC2 Instance Savings Plans: up to 72%</title></path>
<text class="val" x="540.4" y="194">up to 72%</text>
<text class="lab" x="16" y="228">Dedicated Host Reservations</text>
<path class="s1l" d="M230.0,213.0 L520.0,213.0 Q524.0,213.0 524.0,217.0 L524.0,229.0 Q524.0,233.0 520.0,233.0 L230.0,233.0 Z"><title>Dedicated Host Reservations: up to 70%</title></path>
<text class="val" x="532.0" y="228">up to 70%</text>
<text class="lab" x="16" y="262">Convertible Reserved Instances</text>
<path class="s1l" d="M230.0,247.0 L503.2,247.0 Q507.2,247.0 507.2,251.0 L507.2,263.0 Q507.2,267.0 503.2,267.0 L230.0,267.0 Z"><title>Convertible Reserved Instances: up to 66%</title></path>
<text class="val" x="515.2" y="262">up to 66%</text>
<circle class="avg" cx="360.2" cy="257" r="6"><title>Convertible Reserved Instances: average 31%</title></circle>
<circle class="avg" cx="456.8" cy="257" r="6"><title>Convertible Reserved Instances: average 54%</title></circle>
<text class="small" x="350.2" y="262" text-anchor="end">avg 31%, 54%</text>
<text class="lab" x="16" y="296">Compute Savings Plans</text>
<path class="s1l" d="M230.0,281.0 L503.2,281.0 Q507.2,281.0 507.2,285.0 L507.2,297.0 Q507.2,301.0 503.2,301.0 L230.0,301.0 Z"><title>Compute Savings Plans: up to 66%</title></path>
<text class="val" x="515.2" y="296">up to 66%</text>
<text class="lab" x="16" y="330">SageMaker AI Savings Plans</text>
<path class="s1l" d="M230.0,315.0 L494.8,315.0 Q498.8,315.0 498.8,319.0 L498.8,331.0 Q498.8,335.0 494.8,335.0 L230.0,335.0 Z"><title>SageMaker AI Savings Plans: up to 64%</title></path>
<text class="val" x="506.8" y="330">up to 64%</text>
<text class="lab" x="16" y="364">Database Savings Plans</text>
<path class="s1l" d="M230.0,349.0 L373.0,349.0 Q377.0,349.0 377.0,353.0 L377.0,365.0 Q377.0,369.0 373.0,369.0 L230.0,369.0 Z"><title>Database Savings Plans: up to 35%</title></path>
<text class="val" x="385.0" y="364">up to 35%</text>
<text class="lab" x="16" y="398">Capacity Reservations</text>
<text class="val" x="238" y="398">no discount</text>
<text class="lab" x="16" y="432">On-Demand (the baseline)</text>
<text class="val" x="238" y="432">no discount</text>
<text class="note" x="16" y="472">Maximums need the longest term, the most paid upfront and the configurations with the biggest gaps. Older material says</text>
<text class="note" x="16" y="488">"up to 75%"; the figures moved, and will again. Sources: AWS pages for Savings Plans types, Reserved Instances pricing,</text>
<text class="note" x="16" y="504">Spot Instances, Dedicated Hosts and Capacity Reservations, checked 2026-10-24.</text>
</svg>
