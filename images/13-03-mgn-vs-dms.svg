<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="t d">
<title id="t">Application Migration Service compared with AWS DMS</title>
<desc id="d">Two panels. Left, Application Migration Service, now AWS Transform MGN: on-premises, the operating system, installed software including any database, and the disks; it copies the whole server block by block; in AWS it lands as an EC2 instance, and you still patch the operating system and the database software. Strategy: rehost. Right, AWS DMS with AWS SCT or DMS Schema Conversion: on-premises, the tables and rows, then every new change; it copies only the data, with the schema converted first if the engine changes; in AWS it lands in a managed database such as RDS or Aurora, where AWS runs and patches the database software. Strategy: replatform, or database replication.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --hi-fill:#fbe1d6; --card-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --hi-fill:#4d2716; --card-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
