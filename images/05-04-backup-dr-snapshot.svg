<svg xmlns="http://www.w3.org/2000/svg" width="680" height="463" viewBox="0 0 680 463" role="img" aria-labelledby="t d">
<title id="t">A snapshot, AWS Backup and AWS Elastic Disaster Recovery compared</title>
<desc id="d">Three columns compared on five rows. The job: a snapshot goes back to how one disk or database was; AWS Backup runs backups for many services by one set of rules; Elastic Disaster Recovery gets whole servers running again, fast. Copies: one EBS volume or one RDS database; many resources across services and accounts, chosen by tag; whole servers with disks, operating system and applications. How often: when you take one or on a schedule; on the plan's schedule, kept for the plan's retention; continuously, change by change. What you get back: a new volume or database as it was at that moment; recovery points of your data, also copied to other Regions or accounts; running recovery servers in AWS from the latest state or an earlier point. How fast: as long as a restore takes; as long as a restore takes, and servers still need relaunching; AWS says seconds of data lost and running again in minutes. A note: only Elastic Disaster Recovery brings back running servers; the other two bring back data.</desc>

