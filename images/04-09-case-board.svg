<svg xmlns="http://www.w3.org/2000/svg" width="820" height="568" viewBox="0 0 820 568" role="img" aria-labelledby="t d">
<title id="t">Eight policy evaluation cases: which policies were present, which one decided, and the result</title>
<desc id="d">A table of eight cases. Case 1 Teammate, group with no policies, downloads a photo. SCP: none, Permissions boundary: none, Identity policies: No allow, Resource policy: none. Deciding: Identity policies. Result: Denied, because of default deny. Case 2 Teammate, group allows photo files, downloads a photo. SCP: none, Permissions boundary: none, Identity policies: Allows, Resource policy: none. Deciding: Identity policies. Result: Allowed, because of an allow, no deny. Case 3 Teammate with Lab 04's broken guardrail, uploads. SCP: none, Permissions boundary: none, Identity policies: Allows and denies, Resource policy: none. Deciding: Identity policies. Result: Denied, because of explicit deny wins. Case 4 Photographer, no identity policy; bucket policy names her. SCP: none, Permissions boundary: none, Identity policies: No allow, Resource policy: Allows. Deciding: Resource policy. Result: Allowed, because of same-account resource policy. Case 5 Print shop user in another account downloads a photo. SCP: none, Permissions boundary: none, Identity policies: No allow, Resource policy: Allows. Deciding: Identity policies. Result: Denied, because of cross-account needs both. Case 6 Chain shop admin with AdministratorAccess creates a user. SCP: Doesn't allow, Permissions boundary: none, Identity policies: Allows, Resource policy: none. Deciding: SCP. Result: Denied, because of outside the SCP. Case 7 Chain shop user with no policies downloads a photo. SCP: Allows, Permissions boundary: none, Identity policies: No allow, Resource policy: none. Deciding: Identity policies. Result: Denied, because of an SCP grants nothing. Case 8 Helper, admin within an S3-only boundary, creates a user. SCP: none, Permissions boundary: Doesn't allow, Identity policies: Allows, Resource policy: none. Deciding: Permissions boundary. Result: Denied, because of outside the boundary.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .cell { fill: var(--surface); stroke: var(--grid); stroke-width: 1; }
  .absent { fill: var(--surface); stroke: var(--grid); stroke-width: 1; stroke-dasharray: 3 3; }
  .decides { fill: none; stroke: var(--ink); stroke-width: 2.5; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .celltext { fill: var(--ink); font-size: 13px; }
  .celltext-key { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .muted { fill: var(--muted); font-size: 13px; }
  .result { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .small { fill: var(--ink2); font-size: 12px; }
</style>
