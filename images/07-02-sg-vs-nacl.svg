<text class="small" x="176" y="140.0">such as one web server (instance</text>
<text class="small" x="176" y="155.0">level)</text>
<text class="small" x="434" y="125.0">A whole subnet: everything that</text>
<text class="small" x="434" y="140.0">enters or leaves it (subnet level)</text>
<line class="grid" x1="16" x2="674" y1="169" y2="169"/>
<text class="rowl" x="16" y="188.0">Rules</text>
<text class="small" x="176" y="188.0">Allow rules only</text>
<text class="small" x="434" y="188.0">Allow and deny rules</text>
<line class="grid" x1="16" x2="674" y1="202" y2="202"/>
<text class="rowl" x="16" y="221.0">How rules are</text>
<text class="rowl" x="16" y="236.0">checked</text>
<text class="small" x="176" y="221.0">All rules together: any allow rule</text>
<text class="small" x="176" y="236.0">that matches lets traffic through</text>
<text class="small" x="434" y="221.0">In number order: the first rule</text>
<text class="small" x="434" y="236.0">that matches decides</text>
<rect class="ok" x="162.0" y="252.0" width="258.0" height="44.0" rx="5"/>
<rect class="ok" x="420.0" y="252.0" width="258.0" height="44.0" rx="5"/>
<line class="grid" x1="16" x2="674" y1="250" y2="250"/>
<text class="rowl" x="16" y="269.0">Replies</text>
<text class="cellt" x="176" y="269.0">Allowed automatically: it</text>
<text class="cellt" x="176" y="284.0">remembers the request (stateful)</text>
<text class="cellt" x="434" y="269.0">Checked again: an outbound rule</text>
<text class="cellt" x="434" y="284.0">must allow it (stateless)</text>
<line class="grid" x1="16" x2="674" y1="298" y2="298"/>
<text class="rowl" x="16" y="317.0">When you create one</text>
