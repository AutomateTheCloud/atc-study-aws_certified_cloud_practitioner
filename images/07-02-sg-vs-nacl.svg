<text class="small" x="176" y="332.0">everything out</text>
<text class="small" x="434" y="317.0">The default one allows everything;</text>
<text class="small" x="434" y="332.0">a new custom one denies everything</text>
<line class="grid" x1="16" x2="674" y1="346" y2="346"/>
<text class="rowl" x="16" y="365.0">Its usual job</text>
<text class="small" x="176" y="365.0">The main control: who may reach</text>
<text class="small" x="176" y="380.0">this resource, on which port</text>
<text class="small" x="434" y="365.0">A second layer: for example, deny</text>
