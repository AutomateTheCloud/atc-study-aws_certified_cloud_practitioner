<svg xmlns="http://www.w3.org/2000/svg" width="680" height="494" viewBox="0 0 680 494" role="img" aria-labelledby="t d">
<title id="t">Security group compared with network ACL</title>
<desc id="d">Two columns, security group and network ACL, compared on seven rows. Guards: a security group guards each resource it's attached to, such as one web server (instance level); a network ACL guards a whole subnet, everything that enters or leaves it (subnet level). Rules: allow rules only; allow and deny rules. How rules are checked: all rules together, and any allow rule that matches lets traffic through; in number order, and the first rule that matches decides. Replies, highlighted: allowed automatically because the security group remembers the request (stateful); checked again, so an outbound rule must allow them (stateless). When you create one: a new security group allows nothing in and everything out; the default network ACL allows everything, and a new custom one denies everything. Usual job: the main control, who may reach this resource on which port; a second layer, for example denying an address range for a whole subnet. Cost: no charge for either. A note says neither filters traffic to Amazon DNS, DHCP, instance metadata or the Amazon Time Sync Service.</desc>

