<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
<title id="t">Stored log data over a year: never expire against one-week retention</title>
<desc id="d">Line chart, made-up figures, months 1 to 12, functions writing 0.5 GB of logs a month. With retention set to never expire, stored logs grow by 0.5 GB every month, to 6 GB at month 12, and keep growing. With retention set to one week, stored logs stay flat at about 0.1 GB.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="680" height="400" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Logs kept forever pile up; logs kept a week don't</text>
<text class="sub" x="16" y="48">Log data stored at the end of each month, if the functions write 0.5 GB a month (made-up figures)</text>
<line class="line-s1" x1="16" x2="32" y1="72" y2="72"/><text x="38" y="76">Retention: never expire (the default)</text>
<line class="line-s2" x1="300" x2="316" y1="72" y2="72"/><text x="322" y="76">Retention: 1 week</text>
<line class="axis" x1="56" x2="526" y1="348.0" y2="348.0"/>
<text class="tick" x="48" y="352.0" text-anchor="end">0</text>
<line class="grid" x1="56" x2="526" y1="314.3" y2="314.3"/>
<text class="tick" x="48" y="318.3" text-anchor="end">1</text>
<line class="grid" x1="56" x2="526" y1="280.6" y2="280.6"/>
<text class="tick" x="48" y="284.6" text-anchor="end">2</text>
<line class="grid" x1="56" x2="526" y1="246.9" y2="246.9"/>
<text class="tick" x="48" y="250.9" text-anchor="end">3</text>
