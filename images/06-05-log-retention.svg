<text class="tick" x="48" y="217.1" text-anchor="end">4</text>
<line class="grid" x1="56" x2="526" y1="179.4" y2="179.4"/>
<text class="tick" x="48" y="183.4" text-anchor="end">5</text>
<line class="grid" x1="56" x2="526" y1="145.7" y2="145.7"/>
<text class="tick" x="48" y="149.7" text-anchor="end">6</text>
<line class="grid" x1="56" x2="526" y1="112.0" y2="112.0"/>
<text class="tick" x="48" y="116.0" text-anchor="end">7</text>
<text class="tick" x="16" y="98">GB stored</text>
<text class="tick" x="56.0" y="366" text-anchor="middle">1</text>
<text class="tick" x="98.7" y="366" text-anchor="middle">2</text>
<text class="tick" x="141.5" y="366" text-anchor="middle">3</text>
<text class="tick" x="184.2" y="366" text-anchor="middle">4</text>
<text class="tick" x="226.9" y="366" text-anchor="middle">5</text>
<text class="tick" x="269.6" y="366" text-anchor="middle">6</text>
