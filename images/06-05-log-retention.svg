<text class="tick" x="355.1" y="366" text-anchor="middle">8</text>
<text class="tick" x="397.8" y="366" text-anchor="middle">9</text>
<text class="tick" x="440.5" y="366" text-anchor="middle">10</text>
<text class="tick" x="483.3" y="366" text-anchor="middle">11</text>
<text class="tick" x="526.0" y="366" text-anchor="middle">12</text>
<text class="tick" x="291.0" y="386" text-anchor="middle">Month</text>
<polyline class="line-s1" points="56.0,331.1 98.7,314.3 141.5,297.4 184.2,280.6 226.9,263.7 269.6,246.9 312.4,230.0 355.1,213.1 397.8,196.3 440.5,179.4 483.3,162.6 526.0,145.7"/>
<polyline class="line-s2" points="56.0,344.0 98.7,344.0 141.5,344.0 184.2,344.0 226.9,344.0 269.6,344.0 312.4,344.0 355.1,344.0 397.8,344.0 440.5,344.0 483.3,344.0 526.0,344.0"/>
<circle class="dot-s1" cx="56.0" cy="331.1" r="4"><title>Month 1, never expire: 0.5 GB</title></circle>
<circle class="dot-s2" cx="56.0" cy="344.0" r="4"><title>Month 1, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="98.7" cy="314.3" r="4"><title>Month 2, never expire: 1.0 GB</title></circle>
<circle class="dot-s2" cx="98.7" cy="344.0" r="4"><title>Month 2, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="141.5" cy="297.4" r="4"><title>Month 3, never expire: 1.5 GB</title></circle>
<circle class="dot-s2" cx="141.5" cy="344.0" r="4"><title>Month 3, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="184.2" cy="280.6" r="4"><title>Month 4, never expire: 2.0 GB</title></circle>
<circle class="dot-s2" cx="184.2" cy="344.0" r="4"><title>Month 4, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="226.9" cy="263.7" r="4"><title>Month 5, never expire: 2.5 GB</title></circle>
<circle class="dot-s2" cx="226.9" cy="344.0" r="4"><title>Month 5, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="269.6" cy="246.9" r="4"><title>Month 6, never expire: 3.0 GB</title></circle>
<circle class="dot-s2" cx="269.6" cy="344.0" r="4"><title>Month 6, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="312.4" cy="230.0" r="4"><title>Month 7, never expire: 3.5 GB</title></circle>
<circle class="dot-s2" cx="312.4" cy="344.0" r="4"><title>Month 7, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="355.1" cy="213.1" r="4"><title>Month 8, never expire: 4.0 GB</title></circle>
<circle class="dot-s2" cx="355.1" cy="344.0" r="4"><title>Month 8, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="397.8" cy="196.3" r="4"><title>Month 9, never expire: 4.5 GB</title></circle>
<circle class="dot-s2" cx="397.8" cy="344.0" r="4"><title>Month 9, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="440.5" cy="179.4" r="4"><title>Month 10, never expire: 5.0 GB</title></circle>
<circle class="dot-s2" cx="440.5" cy="344.0" r="4"><title>Month 10, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="483.3" cy="162.6" r="4"><title>Month 11, never expire: 5.5 GB</title></circle>
<circle class="dot-s2" cx="483.3" cy="344.0" r="4"><title>Month 11, 1 week: about 0.12 GB</title></circle>
<circle class="dot-s1" cx="526.0" cy="145.7" r="4"><title>Month 12, never expire: 6.0 GB</title></circle>
<circle class="dot-s2" cx="526.0" cy="344.0" r="4"><title>Month 12, 1 week: about 0.12 GB</title></circle>
<text class="lab" x="536" y="149.7">6 GB, still growing</text>
<text class="lab" x="536" y="338.0">about 0.1 GB,</text>
<text class="lab" x="536" y="354.0">flat</text>
</svg>
