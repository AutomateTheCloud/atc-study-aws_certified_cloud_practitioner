<svg xmlns="http://www.w3.org/2000/svg" width="680" height="446" viewBox="0 0 680 446" role="img" aria-labelledby="t d">
<title id="t">What a server keeps through a restart</title>
<desc id="d">Two panels. While the server runs: memory holds the website program and three orders being filled in, 1061 to 1063; storage holds the saved order records, the cake photos and the operating system. An arrow labeled power cut leads to the second panel. After a restart: memory, highlighted, is empty and the three orders are lost; storage still holds the saved order records, the cake photos and the operating system.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.8; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .plain { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .empty { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .arrlab { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
</style>
<rect width="680" height="446" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Memory empties when the power goes off; storage keeps</text>
<text class="sub" x="16" y="48">The same server, while it runs and after a power cut and restart</text>
<rect class="frame" x="16.0" y="74.0" width="300.0" height="330.0" rx="10"/>
<text class="head" x="30" y="98">While the server runs</text>
<rect class="plain" x="30.0" y="114.0" width="272.0" height="150.0" rx="6"/>
<text class="cellt" x="42" y="136">Memory</text>
<rect class="n" x="42.0" y="148.0" width="248.0" height="22.0" rx="4"/>
<text class="small" x="52" y="164">Website program</text>
<rect class="n" x="42.0" y="176.0" width="248.0" height="22.0" rx="4"/>
<text class="small" x="52" y="192">Order 1061, being filled in</text>
<rect class="n" x="42.0" y="204.0" width="248.0" height="22.0" rx="4"/>
<text class="small" x="52" y="220">Order 1062, being filled in</text>
<rect class="n" x="42.0" y="232.0" width="248.0" height="22.0" rx="4"/>
<text class="small" x="52" y="248">Order 1063, being filled in</text>
<rect class="plain" x="30.0" y="280.0" width="272.0" height="112.0" rx="6"/>
<text class="cellt" x="42" y="302">Storage</text>
<rect class="n" x="42.0" y="312.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="52" y="326">Saved order records</text>
<rect class="n" x="42.0" y="338.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="52" y="352">Cake photos</text>
<rect class="n" x="42.0" y="364.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="52" y="378">Operating system</text>
<rect class="frame" x="364.0" y="74.0" width="300.0" height="330.0" rx="10"/>
<text class="head" x="378" y="98">After a restart</text>
<rect class="hi" x="378.0" y="114.0" width="272.0" height="150.0" rx="6"/>
<text class="cellt" x="390" y="136">Memory</text>
<rect class="empty" x="390.0" y="148.0" width="248.0" height="106.0" rx="4"/>
<text class="cellt" x="514.0" y="198" text-anchor="middle">Empty</text>
<text class="small" x="514.0" y="216" text-anchor="middle">orders 1061 to 1063 are lost</text>
<rect class="plain" x="378.0" y="280.0" width="272.0" height="112.0" rx="6"/>
<text class="cellt" x="390" y="302">Storage</text>
<rect class="n" x="390.0" y="312.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="400" y="326">Saved order records</text>
<rect class="n" x="390.0" y="338.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="400" y="352">Cake photos</text>
<rect class="n" x="390.0" y="364.0" width="248.0" height="20.0" rx="4"/>
<text class="small" x="400" y="378">Operating system</text>
<line class="arrow" x1="322.0" y1="239.0" x2="358.0" y2="239.0"/>
<path class="arrowhead" d="M350.0,234.0 L350.0,244.0 L358.0,239.0 Z"/>
<text class="arrlab" x="340.0" y="214.0" text-anchor="middle">power</text>
<text class="arrlab" x="340.0" y="227.0" text-anchor="middle">cut</text>
<text class="note" x="16" y="430">Programs save to storage so that a restart doesn't lose the work. The orders are made up for teaching.</text>
</svg>
