<svg xmlns="http://www.w3.org/2000/svg" width="680" height="472" viewBox="0 0 680 472" role="img" aria-labelledby="t d">
<title id="t">An auditor's question splits into AWS's half and the bakery's half</title>
<desc id="d">At the top, a box labeled the auditor's question, with arrows to two columns. Left column, AWS's controls, security of the cloud: examples are physical security of data centers, hardware, the global network and each service's own infrastructure; evidence is AWS's audit reports and certificates, such as SOC 2, ISO 27001 and PCI DSS; it comes from AWS Artifact, free. Right column, highlighted, the bakery's controls, security in the cloud: examples are its data and where it lives, who has access, how its services are configured, and its staff; evidence is its own records, such as CloudTrail activity, AWS Config history and rules, IAM access reports, written policies and training records; it comes from the bakery itself. A band across the bottom says: compliant only when both halves are covered.</desc>

