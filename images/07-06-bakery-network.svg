<text class="tiny" x="496" y="368.0">10.0.3.20, port 5432</text>
<text class="tiny" x="496" y="383.0">security group db-sg</text>
<line class="link" x1="264" y1="222" x2="288" y2="222"/>
<text class="note" x="16" y="486.0">Lines show what connects to what. The addresses are made up, from ranges reserved for examples. A real</text>
<text class="note" x="16" y="502.0">shop would also have a load balancer; the simulation leaves it out to keep the path short.</text>
