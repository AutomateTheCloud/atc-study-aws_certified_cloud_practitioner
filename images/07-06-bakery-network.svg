  .chip { fill: var(--ink); font-size: 11.5px; }
  .chipb { fill: var(--ink); font-size: 11.5px; font-weight: 700; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="530" fill="var(--surface)" style="fill:var(--surface)"/>
