<svg xmlns="http://www.w3.org/2000/svg" width="680" height="530" viewBox="0 0 680 530" role="img" aria-labelledby="t d">
<title id="t">The bakery's network for Simulation S8: an internet gateway, a public subnet with the web server and a private subnet with the order database</title>
<desc id="d">On the left, the internet holds three made-up addresses: a customer at 192.0.2.44, a bad range 203.0.113.0/24, and an update site at 192.0.2.200. All connect to the internet gateway on the edge of the VPC, 10.0.0.0/16, in US East (N. Virginia). Inside, Availability Zone a holds two subnets; AZ b holds a matching pair that isn't drawn. The public subnet, 10.0.1.0/24, uses network ACL public-nacl and a route table with 10.0.0.0/16 to local and 0.0.0.0/0 to the internet gateway; it holds the web server, private address 10.0.1.10, public IP 198.51.100.20, security group web-sg. The private subnet, 10.0.3.0/24, uses network ACL private-nacl and a route table with only the local route; it holds the order database at 10.0.3.20, port 5432, security group db-sg. The internet gateway connects to the public subnet. A note says a real shop would also have a load balancer, left out here.</desc>

<style>
