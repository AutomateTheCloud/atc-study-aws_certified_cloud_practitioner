<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img" aria-labelledby="t d">
<title id="t">Map of the bakery's networks and the five kinds of link between them</title>
<desc id="d">Left, outside AWS: the head office, with office computers and the till server, and the owner at home with one laptop. Middle: a band for the public internet. Right, inside AWS: the German VPC in Europe (Frankfurt) at the top, the site VPC in US East (N. Virginia) with the web server and order database in the middle, and a partner's service in the partner's own AWS account at the bottom. A dashed line labeled Site-to-Site VPN, network to network, runs from the head office across the internet band to the site VPC. A dashed line labeled Client VPN, one person's device, runs from the owner's laptop across the internet band to the site VPC. A thick blue line labeled Direct Connect, private line, runs from the head office down and around the internet band, through a Direct Connect location, into the site VPC. A solid line labeled VPC peering, two whole networks, joins the site VPC and the German VPC. A solid arrow labeled PrivateLink, one service only, runs from the site VPC to the partner's service.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --link-fill:#fbe1d6; --prem-fill:#f1f0ec; --net-fill:#ecebe6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --link-fill:#4d2716; --prem-fill:#252523; --net-fill:#262624; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .link { fill: var(--link-fill); stroke: var(--s2); stroke-width: 1.5; }
  .prem { fill: var(--prem-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .net { fill: var(--net-fill); stroke: var(--axis); stroke-width: 1; }
  .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .cellhi { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .cell { fill: var(--prem-fill); stroke: var(--axis); stroke-width: 1; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrlab { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrsub { fill: var(--ink2); font-size: 11px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .flow { stroke: var(--ink); stroke-width: 2; fill: none; }
  .flowp { stroke: var(--s1); stroke-width: 3; fill: none; }
  .flowt { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 8 4; }
  .mesh { stroke: var(--ink2); stroke-width: 1.5; }
  .node { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .hub { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .zero { stroke: var(--s1); stroke-width: 2; }
  .other { fill: var(--muted); }
  .head-ink { fill: var(--ink); }
</style>
<rect width="680" height="580" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Five ways to connect, on one map of the bakery</text>
<text class="sub" x="16" y="48">Dashed lines cross the public internet inside encryption; the thick blue line avoids it</text>
<text class="small" x="96" y="80" text-anchor="middle">Outside AWS</text>
<rect class="prem" x="16" y="150" width="160" height="70" rx="6"/>
