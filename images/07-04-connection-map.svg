<path class="head-ink" d="M380.0,226.0 L371.6,218.6 L369.1,228.3 Z"/>
<text class="arrlab" x="274" y="160" text-anchor="middle">Site-to-Site VPN</text>
<text class="arrsub" x="274" y="174" text-anchor="middle">network to network</text>
<path class="flowt" d="M176.0,352.0 L380.0,280.0"/>
<path class="head-ink" d="M380.0,280.0 L368.9,278.6 L372.2,288.0 Z"/>
<text class="arrlab" x="274" y="352" text-anchor="middle">Client VPN</text>
<text class="arrsub" x="274" y="366" text-anchor="middle">one person's device</text>
<path class="flowp" d="M36.0,220.0 L36.0,461.0 L204.0,461.0"/>
<path class="flowp" d="M344.0,461.0 L366.0,461.0 L366.0,292.0 L380.0,292.0"/>
<text class="arrlab" x="46" y="416">Direct Connect</text>
<text class="arrsub" x="46" y="430">private line</text>
<path class="flow" d="M514.0,146.0 L514.0,200.0"/>
<text class="arrlab" x="524" y="170">VPC peering</text>
<text class="arrsub" x="524" y="184">two whole networks</text>
<path class="flow" d="M514.0,304.0 L514.0,420.0"/>
<path class="head-ink" d="M514.0,420.0 L519.0,410.0 L509.0,410.0 Z"/>
<text class="arrlab" x="524" y="356">PrivateLink</text>
<text class="arrsub" x="524" y="370">one service only</text>
<text class="small" x="16" y="528.0">Dashed: an encrypted VPN tunnel over the public internet. Thick blue: Direct Connect, a dedicated line that</text>
<text class="small" x="16" y="545.0">doesn't use the internet. Thin solid lines: links that stay inside AWS's network.</text>
<text class="note" x="16" y="566">The bakery's networks are made up for teaching. Drawn from AWS documentation checked 2026-10-23.</text>
</svg>
