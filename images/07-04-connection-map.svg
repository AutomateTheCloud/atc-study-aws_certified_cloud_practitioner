<text class="cells" x="96.0" y="184.0" text-anchor="middle">office computers and</text>
<text class="cells" x="96.0" y="198.0" text-anchor="middle">the till server</text>
<rect class="prem" x="64" y="330" width="112" height="56" rx="6"/>
<text class="boxt" x="120.0" y="348" text-anchor="middle">Owner at home</text>
<text class="cells" x="120.0" y="364.0" text-anchor="middle">one laptop</text>
<rect class="net" x="214" y="96" width="120" height="314" rx="8"/>
<text class="boxt" x="274" y="116.0" text-anchor="middle">Public</text>
<text class="boxt" x="274" y="131.0" text-anchor="middle">internet</text>
<rect class="zone" x="356" y="64" width="308" height="440" rx="10"/>
<text class="small" x="510" y="82" text-anchor="middle">AWS</text>
<rect class="aws" x="380" y="94" width="268" height="52" rx="6"/>
<text class="boxt" x="514.0" y="112" text-anchor="middle">German VPC</text>
<text class="cells" x="514.0" y="128.0" text-anchor="middle">Europe (Frankfurt)</text>
<rect class="aws" x="380" y="200" width="268" height="104" rx="6"/>
<text class="boxt" x="514.0" y="218" text-anchor="middle">Site VPC</text>
<text class="cells" x="514.0" y="234.0" text-anchor="middle">US East (N. Virginia)</text>
<text class="cells" x="514.0" y="248.0" text-anchor="middle">web server, order database</text>
<rect class="aws" x="380" y="420" width="268" height="56" rx="6"/>
<text class="boxt" x="514.0" y="438" text-anchor="middle">Partner's service</text>
<text class="cells" x="514.0" y="454.0" text-anchor="middle">in the partner's own AWS account</text>
<rect class="link" x="204" y="436" width="140" height="50" rx="6"/>
<text class="boxt" x="274.0" y="454" text-anchor="middle">Direct Connect</text>
<text class="cells" x="274.0" y="470.0" text-anchor="middle">location</text>
