<svg xmlns="http://www.w3.org/2000/svg" width="680" height="433" viewBox="0 0 680 433" role="img" aria-labelledby="t d">
<title id="t">AWS Security Hub CSPM compared with the newer, unified AWS Security Hub</title>
<desc id="d">Two panels. Left, highlighted: AWS Security Hub CSPM. It was called simply Security Hub until AWS renamed it. It checks your settings against standards: AWS Foundational Security Best Practices, CIS, PCI DSS and NIST. It gives each standard a security score. It collects findings from GuardDuty, Inspector, Macie and partner products in one format. It needs AWS Config recording for most of its checks. It has a 30-day free trial, then bills per check and per finding. Under it: the exam's wording, one place for findings, or check against CIS or PCI DSS. Right: AWS Security Hub, the unified product. It builds on Security Hub CSPM. It correlates signals from Security Hub CSPM, Inspector, GuardDuty, Macie and IAM Access Analyzer, turns related problems into exposure findings with a graph of how an attacker could get in, and adds response workflows and ticketing. Turning it on also turns on Security Hub CSPM. It is priced as an essentials plan plus an optional threat analytics add-on. Under it: the real-work question, which of these problems together put us at risk. An arrow points from left to right: the unified product builds on the original.</desc>

