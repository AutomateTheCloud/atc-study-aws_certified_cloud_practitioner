<svg xmlns="http://www.w3.org/2000/svg" width="680" height="720" viewBox="0 0 680 720" role="img" aria-labelledby="t d">
<title id="t">Seven threats, the layers that stop or limit them, and the controls that find them</title>
<desc id="d">A grid. Rows are seven threats; columns are the six layers (edge, network, compute, data, identity and account, organization) and a last column, finds it. Each filled cell starts with STOPS, LIMITS or FINDS. Network flood: edge stops it with Shield Standard; network limits it, only needed ports open; found by CloudWatch metrics. HTTP request flood: edge stops it with a WAF rate-based rule; compute limits it, Auto Scaling absorbs load; found by a CloudWatch alarm. SQL injection on the order form: edge stops it with WAF managed rules; compute stops it, the bakery's own code checks input; found in WAF logs. Stolen access key: identity and account stops it with MFA and no long-term keys; organization limits it, an SCP caps what it can do; found by GuardDuty and CloudTrail. Unpatched web server: network limits it, few ports reachable; compute stops it with regular patching; found by Inspector. Bucket made public by mistake: data stops it with Block Public Access; organization stops it with organization-wide Block Public Access; found by Macie and a Config rule. Trail switched off to hide activity: organization stops it with an SCP and an organization trail; CloudTrail records the attempt.</desc>

