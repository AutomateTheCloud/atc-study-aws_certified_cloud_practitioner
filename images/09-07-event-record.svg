<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img" aria-labelledby="t d">
<title id="t">A simplified CloudTrail event record for DeleteVpc, with labels for who, when, which service, what, which Region, from where and which resource</title>
<desc id="d">A shortened JSON event record. userIdentity with type IAMUser and userName lab-admin is labeled 'Who did it'. eventTime 2026-10-17T14:32:08Z is labeled 'When (UTC)'. eventSource ec2.amazonaws.com is labeled 'Which service'. eventName DeleteVpc is labeled 'What they did'. awsRegion us-east-1 is labeled 'In which Region'. sourceIPAddress 198.51.100.7 is labeled 'From where'. requestParameters with vpcId vpc-0abc1234example is labeled 'To which resource'. A note says your own record shows your user name, VPC ID and IP address, and to keep the IP address out of anything you share.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --card:#f4f3ef; --tag:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --card:#232322; --tag:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: var(--card); stroke: var(--axis); stroke-width: 1; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--ink); font-size: 12.5px; }
  .tag { fill: var(--tag); stroke: var(--s1); stroke-width: 1.2; }
  .tagt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="456" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">What one CloudTrail event record tells an auditor</text>
<text class="sub" x="16" y="48">A shortened DeleteVpc record. Real records hold more fields; these values are made up.</text>
<rect class="card" x="16" y="66" width="430" height="338" rx="8"/>
<text class="code" x="30" y="88.0" xml:space="preserve">{</text>
<text class="code" x="30" y="111.5" xml:space="preserve">  "userIdentity": {</text>
<text class="code" x="30" y="135.0" xml:space="preserve">    "type": "IAMUser",</text>
<text class="code" x="30" y="158.5" xml:space="preserve">    "userName": "lab-admin"</text>
<line class="lead" x1="440" y1="154.5" x2="470" y2="154.5"/>
<rect class="tag" x="470" y="143.5" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="158.5">Who did it</text>
<text class="code" x="30" y="182.0" xml:space="preserve">  },</text>
<text class="code" x="30" y="205.5" xml:space="preserve">  "eventTime": "2026-10-17T14:32:08Z",</text>
<line class="lead" x1="440" y1="201.5" x2="470" y2="201.5"/>
<rect class="tag" x="470" y="190.5" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="205.5">When (UTC)</text>
<text class="code" x="30" y="229.0" xml:space="preserve">  "eventSource": "ec2.amazonaws.com",</text>
<line class="lead" x1="440" y1="225.0" x2="470" y2="225.0"/>
<rect class="tag" x="470" y="214.0" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="229.0">Which service</text>
<text class="code" x="30" y="252.5" xml:space="preserve">  "eventName": "DeleteVpc",</text>
<line class="lead" x1="440" y1="248.5" x2="470" y2="248.5"/>
<rect class="tag" x="470" y="237.5" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="252.5">What they did</text>
<text class="code" x="30" y="276.0" xml:space="preserve">  "awsRegion": "us-east-1",</text>
<line class="lead" x1="440" y1="272.0" x2="470" y2="272.0"/>
<rect class="tag" x="470" y="261.0" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="276.0">In which Region</text>
<text class="code" x="30" y="299.5" xml:space="preserve">  "sourceIPAddress": "198.51.100.7",</text>
<line class="lead" x1="440" y1="295.5" x2="470" y2="295.5"/>
<rect class="tag" x="470" y="284.5" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="299.5">From where</text>
<text class="code" x="30" y="323.0" xml:space="preserve">  "requestParameters": {</text>
<text class="code" x="30" y="346.5" xml:space="preserve">    "vpcId": "vpc-0abc1234example"</text>
<line class="lead" x1="440" y1="342.5" x2="470" y2="342.5"/>
<rect class="tag" x="470" y="331.5" width="190" height="21" rx="4"/>
<text class="tagt" x="480" y="346.5">To which resource</text>
<text class="code" x="30" y="370.0" xml:space="preserve">  }</text>
<text class="code" x="30" y="393.5" xml:space="preserve">}</text>
<text class="note" x="16" y="428">Your own record shows your user name, your VPC ID and your IP address. Keep the IP address out of anything you share.</text>
</svg>
