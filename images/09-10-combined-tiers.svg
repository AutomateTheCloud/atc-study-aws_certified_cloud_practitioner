<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" aria-labelledby="t d">
<title id="t">S3 Standard storage for three accounts of 30 TB each: $2,119.68 separately, $2,078.72 as one organization</title>
<desc id="d">Two horizontal stacked bars of 92,160 GB each. Three separate accounts: three equal segments of 30,720 GB, all billed at $0.023 per GB-month, total $2,119.68 a month. One organization: 51,200 GB at $0.023 and 40,960 GB at $0.022, total $2,078.72. The difference is $40.96 a month, about 2%. Prices are US East (N. Virginia) as of 2026-10-24; storage only.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --cell:#fcfcfb; --hit:#fbe1d6; --na:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --cell:#1a1a19; --hit:#4d2716; --na:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .cell { fill: var(--cell); stroke: var(--grid); stroke-width: 1; }
  .na { fill: var(--na); stroke: var(--grid); stroke-width: 1; }
  .hit { fill: var(--hit); stroke: var(--ink); stroke-width: 2.5; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .ct { fill: var(--ink); font-size: 11.5px; }
  .ctb { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="292" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Three separate accounts or one organization</text>
<text class="sub" x="16" y="48">30 TB each in S3 Standard, US East (N. Virginia), monthly, prices as of 2026-10-24</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Billed at $0.023 per GB-month (first 50 TB)</text>
<rect class="s2" x="340" y="66" width="12" height="12" rx="2"/>
<text x="358" y="76">Billed at $0.022 (next 450 TB)</text>
<text class="lab" x="190" y="122" text-anchor="end">Three separate accounts</text>
<rect class="s1" x="200.0" y="100" width="108.0" height="34" rx="3"/>
<rect class="s1" x="310.0" y="100" width="108.0" height="34" rx="3"/>
<rect class="s1" x="420.0" y="100" width="108.0" height="34" rx="3"/>
<text class="lab" x="538" y="122">$2,119.68</text>
<text class="tick" x="200" y="150">each account: 30,720 GB, all at the first-tier rate</text>
<text class="lab" x="190" y="202" text-anchor="end">One organization</text>
<rect class="s1" x="200.0" y="180" width="181.3" height="34" rx="3"/>
<rect class="s2" x="383.3" y="180" width="144.7" height="34" rx="3"/>
<text class="lab" x="538" y="202">$2,078.72</text>
<text class="tick" x="200" y="230">combined: 51,200 GB at $0.023, then 40,960 GB at $0.022</text>
<text class="tick" x="16" y="266.0">Difference: $40.96 a month, about 2%. Gaps in the top bar mark the three accounts.</text>
<text class="tick" x="16" y="282.0">1 TB = 1,024 GB. Storage only: requests and data transfer are left out.</text>
</svg>
