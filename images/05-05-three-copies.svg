<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="t d">
<title id="t">Multi-AZ standby, read replica and backups compared</title>
<desc id="d">Three columns compared on five rows. How it's copied: the Multi-AZ standby gets every write synchronously, in another AZ; the read replica gets changes asynchronously and can lag behind; backups are a daily snapshot plus a log of every change, and snapshots are taken when you take them. Answers queries: standby no; read replica yes, read-only; backups no, you restore to a new database first. Takes over by itself: standby yes, by automatic failover, typically one to two minutes; read replica no, you can promote it by hand and lose any lag; backups no, a restore is a new database you switch to. Saves you from a mistaken delete: standby no, the delete reaches it at once; read replica no, it reaches it soon after; backups yes, restore to a moment before the mistake. The job: high availability; read scaling and a disaster recovery option; going back in time. A note says this is for RDS engines other than Aurora; in Aurora a read replica can also be the failover target.</desc>

