<text class="title" x="16" y="28">Standby, read replica, backup: same data, different jobs</text>
<text class="sub" x="16" y="48">Read down a column to see what each copy can and can't do for you</text>
<rect class="pri" x="148" y="66" width="168" height="44" rx="6"/>
<text class="cellt" x="158" y="84.0">Multi-AZ standby</text>
<rect class="pri" x="322" y="66" width="168" height="44" rx="6"/>
<text class="cellt" x="332" y="84.0">Read replica</text>
<rect class="pri" x="496" y="66" width="168" height="44" rx="6"/>
<text class="cellt" x="506" y="84.0">Automated backups</text>
<text class="cellt" x="506" y="100.0">and snapshots</text>
<line class="grid" x1="16" x2="664" y1="118" y2="118"/>
<text class="rowl" x="16" y="137.0">How it's copied</text>
<text class="small" x="158" y="137.0">Every write,</text>
<text class="small" x="158" y="152.0">synchronously, to</text>
<text class="small" x="158" y="167.0">another AZ</text>
<text class="small" x="332" y="137.0">Changes, asynchronously;</text>
<text class="small" x="332" y="152.0">it can lag behind</text>
<text class="small" x="506" y="137.0">A daily snapshot plus a</text>
<text class="small" x="506" y="152.0">log of every change;</text>
<text class="small" x="506" y="167.0">snapshots when you take</text>
<text class="small" x="506" y="182.0">them</text>
<line class="grid" x1="16" x2="664" y1="196" y2="196"/>
<text class="rowl" x="16" y="215.0">Answers queries?</text>
<text class="small" x="158" y="215.0">No (a Multi-AZ DB</text>
<text class="small" x="158" y="230.0">instance's standby</text>
<text class="small" x="158" y="245.0">serves nothing)</text>
<text class="small" x="332" y="215.0">Yes, read-only queries</text>
<text class="small" x="506" y="215.0">No: you restore it to a</text>
<text class="small" x="506" y="230.0">new database first</text>
<line class="grid" x1="16" x2="664" y1="259" y2="259"/>
<text class="rowl" x="16" y="278.0">Takes over by</text>
<text class="rowl" x="16" y="293.0">itself?</text>
<text class="small" x="158" y="278.0">Yes: automatic failover,</text>
<text class="small" x="158" y="293.0">typically 1 to 2 minutes</text>
<text class="small" x="332" y="278.0">No: you can promote it</text>
<text class="small" x="332" y="293.0">by hand, losing any lag</text>
<text class="small" x="506" y="278.0">No: a restore is a new</text>
<text class="small" x="506" y="293.0">database you switch to</text>
<line class="grid" x1="16" x2="664" y1="307" y2="307"/>
<text class="rowl" x="16" y="326.0">Saves you from a</text>
<text class="rowl" x="16" y="341.0">mistaken delete?</text>
<text class="small" x="158" y="326.0">No: the delete reaches</text>
<text class="small" x="158" y="341.0">it at once</text>
<text class="small" x="332" y="326.0">No: the delete reaches</text>
<text class="small" x="332" y="341.0">it soon after</text>
<text class="small" x="506" y="326.0">Yes: restore to a moment</text>
<text class="small" x="506" y="341.0">before the mistake</text>
<line class="grid" x1="16" x2="664" y1="355" y2="355"/>
<text class="rowl" x="16" y="374.0">The job</text>
<text class="cellt" x="158" y="374.0">High availability</text>
<text class="cellt" x="332" y="374.0">Read scaling (and a</text>
<text class="cellt" x="332" y="389.0">disaster recovery</text>
<text class="cellt" x="332" y="404.0">option)</text>
<text class="cellt" x="506" y="374.0">Going back in time</text>
<text class="cellt" x="506" y="389.0">(backup)</text>
<line class="grid" x1="16" x2="664" y1="418" y2="418"/>
