<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" aria-labelledby="t d">
<title id="t">Yearly server cost and lost sales for four ways the bakery could run its site</title>
<desc id="d">Horizontal bar chart. Own 3 servers, today: $5,400 server cost plus about $8,000 lost December sales. Own 6 servers: $10,800. Cloud, renting 6 all year: $10,800. Cloud, renting what each month needs: $3,750.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
</style>
<rect width="680" height="372" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A year for the bakery: server cost and lost sales</text>
<text class="sub" x="16" y="48">Made-up figures: $150 a server-month; about $8,000 of December orders lost with 3 servers</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Server cost</text>
<rect class="s2" x="140" y="66" width="12" height="12" rx="2"/>
<text x="158" y="76">Lost sales</text>
<text class="lab" x="16" y="114">Own 3 servers (today)</text>
<rect class="s1" x="16" y="122" width="167.7" height="20"><title>Own 3 servers (today): $5,400 server cost</title></rect>
<path class="s2" d="M185.7,122.0 L433.1,122.0 Q437.1,122.0 437.1,126.0 L437.1,138.0 Q437.1,142.0 433.1,142.0 L185.7,142.0 Z"><title>Own 3 servers (today): about $8,000 lost sales</title></path>
<text class="lab" x="445.1" y="137">$5,400 + about $8,000 lost</text>
<text class="lab" x="16" y="172">Own 6 servers</text>
<path class="s1" d="M16.0,180.0 L351.4,180.0 Q355.4,180.0 355.4,184.0 L355.4,196.0 Q355.4,200.0 351.4,200.0 L16.0,200.0 Z"><title>Own 6 servers: $10,800 server cost</title></path>
<text class="lab" x="363.4" y="195">$10,800</text>
<text class="lab" x="16" y="230">Cloud, rent 6 all year</text>
<path class="s1" d="M16.0,238.0 L351.4,238.0 Q355.4,238.0 355.4,242.0 L355.4,254.0 Q355.4,258.0 351.4,258.0 L16.0,258.0 Z"><title>Cloud, rent 6 all year: $10,800 server cost</title></path>
<text class="lab" x="363.4" y="253">$10,800</text>
<text class="lab" x="16" y="288">Cloud, rent what each month needs</text>
<path class="s1" d="M16.0,296.0 L129.9,296.0 Q133.9,296.0 133.9,300.0 L133.9,312.0 Q133.9,316.0 129.9,316.0 L16.0,316.0 Z"><title>Cloud, rent what each month needs: $3,750 server cost</title></path>
<text class="lab" x="141.9" y="311">$3,750</text>
<line class="axis" x1="16" x2="16" y1="118" y2="332"/>
</svg>
