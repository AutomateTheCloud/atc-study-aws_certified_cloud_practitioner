<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img" aria-labelledby="t d">
<title id="t">Where the line falls on Amazon EC2, Amazon RDS, AWS Lambda and Amazon S3</title>
<desc id="d">A grid of six layers by four services, with a dashed line separating your layers from AWS's. Your data and who can access it: you, on all four (EC2: your data, permissions and firewall settings; RDS: your data and who can connect; Lambda: your data and the function's role; S3: your data, encryption options and permissions). Your code and how well it runs: EC2, software you install; RDS, query tuning; Lambda, your code and the libraries it uses; S3, none, because no code of yours runs in S3. Platform software: EC2, you install and patch it; RDS, AWS installs and patches it; Lambda, AWS updates the runtime and you move off old ones; S3, AWS runs the platform. Operating system: EC2, you install and patch the guest OS; RDS, AWS; Lambda, AWS patches the servers; S3, AWS. Servers, virtualization and hardware, and buildings, power, cooling and network: AWS on all four. The line sits below the operating system on EC2, and below your code on RDS, Lambda and S3. Sources: the Shared Responsibility Model page for EC2 and S3, the RDS User Guide, and the Lambda Developer Guide.</desc>

