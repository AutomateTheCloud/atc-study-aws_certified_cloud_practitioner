<svg xmlns="http://www.w3.org/2000/svg" width="680" height="372" viewBox="0 0 680 372" role="img" aria-labelledby="t d">
<title id="t">A Multi-AZ failover in three numbered frames</title>
<desc id="d">Three frames side by side. Frame 1, before, normal running: the website uses the database name orders-db, which points at the primary in AZ A; every write reaches the standby in AZ B synchronously. Frame 2, the failure: AZ A fails and the primary is marked failed; RDS detects the failure and promotes the standby, with no one having to act; the name is being moved. Frame 3, after, typically one to two minutes later: the old primary in AZ A is still failed, the former standby in AZ B is now the primary, and the website reconnects to the same name, which now points at AZ B. A note says RDS doesn't fail over for slow queries or corrupted data.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --pri-fill:#d9e8fb; --copy-fill:#f1f0ec; --bad-fill:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --pri-fill:#1b3554; --copy-fill:#252523; --bad-fill:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .pri { fill: var(--pri-fill); stroke: var(--s1); stroke-width: 1.5; }
  .copy { fill: var(--copy-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .bad { fill: var(--bad-fill); stroke: var(--s2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .region { fill: none; stroke: var(--ink2); stroke-width: 1.2; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .q { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .arrlab { fill: var(--ink2); font-size: 11.5px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .num { fill: var(--ink); font-size: 14px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
</style>
<rect width="680" height="372" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A Multi-AZ failover in three frames</text>
<text class="sub" x="16" y="48">The website keeps using the same database name; RDS changes where the name points</text>
<circle class="numc" cx="28" cy="74" r="11"/>
<text class="num" x="28" y="79" text-anchor="middle">1</text>
<text class="cellt" x="46" y="79">Before</text>
<text class="small" x="16" y="102">Normal running</text>
<rect class="copy" x="60" y="138" width="120" height="30" rx="15"/>
<text class="cellt" x="120.0" y="158" text-anchor="middle">orders-db</text>
<text class="zlab" x="120.0" y="134" text-anchor="middle">the database name the site uses</text>
<rect class="pri" x="16" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="24" y="232.0">Primary</text>
<text class="zlab" x="24" y="262">AZ A</text>
<rect class="copy" x="130" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="138" y="232.0">Standby</text>
<text class="zlab" x="138" y="262">AZ B</text>
<line class="arrow" x1="120.0" y1="169.0" x2="63.0" y2="210.0"/>
<path class="arrowhead" d="M72.4,209.4 L66.6,201.3 L63.0,210.0 Z"/>
<line class="arrow" x1="111.0" y1="241.0" x2="129.0" y2="241.0"/>
<path class="arrowhead" d="M121.0,236.0 L121.0,246.0 L129.0,241.0 Z"/>
<text class="small" x="16" y="292.0">Every write reaches both,</text>
<text class="small" x="16" y="307.0">synchronously.</text>
<circle class="numc" cx="248" cy="74" r="11"/>
<text class="num" x="248" y="79" text-anchor="middle">2</text>
<text class="cellt" x="266" y="79">The failure</text>
<text class="small" x="236" y="102">AZ A fails</text>
<rect class="copy" x="280" y="138" width="120" height="30" rx="15"/>
<text class="cellt" x="340.0" y="158" text-anchor="middle">orders-db</text>
<text class="zlab" x="340.0" y="134" text-anchor="middle">the database name the site uses</text>
<rect class="bad" x="236" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="244" y="232.0">Primary:</text>
<text class="cellt" x="244" y="247.0">failed</text>
<text class="zlab" x="244" y="262">AZ A</text>
<rect class="copy" x="350" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="358" y="232.0">Standby</text>
<text class="zlab" x="358" y="262">AZ B</text>
<text class="arrlab" x="340.0" y="192" text-anchor="middle">name being moved</text>
<text class="small" x="236" y="292.0">RDS detects the failure and</text>
<text class="small" x="236" y="307.0">promotes the standby. No one has</text>
<text class="small" x="236" y="322.0">to act.</text>
<circle class="numc" cx="468" cy="74" r="11"/>
<text class="num" x="468" y="79" text-anchor="middle">3</text>
<text class="cellt" x="486" y="79">After</text>
<text class="small" x="456" y="102">Typically 1 to 2 minutes later</text>
<rect class="copy" x="500" y="138" width="120" height="30" rx="15"/>
<text class="cellt" x="560.0" y="158" text-anchor="middle">orders-db</text>
<text class="zlab" x="560.0" y="134" text-anchor="middle">the database name the site uses</text>
<rect class="bad" x="456" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="464" y="232.0">Old primary:</text>
<text class="cellt" x="464" y="247.0">failed</text>
<text class="zlab" x="464" y="262">AZ A</text>
<rect class="pri" x="570" y="212" width="94" height="58" rx="6"/>
<text class="cellt" x="578" y="232.0">Primary now</text>
<text class="zlab" x="578" y="262">AZ B</text>
<line class="arrow" x1="560.0" y1="169.0" x2="617.0" y2="210.0"/>
<path class="arrowhead" d="M613.4,201.3 L607.6,209.4 L617.0,210.0 Z"/>
<text class="small" x="456" y="292.0">The website reconnects to the</text>
<text class="small" x="456" y="307.0">same name, now pointing at AZ B.</text>
<text class="note" x="16" y="342">Failover time from the Amazon RDS FAQ (checked 2026-10-23): typically one to two minutes from detecting</text>
<text class="note" x="16" y="358">the failure to transactions resuming. RDS doesn't fail over for slow queries or corrupted data.</text>
</svg>
