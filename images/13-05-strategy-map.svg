<text class="chip" x="650.0" y="193.0" text-anchor="middle">rehost</text>
<line class="flow" x1="26" x2="686" y1="264" y2="264" marker-end="url(#arr)"/>
<text class="small" x="26" y="284">Less change to the application</text>
<text class="small" x="686" y="284" text-anchor="end">More change</text>
<text class="note" x="16" y="310.0">The applications are made up. Repurchase replaces the application with a product; only its data moves. The</text>
<text class="note" x="16" y="326.0">wholesale portal moves as it is first and is refactored once it runs on AWS.</text>
</svg>
