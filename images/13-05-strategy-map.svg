<text class="chip" x="258.0" y="148.0" text-anchor="middle">Stock and</text>
<text class="chip" x="258.0" y="163.0" text-anchor="middle">ordering</text>
<text class="boxt" x="356.0" y="116" text-anchor="middle">Relocate</text>
<rect class="card" x="314" y="130" width="84" height="29" rx="5"/>
<text class="chip" x="356.0" y="148.0" text-anchor="middle">Shop tools</text>
<text class="boxt" x="454.0" y="116" text-anchor="middle">Replatform</text>
<rect class="card" x="412" y="130" width="84" height="44" rx="5"/>
<text class="chip" x="454.0" y="148.0" text-anchor="middle">Loyalty</text>
<text class="chip" x="454.0" y="163.0" text-anchor="middle">database</text>
<rect class="card" x="412" y="182" width="84" height="44" rx="5"/>
<text class="chip" x="454.0" y="200.0" text-anchor="middle">Chain</text>
<text class="chip" x="454.0" y="215.0" text-anchor="middle">website</text>
<text class="boxt" x="552.0" y="116" text-anchor="middle">Repurchase</text>
<rect class="card" x="510" y="130" width="84" height="44" rx="5"/>
<text class="chip" x="552.0" y="148.0" text-anchor="middle">Email and</text>
<text class="chip" x="552.0" y="163.0" text-anchor="middle">calendars</text>
<rect class="card" x="510" y="182" width="84" height="29" rx="5"/>
<text class="chip" x="552.0" y="200.0" text-anchor="middle">Payroll</text>
<text class="boxt" x="650.0" y="116" text-anchor="middle">Refactor</text>
<rect class="card" x="608" y="130" width="84" height="74" rx="5"/>
<text class="chip" x="650.0" y="148.0" text-anchor="middle">Wholesale</text>
<text class="chip" x="650.0" y="163.0" text-anchor="middle">portal,</text>
