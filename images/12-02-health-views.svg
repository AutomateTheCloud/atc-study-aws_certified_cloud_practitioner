<svg xmlns="http://www.w3.org/2000/svg" width="700" height="452" viewBox="0 0 700 452" role="img" aria-labelledby="t d">
<title id="t">AWS Health: one dashboard with two views, plus EventBridge and the Health API</title>
<desc id="d">An outer box, AWS Health: events on AWS's side that can affect you. Inside it, highlighted, the AWS Health Dashboard, free for every customer with no setup, holds two views. Service health: public events for all services and Regions, with no sign-in and no account needed, and 12 months of service history; its older name was Service Health Dashboard. Your account health: after you sign in, events that affect your own resources, such as planned maintenance on an instance you run, plus the public events; its older name was Personal Health Dashboard. Below the dashboard, two feeds. Amazon EventBridge sends Health events to your own rules and tools, free for every customer. The AWS Health API lets your programs ask AWS Health directly; it needs Business Support+, Enterprise or Unified Operations, and on Basic it refuses the call. AWS announced the single dashboard on 2022-02-28. Checked 2026-10-24.</desc>

