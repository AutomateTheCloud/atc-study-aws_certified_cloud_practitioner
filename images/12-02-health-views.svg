<rect width="700" height="452" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">AWS Health: one dashboard with two views, and two feeds</text>
<text class="sub" x="16" y="48">The two old dashboard names are now the two views of one dashboard. Checked 2026-10-24</text>
<rect class="plain" x="16" y="66" width="668" height="332" rx="8"/>
<text class="boxt" x="30" y="90">AWS Health: events on AWS's side that can affect you</text>
<rect class="hi" x="30" y="104" width="640" height="168" rx="6"/>
<text class="boxt" x="44" y="128">AWS Health Dashboard: free for every customer, no setup</text>
<rect class="n" x="44" y="140" width="300" height="118" rx="6"/>
<text class="boxt" x="54" y="162">Service health</text>
<text class="cells" x="54" y="180">• Public events for all services and Regions</text>
<text class="cells" x="54" y="199">• No sign-in, no account needed</text>
<text class="cells" x="54" y="218">• Service history: the last 12 months</text>
<text class="cells" x="54" y="237">• Older name: Service Health Dashboard</text>
<rect class="n" x="356" y="140" width="300" height="118" rx="6"/>
<text class="boxt" x="366" y="162">Your account health</text>
<text class="cells" x="366" y="180">• After you sign in: events that affect your</text>
<text class="cells" x="375" y="195">own resources, such as planned maintenance</text>
<text class="cells" x="375" y="210">on an instance you run</text>
<text class="cells" x="366" y="229">• Also shows the public events</text>
<text class="cells" x="366" y="248">• Older name: Personal Health Dashboard</text>
<rect class="n" x="30" y="286" width="312" height="96" rx="6"/>
<text class="boxt" x="40" y="308">Amazon EventBridge</text>
<text class="cells" x="40" y="326">• Sends Health events to your own rules and</text>
<text class="cells" x="49" y="341">tools</text>
<text class="cells" x="40" y="360">• Free for every customer</text>
<rect class="n" x="358" y="286" width="312" height="96" rx="6"/>
<text class="boxt" x="368" y="308">AWS Health API</text>
<text class="cells" x="368" y="326">• Your programs ask AWS Health directly</text>
<text class="cells" x="368" y="345">• Business Support+, Enterprise or Unified</text>
<text class="cells" x="377" y="360">Operations; on Basic it refuses the call</text>
<text class="note" x="16" y="420.0">AWS announced one dashboard bringing the two older ones together on 2022-02-28. From What is AWS Health?, the</text>
<text class="note" x="16" y="435.0">Service health page and AWS's What's New post.</text>
</svg>
