<svg xmlns="http://www.w3.org/2000/svg" width="680" height="463" viewBox="0 0 680 463" role="img" aria-labelledby="t d">
<title id="t">AWS managed, customer managed and inline policies compared</title>
<desc id="d">Three cards. The AWS managed and customer managed cards each show one standalone policy attached to a user, a group and a role. The inline card shows a policy drawn inside one role. The customer managed card is highlighted. AWS managed: written by AWS; editable: no; attaches to many users, groups and roles, in any account; when the identity is deleted: stays; it belongs to aws; example: AdministratorAccess (primer page 03). Customer managed: written by You; editable: yes; attaches to many users, groups and roles in your account; when the identity is deleted: stays, ready to reuse; example: The bakery's photo-bucket policy. Inline: written by You; editable: yes; attaches to exactly one user, group or role; when the identity is deleted: deleted with it; example: A one-off exception for one role.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: none; stroke: var(--axis); stroke-width: 1; }
  .card-s1 { fill: none; stroke: var(--s1); stroke-width: 2; }
  .codebg { fill: none; stroke: var(--axis); stroke-width: 1; }
  .code { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: var(--ink); font-size: 12px; }
  .code-dim { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; fill: var(--muted); font-size: 12px; }
  .brace { stroke: var(--s1); stroke-width: 2; fill: none; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .box { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
  .box-s1 { fill: var(--surface); stroke: var(--s1); stroke-width: 2; }
  .attach { stroke: var(--muted); stroke-width: 1.5; fill: none; }
</style>
<rect width="680" height="463" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Three kinds of identity-based policy</text>
<text class="sub" x="16" y="48">Managed policies stand alone and attach to many identities; an inline policy lives inside one</text>
<rect class="card" x="16" y="66" width="210" height="385" rx="8"/>
<text class="name" x="30" y="92">AWS managed</text>
<rect class="box" x="71.0" y="106" width="100" height="26" rx="4"/>
<text class="small" x="121.0" y="123" text-anchor="middle">Policy</text>
<path class="attach" d="M121.0,132 L58,170"/>
<rect class="box" x="30" y="170" width="56" height="26" rx="4"/>
<text class="small" x="58" y="187" text-anchor="middle">User</text>
<path class="attach" d="M121.0,132 L120,170"/>
<rect class="box" x="92" y="170" width="56" height="26" rx="4"/>
<text class="small" x="120" y="187" text-anchor="middle">Group</text>
<path class="attach" d="M121.0,132 L182,170"/>
<rect class="box" x="154" y="170" width="56" height="26" rx="4"/>
<text class="small" x="182" y="187" text-anchor="middle">Role</text>
<text class="key" x="30" y="218">WHO WRITES IT</text>
<text class="lab" x="30" y="234.0">AWS</text>
<text class="key" x="30" y="257">CAN YOU EDIT IT?</text>
<text class="lab" x="30" y="273.0">No</text>
<text class="key" x="30" y="296">ATTACHES TO</text>
<text class="lab" x="30" y="312.0">Many users, groups and</text>
<text class="lab" x="30" y="327.0">roles, in any account</text>
<text class="key" x="30" y="350">WHEN THE IDENTITY IS DELETED</text>
<text class="lab" x="30" y="366.0">Stays; it belongs to AWS</text>
<text class="key" x="30" y="389">EXAMPLE</text>
<text class="lab" x="30" y="405.0">AdministratorAccess (primer</text>
<text class="lab" x="30" y="420.0">page 03)</text>
<rect class="card-s1" x="235" y="66" width="210" height="385" rx="8"/>
<text class="name" x="249" y="92">Customer managed</text>
<rect class="box-s1" x="290.0" y="106" width="100" height="26" rx="4"/>
<text class="small" x="340.0" y="123" text-anchor="middle">Policy</text>
<path class="attach" d="M340.0,132 L277,170"/>
<rect class="box" x="249" y="170" width="56" height="26" rx="4"/>
<text class="small" x="277" y="187" text-anchor="middle">User</text>
<path class="attach" d="M340.0,132 L339,170"/>
<rect class="box" x="311" y="170" width="56" height="26" rx="4"/>
<text class="small" x="339" y="187" text-anchor="middle">Group</text>
<path class="attach" d="M340.0,132 L401,170"/>
<rect class="box" x="373" y="170" width="56" height="26" rx="4"/>
<text class="small" x="401" y="187" text-anchor="middle">Role</text>
<text class="key" x="249" y="218">WHO WRITES IT</text>
<text class="lab" x="249" y="234.0">You</text>
<text class="key" x="249" y="257">CAN YOU EDIT IT?</text>
<text class="lab" x="249" y="273.0">Yes</text>
<text class="key" x="249" y="296">ATTACHES TO</text>
<text class="lab" x="249" y="312.0">Many users, groups and roles</text>
<text class="lab" x="249" y="327.0">in your account</text>
<text class="key" x="249" y="350">WHEN THE IDENTITY IS DELETED</text>
<text class="lab" x="249" y="366.0">Stays, ready to reuse</text>
<text class="key" x="249" y="389">EXAMPLE</text>
<text class="lab" x="249" y="405.0">The bakery's photo-bucket</text>
<text class="lab" x="249" y="420.0">policy</text>
<rect class="card" x="454" y="66" width="210" height="385" rx="8"/>
<text class="name" x="468" y="92">Inline</text>
<rect class="box" x="489.0" y="106" width="140" height="90" rx="6"/>
<text class="small" x="559.0" y="124" text-anchor="middle">One role</text>
<rect class="box" x="509.0" y="146" width="100" height="26" rx="4"/>
<text class="small" x="559.0" y="163" text-anchor="middle">Policy inside</text>
<text class="key" x="468" y="218">WHO WRITES IT</text>
<text class="lab" x="468" y="234.0">You</text>
<text class="key" x="468" y="257">CAN YOU EDIT IT?</text>
<text class="lab" x="468" y="273.0">Yes</text>
<text class="key" x="468" y="296">ATTACHES TO</text>
<text class="lab" x="468" y="312.0">Exactly one user, group or</text>
<text class="lab" x="468" y="327.0">role</text>
<text class="key" x="468" y="350">WHEN THE IDENTITY IS DELETED</text>
<text class="lab" x="468" y="366.0">Deleted with it</text>
<text class="key" x="468" y="389">EXAMPLE</text>
<text class="lab" x="468" y="405.0">A one-off exception for one</text>
<text class="lab" x="468" y="420.0">role</text>
</svg>
