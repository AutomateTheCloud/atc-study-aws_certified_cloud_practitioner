<svg xmlns="http://www.w3.org/2000/svg" width="700" height="442" viewBox="0 0 700 442" role="img" aria-labelledby="t d">
<title id="t">Days an object spent in a storage class compared with days billed, for three made-up cases</title>
<desc id="d">Paired horizontal bars on a scale of 0 to 360 days. Case A, a rule that moves objects to Glacier Flexible Retrieval at day 30 and expires them at day 60: 30 days in the class, 90 days billed. Case B, an object uploaded straight to Glacier Deep Archive and deleted at day 60: 60 days in the class, 180 billed. Case C, a rule that moves objects to Standard-IA at day 30 and expires them at day 365: 335 days in the class, 335 billed, because the stay passed the 30-day minimum.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hot:#86b6ef; --warm:#3987e5; --cold:#184f95; --panel:#f1f0ec; --it:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hot:#184f95; --warm:#2a78d6; --cold:#86b6ef; --panel:#252523; --it:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hot { fill: var(--hot); } .warm { fill: var(--warm); } .cold { fill: var(--cold); }
  .it { fill: var(--it); stroke: var(--s1); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: var(--panel); }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .evline { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
  .brk { stroke: var(--surface); stroke-width: 4; }
  .brk2 { stroke: var(--ink2); stroke-width: 1.2; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="700" height="442" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">The minimum stay: days in the class vs days billed</text>
<text class="sub" x="16" y="48">Three made-up cases. When the first bar is shorter than the second, you pay for days you didn't use.</text>
<rect class="s1" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Days the object spent in the class</text>
<rect class="s2" x="290" y="66" width="12" height="12" rx="2"/>
<text x="308" y="76">Days billed in that class</text>
<line class="grid" x1="300.0" x2="300.0" y1="96" y2="320"/>
<text class="tick" x="300.0" y="336" text-anchor="middle">0</text>
<line class="grid" x1="382.5" x2="382.5" y1="96" y2="320"/>
<text class="tick" x="382.5" y="336" text-anchor="middle">90</text>
<line class="grid" x1="465.0" x2="465.0" y1="96" y2="320"/>
<text class="tick" x="465.0" y="336" text-anchor="middle">180</text>
<line class="grid" x1="547.5" x2="547.5" y1="96" y2="320"/>
<text class="tick" x="547.5" y="336" text-anchor="middle">270</text>
<line class="grid" x1="630.0" x2="630.0" y1="96" y2="320"/>
<text class="tick" x="630.0" y="336" text-anchor="middle">360</text>
<text class="tick" x="630.0" y="352" text-anchor="end">days</text>
<text class="small" x="16" y="118.0">A. Rule: to Glacier Flexible Retrieval</text>
<text class="small" x="16" y="134.0">at day 30, expire at day 60</text>
<path class="s1" d="M300.0,104.0 L323.5,104.0 Q327.5,104.0 327.5,108.0 L327.5,118.0 Q327.5,122.0 323.5,122.0 L300.0,122.0 Z"/>
<text class="val" x="333.5" y="118">30</text>
<path class="s2" d="M300.0,126.0 L378.5,126.0 Q382.5,126.0 382.5,130.0 L382.5,140.0 Q382.5,144.0 378.5,144.0 L300.0,144.0 Z"/>
<text class="val" x="388.5" y="140">90</text>
<text class="small" x="16" y="196.0">B. Uploaded straight to Glacier</text>
<text class="small" x="16" y="212.0">Deep Archive, deleted at day 60</text>
<path class="s1" d="M300.0,182.0 L351.0,182.0 Q355.0,182.0 355.0,186.0 L355.0,196.0 Q355.0,200.0 351.0,200.0 L300.0,200.0 Z"/>
<text class="val" x="361.0" y="196">60</text>
<path class="s2" d="M300.0,204.0 L461.0,204.0 Q465.0,204.0 465.0,208.0 L465.0,218.0 Q465.0,222.0 461.0,222.0 L300.0,222.0 Z"/>
<text class="val" x="471.0" y="218">180</text>
<text class="small" x="16" y="274.0">C. Rule: to Standard-IA at day 30,</text>
<text class="small" x="16" y="290.0">expire at day 365</text>
<path class="s1" d="M300.0,260.0 L603.1,260.0 Q607.1,260.0 607.1,264.0 L607.1,274.0 Q607.1,278.0 603.1,278.0 L300.0,278.0 Z"/>
<text class="val" x="613.1" y="274">335</text>
<path class="s2" d="M300.0,282.0 L603.1,282.0 Q607.1,282.0 607.1,286.0 L607.1,296.0 Q607.1,300.0 603.1,300.0 L300.0,300.0 Z"/>
<text class="val" x="613.1" y="296">335</text>
<text class="small" x="16" y="374.0">A: 30 days in Glacier Flexible Retrieval, billed 90. B: 60 days in Deep Archive, billed 180. C: 335 days in</text>
<text class="small" x="16" y="391.0">Standard-IA, past its 30-day minimum, so no extra charge.</text>
<text class="note" x="16" y="412">Minimum stays from the S3 User Guide storage class table, checked 2026-10-23.</text>
<text class="note" x="16" y="428">An early deletion is billed pro rata for the rest of the minimum stay.</text>
</svg>
