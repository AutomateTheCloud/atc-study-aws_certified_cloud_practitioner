<svg xmlns="http://www.w3.org/2000/svg" width="680" height="469" viewBox="0 0 680 469" role="img" aria-labelledby="t d">
<title id="t">The six pillars of the Well-Architected Framework, each as one question</title>
<desc id="d">Six cards in three rows of two, each with a pillar's ID prefix, name and question. Row 1, generally not traded away against the other pillars: Operational excellence (OPS): Can we run this well day to day, see what it is doing, and keep improving how we work? Security (SEC): Are the data, systems and accounts protected? Row 2, sound alike because both care about capacity: Reliability (REL): Does it do its job correctly whenever it is needed, and recover when something fails? Performance efficiency (PERF): Are we using the right kind and amount of resources to meet our needs, as demand and technology change? Row 3, usually point the same way because waste costs money and energy at once: Cost optimization (COST): Does it deliver its value at the lowest cost? Sustainability (SUS): Are we using as few resources, and as little energy, as we can?</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: none; stroke: var(--axis); stroke-width: 1; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .pill { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
  .pill-s1 { fill: var(--surface); stroke: var(--s1); stroke-width: 2; }
  .tag { fill: var(--ink2); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .rowlab { fill: var(--ink2); font-size: 12px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .track { stroke: var(--axis); stroke-width: 2; stroke-linecap: round; }
  .knob { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
</style>
