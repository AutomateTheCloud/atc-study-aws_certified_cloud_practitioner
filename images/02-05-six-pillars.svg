<rect class="card" x="344" y="363" width="320" height="84" rx="8"/>
<rect class="pill" x="358" y="376" width="33" height="20" rx="10"/>
<text class="tag" x="374.5" y="390" text-anchor="middle">SUS</text>
<text class="name" x="399" y="391">Sustainability</text>
<text class="lab" x="358" y="417.0">Are we using as few resources, and as little</text>
<text class="lab" x="358" y="434.0">energy, as we can?</text>
</svg>
