<svg xmlns="http://www.w3.org/2000/svg" width="680" height="566" viewBox="0 0 680 566" role="img" aria-labelledby="t d">
<title id="t">Which AWS protection stops which kind of attack</title>
<desc id="d">A grid of six needs against five protections: Shield Standard, Shield Advanced, AWS WAF, network ACL or security group, and Firewall Manager. Flood of network traffic (SYN flood, UDP reflection): Shield Standard, Main: automatic; Shield Advanced, Adds detection, experts, bill protection; AWS WAF, No: not web requests; Network ACL or security group, No: not built for floods; Firewall Manager, No. Flood of web requests from many addresses: Shield Standard, No: not this layer; Shield Advanced, Adds automatic mitigation through WAF; AWS WAF, Main: rate-based rule; Network ACL or security group, No: can't read requests; Firewall Manager, No. SQL injection or cross-site scripting in a form: Shield Standard, No; Shield Advanced, No; AWS WAF, Main: managed rule groups; Network ACL or security group, No: can't read requests; Firewall Manager, No. Requests from one bad address range: Shield Standard, No; Shield Advanced, No; AWS WAF, Main: IP set rule, for web traffic; Network ACL or security group, Main: network ACL deny, for a subnet; Firewall Manager, No. The same rules in all of a company's accounts: Shield Standard, No; Shield Advanced, No; AWS WAF, One account at a time; Network ACL or security group, One VPC at a time; Firewall Manager, Main: one policy for all. Expert help and bill protection during a big attack: Shield Standard, No; Shield Advanced, Main: SRT and cost protection; AWS WAF, No; Network ACL or security group, No; Firewall Manager, No.</desc>

