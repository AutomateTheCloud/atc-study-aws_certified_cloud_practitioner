<rect width="680" height="489" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Three kinds of Storage Gateway, one idea: local access, data in AWS</text>
<text class="sub" x="16" y="48">The app keeps the protocol it already speaks; the gateway turns it into AWS storage</text>
<text class="cellt" x="120.0" y="74" text-anchor="middle">S3 File Gateway</text>
<rect class="prem" x="16.0" y="86.0" width="208.0" height="46.0" rx="6"/>
<text class="cellt" x="26" y="105.0">In the shop</text>
<text class="cells" x="26" y="122.0">File-sharing apps and users</text>
<line class="arrow" x1="120.0" y1="134.0" x2="120.0" y2="166.0"/>
<path class="arrowhead" d="M115.0,158.0 L125.0,158.0 L120.0,166.0 Z"/>
<text class="arrlab" x="128.0" y="154.0">files: NFS or SMB</text>
<rect class="link" x="16.0" y="168.0" width="208.0" height="79.0" rx="6"/>
<text class="cellt" x="26" y="187.0">The gateway (on premises)</text>
<text class="cells" x="26" y="204.0">Keeps: recently used files, in</text>
<text class="cells" x="26" y="219.0">a local cache</text>
<line class="arrow" x1="120.0" y1="249.0" x2="120.0" y2="281.0"/>
<path class="arrowhead" d="M115.0,273.0 L125.0,273.0 L120.0,281.0 Z"/>
<text class="arrlab" x="128.0" y="269.0">over the network</text>
<rect class="aws" x="16.0" y="283.0" width="208.0" height="94.0" rx="6"/>
<text class="cellt" x="26" y="302.0">In AWS</text>
<text class="cells" x="26" y="319.0">Objects in an S3 bucket,</text>
<text class="cells" x="26" y="334.0">readable with normal S3 tools</text>
<text class="rowl" x="16" y="399">Typical need</text>
<text class="small" x="16" y="415.0">Keep a shared folder, store</text>
<text class="small" x="16" y="430.0">the files in S3</text>
<text class="cellt" x="340.0" y="74" text-anchor="middle">Volume Gateway</text>
<rect class="prem" x="236.0" y="86.0" width="208.0" height="46.0" rx="6"/>
<text class="cellt" x="246" y="105.0">In the shop</text>
<text class="cells" x="246" y="122.0">Servers that need disks</text>
<line class="arrow" x1="340.0" y1="134.0" x2="340.0" y2="166.0"/>
<path class="arrowhead" d="M335.0,158.0 L345.0,158.0 L340.0,166.0 Z"/>
<text class="arrlab" x="348.0" y="154.0">disk blocks: iSCSI</text>
<rect class="link" x="236.0" y="168.0" width="208.0" height="79.0" rx="6"/>
<text class="cellt" x="246" y="187.0">The gateway (on premises)</text>
<text class="cells" x="246" y="204.0">Keeps: cached mode, frequently</text>
<text class="cells" x="246" y="219.0">used data; stored mode, the</text>
<text class="cells" x="246" y="234.0">whole dataset</text>
<line class="arrow" x1="340.0" y1="249.0" x2="340.0" y2="281.0"/>
<path class="arrowhead" d="M335.0,273.0 L345.0,273.0 L340.0,281.0 Z"/>
<text class="arrlab" x="348.0" y="269.0">over the network</text>
<rect class="aws" x="236.0" y="283.0" width="208.0" height="94.0" rx="6"/>
<text class="cellt" x="246" y="302.0">In AWS</text>
<text class="cells" x="246" y="319.0">Cached mode: the data itself,</text>
<text class="cells" x="246" y="334.0">in S3. Stored mode:</text>
<text class="cells" x="246" y="349.0">point-in-time copies, as EBS</text>
<text class="cells" x="246" y="364.0">snapshots</text>
<text class="rowl" x="236" y="399">Typical need</text>
<text class="small" x="236" y="415.0">Cloud-backed disks, or</text>
<text class="small" x="236" y="430.0">off-site copies of local disks</text>
<text class="cellt" x="560.0" y="74" text-anchor="middle">Tape Gateway</text>
<rect class="prem" x="456.0" y="86.0" width="208.0" height="46.0" rx="6"/>
<text class="cellt" x="466" y="105.0">In the shop</text>
<text class="cells" x="466" y="122.0">Existing backup software</text>
<line class="arrow" x1="560.0" y1="134.0" x2="560.0" y2="166.0"/>
<path class="arrowhead" d="M555.0,158.0 L565.0,158.0 L560.0,166.0 Z"/>
<text class="arrlab" x="568.0" y="154.0">tapes: iSCSI</text>
<rect class="link" x="456.0" y="168.0" width="208.0" height="79.0" rx="6"/>
<text class="cellt" x="466" y="187.0">The gateway (on premises)</text>
<text class="cells" x="466" y="204.0">Keeps: recently used tapes, in</text>
<text class="cells" x="466" y="219.0">a local cache</text>
<line class="arrow" x1="560.0" y1="249.0" x2="560.0" y2="281.0"/>
<path class="arrowhead" d="M555.0,273.0 L565.0,273.0 L560.0,281.0 Z"/>
<text class="arrlab" x="568.0" y="269.0">over the network</text>
<rect class="aws" x="456.0" y="283.0" width="208.0" height="94.0" rx="6"/>
<text class="cellt" x="466" y="302.0">In AWS</text>
<text class="cells" x="466" y="319.0">Virtual tapes in S3, archived</text>
<text class="cells" x="466" y="334.0">to S3 Glacier Flexible</text>
<text class="cells" x="466" y="349.0">Retrieval or Deep Archive</text>
<text class="rowl" x="456" y="399">Typical need</text>
<text class="small" x="456" y="415.0">Replace physical tapes without</text>
<text class="small" x="456" y="430.0">changing the backup jobs</text>
