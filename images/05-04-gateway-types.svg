<svg xmlns="http://www.w3.org/2000/svg" width="680" height="489" viewBox="0 0 680 489" role="img" aria-labelledby="t d">
<title id="t">Three kinds of AWS Storage Gateway: what stays on premises and where the data lands</title>
<desc id="d">Three columns, each a flow from top to bottom. S3 File Gateway: file-sharing apps and users in the shop send files over NFS or SMB to the gateway on premises, which keeps recently used files in a local cache and stores them over the network as objects in an S3 bucket, readable with normal S3 tools; typical need: keep a shared folder and store the files in S3. Volume Gateway: servers that need disks send block volumes over iSCSI; in cached mode the gateway keeps frequently used data and the data itself lives in S3; in stored mode the gateway keeps the whole dataset and AWS holds point-in-time copies as EBS snapshots; typical need: cloud-backed disks or off-site copies of local disks. Tape Gateway: existing backup software sends virtual tapes over iSCSI; the gateway caches recently used tapes; tapes are stored in S3 and archived to S3 Glacier Flexible Retrieval or Deep Archive; typical need: replace physical tapes without changing the backup jobs. A note says Amazon FSx File Gateway has been closed to new customers since 2024-10-28.</desc>

