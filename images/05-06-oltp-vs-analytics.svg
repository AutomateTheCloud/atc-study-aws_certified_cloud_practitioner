  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .pane { fill: var(--tint); stroke: var(--s1); stroke-width: 1.5; }
  .pane2 { fill: var(--tint2); stroke: var(--s2); stroke-width: 1.5; }
  .ico { fill: none; stroke: var(--s1); stroke-width: 1.5; }
  .icof { fill: var(--s1-light); stroke: var(--s1); stroke-width: 1.2; }
  .icot { fill: var(--ink2); font-size: 10.5px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .svc { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .ann { fill: var(--ink); font-size: 12px; }
</style>
<rect width="680" height="337" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A database that runs the shop vs a warehouse that studies it</text>
<text class="sub" x="16" y="48">Both use SQL; they are built for opposite kinds of work</text>
<rect class="pane" x="156" y="66" width="252" height="50" rx="6"/>
<text class="cellt" x="166" y="86">Running the shop: transactional</text>
<text class="cells" x="166" y="104">Amazon RDS or Amazon Aurora</text>
<rect class="pane2" x="416" y="66" width="252" height="50" rx="6"/>
<text class="cellt" x="426" y="86">Studying the business: analytics</text>
<text class="cells" x="426" y="104">Amazon Redshift</text>
<line class="grid" x1="16" x2="668" y1="124" y2="124"/>
<text class="rowl" x="16" y="143.0">A typical request</text>
<text class="small" x="166" y="143.0">"Save order 1042." "Change this</text>
<text class="small" x="166" y="158.0">customer's address."</text>
<text class="small" x="426" y="143.0">"Total sales by month and product, for</text>
<text class="small" x="426" y="158.0">three years."</text>
<line class="grid" x1="16" x2="668" y1="172" y2="172"/>
<text class="rowl" x="16" y="191.0">Each request touches</text>
<text class="small" x="166" y="191.0">A few rows at a time, in milliseconds</text>
<text class="small" x="426" y="191.0">Large amounts of data in one query</text>
<line class="grid" x1="16" x2="668" y1="205" y2="205"/>
<text class="rowl" x="16" y="224.0">The workload</text>
<text class="small" x="166" y="224.0">Many small reads and writes, all day,</text>
<text class="small" x="166" y="239.0">from the website</text>
<text class="small" x="426" y="224.0">Fewer, larger queries from analysts</text>
<text class="small" x="426" y="239.0">and reports</text>
<line class="grid" x1="16" x2="668" y1="253" y2="253"/>
<text class="rowl" x="16" y="272.0">The data</text>
<text class="small" x="166" y="272.0">The ordering website's own data, kept</text>
<text class="small" x="166" y="287.0">up to date</text>
<text class="small" x="426" y="272.0">Data copied in from many sources:</text>
<text class="small" x="426" y="287.0">orders, the till, the website</text>
<line class="grid" x1="16" x2="668" y1="301" y2="301"/>
<text class="note" x="16" y="323">From the Amazon RDS and Amazon Redshift documentation, checked 2026-10-23. Bakery examples are made up.</text>
</svg>
