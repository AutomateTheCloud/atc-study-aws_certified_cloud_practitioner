<svg xmlns="http://www.w3.org/2000/svg" width="680" height="337" viewBox="0 0 680 337" role="img" aria-labelledby="t d">
<title id="t">A transactional database compared with a data warehouse</title>
<desc id="d">Two columns. Running the shop, transactional, Amazon RDS or Amazon Aurora: a typical request is save order 1042 or change this customer's address; each request touches a few rows at a time, in milliseconds; the workload is many small reads and writes all day from the website; the data is the ordering website's own, kept up to date. Studying the business, analytics, Amazon Redshift: a typical request is total sales by month and product for three years; each request touches large amounts of data in one query; the workload is fewer, larger queries from analysts and reports; the data is copied in from many sources such as orders, the till and the website.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --card-fill:#f1f0ec; --tint:#d9e8fb; --tint2:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --card-fill:#252523; --tint:#1b3554; --tint2:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
