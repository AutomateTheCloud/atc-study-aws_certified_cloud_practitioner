<svg xmlns="http://www.w3.org/2000/svg" width="680" height="364" viewBox="0 0 680 364" role="img" aria-labelledby="t d">
<title id="t">Days to copy 60 TB over the network at four link speeds</title>
<desc id="d">Horizontal bar chart, our own arithmetic: days to copy 60 TB using 80 percent of the link. 100 Mbps: 69.4 days. 500 Mbps: 13.9 days. 1 Gbps: 6.9 days. 10 Gbps: 0.7 days, about 17 hours.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --hi-fill:#fbe1d6; --card-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --hi-fill:#4d2716; --card-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s2); stroke-width: 2.5; stroke-dasharray: 6 4; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .colh { fill: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.5px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .flow { stroke: var(--ink2); stroke-width: 1.8; fill: none; }
  .flowhi { stroke: var(--s2); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  .head-ink { fill: var(--ink2); }
  .head-hi { fill: var(--s2); }
  .dot { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .dothi { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .track { stroke: var(--s1); stroke-width: 3; fill: none; stroke-linecap: round; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
</style>
<rect width="680" height="364" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How long 60 TB takes over the network</text>
<text class="sub" x="16" y="48">Days to copy, using 80% of the link. Our arithmetic, not AWS figures.</text>
<line class="axis" x1="96.0" x2="96.0" y1="84" y2="300"/>
<text class="tick" x="96.0" y="316" text-anchor="middle">0</text>
<line class="grid" x1="206.0" x2="206.0" y1="84" y2="300"/>
<text class="tick" x="206.0" y="316" text-anchor="middle">20</text>
<line class="grid" x1="316.0" x2="316.0" y1="84" y2="300"/>
<text class="tick" x="316.0" y="316" text-anchor="middle">40</text>
<line class="grid" x1="426.0" x2="426.0" y1="84" y2="300"/>
<text class="tick" x="426.0" y="316" text-anchor="middle">60</text>
<line class="grid" x1="536.0" x2="536.0" y1="84" y2="300"/>
<text class="tick" x="536.0" y="316" text-anchor="middle">80</text>
<text class="tick" x="316.0" y="334" text-anchor="middle">Days</text>
<text class="lab" x="86" y="114.0" text-anchor="end">100 Mbps</text>
<path class="s1" d="M96.0,92.0 L473.9,92.0 Q477.9,92.0 477.9,96.0 L477.9,122.0 Q477.9,126.0 473.9,126.0 L96.0,126.0 Z"><title>100 Mbps: 69.4 days</title></path>
<text class="val" x="485.9" y="114.0">69.4 days</text>
<text class="lab" x="86" y="166.0" text-anchor="end">500 Mbps</text>
<path class="s1" d="M96.0,144.0 L168.4,144.0 Q172.4,144.0 172.4,148.0 L172.4,174.0 Q172.4,178.0 168.4,178.0 L96.0,178.0 Z"><title>500 Mbps: 13.9 days</title></path>
<text class="val" x="180.4" y="166.0">13.9 days</text>
<text class="lab" x="86" y="218.0" text-anchor="end">1 Gbps</text>
<path class="s1" d="M96.0,196.0 L130.2,196.0 Q134.2,196.0 134.2,200.0 L134.2,226.0 Q134.2,230.0 130.2,230.0 L96.0,230.0 Z"><title>1 Gbps: 6.9 days</title></path>
<text class="val" x="142.2" y="218.0">6.9 days</text>
<text class="lab" x="86" y="270.0" text-anchor="end">10 Gbps</text>
<path class="s1" d="M96.0,248.0 L96.0,248.0 Q99.8,248.0 99.8,251.8 L99.8,278.2 Q99.8,282.0 96.0,282.0 L96.0,282.0 Z"><title>10 Gbps: 0.7 days</title></path>
<text class="val" x="107.8" y="270.0">0.7 days (about 17 hours)</text>
<text class="note" x="16" y="352">Formula: TB × 8,000,000 megabits ÷ (link Mbps × 0.8) = seconds; ÷ 86,400 = days.</text>
</svg>
