<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">Servers the bakery needs each month and the instances an Auto Scaling group with a minimum of 2 runs</title>
<desc id="d">Column chart, January to December, from Module 02's made-up figures for each month's busiest hour. Servers the orders need: 1, 1, 2, 2, 2, 2, 1, 1, 2, 2, 3, 6. Instances an Auto Scaling group with a minimum of 2 and a maximum of 8 runs: 2, 2, 2, 2, 2, 2, 2, 2, 2, 2, 3, 6. A dashed line at 6 shows a fixed fleet sized for December. Server-months: 25 following demand alone, 29 with the minimum of 2, 72 with the fixed fleet.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --crit:#d03b3b; --crit-fill:#fae3e3; }
  @media (prefers-color-scheme: dark) {
