<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" aria-labelledby="t d">
<title id="t">Rehost, relocate, replatform and refactor compared</title>
<desc id="d">Four columns, rehost, relocate, replatform and refactor, compared on five rows. Also called: lift and shift; no other name; lift, tinker and shift, or lift and reshape; re-architect. What moves: each server, as it is, onto Amazon EC2; a whole platform at once to the AWS version of it, or a resource to another VPC, Region or account; the application, onto better-fitting services; the application, rebuilt. What changes in the application, highlighted: nothing; nothing, not even how you operate it; a few parts, such as the database host or the operating system; its design, to use cloud-native features. AWS's example: an application stack from on-premises to AWS; VMware workloads to Amazon EVS, or an RDS database to another account; SQL Server to Amazon RDS for SQL Server; a monolith that slows every release. What AWS says about effort: moves many servers without compatibility worries, optimize later; the quickest way to migrate and operate a workload; a few or many changes, depending on your goals; the most complex and costly strategy.</desc>

