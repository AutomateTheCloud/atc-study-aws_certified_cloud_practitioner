<svg xmlns="http://www.w3.org/2000/svg" width="680" height="414" viewBox="0 0 680 414" role="img" aria-labelledby="t d">
<title id="t">Six SCP cases against the levels root, OU, account and IAM policy, with the deciding cell outlined</title>
<desc id="d">A grid of six cases with columns root SCPs, OU SCPs, account SCP, IAM policy and result. a, a shop-dev admin launching EC2 in eu-west-1: the Workloads OU denies it as outside the Regions, outlined; denied. b, the shop-prod root user stopping its own trail: the root's protect-audit-trail denies it, outlined; denied. c, a chain-billing admin stopping its own trail: one outlined cell across the SCP columns says SCPs don't apply to the management account; allowed. d, a sandbox-anna admin creating a DynamoDB table: every level allows; allowed. e, a sandbox-anna admin launching EC2: the Sandbox OU's list doesn't include EC2, outlined; denied. f, a GuardDuty service-linked role in eu-west-1: one outlined cell says SCPs don't apply to service-linked roles; allowed. A note says everyone has AdministratorAccess, so the IAM column never decides.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --cell:#fcfcfb; --hit:#fbe1d6; --na:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --cell:#1a1a19; --hit:#4d2716; --na:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .cell { fill: var(--cell); stroke: var(--grid); stroke-width: 1; }
  .na { fill: var(--na); stroke: var(--grid); stroke-width: 1; }
  .hit { fill: var(--hit); stroke: var(--ink); stroke-width: 2.5; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .ct { fill: var(--ink); font-size: 11.5px; }
  .ctb { fill: var(--ink); font-size: 12px; font-weight: 700; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="414" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Which level decides each case</text>
<text class="sub" x="16" y="48">The outlined cell is the one that decides; every level must allow</text>
<text class="head" x="230.0" y="66" text-anchor="middle">Root SCPs</text>
<text class="head" x="358.0" y="66" text-anchor="middle">OU SCPs</text>
<text class="head" x="464.0" y="66" text-anchor="middle">Account SCP</text>
<text class="head" x="548.0" y="66" text-anchor="middle">IAM policy</text>
<text class="head" x="632.0" y="66" text-anchor="middle">Result</text>
<text class="ct" x="16" y="95.0">a  shop-dev admin:</text>
<text class="ct" x="16" y="110.0">EC2 in eu-west-1</text>
<rect class="cell" x="168" y="76" width="124" height="46" rx="4"/>
<text class="ct" x="230.0" y="103.0" text-anchor="middle">allows</text>
<rect class="hit" x="296" y="76" width="124" height="46" rx="4"/>
<text class="ctb" x="358.0" y="96.0" text-anchor="middle">Workloads: denies,</text>
<text class="ctb" x="358.0" y="110.0" text-anchor="middle">outside the Regions</text>
<rect class="cell" x="424" y="76" width="80" height="46" rx="4"/>
<text class="ct" x="464.0" y="103.0" text-anchor="middle">allows</text>
<rect class="cell" x="508" y="76" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="103.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="76" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="103.0" text-anchor="middle">Denied</text>
<text class="ct" x="16" y="145.0">b  shop-prod root user:</text>
<text class="ct" x="16" y="160.0">stop own trail</text>
<rect class="hit" x="168" y="126" width="124" height="46" rx="4"/>
<text class="ctb" x="230.0" y="146.0" text-anchor="middle">protect-audit-trail</text>
<text class="ctb" x="230.0" y="160.0" text-anchor="middle">denies</text>
<rect class="cell" x="296" y="126" width="124" height="46" rx="4"/>
<text class="ct" x="358.0" y="153.0" text-anchor="middle">allows</text>
<rect class="cell" x="424" y="126" width="80" height="46" rx="4"/>
<text class="ct" x="464.0" y="153.0" text-anchor="middle">allows</text>
<rect class="cell" x="508" y="126" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="153.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="126" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="153.0" text-anchor="middle">Denied</text>
<text class="ct" x="16" y="195.0">c  chain-billing admin:</text>
<text class="ct" x="16" y="210.0">stop own trail</text>
<rect class="hit" x="168" y="176" width="336" height="46" rx="4"/>
<text class="ctb" x="336.0" y="203.0" text-anchor="middle">SCPs don't apply to the management account</text>
<rect class="cell" x="508" y="176" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="203.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="176" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="203.0" text-anchor="middle">Allowed</text>
<text class="ct" x="16" y="245.0">d  sandbox-anna admin:</text>
<text class="ct" x="16" y="260.0">DynamoDB table</text>
<rect class="cell" x="168" y="226" width="124" height="46" rx="4"/>
<text class="ct" x="230.0" y="253.0" text-anchor="middle">allows</text>
<rect class="cell" x="296" y="226" width="124" height="46" rx="4"/>
<text class="ct" x="358.0" y="246.0" text-anchor="middle">Sandbox: allows</text>
<text class="ct" x="358.0" y="260.0" text-anchor="middle">DynamoDB</text>
<rect class="cell" x="424" y="226" width="80" height="46" rx="4"/>
<text class="ct" x="464.0" y="253.0" text-anchor="middle">allows</text>
<rect class="cell" x="508" y="226" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="253.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="226" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="253.0" text-anchor="middle">Allowed</text>
<text class="ct" x="16" y="295.0">e  sandbox-anna admin:</text>
<text class="ct" x="16" y="310.0">EC2 instance</text>
<rect class="cell" x="168" y="276" width="124" height="46" rx="4"/>
<text class="ct" x="230.0" y="303.0" text-anchor="middle">allows</text>
<rect class="hit" x="296" y="276" width="124" height="46" rx="4"/>
<text class="ctb" x="358.0" y="296.0" text-anchor="middle">Sandbox: EC2 not on</text>
<text class="ctb" x="358.0" y="310.0" text-anchor="middle">the list</text>
<rect class="cell" x="424" y="276" width="80" height="46" rx="4"/>
<text class="ct" x="464.0" y="303.0" text-anchor="middle">allows</text>
<rect class="cell" x="508" y="276" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="303.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="276" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="303.0" text-anchor="middle">Denied</text>
<text class="ct" x="16" y="345.0">f  GuardDuty service-</text>
<text class="ct" x="16" y="360.0">linked role, eu-west-1</text>
<rect class="hit" x="168" y="326" width="336" height="46" rx="4"/>
<text class="ctb" x="336.0" y="353.0" text-anchor="middle">SCPs don't apply to service-linked roles</text>
<rect class="cell" x="508" y="326" width="80" height="46" rx="4"/>
<text class="ct" x="548.0" y="339.0" text-anchor="middle">its own</text>
<text class="ct" x="548.0" y="353.0" text-anchor="middle">policy</text>
<text class="ct" x="548.0" y="367.0" text-anchor="middle">allows</text>
<rect class="na" x="592" y="326" width="80" height="46" rx="4"/>
<text class="ctb" x="632.0" y="353.0" text-anchor="middle">Allowed</text>
<text class="note" x="16" y="396">Everyone here has AdministratorAccess in their own account, so the IAM column never decides.</text>
</svg>
