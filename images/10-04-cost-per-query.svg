<svg xmlns="http://www.w3.org/2000/svg" width="680" height="425" viewBox="0 0 680 425" role="img" aria-labelledby="t d">
<title id="t">The cost of one Athena query, by the amount of data it scans</title>
<desc id="d">Dot chart on a log scale of US dollars per query, from $0.00001 to $10, at $5 per terabyte scanned with a 10 megabyte minimum per query. This lab's file, under 1 KB, is highlighted: it is billed as 10 MB and costs about $0.00005 per query. 10 MB: about $0.00005, the same. 1 GB: about $0.005. 100 GB: about $0.50. 1 TB: about $5.00. Above the minimum, cost grows in step with the data scanned. Statements that create or drop tables, and failed queries, are not charged. S3 storage and requests are billed separately. Prices checked 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .stem { stroke: var(--grid); stroke-width: 2; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="425" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">What one Athena query costs, by the data it scans</text>
<text class="sub" x="16" y="48">US dollars per query, log scale: each gridline is ten times the one before</text>
<line class="grid" x1="200.0" x2="200.0" y1="86" y2="292"/>
<text class="tick" x="200.0" y="310" text-anchor="middle">$0.00001</text>
<line class="grid" x1="265.0" x2="265.0" y1="86" y2="292"/>
<text class="tick" x="265.0" y="310" text-anchor="middle">$0.0001</text>
<line class="grid" x1="330.0" x2="330.0" y1="86" y2="292"/>
<text class="tick" x="330.0" y="310" text-anchor="middle">$0.001</text>
<line class="grid" x1="395.0" x2="395.0" y1="86" y2="292"/>
<text class="tick" x="395.0" y="310" text-anchor="middle">$0.01</text>
<line class="grid" x1="460.0" x2="460.0" y1="86" y2="292"/>
<text class="tick" x="460.0" y="310" text-anchor="middle">$0.10</text>
<line class="grid" x1="525.0" x2="525.0" y1="86" y2="292"/>
<text class="tick" x="525.0" y="310" text-anchor="middle">$1.00</text>
<line class="grid" x1="590.0" x2="590.0" y1="86" y2="292"/>
<text class="tick" x="590.0" y="310" text-anchor="middle">$10.00</text>
<text class="lab" x="188" y="110" text-anchor="end">This lab's file, under 1 KB</text>
<line class="stem" x1="200" x2="245.4" y1="106" y2="106"/>
<circle class="dot-s2" cx="245.4" cy="106" r="6"><title>This lab's file, under 1 KB: billed as 10 MB, about $0.00005 per query</title></circle>
<text class="lab" x="257.4" y="110">about $0.00005, billed as 10 MB</text>
<text class="lab" x="188" y="150" text-anchor="end">10 MB</text>
<line class="stem" x1="200" x2="245.4" y1="146" y2="146"/>
<circle class="dot-s1" cx="245.4" cy="146" r="6"><title>10 MB: billed as 10 MB, about $0.00005 per query</title></circle>
<text class="lab" x="257.4" y="150">about $0.00005</text>
<text class="lab" x="188" y="190" text-anchor="end">1 GB</text>
<line class="stem" x1="200" x2="375.4" y1="186" y2="186"/>
<circle class="dot-s1" cx="375.4" cy="186" r="6"><title>1 GB: billed as 1,000 MB, about $0.005 per query</title></circle>
<text class="lab" x="387.4" y="190">about $0.005</text>
<text class="lab" x="188" y="230" text-anchor="end">100 GB</text>
<line class="stem" x1="200" x2="505.4" y1="226" y2="226"/>
<circle class="dot-s1" cx="505.4" cy="226" r="6"><title>100 GB: billed as 100,000 MB, about $0.50 per query</title></circle>
<text class="lab" x="517.4" y="230">about $0.50</text>
<text class="lab" x="188" y="270" text-anchor="end">1 TB</text>
<line class="stem" x1="200" x2="570.4" y1="266" y2="266"/>
<circle class="dot-s1" cx="570.4" cy="266" r="6"><title>1 TB: billed as 1,000,000 MB, about $5.00 per query</title></circle>
<text class="lab" x="582.4" y="270">about $5.00</text>
<text class="small" x="16" y="338.0">The orange dot is this lab. Anything under 10 MB is billed as 10 MB, so the lab's tiny file costs</text>
<text class="small" x="16" y="355.0">the same as 10 MB. Above that, cost grows in step with the data: a query that reads 1 TB costs $5,</text>
<text class="small" x="16" y="372.0">every time it runs. Statements that create or drop tables, and failed queries, are not charged.</text>
<text class="note" x="16" y="395">Per-query pricing: $5 per TB scanned, rounded up to the nearest MB, 10 MB minimum (Amazon Athena pricing,</text>
<text class="note" x="16" y="411">checked 2026-10-24). S3 storage and requests are billed separately. Our arithmetic; amounts are approximate.</text>
</svg>
