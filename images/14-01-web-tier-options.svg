<svg xmlns="http://www.w3.org/2000/svg" width="680" height="348" viewBox="0 0 680 348" role="img" aria-labelledby="t d">
<title id="t">Monthly cost of three designs for the bakery's web tier</title>
<desc id="d">Horizontal bars, dollars per month, On-Demand, US East (N. Virginia), price lists retrieved 2026-10-24. A, leave it as built, one t3.micro web server in us-east-1a with its public IPv4 address and 8 GiB gp3 disk: $11.88. B, the same server in an Auto Scaling group of one, which costs nothing extra: $11.88. C, outlined as the choice: two such servers in two Availability Zones, $23.76, behind an Application Load Balancer, $24.90 for its hours, two public IPv4 addresses and an assumed 0.2 capacity units on average, $48.66 in all. A note says what a failure does to each: A is down until rebuilt by hand, B is down for minutes and gets a new public address, C stays up.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --s3:#1baf7a; --sup:#898781; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --s3:#199e70; --sup:#898781; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .s3 { fill: var(--s3); } .sup { fill: var(--sup); }
  .gap { stroke: var(--surface); stroke-width: 2; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .valb { fill: var(--ink); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .pick { fill: none; stroke: var(--ink); stroke-width: 2; }
</style>
<rect width="680" height="348" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">The web tier: three ways to answer REL 10, per month</text>
<text class="sub" x="16" y="48">On-Demand, US East (N. Virginia), price lists retrieved 2026-10-24; 730 hours</text>
<rect class="s1" x="16" y="70" width="12" height="12" rx="2"/>
<text x="34" y="80">Web servers: instance, public IPv4, 8 GiB disk</text>
<rect class="s2" x="373.2" y="70" width="12" height="12" rx="2"/>
<text x="391.2" y="80">Load balancer: hours, 2 IPv4, LCUs</text>
<line class="axis" x1="214.0" x2="214.0" y1="98" y2="272"/>
<text class="tick" x="214.0" y="288" text-anchor="middle">$0</text>
<line class="grid" x1="285.2" x2="285.2" y1="98" y2="272"/>
<text class="tick" x="285.2" y="288" text-anchor="middle">$10</text>
<line class="grid" x1="356.4" x2="356.4" y1="98" y2="272"/>
<text class="tick" x="356.4" y="288" text-anchor="middle">$20</text>
<line class="grid" x1="427.6" x2="427.6" y1="98" y2="272"/>
<text class="tick" x="427.6" y="288" text-anchor="middle">$30</text>
<line class="grid" x1="498.8" x2="498.8" y1="98" y2="272"/>
<text class="tick" x="498.8" y="288" text-anchor="middle">$40</text>
<line class="grid" x1="570.0" x2="570.0" y1="98" y2="272"/>
<text class="tick" x="570.0" y="288" text-anchor="middle">$50</text>
<text class="tick" x="392.0" y="306" text-anchor="middle">USD per month</text>
<text class="lab" x="204" y="118" text-anchor="end">A. Leave it as built</text>
<text class="small" x="204" y="134" text-anchor="end">one server in us-east-1a</text>
<path class="s1 gap" d="M214.0,104.0 L294.6,104.0 Q298.6,104.0 298.6,108.0 L298.6,134.0 Q298.6,138.0 294.6,138.0 L214.0,138.0 Z"><title>A. Leave it as built: web server $11.88</title></path>
<text class="val" x="308.6" y="126.0">$11.88</text>
<text class="lab" x="204" y="182" text-anchor="end">B. Self-healing single server</text>
<text class="small" x="204" y="198" text-anchor="end">Auto Scaling group of one</text>
<path class="s1 gap" d="M214.0,168.0 L294.6,168.0 Q298.6,168.0 298.6,172.0 L298.6,198.0 Q298.6,202.0 294.6,202.0 L214.0,202.0 Z"><title>B. Self-healing single server: web server $11.88</title></path>
<text class="val" x="308.6" y="190.0">$11.88</text>
<text class="lab" x="204" y="246" text-anchor="end">C. Two servers, two AZs</text>
<text class="small" x="204" y="262" text-anchor="end">behind a load balancer</text>
<rect class="s1 gap" x="214.0" y="232" width="169.2" height="34"><title>C. Two servers, two AZs: web servers $23.76</title></rect>
<path class="s2 gap" d="M383.2,232.0 L556.5,232.0 Q560.5,232.0 560.5,236.0 L560.5,262.0 Q560.5,266.0 556.5,266.0 L383.2,266.0 Z"><title>C. Two servers, two AZs: load balancer $24.90</title></path>
<path class="pick" d="M211.0,229.0 L559.5,229.0 Q563.5,229.0 563.5,233.0 L563.5,265.0 Q563.5,269.0 559.5,269.0 L211.0,269.0 Z"/>
<text class="valb" x="570.5" y="254.0">$48.66</text>
<text class="note" x="16" y="318">A: an AZ or server failure takes the site down until someone rebuilds it. B: down for minutes per failure, and the</text>
<text class="note" x="16" y="333">new server has a new public address. C: the site stays up through either. Capacity units assume 0.2 LCU on average.</text>
</svg>
