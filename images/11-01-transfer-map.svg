<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="t d">
<title id="t">Where the bakery's data moves, and which moves are free</title>
<desc id="d">A map of the bakery's setup with seven numbered arrows. 1, data in from the internet to the web server: free. 2, data out from the web server to the internet: $0.09 per GB after 100 GB free a month. 3, between the web server and another instance in the same Availability Zone, over private addresses: free. 4, from the web server in Availability Zone a to the database in Availability Zone b: $0.01 per GB, charged in each direction. 5, from EC2 to the S3 photo bucket in the same Region: free. 6, from US East (N. Virginia) to another Region for backup copies: $0.02 per GB to most Regions, $0.01 to US East (Ohio). 7, from S3 to CloudFront edge locations: free. Free arrows are solid green; charged ones dashed orange. Rates from AWS's price list published 2026-09-16.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; --s4:#eda100; --warm-fill:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --s3:#199e70; --s4:#c98500; --warm-fill:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .warm { fill: var(--warm-fill); stroke: var(--s2); stroke-width: 1.5; }
  .zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .arrlab { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .free { stroke: var(--s3); stroke-width: 2.5; fill: none; }
  .paid { stroke: var(--s2); stroke-width: 2.5; fill: none; }
  .ahead-free { fill: var(--s3); }
  .ahead-paid { fill: var(--s2); }
  .s3 { fill: var(--s3); } .s4 { fill: var(--s4); }
  .conn { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
  .dashext { fill: none; stroke: var(--s3); stroke-width: 1.5; stroke-dasharray: 5 4; }
</style>
<rect width="720" height="520" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Data transfer is priced by where the data goes</text>
<text class="sub" x="16" y="48">Rates from US East (N. Virginia), per GB, from AWS's price list published 2026-09-16</text>
<line class="free" x1="16" y1="72" x2="40" y2="72"/>
<text x="46" y="76">Free: solid green, labeled "free"</text>
<line class="paid" style="stroke-dasharray:7 4" x1="300" y1="72" x2="324" y2="72"/>
<text x="330" y="76">Charged: dashed orange, labeled with the rate</text>
<rect class="box" x="16" y="210" width="130" height="80" rx="40"/>
<text class="head" x="81" y="245" text-anchor="middle">Internet</text>
<text class="small" x="81" y="263" text-anchor="middle">customers</text>
<rect class="zone" x="230" y="100" width="300" height="340" rx="10"/>
<text class="cellt" x="244" y="122">Region: US East (N. Virginia)</text>
<rect class="panel" x="246" y="140" width="130" height="150" rx="8"/>
<text class="small" x="258" y="160">Availability Zone a</text>
<rect class="hi" x="262" y="172" width="98" height="40" rx="6"/>
<text class="cellt" x="311" y="197" text-anchor="middle">Web server</text>
<rect class="hi" x="262" y="232" width="98" height="40" rx="6"/>
<text class="cellt" x="311" y="250" text-anchor="middle">Another</text>
<text class="cellt" x="311" y="265" text-anchor="middle">instance</text>
<rect class="panel" x="390" y="140" width="126" height="150" rx="8"/>
<text class="small" x="402" y="160">Availability Zone b</text>
<rect class="hi" x="404" y="172" width="98" height="40" rx="6"/>
<text class="cellt" x="453" y="197" text-anchor="middle">Database</text>
<rect class="hi" x="300" y="360" width="160" height="44" rx="6"/>
<text class="cellt" x="380" y="381" text-anchor="middle">S3 photo bucket</text>
<text class="small" x="380" y="397" text-anchor="middle">a Regional service</text>
<rect class="zone" x="590" y="140" width="114" height="90" rx="10"/>
<text class="cellt" x="647" y="174" text-anchor="middle">Another</text>
<text class="cellt" x="647" y="190" text-anchor="middle">Region</text>
<text class="small" x="647" y="208" text-anchor="middle">backup copies</text>
<rect class="box" x="590" y="330" width="114" height="70" rx="8"/>
<text class="cellt" x="647" y="360" text-anchor="middle">CloudFront</text>
<text class="small" x="647" y="378" text-anchor="middle">edge locations</text>
<line class="free" x1="146" y1="228" x2="258" y2="190"/>
<path class="ahead-free" d="M258,190 L250.5,196.6 L248.0,189.3 Z"/>
<text class="arrlab" x="150" y="196">1. In: free</text>
<line class="paid" style="stroke-dasharray:7 4" x1="258" y1="200" x2="150" y2="266"/>
<path class="ahead-paid" d="M150,266 L155.8,257.9 L159.9,264.5 Z"/>
<text class="arrlab" x="60" y="316">2. Out: $0.09</text>
<text class="small" x="60" y="332">after 100 GB free a month</text>
<line class="free" x1="311" y1="214" x2="311" y2="230"/>
<path class="ahead-free" d="M311,230 L307.1,220.8 L314.9,220.8 Z"/>
<text class="arrlab" x="250" y="306">3. Same AZ: free</text>
<line class="paid" style="stroke-dasharray:7 4" x1="362" y1="186" x2="402" y2="186"/>
<path class="ahead-paid" d="M402,186 L392.8,189.9 L392.8,182.1 Z"/>
<text class="arrlab" x="402" y="312">4. Across AZs: $0.01</text>
<text class="small" x="402" y="328">charged in each direction</text>
<line class="free" x1="355" y1="274" x2="420" y2="358"/>
<path class="ahead-free" d="M420,358 L411.3,353.1 L417.4,348.3 Z"/>
<text class="arrlab" x="244" y="346">5. EC2 to S3: free</text>
<line class="paid" style="stroke-dasharray:7 4" x1="504" y1="190" x2="588" y2="186"/>
<path class="ahead-paid" d="M588,186 L579.0,190.3 L578.6,182.5 Z"/>
<text class="arrlab" x="540" y="250">6. To another Region:</text>
<text class="small" x="540" y="266">$0.02 most; $0.01 to Ohio</text>
<line class="free" x1="460" y1="382" x2="588" y2="366"/>
<path class="ahead-free" d="M588,366 L579.3,371.0 L578.4,363.3 Z"/>
<text class="arrlab" x="474" y="420">7. S3 to CloudFront: free</text>
<text class="note" x="16" y="490">Services in the path add their own fees, such as a NAT gateway's $0.045 per GB processed.</text>
<text class="note" x="16" y="506">Rates differ by Region; outbound rates fall as volume grows. Sources: AWS price list; EC2 and S3 pricing pages.</text>
</svg>
