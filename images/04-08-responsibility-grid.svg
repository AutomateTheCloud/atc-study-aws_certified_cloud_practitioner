<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576" role="img" aria-labelledby="t d">
<title id="t">Who does each security task on-premises and on EC2, RDS, Lambda and S3</title>
<desc id="d">A grid with six rows of security tasks and five columns: on-premises, EC2, RDS, Lambda and S3, in order of more abstraction. Facilities, power, cooling, hardware and servers: you on-premises, AWS for every service. Operating system install and patch: you on-premises and on EC2; AWS on RDS, Lambda (note 1) and S3. Database engine or language runtime install and patch: you on-premises and on EC2; AWS on RDS, Lambda (note 2) and S3. Backups, high availability and scaling: you on-premises and on EC2; AWS on RDS; on Lambda, AWS for scaling (note 3); on S3, not stated. Your code, its dependencies and tuning: you everywhere, including query tuning on RDS; on S3 no code runs. Your data, its encryption and who can access it: you in every column. ¹ For managed runtimes, Lambda applies security updates by default. For functions built as container images, you rebuild from the latest base image. ² Until AWS deprecates the runtime. Moving to a supported runtime is yours. ³ Lambda manages capacity and scaling. The pages we use publish no split for its backups or high availability.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws:#2a78d6; --you:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws:#3987e5; --you:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .cell { stroke: var(--grid); stroke-width: 1; }
  .c-aws { fill: var(--aws); fill-opacity: 0.16; } .c-you { fill: var(--you); fill-opacity: 0.16; }
  .c-none { fill: var(--surface); }
  .bar-aws { fill: var(--aws); } .bar-you { fill: var(--you); }
  .none-border { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 4 3; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .celltext { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .celltext-none { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .small { fill: var(--ink2); font-size: 12px; }
</style>
