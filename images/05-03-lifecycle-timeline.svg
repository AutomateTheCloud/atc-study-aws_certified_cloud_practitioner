<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" role="img" aria-labelledby="t d">
<title id="t">A lifecycle rule for the bakery's sales records, compared with Intelligent-Tiering for its photos</title>
<desc id="d">A time line of one sales record's age, not to scale. Day 0: uploaded to S3 Standard. Day 30: a transition action moves it to S3 Standard-IA. Day 365: a transition action moves it to S3 Glacier Deep Archive. Day 2,557, about seven years: an expiration action, and S3 deletes it. The three segments run from light to dark blue as the data gets colder, and each is labeled with its class. Below, for comparison: the cake photos in S3 Intelligent-Tiering need no rule; S3 watches each photo on its own; not read for 30 days, it moves to a cheaper tier; not read for 90 days, cheaper again; read it, and it moves back to the frequent tier; no retrieval fees.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hot:#86b6ef; --warm:#3987e5; --cold:#184f95; --panel:#f1f0ec; --it:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hot:#184f95; --warm:#2a78d6; --cold:#86b6ef; --panel:#252523; --it:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hot { fill: var(--hot); } .warm { fill: var(--warm); } .cold { fill: var(--cold); }
  .it { fill: var(--it); stroke: var(--s1); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: var(--panel); }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .head { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .evline { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
  .brk { stroke: var(--surface); stroke-width: 4; }
  .brk2 { stroke: var(--ink2); stroke-width: 1.2; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="720" height="376" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A lifecycle rule moves each object by its age</text>
<text class="sub" x="16" y="48">The bakery's sales records, from upload to deletion. Not to scale: the last segment is six years.</text>
<rect class="hot" x="41" y="118" width="108" height="36" rx="4"/>
<text class="cellt" x="95.0" y="108" text-anchor="middle">Standard</text>
<rect class="warm" x="151" y="118" width="178" height="36" rx="4"/>
<text class="cellt" x="240.0" y="108" text-anchor="middle">Standard-IA</text>
<rect class="cold" x="331" y="118" width="348" height="36" rx="4"/>
<text class="cellt" x="505.0" y="108" text-anchor="middle">Glacier Deep Archive</text>
<line class="brk" x1="240" y1="116" x2="248" y2="156"/>
<line class="brk2" x1="237" y1="116" x2="245" y2="156"/>
<line class="brk2" x1="243" y1="116" x2="251" y2="156"/>
<line class="brk" x1="505" y1="116" x2="513" y2="156"/>
<line class="brk2" x1="502" y1="116" x2="510" y2="156"/>
<line class="brk2" x1="508" y1="116" x2="516" y2="156"/>
<line class="axis" x1="40" x2="680" y1="172" y2="172"/>
<line class="evline" x1="40" x2="40" y1="114" y2="172"/>
<circle class="ev" cx="40" cy="172" r="5"/>
<text class="cellt" x="40" y="194" text-anchor="start">Day 0</text>
<text class="small" x="40" y="210" text-anchor="start">Uploaded</text>
<line class="evline" x1="150" x2="150" y1="114" y2="172"/>
<circle class="ev" cx="150" cy="172" r="5"/>
<text class="cellt" x="150" y="194" text-anchor="middle">Day 30</text>
<text class="small" x="150" y="210" text-anchor="middle">Transition</text>
<line class="evline" x1="330" x2="330" y1="114" y2="172"/>
<circle class="ev" cx="330" cy="172" r="5"/>
<text class="cellt" x="330" y="194" text-anchor="middle">Day 365</text>
<text class="small" x="330" y="210" text-anchor="middle">Transition</text>
<line class="evline" x1="680" x2="680" y1="114" y2="172"/>
<circle class="ev" cx="680" cy="172" r="5"/>
<text class="cellt" x="680" y="194" text-anchor="end">Day 2,557</text>
<text class="small" x="680" y="210" text-anchor="end">Expiration</text>
<text class="small" x="680" y="226" text-anchor="end">(about 7 years): S3 deletes it</text>
<text class="cellt" x="16" y="260">Compare: the cake photos in S3 Intelligent-Tiering need no rule</text>
<rect class="it" x="40" y="272" width="640" height="64" rx="6"/>
<text class="small" x="56" y="296.0">S3 watches each photo on its own. Not read for 30 days: it moves to a cheaper tier. Not read for</text>
<text class="small" x="56" y="312.0">90 days: cheaper again. Read it, and it moves back to the frequent tier. No retrieval fees.</text>
<text class="note" x="16" y="362">Made up for teaching. Rule actions: S3 User Guide, "Managing the lifecycle of objects", checked 2026-10-23.</text>
</svg>
