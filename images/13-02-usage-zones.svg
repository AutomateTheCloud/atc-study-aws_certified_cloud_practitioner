<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="t d">
<title id="t">The chain's ten applications by average use, against AWS's zombie and idle thresholds</title>
<desc id="d">A horizontal bar chart of average CPU and memory use over 90 days, made-up figures, on a scale from 0 to 70 percent. Two shaded zones: below 5 percent, zombie; 5 to 20 percent, idle. Recipe archive 2 percent, in the zombie zone. Payroll 8 percent, highlighted, in the idle zone, with the note that it is idle by the number, yet it pays everyone each month. Shop tools, about 30 small apps, 12 percent, idle. Accounting 16 percent, idle. Chain website 22 percent. Email and calendars 34 percent. Loyalty database 41 percent. Stock and ordering 48 percent. Oven control 57 percent. Wholesale portal 63 percent. Notes: AWS defines below 5 percent average CPU and memory use as a zombie application and 5 to 20 percent over 90 days as idle, and lists low use as a reason to consider retiring and also as a reason to retain; business value decides.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --hi-fill:#fbe1d6; --card-fill:#f1f0ec; --zone1:#ecebe6; --zone2:#f5f4f0; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --hi-fill:#4d2716; --card-fill:#252523; --zone1:#2a2a28; --zone2:#222221; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .move { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .hi { fill: var(--hi-fill); stroke: var(--s2); stroke-width: 2.5; }
  .hirow { fill: none; stroke: var(--s2); stroke-width: 2.5; }
  .band { fill: none; stroke: var(--axis); stroke-width: 1; stroke-dasharray: 4 3; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .grp { fill: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .rowl { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .zone1 { fill: var(--zone1); } .zone2 { fill: var(--zone2); }
  .zone { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .val { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
