<text class="cells" x="35" y="243">security</text>
<text class="cells" x="26" y="262">• Basic: some checks. Paid</text>
<text class="cells" x="35" y="277">plans: all checks</text>
<rect class="n" x="238" y="100" width="210" height="210" rx="6"/>
<text class="boxt" x="248" y="122">AWS Support Center</text>
<text class="q" x="248" y="140">"We need a person at AWS to</text>
<text class="q" x="248" y="156">help."</text>
<text class="cells" x="248" y="178">• Where you open cases and</text>
<text class="cells" x="257" y="193">request quota increases</text>
<text class="cells" x="248" y="212">• Basic: account, billing and</text>
<text class="cells" x="257" y="227">quota cases</text>
<text class="cells" x="248" y="246">• Paid plans: technical cases</text>
<text class="cells" x="257" y="261">too</text>
<rect class="hi" x="474" y="100" width="210" height="210" rx="6"/>
<text class="boxt" x="484" y="122">AWS Health</text>
<text class="q" x="484" y="140">"Is AWS having a problem</text>
<text class="q" x="484" y="156">that affects us?"</text>
<text class="cells" x="484" y="178">• Reports AWS's own events:</text>
<text class="cells" x="493" y="193">issues, planned maintenance,</text>
<text class="cells" x="493" y="208">account notices</text>
<text class="cells" x="484" y="227">• Dashboard: free for everyone</text>
<text class="cells" x="484" y="246">• Health API: paid plans</text>
<rect class="plain" x="16" y="350" width="432" height="54" rx="6"/>
<text class="cells" x="28" y="372.0">The bakery's account: EC2 web servers, RDS orders database,</text>
<text class="cells" x="28" y="387.0">Lambda functions, S3 photo bucket, the VPC</text>
<rect class="plain" x="474" y="350" width="210" height="54" rx="6"/>
<text class="cells" x="486" y="372.0">AWS's services, Regions and</text>
<text class="cells" x="486" y="387.0">data centers</text>
<line class="arrow" x1="120.0" y1="348.0" x2="120.0" y2="314.0"/>
<path class="arrowhead" d="M115.0,322.0 L125.0,322.0 L120.0,314.0 Z"/>
