<svg xmlns="http://www.w3.org/2000/svg" width="700" height="468" viewBox="0 0 700 468" role="img" aria-labelledby="t d">
<title id="t">Trusted Advisor, AWS Support Center and AWS Health, and what each one watches</title>
<desc id="d">A dashed line splits the picture into your side, your account and its resources, on the left, and AWS's side on the right. On your side: AWS Trusted Advisor answers "Is anything in our setup wasteful, risky or near a limit?" It checks your settings against AWS's best practices in six categories; Basic gets some checks and paid plans all. An arrow labeled reads settings runs up to it from the bakery's account, which holds the EC2 web servers, the RDS orders database, Lambda functions, the S3 photo bucket and the VPC. AWS Support Center answers "We need a person at AWS to help": it is where you open cases and request quota increases; Basic gets account, billing and quota cases, and paid plans technical cases too. An arrow labeled you ask, a person answers runs down from it. On AWS's side, highlighted: AWS Health answers "Is AWS having a problem that affects us?" It reports AWS's own events, such as issues, planned maintenance and account notices; its dashboard is free for everyone and its API needs a paid plan. An arrow labeled reports events runs up to it from AWS's services, Regions and data centers. Checked 2026-10-24.</desc>

