<path class="arrowhead" d="M573.0,322.0 L583.0,322.0 L578.0,314.0 Z"/>
<text class="note" x="586" y="336">reports events</text>
<text class="note" x="16" y="436.0">Trusted Advisor looks at what you built; AWS Health looks at what AWS runs. Support Center is where you talk to AWS</text>
