<text class="title" x="16" y="28">Three tools, three different things to watch</text>
<text class="sub" x="16" y="48">Highlighted: the only tool that reports on AWS's side rather than yours. Checked 2026-10-24</text>
<text class="tag" x="16" y="84">YOUR SIDE: YOUR ACCOUNT AND ITS RESOURCES</text>
<text class="tag" x="474" y="84">AWS'S SIDE</text>
