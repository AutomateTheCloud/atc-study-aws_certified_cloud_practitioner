<text class="tick" x="451.8" y="390" text-anchor="middle">$100</text>
<line class="grid" x1="542.7" x2="542.7" y1="88" y2="372"/>
<text class="tick" x="542.7" y="390" text-anchor="middle">$150</text>
<line class="grid" x1="633.6" x2="633.6" y1="88" y2="372"/>
<text class="tick" x="633.6" y="390" text-anchor="middle">$200</text>
<text class="lab" x="16" y="116">November total</text>
<path class="s1" d="M270.0,101.0 L399.6,101.0 Q403.6,101.0 403.6,105.0 L403.6,119.0 Q403.6,123.0 399.6,123.0 L270.0,123.0 Z"><title>November total: $73.48</title></path>
<text class="val" x="411.6" y="117">$73.48</text>
<text class="lab" x="16" y="156">+ NAT gateway (new): hours and data</text>
<rect class="s2" x="403.6" y="141" width="72.0" height="22" rx="3"><title>+ NAT gateway (new): hours and data: +$39.60</title></rect>
<line class="conn" x1="403.6" x2="403.6" y1="123" y2="141"/>
<text class="val" x="483.6" y="157">+$39.60</text>
<text class="lab" x="16" y="196">+ Data out to the internet</text>
<rect class="s4" x="475.6" y="181" width="98.2" height="22" rx="3"><title>+ Data out to the internet: +$54.00</title></rect>
<line class="conn" x1="475.6" x2="475.6" y1="163" y2="181"/>
<text class="val" x="581.8" y="197">+$54.00</text>
<text class="lab" x="16" y="236">+ More web server hours</text>
<rect class="s4" x="573.8" y="221" width="55.2" height="22" rx="3"><title>+ More web server hours: +$30.37</title></rect>
<line class="conn" x1="573.8" x2="573.8" y1="203" y2="221"/>
<text class="val" x="637.0" y="237">+$30.37</text>
<text class="lab" x="16" y="276">+ Web server to database across AZs</text>
<rect class="s4" x="629.0" y="261" width="7.3" height="22" rx="3"><title>+ Web server to database across AZs: +$4.00</title></rect>
<line class="conn" x1="629.0" x2="629.0" y1="243" y2="261"/>
<text class="val" x="644.3" y="277">+$4.00</text>
<text class="lab" x="16" y="316">+ Disks, photo storage, requests</text>
<rect class="s4" x="636.3" y="301" width="7.7" height="22" rx="3"><title>+ Disks, photo storage, requests: +$4.26</title></rect>
<line class="conn" x1="636.3" x2="636.3" y1="283" y2="301"/>
<text class="val" x="652.0" y="317">+$4.26</text>
<text class="lab" x="16" y="356">December total</text>
<path class="s1" d="M270.0,341.0 L640.0,341.0 Q644.0,341.0 644.0,345.0 L644.0,359.0 Q644.0,363.0 640.0,363.0 L270.0,363.0 Z"><title>December total: $205.71</title></path>
<text class="val" x="652.0" y="357">$205.71</text>
<text class="note" x="16" y="410">Quantities are made up for teaching. Prices from AWS's published price lists (data transfer published 2026-09-16).</text>
<text class="note" x="16" y="426">Lambda stayed inside its monthly free allowance in both months, so it adds $0.00.</text>
</svg>
