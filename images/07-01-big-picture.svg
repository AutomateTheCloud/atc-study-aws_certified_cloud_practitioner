<svg xmlns="http://www.w3.org/2000/svg" width="680" height="568" viewBox="0 0 680 568" role="img" aria-labelledby="t d">
<title id="t">The bakery's VPC with public and private subnets in two Availability Zones</title>
<desc id="d">The internet sits above an AWS Region, US East (N. Virginia). Arrows run both ways between the internet and an internet gateway attached to the top of the bakery's VPC, 10.0.0.0/16. Inside the VPC are two Availability Zones, A and B. Each holds a public subnet (10.0.1.0/24 and 10.0.2.0/24) with a web server that has a public IPv4 address, and a private subnet (10.0.3.0/24 and 10.0.4.0/24) holding the order database: the primary in AZ A and the standby in AZ B. Internet traffic from the gateway reaches only the public subnets. Below, two route tables. The public route table, used by both public subnets, has 10.0.0.0/16 to local (stays inside the VPC) and, highlighted, 0.0.0.0/0 to the internet gateway. The private route table, used by both private subnets, has only 10.0.0.0/16 to local and no route to the internet gateway. A note says the highlighted route is the only difference between the two kinds of subnet.</desc>

