<svg xmlns="http://www.w3.org/2000/svg" width="680" height="386" viewBox="0 0 680 386" role="img" aria-labelledby="t d">
<title id="t">A month's cost of one small instance when running, stopped, stopped with an Elastic IP, and terminated</title>
<desc id="d">Stacked horizontal bar chart for one t3.micro with an 8 GB gp3 volume over 730 hours, US East (N. Virginia), as of 2026-10-24. Running all month: instance hours $7.59, public IPv4 $3.65, EBS volume $0.64, total $11.88. Stopped all month: EBS volume $0.64 only. Stopped with an Elastic IP kept: Elastic IP $3.65 plus EBS $0.64, total $4.29. Terminated: $0.00, nothing left to bill.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --panel:#252523; --hi-fill:#1b3554; --s3:#199e70; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: var(--panel); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.5; }
  .box { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .zone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 5 4; }
  .wire { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .head { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .big { fill: var(--ink); font-size: 56px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .bighi { fill: var(--s1); font-size: 56px; font-weight: 600; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .mono { fill: var(--ink); font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .brace { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .s3 { fill: var(--s3); }
</style>
<rect width="680" height="386" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Stopping pauses the instance charge; terminating ends every charge</text>
<text class="sub" x="16" y="48">One t3.micro with an 8 GB gp3 volume, for a 730-hour month, US East (N. Virginia), as of 2026-10-24</text>
<rect class="s1" x="16" y="70" width="12" height="12" rx="2"/>
<text x="34" y="80">Instance hours</text>
<rect class="s2" x="150" y="70" width="12" height="12" rx="2"/>
<text x="168" y="80">Public IPv4 address</text>
<rect class="s3" x="320" y="70" width="12" height="12" rx="2"/>
<text x="338" y="80">EBS volume storage</text>
<text class="lab" x="16" y="126">Running all month</text>
<rect class="s1" x="16.0" y="134" width="295.4" height="20"><title>Running all month: instance hours $7.59</title></rect>
<rect class="s2" x="313.4" y="134" width="141.0" height="20"><title>Running all month: public IPv4 $3.65</title></rect>
<path class="s3" d="M456.3,134.0 L477.4,134.0 Q481.4,134.0 481.4,138.0 L481.4,150.0 Q481.4,154.0 477.4,154.0 L456.3,154.0 Z"><title>Running all month: EBS volume $0.64</title></path>
<text class="lab" x="489.4" y="149">$11.88</text>
<text class="lab" x="16" y="182">Stopped all month</text>
<path class="s3" d="M16.0,190.0 L37.1,190.0 Q41.1,190.0 41.1,194.0 L41.1,206.0 Q41.1,210.0 37.1,210.0 L16.0,210.0 Z"><title>Stopped all month: EBS volume $0.64</title></path>
<text class="lab" x="49.1" y="205">$0.64</text>
<text class="lab" x="16" y="238">Stopped, Elastic IP kept</text>
<rect class="s2" x="16.0" y="246" width="141.0" height="20"><title>Stopped, Elastic IP kept: Elastic IP $3.65</title></rect>
<path class="s3" d="M159.0,246.0 L180.0,246.0 Q184.0,246.0 184.0,250.0 L184.0,262.0 Q184.0,266.0 180.0,266.0 L159.0,266.0 Z"><title>Stopped, Elastic IP kept: EBS volume $0.64</title></path>
<text class="lab" x="192.0" y="261">$4.29</text>
<text class="lab" x="16" y="294">Terminated</text>
<text class="lab" x="24.0" y="317">$0.00: nothing left to bill</text>
<line class="axis" x1="16" x2="16" y1="130" y2="336"/>
<text class="note" x="16" y="360">Stopping releases the automatic public IPv4 address; an Elastic IP is charged until you release it.</text>
<text class="note" x="16" y="376">Prices from the AWS Price List, retrieved 2026-10-24. Terminated assumes the volume is set to delete on termination.</text>
</svg>
