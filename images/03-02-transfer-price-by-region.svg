<text class="small" x="16" y="330.0">Blue bars: the two Regions the bakery uses; gray bars: others. Sending 100 GB costs about $9 from either of them,</text>
<text class="small" x="16" y="347.0">and about $15 from São Paulo. The first 100 GB a month across all Regions is free (as of 2026-10-23).</text>
<text class="note" x="16" y="368">Prices change. Check the AWS pricing pages or AWS Pricing Calculator for today's rates.</text>
