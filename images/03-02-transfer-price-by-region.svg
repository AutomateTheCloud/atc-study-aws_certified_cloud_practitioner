<svg xmlns="http://www.w3.org/2000/svg" width="680" height="386" viewBox="0 0 680 386" role="img" aria-labelledby="t d">
<title id="t">Price of sending data to the internet from seven Regions, published 2026-09-16</title>
<desc id="d">Horizontal bar chart of US dollars per GB for the first 10 TB a month of data sent to the internet, from AWS's price list published 2026-09-16. US East (N. Virginia): $0.090, a bakery Region. Europe (Frankfurt): $0.090, a bakery Region. Europe (Ireland): $0.090. Asia Pacific (Tokyo): $0.114. Asia Pacific (Singapore): $0.120. South America (São Paulo): $0.150. Africa (Cape Town): $0.154. Sending 100 GB costs about $9 from either bakery Region and about $15 from São Paulo; the first 100 GB a month across all Regions is free as of 2026-10-23.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --az-fill:#d9e8fb; --you-fill:#fbe1d6; --zone-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
