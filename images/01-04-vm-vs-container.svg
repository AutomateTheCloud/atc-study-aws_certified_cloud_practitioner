<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">Virtual machines compared with containers</title>
<desc id="d">Two panels. Virtual machines: two boxes, app A and app B, each with its own operating system, on a hypervisor, on a physical server. Notes: each one carries its own operating system; it behaves like a whole computer; Amazon EC2 rents these (Module 06). Containers: two boxes, app A and app B, each with its libraries and no operating system of its own, on one shared operating system, on a physical server. Notes: each one is an app and what it depends on; no operating system of its own, so lighter; lesson 06.03 covers them on AWS.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --you-fill:#fbe1d6; --none-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --you-fill:#4d2716; --none-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .you { fill: var(--you-fill); stroke: var(--s2); stroke-width: 1.5; }
  .other { fill: var(--none-fill); stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .hl { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 3; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 11.5px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .frame { fill: none; stroke: var(--axis); stroke-width: 1; }
  .theline { stroke: var(--ink); stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; stroke-linecap: round; }
  .linelab { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
</style>
<rect width="680" height="420" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Virtual machines and containers</text>
<text class="sub" x="16" y="48">Both share one physical server; they differ in what each copy carries</text>
<rect class="frame" x="16" y="70" width="316" height="334" rx="8"/>
<text class="head" x="30" y="94">Virtual machines</text>
<rect class="frame" x="27.0" y="105" width="143.0" height="102" rx="6"/>
<rect class="you" x="30.0" y="108.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="98.5" y="134.5" text-anchor="middle">App A</text>
<rect class="you" x="30.0" y="160.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="98.5" y="186.5" text-anchor="middle">Its own OS</text>
<rect class="frame" x="178.0" y="105" width="143.0" height="102" rx="6"/>
<rect class="you" x="181.0" y="108.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="249.5" y="134.5" text-anchor="middle">App B</text>
<rect class="you" x="181.0" y="160.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="249.5" y="186.5" text-anchor="middle">Its own OS</text>
<rect class="aws" x="30.0" y="216.0" width="288.0" height="40.0" rx="5"/>
<text class="cellt" x="174.0" y="240.5" text-anchor="middle">Hypervisor</text>
<rect class="aws" x="30.0" y="264.0" width="288.0" height="40.0" rx="5"/>
<text class="cellt" x="174.0" y="288.5" text-anchor="middle">Physical server</text>
<text class="small" x="30" y="330">• Each one carries its own operating system</text>
<text class="small" x="30" y="350">• Behaves like a whole computer</text>
<text class="small" x="30" y="370">• Amazon EC2 rents these (Module 06)</text>
<rect class="frame" x="348" y="70" width="316" height="334" rx="8"/>
<text class="head" x="362" y="94">Containers</text>
<rect class="frame" x="359.0" y="105" width="143.0" height="56" rx="6"/>
<rect class="you" x="362.0" y="108.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="430.5" y="126.0" text-anchor="middle">App A</text>
<text class="cells" x="430.5" y="141.0" text-anchor="middle">+ its libraries</text>
<rect class="frame" x="510.0" y="105" width="143.0" height="56" rx="6"/>
<rect class="you" x="513.0" y="108.0" width="137.0" height="44.0" rx="5"/>
<text class="cellt" x="581.5" y="126.0" text-anchor="middle">App B</text>
<text class="cells" x="581.5" y="141.0" text-anchor="middle">+ its libraries</text>
<text class="note" x="506.0" y="188" text-anchor="middle">No operating system inside each container</text>
<rect class="aws" x="362.0" y="216.0" width="288.0" height="40.0" rx="5"/>
<text class="cellt" x="506.0" y="240.5" text-anchor="middle">One shared operating system</text>
<rect class="aws" x="362.0" y="264.0" width="288.0" height="40.0" rx="5"/>
<text class="cellt" x="506.0" y="288.5" text-anchor="middle">Physical server</text>
<text class="small" x="362" y="330">• Each one is an app and what it depends on</text>
<text class="small" x="362" y="350">• No operating system of its own, so lighter</text>
<text class="small" x="362" y="370">• Lesson 06.03 covers them on AWS</text>
</svg>
