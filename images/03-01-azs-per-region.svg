<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img" aria-labelledby="t d">
<title id="t">Regions by number of Availability Zones, as of 2026-10-23</title>
<desc id="d">Horizontal bar chart of the 34 Regions in the AWS Regions table, checked 2026-10-23. One AZ: none. Two AZs: none. Three AZs: 30 Regions. Four AZs: 3 Regions. Five AZs: none. Six AZs: 1 Region, US East (N. Virginia). A dashed line marks AWS's minimum of three AZs per Region; no bar sits below it. A note says that in US West (N. California) the Region has three AZs but newer accounts can use only two, and that counts change, so check AWS's live pages rather than memorize them.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --az-fill:#d9e8fb; --you-fill:#fbe1d6; --dc-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --az-fill:#1b3554; --you-fill:#4d2716; --dc-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .region { fill: none; stroke: var(--ink2); stroke-width: 1.5; }
  .region2 { fill: none; stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .az { fill: var(--az-fill); stroke: var(--s1); stroke-width: 1.5; }
  .dc { fill: var(--dc-fill); stroke: var(--ink2); stroke-width: 1; }
  .you { fill: var(--you-fill); stroke: var(--s2); stroke-width: 1.5; }
  .gone { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .edge { fill: var(--dc-fill); stroke: var(--ink2); stroke-width: 1; }
  .link { stroke: var(--ink2); stroke-width: 2; fill: none; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .tiny { fill: var(--ink2); font-size: 11px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .minline { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; }
</style>
<rect width="680" height="360" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">No Region in AWS's table has fewer than three AZs</text>
<text class="sub" x="16" y="48">Number of Regions with each count of Availability Zones, 34 Regions in AWS's table, checked 2026-10-23</text>
<text class="lab" x="108" y="103" text-anchor="end">1 AZ</text>
<text class="small" x="128" y="104">none</text>
<text class="lab" x="108" y="137" text-anchor="end">2 AZs</text>
<text class="small" x="128" y="138">none</text>
<text class="lab" x="108" y="171" text-anchor="end">3 AZs</text>
<path class="s1" d="M120.0,158.0 L536.0,158.0 Q540.0,158.0 540.0,162.0 L540.0,174.0 Q540.0,178.0 536.0,178.0 L120.0,178.0 Z"><title>3 AZs: 30 Regions</title></path>
<text class="lab" x="548.0" y="172">30 Regions</text>
<text class="lab" x="108" y="205" text-anchor="end">4 AZs</text>
<path class="s1" d="M120.0,192.0 L158.0,192.0 Q162.0,192.0 162.0,196.0 L162.0,208.0 Q162.0,212.0 158.0,212.0 L120.0,212.0 Z"><title>4 AZs: 3 Regions</title></path>
<text class="lab" x="170.0" y="206">3 Regions</text>
<text class="lab" x="108" y="239" text-anchor="end">5 AZs</text>
<text class="small" x="128" y="240">none</text>
<text class="lab" x="108" y="273" text-anchor="end">6 AZs</text>
<path class="s1" d="M120.0,260.0 L130.0,260.0 Q134.0,260.0 134.0,264.0 L134.0,276.0 Q134.0,280.0 130.0,280.0 L120.0,280.0 Z"><title>6 AZs: 1 Region</title></path>
<text class="lab" x="142.0" y="274">1 Region</text>
<line class="axis" x1="120" x2="120" y1="86" y2="282"/>
<line class="minline" x1="16" x2="580" y1="152" y2="152"/>
<text class="small" x="580" y="146" text-anchor="end">AWS's minimum: three AZs per Region</text>
<text class="small" x="16" y="304.0">Most Regions have three; a few have more. US East (N. Virginia) has six.</text>
<text class="small" x="16" y="321.0">One catch: in US West (N. California), the Region has three AZs, but AWS says newer accounts can use only two.</text>
<text class="note" x="16" y="342">Counts change as AWS adds Regions and AZs. Check AWS's live pages; don't memorize these numbers.</text>
</svg>
