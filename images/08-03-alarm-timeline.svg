<path class="bar-hi" d="M308.0,304.0 L308.0,168.0 Q308.0,164.0 312.0,164.0 L316.7,164.0 Q320.7,164.0 320.7,168.0 L320.7,304.0 Z"><title>13:15 to 13:20: 7 errors</title></path>
<path class="bar-hi" d="M324.7,304.0 L324.7,128.0 Q324.7,124.0 328.7,124.0 L333.3,124.0 Q337.3,124.0 337.3,128.0 L337.3,304.0 Z"><title>13:20 to 13:25: 9 errors</title></path>
