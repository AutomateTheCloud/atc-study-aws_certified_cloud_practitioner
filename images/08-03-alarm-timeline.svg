<text class="small" x="285.33333333333337" y="386.0" text-anchor="end">13:10 OK → ALARM:</text>
<text class="small" x="285.33333333333337" y="401.0" text-anchor="end">email to the owner</text>
<text class="small" x="360.0" y="386.0">13:30 ALARM → OK:</text>
<text class="small" x="360.0" y="401.0">an “all clear” email, if you asked for one</text>
<text class="note" x="16" y="432">Four bad periods, one email: actions run when the state changes. Drawn by period; in practice each change</text>
<text class="note" x="16" y="448">comes shortly after the period ends. From the CloudWatch User Guide (alarms), checked 2026-10-24.</text>
</svg>
