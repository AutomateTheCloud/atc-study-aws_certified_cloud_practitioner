<path class="bar-n" d="M524.7,304.0 L524.7,288.0 Q524.7,284.0 528.7,284.0 L533.3,284.0 Q537.3,284.0 537.3,288.0 L537.3,304.0 Z"><title>14:20 to 14:25: 1 error</title></path>
