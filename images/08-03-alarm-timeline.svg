<path class="bar-n" d="M174.7,304.0 L174.7,288.0 Q174.7,284.0 178.7,284.0 L183.3,284.0 Q187.3,284.0 187.3,288.0 L187.3,304.0 Z"><title>12:35 to 12:40: 1 error</title></path>
