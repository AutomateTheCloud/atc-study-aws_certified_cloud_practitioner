<text class="note" x="576" y="168" text-anchor="middle">HTTPS</text>
<rect class="hi" x="486" y="176" width="180" height="92" rx="6"/>
<text class="mono" x="496" y="196">key: cakes/birthday.jpg</text>
<text class="mono" x="496" y="214">data: the whole photo</text>
<text class="mono" x="496" y="232">metadata: type, date</text>
<text class="mono" x="496" y="256">key: menus/may.pdf ...</text>
<text class="small" x="576" y="286" text-anchor="middle">Each object has a key</text>
<text class="small" x="482" y="316.0">Programs put and get whole</text>
<text class="small" x="482" y="332.0">objects through an API, from</text>
<text class="small" x="482" y="348.0">anywhere they are allowed to.</text>
<text class="ex" x="482" y="400">Amazon S3</text>
<text class="ex" x="482" y="420">(all its storage classes)</text>
<text class="note" x="16" y="466">Our summary of the Amazon EFS FAQ ("EFS vs. EBS vs. S3"), checked 2026-10-24. File and key names are made up.</text>
