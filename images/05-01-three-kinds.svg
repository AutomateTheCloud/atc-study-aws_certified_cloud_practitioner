<text class="small" x="124" y="286" text-anchor="middle">Numbered blocks, no names</text>
<text class="small" x="30" y="316.0">The server's operating system</text>
<text class="small" x="30" y="332.0">formats the disk and keeps its</text>
<text class="small" x="30" y="348.0">own files on it, as on a</text>
<text class="small" x="30" y="364.0">laptop's drive.</text>
<text class="ex" x="30" y="400">Amazon EBS</text>
<text class="ex" x="30" y="420">EC2 instance store</text>
<text class="head" x="256" y="90">File</text>
<text class="small" x="256" y="108">A shared folder tree</text>
<rect class="box" x="256" y="126" width="58" height="26" rx="4"/>
