<text class="small" x="350" y="286" text-anchor="middle">Folders and file names</text>
<text class="small" x="256" y="316.0">Many servers connect over the</text>
<text class="small" x="256" y="332.0">network at the same time and</text>
<text class="small" x="256" y="348.0">see the same files.</text>
<text class="ex" x="256" y="400">Amazon EFS</text>
<text class="ex" x="256" y="420">Amazon FSx</text>
