<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="t d">
<title id="t">Block, file and object storage side by side</title>
<desc id="d">Three panels. Block: a disk for one server. One server connects to a disk drawn as numbered blocks with no names; the server's operating system formats the disk and keeps its own files on it, as on a laptop's drive. Examples: Amazon EBS and EC2 instance store. File: a shared folder tree. Three servers connect to one folder tree with folders and file names; many servers connect over the network at the same time and see the same files. Examples: Amazon EFS and Amazon FSx. Object: whole objects in a bucket. An app and a phone reach the bucket over HTTPS; each object has a key, such as cakes/birthday.jpg, the whole data, and metadata; programs put and get whole objects through an API. Example: Amazon S3, with all its storage classes.</desc>

<style>
