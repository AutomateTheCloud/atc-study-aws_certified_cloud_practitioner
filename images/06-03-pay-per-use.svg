<svg xmlns="http://www.w3.org/2000/svg" width="680" height="483" viewBox="0 0 680 483" role="img" aria-labelledby="t d">
<title id="t">Monthly compute cost of resizing photos: AWS Lambda against one always-on t3.micro instance</title>
<desc id="d">A line chart. The horizontal axis is photos resized per month, from 0 to 1 million; the vertical axis is dollars per month, from 0 to 18. A flat line for one t3.micro instance running all month sits at $7.59, whether busy or idle. A straight Lambda line, before the free allowance, rises from $0 to about $16.87 at 1 million photos and crosses the server line at about 450 thousand photos. A dashed Lambda line, after the monthly free allowance, stays at $0 until 400 thousand photos, then rises and crosses the server line at about 860 thousand photos. A dot marks the bakery today: about 3,000 photos a month, $0.05 before the free allowance and $0 after it. Assumptions: each resize needs 512 MB for 2 seconds; one t3.micro could keep up; compute charges only. Prices as of 2026-10-24.</desc>

