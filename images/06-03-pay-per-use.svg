<text class="ann" x="317.1" y="196.6" text-anchor="end">About 450k photos: the server</text>
<text class="ann" x="317.1" y="212.6" text-anchor="end">becomes the cheaper choice</text>
<line class="lead" x1="321.1" x2="325.1" y1="216.6" y2="230.6"/>
<text class="ann" x="560.2" y="260.6" text-anchor="middle">About 860k with</text>
<text class="ann" x="560.2" y="276.6" text-anchor="middle">the free allowance</text>
<text class="ann" x="72" y="254.6">$7.59 a month, busy or idle</text>
<circle class="dot-s1" cx="65.7" cy="341.3" r="5"/>
<text class="ann" x="79.7" y="117.0">The bakery today: about 3,000 photos a month,</text>
<text class="ann" x="79.7" y="133.0">$0.05 before the free allowance, $0 after it</text>
<line class="lead" x1="66.7" x2="73.7" y1="334.3" y2="113.0"/>
<text class="note" x="16" y="404">Assumes each resize needs 512 MB for 2 seconds (1 GB-second), and that one t3.micro could keep up;</text>
<text class="note" x="16" y="419">made up for teaching. Lambda: $0.20 per million requests and $0.0000166667 per GB-second (x86).</text>
<text class="note" x="16" y="434">Free allowance: 1 million requests and 400,000 GB-seconds a month. t3.micro: $0.0104 an hour, 730 hours.</text>
<text class="note" x="16" y="449">Compute only: storage, logs and data transfer are left out. Sources: AWS Price List offer files,</text>
<text class="note" x="16" y="464">retrieved 2026-10-24; Lambda pricing page, checked 2026-10-23. Prices change.</text>
</svg>
