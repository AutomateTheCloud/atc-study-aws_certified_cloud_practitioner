</style>
<rect width="700" height="470" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Five choices make an EC2 instance</text>
<text class="sub" x="16" y="48">You make them when you launch. This lesson is mostly about the second one.</text>
<rect class="panel" x="16" y="72" width="340" height="64" rx="6"/>
<text class="cellt" x="30" y="94">1. Amazon Machine Image (AMI)</text>
<text class="small" x="30" y="112.0">The template: an operating system and any software</text>
<text class="small" x="30" y="127.0">that comes with it</text>
<line class="wire" x1="356" y1="104.0" x2="474" y2="252.0"/>
<rect class="hi" x="16" y="146" width="340" height="64" rx="6"/>
<text class="cellt" x="30" y="168">2. Instance type</text>
<text class="small" x="30" y="186.0">How much hardware: vCPUs, memory, storage and</text>
<text class="small" x="30" y="201.0">network speed</text>
<line class="wire" x1="356" y1="178.0" x2="474" y2="252.0"/>
<rect class="panel" x="16" y="220" width="340" height="64" rx="6"/>
<text class="cellt" x="30" y="242">3. Storage</text>
<text class="small" x="30" y="260.0">An EBS root volume: the disk it starts from, which</text>
<text class="small" x="30" y="275.0">lives apart from it</text>
<line class="wire" x1="356" y1="252.0" x2="474" y2="252.0"/>
<rect class="panel" x="16" y="294" width="340" height="64" rx="6"/>
<text class="cellt" x="30" y="316">4. Network and security group</text>
<text class="small" x="30" y="334.0">Which Availability Zone it runs in, and who may</text>
<text class="small" x="30" y="349.0">connect, on which ports</text>
<line class="wire" x1="356" y1="326.0" x2="474" y2="252.0"/>
<rect class="panel" x="16" y="368" width="340" height="64" rx="6"/>
<text class="cellt" x="30" y="390">5. Access</text>
<text class="small" x="30" y="408.0">How you sign in: a key pair, or EC2 Instance Connect</text>
<text class="small" x="30" y="423.0">with your IAM identity</text>
<line class="wire" x1="356" y1="400.0" x2="474" y2="252.0"/>
<rect class="zone" x="404" y="72" width="280" height="356" rx="10"/>
<text class="small" x="418" y="94">Region: US East (N. Virginia)</text>
<rect class="zone" x="424" y="108" width="240" height="300" rx="8"/>
<text class="small" x="438" y="130">One Availability Zone</text>
<rect class="box" x="474" y="206.0" width="170" height="92" rx="8" style="stroke-width:2"/>
<text class="head" x="559" y="240.0" text-anchor="middle">EC2 instance</text>
<text class="small" x="559" y="260.0" text-anchor="middle">a virtual server,</text>
<text class="small" x="559" y="276.0" text-anchor="middle">billed while it runs</text>
<text class="note" x="16" y="456">Our summary of the EC2 User Guide, "What is Amazon EC2?", checked 2026-10-24.</text>
</svg>
