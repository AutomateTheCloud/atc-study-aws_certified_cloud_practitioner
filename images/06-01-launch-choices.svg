<svg xmlns="http://www.w3.org/2000/svg" width="700" height="470" viewBox="0 0 700 470" role="img" aria-labelledby="t d">
<title id="t">The five choices that make an EC2 instance</title>
<desc id="d">Five numbered cards on the left, each joined by a line to one EC2 instance on the right. 1, Amazon Machine Image (AMI): the template, an operating system and any software that comes with it. 2, Instance type, highlighted: how much hardware, vCPUs, memory, storage and network speed. 3, Storage: an EBS root volume, the disk it starts from, which lives apart from it. 4, Network and security group: which Availability Zone it runs in, and who may connect, on which ports. 5, Access: how you sign in, a key pair or EC2 Instance Connect with your IAM identity. The instance, a virtual server billed while it runs, sits inside one Availability Zone inside the US East (N. Virginia) Region.</desc>

