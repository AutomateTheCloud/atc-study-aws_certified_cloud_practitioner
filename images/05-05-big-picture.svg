<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img" aria-labelledby="t d">
<title id="t">One Amazon RDS order database with a Multi-AZ standby, a read replica and backups</title>
<desc id="d">A Region, US East (N. Virginia), holding three Availability Zones side by side. In AZ A, the primary takes every read and write from the website. In AZ B, the Multi-AZ standby takes no traffic and waits to take over if the primary fails; an arrow labeled sync shows it gets every write at once (synchronously). In AZ C, a read replica answers read-only queries such as reports; an arrow from the primary to the replica is labeled async: changes arrive a little later, so the replica can lag behind. Below the AZs, for the whole Region: automated backups and snapshots stored in Amazon S3, a daily snapshot plus a log of every change, restorable to any second in the retention period (7 days by default, up to 35) or to a snapshot you took. A key lists each copy's job: the standby keeps the database running if its AZ fails (high availability); the read replica takes read-only work off the primary (read scaling); backups and snapshots go back to before a mistake (point-in-time recovery).</desc>

