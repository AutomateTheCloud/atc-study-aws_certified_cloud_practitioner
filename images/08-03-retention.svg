<text class="note" x="16" y="368">To keep account activity longer than 90 days, create a CloudTrail trail: it delivers events to an S3 bucket</text>
<text class="note" x="16" y="384">you keep. Logs grow until you set retention (Lab 07). From the CloudWatch, CloudWatch Logs, X-Ray and</text>
<text class="note" x="16" y="400">CloudTrail user guides, checked 2026-10-24.</text>
