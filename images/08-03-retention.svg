<svg xmlns="http://www.w3.org/2000/svg" width="680" height="426" viewBox="0 0 680 426" role="img" aria-labelledby="t d">
<title id="t">How long CloudWatch, X-Ray and CloudTrail keep records by default</title>
<desc id="d">Horizontal bars, in days. AWS X-Ray traces: 30 days. CloudWatch alarm history: 30 days. CloudTrail Event history: 90 days of management events, per Region. CloudWatch metrics: 455 days, about 15 months, with detail coarsening after 15 and 63 days. CloudWatch Logs, highlighted, with an arrow running off the chart: kept until you set retention, because the default never expires. A note says that to keep account activity longer than 90 days, you create a CloudTrail trail, which delivers events to an S3 bucket you keep.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; --no-fill:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; --no-fill:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
