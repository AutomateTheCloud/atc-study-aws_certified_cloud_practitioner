<svg xmlns="http://www.w3.org/2000/svg" width="680" height="514" viewBox="0 0 680 514" role="img" aria-labelledby="t d">
<title id="t">A request and its reply passing a network ACL and a security group</title>
<desc id="d">Left to right: a customer on the internet; the bakery's VPC, holding an internet gateway and a public subnet. The subnet's left edge is a band labeled network ACL. Inside the subnet, a dashed ring labeled security group surrounds the web server, which listens on port 443 for HTTPS. A request arrow runs from the customer through the internet gateway, across the network ACL (check 1) and the security group ring (check 2) to the server. A reply arrow runs back from the server across the security group (check 3) and the network ACL (check 4, highlighted) to the gateway and the customer, to the customer's high-numbered port. The checks: 1, network ACL inbound rules, checked in number order, one must allow HTTPS (TCP port 443) from the customer; 2, security group inbound rules, one must allow HTTPS, and any matching allow rule lets it in; 3, security group, the reply is allowed automatically because it remembers the request (stateful); 4, network ACL outbound rules, checked again as if new, one must allow traffic to the customer's high-numbered port (stateless).</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ok-fill:#d9e8fb; --no-fill:#fbe1d6; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ok-fill:#1b3554; --no-fill:#4d2716; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
