  .subnet { fill: none; stroke: var(--ink2); stroke-width: 1.2; }
  .nacl { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .sg { fill: none; stroke: var(--s1); stroke-width: 2; stroke-dasharray: 7 4; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 12px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .arrlab { fill: var(--ink2); font-size: 11.5px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .num { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .numh { fill: var(--s1); stroke: var(--s1); stroke-width: 1.5; }
  .numhl { fill: var(--surface); font-size: 13px; font-weight: 700; }
</style>
<rect width="680" height="514" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Two checkpoints in, two checkpoints out</text>
<text class="sub" x="16" y="48">A customer's request to the bakery's web server, and the reply, in four numbered checks</text>
<rect class="plain" x="16.0" y="128.0" width="84.0" height="88.0" rx="6"/>
<text class="cellt" x="58" y="160.0" text-anchor="middle">Customer</text>
<text class="cellt" x="58" y="176.0" text-anchor="middle">on the</text>
<text class="cellt" x="58" y="192.0" text-anchor="middle">internet</text>
<rect class="vpc" x="112.0" y="72.0" width="552.0" height="236.0" rx="8"/>
<text class="head" x="122" y="90">The bakery's VPC</text>
<rect class="plain" x="124.0" y="128.0" width="80.0" height="88.0" rx="6"/>
<text class="cellt" x="164" y="160.0" text-anchor="middle">Internet</text>
<text class="cellt" x="164" y="176.0" text-anchor="middle">gateway</text>
<rect class="subnet" x="232.0" y="100.0" width="420.0" height="196.0" rx="6"/>
<text class="head" x="304" y="118">Public subnet</text>
<rect class="nacl" x="232.0" y="100.0" width="60.0" height="196.0" rx="6"/>
<text class="cellt" transform="translate(279,198.0) rotate(-90)" text-anchor="middle">Network ACL</text>
<rect class="sg" x="440.0" y="118.0" width="200.0" height="164.0" rx="10"/>
<text class="head" x="452" y="138">Security group</text>
<rect class="plain" x="490.0" y="162.0" width="130.0" height="72.0" rx="6"/>
<text class="cellt" x="555" y="194.0" text-anchor="middle">Web server</text>
<text class="small" x="555" y="212" text-anchor="middle">port 443 (HTTPS)</text>
<line class="arrow" x1="101.0" y1="150.0" x2="123.0" y2="150.0"/>
<path class="arrowhead" d="M115.0,145.0 L115.0,155.0 L123.0,150.0 Z"/>
<line class="arrow" x1="205.0" y1="150.0" x2="489.0" y2="150.0"/>
<path class="arrowhead" d="M481.0,145.0 L481.0,155.0 L489.0,150.0 Z"/>
<text class="arrlab" x="308" y="142">request</text>
<circle class="numc" cx="250" cy="150" r="11"/>
<text class="num" x="250" y="154.5" text-anchor="middle">1</text>
<circle class="numc" cx="440" cy="150" r="11"/>
<text class="num" x="440" y="154.5" text-anchor="middle">2</text>
<line class="arrow" x1="489.0" y1="252.0" x2="205.0" y2="252.0"/>
<path class="arrowhead" d="M213.0,257.0 L213.0,247.0 L205.0,252.0 Z"/>
<line class="arrow" x1="123.0" y1="252.0" x2="101.0" y2="252.0"/>
<path class="arrowhead" d="M109.0,257.0 L109.0,247.0 L101.0,252.0 Z"/>
<text class="arrlab" x="308" y="272">reply, to the customer's</text>
<text class="arrlab" x="308" y="286">high-numbered port</text>
<circle class="numc" cx="440" cy="252" r="11"/>
<text class="num" x="440" y="256.5" text-anchor="middle">3</text>
<circle class="numh" cx="250" cy="252" r="11"/>
<text class="numhl" x="250" y="256.5" text-anchor="middle">4</text>
<circle class="numc" cx="28" cy="330" r="11"/>
<text class="num" x="28" y="334.5" text-anchor="middle">1</text>
<text class="rowl" x="48" y="334">Network ACL, inbound rules:</text>
<text class="small" x="250" y="334.0">checked in number order; one must allow HTTPS (TCP port 443)</text>
<text class="small" x="250" y="350.0">from the customer.</text>
<circle class="numc" cx="28" cy="370" r="11"/>
<text class="num" x="28" y="374.5" text-anchor="middle">2</text>
<text class="rowl" x="48" y="374">Security group, inbound rules:</text>
<text class="small" x="250" y="374.0">one must allow HTTPS; any matching allow rule lets it in.</text>
<circle class="numc" cx="28" cy="394" r="11"/>
<text class="num" x="28" y="398.5" text-anchor="middle">3</text>
<text class="rowl" x="48" y="398">Security group, the reply:</text>
<text class="small" x="250" y="398.0">allowed automatically, because it remembers the request</text>
<text class="small" x="250" y="414.0">(stateful).</text>
<circle class="numh" cx="28" cy="434" r="11"/>
<text class="numhl" x="28" y="438.5" text-anchor="middle">4</text>
<text class="rowl" x="48" y="438">Network ACL, outbound rules:</text>
<text class="small" x="250" y="438.0">checked again, as if new; one must allow traffic to the</text>
<text class="small" x="250" y="454.0">customer's high-numbered port (stateless).</text>
<text class="note" x="16" y="484">The route table delivers traffic between the gateway and the subnet. From the Amazon VPC User Guide and FAQ, checked</text>
<text class="note" x="16" y="500">2026-10-23. The bakery is made up for teaching.</text>
</svg>
