<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="t d">
<title id="t">Monthly fee of each paid AWS Support plan by monthly AWS bill</title>
<desc id="d">Log-log line chart. Business Support+ is flat at $29 until the bill reaches about $322, then rises with it: $108 at the bakery's $1,200 bill. Enterprise is flat at $5,000 until about $50,000, then rises: $12,000 at the retailer's $120,000. Unified Operations is flat at $50,000 until $500,000: it is still $50,000 at the payments company's $400,000. At the bakery's bill, the three plans cost $108, $5,000 and $50,000.</desc>

