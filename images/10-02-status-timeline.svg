<svg xmlns="http://www.w3.org/2000/svg" width="680" height="713" viewBox="0 0 680 713" role="img" aria-labelledby="t d">
<title id="t">AI service renames, closures and an end of support from 2024 to 2027</title>
<desc id="d">A vertical timeline with a line marking today, 2026-10-24. Already happened: 2024-07-29, closed to new customers, Amazon Forecast's closure to new customers announced; 2024-12-03, renamed, Amazon SageMaker renamed Amazon SageMaker AI; 2025-11-07, closed to new customers, Amazon Fraud Detector; 2026-05-15, closed to new customers, no new Amazon Q Developer sign-ups in code editors or new subscriptions; 2026-06-30, closed to new customers, Amazon Q Business's closure announced; 2026-07-30, closed to new customers, Amazon Kendra. Still to come: 2027-04-30, end of support, Amazon Q Developer IDE plugins and paid subscriptions. Existing customers keep using closed services.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --hi-fill:#fbe1d6; --card-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --hi-fill:#4d2716; --card-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s2); stroke-width: 2.5; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .panelhi { fill: none; stroke: var(--s2); stroke-width: 3; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .grp { fill: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.3px; }
  .colh { fill: var(--muted); font-size: 11.5px; font-weight: 600; letter-spacing: 0.5px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .flow { stroke: var(--ink2); stroke-width: 1.8; fill: none; }
  .head-ink { fill: var(--ink2); }
  .spine { stroke: var(--axis); stroke-width: 2; }
  .ring { fill: var(--surface); stroke: var(--s1); stroke-width: 2; }
  .sq { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .today { stroke: var(--ink); stroke-width: 1.5; }
  .date { fill: var(--ink2); font-size: 12px; font-variant-numeric: tabular-nums; }
  .zone { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .lab2 { fill: var(--ink); font-size: 13px; }
</style>
<rect width="680" height="713" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">AI names that changed: what you may still read, and what's true now</text>
<text class="sub" x="16" y="50">Renames, closures to new customers and an end of support, mid-2024 to 2027 (checked 2026-10-24)</text>
<line class="spine" x1="120" x2="120" y1="92" y2="652"/>
<line class="axis" x1="114" x2="120" y1="201.4" y2="201.4"/>
<text class="tick" x="110" y="205.4" text-anchor="end">Jan 2025</text>
<line class="axis" x1="114" x2="120" y1="388.1" y2="388.1"/>
<text class="tick" x="110" y="392.1" text-anchor="end">Jan 2026</text>
<line class="axis" x1="114" x2="120" y1="574.8" y2="574.8"/>
<text class="tick" x="110" y="578.8" text-anchor="end">Jan 2027</text>
<line class="today" x1="112" x2="664" y1="539.5" y2="539.5"/>
<text class="zone" x="664" y="533.5" text-anchor="end">ALREADY HAPPENED ↑</text>
<text class="zone" x="664" y="554.5" text-anchor="end">ANNOUNCED, STILL TO COME ↓</text>
<text class="lab" x="16" y="543.5">Today</text>
<text class="tick" x="16" y="559.5">2026-10-24</text>
<circle class="dot-s1" cx="120" cy="121.7" r="6"/>
<line class="lead" x1="128" x2="144" y1="121.7" y2="121.7"/>
<text class="date" x="148" y="125.7">2024-07-29</text>
<text class="zone" x="230" y="125.7">CLOSED TO NEW CUSTOMERS</text>
<text class="lab2" x="230" y="143.7">Amazon Forecast: closure to new customers announced</text>
<rect class="sq" x="114" y="180.6" width="12" height="12" rx="2"/>
<line class="lead" x1="128" x2="144" y1="186.6" y2="186.6"/>
<text class="date" x="148" y="190.6">2024-12-03</text>
<text class="zone" x="230" y="190.6">RENAMED</text>
<text class="lab2" x="230" y="208.6">Amazon SageMaker renamed Amazon SageMaker AI</text>
<circle class="dot-s1" cx="120" cy="360.0" r="6"/>
<line class="lead" x1="128" x2="144" y1="360.0" y2="360.0"/>
<text class="date" x="148" y="364.0">2025-11-07</text>
<text class="zone" x="230" y="364.0">CLOSED TO NEW CUSTOMERS</text>
<text class="lab2" x="230" y="382.0">Amazon Fraud Detector closes to new customers</text>
<circle class="dot-s1" cx="120" cy="456.6" r="6"/>
<line class="lead" x1="128" x2="144" y1="456.6" y2="407.5"/>
<text class="date" x="148" y="411.5">2026-05-15</text>
<text class="zone" x="230" y="411.5">CLOSED TO NEW CUSTOMERS</text>
<text class="lab2" x="230" y="429.5">Q Developer: no new code-editor sign-ups or subscriptions</text>
<circle class="dot-s1" cx="120" cy="480.2" r="6"/>
<line class="lead" x1="128" x2="144" y1="480.2" y2="451.5"/>
<text class="date" x="148" y="455.5">2026-06-30</text>
<text class="zone" x="230" y="455.5">CLOSED TO NEW CUSTOMERS</text>
<text class="lab2" x="230" y="473.5">Amazon Q Business: closure to new customers announced</text>
<circle class="dot-s1" cx="120" cy="495.5" r="6"/>
<line class="lead" x1="128" x2="144" y1="495.5" y2="495.5"/>
<text class="date" x="148" y="499.5">2026-07-30</text>
<text class="zone" x="230" y="499.5">CLOSED TO NEW CUSTOMERS</text>
<text class="lab2" x="230" y="517.5">Amazon Kendra closes to new customers</text>
<circle class="ring" cx="120" cy="635.6" r="6"/>
<line class="lead" x1="128" x2="144" y1="635.6" y2="635.6"/>
<text class="date" x="148" y="639.6">2027-04-30</text>
<text class="zone" x="230" y="639.6">END OF SUPPORT</text>
<text class="lab2" x="230" y="657.6">Q Developer IDE plugins and paid subscriptions end</text>
<text class="tick" x="16" y="687">Square: renamed. Filled dot: closed to new customers. Ring: still to come.</text>
<text class="note" x="16" y="703">Existing customers keep using closed services. Dates from AWS availability notices and lifecycle lists.</text>
</svg>
