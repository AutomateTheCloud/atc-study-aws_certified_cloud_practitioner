<svg xmlns="http://www.w3.org/2000/svg" width="680" height="562" viewBox="0 0 680 562" role="img" aria-labelledby="t d">
<title id="t">Three questions, three services: CloudWatch, X-Ray and CloudTrail</title>
<desc id="d">Three panels, one per service, each with the question it answers, what it records and a bakery example. Amazon CloudWatch answers: how is the workload doing right now, and is anything wrong? It records metrics, numbers over time such as errors per 5 minutes; logs, the lines your code and servers write; and alarms, which act when a metric crosses a line. Example: the order function had 9 errors between 13:20 and 13:25, and the alarm emailed the owner. AWS X-Ray answers: where did this one request spend its time, and where did it fail? It records traces, one request's path through every part it touched with timings, and a trace map of the parts that called each other. Example: order 1043 took 2.45 seconds, 1.94 of them waiting for the payment provider. AWS CloudTrail answers: who changed what in the account, and when? It records events, one per action on your account by a person, a role or an AWS service, through the console, the CLI, an SDK or the API. Example: at 12:58 the nephew's IAM user changed the order function's settings.</desc>

