<svg xmlns="http://www.w3.org/2000/svg" width="680" height="332" viewBox="0 0 680 332" role="img" aria-labelledby="t d">
<title id="t">CLF-C02 domain weights</title>
<desc id="d">Horizontal bar chart of the four exam domains and their weights. Domain 1, Cloud Concepts: 24%, about 12 of 50 scored questions. Domain 2, Security and Compliance: 30%, about 15. Domain 3, Cloud Technology and Services: 34%, about 17. Domain 4, Billing, Pricing, and Support: 12%, about 6.</desc>

<style>
