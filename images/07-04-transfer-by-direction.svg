<svg xmlns="http://www.w3.org/2000/svg" width="680" height="422" viewBox="0 0 680 422" role="img" aria-labelledby="t d">
<title id="t">Data transfer prices by direction, from US East (N. Virginia)</title>
<desc id="d">Horizontal bar chart of US dollars per GB. In from the internet: $0.00, free. Within one Availability Zone, using private addresses: $0.00. From S3 to CloudFront: $0.00. Across Availability Zones: $0.02 in all, as $0.01 charged on the sending side plus $0.01 on the receiving side. To another Region: $0.02 to most Regions, $0.01 to US East (Ohio). Out to the internet: $0.09 for the first 10 TB a month, after 100 GB a month free across all Regions. Through a NAT gateway, shown gray: $0.045 per GB of processing, added on top of any transfer charge. Sources: the AWSDataTransfer price list published 2026-09-16, checked 2026-10-23, and the EC2 price list for the NAT gateway, checked 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --link-fill:#fbe1d6; --prem-fill:#f1f0ec; --net-fill:#ecebe6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --link-fill:#4d2716; --prem-fill:#252523; --net-fill:#262624; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .link { fill: var(--link-fill); stroke: var(--s2); stroke-width: 1.5; }
  .prem { fill: var(--prem-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .net { fill: var(--net-fill); stroke: var(--axis); stroke-width: 1; }
  .zone { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 6 4; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .cellhi { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .cell { fill: var(--prem-fill); stroke: var(--axis); stroke-width: 1; }
  .boxt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrlab { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
  .arrsub { fill: var(--ink2); font-size: 11px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .flow { stroke: var(--ink); stroke-width: 2; fill: none; }
  .flowp { stroke: var(--s1); stroke-width: 3; fill: none; }
  .flowt { stroke: var(--ink); stroke-width: 2; fill: none; stroke-dasharray: 8 4; }
  .mesh { stroke: var(--ink2); stroke-width: 1.5; }
  .node { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .hub { fill: var(--link-fill); stroke: var(--s2); stroke-width: 2; }
  .val { fill: var(--ink); font-size: 13px; font-variant-numeric: tabular-nums; }
  .zero { stroke: var(--s1); stroke-width: 2; }
  .other { fill: var(--muted); }
  .head-ink { fill: var(--ink); }
</style>
<rect width="680" height="422" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Data in is free; data across AZs, between Regions or out is not</text>
<text class="sub" x="16" y="48">US dollars per GB moved, from US East (N. Virginia), from AWS's price lists (see the note)</text>
<text class="lab" x="204" y="102" text-anchor="end">In from the internet</text>
<line class="zero" x1="216" x2="216" y1="88" y2="108"><title>In from the internet: $0.00 per GB</title></line>
<text class="val" x="226" y="103">$0.00 — free</text>
<text class="lab" x="204" y="138" text-anchor="end">Within one Availability Zone</text>
<line class="zero" x1="216" x2="216" y1="124" y2="144"><title>Within one Availability Zone: $0.00 per GB</title></line>
<text class="val" x="226" y="139">$0.00 — free (private addresses)</text>
<text class="lab" x="204" y="174" text-anchor="end">From S3 to CloudFront</text>
<line class="zero" x1="216" x2="216" y1="160" y2="180"><title>From S3 to CloudFront: $0.00 per GB</title></line>
<text class="val" x="226" y="175">$0.00 — free</text>
<text class="lab" x="204" y="210" text-anchor="end">Across Availability Zones</text>
<rect class="s1" x="216" y="196" width="25.0" height="20"><title>Sending side: $0.01 per GB</title></rect>
<path class="s1l" d="M243.0,196.0 L264.0,196.0 Q268.0,196.0 268.0,200.0 L268.0,212.0 Q268.0,216.0 264.0,216.0 L243.0,216.0 Z"><title>Receiving side: $0.01 per GB</title></path>
<text class="val" x="276.0" y="211">$0.01 out + $0.01 in</text>
<text class="lab" x="204" y="246" text-anchor="end">To another Region</text>
<path class="s1" d="M216.0,232.0 L264.0,232.0 Q268.0,232.0 268.0,236.0 L268.0,248.0 Q268.0,252.0 264.0,252.0 L216.0,252.0 Z"><title>To another Region: $0.020 per GB</title></path>
<text class="val" x="276.0" y="247">$0.02 to most; $0.01 to Ohio</text>
<text class="lab" x="204" y="282" text-anchor="end">Out to the internet</text>
<path class="s1" d="M216.0,268.0 L446.0,268.0 Q450.0,268.0 450.0,272.0 L450.0,284.0 Q450.0,288.0 446.0,288.0 L216.0,288.0 Z"><title>Out to the internet: $0.090 per GB</title></path>
<text class="val" x="458.0" y="283">$0.09 (first 10 TB a month)</text>
<text class="lab" x="204" y="318" text-anchor="end">Through a NAT gateway</text>
<path class="other" d="M216.0,304.0 L329.0,304.0 Q333.0,304.0 333.0,308.0 L333.0,320.0 Q333.0,324.0 329.0,324.0 L216.0,324.0 Z"><title>Through a NAT gateway: $0.045 per GB</title></path>
<text class="val" x="341.0" y="319">+$0.045 processing, on top</text>
<line class="axis" x1="216" x2="216" y1="84" y2="328"/>
<text class="small" x="16" y="350.0">Across AZs, each side pays $0.01, so a GB moved costs $0.02 in all. The 100 GB a month free out to the internet</text>
<text class="small" x="16" y="367.0">is counted across all Regions. The gray bar is a fee that adds to whatever transfer the traffic also pays.</text>
<text class="note" x="16" y="388.0">Transfer: AWSDataTransfer price list published 2026-09-16, checked 2026-10-23. NAT gateway: EC2 price list,</text>
<text class="note" x="16" y="403.0">checked 2026-10-24. Prices change; check the AWS pricing pages or AWS Pricing Calculator for today's rates.</text>
</svg>
