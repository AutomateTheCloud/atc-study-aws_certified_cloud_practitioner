<text class="lab" x="526.0" y="128.8" text-anchor="middle" style="font-weight:600">$57,600</text>
<line class="lead" x1="554" y1="276.5" x2="562" y2="276.5"/>
<text class="small" x="566" y="280.5">Usage bill $54,000</text>
<line class="lead" x1="554" y1="145.9" x2="562" y2="145.9"/>
<text class="small" x="566" y="149.9">Staff $3,600</text>
<text class="lab" x="526.0" y="420.0" text-anchor="middle">Cloud, left at</text>
<text class="lab" x="526.0" y="437.0" text-anchor="middle">peak size</text>
