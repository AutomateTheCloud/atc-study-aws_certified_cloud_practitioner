<rect class="s1" x="270" y="313.6" width="52" height="84.4"><title>Cloud, matched to demand: Usage bill $18,750</title></rect>
<path class="fixed" d="M270.0,311.6 L270.0,301.4 Q270.0,297.4 274.0,297.4 L318.0,297.4 Q322.0,297.4 322.0,301.4 L322.0,311.6 Z"><title>Cloud, matched to demand: Staff $3,600</title></path>
<text class="lab" x="296.0" y="287.4" text-anchor="middle" style="font-weight:600">$22,350</text>
<line class="lead" x1="324" y1="355.8" x2="332" y2="355.8"/>
<text class="small" x="336" y="359.8">Usage bill $18,750</text>
