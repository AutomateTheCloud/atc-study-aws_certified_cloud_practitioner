<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" aria-labelledby="t d">
<title id="t">Three-year cost by category for owning 6 servers, the cloud matched to demand, and the cloud left at peak size</title>
<desc id="d">Stacked column chart, made-up figures. Own 6 servers, $29,340 in all: hardware $12,000 paid up front; space $3,600, power and cooling $2,880, network $2,160, staff $7,200 and licenses $1,500, all fixed. Cloud matched to demand, $22,350: usage bill $18,750, variable; staff $3,600, fixed. Cloud left at peak size, $57,600: usage bill $54,000, variable; staff $3,600, fixed.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --fixed:#898781; --upfront:#52514e; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --fixed:#898781; --upfront:#c3c2b7; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fixed { fill: var(--fixed); } .upfront { fill: var(--upfront); }
  .cell { fill: none; stroke: var(--axis); stroke-width: 1; }
  .chip { fill: var(--surface); stroke: var(--muted); stroke-width: 1; }
  .chip-s1 { fill: var(--surface); stroke: var(--s1); stroke-width: 2; }
  .arrow { stroke: var(--s1); stroke-width: 2; fill: none; }
  .head { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .ring { stroke: var(--surface); stroke-width: 2; }
</style>
<rect width="680" height="470" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Where the three-year money goes</text>
<text class="sub" x="16" y="48">Three-year totals by cost category, made-up figures from the worked example</text>
<rect class="upfront" x="16" y="66" width="12" height="12" rx="2"/>
<text x="34" y="76">Fixed, paid up front</text>
<rect class="fixed" x="176" y="66" width="12" height="12" rx="2"/>
<text x="194" y="76">Fixed, paid every month or year</text>
<rect class="s1" x="430" y="66" width="12" height="12" rx="2"/>
<text x="448" y="76">Variable: follows use</text>
<line class="axis" x1="16" x2="664" y1="398" y2="398"/>
<rect class="upfront" x="40" y="344.0" width="52" height="54.0"><title>Own 6 servers: Hardware $12,000</title></rect>
<rect class="fixed" x="40" y="327.8" width="52" height="14.2"><title>Own 6 servers: Space $3,600</title></rect>
<rect class="fixed" x="40" y="314.8" width="52" height="11.0"><title>Own 6 servers: Power and cooling $2,880</title></rect>
<rect class="fixed" x="40" y="305.1" width="52" height="7.7"><title>Own 6 servers: Network $2,160</title></rect>
<rect class="fixed" x="40" y="272.7" width="52" height="30.4"><title>Own 6 servers: Staff $7,200</title></rect>
