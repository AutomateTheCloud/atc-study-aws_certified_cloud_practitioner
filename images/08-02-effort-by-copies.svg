<rect x="30.4" y="108" width="67.1" height="240" fill="transparent"><title>1 copy: by hand 3 h; from a template 8.25 h</title></rect>
<rect x="97.6" y="108" width="67.1" height="240" fill="transparent"><title>2 copies: by hand 6 h; from a template 8.5 h</title></rect>
