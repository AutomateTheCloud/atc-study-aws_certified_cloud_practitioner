<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img" aria-labelledby="t d">
<title id="t">Person-hours to build copies of the bakery's setup by hand and from a template</title>
<desc id="d">Line chart of total person-hours against the number of copies built, 1 to 8, made-up figures. By hand in the console, each copy takes 3 hours, so the total rises in a straight line from 3 hours to 24 h. From a template, the first copy costs 8.25 hours, because writing and testing the template takes 8 hours, and each further copy adds 15 minutes, reaching 10 h at 8 copies. The template line starts higher but is lower from copy 3 onwards. Time spent fixing mistakes in hand-built copies isn't counted.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="420" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">By hand, every copy costs the same; a template costs once</text>
<text class="sub" x="16" y="48">Total person-hours to build 1 to 8 copies of the bakery's setup (made-up figures)</text>
<line class="line-s2" x1="16" x2="32" y1="72" y2="72"/>
<text x="38" y="76">By hand in the console</text>
<line class="line-s1" x1="200" x2="216" y1="72" y2="72"/>
<text x="222" y="76">From a template</text>
