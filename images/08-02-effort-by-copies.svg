<rect x="500.4" y="108" width="67.1" height="240" fill="transparent"><title>8 copies: by hand 24 h; from a template 10 h</title></rect>
<line class="lead" x1="64.0" y1="262.8" x2="64.0" y2="232.8"/>
<text class="lab" x="70.0" y="213.6">Copy 1: the template costs</text>
<text class="lab" x="70.0" y="230.6">more (8.25 h against 3 h)</text>
<line class="lead" x1="198.3" y1="270.0" x2="198.3" y2="294.2"/>
<text class="lab" x="204.28571428571428" y="305.8">From copy 3, the template</text>
<text class="lab" x="204.28571428571428" y="322.8">is cheaper (8.75 h against 9 h)</text>
<text class="lab" x="544.0" y="115.6">24 h</text>
<text class="small" x="544.0" y="130.6">By hand</text>
<text class="lab" x="544.0" y="250.0">10 h</text>
<text class="small" x="544.0" y="265.0">Template</text>
<text class="note" x="16" y="406">Made-up figures: 3 h a copy by hand; 8 h to write the template, then 15 min a copy. Fixing mistakes isn't counted.</text>
</svg>
