<svg xmlns="http://www.w3.org/2000/svg" width="680" height="342" viewBox="0 0 680 342" role="img" aria-labelledby="t d">
<title id="t">AWS Secrets Manager compared with Parameter Store</title>
<desc id="d">Two cards with the same four rows; the automatic rotation row is highlighted on both. AWS Secrets Manager: made for: Secrets through their whole life: passwords, API keys, tokens; encryption: Always, with AWS KMS; automatic rotation: Yes, on a schedule; built in for some databases; cost (checked 2026-10-23): Per secret per month, plus API calls. Systems Manager Parameter Store: made for: Configuration values: settings, IDs, addresses; encryption: Optional: choose the SecureString type; automatic rotation: No; cost (checked 2026-10-23): Standard parameters at no additional charge.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: none; stroke: var(--axis); stroke-width: 1; }
  .hl { fill: none; stroke: var(--s1); stroke-width: 2; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .arrow-s2 { fill: var(--s2); }
</style>
<rect width="680" height="342" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Two places to keep values your code needs</text>
<text class="sub" x="16" y="48">The deciding row is rotation: only Secrets Manager changes a secret for you</text>
<rect class="card" x="16" y="66" width="320" height="264" rx="8"/>
<text class="name" x="30" y="93">AWS Secrets Manager</text>
<text class="key" x="30" y="122">MADE FOR</text>
<text class="lab" x="30" y="139.0">Secrets through their whole life:</text>
<text class="lab" x="30" y="155.0">passwords, API keys, tokens</text>
<text class="key" x="30" y="180">ENCRYPTION</text>
<text class="lab" x="30" y="197.0">Always, with AWS KMS</text>
<rect class="hl" x="22" y="206" width="308" height="56" rx="6"/>
<text class="key" x="30" y="222">AUTOMATIC ROTATION</text>
<text class="lab" x="30" y="239.0">Yes, on a schedule; built in for some</text>
<text class="lab" x="30" y="255.0">databases</text>
<text class="key" x="30" y="280">COST (CHECKED 2026-10-23)</text>
<text class="lab" x="30" y="297.0">Per secret per month, plus API calls</text>
<rect class="card" x="344" y="66" width="320" height="264" rx="8"/>
<text class="name" x="358" y="93">Systems Manager Parameter Store</text>
<text class="key" x="358" y="122">MADE FOR</text>
<text class="lab" x="358" y="139.0">Configuration values: settings, IDs,</text>
<text class="lab" x="358" y="155.0">addresses</text>
<text class="key" x="358" y="180">ENCRYPTION</text>
<text class="lab" x="358" y="197.0">Optional: choose the SecureString type</text>
<rect class="hl" x="350" y="206" width="308" height="56" rx="6"/>
<text class="key" x="358" y="222">AUTOMATIC ROTATION</text>
<text class="lab" x="358" y="239.0">No</text>
<text class="key" x="358" y="280">COST (CHECKED 2026-10-23)</text>
<text class="lab" x="358" y="297.0">Standard parameters at no additional</text>
<text class="lab" x="358" y="313.0">charge</text>
</svg>
