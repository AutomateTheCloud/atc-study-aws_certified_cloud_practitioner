<text class="call" x="270" y="100">attribute</text>
<text class="colh" x="350" y="84">GiftNote</text>
<text class="call" x="350" y="100">attribute</text>
<rect class="grp" x="26" y="114" width="498" height="104" rx="6"/>
<rect class="hl" x="34" y="124" width="482" height="40" rx="4"/>
<text class="cell" x="40" y="149">cart-1001</text>
<text class="cell" x="156" y="149">lemon-tart</text>
<text class="cell" x="270" y="149">2</text>
<text class="cellm" x="350" y="149">(not there)</text>
<rect class="row" x="34" y="168" width="482" height="40" rx="4"/>
<text class="cell" x="40" y="193">cart-1001</text>
<text class="cell" x="156" y="193">rye-loaf</text>
<text class="cell" x="270" y="193">1</text>
<text class="cell" x="350" y="193">"Happy birthday!"</text>
<rect class="grp" x="26" y="230" width="498" height="60" rx="6"/>
<rect class="row" x="34" y="240" width="482" height="40" rx="4"/>
<text class="cell" x="40" y="265">cart-1002</text>
<text class="cell" x="156" y="265">croissant</text>
<text class="cell" x="270" y="265">6</text>
<text class="cellm" x="350" y="265">(not there)</text>
<line class="lead" x1="536" y1="144.0" x2="516" y2="144.0"/>
<text class="gl" x="540" y="148.0">Get item</text>
<text class="call" x="540" y="164.0">CartId + Product</text>
<text class="call" x="540" y="179.0">finds one item</text>
<line class="lead" x1="536" y1="194.0" x2="524" y2="194.0"/>
<text class="gl" x="540" y="198.0">Query cart-1001</text>
<text class="call" x="540" y="214.0">finds both items</text>
<text class="call" x="540" y="229.0">in this group</text>
<text class="lab" x="16" y="318">Items in one table don't need the same attributes: only rye-loaf has a GiftNote.</text>
<text class="note" x="16" y="340">Made-up items for Lab 06. DynamoDB stores key-value and document data without fixed columns</text>
<text class="note" x="16" y="356">(Amazon DynamoDB Developer Guide, checked 2026-10-23).</text>
