<svg xmlns="http://www.w3.org/2000/svg" width="680" height="370" viewBox="0 0 680 370" role="img" aria-labelledby="t d">
<title id="t">The Lab 06 table: three cart items grouped by partition key</title>
<desc id="d">Table clf-lab06-carts with columns CartId (partition key), Product (sort key), Quantity and GiftNote (ordinary attributes). Group cart-1001 holds two items: lemon-tart, quantity 2, no gift note, outlined as the item a Get item finds with CartId and Product together; and rye-loaf, quantity 1, gift note 'Happy birthday!'. Group cart-1002 holds one item: croissant, quantity 6, no gift note. Callouts: Get item uses CartId and Product together to find one item; a Query for CartId cart-1001 alone finds both items in that group. Items don't need the same attributes: only rye-loaf has a GiftNote.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --grp-fill:#eef4fc; --hl-fill:#d9e8fb; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --grp-fill:#1f2a37; --hl-fill:#1b3554; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .grp { fill: var(--grp-fill); stroke: var(--s1); stroke-width: 1.5; }
  .row { fill: var(--surface); stroke: var(--axis); stroke-width: 1; }
  .hl { fill: var(--hl-fill); stroke: var(--s2); stroke-width: 2.5; }
  .colh { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .cell { fill: var(--ink); font-size: 12.5px; font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
  .cellm { fill: var(--muted); font-size: 12px; font-style: italic; }
  .gl { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .call { fill: var(--ink2); font-size: 12px; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="370" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">The lab's table: items grouped by their partition key</text>
<text class="sub" x="16" y="48">Table clf-lab06-carts. The full key is CartId plus Product; no two items share both.</text>
<text class="colh" x="40" y="84">CartId</text>
<text class="call" x="40" y="100">partition key</text>
