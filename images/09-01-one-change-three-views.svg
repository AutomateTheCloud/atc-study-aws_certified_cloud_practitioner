<svg xmlns="http://www.w3.org/2000/svg" width="680" height="532" viewBox="0 0 680 532" role="img" aria-labelledby="t d">
<title id="t">The same security group change as CloudTrail, Config and CloudWatch record it</title>
<desc id="d">A time line for Tuesday from 12:00 to 16:00 with a dashed marker at 14:02, when someone adds a rule to the security group web-sg allowing SSH, port 22, from anywhere. Three rows below. CloudTrail, answering who, what, when and where: one event at 14:02, AuthorizeSecurityGroupIngress, by user sam-dev at 14:02:11 from address 198.51.100.23, on group web-sg, port 22, from 0.0.0.0/0. Config, answering what it looked like and whether it is allowed: before 14:02, web-sg allowed 443 from anywhere and the rule restricted-ssh was compliant; from 14:02, web-sg allows 443 and, new, 22 from anywhere, and the rule is noncompliant. CloudWatch, answering how it is behaving: a bar chart of failed SSH sign-ins on the web server per 15 minutes, from its own log sent to CloudWatch Logs; zero before the change, then rising to about 40 per 15 minutes within an hour of 14:02.</desc>

