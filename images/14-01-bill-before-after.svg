<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412" role="img" aria-labelledby="t d">
<title id="t">The bakery's monthly AWS bill as built, with the review's fixes, with Business Support+, and after later savings</title>
<desc id="d">Stacked horizontal bars, dollars per month, US East (N. Virginia), price lists retrieved 2026-10-24, usage made up. As built: web server $11.88 plus storage, requests and backups $1.31, $13.19. With the fixes: web servers $23.76, load balancer $24.90, storage, requests and backups $1.70, $50.36. Plus Business Support+ at its $29 minimum: $79.36. Later, with two t4g.micro instances on 1-year Reserved Instances: web servers $16.32, total $71.92.</desc>

