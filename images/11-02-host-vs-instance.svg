<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456" role="img" aria-labelledby="t d">
<title id="t">Dedicated Host compared with Dedicated Instance</title>
<desc id="d">Two panels. What's the same: single-tenant hardware, no other customer on it, and no difference in performance or security. Dedicated Host, a whole physical server you place instances on: you see its sockets, cores and host ID; you place instances on the host you choose and keep them there; billed per host; supports per-socket, per-core or per-VM licenses you bring; no Capacity Reservations; Host Reservations give up to 70% off. Choose it for software licensed by socket or core. Dedicated Instance, an instance on hardware only your account uses: you see nothing about the hardware; AWS places it and it may move after a stop and start; billed per instance plus a $2 an hour fee per Region while any runs; partial license support; Capacity Reservations supported; Reserved Instances with dedicated tenancy for a discount. Choose it for a rule that says no shared hardware. As of 2026-10-24.</desc>

