<text class="cellt" x="30" y="227">Billing</text>
<text class="small" x="30" y="243.0">per host, whatever runs on it</text>
<text class="cellt" x="30" y="264">Your licenses</text>
<text class="small" x="30" y="280.0">per-socket, per-core or per-VM (BYOL)</text>
<text class="cellt" x="30" y="301">Capacity Reservations</text>
<text class="small" x="30" y="317.0">not supported</text>
<text class="cellt" x="30" y="338">Discount</text>
<text class="small" x="30" y="354.0">Host Reservations, up to 70%</text>
<text class="cellt" x="30" y="408">Choose it for: software licensed by socket or core</text>
<rect class="panel" x="368" y="66" width="336" height="356" rx="8"/>
<text class="head" x="382" y="92">Dedicated Instance</text>
<text class="small" x="382" y="110">An instance on hardware only your account uses</text>
<text class="cellt" x="382" y="138">You see</text>
<text class="small" x="382" y="154.0">nothing about the hardware</text>
<text class="cellt" x="382" y="175">You place</text>
<text class="small" x="382" y="191.0">nothing: AWS places it, and after a stop and</text>
<text class="small" x="382" y="206.0">start it may move</text>
<text class="cellt" x="382" y="227">Billing</text>
<text class="small" x="382" y="243.0">per instance, plus a $2 an hour fee per Region</text>
<text class="small" x="382" y="258.0">while any runs</text>
<text class="cellt" x="382" y="279">Your licenses</text>
<text class="small" x="382" y="295.0">partial support only</text>
<text class="cellt" x="382" y="316">Capacity Reservations</text>
<text class="small" x="382" y="332.0">supported</text>
<text class="cellt" x="382" y="353">Discount</text>
<text class="small" x="382" y="369.0">Reserved Instances with dedicated tenancy</text>
<text class="cellt" x="382" y="408">Choose it for: a rule that says no shared hardware</text>
<text class="note" x="16" y="444">Sources: EC2 User Guide, Dedicated Hosts and Dedicated Instances; Savings Plans types (the $2 fee). Checked 2026-10-24.</text>
</svg>
