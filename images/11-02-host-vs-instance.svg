<text class="title" x="16" y="28">Dedicated Host or Dedicated Instance?</text>
<text class="sub" x="16" y="48">Same: single-tenant hardware, no other customer on it, no difference in performance or security</text>
<rect class="hi" x="16" y="66" width="336" height="356" rx="8"/>
<text class="head" x="30" y="92">Dedicated Host</text>
<text class="small" x="30" y="110">A whole physical server, yours to place instances on</text>
<text class="cellt" x="30" y="138">You see</text>
<text class="small" x="30" y="154.0">its sockets, cores and host ID</text>
