<svg xmlns="http://www.w3.org/2000/svg" width="680" height="458" viewBox="0 0 680 458" role="img" aria-labelledby="t d">
<title id="t">IPv4 and IPv6 addresses, and ports on one server</title>
<desc id="d">Top left, IPv4: the address 192.0.2.10 as four numbers, each from 0 to 255, separated by dots; 32 bits; about 4.3 billion addresses, all already allocated. Top right, IPv6: the address 2001:db8:85a3::8a2e:370:7334, eight groups of up to four hexadecimal digits; 128 bits; :: stands for groups of zeros; vastly more addresses than IPv4. Bottom: packets to 192.0.2.10 arrive at the bakery's web server, where three ports lead to programs: port 443, HTTPS, the website, encrypted, highlighted; port 80, HTTP, plain web, not encrypted; port 22, SSH, staff signing in remotely.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.8; }
  .hiband { fill: var(--hi-fill); stroke: none; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .plain { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .tunnel { fill: none; stroke: var(--s1); stroke-width: 2.2; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .bigmono { fill: var(--ink); font-size: 22px; font-weight: 600; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .arrlab { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .num { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .numh { fill: var(--s1); stroke: var(--s1); stroke-width: 1.5; }
  .numhl { fill: var(--surface); font-size: 13px; font-weight: 700; }
</style>
<rect width="680" height="458" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">An address finds the computer; a port finds the program</text>
<text class="sub" x="16" y="48">Two kinds of IP address, and the ports on the bakery's web server</text>
<rect class="frame" x="16.0" y="70.0" width="316.0" height="156.0" rx="10"/>
<text class="head" x="30" y="94">IPv4</text>
<rect class="n" x="30.0" y="108.0" width="56.0" height="40.0" rx="5"/>
<text class="bigmono" x="58" y="136" text-anchor="middle">192</text>
<text class="zlab" x="58" y="164" text-anchor="middle">0 to 255</text>
<text class="bigmono" x="94" y="136" text-anchor="middle">.</text>
<rect class="n" x="102.0" y="108.0" width="56.0" height="40.0" rx="5"/>
<text class="bigmono" x="130" y="136" text-anchor="middle">0</text>
<text class="zlab" x="130" y="164" text-anchor="middle">0 to 255</text>
<text class="bigmono" x="166" y="136" text-anchor="middle">.</text>
<rect class="n" x="174.0" y="108.0" width="56.0" height="40.0" rx="5"/>
<text class="bigmono" x="202" y="136" text-anchor="middle">2</text>
<text class="zlab" x="202" y="164" text-anchor="middle">0 to 255</text>
<text class="bigmono" x="238" y="136" text-anchor="middle">.</text>
<rect class="n" x="246.0" y="108.0" width="56.0" height="40.0" rx="5"/>
<text class="bigmono" x="274" y="136" text-anchor="middle">10</text>
<text class="zlab" x="274" y="164" text-anchor="middle">0 to 255</text>
<text class="small" x="30" y="188.0">32 bits; about 4.3 billion addresses,</text>
<text class="small" x="30" y="204.0">all already allocated</text>
<rect class="frame" x="348.0" y="70.0" width="316.0" height="156.0" rx="10"/>
<text class="head" x="362" y="94">IPv6</text>
<rect class="n" x="362.0" y="108.0" width="288.0" height="40.0" rx="5"/>
<text class="mono" x="506" y="133" text-anchor="middle">2001:db8:85a3::8a2e:370:7334</text>
<text class="zlab" x="506" y="164" text-anchor="middle">eight groups of up to four hex digits</text>
<text class="small" x="362" y="188.0">128 bits; :: stands for groups of zeros;</text>
<text class="small" x="362" y="204.0">vastly more addresses than IPv4</text>
<rect class="plain" x="16.0" y="296.0" width="128.0" height="60.0" rx="6"/>
<text class="cellt" x="80" y="320.0" text-anchor="middle">Packets to</text>
<text class="cellt" x="80" y="336.0" text-anchor="middle">192.0.2.10</text>
<rect class="frame" x="196.0" y="256.0" width="468.0" height="160.0" rx="10"/>
<text class="head" x="210" y="278">The bakery's web server, 192.0.2.10</text>
<line class="arrow" x1="145.0" y1="326.0" x2="195.0" y2="326.0"/>
<path class="arrowhead" d="M187.0,321.0 L187.0,331.0 L195.0,326.0 Z"/>
<rect class="hi" x="210.0" y="292.0" width="440.0" height="32.0" rx="5"/>
<text class="rowl" x="224" y="313">Port 443</text>
<text class="cellt" x="300" y="313">HTTPS</text>
<text class="small" x="360" y="313">the website, encrypted</text>
<rect class="n" x="210.0" y="332.0" width="440.0" height="32.0" rx="5"/>
<text class="rowl" x="224" y="353">Port 80</text>
<text class="cellt" x="300" y="353">HTTP</text>
<text class="small" x="360" y="353">plain web, not encrypted</text>
<rect class="n" x="210.0" y="372.0" width="440.0" height="32.0" rx="5"/>
<text class="rowl" x="224" y="393">Port 22</text>
<text class="cellt" x="300" y="393">SSH</text>
<text class="small" x="360" y="393">staff signing in remotely</text>
<text class="note" x="16" y="442">Addresses come from ranges reserved for examples. Other ports appear later, such as 5432 for PostgreSQL.</text>
</svg>
