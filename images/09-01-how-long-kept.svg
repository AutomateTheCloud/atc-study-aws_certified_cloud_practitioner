<svg xmlns="http://www.w3.org/2000/svg" width="680" height="416" viewBox="0 0 680 416" role="img" aria-labelledby="t d">
<title id="t">How long CloudTrail, IAM, Config and CloudWatch keep their records by default</title>
<desc id="d">Horizontal bars on an axis from 0 to 7 years. CloudTrail Event history: 90 days, fixed; free; IAM last accessed (services): At least 400 days; AWS Config history: 7 years by default; you can set 30 days to 7 years; CloudTrail trail, in your S3 bucket: As long as you keep the files (you pay for S3); CloudWatch Logs log group: Never expires until you set a retention period. The last two bars run past the right edge with an arrow, because they have no default limit.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hl-fill:#d9e8fb; --no-fill:#fbe1d6; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hl-fill:#1b3554; --no-fill:#4d2716; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: none; stroke: var(--axis); stroke-width: 1; }
  .qbox { fill: var(--hl-fill); stroke: var(--s1); stroke-width: 1.5; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .q { fill: var(--ink); font-size: 13.5px; font-weight: 600; }
  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 11.5px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow-s2 { fill: var(--s2); }
  .ok { fill: var(--hl-fill); stroke: var(--s1); stroke-width: 1.2; }
  .no { fill: var(--no-fill); stroke: var(--s2); stroke-width: 1.2; }
  .n { fill: var(--n-fill); stroke: var(--axis); stroke-width: 1; }
  .tl { stroke: var(--ink2); stroke-width: 1.5; }
  .chg { stroke: var(--s2); stroke-width: 2; stroke-dasharray: 5 4; }
  .rowl { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .ans { fill: var(--ink2); font-size: 12px; font-weight: 700; letter-spacing: 0.4px; }
</style>
<rect width="680" height="416" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">How long each record is kept, unless you change it</text>
<text class="sub" x="16" y="48">Days, from 0 to 7 years. Records with no default limit run off the right edge.</text>
<rect class="s1" x="16" y="64" width="12" height="12" rx="2"/>
<text x="34" y="74">A default limit</text>
<rect class="s2" x="140" y="64" width="12" height="12" rx="2"/>
<text x="158" y="74">No limit by default</text>
<line class="axis" x1="252.0" x2="252.0" y1="92" y2="372"/>
<text class="tick" x="252.0" y="390" text-anchor="middle">0</text>
<line class="grid" x1="303.7" x2="303.7" y1="92" y2="372"/>
<text class="tick" x="303.7" y="390" text-anchor="middle">1 y</text>
