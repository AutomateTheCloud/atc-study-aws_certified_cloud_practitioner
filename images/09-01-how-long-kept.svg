<text class="tick" x="459.0" y="390" text-anchor="middle">4 y</text>
<line class="grid" x1="510.7" x2="510.7" y1="92" y2="372"/>
<text class="tick" x="510.7" y="390" text-anchor="middle">5 y</text>
<line class="grid" x1="562.4" x2="562.4" y1="92" y2="372"/>
<text class="tick" x="562.4" y="390" text-anchor="middle">6 y</text>
<line class="grid" x1="614.2" x2="614.2" y1="92" y2="372"/>
<text class="tick" x="614.2" y="390" text-anchor="middle">7 y</text>
<text class="lab" x="242" y="113" text-anchor="end">CloudTrail Event history</text>
<path class="s1" d="M252.0,100.0 L260.7,100.0 Q264.7,100.0 264.7,104.0 L264.7,114.0 Q264.7,118.0 260.7,118.0 L252.0,118.0 Z"/>
<text class="small" x="252" y="134">90 days, fixed; free</text>
<text class="lab" x="242" y="169" text-anchor="end">IAM last accessed (services)</text>
<path class="s1" d="M252.0,156.0 L304.7,156.0 Q308.7,156.0 308.7,160.0 L308.7,170.0 Q308.7,174.0 304.7,174.0 L252.0,174.0 Z"/>
<text class="small" x="252" y="190">At least 400 days</text>
<text class="lab" x="242" y="225" text-anchor="end">AWS Config history</text>
<path class="s1" d="M252.0,212.0 L610.2,212.0 Q614.2,212.0 614.2,216.0 L614.2,226.0 Q614.2,230.0 610.2,230.0 L252.0,230.0 Z"/>
<text class="small" x="252" y="246">7 years by default; you can set 30 days to 7 years</text>
<text class="lab" x="242" y="281" text-anchor="end">CloudTrail trail, in your S3 bucket</text>
<path class="s2" d="M252.0,268.0 L642.0,268.0 Q642.0,268.0 642.0,268.0 L642.0,286.0 Q642.0,286.0 642.0,286.0 L252.0,286.0 Z"/>
<path class="arrow-s2" d="M642.0,264 L656.0,277.0 L642.0,290 Z"/>
<text class="small" x="252" y="302">As long as you keep the files (you pay for S3)</text>
<text class="lab" x="242" y="337" text-anchor="end">CloudWatch Logs log group</text>
<path class="s2" d="M252.0,324.0 L642.0,324.0 Q642.0,324.0 642.0,324.0 L642.0,342.0 Q642.0,342.0 642.0,342.0 L252.0,342.0 Z"/>
<path class="arrow-s2" d="M642.0,320 L656.0,333.0 L642.0,346 Z"/>
<text class="small" x="252" y="358">Never expires until you set a retention period</text>
<text class="note" x="16" y="402">From the CloudTrail, CloudWatch Logs, AWS Config and IAM user guides, checked 2026-10-24.</text>
</svg>
