<svg xmlns="http://www.w3.org/2000/svg" width="700" height="558" viewBox="0 0 700 558" role="img" aria-labelledby="t d">
<title id="t">The six EC2 instance families and the bottleneck each one is built for</title>
<desc id="d">Six cards in two rows. General purpose: nothing in particular runs out, a balance of CPU, memory and network; letters M and T (burstable); for web servers, code repositories, small and medium databases. Compute optimized: CPU runs out first; letter C; for batch processing, media transcoding, dedicated game servers. Memory optimized: memory runs out first, the data must fit in RAM; letters R, X, U, z1d; for in-memory databases and analytics on large data sets in memory. Storage optimized: fast reads and writes to local disks; letters I, D, H; for high-throughput databases and processing and streaming large data sets. Accelerated computing: work that needs GPUs or other special chips; letters P, G, Inf, Trn; for machine learning, graphics, floating-point calculations. HPC optimized: very large, tightly linked computations; letters Hpc; for complex simulations, deep learning, visual effects rendering.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --panel:#f1f0ec; --hi-fill:#d9e8fb; --s3:#1baf7a; }
