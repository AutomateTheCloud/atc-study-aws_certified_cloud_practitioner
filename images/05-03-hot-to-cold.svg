<svg xmlns="http://www.w3.org/2000/svg" width="820" height="502" viewBox="0 0 820 502" role="img" aria-labelledby="t d">
<title id="t">S3 storage classes from hot to cold, with minimum billed stay, first-byte time, retrieval fee and AZ count</title>
<desc id="d">Seven rows from hot at the top to cold at the bottom; in general, the lower the row, the less storage costs per GB, and the more it costs to read data or delete it early. S3 Standard: no minimum stay; milliseconds; no retrieval fee; 3 or more AZs. S3 Intelligent-Tiering: no minimum stay; milliseconds, with optional archive tiers that take longer; no retrieval fee, but a small monitoring fee per object; 3 or more AZs. S3 Standard-IA: 30 days; milliseconds; per GB read; 3 or more AZs. S3 One Zone-IA: 30 days; milliseconds; per GB read; 1 AZ. S3 Glacier Instant Retrieval: 90 days; milliseconds; per GB read; 3 or more AZs. S3 Glacier Flexible Retrieval: 90 days; minutes to 12 hours after a restore; per GB read, bulk restores free; 3 or more AZs. S3 Glacier Deep Archive: 180 days; 12 to 48 hours after a restore; per GB read; 3 or more AZs. The minimum stays are drawn as bars of 0, 0, 30, 30, 90, 90 and 180 days. Below: deleting, overwriting or moving an object out early is billed for the rest of the minimum stay, and Standard-IA, One Zone-IA and Glacier Instant Retrieval bill any object under 128 KB as 128 KB.</desc>

