<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img" aria-labelledby="t d">
<title id="t">What a watcher on the network sees with HTTP and with HTTPS</title>
<desc id="d">Two panels, each with a phone, a server and an arrow between them. Plain HTTP, port 80: the watcher on the path reads 'Name: Ana. Address: 12 Mill Lane. Order: one birthday cake'; it is readable and could be changed, nothing proves the server is the real bakery, and the browser warns that it is not secure. HTTPS, port 443, highlighted, with a padlock on the arrow: the watcher sees scrambled characters only; the certificate proves the name bakery.example; the browser marks the connection as secure. A note says that in both, the watcher can still see which two addresses are talking.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .hi { fill: var(--hi-fill); stroke: var(--s1); stroke-width: 1.8; }
  .hiband { fill: var(--hi-fill); stroke: none; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .plain { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .frame { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .tunnel { fill: none; stroke: var(--s1); stroke-width: 2.2; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 13px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .bigmono { fill: var(--ink); font-size: 22px; font-weight: 600; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .arrlab { fill: var(--ink2); font-size: 12px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .num { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .numh { fill: var(--s1); stroke: var(--s1); stroke-width: 1.5; }
  .numhl { fill: var(--surface); font-size: 13px; font-weight: 700; }
</style>
<rect width="680" height="410" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">HTTPS hides the conversation from anyone on the path</text>
<text class="sub" x="16" y="48">What someone watching a network between the customer and the bakery sees</text>
<rect class="frame" x="16.0" y="70.0" width="316.0" height="300.0" rx="10"/>
<text class="head" x="30" y="94">Plain HTTP, port 80</text>
<rect class="plain" x="30.0" y="114.0" width="64.0" height="40.0" rx="6"/>
<text class="small" x="62" y="139" text-anchor="middle">Phone</text>
<rect class="plain" x="254.0" y="114.0" width="64.0" height="40.0" rx="6"/>
<text class="small" x="286" y="139" text-anchor="middle">Server</text>
<line class="arrow" x1="95.0" y1="134.0" x2="253.0" y2="134.0"/>
<path class="arrowhead" d="M245.0,129.0 L245.0,139.0 L253.0,134.0 Z"/>
<text class="zlab" x="30" y="178">The watcher on the path sees:</text>
<rect class="n" x="30.0" y="186.0" width="288.0" height="80.0" rx="5"/>
<text class="mono" x="42" y="210.0">Name: Ana</text>
<text class="mono" x="42" y="232.0">Address: 12 Mill Lane</text>
<text class="mono" x="42" y="254.0">Order: one birthday cake</text>
<text class="small" x="30" y="294">✗  Readable, and could be changed</text>
<text class="small" x="30" y="316">✗  No proof the server is the real bakery</text>
<text class="small" x="30" y="338">✗  Browser warns: not secure</text>
<rect class="hi" x="348.0" y="70.0" width="316.0" height="300.0" rx="10"/>
<text class="head" x="362" y="94">HTTPS, port 443</text>
<rect class="plain" x="362.0" y="114.0" width="64.0" height="40.0" rx="6"/>
<text class="small" x="394" y="139" text-anchor="middle">Phone</text>
<rect class="plain" x="586.0" y="114.0" width="64.0" height="40.0" rx="6"/>
<text class="small" x="618" y="139" text-anchor="middle">Server</text>
<line class="arrow" x1="427.0" y1="134.0" x2="585.0" y2="134.0"/>
<path class="arrowhead" d="M577.0,129.0 L577.0,139.0 L585.0,134.0 Z"/>
<path class="arrow" d="M501.0,120 L501.0,117 A5,5 0 0 1 511.0,117 L511.0,120"/>
<rect x="498.0" y="120" width="16" height="11" rx="2" style="fill:var(--ink2)"/>
<text class="zlab" x="362" y="178">The watcher on the path sees:</text>
<rect class="n" x="362.0" y="186.0" width="288.0" height="80.0" rx="5"/>
<text class="mono" x="374" y="210.0">x7#Qp!2vL0r@9sK</text>
<text class="mono" x="374" y="232.0">mE4+tZ1q%Wb8Yc</text>
<text class="mono" x="374" y="254.0">J5^nH3d*Fu6aR</text>
<text class="small" x="362" y="294">✓  Scrambled: no use to the watcher</text>
<text class="small" x="362" y="316">✓  Certificate proves the name bakery.example</text>
<text class="small" x="362" y="338">✓  Browser marks it secure</text>
<text class="note" x="16" y="394">In both, the watcher can still see which two addresses are talking. The customer and order are made up.</text>
</svg>
