<svg xmlns="http://www.w3.org/2000/svg" width="680" height="488" viewBox="0 0 680 488" role="img" aria-labelledby="t d">
<title id="t">Service control policy compared with IAM policy</title>
<desc id="d">Two columns, SCP and IAM policy, compared on six rows. Where it's set: in AWS Organizations, from the management account or an account it delegates to; inside one account, in IAM. What it applies to: every IAM user and role in the member accounts below where it's attached; the one identity or resource it's attached to. Grants permissions, highlighted: never, it only sets the maximum; yes, it grants or denies permissions. A member account's root user: limited by an SCP; not limited by IAM policies. The management account: not affected by SCPs; IAM policies work there as in any account. Typical use: organization-wide rules such as allowed Regions or protecting logs; giving one person or program the access its job needs.</desc>

<style>
