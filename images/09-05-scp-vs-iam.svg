  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.4px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="680" height="488" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">SCP or IAM policy: a ceiling or a key</text>
<text class="sub" x="16" y="48">Both use almost the same policy language; read across a row to see how they differ</text>
<rect class="n" x="166.0" y="66.0" width="250.0" height="32.0" rx="6"/>
<text class="cellt" x="176" y="87">Service control policy (SCP)</text>
<rect class="n" x="424.0" y="66.0" width="250.0" height="32.0" rx="6"/>
<text class="cellt" x="434" y="87">IAM policy</text>
<line class="grid" x1="16" x2="674" y1="106" y2="106"/>
<text class="rowl" x="16" y="125.0">Where it's set</text>
<text class="small" x="176" y="125.0">In AWS Organizations, from the</text>
<text class="small" x="176" y="140.0">management account (or an account</text>
<text class="small" x="176" y="155.0">it delegates to)</text>
<text class="small" x="434" y="125.0">Inside one account, in IAM</text>
<line class="grid" x1="16" x2="674" y1="171" y2="171"/>
<text class="rowl" x="16" y="190.0">What it applies to</text>
<text class="small" x="176" y="190.0">Every IAM user and role in the</text>
<text class="small" x="176" y="205.0">member accounts below where it's</text>
<text class="small" x="176" y="220.0">attached</text>
<text class="small" x="434" y="190.0">The one identity or resource it's</text>
<text class="small" x="434" y="205.0">attached to</text>
<rect class="ok" x="162.0" y="238.0" width="258.0" height="46.0" rx="5"/>
<rect class="ok" x="420.0" y="238.0" width="258.0" height="46.0" rx="5"/>
<line class="grid" x1="16" x2="674" y1="236" y2="236"/>
<text class="rowl" x="16" y="255.0">Grants permissions?</text>
<text class="cellt" x="176" y="255.0">Never: it only sets the</text>
<text class="cellt" x="176" y="270.0">maximum</text>
<text class="cellt" x="434" y="255.0">Yes: it grants (or denies)</text>
<text class="cellt" x="434" y="270.0">permissions</text>
<line class="grid" x1="16" x2="674" y1="286" y2="286"/>
<text class="rowl" x="16" y="305.0">A member account's</text>
<text class="rowl" x="16" y="320.0">root user</text>
<text class="small" x="176" y="305.0">Limited by it</text>
<text class="small" x="434" y="305.0">Not limited by IAM policies</text>
<line class="grid" x1="16" x2="674" y1="336" y2="336"/>
<text class="rowl" x="16" y="355.0">The management</text>
<text class="rowl" x="16" y="370.0">account</text>
<text class="small" x="176" y="355.0">Not affected</text>
<text class="small" x="434" y="355.0">Works there as in any account</text>
<line class="grid" x1="16" x2="674" y1="386" y2="386"/>
<text class="rowl" x="16" y="405.0">Typical use</text>
<text class="small" x="176" y="405.0">Organization-wide rules, such as</text>
<text class="small" x="176" y="420.0">allowed Regions or protecting logs</text>
<text class="small" x="434" y="405.0">Giving one person or program the</text>
<text class="small" x="434" y="420.0">access its job needs</text>
<line class="grid" x1="16" x2="674" y1="436" y2="436"/>
<text class="note" x="16" y="458">From the AWS Organizations User Guide (service control policies) and the IAM User Guide, checked 2026-10-24.</text>
</svg>
