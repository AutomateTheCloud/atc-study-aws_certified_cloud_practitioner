<text class="small" x="340.0" y="154.0" text-anchor="middle">CodeBuild runs</text>
<text class="small" x="340.0" y="169.0" text-anchor="middle">more tests on</text>
<text class="small" x="340.0" y="184.0" text-anchor="middle">the package</text>
<line class="arrow" x1="266.0" y1="156.0" x2="281.0" y2="156.0"/>
<path class="arrowhead" d="M274.0,152.0 L274.0,160.0 L281.0,156.0 Z"/>
<rect class="box" x="415.0" y="108.0" width="116.0" height="96.0" rx="6"/>
