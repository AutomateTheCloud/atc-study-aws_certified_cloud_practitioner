<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" role="img" aria-labelledby="t d">
<title id="t">A release pipeline: CodePipeline runs the stages, CodeBuild builds and tests</title>
<desc id="d">Five stages in a row, left to right, joined by arrows, under a bracket labeled AWS CodePipeline: runs the stages in order and stops the release if one fails. Source: a code change is pushed to the repository. Build, highlighted: CodeBuild compiles, runs unit tests and packages. Test, highlighted: CodeBuild runs more tests on the package. Approve: the owner approves, and SNS emails her that a release is waiting. Deploy: CloudFormation updates both Regions. Notes: the highlighted stages are the ones CodeBuild runs; a failed test stops the release before anything reaches customers; CodeDeploy can also be a deploy step, but the exam guide lists it as out of scope.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --hi-fill:#d9e8fb; --n-fill:#f1f0ec; --o-fill:#fbe1d6; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --hi-fill:#1b3554; --n-fill:#252523; --o-fill:#4d2716; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
