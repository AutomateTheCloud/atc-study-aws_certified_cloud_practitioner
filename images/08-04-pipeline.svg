<text class="small" x="473.0" y="154.0" text-anchor="middle">The owner</text>
<text class="small" x="473.0" y="169.0" text-anchor="middle">approves (SNS</text>
<text class="small" x="473.0" y="184.0" text-anchor="middle">emails her)</text>
<line class="arrow" x1="399.0" y1="156.0" x2="414.0" y2="156.0"/>
<path class="arrowhead" d="M407.0,152.0 L407.0,160.0 L414.0,156.0 Z"/>
<rect class="box" x="548.0" y="108.0" width="116.0" height="96.0" rx="6"/>
<text class="head" x="606.0" y="132" text-anchor="middle">Deploy</text>
