<text class="small" x="606.0" y="169.0" text-anchor="middle">updates both</text>
<text class="small" x="606.0" y="184.0" text-anchor="middle">Regions</text>
<line class="arrow" x1="532.0" y1="156.0" x2="547.0" y2="156.0"/>
<path class="arrowhead" d="M540.0,152.0 L540.0,160.0 L547.0,156.0 Z"/>
<text class="note" x="16" y="234">Highlighted: the stages CodeBuild runs. A failed test stops the release before anything reaches customers.</text>
<text class="note" x="16" y="250">CodeDeploy can also be a deploy step; it exists, but the exam guide lists it as out of scope.</text>
<text class="note" x="16" y="266">From the AWS CodePipeline and AWS CodeBuild user guides, checked 2026-10-24. The bakery is made up.</text>
</svg>
