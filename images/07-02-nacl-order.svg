<svg xmlns="http://www.w3.org/2000/svg" width="680" height="442" viewBox="0 0 680 442" role="img" aria-labelledby="t d">
<title id="t">A network ACL's rules checked in order against three packets</title>
<desc id="d">A table of three inbound rules for the bakery's public subnets, in order: rule 90 denies all traffic from 203.0.113.0/24; rule 100 allows HTTPS (TCP 443) from 0.0.0.0/0; rule * denies all traffic from 0.0.0.0/0. Three packets are tested. Packet A, HTTPS from 203.0.113.7: rule 90 matches and denies it; rules 100 and * are not checked; result, denied by rule 90. Packet B, HTTPS from 192.0.2.44: rule 90 does not match; rule 100 matches and allows it; rule * is not checked; result, allowed by rule 100. Packet C, SSH (TCP 22) from 192.0.2.44: rules 90 and 100 do not match; rule * matches and denies it; result, denied by rule *. Notes: rules are checked from the lowest number up and the first match decides; every network ACL ends with the * rule; rule 90 sits below 100 on purpose, because numbered 110 it would come after the allow rule and never block HTTPS from that range.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ok-fill:#d9e8fb; --no-fill:#fbe1d6; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ok-fill:#1b3554; --no-fill:#4d2716; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .ok { fill: var(--ok-fill); stroke: var(--s1); stroke-width: 1.5; }
  .no { fill: var(--no-fill); stroke: var(--s2); stroke-width: 1.5; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .skip { fill: none; stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; }
  .plain { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .vpc { fill: none; stroke: var(--ink); stroke-width: 1.8; }
  .subnet { fill: none; stroke: var(--ink2); stroke-width: 1.2; }
  .nacl { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .sg { fill: none; stroke: var(--s1); stroke-width: 2; stroke-dasharray: 7 4; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .mono { fill: var(--ink); font-size: 12px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  .arrlab { fill: var(--ink2); font-size: 11.5px; font-style: italic; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .num { fill: var(--ink); font-size: 13px; font-weight: 700; }
  .numc { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
  .numh { fill: var(--s1); stroke: var(--s1); stroke-width: 1.5; }
  .numhl { fill: var(--surface); font-size: 13px; font-weight: 700; }
</style>
<rect width="680" height="442" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A network ACL stops at the first rule that matches</text>
<text class="sub" x="16" y="48">Inbound rules for the bakery's public subnets, tested against three packets</text>
<text class="zlab" x="16" y="124">Rule</text>
<text class="zlab" x="50" y="124">Traffic</text>
<text class="zlab" x="160" y="124">Source</text>
<text class="zlab" x="276" y="124">Action</text>
<text class="cellt" x="328" y="76">Packet A</text>
<text class="small" x="328" y="92">HTTPS</text>
<text class="small" x="328" y="108">from 203.0.113.7</text>
<text class="cellt" x="440" y="76">Packet B</text>
<text class="small" x="440" y="92">HTTPS</text>
<text class="small" x="440" y="108">from 192.0.2.44</text>
<text class="cellt" x="552" y="76">Packet C</text>
<text class="small" x="552" y="92">SSH (TCP 22)</text>
<text class="small" x="552" y="108">from 192.0.2.44</text>
<line class="grid" x1="16" x2="664" y1="129" y2="129"/>
<text class="mono" x="16" y="159">90</text>
<text class="small" x="50" y="159">All traffic</text>
<text class="mono" x="160" y="159">203.0.113.0/24</text>
<text class="cellt" x="276" y="159">Deny</text>
<rect class="no" x="328.0" y="136.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="380" y="159" text-anchor="middle">Match: denied</text>
<rect class="n" x="440.0" y="136.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="492" y="159" text-anchor="middle">No match</text>
<rect class="n" x="552.0" y="136.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="604" y="159" text-anchor="middle">No match</text>
<line class="grid" x1="16" x2="664" y1="181" y2="181"/>
<text class="mono" x="16" y="211">100</text>
<text class="small" x="50" y="211">HTTPS (TCP 443)</text>
<text class="mono" x="160" y="211">0.0.0.0/0</text>
<text class="cellt" x="276" y="211">Allow</text>
<rect class="skip" x="328.0" y="188.0" width="104.0" height="38.0" rx="5"/>
<text class="cells" x="380" y="211" text-anchor="middle">Not checked</text>
<rect class="ok" x="440.0" y="188.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="492" y="211" text-anchor="middle">Match: allowed</text>
<rect class="n" x="552.0" y="188.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="604" y="211" text-anchor="middle">No match</text>
<line class="grid" x1="16" x2="664" y1="233" y2="233"/>
<text class="mono" x="16" y="263">*</text>
<text class="small" x="50" y="263">All traffic</text>
<text class="mono" x="160" y="263">0.0.0.0/0</text>
<text class="cellt" x="276" y="263">Deny</text>
<rect class="skip" x="328.0" y="240.0" width="104.0" height="38.0" rx="5"/>
<text class="cells" x="380" y="263" text-anchor="middle">Not checked</text>
<rect class="skip" x="440.0" y="240.0" width="104.0" height="38.0" rx="5"/>
<text class="cells" x="492" y="263" text-anchor="middle">Not checked</text>
<rect class="no" x="552.0" y="240.0" width="104.0" height="38.0" rx="5"/>
<text class="cellt" x="604" y="263" text-anchor="middle">Match: denied</text>
<line class="axis" x1="16" x2="664" y1="285" y2="285"/>
<text class="rowl" x="16" y="312">Result</text>
<rect class="no" x="328.0" y="292.0" width="104.0" height="42.0" rx="5"/>
<text class="cellt" x="380" y="309.0" text-anchor="middle">Denied</text>
<text class="cellt" x="380" y="325.0" text-anchor="middle">by rule 90</text>
<rect class="ok" x="440.0" y="292.0" width="104.0" height="42.0" rx="5"/>
<text class="cellt" x="492" y="309.0" text-anchor="middle">Allowed</text>
<text class="cellt" x="492" y="325.0" text-anchor="middle">by rule 100</text>
<rect class="no" x="552.0" y="292.0" width="104.0" height="42.0" rx="5"/>
<text class="cellt" x="604" y="309.0" text-anchor="middle">Denied</text>
<text class="cellt" x="604" y="325.0" text-anchor="middle">by rule *</text>
<text class="note" x="16" y="364">Rules are checked from the lowest number up; the first rule that matches decides, and the rest are skipped.</text>
<text class="note" x="16" y="380">Every network ACL ends with the * rule, which denies whatever no numbered rule matched. Rule 90 sits</text>
<text class="note" x="16" y="396">below 100 on purpose: numbered 110, it would come after the allow rule and never block HTTPS from that range.</text>
<text class="note" x="16" y="412">Addresses are from ranges reserved for examples. From the Amazon VPC User Guide (network ACLs), checked 2026-10-23.</text>
</svg>
