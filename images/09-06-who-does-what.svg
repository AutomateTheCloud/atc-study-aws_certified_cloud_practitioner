<svg xmlns="http://www.w3.org/2000/svg" width="680" height="565" viewBox="0 0 680 565" role="img" aria-labelledby="t d">
<title id="t">What AWS does and what you do at each of the six layers</title>
<desc id="d">Six rows, one per layer, and two columns: AWS does, security of the cloud; you do, security in the cloud. Edge: AWS runs the edge network and applies Shield Standard to everyone automatically; you put CloudFront and Route 53 in front, write WAF rules and decide on Shield Advanced. Network: AWS runs the physical network and keeps each VPC isolated; you design subnets and routes and write security group and network ACL rules. Compute: AWS runs hardware and virtualization, and for Lambda also the operating system; you patch EC2 guest operating systems and own your code and its dependencies. Data, your cell highlighted: AWS provides encryption features and key storage; you classify data, turn on and manage encryption, and decide who can read it. Identity and account, your cell highlighted: AWS provides IAM, MFA and the detection services; you decide who gets access, protect the root user and turn detection on. Organization: AWS provides Organizations and Control Tower; you design the accounts, write SCPs and choose controls.</desc>

