<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img" aria-labelledby="t d">
<title id="t">How many random passwords are possible, by length</title>
<desc id="d">A line chart with a log scale from 10 to the 10th up to 10 to the 40th possible passwords, against length from 8 to 20 characters. Two straight lines rise with length. All four character types (94 characters): from about 10 to the 15.8th at 8 characters to about 10 to the 39.5th at 20. Lowercase letters only (26 characters, dashed): from about 10 to the 11.3th at 8 characters to about 10 to the 28.3th at 20. Two points are marked: 10 characters of all types, about 10 to the 19.7th, and 16 lowercase letters, about 10 to the 22.6th, which is higher. A note says the counts are for passwords picked at random, as a password manager does; human-chosen ones are far easier to guess.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .line-s2 { stroke: var(--s2); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 4; }
  .dot-s2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .ring { fill: none; stroke: var(--ink); stroke-width: 1.5; }
  .small { fill: var(--ink2); font-size: 12px; }
</style>
<rect width="680" height="440" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Each extra character multiplies the guesses needed</text>
<text class="sub" x="16" y="48">Possible random passwords, by length; each gridline is 100,000 times the one below</text>
<line class="axis" x1="70" x2="630" y1="336.0" y2="336.0"/>
<text class="tick" x="62" y="340.0" text-anchor="end">10<tspan dy="-6" font-size="10">10</tspan><tspan dy="6"> </tspan></text>
