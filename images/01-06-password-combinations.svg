<text class="tick" x="350.0" y="372" text-anchor="middle">Length in characters</text>
<polyline class="line-s1" points="70.0,287.8 116.7,271.3 163.3,254.9 210.0,238.5 256.7,222.0 303.3,205.6 350.0,189.1 396.7,172.7 443.3,156.2 490.0,139.8 536.7,123.4 583.3,106.9 630.0,90.5"/>
<polyline class="line-s2" points="70.0,325.0 116.7,313.2 163.3,301.4 210.0,289.6 256.7,277.8 303.3,266.0 350.0,254.3 396.7,242.5 443.3,230.7 490.0,218.9 536.7,207.1 583.3,195.3 630.0,183.5"/>
