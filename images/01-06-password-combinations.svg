<text class="lab" x="86" y="140">10 characters, all types: about 10<tspan dy="-6" font-size="10">19.7</tspan><tspan dy="6"> </tspan></text>
<line class="lead" x1="163.3" x2="163.3" y1="148" y2="246.9"/>
<text class="lab" x="443.3" y="274.7" text-anchor="middle">16 lowercase letters: about 10<tspan dy="-6" font-size="10">22.6</tspan><tspan dy="6"> </tspan></text>
<line class="lead" x1="443.3" x2="443.3" y1="238.7" y2="261.7"/>
<line class="line-s1" x1="16" x2="32" y1="396" y2="396"/>
<text x="38" y="400">All four character types (94 characters)</text>
<line class="line-s2" x1="360" x2="376" y1="396" y2="396"/>
