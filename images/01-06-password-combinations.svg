<text class="tick" x="62" y="256.7" text-anchor="end">10<tspan dy="-6" font-size="10">20</tspan><tspan dy="6"> </tspan></text>
<line class="grid" x1="70" x2="630" y1="211.0" y2="211.0"/>
<text class="tick" x="62" y="215.0" text-anchor="end">10<tspan dy="-6" font-size="10">25</tspan><tspan dy="6"> </tspan></text>
<line class="grid" x1="70" x2="630" y1="169.3" y2="169.3"/>
<text class="tick" x="62" y="173.3" text-anchor="end">10<tspan dy="-6" font-size="10">30</tspan><tspan dy="6"> </tspan></text>
<line class="grid" x1="70" x2="630" y1="127.7" y2="127.7"/>
<text class="tick" x="62" y="131.7" text-anchor="end">10<tspan dy="-6" font-size="10">35</tspan><tspan dy="6"> </tspan></text>
