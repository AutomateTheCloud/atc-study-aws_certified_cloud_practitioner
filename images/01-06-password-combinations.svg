<text class="tick" x="62" y="90.0" text-anchor="end">10<tspan dy="-6" font-size="10">40</tspan><tspan dy="6"> </tspan></text>
<text class="tick" x="16" y="72">Possible passwords (log scale)</text>
<text class="tick" x="70.0" y="354" text-anchor="middle">8</text>
