<svg xmlns="http://www.w3.org/2000/svg" width="720" height="573" viewBox="0 0 720 573" role="img" aria-labelledby="t d">
<title id="t">AWS Support, solutions architects, Professional Services and partners compared</title>
<desc id="d">Four columns compared on five rows. Who they are: AWS Support, AWS's support engineers; solutions architects, AWS technical advisers on your account team; Professional Services, AWS's own consulting experts; partners, other companies in the AWS Partner Network. What they do: Support answers cases about problems with AWS services and your account; solutions architects advise on design, such as architecture and Well-Architected reviews; Professional Services designs, builds, migrates and manages workloads as a project; services partners deliver projects and run systems, and software partners sell products. Do the hands-on work, highlighted: Support, no, they guide you and don't write or debug your code or run your systems; solutions architects, no, they advise and point you to people who build; Professional Services, yes, on a project you hire them for; partners, yes for services partners, under your contract with them. What it costs you: Support, your Support plan, and Basic is free; solutions architects, no charge; Professional Services, a paid contract, with some offerings sold in AWS Marketplace; partners, the partner's own prices, and many sell in AWS Marketplace. How you reach them: a case in Support Center; your account team or AWS's contact form; AWS's contact form or AWS Marketplace; AWS Partner Solutions Finder or AWS Marketplace.</desc>

