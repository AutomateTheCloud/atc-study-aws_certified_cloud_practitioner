<rect width="680" height="499" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Four ways AWS reaches beyond its Regions</text>
<text class="sub" x="16" y="48">The question that separates them: where is it, physically?</text>
<rect class="card" x="16" y="66" width="318" height="199" rx="8"/>
<text class="name" x="30" y="90">Edge location</text>
<text class="key" x="30" y="112">Where</text>
<text class="cells" x="108" y="112.0">Many cities worldwide, beside and</text>
<text class="cells" x="108" y="127.0">inside internet providers'</text>
<text class="cells" x="108" y="142.0">networks</text>
<text class="key" x="30" y="165">Runs</text>
<text class="cells" x="108" y="165.0">CloudFront, Route 53 and Global</text>
