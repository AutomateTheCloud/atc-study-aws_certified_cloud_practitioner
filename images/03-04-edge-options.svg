<text class="cells" x="438" y="112.0">A large city away from the Region</text>
<text class="cells" x="438" y="127.0">it extends</text>
<text class="key" x="360" y="150">Runs</text>
<text class="cells" x="438" y="150.0">Selected services, such as</text>
<text class="cells" x="438" y="165.0">compute, storage and databases</text>
<text class="key" x="360" y="188">Use it for</text>
<text class="cells" x="438" y="188.0">Single-digit-millisecond latency</text>
<text class="cells" x="438" y="203.0">for users in that city; keeping</text>
<text class="cells" x="438" y="218.0">data there</text>
<rect class="card" x="16" y="277" width="318" height="188" rx="8"/>
<text class="name" x="30" y="301">Outposts</text>
<text class="key" x="30" y="323">Where</text>
<text class="cells" x="108" y="323.0">Your own building: your data</text>
<text class="cells" x="108" y="338.0">center or site</text>
<text class="key" x="30" y="361">Runs</text>
<text class="cells" x="108" y="361.0">AWS racks or servers that AWS</text>
<text class="cells" x="108" y="376.0">manages; you provide space, power</text>
<text class="cells" x="108" y="391.0">and network</text>
<text class="key" x="30" y="414">Use it for</text>
<text class="cells" x="108" y="414.0">Low latency to on-site systems,</text>
<text class="cells" x="108" y="429.0">local processing, keeping data on</text>
<text class="cells" x="108" y="444.0">site</text>
<rect class="cardhi" x="346" y="277" width="318" height="188" rx="8"/>
<text class="name" x="360" y="301">Wavelength Zone</text>
<text class="key" x="360" y="323">Where</text>
<text class="cells" x="438" y="323.0">Inside a telecom carrier's 5G</text>
<text class="cells" x="438" y="338.0">network, extending a Region</text>
