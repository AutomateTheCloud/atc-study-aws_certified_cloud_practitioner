<svg xmlns="http://www.w3.org/2000/svg" width="680" height="499" viewBox="0 0 680 499" role="img" aria-labelledby="t d">
<title id="t">Edge location, Local Zone, Outposts and Wavelength Zone compared</title>
<desc id="d">Four cards. Edge location: in many cities worldwide, beside and inside internet providers' networks; runs CloudFront, Route 53 and Global Accelerator, plus features that work through them such as AWS WAF, but not your own servers; used for delivering content and answering requests close to users. Local Zone: in a large city away from the Region it extends; runs selected services such as compute, storage and databases; used for single-digit-millisecond latency for users in that city and for keeping data there. Outposts: in your own building; AWS racks or servers that AWS manages, with you providing space, power and network; used for low latency to on-site systems, local processing and keeping data on site. Wavelength Zone, drawn with a dashed border: inside a telecom carrier's 5G network, extending a Region; runs compute and storage such as EC2 instances; used for ultra-low latency to phones and other mobile devices; out of scope for CLF-C02 as a service.</desc>

