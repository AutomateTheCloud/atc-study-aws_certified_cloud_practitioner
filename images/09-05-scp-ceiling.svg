<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img" aria-labelledby="t d">
<title id="t">Five requests checked against two SCPs and an IAM policy</title>
<desc id="d">A grid for the bakery's German member account. Columns: the root SCP, which denies stopping or deleting CloudTrail trails; the Germany OU SCP, which denies Regions outside Europe with global services exempt; the person's IAM policy; and the result. Row 1, an admin launches a server in Europe (Frankfurt): root SCP allows, OU SCP allows, IAM allows; allowed. Row 2, an admin launches a server in US East (N. Virginia): root SCP allows, OU SCP blocks, IAM allows; denied by the OU SCP. Row 3, an admin stops the CloudTrail trail: root SCP blocks; denied by the root SCP. Row 4, the account's root user stops the trail: root SCP blocks, and root needs no IAM policy; denied by the root SCP. Row 5, a new user with no policies reads a bucket in Frankfurt: both SCPs allow, but no IAM policy allows it; denied by default. A note says a request passes only if every SCP above the account allows it and an IAM policy grants it.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --ok-fill:#d9e8fb; --no-fill:#fbe1d6; --n-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --ok-fill:#1b3554; --no-fill:#4d2716; --n-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .ok { fill: var(--ok-fill); stroke: var(--s1); stroke-width: 1.5; }
  .no { fill: var(--no-fill); stroke: var(--s2); stroke-width: 1.5; }
  .n { fill: var(--n-fill); stroke: var(--ink2); stroke-width: 1.2; }
  .plain { fill: var(--surface); stroke: var(--ink2); stroke-width: 1.2; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .zlab { fill: var(--muted); font-size: 12px; }
  .rowl { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .key { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.4px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .arrow { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
  .arrowhead { fill: var(--ink2); }
</style>
<rect width="680" height="524" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">An SCP is a ceiling: every level must allow, and something must grant</text>
<text class="sub" x="16" y="48">Five requests in the bakery's German member account</text>
<text class="zlab" x="16" y="142">Request</text>
<text class="rowl" x="200" y="70">Root SCP</text>
<text class="zlab" x="200" y="86.0">denies stopping or</text>
<text class="zlab" x="200" y="101.0">deleting CloudTrail</text>
<text class="zlab" x="200" y="116.0">trails</text>
<text class="rowl" x="312" y="70">Germany OU SCP</text>
<text class="zlab" x="312" y="86.0">denies Regions</text>
<text class="zlab" x="312" y="101.0">outside Europe</text>
<text class="zlab" x="312" y="116.0">(global services</text>
<text class="zlab" x="312" y="131.0">exempt)</text>
<text class="rowl" x="424" y="70">IAM policy</text>
<text class="zlab" x="424" y="86.0">what the person's</text>
<text class="zlab" x="424" y="101.0">own policies allow</text>
<text class="rowl" x="536" y="142">Result</text>
<line class="grid" x1="16" x2="664" y1="153" y2="153"/>
<text class="small" x="16" y="176.0">Admin launches a server</text>
<text class="small" x="16" y="192.0">in Europe (Frankfurt)</text>
<rect class="n" x="200.0" y="160.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="253.0" y="184" text-anchor="middle">Allows</text>
<rect class="n" x="312.0" y="160.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="365.0" y="184" text-anchor="middle">Allows</text>
<rect class="n" x="424.0" y="160.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="477.0" y="184" text-anchor="middle">Allows (admin)</text>
<rect class="ok" x="536.0" y="160.0" width="128.0" height="40.0" rx="5"/>
<text class="cellt" x="600.0" y="184" text-anchor="middle">Allowed</text>
<line class="grid" x1="16" x2="664" y1="207" y2="207"/>
<text class="small" x="16" y="230.0">Admin launches a server</text>
<text class="small" x="16" y="246.0">in US East (N. Virginia)</text>
<rect class="n" x="200.0" y="214.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="253.0" y="238" text-anchor="middle">Allows</text>
<rect class="no" x="312.0" y="214.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="365.0" y="238" text-anchor="middle">Blocks</text>
<rect class="n" x="424.0" y="214.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="477.0" y="238" text-anchor="middle">Allows (admin)</text>
<rect class="no" x="536.0" y="214.0" width="128.0" height="40.0" rx="5"/>
<text class="cellt" x="600.0" y="238" text-anchor="middle">Denied: OU SCP</text>
<line class="grid" x1="16" x2="664" y1="261" y2="261"/>
<text class="small" x="16" y="284.0">Admin stops the</text>
<text class="small" x="16" y="300.0">CloudTrail trail</text>
<rect class="no" x="200.0" y="268.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="253.0" y="292" text-anchor="middle">Blocks</text>
<rect class="n" x="312.0" y="268.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="365.0" y="292" text-anchor="middle">Allows</text>
<rect class="n" x="424.0" y="268.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="477.0" y="292" text-anchor="middle">Allows (admin)</text>
<rect class="no" x="536.0" y="268.0" width="128.0" height="40.0" rx="5"/>
<text class="cellt" x="600.0" y="292" text-anchor="middle">Denied: root SCP</text>
<line class="grid" x1="16" x2="664" y1="315" y2="315"/>
<text class="small" x="16" y="338.0">The account's root user</text>
<text class="small" x="16" y="354.0">stops the trail</text>
<rect class="no" x="200.0" y="322.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="253.0" y="346" text-anchor="middle">Blocks</text>
<rect class="n" x="312.0" y="322.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="365.0" y="346" text-anchor="middle">Allows</text>
<rect class="n" x="424.0" y="322.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="477.0" y="346" text-anchor="middle">Root needs none</text>
<rect class="no" x="536.0" y="322.0" width="128.0" height="40.0" rx="5"/>
<text class="cellt" x="600.0" y="346" text-anchor="middle">Denied: root SCP</text>
<line class="grid" x1="16" x2="664" y1="369" y2="369"/>
<text class="small" x="16" y="392.0">New user, no policies, reads</text>
<text class="small" x="16" y="408.0">a bucket in Frankfurt</text>
<rect class="n" x="200.0" y="376.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="253.0" y="400" text-anchor="middle">Allows</text>
<rect class="n" x="312.0" y="376.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="365.0" y="400" text-anchor="middle">Allows</text>
<rect class="no" x="424.0" y="376.0" width="106.0" height="40.0" rx="5"/>
<text class="cellt" x="477.0" y="400" text-anchor="middle">No allow</text>
<rect class="no" x="536.0" y="376.0" width="128.0" height="40.0" rx="5"/>
<text class="cellt" x="600.0" y="400" text-anchor="middle">Denied: default</text>
<line class="axis" x1="16" x2="664" y1="423" y2="423"/>
<text class="note" x="16" y="446">A request passes only if every SCP above the account allows it AND an IAM policy grants it. An SCP never grants:</text>
<text class="note" x="16" y="462">in the last row both SCPs allow, and the request is still denied. SCPs limit a member account's root user; they don't</text>
<text class="note" x="16" y="478">apply to the management account. From the AWS Organizations User Guide (SCPs; SCP examples), checked 2026-10-24.</text>
<text class="note" x="16" y="494">The bakery's accounts and policies are made up for teaching.</text>
</svg>
