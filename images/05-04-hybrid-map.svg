<svg xmlns="http://www.w3.org/2000/svg" width="680" height="572" viewBox="0 0 680 572" role="img" aria-labelledby="t d">
<title id="t">The bakery's data: what stays in the shop, what connects it to AWS, and where it lands</title>
<desc id="d">Three columns: in the shop (on premises), what connects them, and in AWS. Row 1: back-office computers where staff save invoices in a shared folder send files over SMB or NFS to S3 File Gateway, a virtual machine in the shop with a local cache of recent files; it stores each file as an object in an Amazon S3 bucket. Row 2: backup software that writes the accounts' weekly backups to tape writes virtual tapes to Tape Gateway, which looks like a tape library; the tapes are stored in S3 and archived to the S3 Glacier classes. Row 3: the till server is copied continuously by AWS Elastic Disaster Recovery to a staging area in AWS with cheap storage, from which recovery servers launch in minutes. A dashed outline marks the shop. Below, a fourth row for what already runs in AWS: the order database and the web server's disk (Amazon RDS and Amazon EBS, chosen by tag) are backed up every night by an AWS Backup plan into a backup vault, with a copy in a second Region.</desc>

