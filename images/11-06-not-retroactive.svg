<line class="seg-gap" x1="517.0" x2="547.0" y1="191.3" y2="191.3"/>
<path class="untag" d="M517.0,191.3 L517.0,164.5 Q517.0,160.5 521.0,160.5 L543.0,160.5 Q547.0,160.5 547.0,164.5 L547.0,191.3 Z"><title>Day 9: $3.50 with no tag value</title></path>
<text class="tick" x="532.0" y="358" text-anchor="middle">Day 9</text>
<rect class="s1" x="573.0" y="193.0" width="30" height="147.0"><title>Day 10: $16.70 tagged</title></rect>
<line class="seg-gap" x1="573.0" x2="603.0" y1="193.0" y2="193.0"/>
<path class="untag" d="M573.0,193.0 L573.0,167.1 Q573.0,163.1 577.0,163.1 L599.0,163.1 Q603.0,163.1 603.0,167.1 L603.0,193.0 Z"><title>Day 10: $3.40 with no tag value</title></path>
<text class="tick" x="588.0" y="358" text-anchor="middle">Day 10</text>
<line class="mark" x1="336.0" x2="336.0" y1="110" y2="340"/>
<text class="ann" x="342.0" y="106">Key active from day 6</text>
<text class="ann" x="330.0" y="106" text-anchor="end">Activated on day 5</text>
<text class="note" x="16" y="386">Days 1 to 5 stay untagged in the report even though the resources carried the tag all along.</text>
