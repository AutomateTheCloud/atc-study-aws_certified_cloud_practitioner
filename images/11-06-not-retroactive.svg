<svg xmlns="http://www.w3.org/2000/svg" width="680" height="435" viewBox="0 0 680 435" role="img" aria-labelledby="t d">
<title id="t">Daily cost grouped by a tag, before and after the tag key is activated</title>
<desc id="d">A stacked column chart of the bakery's daily cost over ten days, made-up figures of about $20 a day. On days 1 to 5 every column is one gray segment: cost with no tag value. The tag key is activated on day 5 and is active from day 6. From day 6 to day 10 each column splits into about $17 that carries a team tag value, in blue, and about $3.50 with no tag value, in gray. A note says days 1 to 5 stay untagged in the report even though the resources carried the tag, unless a management account requests a backfill, and that costs from untagged resources still show no tag value after activation.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .untag { fill: var(--muted); }
  .seg-gap { stroke: var(--surface); stroke-width: 2; }
  .mark { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 4; }
  .ann { fill: var(--ink); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
<rect width="680" height="435" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A tag shows costs only from the day it is active</text>
<text class="sub" x="16" y="48">The bakery's daily cost in Cost Explorer, grouped by its "team" tag (made-up figures)</text>
<rect class="s1" x="16" y="70" width="12" height="12" rx="2"/>
<text x="34" y="80">Cost that carries a team tag value</text>
<rect class="untag" x="300" y="70" width="12" height="12" rx="2"/>
<text x="318" y="80">Cost with no tag value (shown as no tag key)</text>
<line class="axis" x1="56" x2="616" y1="340.0" y2="340.0"/>
<text class="tick" x="48" y="344.0" text-anchor="end">$0</text>
<line class="grid" x1="56" x2="616" y1="296.0" y2="296.0"/>
<text class="tick" x="48" y="300.0" text-anchor="end">$5</text>
