<text class="tiny" x="427.0" y="158.0" text-anchor="middle">own power, cooling</text>
<text class="tiny" x="427.0" y="171.0" text-anchor="middle">and network</text>
<rect class="dc" x="368" y="180" width="118" height="32" rx="4"/>
<text class="small" x="427.0" y="200" text-anchor="middle">Data center</text>
<rect class="dc" x="368" y="218" width="118" height="32" rx="4"/>
<text class="small" x="427.0" y="238" text-anchor="middle">Data center</text>
<text class="tiny" x="427.0" y="310" text-anchor="middle">2 data centers (illustrative)</text>
<path class="link" d="M107.0,322 L107.0,344 L267.0,344 L267.0,322"/>
<path class="link" d="M267.0,322 L267.0,344 L427.0,344 L427.0,322"/>
<text class="small" x="266.0" y="362" text-anchor="middle">Linked by fast, redundant private fiber; traffic between AZs is encrypted</text>
<text class="small" x="266.0" y="378" text-anchor="middle">AZs are many kilometers apart, but all within 100 km (60 miles) of each other</text>
<rect class="region2" x="532" y="66" width="132" height="150" rx="10"/>
