<text class="tiny" x="267.0" y="171.0" text-anchor="middle">and network</text>
<rect class="dc" x="208" y="180" width="118" height="32" rx="4"/>
<text class="small" x="267.0" y="200" text-anchor="middle">Data center</text>
<text class="tiny" x="267.0" y="310" text-anchor="middle">1 data center (illustrative)</text>
<rect class="az" x="354" y="122" width="146" height="200" rx="8"/>
