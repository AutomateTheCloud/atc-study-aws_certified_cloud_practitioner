<text class="boxt" x="505.0" y="200" text-anchor="middle">Nearest edge location</text>
<text class="cells" x="505.0" y="216.0" text-anchor="middle">two fixed IP addresses, announced</text>
<text class="cells" x="505.0" y="230.0" text-anchor="middle">from AWS's edge; no copies kept</text>
<path class="flow" d="M505.0,140.0 L505.0,174.0"/>
