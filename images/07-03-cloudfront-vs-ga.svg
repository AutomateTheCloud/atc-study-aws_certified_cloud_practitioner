<svg xmlns="http://www.w3.org/2000/svg" width="680" height="486" viewBox="0 0 680 486" role="img" aria-labelledby="t d">
<title id="t">Amazon CloudFront compared with AWS Global Accelerator</title>
<desc id="d">Two panels. Amazon CloudFront: a user connects to the nearest edge location, which keeps a copy of popular content and answers from it when it can; a dashed arrow goes to the origin in a Region, an S3 bucket, web server or API, only when there is no fresh copy. Bullets: web content over HTTP and HTTPS; many requests never reach the origin; a content delivery network. AWS Global Accelerator: a user connects to the nearest edge location through two fixed IP addresses announced from AWS's edge, with no copies kept; traffic travels over the AWS network to a healthy endpoint in Region A, with a dashed arrow to Region B, used if A fails. Bullets: any TCP or UDP traffic such as games, voice and IoT; every request reaches your application; switches Regions without waiting on DNS.</desc>

