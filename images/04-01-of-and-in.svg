<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img" aria-labelledby="t d">
<title id="t">Security of the cloud (AWS) and security in the cloud (you), as layers</title>
<desc id="d">Six layers in a stack, split by a dashed line. Above the line, security in the cloud, done by you: your data and who can reach it (the bakery's orders and cake photos); your settings and encryption choices (firewall rules, storage settings, MFA); the operating system and software you install on services such as EC2 (the web server's operating system and website software). The line is labeled: where it sits depends on the service. Below the line, security of the cloud, done by AWS: the software that runs AWS's services; the host operating system and virtualization; hardware and the global infrastructure of Regions, Availability Zones and edge locations. A note says the stack is drawn for EC2, and that the line sits higher on RDS, Lambda and S3.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --aws-fill:#d9e8fb; --you-fill:#fbe1d6; --none-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --aws-fill:#1b3554; --you-fill:#4d2716; --none-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .aws { fill: var(--aws-fill); stroke: var(--s1); stroke-width: 1.5; }
  .you { fill: var(--you-fill); stroke: var(--s2); stroke-width: 1.5; }
  .none { fill: var(--none-fill); stroke: var(--axis); stroke-width: 1; stroke-dasharray: 3 3; }
  .cellt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 11.5px; }
  .head { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .rowl { fill: var(--ink); font-size: 12.5px; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .theline { stroke: var(--ink); stroke-width: 3; fill: none; stroke-dasharray: 8 5; stroke-linecap: round; }
  .linelab { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
  .bracket { stroke: var(--ink2); stroke-width: 1.5; fill: none; }
</style>
<rect width="680" height="500" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">Security of the cloud and security in the cloud</text>
<text class="sub" x="16" y="48">AWS secures the layers below the line; you secure what you put above it</text>
<text class="head" x="40" y="82">Security in the cloud: you</text>
<text class="small" x="388" y="82">At the bakery, for example</text>
<rect class="you" x="40" y="94" width="330" height="36" rx="5"/>
<text class="rowl" x="52" y="116.0">Your data, and who can reach it</text>
<text class="small" x="388" y="112.0">Orders and cake photos; who may read</text>
<text class="small" x="388" y="127.0">or change them</text>
<rect class="you" x="40" y="136" width="330" height="36" rx="5"/>
<text class="rowl" x="52" y="158.0">Your settings and encryption choices</text>
<text class="small" x="388" y="154.0">Firewall rules, storage settings,</text>
<text class="small" x="388" y="169.0">MFA on your sign-ins</text>
<rect class="you" x="40" y="178" width="330" height="52" rx="5"/>
<text class="rowl" x="52" y="200.0">Operating system and software you install,</text>
<text class="rowl" x="52" y="216.0">on services such as EC2</text>
<text class="small" x="388" y="196.0">The web server's operating system</text>
<text class="small" x="388" y="211.0">and the website software</text>
<path class="bracket" d="M30,94 L24,94 L24,230 L30,230"/>
<text class="small" transform="translate(18,162) rotate(-90)" text-anchor="middle">You</text>
<text class="linelab" x="664" y="254" text-anchor="end">The line: where it sits depends on the service</text>
<line class="theline" x1="16" x2="664" y1="266" y2="266"/>
<text class="head" x="40" y="294">Security of the cloud: AWS</text>
<rect class="aws" x="40" y="306" width="330" height="52" rx="5"/>
<text class="rowl" x="52" y="328.0">Software that runs AWS's services: compute,</text>
<text class="rowl" x="52" y="344.0">storage, database, networking</text>
<text class="small" x="388" y="324.0">What keeps the database service and</text>
<text class="small" x="388" y="339.0">the storage service running</text>
<rect class="aws" x="40" y="364" width="330" height="36" rx="5"/>
<text class="rowl" x="52" y="386.0">Host operating system and virtualization</text>
<text class="small" x="388" y="382.0">The layer that splits one physical</text>
<text class="small" x="388" y="397.0">machine into many virtual servers</text>
<rect class="aws" x="40" y="406" width="330" height="52" rx="5"/>
<text class="rowl" x="52" y="428.0">Hardware and the global infrastructure:</text>
<text class="rowl" x="52" y="444.0">Regions, Availability Zones, edge locations</text>
<text class="small" x="388" y="424.0">AWS's buildings, machines, power and</text>
<text class="small" x="388" y="439.0">cooling</text>
<path class="bracket" d="M30,306 L24,306 L24,458 L30,458"/>
<text class="small" transform="translate(18,382) rotate(-90)" text-anchor="middle">AWS</text>
<text class="note" x="16" y="480">Drawn this way for EC2. On services where AWS runs more for you, such as RDS, Lambda and S3, the line sits higher.</text>
</svg>
