<svg xmlns="http://www.w3.org/2000/svg" width="680" height="456" viewBox="0 0 680 456" role="img" aria-labelledby="t d">
<title id="t">Schematic of Regions and edge locations around the world</title>
<desc id="d">A schematic, not a map. Three panels: North America, Europe and Asia Pacific. Each holds two Region boxes, each with three small Availability Zone squares inside, and about eight small dots for edge locations, scattered more widely. In the Europe panel, a customer connects by a short solid line to the nearest edge location; a dashed line runs from that edge location to a Region, labeled in the legend as the AWS network used when the edge can't answer by itself. Dashed lines under the panels show AWS's own global network linking Regions and edge locations. The number and position of shapes are illustrative; current counts are on AWS's Global Infrastructure page.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --reg-fill:#d9e8fb; --card-fill:#f6f5f2; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --reg-fill:#1b3554; --card-fill:#222221; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .panel { fill: none; stroke: var(--axis); stroke-width: 1; }
  .region { fill: var(--reg-fill); stroke: var(--s1); stroke-width: 1.5; }
  .az { fill: var(--surface); stroke: var(--s1); stroke-width: 1; }
  .edge { fill: var(--s2); stroke: var(--surface); stroke-width: 2; }
  .user { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
  .hop { stroke: var(--ink); stroke-width: 2; fill: none; }
  .backbone { stroke: var(--ink2); stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .cardhi { fill: var(--card-fill); stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .name { fill: var(--ink); font-size: 15px; font-weight: 600; }
  .key { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .cells { fill: var(--ink2); font-size: 12px; }
  .panelt { fill: var(--ink); font-size: 13px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
</style>
