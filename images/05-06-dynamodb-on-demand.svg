<svg xmlns="http://www.w3.org/2000/svg" width="680" height="482" viewBox="0 0 680 482" role="img" aria-labelledby="t d">
<title id="t">Requests per day to an on-demand DynamoDB table over one month, and the month's bill</title>
<desc id="d">A bar chart of requests per day, reads plus writes, for days 1 to 30, from AWS's pricing example for a new table in US East (N. Virginia), retrieved 2026-10-23. Days 1 to 10: 20,000 a day, too small to see at this scale. Day 11: 5 million; the table kept up with nothing set up in advance. Days 12 to 30: 100,000 a day. The month's bill is $3.16: $2.22 for 3.55 million writes at $0.625 per million, $0.44 for 3.55 million reads at $0.125 per million, and $0.50 for 27 GB stored on average, of which the first 25 GB are free and 2 GB cost $0.25 per GB-month.</desc>

