<svg xmlns="http://www.w3.org/2000/svg" width="680" height="354" viewBox="0 0 680 354" role="img" aria-labelledby="t d">
<title id="t">Monthly cost of a small web server: a $12 Lightsail plan against EC2 priced by part</title>
<desc id="d">A horizontal bar chart in dollars per month, from 0 to 25. The Lightsail plan with 2 GB of memory and 2 vCPUs is one bar at $12.00, with the server, 60 GB of SSD storage, a public IPv4 address and 3 TB of data transfer included. EC2 priced by part, for 2 GiB and 2 vCPUs, is a stacked bar totaling $23.63: a t3.small instance for 730 hours, $15.18; a 60 GB gp3 disk, $4.80; a public IPv4 address, $3.65. EC2 adds data transfer out beyond the free allowance at $0.09 per GB. Lightsail prices retrieved 2026-10-23; EC2 prices as of 2026-10-24.</desc>

<style>
  svg { --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --s1:#2a78d6; --s1-light:#9ec5f4; --s2:#eb6834; --card-fill:#f1f0ec; }
  @media (prefers-color-scheme: dark) {
    svg { --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
          --grid:#2c2c2a; --axis:#383835; --s1:#3987e5; --s1-light:#1c5cab; --s2:#d95926; --card-fill:#252523; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink2); font-size: 13px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 13px; }
  .tick { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lab { fill: var(--ink); font-size: 13px; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1 { fill: var(--s1); } .s1l { fill: var(--s1-light); } .s2 { fill: var(--s2); }
  .line-ink { stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-s1 { stroke: var(--s1); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .dot-s1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; }
  .lead { stroke: var(--muted); stroke-width: 1; }
  .card { fill: var(--card-fill); stroke: var(--axis); stroke-width: 1; }
  .cellt { fill: var(--ink); font-size: 14px; font-weight: 600; }
  .head { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .small { fill: var(--ink2); font-size: 12px; }
  .note { fill: var(--muted); font-size: 11.5px; }
  .ann { fill: var(--ink); font-size: 12px; }
  .vlab { fill: var(--ink); font-size: 12px; font-variant-numeric: tabular-nums; }
  .seg-gap { stroke: var(--surface); stroke-width: 2; }
  .bundle { fill: var(--muted); }
</style>
<rect width="680" height="354" fill="var(--surface)" style="fill:var(--surface)"/>
<text class="title" x="16" y="28">A small, steady web server for a month: a bundle or the parts</text>
<text class="sub" x="16" y="48">Amazon Lightsail's $12 plan against similar pieces on Amazon EC2, US East (N. Virginia)</text>
<line class="axis" x1="150.0" x2="150.0" y1="86" y2="212"/>
<text class="tick" x="150.0" y="228" text-anchor="middle">$0</text>
<line class="grid" x1="244.0" x2="244.0" y1="86" y2="212"/>
<text class="tick" x="244.0" y="228" text-anchor="middle">$5</text>
<line class="grid" x1="338.0" x2="338.0" y1="86" y2="212"/>
<text class="tick" x="338.0" y="228" text-anchor="middle">$10</text>
<line class="grid" x1="432.0" x2="432.0" y1="86" y2="212"/>
<text class="tick" x="432.0" y="228" text-anchor="middle">$15</text>
<line class="grid" x1="526.0" x2="526.0" y1="86" y2="212"/>
<text class="tick" x="526.0" y="228" text-anchor="middle">$20</text>
<line class="grid" x1="620.0" x2="620.0" y1="86" y2="212"/>
<text class="tick" x="620.0" y="228" text-anchor="middle">$25</text>
<text class="tick" x="385.0" y="246" text-anchor="middle">Dollars per month</text>
<text class="lab" x="140" y="109" text-anchor="end">Lightsail plan</text>
<text class="tick" x="140" y="125" text-anchor="end">2 GB, 2 vCPUs</text>
<path class="bundle" d="M150.0,92.0 L371.6,92.0 Q375.6,92.0 375.6,96.0 L375.6,128.0 Q375.6,132.0 371.6,132.0 L150.0,132.0 Z"><title>Lightsail plan: $12.00 a month</title></path>
<text class="vlab" x="383.6" y="109">$12.00, one price that includes the server,</text>
<text class="vlab" x="383.6" y="125">60 GB SSD, a public IPv4 address and 3 TB transfer</text>
<text class="lab" x="140" y="183" text-anchor="end">EC2, priced by part</text>
<text class="tick" x="140" y="199" text-anchor="end">2 GiB, 2 vCPUs</text>
<rect class="s1" x="150.0" y="166" width="285.5" height="40"><title>t3.small instance, 730 hours: $15.18</title></rect>
<rect class="s1l" x="435.5" y="166" width="90.2" height="40"><title>60 GB gp3 disk: $4.80</title></rect>
<line class="seg-gap" x1="435.5" x2="435.5" y1="166" y2="206"/>
<path class="s2" d="M525.7,166.0 L590.3,166.0 Q594.3,166.0 594.3,170.0 L594.3,202.0 Q594.3,206.0 590.3,206.0 L525.7,206.0 Z"><title>Public IPv4 address: $3.65</title></path>
<line class="seg-gap" x1="525.7" x2="525.7" y1="166" y2="206"/>
<text class="vlab" x="602.3" y="191">$23.63</text>
<rect class="s1" x="16" y="252" width="12" height="12" rx="2"/>
<text class="ann" x="34" y="262">t3.small instance, 730 hours: $15.18</text>
<rect class="s1l" x="312" y="252" width="12" height="12" rx="2"/>
<text class="ann" x="330" y="262">60 GB gp3 disk: $4.80</text>
<rect class="s2" x="503" y="252" width="12" height="12" rx="2"/>
<text class="ann" x="521" y="262">Public IPv4 address: $3.65</text>
<text class="note" x="16" y="290">Plus, on EC2 only: data transfer out to the internet beyond the free allowance, $0.09 per GB (price list of 2026-09-16).</text>
<text class="note" x="16" y="305">Lightsail: pricing page, retrieved 2026-10-23. EC2: AWS Price List offer files, retrieved 2026-10-24; t3.small</text>
<text class="note" x="16" y="320">$0.0208 an hour, gp3 $0.08 per GB-month, public IPv4 $0.005 an hour, for 730 hours. Prices change.</text>
<text class="note" x="16" y="335">Not the same machine: EC2 offers far more instance types, pricing options and network control.</text>
</svg>
