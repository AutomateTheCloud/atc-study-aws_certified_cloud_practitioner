<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
<title id="t">Running storage cost over a year for lifecycle plans A, B and D</title>
<desc id="d">Line chart, days 0 to 365, running storage cost in US dollars for 300 GB of backups at S3 prices for US East (N. Virginia) as of 2026-10-24. All three plans cost the same $6.90 for the first 30 days in S3 Standard. Plan A, Standard all year, keeps climbing in a straight line to $83.95. Plan B, three steps, rises to $14.40 by day 90, then flattens, ending at $24.30. Plan D, Standard then Deep Archive, almost flattens after day 30 and ends at $10.22. Plan C is not drawn because it fails the restore rule.</desc>

<style>
