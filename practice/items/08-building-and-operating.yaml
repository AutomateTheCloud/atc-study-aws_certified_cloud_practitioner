# Module 08, Building and operating. Practice questions and concept cards.
# Written from the guide's pages in guide/08-building-and-operating/; see practice/work/blueprint-08.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 08.01, Four ways in
  # ---------------------------------------------------------------------------------------------

  - id: q08-denied-in-console-tries-cli
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "The big picture: four doors, one set of services"
    task: "3.1"
    level: application
    topics: [ways-in, iam]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A contractor's IAM user has no permission to terminate EC2 instances. The termination fails
        when she tries it in the AWS Management Console, so she runs the same action with the AWS CLI
        from her laptop, signed in as the same user. What happens?
    choices:
      - id: cli-succeeds
        text: The instance is terminated, because the CLI isn't limited by console permissions
        variants:
          - text: It works, since console permissions don't apply to CLI commands
          - text: The CLI terminates it, because IAM only governs the console
        explanation:
          text: Every way in sends a request to the same service, and IAM checks every request. The CLI is not a side door around permissions.
      - id: cli-denied
        text: The request is denied, because IAM checks the same permissions for every way in
        variants:
          - text: It fails too, since IAM applies the same permissions to CLI requests
          - text: AWS refuses it, because the user's permissions are the same in the CLI
        explanation:
          text: Correct. The console, the CLI, the SDKs and CloudFormation all send requests that IAM checks against the same permissions.
      - id: cli-unrecorded
        text: The instance is terminated, but CloudTrail doesn't record actions made through the CLI
        variants:
          - text: It works, and the action is missing from CloudTrail's record of the account
          - text: The CLI terminates it, and CloudTrail keeps no event of the command
        explanation:
          text: Two errors. The request is denied, and CloudTrail records console actions, CLI commands and SDK calls alike.
      - id: cli-only-cloudshell
        text: The request works only if she runs it from AWS CloudShell instead
        variants:
          - text: It succeeds only when typed into CloudShell, not on a laptop
          - text: It is allowed from CloudShell, though not from her own computer
        explanation:
          text: CloudShell signs in with the same identity she used for the console, so the same permissions apply there too. Where the CLI runs doesn't change what she may do.
    correct_answers: [cli-denied]
    hint:
      text: Think about what checks a request after it leaves the tool, whichever tool sent it.
    explanation:
      text: |
        The four ways into AWS differ only in how a request is made. Each request reaches the same
        service, IAM checks it against the same permissions, and CloudTrail records it as an event. A
        permission missing in the console is missing in the CLI, the SDKs and templates too.

  - id: q08-four-doors-shared-traits
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "The big picture: four doors, one set of services"
    task: "3.1"
    level: recall
    topics: [ways-in, cloudtrail, iam]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company's staff use the AWS Management Console, its developers use the AWS CLI, and its
        applications call AWS through an AWS SDK. Which TWO statements are true of all three ways
        in? (Select TWO.)
    choices:
      - id: sdk-skips-iam
        text: SDK calls skip IAM, because they come from code
        variants:
          - text: Requests from code bypass IAM's permission checks
          - text: IAM doesn't check calls an application makes through an SDK
        explanation:
          text: Code needs permissions like anyone else. On AWS it usually gets them from an IAM role, and IAM checks every call.
      - id: same-permissions
        text: IAM checks each request against the same permissions
        variants:
          - text: The same IAM permissions apply to every request
          - text: Each request is allowed or denied by the same IAM permissions
        explanation:
          text: Correct. IAM checks every request, whatever sent it.
      - id: only-creator-manages
        text: A resource can be changed only through the way in that made it
        variants:
          - text: Only the way in that created a resource can later change it
          - text: Resources made through one way in can be managed only through it
        explanation:
          text: All three reach the same services and the same resources. A bucket made in the console can be listed or deleted with the CLI, and the reverse.
      - id: cli-charged-per-command
        text: The CLI adds its own charge for each command run
        variants:
          - text: Each CLI command carries a fee for using the CLI
          - text: AWS bills a charge per command for using the CLI
        explanation:
          text: The CLI itself has no charge. You pay for what your commands create, and a few APIs bill per request whichever way the request arrives.
      - id: cloudtrail-records
        text: CloudTrail records changes, such as creating a bucket, as events
        variants:
          - text: Creating or deleting a resource is recorded as an event in CloudTrail
          - text: Creating or changing a resource shows up as an event in CloudTrail
        explanation:
          text: Correct. CloudTrail records management events, such as creating or deleting a resource, from the console, the CLI and SDKs alike. Actions on data, such as reading objects, are recorded only if you turn on data events.
    correct_answers: [same-permissions, cloudtrail-records]
    explanation:
      text: |
        The console, the CLI, the SDKs and infrastructure as code are four doors to one set of
        services. What differs is who drives the work and whether it can be repeated; the
        permissions IAM checks and the record CloudTrail keeps are the same for all of them.

  - id: q08-hand-built-prod-second-copy
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "\"Console clicks are fine for production\" is wrong"
    task: "3.1"
    level: understanding
    topics: [ways-in, console, infrastructure-as-code]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A travel agency built its production network, servers and database rules two years ago by
        clicking in the AWS Management Console. It now needs an identical copy for disaster recovery.
        What is the main weakness of the original approach?
    choices:
      - id: costs-more
        text: Resources created in the console are billed at a higher rate
        variants:
          - text: AWS charges more for resources that were made in the console
          - text: Console-built resources cost more than ones made another way
        explanation:
          text: A resource costs the same however it was created. The problem is how it can be repeated, not its price.
      - id: not-recorded
        text: CloudTrail keeps no record of resources that were made in the console
        variants:
          - text: Console actions are missing from CloudTrail, so no record exists
          - text: CloudTrail doesn't log actions taken in the console
        explanation:
          text: CloudTrail records console actions too. But a list of past events is not a reviewed description of the setup, and Event history keeps only 90 days of it.
      - id: no-record-of-steps
        text: Only the result exists, so a copy depends on someone's memory
        variants:
          - text: The steps were never written down, so a copy relies on memory
          - text: Nothing but the result was kept, so copying depends on recall
        explanation:
          text: Correct. Clicks build the resource, but the choices live in a person's head. Each manual pass can miss a setting, and nothing can be reviewed beforehand.
      - id: cannot-back-up
        text: Resources made in the console can't be backed up or restored
        variants:
          - text: Backups don't work for resources created through the console
          - text: Console-made resources are excluded from backup and restore
        explanation:
          text: How a resource was created doesn't affect backups. Data from a console-made database can be backed up like any other.
    correct_answers: [no-record-of-steps]
    explanation:
      text: |
        "Console clicks are fine for production" fails for anything that must be rebuilt, copied or
        reviewed. The console keeps the result, not the steps, so a second copy is another manual pass
        that can miss a setting, and there is no file a colleague can check. The console stays the
        right tool for looking at production; building it belongs in code.

  - id: q08-auditor-one-look-console
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "The console is for seeing, learning and doing something once"
    task: "3.1"
    level: application
    topics: [ways-in, console]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A new operations manager, who doesn't program, wants to look once at how the company's
        main load balancer and its security groups are currently set up. Which way into AWS fits
        this task best?
    choices:
      - id: cfn-template
        text: Write a CloudFormation template that describes the load balancer
        variants:
          - text: Describe the load balancer in a new CloudFormation template
          - text: Create a CloudFormation template for the load balancer
        explanation:
          text: A template builds resources. Writing one doesn't show how existing resources are set up.
      - id: sdk-program
        text: Write a program that reads the settings through an AWS SDK
        variants:
          - text: Build a small application that calls an AWS SDK for the settings
          - text: Code a program that fetches the settings with an AWS SDK
        explanation:
          text: An SDK is for applications that call AWS while they run. Writing a program for one look is far more effort than the job needs, and he doesn't program.
      - id: scheduled-cli-script
        text: Schedule a CLI script that prints the settings every night
        variants:
          - text: Run a nightly AWS CLI script that lists the settings
          - text: Set up a CLI script to output the settings each night
        explanation:
          text: The task happens once. A scheduled script repeats a job that nobody needs repeated.
      - id: console
        text: Open the load balancer's pages in the AWS Management Console
        variants:
          - text: Look at the load balancer in the AWS Management Console
          - text: Browse the load balancer's settings in the console
        explanation:
          text: "Correct. One person, one look, no repetition: the console shows the settings and their defaults on the page."
    correct_answers: [console]
    hint:
      text: Ask who does the task, whether it repeats, and how many things it touches.
    explanation:
      text: |
        The console is the best way to see what exists, learn a service and make a one-off change. A
        single look by a person who doesn't program needs nothing written down or repeated. The other
        ways in pay off when a program does the work or when the work repeats.

  - id: q08-delete-snapshots-by-tag
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "One-time or repeatable: the question that picks the way in"
    task: "3.1"
    level: application
    topics: [ways-in, aws-cli]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After a training week, an administrator must delete 45 EC2 snapshots that all carry the tag
        `course=spring`. The job will not be repeated. Which way in fits best?
    choices:
      - id: cli-by-tag
        text: The AWS CLI, with commands that select the snapshots by their tag
        variants:
          - text: AWS CLI commands that find the snapshots by tag and delete them
          - text: The AWS CLI, filtering the snapshots on their tag
        explanation:
          text: Correct. The job is done once, but it touches many items, so a command that filters by tag beats 45 rounds of clicking.
      - id: console-each
        text: The AWS Management Console, deleting the snapshots one at a time
        variants:
          - text: The console, removing each snapshot by hand, one at a time
          - text: Clicking through the console to delete the snapshots one by one
        explanation:
          text: It would work, but 45 separate deletions by hand are slow and easy to get wrong. "Once" doesn't always mean the console.
      - id: cfn-new-template
        text: A new CloudFormation template that lists all 45 snapshots by their IDs
        variants:
          - text: A CloudFormation template written to describe each of the snapshots
          - text: A fresh CloudFormation template naming each snapshot
        explanation:
          text: A template builds and manages the resources in its own stack. These snapshots weren't made by a stack, and the job is a one-off clean-up, not a setup to rebuild.
      - id: sdk-in-app
        text: An AWS SDK call added to the company's customer-facing website
        variants:
          - text: SDK code built into the company's public website
          - text: A call through an AWS SDK inside the customer website
        explanation:
          text: An SDK suits a program that calls AWS while it runs. A one-off clean-up by an administrator has nothing to do with the website's code.
    correct_answers: [cli-by-tag]
    hint:
      text: The task happens once. What else about it matters?
    explanation:
      text: |
        Three questions pick the way in: who does it, whether it repeats or must match, and how many
        things it touches. A person doing a one-time job on many items is the CLI's case: a single
        command can select the items by tag and act on them all.

  - id: q08-cli-same-admin-functions
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "The CLI turns each action into a command you can save and run again"
    task: "3.1"
    level: recall
    topics: [aws-cli]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement about the AWS Command Line Interface (AWS CLI) is correct?
    choices:
      - id: read-only
        text: It can list and describe resources, but making changes needs the console
        variants:
          - text: It only reads resources; creating or changing them requires the console
          - text: It can look at resources but can't create or change them
        explanation:
          text: The CLI can create, change and delete resources. In Lab 10 it creates and deletes a bucket.
      - id: same-functions
        text: It offers the console's infrastructure administration functions as commands
        variants:
          - text: It gives typed commands for the console's infrastructure administration
          - text: It provides, as commands, the console's infrastructure administration functions
        explanation:
          text: Correct. AWS states that every infrastructure administration function in the console is also in the API and the CLI, and that the CLI calls each service's public API.
      - id: cloudshell-only
        text: It runs only inside AWS CloudShell, not on a person's own computer
        variants:
          - text: It works in CloudShell alone and can't be installed elsewhere
          - text: It can be used only in CloudShell, never on your own machine
        explanation:
          text: CloudShell is one convenient place to run it. The CLI also runs on your own computer, signed in with `aws login`.
      - id: builds-from-templates
        text: It describes a whole setup in a file and keeps it in sync
        variants:
          - text: It keeps a whole setup matched to a file that describes it
          - text: It records a full setup in a file and keeps the two matched
        explanation:
          text: That is infrastructure as code, which on AWS is CloudFormation. CLI commands are steps; they don't describe an end state.
    correct_answers: [same-functions]
    explanation:
      text: |
        The AWS CLI gives you, in a terminal, the same functions the console gives you in a browser,
        by calling each service's public API. Because a command is a line of text, it can be saved,
        shared and run again, which is why the CLI suits bulk and routine work.

  - id: q08-sdk-invoice-program
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "An SDK puts AWS calls inside your own program"
    task: "3.1"
    level: application
    topics: [ways-in, aws-sdk]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's billing application, written in Java, creates a PDF invoice for every sale and
        must store each one in Amazon S3 the moment it is created, day and night, with no person
        involved. How should the application reach S3?
    choices:
      - id: nightly-cli
        text: An administrator uploads the day's invoices each night with the AWS CLI
        variants:
          - text: Someone copies the invoices up each evening using the AWS CLI
          - text: Each night a person runs AWS CLI commands to upload the invoices
        explanation:
          text: The requirement is each invoice at the moment it's created, with nobody involved. A nightly upload by a person meets neither condition.
      - id: cfn-stack
        text: A CloudFormation stack that adds each new invoice to the bucket
        variants:
          - text: A CloudFormation template that puts every invoice into S3
          - text: A stack in CloudFormation that stores each invoice as it appears
        explanation:
          text: CloudFormation builds infrastructure, such as the bucket. It doesn't upload an application's files as they are produced.
      - id: console-upload
        text: Staff upload each invoice through the S3 pages of the console
        variants:
          - text: Employees add each invoice using the S3 console's upload page
          - text: A person uploads every invoice through the S3 console
        explanation:
          text: The console is for people clicking. It can't keep up with every sale, day and night, without a person.
      - id: sdk-for-java
        text: The application calls S3 through the AWS SDK for its language
        variants:
          - text: The program's code uses an AWS SDK for Java to call S3
          - text: The application uses an AWS SDK to call S3 from its own code
        explanation:
          text: Correct. An SDK lets a program call AWS services from its own code, in its own language, every time it needs to.
    correct_answers: [sdk-for-java]
    hint:
      text: "Ask who makes the call each time: a person or the program itself."
    explanation:
      text: |
        When AWS is part of what a program does while it runs, the program calls AWS through an
        SDK, a set of code libraries for its language. The SDK signs each request, finds the
        credentials of the role the code runs with, and retries brief failures.

  - id: q08-sdk-handles-for-code
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "An SDK puts AWS calls inside your own program"
    task: "3.1"
    level: understanding
    topics: [aws-sdk, credentials]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A developer's code runs in AWS Lambda and uses an AWS SDK to read files from Amazon S3.
        Which TWO things does the SDK handle for her code? (Select TWO.)
    choices:
      - id: no-permissions-needed
        text: It removes the need for the code to have any IAM permissions
        variants:
          - text: It lets the code call S3 without any IAM permissions
          - text: It means the function needs no IAM permissions at all
        explanation:
          text: The SDK signs requests with the role's credentials, and IAM still checks them. The role needs permission to read the bucket.
      - id: free-requests
        text: It makes the code's requests to S3 free of charge
        variants:
          - text: It removes the charge for the code's S3 requests
          - text: It lets the code call S3 without paying for requests
        explanation:
          text: The SDK is a set of libraries; it doesn't change what services charge. Requests cost the same whichever way they arrive.
      - id: finds-role-credentials
        text: It picks up the function role's temporary credentials and renews them
        variants:
          - text: It finds the temporary credentials of the function's role and refreshes them
          - text: It obtains and renews the role's temporary credentials on its own
        explanation:
          text: Correct. Code in Lambda, on EC2 or in a container gets the credentials of the IAM role it runs with, and the SDK renews them as they expire.
      - id: retries-brief-failures
        text: It retries calls that fail briefly, such as one that timed out
        variants:
          - text: It tries a call again after a short failure, such as a timeout
          - text: It repeats a request that failed for a moment, such as on a timeout
        explanation:
          text: Correct. The SDK retries brief failures, such as a timeout or a request turned away because too many arrived at once.
      - id: builds-environment
        text: It builds the function's whole environment from a template
        variants:
          - text: It creates the function's complete setup from a template file
          - text: It sets up the function's entire environment from a template
        explanation:
          text: Building a setup from a template is CloudFormation's job. The SDK makes calls from inside running code.
    correct_answers: [finds-role-credentials, retries-brief-failures]
    explanation:
      text: |
        An SDK handles the fiddly parts of each call: it signs the request, finds temporary
        credentials from the role the code runs with and renews them, and retries brief failures.
        This is how "give the code a role, not an access key" works in practice. IAM still checks
        every request, and services charge the same as for any other door.

  - id: q08-template-knows-end-state
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "Infrastructure as code describes the end result in a file"
    task: "3.1"
    level: understanding
    topics: [infrastructure-as-code, aws-cli, cloudformation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team keeps a script of AWS CLI commands that builds its test network. A colleague suggests
        replacing it with an AWS CloudFormation template. What does the template capture that the
        script doesn't?
    choices:
      - id: click-order
        text: The order in which a person clicked through the console
        variants:
          - text: The sequence of console clicks someone made
          - text: Each console click, in the order it was made
        explanation:
          text: Neither file records clicks. A template describes resources, and CloudFormation works out the order itself.
      - id: end-result
        text: The resources and settings that should exist at the end
        variants:
          - text: What should exist when the build is done, with its settings
          - text: The finished setup, as the resources and settings it should have
        explanation:
          text: Correct. A script says how, step by step. A template says what should exist, so CloudFormation can build it and later compare the result with the file.
      - id: user-credentials
        text: The credentials of the person who will run the build
        variants:
          - text: The access details of whoever runs the build
          - text: The sign-in credentials of the person building it
        explanation:
          text: Credentials don't belong in either file. Secrets go in Secrets Manager or Parameter Store, and whoever runs the build signs in as themselves.
      - id: monthly-cost
        text: The exact monthly cost of every resource in the network
        variants:
          - text: What each resource in the network will cost per month
          - text: A precise monthly price for each resource it creates
        explanation:
          text: A template describes resources and their settings. Costs come from the services' prices and from how the resources are used.
    correct_answers: [end-result]
    explanation:
      text: |
        A script lists steps; run it again and it tries every step again, which can fail because a
        resource exists or quietly make a duplicate. A template describes the end result, so
        CloudFormation works out the order, builds what is missing and can later report where the
        real resources differ from the file.

  - id: q08-repeatable-jobs-for-iac
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "One-time or repeatable: the question that picks the way in"
    task: "3.1"
    level: application
    topics: [ways-in, infrastructure-as-code]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A software company lists five jobs for its AWS accounts. Which TWO are repeatable processes
        that suit infrastructure as code best? (Select TWO.)
    choices:
      - id: per-customer-environment
        text: Create the same set of resources for each new customer, identically
        variants:
          - text: Build an identical set of resources for every new customer
          - text: Set up matching resources, the same each time, for each new customer
        explanation:
          text: Correct. The job repeats and every copy must match, so one template should build them all.
      - id: check-invoice
        text: Check the amount on last month's AWS invoice once
        variants:
          - text: Look once at the total on last month's AWS bill
          - text: Read last month's AWS invoice a single time
        explanation:
          text: A single look by a person is a one-time operation. The console suits it.
      - id: save-upload
        text: Save each customer's uploaded file to S3 as it arrives
        variants:
          - text: Store every customer upload in S3 the moment it arrives
          - text: Put each file a customer uploads into S3 as it comes in
        explanation:
          text: This repeats constantly, but a program does it while it runs. That makes it an SDK job, not a template.
      - id: rebuild-in-region
        text: Rebuild the production setup, unchanged, in a second Region
        variants:
          - text: Build the production setup again, identical, in another Region
          - text: Recreate production exactly as it is in a second Region
        explanation:
          text: Correct. Copies must match exactly, which is the job infrastructure as code exists for.
      - id: whoami
        text: Confirm which identity you're signed in as before a change
        variants:
          - text: Check which identity is signed in before making a change
          - text: Verify your signed-in identity before you change something
        explanation:
          text: One quick question, answered once by one command or a glance at the console. Nothing needs to be repeated exactly.
    correct_answers: [per-customer-environment, rebuild-in-region]
    hint:
      text: Look for whole setups that will be built more than once and must match.
    explanation:
      text: |
        Exam task 3.1 asks you to tell a one-time operation from a repeatable process. When a whole
        setup will be built again, or copies must match exactly, write it down as a template. A
        program's own calls belong in an SDK, and single looks belong in the console or one command.

  - id: q08-person-or-program
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "One-time or repeatable: the question that picks the way in"
    task: "3.1"
    level: understanding
    topics: [ways-in, aws-cli, aws-sdk]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Two teams both want to put objects into an Amazon S3 bucket. One will use the AWS CLI and
        the other an AWS SDK. Which question best decides between those two ways in?
    choices:
      - id: which-region
        text: Which AWS Region holds the bucket
        variants:
          - text: The Region in which the bucket lives
          - text: Which Region the bucket was created in
        explanation:
          text: Both the CLI and the SDKs work in every Region. The Region doesn't separate them.
      - id: read-or-write
        text: Whether the work reads data or writes it
        variants:
          - text: Whether the task reads objects or writes them
          - text: If the job is reading data or writing it
        explanation:
          text: Both can read and write. Neither is limited to one kind of action.
      - id: person-or-program
        text: Whether a person runs it or a program does
        variants:
          - text: Whether it's done by a person or by a program
          - text: If a person or a running program does the work
        explanation:
          text: Correct. A person typing or scripting commands uses the CLI; a program that calls AWS while it runs uses an SDK.
      - id: free-or-paid
        text: Whether the account is on a free or paid plan
        variants:
          - text: Whether the account uses the Free plan or a Paid plan
          - text: If the account is on the Free plan or a Paid one
        explanation:
          text: Neither tool has its own charge, and both work on either plan. You pay only for what they create or use.
    correct_answers: [person-or-program]
    explanation:
      text: |
        The first of the three questions that pick a way in is "Who does it: a person, or a program
        while it runs?" A program means an SDK. A person working in a terminal, or a script that a
        person writes, means the CLI.

  - id: q08-customer-side-every-door
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "Your side of the line"
    task: "3.1"
    level: understanding
    topics: [shared-responsibility, ways-in, credentials]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Under the AWS shared responsibility model, which of these is the customer's job, whichever
        way into AWS its people and programs use?
    choices:
      - id: run-console-servers
        text: Running the servers behind the AWS Management Console
        variants:
          - text: Operating the machines that serve the console's web pages
          - text: Keeping the console's own servers running
        explanation:
          text: AWS runs the console and the services behind it.
      - id: maintain-cli
        text: Maintaining the AWS CLI's source code and fixing its bugs
        variants:
          - text: Writing fixes for bugs in the AWS CLI's source code
          - text: Keeping the AWS CLI's code up to date and bug-free
        explanation:
          text: AWS maintains the CLI and the SDKs. The customer chooses to install updates, but doesn't write them.
      - id: patch-cloudshell
        text: Patching the computers that AWS CloudShell runs on
        variants:
          - text: Applying updates to the machines behind CloudShell
          - text: Keeping CloudShell's underlying computers patched
        explanation:
          text: AWS runs CloudShell's computers. The customer only uses the shell.
      - id: who-may-do-what
        text: Deciding who has which permissions and credentials
        variants:
          - text: Choosing identities, their permissions and credentials
          - text: Setting who may do what, and with which credentials
        explanation:
          text: Correct. Identities, MFA, permissions and the credentials that programs and commands use are the customer's, and they apply through every door.
    correct_answers: [who-may-do-what]
    explanation:
      text: |
        AWS runs the console, the services behind it and CloudShell's computers, and maintains the
        CLI and the SDKs. Who may do what is the customer's side: identities and their MFA,
        permissions, and temporary credentials through roles, CloudShell or `aws login` rather than
        access keys left in code. A permission left open in the console is just as open in the CLI.

  - id: q08-cli-bucket-same-defaults
    page: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    section: "Part B: the AWS CLI in CloudShell (follow-along)"
    task: "3.1"
    level: understanding
    topics: [aws-cli, amazon-s3]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An engineer creates an S3 bucket with a single AWS CLI command that names only the bucket
        and the Region. A reviewer worries that the bucket lacks the protections a console-made
        bucket gets. What does the engineer find when she reads back the bucket's settings?
    choices:
      - id: same-defaults
        text: Block Public Access is on and SSE-S3 encrypts it, as in the console
        variants:
          - text: It's private and encrypted with SSE-S3, like a console bucket
          - text: The console's defaults apply, private and SSE-S3 encrypted
        explanation:
          text: Correct. S3 applies its protections to every new bucket, so the CLI bucket matches the console one.
      - id: public-until-blocked
        text: The bucket is public until Block Public Access is turned on
        variants:
          - text: Block Public Access is off, so the bucket starts out public
          - text: The bucket begins public, because nothing blocks public access
        explanation:
          text: S3 turns on all four Block Public Access settings for every new bucket, whatever tool creates it.
      - id: unencrypted
        text: The bucket is private but stores objects without any encryption
        variants:
          - text: It blocks public access but leaves objects unencrypted
          - text: Public access is blocked, yet nothing is encrypted at rest
        explanation:
          text: New buckets encrypt objects with SSE-S3 by default. The read-back in Lab 10 shows `AES256`.
      - id: only-cfn-defaults
        text: Defaults apply only to buckets built from CloudFormation templates
        variants:
          - text: Only template-built buckets receive the default protections
          - text: S3 adds its defaults only when CloudFormation creates the bucket
        explanation:
          text: The defaults come from S3, not from the tool. Every way in sends the same `CreateBucket` request.
    correct_answers: [same-defaults]
    explanation:
      text: |
        All four ways in end in the same request to the service, so the service's defaults apply
        whichever tool sends it. In Lab 10, the CLI bucket shows four Block Public Access settings
        set to true and SSE-S3 encryption, though the command never asked for them. What differs
        between the tools is what you must remember and what is written down afterwards.

  - id: q08-what-each-way-leaves
    page: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    section: "Recap"
    task: "3.1"
    level: understanding
    topics: [ways-in, infrastructure-as-code]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A trainee creates the same private bucket three times: in the console, with AWS CLI
        commands, and from a CloudFormation template. Which statement correctly compares what each
        way leaves behind?
    choices:
      - id: console-leaves-file
        text: The console saves a file of the choices, which can rebuild the bucket
        variants:
          - text: The console keeps the choices in a file that rebuilds the bucket
          - text: Console work is saved as a file that can recreate the bucket
        explanation:
          text: The console keeps only the result. The choices live in the trainee's memory or notes.
      - id: template-file-and-stack
        text: The template leaves a file to rebuild it and a stack to delete it
        variants:
          - text: The template leaves a rebuildable file and a one-step delete
          - text: From the template come a file that rebuilds it and a stack that removes it
        explanation:
          text: Correct. The same file builds the bucket again anywhere, and deleting the stack removes what it made.
      - id: cli-end-state
        text: The CLI commands record the end state and compare it later
        variants:
          - text: The commands describe the end state and check it later
          - text: The CLI keeps the end state and checks it against reality
        explanation:
          text: Commands are steps. Saved as a script, they can be run again, but they don't describe or check an end state.
      - id: all-same-record
        text: "All three leave the same thing behind: the bucket alone"
        variants:
          - text: Each way leaves nothing but the bucket itself
          - text: "The three ways leave identical results: only the bucket"
        explanation:
          text: The bucket is the same, but what remains differs. The CLI leaves commands you could save, and the template leaves a file and a stack.
    correct_answers: [template-file-and-stack]
    explanation:
      text: |
        All three ways made the same private, encrypted bucket. The difference is what remains: the
        console leaves only memory, the CLI leaves commands that could be saved as a script, and the
        template leaves a file that rebuilds the bucket plus a stack that deletes it in one step.

  - id: q08-weekly-test-copy-template
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "Worked example: six jobs at the bakery"
    task: "3.1"
    level: application
    topics: [ways-in, infrastructure-as-code]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A game studio needs a full test environment (a network, servers and a database) every
        Monday, removed every Friday, with each week's copy identical to the last and nothing left
        running afterwards. Which approach fits best?
    choices:
      - id: console-checklist
        text: Build it in the console each Monday from a checklist, and delete it by hand Friday
        variants:
          - text: Follow a checklist in the console Mondays, then remove each part by hand Fridays
          - text: Click it together from a checklist each Monday and tear it down by hand Friday
        explanation:
          text: A checklist helps, but each manual pass can miss or mistype a step, and Friday's clean-up depends on finding everything by hand.
      - id: sdk-in-game
        text: Add AWS SDK calls to the game that build it Monday and remove it Friday
        variants:
          - text: Have the game's own code create it Mondays and delete it Fridays through an SDK
          - text: Put SDK calls in the game to set it up each Monday and take it down Friday
        explanation:
          text: An SDK is for a program that uses AWS as part of its work. Building a test environment isn't the game's job.
      - id: cfn-on-schedule
        text: "One CloudFormation template: a stack built Monday, deleted Friday"
        variants:
          - text: A stack from one CloudFormation template, made Monday, deleted Friday
          - text: Create a CloudFormation stack Mondays and delete it Fridays
        explanation:
          text: Correct. The same template builds the same environment each week, and deleting the stack removes everything it made.
      - id: one-instance-copy
        text: Launch one server's AMI into the default VPC Monday and terminate it Friday
        variants:
          - text: Start a server from one AMI in the default VPC Mondays, ending it Fridays
          - text: Each Monday launch one server's AMI in the default VPC; terminate it Friday
        explanation:
          text: An AMI rebuilds one server, not a network and a database. It leaves the rest of the environment to be built, and removed, by hand.
    correct_answers: [cfn-on-schedule]
    hint:
      text: The job repeats, copies must match, and the clean-up must be complete.
    explanation:
      text: |
        A whole setup that is built again and again, identically, is a job for infrastructure as
        code. A template guarantees each week's copy matches, and because a stack is deleted as a
        unit, Friday's clean-up removes everything Monday made, so nothing forgotten keeps billing.

  # ---------------------------------------------------------------------------------------------
  # Lesson 08.02, IaC and automation
  # ---------------------------------------------------------------------------------------------

  - id: q08-launch-vs-cfn-template
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A template describes what should exist, not the steps to build it"
    task: "3.1"
    level: understanding
    topics: [cloudformation, launch-templates]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team uses an EC2 launch template with its Auto Scaling group, and is now writing an AWS
        CloudFormation template for its whole application. How do the two kinds of template differ?
    choices:
      - id: launch-one-cfn-many
        text: A launch template describes one instance; a CloudFormation template, a whole set of resources
        variants:
          - text: One instance's settings go in a launch template; a set of resources goes in a CloudFormation one
          - text: A launch template covers one EC2 instance, a CloudFormation template many resources
        explanation:
          text: Correct. Auto Scaling uses a launch template to start identical instances. A CloudFormation template describes a whole setup, and can itself contain a launch template.
      - id: same-thing
        text: They are two names for the same file, used by different AWS services
        variants:
          - text: Both are the same kind of file, just named differently by each service
          - text: The two are one file type that two services call by different names
        explanation:
          text: They describe different things. A launch template is one EC2 instance's recipe; a CloudFormation template can describe a network, servers, buckets and more.
      - id: launch-whole-cfn-one
        text: A launch template builds a whole network; a CloudFormation template builds one server
        variants:
          - text: Launch templates create whole networks, while CloudFormation templates create one server
          - text: A whole network comes from a launch template, a single server from a CloudFormation one
        explanation:
          text: This swaps them. The launch template is the narrow one, a recipe for one instance.
      - id: cfn-cannot-contain
        text: A CloudFormation template can't include anything about EC2 instances
        variants:
          - text: EC2 instances can't be described in a CloudFormation template
          - text: CloudFormation templates have no way to describe EC2 instances
        explanation:
          text: CloudFormation templates describe EC2 instances, and can contain a launch template for an Auto Scaling group.
    correct_answers: [launch-one-cfn-many]
    explanation:
      text: |
        Both are recipes, at different sizes. A launch template holds the AMI, instance type and
        other settings of one EC2 instance, so Auto Scaling can launch identical copies. A
        CloudFormation template describes a whole set of resources, which CloudFormation builds and
        manages as a stack.

  - id: q08-hardcoded-zone-other-region
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A template describes what should exist, not the steps to build it"
    task: "3.1"
    level: application
    topics: [cloudformation, availability-zones]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A CloudFormation template written in Europe (Ireland) names the subnet's Availability Zone
        as `eu-west-1b`. When the team creates a stack from it in Europe (Frankfurt), creating the
        subnet fails. What change lets the same template work in any Region?
    choices:
      - id: stackset-instead
        text: Deploy the unchanged template through a StackSet instead of a stack
        variants:
          - text: Use a StackSet rather than a stack, keeping the template as it is
          - text: Leave the template alone and create it as a StackSet
        explanation:
          text: A StackSet deploys a template to many accounts and Regions, but the template still asks for a zone that exists only in Ireland.
      - id: copy-zone-to-frankfurt
        text: Ask AWS to make the zone `eu-west-1b` available in Frankfurt
        variants:
          - text: Request that the `eu-west-1b` zone be added to Frankfurt
          - text: Have AWS extend the zone `eu-west-1b` into Frankfurt
        explanation:
          text: An Availability Zone belongs to one Region. The fix is in the template, not in AWS.
      - id: drift-detection
        text: Run drift detection on the Ireland stack before building Frankfurt
        variants:
          - text: Check the Ireland stack for drift, then create the Frankfurt one
          - text: Detect drift in Ireland first, then build the Frankfurt stack
        explanation:
          text: Drift detection compares a stack with its template. It doesn't change which zone the template asks for.
      - id: look-up-zones
        text: Have the template look up the zones of the Region it's built in
        variants:
          - text: Make the template ask for the zones of the Region it runs in
          - text: Let the template find the zones of its own Region at build time
        explanation:
          text: Correct. A lookup such as `!GetAZs` returns the zones of the stack's own Region, so no zone name is hard-coded.
    correct_answers: [look-up-zones]
    hint:
      text: Where does `eu-west-1b` exist, and what should the template ask for instead of a fixed name?
    explanation:
      text: |
        Availability Zone names belong to one Region, so a template that hard-codes one fails
        elsewhere. Asking for the zones of whatever Region the stack is built in, with `!GetAZs` and
        `!Select`, lets one file build the same setup in any Region.

  - id: q08-parameter-one-template-two-uses
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A template describes what should exist, not the steps to build it"
    task: "3.1"
    level: application
    topics: [cloudformation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team wants one CloudFormation template to build both its production environment and a
        smaller test copy. The two differ only in an environment name and an instance size. What
        should the template use?
    choices:
      - id: two-templates
        text: Two copies of the template, each edited by hand for its use
        variants:
          - text: A second copy of the file, changed by hand for testing
          - text: Separate template files, one edited for each environment
        explanation:
          text: Two hand-edited copies drift apart over time, which is what one template is meant to prevent.
      - id: change-set
        text: A change set that switches the template between the two uses
        variants:
          - text: A change set that flips the template from one use to the other
          - text: A change set to toggle the template between its two uses
        explanation:
          text: A change set previews an update to an existing stack. It doesn't let one template serve two uses.
      - id: parameters
        text: Parameters whose values are given when each stack is created
        variants:
          - text: Parameters, with values supplied as each stack is created
          - text: Parameters that take their values at stack creation
        explanation:
          text: Correct. A parameter asks for a value, such as `prod` or `test`, when a stack is created, so one file fits several uses.
      - id: drift
        text: Drift detection that adjusts the test copy after it's built
        variants:
          - text: Drift detection that changes the test copy once it exists
          - text: Drift detection that alters the test copy after creation
        explanation:
          text: Drift detection only reports differences between resources and their template; it never changes anything.
    correct_answers: [parameters]
    hint:
      text: Think about how a template can ask for a value at the moment a stack is created.
    explanation:
      text: |
        A parameter is a value the template asks for when you create a stack, with an optional
        default. The bakery's template asks for `EnvName`, with `prod` as the default, so a test copy
        can say `test` from the same file. One reviewed file serves every environment.

  - id: q08-failed-create-rolls-back
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A stack is the unit you create, change and delete"
    task: "3.1"
    level: recall
    topics: [cloudformation, rollback]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A new CloudFormation stack describes ten resources. CloudFormation builds six of them, then
        the seventh fails. What does CloudFormation do by default?
    choices:
      - id: rolls-back
        text: It rolls back, deleting the six resources it had already made
        variants:
          - text: It undoes the attempt and deletes the six resources it built
          - text: It rolls the stack back, removing the six finished resources
        explanation:
          text: Correct. Creation is all or nothing by default, so you aren't left with half a setup.
      - id: keeps-six
        text: It keeps the six resources and waits for the seventh to be fixed
        variants:
          - text: It leaves the six in place until the seventh is repaired
          - text: It holds on to the six built ones while the seventh is fixed
        explanation:
          text: That would leave half a setup running and billing. By default CloudFormation deletes what it created.
      - id: retries-forever
        text: It keeps retrying the seventh resource until it succeeds
        variants:
          - text: It retries the failed resource again and again until it works
          - text: It tries the seventh resource repeatedly until it's created
        explanation:
          text: A failed create ends in a rollback. You read the stack's events for the reason, fix the template and try again.
      - id: marks-drifted
        text: It marks the six resources as drifted and leaves them running
        variants:
          - text: It labels the six built resources as drifted and keeps them
          - text: It flags the six resources as drifted but leaves them in place
        explanation:
          text: Drift means a resource was changed after the stack built it, usually by hand. A failed create is handled by rolling back.
    correct_answers: [rolls-back]
    explanation:
      text: |
        A stack is created all or nothing. If creation fails partway, CloudFormation rolls back by
        deleting the resources it created, and a failed update rolls back to the last working state.
        In Lab 10 you see a failed create as a `CREATE_FAILED` line on the stack's Events tab.

  - id: q08-delete-leftovers-cost
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A stack is the unit you create, change and delete"
    task: "3.1"
    level: understanding
    topics: [cloudformation, stacks]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company deletes a CloudFormation stack, and the delete completes. Which TWO can still
        leave something behind that keeps costing money? (Select TWO.)
    choices:
      - id: retain-policy
        text: A resource whose deletion policy is set to `Retain`
        variants:
          - text: Any resource the template marks with a `Retain` deletion policy
          - text: A resource kept by a `Retain` deletion policy
        explanation:
          text: Correct. A retained resource survives the delete and keeps costing until you remove it yourself.
      - id: empty-bucket
        text: An empty S3 bucket with no special deletion policy
        variants:
          - text: An S3 bucket with no objects and no deletion policy
          - text: An S3 bucket that holds nothing and has no special policy
        explanation:
          text: An empty bucket with no policy is deleted with its stack.
      - id: vpc-subnets
        text: The VPC and subnets the stack created with no special policy
        variants:
          - text: The stack's own VPC and subnets, with no deletion policy
          - text: A VPC and its subnets that the stack made, with no special policy
        explanation:
          text: Without a deletion policy, deleting a stack deletes its resources, network included.
      - id: security-group
        text: A security group the stack created with no special policy
        variants:
          - text: The stack's security group, with no deletion policy set
          - text: A security group made by the stack, with no special policy
        explanation:
          text: It is deleted with the stack like the other resources.
      - id: rds-final-snapshot
        text: The final snapshot of an RDS database in the stack
        variants:
          - text: The last snapshot RDS keeps of the stack's database
          - text: A final snapshot taken of the stack's RDS database
        explanation:
          text: Correct. By default an RDS database keeps a final snapshot when its stack is deleted, and the snapshot costs until you delete it.
    correct_answers: [retain-policy, rds-final-snapshot]
    explanation:
      text: |
        Deleting a stack deletes everything in it, so nothing forgotten keeps running, with
        qualifiers. A resource set to `Retain` is kept, and an RDS database keeps a final snapshot by
        default; both cost money until you remove them. A bucket that still holds objects makes the
        delete fail until you empty it.

  - id: q08-preview-db-replacement
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Change sets preview a change; drift detection finds changes made by hand"
    task: "3.1"
    level: application
    topics: [cloudformation, change-sets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team is about to edit a property of the production database in its CloudFormation
        template. Before anything happens, it wants to see whether CloudFormation would modify the
        database in place or replace it with a new one. What should the team use?
    choices:
      - id: drift-detection
        text: Drift detection on the production stack
        variants:
          - text: A drift check of the production stack
          - text: Detecting drift on the stack in production
        explanation:
          text: Drift detection finds changes made by hand since the stack was built. It says nothing about what a planned update would do.
      - id: stackset
        text: A StackSet that holds the database's stack
        variants:
          - text: A StackSet containing the database stack
          - text: Putting the database stack into a StackSet
        explanation:
          text: A StackSet deploys one template across accounts and Regions. It doesn't preview an update.
      - id: rollback
        text: A rollback of the stack's last update
        variants:
          - text: Rolling back the stack's most recent update
          - text: Undoing the previous update with a rollback
        explanation:
          text: A rollback undoes a failed operation. It doesn't show what a future change would do.
      - id: change-set
        text: A change set for the edited template
        variants:
          - text: A change set built from the new template
          - text: Creating a change set for the updated file
        explanation:
          text: Correct. A change set lists what the update would add, change, replace or remove, before anything runs.
    correct_answers: [change-set]
    hint:
      text: Look for the feature that previews an update.
    explanation:
      text: |
        Some changes make CloudFormation build a new resource and delete the old one, which for a
        database means losing data that wasn't backed up. A change set shows that "replace" before
        anything happens, so the team can stop and plan, then run the change set when it's ready.

  - id: q08-change-set-no-guarantee
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Change sets preview a change; drift detection finds changes made by hand"
    task: "3.1"
    level: recall
    topics: [cloudformation, change-sets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement about a CloudFormation change set is correct?
    choices:
      - id: applies-itself
        text: Creating it applies the update at once and rolls back on failure
        variants:
          - text: It applies the update as soon as it's created, rolling back if needed
          - text: The update runs the moment it's made, with a rollback on failure
        explanation:
          text: A change set is a preview. Nothing changes until you choose to run it.
      - id: preview-not-promise
        text: It previews the changes, but doesn't promise the update will succeed
        variants:
          - text: It shows what would change, without guaranteeing the update works
          - text: It lists the changes ahead, but can't promise the update succeeds
        explanation:
          text: Correct. It shows what would be added, changed, replaced or removed, but it doesn't check, for example, your permissions or quotas.
      - id: checks-permissions
        text: It confirms in advance that your permissions and quotas allow the update
        variants:
          - text: It checks ahead of time that permissions and quotas are enough
          - text: It verifies beforehand that your permissions and quotas will allow it
        explanation:
          text: A change set doesn't check permissions or quotas, so an update can still fail after a clean preview.
      - id: lists-hand-changes
        text: It lists the changes people made by hand since the stack was built
        variants:
          - text: It reports the manual changes made since the stack was created
          - text: It shows what people changed by hand after the stack was built
        explanation:
          text: That is drift detection. A change set is about a planned update, not past changes.
    correct_answers: [preview-not-promise]
    explanation:
      text: |
        A change set is a preview of an update: what it would add, change, replace or remove. Its
        value is catching a replacement before it happens. It isn't a test run, so an update can
        still fail on something the preview doesn't check, such as permissions or quotas.

  - id: q08-find-hand-made-change
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Change sets preview a change; drift detection finds changes made by hand"
    task: "3.1"
    level: recall
    topics: [cloudformation, drift]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A CloudFormation stack built a company's database and its backup settings. An auditor
        suspects someone later changed the backup retention in the console. Which CloudFormation
        feature lists the stack's resources that no longer match the template?
    choices:
      - id: drift-detection
        text: Drift detection
        variants:
          - text: Stack drift detection
          - text: Detecting drift
        explanation:
          text: Correct. Drift detection compares each supported resource with the template and reports it as in sync, modified or deleted.
      - id: change-set
        text: A change set
        variants:
          - text: Creating a change set
          - text: A stack change set
        explanation:
          text: A change set previews an update you plan to make. It doesn't look for changes someone already made.
      - id: rollback
        text: A stack rollback
        variants:
          - text: Rolling back the stack
          - text: A rollback of the stack
        explanation:
          text: A rollback undoes a failed stack operation. It doesn't compare resources with the template.
      - id: stackset
        text: A StackSet
        variants:
          - text: Creating a StackSet
          - text: A stack set
        explanation:
          text: A StackSet deploys one template across accounts and Regions. It doesn't report hand-made changes.
    correct_answers: [drift-detection]
    hint:
      text: The change was made outside CloudFormation, after the stack was built.
    explanation:
      text: |
        Drift is a difference between a stack's resources as they are and as the template
        describes them, usually from a change made by hand. Drift detection reports each resource as
        in sync, modified or deleted. It reports only; the team then changes the resource back or
        puts the change into the template.

  - id: q08-hand-rule-missing-in-copy
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Change sets preview a change; drift detection finds changes made by hand"
    task: "3.1"
    level: understanding
    topics: [cloudformation, drift, disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics company's network comes from a CloudFormation template. An engineer adds an
        inbound rule for a partner's IP range to a security group in the console, and never updates
        the template. Months later, the company builds a stack from the template in a second Region.
        What is true of the second Region?
    choices:
      - id: rule-copied
        text: Its security group includes the partner rule, copied from the first Region
        variants:
          - text: The partner rule is copied over from the first Region's group
          - text: CloudFormation brings the partner rule across from the first Region
        explanation:
          text: The new stack is built only from the template. A change made by hand exists only where it was made.
      - id: stack-fails
        text: Creating the stack fails until the first Region's drift is fixed
        variants:
          - text: The new stack can't be created while the first Region has drift
          - text: CloudFormation blocks the new stack until the drift is resolved
        explanation:
          text: Drift in one stack doesn't stop another stack being created from the template.
      - id: rule-missing
        text: Its security group lacks the partner rule, as the template does
        variants:
          - text: The partner rule is missing there, since the template never had it
          - text: There is no partner rule, because it was never put in the template
        explanation:
          text: Correct. The copy matches the template, not the hand-changed original, so the partner's traffic will be blocked there.
      - id: rule-deleted-both
        text: CloudFormation removes the partner rule in both Regions to match
        variants:
          - text: The partner rule is deleted from both Regions to keep them alike
          - text: CloudFormation strips the partner rule out of both Regions
        explanation:
          text: CloudFormation doesn't touch the first Region's stack when it builds a new one, and drift detection never changes resources.
    correct_answers: [rule-missing]
    hint:
      text: What is the second stack built from?
    explanation:
      text: |
        A stack is built from its template, so anything changed by hand and never put in the
        template is missing from every copy built later; it shows up only as drift. That's why
        changes belong in the template, reviewed and kept in version control, and why console clicks
        on template-managed resources cause trouble.

  - id: q08-template-brings-no-data
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "One template, many Regions and accounts, but not the data"
    task: "3.1"
    level: understanding
    topics: [cloudformation, disaster-recovery, backup]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A retailer plans to recover from a Regional disaster by building its whole setup in a
        second Region from its CloudFormation template. Which TWO must already be copied to the
        second Region, because the template won't bring them? (Select TWO.)
    choices:
      - id: vpc-subnets
        text: The VPC, its subnets and route tables
        variants:
          - text: The VPC with its subnets and route tables
          - text: The network, its subnets and its routes
        explanation:
          text: The template rebuilds the network. That's what infrastructure as code is for.
      - id: database-data
        text: The order records stored in the database
        variants:
          - text: The orders held in the database
          - text: The database's stored order records
        explanation:
          text: Correct. The template builds an empty database. The records come from backups or replication already in the second Region.
      - id: bucket-objects
        text: The product photos stored in the S3 bucket
        variants:
          - text: The product images kept in the S3 bucket
          - text: The S3 bucket's stored product photos
        explanation:
          text: Correct. The template builds an empty bucket. The objects need S3 Replication or a backup copy.
      - id: security-rules
        text: The security groups and their rules
        variants:
          - text: The security groups with their rules
          - text: Each security group and its rules
        explanation:
          text: Security groups are resources in the template, so they are rebuilt.
      - id: function-settings
        text: The Lambda function's settings
        variants:
          - text: The settings of the Lambda function
          - text: The Lambda function's configuration
        explanation:
          text: The function's settings and code location are in the template, so the function is rebuilt.
    correct_answers: [database-data, bucket-objects]
    hint:
      text: A template describes resources. What lives inside them?
    explanation:
      text: |
        A template rebuilds resources, not what's in them. The second Region gets an empty database
        and an empty bucket, set up the same way. The data must already be there, from backups or
        replication, which is why a backup-and-restore plan needs both the template and copies of
        the data.

  - id: q08-baseline-many-accounts
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "One template, many Regions and accounts, but not the data"
    task: "3.1"
    level: recall
    topics: [cloudformation, stacksets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An organization with 40 AWS accounts wants the same standard setup in every account, in
        three Regions, created and later updated together from one CloudFormation template. Which
        CloudFormation feature fits?
    choices:
      - id: change-sets
        text: A change set in each account and Region
        variants:
          - text: Separate change sets for every account and Region
          - text: One change set per account and Region
        explanation:
          text: A change set previews an update to one stack. It doesn't create or manage stacks across accounts.
      - id: drift-detection
        text: Drift detection run across the accounts
        variants:
          - text: Drift detection across the 40 accounts
          - text: Running drift detection in the 40 accounts
        explanation:
          text: Drift detection reports hand-made changes. It creates nothing.
      - id: parameters
        text: A parameter that lists the 40 account numbers
        variants:
          - text: A template parameter naming the 40 accounts
          - text: One parameter holding the account numbers
        explanation:
          text: A parameter supplies a value to one stack. It doesn't deploy the template to other accounts.
      - id: stackset
        text: A StackSet that targets the accounts and Regions
        variants:
          - text: A StackSet aimed at the accounts and Regions
          - text: One StackSet covering the accounts and Regions
        explanation:
          text: Correct. A StackSet creates and updates stacks from one template across several accounts and Regions together.
    correct_answers: [stackset]
    explanation:
      text: |
        For one Region, the same template simply builds another stack. For many accounts and Regions
        at once, a StackSet creates and updates the stacks from one template together, which
        organizations with many accounts use for their standard setup.

  - id: q08-automation-benefits-recovery
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Automation makes work repeatable and cheaper"
    task: "1.4"
    level: understanding
    topics: [automation, cloud-economics]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A finance director asks what the company gains by moving its infrastructure into
        CloudFormation templates kept in version control. Which TWO are benefits of that
        automation? (Select TWO.)
    choices:
      - id: fixed-bill
        text: The monthly AWS bill becomes the same every month
        variants:
          - text: Each month's AWS bill becomes a fixed amount
          - text: AWS charges become identical from month to month
        explanation:
          text: You still pay for what you use. Automation can lower the bill, for example by removing idle copies, but it doesn't make it fixed.
      - id: no-patching
        text: Servers built from templates stop needing patches
        variants:
          - text: Template-built servers no longer need updates
          - text: Servers made from templates are exempt from patching
        explanation:
          text: How a server was created doesn't change its operating system's need for patches. Patching is still the customer's job.
      - id: bug-free-code
        text: The application's code is checked for bugs by the template
        variants:
          - text: The template finds bugs in the application's code
          - text: Templates check the application code for errors
        explanation:
          text: A template describes infrastructure. Testing code is the job of a build and test step, such as CodeBuild.
      - id: faster-recovery
        text: After a failure, the infrastructure can be rebuilt in one step
        variants:
          - text: Lost infrastructure can be rebuilt in a single step
          - text: Recovery rebuilds the infrastructure in one step
        explanation:
          text: Correct. The template rebuilds the resources in one step, so downtime and lost business shrink. The data still comes back from backups; a template doesn't carry it.
      - id: change-record
        text: Each change to the setup is recorded with who made it
        variants:
          - text: Every change is kept, with who made it and when
          - text: A record shows who changed the setup, and when
        explanation:
          text: Correct. Version control keeps every change with its author and time, so reviews catch errors before production.
    correct_answers: [faster-recovery, change-record]
    explanation:
      text: |
        Exam task 1.4 asks for the benefits of automation. A template gives fewer mistakes, faster
        copies, consistent environments, clean deletion, paying only while resources are needed,
        faster recovery and, through version control, a record of every change. It doesn't make
        resources cheaper, fixed-price or maintenance-free.

  - id: q08-where-savings-come-from
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Automation makes work repeatable and cheaper"
    task: "1.4"
    level: understanding
    topics: [automation, cloud-economics]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager says the company's switch to CloudFormation will lower costs "because AWS charges
        less for resources a template creates". Which statement corrects her?
    choices:
      - id: savings-from-work
        text: Prices are the same; savings come from less work, fewer slips and no idle leftovers
        variants:
          - text: Resources cost the same; the saving is staff time, fewer errors and nothing left idle
          - text: Prices don't change; savings come from less effort, fewer mistakes and no forgotten resources
        explanation:
          text: Correct. A resource costs the same however it's made; automation saves on effort per copy, on mistakes and on resources nobody needs.
      - id: discount-true
        text: She is right; template-built resources get a discount from AWS
        variants:
          - text: That's correct, since AWS discounts resources made by templates
          - text: She's right, because CloudFormation resources are billed at a lower rate
        explanation:
          text: There's no such discount. You pay for the resources CloudFormation creates as if you had made them by hand.
      - id: always-more
        text: Automation costs more, because templates take longer than clicks
        variants:
          - text: Templates raise costs, since writing them is slower than clicking
          - text: Automating costs more overall, as templates take longer than the console
        explanation:
          text: One template costs more than one manual build, but it's cheaper from a few copies on.
      - id: big-only
        text: Automation saves money for very large companies alone
        variants:
          - text: Very large companies are the ones that save by automating
          - text: The savings from automation apply to very large firms alone
        explanation:
          text: "A small business also repeats its setup: a test copy, a second Region, a rebuild after a mistake."
    correct_answers: [savings-from-work]
    explanation:
      text: |
        CloudFormation has no extra charge for AWS's own resource types, and the resources cost
        what they would cost if made by hand. The savings come from cutting staff time per copy,
        avoiding costly mistakes, and deleting copies when nobody needs them, so you pay for hours
        used, not hours idle.

  - id: q08-one-throwaway-copy
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Automation makes work repeatable and cheaper"
    task: "1.4"
    level: application
    topics: [automation, cloud-economics]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A researcher needs a single small server for one afternoon's experiment, then will delete it
        and never build it again. Building it by hand takes 20 minutes; writing and testing a
        template would take most of a day. What is the most cost-effective choice?
    choices:
      - id: console-once
        text: Build it in the console, because one throwaway copy won't repay a template
        variants:
          - text: Use the console, since this single copy won't repay the template's cost
          - text: Click it together, because writing a template won't pay back for this copy
        explanation:
          text: Correct. For a resource made once and thrown away, the console is cheaper; the template's writing time is never repaid.
      - id: template-always
        text: Write the template, because automation costs less than clicking
        variants:
          - text: Write a template, since automation is the cheaper route
          - text: Use a template, because it costs less than the console
        explanation:
          text: A template pays back only when work repeats. For this one copy, writing it costs more than it saves.
      - id: template-discount
        text: Write the template, because AWS charges less for what it builds
        variants:
          - text: Use a template, since its resources are billed at a lower rate
          - text: Write a template, because AWS discounts template-built servers
        explanation:
          text: AWS charges the same for a resource however it's created.
      - id: stackset
        text: Use a StackSet, because it removes the effort of writing a template
        variants:
          - text: Create a StackSet, since it needs no template to be written
          - text: Choose a StackSet, because it skips writing a template
        explanation:
          text: A StackSet still needs a template; it deploys one across accounts and Regions.
    correct_answers: [console-once]
    hint:
      text: Count the copies honestly, then compare the effort.
    explanation:
      text: |
        Writing a good template takes skill and time, so for one copy it costs more than clicking.
        It pays back when work repeats: a test copy, a second Region, a rebuild after a mistake. The
        honest question is how many copies there will be.

  - id: q08-researchers-approved-setups
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Service Catalog lets others launch only what you've approved"
    task: "3.1"
    level: application
    topics: [service-catalog, least-privilege]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's cloud team wants researchers to start pre-approved lab environments with
        small instance sizes and required tags already set, whenever they need them, without giving
        the researchers permission to create resources directly. Which AWS service fits best?
    choices:
      - id: stacksets
        text: AWS CloudFormation StackSets
        variants:
          - text: CloudFormation StackSets
          - text: StackSets in AWS CloudFormation
        explanation:
          text: StackSets deploy a template across accounts and Regions for administrators. They don't let other users launch approved setups within limits.
      - id: marketplace
        text: AWS Marketplace
        variants:
          - text: The AWS Marketplace
          - text: Marketplace, from AWS
        explanation:
          text: AWS Marketplace sells third-party software. It doesn't hold your own approved setups.
      - id: service-catalog
        text: AWS Service Catalog
        variants:
          - text: The AWS Service Catalog
          - text: Service Catalog, from AWS
        explanation:
          text: Correct. Administrators publish approved products in a portfolio, and users launch them within constraints, through a launch role.
      - id: config
        text: AWS Config
        variants:
          - text: The AWS Config service
          - text: Config, from AWS
        explanation:
          text: AWS Config records how resources are configured. It doesn't let users launch anything.
    correct_answers: [service-catalog]
    hint:
      text: The key words are "pre-approved", "whenever they need" and "without permission to create resources".
    explanation:
      text: |
        AWS Service Catalog lets administrators publish approved templates as products, grouped in
        portfolios, with constraints such as allowed instance sizes. Users launch only those, as
        often as they need, and a launch constraint's role does the building, so they need no direct
        permissions on the underlying services.

  - id: q08-launch-constraint-role
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Service Catalog lets others launch only what you've approved"
    task: "3.1"
    level: recall
    topics: [service-catalog, iam]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer launches an approved AWS Service Catalog product that creates a VPC, a database
        and security groups, yet her own IAM permissions don't allow her to create any of them. What
        makes this work?
    choices:
      - id: launch-constraint
        text: A launch constraint names an IAM role that builds the product
        variants:
          - text: A launch constraint's IAM role builds the product for her
          - text: The product is built by an IAM role set in a launch constraint
        explanation:
          text: Correct. The role in the launch constraint has the permissions, so the user needs none on the underlying services.
      - id: portfolio-admin
        text: Being granted a portfolio gives her administrator access
        variants:
          - text: Access to a portfolio makes her an administrator
          - text: A granted portfolio turns her into an account administrator
        explanation:
          text: A portfolio grants the right to launch its products, not broad permissions. Giving her administrator access would defeat the purpose.
      - id: template-constraint
        text: A template constraint lifts IAM checks for the product
        variants:
          - text: A template constraint switches off IAM checks for it
          - text: IAM checks are lifted by the product's template constraint
        explanation:
          text: A template constraint narrows a user's choices, such as instance types. Nothing switches off IAM.
      - id: shared-key
        text: The product uses an administrator's access key stored with it
        variants:
          - text: An administrator's access key is kept with the product
          - text: The product carries an administrator's stored access key
        explanation:
          text: Storing someone's long-term access key would be a serious security mistake. Service Catalog uses a role instead.
    correct_answers: [launch-constraint]
    explanation:
      text: |
        In Service Catalog, a launch constraint names an IAM role that builds the product when a
        user launches it. The user needs permission to launch the product, not to create its
        resources, which keeps least privilege while giving self-service.

  - id: q08-cfn-vs-service-catalog
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Service Catalog lets others launch only what you've approved"
    task: "3.1"
    level: understanding
    topics: [service-catalog, cloudformation]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO statements correctly compare AWS CloudFormation and AWS Service Catalog?
        (Select TWO.)
    choices:
      - id: product-is-template
        text: A Service Catalog product can be defined by a CloudFormation template
        variants:
          - text: A CloudFormation template can define a Service Catalog product
          - text: Service Catalog products can come from CloudFormation templates
        explanation:
          text: Correct. A product is an approved setup defined by a CloudFormation template (Terraform is supported too), and launching it creates a stack.
      - id: sc-sells-software
        text: Service Catalog sells third-party software to AWS customers
        variants:
          - text: Third-party software is sold to customers through Service Catalog
          - text: Service Catalog is where AWS customers buy third-party software
        explanation:
          text: That is AWS Marketplace. Service Catalog holds your own approved products.
      - id: cfn-decides-who
        text: CloudFormation decides which users may launch which templates
        variants:
          - text: CloudFormation controls which users can launch each template
          - text: Which templates each user may launch is set in CloudFormation
        explanation:
          text: That's Service Catalog's job. CloudFormation is the engine that builds stacks.
      - id: cfn-needs-permissions
        text: With CloudFormation alone, the stack's creator needs the resources' permissions
        variants:
          - text: Using only CloudFormation, whoever creates the stack needs the resource permissions
          - text: CloudFormation alone requires its stack creator to hold the resources' permissions
        explanation:
          text: Correct. Without Service Catalog's launch role, the person creating a stack needs permissions for every resource in it.
      - id: sc-replaces-cfn
        text: Service Catalog builds stacks without using CloudFormation
        variants:
          - text: Service Catalog creates stacks with no CloudFormation involved
          - text: Stacks are built by Service Catalog instead of CloudFormation
        explanation:
          text: Both paths end in a CloudFormation stack. Service Catalog decides who may launch it and within which limits.
    correct_answers: [product-is-template, cfn-needs-permissions]
    explanation:
      text: |
        CloudFormation is the engine that builds and manages resources from templates; Service
        Catalog is the shop front with rules, deciding who may launch which approved templates
        within which limits. Choose CloudFormation to build things the same way every time, and add
        Service Catalog when other people must launch them without wider permissions.

  - id: q08-ref-parameter-reusable
    page: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    section: "Part C: a template you finish (completion)"
    task: "3.1"
    level: understanding
    topics: [cloudformation, amazon-s3]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In a bucket template, the bucket's name is set with `!Ref BucketName`, where `BucketName`
        is a parameter, rather than typed into the file. Why does that matter?
    choices:
      - id: faster-build
        text: It makes CloudFormation create the bucket faster
        variants:
          - text: It speeds up how quickly the bucket is created
          - text: CloudFormation builds the bucket more quickly with it
        explanation:
          text: How the name is supplied doesn't change how fast the bucket is built.
      - id: makes-private
        text: It keeps the bucket private by blocking public access
        variants:
          - text: It turns on Block Public Access for the bucket
          - text: It stops the bucket from being made public
        explanation:
          text: Public access is blocked by S3's defaults and, in the lab, by the `PublicAccessBlockConfiguration` lines, not by the name.
      - id: no-unique-name
        text: It removes the need for a globally unique bucket name
        variants:
          - text: The bucket no longer needs a name unique across AWS
          - text: It lets the bucket skip the global uniqueness rule
        explanation:
          text: The name must still be unique. The parameter lets you give a different unique name each time.
      - id: reusable-file
        text: The same file can build a bucket of any name, anywhere
        variants:
          - text: One file can build buckets of other names in any Region
          - text: It builds buckets of any name, in any Region or account
        explanation:
          text: Correct. The name comes in at stack creation, so the file needs no edits for each new copy.
    correct_answers: [reusable-file]
    explanation:
      text: |
        `!Ref` followed by a parameter's name inserts the value given when the stack is created.
        Because a bucket name must be unique across AWS, a hard-coded name would let the file build
        only one bucket ever. With a parameter, the same reviewed file builds a bucket with any
        name, in any Region or account.

  - id: q08-stack-delete-fails-bucket
    page: guide/08-building-and-operating/05-lab-10-same-bucket-three-ways.md
    section: "Clean up"
    task: "3.1"
    level: application
    topics: [cloudformation, amazon-s3, stacks]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team deletes a CloudFormation stack that holds one S3 bucket. The stack shows
        `DELETE_FAILED` on the bucket, which a colleague had used to store a few test files. The
        team wants the stack and everything it made gone. What should it do?
    choices:
      - id: change-set
        text: Create a change set that removes the bucket from the template
        variants:
          - text: Make a change set that drops the bucket from the template
          - text: Build a change set taking the bucket out of the template
        explanation:
          text: The bucket still holds objects, and that's what stops the delete. Changing the template doesn't empty it.
      - id: empty-then-delete
        text: Empty the bucket, then delete the stack again
        variants:
          - text: Remove the bucket's objects, then retry the stack delete
          - text: Clear out the bucket and delete the stack once more
        explanation:
          text: Correct. CloudFormation deletes only empty buckets. Once the objects are gone, the stack delete succeeds.
      - id: drift-detection
        text: Run drift detection, then delete the stack again
        variants:
          - text: Detect drift on the stack, then retry the delete
          - text: Check the stack for drift and delete it once more
        explanation:
          text: Drift detection reports hand-made changes to settings. It neither explains nor fixes a bucket that holds objects.
      - id: retain-policy
        text: Add a `Retain` deletion policy so the delete goes through
        variants:
          - text: Set a `Retain` deletion policy on the bucket, then delete
          - text: Give the bucket a `Retain` policy so the stack can be deleted
        explanation:
          text: Keeping the bucket, whether by a `Retain` policy or by choosing to retain it when retrying the delete, lets the stack go but leaves the bucket and its files behind, still costing money. The goal is to remove everything.
    correct_answers: [empty-then-delete]
    hint:
      text: Ask what CloudFormation needs to be true of a bucket before it can delete it.
    explanation:
      text: |
        An S3 bucket must be empty before CloudFormation can delete it. If something was uploaded,
        the stack's delete fails on that bucket until you empty it. Then deleting the stack again
        removes the bucket and everything else the stack made.

  # ---------------------------------------------------------------------------------------------
  # Lesson 08.03, Watching workloads
  # ---------------------------------------------------------------------------------------------

  - id: q08-lambda-errors-no-setup
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch metrics show how each part is doing, as numbers over time"
    task: "2.2"
    level: recall
    topics: [cloudwatch, metrics, aws-lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ticketing company wants to graph how many runs of its AWS Lambda booking function end in
        an error. What must it set up so that the error count reaches Amazon CloudWatch?
    choices:
      - id: install-agent
        text: Install the CloudWatch agent inside the function
        variants:
          - text: Add the CloudWatch agent to the function's code
          - text: Put the CloudWatch agent into the function
        explanation:
          text: The agent is software for EC2 instances and servers on premises, to collect measurements from inside an operating system. Lambda needs no agent for its own metrics.
      - id: create-trail
        text: Create a CloudTrail trail that sends to CloudWatch
        variants:
          - text: Set up a CloudTrail trail delivering to CloudWatch
          - text: Make a CloudTrail trail that feeds CloudWatch
        explanation:
          text: CloudTrail records actions on the account, such as a change to the function's settings. It doesn't count failed runs.
      - id: nothing
        text: Nothing, because Lambda sends it on its own
        variants:
          - text: Nothing; Lambda reports the error count by itself
          - text: No setup, since Lambda sends the count automatically
        explanation:
          text: Correct. Lambda sends `Invocations`, `Errors`, `Duration` and `Throttles` to CloudWatch at no charge.
      - id: enable-xray
        text: Turn on AWS X-Ray tracing for the function
        variants:
          - text: Enable X-Ray tracing on the function
          - text: Switch on AWS X-Ray for the function
        explanation:
          text: X-Ray traces individual requests. The error count is a metric that Lambda already sends to CloudWatch.
    correct_answers: [nothing]
    explanation:
      text: |
        Many AWS services send metrics to CloudWatch on their own, at no charge. A Lambda function
        reports how many times it ran (`Invocations`), how many runs ended in an error (`Errors`),
        how long runs took (`Duration`) and how many were refused (`Throttles`). Custom metrics and
        the agent are for measurements AWS can't see by itself.

  - id: q08-cloudwatch-agent-collects
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch metrics show how each part is doing, as numbers over time"
    task: "2.2"
    level: recall
    topics: [cloudwatch, cloudwatch-agent]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company installs the Amazon CloudWatch agent on its EC2 instances and on servers in its
        own data center. Which TWO kinds of data can the agent send to CloudWatch? (Select TWO.)
    choices:
      - id: memory-used
        text: Memory use measured inside the operating system
        variants:
          - text: How much memory is used, from inside the OS
          - text: Memory used, as seen from within the operating system
        explanation:
          text: Correct. The agent collects measurements from inside the operating system, such as memory used, which EC2 can't see from outside.
      - id: log-files
        text: Log files written on the servers
        variants:
          - text: The servers' own log files
          - text: Log files that the servers write
        explanation:
          text: Correct. The agent sends log files from EC2 instances and on-premises servers into CloudWatch Logs.
      - id: api-calls
        text: Records of the API calls made in the account
        variants:
          - text: A record of each API call made in the account
          - text: Logs of every API call in the AWS account
        explanation:
          text: Recording API calls on the account is CloudTrail's job.
      - id: monthly-bill
        text: The account's billing figures for the month
        variants:
          - text: The month's billing totals for the account
          - text: Monthly billing data for the AWS account
        explanation:
          text: Billing data comes from AWS's billing systems, not from software on a server.
      - id: health-events
        text: AWS's own service health events for the Region
        variants:
          - text: AWS service health events in the Region
          - text: The Region's AWS service health notices
        explanation:
          text: Problems on AWS's side are reported by the AWS Health Dashboard.
    correct_answers: [memory-used, log-files]
    explanation:
      text: |
        The CloudWatch agent is software you install on EC2 instances or your own servers. It
        collects measurements from inside the operating system, such as memory used, and sends log
        files into CloudWatch Logs. Its metrics are billed as custom metrics.

  - id: q08-alarms-are-regional
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch metrics show how each part is doing, as numbers over time"
    task: "2.2"
    level: understanding
    topics: [cloudwatch, alarms, regions]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company has an alarm on its order function's `Errors` metric in US East (N. Virginia). It
        rebuilds the function in US East (Ohio) from a template that contains no alarms. What
        happens when the Ohio function starts failing?
    choices:
      - id: nv-alarm-fires
        text: The N. Virginia alarm fires, because it watches every copy of the function
        variants:
          - text: The existing alarm fires, since it covers the function in both Regions
          - text: The N. Virginia alarm catches it, as it watches all copies of the function
        explanation:
          text: The alarm watches one metric in its own Region. The Ohio function's metric lives in Ohio.
      - id: no-alarm
        text: No alarm fires, because metrics and alarms belong to one Region
        variants:
          - text: Nothing alerts, since each metric and alarm lives in one Region
          - text: No alarm reacts, because alarms and metrics are Regional
        explanation:
          text: Correct. Ohio needs its own alarm and topic, best put in the same template as the rest.
      - id: copied-automatically
        text: CloudWatch copies the alarm to Ohio when the function appears there
        variants:
          - text: The alarm is copied to Ohio automatically once the function exists
          - text: CloudWatch adds a matching alarm in Ohio for the new function
        explanation:
          text: CloudWatch doesn't copy alarms between Regions. Only what's in the template, or made by hand, exists in Ohio.
      - id: cloudtrail-alerts
        text: CloudTrail sends the alert instead, because no alarm exists
        variants:
          - text: CloudTrail alerts in its place, since there's no alarm
          - text: Without an alarm, CloudTrail sends the warning
        explanation:
          text: CloudTrail records actions on the account. It doesn't watch a function's errors or send alerts on its own.
    correct_answers: [no-alarm]
    hint:
      text: Think about where a metric lives.
    explanation:
      text: |
        A metric lives in the Region where it was created, and an alarm watches one metric. A copy
        of the setup in another Region needs its own alarms and topics. Putting them in the same
        template as everything else means every copy watches itself.

  - id: q08-one-notification-per-change
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "An alarm watches one metric and acts when its state changes"
    task: "2.2"
    level: understanding
    topics: [cloudwatch, alarms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A CloudWatch alarm with a 5-minute period and an action that notifies an Amazon SNS topic
        goes into ALARM at 14:00. The metric stays above the threshold for six periods in a row,
        then falls below it. How many "in alarm" notifications does the topic receive?
    choices:
      - id: one
        text: One
        variants:
          - text: "1"
          - text: Just one
        explanation:
          text: Correct. The action runs when the state changes from OK to ALARM, not for each breaching period.
      - id: six
        text: Six
        variants:
          - text: "6"
          - text: Six of them
        explanation:
          text: That would be one per breaching period. Alarm actions run on a change of state.
      - id: thirty
        text: Thirty
        variants:
          - text: "30"
          - text: Thirty of them
        explanation:
          text: That would be one a minute. Only an Auto Scaling action repeats while the alarm stays in its state.
      - id: zero
        text: None
        variants:
          - text: "0"
          - text: Not one
        explanation:
          text: The change from OK to ALARM triggers the action, so the topic does receive one notification.
    correct_answers: [one]
    explanation:
      text: |
        An alarm acts when its state changes, not on every period that breaches, so a long spell in
        ALARM produces one notification. A second notification can come when it returns to OK, if
        an action is set for that state. The exception is an Auto Scaling action, which repeats every
        minute the alarm stays in its new state.

  - id: q08-alarm-direct-actions
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "An alarm watches one metric and acts when its state changes"
    task: "2.2"
    level: recall
    topics: [cloudwatch, alarms]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO can a CloudWatch alarm's actions do directly when its state changes?
        (Select TWO.)
    choices:
      - id: ses-email
        text: Send a designed email to customers through Amazon SES
        variants:
          - text: Email customers a designed message through Amazon SES
          - text: Use Amazon SES to send customers a designed email
        explanation:
          text: Alarms notify an SNS topic, not SES. Mail to customers from your own domain is sent by your code through SES.
      - id: codebuild
        text: Start a build of the application's code in AWS CodeBuild
        variants:
          - text: Begin an AWS CodeBuild build of the application code
          - text: Run an AWS CodeBuild build of the application's code
        explanation:
          text: Starting builds isn't one of an alarm's actions. Builds are started by a pipeline or by a person.
      - id: notify-sns
        text: Notify an Amazon SNS topic, which tells its subscribers
        variants:
          - text: Send a message to an Amazon SNS topic for its subscribers
          - text: Publish to an Amazon SNS topic that informs its subscribers
        explanation:
          text: Correct. This is how an alarm emails a person, through a topic with a confirmed email subscription.
      - id: data-events
        text: Turn on CloudTrail data events for the account
        variants:
          - text: Switch on CloudTrail data events in the account
          - text: Enable CloudTrail data events for the whole account
        explanation:
          text: Data events are a trail setting you choose, not something an alarm switches on.
      - id: scale-asg
        text: Scale an Auto Scaling group out or in
        variants:
          - text: Add or remove instances in an Auto Scaling group
          - text: Change the size of an Auto Scaling group
        explanation:
          text: Correct. Scaling an Auto Scaling group is an alarm action, and it repeats each minute the alarm stays in its state.
    correct_answers: [notify-sns, scale-asg]
    explanation:
      text: |
        A CloudWatch alarm can notify an SNS topic; stop, terminate, reboot or recover an EC2
        instance; scale an Auto Scaling group; or open an item in AWS Systems Manager. Email to a
        person goes through the SNS topic, not through SES.

  - id: q08-ok-state-means
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "\"OK\" means below the threshold, not \"working\""
    task: "2.2"
    level: understanding
    topics: [cloudwatch, alarms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A shop owner opens the CloudWatch console and sees her new payment-errors alarm in the OK
        state. What does that state tell her?
    choices:
      - id: email-works
        text: That an email will reach her when the alarm fires
        variants:
          - text: That she'll be emailed when the alarm goes off
          - text: That the alarm's email to her is known to work
        explanation:
          text: CloudWatch doesn't test or validate actions. The email depends on an SNS topic and a confirmed subscription.
      - id: below-threshold
        text: That the metric is below the threshold now
        variants:
          - text: That the metric is under the threshold right now
          - text: That the metric is beneath the threshold at present
        explanation:
          text: Correct. OK is a reading of the metric against the line she set, nothing more.
      - id: no-errors-ever
        text: That the payment code has never raised an error
        variants:
          - text: That no payment error has ever happened
          - text: That the payment code has had no errors at all
        explanation:
          text: Errors below the threshold leave the alarm in OK, and so can a period before any errors occurred.
      - id: action-tested
        text: That CloudWatch has tested the alarm's action
        variants:
          - text: That CloudWatch checked the alarm's action works
          - text: That the alarm's action was tested by CloudWatch
        explanation:
          text: CloudWatch doesn't test the actions you set. Only a real or test message proves the delivery path.
    correct_answers: [below-threshold]
    explanation:
      text: |
        OK means the metric is below the threshold; it's a reading, not a health check. Whether she
        is told when the alarm fires depends on the action: the SNS topic must exist and her email
        subscription must be confirmed. Publishing a test message to the topic proves the path.

  - id: q08-metric-filter-log-string
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch Logs keeps what your code writes, and lets you search it"
    task: "2.2"
    level: application
    topics: [cloudwatch-logs, metric-filters, alarms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A hotel booking application writes the line `ROOM_UNAVAILABLE` to CloudWatch Logs each time
        a guest tries to book a full room. No metric counts these lines. The manager wants an email
        when more than 20 happen in an hour. What should be added?
    choices:
      - id: data-events
        text: CloudTrail data events for the application's log group
        variants:
          - text: CloudTrail data events on the log group
          - text: Data events in CloudTrail for the log group
        explanation:
          text: CloudTrail records actions on the account. It doesn't count lines that the application writes.
      - id: xray-sampling
        text: An AWS X-Ray sampling rule for booking requests
        variants:
          - text: A sampling rule in AWS X-Ray for bookings
          - text: An X-Ray rule that samples booking requests
        explanation:
          text: X-Ray traces some requests to show where time went. It doesn't count log lines or send email.
      - id: dashboard
        text: A CloudWatch dashboard showing the log group
        variants:
          - text: A dashboard in CloudWatch for the log group
          - text: A CloudWatch dashboard that displays the logs
        explanation:
          text: A dashboard shows data to whoever looks at it. It sends nothing.
      - id: metric-filter-alarm
        text: A metric filter on the log group, then an alarm on its metric
        variants:
          - text: A metric filter on the logs, with an alarm on the new metric
          - text: An alarm on a metric made by a metric filter on the logs
        explanation:
          text: Correct. The filter turns matching lines into a count, and the alarm watches the count and notifies an SNS topic.
    correct_answers: [metric-filter-alarm]
    hint:
      text: An alarm needs a metric. How can log lines become one?
    explanation:
      text: |
        Logs say what happened in words; metrics say how much in numbers. A metric filter turns
        matching log lines into a metric, and an alarm can then watch that metric and notify an SNS
        topic that emails the manager.

  - id: q08-search-past-log-lines
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch Logs keeps what your code writes, and lets you search it"
    task: "2.2"
    level: application
    topics: [cloudwatch-logs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer needs to see every line containing `TimeoutError` that her Lambda function wrote
        to its log group over the last two days. Which tool fits?
    choices:
      - id: logs-insights
        text: A CloudWatch Logs Insights query on the log group
        variants:
          - text: A query in CloudWatch Logs Insights on the log group
          - text: Querying the log group with CloudWatch Logs Insights
        explanation:
          text: Correct. Logs Insights searches and summarizes log data with queries.
      - id: event-history
        text: A search of CloudTrail Event history for the function
        variants:
          - text: Searching CloudTrail Event history for the function
          - text: The function's entries in CloudTrail Event history
        explanation:
          text: Event history holds actions on the account, such as a change to the function's settings, not lines the code wrote.
      - id: trace-map
        text: The X-Ray trace map for the function's requests
        variants:
          - text: An X-Ray trace map of the function's requests
          - text: The function's request trace map in X-Ray
        explanation:
          text: A trace map draws which parts call each other. It doesn't list the lines a function wrote.
      - id: errors-alarm
        text: A CloudWatch alarm on the function's `Errors` metric
        variants:
          - text: An alarm in CloudWatch on the function's `Errors`
          - text: A CloudWatch alarm watching the `Errors` metric
        explanation:
          text: An alarm watches a count against a threshold. It doesn't show the lines behind the count.
    correct_answers: [logs-insights]
    explanation:
      text: |
        CloudWatch Logs stores what code, servers and AWS services write, in log groups. CloudWatch
        Logs Insights searches and summarizes that data with queries, such as every line containing
        an error in a time range. Deletions and setting changes, by contrast, are account actions
        that CloudTrail records.

  - id: q08-trace-slow-checkout
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "X-Ray follows one request through every part it touches"
    task: "3.8"
    level: application
    topics: [x-ray, tracing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A travel site's checkout calls a pricing service, a seat service and an outside payment
        provider. A few checkouts take eight seconds. The team wants to see, for one slow checkout,
        how long each of those calls took. Which AWS service should it use?
    choices:
      - id: cloudtrail
        text: AWS CloudTrail
        variants:
          - text: The AWS CloudTrail service
          - text: CloudTrail
        explanation:
          text: CloudTrail records actions on the account, not how long an application's calls take.
      - id: eventbridge
        text: Amazon EventBridge
        variants:
          - text: The Amazon EventBridge service
          - text: EventBridge
        explanation:
          text: EventBridge routes events between parts of an application. It doesn't time requests.
      - id: xray
        text: AWS X-Ray
        variants:
          - text: The AWS X-Ray service
          - text: X-Ray
        explanation:
          text: Correct. A trace breaks one request into its calls with their timings, so the slow part stands out.
      - id: config
        text: AWS Config
        variants:
          - text: The AWS Config service
          - text: Config
        explanation:
          text: AWS Config records how resources are configured over time. It knows nothing about a request's timings.
    correct_answers: [xray]
    hint:
      text: The question is about one request's path through several parts.
    explanation:
      text: |
        AWS X-Ray records traced requests: every part a request touched, including calls to
        databases, other services and outside APIs, with how long each took. AWS now shows traces in
        the CloudWatch console (as of 2026-10-24), but on the exam "request tracing" still means
        X-Ray.

  - id: q08-trace-adds-to-metric
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "X-Ray follows one request through every part it touches"
    task: "3.8"
    level: understanding
    topics: [x-ray, tracing, metrics]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        CloudWatch shows that an order function's average `Duration` has doubled this week. What can
        an X-Ray trace add that the metric can't?
    choices:
      - id: who-changed
        text: Which IAM user changed the function's settings this week
        variants:
          - text: The IAM user who altered the function's settings this week
          - text: Who in IAM edited the function's configuration this week
        explanation:
          text: Who changed a setting is an account action, recorded by CloudTrail.
      - id: more-often
        text: The same average, measured every minute instead of every five
        variants:
          - text: The same average, sampled each minute rather than every five
          - text: An identical average, but reported at one-minute intervals
        explanation:
          text: That describes more frequent metrics. A trace is a different kind of record, about single requests.
      - id: aws-outage
        text: Whether AWS itself has a problem in the Region this week
        variants:
          - text: Whether AWS is having trouble in the Region this week
          - text: If the Region has had an AWS-side problem this week
        explanation:
          text: Problems on AWS's side are reported by the AWS Health Dashboard.
      - id: which-call-slow
        text: Which call inside one slow request took the time
        variants:
          - text: Where the time went among one slow request's calls
          - text: The call that used the time within one slow request
        explanation:
          text: Correct. The metric says the function got slower as a whole; a trace splits one request into its calls with timings.
    correct_answers: [which-call-slow]
    explanation:
      text: |
        Metrics say the function got slow; a trace shows which part of one request was slow. That
        turns "checkout is slow" into "the payment call takes two seconds", which tells the team
        whom to call or what to fix.

  - id: q08-who-disabled-versioning
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudTrail records actions on your account, not how your application runs"
    task: "2.2"
    level: application
    topics: [cloudtrail]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Last Tuesday, someone suspended versioning on a company's main S3 bucket. The security lead
        wants to know which identity did it, and from where. Where should she look first?
    choices:
      - id: event-history
        text: CloudTrail Event history for that day
        variants:
          - text: That day's events in CloudTrail Event history
          - text: The CloudTrail Event history for Tuesday
        explanation:
          text: Correct. Changing a bucket setting is a management event, kept for 90 days in Event history with who, what, when and from where.
      - id: flow-logs
        text: The VPC Flow Logs for the company's VPC
        variants:
          - text: Flow Logs recorded for the company's VPC
          - text: The Flow Logs of the company's main VPC
        explanation:
          text: Flow Logs record information about network traffic in a VPC. A setting change on a bucket is an API call, not a traffic record.
      - id: bucket-metrics
        text: The bucket's metrics in CloudWatch
        variants:
          - text: CloudWatch metrics for the bucket
          - text: The bucket's metrics shown in CloudWatch
        explanation:
          text: Metrics are numbers about how resources run. They don't say who changed a setting.
      - id: trace-map
        text: The X-Ray trace map for the account
        variants:
          - text: The account's trace map in X-Ray
          - text: An X-Ray trace map of the account
        explanation:
          text: X-Ray traces application requests. It doesn't record changes to the account's resources.
    correct_answers: [event-history]
    explanation:
      text: |
        CloudTrail records each action on the account, by a person, a role or an AWS service,
        through any way in. Each event says who acted, what they did, to which resource, when and
        from where. Event history is on from the start and keeps 90 days of management events per
        Region at no charge.

  - id: q08-keep-activity-years
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudTrail records actions on your account, not how your application runs"
    task: "2.2"
    level: application
    topics: [cloudtrail, retention]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A regulator requires a company to keep a record of every change made to its AWS resources
        for seven years. What should the company set up?
    choices:
      - id: event-history
        text: Nothing, because CloudTrail Event history keeps events indefinitely
        variants:
          - text: Nothing new, since Event history keeps events without limit
          - text: No setup, as CloudTrail Event history never drops events
        explanation:
          text: Event history keeps 90 days of management events. Anything older is gone unless a trail kept it.
      - id: xray-retention
        text: AWS X-Ray, with its traces kept for seven years
        variants:
          - text: X-Ray, keeping each trace for seven years
          - text: AWS X-Ray traces, held for seven years
        explanation:
          text: X-Ray traces application requests, not changes to resources, and keeps them for 30 days.
      - id: function-logs
        text: A seven-year retention period on the application's log groups
        variants:
          - text: Log groups for the application, kept for seven years
          - text: Seven-year retention set on the application's log groups
        explanation:
          text: Application log groups hold what code writes, not the account's management actions.
      - id: trail-to-s3
        text: A CloudTrail trail delivering events to an S3 bucket it keeps
        variants:
          - text: A trail in CloudTrail sending events to a kept S3 bucket
          - text: A CloudTrail trail that stores events in a retained S3 bucket
        explanation:
          text: Correct. A trail delivers events to an S3 bucket, where they stay as long as the company keeps them.
    correct_answers: [trail-to-s3]
    hint:
      text: How long does the record that's on by default last?
    explanation:
      text: |
        CloudTrail Event history keeps only 90 days of management events. A trail delivers events to
        an S3 bucket you choose, so they can be kept as long as rules require; one trail's copy of
        management events is free, and you pay for the S3 storage. The trail must exist before the
        events happen.

  - id: q08-object-reads-data-events
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudTrail records actions on your account, not how your application runs"
    task: "2.2"
    level: recall
    topics: [cloudtrail, data-events]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's trail records management events. Its security team now also wants a record of
        each time someone reads an object in a sensitive S3 bucket. What must it do?
    choices:
      - id: already-recorded
        text: Nothing, because management events already include object reads
        variants:
          - text: Nothing more, since reads are already management events
          - text: No change, as object reads are already part of management events
        explanation:
          text: Management events cover creating, changing and deleting resources and settings. Reading an object is an action on data.
      - id: detailed-monitoring
        text: Turn on CloudWatch detailed monitoring for the bucket
        variants:
          - text: Enable detailed monitoring in CloudWatch for the bucket
          - text: Switch on CloudWatch detailed monitoring on the bucket
        explanation:
          text: Detailed monitoring sends EC2's metrics every minute. It doesn't say who read which object.
      - id: turn-on-data-events
        text: Turn on CloudTrail data events for the bucket in the trail
        variants:
          - text: Enable CloudTrail data events for the bucket in its trail
          - text: Switch on CloudTrail data events for the bucket in the trail
        explanation:
          text: Correct. Actions on data, such as reading objects, are data events. You turn them on in a trail and pay for them.
      - id: xray-bucket
        text: Turn on AWS X-Ray tracing for the bucket
        variants:
          - text: Enable X-Ray tracing on the bucket
          - text: Switch on AWS X-Ray for the bucket
        explanation:
          text: X-Ray traces an application's requests. It isn't a record of who read objects in the account.
    correct_answers: [turn-on-data-events]
    explanation:
      text: |
        CloudTrail separates management events, which create, change or delete resources and
        settings, from data events, which are actions on data such as reading objects in a bucket.
        Management events are recorded by default; data events are turned on in a trail and are
        charged.

  - id: q08-cloudtrail-not-app-errors
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "\"CloudTrail monitors my application\" is wrong"
    task: "2.2"
    level: understanding
    topics: [cloudtrail, cloudwatch]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A colleague says, "We already have CloudTrail turned on, so it will warn us when our order
        function starts throwing errors." Which statement is correct?
    choices:
      - id: right-cloudtrail
        text: She is right; CloudTrail records and alerts on application errors
        variants:
          - text: That's right, since CloudTrail logs and alerts on errors in code
          - text: Correct; CloudTrail tracks the function's errors and warns on them
        explanation:
          text: This is the misconception. CloudTrail doesn't see what happens inside the function.
      - id: right-both
        text: She is right; CloudTrail and CloudWatch do the same monitoring job
        variants:
          - text: That's true, since CloudTrail and CloudWatch watch the same things
          - text: Correct; either CloudTrail or CloudWatch will cover it
        explanation:
          text: The two answer different questions. Their names and their records sound alike, which is why the pair is confused.
      - id: wrong-cloudwatch
        text: She is wrong; CloudTrail records account actions, CloudWatch the app's errors
        variants:
          - text: That's wrong, since CloudTrail logs account actions and CloudWatch the errors
          - text: Not so; account actions go to CloudTrail, the function's errors to CloudWatch
        explanation:
          text: Correct. A function's failed runs show in its CloudWatch `Errors` metric, and an alarm on it sends the warning.
      - id: wrong-xray
        text: She is wrong; only X-Ray can detect a function's errors
        variants:
          - text: That's wrong, because X-Ray alone detects function errors
          - text: Not so; only AWS X-Ray can see a function's errors
        explanation:
          text: Lambda sends its `Errors` metric to CloudWatch without X-Ray. X-Ray shows where time went in single requests.
    correct_answers: [wrong-cloudwatch]
    explanation:
      text: |
        CloudTrail records actions on the account, such as someone changing the function's memory
        setting. It doesn't see a customer's order fail inside the function, or a server's CPU at
        6 p.m.; CloudWatch does. Who did it is CloudTrail; how it is running is CloudWatch.

  - id: q08-match-question-to-service
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "Pick the service by the question it must answer"
    task: "2.2"
    level: application
    topics: [cloudtrail, cloudwatch, x-ray]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        After a rough weekend, a web shop's support lead matches each of her open questions to the
        AWS service that should answer it. Which TWO of her matches are right? (Select TWO.)
    choices:
      - id: slow-order-logs-insights
        text: Where order 77 spent its eight seconds, with CloudWatch Logs Insights
        variants:
          - text: CloudWatch Logs Insights, for where order 77's eight seconds went
          - text: Which call slowed order 77 to eight seconds, from Logs Insights
        explanation:
          text: One request's path through several parts, with each call's timing, is a trace, which X-Ray records.
      - id: failures-cloudtrail
        text: How many times the function failed last hour, with AWS CloudTrail
        variants:
          - text: AWS CloudTrail, for how often the function failed last hour
          - text: The function's failures in the past hour, counted by CloudTrail
        explanation:
          text: Failed runs are counted in the function's `Errors` metric in CloudWatch. CloudTrail records actions on the account.
      - id: who-stopped-cloudtrail
        text: Who stopped the database server on Sunday, with AWS CloudTrail
        variants:
          - text: AWS CloudTrail, for who stopped the database server on Sunday
          - text: Which identity stopped the database server Sunday, from CloudTrail
        explanation:
          text: Correct. Stopping a server is an action on the account, recorded as a CloudTrail event.
      - id: policy-xray
        text: Who changed the bucket policy, and when, with AWS X-Ray
        variants:
          - text: AWS X-Ray, for who edited the bucket policy and when
          - text: When and by whom the bucket policy changed, from X-Ray
        explanation:
          text: A policy change is an action on the account, so CloudTrail has it. X-Ray traces application requests.
      - id: error-lines-logs-insights
        text: Which error lines checkout wrote on Sunday, with CloudWatch Logs Insights
        variants:
          - text: CloudWatch Logs Insights, for the error lines checkout wrote Sunday
          - text: Sunday's error lines from the checkout code, found with Logs Insights
        explanation:
          text: Correct. Lines the code wrote are in its CloudWatch Logs log group, and Logs Insights searches them.
    correct_answers: [who-stopped-cloudtrail, error-lines-logs-insights]
    hint:
      text: Underline the verb in each question, and ask whether it's about the account, one request or how things run.
    explanation:
      text: |
        Start from the question. Who did something to the account is CloudTrail; where one request
        spent its time is X-Ray; how things are running, with metrics, alerts and the lines code
        writes to its logs, is CloudWatch.

  - id: q08-is-it-aws-health
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "Pick the service by the question it must answer"
    task: "2.2"
    level: application
    topics: [aws-health, monitoring]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Errors suddenly rise across all of a company's applications in one Region at the same
        time, though nobody has changed anything. The team wants to know whether the problem is on
        AWS's side. Where should it look?
    choices:
      - id: event-history
        text: CloudTrail Event history
        variants:
          - text: The CloudTrail Event history
          - text: Event history in CloudTrail
        explanation:
          text: Event history shows actions taken on the account. It would confirm that nobody changed anything, but not whether AWS has a problem.
      - id: health-dashboard
        text: The AWS Health Dashboard
        variants:
          - text: AWS Health Dashboard
          - text: The Health Dashboard from AWS
        explanation:
          text: Correct. The Health Dashboard reports problems on AWS's side that affect your account.
      - id: trace-map
        text: An X-Ray trace map
        variants:
          - text: The X-Ray trace map
          - text: A trace map in X-Ray
        explanation:
          text: A trace map shows your application's parts and slow links. It isn't AWS's report of its own problems.
      - id: logs-insights
        text: CloudWatch Logs Insights
        variants:
          - text: A CloudWatch Logs Insights query
          - text: Logs Insights in CloudWatch
        explanation:
          text: Logs Insights searches what your code wrote. It doesn't report the state of AWS's services.
    correct_answers: [health-dashboard]
    explanation:
      text: |
        "Is it us, or is AWS having trouble?" is a question about AWS's side, which the AWS Health
        Dashboard answers. CloudWatch, X-Ray and CloudTrail all look at your own workload and
        account.

  - id: q08-quiet-night-missing-data
    page: guide/08-building-and-operating/06-lab-11-alarm-on-errors.md
    section: "Part B: build the alert from the owner's request (challenge)"
    task: "2.2"
    level: application
    topics: [cloudwatch, alarms, missing-data]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A florist's order function runs only when someone orders. Overnight, nobody does, and its
        errors alarm, left with the default setting for missing data, drifts out of the OK state.
        The owner wants the alarm to treat a quiet night as good news. What should be changed?
    choices:
      - id: threshold-zero
        text: Lower the alarm's threshold to zero errors
        variants:
          - text: Set the threshold to zero errors
          - text: Change the threshold to 0 errors
        explanation:
          text: A threshold of zero would make every period with data breach. It doesn't change how periods with no data count.
      - id: missing-not-breaching
        text: Treat missing data as not breaching
        variants:
          - text: Count missing data as good, not breaching
          - text: Set missing data to count as not breaching
        explanation:
          text: Correct. With missing data treated as good, a period with no runs counts as fine, and the alarm stays OK.
      - id: detailed-monitoring
        text: Turn on detailed monitoring for the function
        variants:
          - text: Enable detailed monitoring on the function
          - text: Switch the function to detailed monitoring
        explanation:
          text: Detailed monitoring is an EC2 setting for one-minute metrics. A function that doesn't run has nothing to report anyway.
      - id: delete-nightly
        text: Delete the alarm each night and recreate it
        variants:
          - text: Remove the alarm nightly, then rebuild it
          - text: Recreate the alarm every morning after deleting it
        explanation:
          text: That adds work and leaves no alarm overnight. The missing data treatment solves it in one setting.
    correct_answers: [missing-not-breaching]
    hint:
      text: No orders means no data points. How should a period with no data count?
    explanation:
      text: |
        Lambda sends `Errors` data only when the function runs, so a quiet night has no data points.
        With the default treatment, the alarm moves to Insufficient data. Setting the missing data
        treatment to "not breaching" (good) keeps it in OK, so it emails only when orders fail.

  - id: q08-busy-function-error-rate
    page: guide/08-building-and-operating/06-lab-11-alarm-on-errors.md
    section: "Recap"
    task: "2.2"
    level: application
    topics: [cloudwatch, alarms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A shop's order function runs thousands of times a day, and a few runs always fail because
        customers type nonsense. Its alarm on "1 or more errors in a minute" now emails the owner
        many times a day, and she has started ignoring it. What is the better alarm?
    choices:
      - id: more-subscribers
        text: Keep the alarm, and add the owner's colleagues as subscribers too
        variants:
          - text: Keep it as it is, and subscribe more colleagues to the topic
          - text: Leave the alarm alone, and email more of the owner's staff
        explanation:
          text: More people receiving noisy emails means more people ignoring them. The alarm itself needs to change.
      - id: cloudtrail-instead
        text: Replace it with CloudTrail events for the order function
        variants:
          - text: Swap the alarm for CloudTrail events on the function
          - text: Use the function's CloudTrail events in place of the alarm
        explanation:
          text: CloudTrail records actions on the account, not failed runs, so it can't replace the alarm.
      - id: dashboard-only
        text: Delete the alarm, and check a dashboard once a day instead
        variants:
          - text: Remove the alarm and look at a dashboard each day
          - text: Drop the alarm in favor of a daily dashboard check
        explanation:
          text: A dashboard sends nothing, so a real outage could run for a day before anyone looks.
      - id: error-rate
        text: Alarm on the error rate staying high for several minutes
        variants:
          - text: Alarm when the error rate stays above a level for several minutes
          - text: An alarm on a high error rate that lasts several minutes
        explanation:
          text: Correct. Errors divided by invocations, sustained for a while, separates an outage from ordinary bad input.
    correct_answers: [error-rate]
    hint:
      text: An alert should reach a person, say what is wrong, and stay quiet otherwise.
    explanation:
      text: |
        A threshold that suits a test function that runs only when you run it is too sensitive for a
        busy shop. Alarming on the error rate (errors divided by invocations) staying above a level
        for several minutes keeps the alert actionable, and answering bad input politely in the code
        stops it counting as a failure.

  # ---------------------------------------------------------------------------------------------
  # Lesson 08.04, Connecting parts, shipping software
  # ---------------------------------------------------------------------------------------------

  - id: q08-print-orders-wait-in-queue
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "A direct call fails when the other side fails; a message in between waits"
    task: "3.8"
    level: application
    topics: [decoupling, amazon-sqs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A photo-printing website sends each print order straight to its print system and waits
        for a reply. Whenever the print system restarts for updates, orders placed during the
        restart fail. Nobody needs the print result at the moment of ordering. What should the
        company change?
    choices:
      - id: sqs-between
        text: Put an Amazon SQS queue between the website and the print system
        variants:
          - text: Place an Amazon SQS queue between the site and the print system
          - text: Add an SQS queue that sits between the website and the printers
        explanation:
          text: Correct. The website sends each order to the queue and moves on; the print system pulls orders when it's ready, so orders wait during a restart.
      - id: sns-topic
        text: Have the website publish each order to an Amazon SNS topic instead
        variants:
          - text: Publish every order to an Amazon SNS topic in its place
          - text: Send each order through an Amazon SNS topic instead
        explanation:
          text: SNS pushes each message at once to its subscribers. It doesn't hold work for a system that's down.
      - id: bigger-server
        text: Move the print system to a larger EC2 instance type with more memory
        variants:
          - text: Run the print system on a bigger EC2 instance with more capacity
          - text: Give the print system a larger and faster instance type
        explanation:
          text: A larger instance still restarts for updates, and the website would still fail while it does.
      - id: synchronous-retry
        text: Make the website wait longer for each reply from the print system
        variants:
          - text: Have the website keep waiting longer for the print system
          - text: Extend how long the website waits for each print reply
        explanation:
          text: Waiting longer keeps the two parts tied together. While the print system is down, there's no reply to wait for.
    correct_answers: [sqs-between]
    hint:
      text: The order needs somewhere to wait while the print system is away.
    explanation:
      text: |
        When one part calls another directly and waits, the two fail together. A queue in between
        decouples them: the website hands the work over and moves on, and the print system pulls it
        when ready. This is the reliability habit of loosely coupled dependencies.

  - id: q08-queue-between-tiers-gains
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "A direct call fails when the other side fails; a message in between waits"
    task: "3.8"
    level: understanding
    topics: [decoupling, amazon-sqs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company places an Amazon SQS queue between its web servers and the workers that process
        orders. Which TWO benefits does it gain? (Select TWO.)
    choices:
      - id: every-worker-gets-all
        text: Each worker receives a copy of each order
        variants:
          - text: Each worker gets its own copy of each order
          - text: Each order goes to each of the workers
        explanation:
          text: In a queue, each message goes to one worker. Copies for several receivers are what an SNS topic gives.
      - id: orders-wait
        text: Orders wait in the queue while the workers are down
        variants:
          - text: Orders are held in the queue while workers are offline
          - text: While the workers are down, orders wait in the queue
        explanation:
          text: Correct. Work waits instead of failing, so a worker outage delays orders rather than losing them.
      - id: strict-order-free
        text: Orders are processed in strict order without a FIFO queue
        variants:
          - text: A standard queue keeps orders in strict sequence
          - text: Strict ordering comes without needing a FIFO queue
        explanation:
          text: A standard queue keeps order only on a best-effort basis. Strict order needs a FIFO queue.
      - id: scale-separately
        text: Bursts are absorbed, and each tier scales on its own
        variants:
          - text: Busy spells are smoothed, and each tier scales separately
          - text: Peaks are soaked up, and the two tiers scale independently
        explanation:
          text: Correct. On a busy day orders queue up while the workers catch up, and the web tier and the workers grow to their own load.
      - id: replaces-database
        text: The queue becomes the permanent record of the orders
        variants:
          - text: The queue keeps the orders permanently, like a database
          - text: The orders are stored in the queue for good
        explanation:
          text: Messages wait for days at most, and are deleted once processed. A queue carries work; it doesn't replace a database.
    correct_answers: [orders-wait, scale-separately]
    explanation:
      text: |
        A queue decouples the parts on each side of it. If the workers fail or slow down, orders wait
        instead of failing; on a busy day, the queue absorbs the burst while workers catch up; and
        each tier can scale on its own. Each message still goes to one worker.

  - id: q08-fifo-ledger-entries
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SQS holds work in a queue until a worker pulls it"
    task: "3.8"
    level: application
    topics: [amazon-sqs, fifo]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A payments app sends a customer's deposit and then a withdrawal, a second apart, to a
        processing service. They must be applied in the order sent, and each exactly once. Which
        option fits?
    choices:
      - id: standard-queue
        text: An Amazon SQS standard queue
        variants:
          - text: A standard queue in Amazon SQS
          - text: An SQS standard queue
        explanation:
          text: A standard queue keeps order only on a best-effort basis and may occasionally deliver a message twice.
      - id: sns-topic
        text: An Amazon SNS standard topic
        variants:
          - text: A standard topic in Amazon SNS
          - text: An SNS standard topic
        explanation:
          text: A topic pushes each message to every subscriber. It doesn't hold work in strict order for one processor.
      - id: fifo-queue
        text: An Amazon SQS FIFO queue
        variants:
          - text: A FIFO queue in Amazon SQS
          - text: An SQS FIFO queue
        explanation:
          text: Correct. A FIFO (first in, first out) queue keeps messages in order and processes each exactly once.
      - id: dead-letter-queue
        text: An Amazon SQS dead-letter queue
        variants:
          - text: A dead-letter queue in Amazon SQS
          - text: An SQS dead-letter queue
        explanation:
          text: A dead-letter queue collects messages that keep failing. It doesn't put normal traffic in order.
    correct_answers: [fifo-queue]
    hint:
      text: Two requirements here are about order and duplicates.
    explanation:
      text: |
        SQS has two queue types. A standard queue has nearly unlimited throughput but may deliver a
        message more than once and keeps order only on a best-effort basis. A FIFO queue keeps
        messages in order and processes each exactly once, with lower throughput, which suits money
        movements that must happen in sequence.

  - id: q08-standard-queue-traits
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SQS holds work in a queue until a worker pulls it"
    task: "3.8"
    level: recall
    topics: [amazon-sqs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO statements describe an Amazon SQS standard queue? (Select TWO.)
    choices:
      - id: high-throughput
        text: It handles a nearly unlimited number of messages per second
        variants:
          - text: Its throughput is close to unlimited
          - text: It accepts an almost unlimited rate of messages
        explanation:
          text: Correct. High throughput is the standard queue's strength.
      - id: strict-order
        text: It keeps each message in strict first-in, first-out order
        variants:
          - text: It delivers messages in exact first-in, first-out order
          - text: Messages leave it in strict arrival order
        explanation:
          text: Strict order is the FIFO queue's job. A standard queue keeps order only on a best-effort basis.
      - id: pushes-to-all
        text: It pushes each message to each subscribed consumer
        variants:
          - text: It sends each message to its consumers at once
          - text: Each message is pushed to the subscribed consumers
        explanation:
          text: SQS never pushes; consumers poll. Pushing to every subscriber is what an SNS topic does.
      - id: exactly-once
        text: It processes each message exactly once, guaranteed
        variants:
          - text: Each message is guaranteed to be processed only once
          - text: It guarantees one, and only one, processing per message
        explanation:
          text: Exactly-once processing is a FIFO queue feature.
      - id: at-least-once
        text: It may occasionally deliver the same message twice
        variants:
          - text: A message can now and then be delivered more than once
          - text: It sometimes hands out the same message a second time
        explanation:
          text: Correct. A standard queue delivers each message at least once, occasionally twice, so consumers should cope with a repeat.
    correct_answers: [high-throughput, at-least-once]
    explanation:
      text: |
        A standard queue trades strict guarantees for throughput: nearly unlimited messages per
        second, delivery at least once (occasionally twice) and best-effort order. A FIFO queue gives
        strict order and exactly-once processing, with lower throughput.

  - id: q08-poison-message-dlq
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SQS holds work in a queue until a worker pulls it"
    task: "3.8"
    level: application
    topics: [amazon-sqs, dead-letter-queue]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In a company's SQS queue, one malformed message makes every worker that picks it up crash.
        It keeps reappearing, and the team wants it set aside for someone to inspect later while
        other messages keep flowing. What should the team configure?
    choices:
      - id: fifo
        text: Convert the queue to a FIFO queue
        variants:
          - text: Change the queue into a FIFO queue
          - text: Switch the queue type to FIFO
        explanation:
          text: FIFO keeps messages in order; a malformed message would still keep failing, and could hold up the messages behind it.
      - id: sns-fanout
        text: Fan the message out through an SNS topic
        variants:
          - text: Send the message through an SNS topic
          - text: Publish the message to an SNS topic
        explanation:
          text: Copying the bad message to more receivers spreads the problem rather than setting it aside.
      - id: longer-retention
        text: Raise the queue's message retention period
        variants:
          - text: Keep messages in the queue for longer
          - text: Lengthen how long the queue keeps messages
        explanation:
          text: Keeping the message longer gives it more chances to crash workers.
      - id: dlq
        text: Add a dead-letter queue to the queue
        variants:
          - text: Attach a dead-letter queue to it
          - text: Give the queue a dead-letter queue
        explanation:
          text: Correct. A dead-letter queue collects messages that keep failing, so one bad message doesn't block the rest.
    correct_answers: [dlq]
    hint:
      text: SQS has a place for messages that fail again and again.
    explanation:
      text: |
        While a worker processes a message, SQS hides it from the others; if the worker crashes
        before deleting it, the message reappears. A message that fails every time would loop
        forever. A dead-letter queue collects such messages so the rest keep moving and someone can
        look at them later.

  - id: q08-new-listing-fanout
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SNS pushes one message to every subscriber of a topic"
    task: "3.8"
    level: application
    topics: [amazon-sns, fan-out]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        When a seller publishes a new listing, an online marketplace's code must notify three
        things at the same moment: a search-index function, a fraud-check queue and the listing
        team's email. Which service fits best?
    choices:
      - id: one-queue
        text: One Amazon SQS standard queue that the three read from
        variants:
          - text: A single Amazon SQS standard queue shared by the three
          - text: One SQS standard queue polled by the three receivers
        explanation:
          text: Each message in a queue goes to one consumer, so only one of the three would get each listing.
      - id: sns-topic
        text: An Amazon SNS topic with a subscription for each of the three
        variants:
          - text: An Amazon SNS topic that the three receivers subscribe to
          - text: An SNS topic with three subscriptions, one per receiver
        explanation:
          text: Correct. One publish, and SNS pushes a copy to every subscriber, whether a function, a queue or an email address.
      - id: step-functions
        text: An AWS Step Functions workflow that runs the three in order
        variants:
          - text: A Step Functions workflow handling the three one after another
          - text: An AWS Step Functions state machine running the three in sequence
        explanation:
          text: The three must hear at the same moment, not in a sequence. Nothing here is a series of steps.
      - id: ses
        text: Amazon SES, sending the listing to the three receivers
        variants:
          - text: Amazon SES, emailing the listing to the three
          - text: SES, sending one email to all three receivers
        explanation:
          text: SES sends email. A function and a queue aren't inboxes.
    correct_answers: [sns-topic]
    hint:
      text: One message, several receivers, at once.
    explanation:
      text: |
        Amazon SNS delivers each message published to a topic to every subscriber at once: fan-out.
        Subscribers can be email addresses, phone numbers, HTTP endpoints, SQS queues, Lambda
        functions and more, so one publish reaches all three different kinds of receiver.

  - id: q08-two-teams-sns-plus-sqs
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SNS pushes one message to every subscriber of a topic"
    task: "3.8"
    level: application
    topics: [amazon-sns, amazon-sqs, fan-out]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A warehouse team and an accounting team each run their own workers, and each team's workers
        must process every shipment event. Either team's workers may be offline for an hour at a
        time, and no event may be lost. Which design fits?
    choices:
      - id: one-shared-queue
        text: One SQS queue that both teams' workers poll
        variants:
          - text: A single SQS queue polled by both teams
          - text: One shared SQS queue for both sets of workers
        explanation:
          text: Each message goes to one worker, so each event would reach only one team.
      - id: sns-email
        text: An SNS topic with an email subscription for each team
        variants:
          - text: An SNS topic emailing each team's address
          - text: SNS email subscriptions, one per team, on a topic
        explanation:
          text: Workers process messages, not emails, and an email doesn't wait for an offline worker to pick it up.
      - id: one-fifo
        text: One SQS FIFO queue shared by the two teams
        variants:
          - text: A single FIFO queue that both teams share
          - text: One shared SQS FIFO queue for the two teams
        explanation:
          text: FIFO adds order, but each message still goes to one consumer, so one team would miss it.
      - id: sns-to-two-queues
        text: An SNS topic with each team's own SQS queue subscribed
        variants:
          - text: An SNS topic feeding a separate SQS queue per team
          - text: One SNS topic, with an SQS queue subscribed for each team
        explanation:
          text: Correct. SNS copies each event to both queues, and each queue holds it until that team's workers are ready.
    correct_answers: [sns-to-two-queues]
    hint:
      text: One part of the answer gives every team a copy; another part lets the copy wait.
    explanation:
      text: |
        SNS and SQS are a common pair. SNS fans each message out to several queues, and each queue
        holds its copy until its own worker is ready. Every team gets every event, and an offline
        worker delays its team's processing without losing anything.

  - id: q08-clinic-reminders-ses
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "An email from SNS is an alert; an email from SES is your mail"
    task: "3.8"
    level: application
    topics: [amazon-ses, amazon-sns]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A dental clinic wants to email each patient an appointment reminder, designed with the
        clinic's logo and sent from the clinic's own domain. Which AWS service should it use?
    choices:
      - id: sns-email
        text: An Amazon SNS topic with an email subscription per patient
        variants:
          - text: Amazon SNS email subscriptions, one for each patient
          - text: An SNS topic that each patient subscribes to by email
        explanation:
          text: SNS email comes from an SNS address in plain text that can't be customized, each patient would have to confirm a subscription, and it's meant for internal alerts.
      - id: cloudwatch-alarm
        text: A CloudWatch alarm for each patient, emailing the reminder
        variants:
          - text: One CloudWatch alarm per patient that emails the reminder
          - text: CloudWatch alarms, one per patient, sending each reminder
        explanation:
          text: An alarm watches a metric and notifies an SNS topic when its state changes. It isn't a way to send designed mail to customers.
      - id: ses
        text: Amazon SES, sending each patient's reminder as an email
        variants:
          - text: Amazon SES, emailing each patient the reminder
          - text: SES, mailing the reminder to each patient
        explanation:
          text: Correct. SES sends email you design, from your own verified addresses and domains, to customers.
      - id: sqs
        text: An Amazon SQS queue for each patient's reminders
        variants:
          - text: Amazon SQS, with a queue per patient
          - text: One SQS queue holding each patient's reminders
        explanation:
          text: SQS holds messages for workers to pull. It doesn't deliver anything to an inbox.
    correct_answers: [ses]
    explanation:
      text: |
        Amazon SES is AWS's email platform: it sends and receives email using your own addresses and
        domains, for transactional mail such as reminders and receipts, and for marketing. An SNS
        email subscription is a plain alert to someone who opted in, from an AWS address, and isn't
        meant for customer mail.

  - id: q08-alarm-email-not-ses
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "An email from SNS is an alert; an email from SES is your mail"
    task: "3.8"
    level: understanding
    topics: [amazon-sns, amazon-ses]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team gets an email from a CloudWatch alarm whenever its API fails. A team member says,
        "So we already use Amazon SES, and can send our customer receipts the same way." Which
        statement is correct?
    choices:
      - id: right-ses
        text: That's right; alarm emails are sent by SES, so receipts can be too
        variants:
          - text: Correct; SES sends the alarm emails and can send receipts as well
          - text: True; the alarm uses SES, so receipts can follow the same path
        explanation:
          text: This is the misconception. The alarm notifies an SNS topic, and SNS delivers the email.
      - id: sns-alert-not-ses
        text: The alarm email came through SNS; customer receipts need SES
        variants:
          - text: SNS delivered the alarm email; receipts to customers need SES
          - text: The alert was an SNS email; customers' receipts call for SES
        explanation:
          text: Correct. An SNS email is a plain alert to a confirmed subscriber; SES sends designed mail from your own domain.
      - id: cloudwatch-sends
        text: CloudWatch sends the email itself, so receipts can come from CloudWatch
        variants:
          - text: The alarm emails directly, so CloudWatch can send receipts too
          - text: CloudWatch emails on its own, so it can deliver receipts as well
        explanation:
          text: An alarm doesn't email anyone itself; it notifies an SNS topic, and CloudWatch has no way to send customer mail.
      - id: sqs-delivers
        text: An SQS queue delivered the alarm email, and can deliver receipts
        variants:
          - text: The alarm email came from SQS, which can also send receipts
          - text: SQS sent the alert, so it can send the receipts as well
        explanation:
          text: SQS holds messages for workers to pull. It never delivers to an inbox.
    correct_answers: [sns-alert-not-ses]
    explanation:
      text: |
        "An SNS email is SES" is a common mix-up, because both put a message in an inbox. A
        CloudWatch alarm notifies an SNS topic, which emails confirmed subscribers in plain text from
        an AWS address; it's meant for internal alerts. Customer mail from your own domain, such as
        receipts, goes through Amazon SES.

  - id: q08-ses-sandbox-verified-only
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "An email from SNS is an alert; an email from SES is your mail"
    task: "3.8"
    level: understanding
    topics: [amazon-ses]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup sets up Amazon SES in a new account. Test emails to its own verified addresses
        arrive, but emails to real customers are refused. What explains this, and what should it do?
    choices:
      - id: confirm-subscriptions
        text: Customers haven't confirmed subscriptions; ask them to confirm
        variants:
          - text: Customers must first confirm a subscription; ask them to
          - text: The customers haven't confirmed; have them confirm first
        explanation:
          text: Confirming subscriptions is how SNS email works. SES mail doesn't need recipients to subscribe.
      - id: sandbox
        text: The account is in the SES sandbox; request production access
        variants:
          - text: SES is still in its sandbox; ask AWS for production access
          - text: The SES sandbox applies; apply for production access
        explanation:
          text: Correct. A new SES account starts in the sandbox, per Region, and can send only to verified addresses until it gets production access.
      - id: need-sqs
        text: SES needs an SQS queue in front of it; create one
        variants:
          - text: SES requires an SQS queue first; add one
          - text: An SQS queue must sit before SES; set one up
        explanation:
          text: SES doesn't need a queue to send email.
      - id: wrong-region
        text: SES can send only inside us-east-1; move the account there
        variants:
          - text: SES works only in us-east-1; move the setup there
          - text: Only us-east-1 can send through SES; switch to it
        explanation:
          text: The sandbox applies in each Region separately; no Region is the only one that can send.
    correct_answers: [sandbox]
    explanation:
      text: |
        Every new SES account starts in the SES sandbox, separately in each Region: it can send only
        to verified addresses, at a low rate. You leave it by requesting production access (as of
        2026-10-24). This is part of keeping SES's sending reputation clean.

  - id: q08-react-to-instance-termination
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "EventBridge routes events by rules on what they say"
    task: "3.8"
    level: application
    topics: [amazon-eventbridge]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Whenever any EC2 instance in the account is terminated, a company wants a Lambda function to
        record it in an asset register. It doesn't want to write code that watches for terminations.
        What should it set up?
    choices:
      - id: sns-ec2-publishes
        text: An SNS topic that EC2 publishes to, with the function subscribed
        variants:
          - text: A topic in SNS that EC2 posts to, with the function as subscriber
          - text: The function subscribed to an SNS topic that EC2 publishes to
        explanation:
          text: With SNS, your own code publishes to a topic it chose. EC2 doesn't publish terminations to a topic of yours on its own.
      - id: eventbridge-rule
        text: An EventBridge rule on the default bus, targeting the function
        variants:
          - text: A rule on EventBridge's default bus that targets the function
          - text: The function as target of a rule on the EventBridge default bus
        explanation:
          text: Correct. AWS services send events to the default event bus on their own; a rule matching terminations sends each one to the function.
      - id: sqs-poll
        text: An SQS queue that the function polls for termination messages
        variants:
          - text: The function polling an SQS queue for terminations
          - text: A queue in SQS that the function reads for terminations
        explanation:
          text: Something would still have to notice each termination and put a message in the queue, which is the watching code the company wants to avoid.
      - id: metric-filter
        text: A metric filter on the function's own CloudWatch log group
        variants:
          - text: A CloudWatch metric filter on the function's log group
          - text: The function's log group, with a CloudWatch metric filter
        explanation:
          text: The function's log group holds what the function writes. It knows nothing about other instances being terminated.
    correct_answers: [eventbridge-rule]
    hint:
      text: Which service receives events from AWS services without any code of yours?
    explanation:
      text: |
        Every account has a default EventBridge event bus that receives events from AWS services
        automatically. A rule holds a pattern, such as "EC2 instance state changed to terminated",
        and sends each matching event to its targets, such as a Lambda function. "React to something
        that happened in AWS" points to EventBridge.

  - id: q08-eventbridge-jobs
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "EventBridge routes events by rules on what they say"
    task: "3.8"
    level: recall
    topics: [amazon-eventbridge]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO jobs can Amazon EventBridge do? (Select TWO.)
    choices:
      - id: hold-for-worker
        text: Hold messages until a single worker pulls and deletes each one
        variants:
          - text: Keep messages until one worker pulls and deletes them
          - text: Store each message until a worker takes and deletes it
        explanation:
          text: That's Amazon SQS.
      - id: branded-email
        text: Send branded marketing email from the company's domain
        variants:
          - text: Email designed marketing mail from the company's domain
          - text: Deliver branded email to customers from the company's domain
        explanation:
          text: That's Amazon SES.
      - id: route-by-rules
        text: Send events from AWS services and SaaS partners to targets by rules
        variants:
          - text: Route events from AWS services and SaaS partners to targets with rules
          - text: Deliver events from AWS services and SaaS apps to targets by rule
        explanation:
          text: Correct. Rules match events by their content and send them to targets, such as a Lambda function or an SNS topic.
      - id: compile-code
        text: Compile source code and run its unit tests
        variants:
          - text: Build the source code and run unit tests on it
          - text: Compile the code and run the unit tests
        explanation:
          text: That's AWS CodeBuild.
      - id: run-on-schedule
        text: Run a task on a timetable, such as every night at 23:00
        variants:
          - text: Start a task on a schedule, for example nightly at 23:00
          - text: Run a job at set times, like every night at 23:00
        explanation:
          text: Correct. EventBridge Scheduler runs tasks on a timetable or once at a set time.
    correct_answers: [route-by-rules, run-on-schedule]
    explanation:
      text: |
        Amazon EventBridge receives events from AWS services, your own applications and SaaS
        partners, and its rules send each matching event to targets. EventBridge Scheduler runs
        tasks on a timetable or once at a set time. Holding work is SQS's job, email is SES's, and
        building code is CodeBuild's.

  - id: q08-sns-vs-eventbridge
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "EventBridge routes events by rules on what they say"
    task: "3.8"
    level: understanding
    topics: [amazon-sns, amazon-eventbridge]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Both Amazon SNS and Amazon EventBridge can send one thing to several places. Which statement
        describes how they differ?
    choices:
      - id: reversed
        text: AWS services feed SNS on their own; with EventBridge, your code must publish to a topic
        variants:
          - text: SNS gets events from AWS services by itself; EventBridge needs your code to publish
          - text: AWS services fill SNS automatically, while EventBridge waits for your code to publish
        explanation:
          text: This swaps them. AWS services feed EventBridge's default bus on their own, with no code. A topic gets only what is published to it, by your code or by something you point at it, such as a CloudWatch alarm.
      - id: sns-holds
        text: SNS holds messages until a worker pulls them; EventBridge pushes them at once
        variants:
          - text: SNS keeps messages for workers to pull, while EventBridge pushes them right away
          - text: Workers pull messages from SNS later; EventBridge pushes events immediately
        explanation:
          text: SNS pushes at once and holds nothing for pulling; that's SQS.
      - id: email-only
        text: EventBridge delivers only to email addresses; SNS delivers to code
        variants:
          - text: EventBridge sends to email alone, while SNS sends to programs
          - text: Only email addresses receive from EventBridge; SNS reaches code
        explanation:
          text: EventBridge targets include Lambda functions and SNS topics. It doesn't deliver email itself.
      - id: publish-vs-rules
        text: Your code publishes to an SNS topic; EventBridge rules route events by content
        variants:
          - text: SNS takes what your code publishes; EventBridge rules route by what events say
          - text: With SNS your code publishes; with EventBridge, rules match events by content
        explanation:
          text: Correct. SNS sends whatever your code publishes to every subscriber; EventBridge's rules decide by the event's content where it goes.
    correct_answers: [publish-vs-rules]
    explanation:
      text: |
        With SNS, your code publishes to a topic it chose, and every subscriber hears it. With
        EventBridge, AWS services feed the bus on their own, and rules decide by the event's content
        where it goes. "React to something that happened in AWS" points to EventBridge. On real
        AWS the line is softer (a service you configure, such as an alarm, can publish to a topic,
        and SNS subscriptions can filter), but who sends and what decides the route still differ.

  - id: q08-permit-waits-for-inspector
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Step Functions runs several steps in order and remembers where it is"
    task: "3.8"
    level: application
    topics: [step-functions, workflows]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A city's building-permit app checks each application form, then holds it until an
        inspector signs off, which can take a week, then charges the fee, trying the card again if
        the processor briefly fails, and finally issues the permit. The city wants AWS to keep track
        of where every application is. Which service should run this process?
    choices:
      - id: scheduler
        text: Amazon EventBridge Scheduler, starting each step at a set time
        variants:
          - text: EventBridge Scheduler, running each step at a fixed time
          - text: Amazon EventBridge Scheduler, firing each step on a timetable
        explanation:
          text: Scheduler starts tasks on a timetable. It doesn't know which step each application has reached, or wait for a sign-off.
      - id: fifo-queue
        text: An Amazon SQS FIFO queue holding the applications in order
        variants:
          - text: An SQS FIFO queue keeping the applications in sequence
          - text: A FIFO queue in Amazon SQS that stores applications in order
        explanation:
          text: A queue holds messages for workers; it doesn't know about steps, sign-offs or retries.
      - id: step-functions
        text: AWS Step Functions, running the process as a workflow
        variants:
          - text: AWS Step Functions, with the process as a state machine
          - text: A Step Functions workflow carrying out the process
        explanation:
          text: Correct. A Standard workflow runs for up to a year, waits for a person, retries failed calls and remembers where each application is.
      - id: eventbridge-rules
        text: Amazon EventBridge rules, one for each step of the process
        variants:
          - text: A separate Amazon EventBridge rule for each step
          - text: Amazon EventBridge, with a rule per step of the process
        explanation:
          text: Rules route matching events to targets. They don't carry one application through steps in order or remember its place.
    correct_answers: [step-functions]
    hint:
      text: Look for steps in order, a long wait for a person, retries, and a need to remember each case's place.
    explanation:
      text: |
        AWS Step Functions runs workflows, called state machines: steps carried out in order and
        tracked to the end. A step can call a Lambda function or another service, choose a path,
        retry a failed call or wait for a person to approve. A Standard workflow can run for up to a
        year, so a week's wait for an inspector is no problem.

  - id: q08-step-functions-abilities
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Step Functions runs several steps in order and remembers where it is"
    task: "3.8"
    level: recall
    topics: [step-functions, workflows]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO can a step in an AWS Step Functions workflow do? (Select TWO.)
    choices:
      - id: hold-for-workers
        text: Hold messages in a queue until a worker pulls them
        variants:
          - text: Keep messages queued until workers pull them
          - text: Act as a queue that workers pull messages from
        explanation:
          text: Holding messages for workers to pull is what an SQS queue does. Step Functions tracks where each run is; it isn't a queue.
      - id: retry-failed-call
        text: Retry a call to another service that failed
        variants:
          - text: Try a failed call to another service again
          - text: Repeat a call to another service after it fails
        explanation:
          text: Correct. Retries are built into a workflow's steps.
      - id: wait-for-approval
        text: Wait for a person to approve before going on
        variants:
          - text: Pause until a person gives approval to continue
          - text: Hold the workflow until someone approves it
        explanation:
          text: Correct. A workflow can wait for a person, and Standard workflows can run for up to a year.
      - id: store-logs
        text: Store log lines so they can be searched later
        variants:
          - text: Keep log lines for searching later on
          - text: Hold log lines that can be searched afterwards
        explanation:
          text: Storing and searching logs is CloudWatch Logs' job.
      - id: record-api-calls
        text: Record every API call made in the account
        variants:
          - text: Keep a record of each API call in the account
          - text: Log all the API calls made in the account
        explanation:
          text: Recording actions on the account is CloudTrail's job. A workflow knows only its own runs.
    correct_answers: [retry-failed-call, wait-for-approval]
    explanation:
      text: |
        A Step Functions step can call a Lambda function or another AWS service, choose a path based
        on data, retry a failed call, run steps in parallel, or wait for a person to approve. The
        console shows each run step by step, so you can see where every order or claim is.

  - id: q08-tests-without-build-servers
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Shipping software: CodeBuild builds and tests, CodePipeline runs the release"
    task: "3.8"
    level: application
    topics: [codebuild, ci-cd]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A development team wants every code change compiled and its 1,200 unit tests run
        automatically, producing a package ready to deploy, without setting up, patching or scaling
        any build servers. Which AWS service does that work?
    choices:
      - id: codedeploy
        text: AWS CodeDeploy
        variants:
          - text: The AWS CodeDeploy service
          - text: CodeDeploy
        explanation:
          text: CodeDeploy deploys code onto servers and services; it doesn't compile or test. The exam guide lists it as out of scope.
      - id: codepipeline
        text: AWS CodePipeline
        variants:
          - text: The AWS CodePipeline service
          - text: CodePipeline
        explanation:
          text: CodePipeline runs the release stages in order and calls a build service for the build and test stages. It doesn't compile code itself.
      - id: cloud9
        text: AWS Cloud9
        variants:
          - text: The AWS Cloud9 service
          - text: Cloud9
        explanation:
          text: Cloud9 was a code editor in the browser, closed to new customers since 2024-07-25. It isn't a build service.
      - id: codebuild
        text: AWS CodeBuild
        variants:
          - text: The AWS CodeBuild service
          - text: CodeBuild
        explanation:
          text: Correct. CodeBuild is a fully managed build service that compiles code, runs tests and produces packages, with no build servers to manage.
    correct_answers: [codebuild]
    explanation:
      text: |
        AWS CodeBuild compiles source code, runs unit tests and produces packages ready to deploy,
        with no build servers to set up, patch or scale; you pay for the build minutes you use. That
        is the continuous integration step, and CodePipeline calls it from its build and test stages.

  - id: q08-release-stages-in-order
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Shipping software: CodeBuild builds and tests, CodePipeline runs the release"
    task: "3.8"
    level: application
    topics: [codepipeline, ci-cd]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company wants every code change to go through source, build, test, a manager's approval
        and deployment, in that order, with the release stopping if any stage fails. Which AWS
        service runs this process?
    choices:
      - id: codepipeline
        text: AWS CodePipeline
        variants:
          - text: The AWS CodePipeline service
          - text: CodePipeline
        explanation:
          text: Correct. CodePipeline models the release as stages, runs each change through them in order, can pause for approval, and stops if a stage fails.
      - id: codebuild
        text: AWS CodeBuild
        variants:
          - text: The AWS CodeBuild service
          - text: CodeBuild
        explanation:
          text: CodeBuild does the work inside the build and test stages. It doesn't run the whole release or pause for approval.
      - id: stacksets
        text: AWS CloudFormation StackSets
        variants:
          - text: CloudFormation StackSets
          - text: StackSets in AWS CloudFormation
        explanation:
          text: StackSets deploy one template across accounts and Regions. They don't run source, build, test and approval stages.
      - id: codedeploy
        text: AWS CodeDeploy
        variants:
          - text: The AWS CodeDeploy service
          - text: CodeDeploy
        explanation:
          text: CodeDeploy can be one deploy step, but it doesn't run the whole release; it's also outside the exam's scope.
    correct_answers: [codepipeline]
    explanation:
      text: |
        AWS CodePipeline is a continuous delivery service: it runs each change through stages such
        as source, build, test, approval and deploy, in order. It calls CodeBuild for the build and
        test stages, can wait for a person's approval, and can deploy with CloudFormation, ECS,
        Elastic Beanstalk, S3 and others.

  - id: q08-continuous-delivery-meaning
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Key terms (skip if you know them)"
    task: "3.8"
    level: recall
    topics: [ci-cd]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement describes continuous delivery?
    choices:
      - id: prepared-for-release
        text: Every passing change is prepared for release; a decision sets when it goes live
        variants:
          - text: Each change that passes is readied for release; someone or a rule picks when
          - text: Passing changes are made release-ready, and a person, test or rule decides when
        explanation:
          text: Correct. Every change that passes is prepared automatically, and a person, a test or a rule decides when it goes live.
      - id: manual-release
        text: Changes are collected for months, then built and released by hand
        variants:
          - text: Changes pile up for months before a manual build and release
          - text: Months of changes are built and released together by hand
        explanation:
          text: "That's the opposite: rare, manual releases. Continuous delivery makes every change ready to release."
      - id: build-only
        text: Changes are built and tested, but nothing is ever prepared for release
        variants:
          - text: Each change is built and tested, with no release preparation
          - text: Changes get built and tested, and release prep never happens
        explanation:
          text: Building and testing every change is continuous integration. Continuous delivery adds preparing each passing change for release.
      - id: no-tests
        text: Changes go straight to customers without being built or tested
        variants:
          - text: Each change reaches customers with no build or test
          - text: Changes skip the build and tests and go to customers directly
        explanation:
          text: Continuous delivery builds and tests every change before it's prepared for release.
    correct_answers: [prepared-for-release]
    explanation:
      text: |
        Continuous integration (CI) builds and tests every code change automatically, soon after
        it's made; on AWS, CodeBuild does that work. Continuous delivery (CD) also prepares every
        passing change for release automatically, and a person, a test or a rule decides when it goes
        live; CodePipeline runs that process.

  - id: q08-lab11-who-does-what
    page: guide/08-building-and-operating/06-lab-11-alarm-on-errors.md
    section: "Recap"
    task: "3.8"
    level: understanding
    topics: [cloudwatch, amazon-sns, aws-lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A Lambda function's failures should email the owner. Which description of the parts' jobs
        is correct?
    choices:
      - id: function-emails
        text: The function emails on failure, and CloudWatch keeps a copy of each email
        variants:
          - text: The function sends the email when it fails; CloudWatch stores each message
          - text: On failure the function emails the owner, and CloudWatch archives the mail
        explanation:
          text: The function never sends email itself. Lambda reports failures as a metric, and other services act on it.
      - id: sns-decides
        text: SNS counts the failures and decides when to email, and CloudWatch delivers it
        variants:
          - text: SNS decides from the failure count, then CloudWatch sends the email
          - text: SNS judges when failures matter, and CloudWatch delivers the message
        explanation:
          text: This swaps two jobs. CloudWatch's alarm decides; SNS delivers.
      - id: lambda-cw-sns
        text: Lambda reports errors, a CloudWatch alarm decides, and SNS delivers the email
        variants:
          - text: Lambda records errors, CloudWatch's alarm judges, and SNS sends the email
          - text: Errors from Lambda, the decision from a CloudWatch alarm, email from SNS
        explanation:
          text: Correct. Lambda adds failed runs to its `Errors` metric, the alarm decides when the number matters, and the SNS topic emails the confirmed subscriber.
      - id: ses-decides
        text: CloudTrail reports errors, SES decides, and the alarm delivers the email
        variants:
          - text: CloudTrail records errors, SES judges, and the alarm sends the email
          - text: Errors come from CloudTrail, the decision from SES, the email from the alarm
        explanation:
          text: CloudTrail records account actions, not failed runs; SES isn't involved in alarms; and an alarm doesn't email anyone itself.
    correct_answers: [lambda-cw-sns]
    explanation:
      text: |
        "Tell me when orders fail" becomes three parts that each do one job: a metric that Lambda
        reports for free, an alarm that decides when the number matters, and a topic that delivers
        the news to a confirmed email subscription.

flashcards:

  - id: c08-script-steps-template-result
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "The CLI turns each action into a command you can save and run again"
    level: understanding
    topics: [infrastructure-as-code, aws-cli, stacks]
    front:
      text: You run a CLI script a second time. Then you update a CloudFormation stack again from the same, unchanged template. What does each do?
    back:
      text: |
        The script repeats its steps, so it may fail or make duplicates (lesson 08.01). The stack
        update changes only what differs from the template the stack was built from: here, nothing
        (lesson 08.02).

  - id: c08-three-questions-way-in
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "One-time or repeatable: the question that picks the way in"
    level: understanding
    topics: [ways-in]
    front:
      text: Which three questions pick the way into AWS for a task?
    back:
      text: |
        Who does it, a person or a program? Will it repeat, or must copies match? Is it one thing or
        many?

  - id: c08-sdk-role-not-key
    page: guide/08-building-and-operating/01-four-ways-in.md
    section: "An SDK puts AWS calls inside your own program"
    level: understanding
    topics: [aws-sdk, credentials]
    front:
      text: Code on EC2 or in Lambda calls S3 through an SDK. Where do its credentials come from?
    back:
      text: |
        From the IAM role it runs with. The SDK picks up the role's temporary credentials and renews
        them, so no access key sits in the code.

  - id: c08-cfn-works-out-order
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "A template describes what should exist, not the steps to build it"
    level: understanding
    topics: [cloudformation]
    front:
      text: A template's subnet refers to its VPC with `!Ref`. Who decides to build the VPC first?
    back:
      text: |
        CloudFormation. It sees from the reference that the subnet needs the VPC, so you never write
        the build order.

  - id: c08-drift-reports-only
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Change sets preview a change; drift detection finds changes made by hand"
    level: understanding
    topics: [cloudformation, drift]
    front:
      text: Drift detection finds a security group changed by hand. What does it do about it?
    back:
      text: |
        Nothing; it only reports the resource as modified. You change the resource back or put the
        change into the template.

  - id: c08-ami-one-region
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "One template, many Regions and accounts, but not the data"
    level: understanding
    topics: [cloudformation, amis]
    front:
      text: Why can't a stack in a second Region use the first Region's AMI ID?
    back:
      text: |
        An AMI belongs to one Region. The second Region needs its own copy of the AMI, which has its
        own ID, so the template must allow for it.

  - id: c08-template-pays-back
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Automation makes work repeatable and cheaper"
    task: "1.4"
    level: understanding
    topics: [automation, cloud-economics]
    front:
      text: When is clicking in the console cheaper than writing a template?
    back:
      text: |
        For a resource made once and thrown away. A template costs more for one copy and less from a
        few copies on, because each later copy takes minutes.

  - id: c08-template-copies-mistakes
    page: guide/08-building-and-operating/02-iac-and-automation.md
    section: "Your side of the line"
    level: understanding
    topics: [cloudformation, shared-responsibility]
    front:
      text: A template opens SSH to the whole internet. What happens in every Region it builds?
    back:
      text: |
        CloudFormation builds the mistake exactly, everywhere. What a template says is the
        customer's, so templates need least-privilege rules and review.

  - id: c08-autoscaling-alarm-repeats
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "An alarm watches one metric and acts when its state changes"
    task: "2.2"
    level: recall
    topics: [cloudwatch, alarms, auto-scaling]
    front:
      text: Which CloudWatch alarm action repeats while the alarm stays in its new state?
    back:
      text: |
        An Auto Scaling action, every minute. Other actions, such as notifying an SNS topic, run once
        per change of state.

  - id: c08-logs-kept-forever
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch Logs keeps what your code writes, and lets you search it"
    task: "2.2"
    level: recall
    topics: [cloudwatch-logs, retention]
    front:
      text: How long does CloudWatch Logs keep log data if you change nothing?
    back:
      text: Forever; by default log data never expires. Set a retention period on each log group.

  - id: c08-xray-sampling-why
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "X-Ray follows one request through every part it touches"
    task: "3.8"
    level: understanding
    topics: [x-ray, tracing]
    front:
      text: Why does X-Ray trace only some requests, not all of them?
    back:
      text: To keep costs down. Its default rule records the first request each second and a small share of the rest.

  - id: c08-request-tracing-means-xray
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "X-Ray follows one request through every part it touches"
    task: "3.8"
    level: recall
    topics: [x-ray, exam-names]
    front:
      text: AWS now shows traces on CloudWatch console pages. Which service does "request tracing" name on the exam?
    back:
      text: |
        AWS X-Ray. AWS presents it as part of CloudWatch (as of 2026-10-24), but the exam guide still
        lists X-Ray.

  - id: c08-verb-picks-monitoring-service
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "Pick the service by the question it must answer"
    task: "2.2"
    level: understanding
    topics: [cloudwatch, x-ray, cloudtrail]
    front:
      text: Measure and alert, trace a request, find who did it. Which service answers each?
    back:
      text: CloudWatch; X-Ray; CloudTrail.

  - id: c08-who-waits-by-service
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Choose by the shape of the message"
    task: "3.8"
    level: understanding
    topics: [amazon-sqs, amazon-sns, step-functions]
    front:
      text: Who waits with SQS, with SNS, and with Step Functions?
    back:
      text: |
        SQS: the message waits for a worker. SNS: nobody; it's pushed at once. Step Functions: the
        workflow waits, remembering the next step.

  - id: c08-sqs-consumers-poll
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SQS holds work in a queue until a worker pulls it"
    task: "3.8"
    level: recall
    topics: [amazon-sqs]
    front:
      text: Does Amazon SQS push messages to its consumers?
    back:
      text: |
        No. Consumers poll: they ask for messages when ready, process them, then delete them. SNS is
        the one that pushes.

  - id: c08-sqs-worker-crash
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "SQS holds work in a queue until a worker pulls it"
    task: "3.8"
    level: understanding
    topics: [amazon-sqs]
    front:
      text: An SQS worker crashes before deleting the message it was processing. What happens to the message?
    back:
      text: It reappears in the queue for another worker. SQS hid it only while the first worker had it.

  - id: c08-codedeploy-on-exam
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Shipping software: CodeBuild builds and tests, CodePipeline runs the release"
    task: "3.8"
    level: recall
    topics: [codedeploy, exam-names]
    front:
      text: An exam question offers CodeBuild, CodePipeline and CodeDeploy. How should you treat CodeDeploy?
    back:
      text: |
        As the likely distractor. CodeDeploy still exists, but the CLF-C02 exam guide lists it as out
        of scope (checked 2026-10-24).

  - id: c08-cloud9-closed
    page: guide/08-building-and-operating/04-connecting-parts-shipping-software.md
    section: "Shipping software: CodeBuild builds and tests, CodePipeline runs the release"
    task: "3.8"
    level: recall
    topics: [cloud9, exam-names]
    front:
      text: Can a new AWS customer start using AWS Cloud9?
    back:
      text: |
        No. It has been closed to new customers since 2024-07-25; existing customers can keep using
        it. The exam guide no longer lists it.
