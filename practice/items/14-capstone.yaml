# Module 14, Capstone: a Well-Architected review. Practice questions and concept cards.
# Written from the guide's pages in guide/14-capstone/; see practice/work/blueprint-14.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 14.01, The capstone review
  # ---------------------------------------------------------------------------------------------

  - id: q14-three-az-copies-not-backups
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Replication copies your mistakes; backups undo them"
    task: "3.2"
    level: understanding
    topics: [well-architected-review, backups, reliability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        During a review, a developer says a DynamoDB table needs no point-in-time recovery because
        DynamoDB already keeps copies in several Availability Zones. What does that argument miss?
    choices:
      - id: az-copies-not-real
        text: DynamoDB keeps its data in a single Availability Zone
        variants:
          - text: A DynamoDB table lives in just one Availability Zone
          - text: DynamoDB stores a table in only one Availability Zone
        explanation:
          text: |
            The developer is right that DynamoDB spreads copies across Availability Zones. The flaw
            is in what those copies protect against.
      - id: copies-cost-extra
        text: The copies are billed separately and cost more than backups
        variants:
          - text: The extra copies carry their own charge, higher than a backup's
          - text: The copies cost more than backups, on a separate line of the bill
        explanation:
          text: |
            Price isn't the point here, and the lesson says price is a reason for ordering fixes,
            not for rating risk. The copies don't replace a backup at any price.
      - id: copies-need-trail
        text: The copies are made only while a CloudTrail trail is on
        variants:
          - text: DynamoDB copies data only when a CloudTrail trail exists
          - text: Without a CloudTrail trail, DynamoDB makes no copies
        explanation:
          text: |
            CloudTrail records API activity; it has nothing to do with how DynamoDB stores data.
      - id: bad-write-everywhere
        text: A bad write or a deletion reaches every copy
        variants:
          - text: A mistaken write or delete is copied to every replica
          - text: Every copy receives a bad write or a deletion too
        explanation:
          text: |
            Correct. Copies in several Availability Zones survive a failed AZ, but a mistake is
            copied to all of them. Only a backup lets you go back.
    correct_answers: [bad-write-everywhere]
    explanation:
      text: |
        Copies in several Availability Zones give high availability: the table survives the loss of
        one AZ. They don't protect against a bad write or a deletion, because that change reaches
        every copy at once. Point-in-time recovery is a backup that lets you restore the table to a
        moment before the mistake.

  - id: q14-hourly-charges-select-two
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Every charge is a quantity times a rate"
    task: "4.1"
    level: understanding
    topics: [pricing-fixes, hourly-charges]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A shop plans to put its web servers behind an Application Load Balancer. When pricing the
        change, the reviewer looks for the charges that bill all month, even in a week with no
        customers. Which two charges are those? (Select TWO.)
    choices:
      - id: alb-hours
        text: The hours the load balancer runs
        variants:
          - text: Each hour the load balancer is running
          - text: The load balancer's running hours
        explanation:
          text: |
            Correct. A load balancer bills for every hour it exists, whether or not anyone visits.
      - id: capacity-units
        text: The capacity units the load balancer uses
        variants:
          - text: Capacity units used by the load balancer
          - text: The load balancer's used capacity units
        explanation:
          text: |
            Capacity units measure the work the load balancer does, so they track traffic. In the
            lesson's estimate they are a small, assumed part of the cost.
      - id: public-ipv4
        text: The load balancer's public IPv4 addresses
        variants:
          - text: The public IPv4 addresses the load balancer uses
          - text: Public IPv4 addresses held by the load balancer
        explanation:
          text: |
            Correct. A public IPv4 address bills by the hour, including the addresses a load
            balancer uses.
      - id: s3-requests
        text: Requests to Amazon S3 for product photos
        variants:
          - text: Amazon S3 requests for product photos
          - text: Product-photo requests sent to Amazon S3
        explanation:
          text: |
            S3 charges per request, so a week without customers brings few requests and little
            charge.
      - id: data-out
        text: Data the site sends out to customers
        variants:
          - text: Data transferred out to customers
          - text: Data that goes out to customers' browsers
        explanation:
          text: |
            Data transfer out is charged per gigabyte sent, so with no customers there is almost
            nothing to send.
    correct_answers: [alb-hours, public-ipv4]
    explanation:
      text: |
        "Find the hourly lines" is the first habit for pricing a fix: hourly charges bill all month,
        with or without customers. In the bakery's reliability fix, most of the extra cost is hourly:
        the load balancer's hours and its public IPv4 addresses. Charges that follow use, such as S3
        requests, data sent out and the load balancer's capacity units, fall when traffic falls.

  - id: q14-pillar-single-az-web-server
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "Pillars that sound alike, side by side"
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, reliability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A reviewer notes that a travel agency's booking site runs on one Amazon EC2 instance in one
        Availability Zone, and nothing would replace the instance if it failed. Which
        Well-Architected pillar does this finding belong to?
    choices:
      - id: performance
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency, as a pillar
        explanation:
          text: |
            Performance efficiency is about choosing and using resources that fit the work. The
            finding is about surviving a failure, not about speed.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security, as a pillar
        explanation:
          text: |
            Security covers protecting data and systems and detecting events. A server that stops
            when its AZ fails is a recovery problem, not a security one.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability, as a pillar
        explanation:
          text: |
            Correct. Reliability asks how a workload isolates faults and recovers from them; its
            question REL 10 covers deploying to more than one location.
      - id: sustainability
        text: Sustainability
        variants:
          - text: The sustainability pillar
          - text: Sustainability, as a pillar
        explanation:
          text: |
            Sustainability is about the environmental impact of what runs. Adding a second server
            would actually raise energy use, a trade-off the review writes down.
    correct_answers: [reliability]
    explanation:
      text: |
        A single instance in one Availability Zone, with nothing to replace it, is a fault-isolation
        gap: reliability's question REL 10 and its best practice REL10-BP01, deploy the workload to
        multiple locations. The fix spreads servers across two AZs behind a load balancer, with Auto
        Scaling to replace a failed one.

  - id: q14-support-plan-small-bill
    page: guide/12-getting-help/01-support-plans.md
    section: "Each paid plan adds speed and people"
    task: "4.3"
    level: application
    topics: [support-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small shop's AWS bill is well under $100 a month, but after a review its site now uses a
        load balancer and Auto Scaling that the owner can't troubleshoot alone. She wants to be able
        to open technical cases with AWS at any hour, for the lowest fee. Which plan fits?
    choices:
      - id: basic
        text: Basic Support
        variants:
          - text: The Basic Support plan
          - text: AWS Basic Support
        explanation:
          text: |
            Basic is free, but it can't open technical cases: only account, billing and quota
            requests.
      - id: enterprise
        text: AWS Enterprise Support
        variants:
          - text: The AWS Enterprise Support plan
          - text: Enterprise Support
        explanation:
          text: |
            Enterprise Support adds a Technical Account Manager, but its monthly minimum is many
            times this shop's whole bill.
      - id: business-plus
        text: AWS Business Support+
        variants:
          - text: The AWS Business Support+ plan
          - text: Business Support+
        explanation:
          text: |
            Correct. It is the first paid plan, with technical cases 24/7; on a small bill the fee
            is its monthly minimum.
      - id: unified-ops
        text: AWS Unified Operations
        variants:
          - text: The AWS Unified Operations plan
          - text: Unified Operations
        explanation:
          text: |
            Unified Operations is the top plan, for mission-critical systems where minutes matter.
            Its minimum is far beyond a small shop's needs.
    correct_answers: [business-plus]
    hint:
      text: Start at the free plan and move up one step only for a reason.
    explanation:
      text: |
        Start at Basic and move up only for a reason. The reason here is technical help at any
        hour, which Basic doesn't give and AWS Business Support+ does. On a small bill its fee is
        the plan's monthly minimum (as of 2026-10-24); the plans above it cost far more than the
        whole bill. Staying on Basic is also defensible if it is written down as an accepted risk.

  - id: q14-pillar-logs-never-expire
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "Pillars that sound alike, side by side"
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, cost-optimization, log-retention]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A review finds that an AWS Lambda function's logs in Amazon CloudWatch Logs are never
        deleted, so the storage charge for them grows a little every month. Under which
        Well-Architected pillar does the review list this finding?
    choices:
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability, as a pillar
        explanation:
          text: |
            Reliability covers recovering from failures. Logs that pile up don't make the function
            fail.
      - id: performance
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency, as a pillar
        explanation:
          text: |
            Old logs don't slow the function down. Performance efficiency is about resources that
            fit the work.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security, as a pillar
        explanation:
          text: |
            Security wants logging turned on, and the function has it. The finding is about how long
            the logs are kept and what that costs.
      - id: cost
        text: Cost optimization
        variants:
          - text: The cost optimization pillar
          - text: Cost optimization, as a pillar
        explanation:
          text: |
            Correct. Keeping data longer than needed raises the bill; the best practice is COST04-BP05,
            enforce data retention policies.
    correct_answers: [cost]
    explanation:
      text: |
        Data kept forever costs a little more every month. The bakery's review lists the function's
        logs under cost optimization, best practice COST04-BP05 (enforce data retention policies),
        and fixes it with a 30-day retention setting on the log group: five minutes of work that
        stops a slow rise.

  - id: q14-pillar-size-chosen-by-label
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "Pillars that sound alike, side by side"
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, performance-efficiency, rightsizing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A review notes that a web server's instance type was picked because it was free-tier
        eligible, and nobody has measured whether it suits the site's load. Under which
        Well-Architected pillar does the review list this finding?
    choices:
      - id: performance
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency, as a pillar
        explanation:
          text: |
            Correct. Its question PERF 2 asks how you select and use compute, and its best practice
            PERF02-BP04 is to configure and right-size compute from data.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability, as a pillar
        explanation:
          text: |
            Reliability is about surviving failures. The finding is about whether the size fits the
            work, which nobody has measured.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security, as a pillar
        explanation:
          text: |
            An instance's size doesn't change who can reach it or what is logged.
      - id: operational
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence, as a pillar
        explanation:
          text: |
            Operational excellence covers how a team runs and improves the workload, such as alerts
            and templates. Choosing a resource size to fit the load belongs to another pillar.
    correct_answers: [performance]
    explanation:
      text: |
        Choosing compute that fits the work, and checking it with data, is performance efficiency:
        question PERF 2 and best practice PERF02-BP04, configure and right-size compute resources.
        The bakery's fix is to measure first: after the redesign, opt in to AWS Compute Optimizer and
        read a month of the servers' metrics before changing the size.

  - id: q14-security-findings-select-two
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "Six pillars, six questions"
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, security]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A bakery's review lists the findings below. Which two belong to the security pillar?
        (Select TWO.)
    choices:
      - id: event-history-only
        text: Only 90 days of CloudTrail Event history, and no trail
        variants:
          - text: No CloudTrail trail, only the 90 days of Event history
          - text: CloudTrail Event history's 90 days and no trail at all
        explanation:
          text: |
            Correct. Security's question SEC 4 asks how you detect and investigate security events;
            without a trail, who did what is lost after 90 days.
      - id: single-az
        text: One web server in one Availability Zone
        variants:
          - text: A single web server in a single Availability Zone
          - text: The only web server, in one Availability Zone
        explanation:
          text: |
            A single server in one AZ is a reliability finding: fault isolation, question REL 10.
      - id: patching-unowned
        text: Nobody owns patching the servers' operating system
        variants:
          - text: No one is responsible for patching the servers' OS
          - text: Patching the servers' operating system has no owner
        explanation:
          text: |
            Correct. Vulnerability management, best practice SEC06-BP01, is a security practice, and
            on Amazon EC2 patching the guest OS is the customer's job.
      - id: logs-forever
        text: The function's logs are kept forever
        variants:
          - text: The function's logs never expire
          - text: Nothing ever deletes the function's logs
        explanation:
          text: |
            Logs kept forever are a cost finding: data retention, best practice COST04-BP05.
      - id: built-by-hand
        text: Most parts were built by hand in the console
        variants:
          - text: Most of the parts were set up by hand in the console
          - text: The console was used by hand to build most parts
        explanation:
          text: |
            Hand-built parts are an operational excellence finding: configuration management, best
            practice OPS05-BP03.
    correct_answers: [event-history-only, patching-unowned]
    explanation:
      text: |
        The bakery's review lists two security findings: only 90 days of Event history with nothing
        kept or watched (SEC 4, fixed with a trail), and nobody owning patching of the web servers
        (SEC06-BP01, vulnerability management). The others belong to reliability, cost optimization
        and operational excellence.

  - id: q14-who-changed-it-months-ago
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudTrail records who did what, when and from where"
    task: "2.2"
    level: application
    topics: [cloudtrail, security]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A dental practice's AWS account has never had a CloudTrail trail. Its office manager wants
        to be able to find out, a year from now, who changed a security group's rules. What should
        the practice set up now?
    choices:
      - id: trail-to-bucket
        text: A CloudTrail trail that delivers events to an S3 bucket
        variants:
          - text: An AWS CloudTrail trail delivering events to an Amazon S3 bucket
          - text: A trail in CloudTrail that sends events to an S3 bucket
        explanation:
          text: |
            Correct. A trail delivers events to a bucket, where they're kept as long as the bucket's
            rules allow.
      - id: longer-event-history
        text: A longer retention period for CloudTrail Event history
        variants:
          - text: Extended retention for CloudTrail Event history
          - text: A raised retention setting on CloudTrail Event history
        explanation:
          text: |
            Event history keeps 90 days, and you can't lengthen it. A trail is how events are kept
            longer.
      - id: trusted-advisor
        text: All AWS Trusted Advisor checks through a paid Support plan
        variants:
          - text: The full set of AWS Trusted Advisor checks, from a paid Support plan
          - text: Every AWS Trusted Advisor check, unlocked by a paid Support plan
        explanation:
          text: |
            Trusted Advisor checks an account against good practice. It doesn't record who changed
            what.
      - id: inspector
        text: Amazon Inspector scans of the account's instances
        variants:
          - text: Scans of the account's instances by Amazon Inspector
          - text: Amazon Inspector scanning the account's instances
        explanation:
          text: |
            Inspector looks for software vulnerabilities and unintended network exposure. It doesn't
            keep a history of API calls.
    correct_answers: [trail-to-bucket]
    hint:
      text: The built-in history is short. What keeps events beyond it?
    explanation:
      text: |
        CloudTrail Event history shows the last 90 days of management events, and nothing older. A
        trail delivers events to an S3 bucket, kept for as long as you choose, and the first copy of
        management events has no CloudTrail charge; you pay for the S3 storage (as of 2026-10-24).
        The bakery's fix is a multi-Region trail to its own private bucket, with a rule that deletes
        logs after a year.

  - id: q14-log-retention-fix
    page: guide/08-building-and-operating/03-watching-workloads.md
    section: "CloudWatch Logs keeps what your code writes, and lets you search it"
    task: "2.2"
    level: application
    topics: [cost-optimization, log-retention]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A review finds that an AWS Lambda function's log group in Amazon CloudWatch Logs keeps
        everything forever. The team needs about a month of logs to investigate problems. What is
        the simplest fix?
    choices:
      - id: retention-setting
        text: Set a 30-day retention period on the log group
        variants:
          - text: Give the log group a retention period of 30 days
          - text: Change the log group to keep logs for 30 days
        explanation:
          text: |
            Correct. A retention setting on the log group deletes logs older than the period, and
            takes minutes to set.
      - id: s3-lifecycle
        text: Add an S3 lifecycle rule that moves the logs to Glacier Deep Archive
        variants:
          - text: Use an S3 lifecycle rule to move the logs to Glacier Deep Archive
          - text: Move the logs to Glacier Deep Archive with an S3 lifecycle rule
        explanation:
          text: |
            These logs are in CloudWatch Logs, not in an S3 bucket, so an S3 lifecycle rule doesn't
            reach them. Archiving would also keep them forever.
      - id: turn-off-logging
        text: Remove the function's permission to write logs
        variants:
          - text: Take away the function's permission to write logs
          - text: Stop the function from writing logs by removing its permission
        explanation:
          text: |
            That would also remove the logs the team needs. Security wants logging on; the fix is
            how long the logs are kept.
      - id: rebuild-function
        text: Delete the function and create it again each month
        variants:
          - text: Rebuild the function from scratch every month
          - text: Recreate the function once a month after deleting it
        explanation:
          text: |
            Deleting a function doesn't delete its log group, and a monthly rebuild is far more work
            than a setting.
    correct_answers: [retention-setting]
    explanation:
      text: |
        CloudWatch Logs keeps a log group's events until you set a retention period. Setting one,
        such as 30 days, deletes older events automatically, which applies best practice COST04-BP05,
        enforce data retention policies. In the bakery's review it takes five minutes and stops a
        slow rise in the bill.

  - id: q14-when-to-commit-reserved
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Savings Plans or Reserved Instances: what follows your usage?"
    task: "4.1"
    level: application
    topics: [cost-optimization, reserved-instances, savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A shop is about to double its web servers for reliability, and plans to test whether its
        site runs well on Graviton-based instances. The owner wants to buy 1-year Standard Reserved
        Instances for the servers today. What should the review advise?
    choices:
      - id: buy-now
        text: Buy them today, since a commitment saves money from the first hour
        variants:
          - text: Buy them now, as a commitment saves from the very first hour
          - text: Purchase them today, because savings start at the first hour
        explanation:
          text: |
            Savings start at once only if the commitment matches what runs. Here the design and
            maybe the instance family are about to change.
      - id: wait-for-steady
        text: Wait until the redesign and test settle, then commit to what runs
        variants:
          - text: Commit only after the redesign and test, once the floor is steady
          - text: Hold off until the redesign and test are done, then commit
        explanation:
          text: |
            Correct. A Standard Reserved Instance is tied to its instance family, so an early one
            could pay for servers that no longer match what runs.
      - id: never-commit
        text: Never commit, since a small shop's servers change too often
        variants:
          - text: Don't commit at all, as a small shop's servers change too much
          - text: Avoid commitments, because small shops change servers too often
        explanation:
          text: |
            Once a month of data shows a steady floor of servers, committing to it is the right
            move. The issue is timing, not commitments as such.
      - id: spot-instead
        text: Run the web servers on Spot Instances instead of committing
        variants:
          - text: Move the web servers to Spot Instances in place of a commitment
          - text: Use Spot Instances for the web servers rather than committing
        explanation:
          text: |
            AWS can reclaim Spot capacity at short notice, which would undo the reliability fix for
            a site that must stay up.
    correct_answers: [wait-for-steady]
    hint:
      text: A commitment pays off only if it matches what will actually run for the year.
    explanation:
      text: |
        Commit only after the design stops changing. The bakery's review waits a month: the
        redesign doubles the servers, and a test may move them to Graviton. A Standard Reserved
        Instance is tied to its instance family, while a Compute Savings Plan would follow such a
        change. Once the floor of servers is steady, a commitment saves money on it (best practice
        COST07-BP01, perform pricing model analysis).

  # ---------------------------------------------------------------------------------------------
  # Lab 18, Record the bakery's review in the AWS Well-Architected Tool
  # ---------------------------------------------------------------------------------------------

  - id: q14-wa-tool-charge
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "The Framework is guidance; the Well-Architected Tool applies it"
    task: "1.2"
    level: recall
    topics: [well-architected-tool]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A two-person startup on the Basic Support plan wants to record a Well-Architected review of
        its app in the AWS Well-Architected Tool. What does using the Tool cost?
    choices:
      - id: per-workload-fee
        text: A monthly fee for each workload defined
        variants:
          - text: A fee each month for every workload
          - text: A monthly charge per workload in the Tool
        explanation:
          text: |
            A workload in the Tool is a record of answers, not a running resource, and AWS doesn't
            charge for it.
      - id: paid-support-needed
        text: The fee of a paid Support plan, which it requires
        variants:
          - text: A paid Support plan's fee, since it needs one
          - text: The cost of the paid Support plan it requires
        explanation:
          text: |
            The Tool works on Basic. The separate AWS Well-Architected Agent, in preview, is the one
            AWS says needs Business Support+ or higher (as of 2026-10-24).
      - id: no-charge
        text: No additional charge for the Tool itself
        variants:
          - text: Nothing extra; the Tool itself has no charge
          - text: The Tool itself carries no additional charge
        explanation:
          text: |
            Correct. AWS says the Tool has no additional charge; you pay only for the resources your
            workload uses.
      - id: per-milestone-fee
        text: A fee for each milestone saved
        variants:
          - text: A charge for every milestone saved
          - text: A fee per saved milestone
        explanation:
          text: |
            Milestones are saved snapshots of the review, and saving one costs nothing.
    correct_answers: [no-charge]
    explanation:
      text: |
        The AWS Well-Architected Tool has no additional charge; you pay only for the AWS resources
        your workload itself uses (checked 2026-10-24). That's why Lab 18 costs $0 even on a Paid
        plan: a workload in the Tool is a written description and your answers, and nothing is built
        or run.

  - id: q14-milestone-to-show-progress
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "The Framework is guidance; the Well-Architected Tool applies it"
    task: "1.2"
    level: application
    topics: [well-architected-tool, milestones]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team has just finished its first review of a workload in the AWS Well-Architected Tool. It
        will fix risks over the next quarter and wants to show then how far it has come. What should
        it do in the Tool today?
    choices:
      - id: save-milestone
        text: Save a milestone of the review
        variants:
          - text: Save the review as a milestone
          - text: Record a milestone of the review
        explanation:
          text: |
            Correct. A milestone is a snapshot of the review that can't be changed, so next
            quarter's answers can be compared with it.
      - id: add-lens
        text: Apply a second lens to the workload
        variants:
          - text: Add another lens to the workload
          - text: Put a second lens on the workload
        explanation:
          text: |
            A lens adds a set of questions for a kind of workload. It doesn't keep a record of
            today's answers.
      - id: date-tag
        text: Tag the workload with today's date
        variants:
          - text: Add a tag with today's date to the workload
          - text: Put today's date on the workload as a tag
        explanation:
          text: |
            A tag labels the workload, but the answers keep changing as the team updates them.
            Nothing keeps today's version.
      - id: trusted-advisor
        text: Turn on AWS Trusted Advisor for the workload
        variants:
          - text: Activate AWS Trusted Advisor on the workload
          - text: Switch on AWS Trusted Advisor for the workload
        explanation:
          text: |
            Trusted Advisor runs automatic checks on resources. It doesn't freeze the review's
            answers for a later comparison.
    correct_answers: [save-milestone]
    explanation:
      text: |
        A milestone saves the state of a review at a point in time, and a saved milestone can't be
        changed. After the team fixes risks and updates its answers, the workload's counts drop
        while the milestone's stay, which is how a team proves progress. Deleting the workload
        deletes its milestones too.

  - id: q14-tool-records-what-you-tell-it
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: "The Framework is guidance; the Well-Architected Tool applies it"
    task: "1.2"
    level: understanding
    topics: [well-architected-tool]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager reads a workload's risk counts in the AWS Well-Architected Tool and assumes the
        Tool found them itself. Which statement describes where the Tool's risks come from?
    choices:
      - id: from-answers
        text: It works them out from the answers the team records
        variants:
          - text: It derives them from the answers the team enters
          - text: It calculates them from the team's recorded answers
        explanation:
          text: |
            Correct. The Tool records what the team tells it, so its list is only as honest as the
            answers and the evidence in the Notes.
      - id: scans-resources
        text: It reads the account's resources and finds the gaps itself
        variants:
          - text: It inspects the account's resources and spots the gaps
          - text: It examines what runs in the account and finds the gaps
        explanation:
          text: |
            The Tool doesn't inspect the account. A separate preview service, the AWS
            Well-Architected Agent, is the one that scans deployed resources.
      - id: from-cloudtrail
        text: It reads CloudTrail logs to answer the questions
        variants:
          - text: It answers the questions from CloudTrail logs
          - text: It uses CloudTrail logs to fill in the answers
        explanation:
          text: |
            The Tool doesn't read CloudTrail. People answer the questions, from evidence they
            gather.
      - id: aws-reviewers
        text: AWS staff review the workload and enter them
        variants:
          - text: AWS staff examine the workload and record them
          - text: They're entered by AWS staff who review the workload
        explanation:
          text: |
            Anyone can run a self-review in the Tool. AWS staff aren't involved unless the business
            asks for help, such as through Enterprise Support or a partner.
    correct_answers: [from-answers]
    explanation:
      text: |
        The AWS Well-Architected Tool doesn't inspect your account; it records the answers you give
        to the Framework's questions and works out the risks from the best practices you leave
        missing. That's why Lab 18 asks for evidence in each question's Notes: the Tool's list is
        only as honest as what you tell it.

  # ---------------------------------------------------------------------------------------------
  # Lab 19, Close out the account you used for the course
  # ---------------------------------------------------------------------------------------------

  - id: q14-find-tagged-leftovers
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part A: sweep every Region by tag"
    task: "4.2"
    level: recall
    topics: [close-out, tag-editor]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A trainer tagged everything her workshop created with `project` = `workshop`. Before the
        next class, she wants a list of every resource still carrying that tag, in any AWS Region.
        Which tool does that?
    choices:
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: The AWS Trusted Advisor checks
          - text: Trusted Advisor, from AWS
        explanation:
          text: |
            Trusted Advisor runs checks for cost, security and limits. It doesn't list resources by
            tag.
      - id: artifact
        text: AWS Artifact
        variants:
          - text: The AWS Artifact portal
          - text: Artifact, from AWS
        explanation:
          text: |
            AWS Artifact holds AWS's compliance reports and agreements. It knows nothing about the
            trainer's resources.
      - id: budgets
        text: AWS Budgets
        variants:
          - text: The AWS Budgets service
          - text: Budgets, from AWS
        explanation:
          text: |
            Budgets alerts on spending. It doesn't search for resources.
      - id: tag-editor
        text: Tag Editor in AWS Resource Groups
        variants:
          - text: Resource Groups Tag Editor
          - text: AWS Resource Groups Tag Editor
        explanation:
          text: |
            Correct. Tag Editor searches for resources by tag, and with **All regions** chosen it
            covers every Region at once.
    correct_answers: [tag-editor]
    explanation:
      text: |
        Tag Editor, part of AWS Resource Groups, finds resources by tag key and value. With **All
        regions** and **All resource types** chosen, one search covers the whole account, which is
        how Lab 19 sweeps for anything tagged `guide` = `clf`. It only finds and edits tags; you
        delete what it finds in each service's own console (as of 2026-10-24, tag management is
        moving to the AWS Resource Explorer console).

  - id: q14-empty-tag-search-misses-select-two
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part B: check what tags can't find"
    task: "4.2"
    level: understanding
    topics: [close-out, tag-editor]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A learner's Tag Editor search across all Regions for the tag key `lab` comes back empty.
        Which two reasons could still leave leftovers in the account? (Select TWO.)
    choices:
      - id: unsupported-type
        text: Some resource types aren't supported by Tag Editor
        variants:
          - text: Tag Editor doesn't support some resource types
          - text: Some kinds of resource are outside what Tag Editor supports
        explanation:
          text: |
            Correct. A tag search finds only types Tag Editor supports; the lab checks the others,
            such as roles and log groups, by name in each service.
      - id: one-region-only
        text: Tag Editor searches the current Region and no other
        variants:
          - text: A Tag Editor search covers the current Region alone
          - text: Tag Editor looks in the console's current Region alone
        explanation:
          text: |
            Tag Editor offers **All regions**, which the learner chose. The Region isn't the gap.
      - id: case-differs
        text: A resource was tagged `Lab`, with a capital letter
        variants:
          - text: A resource carries the key `Lab`, capitalized
          - text: One resource's key was typed as `Lab`
        explanation:
          text: |
            Correct. Tag keys are case sensitive, so a search for `lab` misses `Lab`. The lab log
            shows whether anyone typed it that way.
      - id: stopped-hidden
        text: Tag Editor hides resources that are stopped
        variants:
          - text: Stopped resources don't appear in Tag Editor
          - text: Tag Editor leaves stopped resources out
        explanation:
          text: |
            A tag search doesn't care whether a resource is running. A stopped resource with the
            tag still shows up.
      - id: ninety-days
        text: Tag Editor drops resources older than 90 days
        variants:
          - text: Resources older than 90 days drop out of Tag Editor
          - text: Tag Editor leaves out resources over 90 days old
        explanation:
          text: |
            Tag Editor has no such window. The 90-day limit belongs to CloudTrail Event history.
    correct_answers: [unsupported-type, case-differs]
    explanation:
      text: |
        A tag search finds only resources that carry the exact tag and whose type Tag Editor
        supports. Tag keys are case sensitive, and some types, such as IAM roles and CloudWatch Logs
        log groups, aren't supported in Tag Editor (as of 2026-10-24). So Lab 19 also checks those
        services by name, and reads the bill, which sees every Region and service.

  - id: q14-charge-in-unknown-region
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part C: read the bill and the credits"
    task: "4.2"
    level: application
    topics: [close-out, billing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        On the **Bills** page, a learner expands a service's charges by Region and sees a small
        Amazon EC2 charge in a Region she doesn't remember using. What should she do next?
    choices:
      - id: ignore-credits
        text: Ignore it, because her credits pay for small charges
        variants:
          - text: Leave it alone, since credits cover small charges
          - text: Do nothing, as her credits pay for small amounts
        explanation:
          text: |
            Credits hide the cost, but the resource keeps running and using them up. A charge she
            doesn't recognize is a lead to follow.
      - id: go-find-it
        text: Go to that Region, find the resource, and delete it
        variants:
          - text: Switch to that Region and delete the resource there
          - text: Open that Region, locate the resource, and delete it
        explanation:
          text: |
            Correct. The bill shows which service and Region to look in; the resource is deleted in
            that Region's console.
      - id: ask-support
        text: Ask AWS Support to delete the resource for her
        variants:
          - text: Have AWS Support delete the resource for her
          - text: Request that AWS Support remove the resource
        explanation:
          text: |
            AWS Support can explain a charge, but it doesn't delete resources in a customer's
            account. That's the customer's job.
      - id: new-budget
        text: Create a budget for that Region, then wait a month
        variants:
          - text: Set up a budget for that Region and wait a month
          - text: Add a budget for that Region, then wait for a month
        explanation:
          text: |
            A budget alerts on spending; it doesn't stop the resource. Waiting lets the charge
            grow.
    correct_answers: [go-find-it]
    hint:
      text: The bill already tells her which service and which Region to look in.
    explanation:
      text: |
        The bill sees every Region and service, tagged or not, so it catches what a tag search
        misses. A service or Region you don't recognize is the lead: go to that Region, find the
        resource in the service's console, and delete it. Then check the bill again the next day.

  - id: q14-keep-the-guardrails
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part D: review your guardrails, and keep them"
    task: "4.2"
    level: application
    topics: [close-out, guardrails]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A learner finishing a course plans to close her AWS account next month. During her
        close-out sweep, which of these should she keep?
    choices:
      - id: lab-role
        text: The execution role a lab's Lambda function used
        variants:
          - text: A lab's Lambda function execution role
          - text: The role a lab's Lambda function ran with
        explanation:
          text: |
            A lab made it, so it goes, with that lab's cleanup steps. Roles can't be found by tag,
            so it's checked by name.
      - id: lab-vpc
        text: The VPC a lab built, with its subnets
        variants:
          - text: A lab's VPC and its subnets
          - text: The lab-built VPC and its subnets
        explanation:
          text: |
            A lab made it, so it goes. The default VPC is the one that stays, because it belongs to
            the account.
      - id: budgets-and-alarm
        text: The zero-spend budget and the billing alarm
        variants:
          - text: The billing alarm and the zero-spend budget
          - text: Her zero-spend budget and billing alarm
        explanation:
          text: |
            Correct. Guardrails cost nothing and watch the account until its last bill, so they stay
            whether she keeps or closes the account.
      - id: lab-log-group
        text: The log group a lab's function wrote to
        variants:
          - text: A lab function's CloudWatch Logs log group
          - text: The log group that a lab's function filled
        explanation:
          text: |
            A lab made it, so it goes. A log group that is left keeps its logs, and their storage,
            until it is deleted.
    correct_answers: [budgets-and-alarm]
    explanation:
      text: |
        A close-out deletes what the labs made and keeps the guardrails: budgets, the billing alarm,
        the anomaly monitor, the access analyzer and the admin user. They cost nothing and watch the
        account until its last bill, so they go only when the account itself goes.

  - id: q14-check-bill-next-day
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part E: the next day"
    task: "4.2"
    level: understanding
    topics: [close-out, billing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After deleting every leftover she found, a learner checks her credit balance on the **Bills**
        and **Credits** pages. Why does the close-out ask her to check again the next day?
    choices:
      - id: refund-next-day
        text: AWS refunds the deleted resources' charges on the next day
        variants:
          - text: The deleted resources' charges are refunded a day later
          - text: A day later, AWS refunds what the deleted resources cost
        explanation:
          text: |
            Deleting a resource stops future charges; it doesn't refund past ones.
      - id: bill-lags
        text: The bill lags about a day, so a missed resource shows then
        variants:
          - text: Billing runs a day behind, so a leftover shows up then
          - text: The bill is a day late, so a missed resource appears then
        explanation:
          text: |
            Correct. If the balance keeps falling after a day, something is still running, and the
            sweep is repeated for that service and Region.
      - id: tag-editor-delay
        text: Tag Editor needs a day to list newly tagged resources
        variants:
          - text: Newly tagged resources take a day to appear in Tag Editor
          - text: Tag Editor lists new tags only after a day
        explanation:
          text: |
            The next-day check reads the bill, not Tag Editor. The bill is the net that sees every
            Region and service.
      - id: plan-ends
        text: The Free plan ends the day after a close-out
        variants:
          - text: A close-out ends the Free plan the following day
          - text: The day after a close-out, the Free plan stops
        explanation:
          text: |
            A close-out doesn't change the plan. The Free plan ends on its own date, which the
            learner keeps in her calendar.
    correct_answers: [bill-lags]
    explanation:
      text: |
        The bill sees every Region and service, but it runs about a day behind. Comparing the credit
        balance, or the month-to-date total, a day apart shows whether anything is still running: the
        same number, or a few cents as yesterday's usage arrives, means the sweep worked. This is
        best practice COST01-BP06, monitor cost proactively.

flashcards:

  # ---------------------------------------------------------------------------------------------
  # Lesson 14.01, The capstone review
  # ---------------------------------------------------------------------------------------------

  - id: c14-standard-ri-vs-compute-savings-plan
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Savings Plans or Reserved Instances: what follows your usage?"
    level: understanding
    topics: [reserved-instances, savings-plans]
    front:
      text: Why buy a Standard Reserved Instance only after testing a move to Graviton?
    back:
      text: |
        A Standard RI is tied to its instance family, so a move to Graviton would leave it
        unmatched. A Compute Savings Plan would follow the change.

  # ---------------------------------------------------------------------------------------------
  # Labs 18 and 19
  # ---------------------------------------------------------------------------------------------

  - id: c14-search-tag-key-alone
    page: guide/14-capstone/03-lab-19-close-out.md
    section: "Part A: sweep every Region by tag"
    level: understanding
    topics: [close-out, tag-editor]
    front:
      text: In a close-out, why search Tag Editor for the key `lab` with no value?
    back:
      text: |
        The value box is optional, so the search finds anything tagged `lab`, whatever its value,
        including a resource whose `guide` tag was mistyped.
