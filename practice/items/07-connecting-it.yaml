        The VPC itself, its subnets and route tables, the internet gateway and gateway endpoints have no
        charge. NAT gateways, public IPv4 addresses (including idle Elastic IP addresses) and interface
        endpoints bill by the hour. That is why the guide's Lab 09 builds a VPC with an internet gateway
        but no NAT gateway and no Elastic IP address.

  - id: q07-network-design-customer
    revision: 2
    page: guide/07-connecting-it/01-your-own-network.md
    section: "Summary"
    task: "2.1"
    level: application
    topics: [shared-responsibility, amazon-vpc]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An audit finds that a clinic's patient database runs on an EC2 instance with a public IPv4
        address, in a subnet whose route table sends `0.0.0.0/0` to an internet gateway. Who must fix
        this, and why?
    choices:
      - id: aws-runs-gateway
        text: AWS, because it runs the internet gateway that the route points to
        variants:
          - text: AWS, since the route's target is an internet gateway that AWS runs
          - text: AWS, as the internet gateway in that route is operated by AWS
        explanation:
          text: AWS does run the gateway, but the clinic chose to route its subnet to it and to give the database a public address.
      - id: customer-designs
        text: The clinic, because it designs its own subnets, routes and addresses
        variants:
          - text: The clinic, since its subnets, routes and addresses are its own design
          - text: The clinic, as it lays out the subnets, routes and addresses itself
        explanation:
          text: Correct. Which subnets are public and which servers get public addresses are the customer's choices, so this exposure is the customer's mistake.
      - id: customer-physical
        text: The clinic, because it maintains the physical network in its Region
        variants:
          - text: The clinic, since the Region's physical network is its to maintain
          - text: The clinic, as it looks after the network hardware in its Region
        explanation:
          text: The clinic is responsible, but not for this reason. AWS runs the physical network; the customer designs the network inside its VPC.
      - id: aws-isolation
        text: AWS, because it keeps each customer's VPC isolated from the others
        variants:
          - text: AWS, since isolating each customer's VPC from the rest is its job
          - text: AWS, as it keeps every customer's VPC separate from the others
        explanation:
          text: AWS does isolate VPCs from other customers, but that doesn't decide what a customer exposes to the internet from its own VPC.
    correct_answers: [customer-designs]
    hint:
      text: Who chose the route and the public address?
    explanation:
      text: |
        AWS runs the physical network, keeps each VPC isolated from other customers, and runs gateways
        and endpoints as highly available services. The customer designs the network inside the VPC:
        address ranges, which subnets are public, routes, gateways, endpoints and which servers get
        public addresses. A database in a public subnet with a public address is the customer's mistake.

  - id: q07-lab-gateway-attached-not-public
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A subnet is public because of its route, not because of its addresses"
    task: "3.5"
    level: application
    topics: [subnets, internet-gateway, route-tables]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A learner creates a VPC with two subnets, creates an internet gateway and attaches it to the VPC.
        Neither subnet's route table has been changed. Which statement about the two subnets is correct?
    choices:
      - id: both-public
        text: Both subnets are now public, because the gateway is attached to their VPC
        variants:
          - text: The two subnets became public when the gateway was attached
          - text: Attaching the gateway made both subnets in the VPC public
        explanation:
          text: Attaching the gateway gives the VPC a door, but no subnet sends traffic to it yet.
      - id: first-public
        text: The first subnet created is public, and the second is private
        variants:
          - text: The earlier subnet is public and the later one is private
          - text: Only the subnet created first has become public
        explanation:
          text: The order of creation has no effect. Each subnet's route table decides.
      - id: neither-public
        text: Neither subnet is public yet, because no route table sends traffic to the gateway
        variants:
          - text: Both subnets are still private, since no route points at the gateway
          - text: Neither is public until a route table sends traffic to the gateway
        explanation:
          text: Correct. A subnet becomes public only when its route table has a route to the internet gateway.
      - id: public-with-ips
        text: Both subnets are public as soon as an instance with a public address launches in them
        variants:
          - text: Each subnet turns public when an instance with a public address starts in it
          - text: A subnet becomes public once it holds an instance with a public address
        explanation:
          text: Public addresses don't make a subnet public. Without a route to the gateway, those instances can't reach the internet.
    correct_answers: [neither-public]
    hint:
      text: The gateway is in place. What still has to point at it?
    explanation:
      text: |
        An attached internet gateway does nothing until a route table sends traffic to it. In the lab, a
        new route table with `0.0.0.0/0` pointing at the gateway is associated with one subnet only, and
        that subnet becomes public; the other stays with the main route table, which has only the local
        route.

  # ---------------------------------------------------------------------------------------------
  # Lesson 07.02, Filtering traffic
  # ---------------------------------------------------------------------------------------------

  - id: q07-sg-rule-kinds
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: recall
    topics: [security-groups]
    type: multiple_choice
    selection: single
    prompt:
      text: Which kinds of rule can a security group contain?
    choices:
      - id: allow-only
        text: Allow rules only
        variants:
          - text: Only allow rules
          - text: Allow rules alone
        explanation:
          text: Correct. Anything no rule allows is refused, so there is no need, and no way, to write a deny.
      - id: deny-only
        text: Deny rules only
        variants:
          - text: Only deny rules
          - text: Deny rules alone
        explanation:
          text: This reverses it. A security group starts by refusing everything, and its rules add what is allowed.
      - id: allow-and-deny
        text: Both allow and deny rules
        variants:
          - text: Allow rules and deny rules
          - text: Deny and allow rules
        explanation:
          text: That describes a network ACL. Security groups can't deny.
      - id: numbered-allow-deny
        text: Numbered allow and deny rules
        variants:
          - text: Allow and deny rules, each numbered
          - text: Allow and deny, by number
        explanation:
          text: Numbered allow and deny rules, checked in order, belong to network ACLs.
    correct_answers: [allow-only]
    explanation:
      text: |
        A security group holds allow rules only, and all of them count together: if any rule allows
        the traffic, it passes, and anything else is refused. Because it can't deny, a security group
        can't block one bad address while letting everyone else in; that job belongs to a network ACL.

  - id: q07-sg-two-traits
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: recall
    topics: [security-groups]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements describe security groups in a VPC? (Select TWO.)
    choices:
      - id: deny-rules
        text: They can deny traffic from a specific address range
        variants:
          - text: They can deny one particular range of addresses
          - text: Their rules can deny a chosen address range
        explanation:
          text: Security groups have allow rules only. Denying a range takes a network ACL.
      - id: stateful
        text: Replies to allowed requests pass without a rule of their own
        variants:
          - text: A reply to an allowed request is let through automatically
          - text: They let replies to allowed traffic through on their own
        explanation:
          text: "Correct. Security groups are stateful: they remember each conversation."
      - id: number-order
        text: Their rules are checked in number order, and the first match decides
        variants:
          - text: The lowest-numbered matching rule decides what happens
          - text: Rules run from the lowest number up, and the first match wins
        explanation:
          text: Numbered rules with first match belong to network ACLs. A security group's rules all count together.
      - id: sg-source
        text: A rule's source can be another security group
        variants:
          - text: A rule can name another security group as its source
          - text: Another security group can be used as a rule's source
        explanation:
          text: Correct. The rule then covers whatever resources carry that group.
      - id: subnet-wide
        text: They apply to all traffic crossing a subnet's edge
        variants:
          - text: They filter everything entering or leaving a subnet
          - text: They guard a whole subnet at its boundary
        explanation:
          text: That is a network ACL. A security group guards the resources it is attached to.
    correct_answers: [stateful, sg-source]
    explanation:
      text: |
        A security group is a stateful firewall around a resource, with allow rules only, all checked
        together. Replies to traffic it allowed pass automatically, and a rule can name another security
        group as its source. Deny rules, numbered first-match rules and subnet-wide filtering are network
        ACL traits.

  - id: q07-new-sg-starting-rules
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: recall
    topics: [security-groups]
    type: multiple_choice
    selection: single
    prompt:
      text: An administrator creates a new security group and adds no rules. What does it allow?
    choices:
      - id: everything
        text: All inbound traffic and all outbound traffic
        variants:
          - text: Everything in and everything out
          - text: Every inbound and every outbound connection
        explanation:
          text: That is the default network ACL, not a new security group.
      - id: nothing
        text: No inbound traffic and no outbound traffic
        variants:
          - text: Nothing in and nothing out
          - text: No connection in either direction
        explanation:
          text: A new security group does come with one rule, which lets all outbound traffic out.
      - id: in-not-out
        text: All inbound traffic, but no outbound traffic
        variants:
          - text: Everything in, but nothing out
          - text: Every inbound connection, but no outbound one
        explanation:
          text: This reverses the defaults.
      - id: out-not-in
        text: No inbound traffic, but all outbound traffic
        variants:
          - text: Nothing in, but everything out
          - text: No inbound connection, but every outbound one
        explanation:
          text: Correct. A new security group has no inbound rules and one outbound rule allowing everything.
    correct_answers: [out-not-in]
    explanation:
      text: |
        A new security group has no inbound rules, so nothing gets in, and one outbound rule that lets
        everything out. You add inbound rules for exactly the traffic a resource needs. Don't confuse it
        with network ACLs: the VPC's default network ACL allows everything, and a new custom one denies
        everything.

  - id: q07-db-sg-source-web-sg
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: application
    topics: [security-groups]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's web servers run in an Auto Scaling group, so servers and their IP addresses change
        often. The database must accept connections on its port only from those web servers. Which
        inbound rule on the database's security group meets the need with the least upkeep?
    choices:
      - id: source-web-sg
        text: Allow the database port from the web servers' security group
        variants:
          - text: Allow the database port with the web servers' security group as source
          - text: Allow the database port from the group that the web servers carry
        explanation:
          text: Correct. The rule covers every server carrying that group, today's and tomorrow's, with no edits.
      - id: source-ip-list
        text: Allow the database port from each web server's current IP address
        variants:
          - text: Allow the database port from the web servers' present IP addresses
          - text: Allow the database port from a list of today's web server addresses
        explanation:
          text: The list goes out of date each time Auto Scaling replaces a server, and someone has to keep editing it.
      - id: source-anywhere
        text: Allow the database port from `0.0.0.0/0`, the whole internet
        variants:
          - text: Allow the database port from any address, `0.0.0.0/0`
          - text: Allow the database port from every address on the internet
        explanation:
          text: That lets anyone who can reach the database try to connect, far wider than needed.
      - id: deny-others
        text: Deny the database port from every source except the web servers
        variants:
          - text: Deny the database port to all sources other than the web servers
          - text: Deny the database port from any source but the web servers
        explanation:
          text: Security groups have no deny rules, so this rule can't be written.
    correct_answers: [source-web-sg]
    hint:
      text: A rule's source doesn't have to be an address range.
    explanation:
      text: |
        A security group rule can name another security group as its source, meaning "anything attached
        to that group". When Auto Scaling launches a new web server with the web servers' group, the
        database accepts it at once, and a terminated server stops counting. A list of addresses would
        need constant edits.

  - id: q07-block-range-api
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A network ACL checks every packet entering or leaving a subnet, in number order"
    task: "3.5"
    level: application
    topics: [network-acls]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's login servers sit in a public subnet. Thousands of password-guessing attempts arrive
        from one address range, while all other users must still reach the servers. What should the
        company change in its VPC?
    choices:
      - id: sg-deny
        text: Add a rule denying the range to the servers' security group
        variants:
          - text: Put a deny rule for the range on the servers' security group
          - text: Give the servers' security group a rule that denies the range
        explanation:
          text: Security groups have no deny rules, so this can't be done.
      - id: nacl-deny-low
        text: Add a deny rule for the range to the subnet's network ACL
        variants:
          - text: Deny the range with a rule in the subnet's network ACL
          - text: Put a rule denying the range in the subnet's network ACL
        explanation:
          text: Correct. Only a network ACL can deny. Give the rule a lower number than the allow rule, so it matches first.
      - id: inspector
        text: Turn on Amazon Inspector for the login servers
        variants:
          - text: Enable Amazon Inspector on the login servers
          - text: Have Amazon Inspector scan the login servers
        explanation:
          text: Inspector reports vulnerabilities and unintended network exposure. It blocks nothing.
      - id: remove-https
        text: Remove the security group rule that allows HTTPS from anywhere
        variants:
          - text: Delete the security group's HTTPS rule for all addresses
          - text: Take away the rule letting HTTPS in from anywhere
        explanation:
          text: That would lock out every user, not only the attackers.
    correct_answers: [nacl-deny-low]
    hint:
      text: Which of the two VPC filters can say "no" to a specific range?
    explanation:
      text: |
        Network ACLs have allow and deny rules, checked from the lowest number up, with the first match
        deciding. A deny rule for the range, numbered below the rule that allows the login traffic,
        stops the attackers at the subnet's edge while everyone else still matches the allow rule.
        Security groups can't deny.

  - id: q07-nacl-deny-renumber
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A network ACL checks every packet entering or leaving a subnet, in number order"
    task: "3.5"
    level: application
    topics: [network-acls]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An engineer added a deny rule for a bad address range to a network ACL as rule 150. Rule 100,
        above it, allows HTTPS from anywhere. Requests from the bad range still arrive. Which change makes
        the block work?
    choices:
      - id: renumber-lower
        text: Give the deny rule a number lower than 100
        variants:
          - text: Renumber the deny rule below 100
          - text: Move the deny rule to a number under 100
        explanation:
          text: Correct. Then the deny matches first and the allow is never reached for that range.
      - id: renumber-higher
        text: Give the deny rule a number higher than 150
        variants:
          - text: Renumber the deny rule above 150
          - text: Move the deny rule to a number over 150
        explanation:
          text: A higher number is checked even later, so rule 100 still matches first.
      - id: add-sg-deny
        text: Copy the deny rule into the security group
        variants:
          - text: Repeat the deny rule in the security group
          - text: Add the same deny rule to the security group
        explanation:
          text: Security groups can't hold deny rules.
      - id: add-second-allow
        text: Add a second allow rule numbered 200
        variants:
          - text: Create another allow rule as rule 200
          - text: Put an extra allow rule at number 200
        explanation:
          text: Another allow lets more in, not less, and it would be checked after rule 100 anyway.
    correct_answers: [renumber-lower]
    explanation:
      text: |
        In a network ACL, the first matching rule by number decides. A deny rule must have a lower number
        than the allow rule it carves an exception from; otherwise the allow matches first and the deny
        is never reached. AWS suggests numbering rules in steps of 10 or 100 to leave room for rules like
        this one.

  - id: q07-nacl-starting-states
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A network ACL checks every packet entering or leaving a subnet, in number order"
    task: "3.5"
    level: recall
    topics: [network-acls]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements about network ACLs, before anyone adds rules, are correct? (Select TWO.)
    choices:
      - id: default-allows-all
        text: A VPC's default network ACL allows all inbound and outbound traffic
        variants:
          - text: The default network ACL of a VPC lets all traffic in and out
          - text: All traffic in and out is allowed by a VPC's default network ACL
        explanation:
          text: Correct. That is why the network ACL layer does nothing until you change it.
      - id: default-denies-all
        text: A VPC's default network ACL denies all inbound and outbound traffic
        variants:
          - text: The default network ACL of a VPC blocks all traffic in and out
          - text: All traffic in and out is denied by a VPC's default network ACL
        explanation:
          text: This reverses the default. A new custom network ACL is the one that denies everything.
      - id: custom-denies-all
        text: A new custom network ACL denies all traffic until rules are added
        variants:
          - text: A newly created custom network ACL blocks everything until you add rules
          - text: Until you add rules, a new custom network ACL denies all traffic
        explanation:
          text: Correct. It has only the catch-all `*` rule, which denies.
      - id: custom-allows-all
        text: A new custom network ACL allows all traffic until rules are added
        variants:
          - text: A newly created custom network ACL lets everything through until you add rules
          - text: Until you add rules, a new custom network ACL allows all traffic
        explanation:
          text: This reverses it. A new custom network ACL starts by denying everything.
      - id: subnet-needs-custom
        text: A subnet carries no traffic until a custom network ACL is attached
        variants:
          - text: No traffic flows in a subnet until it gets a custom network ACL
          - text: Each subnet needs a custom network ACL before it carries traffic
        explanation:
          text: Every subnet uses the default network ACL, which allows everything, until you choose another.
    correct_answers: [default-allows-all, custom-denies-all]
    explanation:
      text: |
        A VPC's default network ACL allows all traffic in and out, and every subnet uses it until you
        choose another, so the network ACL layer has no effect at first. A custom network ACL you create
        starts the other way: it denies everything, through its catch-all `*` rule, until you add rules.

  - id: q07-sg-replies-no-outbound
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: understanding
    topics: [security-groups, stateful-stateless]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A web server's security group allows HTTPS in from anywhere, and an administrator deletes all of
        its outbound rules. The subnet uses the VPC's default network ACL. What happens when a customer
        requests a page?
    choices:
      - id: reply-blocked-sg
        text: The request arrives, but the security group then blocks the server's reply
        variants:
          - text: The page request gets in, and then the security group drops the server's answer
          - text: The request is allowed, but the server's reply is stopped by the security group
        explanation:
          text: Outbound rules control connections the server starts. Replies to allowed requests pass regardless.
      - id: request-blocked
        text: The request never arrives, because outbound rules are missing
        variants:
          - text: The request is refused, since there are no outbound rules
          - text: The request is dropped, because nothing is allowed out
        explanation:
          text: Inbound rules decide whether a request gets in, and this one allows HTTPS.
      - id: page-loads
        text: The page loads, because the security group lets replies out on its own
        variants:
          - text: The customer gets the page, since replies pass the security group automatically
          - text: It works, because the security group allows the reply without a rule
        explanation:
          text: Correct. The security group is stateful, and the default network ACL allows everything.
      - id: nacl-blocks
        text: The page fails, because network ACLs block every reply
        variants:
          - text: It fails, since a network ACL drops all replies
          - text: The customer gets nothing, as network ACLs stop replies
        explanation:
          text: A network ACL checks replies against its rules, and the default network ACL allows all traffic.
    correct_answers: [page-loads]
    explanation:
      text: |
        A security group is stateful: when it allows a request in, it lets the reply out whatever its
        outbound rules say. Its outbound rules matter only for connections the server itself starts.
        Here the default network ACL allows all traffic too, so nothing stops the reply.

  - id: q07-custom-nacl-no-outbound
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "\"Return traffic always gets through\" is wrong"
    task: "3.5"
    level: application
    topics: [network-acls, stateful-stateless]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team swaps a subnet's default network ACL for a new custom one. It adds one inbound rule
        allowing HTTPS from anywhere and no outbound rules. The web server's security group is unchanged.
        Customers now report the site is down, though the server's logs show their requests arriving.
        What is the cause?
    choices:
      - id: replies-dropped-nacl
        text: The network ACL's catch-all rule drops the replies leaving the subnet
        variants:
          - text: Replies leaving the subnet are dropped by the network ACL's catch-all rule
          - text: The network ACL's `*` rule stops the server's replies at the subnet's edge
        explanation:
          text: Correct. A network ACL is stateless, so replies need an outbound rule for the customers' high-numbered ports.
      - id: sg-blocks-replies
        text: The security group needs a new outbound rule to let the replies leave
        variants:
          - text: A new outbound security group rule is needed before replies can leave
          - text: The replies need an outbound rule of their own in the security group
        explanation:
          text: The security group is stateful and lets replies out on its own. It was never the problem.
      - id: requests-blocked
        text: The network ACL blocks the requests before they reach the server
        variants:
          - text: The requests are stopped by the network ACL before reaching the server
          - text: The network ACL drops the requests on their way to the server
        explanation:
          text: The logs show requests arriving, and the inbound rule allows HTTPS. The trouble is on the way back.
      - id: igw-route-removed
        text: Changing the network ACL removed the subnet's route to the internet gateway
        variants:
          - text: The subnet lost its internet gateway route when the network ACL changed
          - text: Swapping the network ACL deleted the route to the internet gateway
        explanation:
          text: Network ACLs and route tables are separate. Changing one doesn't touch the other.
    correct_answers: [replies-dropped-nacl]
    hint:
      text: The requests get in. Follow the reply back out.
    explanation:
      text: |
        A new custom network ACL denies everything until rules are added, and it is stateless: it judges
        each reply as a new packet. The server's replies go to the customers' temporary high-numbered
        ports, and with no outbound rule they hit the catch-all deny. An outbound rule allowing those
        ports fixes it.

  - id: q07-return-traffic-claim
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "\"Return traffic always gets through\" is wrong"
    task: "3.5"
    level: understanding
    topics: [stateful-stateless, network-acls]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A colleague says, "Replies always get back to the customer, because filtering in a VPC is
        stateful." Which statement corrects the colleague?
    choices:
      - id: both-stateless
        text: Neither filter is stateful, so a reply needs a rule in the security group and the network ACL
        variants:
          - text: Both filters are stateless, so the security group and the network ACL each need a rule for replies
          - text: No VPC filter is stateful, so replies need rules in both the security group and the network ACL
        explanation:
          text: Security groups are stateful and pass replies on their own. Only the network ACL needs a rule for replies.
      - id: sg-stateless
        text: Network ACLs are stateful, but a reply also crosses the security group, which is stateless
        variants:
          - text: The network ACL is the stateful one; the reply must still pass the stateless security group
          - text: The network ACL passes the reply, but the stateless security group checks it again
        explanation:
          text: This reverses the two filters. The security group remembers the request and passes the reply; the network ACL doesn't remember.
      - id: only-default-vpc
        text: Security groups are stateful, but only in the default VPC; in other VPCs they check replies
        variants:
          - text: Only the default VPC's security groups are stateful; elsewhere they check every reply
          - text: The security group passes replies only in the default VPC, and checks them in other VPCs
        explanation:
          text: Security groups are stateful in every VPC. The difference is which filter the reply crosses, and that filter's rules.
      - id: nacl-can-drop
        text: Security groups are stateful, but a reply also crosses the network ACL, which is stateless
        variants:
          - text: The security group is the stateful one; the reply must still pass the stateless network ACL
          - text: The security group passes the reply, but the stateless network ACL checks it again
        explanation:
          text: Correct. A custom network ACL without an outbound rule for the reply's port drops it.
    correct_answers: [nacl-can-drop]
    explanation:
      text: |
        "Stateful" describes the security group only. The security group lets a reply out because it
        remembers the request, but the reply still crosses the subnet's network ACL, which is stateless
        and checks it like any other packet. The default network ACL allows everything, which hides the
        problem until someone uses a custom one.

  - id: q07-sg-vs-nacl-compare
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "Security group or network ACL: use both, for different jobs"
    task: "3.5"
    level: understanding
    topics: [security-groups, network-acls]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements correctly compare security groups and network ACLs? (Select TWO.)
    choices:
      - id: nacl-can-deny
        text: A network ACL can deny traffic; a security group can only allow it
        variants:
          - text: Network ACLs can deny, while security groups can only allow
          - text: Of the two, a network ACL can deny; a security group can only allow
        explanation:
          text: Correct. That is why blocking an address range needs a network ACL.
      - id: sg-stateless
        text: A security group is stateless; a network ACL is stateful
        variants:
          - text: Security groups are stateless, while network ACLs are stateful
          - text: Network ACLs are stateful, and security groups are stateless
        explanation:
          text: This reverses them. Security groups are stateful; network ACLs are stateless.
      - id: levels
        text: A security group guards resources; a network ACL guards a subnet
        variants:
          - text: Security groups work at the resource level, network ACLs at the subnet level
          - text: A network ACL covers a subnet, while a security group covers resources
        explanation:
          text: Correct. A security group is attached to resources such as instances; a network ACL sits at a subnet's edge.
      - id: order-reversed
        text: A security group checks rules by number; a network ACL checks them all together
        variants:
          - text: Security groups use first match by number; network ACLs weigh all rules together
          - text: Network ACL rules count together, while security group rules run in number order
        explanation:
          text: This reverses them. Network ACLs check by number; security group rules all count together.
      - id: nacl-charged
        text: A network ACL bills by the hour; a security group has no charge
        variants:
          - text: Network ACLs are billed hourly, while security groups are free
          - text: A security group is free, but a network ACL costs money every hour
        explanation:
          text: Neither has a charge.
    correct_answers: [nacl-can-deny, levels]
    explanation:
      text: |
        Security groups guard resources, hold allow rules only, check all rules together and are
        stateful. Network ACLs guard subnets, hold allow and deny rules checked in number order, and are
        stateless. Neither costs anything. Use tight security groups as the main control and network ACLs
        as a second, coarse layer.

  - id: q07-inbound-check-order
    revision: 2
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "The big picture: two checkpoints in, two checkpoints out"
    task: "3.5"
    level: understanding
    topics: [security-groups, network-acls]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A customer on the internet sends an HTTPS request to a web server in a public subnet. Which
        filters check the request on its way in, and in which order?
    choices:
      - id: sg-then-nacl
        text: The server's security group first, then the subnet's network ACL
        variants:
          - text: First the security group on the server, next the subnet's network ACL
          - text: The security group around the server, followed by the network ACL
        explanation:
          text: This runs backward. The security group around the server is the last check on the way in.
      - id: nacl-then-sg
        text: The subnet's network ACL first, then the server's security group
        variants:
          - text: First the network ACL at the subnet's edge, next the server's security group
          - text: The network ACL on the subnet, followed by the security group
        explanation:
          text: Correct. The network ACL checks the request as it crosses the subnet's edge, and the security group checks it at the server.
      - id: sg-only
        text: Just the server's security group, since network ACLs check outbound traffic
        variants:
          - text: The security group alone, because a network ACL filters traffic leaving a subnet
          - text: The server's security group by itself, as network ACLs look at traffic going out
        explanation:
          text: A network ACL has inbound and outbound rules, and checks traffic entering the subnet as well as leaving it.
      - id: nacl-only
        text: Just the subnet's network ACL, since security groups check outbound traffic
        variants:
          - text: The network ACL alone, because a security group filters traffic leaving a server
          - text: The subnet's network ACL by itself, as security groups look at traffic going out
        explanation:
          text: A security group's inbound rules decide what reaches the server. A new one has no inbound rules, so nothing gets in until you add one.
    correct_answers: [nacl-then-sg]
    explanation:
      text: |
        A request from the internet crosses the subnet's network ACL first, at the subnet's edge, and
        then the security group around the server. Both must allow it. On the way back the order
        reverses: the security group passes the reply automatically because it is stateful, and the
        network ACL's outbound rules must allow it because it is stateless.

  - id: q07-private-subnet-open-sg
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A subnet is public because of its route, not because of its addresses"
    task: "3.5"
    level: application
    topics: [subnets, security-groups]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A server sits in a private subnet whose route table has only the local route. Its security group
        allows HTTPS from `0.0.0.0/0`, and the subnet uses the default network ACL. Can customers on the
        internet reach the server over HTTPS?
    choices:
      - id: yes-sg
        text: Yes, because the security group allows HTTPS from anywhere
        variants:
          - text: Yes, since its security group lets HTTPS in from anywhere
          - text: Yes, as HTTPS from any address is allowed by its security group
        explanation:
          text: The security group never gets to decide. Without a route to an internet gateway, the subnet has no path to or from the internet.
      - id: yes-default-nacl
        text: Yes, because the default network ACL allows all traffic
        variants:
          - text: Yes, since the default network ACL lets everything through
          - text: Yes, as the default network ACL allows every packet
        explanation:
          text: The network ACL would allow it, but the subnet has no route to the internet for the conversation to use.
      - id: no-route
        text: No, because no route connects the subnet to an internet gateway
        variants:
          - text: No, since the subnet has no route to an internet gateway
          - text: No, as nothing routes the subnet to an internet gateway
        explanation:
          text: Correct. The route comes first. With only the local route, the subnet has no path to or from the internet.
      - id: no-outbound
        text: No, because the security group needs an outbound rule for replies
        variants:
          - text: No, since replies need an outbound security group rule
          - text: No, as the security group must also allow the replies out
        explanation:
          text: Security groups let replies out on their own. The real blocker comes before any filter.
    correct_answers: [no-route]
    explanation:
      text: |
        Walk the path from the start: the route comes first. A private subnet has no route to an internet
        gateway, so it has no path to or from the internet, and the open security group and the default
        network ACL can't change that. A wide-open security group in a private subnet is still a mistake, though, as a second
        line of defense.

  - id: q07-inspector-network-role
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "Amazon Inspector finds open paths; it doesn't block anything"
    task: "3.5"
    level: understanding
    topics: [amazon-inspector]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The exam guide lists Amazon Inspector under network security in a VPC. What does Amazon Inspector
        do there?
    choices:
      - id: scans-reports
        text: It scans workloads and reports unintended network exposure as findings
        variants:
          - text: It scans workloads and reports open network paths nobody intended
          - text: It finds unintended network exposure in workloads and reports it
        explanation:
          text: Correct. Inspector finds and reports; you change the rules.
      - id: blocks-attacks
        text: It blocks traffic that matches known attacks before that traffic reaches servers
        variants:
          - text: It stops traffic matching known attacks before any server sees it
          - text: It drops known attack traffic while it is on its way to the servers
        explanation:
          text: Inspector filters nothing. For web requests, AWS WAF filters (Module 09).
      - id: replaces-sgs
        text: It replaces security groups as the firewall around each instance
        variants:
          - text: It takes over from security groups as each instance's firewall
          - text: It acts as each instance's firewall in place of security groups
        explanation:
          text: Security groups still do the filtering. Inspector only reports.
      - id: records-traffic
        text: It records information about every connection in the VPC
        variants:
          - text: It logs information about all of the VPC's connections
          - text: It keeps a record of each connection made in the VPC
        explanation:
          text: Recording information about traffic is VPC Flow Logs' job.
    correct_answers: [scans-reports]
    explanation:
      text: |
        Amazon Inspector is a vulnerability management service. It scans EC2 instances, container images
        in Amazon ECR and Lambda functions for software vulnerabilities and unintended network exposure,
        and reports each one as a finding. It changes nothing: fixing an open port is still a change to a
        security group or network ACL.

  - id: q07-flow-logs-and-inspector
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "Amazon Inspector finds open paths; it doesn't block anything"
    task: "3.5"
    level: application
    topics: [amazon-inspector, vpc-flow-logs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A security team wants two things: a record of the traffic to and from the network interfaces in
        its VPC, for troubleshooting, and a report of EC2 instances that can be reached on ports nobody
        meant to open. Which two AWS services or features should it use? (Select TWO.)
    choices:
      - id: flow-logs
        text: VPC Flow Logs
        variants:
          - text: Amazon VPC Flow Logs
          - text: The VPC Flow Logs feature
        explanation:
          text: Correct. Flow Logs record information about traffic to and from network interfaces.
      - id: network-acls
        text: Network ACLs
        variants:
          - text: Network access control lists
          - text: The VPC's network ACLs
        explanation:
          text: Network ACLs filter traffic. They neither record it nor report exposure.
      - id: inspector
        text: Amazon Inspector
        variants:
          - text: Inspector, from AWS
          - text: The Amazon Inspector service
        explanation:
          text: Correct. Inspector reports unintended network exposure as findings.
      - id: route-53
        text: Amazon Route 53
        variants:
          - text: Route 53, from AWS
          - text: The Amazon Route 53 service
        explanation:
          text: Route 53 answers DNS questions. It doesn't record VPC traffic or scan instances.
      - id: security-groups
        text: Security groups
        variants:
          - text: The VPC's security groups
          - text: Instance security groups
        explanation:
          text: Security groups filter traffic to resources. They don't log it or report open ports.
    correct_answers: [flow-logs, inspector]
    explanation:
      text: |
        VPC Flow Logs record information about the traffic to and from network interfaces, for
        troubleshooting and security analysis. Amazon Inspector scans workloads and reports unintended
        network exposure. Neither blocks anything; security groups and network ACLs do the filtering.

  # ---------------------------------------------------------------------------------------------
  # Lesson 07.03, Names and the edge
  # ---------------------------------------------------------------------------------------------

  - id: q07-route53-three-jobs
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: recall
    topics: [route-53]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which AWS service registers domain names, answers DNS questions for them, and checks the health
        of sites so that it can send users away from one that fails?
    choices:
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: CloudFront
          - text: The Amazon CloudFront service
        explanation:
          text: CloudFront is the content delivery network. It delivers content; it doesn't register domains or answer DNS.
      - id: route-53
        text: Amazon Route 53
        variants:
          - text: Route 53
          - text: The Amazon Route 53 service
        explanation:
          text: Correct. Route 53 is AWS's DNS service, and it does all three jobs.
      - id: global-accelerator
        text: AWS Global Accelerator
        variants:
          - text: Global Accelerator
          - text: The AWS Global Accelerator service
        explanation:
          text: Global Accelerator gives fixed IP addresses and carries traffic over AWS's network. It isn't a DNS service.
      - id: api-gateway
        text: Amazon API Gateway
        variants:
          - text: API Gateway
          - text: The Amazon API Gateway service
        explanation:
          text: API Gateway is the managed entrance to an application's API, not a DNS service.
    correct_answers: [route-53]
    explanation:
      text: |
        Amazon Route 53 is AWS's Domain Name System (DNS) service. It registers domain names, answers DNS
        questions for your domains, and runs health checks so its answers can leave out a site that has
        failed. It runs at edge locations, close to the people asking.

  - id: q07-route53-not-a-cdn
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "\"Route 53 is a CDN\" is wrong"
    task: "3.5"
    level: understanding
    topics: [route-53, cloudfront]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A colleague proposes using Amazon Route 53 to keep copies of the company's product images at edge
        locations, so pages load faster for distant customers. What is wrong with the proposal?
    choices:
      - id: needs-latency
        text: Nothing, as long as Route 53 uses latency routing
        variants:
          - text: Nothing, provided Route 53 is set to latency routing
          - text: Nothing, if latency routing is turned on in Route 53
        explanation:
          text: Latency routing chooses which Region's address a user is given. It still carries no images.
      - id: needs-ga
        text: Route 53 can cache images only when Global Accelerator is added
        variants:
          - text: Route 53 caches images only together with Global Accelerator
          - text: Global Accelerator must be added before Route 53 can cache images
        explanation:
          text: Neither service keeps copies of content. Global Accelerator carries traffic to endpoints; it caches nothing.
      - id: region-only
        text: Route 53 runs only inside Regions, never at any edge location
        variants:
          - text: Route 53 runs inside Regions only, not at the edge locations
          - text: Route 53 isn't present at edge locations, only in Regions
        explanation:
          text: Route 53 does run at edge locations. The problem is what it does there.
      - id: dns-not-cdn
        text: Route 53 only answers where a site is; CloudFront keeps the copies
        variants:
          - text: Route 53 just gives out addresses; CloudFront is what caches content
          - text: Route 53 just tells users where a site is; CloudFront keeps copies
        explanation:
          text: Correct. Route 53 never carries pages or images. CloudFront, the content delivery network, does.
    correct_answers: [dns-not-cdn]
    explanation:
      text: |
        Route 53 is DNS: it controls which address a user is given, and never carries the pages or images
        themselves. Keeping copies of content at edge locations near users is the job of Amazon
        CloudFront, AWS's content delivery network. The mix-up is tempting because Route 53 also runs at
        the edge.

  - id: q07-failover-standby-region
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: application
    topics: [route-53, routing-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its website in one Region and keeps a standby copy in a second Region. If the main
        site stops working, customers must be sent to the standby automatically, with nobody changing
        settings. Which Route 53 setup fits?
    choices:
      - id: failover-health
        text: Failover routing with a health check on the main site
        variants:
          - text: A failover routing policy, with a health check on the main site
          - text: Failover routing, plus a health check watching the main site
        explanation:
          text: Correct. When the health check fails, Route 53 answers with the standby instead.
      - id: weighted
        text: Weighted routing with a share of users sent to each site
        variants:
          - text: A weighted routing policy, sending a share of users to each site
          - text: Weighted routing, splitting users between the two sites
        explanation:
          text: Weighted routing sends a share of users to each site all the time, including to the standby while the main site is fine.
      - id: geolocation
        text: Geolocation routing based on each customer's country
        variants:
          - text: A geolocation routing policy, by each customer's country
          - text: Geolocation routing, choosing by where each customer is
        explanation:
          text: Geolocation answers "where is the user?", not "is the main site healthy?".
      - id: simple
        text: Simple routing with the two sites' addresses in one record
        variants:
          - text: A simple routing policy, with both sites' addresses in one record
          - text: Simple routing, listing both sites' addresses in one record
        explanation:
          text: Simple routing is for one place to go. It doesn't check health or prefer a main site.
    correct_answers: [failover-health]
    hint:
      text: Which routing question is "is the main site healthy?"
    explanation:
      text: |
        Failover routing answers "is the main site healthy? If not, use the standby". A health check tests
        the main site, and when it fails, Route 53 gives out the standby's address with nobody acting.
        DNS copies held elsewhere expire by their TTL, so the switch reaches every user over a short time.

  - id: q07-geolocation-contract
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: application
    topics: [route-53, routing-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its application in Europe (Frankfurt) and US East (N. Virginia). A contract says
        that users in Germany must always be served from Frankfurt; everyone else goes to N. Virginia.
        Which Route 53 routing policy meets the requirement?
    choices:
      - id: latency
        text: Latency routing
        variants:
          - text: The latency routing policy
          - text: Latency-based routing
        explanation:
          text: Latency routing picks the fastest Region, which is usually but not always Frankfurt for German users, and "usually" doesn't satisfy a contract.
      - id: weighted
        text: Weighted routing
        variants:
          - text: The weighted routing policy
          - text: Weight-based routing
        explanation:
          text: Weighted routing splits users by shares you set, regardless of where they are.
      - id: geolocation
        text: Geolocation routing
        variants:
          - text: The geolocation policy
          - text: Geolocation-based routing
        explanation:
          text: Correct. Geolocation routing chooses by where the user is, by country or continent.
      - id: failover
        text: Failover routing
        variants:
          - text: The failover routing policy
          - text: Health-based failover routing
        explanation:
          text: Failover routing chooses by whether the main site is healthy, not by where the user is.
    correct_answers: [geolocation]
    hint:
      text: Is the rule about speed, or about where the user is?
    explanation:
      text: |
        Geolocation routing answers "where is the user?" by country or continent, so it can send every
        user in Germany to Frankfurt and use a default record for everyone else. Latency routing would
        usually agree, but it chooses by speed, so it can't guarantee a rule about location.

  - id: q07-weighted-new-version
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: application
    topics: [route-53, routing-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company has built a new version of its checkout site. It wants to send 5 in every 100 customers
        to the new version for a week, and the rest to the current version. Which Route 53 routing policy
        should it use?
    choices:
      - id: latency
        text: Latency routing
        variants:
          - text: The latency routing policy
          - text: Latency-based routing
        explanation:
          text: Latency routing chooses by speed, so it can't send a set share of customers anywhere.
      - id: weighted
        text: Weighted routing
        variants:
          - text: The weighted routing policy
          - text: Weight-based routing
        explanation:
          text: Correct. Weighted routing sends a share of users you choose to each place.
      - id: failover
        text: Failover routing
        variants:
          - text: The failover routing policy
          - text: Health-based failover routing
        explanation:
          text: Failover routing sends everyone to the main site until it fails. It doesn't split traffic by share.
      - id: geolocation
        text: Geolocation routing
        variants:
          - text: The geolocation routing policy
          - text: Location-based routing by country
        explanation:
          text: Geolocation routing chooses by where users are, not by a percentage.
    correct_answers: [weighted]
    hint:
      text: The need is a share of users.
    explanation:
      text: |
        Weighted routing answers "what share of users goes to each place?". Setting weights such as 95 and
        5 sends a small share of customers to the new version first, a common way to test a release
        before moving everyone.

  - id: q07-latency-and-health-checks
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: application
    topics: [route-53, routing-policies]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company runs the same application in three Regions. It wants each user sent to the Region that
        answers that user fastest, and it wants a Region that stops working to be left out of Route 53's
        answers. Which two Route 53 features should it use? (Select TWO.)
    choices:
      - id: weighted
        text: Weighted routing
        variants:
          - text: The weighted routing policy
          - text: Weight-based routing
        explanation:
          text: Weighted routing splits users by fixed shares, regardless of speed.
      - id: latency
        text: Latency routing
        variants:
          - text: The latency routing policy
          - text: Latency-based routing
        explanation:
          text: Correct. Latency routing sends each user to the Region with the lowest delay for them.
      - id: geolocation
        text: Geolocation routing
        variants:
          - text: The geolocation routing policy
          - text: Location-based routing by country
        explanation:
          text: Geolocation follows a rule about where users are, which is often but not always the fastest Region.
      - id: health-checks
        text: Health checks
        variants:
          - text: Route 53 health checks
          - text: Health checks on each Region
        explanation:
          text: Correct. Route 53 leaves unhealthy places out of its latency answers.
      - id: private-zone
        text: A private hosted zone
        variants:
          - text: A Route 53 private hosted zone
          - text: A private hosted zone in Route 53
        explanation:
          text: A private hosted zone answers only inside chosen VPCs, so internet users couldn't use it.
    correct_answers: [latency, health-checks]
    explanation:
      text: |
        Latency routing answers "which Region answers this user fastest?". Health checks make the answers
        safe: Route 53 leaves unhealthy places out of its failover, latency, weighted and multivalue
        answers, so users aren't sent to a Region that has stopped working.

  - id: q07-cloudfront-oac-course-videos
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "CloudFront delivers from near the user, and keeps the origin out of reach"
    task: "3.2"
    level: application
    topics: [cloudfront, amazon-s3]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online course company serves its videos through Amazon CloudFront from an S3 bucket. Students
        must keep watching through CloudFront, but nobody should be able to download the videos straight
        from the bucket. What should the company do?
    choices:
      - id: public-bucket
        text: Make the bucket public so that CloudFront is able to read the videos
        variants:
          - text: Open the bucket to the public so that CloudFront can reach the videos
          - text: Give the public read access so that CloudFront can fetch the videos
        explanation:
          text: CloudFront doesn't need a public bucket, and a public bucket lets anyone go around CloudFront.
      - id: global-accelerator
        text: Put AWS Global Accelerator in front of the bucket
        variants:
          - text: Place Global Accelerator between users and the bucket
          - text: Route the bucket's traffic through Global Accelerator
        explanation:
          text: Global Accelerator doesn't control who can read a bucket, and it doesn't take S3 buckets as endpoints.
      - id: short-ttl
        text: Set a short cache time on the distribution
        variants:
          - text: Lower the distribution's cache time
          - text: Make CloudFront keep copies for less time
        explanation:
          text: The cache time decides how long edge copies last. It doesn't change who can reach the bucket.
      - id: oac
        text: Keep the bucket private and let only the distribution read it
        variants:
          - text: Leave the bucket private, readable by the distribution alone
          - text: Allow only the CloudFront distribution to read the private bucket
        explanation:
          text: Correct. Origin access control lets the distribution, and only it, read a private bucket, with Block Public Access left on.
    correct_answers: [oac]
    hint:
      text: CloudFront has a feature that lets it, and only it, read a private origin.
    explanation:
      text: |
        With origin access control (OAC), the S3 bucket stays private, with Block Public Access on, and
        only the CloudFront distribution may read it. Customers get the videos from CloudFront, and a
        direct request to the bucket is refused. Making the bucket public "because CloudFront needs it"
        is a common and avoidable mistake.

  - id: q07-cloudfront-what-it-adds
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "CloudFront delivers from near the user, and keeps the origin out of reach"
    task: "3.2"
    level: understanding
    topics: [cloudfront]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A travel blog runs on a single server in one Region, and readers on other continents find it
        slow. The owner puts an Amazon CloudFront distribution in front of the server and changes no
        other settings. Which two does the blog now get from the distribution? (Select TWO.)
    choices:
      - id: static-ips
        text: Fixed entry addresses for non-web UDP traffic
        variants:
          - text: Static addresses that carry non-web UDP traffic
          - text: Fixed IP addresses for non-web UDP traffic
        explanation:
          text: That is AWS Global Accelerator, which carries any TCP or UDP traffic. CloudFront serves web content over HTTP and HTTPS.
      - id: edge-copies
        text: Copies of content kept at edge locations near users
        variants:
          - text: Cached copies of content at edge locations close to users
          - text: Content copies held at the edge locations nearest users
        explanation:
          text: Correct. CloudFront is a content delivery network that answers from nearby copies when it can.
      - id: domain-registration
        text: Registration of the site's domain name
        variants:
          - text: Registering the website's domain name
          - text: A registered domain name for the site
        explanation:
          text: Registering domains is a Route 53 job.
      - id: shield-standard
        text: AWS Shield Standard protection at no extra cost
        variants:
          - text: AWS Shield Standard included at no extra charge
          - text: Protection from AWS Shield Standard, at no extra cost
        explanation:
          text: Correct. Every distribution gets Shield Standard; AWS WAF, geo restriction and signed URLs are options.
      - id: origin-copy
        text: A standby copy of the blog's server in a second Region
        variants:
          - text: A copy of the blog's server, on standby in another Region
          - text: A second-Region standby copy of the blog's server
        explanation:
          text: CloudFront caches content at edge locations; it doesn't copy or run the origin server anywhere. A standby in another Region is something you build yourself.
    correct_answers: [edge-copies, shield-standard]
    explanation:
      text: |
        CloudFront caches content at edge locations near users and fetches from the origin only when it
        has no fresh copy. Every distribution also gets AWS Shield Standard at no extra cost, with AWS WAF,
        geo restriction and signed URLs or cookies available as options. CloudFront copies content, not the
        server: fixed addresses for non-web traffic belong to Global Accelerator, domain registration to
        Route 53, and a standby server in another Region is something you build yourself.

  - id: q07-cloudfront-software-download
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "CloudFront delivers from near the user, and keeps the origin out of reach"
    task: "3.2"
    level: application
    topics: [cloudfront]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software company releases a large installer file that millions of users around the world will
        download in the same week. The company wants fast downloads everywhere and less load on its own
        servers. Which AWS service fits best?
    choices:
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: CloudFront
          - text: The Amazon CloudFront service
        explanation:
          text: Correct. The same file goes to many people, so copies at edge locations serve most downloads without touching the origin.
      - id: global-accelerator
        text: AWS Global Accelerator
        variants:
          - text: Global Accelerator
          - text: The AWS Global Accelerator service
        explanation:
          text: Global Accelerator keeps no copies, so every download would still reach the company's servers.
      - id: api-gateway
        text: Amazon API Gateway
        variants:
          - text: API Gateway
          - text: The Amazon API Gateway service
        explanation:
          text: API Gateway manages calls to an application's API. It isn't built to deliver a file to millions from nearby copies.
      - id: route-53
        text: Amazon Route 53
        variants:
          - text: Route 53
          - text: The Amazon Route 53 service
        explanation:
          text: Route 53 tells users where to go. It never carries the file itself.
    correct_answers: [cloudfront]
    hint:
      text: Can the same copy serve many users?
    explanation:
      text: |
        When the same content goes to many people, a content delivery network fits: CloudFront answers from
        copies at the edge location nearest each user and fetches from the origin only when it has no fresh
        copy. That speeds downloads and keeps most requests away from the company's servers.

  - id: q07-ga-udp-game
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Global Accelerator gives fixed addresses and a fast path, but keeps no copies"
    task: "3.2"
    level: application
    topics: [global-accelerator]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A game studio runs a real-time multiplayer game over UDP from two Regions. Every move is new data,
        and players worldwide complain about lag. The studio also wants players moved to the other Region
        quickly if one fails. Which AWS service should it look at first?
    choices:
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: CloudFront
          - text: The Amazon CloudFront service
        explanation:
          text: CloudFront helps when a copy can answer, for web content. Fresh game moves over UDP can't be cached.
      - id: route53-weighted
        text: Amazon Route 53 weighted routing
        variants:
          - text: Weighted routing in Route 53
          - text: The Route 53 weighted routing policy
        explanation:
          text: Weighted routing splits players by fixed shares. It doesn't shorten the path, and DNS switches wait on cached answers.
      - id: global-accelerator
        text: AWS Global Accelerator
        variants:
          - text: Global Accelerator
          - text: The AWS Global Accelerator service
        explanation:
          text: Correct. Players enter AWS's network at the nearest edge, travel on it to the best healthy Region, and are rerouted without waiting for DNS.
      - id: api-gateway
        text: Amazon API Gateway
        variants:
          - text: API Gateway
          - text: The Amazon API Gateway service
        explanation:
          text: API Gateway manages API calls. It isn't a way to carry a game's UDP traffic faster.
    correct_answers: [global-accelerator]
    hint:
      text: Copies can't help here. What else can make the trip faster?
    explanation:
      text: |
        Global Accelerator carries any TCP or UDP traffic: users enter AWS's network at the nearest edge
        location through fixed addresses and travel on AWS's network to the best healthy endpoint. It
        reroutes at the edge as health changes, without waiting for DNS copies to expire. It keeps no
        copies, which suits traffic that is fresh every time.

  - id: q07-ga-fixed-addresses
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Global Accelerator gives fixed addresses and a fast path, but keeps no copies"
    task: "3.2"
    level: application
    topics: [global-accelerator]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company offers a TCP-based service that is not a website. Its business customers must add the
        service's IP addresses to their own firewalls, so the addresses must never change, even when the
        company moves the service to another Region. Which AWS service meets this need?
    choices:
      - id: cloudfront
        text: An Amazon CloudFront distribution
        variants:
          - text: A CloudFront distribution
          - text: A distribution in Amazon CloudFront
        explanation:
          text: CloudFront delivers web content over HTTP and HTTPS. It doesn't carry a TCP service that isn't a website.
      - id: route53-alias
        text: An Amazon Route 53 alias record for the service
        variants:
          - text: A Route 53 alias record pointing at the service
          - text: An alias record in Amazon Route 53 for the service
        explanation:
          text: An alias record is a name whose answers follow changing addresses. Customers' firewalls need fixed addresses.
      - id: api-gateway
        text: An Amazon API Gateway API
        variants:
          - text: An API in Amazon API Gateway
          - text: An API Gateway API
        explanation:
          text: API Gateway publishes APIs reached by a name. It doesn't give a non-web TCP service fixed addresses.
      - id: global-accelerator
        text: An AWS Global Accelerator accelerator
        variants:
          - text: An accelerator in AWS Global Accelerator
          - text: A Global Accelerator accelerator
        explanation:
          text: Correct. Its two static IP addresses stay the same for the life of the accelerator, while the endpoints behind them can move between Regions.
    correct_answers: [global-accelerator]
    explanation:
      text: |
        Global Accelerator gives an application two static IPv4 addresses, announced by anycast from AWS's
        edge locations. They stay the same for as long as the accelerator exists, even while you move the
        endpoints behind them, and it carries any TCP or UDP traffic. CloudFront and API Gateway handle
        web requests, and a Route 53 record is a name, not a fixed address.

  - id: q07-cloudfront-vs-ga
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Global Accelerator gives fixed addresses and a fast path, but keeps no copies"
    task: "3.2"
    level: understanding
    topics: [cloudfront, global-accelerator]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement correctly contrasts Amazon CloudFront with AWS Global Accelerator?
    choices:
      - id: ga-caches
        text: Global Accelerator keeps copies at the edge; CloudFront sends every request to a Region
        variants:
          - text: Global Accelerator caches content at the edge, while CloudFront forwards every request to a Region
          - text: CloudFront sends each request on to a Region, while Global Accelerator answers from edge copies
        explanation:
          text: This reverses the two. CloudFront is the one that keeps copies.
      - id: cf-copies-ga-not
        text: CloudFront keeps copies at the edge; Global Accelerator sends every request to a Region
        variants:
          - text: CloudFront caches content at the edge, while Global Accelerator forwards every request to a Region
          - text: Global Accelerator sends each request on to a Region, while CloudFront answers from edge copies
        explanation:
          text: Correct. With CloudFront many requests end at the edge; with Global Accelerator every request reaches your application.
      - id: only-cf-edge
        text: Only CloudFront uses edge locations; Global Accelerator runs inside one Region
        variants:
          - text: CloudFront alone uses edge locations, while Global Accelerator stays in one Region
          - text: Global Accelerator runs in a single Region, and only CloudFront uses the edge
        explanation:
          text: Both start at AWS's edge locations and carry traffic over AWS's network.
      - id: same-service
        text: They are the same service under two names, kept for older customers
        variants:
          - text: They are one service with two names, kept for older customers
          - text: Both names refer to one service, kept for older customers
        explanation:
          text: They are separate services with different jobs.
    correct_answers: [cf-copies-ga-not]
    explanation:
      text: |
        Both services start at AWS's edge locations and work with AWS Shield. The difference is where the
        answer comes from: CloudFront is a content delivery network that answers from cached copies when
        it can, while Global Accelerator keeps no copies and carries every request over AWS's network to a
        healthy endpoint in a Region. If a copy can answer, use CloudFront.

  - id: q07-apigw-partner-allowances
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "API Gateway is the managed entrance to your code"
    task: "3.5"
    level: application
    topics: [api-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics company lets retailers check shipment status through an API backed by AWS Lambda
        functions. Each retailer must get its own key and its own monthly allowance of calls. Which
        service should sit in front of the functions?
    choices:
      - id: api-gateway
        text: Amazon API Gateway
        variants:
          - text: API Gateway
          - text: The Amazon API Gateway service
        explanation:
          text: Correct. Usage plans and API keys give each caller its own key and allowance, and API Gateway passes calls to Lambda.
      - id: alb
        text: An Application Load Balancer
        variants:
          - text: An Application Load Balancer (ALB)
          - text: An ALB from Elastic Load Balancing
        explanation:
          text: A load balancer can reach Lambda functions, but it has no usage plans or API keys.
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: CloudFront
          - text: The Amazon CloudFront service
        explanation:
          text: CloudFront delivers and caches content. It doesn't give each caller a key and a call allowance.
      - id: route-53
        text: Amazon Route 53
        variants:
          - text: Route 53
          - text: The Amazon Route 53 service
        explanation:
          text: Route 53 only answers where the API is. The calls never pass through it.
    correct_answers: [api-gateway]
    hint:
      text: Which service manages who may call an API, and how often?
    explanation:
      text: |
        Amazon API Gateway is the managed entrance to an application's code. Usage plans and API keys give
        each outside developer their own allowance, throttling caps how fast calls arrive, and stages
        keep versions such as test and production apart. It passes each accepted call to the code
        behind it, here a Lambda function.

  - id: q07-apigw-vs-load-balancer
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "API Gateway is the managed entrance to your code"
    task: "3.5"
    level: understanding
    topics: [api-gateway, load-balancing]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes how Amazon API Gateway differs from an Application Load Balancer?
    choices:
      - id: only-apigw-lambda
        text: Only API Gateway can pass requests on to Lambda functions
        variants:
          - text: API Gateway alone can send requests to Lambda functions
          - text: Lambda functions can receive requests only through API Gateway
        explanation:
          text: An Application Load Balancer can also pass web requests to Lambda functions. The difference is purpose.
      - id: alb-usage-plans
        text: A load balancer offers usage plans and API keys; API Gateway doesn't
        variants:
          - text: Usage plans and API keys come with load balancers, not API Gateway
          - text: API keys and usage plans are load balancer features, not API Gateway's
        explanation:
          text: This reverses them. Usage plans and API keys are API Gateway features.
      - id: spreads-vs-manages
        text: A load balancer spreads traffic; API Gateway manages who may call an API and how often
        variants:
          - text: A load balancer spreads requests, while API Gateway controls an API's callers and limits
          - text: API Gateway manages an API's callers and limits, while a load balancer spreads requests
        explanation:
          text: Correct. API Gateway adds authorization, throttling, usage plans and stages; a load balancer spreads traffic across healthy targets.
      - id: apigw-servers
        text: API Gateway runs on servers you patch; a load balancer is fully managed
        variants:
          - text: You patch API Gateway's servers, while a load balancer is managed for you
          - text: A load balancer is managed for you, but API Gateway needs servers you patch
        explanation:
          text: API Gateway runs your API at any scale with no servers of your own.
    correct_answers: [spreads-vs-manages]
    explanation:
      text: |
        Both can pass web requests to code, even to Lambda functions. A load balancer's job is to spread
        traffic across healthy targets. API Gateway's job is to manage an API: who may call, how often,
        and which version, through authorization, throttling, usage plans, API keys and stages.

  - id: q07-edge-customer-side
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Summary"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, cloudfront]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company uses Amazon Route 53, Amazon CloudFront and Amazon API Gateway. Under the AWS shared
        responsibility model, which task is the company's?
    choices:
      - id: edge-hardware
        text: Replacing failed hardware at CloudFront's edge locations worldwide
        variants:
          - text: Fixing broken servers in CloudFront's edge locations around the world
          - text: Swapping out faulty hardware at CloudFront's edge locations worldwide
        explanation:
          text: AWS runs the edge locations, their hardware and software.
      - id: dns-scaling
        text: Adding capacity to Route 53's DNS servers during peaks
        variants:
          - text: Scaling up Route 53's DNS servers when demand peaks
          - text: Growing Route 53's DNS server capacity at busy times
        explanation:
          text: Scaling and availability of the DNS service are AWS's job.
      - id: apigw-patching
        text: Patching the servers that run API Gateway
        variants:
          - text: Applying updates to API Gateway's servers
          - text: Keeping API Gateway's servers patched
        explanation:
          text: API Gateway has no servers of yours. AWS runs and patches it.
      - id: cache-and-callers
        text: Deciding what CloudFront may cache and who may call the API
        variants:
          - text: Choosing what CloudFront caches and which callers the API accepts
          - text: Setting what CloudFront may cache and who can call the API
        explanation:
          text: Correct. How the services treat your traffic and data is your side of the line.
    correct_answers: [cache-and-callers]
    explanation:
      text: |
        AWS runs the edge locations, DNS servers, CDN and API service: hardware, software, scaling and
        availability. The customer decides how they treat its traffic and data: DNS records and health
        checks, what CloudFront may cache, keeping the origin private, who may call the API and how often,
        and turning on HTTPS.

  # ---------------------------------------------------------------------------------------------
  # Lesson 07.04, Connecting networks and offices
  # ---------------------------------------------------------------------------------------------

  - id: q07-s2s-vpn-new-warehouse
    revision: 2
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "A Site-to-Site VPN links an office network over the internet, encrypted"
    task: "3.5"
    level: application
    topics: [site-to-site-vpn, direct-connect]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A retailer must link a pop-up warehouse's network to its VPC by the end of this week. The traffic
        is light, and it must be encrypted while it travels. One engineer proposes AWS Direct Connect;
        another argues for AWS Site-to-Site VPN. Which statement is the strongest reason to choose the
        VPN here?
    choices:
      - id: vpn-off-internet
        text: The VPN keeps traffic off the internet; Direct Connect sends it across
        variants:
          - text: Direct Connect crosses the public internet; the VPN's path avoids it
          - text: The VPN avoids the public internet, while Direct Connect uses it
        explanation:
          text: This reverses them. A Site-to-Site VPN's encrypted tunnels cross the public internet; Direct Connect is the private line that avoids it.
      - id: vpn-steadier
        text: The VPN gives steadier performance than Direct Connect's line
        variants:
          - text: A VPN's performance is more consistent than Direct Connect's
          - text: Direct Connect's line is less consistent than the VPN's tunnels
        explanation:
          text: The other way round. A VPN's speed varies with the internet's; consistent performance is a reason to pick Direct Connect.
      - id: quick-setup
        text: The VPN is ready in minutes; Direct Connect needs work at a location
        variants:
          - text: Direct Connect needs physical setup at a location; the VPN takes minutes
          - text: A VPN is configured in minutes, but Direct Connect needs cabling work
        explanation:
          text: Correct. A Site-to-Site VPN can be configured in minutes, while Direct Connect means reaching a Direct Connect location and connecting a cable.
      - id: dx-no-encryption
        text: Direct Connect has no way to encrypt traffic, so it fails the rule
        variants:
          - text: Traffic over Direct Connect can't be encrypted, so it can't comply
          - text: Encryption isn't possible on Direct Connect, so it breaks the rule
        explanation:
          text: Direct Connect isn't encrypted on its own, but you can add MACsec on supported connections or run a VPN over it. Its setup time is the real obstacle here.
    correct_answers: [quick-setup]
    hint:
      text: Which requirement could Direct Connect not meet, whatever you add to it?
    explanation:
      text: |
        AWS Site-to-Site VPN joins a whole network to a VPC through encrypted IPsec tunnels across the
        internet, and AWS says it can be configured in minutes for an immediate need with low to modest
        bandwidth. Direct Connect keeps traffic off the internet and gives steadier performance, but its
        setup is physical and takes longer, and encryption is something you add to it.

  - id: q07-vpn-encrypted-not-private
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "\"A VPN is a private connection\" is wrong"
    task: "3.5"
    level: understanding
    topics: [site-to-site-vpn, private-vs-encrypted]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement about AWS Site-to-Site VPN is correct?
    choices:
      - id: dedicated-line
        text: It carries traffic on a dedicated line that avoids the public internet
        variants:
          - text: Its traffic runs on a dedicated line, off the public internet
          - text: It uses a dedicated line, so traffic never touches the internet
        explanation:
          text: That is Direct Connect. A VPN shares the internet's path.
      - id: not-encrypted
        text: It is unencrypted unless you add MACsec to it
        variants:
          - text: Its traffic isn't encrypted until you add MACsec
          - text: It carries traffic unencrypted unless MACsec is added
        explanation:
          text: A Site-to-Site VPN is always encrypted, with IPsec. MACsec is an option for Direct Connect.
      - id: encrypted-over-internet
        text: It encrypts the traffic, which still crosses the public internet
        variants:
          - text: Its traffic is encrypted but still travels over the internet
          - text: It encrypts traffic that still goes across the public internet
        explanation:
          text: Correct. It is encrypted, not private. Its speed and delay vary with the internet's.
      - id: one-device
        text: It connects one person's laptop to a VPC from anywhere
        variants:
          - text: It links a single person's device to a VPC from anywhere
          - text: It joins one user's laptop to a VPC, wherever they are
        explanation:
          text: That is Client VPN. Site-to-Site VPN joins whole networks through a router.
    correct_answers: [encrypted-over-internet]
    explanation:
      text: |
        In networking questions, private is about the path and encrypted is about the protection. A
        Site-to-Site VPN encrypts everything with IPsec, but its tunnels cross the public internet, so it
        is encrypted, not private. Only Direct Connect keeps the path off the internet. The name "virtual
        private network" is what makes the mix-up tempting.

  - id: q07-s2s-vpn-two-traits
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "A Site-to-Site VPN links an office network over the internet, encrypted"
    task: "3.5"
    level: recall
    topics: [site-to-site-vpn]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements describe AWS Site-to-Site VPN? (Select TWO.)
    choices:
      - id: ipsec-internet
        text: It builds encrypted IPsec tunnels across the public internet
        variants:
          - text: Its encrypted IPsec tunnels run over the public internet
          - text: It uses encrypted IPsec tunnels that cross the internet
        explanation:
          text: Correct. That is how it joins an office network to AWS.
      - id: cable-at-location
        text: It needs a cable connected at a Direct Connect location
        variants:
          - text: A cable must be connected at a Direct Connect location
          - text: It depends on cabling at a Direct Connect location
        explanation:
          text: Physical cabling is Direct Connect. A VPN needs only an internet connection and a router.
      - id: two-tunnels
        text: Each connection comes with two tunnels for high availability
        variants:
          - text: Every connection has two tunnels, for high availability
          - text: It gives each connection two tunnels so one can fail
        explanation:
          text: Correct. Using both tunnels at the office end is the customer's job.
      - id: consistent-offnet
        text: It gives consistent performance because it avoids the internet
        variants:
          - text: Its performance is consistent since it stays off the internet
          - text: It stays off the internet, so its performance is steady
        explanation:
          text: A VPN shares the internet's path, so its speed and delay vary. Consistent, off-internet performance is Direct Connect.
      - id: per-laptop
        text: Each employee installs it on a laptop to connect from home
        variants:
          - text: Employees install it on their laptops to work from home
          - text: Staff put it on their own laptops to connect from home
        explanation:
          text: That describes Client VPN. Site-to-Site VPN works through the office's router, with nothing for each person to install.
    correct_answers: [ipsec-internet, two-tunnels]
    explanation:
      text: |
        Site-to-Site VPN connects a whole network to AWS with encrypted IPsec tunnels across the public
        internet, between your customer gateway device and the AWS end. Each connection has two tunnels
        for high availability. It is quick to set up, but its performance varies with the internet's.

  - id: q07-client-vpn-contractors
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "A Site-to-Site VPN links an office network over the internet, encrypted"
    task: "3.5"
    level: application
    topics: [client-vpn]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company hires twenty contractors who work from their own homes. Each needs encrypted access, from
        a laptop, to an internal application in the company's VPC. Which service fits best?
    choices:
      - id: direct-connect
        text: AWS Direct Connect
        variants:
          - text: A Direct Connect connection
          - text: AWS's Direct Connect service
        explanation:
          text: Direct Connect is a dedicated line from a fixed site, not something a laptop at home can use.
      - id: client-vpn
        text: AWS Client VPN
        variants:
          - text: A Client VPN endpoint
          - text: AWS's Client VPN service
        explanation:
          text: Correct. Each person runs a VPN client and connects, encrypted, from wherever they are.
      - id: s2s-vpn
        text: AWS Site-to-Site VPN
        variants:
          - text: A Site-to-Site VPN connection
          - text: AWS's Site-to-Site VPN service
        explanation:
          text: Site-to-Site VPN joins a whole network through a router. Contractors at home don't have one to connect.
      - id: privatelink
        text: AWS PrivateLink
        variants:
          - text: A PrivateLink endpoint
          - text: AWS's PrivateLink service
        explanation:
          text: PrivateLink connects a VPC to one service. It doesn't connect people.
    correct_answers: [client-vpn]
    hint:
      text: Is the thing that connects a network or a person?
    explanation:
      text: |
        AWS Client VPN is for individual people. Each one runs a VPN client app and connects, encrypted
        over the internet, to a Client VPN endpoint; sign-in and authorization rules decide which groups
        reach which networks. It is fully managed and grows with the number of people connected.

  - id: q07-s2s-vs-client-vpn
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "A Site-to-Site VPN links an office network over the internet, encrypted"
    task: "3.5"
    level: understanding
    topics: [client-vpn, site-to-site-vpn]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes the difference between AWS Site-to-Site VPN and AWS Client VPN?
    choices:
      - id: s2s-private
        text: Site-to-Site VPN avoids the internet; Client VPN crosses it
        variants:
          - text: Site-to-Site VPN stays off the internet, while Client VPN uses it
          - text: Client VPN crosses the internet, while Site-to-Site VPN avoids it
        explanation:
          text: Both cross the public internet, encrypted. Neither is a private path.
      - id: client-unencrypted
        text: Site-to-Site VPN is encrypted; Client VPN isn't
        variants:
          - text: Only Site-to-Site VPN encrypts its traffic, not Client VPN
          - text: Client VPN carries traffic unencrypted, unlike Site-to-Site VPN
        explanation:
          text: Both encrypt their traffic.
      - id: reversed
        text: Site-to-Site VPN connects devices; Client VPN connects networks
        variants:
          - text: Site-to-Site VPN joins single devices, and Client VPN joins networks
          - text: Client VPN links networks, while Site-to-Site VPN links devices
        explanation:
          text: This reverses them.
      - id: networks-vs-devices
        text: Site-to-Site VPN connects networks; Client VPN connects devices
        variants:
          - text: Site-to-Site VPN joins networks, and Client VPN joins single devices
          - text: Client VPN links devices, while Site-to-Site VPN links networks
        explanation:
          text: Correct. A Site-to-Site VPN works through the office's router; with Client VPN each person connects their own device.
    correct_answers: [networks-vs-devices]
    explanation:
      text: |
        Both are AWS VPN services, and both are encrypted over the internet. Site-to-Site VPN joins two
        networks through routers, and everyone in the office uses it without doing anything. Client VPN
        joins one device at a time, and each person connects for themselves.

  - id: q07-dx-media-transfers
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Direct Connect is a dedicated line that bypasses the internet"
    task: "3.5"
    level: application
    topics: [direct-connect]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A film studio copies terabytes of footage between its data center and AWS every day over a
        Site-to-Site VPN, and the transfers slow down at busy times. The studio wants a steady,
        high-bandwidth path that avoids the public internet, and it can wait a few weeks for setup.
        What should it add?
    choices:
      - id: second-vpn
        text: A second Site-to-Site VPN connection to the same VPC
        variants:
          - text: Another Site-to-Site VPN connection into the VPC
          - text: One more Site-to-Site VPN connection to that VPC
        explanation:
          text: A Site-to-Site VPN's tunnels cross the public internet, so a second one still travels the internet's path and its speed still varies with the internet's.
      - id: cloudfront
        text: An Amazon CloudFront distribution in front of the VPC
        variants:
          - text: A CloudFront distribution placed in front of the VPC
          - text: Amazon CloudFront, set up in front of the VPC
        explanation:
          text: CloudFront delivers content to users from edge locations. It doesn't join a data center's network to a VPC off the internet.
      - id: client-vpn
        text: An AWS Client VPN connection on each editor's computer
        variants:
          - text: AWS Client VPN, installed on every editor's computer
          - text: A Client VPN connection from each editor's computer
        explanation:
          text: Client VPN connects individual devices, and it travels over the internet too.
      - id: direct-connect
        text: An AWS Direct Connect connection at a Direct Connect location
        variants:
          - text: A Direct Connect connection, cabled at a Direct Connect location
          - text: An AWS Direct Connect link through a Direct Connect location
        explanation:
          text: Correct. A dedicated line at a Direct Connect location keeps the traffic off the internet and gives consistent performance.
    correct_answers: [direct-connect]
    hint:
      text: Which link has a path that never touches the internet?
    explanation:
      text: |
        AWS Direct Connect joins your network to AWS over a dedicated connection at a Direct Connect
        location, so the traffic never passes through internet providers. AWS says it can raise bandwidth
        and give a more consistent experience than internet links. Its setup is physical, so it takes
        longer than a VPN, and the existing VPN can stay as a backup.

  - id: q07-dx-backup-link
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Direct Connect is a dedicated line that bypasses the internet"
    task: "3.5"
    level: application
    topics: [direct-connect, site-to-site-vpn, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's head office reaches its VPC over a single AWS Direct Connect connection. It wants a
        low-cost backup link that takes over if the Direct Connect connection goes down. What should it
        add?
    choices:
      - id: s2s-vpn-backup
        text: An AWS Site-to-Site VPN connection over the internet
        variants:
          - text: A Site-to-Site VPN across the internet
          - text: An internet-based Site-to-Site VPN connection
        explanation:
          text: Correct. A VPN is quick and cheap to set up, and AWS prefers the Direct Connect path while it is up.
      - id: client-vpn
        text: An AWS Client VPN endpoint for the office's staff
        variants:
          - text: A Client VPN endpoint for the people in the office
          - text: A Client VPN endpoint that each office worker uses
        explanation:
          text: Client VPN connects people one device at a time. It isn't a backup for an office network link.
      - id: peering
        text: A VPC peering connection to a second VPC
        variants:
          - text: Peering between the VPC and another VPC
          - text: A peering connection with a second VPC
        explanation:
          text: Peering joins VPCs, and a peered VPC can't lend its connections to another, so it can't back up the office link.
      - id: privatelink
        text: An AWS PrivateLink endpoint in the office
        variants:
          - text: A PrivateLink endpoint placed in the office
          - text: An office-side AWS PrivateLink endpoint
        explanation:
          text: PrivateLink puts an interface endpoint in a VPC subnet to reach one service. It doesn't link an office.
    correct_answers: [s2s-vpn-backup]
    hint:
      text: One Direct Connect connection is a single point of failure. What is the cheap way to cover it?
    explanation:
      text: |
        One Direct Connect connection is a single point of failure, and planned maintenance can take it
        down. A Site-to-Site VPN over the internet can serve the same VPC as a backup: AWS uses it only
        when Direct Connect is down. A second Direct Connect connection at another location is the
        stronger but more expensive choice.

  - id: q07-peering-not-transitive
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: understanding
    topics: [vpc-peering]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company peers its development VPC with its shared-services VPC, and its test VPC with the same
        shared-services VPC. Servers in the development VPC can't reach servers in the test VPC. Why?
    choices:
      - id: same-account
        text: Peering works only between VPCs in the same account
        variants:
          - text: VPCs can be peered only within one account
          - text: Peering is limited to VPCs in a single account
        explanation:
          text: Peering works across accounts, and across Regions too. That isn't the reason.
      - id: different-regions
        text: Peered VPCs must be in different Regions from each other
        variants:
          - text: Peering needs the two VPCs to be in different Regions
          - text: The VPCs in a peering must sit in separate Regions
        explanation:
          text: Peering works within one Region and between Regions alike.
      - id: not-transitive
        text: Peering isn't transitive, so traffic can't pass through the shared VPC
        variants:
          - text: Traffic can't travel through the shared VPC, because peering isn't transitive
          - text: Peering doesn't pass traffic on through a middle VPC such as the shared one
        explanation:
          text: Correct. The development and test VPCs need their own peering connection, or all three can attach to a transit gateway.
      - id: sg-shared
        text: The shared VPC's security groups drop traffic passing through
        variants:
          - text: Security groups in the shared VPC block the passing traffic
          - text: Traffic passing through is dropped by the shared VPC's security groups
        explanation:
          text: The traffic is never carried through the shared VPC at all, so its security groups never see it.
    correct_answers: [not-transitive]
    explanation:
      text: |
        VPC peering is one to one and not transitive: if A is peered with B and B with C, A can't reach C
        through B. A needs its own peering connection with C, or all the VPCs can attach to a transit
        gateway, which routes between its attachments.

  - id: q07-peering-overlapping-ranges
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: application
    topics: [vpc-peering]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After a merger, a company tries to peer its VPC with the acquired company's VPC, in another account
        and another Region. Both VPCs use the address range `10.0.0.0/16`. The peering can't be set up.
        What is the reason?
    choices:
      - id: other-account
        text: The two VPCs belong to different AWS accounts
        variants:
          - text: The VPCs sit in two different AWS accounts
          - text: Each VPC belongs to a separate AWS account
        explanation:
          text: Peering works across accounts.
      - id: other-region
        text: The two VPCs are in different AWS Regions
        variants:
          - text: The VPCs sit in two different Regions
          - text: Each VPC is in a separate Region
        explanation:
          text: Peering works across Regions, and that traffic is encrypted and stays on AWS's network.
      - id: no-igw
        text: Neither VPC has an internet gateway attached
        variants:
          - text: No internet gateway is attached to either VPC
          - text: The VPCs lack an attached internet gateway
        explanation:
          text: Peering needs no gateway at all; it joins the VPCs directly.
      - id: overlap
        text: The two VPCs' address ranges overlap
        variants:
          - text: The VPCs use overlapping address ranges
          - text: Both VPCs' address ranges are the same
        explanation:
          text: Correct. VPCs with overlapping ranges can't be peered, which is why address plans matter before connecting anything.
    correct_answers: [overlap]
    hint:
      text: Two of the details in the question are things peering handles fine.
    explanation:
      text: |
        VPC peering works across accounts and Regions, but the two VPCs' address ranges must not overlap.
        Two VPCs that both use `10.0.0.0/16` can't be peered. Planning ranges that don't overlap, before
        anything is connected, is a Well-Architected reliability habit.

  - id: q07-tgw-many-vpcs
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: application
    topics: [transit-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company has 25 VPCs in several accounts and three branch offices connected by Site-to-Site VPN.
        Every VPC must reach a shared-services VPC and all three offices. Which design is simplest to run?
    choices:
      - id: transit-gateway
        text: Attach every VPC and VPN to one AWS Transit Gateway hub
        variants:
          - text: Use an AWS Transit Gateway hub with each VPC and VPN attached
          - text: Connect each VPC and VPN once to an AWS Transit Gateway
        explanation:
          text: Correct. One attachment per network, and the hub's route tables decide who reaches whom.
      - id: full-mesh
        text: Peer every VPC with every other VPC in a full mesh
        variants:
          - text: Create a peering connection between every pair of VPCs
          - text: Join each VPC to all the others with VPC peering
        explanation:
          text: That means 300 peering connections for 25 VPCs, and peering can't carry the offices' VPN traffic between networks.
      - id: peer-to-shared
        text: Peer each VPC with the shared VPC and route through it
        variants:
          - text: Peer every VPC to the shared VPC and pass traffic through it
          - text: Connect each VPC to the shared VPC by peering and relay through it
        explanation:
          text: Peering isn't transitive, and a VPC can't lend its VPN to a peer, so traffic can't pass through the shared VPC.
      - id: privatelink-all
        text: Use AWS PrivateLink between every VPC and every other VPC
        variants:
          - text: Connect each VPC to every other one with AWS PrivateLink
          - text: Link all the VPCs to each other through AWS PrivateLink
        explanation:
          text: PrivateLink exposes single services, not whole networks.
    correct_answers: [transit-gateway]
    hint:
      text: Count the connections each design needs.
    explanation:
      text: |
        AWS Transit Gateway is a hub: each VPC, VPN connection or Direct Connect link attaches once, and
        its route tables decide which networks reach which. A full mesh of peering connections grows with
        the square of the number of VPCs and can't include the offices. The Well-Architected Framework
        prefers hub and spoke over a many-to-many mesh.

  - id: q07-privatelink-partner-service
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: application
    topics: [privatelink]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's application, in its VPC, must call a partner's fraud-checking service that runs in the
        partner's AWS account. Traffic must stay off the internet, the company must reach only that one
        service, and the partner must not be able to reach the company's network. What should be used?
    choices:
      - id: peering
        text: VPC peering between the company's and partner's VPCs
        variants:
          - text: A peering connection between the two companies' VPCs
          - text: Peering the company's VPC with the partner's
        explanation:
          text: Peering joins whole networks, both ways, as routes allow. That is more than either side wants to open.
      - id: privatelink
        text: AWS PrivateLink, through an interface endpoint
        variants:
          - text: An interface endpoint using AWS PrivateLink
          - text: AWS PrivateLink, with an interface endpoint
        explanation:
          text: Correct. The partner publishes the service as an endpoint service, and the company reaches only that service through an interface endpoint.
      - id: transit-gateway
        text: AWS Transit Gateway with both VPCs attached
        variants:
          - text: A transit gateway that both VPCs attach to
          - text: Both VPCs attached to an AWS Transit Gateway
        explanation:
          text: A transit gateway joins whole networks through a hub; it doesn't limit the company to one service.
      - id: s2s-vpn
        text: AWS Site-to-Site VPN between the two VPCs
        variants:
          - text: A Site-to-Site VPN joining the two VPCs
          - text: Site-to-Site VPN tunnels between the VPCs
        explanation:
          text: A Site-to-Site VPN connects a network such as an office to AWS over the internet. It isn't for one service between two VPCs.
    correct_answers: [privatelink]
    hint:
      text: The need is one service, not a whole network.
    explanation:
      text: |
        AWS PrivateLink connects a VPC to one service, not a whole network. The provider publishes the
        service as an endpoint service behind a Network Load Balancer, and the consumer creates an
        interface endpoint in its own subnet. The consumer reaches only that service, the provider can't
        start connections into the consumer's VPC, and no internet gateway or public address is needed.

  - id: q07-tgw-privatelink-traits
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: understanding
    topics: [vpc-peering, transit-gateway, privatelink]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements about connecting VPCs are correct? (Select TWO.)
    choices:
      - id: peering-transitive
        text: VPC peering passes traffic on through a middle VPC to a third
        variants:
          - text: Through VPC peering, traffic can hop via one VPC to reach a third
          - text: A peered VPC relays traffic on to the VPCs it is peered with
        explanation:
          text: Peering isn't transitive. Each pair of VPCs needs its own connection.
      - id: tgw-route-tables
        text: A transit gateway's route tables decide which attached networks reach each other
        variants:
          - text: Which attached networks can reach each other is set in a transit gateway's route tables
          - text: The route tables of a transit gateway control which attachments reach which
        explanation:
          text: Correct. A transit gateway is a hub that routes between its attachments.
      - id: overlap-ok
        text: VPC peering works between VPCs with overlapping address ranges
        variants:
          - text: Two VPCs with overlapping address ranges can be peered
          - text: Overlapping address ranges are no obstacle to VPC peering
        explanation:
          text: Overlapping ranges are exactly what stops a peering connection.
      - id: privatelink-one-service
        text: AWS PrivateLink exposes one service, not a whole network
        variants:
          - text: Through AWS PrivateLink, one service is shared rather than a network
          - text: AWS PrivateLink opens a single service instead of a whole network
        explanation:
          text: Correct. The consumer reaches only the one service behind the endpoint.
      - id: provider-reaches-consumer
        text: AWS PrivateLink lets the provider start connections into the consumer's VPC
        variants:
          - text: Through AWS PrivateLink, the provider can open connections into the consumer's VPC
          - text: The provider can reach into the consumer's VPC over AWS PrivateLink
        explanation:
          text: "PrivateLink works in one direction: the consumer reaches the service, not the reverse."
    correct_answers: [tgw-route-tables, privatelink-one-service]
    explanation:
      text: |
        The three links differ in how much they connect. VPC peering joins two whole VPCs, needs ranges
        that don't overlap and isn't transitive. AWS Transit Gateway is a hub for many networks, with
        route tables that decide who reaches whom. AWS PrivateLink connects a VPC to one service, in one
        direction.

  - id: q07-free-transfer-directions
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Data in is free; across, between and out usually costs"
    task: "4.1"
    level: understanding
    topics: [data-transfer, cost]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company in US East (N. Virginia) reviews its data transfer. Which two movements of data have no
        data transfer charge? (Select TWO.)
    choices:
      - id: in-from-internet
        text: Customers upload files from the internet to an S3 bucket
        variants:
          - text: Files come in from the internet to an S3 bucket
          - text: Customers send uploads from the internet into an S3 bucket
        explanation:
          text: Correct. Data in from the internet has no transfer charge.
      - id: across-az
        text: A web server sends data to a database in another Availability Zone
        variants:
          - text: Data moves from a web server to a database in a different Availability Zone
          - text: A server in one Availability Zone sends data to a database in another
        explanation:
          text: Data across Availability Zones is charged per GB, on each side.
      - id: s3-to-cloudfront
        text: CloudFront fetches content from an S3 bucket to its edge locations
        variants:
          - text: Content moves from an S3 bucket to CloudFront's edge locations
          - text: CloudFront pulls objects from an S3 origin to the edge
        explanation:
          text: Correct. Moving content from an AWS origin such as S3 to CloudFront is free.
      - id: to-other-region
        text: A backup job copies data to a bucket in another Region
        variants:
          - text: Backups are copied to a bucket in a different Region
          - text: A job sends backup copies to another Region's bucket
        explanation:
          text: Data between Regions is charged per GB.
      - id: out-to-internet
        text: Servers send large downloads to customers on the internet
        variants:
          - text: Large downloads go from the servers out to customers
          - text: Customers on the internet download large files from the servers
        explanation:
          text: Data out to the internet is charged per GB once the monthly free allowance is used.
    correct_answers: [in-from-internet, s3-to-cloudfront]
    hint:
      text: Learn the pattern by direction, not the prices.
    explanation:
      text: |
        AWS bills data transfer by direction. Data in from the internet is free, and so is data inside
        one Availability Zone over private addresses and from S3 to CloudFront. Data out to the internet,
        between Regions and across Availability Zones is charged per GB. Rates differ by Region and
        change; the pattern is what to learn.

  - id: q07-cross-az-transfer-charge
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Data in is free; across, between and out usually costs"
    task: "4.1"
    level: understanding
    topics: [data-transfer, cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company spreads its application across two Availability Zones for high availability. Its web
        servers in one zone exchange a lot of data with its database in the other zone. What does this
        traffic add to the bill?
    choices:
      - id: nothing
        text: Nothing, because traffic inside one Region is always free
        variants:
          - text: Nothing, since all traffic within a Region is free
          - text: No charge, as traffic that stays in one Region is free
        explanation:
          text: Traffic within one Availability Zone over private addresses is free; across zones it isn't.
      - id: hourly-per-az
        text: A fixed monthly fee for each Availability Zone used
        variants:
          - text: A flat monthly fee for every Availability Zone in use
          - text: One set monthly charge per Availability Zone used
        explanation:
          text: There is no fee for using an Availability Zone. The charge is for the data moved.
      - id: per-gb-cross-az
        text: A per-GB data transfer charge for the data crossing zones
        variants:
          - text: A charge for each GB of data that crosses between zones
          - text: Data transfer fees per GB for the traffic between zones
        explanation:
          text: Correct. Data across Availability Zones is charged per GB, on each side.
      - id: only-internet
        text: Nothing, because only data out to the internet is charged
        variants:
          - text: No charge, since only data sent to the internet costs money
          - text: Nothing, as data transfer charges apply to the internet only
        explanation:
          text: That is the common half-truth. Data across zones and between Regions is charged too.
    correct_answers: [per-gb-cross-az]
    hint:
      text: The data leaves one Availability Zone for another.
    explanation:
      text: |
        Data moving across Availability Zones in a Region is charged per GB, on each side. A multi-AZ
        design therefore pays a little for every byte it keeps in step between zones. It is usually worth
        it for availability, but it belongs in the cost model.

  - id: q07-only-out-costs-claim
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Data in is free; across, between and out usually costs"
    task: "4.1"
    level: understanding
    topics: [data-transfer, cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A study note says, "On AWS, data in is free and data out is charged; nothing else matters." Which
        statement corrects the note?
    choices:
      - id: in-charged
        text: Data in from the internet is charged too, at the same rate as data out
        variants:
          - text: Data coming in from the internet costs as much as data going out
          - text: Inbound data from the internet is billed at the outbound rate
        explanation:
          text: Data in from the internet is free. That part of the note is right.
      - id: all-free
        text: All data transfer is free once an account has a Savings Plan
        variants:
          - text: A Savings Plan makes every kind of data transfer free
          - text: Data transfer stops being charged when a Savings Plan is bought
        explanation:
          text: Savings Plans discount compute usage. They don't make data transfer free.
      - id: out-free-small
        text: Data out to the internet is free for every account, at any volume
        variants:
          - text: Every account sends data out to the internet free, at any volume
          - text: Data out to the internet costs nothing, however much is sent
        explanation:
          text: Only a monthly allowance is free. Beyond it, data out is charged per GB.
      - id: across-and-between
        text: Data between Regions and across Availability Zones is charged too
        variants:
          - text: Data across Availability Zones and between Regions also costs money
          - text: Charges also apply to data between Regions and across zones
        explanation:
          text: Correct. Multi-AZ and multi-Region designs pay for the data they keep in step.
    correct_answers: [across-and-between]
    explanation:
      text: |
        "In free, out charged" is true as far as it goes, but it stops too early. Data between Regions and
        across Availability Zones is charged per GB too, so a design that copies data between zones or
        Regions pays for it every month. Data out to the internet is usually the biggest item, which is
        why the half-truth spreads.

  - id: q07-vpn-customer-side
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Summary"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, site-to-site-vpn]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company connects its office to AWS with a Site-to-Site VPN. Under the AWS shared responsibility
        model, which task belongs to the company?
    choices:
      - id: aws-end
        text: Running the virtual private gateway at the VPC end of the tunnels
        variants:
          - text: Operating the virtual private gateway on the VPC side of the tunnels
          - text: Keeping the virtual private gateway at the VPC's end running
        explanation:
          text: The virtual private gateway is the AWS end of the VPN, and AWS runs it.
      - id: second-tunnel
        text: Providing the second tunnel that each VPN connection comes with
        variants:
          - text: Supplying the extra tunnel included in every VPN connection
          - text: Making the second tunnel of each VPN connection available
        explanation:
          text: AWS provides two tunnels per connection. Configuring the office end to use both of them is the company's job.
      - id: customer-gateway
        text: Configuring the router or firewall at the office end to use both tunnels
        variants:
          - text: Setting up the office's router or firewall so it uses both tunnels
          - text: Making the office end's router or firewall use both of the tunnels
        explanation:
          text: Correct. The device at the office end, its setup and using both tunnels are the company's.
      - id: aws-network
        text: Maintaining the physical network in the Region where the VPC runs
        variants:
          - text: Looking after the physical network of the Region that holds the VPC
          - text: Keeping up the physical network in the VPC's Region
        explanation:
          text: The physical network is AWS's side of the line.
    correct_answers: [customer-gateway]
    explanation:
      text: |
        AWS runs its end of each VPN, the virtual private gateway, with two tunnels per connection, plus
        its network and Direct Connect locations. The customer owns its end: the customer gateway device
        (the office's router or firewall), its setup and using both tunnels. Who may connect, encryption on Direct Connect, routes and filters, redundancy and the
        address plan are the customer's too.

flashcards:

  - id: c07-default-vpc-no-database
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: understanding
    topics: [default-vpc]
    front:
      text: Why isn't the default VPC a good home for an order database?
    back:
      text: Every subnet in it is public, and instances get public IPv4 addresses automatically. A database belongs in a private subnet.

  - id: c07-subnets-in-pairs
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: understanding
    topics: [subnets, high-availability]
    front:
      text: Why does a highly available VPC need subnets in pairs?
    back:
      text: Each subnet sits in exactly one Availability Zone, so running copies in two zones takes subnets in two zones.

  - id: c07-public-ip-without-route
    page: guide/07-connecting-it/01-your-own-network.md
    section: "\"A public IP address makes a subnet public\" is wrong"
    task: "3.5"
    level: understanding
    topics: [subnets, elastic-ip-address]
    front:
      text: A server in a subnet with no route to an internet gateway gets a public IPv4 address. What changes?
    back:
      text: Nothing reaches the internet, because there is still no route. The address only adds an hourly charge.

  - id: c07-gateway-endpoint-before-nat
    page: guide/07-connecting-it/01-your-own-network.md
    section: "VPC endpoints reach AWS services without the internet, and one kind is free"
    task: "4.1"
    level: application
    topics: [vpc-endpoints, cost]
    front:
      text: Private servers send a lot of data to Amazon S3 through a NAT gateway. What is the cheaper path?
    back:
      text: |
        A gateway endpoint for S3, with a route to it. It has no charge, and the data stops paying the
        NAT gateway's per-GB processing fee.

  - id: c07-sg-cannot-block-range
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A network ACL checks every packet entering or leaving a subnet, in number order"
    task: "3.5"
    level: understanding
    topics: [security-groups, network-acls]
    front:
      text: Why can't a security group block one bad IP address range?
    back:
      text: Security groups have allow rules only, and blocking a range takes a deny rule. A network ACL has deny rules, so the block goes in the subnet's network ACL.

  - id: c07-sg-source-group-why
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A security group allows traffic to a resource and remembers each conversation"
    task: "3.5"
    level: understanding
    topics: [security-groups]
    front:
      text: Why name a security group, rather than IP addresses, as the source in a database's rule?
    back:
      text: |
        The rule then covers every server carrying that group, including servers Auto Scaling adds
        later, with no edits.

  - id: c07-nacl-deny-below-allow
    page: guide/07-connecting-it/02-filtering-traffic.md
    section: "A network ACL checks every packet entering or leaving a subnet, in number order"
    task: "3.5"
    level: application
    topics: [network-acls]
    front:
      text: A network ACL must block one range but allow HTTPS from everyone else. How must the two rules be numbered?
    back:
      text: |
        The deny rule needs a lower number than the allow rule. Rules run from the lowest number up, and
        the first match decides.

  - id: c07-geolocation-for-rules
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Route 53 answers \"where is it?\", and it can choose the answer"
    task: "3.5"
    level: understanding
    topics: [route-53, routing-policies]
    front:
      text: A contract says users in one country must use one Region. Why geolocation routing, not latency routing?
    back:
      text: |
        Latency routing picks the fastest Region, which is usually, not always, the required one.
        Geolocation routing chooses by where the user is.

  - id: c07-cloudfront-or-global-accelerator
    page: guide/07-connecting-it/03-names-and-the-edge.md
    section: "Global Accelerator gives fixed addresses and a fast path, but keeps no copies"
    task: "3.2"
    level: understanding
    topics: [cloudfront, global-accelerator]
    front:
      text: Rule of thumb for choosing between CloudFront and Global Accelerator?
    back:
      text: |
        If a copy can answer, CloudFront. If every request must reach the application, with fixed
        addresses, non-web traffic or fast failover between Regions, Global Accelerator.

  - id: c07-private-vs-encrypted
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "\"A VPN is a private connection\" is wrong"
    task: "3.5"
    level: understanding
    topics: [private-vs-encrypted, site-to-site-vpn, direct-connect]
    front:
      text: In AWS networking, what does "private" describe, and what does "encrypted" describe?
    back:
      text: |
        Private is about the path, which avoids the public internet; encrypted is about protection. A
        VPN is encrypted, not private. Direct Connect alone is private, not encrypted.

  - id: c07-peering-mesh-growth
    page: guide/07-connecting-it/04-connecting-networks-and-offices.md
    section: "Peering, Transit Gateway and PrivateLink connect networks inside AWS"
    task: "3.5"
    level: understanding
    topics: [vpc-peering, transit-gateway]
    front:
      text: Why does VPC peering get hard to run as the number of VPCs grows?
    back:
      text: |
        Peering isn't transitive, so every pair needs its own connection: 10 VPCs need 45. A transit
        gateway needs one attachment per VPC.
