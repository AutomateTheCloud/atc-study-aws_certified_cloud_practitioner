# Module 07, Connecting it: networks and the edge. Practice questions and concept cards.
# Written from the guide's pages in guide/07-connecting-it/; see practice/work/blueprint-07.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 07.01, Your own network
  # ---------------------------------------------------------------------------------------------

  - id: q07-vpc-one-region-second-copy
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: understanding
    topics: [amazon-vpc]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its application in a VPC in US East (N. Virginia). It now plans a second copy
        of the application in Europe (Frankfurt). What does the company need for its network there?
    choices:
      - id: stretch-existing-vpc
        text: Extend the existing VPC so that it also covers Frankfurt
        variants:
          - text: Stretch the current VPC across both Regions
          - text: Add Frankfurt to the VPC that already exists
        explanation:
          text: A VPC can't span Regions. Its subnets all live in Availability Zones of the one Region it was created in.
      - id: new-vpc-in-frankfurt
        text: Create a separate VPC in the Frankfurt Region
        variants:
          - text: Build a second VPC in Europe (Frankfurt)
          - text: Set up a new VPC that belongs to the Frankfurt Region
        explanation:
          text: Correct. Each VPC belongs to one Region, so a copy in another Region needs its own VPC.
      - id: subnet-in-frankfurt
        text: Add a subnet in Frankfurt to the existing VPC
        variants:
          - text: Create a Frankfurt subnet inside the current VPC
          - text: Give the existing VPC one more subnet, located in Frankfurt
        explanation:
          text: A subnet sits in one Availability Zone of its VPC's Region. It can't be placed in another Region.
      - id: nothing-global
        text: Nothing, because a VPC is available in every Region
        variants:
          - text: No new network, since one VPC works in all Regions
          - text: Nothing new, because VPCs are global resources
        explanation:
          text: VPCs aren't global. Every account does get a default VPC in each Region, but each one is a separate network in its own Region.
    correct_answers: [new-vpc-in-frankfurt]
    hint:
      text: Think about how far a single VPC reaches.
    explanation:
      text: |
        A VPC is a virtual network that belongs to one Region. You choose its address range, subnets,
        route tables and gateways, and every subnet sits in an Availability Zone of that Region. A
        copy of a workload in another Region therefore needs a VPC of its own there.

  - id: q07-default-vpc-instance-reachable
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: application
    topics: [amazon-vpc, default-vpc]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        To save time, a team plans to run its customer database on an EC2 instance in the account's
        default VPC, keeping every network setting as AWS created it. A reviewer rejects the plan.
        Which fact about the default VPC supports the reviewer?
    choices:
      - id: shared-with-others
        text: Other AWS customers in the same Region share it with you
        variants:
          - text: It is shared among AWS customers in the same Region
          - text: Other customers in the Region use the same network too
        explanation:
          text: Every VPC, the default one included, belongs to one account and is isolated from other customers' networks.
      - id: all-subnets-public
        text: Every subnet in it is public, with a route to an internet gateway
        variants:
          - text: All of its subnets are public, routed to an internet gateway
          - text: Each of its subnets routes to an internet gateway, so all are public
        explanation:
          text: Correct. A public subnet, plus the public IPv4 address each instance gets there automatically, is no place for a database.
      - id: hourly-charge
        text: It bills by the hour for as long as it exists in the account
        variants:
          - text: It is charged hourly for as long as the account keeps it
          - text: It costs money every hour that it exists in the account
        explanation:
          text: The VPC itself has no charge. Some parts you add to a VPC bill, such as a NAT gateway or a public IPv4 address.
      - id: no-internet-gateway
        text: It has no internet gateway, so the database can't get updates
        variants:
          - text: It lacks an internet gateway, leaving the database without updates
          - text: Without an internet gateway, the database can't download updates
        explanation:
          text: The opposite is true. The default VPC comes with an internet gateway and a route to it, and that is the problem.
    correct_answers: [all-subnets-public]
    hint:
      text: Think about what AWS builds into the default VPC so that a first test instance works with no setup.
    explanation:
      text: |
        AWS creates a default VPC in each Region of every account. It has a public subnet in every
        Availability Zone, an internet gateway with a route to it, and it gives each instance a public
        IPv4 address automatically. That makes a first test easy, but because every subnet in it is
        public, it isn't where a database belongs.

  - id: q07-subnet-second-az
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: application
    topics: [subnets, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team's VPC in one Region has a single subnet, in one Availability Zone. The team wants its web
        servers to keep running, within that Region, if the Availability Zone fails. What should it do?
    choices:
      - id: bigger-subnet
        text: Give the existing subnet a larger address range
        variants:
          - text: Enlarge the current subnet's CIDR block
          - text: Make the existing subnet hold more addresses
        explanation:
          text: More addresses don't change where the subnet lives. It is still in one Availability Zone, so losing that zone still takes out every server in it.
      - id: second-igw
        text: Attach a second internet gateway to the VPC
        variants:
          - text: Add another internet gateway to the same VPC
          - text: Give the VPC an extra internet gateway
        explanation:
          text: An internet gateway is already highly available, and it doesn't add servers in another zone. The servers' subnet is the single point of failure.
      - id: stretch-subnet
        text: Extend the existing subnet into a second Availability Zone
        variants:
          - text: Stretch the current subnet across two Availability Zones
          - text: Make the existing subnet span another Availability Zone
        explanation:
          text: A subnet lives entirely in one Availability Zone and can't stretch across two. That is why subnets are built in pairs.
      - id: add-subnet-other-az
        text: Add a subnet in another Availability Zone and run servers in both
        variants:
          - text: Create a second subnet in a different Availability Zone, with servers in each
          - text: Put servers in a new subnet in another Availability Zone as well
        explanation:
          text: Correct. With servers in subnets in two Availability Zones, losing one zone leaves the other running.
    correct_answers: [add-subnet-other-az]
    hint:
      text: How many Availability Zones can one subnet cover?
    explanation:
      text: |
        Each subnet sits entirely inside one Availability Zone. To survive the loss of a zone, a workload
        needs resources in at least two zones, and so it needs subnets in at least two zones. Copies in
        another Region are disaster recovery, a different goal from surviving the loss of one zone.

  - id: q07-route-table-decides
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A VPC is a private network that you lay out inside one Region"
    task: "3.5"
    level: recall
    topics: [route-tables]
    type: multiple_choice
    selection: single
    prompt:
      text: Which part of a VPC decides where traffic leaving a subnet is sent?
    choices:
      - id: route-table
        text: The route table the subnet uses
        variants:
          - text: The subnet's own route table
          - text: The route table linked to the subnet
        explanation:
          text: Correct. Each route names a destination range and a target, such as an internet gateway.
      - id: security-group
        text: The security group on each instance
        variants:
          - text: Each instance's security group
          - text: The security groups attached to the instances
        explanation:
          text: A security group allows or refuses traffic to a resource. It doesn't choose where traffic goes.
      - id: network-acl
        text: The network ACL of the subnet
        variants:
          - text: The subnet's own network ACL
          - text: The network ACL at the subnet's edge
        explanation:
          text: A network ACL filters traffic crossing the subnet's edge. It allows or denies; it doesn't send traffic anywhere.
      - id: internet-gateway
        text: The VPC's internet gateway
        variants:
          - text: The internet gateway attached to the VPC
          - text: The VPC's attached internet gateway
        explanation:
          text: An internet gateway is a target that routes point to. It is used only when a route table sends traffic to it.
    correct_answers: [route-table]
    explanation:
      text: |
        Every subnet uses exactly one route table; if you don't choose one, it uses the VPC's main route
        table. Each route says "traffic for this destination goes to this target". Security groups and
        network ACLs decide what may pass, not where it goes.

  - id: q07-public-subnet-defined
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A subnet is public because of its route, not because of its addresses"
    task: "3.5"
    level: recall
    topics: [subnets, internet-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes a public subnet in a VPC?
    choices:
      - id: servers-public-ips
        text: A subnet whose servers have public IP addresses
        variants:
          - text: A subnet in which the servers carry public IP addresses
          - text: A subnet where the instances have been given public IP addresses
        explanation:
          text: This is the common mistake. Addresses don't decide it; a server with a public address in a subnet without the route can't reach the internet.
      - id: sg-allows-anywhere
        text: A subnet whose security groups allow traffic from anywhere
        variants:
          - text: A subnet whose security groups accept traffic from any address
          - text: A subnet in which security groups allow `0.0.0.0/0`
        explanation:
          text: Security groups filter traffic to resources. They don't make a subnet public or private.
      - id: route-to-nat
        text: A subnet whose route table sends traffic to a NAT gateway
        variants:
          - text: A subnet with a route to a NAT gateway
          - text: A subnet whose route table points at a NAT gateway
        explanation:
          text: A route to a NAT gateway is how a private subnet reaches out. The subnet stays private.
      - id: route-to-igw
        text: A subnet whose route table has a route to an internet gateway
        variants:
          - text: A subnet with a route to an internet gateway
          - text: A subnet whose route table points at an internet gateway
        explanation:
          text: Correct. The route to an internet gateway is the one thing that makes a subnet public.
    correct_answers: [route-to-igw]
    explanation:
      text: |
        A subnet is public when its route table has a route to an internet gateway, and private when it
        doesn't. Public addresses don't decide it: in the default VPC the two always come together,
        which is why people mix them up, but the route is what counts.

  - id: q07-elastic-ip-private-subnet
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A subnet is public because of its route, not because of its addresses"
    task: "3.5"
    level: application
    topics: [subnets, elastic-ip-address]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A server sits in a subnet whose route table has only the local route. To let a supplier connect
        to it from the internet, a developer attaches an Elastic IP address to the server. What is the
        result?
    choices:
      - id: reachable
        text: The supplier can now connect, because the server has a public address
        variants:
          - text: The server becomes reachable from the internet through its new address
          - text: The supplier can reach the server, since it now has a public address
        explanation:
          text: An address gives no path. Without a route to an internet gateway, traffic can't arrive from the internet or leave for it.
      - id: subnet-becomes-public
        text: The subnet becomes a public subnet, because one server has a public address
        variants:
          - text: The whole subnet turns public, since a server in it has a public address
          - text: The subnet is now public, as it holds a server with a public address
        explanation:
          text: Only a route to an internet gateway makes a subnet public. Addresses don't change the subnet.
      - id: not-reachable-costs
        text: The server still can't be reached from the internet, and the address adds a charge
        variants:
          - text: Nothing reaches the server from the internet, and the address is billed anyway
          - text: The server stays unreachable from the internet, while the address still costs money
        explanation:
          text: Correct. With no route to an internet gateway, the address does nothing, and public IPv4 addresses bill in use or idle.
      - id: outbound-only
        text: The server can start connections out, but the supplier can't connect in
        variants:
          - text: Traffic can leave the server, but none can arrive from the supplier
          - text: The server gets outbound internet access only, not inbound
        explanation:
          text: That describes a NAT gateway path. With only the local route, nothing leaves for the internet either.
    correct_answers: [not-reachable-costs]
    hint:
      text: Ask what sends traffic between this subnet and the internet.
    explanation:
      text: |
        A public address alone doesn't connect a server to the internet: its subnet also needs a route
        to an internet gateway. Here there is no such route, so nothing changes except the bill, since
        AWS charges for every public IPv4 address, including an Elastic IP address, whether or not it
        is used.

  - id: q07-reachable-server-needs
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A subnet is public because of its route, not because of its addresses"
    task: "3.5"
    level: application
    topics: [subnets, internet-gateway]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A web server in a VPC must be reachable by customers on the internet over IPv4. Which two
        things does it need? (Select TWO.)
    choices:
      - id: route-to-igw
        text: A route from its subnet's route table to an internet gateway
        variants:
          - text: A route to an internet gateway in its subnet's route table
          - text: Its subnet's route table pointing `0.0.0.0/0` at an internet gateway
        explanation:
          text: Correct. The route to an internet gateway makes the subnet public.
      - id: public-address
        text: A public IPv4 address or an Elastic IP address on the server
        variants:
          - text: A public IPv4 address assigned to the server, or an Elastic IP address
          - text: An Elastic IP address or other public IPv4 address for the server
        explanation:
          text: Correct. The internet gateway translates between the public address and the server's private one, so without a public address the route can't be used.
      - id: nat-gateway
        text: A route from its subnet's route table to a NAT gateway
        variants:
          - text: A route to a NAT gateway in its subnet's route table
          - text: Its subnet's route table pointing `0.0.0.0/0` at a NAT gateway
        explanation:
          text: A NAT gateway lets servers start connections out, and never lets anyone on the internet start one in.
      - id: gateway-endpoint
        text: A gateway endpoint attached to its subnet's route table
        variants:
          - text: A gateway endpoint reached from its subnet's route table
          - text: A route to a gateway endpoint in its subnet's route table
        explanation:
          text: A gateway endpoint reaches Amazon S3 or DynamoDB privately. It has nothing to do with customers on the internet.
      - id: second-az-subnet
        text: A second subnet in another Availability Zone
        variants:
          - text: Another subnet, in a different Availability Zone
          - text: An extra subnet placed in a second Availability Zone
        explanation:
          text: A second zone helps availability, but it doesn't make a server reachable from the internet.
    correct_answers: [route-to-igw, public-address]
    hint:
      text: One requirement is about the subnet; the other is about the server.
    explanation:
      text: |
        For IPv4, reaching the internet takes two things: the subnet's route table must send traffic to
        an internet gateway, and the server needs a public IPv4 address or an Elastic IP address for the
        gateway to translate. A route without an address can't be used, and an address without a route
        does nothing.

  - id: q07-nat-for-patches
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A NAT gateway lets private servers reach out, never the internet reach in, and it bills by the hour"
    task: "3.5"
    level: application
    topics: [nat-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's application servers sit in private subnets. They must download software updates
        from the internet, and nobody on the internet may start a connection to them. What should the
        company use?
    choices:
      - id: igw-route-private
        text: A route from the private subnets to the internet gateway
        variants:
          - text: A route to the internet gateway in the private subnets' route table
          - text: The private subnets' default route set to the internet gateway
        explanation:
          text: That makes the subnets public, and with public addresses the servers could be reached from the internet.
      - id: nat-gateway
        text: A NAT gateway, with a route to it from the private subnets
        variants:
          - text: A NAT gateway, and a route to it in the private route table
          - text: A route from the private subnets to a NAT gateway
        explanation:
          text: Correct. A NAT gateway lets private servers start connections out and refuses connections started from outside.
      - id: gateway-endpoint
        text: A gateway endpoint, with a route to it from the private subnets
        variants:
          - text: A gateway endpoint, and a route to it in the private route table
          - text: A route from the private subnets to a gateway endpoint
        explanation:
          text: A gateway endpoint reaches only Amazon S3 and DynamoDB, not update servers on the internet.
      - id: elastic-ips
        text: An Elastic IP address on each server in the private subnets
        variants:
          - text: Give each private server its own Elastic IP address
          - text: Attach Elastic IP addresses to the servers in the private subnets
        explanation:
          text: Without a route to an internet gateway, a public address does nothing, and it costs money every hour.
    correct_answers: [nat-gateway]
    hint:
      text: Who needs to start the conversation, and who must never start one?
    explanation:
      text: |
        A NAT gateway lets servers in a private subnet start connections out to the internet while
        nobody on the internet can start one in. It sits in a public subnet, and the private subnet's
        route table sends `0.0.0.0/0` to it. Routing the private subnets to the internet gateway would
        make them public instead.

  - id: q07-igw-vs-nat-contrast
    page: guide/07-connecting-it/01-your-own-network.md
    section: "A NAT gateway lets private servers reach out, never the internet reach in, and it bills by the hour"
    task: "3.5"
    level: understanding
    topics: [nat-gateway, internet-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement correctly compares an internet gateway with a NAT gateway?
    choices:
      - id: both-free-both-ways
        text: Both have no charge, and both let either side start a connection
        variants:
          - text: Neither one is billed, and either side can open a connection through both
          - text: Both are free, and connections can start from either side of both
        explanation:
          text: The NAT gateway bills by the hour and per GB, and it lets only your servers start connections.
      - id: igw-both-nat-out
        text: Through an internet gateway either side can start a connection; through a NAT gateway only your servers can
        variants:
          - text: An internet gateway lets either side start a connection, while a NAT gateway lets only your servers start one
          - text: Either side can open a connection through an internet gateway, but only your servers can through a NAT gateway
        explanation:
          text: Correct. That difference in direction is why a NAT gateway keeps private servers private.
      - id: igw-out-nat-both
        text: Through an internet gateway only your servers can start a connection; through a NAT gateway either side can
        variants:
          - text: An internet gateway lets only your servers start a connection, while a NAT gateway lets either side start one
          - text: Only your servers can open a connection through an internet gateway, but either side can through a NAT gateway
        explanation:
          text: This reverses the two. The internet gateway works in both directions; the NAT gateway works outward only.
      - id: nat-replaces-igw
        text: A NAT gateway replaces the internet gateway, so a VPC uses one or the other
        variants:
          - text: A VPC uses either a NAT gateway or an internet gateway, never both
          - text: A NAT gateway takes the internet gateway's place in a VPC
        explanation:
          text: A NAT gateway works together with an internet gateway. It sits in a public subnet, whose route leads to the internet gateway.
    correct_answers: [igw-both-nat-out]
    explanation:
      text: |
        Both are route targets that connect a VPC to the internet. An internet gateway works both ways
        and has no charge; a NAT gateway lets only your servers start connections, and bills for every
        hour it exists and every GB it processes. If the internet must reach something, use a public
        subnet; if it only needs to reach out, keep it private behind a NAT gateway.

  - id: q07-nat-gateway-not-free
    page: guide/07-connecting-it/01-your-own-network.md
    section: "\"A NAT gateway is free\" is wrong"
    task: "4.1"
    level: understanding
    topics: [nat-gateway, cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team leaves a NAT gateway running in a test VPC "because gateways are free", although almost no
        traffic passes through it. Which statement about its cost is correct?
    choices:
      - id: free-like-igw
        text: It has no charge, like an internet gateway
        variants:
          - text: It costs nothing, the same as an internet gateway
          - text: Like an internet gateway, it isn't billed
        explanation:
          text: The internet gateway is free; the NAT gateway isn't. Sharing the word "gateway" is what makes this tempting.
      - id: only-per-gb
        text: It bills only for the data it processes, so an idle one costs nothing
        variants:
          - text: It charges per GB processed only, so it costs nothing while idle
          - text: Only its data processing is billed, so an idle one is free
        explanation:
          text: It charges per GB too, but the hourly charge runs whether or not data moves.
      - id: hourly-and-per-gb
        text: It bills for every hour it exists and for each GB it processes
        variants:
          - text: It is charged by the hour while it exists, plus per GB processed
          - text: It costs an hourly fee for as long as it exists, and a fee per GB
        explanation:
          text: Correct. At low traffic, the hourly charge is most of the bill, so an idle NAT gateway still costs money.
      - id: only-when-attached
        text: It bills only while a private subnet's route table points to it
        variants:
          - text: It is charged only when a route table sends traffic to it
          - text: It costs money only while some route targets it
        explanation:
          text: The hourly charge runs for every hour the NAT gateway exists, whatever the route tables say.
    correct_answers: [hourly-and-per-gb]
    hint:
      text: Two charges apply. Does either of them depend on traffic?
    explanation:
      text: |
        A NAT gateway bills for every hour it exists, a partial hour counting as a full one, and for
        every GB it processes; its Elastic IP address bills too. The internet gateway has no charge.
        Because the hourly charge doesn't depend on traffic, a NAT gateway left running "just in case"
        costs almost as much as a busy one. (Exact rates are on the Amazon VPC pricing page and change.)

  - id: q07-dynamodb-gateway-endpoint
    page: guide/07-connecting-it/01-your-own-network.md
    section: "VPC endpoints reach AWS services without the internet, and one kind is free"
    task: "3.5"
    level: application
    topics: [vpc-endpoints, cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Servers in a company's private subnets write large amounts of data to Amazon DynamoDB in the same
        Region. The traffic currently goes through a NAT gateway, and its per-GB charge keeps growing.
        Which change removes that charge at no extra cost?
    choices:
      - id: second-nat
        text: Add a second NAT gateway in the other Availability Zone
        variants:
          - text: Run another NAT gateway in a second Availability Zone
          - text: Put an extra NAT gateway in the other Availability Zone
        explanation:
          text: The traffic would still pass through a NAT gateway and pay per GB, plus a second hourly charge.
      - id: public-subnets
        text: Move the servers into public subnets with public addresses
        variants:
          - text: Put the servers in public subnets and give them public addresses
          - text: Shift the servers to public subnets, each with a public address
        explanation:
          text: That puts the servers on the internet and adds public IPv4 charges, to solve a problem a free endpoint solves privately.
      - id: interface-endpoint
        text: Add an interface endpoint for DynamoDB in each of the Availability Zones
        variants:
          - text: Create interface endpoints for DynamoDB in every one of the Availability Zones
          - text: Place a DynamoDB interface endpoint in each of the Availability Zones
        explanation:
          text: An interface endpoint also avoids the NAT gateway, but it bills hourly in each zone and per GB, so it isn't free.
      - id: gateway-endpoint
        text: Add a gateway endpoint for DynamoDB, with a route to it from the private subnets
        variants:
          - text: Create a DynamoDB gateway endpoint and route the private subnets to it
          - text: Route the private subnets to a new gateway endpoint for DynamoDB
        explanation:
          text: Correct. Gateway endpoints exist for Amazon S3 and DynamoDB, have no charge, and take the traffic off the NAT gateway.
    correct_answers: [gateway-endpoint]
    hint:
      text: One kind of VPC endpoint has no charge. Which services does it cover?
    explanation:
      text: |
        A VPC endpoint gives a VPC a private path to an AWS service, so the traffic no longer passes
        through the NAT gateway. For Amazon S3 and DynamoDB, the gateway endpoint is the free choice: it
        is a route-table entry with no charge. Interface endpoints cover many more services but bill by
        the hour and per GB.

  - id: q07-gateway-endpoint-traits
    page: guide/07-connecting-it/01-your-own-network.md
    section: "VPC endpoints reach AWS services without the internet, and one kind is free"
    task: "3.5"
    level: recall
    topics: [vpc-endpoints]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which two statements describe a gateway endpoint? (Select TWO.)
    choices:
      - id: s3-dynamodb-only
        text: It serves only Amazon S3 and Amazon DynamoDB
        variants:
          - text: It works with Amazon S3 and Amazon DynamoDB only
          - text: Amazon S3 and Amazon DynamoDB are the only services it reaches
        explanation:
          text: Correct. For any other service, an interface endpoint is the option.
      - id: route-table-entry
        text: It is reached through an entry in a route table
        variants:
          - text: A route in your route table points traffic at it
          - text: It attaches to the VPC as a route-table entry
        explanation:
          text: Correct. A gateway endpoint is a route target, not an address in your subnet.
      - id: privatelink
        text: It is built on AWS PrivateLink technology
        variants:
          - text: AWS PrivateLink is the technology behind it
          - text: It runs on AWS PrivateLink technology
        explanation:
          text: That is the interface endpoint. Gateway endpoints don't use PrivateLink.
      - id: hourly-per-az
        text: It bills by the hour in each Availability Zone where it is placed
        variants:
          - text: It is charged hourly for every Availability Zone it is in
          - text: Each Availability Zone it serves adds an hourly charge
        explanation:
          text: That is the interface endpoint's pricing. Gateway endpoints have no charge.
      - id: network-interface
        text: It adds a network interface with a private IP address to your subnet
        variants:
          - text: It places a network interface with a private IP address in your subnet
          - text: A network interface with its own private IP address appears in your subnet
        explanation:
          text: That is how an interface endpoint attaches. A gateway endpoint is a route instead.
    correct_answers: [s3-dynamodb-only, route-table-entry]
    explanation:
      text: |
        The two kinds of VPC endpoint differ in services, attachment and cost. A gateway endpoint covers
        Amazon S3 and DynamoDB only, is reached through a route-table entry and has no charge. An
        interface endpoint, built on AWS PrivateLink, puts a network interface with a private address in
        your subnet, reaches many services, and bills hourly per zone and per GB.

  - id: q07-interface-endpoint-sqs
    page: guide/07-connecting-it/01-your-own-network.md
    section: "VPC endpoints reach AWS services without the internet, and one kind is free"
    task: "3.5"
    level: application
    topics: [vpc-endpoints, privatelink]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Servers in a private subnet must send messages to Amazon SQS. The security team wants the traffic
        to stay on AWS's network, with no NAT gateway and no route to the internet. What should the
        company add?
    choices:
      - id: interface-endpoint
        text: An interface endpoint for Amazon SQS in the private subnet
        variants:
          - text: An Amazon SQS interface endpoint placed in the private subnet
          - text: An interface endpoint in the private subnet that leads to Amazon SQS
        explanation:
          text: Correct. Interface endpoints, built on AWS PrivateLink, reach many AWS services through a private address in your subnet.
      - id: gateway-endpoint
        text: A gateway endpoint for Amazon SQS in the private route table
        variants:
          - text: An Amazon SQS gateway endpoint reached from the private route table
          - text: A gateway endpoint for Amazon SQS, routed from the private subnet
        explanation:
          text: Gateway endpoints exist only for Amazon S3 and DynamoDB.
      - id: igw-route
        text: A route from the private subnet to the internet gateway
        variants:
          - text: A route in the private route table to the internet gateway
          - text: The private subnet's default route set to the internet gateway
        explanation:
          text: That makes the subnet public and sends the traffic over the internet, which the team wants to avoid.
      - id: elastic-ip
        text: An Elastic IP address on each server in the private subnet
        variants:
          - text: Give every server in the private subnet an Elastic IP address
          - text: Attach Elastic IP addresses to the private servers
        explanation:
          text: Addresses without a route to an internet gateway do nothing, and the goal is to avoid the internet anyway.
    correct_answers: [interface-endpoint]
    hint:
      text: Which kind of endpoint covers services beyond S3 and DynamoDB?
    explanation:
      text: |
        A VPC endpoint gives private servers a path to an AWS service that stays on AWS's network. Gateway
        endpoints cover only Amazon S3 and DynamoDB, so for a service such as Amazon SQS the answer is an
        interface endpoint, built on AWS PrivateLink. It bills hourly per Availability Zone and per GB.

  - id: q07-free-vpc-parts
    page: guide/07-connecting-it/01-your-own-network.md
    section: "Summary"
    task: "4.1"
    level: recall
    topics: [cost, amazon-vpc]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A learner wants to practice building a VPC without paying anything. Which two parts can the
        learner create without any charge? (Select TWO.)
    choices:
      - id: nat-gateway
        text: A NAT gateway
        variants:
          - text: One NAT gateway
          - text: A single NAT gateway
        explanation:
          text: A NAT gateway bills for every hour it exists and every GB it processes.
      - id: internet-gateway
        text: An internet gateway
        variants:
          - text: One internet gateway
          - text: A single internet gateway
        explanation:
          text: Correct. The internet gateway itself has no charge.
      - id: elastic-ip
        text: An unused Elastic IP address
        variants:
          - text: An idle Elastic IP address
          - text: An Elastic IP address attached to nothing
        explanation:
          text: Every public IPv4 address, including an Elastic IP address, bills by the hour, in use or idle.
      - id: gateway-endpoint
        text: A gateway endpoint for Amazon S3
        variants:
          - text: An Amazon S3 gateway endpoint
          - text: A gateway endpoint that reaches Amazon S3
        explanation:
          text: Correct. Gateway endpoints have no charge.
      - id: interface-endpoint
        text: An interface endpoint for an AWS service
        variants:
          - text: An AWS service's interface endpoint
