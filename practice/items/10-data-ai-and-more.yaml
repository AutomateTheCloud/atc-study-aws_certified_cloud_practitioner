    correct_answers: [connect, lex]
    explanation:
      text: |
        A contact center that needs a bot uses both services. Amazon Connect (Connect Customer) owns the
        phone line, flows, queues and agents; Amazon Lex understands what the caller wants. The call
        starts and ends in Connect, which hands the caller to the Lex bot and back to a queue for an agent
        when the bot can't help.

  - id: q10-connect-lex-independent
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "Connect runs the contact center; Lex is the bot inside it"
    task: "3.8"
    level: understanding
    topics: [connect, lex]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement about Amazon Connect and Amazon Lex is accurate?
    choices:
      - id: connect-builds-bots
        text: Connect is the service that builds chatbots, and Lex supplies phone numbers
        variants:
          - text: Connect builds the chatbots, while Lex supplies the phone numbers
          - text: Lex gives the phone numbers, and Connect is where chatbots are built
        explanation:
          text: The roles are reversed. Lex builds the bot; Connect owns the phone numbers.
      - id: need-each-other
        text: Neither works alone; every Connect center needs Lex, and every Lex bot needs Connect
        variants:
          - text: Each needs the other; a Connect center needs Lex, and a Lex bot needs Connect
          - text: They can't be used apart; Connect requires Lex, and Lex requires Connect
        explanation:
          text: Each works without the other. They are a pair when a contact center needs a bot.
      - id: each-alone
        text: Connect can run with human agents only, and Lex can run in a website chat alone
        variants:
          - text: Connect works with only human agents, and a Lex bot works alone in web chat
          - text: A Lex bot can serve a website chat by itself, and Connect can use only people
        explanation:
          text: Correct. A call center with only people needs only Connect; a website chat bot needs only Lex.
      - id: same-service
        text: They are two names for one service, after AWS renamed Lex to Connect
        variants:
          - text: AWS renamed Lex to Connect, so the two names mean one service
          - text: Connect is the new name for Lex, so both names mean the same service
        explanation:
          text: They are different services. The rename was Amazon Connect to Amazon Connect Customer.
    correct_answers: [each-alone]
    explanation:
      text: |
        Amazon Connect (Connect Customer) is a contact center: phone numbers, queues, routing, flows,
        agents and reports. Amazon Lex builds chat and voice bots. A contact center that needs a bot uses
        both; a website chat bot needs only Lex; a call center staffed only by people needs only Connect.
        On the exam, Connect sits under business applications and Lex under machine learning.

  - id: q10-ses-ticket-confirmations
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "SES sends email at scale"
    task: "3.8"
    level: application
    topics: [ses]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A concert ticket seller wants its booking system to send each buyer a styled confirmation with
        their seats and a receipt, from the seller's own domain, plus a monthly newsletter to fans who
        opted in. It doesn't want to run mail servers. Which service fits?
    choices:
      - id: sns
        text: Amazon SNS
        variants:
          - text: Amazon Simple Notification Service
          - text: An Amazon SNS topic
        explanation:
          text: SNS pushes short notifications to subscribers by several channels; its email is a plain alert, not a styled confirmation from your own domain.
      - id: ses
        text: Amazon SES
        variants:
          - text: Amazon Simple Email Service
          - text: Email sent with Amazon SES
        explanation:
          text: Correct. SES sends transactional and marketing email from your own addresses and domains.
      - id: connect
        text: Amazon Connect
        variants:
          - text: Amazon Connect Customer
          - text: A contact center in Amazon Connect
        explanation:
          text: Connect runs a contact center for conversations with customers. It isn't for sending confirmations and newsletters.
      - id: amplify
        text: AWS Amplify
        variants:
          - text: AWS Amplify Hosting
          - text: A site hosted with AWS Amplify
        explanation:
          text: Amplify builds and hosts the booking website, but it doesn't send the emails.
    correct_answers: [ses]
    hint:
      text: Two kinds of email, one service built for both.
    explanation:
      text: |
        Amazon Simple Email Service (Amazon SES) sends and receives email from your own addresses and
        domains: transactional email such as confirmations and password resets, and marketing email such
        as newsletters, with no mail servers to run. SNS sends short notifications to subscribers and is
        not an email platform.

  - id: q10-amplify-nonprofit-app
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "Amplify builds and hosts web and mobile front ends"
    task: "3.8"
    level: application
    topics: [amplify]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A food bank's only developer keeps its volunteer website's code in a Git repository. She wants
        every commit she makes deployed automatically, with no servers to look after, and wants to add
        volunteer sign-in to the food bank's phone app without wiring AWS services by hand. Which
        service fits both needs?
    choices:
      - id: beanstalk
        text: AWS Elastic Beanstalk
        variants:
          - text: Elastic Beanstalk
          - text: An AWS Elastic Beanstalk environment
        explanation:
          text: Beanstalk runs server-side applications on EC2 instances it builds in your account. It isn't a front-end and mobile toolkit.
      - id: lightsail
        text: Amazon Lightsail
        variants:
          - text: Lightsail
          - text: An Amazon Lightsail instance
        explanation:
          text: Lightsail rents a simple server at a fixed monthly price. She would set it up, update it and deploy to it herself.
      - id: ec2
        text: Amazon EC2
        variants:
          - text: EC2
          - text: An Amazon EC2 instance
        explanation:
          text: An EC2 instance is a server for her to run and patch, the opposite of what she wants.
      - id: amplify
        text: AWS Amplify
        variants:
          - text: Amplify
          - text: The AWS Amplify tools
        explanation:
          text: Correct. Amplify Hosting builds and deploys every commit from Git, and Amplify's libraries add sign-in and other back-end features to web and mobile apps.
    correct_answers: [amplify]
    hint:
      text: One service is aimed at front-end and mobile developers rather than at running servers.
    explanation:
      text: |
        AWS Amplify is a set of tools and services for building, connecting and hosting web and mobile
        apps. Amplify Hosting connects to a Git repository and builds and deploys every change; its
        libraries and back-end tools add sign-in, data and file storage. Elastic Beanstalk and Lightsail
        are for running servers and server-side applications.

  - id: q10-iot-vineyard-sensors
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "IoT Core connects devices and routes what they send"
    task: "3.8"
    level: application
    topics: [iot-core]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A vineyard puts 2,000 soil-moisture sensors in its fields. Each sensor must prove its identity
        to AWS and publish small readings over MQTT, and the readings must be routed to a store for
        history and to an alerting service when the soil is too dry. Which service is built for this?
    choices:
      - id: iot-core
        text: AWS IoT Core
        variants:
          - text: IoT Core
          - text: The AWS IoT Core service
        explanation:
          text: Correct. IoT Core connects devices securely, authenticates each with a certificate, speaks MQTT and routes messages with rules.
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A Kinesis data stream
        explanation:
          text: Kinesis streams data once it's in AWS. It doesn't connect, authenticate or manage devices.
      - id: greengrass
        text: AWS IoT Greengrass
        variants:
          - text: IoT Greengrass
          - text: The AWS IoT Greengrass software
        explanation:
          text: Greengrass is software that runs on devices, and it's out of the exam's scope. The device gateway in AWS is IoT Core.
      - id: sqs
        text: Amazon SQS
        variants:
          - text: SQS
          - text: An Amazon SQS queue
        explanation:
          text: SQS is a message queue between applications, with no device identity or MQTT.
    correct_answers: [iot-core]
    hint:
      text: Three words in the request point at devices, not applications.
    explanation:
      text: |
        AWS IoT Core lets connected devices talk securely to AWS services. Devices usually speak MQTT, a
        lightweight protocol; each proves its identity, typically with a certificate; and IoT rules send
        matching messages to other services such as S3, Lambda or SNS. Analyzing large streams once the
        data is in AWS is a job for the analytics services.

  - id: q10-iot-rule-greenhouse
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "IoT Core connects devices and routes what they send"
    task: "3.8"
    level: understanding
    topics: [iot-core]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A greenhouse's sensors send temperature readings to AWS IoT Core. The grower wants only readings
        above 35 °C to go to an Amazon SNS topic that texts her. Which part of IoT Core does that
        selection and hand-off?
    choices:
      - id: device-shadow
        text: The Device Shadow, which keeps each sensor's last reported state
        variants:
          - text: Each sensor's Device Shadow, holding its last reported state
          - text: The Device Shadow storing every sensor's last reported state
        explanation:
          text: A Device Shadow lets apps read a device's last state, even while it's offline. It doesn't pick out readings and send them on.
      - id: iot-rule
        text: An IoT rule, which filters the messages and sends matches to SNS
        variants:
          - text: An IoT rule that filters messages and passes matches on to SNS
          - text: An IoT rule, filtering the readings and sending matches to SNS
        explanation:
          text: Correct. A rule is a SQL-like filter on incoming messages that sends matching data to other AWS services.
      - id: mqtt
        text: MQTT, which decides which readings each topic should send on
        variants:
          - text: MQTT itself, deciding which readings each topic sends on
          - text: The MQTT protocol, choosing which readings go out per topic
        explanation:
          text: MQTT is how devices publish messages to topics. It doesn't filter them or route them to other services.
      - id: certificate
        text: The sensor's certificate, which allows only warm readings out
        variants:
          - text: Each sensor's certificate, letting only warm readings through
          - text: The certificate on the sensor, passing only warm readings on
        explanation:
          text: A certificate proves which device is talking. It doesn't look at what the reading says.
    correct_answers: [iot-rule]
    explanation:
      text: |
        IoT Core itself doesn't send the warning. An IoT rule, a SQL-like filter on incoming messages,
        picks the readings that matter and hands them to another service, such as an SNS topic that emails
        or texts. Another rule could send every reading to S3 for history.

  - id: q10-euc-iot-customer-side-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "You are responsible for security in the cloud, and how much depends on the service"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, workspaces, iot-core]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A manufacturer uses Amazon WorkSpaces for its designers and AWS IoT Core for its factory
        sensors. Under the shared responsibility model, which two tasks are the manufacturer's? (Select
        TWO.)
    choices:
      - id: streaming-servers
        text: Patching the servers that stream the WorkSpaces desktops
        variants:
          - text: Keeping the WorkSpaces streaming servers patched
          - text: Applying patches to the servers behind the WorkSpaces streams
        explanation:
          text: AWS runs the streaming servers. What's installed on the desktops themselves is the customer's.
      - id: who-signs-in
        text: Deciding who may sign in to the desktops, through a directory and MFA
        variants:
          - text: Controlling desktop sign-in through a directory and MFA
          - text: Choosing who can log in to the desktops, with a directory and MFA
        explanation:
          text: Correct. Who may sign in, what's installed and settings such as clipboard use stay with the customer.
      - id: device-gateway
        text: Keeping IoT Core's device gateway running for the sensors
        variants:
          - text: Running the IoT Core gateway that the sensors connect to
          - text: Keeping the device gateway of IoT Core available
        explanation:
          text: AWS runs the device gateway. It's a managed service.
      - id: device-certs
        text: Managing each sensor's certificate and policy, and its software
        variants:
          - text: Looking after each sensor's certificate, policy and software
          - text: Each sensor's certificate and policy, plus the software on it
        explanation:
          text: Correct. Device identity, permissions, the sensors' software and where rules send the data are the customer's.
      - id: hardware-failures
        text: Replacing failed hardware in the data centers behind both services
        variants:
          - text: Swapping out failed hardware behind both services
          - text: Fixing hardware failures in the data centers for both services
        explanation:
          text: Physical hardware and data centers are always AWS's side of the line.
    correct_answers: [who-signs-in, device-certs]
    explanation:
      text: |
        AWS runs the streaming servers, the device gateway and the infrastructure underneath. The
        customer keeps its users and their permissions (a directory, MFA), what's installed on the
        desktops, each device's certificate and policy, the software on the sensors, and where IoT rules
        send the data.

  - id: q10-resort-needs-matched-two
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "The big picture: four kinds of user, seven services"
    task: "3.8"
    level: application
    topics: [end-user-computing, iot-core, amplify, ses, connect]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A holiday resort lists five needs and a proposed service for each. Which two matches are
        correct? (Select TWO.)
    choices:
      - id: thermostats-iot
        text: Room thermostats reporting temperatures to AWS, matched with AWS IoT Core
        variants:
          - text: AWS IoT Core, for room thermostats that report temperatures to AWS
          - text: Thermostats in the rooms sending temperatures to AWS, with AWS IoT Core
        explanation:
          text: Correct. Devices connect through IoT Core.
      - id: queue-ses
        text: A front-desk phone line with a queue for callers, matched with Amazon SES
        variants:
          - text: Amazon SES, for a front-desk phone line that queues callers
          - text: A phone line at the front desk with a caller queue, with Amazon SES
        explanation:
          text: SES sends email. A phone line with queues is Amazon Connect (Connect Customer).
      - id: website-amplify
        text: A booking website deployed from Git on every commit, matched with AWS Amplify
        variants:
          - text: AWS Amplify, for a booking site deployed from Git on each commit
          - text: A booking website that deploys from Git with each commit, with AWS Amplify
        explanation:
          text: Correct. Amplify Hosting deploys every commit from the Git repository.
      - id: auditors-applications
        text: A whole desktop for the night auditors, matched with WorkSpaces Applications
        variants:
          - text: WorkSpaces Applications, for whole desktops for the night auditors
          - text: Full desktops for the night auditors, with WorkSpaces Applications
        explanation:
          text: WorkSpaces Applications streams one or a few apps. A whole desktop is Amazon WorkSpaces.
      - id: emails-connect
        text: Booking confirmation emails to guests, matched with Amazon Connect
        variants:
          - text: Amazon Connect, for booking confirmation emails to guests
          - text: Guests' booking confirmation emails, with Amazon Connect
        explanation:
          text: Connect is for conversations with customers. Confirmation emails are Amazon SES.
    correct_answers: [thermostats-iot, website-amplify]
    hint:
      text: For each need, ask who is on the other end, then what they need.
    explanation:
      text: |
        Ask who is on the other end. Staff needing a whole desktop get Amazon WorkSpaces, or WorkSpaces
        Applications for one or two apps; customers on the phone get Amazon Connect, and customers by email
        get Amazon SES; app users get a front end built and hosted with AWS Amplify; devices connect through
        AWS IoT Core.

flashcards:

  - id: c10-glue-not-the-query
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Catalog: Glue records what your data looks like and gets it ready"
    task: "3.7"
    level: understanding
    topics: [glue]
    front:
      text: A question asks which service *runs the query* over files in S3. Why is AWS Glue the wrong pick?
    back:
      text: Glue discovers, catalogs and transforms data so others can query it. It doesn't answer questions; a query service such as Athena does.

  - id: c10-athena-table-definitions
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Catalog: Glue records what your data looks like and gets it ready"
    task: "3.7"
    level: recall
    topics: [athena, glue]
    front:
      text: Where does Athena find the column names and types for a folder of files in S3?
    back:
      text: In a data catalog, normally the AWS Glue Data Catalog. A Glue crawler or a table you create in Athena puts the definition there.

  - id: c10-streams-or-firehose
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: understanding
    topics: [data-streams, data-firehose]
    front:
      text: Kinesis Data Streams or Amazon Data Firehose? Which question usually decides?
    back:
      text: Must your own programs read the records, perhaps several of them or again later? Then Data Streams. Just land them in a store with no code? Then Firehose.

  - id: c10-sqs-not-a-stream
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: understanding
    topics: [sqs, data-streams]
    front:
      text: Why is Amazon SQS the wrong answer when several programs must read the same flow of records?
    back:
      text: SQS hands each message to one worker, which deletes it when the job is done. Nothing stays for a second program or a replay.

  - id: c10-kda-sql-as-answer
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: recall
    topics: [kinesis, retired-services]
    front:
      text: How should you treat "Kinesis Data Analytics for SQL" when it appears as an answer?
    back:
      text: As a wrong answer. New SQL applications stopped on 2025-10-15 and AWS began deleting existing ones on 2026-01-27 (checked 2026-10-24).

  - id: c10-when-redshift-not-athena
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: understanding
    topics: [redshift, athena]
    front:
      text: What signals that a pipeline's query step should move from Athena to Redshift?
    back:
      text: Regular, complex reports that join data combined from many sources, run again and again. Occasional questions over files in S3 stay with Athena.

  - id: c10-dashboards-not-query
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Visualize: Quick Sight turns answers into dashboards"
    task: "3.7"
    level: understanding
    topics: [quick-sight]
    front:
      text: A question asks for dashboards for business users. Why isn't the answer Athena or Redshift?
    back:
      text: They run the queries. Amazon Quick Sight draws the dashboards, using services such as Athena or Redshift as its data sources.

  - id: c10-documents-pictures-text
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Pictures and documents: Rekognition sees, Textract reads"
    task: "3.7"
    level: understanding
    topics: [textract, rekognition, comprehend]
    front:
      text: Textract, Rekognition or Comprehend? State the rule that tells them apart.
    back:
      text: Documents go to Textract, pictures of the world go to Rekognition, and text you already have goes to Comprehend.

  - id: c10-when-sagemaker-ai
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "When nothing ready-made fits, SageMaker AI builds your own model"
    task: "3.7"
    level: understanding
    topics: [sagemaker-ai]
    front:
      text: When does a team choose Amazon SageMaker AI over a ready-made AI service?
    back:
      text: When no ready-made service covers the need, typically because the answer must be learned from the team's own data. It takes ML skills.

  - id: c10-comprehend-or-macie
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Warm-up: what you remember"
    task: "3.7"
    level: understanding
    topics: [comprehend, personal-data]
    front:
      text: Amazon Comprehend and Amazon Macie can both find personal data. What decides between them?
    back:
      text: Where the data is. Comprehend checks text that you send it; Macie scans data already stored in S3 buckets.

  - id: c10-closed-to-new-customers
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Amazon Q, and the AI names that are closed"
    task: "3.7"
    level: understanding
    topics: [retired-services]
    front:
      text: What does "closed to new customers" mean for a service such as Amazon Kendra?
    back:
      text: Existing customers keep using it; new customers can't sign up. Treat it as a wrong answer for a new design.

  - id: c10-workspaces-family-by-view
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "WorkSpaces Applications streams single apps; Secure Browser streams one web browser"
    task: "3.8"
    level: understanding
    topics: [workspaces, workspaces-applications, workspaces-secure-browser]
    front:
      text: How do you choose among WorkSpaces, WorkSpaces Applications and WorkSpaces Secure Browser?
    back:
      text: 'By what the user sees: a whole desktop (WorkSpaces), one or a few apps (WorkSpaces Applications), or one web browser (Secure Browser).'

  - id: c10-connect-lex-which
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "Connect runs the contact center; Lex is the bot inside it"
    task: "3.8"
    level: application
    topics: [connect, lex]
    front:
      text: Which services does each need? A website chat bot; a call center staffed only by people; a call center with a bot first.
    back:
      text: Lex alone; Connect alone; Connect with a Lex bot inside its flow.

  - id: c10-iot-rule-sends-alert
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "IoT Core connects devices and routes what they send"
    task: "3.8"
    level: understanding
    topics: [iot-core]
    front:
      text: Does AWS IoT Core itself send a "freezer too warm" text to the owner?
    back:
      text: No. An IoT rule picks out the warm readings and hands them to another service, such as an Amazon SNS topic, which sends the text.
