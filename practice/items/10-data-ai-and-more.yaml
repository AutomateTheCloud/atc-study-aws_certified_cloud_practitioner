# Module 10, Data, AI and the rest of the catalog. Practice questions and concept cards.
# Written from the guide's pages in guide/10-data-ai-and-more/; see practice/work/blueprint-10.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 10.01, Analytics in five verbs (and Lab 13)
  # ---------------------------------------------------------------------------------------------

  - id: q10-verb-and-service-pair
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "The big picture: five verbs, from raw data to a dashboard"
    task: "3.7"
    level: understanding
    topics: [analytics-pipeline]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An analytics pipeline has five jobs: ingest, catalog, query, search and visualize. Which
        pairing of a job and the AWS service that does it is correct?
    choices:
      - id: visualize-athena
        text: Visualize, with Amazon Athena
        variants:
          - text: The visualize job, done by Athena
          - text: Athena, for the visualize step
        explanation:
          text: Athena runs SQL queries and returns tables of results. Turning results into dashboards is Amazon Quick Sight's job.
      - id: catalog-glue
        text: Catalog, with AWS Glue
        variants:
          - text: The catalog job, done by Glue
          - text: AWS Glue, for the catalog step
        explanation:
          text: Correct. Glue's Data Catalog records where each set of files is and what its columns are, and its crawlers fill it in.
      - id: search-data-streams
        text: Search, with Amazon Kinesis Data Streams
        variants:
          - text: The search job, done by Kinesis Data Streams
          - text: Kinesis Data Streams, for the search step
        explanation:
          text: Kinesis Data Streams ingests records as they happen. Finding words and patterns in text and logs is Amazon OpenSearch Service's job.
      - id: ingest-quick-sight
        text: Ingest, with Amazon Quick Sight
        variants:
          - text: The ingest job, done by Quick Sight
          - text: Amazon Quick Sight, for the ingest step
        explanation:
          text: Quick Sight sits at the other end of the pipeline. It shows results as dashboards; it doesn't bring data in.
    correct_answers: [catalog-glue]
    explanation:
      text: |
        Each analytics service on the exam does one of the five jobs. Kinesis Data Streams and Amazon
        Data Firehose ingest; AWS Glue catalogs; Athena, Redshift and EMR query; OpenSearch Service
        searches; Amazon Quick Sight visualizes. Placing a service on its verb first is the quickest
        way to rule out the look-alikes.

  - id: q10-two-ingest-services
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "The big picture: five verbs, from raw data to a dashboard"
    task: "3.7"
    level: recall
    topics: [analytics-pipeline, kinesis]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A team is drawing its analytics pipeline. Which two AWS services belong in the first step,
        bringing data in as it is created? (Select TWO.)
    choices:
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: The Amazon Kinesis Data Streams service
        explanation:
          text: Correct. Data Streams collects records as they happen and keeps them for your own programs to read.
      - id: glue
        text: AWS Glue
        variants:
          - text: Glue
          - text: The AWS Glue service
        explanation:
          text: Glue describes and prepares data that has already arrived. It is the catalog step, not the ingest step.
      - id: firehose
        text: Amazon Data Firehose
        variants:
          - text: Data Firehose
          - text: The Amazon Data Firehose service
        explanation:
          text: Correct. Firehose takes in streaming data and delivers it to a store such as S3, with no code. Its old name is Kinesis Data Firehose.
      - id: quick-sight
        text: Amazon Quick Sight
        variants:
          - text: Quick Sight
          - text: The Amazon Quick Sight service
        explanation:
          text: Quick Sight is the last step, turning answers into dashboards.
      - id: opensearch
        text: Amazon OpenSearch Service
        variants:
          - text: OpenSearch Service
          - text: The Amazon OpenSearch Service
        explanation:
          text: OpenSearch Service is the search step. Firehose can deliver data into it, but it doesn't ingest data on its own.
    correct_answers: [data-streams, firehose]
    explanation:
      text: |
        Ingest is the job of getting data into the pipeline as it happens. On the exam's list, that's
        Amazon Kinesis Data Streams and Amazon Data Firehose (formerly Kinesis Data Firehose). Glue
        catalogs, OpenSearch Service searches and Quick Sight visualizes.

  - id: q10-firehose-gate-scans-to-s3
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: application
    topics: [kinesis, data-firehose]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ski resort's lift gates send an event each time a pass is scanned. The resort wants the
        events saved as Parquet files in an S3 bucket every few minutes, for reports the next day.
        It has no developers to write or run programs for this. Which service should it use?
    choices:
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A stream in Amazon Kinesis Data Streams
        explanation:
          text: Data Streams holds the events, but getting them into S3 takes consumer programs the resort would write and run. Nothing here needs to react within seconds or replay data.
      - id: sqs
        text: Amazon SQS
        variants:
          - text: Amazon Simple Queue Service (Amazon SQS)
          - text: An Amazon SQS queue
        explanation:
          text: SQS hands jobs to worker programs, which delete each message when done. It doesn't deliver anything to S3 by itself.
      - id: glue-crawler
        text: An AWS Glue crawler
        variants:
          - text: A crawler in AWS Glue
          - text: AWS Glue, with a crawler
        explanation:
          text: A crawler scans data that is already stored and adds tables to the Data Catalog. It doesn't take in a stream of events.
      - id: firehose
        text: Amazon Data Firehose
        variants:
          - text: Data Firehose
          - text: A Firehose stream in Amazon Data Firehose
        explanation:
          text: Correct. Firehose buffers the events and delivers them to S3, and it can convert them to Parquet on the way, with no code to write.
    correct_answers: [firehose]
    hint:
      text: Look for the service that delivers streaming data to a store for you, rather than holding it for your own programs.
    explanation:
      text: |
        Amazon Data Firehose (formerly Amazon Kinesis Data Firehose) delivers streaming data to a
        destination such as S3, Redshift or OpenSearch Service. It gathers data until a size or time
        limit is reached, can transform it into a format such as Parquet, and needs no code. A delay of
        a few minutes doesn't matter for next-day reports.

  - id: q10-data-streams-reprocess
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: application
    topics: [kinesis, data-streams]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A delivery company's vans report their position every few seconds. Three of its own programs
        read the same positions: one updates a live map, one estimates arrival times, and one archives
        everything. A bug in the arrival-time program is fixed, and the team wants it to read the last
        five hours of positions again. Which service supports this design?
    choices:
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A Kinesis data stream
        explanation:
          text: Correct. Several consumers read the same records independently, and records stay for the retention period, 24 hours by default, so the fixed program can replay them.
      - id: firehose
        text: Amazon Data Firehose
        variants:
          - text: Data Firehose
          - text: A Firehose stream
        explanation:
          text: Firehose delivers data to a destination and keeps nothing for other programs to read. It can't give three programs the same records or replay them.
      - id: sqs
        text: Amazon SQS
        variants:
          - text: Amazon Simple Queue Service
          - text: An SQS queue
        explanation:
          text: A worker deletes each SQS message once it has handled it, so three programs can't each read every position, and nothing is left to replay.
      - id: athena
        text: Amazon Athena
        variants:
          - text: Athena
          - text: An Athena query
        explanation:
          text: Athena runs SQL on files in S3. It doesn't feed live records to programs within seconds.
    correct_answers: [data-streams]
    hint:
      text: Ask which service keeps records after they've been read.
    explanation:
      text: |
        Kinesis Data Streams keeps records in a stream for your own programs, called consumers, to
        read. Several consumers can read the same records, and because records stay after they're read
        (24 hours by default, up to 365 days at extra cost), a consumer can go back and read them again,
        which is called replay.

  - id: q10-after-the-read-two
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: understanding
    topics: [kinesis, data-streams, data-firehose, sqs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Kinesis Data Streams, Amazon Data Firehose and Amazon SQS all accept data and hold it for a
        while. Which two statements correctly describe what happens after the data is read? (Select
        TWO.)
    choices:
      - id: sqs-shared-replay
        text: An SQS message can be read by several programs and replayed later
        variants:
          - text: Several programs can each read an SQS message and read it again later
          - text: SQS keeps each message for many readers and for later replay
        explanation:
          text: The worker that handles an SQS message deletes it when the job is done, so it can't be shared or replayed.
      - id: streams-keep
        text: Records in Data Streams stay after they're read, so they can be replayed
        variants:
          - text: Data Streams keeps records after a read, so programs can read them again
          - text: A record read from Data Streams remains there and can be replayed
        explanation:
          text: Correct. Records stay for the retention period, whoever reads them.
      - id: firehose-consumers
        text: Firehose keeps data for consumer programs that you write
        variants:
          - text: Firehose holds data for your own consumer programs to read
          - text: Your own consumer programs read the data that Firehose keeps
        explanation:
          text: That describes Data Streams. Firehose has no consumers of your own; it delivers the data itself.
      - id: firehose-delivers
        text: Firehose delivers data to its destination and keeps none for other readers
        variants:
          - text: Firehose hands data on to a destination and keeps nothing for other readers
          - text: After delivery to a destination, Firehose keeps no data for other readers
        explanation:
          text: Correct. It holds data only while it buffers, then delivers it to a store such as S3.
      - id: streams-delete
        text: Data Streams deletes each record as soon as one program has read it
        variants:
          - text: A record in Data Streams is removed once one program reads it
          - text: Data Streams removes each record after its first read
        explanation:
          text: That is closer to SQS, where the worker deletes the message. Data Streams keeps records after they're read.
    correct_answers: [streams-keep, firehose-delivers]
    explanation:
      text: |
        The difference after the read settles most questions about these three. Records stay in Kinesis
        Data Streams, so several programs can read them and replay them. Firehose hands data on to a
        destination. An SQS message is deleted by the worker that handled it.

  - id: q10-firehose-old-name
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: recall
    topics: [data-firehose, service-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A practice test written a few years ago offers "Amazon Kinesis Data Firehose" as an answer.
        What should a learner know about that name today?
    choices:
      - id: became-data-streams
        text: It was merged into Kinesis Data Streams
        variants:
          - text: AWS folded it into Kinesis Data Streams
          - text: It now lives on as part of Kinesis Data Streams
        explanation:
          text: Data Streams is a separate service that holds records for your own programs. Firehose still exists on its own.
      - id: became-glue
        text: It was replaced by AWS Glue
        variants:
          - text: AWS Glue took over its job
          - text: AWS retired it in favor of AWS Glue
        explanation:
          text: Glue catalogs and transforms data. It doesn't take in streaming data and deliver it.
      - id: renamed-data-firehose
        text: It is the same service, now named Amazon Data Firehose
        variants:
          - text: AWS renamed it Amazon Data Firehose
          - text: It carries on under the name Amazon Data Firehose
        explanation:
          text: Correct. Same service, new name. An answer that says Kinesis Data Firehose means Firehose.
      - id: shut-down
        text: It was shut down, like Kinesis Data Analytics for SQL
        variants:
          - text: AWS closed it, as it did Kinesis Data Analytics for SQL
          - text: It is gone, along with Kinesis Data Analytics for SQL
        explanation:
          text: Kinesis Data Analytics for SQL applications was discontinued; Firehose was only renamed.
    correct_answers: [renamed-data-firehose]
    explanation:
      text: |
        AWS renamed Amazon Kinesis Data Firehose to Amazon Data Firehose. It still belongs to the
        Kinesis family and can read from a Kinesis data stream, which is why the old name lingers.
        Older AWS pages and most practice material still use it, so treat the two names as one service.

  - id: q10-kda-sql-new-app
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Ingest: Data Streams holds records for your programs; Firehose delivers them for you"
    task: "3.7"
    level: understanding
    topics: [kinesis, retired-services]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In 2026, an engineer finds an old design document that calls for a new "Kinesis Data
        Analytics for SQL" application to run SQL continuously on a stream. What is the situation
        today?
    choices:
      - id: still-current
        text: It is current and is the exam's answer for SQL on a stream
        variants:
          - text: It is still offered and is the exam's pick for streaming SQL
          - text: It remains available and is what the exam expects for stream SQL
        explanation:
          text: The service isn't current. It is tempting because its name fits the job so well; treat it as a wrong answer.
      - id: renamed-firehose
        text: It was renamed Amazon Data Firehose
        variants:
          - text: AWS gave it the new name Amazon Data Firehose
          - text: It carries on as Amazon Data Firehose
        explanation:
          text: That rename belongs to Kinesis Data Firehose. Firehose delivers streaming data to a store; it isn't a SQL engine for streams.
      - id: discontinued
        text: AWS no longer allows new ones and has begun deleting existing ones
        variants:
          - text: New ones can't be created, and AWS has started deleting the old ones
          - text: AWS stopped new ones and has started removing those that exist
        explanation:
          text: Correct. New applications stopped on 2025-10-15 and AWS began deleting existing ones on 2026-01-27 (checked 2026-10-24).
      - id: became-athena
        text: It became part of Amazon Athena
        variants:
          - text: AWS merged it into Amazon Athena
          - text: Its features moved into Amazon Athena
        explanation:
          text: Athena runs SQL on files in S3, not on a live stream, and it didn't absorb this service.
    correct_answers: [discontinued]
    explanation:
      text: |
        AWS stopped new Kinesis Data Analytics for SQL applications on 2025-10-15 and began deleting
        existing ones on 2026-01-27 (checked 2026-10-24). AWS points users to Amazon Managed Service
        for Apache Flink, which isn't on the exam's service list. Treat Kinesis Data Analytics as a
        distractor.

  - id: q10-glue-discover-convert
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Catalog: Glue records what your data looks like and gets it ready"
    task: "3.7"
    level: application
    topics: [glue]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A research institute has thousands of CSV files from field instruments in Amazon S3. It wants
        their columns worked out automatically and recorded in one central list of tables, and a job
        each night that removes duplicate rows and rewrites the files as Parquet, with no servers to
        manage. Which service does all of this?
    choices:
      - id: redshift
        text: Amazon Redshift
        variants:
          - text: Redshift
          - text: An Amazon Redshift data warehouse
        explanation:
          text: Redshift is a data warehouse for running complex reports on data loaded into it. It doesn't discover and catalog files in S3 or run nightly clean-up jobs on them.
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A Kinesis data stream
        explanation:
          text: Data Streams brings in records as they happen. The files here are already in S3.
      - id: opensearch
        text: Amazon OpenSearch Service
        variants:
          - text: OpenSearch Service
          - text: An Amazon OpenSearch Service domain
        explanation:
          text: OpenSearch Service indexes text and logs for fast searching. It doesn't keep a catalog of S3 files or rewrite them.
      - id: glue
        text: AWS Glue
        variants:
          - text: Glue
          - text: The AWS Glue service
        explanation:
          text: Correct. Crawlers work out the columns, the Data Catalog holds the tables, and ETL jobs clean and convert the files, all serverless.
    correct_answers: [glue]
    hint:
      text: The request has three parts, discover, catalog and transform, and one service has a part for each.
    explanation:
      text: |
        AWS Glue is a serverless data integration service with three parts that match this request:
        crawlers scan data and work out its columns, the Glue Data Catalog keeps a table definition for
        each set of files, and ETL jobs clean or reshape data on a schedule. Glue prepares and describes
        data; another service queries it.

  - id: q10-glue-wont-answer
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Catalog: Glue records what your data looks like and gets it ready"
    task: "3.7"
    level: understanding
    topics: [glue, athena]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A sales director says, "We set up AWS Glue last week, so Glue can now tell us total revenue by
        region." What is the accurate correction?
    choices:
      - id: glue-prepares-athena-answers
        text: Glue prepares the data; a query service such as Athena answers it
        variants:
          - text: Glue gets the data ready; a service like Athena runs the question
          - text: A query service such as Athena answers; Glue prepares the data
        explanation:
          text: Correct. Glue's catalog lets Athena treat the files as tables, and Athena runs the SQL that totals revenue.
      - id: glue-is-storage
        text: Glue is a storage service that holds the data, like Amazon S3
        variants:
          - text: Glue keeps the data itself, in the way Amazon S3 keeps files
          - text: Glue holds the files, much as Amazon S3 holds objects
        explanation:
          text: Glue stores metadata about data, not the data itself. The files stay in S3 or wherever Glue connects to.
      - id: glue-draws-dashboards
        text: Glue builds the revenue charts, and Quick Sight runs the query
        variants:
          - text: Glue draws the charts, while Quick Sight does the querying
          - text: Quick Sight queries the data, and Glue turns it into charts
        explanation:
          text: The roles are reversed and wrong. Quick Sight draws dashboards; Glue neither queries nor draws charts.
      - id: glue-streaming-only
        text: Glue can answer it, but just for data that arrives as a stream
        variants:
          - text: Glue answers questions, provided the data arrives as a stream
          - text: Glue can total the revenue, as long as the records are streamed
        explanation:
          text: Glue doesn't answer questions about any data, streaming or stored.
    correct_answers: [glue-prepares-athena-answers]
    explanation:
      text: |
        Glue discovers, catalogs and transforms data so that a query service can answer questions. If
        a question asks what runs the query, Glue is wrong; if it asks what discovers, catalogs or
        transforms data, Glue is right. Glue appears in the same diagrams as Athena because Athena reads
        its table definitions from Glue's Data Catalog.

  - id: q10-athena-transit-logs
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: application
    topics: [athena]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A city transit agency keeps two years of ticket-gate logs as JSON files in Amazon S3. An
        analyst needs to run about a dozen SQL questions against them this month. The agency doesn't
        want to load the data anywhere, choose any capacity, or pay for compute while no queries run.
        Which option fits?
    choices:
      - id: emr
        text: An Amazon EMR cluster on EC2
        variants:
          - text: Amazon EMR on EC2
          - text: EMR running on an EC2 cluster
        explanation:
          text: EMR on EC2 runs big-data frameworks such as Spark for your own code on a cluster you size and pay for while it runs. It is far more than a dozen SQL questions need.
      - id: athena
        text: Amazon Athena
        variants:
          - text: Athena
          - text: Amazon Athena queries
        explanation:
          text: Correct. Athena runs SQL on the files where they sit, with nothing to set up, and bills per query.
      - id: redshift
        text: A provisioned Amazon Redshift cluster
        variants:
          - text: Amazon Redshift on a provisioned cluster
          - text: An Amazon Redshift provisioned cluster
        explanation:
          text: A provisioned Redshift cluster is billed by the hour while it runs, whether or not anyone queries it, and is built for data loaded into it and queried again and again.
      - id: opensearch
        text: An Amazon OpenSearch Service domain
        variants:
          - text: Amazon OpenSearch Service
          - text: An OpenSearch Service domain
        explanation:
          text: OpenSearch Service would need the logs loaded into an index first, and it is for finding words and patterns rather than SQL totals over files.
    correct_answers: [athena]
    hint:
      text: Look for the serverless service that reads files in S3 where they already are.
    explanation:
      text: |
        Amazon Athena runs standard SQL directly on files in S3, such as CSV, JSON or Parquet. It's
        serverless, applies the table layout as it reads, and charges by the data each query scans, so
        no queries means no query bill. That fits occasional questions over files that are already in
        S3.

  - id: q10-redshift-daily-joins
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: application
    topics: [redshift]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A hardware retailer combines data from its store tills, its online shop, its loyalty program
        and its suppliers. Each morning the finance team runs the same set of complex reports that join
        all four sources over five years of history. Which service is built for this?
    choices:
      - id: glue
        text: AWS Glue
        variants:
          - text: Glue
          - text: AWS Glue jobs
        explanation:
          text: Glue can move and clean the data on its way in, but it doesn't run the reports.
      - id: quick-sight
        text: Amazon Quick Sight
        variants:
          - text: Quick Sight
          - text: Amazon Quick Sight dashboards
        explanation:
          text: Quick Sight can show the report results, but it needs a query engine underneath to run the heavy joins.
      - id: redshift
        text: Amazon Redshift
        variants:
          - text: Redshift
          - text: An Amazon Redshift data warehouse
        explanation:
          text: Correct. A data warehouse holds combined history from many sources and is built for complex, repeated reports with many joins.
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A Kinesis data stream
        explanation:
          text: Data Streams brings in records as they happen. It doesn't run reports over years of history.
    correct_answers: [redshift]
    hint:
      text: Data from many sources, combined, and the same heavy reports every day.
    explanation:
      text: |
        Amazon Redshift is a data warehouse: you load data from many sources into it, and its engine is
        built for complex queries that join many very large tables, run again and again for reports.
        Athena suits occasional questions over files in S3; regular, heavy reporting over combined
        history is the warehouse's case.

  - id: q10-emr-own-spark
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: application
    topics: [emr]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A genetics lab has written its own Apache Spark programs to process very large sequencing
        files. It wants a managed service to run them on clusters, while keeping control of the
        clusters' configuration and the software installed on them. Which service fits?
    choices:
      - id: emr
        text: Amazon EMR
        variants:
          - text: EMR
          - text: The Amazon EMR service
        explanation:
          text: Correct. EMR is a managed cluster platform for Spark, Hadoop and similar frameworks, and with EMR on EC2 you control the cluster's configuration and software.
      - id: athena
        text: Amazon Athena
        variants:
          - text: Athena
          - text: Amazon Athena queries
        explanation:
          text: Athena runs SQL that you type. It doesn't run your own Spark programs, and it has no clusters for you to configure.
      - id: redshift
        text: Amazon Redshift
        variants:
          - text: Redshift
          - text: An Amazon Redshift cluster
        explanation:
          text: Redshift is a data warehouse queried with SQL. It isn't a platform for running your own Spark code.
      - id: quick-sight
        text: Amazon Quick Sight
        variants:
          - text: Quick Sight
          - text: Amazon Quick Sight analyses
        explanation:
          text: Quick Sight builds dashboards from query results. It doesn't process data with Spark.
    correct_answers: [emr]
    hint:
      text: The lab already has code written for a big-data framework.
    explanation:
      text: |
        Amazon EMR (formerly Amazon Elastic MapReduce) is a managed cluster platform for big-data
        frameworks such as Apache Spark and Apache Hadoop. You bring your own code; with EMR on EC2 you
        control the clusters' configuration and software, and EMR Serverless removes the clusters when
        you don't need that control.

  - id: q10-athena-redshift-two
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: understanding
    topics: [athena, redshift]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two statements about Amazon Athena and Amazon Redshift are accurate? (Select TWO.)
    choices:
      - id: athena-serverless-per-scan
        text: Athena is serverless and charges each query by the data it scans
        variants:
          - text: Athena has no servers to run and bills each query by data scanned
          - text: With Athena there's nothing to set up, and each query is billed by the data it reads
        explanation:
          text: Correct. No queries means no query bill, though S3 still charges for the stored files.
      - id: athena-cluster-first
        text: Athena needs a cluster sized and started before the first query
        variants:
          - text: Athena requires you to size and start a cluster before querying
          - text: Before Athena can run a query, you must size and launch a cluster
        explanation:
          text: Athena is serverless; there is nothing to size. Clusters belong to Redshift (unless you use Redshift Serverless) and EMR.
      - id: redshift-warehouse
        text: Redshift is a data warehouse that you load data into for repeated, complex reports
        variants:
          - text: Redshift is a warehouse where loaded data serves complex reports run again and again
          - text: Redshift holds loaded data as a warehouse for heavy reports that are run repeatedly
        explanation:
          text: Correct. Its engine is built for complex queries joining very large tables, run regularly.
      - id: redshift-for-website
        text: Redshift is the database for a website's many small reads and writes
        variants:
          - text: Redshift is built to run a website's many small reads and writes
          - text: A website's stream of small reads and writes is Redshift's main job
        explanation:
          text: That's transactional work, for a service such as RDS or Aurora. Redshift is for analytics over history.
      - id: athena-dashboards
        text: Athena turns query results into dashboards for business users
        variants:
          - text: Athena builds dashboards from its results for business users
          - text: Business users get dashboards drawn by Athena from its results
        explanation:
          text: Dashboards are Amazon Quick Sight's job. Athena can be a data source for Quick Sight.
    correct_answers: [athena-serverless-per-scan, redshift-warehouse]
    explanation:
      text: |
        Athena and Redshift both answer questions with SQL, in different places and with different
        amounts for you to manage. Athena reads files in S3 with no servers and bills by data scanned;
        Redshift is a warehouse that holds loaded data for regular, complex reports. Neither runs a
        website's transactions or draws dashboards.

  - id: q10-opensearch-error-phrase
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Search: OpenSearch Service finds words and patterns in text and logs"
    task: "3.7"
    level: application
    topics: [opensearch]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ferry operator's booking system writes application logs all day. When customers complain,
        the support team wants to find, within seconds, every log line from the last hour that
        contains a phrase such as "card declined", and to watch charts of error patterns. Which
        service fits?
    choices:
      - id: glue
        text: AWS Glue
        variants:
          - text: Glue
          - text: The AWS Glue Data Catalog
        explanation:
          text: Glue catalogs and transforms data. It doesn't search text or return matching lines.
      - id: athena
        text: Amazon Athena
        variants:
          - text: Athena
          - text: Amazon Athena queries
        explanation:
          text: Athena could scan log files with SQL, but it reads the files for each question rather than looking words up in an index, so it isn't built for instant phrase searches.
      - id: data-streams
        text: Amazon Kinesis Data Streams
        variants:
          - text: Kinesis Data Streams
          - text: A Kinesis data stream
        explanation:
          text: Data Streams can carry the logs in, but your own programs would have to do the searching.
      - id: opensearch
        text: Amazon OpenSearch Service
        variants:
          - text: OpenSearch Service
          - text: An Amazon OpenSearch Service domain
        explanation:
          text: Correct. It indexes every word in the logs, so phrase searches come back at once, and OpenSearch Dashboards draws the charts.
    correct_answers: [opensearch]
    hint:
      text: Finding a phrase fast depends on a structure built before anyone searches.
    explanation:
      text: |
        Amazon OpenSearch Service (successor to Amazon Elasticsearch Service) runs the open-source
        OpenSearch engine for you. It is used for log analytics, application monitoring and website
        search, and its search index lets it find words and patterns at once. OpenSearch Dashboards
        draws charts of what it finds.

  - id: q10-index-makes-search-fast
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Search: OpenSearch Service finds words and patterns in text and logs"
    task: "3.7"
    level: understanding
    topics: [opensearch, athena]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A search for every product review that mentions "nut-free" returns at once from Amazon
        OpenSearch Service, but takes longer as a SQL query in Amazon Athena. What explains the
        difference?
    choices:
      - id: index-built
        text: OpenSearch Service has already indexed every word in the reviews
        variants:
          - text: Every word in the reviews is already in OpenSearch Service's index
          - text: OpenSearch Service built an index of each word ahead of time
        explanation:
          text: Correct. A search index lists which words appear in which records, so the lookup is fast. Athena reads the files to answer each question.
      - id: memory-only
        text: OpenSearch Service keeps all its data in memory and never on disk
        variants:
          - text: OpenSearch Service holds its data only in memory, not on disk
          - text: All of OpenSearch Service's data lives in memory rather than storage
        explanation:
          text: OpenSearch Service domains use storage you choose and pay for. The speed comes from the index.
      - id: athena-no-text
        text: Athena can't read text files, so it converts them first
        variants:
          - text: Athena must convert text files before it can read them
          - text: Text files have to be converted before Athena can read them
        explanation:
          text: Athena reads CSV, JSON and other text formats directly from S3.
      - id: uses-glue
        text: OpenSearch Service reads its tables from the Glue Data Catalog
        variants:
          - text: OpenSearch Service takes its table definitions from Glue
          - text: The Glue Data Catalog supplies OpenSearch Service's tables
        explanation:
          text: The Glue Data Catalog serves Athena, EMR and Redshift Spectrum. It isn't what makes searching fast.
    correct_answers: [index-built]
    explanation:
      text: |
        The difference is the search index. OpenSearch Service indexes every word as data arrives, so
        a phrase search is a quick lookup. Athena answers a SQL question by reading the files each
        time, which suits totals and joins over files in S3, not instant text search.

  - id: q10-quick-sight-charity-board
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Visualize: Quick Sight turns answers into dashboards"
    task: "3.7"
    level: application
    topics: [quick-sight, analytics-pipeline]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A wildlife charity's analyst answers donation questions with SQL in Amazon Athena and emails
        the result tables to the board each month. Board members want to open one screen themselves,
        filter donations by campaign and region, and see it kept up to date. The analyst proposes
        adding Amazon Quick Sight. What job would Quick Sight do in this design?
    choices:
      - id: run-sql-itself
        text: Run the SQL against the files in S3 itself, so Athena is no longer needed
        variants:
          - text: Take over from Athena by running the SQL on the S3 files directly
          - text: Query the S3 files with SQL on its own, replacing Athena entirely
        explanation:
          text: Athena stays the query engine. Quick Sight uses it as a data source rather than replacing it.
      - id: crawl-files
        text: Scan the donation files and record their columns in a central catalog
        variants:
          - text: Crawl the donation files and add their columns to a central catalog
          - text: Work out the files' columns and list them in one central catalog
        explanation:
          text: That is the catalog step, done by an AWS Glue crawler and the Glue Data Catalog.
      - id: dashboards-from-athena
        text: Read results through Athena and show them as dashboards the board can filter
        variants:
          - text: Use Athena as its source and present filterable dashboards to the board
          - text: Turn Athena's answers into interactive dashboards for board members
        explanation:
          text: Correct. Visualizing for business users is Quick Sight's job, with Athena underneath as the query engine.
      - id: stream-donations
        text: Stream each donation into S3 as it is made, ready for querying
        variants:
          - text: Bring each donation into S3 as a stream the moment it happens
          - text: Deliver donations to S3 as they arrive, so they can be queried
        explanation:
          text: That is the ingest step, the job of Amazon Data Firehose or Kinesis Data Streams.
    correct_answers: [dashboards-from-athena]
    hint:
      text: Find the one of the five verbs that the charity hasn't covered yet.
    explanation:
      text: |
        Amazon Quick Sight is AWS's business intelligence service: it connects to sources such as
        Athena, Redshift or RDS and builds interactive dashboards for the people who read them. In a
        pipeline it is the visualize step, on top of the service that runs the query. Older material
        calls it Amazon QuickSight; it is now part of Amazon Quick.

  - id: q10-pipeline-order
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "The big picture: five verbs, from raw data to a dashboard"
    task: "3.7"
    level: understanding
    topics: [analytics-pipeline]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A sports club wants a morning dashboard built from its website's page-view events. Which
        sequence places the services in the order the data flows through them?
    choices:
      - id: glue-first
        text: AWS Glue, then Data Firehose, then Quick Sight, then Athena
        variants:
          - text: Glue first, Data Firehose second, Quick Sight third, Athena last
          - text: Glue → Data Firehose → Quick Sight → Athena
        explanation:
          text: Glue catalogs data that has already arrived, so it can't come before the ingest step, and the dashboard comes last, after the query.
      - id: athena-first
        text: Athena, then AWS Glue, then Data Firehose, then Quick Sight
        variants:
          - text: Athena first, Glue second, Data Firehose third, Quick Sight last
          - text: Athena → Glue → Data Firehose → Quick Sight
        explanation:
          text: Athena can't query data that hasn't arrived or been described yet.
      - id: quick-sight-first
        text: Quick Sight, then Athena, then AWS Glue, then Data Firehose
        variants:
          - text: Quick Sight first, Athena second, Glue third, Data Firehose last
          - text: Quick Sight → Athena → Glue → Data Firehose
        explanation:
          text: This runs the pipeline backwards. The dashboard is the last step, not the first.
      - id: firehose-first
        text: Data Firehose, then AWS Glue, then Athena, then Quick Sight
        variants:
          - text: Data Firehose first, Glue second, Athena third, Quick Sight last
          - text: Data Firehose → Glue → Athena → Quick Sight
        explanation:
          text: Correct. Ingest, catalog, query, visualize.
    correct_answers: [firehose-first]
    explanation:
      text: |
        The events flow through the verbs in order. Amazon Data Firehose ingests them into S3, an AWS
        Glue crawler adds them as a table to the Data Catalog, Amazon Athena queries the table, and
        Amazon Quick Sight shows the results as a dashboard. Search, with OpenSearch Service, is a side
        branch that this request doesn't need.

  - id: q10-hotel-query-step-changes
    page: guide/10-data-ai-and-more/01-analytics-in-five-verbs.md
    section: "Query: Athena, Redshift and EMR answer questions in three different ways"
    task: "3.7"
    level: application
    topics: [analytics-pipeline, redshift, athena]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small hotel started with booking files in S3, a Glue catalog, Athena and a Quick Sight
        dashboard. Two years later it has 30 hotels, a reservation system, a restaurant system and a
        spa system, and its finance team runs the same 50 complex reports every morning, joining all
        of them. What is the right change to the pipeline?
    choices:
      - id: replace-quick-sight
        text: Replace Quick Sight with Redshift, which draws better reports
        variants:
          - text: Swap Quick Sight for Redshift, since Redshift draws better reports
          - text: Use Redshift instead of Quick Sight for drawing the reports
        explanation:
          text: Redshift runs queries; it doesn't draw dashboards. Quick Sight stays as the visualize step.
      - id: query-to-redshift
        text: Move the query step to Redshift, and keep Quick Sight on top
        variants:
          - text: Run the queries in Redshift instead, with Quick Sight still on top
          - text: Switch the query step to Redshift and leave Quick Sight in place
        explanation:
          text: Correct. Combined data from many sources, queried every day with heavy joins, is the warehouse's case. Quick Sight can read from Redshift.
      - id: glue-for-reports
        text: Replace Athena with AWS Glue, which runs the reports each morning
        variants:
          - text: Use AWS Glue in place of Athena to run the morning reports
          - text: Swap Athena for AWS Glue as the engine for the daily reports
        explanation:
          text: Glue prepares and catalogs data. It doesn't run reports.
      - id: opensearch-for-reports
        text: Replace Athena with OpenSearch Service to run the heavy joins
        variants:
          - text: Run the heavy joins in OpenSearch Service instead of Athena
          - text: Use OpenSearch Service in place of Athena for the many joins
        explanation:
          text: OpenSearch Service is for searching text and logs, not complex reports that join many systems.
    correct_answers: [query-to-redshift]
    hint:
      text: Only one of the five verbs is under new strain.
    explanation:
      text: |
        Teams start with the simplest service for each verb and move to a warehouse when the data and
        questions demand it. Many sources, combined for regular complex reports, point the query step to
        Amazon Redshift. Ingest and visualize can stay the same, and Athena can still answer one-off
        questions on files in S3.

  - id: q10-analytics-customer-side-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "You are responsible for security in the cloud, and how much depends on the service"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, analytics-pipeline]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company builds its reporting on Amazon S3, AWS Glue and Amazon Athena. Under the AWS shared
        responsibility model, which two tasks are the company's? (Select TWO.)
    choices:
      - id: patch-athena
        text: Patching the servers that run Athena's queries
        variants:
          - text: Applying patches to the servers behind Athena
          - text: Keeping Athena's query servers patched
        explanation:
          text: Athena is serverless; AWS runs and patches the servers out of sight.
      - id: who-reads
        text: Deciding who may read the bucket, the Glue tables and the query results
        variants:
          - text: Controlling who can read the bucket, Glue tables and Athena results
          - text: Choosing who has access to the bucket, the tables and the results
        explanation:
          text: Correct. Access to the data stays with the customer for every managed service.
      - id: glue-available
        text: Keeping the Glue service available when hardware fails
        variants:
          - text: Keeping AWS Glue running through hardware failures
          - text: Making sure Glue stays up when hardware fails
        explanation:
          text: Keeping a managed service available is AWS's side of the line.
      - id: encryption-settings
        text: Choosing encryption settings where a service offers a choice
        variants:
          - text: Picking the encryption options a service makes available
          - text: Setting encryption wherever a service offers options for it
        explanation:
          text: Correct. Where a service offers encryption choices, setting them is the customer's job.
      - id: scale-athena
        text: Adding capacity to Athena before a busy reporting week
        variants:
          - text: Scaling Athena up ahead of a heavy week of reports
          - text: Giving Athena more capacity before a busy week of queries
        explanation:
          text: There is no Athena capacity to add; AWS scales the service.
    correct_answers: [who-reads, encryption-settings]
    explanation:
      text: |
        These services are managed or serverless, so AWS runs the servers, patches the software and
        keeps the service available. The data and who can reach it stay with the customer: access to
        the bucket, tables, results and dashboards, encryption settings where there's a choice, and any
        code or sizing the customer controls.

  # ---------------------------------------------------------------------------------------------
  # Lesson 10.02, AI and machine learning (and Lab 14)
  # ---------------------------------------------------------------------------------------------

  - id: q10-comprehend-guest-comments
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Text in: Comprehend finds meaning, Translate changes the language"
    task: "3.7"
    level: application
    topics: [comprehend]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A hotel group collects thousands of written guest comments each week. The manager of each
        hotel wants the unhappy comments first, and wants to know which ones name a particular hotel,
        city or staff member. The group has no machine learning staff. Which service fits?
    choices:
      - id: textract
        text: Amazon Textract
        variants:
          - text: Textract
          - text: The Amazon Textract service
        explanation:
          text: Textract pulls text and structure out of scanned documents. The comments are already text; what's wanted is their meaning.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Correct. Comprehend returns each comment's sentiment and the entities it mentions, such as places, organizations and people.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Transcribe turns speech into text. Nothing here is spoken.
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Translate rewrites text in another language. It doesn't judge whether a guest is unhappy or find the names in a comment.
    correct_answers: [comprehend]
    hint:
      text: The input is text, and what must come out is its meaning.
    explanation:
      text: |
        Amazon Comprehend reads text and describes it using natural language processing: the sentiment
        (positive, negative, neutral or mixed), the entities it mentions, key phrases, the language and
        personal data. It's ready-made, so no machine learning skills are needed. It doesn't change the
        text; it tells you what's in it.

  - id: q10-comprehend-pii-in-chat
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Text in: Comprehend finds meaning, Translate changes the language"
    task: "3.7"
    level: application
    topics: [comprehend, personal-data]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software company's support app sends each chat message, as a customer types it, to an AWS
        service that must point out any home addresses or card numbers in the message before it is
        saved. Which service does that job?
    choices:
      - id: macie
        text: Amazon Macie
        variants:
          - text: Macie
          - text: The Amazon Macie service
        explanation:
          text: Macie finds sensitive data in S3 buckets. It doesn't examine a piece of text that an application sends it before anything is stored.
      - id: rekognition
        text: Amazon Rekognition
        variants:
          - text: Rekognition
          - text: The Amazon Rekognition service
        explanation:
          text: Rekognition analyzes images and video. A chat message is text.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Correct. Comprehend detects personal data, such as names, addresses and card numbers, in text you send it.
      - id: textract
        text: Amazon Textract
        variants:
          - text: Textract
          - text: The Amazon Textract service
        explanation:
          text: Textract reads scanned documents and images of forms. The chat message is already text.
    correct_answers: [comprehend]
    hint:
      text: Ask where the data is when it's checked, in a bucket or in text that an application sends.
    explanation:
      text: |
        Amazon Comprehend can find personal data, such as names, addresses and card numbers, in text
        you send it, along with sentiment and entities. Amazon Macie does a related job in a different
        place: it scans S3 buckets for sensitive data that is already stored. The input decides which.

  - id: q10-translate-portuguese-mail
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Text in: Comprehend finds meaning, Translate changes the language"
    task: "3.7"
    level: understanding
    topics: [translate, comprehend]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team uses Amazon Comprehend and learns that some support emails are in Portuguese. The
        agents read only English. Which statement describes what the team should add?
    choices:
      - id: comprehend-rewrites
        text: Nothing; Comprehend already returns each email rewritten in English
        variants:
          - text: Nothing more; Comprehend gives back each email in English already
          - text: No new service; Comprehend already rewrites each email in English
        explanation:
          text: Comprehend can tell you which language a text is in, but it describes text; it never rewrites it in another language.
      - id: translate-rewrites
        text: Amazon Translate, which rewrites each email's text in English
        variants:
          - text: Amazon Translate, to turn the text of each email into English
          - text: Amazon Translate, which gives each email back in English
        explanation:
          text: Correct. Translate turns text in one language into another, in real time or in batches.
      - id: transcribe-converts
        text: Amazon Transcribe, which converts each email's text into English
        variants:
          - text: Amazon Transcribe, to turn the text of each email into English
          - text: Amazon Transcribe, which gives each email back in English
        explanation:
          text: Transcribe turns speech into text. It doesn't change the language of written text.
      - id: polly-converts
        text: Amazon Polly, which reads each email aloud in English
        variants:
          - text: Amazon Polly, to speak each email to the agents in English
          - text: Amazon Polly, which gives each email back as English speech
        explanation:
          text: Polly turns text into speech in the text's own language. It doesn't translate.
    correct_answers: [translate-rewrites]
    explanation:
      text: |
        Text goes into three different services, and the output decides which. Comprehend finds
        meaning, and can detect which language a text is in; only Amazon Translate rewrites text in
        another language. The two often work together: translate first, then analyze.

  - id: q10-transcribe-claim-calls
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Sound and conversation: Transcribe listens, Polly speaks, Lex holds the conversation"
    task: "3.7"
    level: application
    topics: [transcribe]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An insurance company stores recordings of its claims calls in Amazon S3. Its auditors want a
        written version of each call that shows which person said what, so they can search the
        wording. Which service produces it?
    choices:
      - id: textract
        text: Amazon Textract
        variants:
          - text: Textract
          - text: The Amazon Textract service
        explanation:
          text: Textract reads text from documents and images. A call recording is audio.
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Translate changes the language of text that already exists. It doesn't listen to audio.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend analyzes text for meaning. It could study the transcripts afterwards, but it can't make them from audio.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Correct. Transcribe turns recorded or live speech into text and can label who is speaking.
    correct_answers: [transcribe]
    hint:
      text: Speech goes in, and text must come out.
    explanation:
      text: |
        Amazon Transcribe turns speech into text, from a recording in S3 or live audio. It can label
        who is speaking and remove personal data from transcripts. Once the text exists, other services
        such as Comprehend can analyze it.

  - id: q10-polly-platform-announcements
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Sound and conversation: Transcribe listens, Polly speaks, Lex holds the conversation"
    task: "3.7"
    level: application
    topics: [polly]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A regional railway types platform changes and delay notices into its control system. It wants
        each notice announced in the stations in a natural-sounding voice, without recording a person.
        Which service turns the typed notices into the announcements?
    choices:
      - id: polly
        text: Amazon Polly
        variants:
          - text: Polly
          - text: The Amazon Polly service
        explanation:
          text: Correct. Polly takes text and returns lifelike speech, in many languages and voices.
      - id: lex
        text: Amazon Lex
        variants:
          - text: Lex
          - text: The Amazon Lex service
        explanation:
          text: Lex builds bots that hold a conversation. Nobody is talking back here; typed text just needs to become speech.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Transcribe works in the opposite direction, from speech to text.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend finds meaning in text. It doesn't produce audio.
    correct_answers: [polly]
    hint:
      text: Follow the arrow, text in and sound out.
    explanation:
      text: |
        Amazon Polly turns text into lifelike speech. Text goes in and audio comes out, and the audio
        can be stored and replayed. Transcribe runs the other way, and Lex decides what to say in a
        conversation; neither turns typed text into an announcement.

  - id: q10-polly-voicemail-mixup
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Sound and conversation: Transcribe listens, Polly speaks, Lex holds the conversation"
    task: "3.7"
    level: understanding
    topics: [polly, transcribe]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A colleague proposes Amazon Polly to turn a dental clinic's patient voicemails into written
        notes. Why won't that work?
    choices:
      - id: polly-video-only
        text: Polly handles the sound in video files, not the sound in voicemails
        variants:
          - text: Polly works on the audio in videos, not on recorded voicemail
          - text: Polly is for the sound inside video files rather than voicemails
        explanation:
          text: Polly doesn't analyze sound at all, in video or anywhere else. It produces speech.
      - id: polly-speaks-only
        text: Polly turns text into speech; Transcribe turns speech into text
        variants:
          - text: Polly makes speech from text; Transcribe writes speech down
          - text: Polly speaks text aloud, while Transcribe writes speech out
        explanation:
          text: Correct. The arrow points one way for each service. Polly speaks; Transcribe writes down.
      - id: needs-sagemaker
        text: Polly needs a model trained in SageMaker AI before it can listen
        variants:
          - text: Polly can listen only after a model is trained in SageMaker AI
          - text: A SageMaker AI model must be trained first for Polly to listen
        explanation:
          text: Polly is ready-made, and it never listens. No training would change its direction.
      - id: polly-in-lex
        text: Polly listens to callers only when it runs inside a Lex bot
        variants:
          - text: Polly can listen to callers, but just as part of a Lex bot
          - text: Polly hears what callers say when a Lex bot is running it
        explanation:
          text: A Lex bot both listens and replies within one conversation, which is part of why the mix-up happens. Polly itself only speaks.
    correct_answers: [polly-speaks-only]
    explanation:
      text: |
        Polly turns text into speech; Amazon Transcribe turns speech into text. The two are easy to
        confuse because both are "voice" services, and a bot built with Lex handles both directions in
        one conversation. Remember the arrow: Polly speaks, Transcribe writes down.

  - id: q10-lex-library-chat
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Sound and conversation: Transcribe listens, Polly speaks, Lex holds the conversation"
    task: "3.7"
    level: application
    topics: [lex]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A public library wants a chat window on its website. A member types "renew my books", the
        bot asks for the library card number, and then confirms the new due date. Which service is
        used to build the bot?
    choices:
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend describes text, such as its sentiment. It doesn't hold a conversation or ask for missing details.
      - id: lex
        text: Amazon Lex
        variants:
          - text: Lex
          - text: The Amazon Lex service
        explanation:
          text: Correct. Lex works out the intent (renew books), collects the slot (the card number) and replies.
      - id: polly
        text: Amazon Polly
        variants:
          - text: Polly
          - text: The Amazon Polly service
        explanation:
          text: Polly can give a bot a voice, but it understands nothing. A typed chat needs no voice at all.
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Translate changes the language of text. It doesn't work out what a member wants.
    correct_answers: [lex]
    hint:
      text: The input is a conversation.
    explanation:
      text: |
        Amazon Lex builds bots that hold a conversation in text or by voice. A website chat window needs
        only Lex: no phone line or contact center. The bot would call the library's own code, such as a
        Lambda function, to renew the books.

  - id: q10-caller-speech-to-english-two
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Sound and conversation: Transcribe listens, Polly speaks, Lex holds the conversation"
    task: "3.7"
    level: application
    topics: [transcribe, translate]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A tourist help line gets calls from visitors who speak Japanese. Staff read only English. The
        help line wants each caller's spoken words to appear on the staff member's screen as English
        text. Which two services, used one after the other, do this? (Select TWO.)
    choices:
      - id: polly
        text: Amazon Polly
        variants:
          - text: Polly
          - text: The Amazon Polly service
        explanation:
          text: Polly would be needed to speak a reply back to the caller, but it doesn't turn the caller's speech into text.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Correct. Transcribe turns the caller's Japanese speech into Japanese text, the first step.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend could detect that the text is Japanese, but it doesn't rewrite it in English.
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Correct. Translate turns the Japanese text into English text, the second step.
      - id: rekognition
        text: Amazon Rekognition
        variants:
          - text: Rekognition
          - text: The Amazon Rekognition service
        explanation:
          text: Rekognition analyzes images and video. Nothing visual is involved.
    correct_answers: [transcribe, translate]
    hint:
      text: Translation only ever works on text, so something has to make text first.
    explanation:
      text: |
        The speech services chain together. Amazon Transcribe takes sound in and returns text in the
        caller's language; Amazon Translate turns that text into English. To answer the caller aloud in
        Japanese, the staff member's reply would go back through Translate and then Polly.

  - id: q10-rekognition-listing-photos
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Pictures and documents: Rekognition sees, Textract reads"
    task: "3.7"
    level: application
    topics: [rekognition]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A second-hand marketplace stores sellers' item photos in Amazon S3. Before a listing goes live,
        it wants each photo checked for offensive content, and a photo listed as a bicycle checked to
        see whether a bicycle is actually in it. It has no ML team. Which service does the checking?
    choices:
      - id: macie
        text: Amazon Macie
        variants:
          - text: Macie
          - text: The Amazon Macie service
        explanation:
          text: Macie scans S3 buckets for sensitive data such as card numbers. It doesn't judge what a photo shows or whether it's offensive.
      - id: textract
        text: Amazon Textract
        variants:
          - text: Textract
          - text: The Amazon Textract service
        explanation:
          text: Textract reads text, forms and tables in documents. It doesn't describe the objects in a photo or judge its content.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Transcribe turns speech into text. Photos have no speech.
      - id: rekognition
        text: Amazon Rekognition
        variants:
          - text: Rekognition
          - text: The Amazon Rekognition service
        explanation:
          text: Correct. Rekognition finds objects and scenes in images and flags unsafe content, with no ML expertise needed.
    correct_answers: [rekognition]
    hint:
      text: The input is pictures of the world, not documents, and the photos happen to sit in S3.
    explanation:
      text: |
        Amazon Rekognition analyzes images and video: it finds objects, scenes and concepts, spots text
        in pictures, flags unsafe content, and analyzes and compares faces. It's ready-made, so the
        marketplace calls an API and needs no machine learning skills. Where the photos are stored
        doesn't change which service looks at them.

  - id: q10-textract-intake-forms
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Pictures and documents: Rekognition sees, Textract reads"
    task: "3.7"
    level: application
    topics: [textract]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A physiotherapy clinic scans the paper forms that new patients fill in by hand. It wants each
        label paired with its value, such as "Date of birth" with the date written beside it, and the
        rows of the medication table kept as a table. Which service fits?
    choices:
      - id: textract
        text: Amazon Textract
        variants:
          - text: Textract
          - text: The Amazon Textract service
        explanation:
          text: Correct. Textract detects typed and handwritten text and returns form fields as label and value pairs, and tables as tables.
      - id: transcribe
        text: Amazon Transcribe
        variants:
          - text: Transcribe
          - text: The Amazon Transcribe service
        explanation:
          text: Transcribe turns speech into text. These are scanned pages.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend needs text that already exists, and it returns meaning, not a form's structure.
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Translate changes the language of text. It doesn't read scanned forms.
    correct_answers: [textract]
    hint:
      text: The input is a document, and its structure must survive.
    explanation:
      text: |
        Amazon Textract reads documents. It detects typed and handwritten text and pulls out form
        fields (a label and its value) and tables. Its AnalyzeExpense operation does the same for
        invoices and receipts, and AnalyzeID reads identity documents.

  - id: q10-textract-over-rekognition
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Pictures and documents: Rekognition sees, Textract reads"
    task: "3.7"
    level: understanding
    topics: [textract, rekognition]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Amazon Rekognition can spot words in a picture. Why is Amazon Textract still the better fit
        for photos of supplier invoices that an accounts team must pay?
    choices:
      - id: rekognition-no-text
        text: Rekognition can't find words in a photo of a paper document
        variants:
          - text: Rekognition misses the words in photos of paper documents
          - text: Words on a paper document are invisible to Rekognition
        explanation:
          text: Rekognition can detect text in images, which is why the two get confused. The difference is what comes back.
      - id: video-only
        text: Rekognition works on video, and invoices are still images
        variants:
          - text: Rekognition handles video, while invoices are still photos
          - text: Invoices are still images, and Rekognition analyzes video
        explanation:
          text: Rekognition analyzes both images and video.
      - id: structure
        text: Textract returns its structure, such as vendor, total and line items
        variants:
          - text: Textract gives back the vendor, total and each line item as fields
          - text: The vendor, total and line items come back from Textract as fields
        explanation:
          text: Correct. Rekognition returns labels and loose lines of words; Textract returns who was paid, how much and for what.
      - id: textract-trained
        text: Textract is trained on each company's own invoices before use
        variants:
          - text: Textract must first be trained on the company's own invoices
          - text: Each company trains Textract on its own invoices before using it
        explanation:
          text: Textract is ready-made. AWS trained the model; the team just calls the API.
    correct_answers: [structure]
    explanation:
      text: |
        Both services can "see" words, but they return different things. Rekognition describes a
        picture: labels such as "paper" and "text", and loose lines of words. Textract reads a
        document: lines, form fields, tables, and for invoices and receipts the vendor, total and line
        items. Documents go to Textract; pictures of the world go to Rekognition.

  - id: q10-look-alikes-pairing-two
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Pictures and documents: Rekognition sees, Textract reads"
    task: "3.7"
    level: understanding
    topics: [comprehend, textract, rekognition]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two pairings of an AWS service and what it returns are correct? (Select TWO.)
    choices:
      - id: rekognition-key-phrases
        text: Amazon Rekognition returns the key phrases in an email
        variants:
          - text: Rekognition gives back an email's key phrases
          - text: An email's key phrases come back from Rekognition
        explanation:
          text: Key phrases come from Comprehend, which analyzes text. Rekognition analyzes images and video.
      - id: comprehend-sentiment
        text: Amazon Comprehend returns the sentiment and entities in text
        variants:
          - text: Comprehend gives back the sentiment and entities of text
          - text: Sentiment and entities in text come back from Comprehend
        explanation:
          text: Correct. Comprehend finds meaning in text you already have.
      - id: textract-faces
        text: Amazon Textract returns the faces seen in a video
        variants:
          - text: Textract gives back the faces in a video
          - text: The faces in a video come back from Textract
        explanation:
          text: Faces in images and video are Rekognition's job. Textract reads documents.
      - id: textract-fields
        text: Amazon Textract returns the fields and tables in a scanned form
        variants:
          - text: Textract gives back a scanned form's fields and tables
          - text: A scanned form's fields and tables come back from Textract
        explanation:
          text: Correct. Textract extracts a document's text and structure.
      - id: comprehend-photo-text
        text: Amazon Comprehend returns the text printed in a photo
        variants:
          - text: Comprehend gives back the text printed in a photo
          - text: The text printed in a photo comes back from Comprehend
        explanation:
          text: Comprehend takes text as input; it doesn't pull text out of a picture. That's Textract, or Rekognition's text detection.
    correct_answers: [comprehend-sentiment, textract-fields]
    explanation:
      text: |
        Three services all "look at" content and are easy to mix up. Textract extracts a document's text
        and structure; Comprehend interprets text you already have; Rekognition interprets images and
        video. Name the input and the output you need, and the service follows.

  - id: q10-sagemaker-spare-parts
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "When nothing ready-made fits, SageMaker AI builds your own model"
    task: "3.7"
    level: application
    topics: [sagemaker-ai, retired-services]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A farm equipment maker, new to AWS's AI services in 2026, wants to predict how many of each
        spare part its dealers will order next month, from its own ten years of order history. Its
        data scientists will build, train and deploy the model. Which service should they use?
    choices:
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend analyzes the meaning of text. Order history is numbers, and the question is the company's own.
      - id: forecast
        text: Amazon Forecast
        variants:
          - text: Forecast
          - text: The Amazon Forecast service
        explanation:
          text: Forecast was AWS's ready-made time-series service, but it is closed to new customers (announced 2024-07-29), and it isn't on the exam's list. AWS points to Amazon SageMaker Canvas instead.
      - id: sagemaker-ai
        text: Amazon SageMaker AI
        variants:
          - text: SageMaker AI
          - text: The Amazon SageMaker AI service
        explanation:
          text: Correct. SageMaker AI is for building, training and deploying your own models on your own data.
      - id: rekognition
        text: Amazon Rekognition
        variants:
          - text: Rekognition
          - text: The Amazon Rekognition service
        explanation:
          text: Rekognition analyzes images and video. There's nothing visual here.
    correct_answers: [sagemaker-ai]
    hint:
      text: The answer has to be learned from the company's own data, and one listed service no longer takes new customers.
    explanation:
      text: |
        Amazon SageMaker AI is a fully managed service for building, training and deploying your own
        machine learning models. A team turns to it when the question is its own and no ready-made
        service answers it. AWS runs the servers; the data, the model and the ML skill are the team's.
        Status checked 2026-10-24.

  - id: q10-ready-made-delivery-notes
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "When nothing ready-made fits, SageMaker AI builds your own model"
    task: "3.7"
    level: understanding
    topics: [sagemaker-ai, ready-made-ai]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics company is deciding where to use a ready-made AI service and where its data
        scientists should build a model in Amazon SageMaker AI. Which need calls for a ready-made
        service?
    choices:
      - id: route-delays
        text: Predicting which delivery routes will run late, from the company's own trip records
        variants:
          - text: Forecasting late delivery routes, learned from its own trip history
          - text: Learning from its own trip records which delivery routes will run late
        explanation:
          text: The answer must be learned from the company's own data, which is SageMaker AI's job.
      - id: delivery-notes
        text: Reading the text and totals from photos of signed delivery notes
        variants:
          - text: Pulling the text and totals out of photos of signed delivery notes
          - text: Extracting text and totals from pictures of signed delivery notes
        explanation:
          text: Correct. Reading documents is a solved problem; Textract does it with a model AWS already trained.
      - id: fuel-model
        text: Estimating each truck's fuel use with a model trained on its own sensors
        variants:
          - text: Working out each truck's fuel use from a model trained on its sensors
          - text: A model trained on the trucks' own sensor data to estimate fuel use
        explanation:
          text: A model trained on the company's own sensor data is a custom model, built in SageMaker AI.
      - id: driver-ranking
        text: Ranking drivers for bonuses with a scoring model built in-house
        variants:
          - text: Scoring drivers for bonuses with a model the company builds itself
          - text: Using an in-house scoring model to rank drivers for bonuses
        explanation:
          text: A scoring model the company designs for its own purpose is built, trained and deployed in SageMaker AI.
    correct_answers: [delivery-notes]
    explanation:
      text: |
        Start with a ready-made service and move to SageMaker AI only when nothing fits. Reading
        documents is covered by Amazon Textract, with no ML skills and a price per page. Predictions
        that must be learned from the company's own data are SageMaker AI's job, and they need data
        scientists.

  - id: q10-sagemaker-today-name
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "When nothing ready-made fits, SageMaker AI builds your own model"
    task: "3.7"
    level: recall
    topics: [sagemaker-ai, service-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A course from 2023 names "Amazon SageMaker" as the service where data scientists build, train
        and deploy their own models. What is that service called today?
    choices:
      - id: bedrock
        text: Amazon Bedrock
        variants:
          - text: Bedrock
          - text: The Amazon Bedrock service
        explanation:
          text: Bedrock gives you foundation models through an API to build generative AI apps on. It isn't the renamed SageMaker.
      - id: q-developer
        text: Amazon Q Developer
        variants:
          - text: Q Developer
          - text: The Amazon Q Developer assistant
        explanation:
          text: Q Developer is an assistant that helps people build and run on AWS. It doesn't train your models.
      - id: comprehend
        text: Amazon Comprehend
        variants:
          - text: Comprehend
          - text: The Amazon Comprehend service
        explanation:
          text: Comprehend is a ready-made text analysis service. Nothing is built or trained.
      - id: sagemaker-ai
        text: Amazon SageMaker AI
        variants:
          - text: SageMaker AI
          - text: The Amazon SageMaker AI service
        explanation:
          text: Correct. AWS renamed the service on 2024-12-03; "Amazon SageMaker" now names a wider platform that includes it.
    correct_answers: [sagemaker-ai]
    explanation:
      text: |
        On 2024-12-03 AWS renamed the build, train and deploy service Amazon SageMaker AI. "Amazon
        SageMaker" now names a wider platform for data, analytics and AI that includes SageMaker AI.
        Many command names still say "sagemaker" so existing code keeps working. The exam guide uses
        SageMaker AI.

  - id: q10-q-developer-console-help
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Amazon Q, and the AI names that are closed"
    task: "3.7"
    level: application
    topics: [amazon-q]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A cloud engineer, working in the AWS Management Console, wants to ask in plain language why
        one of her Lambda functions keeps timing out and what AWS's best practices suggest. Which AWS
        offering is built for this?
    choices:
      - id: lex
        text: Amazon Lex
        variants:
          - text: Lex
          - text: An Amazon Lex bot
        explanation:
          text: Lex builds bots for your own customers. It doesn't know about your AWS resources.
      - id: q-developer
        text: Amazon Q Developer
        variants:
          - text: Q Developer
          - text: The Amazon Q Developer assistant
        explanation:
          text: Correct. Q Developer answers questions about AWS services, your resources and best practices, in the console and in the AWS documentation.
      - id: q-business
        text: Amazon Q Business
        variants:
          - text: Q Business
          - text: The Amazon Q Business assistant
        explanation:
          text: Q Business answered employees' questions from company documents, and it is closed to new customers (checked 2026-10-24).
      - id: quick-sight
        text: Amazon Quick Sight
        variants:
          - text: Quick Sight
          - text: An Amazon Quick Sight dashboard
        explanation:
          text: Quick Sight builds dashboards from data. It doesn't explain your AWS resources.
    correct_answers: [q-developer]
    hint:
      text: '"Amazon Q" alone doesn''t say which product; read the second word.'
    explanation:
      text: |
        Amazon Q Developer is a generative AI assistant for people who build and run on AWS. In the
        console and the AWS documentation you ask about services, your resources and best practices.
        Its code-editor plugins and paid subscriptions reach end of support on 2027-04-30, but Q
        Developer in the console carries on (checked 2026-10-24).

  - id: q10-amazon-q-brand
    page: guide/10-data-ai-and-more/02-ai-and-ml.md
    section: "Amazon Q, and the AI names that are closed"
    task: "3.7"
    level: understanding
    topics: [amazon-q, retired-services]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager says, "We'll use Amazon Q for our developers' AWS questions and for answering staff
        questions from our HR handbook." Which statement is accurate (as of 2026-10-24)?
    choices:
      - id: one-product
        text: Amazon Q is one product, and a new customer can use it for both jobs
        variants:
          - text: Amazon Q is a single product that a new customer can use for both
          - text: Both jobs are covered by one product, Amazon Q, for new customers
        explanation:
          text: That's the misconception the exam guide's bare "Amazon Q" invites. The two jobs belong to different products.
      - id: brand-q-business-closed
        text: Amazon Q is a family; Q Developer fits one job, and Q Business is closed
        variants:
          - text: Amazon Q names several products; Q Developer fits one, Q Business is closed
          - text: Amazon Q is a brand; Q Developer suits one job, and Q Business is closed
        explanation:
          text: Correct. Q Developer helps with AWS and code. Q Business worked over company documents, and new customers can no longer sign up; AWS points them to Amazon Quick.
      - id: renamed-lex
        text: Amazon Q is the new name of Amazon Lex, so it builds bots for both
        variants:
          - text: Amazon Q is what Amazon Lex is called now, so it builds both bots
          - text: Amazon Lex was renamed Amazon Q, which builds a bot for each job
        explanation:
          text: Lex is still Lex, a service for building chat and voice bots. Amazon Q is a family of generative AI assistants.
      - id: train-own
        text: Amazon Q is where teams train their own machine learning models for both jobs
        variants:
          - text: Amazon Q is the service for training the custom models that both jobs need
          - text: Teams train their own machine learning models for both jobs in Amazon Q
        explanation:
          text: Training your own models is SageMaker AI's job. Amazon Q products are finished assistants.
    correct_answers: [brand-q-business-closed]
    explanation:
      text: |
        "Amazon Q" is a brand for several generative AI assistants. Amazon Q Developer helps people build
        and run on AWS. Amazon Q Business answered employees' questions from company documents; it is
        closed to new customers (announced 2026-06-30), and AWS points them to Amazon Quick. When a
        question describes help with code or AWS, the answer is Q Developer.

