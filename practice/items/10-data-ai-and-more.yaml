        variants:
          - text: A whole Windows desktop is what Secure Browser gives the user
          - text: With Secure Browser, the user sees a full Windows desktop
        explanation:
          text: Secure Browser gives one web browser, the least of the three.
      - id: workspaces-desktop
        text: Amazon WorkSpaces gives the user a whole desktop of their own
        variants:
          - text: A whole desktop of their own is what WorkSpaces gives the user
          - text: With WorkSpaces, the user sees a full desktop of their own
        explanation:
          text: Correct. Windows or Linux, any app they need, files kept.
      - id: applications-network
        text: WorkSpaces Applications gives the user a network path into a VPC
        variants:
          - text: A network path into a VPC is what WorkSpaces Applications gives
          - text: With WorkSpaces Applications, the user gets a path into a VPC
        explanation:
          text: A network path is what a VPN gives. WorkSpaces Applications streams programs.
      - id: applications-one-app
        text: WorkSpaces Applications gives the user one or a few applications
        variants:
          - text: One or a few applications are what WorkSpaces Applications gives
          - text: With WorkSpaces Applications, the user sees one or a few programs
        explanation:
          text: Correct. It is the exam's AppStream 2.0, application streaming.
      - id: workspaces-browser
        text: Amazon WorkSpaces gives the user a single web browser
        variants:
          - text: A single web browser is what WorkSpaces gives the user
          - text: With WorkSpaces, the user sees one web browser only
        explanation:
          text: That's Secure Browser. WorkSpaces gives a whole desktop.
    correct_answers: [workspaces-desktop, applications-one-app]
    explanation:
      text: |
        Ask what the user sees. Amazon WorkSpaces gives a whole desktop; WorkSpaces Applications (the
        exam's AppStream 2.0) gives one or a few applications; WorkSpaces Secure Browser gives one web
        browser. All three run in AWS, stream pixels and keep data off the user's device. Give people the
        smallest thing that does their job.

  - id: q10-client-vpn-not-desktop
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "WorkSpaces Applications streams single apps; Secure Browser streams one web browser"
    task: "3.8"
    level: understanding
    topics: [end-user-computing, client-vpn]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A clinic wants its part-time staff to work on patient records from home, with no records ever
        stored on their personal computers. An IT contractor suggests AWS Client VPN instead of a
        WorkSpaces service. Why doesn't Client VPN meet the goal by itself?
    choices:
      - id: network-path-only
        text: It gives each computer a network path, but the apps and data still run on it
        variants:
          - text: It adds a network path, yet the apps and data still run on the computer
          - text: The computer gets a path to the network, but still runs the apps and data
        explanation:
          text: Correct. A VPN connects a device; the WorkSpaces family gives the person a computer, an app or a browser that runs in AWS.
      - id: not-encrypted
        text: Its traffic isn't encrypted, so records could be read on the way
        variants:
          - text: It sends traffic without encryption, exposing records in transit
          - text: Records could be read in transit, since its traffic is unencrypted
        explanation:
          text: Client VPN traffic is encrypted. The problem is where the work happens, not the connection.
      - id: offices-only
        text: It connects whole office networks, not individual people's devices
        variants:
          - text: It links office networks, not the devices of individual people
          - text: Individual devices can't use it; it joins whole office networks
        explanation:
          text: That describes Site-to-Site VPN. Client VPN does connect individual people's devices.
      - id: closed
        text: It is closed to new customers, so the clinic can't sign up
        variants:
          - text: New customers can no longer sign up for it, so it's ruled out
          - text: The clinic can't start using it, as it takes no new customers
        explanation:
          text: Client VPN is available. The status change in this lesson is WorkSpaces Secure Browser's.
    correct_answers: [network-path-only]
    explanation:
      text: |
        A VPN gives a device a network path; the WorkSpaces services give the person a desktop, an app
        or a browser that runs in AWS. With Client VPN, the staff would still run the software and open
        records on their own computers. Streaming keeps the data in AWS, the security design principle
        "keep people away from data".

