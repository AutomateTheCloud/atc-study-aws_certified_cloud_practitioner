    topics: [workspaces-applications, end-user-computing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A technical college wants 300 students to use one engineering design program during a
        semester, from college PCs and their own laptops, without installing it anywhere and without
        giving each student a full desktop. Which service fits?
    choices:
      - id: applications
        text: Amazon WorkSpaces Applications
        variants:
          - text: Amazon AppStream 2.0 (now WorkSpaces Applications)
          - text: WorkSpaces Applications, formerly AppStream 2.0
        explanation:
          text: Correct. It streams individual applications from AWS to a browser or client, so every student gets the same installed version and no desktop.
      - id: workspaces
        text: Amazon WorkSpaces
        variants:
          - text: Amazon WorkSpaces virtual desktops
          - text: A WorkSpaces desktop for each student
        explanation:
          text: WorkSpaces gives each user a whole desktop. The college wants one program, not 300 desktops to manage.
      - id: secure-browser
        text: Amazon WorkSpaces Secure Browser
        variants:
          - text: WorkSpaces Secure Browser (formerly WorkSpaces Web)
          - text: Secure Browser, formerly WorkSpaces Web
        explanation:
          text: A streamed browser reaches web apps only. A desktop design program isn't a web app, and Secure Browser closes to new customers on 2026-10-29.
      - id: amplify
        text: AWS Amplify
        variants:
          - text: AWS Amplify Hosting
          - text: The AWS Amplify tools
        explanation:
          text: Amplify builds and hosts web and mobile front ends. It doesn't stream a desktop program.
    correct_answers: [applications]
    hint:
      text: Ask what each student should see on screen.
    explanation:
      text: |
        Amazon WorkSpaces Applications, which the exam guide still calls Amazon AppStream 2.0, streams
        individual desktop applications from AWS to a user's browser or client. Users always get the
        version you installed, and AWS says application data is never stored on their devices. It suits
        giving many people one or two programs without managing a desktop for each.

