  - id: q10-what-user-sees-two
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "WorkSpaces Applications streams single apps; Secure Browser streams one web browser"
    task: "3.8"
    level: recall
    topics: [workspaces, workspaces-applications, workspaces-secure-browser]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
