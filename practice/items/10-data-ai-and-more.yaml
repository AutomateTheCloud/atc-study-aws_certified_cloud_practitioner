        where money or customers are affected.

  # ---------------------------------------------------------------------------------------------
  # Lesson 10.03, People, apps and devices
  # ---------------------------------------------------------------------------------------------

  - id: q10-workspaces-tax-season
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "WorkSpaces gives each person a whole desktop that runs in AWS"
    task: "3.8"
    level: application
    topics: [workspaces, end-user-computing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An accounting firm hires 25 contractors for tax season. They work from their own laptops and
        need a full Windows desktop with the firm's tax software, spreadsheets and email, and the firm
        wants no client files left on the laptops. In May the desktops go away. Which service fits?
    choices:
      - id: workspaces
        text: Amazon WorkSpaces
        variants:
          - text: WorkSpaces
          - text: A desktop in Amazon WorkSpaces
        explanation:
          text: Correct. Each contractor gets a whole virtual desktop that runs in AWS and reaches the laptop as pixels, and the firm removes them when the season ends.
      - id: client-vpn
        text: AWS Client VPN
        variants:
          - text: Client VPN
          - text: A connection through AWS Client VPN
        explanation:
          text: Client VPN gives each laptop an encrypted network path into a VPC. The software and files would still run and sit on the laptops.
      - id: amplify
        text: AWS Amplify
        variants:
          - text: Amplify
          - text: A front end on AWS Amplify
        explanation:
          text: Amplify builds and hosts web and mobile front ends. It doesn't give anyone a desktop.
      - id: secure-browser
        text: Amazon WorkSpaces Secure Browser
        variants:
          - text: WorkSpaces Secure Browser
          - text: A browser in WorkSpaces Secure Browser
        explanation:
          text: A streamed browser covers web apps only, not tax software and spreadsheets, and it closes to new customers on 2026-10-29.
    correct_answers: [workspaces]
    hint:
      text: Ask how much of a computer each contractor needs.
    explanation:
      text: |
        Amazon WorkSpaces gives each user a virtual desktop running Windows or Linux in AWS, streamed to
        the device as pixels, so the firm's files stay in AWS. There's no hardware to buy, users can be
        added and removed as needs change, and removing the desktops when the season ends stops their
        charges.

  - id: q10-applications-cad-course
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "WorkSpaces Applications streams single apps; Secure Browser streams one web browser"
