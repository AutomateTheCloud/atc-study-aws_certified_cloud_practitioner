  - id: q10-connect-outage-calls
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "Connect runs the contact center; Lex is the bot inside it"
    task: "3.8"
    level: application
    topics: [connect, contact-center]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A water utility needs a cloud contact center for outage calls: phone numbers, queues that route
        callers to the right team, staff who answer the calls, and live reports for supervisors. It wants no telephone hardware. Which service fits?
    choices:
      - id: connect
        text: Amazon Connect
        variants:
          - text: Amazon Connect Customer
          - text: An Amazon Connect instance
        explanation:
          text: Correct. It provides the phone numbers, queues, routing, flows, agents and real-time reports of a contact center.
      - id: lex
        text: Amazon Lex
        variants:
          - text: Lex
          - text: An Amazon Lex bot
        explanation:
          text: Lex builds bots that understand callers. It has no phone numbers, queues or agents of its own.
      - id: sns
        text: Amazon SNS
        variants:
          - text: Amazon Simple Notification Service
          - text: An Amazon SNS topic
        explanation:
          text: SNS pushes short notifications to subscribers. It can tell customers about an outage, but it doesn't take their calls.
      - id: ses
        text: Amazon SES
        variants:
          - text: Amazon Simple Email Service
          - text: Email through Amazon SES
        explanation:
          text: SES sends and receives email. It isn't a contact center.
    correct_answers: [connect]
    hint:
      text: The need is a place where customers' calls arrive and people answer them.
    explanation:
      text: |
        Amazon Connect, now called Amazon Connect Customer, is a cloud contact center. Administrators get
        phone numbers, set up queues and routing and build flows; agents answer by voice, chat, SMS and
        other channels; supervisors watch performance in real time. There's no telephone hardware to buy.

  - id: q10-airline-bot-then-agent-two
    page: guide/10-data-ai-and-more/03-people-apps-and-devices.md
    section: "Connect runs the contact center; Lex is the bot inside it"
    task: "3.8"
    level: application
    topics: [connect, lex, contact-center]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A regional airline wants its reservations phone line to answer first with an automated
        assistant that understands requests such as "change my flight to Friday", and to pass the
        caller to a person in a queue when the assistant can't help. Which two services does it combine?
        (Select TWO.)
    choices:
      - id: translate
        text: Amazon Translate
        variants:
          - text: Translate
          - text: The Amazon Translate service
        explanation:
          text: Translate changes the language of text. It neither runs the phone line nor understands what the caller wants.
      - id: connect
        text: Amazon Connect
        variants:
          - text: Amazon Connect Customer
          - text: The Amazon Connect service
        explanation:
          text: Correct. Connect owns the phone number, the flow each call follows, the queue and the agents.
      - id: sns
        text: Amazon SNS
        variants:
          - text: SNS
          - text: The Amazon SNS service
        explanation:
          text: SNS sends notifications. It doesn't answer calls or queue callers.
      - id: lex
        text: Amazon Lex
        variants:
          - text: Lex
          - text: The Amazon Lex service
        explanation:
          text: Correct. A Connect flow hands the caller to a Lex bot, which works out the intent and collects the details.
      - id: ses
        text: Amazon SES
        variants:
          - text: SES
          - text: The Amazon SES service
        explanation:
