# Module 09, Protecting, governing and proving compliance. Practice questions and concept cards.
# Written from the guide's pages in guide/09-protecting-and-governing/; see practice/work/blueprint-09.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.01, Who did what, how it runs, how it was set
  # ---------------------------------------------------------------------------------------------

  - id: q09-config-answers-which-questions
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "The big picture: four records, four questions"
    task: "2.2"
    level: application
    topics: [aws-config, audit-records]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A freight company's compliance officer writes down five questions before an audit. The
        company has had AWS Config recording its resources for a year. Which TWO questions is AWS
        Config the right record for? (Select TWO.)
    choices:
      - id: who-deleted-subnet
        text: Which engineer deleted a subnet in the shipping VPC last week?
        variants:
          - text: Who removed one of the shipping VPC's subnets last week?
          - text: Which person deleted a subnet from the shipping VPC last week?
        explanation:
          text: '"Who" points to an action, and actions are CloudTrail events. Config would show the subnet disappearing, but the person''s name comes from CloudTrail.'
      - id: sg-rules-in-june
        text: What inbound rules did the database security group have on 3 June?
        variants:
          - text: Which inbound rules did the database security group allow on 3 June?
          - text: How was the database security group's inbound access set on 3 June?
        explanation:
          text: Correct. A resource's settings on a past date come from Config's configuration history, as long as recording was on that day.
      - id: cpu-at-month-end
        text: How busy was the billing server's CPU during the month-end run?
        variants:
          - text: How much CPU did the billing server use in the month-end run?
          - text: What was the billing server's CPU load during the month-end run?
        explanation:
          text: Load over time is a metric, and metrics live in Amazon CloudWatch.
      - id: unused-access-keys
        text: Which IAM users have access keys nobody has used for six months?
        variants:
          - text: Which IAM users hold access keys that have gone unused for six months?
          - text: Which IAM users' access keys have sat unused for six months?
        explanation:
          text: That is a question about credentials, answered by the IAM credential report, one of IAM's access reports.
      - id: unencrypted-volumes-now
        text: Are any EBS volumes attached to the servers unencrypted right now?
        variants:
          - text: Is any EBS volume attached to the servers currently unencrypted?
          - text: Right now, are any of the servers' attached EBS volumes unencrypted?
        explanation:
          text: Correct. A Config rule such as `encrypted-volumes` marks each attached volume compliant or noncompliant.
    correct_answers: [sg-rules-in-june, unencrypted-volumes-now]
    hint:
      text: Sort each question first. Is it about who acted, how something is running, how something was set, or who holds which credentials?
    explanation:
      text: |
        AWS Config answers "how was it set, then and now, and is that allowed?": a resource's
        settings on a past date, and whether today's settings pass a rule. "Who did it" is
        CloudTrail, "how is it running" is CloudWatch, and "who holds which credentials" is the IAM
        credential report.

  - id: q09-who-changed-password-policy
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "The big picture: four records, four questions"
    task: "2.2"
    level: application
    topics: [cloudtrail, audit-records]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A credit union's auditor notices that the minimum password length for IAM users was lowered
        five weeks ago. She asks which administrator made the change. Where does the credit union
        find the answer?
    choices:
      - id: cloudtrail
        text: AWS CloudTrail Event history
        variants:
          - text: The Event history in AWS CloudTrail
          - text: CloudTrail's Event history
        explanation:
          text: Correct. Changing the password policy is an action, so CloudTrail recorded an event naming who made it, and five weeks is inside Event history's 90 days.
      - id: config
        text: AWS Config configuration history
        variants:
          - text: The configuration history in AWS Config
          - text: AWS Config's history of settings
        explanation:
          text: Tempting because a password policy is a setting. Config describes states, not people; it can show the setting changed, but the administrator's name comes from CloudTrail.
      - id: credential-report
        text: The IAM credential report
        variants:
          - text: IAM's credential report
          - text: The credential report from IAM
        explanation:
          text: Tempting because it mentions passwords. It lists each user's credentials and when they were last used, not who changed an account setting.
      - id: cloudwatch
        text: Amazon CloudWatch metrics
        variants:
          - text: Metrics in Amazon CloudWatch
          - text: CloudWatch's metrics
        explanation:
          text: Metrics are numbers over time, such as CPU use. They don't record who changed a setting.
    correct_answers: [cloudtrail]
    hint:
      text: Find the key word in the auditor's question. Is she asking what the setting is, or who changed it?
    explanation:
      text: |
        "Which administrator" is a "who did it" question, and CloudTrail is the record of actions:
        who, which action, on what, when and from where. The words "password" and "policy" tempt
        learners toward the credential report or Config, but neither names the person behind a
        change.

  - id: q09-two-years-of-api-records
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudTrail records who did what, when and from where"
    task: "2.2"
    level: application
    topics: [cloudtrail, trails]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A pharmacy chain's regulator requires it to keep a record of every management action in its
        AWS account for two years. Its account is new, and nothing has been set up in CloudTrail.
        What should the chain do?
    choices:
      - id: rely-on-event-history
        text: Nothing, because CloudTrail Event history already keeps every action
        variants:
          - text: Nothing more, since Event history already holds every action
          - text: Rely on CloudTrail Event history, which already keeps every action
        explanation:
          text: Event history is on from day one, but it keeps only the last 90 days of management events.
      - id: multi-region-trail
        text: Create a multi-Region trail that delivers events to an S3 bucket
        variants:
          - text: Set up a multi-Region trail that sends events to an S3 bucket
          - text: Add a trail covering all Regions, delivering events to an S3 bucket
        explanation:
          text: Correct. A trail delivers events as files to an S3 bucket, and the files stay for as long as the chain keeps them.
      - id: turn-on-config
        text: Turn on AWS Config recording, which keeps history for seven years
        variants:
          - text: Start AWS Config recording, which holds seven years of history
          - text: Enable AWS Config, whose history lasts seven years by default
        explanation:
          text: Config keeps a history of resource settings, not a record of every action and who took it.
      - id: last-accessed
        text: Use IAM last accessed information, which goes back at least 400 days
        variants:
          - text: Read IAM last accessed information, which covers at least 400 days
          - text: Depend on IAM's last accessed data, kept for at least 400 days
        explanation:
          text: Last accessed information shows when an identity last tried each service, not every action it took, and it doesn't reach two years.
    correct_answers: [multi-region-trail]
    hint:
      text: One CloudTrail feature keeps events for a fixed window; the other keeps them as long as you keep the files.
    explanation:
      text: |
        Event history holds 90 days of management events per Region, so anything older exists only if
        a trail was already running. A trail delivers events to an S3 bucket, where the chain decides
        how long to keep them (with S3 lifecycle rules, for example). AWS recommends a multi-Region
        trail, so actions in every enabled Region are kept.

  - id: q09-console-trail-regions
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudTrail records who did what, when and from where"
    task: "2.2"
    level: recall
    topics: [cloudtrail, trails]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An administrator at an architecture firm creates a CloudTrail trail in the AWS Management
        Console while working in Europe (Ireland). Which Regions' events does the trail record?
    choices:
      - id: ireland-only
        text: Only Europe (Ireland), where the trail was created
        variants:
          - text: Just Europe (Ireland), the Region it was made in
          - text: Only the Region it was created in, Europe (Ireland)
        explanation:
          text: Tempting because many resources are Regional, but trails created in the console are multi-Region.
      - id: us-east-1-only
        text: Only US East (N. Virginia), where CloudTrail is based
        variants:
          - text: Just US East (N. Virginia), CloudTrail's home Region
          - text: Only N. Virginia, the Region where CloudTrail runs
        explanation:
          text: CloudTrail isn't run from one Region for your trails. Some global services record their events in N. Virginia, but that doesn't limit a trail.
      - id: regions-with-resources
        text: Only the Regions where the firm has running resources
        variants:
          - text: Just the Regions in which the firm runs resources
          - text: Only those Regions that hold the firm's resources
        explanation:
          text: A multi-Region trail covers every Region enabled in the account, whether or not anything runs there yet.
      - id: all-enabled-regions
        text: Every Region that is enabled in the firm's account
        variants:
          - text: All the Regions enabled in the firm's account
          - text: Each Region the firm's account has enabled
        explanation:
          text: Correct. Trails created in the console are multi-Region, covering every Region enabled in the account.
    correct_answers: [all-enabled-regions]
    explanation:
      text: |
        AWS recommends a multi-Region trail, and trails created in the console are multi-Region: they
        record events from every Region enabled in the account. That matters for evidence, because
        an action in a Region nobody watches is still an action an auditor may ask about.

  - id: q09-prove-logs-untouched
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudTrail records who did what, when and from where"
    task: "2.2"
    level: understanding
    topics: [cloudtrail, log-integrity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A bank's trail delivers CloudTrail log files to an S3 bucket. An external auditor worries that
        an administrator could edit or delete a file afterwards to hide an action. Which CloudTrail
        feature lets the bank show that the files weren't changed after delivery?
    choices:
      - id: organization-trail
        text: An organization trail
        variants:
          - text: A trail for the whole organization
          - text: An organization-wide trail
        explanation:
          text: An organization trail logs every account in an organization and can't be changed by member accounts, but it doesn't prove that delivered files are unaltered.
      - id: data-events
        text: Data events on the log bucket
        variants:
          - text: Data event logging for the log bucket
          - text: Recording data events on the log bucket
        explanation:
          text: Data events would record reads and writes of objects in the bucket, but they don't validate that each log file is the one CloudTrail delivered.
      - id: integrity-validation
        text: Log file integrity validation
        variants:
          - text: Validation of log file integrity
          - text: CloudTrail's log file integrity check
        explanation:
          text: Correct. It lets the bank prove that log files weren't changed or deleted after CloudTrail delivered them.
      - id: multi-region
        text: A multi-Region trail
        variants:
          - text: A trail that covers all Regions
          - text: A trail recording every Region
        explanation:
          text: Covering every Region widens what is recorded; it says nothing about whether a file was edited later.
    correct_answers: [integrity-validation]
    explanation:
      text: |
        Evidence is only useful if it can be trusted. Log file integrity validation lets you prove that
        CloudTrail's log files weren't modified or deleted after delivery. Teams also send logs to a
        separate account that day-to-day users can't change.

  - id: q09-who-opened-case-file
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "\"CloudTrail records everything, forever\" is wrong"
    task: "2.2"
    level: application
    topics: [cloudtrail, data-events]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A design agency keeps signed client contracts in an S3 bucket. A director wants to know who
        opened one contract yesterday, but CloudTrail Event history shows no event for it, although it shows who changed
        the bucket's settings last month. Nobody has changed CloudTrail's setup. Why is the read
        missing?
    choices:
      - id: data-event-not-on
        text: Reading an object is a data event, recorded only if data events were turned on first
        variants:
          - text: An object read is a data event, which CloudTrail logs only once you turn them on
          - text: Opening a file is a data event, and those are recorded only when switched on beforehand
        explanation:
          text: Correct. CloudTrail records management events by default; data events, such as reading an object, only when you ask for them, and for a charge.
      - id: console-only
        text: Event history lists only actions taken in the console, not by applications or the CLI
        variants:
          - text: Event history covers console actions only, not ones from applications or the CLI
          - text: Only console actions reach Event history; CLI and application calls never do
        explanation:
          text: CloudTrail records actions from the console, the CLI, SDKs and direct API calls alike.
      - id: cloudwatch-only
        text: Reads from S3 appear in Amazon CloudWatch metrics instead of CloudTrail
        variants:
          - text: S3 reads are recorded as CloudWatch metrics rather than CloudTrail events
          - text: CloudWatch metrics hold S3 reads, so they never reach CloudTrail
        explanation:
          text: CloudWatch can count requests, but a count doesn't say who read which file, and it doesn't stop CloudTrail from recording reads when data events are on.
      - id: encrypted-hidden
        text: Event history hides actions on encrypted objects, and every S3 object is encrypted
        variants:
          - text: Actions on encrypted objects are left out of Event history, and all S3 objects are encrypted
          - text: Event history skips encrypted objects, and S3 encrypts every object
        explanation:
          text: S3 does encrypt new objects by default, but encryption has nothing to do with what Event history shows.
    correct_answers: [data-event-not-on]
    hint:
      text: CloudTrail sorts actions into two kinds. Which kind does it record without being asked?
    explanation:
      text: |
        CloudTrail records management events, such as changing a bucket's settings, by default. Data
        events, such as reading or writing an object, are recorded only if you turn them on for that
        bucket, from then on, and you pay for them. S3 server access logs are another way to record
        requests, also only once turned on.

  - id: q09-ec2-logs-missing-in-cloudwatch
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudWatch shows how things are running, not who changed them"
    task: "2.2"
    level: application
    topics: [cloudwatch, logs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A school district runs its enrollment system on AWS Lambda functions and on Amazon EC2
        servers. In CloudWatch Logs, the IT team finds the functions' logs but nothing from the
        application running on the EC2 servers. What is the most likely reason?
    choices:
      - id: flow-logs-first
        text: VPC Flow Logs must be turned on before EC2 application logs are sent
        variants:
          - text: EC2 application logs are sent only once VPC Flow Logs is on
          - text: Flow logs have to be enabled before EC2 servers send application logs
        explanation:
          text: VPC Flow Logs record information about network traffic. They have nothing to do with what an application writes on a server.
      - id: agent-not-installed
        text: The CloudWatch agent hasn't been installed on the EC2 servers
        variants:
          - text: Nobody has installed the CloudWatch agent on the servers
          - text: The servers don't have the CloudWatch agent installed
        explanation:
          text: Correct. Lambda functions log to CloudWatch on their own; an EC2 server's operating system and application logs reach CloudWatch only through the agent.
      - id: s3-only
        text: EC2 application logs can be written only to an S3 bucket, not CloudWatch
        variants:
          - text: Application logs from EC2 can go to an S3 bucket only, not CloudWatch
          - text: An S3 bucket is the only place EC2 application logs can be sent
        explanation:
          text: EC2 servers can send their logs to CloudWatch Logs; they need the CloudWatch agent to do it.
      - id: retention-expired
        text: CloudWatch Logs deletes EC2 logs after 90 days unless retention is changed
        variants:
          - text: EC2 logs expire from CloudWatch Logs after 90 days by default
          - text: By default, CloudWatch Logs removes EC2 logs once they are 90 days old
        explanation:
          text: Log groups never expire by default; they keep logs until you set a retention period. The 90 days belongs to CloudTrail Event history.
    correct_answers: [agent-not-installed]
    hint:
      text: Which of the two compute services sends its logs to CloudWatch without anything extra installed?
    explanation:
      text: |
        Lambda sends each function's logs to CloudWatch Logs automatically. On EC2, the operating
        system and the applications are the customer's, and their logs reach CloudWatch Logs only if
        the customer installs the CloudWatch agent to send them. A record that was never sent can't be
        shown later.

  - id: q09-email-on-root-sign-in
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudWatch shows how things are running, not who changed them"
    task: "2.2"
    level: application
    topics: [cloudwatch, cloudtrail, root-user]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A startup wants its security lead emailed within minutes whenever anyone signs in as the
        account's root user. It plans to build this with CloudTrail and CloudWatch. Which TWO parts
        does it need? (Select TWO.)
    choices:
      - id: trail-to-log-group
        text: A trail that also sends its events to a CloudWatch Logs log group
        variants:
          - text: A trail configured to deliver its events to CloudWatch Logs as well
          - text: A CloudTrail trail that also delivers events to a log group
        explanation:
          text: Correct. Event history can't feed an alarm; a trail can send its events to a CloudWatch Logs log group.
      - id: dashboard-graph
        text: A CloudWatch dashboard with a graph of root sign-ins
        variants:
          - text: A graph of root sign-ins on a CloudWatch dashboard
          - text: A CloudWatch dashboard that charts root sign-ins
        explanation:
          text: A dashboard shows metrics to whoever is looking at it. It doesn't send anything, so nobody is emailed unless they happen to open it.
      - id: alarm-on-events
        text: A metric filter for root sign-ins, with a CloudWatch alarm on it
        variants:
          - text: A metric filter counting root sign-ins, watched by a CloudWatch alarm
          - text: A CloudWatch alarm on a metric filter that counts root sign-ins
        explanation:
          text: Correct. A metric filter on the log group turns root sign-in events into a count, and an alarm on that count emails the lead through an Amazon SNS topic.
      - id: credential-report
        text: The IAM credential report, checked for the root user's last sign-in
        variants:
          - text: IAM's credential report, read for when the root user last signed in
          - text: The credential report from IAM, showing the root user's last sign-in
        explanation:
          text: The credential report shows when a password was last used, but it is a file you generate, at most every four hours, and read; it doesn't send alerts.
      - id: event-history-alone
        text: CloudTrail Event history, filtered to root sign-in events
        variants:
          - text: CloudTrail Event history, searched for root sign-ins
          - text: The Event history in CloudTrail, filtered for root sign-ins
        explanation:
          text: Event history is a 90-day view you search. It doesn't deliver events anywhere, so nothing can alarm on it.
    correct_answers: [trail-to-log-group, alarm-on-events]
    hint:
      text: CloudTrail knows about the sign-in; CloudWatch knows how to raise an alarm. What joins them?
    explanation:
      text: |
        CloudTrail records each sign-in as an event, and a trail can send its events to a CloudWatch
        Logs log group. There, a metric filter (lesson 08.03) counts root sign-ins, and a CloudWatch
        alarm on that count notifies someone, usually through an Amazon SNS topic. A dashboard,
        Event history and the credential report are things someone has to look at, not alerts.

  - id: q09-config-history-starts-at-recording
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "AWS Config records how each resource was set, and judges it against your rules"
    task: "2.2"
    level: application
    topics: [aws-config]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online retailer turned on AWS Config recording in March. In June, an auditor asks what a
        payment server's security group allowed in January. What can the retailer produce from
        Config?
    choices:
      - id: seven-years-automatic
        text: January's settings, because Config keeps seven years of history for every account
        variants:
          - text: The January rules, since Config holds seven years of history for any account
          - text: Its January settings, as every account gets seven years of Config history
        explanation:
          text: Config keeps history for 7 years by default, but only from the day recording began. Before March, nothing was recorded.
      - id: rebuilt-from-cloudtrail
        text: January's settings, rebuilt by Config from older CloudTrail events
        variants:
          - text: The January rules, which Config reconstructs from earlier CloudTrail events
          - text: Its January settings, recreated by Config out of past CloudTrail events
        explanation:
          text: Config links each configuration item to the CloudTrail event behind a change, but it doesn't create history for the time before recording started.
      - id: cloudwatch-snapshot
        text: A January snapshot that CloudWatch passed to Config when recording began
        variants:
          - text: A January copy of the settings that CloudWatch handed to Config
          - text: Settings from January that Config received from CloudWatch
        explanation:
          text: CloudWatch holds metrics, logs and alarms, not resource settings, and it doesn't feed Config history.
      - id: nothing-before-march
        text: Nothing for January, because Config records only from when recording starts
        variants:
          - text: No January record, as Config only records from the day it is turned on
          - text: Nothing from January, since Config history begins when recording begins
        explanation:
          text: Correct. Recording is off until you turn it on, and history starts then. That is why teams turn Config on when an account is created.
    correct_answers: [nothing-before-march]
    hint:
      text: Config's history is long, but where does it begin?
    explanation:
      text: |
        AWS Config is off until you set up a configuration recorder. From then on it saves a
        configuration item each time a recorded resource changes, and keeps that history for 7 years
        by default. It can't produce settings from before recording began, so an honest answer is
        "we have no Config record for January".

  - id: q09-encrypted-volumes-rule-results
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "AWS Config records how each resource was set, and judges it against your rules"
    task: "2.2"
    level: understanding
    topics: [aws-config, config-rules]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A media company turns on AWS Config recording and adds the AWS managed rule
        `encrypted-volumes`, with no remediation action attached. Which TWO results should its team
        expect? (Select TWO.)
    choices:
      - id: volumes-encrypted-automatically
        text: Unencrypted volumes are encrypted automatically by the rule
        variants:
          - text: The rule encrypts any unencrypted volume on its own
          - text: Volumes without encryption get encrypted by the rule itself
        explanation:
          text: A rule only evaluates. Fixing takes a remediation action that you attach, and none is attached here.
      - id: marked-compliant-or-not
        text: Each attached EBS volume is marked compliant or noncompliant
        variants:
          - text: Every attached EBS volume is judged compliant or noncompliant
          - text: The attached EBS volumes are each flagged compliant or noncompliant
        explanation:
          text: Correct. The rule fails any attached EBS volume that isn't encrypted, and Config marks it noncompliant.
      - id: creation-blocked
        text: Creating a new unencrypted volume is blocked by the rule
        variants:
          - text: The rule stops anyone creating an unencrypted volume
          - text: New unencrypted volumes can't be created once the rule exists
        explanation:
          text: Config rules detect; they don't prevent. Preventing a change takes permissions, or an SCP across accounts.
      - id: item-per-change
        text: A configuration item is saved each time a recorded volume changes
        variants:
          - text: Config records a configuration item whenever a recorded volume changes
          - text: Every change to a recorded volume produces a new configuration item
        explanation:
          text: Correct. Each change to a recorded resource produces a configuration item, a snapshot of its settings at that moment.
      - id: creator-named
        text: The rule's results name the person who created each volume
        variants:
          - text: Each rule result shows who created the volume
          - text: The person who made each volume appears in the rule's results
        explanation:
          text: Config describes states, not people. Who created a volume is a CloudTrail question.
    correct_answers: [marked-compliant-or-not, item-per-change]
    explanation:
      text: |
        Config keeps a history of each recorded resource's settings as configuration items, and its
        rules mark resources compliant or noncompliant. It neither fixes nor blocks on its own: you
        attach a remediation action to fix, and use permissions to prevent. Names of people come from
        CloudTrail.

  - id: q09-bundle-rules-across-accounts
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "AWS Config records how each resource was set, and judges it against your rules"
    task: "2.2"
    level: application
    topics: [aws-config, conformance-packs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A games publisher's security team has chosen 25 AWS Config rules, with automatic fixes on a
        few of them. It wants to deploy the whole set to every account in its organization as one
        unit and see one report on how each account does against it. What should it use?
    choices:
      - id: firewall-manager-policy
        text: An AWS Firewall Manager policy that holds the 25 rules
        variants:
          - text: A Firewall Manager policy containing the 25 rules
          - text: The 25 rules placed in an AWS Firewall Manager policy
        explanation:
          text: Firewall Manager spreads firewall protections, such as WAF and security group policies, across accounts. It doesn't package Config rules.
      - id: scp-with-rules
        text: A service control policy that lists the 25 rules
        variants:
          - text: An SCP that names each of the 25 rules
          - text: The 25 rules written into a service control policy
        explanation:
          text: An SCP caps what users and roles may do. It doesn't evaluate resources against rules or report results.
      - id: conformance-pack
        text: An AWS Config conformance pack of the 25 rules
        variants:
          - text: A Config conformance pack bundling the 25 rules
          - text: The 25 rules packaged as a Config conformance pack
        explanation:
          text: Correct. A conformance pack bundles Config rules, with optional fixes, into one unit you deploy and report on together, also across an organization.
      - id: account-factory
        text: AWS Control Tower's Account Factory, loaded with the rules
        variants:
          - text: Control Tower's Account Factory, set up with the rules
          - text: The 25 rules added to Control Tower's Account Factory
        explanation:
          text: Account Factory creates new accounts from an approved template. It isn't how you bundle and report on a chosen set of Config rules.
    correct_answers: [conformance-pack]
    hint:
      text: Look for the Config feature that treats many rules as one deployable unit.
    explanation:
      text: |
        Config rules check one setting each. A conformance pack bundles many rules, with optional
        remediation, into one unit that you deploy and report on together, across an organization if
        you choose. AWS also points former Audit Manager customers to conformance packs for this
        kind of technical check.

  - id: q09-mfa-and-key-rotation-file
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "Access reports show who can do what, and whether they still use it"
    task: "2.2"
    level: application
    topics: [access-reports, credential-report]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's internal auditors ask the cloud team for a single spreadsheet of the account's
        IAM users, with a column saying whether MFA is active and another saying when each access key
        was last rotated. What should the team download for them?
    choices:
      - id: last-accessed
        text: The Last Accessed tab for each IAM user
        variants:
          - text: Each IAM user's Last Accessed tab
          - text: IAM last accessed information, user by user
        explanation:
          text: Last accessed information shows which services an identity tried and when. It doesn't list MFA or key rotation, and it isn't one file for every user.
      - id: organizations-access-report
        text: The AWS Organizations access report
        variants:
          - text: The access report from AWS Organizations
          - text: An Organizations access report
        explanation:
          text: That report, from an organization's management account, shows when services allowed by SCPs were last used in each account. It says nothing about users' MFA or keys.
      - id: cloudwatch-sign-ins
        text: A CloudWatch Logs search of sign-in events
        variants:
          - text: A search of sign-in events in CloudWatch Logs
          - text: Sign-in events found with a CloudWatch Logs search
        explanation:
          text: Even if sign-in events were sent to CloudWatch Logs, they record actions, not each user's MFA status or key rotation dates.
      - id: credential-report
        text: The IAM credential report
        variants:
          - text: IAM's credential report
          - text: A credential report from IAM
        explanation:
          text: Correct. It is a CSV file listing every IAM user with password use, MFA status, and each access key's rotation and last use.
    correct_answers: [credential-report]
    hint:
      text: One of IAM's access reports is a single spreadsheet file about every user's credentials.
    explanation:
      text: |
        The credential report is a CSV file covering every IAM user in the account: whether they have
        a password and when they last used it, whether MFA is active, and when each access key was
        last rotated and used. You can generate a new one every four hours. It is one of the access
        reports that exam task 2.2 names.

  - id: q09-last-accessed-means-attempted
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "Access reports show who can do what, and whether they still use it"
    task: "2.2"
    level: understanding
    topics: [access-reports, least-privilege]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A data team reviews the Last Accessed tab of an IAM role. It says the role last accessed
        Amazon DynamoDB yesterday. What can the team safely conclude?
    choices:
      - id: changed-table
        text: The role changed a DynamoDB table yesterday; the tab doesn't say which one
        variants:
          - text: Yesterday the role modified a DynamoDB table, though the tab doesn't name it
          - text: A DynamoDB table was changed by the role yesterday; the tab doesn't show which
        explanation:
          text: Last accessed information reports attempts, not successes. A recent entry may have been denied, so it can't prove that anything changed.
      - id: attempted-maybe-denied
        text: The role sent DynamoDB a request yesterday; the tab doesn't say if it succeeded
        variants:
          - text: Yesterday the role made a DynamoDB request, though the tab doesn't show the outcome
          - text: A DynamoDB request came from the role yesterday; the tab doesn't show if it worked
        explanation:
          text: Correct. It reports attempts, including denied ones. CloudTrail is the authoritative record of each call and its outcome.
      - id: nobody-else
        text: No other identity can reach DynamoDB; the tab would list them if they could
        variants:
          - text: No other identity can use DynamoDB, or the tab would show them as well
          - text: DynamoDB is closed to every other identity; the tab would name any that could reach it
        explanation:
          text: One role's tab covers only that role, and access through resource-based policies doesn't appear in it at all.
      - id: via-resource-policy
        text: The role reached DynamoDB through a resource-based policy; the tab doesn't name it
        variants:
          - text: A resource-based policy gave the role its DynamoDB access; the tab doesn't say which
          - text: The role got into DynamoDB through a resource-based policy the tab doesn't name
        explanation:
          text: It's the other way round. Last accessed information covers identity-based policies only.
    correct_answers: [attempted-maybe-denied]
    explanation:
      text: |
        Last accessed information shows which services an identity is allowed to use and when it last
        tried each one. It records attempts, including denied ones, and covers only identity-based
        policies. Check the policies, and CloudTrail, before drawing conclusions or removing access.

  - id: q09-records-on-with-nothing-set-up
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "Security logs live in a few known places, for set lengths of time"
    task: "2.2"
    level: understanding
    topics: [logging, audit-records]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A charity's AWS account is two months old, and nobody has set up any logging or recording.
        An auditor asks what evidence exists anyway. Which TWO records does the account already
        have? (Select TWO.)
    choices:
      - id: flow-logs
        text: VPC Flow Logs for each network interface
        variants:
          - text: Flow logs for every network interface in the VPCs
          - text: VPC Flow Logs covering each network interface
        explanation:
          text: Flow Logs are off until you create them.
      - id: event-history
        text: CloudTrail Event history of management events
        variants:
          - text: The management events in CloudTrail Event history
          - text: CloudTrail's Event history of management actions
        explanation:
          text: Correct. Event history is on from the day an account is created and keeps 90 days of management events per Region.
      - id: s3-access-logs
        text: S3 server access logs for each bucket
        variants:
          - text: Server access logs for every S3 bucket
          - text: Each bucket's S3 server access logs
        explanation:
          text: S3 server access logging is off until you turn it on for a bucket.
      - id: config-history
        text: AWS Config history of each resource's settings
        variants:
          - text: AWS Config's history of every resource's settings
          - text: The settings history of each resource in AWS Config
        explanation:
          text: Config records nothing until you set up a configuration recorder.
      - id: last-accessed
        text: IAM last accessed information for identities
        variants:
          - text: Last accessed information for IAM identities
          - text: IAM's last accessed data for each identity
        explanation:
          text: Correct. IAM's access reports are on and free, and last accessed information covers at least 400 days.
    correct_answers: [event-history, last-accessed]
    explanation:
      text: |
        Some records exist from day one: CloudTrail Event history (90 days of management events) and
        IAM's access reports, including last accessed information. Many others are off until you turn
        them on: trails, VPC Flow Logs, S3 server access logs, load balancer access logs and AWS
        Config. A record you never turned on can't be produced for an auditor.

  - id: q09-who-opened-mysql-port
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "Worked example: three of the auditor's questions"
    task: "2.2"
    level: application
    topics: [aws-config, cloudtrail, audit-records]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A payments company has run AWS Config and a multi-Region trail for two years. An auditor says
        that last spring, a database security group allowed port 3306 from anywhere for a few days,
        and asks who opened it. How should the company find the answer?
    choices:
      - id: config-then-cloudtrail
        text: Find when the rule appeared in Config's history, then the linked CloudTrail event that names who made it
        variants:
          - text: Use Config's history to date the rule's arrival, then the CloudTrail event behind it to name the person
          - text: Locate the change in Config's timeline, then read the linked CloudTrail event for who made it
        explanation:
          text: Correct. Config shows when the setting changed and links to the CloudTrail event; CloudTrail names the person. Last spring is beyond Event history, so the trail's files hold that event.
      - id: cloudwatch-connections
        text: Read the database's CloudWatch connection metrics, which record the user behind each change to the group
        variants:
          - text: Check CloudWatch connection metrics for the database, which name who changed the group
          - text: Look at the database's connection metrics in CloudWatch, which identify who edited the group
        explanation:
          text: Metrics are numbers over time. They can show more connections, not who changed a security group.
      - id: last-accessed-ec2
        text: Check IAM last accessed information to see which user most recently used the EC2 service
        variants:
          - text: See in IAM last accessed information which user used the EC2 service most recently
          - text: Use IAM last accessed data to find the user who last called the EC2 service
        explanation:
          text: Last accessed shows when an identity last tried a service, not which action it took on which resource, and the last use may be long after the change.
      - id: credential-report-edits
        text: Generate the IAM credential report, which lists the users who edited security groups
        variants:
          - text: Produce the IAM credential report, which shows who edited security groups
          - text: Run IAM's credential report to list the users who changed security groups
        explanation:
          text: The credential report covers passwords, MFA and access keys. It doesn't record changes to resources.
    correct_answers: [config-then-cloudtrail]
    hint:
      text: One record dates the change to the resource; another names whoever made it.
    explanation:
      text: |
        Two records work together. AWS Config's history shows when the group's settings changed and
        links each change to the CloudTrail event behind it; CloudTrail names who made the request.
        Because last spring is more than 90 days ago, the event is in the trail's files, not in Event
        history.

  - id: q09-event-history-can-answer
    page: guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md
    section: "Part A: follow one change from start to finish (follow-along)"
    task: "2.2"
    level: understanding
    topics: [cloudtrail, event-history]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small accounting practice has never created a trail. Its owner opens CloudTrail Event
        history in the Region the practice uses. Which question can Event history answer on its own?
    choices:
      - id: who-downloaded
        text: Who downloaded a client's tax return from an S3 bucket yesterday
        variants:
          - text: Who downloaded a client's tax return from a bucket yesterday
          - text: Which person downloaded a tax return from S3 yesterday
        explanation:
          text: Downloading an object is a data event. Event history shows management events only.
      - id: who-deleted-eight-months
        text: Who deleted a DynamoDB table eight months ago in that Region
        variants:
          - text: Which user deleted a DynamoDB table there eight months ago
          - text: Who removed a DynamoDB table in that Region eight months ago
        explanation:
          text: Event history keeps 90 days. With no trail, an event from eight months ago wasn't kept anywhere.
      - id: who-terminated-three-weeks
        text: Who terminated an EC2 instance three weeks ago in that Region
        variants:
          - text: Which user terminated an EC2 instance there three weeks ago
          - text: Who shut down an EC2 instance for good in that Region three weeks ago
        explanation:
          text: Correct. Terminating an instance is a management event, three weeks is inside 90 days, and the owner is looking in the right Region.
      - id: sg-rules-on-date
        text: What a security group's rules were on a given day last month
        variants:
          - text: Which rules a security group had on a given day last month
          - text: How a security group was set on a particular day last month
        explanation:
          text: Event history lists changes, not the state of a resource on a date; rebuilding the state from changes is error-prone. That is AWS Config's job.
    correct_answers: [who-terminated-three-weeks]
    explanation:
      text: |
        Event history shows the last 90 days of management events, one Region at a time, at no
        charge. It doesn't show data events, such as downloads, or anything older than 90 days, and
        it records actions rather than what a resource looked like on a date. Each limit is part of
        an honest answer to an auditor.

  - id: q09-config-item-stays-true
    page: guide/09-protecting-and-governing/09-sim-config-timeline.md
    section: "Decision 1: answer the auditor's four questions"
    task: "2.2"
    level: application
    topics: [aws-config, configuration-items]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        AWS Config recorded these configuration items for a hotel group's security group `db-sg`
        (times in UTC):

        | Item | Recorded | Inbound rules |
        |---|---|---|
        | 1 | Before Monday | TCP 5432 from `10.0.1.0/24` |
        | 2 | Tuesday 09:15 | TCP 5432 from `10.0.1.0/24`; TCP 5432 from `0.0.0.0/0` |
        | 3 | Thursday 16:20 | TCP 5432 from `10.0.1.0/24` |

        What did `db-sg` allow on Wednesday at 18:00?
    choices:
      - id: private-only
        text: Port 5432 from `10.0.1.0/24` only
        variants:
          - text: Only port 5432 from `10.0.1.0/24`
          - text: TCP 5432 from `10.0.1.0/24`, nothing more
        explanation:
          text: That was the state before Tuesday 09:15 and again after Thursday 16:20, not on Wednesday evening.
      - id: both-rules
        text: Port 5432 from `10.0.1.0/24` and from anywhere
        variants:
          - text: TCP 5432 from `10.0.1.0/24` and from `0.0.0.0/0`
          - text: Port 5432 from both `10.0.1.0/24` and anywhere
        explanation:
          text: Correct. Item 2 was the current state from Tuesday 09:15 until item 3 replaced it on Thursday 16:20.
      - id: unknown-no-item
        text: Unknown, because Config saved no item on Wednesday
        variants:
          - text: It can't be known, since no item was recorded Wednesday
          - text: Nobody can say, as Config recorded nothing on Wednesday
        explanation:
          text: Config records an item when a resource changes. No item on Wednesday means nothing changed, so item 2 still described the group.
      - id: needs-cloudtrail
        text: Unknown until CloudTrail shows who changed the group
        variants:
          - text: It can't be told without CloudTrail naming who changed it
          - text: Nobody can say until CloudTrail shows who made the change
        explanation:
          text: CloudTrail names who made each change, but the state on a date is exactly what Config's items answer.
    correct_answers: [both-rules]
    hint:
      text: A configuration item describes the resource from the moment it is recorded until what happens next?
    explanation:
      text: |
        Config saves a configuration item each time a recorded resource changes, and each item stays
        true until the next one replaces it. Reading the timeline, item 2 covered Tuesday 09:15 to
        Thursday 16:20, so on Wednesday evening the database port was open to anywhere. Who opened it
        is a separate question for CloudTrail.

  - id: q09-config-flags-but-does-not-stop
    page: guide/09-protecting-and-governing/09-sim-config-timeline.md
    section: "Decision 2: the owner says, \"Config caught it, so Config would have stopped it next time.\""
    task: "2.2"
    level: understanding
    topics: [aws-config, preventive-detective]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A Config rule at a logistics firm marked a security group noncompliant for two days before
        anyone closed an open port. A manager says, "Now that the rule exists, Config will stop this
        happening again." Which reply is correct?
    choices:
      - id: config-blocks
        text: Right; once a rule exists, Config refuses changes that would break it
        variants:
          - text: Correct; Config rejects any change that would fail an existing rule
          - text: True; an existing rule makes Config block changes that break it
        explanation:
          text: Config rules evaluate resources after a change; they don't sit in the path of the request.
      - id: config-reverts
        text: Right; Config undoes noncompliant changes automatically within minutes
        variants:
          - text: Correct; Config reverses noncompliant changes by itself within minutes
          - text: True; Config rolls back changes that break a rule within minutes
        explanation:
          text: Config fixes nothing unless you attach a remediation action to the rule.
      - id: cloudtrail-blocks
        text: Wrong; CloudTrail, not Config, blocks changes once a rule exists
        variants:
          - text: Not so; once a rule exists, CloudTrail blocks the change instead
          - text: No; CloudTrail is what blocks such changes when a rule exists
        explanation:
          text: CloudTrail records requests; it blocks nothing either.
      - id: report-only
        text: Wrong; Config reports, a remediation action fixes, and permissions prevent
        variants:
          - text: No; Config detects, attached remediation fixes, and IAM permissions prevent
          - text: Not so; Config flags it, remediation repairs it, and permissions stop it
        explanation:
          text: Correct. Detect, fix and prevent are three different tools.
    correct_answers: [report-only]
    explanation:
      text: |
        AWS Config records and evaluates; on its own it changes nothing. You can attach a remediation
        action to a rule to fix a noncompliant resource, automatically or after approval. To prevent
        the change, the person's IAM permissions shouldn't allow it, and across many accounts a
        service control policy can cap it.

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.02, Encryption
  # ---------------------------------------------------------------------------------------------

  - id: q09-clinic-portal-cafe-wifi
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "At rest and in transit are two protections against two different threats"
    task: "2.2"
    level: understanding
    topics: [encryption-in-transit, encryption-at-rest]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A physiotherapy clinic lets patients book appointments through a web portal. The portal's
        database volumes are already encrypted at rest. The clinic's new worry is patients booking
        from café Wi-Fi, where someone nearby could capture their traffic. Which protection answers
        that worry?
    choices:
      - id: customer-managed-key
        text: Re-encrypt the database volumes with a customer managed key in AWS KMS
        variants:
          - text: Switch the database volumes to a customer managed AWS KMS key
          - text: Protect the database volumes with a customer managed KMS key instead
        explanation:
          text: That changes who controls the key for stored data. The volumes were already encrypted at rest; traffic captured on a network is a different threat.
      - id: cloudhsm-keys
        text: Move the database's keys into AWS CloudHSM hardware
        variants:
          - text: Hold the database's keys in AWS CloudHSM instead
          - text: Keep the database's keys in single-tenant CloudHSM devices
        explanation:
          text: CloudHSM changes where the at-rest keys live and who controls them. It does nothing for data crossing café Wi-Fi.
      - id: require-https
        text: Require HTTPS, so traffic is encrypted in transit
        variants:
          - text: Serve the portal only over HTTPS (TLS)
          - text: Encrypt the portal's traffic in transit with TLS
        explanation:
          text: Correct. TLS (HTTPS) encrypts data while it moves between the patient's browser and the portal.
      - id: encrypt-backups
        text: Encrypt the database's backups and snapshots as well
        variants:
          - text: Turn on encryption for every snapshot of the database
          - text: Make sure the database's backups are encrypted too
        explanation:
          text: Backups and snapshots are stored data, so this is still encryption at rest. It's worth doing, but it doesn't touch traffic on the network.
    correct_answers: [require-https]
    explanation:
      text: |
        Encryption at rest protects stored bytes; it does nothing for data crossing a network.
        Someone capturing Wi-Fi traffic threatens data in transit, which TLS (HTTPS) protects. The
        two protections cover different states, so having one never removes the need for the other.

  - id: q09-az-links-not-browser-connections
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "At rest and in transit are two protections against two different threats"
    task: "2.2"
    level: understanding
    topics: [encryption-in-transit, shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In a design review, an architect at a freight company writes: "AWS encrypts traffic between
        its Availability Zones and between its Regions, so our customers' connections to our load
        balancer are already encrypted." Which statement corrects this?
    choices:
      - id: aws-links-only
        text: AWS's encryption covers its own links; HTTPS to the load balancer is the company's job
        variants:
          - text: AWS protects traffic on its own network, but browser-to-load-balancer HTTPS is the company's
          - text: Only AWS's internal links are covered; the company must set up HTTPS for its customers
        explanation:
          text: Correct. AWS encrypts traffic between its Availability Zones and between Regions on its network. The connection from a customer's browser to the load balancer is a setting the company chooses.
      - id: already-covered
        text: The statement is right, so an HTTPS listener on the load balancer adds nothing
        variants:
          - text: Nothing needs correcting, and an HTTPS listener would add no protection
          - text: It's accurate, so an HTTPS listener on the load balancer is redundant
        explanation:
          text: AWS's link encryption stops at its own network. Traffic from browsers crosses the internet before it reaches AWS, and only an HTTPS listener encrypts it.
      - id: regions-only
        text: AWS encrypts traffic between Regions, but traffic between Availability Zones travels unencrypted
        variants:
          - text: Only Region-to-Region traffic is encrypted by AWS, while zone-to-zone traffic is left in plain text
          - text: AWS encrypts its links between Regions and leaves the links between Availability Zones unencrypted
        explanation:
          text: AWS states that all traffic between its Availability Zones is encrypted too. The mistake in the review is about customer connections, not AWS's links.
      - id: needs-cloudhsm
        text: Customer connections can be encrypted only if the company also rents AWS CloudHSM
        variants:
          - text: The company needs AWS CloudHSM before its customers' connections can be encrypted
          - text: Browser connections become encrypted only once the company adds CloudHSM devices
        explanation:
          text: HTTPS needs a TLS certificate, which ACM provides for load balancers. CloudHSM holds keys in dedicated hardware and isn't needed for HTTPS.
    correct_answers: [aws-links-only]
    explanation:
      text: |
        AWS encrypts the traffic on its own links between Availability Zones and between Regions.
        That protects AWS's network, not the path from a customer's browser across the internet to
        the company's load balancer. Requiring HTTPS there is the customer's setting.

  - id: q09-encrypted-claims-photos-two-truths
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "At rest and in transit are two protections against two different threats"
    task: "2.2"
    level: understanding
    topics: [encryption-at-rest, encryption-in-transit, s3-encryption]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        An insurance company keeps claim photos in an Amazon S3 bucket with default encryption, and
        adjusters download them over the internet. A new manager assumes that encryption settles
        every risk to the photos. Which TWO statements are correct? (Select TWO.)
    choices:
      - id: readers-get-plaintext
        text: Anyone whose policies allow reading an object gets it back decrypted
        variants:
          - text: A person permitted to read an object receives it already decrypted
          - text: Permission to read an object is enough to get it back decrypted
        explanation:
          text: Correct. S3 decrypts objects automatically for anyone its policies let read them. Encryption isn't access control; the policies are.
      - id: at-rest-covers-downloads
        text: Encryption at rest also encrypts the photos while adjusters download them
        variants:
          - text: The at-rest setting protects the photos as they travel to adjusters
          - text: Stored-data encryption also covers the photos on their way across the internet
        explanation:
          text: Encryption at rest protects stored bytes only. Data on the network needs encryption in transit.
      - id: nobody-can-read
        text: Encrypted objects can't be read by anyone in the company's own account
        variants:
          - text: Nobody in the company's account can open the encrypted objects
          - text: Encryption stops every user in the company's account from reading objects
        explanation:
          text: People with read permission get the objects decrypted automatically. Encryption guards against someone getting the stored bytes without the key.
      - id: downloads-need-tls
        text: Downloads need encryption in transit, such as HTTPS, as a separate protection
        variants:
          - text: Protecting downloads takes encryption in transit, a separate setting like HTTPS
          - text: Data crossing the internet needs its own protection, such as HTTPS
        explanation:
          text: Correct. In transit and at rest protect different states, and one doesn't give you the other.
      - id: vpn-makes-private
        text: A Site-to-Site VPN would make the downloads private as well as encrypted
        variants:
          - text: Sending the downloads through a VPN makes them private, not just encrypted
          - text: A VPN tunnel turns the internet downloads into private traffic
        explanation:
          text: A VPN encrypts traffic that still crosses the public internet. Encrypted isn't the same as private.
    correct_answers: [readers-get-plaintext, downloads-need-tls]
    explanation:
      text: |
        Encryption at rest protects stored bytes against someone who gets them without the key. It
        doesn't stop people your policies allow, who get objects decrypted automatically, and it
        doesn't protect data on the network, which needs encryption in transit such as HTTPS.

  - id: q09-ticketing-api-certificate-lapsed
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "TLS certificates from ACM protect data in transit"
    task: "2.2"
    level: application
    topics: [acm, encryption-in-transit]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A concert-ticketing startup serves its API through Amazon API Gateway over HTTPS. Last spring
        the API's certificate expired on a Saturday, and every app call failed until someone
        installed a new one. What should the startup use so this doesn't happen again?
    choices:
      - id: kms-rotation
        text: Automatic yearly rotation turned on for a customer managed key in AWS KMS
        variants:
          - text: A customer managed AWS KMS key with automatic rotation switched on
          - text: An AWS Key Management Service (AWS KMS) key that rotates itself each year
        explanation:
          text: Key rotation makes new key material for a KMS key, which protects data at rest. It doesn't issue or renew the TLS certificate an HTTPS endpoint presents.
      - id: cloudhsm-private-key
        text: An AWS CloudHSM cluster to hold the certificate's private key
        variants:
          - text: AWS CloudHSM devices that store the certificate's private key
          - text: A CloudHSM cluster in which to keep the certificate's key
        explanation:
          text: CloudHSM keeps keys in hardware only you use. It doesn't issue certificates or renew them when they expire.
      - id: database-at-rest
        text: Encryption at rest on the database behind the API
        variants:
          - text: Encrypting the API's backend database at rest
          - text: At-rest encryption for the data the API stores
        explanation:
          text: The failure was in transit, at the HTTPS endpoint. Encrypting stored data doesn't touch the certificate.
      - id: acm-certificate
        text: A public certificate from AWS Certificate Manager, attached to the API
        variants:
          - text: An ACM public certificate attached to the API Gateway endpoint
          - text: A public certificate issued by ACM and used by the API
        explanation:
          text: Correct. ACM issues public TLS certificates for integrated services such as API Gateway and renews them, so none expires quietly.
    correct_answers: [acm-certificate]
    hint:
      text: What expired protects data in transit, and one service both issues it and renews it for integrated services.
    explanation:
      text: |
        AWS Certificate Manager creates, stores and renews public TLS certificates for services it
        integrates with, such as Elastic Load Balancing, Amazon CloudFront and Amazon API Gateway.
        Because ACM renews them, a certificate doesn't quietly expire and take the API down. KMS
        and CloudHSM manage keys, not website certificates.

  - id: q09-acm-job-not-kms
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "TLS certificates from ACM protect data in transit"
    task: "2.2"
    level: recall
    topics: [acm, kms]
    type: multiple_choice
    selection: single
    prompt:
      text: Which job belongs to AWS Certificate Manager (ACM) rather than to AWS KMS?
    choices:
      - id: ebs-rds-keys
        text: Holding the keys that encrypt Amazon EBS volumes and Amazon RDS databases
        variants:
          - text: Keeping the keys behind encrypted Amazon EBS disks and Amazon RDS databases
          - text: Storing the keys that protect Amazon EBS volumes and Amazon RDS storage
        explanation:
          text: That is AWS KMS's job. S3, EBS and RDS integrate with KMS for encryption at rest.
      - id: issue-renew-tls
        text: Issuing and renewing TLS certificates for load balancers and CloudFront
        variants:
          - text: Providing TLS certificates to load balancers and CloudFront, and renewing them
          - text: Supplying and renewing the TLS certificates that CloudFront and load balancers use
        explanation:
          text: Correct. ACM handles certificates for data in transit on integrated services.
      - id: log-key-use
        text: Recording each encrypt and decrypt request in AWS CloudTrail
        variants:
          - text: Logging every use of a key to AWS CloudTrail
          - text: Leaving a CloudTrail record each time a key is used
        explanation:
          text: KMS records each use of AWS managed and customer managed keys in CloudTrail. ACM doesn't encrypt your data with keys.
      - id: yearly-key-material
        text: Making new key material every year while keeping the older material for old data
        variants:
          - text: Rotating key material yearly and holding on to older material for older data
          - text: Generating fresh key material each year without discarding the material before it
        explanation:
          text: That is KMS key rotation, which keeps old material so older data stays readable.
    correct_answers: [issue-renew-tls]
    explanation:
      text: |
        ACM manages TLS certificates, which protect data in transit, for integrated services such as
        load balancers, CloudFront and API Gateway, and renews them. AWS KMS manages the keys that
        encrypt stored data, records each use in CloudTrail and can rotate key material.

  - id: q09-genome-bucket-refuse-http
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "TLS certificates from ACM protect data in transit"
    task: "2.2"
    level: application
    topics: [encryption-in-transit, s3-encryption]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university research lab keeps genome files in an Amazon S3 bucket. A review finds that a few
        old scripts still upload over plain HTTP. The lab wants those uploads to fail until the
        scripts are fixed. What should it do?
    choices:
      - id: switch-to-sse-kms
        text: Switch the bucket's default encryption from SSE-S3 to SSE-KMS
        variants:
          - text: Change the bucket's default encryption to SSE-KMS instead of SSE-S3
          - text: Move the bucket from SSE-S3 to SSE-KMS default encryption
        explanation:
          text: That changes how the files are encrypted at rest. S3 would still accept uploads over plain HTTP.
      - id: acm-on-bucket
        text: Request a certificate from AWS Certificate Manager and attach it to the bucket
        variants:
          - text: Attach a certificate issued by AWS Certificate Manager (ACM) to the bucket
          - text: Install an ACM-issued TLS certificate directly on the S3 bucket itself
        explanation:
          text: ACM certificates attach to integrated services such as load balancers, CloudFront and API Gateway, not to a bucket. S3 already offers HTTPS; the problem is that it also accepts HTTP.
      - id: deny-insecure-transport
        text: Add a bucket policy that denies requests where `aws:SecureTransport` is false
        variants:
          - text: Write a bucket policy with a deny for requests whose `aws:SecureTransport` is false
          - text: Use a bucket policy denying requests when the `aws:SecureTransport` key is false
        explanation:
          text: Correct. AWS recommends this deny, based on the `aws:SecureTransport` condition, and the Config rule `s3-bucket-ssl-requests-only` checks for it.
      - id: block-public-access
        text: Turn on S3 Block Public Access for the bucket and the account
        variants:
          - text: Enable Block Public Access on the bucket and across the account
          - text: Switch on S3 Block Public Access at bucket and account level
        explanation:
          text: Block Public Access controls whether a bucket can be made public. It doesn't decide whether requests must use HTTPS.
    correct_answers: [deny-insecure-transport]
    hint:
      text: Offering HTTPS and requiring it are different. Think about what can refuse a request.
    explanation:
      text: |
        Turning HTTPS on isn't the same as requiring it: S3 accepts plain HTTP unless you say
        otherwise. A bucket policy that denies any request where `aws:SecureTransport` is false makes
        S3 refuse unencrypted connections, and the Config rule `s3-bucket-ssl-requests-only` can
        check that the policy is in place.

  - id: q09-aws-ebs-key-kind
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: recall
    topics: [kms, kms-key-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A finance team's Amazon EBS volumes are encrypted with the KMS key `aws/ebs`. Which
        description fits this kind of key?
    choices:
      - id: in-account-visible-unchangeable
        text: In the team's account and seen in CloudTrail, but its policy can't be changed
        variants:
          - text: Visible in the account, its use logged in CloudTrail, its policy fixed
          - text: Kept in the team's account, logged in CloudTrail, with a policy it can't edit
        explanation:
          text: Correct. `aws/ebs` is an AWS managed key. You can see it, read its policy and see its use in CloudTrail, but AWS controls it and rotates it every year.
      - id: hidden-in-aws-accounts
        text: In an AWS account the team can't see, and its use never appears in CloudTrail
        variants:
          - text: Held in AWS's own accounts, out of the team's sight and its CloudTrail
          - text: Kept by AWS in its own accounts, so the team can't see or audit its use
        explanation:
          text: That describes an AWS owned key. An AWS managed key such as `aws/ebs` lives in your account and shows its use in CloudTrail.
      - id: team-writes-policy
        text: The team wrote its key policy and can schedule it for deletion
        variants:
          - text: The team controls its key policy and may delete it
          - text: Its key policy is the team's to write, and the team can delete it
        explanation:
          text: That describes a customer managed key, which you create, control and pay a monthly fee for.
      - id: single-tenant-vpc
        text: It sits in single-tenant hardware inside the team's VPC
        variants:
          - text: It's stored on HSMs in the team's own VPC that only it uses
          - text: It lives in dedicated HSMs placed in the team's VPC
        explanation:
          text: That describes AWS CloudHSM. KMS keys of every kind are held by KMS, on hardware AWS runs.
    correct_answers: [in-account-visible-unchangeable]
    explanation:
      text: |
        KMS keys come in three kinds. AWS owned keys live in AWS's accounts and can't be seen or
        audited. AWS managed keys, named like `aws/ebs` and `aws/rds`, live in your account and show
        their use in CloudTrail, but AWS controls them and rotates them yearly. Customer managed keys
        are the ones you create and control.

  - id: q09-law-firm-contractor-no-decrypt
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: application
    topics: [kms, kms-key-types, s3-encryption]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A law firm keeps case files in an Amazon S3 bucket. A contractor who maintains the firm's
        storage has broad S3 permissions on every bucket. The partners want him unable to read the
        files' contents, and want each use of the key that protects the files recorded in AWS
        CloudTrail. Which setup meets both needs?
    choices:
      - id: sse-s3-plus-https
        text: Keep SSE-S3 and require HTTPS for every request to the bucket
        variants:
          - text: Stay on SSE-S3, and deny any request made without HTTPS
          - text: Use SSE-S3, with a bucket policy that requires HTTPS
        explanation:
          text: With SSE-S3, S3 decrypts for anyone its policies allow, so the contractor could read the files. HTTPS protects the files in transit, not from an allowed reader.
      - id: aws-managed-s3-key
        text: SSE-KMS with the AWS managed key `aws/s3`
        variants:
          - text: SSE-KMS using the AWS managed key `aws/s3` for the bucket
          - text: The AWS managed key `aws/s3`, through SSE-KMS
        explanation:
          text: Use of the key would be logged, but the firm can't change an AWS managed key's policy, so it can't shut the contractor out of decrypting.
      - id: copy-into-cloudhsm
        text: Copy the files into an AWS CloudHSM cluster, where S3 permissions no longer apply
        variants:
          - text: Store the case files inside AWS CloudHSM, outside the reach of S3 permissions
          - text: Move the files from S3 into a CloudHSM cluster that S3 permissions can't reach
        explanation:
          text: CloudHSM holds keys and does cryptography; it isn't a place to store files.
      - id: cmk-partners-only
        text: SSE-KMS with a customer managed key, its key policy set by the bucket owner
        variants:
          - text: A customer managed KMS key, through SSE-KMS, with the bucket owner's key policy
          - text: SSE-KMS under a customer managed key whose policy the bucket owner writes
        explanation:
          text: Correct. Reading the files needs permission to read the bucket and to use the key. The bucket owner's key policy can leave the contractor out, and CloudTrail records each use of the key.
    correct_answers: [cmk-partners-only]
    hint:
      text: With SSE-KMS, reading an object takes permission on the bucket and on one more thing. Who controls that second permission for each kind of key?
    explanation:
      text: |
        A customer managed key adds a second gate: S3 must use the key to return an object, so a
        person needs permission on the bucket and on the key. The firm writes the key policy, so a
        contractor with broad S3 permissions still can't decrypt, and every use of the key is
        recorded in CloudTrail.

  - id: q09-rotated-key-old-manuscripts
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: understanding
    topics: [kms, key-rotation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A publisher turned on automatic rotation for the customer managed key that protects its
        manuscript archive. An editor asks what happens to manuscripts that were encrypted under the
        key two years ago. What is the answer?
    choices:
      - id: reencrypt-or-lose
        text: They must be re-encrypted before the next rotation, or they become unreadable
        variants:
          - text: Unless they're re-encrypted before the next rotation, they can't be read
          - text: They need re-encrypting before each rotation, or access to them is lost
        explanation:
          text: Rotation keeps the older key material, so nothing has to be re-encrypted to stay readable.
      - id: old-material-kept
        text: They stay readable, because KMS keeps the older key material to decrypt them
        variants:
          - text: KMS keeps the earlier key material, so they can still be decrypted
          - text: They remain readable, since the old key material is kept for them
        explanation:
          text: Correct. Rotation makes new key material for new encryption and keeps the old material to decrypt older data.
      - id: auto-reencrypted
        text: KMS re-encrypts them automatically under the new key material overnight
        variants:
          - text: They're rewritten under the new key material straight after rotation
          - text: Rotation automatically re-encrypts them with the new key material
        explanation:
          text: KMS doesn't rewrite your data. Older data stays encrypted under the older material, which KMS keeps.
      - id: new-key-id
        text: They can be read only after every app is updated to the key's new ID
        variants:
          - text: Apps must switch to the rotated key's new ID before the files can be read
          - text: Each application needs the key's new ID before it can decrypt them
        explanation:
          text: Rotation changes the key material, not the key you refer to. Applications keep using the same key.
    correct_answers: [old-material-kept]
    explanation:
      text: |
        Automatic rotation of a customer managed key makes new key material every 365 days by
        default. KMS keeps the older material, so data encrypted before the rotation still decrypts
        and nothing has to be re-encrypted.

  - id: q09-retired-system-keep-key-usable-later
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: application
    topics: [kms, key-deletion]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A shipping company is retiring an old customer-records system. The security lead wants
        nobody to use the system's customer managed KMS key from now on, but the legal team may need
        to read the system's archived files next year. What should the lead do with the key?
    choices:
      - id: schedule-deletion
        text: Schedule it for deletion with the shortest waiting period allowed
        variants:
          - text: Delete it after the minimum waiting period KMS allows
          - text: Set it to be deleted with the shortest wait KMS offers
        explanation:
          text: Once the waiting period ends and the key is deleted, everything encrypted under it is unreadable forever, so legal couldn't read the files next year.
      - id: delete-recoverable
        text: Delete it now, since KMS can restore a deleted key for 30 days afterward
        variants:
          - text: Remove it, relying on KMS to keep a restorable copy for 30 days
          - text: Delete it; KMS keeps deleted keys recoverable for the next 30 days
        explanation:
          text: The waiting period comes before deletion, not after. A deleted key can't be brought back.
      - id: disable-key
        text: Disable the key, and enable it again if the files are needed
        variants:
          - text: Turn the key off, then turn it back on if legal needs the files
          - text: Disable it for now and re-enable it when the files are needed
        explanation:
          text: Correct. Disabling stops all use and can be undone, which is what AWS suggests when you aren't sure you'll never need the key.
      - id: switch-default-sse-s3
        text: Change the archive bucket's default encryption to SSE-S3
        variants:
          - text: Set SSE-S3 as the archive bucket's default encryption
          - text: Switch the archive's default encryption over to SSE-S3
        explanation:
          text: Default encryption applies to new objects. The archived files stay encrypted under the KMS key, which remains usable.
    correct_answers: [disable-key]
    hint:
      text: One action can be undone; the other ends access to the data for good.
    explanation:
      text: |
        Deleting a KMS key makes everything encrypted under it unreadable, forever. KMS forces a
        waiting period of 7 to 30 days before deletion, and AWS suggests disabling a key instead
        when you aren't sure. A disabled key can't be used, but it can be enabled again.

  - id: q09-cmk-over-sse-s3-two-gains
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: understanding
    topics: [kms, kms-key-types, s3-encryption]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A marketplace startup is choosing between S3's default encryption (SSE-S3) and SSE-KMS with
        a customer managed key for the tax forms its sellers upload. Which TWO things does the
        customer managed key give it that SSE-S3 doesn't? (Select TWO.)
    choices:
      - id: stronger-encryption
        text: Stronger encryption of the stored forms
        variants:
          - text: A more secure encryption of the forms at rest
          - text: Tougher encryption than SSE-S3 provides
        explanation:
          text: Both encrypt equally well. What a customer managed key adds is control and visibility, not strength.
      - id: key-policy
        text: A key policy it writes, saying who may use the key
        variants:
          - text: Its own key policy controlling who can use the key
          - text: Control, through a key policy, over who uses the key
        explanation:
          text: Correct. With SSE-S3, S3 manages the keys and you can't set who uses them.
      - id: in-transit
        text: Encryption of the forms while they travel to S3
        variants:
          - text: Protection for the forms as they cross the network
          - text: Encryption in transit for uploads to the bucket
        explanation:
          text: The choice of key is about data at rest. Uploads are protected in transit by HTTPS whichever key encrypts the stored forms.
      - id: finds-personal-data
        text: Automatic discovery of personal data inside the forms
        variants:
          - text: A scan of the forms for personal details
          - text: Detection of sensitive data within the uploaded forms
        explanation:
          text: Finding sensitive data in S3 is Amazon Macie's job. A key protects data; it doesn't classify it.
      - id: cloudtrail-each-use
        text: A CloudTrail record of each time the key is used
        variants:
          - text: An entry in CloudTrail for every use of the key
          - text: CloudTrail events showing each use of the key
        explanation:
          text: Correct. Each encrypt and decrypt with a customer managed key appears in CloudTrail; SSE-S3's key use doesn't appear in your trail.
    correct_answers: [key-policy, cloudtrail-each-use]
    explanation:
      text: |
        SSE-S3 and a customer managed key encrypt equally well. The customer managed key adds
        control and evidence: a key policy you write, which acts as a second gate on reading the
        data, and a CloudTrail record of every use. It also lets you choose rotation and disable or
        delete the key.

  - id: q09-regulator-dedicated-hsm-keep-kms
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "CloudHSM gives you hardware no one else uses, and more of the work"
    task: "2.2"
    level: application
    topics: [cloudhsm, kms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A national payments processor's regulator rules that its encryption keys must sit in
        single-tenant hardware security modules under the processor's exclusive control. Its
        engineers still want Amazon S3 and Amazon RDS to encrypt through their usual AWS KMS
        settings. What fits both?
    choices:
      - id: custom-key-store
        text: A KMS custom key store backed by an AWS CloudHSM cluster
        variants:
          - text: AWS CloudHSM, connected to KMS as a custom key store
          - text: KMS keys kept in a CloudHSM cluster through a custom key store
        explanation:
          text: Correct. A custom key store keeps KMS keys in the processor's own CloudHSM cluster, so services that use KMS can use keys held in HSMs only it controls.
      - id: rotated-cmk
        text: Customer managed keys in AWS KMS with automatic rotation
        variants:
          - text: AWS KMS customer managed keys, rotated automatically
          - text: Customer managed KMS keys set to rotate every year
        explanation:
          text: Standard KMS runs on validated HSMs that AWS shares among many customers. Rotation doesn't make the hardware single-tenant.
      - id: aws-managed-keys
        text: AWS managed keys such as `aws/s3` and `aws/rds`
        variants:
          - text: The AWS managed keys `aws/s3` and `aws/rds`
          - text: AWS's managed keys for S3 and RDS, such as `aws/rds`
        explanation:
          text: AWS controls these keys, and they sit on KMS's shared hardware, so they meet neither the exclusive-control nor the single-tenant rule.
      - id: sse-s3-rds-default
        text: SSE-S3 for the buckets and the default key for RDS
        variants:
          - text: S3-managed keys for the buckets plus RDS's default key
          - text: SSE-S3 on the buckets, with RDS's built-in key
        explanation:
          text: These leave the keys under AWS's control, the opposite of what the regulator asks.
    correct_answers: [custom-key-store]
    hint:
      text: The rule names dedicated hardware, and the engineers want to keep one service's integrations with S3 and RDS.
    explanation:
      text: |
        AWS CloudHSM gives single-tenant HSMs in your own VPC, with users and keys you control
        outside IAM. A KMS custom key store bridges the two: KMS keys live in your CloudHSM cluster,
        so S3, RDS and other services that integrate with KMS can still use them. Reach for this only
        when a rule like the regulator's requires it.

  - id: q09-telehealth-adviser-cloudhsm-claim
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "\"Compliance needs CloudHSM\" is wrong"
    task: "2.2"
    level: understanding
    topics: [cloudhsm, kms]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A telehealth startup's adviser says: "You'll store health records, so you must use AWS
        CloudHSM. AWS KMS isn't strong enough for regulated data." No law or contract the startup
        follows mentions dedicated hardware. Which reply is correct?
    choices:
      - id: kms-in-software
        text: "Agreed: KMS keeps its keys in software, not in hardware security modules"
        variants:
          - text: Right, because KMS stores keys in software rather than in HSMs
          - text: "True: KMS keys aren't held in any hardware security module"
        explanation:
          text: KMS keys are protected by HSMs validated to FIPS 140-3 Security Level 3. KMS runs on HSMs too.
      - id: only-cloudhsm-logged
        text: "Agreed: keys in CloudHSM, unlike KMS keys, leave a record of each use in CloudTrail"
        variants:
          - text: Right, since CloudHSM records each key use in AWS CloudTrail and KMS doesn't
          - text: "True: CloudTrail logs each key use for CloudHSM keys but not for KMS keys"
        explanation:
          text: It's the other way round. KMS records each use of AWS managed and customer managed keys in CloudTrail; CloudHSM's audit logs go to CloudWatch Logs.
      - id: cloudhsm-transit-only
        text: "Not so: CloudHSM protects data in transit rather than stored data"
        variants:
          - text: "No: CloudHSM is for data in transit, not for stored records"
          - text: Wrong, because CloudHSM handles traffic encryption, not data at rest
        explanation:
          text: CloudHSM holds keys that can protect stored data. It's rarely needed here because KMS is enough, not because it can't.
      - id: kms-validated-hsms
        text: "Not so: KMS keys sit in validated HSMs, and CloudHSM suits single-tenant rules"
        variants:
          - text: "No: KMS already runs on validated HSMs; CloudHSM is for dedicated-HSM rules"
          - text: Wrong, since KMS uses validated HSMs and CloudHSM is for single-tenant HSM rules
        explanation:
          text: Correct. Default to KMS, and choose CloudHSM when a rule specifically requires single-tenant HSMs under your exclusive control.
    correct_answers: [kms-validated-hsms]
    explanation:
      text: |
        "Compliance needs CloudHSM" is a common mistake. KMS keys are already protected by hardware
        validated to FIPS 140-3 Security Level 3, and AWS's CloudHSM guide suggests KMS when you want
        managed keys and don't need to run your own HSMs. CloudHSM is the answer when a rule names
        single-tenant HSMs or full control that KMS's shared service can't give.

  - id: q09-macie-addresses-in-photo-bucket
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "Macie finds sensitive data in S3, so you know what to protect"
    task: "2.2"
    level: application
    topics: [macie, data-classification]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A furniture retailer's product-photo bucket uses SSE-S3 and nothing more, because the photos
        appear on its public website anyway. Amazon Macie now reports that one folder in the bucket
        holds spreadsheets of customers' home addresses. What should the retailer do?
    choices:
      - id: nothing-already-encrypted
        text: Leave them, because SSE-S3 already encrypts the spreadsheets at rest
        variants:
          - text: Change nothing, since the files are already encrypted with SSE-S3
          - text: Keep things as they are, as SSE-S3 already protects the files
        explanation:
          text: Encryption at rest doesn't decide who may read the files. Anyone allowed into the photo bucket gets them decrypted.
      - id: treat-as-customer-data
        text: Treat them as customer data, moving them and tightening access and keys
        variants:
          - text: Reclassify the files, then move them and review their access and keys
          - text: Handle them as sensitive data, with tighter access and key control
        explanation:
          text: Correct. Classification comes first; data this sensitive belongs where access is tight and, if needed, a customer managed key controls and logs use.
      - id: guardduty-deletes
        text: Turn on Amazon GuardDuty so that it deletes files that hold personal data
        variants:
          - text: Enable Amazon GuardDuty to remove the files with personal data automatically
          - text: Switch on GuardDuty, which deletes any object containing personal details
        explanation:
          text: GuardDuty looks for suspicious activity and reports it. It doesn't read object contents and doesn't delete anything.
      - id: inspector-scan
        text: Have Amazon Inspector scan the spreadsheets for software vulnerabilities
        variants:
          - text: Run Amazon Inspector against the spreadsheets to find known flaws
          - text: Ask Inspector to check the spreadsheets for published vulnerabilities
        explanation:
          text: Inspector scans software on EC2, Lambda and container images for vulnerabilities. Spreadsheets in S3 aren't its job.
    correct_answers: [treat-as-customer-data]
    hint:
      text: Encryption hides bytes from people without permission; it doesn't decide who has permission.
    explanation:
      text: |
        Data classification comes before choosing protection. Once Macie shows that customer
        addresses sit in a bucket set up for public photos, the files need the treatment customer
        data gets: a bucket with tight access policies and Block Public Access, possibly a customer
        managed key, and no stray copies.

  - id: q09-macie-finding-kinds-two
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "Macie finds sensitive data in S3, so you know what to protect"
    task: "2.2"
    level: recall
    topics: [macie, guardduty, inspector]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A news agency turns on Amazon Macie for its S3 buckets. Which TWO kinds of finding can
        Macie raise? (Select TWO.)
    choices:
      - id: passport-numbers
        text: An object holds passport numbers
        variants:
          - text: A file contains passport numbers
          - text: Passport numbers are stored in an object
        explanation:
          text: Correct. Macie inspects objects for sensitive data such as ID numbers.
      - id: package-cve
        text: An EC2 instance runs a package with a known CVE
        variants:
          - text: A server has software with a published flaw
          - text: An installed package on an instance has a CVE
        explanation:
          text: Known software flaws on workloads are Amazon Inspector's findings.
      - id: bucket-public
        text: A bucket has become publicly accessible
        variants:
          - text: A bucket was made open to the public
          - text: Public access is now allowed on a bucket
        explanation:
          text: Correct. Macie also watches bucket settings and reports, for example, a bucket that becomes public.
      - id: key-odd-country
        text: An access key is in use from an unusual country
        variants:
          - text: Credentials are being used from an odd location
          - text: A key is called from a country never seen before
        explanation:
          text: Suspicious use of credentials is activity, which Amazon GuardDuty watches.
      - id: rds-unencrypted
        text: An RDS database isn't encrypted at rest
        variants:
          - text: A database lacks encryption at rest
          - text: An Amazon RDS instance is stored unencrypted
        explanation:
          text: Macie works on S3. A database's encryption setting is checked by an AWS Config rule or a Security Hub CSPM control.
    correct_answers: [passport-numbers, bucket-public]
    explanation:
      text: |
        Amazon Macie asks what is in your S3 data. It finds sensitive data such as personal,
        financial and ID details in objects, and it watches bucket settings, raising a finding when,
        for example, a bucket becomes publicly accessible. GuardDuty watches activity, and Inspector
        looks for software vulnerabilities.

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.03, Finding threats and weaknesses
  # ---------------------------------------------------------------------------------------------

  - id: q09-guardduty-sources-without-setup
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "GuardDuty watches activity and reports threats happening now"
    task: "2.2"
    level: understanding
    topics: [guardduty]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A freight company turns on Amazon GuardDuty in the one Region it uses. It has never created
        a CloudTrail trail and has never turned on VPC Flow Logs. What happens next?
    choices:
      - id: waits-for-trail
        text: GuardDuty raises no findings until the company creates a trail and turns on flow logs
        variants:
          - text: GuardDuty stays idle until a trail exists and flow logs are switched on
          - text: No findings appear until the company sets up a trail and enables flow logs
        explanation:
          text: GuardDuty doesn't depend on your own trail or flow log settings. It gets these sources itself once it's turned on.
      - id: dns-only
        text: GuardDuty analyzes only DNS logs until the other two sources are turned on
        variants:
          - text: GuardDuty reads DNS logs alone until the company enables the other sources
          - text: Only DNS lookups are analyzed until a trail and flow logs are set up
        explanation:
          text: All three foundational sources, CloudTrail management events, VPC Flow Logs and DNS logs, are read from the start.
      - id: blocks-bad-addresses
        text: GuardDuty starts blocking calls that come from known malicious addresses
        variants:
          - text: GuardDuty begins refusing requests from addresses on its threat lists
          - text: Requests from known bad addresses are now blocked by GuardDuty
        explanation:
          text: GuardDuty reports; it blocks nothing. Stopping traffic is the job of security groups, network ACLs or AWS WAF.
      - id: reads-on-its-own
        text: GuardDuty starts reading CloudTrail events, flow logs and DNS logs by itself
        variants:
          - text: GuardDuty reads CloudTrail events, flow logs and DNS logs with no more setup
          - text: With no further setup, GuardDuty begins analyzing all three of its sources
        explanation:
          text: Correct. GuardDuty reads its three foundational sources as soon as it's turned on, without a trail or flow logs of your own.
    correct_answers: [reads-on-its-own]
    explanation:
      text: |
        GuardDuty's foundation is CloudTrail management events, VPC Flow Logs and DNS logs, and it
        reads them as soon as you turn it on, with nothing else to set up. Optional protection plans
        widen its view. It works per Region, and it reports suspicious activity as findings; it
        doesn't block anything.

  - id: q09-guardduty-finding-to-phone
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "GuardDuty watches activity and reports threats happening now"
    task: "2.2"
    level: application
    topics: [guardduty, eventbridge]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A streaming-media company already runs Amazon GuardDuty. The on-call engineer wants a text
        message within minutes whenever GuardDuty raises a high-severity finding. What should the
        company build?
    choices:
      - id: guardduty-block-setting
        text: A GuardDuty setting that blocks the address named in each high-severity finding
        variants:
          - text: An option in GuardDuty that blocks the source address of serious findings
          - text: A GuardDuty feature that cuts off the address behind each severe finding
        explanation:
          text: GuardDuty has no blocking setting, and blocking isn't the request anyway, since the engineer wants to be told.
      - id: eventbridge-to-sns
        text: An Amazon EventBridge rule that matches the findings and sends them to an SNS topic
        variants:
          - text: An EventBridge rule matching those findings, with an Amazon SNS topic as its target
          - text: A rule in Amazon EventBridge that routes the findings to an Amazon SNS topic
        explanation:
          text: Correct. GuardDuty findings arrive as events; an EventBridge rule matches them and an SNS topic sends the message.
      - id: config-rule
        text: An AWS Config rule that marks GuardDuty noncompliant whenever it raises a finding
        variants:
          - text: A Config rule that flags GuardDuty as noncompliant each time a finding appears
          - text: An AWS Config rule that turns noncompliant when GuardDuty reports a finding
        explanation:
          text: Config rules judge resource settings against a desired setting. They don't watch for findings or send alerts about them.
      - id: trail-to-s3
        text: A CloudTrail trail that delivers each new GuardDuty finding to an S3 bucket
        variants:
          - text: A CloudTrail trail that copies every GuardDuty finding into an Amazon S3 bucket
          - text: A trail in CloudTrail that writes GuardDuty's findings to an S3 bucket
        explanation:
          text: A trail delivers API activity as log files; it isn't how findings are routed, and files in a bucket don't text anyone.
    correct_answers: [eventbridge-to-sns]
    hint:
      text: Module 08 built alerts by matching an event with a rule and sending it to a topic.
    explanation:
      text: |
        GuardDuty reports findings; any response, including an alert, is something you build. An
        Amazon EventBridge rule can match GuardDuty findings, for example by severity, and send
        them to an Amazon SNS topic that texts or emails people. It's the same pattern Module 08
        used for CloudWatch alarms.

  - id: q09-guardduty-team-note-two
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "GuardDuty watches activity and reports threats happening now"
    task: "2.2"
    level: recall
    topics: [guardduty]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A hotel chain's security lead is writing a one-page note about Amazon GuardDuty for new
        staff. Which TWO statements belong in it? (Select TWO.)
    choices:
      - id: scans-packages
        text: It scans installed software packages for published CVEs
        variants:
          - text: It checks installed packages against published CVEs
          - text: It looks for known CVEs in the software that's installed
        explanation:
          text: That's Amazon Inspector. GuardDuty watches activity, not what's installed.
      - id: per-region
        text: It must be turned on in each Region the company uses
        variants:
          - text: It works per Region, so each Region in use needs it on
          - text: Each Region the company uses needs it turned on separately
        explanation:
          text: Correct. GuardDuty works per Region.
      - id: needs-trail-first
        text: It needs a CloudTrail trail created before it can read API activity
        variants:
          - text: A CloudTrail trail must exist before it can see API calls
          - text: It can read API activity only after a trail has been created
        explanation:
          text: GuardDuty reads CloudTrail management events itself; you don't create a trail for it.
      - id: reports-not-blocks
        text: It raises findings but doesn't stop the activity it reports
        variants:
          - text: It reports suspicious activity without blocking it
          - text: Its findings describe threats; it doesn't stop them itself
        explanation:
          text: Correct. GuardDuty is a detection service; blocking belongs to other controls.
      - id: reads-s3-contents
        text: It reads the contents of S3 objects to find personal data
        variants:
          - text: It looks inside S3 objects for personal information
          - text: It examines what S3 objects contain to spot personal data
        explanation:
          text: That's Amazon Macie. GuardDuty can watch S3 data access with a protection plan, but it doesn't classify what objects contain.
    correct_answers: [per-region, reports-not-blocks]
    explanation:
      text: |
        GuardDuty is a threat detection service: it reads CloudTrail management events, VPC Flow
        Logs and DNS logs, compares them with threat intelligence and models of normal behavior,
        and raises findings. It works per Region and blocks nothing. Scanning software is
        Inspector's job, and finding personal data in S3 is Macie's.

  - id: q09-inspector-flaw-published-overnight
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Inspector scans workloads and reports weaknesses before an attacker finds them"
    task: "2.2"
    level: application
    topics: [inspector]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A regional hospital runs its patient portal on Amazon EC2 instances and AWS Lambda
        functions. Overnight, a serious flaw is published in a widely used logging library. By
        morning, the IT team wants a list of the affected workloads, without having scheduled any
        scan. Which service provides it?
    choices:
      - id: inspector
        text: Amazon Inspector
        variants:
          - text: Inspector
          - text: The Amazon Inspector service
        explanation:
          text: Correct. Inspector rescans its workloads when a new CVE is published and lists the affected ones.
      - id: guardduty
        text: Amazon GuardDuty
        variants:
          - text: GuardDuty
          - text: The Amazon GuardDuty service
        explanation:
          text: GuardDuty reports activity that looks like an attack. It doesn't inventory installed libraries, so it would only notice if someone exploited the flaw and the behavior showed in its logs.
      - id: detective
        text: Amazon Detective
        variants:
          - text: Detective
          - text: The Amazon Detective service
        explanation:
          text: Detective investigates the root cause of a finding after the fact; it doesn't scan software.
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: Trusted Advisor
          - text: The AWS Trusted Advisor service
        explanation:
          text: Trusted Advisor compares account settings with AWS's best practices; it doesn't look at the packages inside workloads.
    correct_answers: [inspector]
    hint:
      text: Ask which service reads what is installed on a workload, and when it scans.
    explanation:
      text: |
        Amazon Inspector finds EC2 instances, Lambda functions and container images on its own and
        scans them for known software flaws (CVEs) and unintended network exposure. It scans
        continuously: a new package, a patch or a newly published CVE triggers a fresh scan, so
        nobody schedules anything.

  - id: q09-inspector-old-notes-correction
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "\"Create an assessment template and install the Inspector agent\" is out of date"
    task: "2.2"
    level: understanding
    topics: [inspector, moving-target]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A study partner's older notes say: "To use Amazon Inspector, define an assessment target,
        pick an assessment template, install the Inspector agent and schedule the runs." Which
        correction is accurate?
    choices:
      - id: agent-renamed
        text: The steps still apply, but the Inspector agent is now called the CloudWatch agent
        variants:
          - text: Nothing changed except that the Inspector agent became the CloudWatch agent
          - text: The process is the same; the agent now goes by the CloudWatch agent's name
        explanation:
          text: The CloudWatch agent sends logs and metrics to CloudWatch; it isn't an Inspector agent under a new name.
      - id: schedule-in-eventbridge
        text: The steps still apply, but runs are now scheduled with Amazon EventBridge rules
        variants:
          - text: Only the scheduling changed, and EventBridge rules now start Inspector runs
          - text: The process is the same, except that EventBridge rules now schedule the runs
        explanation:
          text: Today's Inspector has no runs to schedule. It rescans when software or the list of published CVEs changes.
      - id: classic-shut-down
        text: That was Inspector Classic, now shut down; today's Inspector scans on its own, with no templates
        variants:
          - text: Those steps belong to Inspector Classic, which was shut down; Inspector now scans by itself
          - text: The notes describe the shut-down Inspector Classic; today's version needs no templates
        explanation:
          text: Correct. Inspector Classic shut down on 2026-05-20. Today's Inspector discovers workloads and scans them continuously.
      - id: replaced-by-guardduty
        text: Inspector was retired, and GuardDuty now runs the same assessment templates
        variants:
          - text: GuardDuty took over Inspector's assessment templates when Inspector was retired
          - text: The templates moved to GuardDuty after Inspector itself was retired
        explanation:
          text: Inspector is very much current; only Inspector Classic shut down. GuardDuty watches activity and never used assessment templates.
    correct_answers: [classic-shut-down]
    explanation:
      text: |
        Assessment targets, templates, the Inspector agent and scheduled runs describe Amazon
        Inspector Classic, which AWS shut down on 2026-05-20. Today's Inspector finds EC2 instances,
        Lambda functions and container images by itself and scans them continuously; for EC2 it uses
        the AWS Systems Manager agent or scans without an agent. The service kept its name, which is
        why old material still circulates.

  - id: q09-inspector-two-finding-kinds
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Inspector scans workloads and reports weaknesses before an attacker finds them"
    task: "2.2"
    level: understanding
    topics: [inspector, guardduty, security-hub]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A ticket-sales company's web server runs an operating system package with a published
        flaw, and its port 22 can be reached from the internet. Nobody has tried to use either
        weakness yet. Which TWO findings would Amazon Inspector raise about this server? (Select
        TWO.)
    choices:
      - id: crypto-dns
        text: The server is looking up domains linked to cryptocurrency mining
        variants:
          - text: The server is querying domain names tied to crypto mining
          - text: DNS lookups from the server point to cryptocurrency mining
        explanation:
          text: That's a GuardDuty finding, seen in DNS logs, about activity happening now, which hasn't occurred here.
      - id: package-cve
        text: An installed package has a known CVE, and a fixed version exists
        variants:
          - text: A package on the server carries a published CVE with a fix available
          - text: Installed software has a known CVE that a newer version fixes
        explanation:
          text: Correct. A package vulnerability is one of Inspector's two kinds of finding.
      - id: cis-control-failed
        text: A security standard's control on SSH from anywhere has failed
        variants:
          - text: A standard's check that forbids SSH from anywhere has failed
          - text: The control against SSH open to the world is marked failed
        explanation:
          text: A failed control against a standard comes from AWS Security Hub (Security Hub CSPM today), which checks settings, not from Inspector.
      - id: credentials-outside
        text: The server's credentials were used from an address outside AWS
        variants:
          - text: The instance's credentials were used from outside AWS
          - text: Someone outside AWS used the server's temporary credentials
        explanation:
          text: That's GuardDuty, seen in CloudTrail events. Nobody has used the weaknesses yet, so there's no such activity.
      - id: network-reachability
        text: A network path runs from the internet to the server's port 22
        variants:
          - text: The server's port 22 is reachable over a path from the internet
          - text: A route from the internet reaches port 22 on the server
        explanation:
          text: Correct. Unintended network exposure, worked out from routes, network ACLs and security groups, is Inspector's other kind of finding.
    correct_answers: [package-cve, network-reachability]
    explanation:
      text: |
        Inspector reads what is installed and reachable and says "this could be attacked": known
        flaws in installed packages, and real network paths from the internet to a port. GuardDuty
        reads what is happening and says "this looks like an attack", so it stays quiet until
        someone uses a hole. A failed standards control on the same port comes from Security Hub.

  - id: q09-security-hub-many-consoles
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Security Hub gathers every finding and checks your settings, and the name now covers two products"
    task: "2.2"
    level: application
    topics: [security-hub]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An insurance group runs Amazon GuardDuty, Amazon Inspector and Amazon Macie across 15 AWS
        accounts. Its analysts are tired of switching between consoles, and the compliance team
        also wants the accounts scored against PCI DSS. Which service meets both needs?
    choices:
      - id: detective
        text: Amazon Detective
        variants:
          - text: Detective
          - text: The Amazon Detective service
        explanation:
          text: Detective investigates a finding's root cause and scope; it doesn't gather every service's findings or score settings against a standard.
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: Trusted Advisor
          - text: The AWS Trusted Advisor service
        explanation:
          text: Trusted Advisor checks against AWS's own best practices, not PCI DSS, and its results stay in its own console.
      - id: audit-manager
        text: AWS Audit Manager
        variants:
          - text: Audit Manager
          - text: The AWS Audit Manager service
        explanation:
          text: Audit Manager can't be set up in new accounts since 2026-04-30, and it never collected GuardDuty or Inspector findings into one console. Treat it as a wrong answer.
      - id: security-hub
        text: AWS Security Hub
        variants:
          - text: Security Hub
          - text: The AWS Security Hub service
        explanation:
          text: Correct. Security Hub collects findings from GuardDuty, Inspector and Macie in one place and checks settings against standards such as PCI DSS.
    correct_answers: [security-hub]
    hint:
      text: One service both gathers other services' findings and checks settings against named standards.
    explanation:
      text: |
        The exam's AWS Security Hub is one place for every security finding plus automatic checks of
        your settings against standards such as PCI DSS and CIS, with a score. Today that product is
        called AWS Security Hub CSPM; the name "AWS Security Hub" also covers a newer, unified product
        built on it that correlates findings into exposures.

  - id: q09-security-hub-controls-empty
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Security Hub gathers every finding and checks your settings, and the name now covers two products"
    task: "2.2"
    level: understanding
    topics: [security-hub, config]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software company turns on AWS Security Hub and enables the CIS AWS Foundations Benchmark
        standard. A day later, most of the standard's controls still show no results. What is the
        most likely missing piece?
    choices:
      - id: inspector-off
        text: Amazon Inspector isn't scanning the company's workloads yet
        variants:
          - text: Inspector hasn't started scanning the company's workloads
          - text: The workloads aren't being scanned by Amazon Inspector yet
        explanation:
          text: Inspector sends its own findings to Security Hub, but the CIS standard's controls check settings and don't depend on it.
      - id: config-off
        text: AWS Config isn't turned on and recording in the account
        variants:
          - text: The account has no AWS Config recorder running
          - text: AWS Config recording hasn't been switched on there
        explanation:
          text: Correct. Most of Security Hub's controls run as AWS Config rules, so Config must be recording.
      - id: guardduty-plans-off
        text: GuardDuty's optional protection plans haven't been enabled
        variants:
          - text: The optional GuardDuty protection plans are still off
          - text: Nobody has switched on GuardDuty's extra protection plans
        explanation:
          text: Protection plans widen what GuardDuty watches. They have nothing to do with Security Hub's settings checks.
      - id: basic-support
        text: The account is on Basic Support instead of a paid plan
        variants:
          - text: The account has only the Basic Support plan
          - text: No paid Support plan covers the account yet
        explanation:
          text: The Support plan limits which Trusted Advisor checks you see, not whether Security Hub's controls run.
    correct_answers: [config-off]
    explanation:
      text: |
        Security Hub's standards (in today's terms, Security Hub CSPM's) are sets of controls, and
        most of those controls run as AWS Config rules. Without Config turned on and recording, they
        have nothing to evaluate. That is also why Security Hub's cost includes Config's charges.

  - id: q09-security-hub-name-today-two
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "\"Security Hub is one product\" is no longer right"
    task: "2.2"
    level: recall
    topics: [security-hub, moving-target]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A colleague studying for the exam asks how today's products relate to the "AWS Security
        Hub" that the exam guide names. Which TWO statements are accurate? (Select TWO.)
    choices:
      - id: replaced-detectors
        text: Security Hub replaced GuardDuty and Inspector, which no longer raise findings
        variants:
          - text: GuardDuty and Inspector stopped raising findings when Security Hub took over
          - text: Security Hub took over from GuardDuty and Inspector, which raise nothing now
        explanation:
          text: Security Hub collects their findings; GuardDuty and Inspector still produce them.
      - id: unified-leaves-cspm-off
        text: Turning on the unified Security Hub leaves Security Hub CSPM switched off
        variants:
          - text: Enabling the unified Security Hub keeps Security Hub CSPM turned off
          - text: Security Hub CSPM stays off when the unified Security Hub is enabled
        explanation:
          text: The reverse. The unified product builds on Security Hub CSPM and turns it on when you enable it.
      - id: original-renamed-cspm
        text: The original product, which checks settings against standards, is now Security Hub CSPM
        variants:
          - text: The original standards-checking product now carries the name Security Hub CSPM
          - text: Security Hub CSPM is the new name of the original product that checks standards
        explanation:
          text: Correct. AWS renamed the original product AWS Security Hub CSPM (cloud security posture management).
      - id: cspm-no-config
        text: Security Hub CSPM runs all of its controls without needing AWS Config
        variants:
          - text: None of Security Hub CSPM's controls depend on AWS Config
          - text: Security Hub CSPM's controls all work with AWS Config turned off
        explanation:
          text: Most of its controls run as AWS Config rules, so Config must be on and recording.
      - id: unified-correlates
        text: The newer, unified Security Hub correlates signals into exposure findings
        variants:
          - text: The newer unified Security Hub joins related signals into exposure findings
          - text: Exposure findings come from the newer, unified Security Hub's correlation
        explanation:
          text: Correct. The unified product combines related problems into exposure findings and shows how an attacker could get in.
    correct_answers: [original-renamed-cspm, unified-correlates]
    explanation:
      text: |
        "AWS Security Hub" now names two products. The original, renamed AWS Security Hub CSPM,
        checks settings against standards, scores them and collects findings; it needs AWS Config.
        The newer, unified AWS Security Hub builds on it and correlates signals from it, GuardDuty,
        Inspector, Macie and IAM Access Analyzer into exposure findings. For the exam, "one place for
        findings" or "check against CIS" means Security Hub.

  - id: q09-detective-what-else-touched
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Detective explains what happened after a finding"
    task: "2.2"
    level: application
    topics: [detective, guardduty]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Amazon GuardDuty flags an IAM role at a payments startup for API calls from an unusual
        address. The security lead wants to see, without writing queries, whether this is normal for
        the role and what else the role and the address touched over the past few months. Which
        service is built for this?
    choices:
      - id: detective
        text: Amazon Detective
        variants:
          - text: Detective
          - text: The Amazon Detective service
        explanation:
          text: Correct. Detective links the finding to CloudTrail and flow-log activity in a behavior graph with up to a year of history.
      - id: config
        text: AWS Config
        variants:
          - text: Config
          - text: The AWS Config service
        explanation:
          text: Config records how resources were configured over time. It doesn't trace what an identity or address did.
      - id: inspector
        text: Amazon Inspector
        variants:
          - text: Inspector
          - text: The Amazon Inspector service
        explanation:
          text: Inspector scans workloads for software flaws and network exposure; it doesn't investigate activity.
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: Trusted Advisor
          - text: The AWS Trusted Advisor service
        explanation:
          text: Trusted Advisor checks settings against AWS best practices; it doesn't follow a role's actions.
    correct_answers: [detective]
    hint:
      text: GuardDuty has already raised the alarm. Which service starts from an alarm and works backward?
    explanation:
      text: |
        Amazon Detective is for the investigation that follows a finding. It collects CloudTrail
        events and VPC Flow Logs, takes in GuardDuty findings, and builds a behavior graph of which
        identities, addresses and resources did what, with up to a year of history. That answers
        "is this normal?" and "what else did it touch?" without writing queries.

  - id: q09-detective-guardduty-division
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Detective explains what happened after a finding"
    task: "2.2"
    level: understanding
    topics: [detective, guardduty]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement best describes how Amazon GuardDuty and Amazon Detective divide the work
        after something suspicious happens in an account?
    choices:
      - id: reversed
        text: Detective raises the alarm, and GuardDuty then investigates its root cause
        variants:
          - text: Detective detects the threat, and GuardDuty works out how it happened
          - text: The alarm comes from Detective, and the investigation from GuardDuty
        explanation:
          text: This reverses the two. GuardDuty detects; Detective investigates.
      - id: both-block
        text: Both block the malicious traffic, GuardDuty at the network and Detective in IAM
        variants:
          - text: Each one blocks the attack, GuardDuty on the network and Detective in IAM
          - text: GuardDuty blocks it on the network, and Detective blocks it in IAM
        explanation:
          text: Neither blocks anything. Both report or explain; blocking belongs to other controls.
      - id: detect-then-investigate
        text: GuardDuty raises the alarm, and Detective works out the root cause and scope
        variants:
          - text: GuardDuty detects the threat, and Detective investigates how far it went
          - text: The alarm comes from GuardDuty, and the investigation from Detective
        explanation:
          text: Correct. GuardDuty detects; Detective starts from the finding and investigates.
      - id: software-and-data
        text: GuardDuty scans S3 objects for personal data, and Detective scans for CVEs
        variants:
          - text: GuardDuty looks for personal data in S3, and Detective looks for CVEs
          - text: Detective checks software for CVEs, and GuardDuty checks S3 for personal data
        explanation:
          text: Those are Macie's and Inspector's jobs, not GuardDuty's or Detective's.
    correct_answers: [detect-then-investigate]
    explanation:
      text: |
        GuardDuty detects: it reads activity and raises a finding when something looks malicious.
        Detective investigates: it starts from that finding and uses up to a year of linked activity
        to find the root cause and the scope. "Root cause" or "investigate" in a question points to
        Detective.

  - id: q09-trusted-advisor-basic-support-view
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Trusted Advisor is a first look at your settings, with a few security checks free"
    task: "2.4"
    level: understanding
    topics: [trusted-advisor, support-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A two-person design studio has only Basic Support. What does AWS Trusted Advisor give the
        studio?
    choices:
      - id: nothing-until-paid
        text: No checks at all until the studio buys a paid Support plan
        variants:
          - text: Nothing, until the studio pays for a higher Support plan
          - text: No results of any kind before a paid Support plan is bought
        explanation:
          text: Every account gets some Trusted Advisor checks, including Basic Support accounts.
      - id: all-checks-api
        text: Every check, refreshed automatically and available through an API
        variants:
          - text: All of its checks, with automatic refresh and API access
          - text: The full set of checks, refreshed for it and reachable by API
        explanation:
          text: All checks, automatic refresh and the API come with Business Support+, Enterprise and Unified Operations.
      - id: pci-score
        text: A score of the studio's settings against the PCI DSS standard
        variants:
          - text: A rating of how the studio's settings meet PCI DSS
          - text: Its settings scored against the PCI DSS requirements
        explanation:
          text: Scoring against PCI DSS is AWS Security Hub's job (Security Hub CSPM today). Trusted Advisor compares with AWS's own best practices.
      - id: limits-and-some-security
        text: All service limit checks and a few security checks, refreshed by hand
        variants:
          - text: Its service limit checks plus selected security checks, run manually
          - text: Service limit checks and some security checks that the studio refreshes by hand
        explanation:
          text: Correct. Basic Support gets all service limit checks plus selected security and fault tolerance checks, refreshed by hand.
    correct_answers: [limits-and-some-security]
    explanation:
      text: |
        What Trusted Advisor shows depends on the Support plan. Basic Support, which every account
        has, gets all service limit checks and selected security and fault tolerance checks, such
        as MFA on the root user and security groups open to everyone, refreshed by hand. Paid plans
        unlock every check, automatic refresh and an API.

  - id: q09-trusted-advisor-category
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Trusted Advisor is a first look at your settings, with a few security checks free"
    task: "2.4"
    level: recall
    topics: [trusted-advisor, moving-target]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An operations manager is sorting AWS Trusted Advisor's recommendations into the groups the
        service uses. Which of these is one of Trusted Advisor's check categories?
    choices:
      - id: threat-detection
        text: Threat detection
        variants:
          - text: Threat detection checks
          - text: The threat detection category
        explanation:
          text: Detecting threats in activity is Amazon GuardDuty's job, not a Trusted Advisor category.
      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: Operational excellence checks
          - text: The operational excellence category
        explanation:
          text: Correct. AWS's current check reference lists six categories, operational excellence among them.
      - id: data-classification
        text: Data classification
        variants:
          - text: Data classification checks
          - text: The data classification category
        explanation:
          text: Finding sensitive data is Amazon Macie's job; Trusted Advisor doesn't classify data.
      - id: incident-investigation
        text: Incident investigation
        variants:
          - text: Incident investigation checks
          - text: The incident investigation category
        explanation:
          text: Investigating incidents is Amazon Detective's job.
    correct_answers: [operational-excellence]
    explanation:
      text: |
        Trusted Advisor groups its checks into six categories: cost optimization, performance,
        security, fault tolerance, service limits and operational excellence. Some older material
        lists five; AWS's current check reference lists six, so expect operational excellence among
        them.

  - id: q09-marketplace-ips-who-runs-it
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "AWS Marketplace sells third-party security products, billed through AWS"
    task: "2.4"
    level: understanding
    topics: [marketplace, shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A furniture retailer buys an intrusion prevention product from AWS Marketplace and deploys
        it in its own VPC. Who is responsible for configuring the product and keeping it running?
    choices:
      - id: retailer
        text: The retailer, because a Marketplace purchase moves no setup to AWS
        variants:
          - text: The retailer, since buying there shifts no configuration to AWS
          - text: The retailer; buying in Marketplace leaves the setup on its side
        explanation:
          text: Correct. The product runs in the retailer's account, so its rules and upkeep stay on the customer's side of the line.
      - id: aws-billing
        text: AWS, because the product's charges appear on the retailer's AWS bill
        variants:
          - text: AWS, since the charges for the product show up on the AWS bill
          - text: AWS, because the retailer pays for the product through its AWS bill
        explanation:
          text: AWS bills the retailer and pays the seller. Billing through AWS moves no responsibility for the product's setup.
      - id: aws-support
        text: AWS Support, because Marketplace products are AWS-managed services
        variants:
          - text: AWS Support, since products in Marketplace are managed by AWS
          - text: AWS Support, because AWS manages every Marketplace product
        explanation:
          text: Marketplace sells other companies' software; listing a product there doesn't make it an AWS-managed service.
      - id: seller-runs-account
        text: The seller, which takes over running the product in the retailer's account
        variants:
          - text: The seller, which operates the product inside the retailer's account
          - text: The seller, which runs the product for the retailer in its account
        explanation:
          text: The seller supplies the product; buying it doesn't hand the seller the job of operating it in the retailer's account.
    correct_answers: [retailer]
    explanation:
      text: |
        AWS Marketplace is a curated catalog of other companies' software, data and services,
        billed through AWS. A security product bought there runs in the customer's account, so
        configuring it and keeping it running stay the customer's job, as with anything else the
        customer runs on AWS.

  - id: q09-marketplace-facts-two
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "AWS Marketplace sells third-party security products, billed through AWS"
    task: "2.4"
