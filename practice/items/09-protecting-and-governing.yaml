        AWS Marketplace is a curated catalog where customers find, buy and deploy other companies'
        software, data and services, security products among them, including managed rule groups
        for AWS WAF. Charges appear on the AWS bill and AWS pays the seller. The product is still
        the customer's to configure and run.

  - id: q09-finding-which-one-is-macie
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Match a finding to its service by asking what it looked at"
    task: "2.2"
    level: application
    topics: [macie, findings]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's security team collects findings from several AWS services in one list. An
        analyst is asked to pick out the finding that Amazon Macie raised. Which one is it?
    choices:
      - id: package-cve-build-server
        text: A package on a build server has a known CVE that a newer version fixes
        variants:
          - text: Software on a build server carries a published CVE with a fix available
          - text: A build server runs a package with a known CVE that a later release fixes
        explanation:
          text: A flaw in installed software is an Amazon Inspector finding.
      - id: crypto-domain-lookups
        text: An instance keeps looking up a domain name linked to cryptocurrency mining
        variants:
          - text: An instance is repeatedly querying a domain tied to crypto mining
          - text: DNS lookups from an instance point to a cryptocurrency mining domain
        explanation:
          text: Activity seen in DNS logs is an Amazon GuardDuty finding.
      - id: bank-details-export
        text: A CSV export in an S3 bucket contains students' bank account numbers
        variants:
          - text: An exported CSV file in S3 holds students' bank account numbers
          - text: Students' bank account numbers sit in a CSV export in an S3 bucket
        explanation:
          text: Correct. Only Macie reads the contents of S3 objects and reports sensitive data such as financial details.
      - id: root-mfa-control
        text: The root user has no MFA, so a CIS standard control is marked failed
        variants:
          - text: A CIS standard control failed because the root user lacks MFA
          - text: With no MFA on the root user, a CIS control shows as failed
        explanation:
          text: A failed control against a named standard is an AWS Security Hub finding (Security Hub CSPM today).
    correct_answers: [bank-details-export]
    hint:
      text: Ask what each service had to look at to produce each finding.
    explanation:
      text: |
        Match a finding by what the service looked at. Activity points to GuardDuty, installed
        software and network paths to Inspector, settings against a named standard to Security Hub,
        and the contents of S3 objects to Amazon Macie. Only Macie reads inside objects for sensitive
        data such as bank account numbers.

  # ---------------------------------------------------------------------------------------------
  # Simulation S9, Match security findings to the service that raised them
  # ---------------------------------------------------------------------------------------------

  - id: q09-sim-rdp-control-failed
    page: guide/09-protecting-and-governing/08-sim-security-findings-tour.md
    section: "Decision 1: name the service that raised each finding"
    task: "2.2"
    level: application
    topics: [security-hub, findings]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A law firm's morning report includes a finding marked FAILED: a control in the CIS AWS
        Foundations Benchmark standard says a security group allows remote desktop (RDP) from any
        address. Which service raised this finding?
    choices:
      - id: inspector
        text: Amazon Inspector
        variants:
          - text: Inspector
          - text: The Amazon Inspector service
        explanation:
          text: Inspector raises network reachability findings about real paths to a workload, but it doesn't run a standard's controls.
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: Trusted Advisor
          - text: The AWS Trusted Advisor service
        explanation:
          text: Trusted Advisor has a check for open security groups too, but it compares with AWS's own best practices, not the controls of a named standard such as CIS.
      - id: guardduty
        text: Amazon GuardDuty
        variants:
          - text: GuardDuty
          - text: The Amazon GuardDuty service
        explanation:
          text: GuardDuty reports activity that looks malicious, not a setting that fails a standard.
      - id: security-hub
        text: AWS Security Hub
        variants:
          - text: Security Hub
          - text: The AWS Security Hub service
        explanation:
          text: Correct. A failed control against a named standard is a Security Hub finding (Security Hub CSPM, in today's names).
    correct_answers: [security-hub]
    hint:
      text: The finding names a standard and a control. Which service checks settings against named standards?
    explanation:
      text: |
        A control that passes or fails against a named standard, such as the CIS AWS Foundations
        Benchmark, comes from AWS Security Hub, today's Security Hub CSPM, which runs most controls as
        AWS Config rules. Trusted Advisor flags similar problems against AWS's own best practices,
        and Inspector reports actual network paths, but neither runs a standard's controls.

  - id: q09-sim-same-port-two-services
    page: guide/09-protecting-and-governing/08-sim-security-findings-tour.md
    section: "Decision 1: name the service that raised each finding"
    task: "2.2"
    level: application
    topics: [inspector, security-hub, findings]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Two findings about one database server arrive at a travel agency. Finding 1 says an open
        network path runs from the internet to the server's port 3306. Finding 2 says the server's
        security group fails a security standard's check for that port. Which services raised them?
    choices:
      - id: inspector-then-guardduty
        text: Finding 1 by Amazon Inspector, finding 2 by Amazon GuardDuty
        variants:
          - text: Inspector raised finding 1, and GuardDuty raised finding 2
          - text: Amazon Inspector for the first, Amazon GuardDuty for the second
        explanation:
          text: The first is right. GuardDuty reports activity that looks like an attack, not settings that fail a standard.
      - id: inspector-then-security-hub
        text: Finding 1 by Amazon Inspector, finding 2 by AWS Security Hub
        variants:
          - text: Inspector raised finding 1, and Security Hub raised finding 2
          - text: Amazon Inspector for the first, AWS Security Hub for the second
        explanation:
          text: Correct. Inspector works out real network paths; Security Hub checks settings against standards.
      - id: security-hub-then-inspector
        text: Finding 1 by AWS Security Hub, finding 2 by Amazon Inspector
        variants:
          - text: Security Hub raised finding 1, and Inspector raised finding 2
          - text: AWS Security Hub for the first, Amazon Inspector for the second
        explanation:
          text: The two are swapped. A reachable path is Inspector's finding; a failed standards check is Security Hub's.
      - id: guardduty-then-trusted-advisor
        text: Finding 1 by Amazon GuardDuty, finding 2 by AWS Trusted Advisor
        variants:
          - text: GuardDuty raised finding 1, and Trusted Advisor raised finding 2
          - text: Amazon GuardDuty for the first, AWS Trusted Advisor for the second
        explanation:
          text: GuardDuty doesn't calculate network paths, and Trusted Advisor compares with AWS best practices, not a security standard.
    correct_answers: [inspector-then-security-hub]
    hint:
      text: One finding is about whether the server can be reached; the other is about whether a setting meets a standard.
    explanation:
      text: |
        Findings that look alike can come from different services. Inspector's network reachability
        finding says "the server is reachable", worked out from routes, network ACLs and security
        groups. Security Hub's control (Security Hub CSPM today) says "this setting breaks a
        standard". Both point to the same fix: close the port to the internet.

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.04, The front door
  # ---------------------------------------------------------------------------------------------

  - id: q09-nonprofit-ddos-protection-already-on
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS Shield Standard is already protecting every AWS account"
    task: "2.2"
    level: recall
    topics: [shield-standard, ddos]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small charity has just moved its donation site to Amazon EC2 behind an Application Load
        Balancer. It hasn't bought or turned on any security service. What protection against
        distributed denial-of-service (DDoS) attacks does its AWS account already have?
    choices:
      - id: none-until-advanced
        text: None, until it subscribes to AWS Shield Advanced
        variants:
          - text: No protection until it pays for Shield Advanced
          - text: Nothing, unless it buys the AWS Shield Advanced subscription
        explanation:
          text: Shield Advanced is the paid tier. Every account already has the free tier, Shield Standard, without buying anything.
      - id: shield-standard-auto
        text: AWS Shield Standard, which all customers get at no extra charge
        variants:
          - text: Shield Standard, on by default and free of additional charge
          - text: The AWS Shield Standard tier, which AWS applies for free
        explanation:
          text: Correct. Shield Standard protects every AWS customer automatically against the most common network and transport layer floods. Nothing has to be turned on.
      - id: waf-rules-on-every-alb
        text: AWS WAF rules that AWS attaches to every load balancer by default
        variants:
          - text: A WAF web ACL that AWS adds to each load balancer for every customer
          - text: Default AWS WAF rules that come attached to all load balancers
        explanation:
          text: AWS WAF is something you set up and pay for. No web ACL is attached until you create one and attach it.
      - id: srt-through-basic
        text: The Shield Response Team, reachable through the free Basic Support plan
        variants:
          - text: Help from the Shield Response Team as part of Basic Support
          - text: Access to the Shield Response Team that comes with Basic Support
        explanation:
          text: The Shield Response Team is a Shield Advanced feature, and a Support plan alone, of any level, doesn't bring it.
    correct_answers: [shield-standard-auto]
    explanation:
      text: |
        AWS Shield Standard is on for every AWS customer, automatically and at no additional
        charge. It defends against the most common network and transport layer attacks, such as
        SYN floods and UDP reflection. Shield Advanced, AWS WAF and the Shield Response Team are
        things a customer chooses and pays for.

  - id: q09-ticketing-site-move-front-door-to-edge
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS Shield Standard is already protecting every AWS account"
    task: "2.4"
    level: understanding
    topics: [shield-standard, cloudfront, ddos]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A concert-ticketing company's customers reach its site directly through an Application Load
        Balancer in one Region. It wants Shield Standard to protect the site more strongly against
        network floods, without buying a subscription. Which change does that?
    choices:
      - id: private-subnet-nat
        text: Move the web servers into private subnets that reach the internet through a NAT gateway
        variants:
          - text: Put the web servers in private subnets, with a NAT gateway for their outbound traffic
          - text: Place the web servers in private subnets and send their outbound traffic through NAT
        explanation:
          text: A NAT gateway handles traffic the servers start going out. It does nothing about floods arriving at the load balancer, which still faces the internet.
      - id: inspector-scans
        text: Turn on Amazon Inspector so it scans the web servers continuously
        variants:
          - text: Enable Amazon Inspector to keep scanning the web servers
          - text: Have Inspector scan the web servers for weaknesses all the time
        explanation:
          text: Inspector reports software flaws and open network paths. It blocks nothing and doesn't absorb traffic.
      - id: flow-logs
        text: Enable VPC Flow Logs on the subnets that hold the load balancer
        variants:
          - text: Turn on VPC Flow Logs for the load balancer's subnets
          - text: Record VPC Flow Logs in the subnets where the load balancer runs
        explanation:
          text: Flow Logs record information about traffic for analysis. Recording a flood doesn't stop it.
      - id: cloudfront-in-front
        text: Put Amazon CloudFront in front of the whole site, with the load balancer as its origin
        variants:
          - text: Serve the entire site through CloudFront, using the load balancer as the origin
          - text: Place a CloudFront distribution before the whole site, with the load balancer behind it
        explanation:
          text: Correct. Floods then meet AWS at many edge locations, where Shield Standard gives its fullest protection, far from the servers in the Region.
    correct_answers: [cloudfront-in-front]
    hint:
      text: Shield Standard protects best where the site's front door sits.
    explanation:
      text: |
        AWS says resources that customers reach first through CloudFront, Route 53 hosted zones or
        Global Accelerator get the fullest protection from Shield Standard against network and
        transport layer attacks. Putting CloudFront in front of the whole site moves the front
        door to the edge, so architecture becomes part of DDoS protection, at no subscription cost.

  - id: q09-shield-standard-what-it-does-two
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS Shield Standard is already protecting every AWS account"
    task: "2.2"
    level: understanding
    topics: [shield-standard, ddos]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A hotel chain's architect is writing down what AWS Shield Standard does for the chain's
        booking site, before deciding whether to add anything. Which TWO statements describe Shield
        Standard? (Select TWO.)
    choices:
      - id: every-customer-free
        text: It applies to every AWS customer automatically, with no additional charge
        variants:
          - text: Every AWS customer gets it automatically, at no added cost
          - text: AWS applies it to all customers by default, free of extra charges
        explanation:
          text: Correct. There is nothing to subscribe to or turn on.
      - id: reads-requests
        text: It reads each web request and blocks ones that carry SQL injection
        variants:
          - text: It inspects every web request and stops SQL injection attempts
          - text: It examines the content of web requests to block SQL injection
        explanation:
          text: Shield Standard doesn't read web requests. Blocking SQL injection is AWS WAF's job.
      - id: credits-scaling
        text: It credits the scaling charges that an attack adds to the bill
        variants:
          - text: It refunds the extra scaling costs caused by an attack
          - text: It covers the added charges from scaling during an attack
        explanation:
          text: That is DDoS cost protection, part of the paid Shield Advanced subscription.
      - id: network-floods
        text: It defends against common network floods, such as SYN floods and UDP reflection
        variants:
          - text: It stops the most common network floods, like SYN floods and UDP reflection
          - text: It absorbs common network-level attacks such as SYN floods and UDP reflection
        explanation:
          text: Correct. Shield Standard defends against the most common network and transport layer attacks.
      - id: srt-on-call
        text: It puts the Shield Response Team on call for the chain around the clock
        variants:
          - text: It gives the chain round-the-clock access to the Shield Response Team
          - text: It makes the Shield Response Team available to the chain at all hours
        explanation:
          text: The Shield Response Team is a Shield Advanced feature, and AWS also requires a qualifying Support plan to use it.
    correct_answers: [every-customer-free, network-floods]
    explanation:
      text: |
        Shield Standard is the free tier of AWS Shield, on for everyone, and it handles the most
        common network and transport layer floods. It doesn't read web requests, it has no people
        to call and it doesn't protect the bill; those gaps are what AWS WAF and Shield Advanced
        fill.

  - id: q09-retailer-credit-attack-scaling-charges
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Shield Advanced adds detection, people and bill protection, for a price"
    task: "2.4"
    level: application
    topics: [shield-advanced, ddos]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        During a DDoS attack on an online furniture retailer, its Auto Scaling group launched dozens
        of extra instances to absorb the traffic, and the month's bill jumped. For future attacks,
        the retailer wants a way to ask AWS for credits covering charges like these. What should it
        use?
    choices:
      - id: shield-standard
        text: AWS Shield Standard
        variants:
          - text: Shield Standard
          - text: The AWS Shield Standard tier
        explanation:
          text: Shield Standard is free and automatic, but it has no bill protection. That's one of its limits.
      - id: guardduty
        text: Amazon GuardDuty
        variants:
          - text: GuardDuty
          - text: The Amazon GuardDuty service
        explanation:
          text: GuardDuty reports threats it sees in logs. It neither blocks attacks nor credits charges.
      - id: shield-advanced
        text: AWS Shield Advanced
        variants:
          - text: Shield Advanced
          - text: The Shield Advanced tier
        explanation:
          text: Correct. Its DDoS cost protection gives credits for extra charges an attack causes, such as instances Auto Scaling launched, requested through AWS Support.
      - id: trusted-advisor
        text: AWS Trusted Advisor
        variants:
          - text: Trusted Advisor
          - text: The AWS Trusted Advisor service
        explanation:
          text: Trusted Advisor recommends changes against AWS's best practices. It doesn't credit attack costs.
    correct_answers: [shield-advanced]
    hint:
      text: Only the paid tier of AWS's DDoS protection protects the bill.
    explanation:
      text: |
        DDoS cost protection is a Shield Advanced feature: credits for the scaling charges an
        attack causes on protected resources, requested through AWS Support. Shield Standard has no
        bill protection. Separately, an Auto Scaling group's maximum caps how far a flood can grow
        the bill, but it doesn't credit anything.

  - id: q09-support-plan-without-shield-advanced-srt
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "\"Any Business Support plan brings the Shield Response Team\" is wrong"
    task: "2.4"
    level: understanding
    topics: [shield-advanced, shield-response-team, support-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A news publisher pays for one of AWS's higher Support plans but has never subscribed to AWS
        Shield Advanced. During a large DDoS attack, its engineers want to call in the Shield
        Response Team (SRT). Can they?
    choices:
      - id: no-srt-is-advanced
        text: No, because the SRT comes with Shield Advanced, which a Support plan doesn't include
        variants:
          - text: No, since the SRT is part of Shield Advanced, and no Support plan brings it alone
          - text: No, because the SRT is a Shield Advanced feature that Support plans don't include
        explanation:
          text: Correct. The SRT is a Shield Advanced feature. AWS also requires a qualifying Support plan, but the Support plan is the second condition, not a way to get the SRT.
      - id: yes-support-includes
        text: Yes, because a higher Support plan includes the SRT on its own, with no other service
        variants:
          - text: Yes, since higher Support plans come with the SRT without needing anything else
          - text: Yes, because the SRT is a benefit of higher Support plans by themselves
        explanation:
          text: This is the misconception the lesson refutes. AWS words the requirement in terms of Support plans, which makes the SRT look like a Support benefit, but it belongs to Shield Advanced.
      - id: yes-standard-plus-support
        text: Yes, because Shield Standard includes the SRT for customers on paid Support plans
        variants:
          - text: Yes, since Shield Standard adds the SRT for any customer with paid Support
          - text: Yes, because paid Support customers get the SRT through Shield Standard
        explanation:
          text: Shield Standard has no people to call, whatever Support plan the account has.
      - id: no-needs-organizations
        text: No, because the SRT helps only accounts that belong to an AWS Organizations organization
        variants:
          - text: No, since the SRT works only for accounts inside an AWS Organizations organization
          - text: No, because only accounts in AWS Organizations can get help from the SRT
        explanation:
          text: The answer is no, but for the wrong reason. The SRT's requirements are Shield Advanced and a qualifying Support plan, not membership of an organization.
    correct_answers: [no-srt-is-advanced]
    explanation:
      text: |
        The Shield Response Team is part of AWS Shield Advanced. To use it, AWS requires Shield
        Advanced and a qualifying Support plan, so a Support plan alone, of any level, doesn't
        bring it. Which plans qualify is changing with AWS's new Support plans, so check AWS's SRT
        page before relying on it (as of 2026-10-24).

  - id: q09-shield-advanced-adds-over-standard-two
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Shield Advanced adds detection, people and bill protection, for a price"
    task: "2.4"
    level: understanding
    topics: [shield-advanced, shield-standard, ddos]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A national lottery operator already has AWS Shield Standard and is deciding whether to
        subscribe to AWS Shield Advanced for its CloudFront distribution and load balancers. Which
        TWO things would Shield Advanced add? (Select TWO.)
    choices:
      - id: syn-flood-first-time
        text: Protection against SYN floods and UDP reflection, which it doesn't have yet
        variants:
          - text: Defense against SYN floods and UDP reflection, missing until now
          - text: A first layer of protection from SYN floods and UDP reflection
        explanation:
          text: Shield Standard already defends against these common network and transport layer attacks for every customer.
      - id: auto-l7-mitigation
        text: Automatic mitigation of request floods, by creating and applying AWS WAF rules
        variants:
          - text: AWS WAF rules created and applied for it automatically during request floods
          - text: Automatic defense against web request floods, through AWS WAF rules it writes
        explanation:
          text: Correct. During an HTTP flood, Shield Advanced can create and apply WAF rules on protected resources for you.
      - id: cve-scanning
        text: Continuous scanning of its servers for software with known flaws
        variants:
          - text: Ongoing scans of its servers for installed software with known flaws
          - text: Regular checks of its servers' software against published flaws
        explanation:
          text: That is Amazon Inspector. Shield Advanced looks at attack traffic, not installed software.
      - id: attack-visibility
        text: Detailed metrics and reports on attacks against the resources it protects
        variants:
          - text: Detailed reports and metrics about attacks on its protected resources
          - text: In-depth metrics and reporting on attacks aimed at the protected resources
        explanation:
          text: Correct. Visibility into attacks on protected resources is one of the things Shield Advanced adds.
      - id: encrypt-at-rest
        text: Encryption at rest for the data behind its load balancers
        variants:
          - text: Encryption of the stored data behind its load balancers
          - text: At-rest encryption for data its load balancers serve
        explanation:
          text: Encryption at rest is set on each storage service, with keys from S3 or AWS KMS. Shield has nothing to do with it.
    correct_answers: [auto-l7-mitigation, attack-visibility]
    explanation:
      text: |
        Shield Advanced is a paid, yearly subscription for resources you choose. On top of Shield
        Standard's network flood protection, it adds automatic application layer mitigation
        through AWS WAF, detailed attack metrics and reports, the Shield Response Team (with a
        qualifying Support plan) and DDoS cost protection.

  - id: q09-recipe-site-comment-scripts
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS WAF reads each web request and allows, blocks or challenges it"
    task: "2.4"
    level: application
    topics: [waf, cross-site-scripting]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A recipe-sharing site lets visitors post comments. Attackers have started posting comments
        that contain scripts, which then run in other visitors' browsers. The site runs on EC2
        behind an Application Load Balancer. What should the site add to stop these requests?
    choices:
      - id: nacl-deny-443
        text: A network ACL rule that denies inbound HTTPS traffic to the web subnet
        variants:
          - text: A network ACL entry that blocks port 443 coming into the web subnet
          - text: A deny rule for inbound HTTPS in the web subnet's network ACL
        explanation:
          text: That would block every visitor, not only the attackers. A network ACL sees ports and addresses, not what a comment contains.
      - id: waf-xss-rules
        text: An AWS WAF web ACL on the load balancer, with cross-site scripting rules
        variants:
          - text: A WAF web ACL with cross-site scripting rules, attached to the load balancer
          - text: AWS WAF rules for cross-site scripting, in a web ACL on the load balancer
        explanation:
          text: Correct. WAF reads the content of each web request, and its rules can match cross-site scripting patterns and block them.
      - id: shield-advanced-sub
        text: An AWS Shield Advanced subscription that protects the load balancer
        variants:
          - text: A Shield Advanced subscription covering the Application Load Balancer
          - text: Shield Advanced protection for the site's load balancer
        explanation:
          text: Shield Advanced is for DDoS attacks. A few malicious comments are not a flood.
      - id: inspector-packages
        text: Amazon Inspector scans of the software packages on the web servers
        variants:
          - text: Inspector scanning the web servers' installed packages for known flaws
          - text: Scans by Amazon Inspector of the packages installed on the web servers
        explanation:
          text: Inspector reports known flaws in installed software. It doesn't read or block web requests.
    correct_answers: [waf-xss-rules]
    hint:
      text: The attack looks like an ordinary comment on port 443. Which layer reads what a request says?
    explanation:
      text: |
        Cross-site scripting arrives as normal-looking web requests on an allowed port, so only a
        layer that reads request content can stop it. AWS WAF does that: a web ACL attached to the
        load balancer (or to CloudFront) can block requests that match cross-site scripting
        patterns, for example with an AWS managed rule group.

  - id: q09-waf-attach-point-alb
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS WAF reads each web request and allows, blocks or challenges it"
    task: "2.4"
    level: recall
    topics: [waf]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer wants AWS WAF to inspect requests to a web application that runs on two EC2
        instances behind an Application Load Balancer. The site doesn't use CloudFront. Where does
        the developer attach the web ACL?
    choices:
      - id: each-instance
        text: To each EC2 instance's network interface
        variants:
          - text: To the network interface of every EC2 instance
          - text: Directly to each of the two EC2 instances
        explanation:
          text: You can't attach AWS WAF to an EC2 instance directly. It attaches to the resource that receives the web requests.
      - id: internet-gateway
        text: To the internet gateway of the VPC
        variants:
          - text: To the VPC's internet gateway
          - text: At the internet gateway attached to the VPC
        explanation:
          text: An internet gateway connects a VPC to the internet. It isn't a resource you attach a web ACL to.
      - id: subnet-nacl
        text: To the network ACL of the web subnets
        variants:
          - text: To the web subnets' network ACL
          - text: Onto the network ACL that guards the web subnets
        explanation:
          text: A network ACL is its own filter of addresses and ports. A web ACL is attached to a resource, not to a network ACL.
      - id: the-alb
        text: To the Application Load Balancer
        variants:
          - text: To the load balancer in front of the instances
          - text: Onto the Application Load Balancer itself
        explanation:
          text: Correct. The load balancer receives the web requests, so the web ACL goes there.
    correct_answers: [the-alb]
    explanation:
      text: |
        AWS WAF is attached to the resource that receives web requests, such as a CloudFront
        distribution, an Application Load Balancer or an API Gateway REST API. It can't be attached
        to an EC2 instance directly, so for instances behind a load balancer, the web ACL goes on
        the load balancer.

  - id: q09-scores-api-scripts-rate-limit
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS WAF reads each web request and allows, blocks or challenges it"
    task: "2.4"
    level: application
    topics: [waf, rate-based-rule, api-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A sports-scores service publishes an API through an Amazon API Gateway REST API. A handful
        of scrapers, each from its own address, send thousands of requests a minute and slow the API
        for everyone. The company wants to cap how many requests any one address can send. What
        should it use?
    choices:
      - id: sg-connection-limit
        text: A security group rule that limits how many connections each address may open
        variants:
          - text: A security group rule capping the connections allowed from each address
          - text: A security group setting that restricts each address to a few connections
        explanation:
          text: Security groups allow or refuse traffic by address, port and protocol. They have no rule that counts requests per address.
      - id: guardduty-plans
        text: Amazon GuardDuty, with its optional protection plans turned on for the API
        variants:
          - text: GuardDuty, with extra protection plans enabled to cover the API
          - text: Amazon GuardDuty and its added protection plans, switched on for the API
        explanation:
          text: GuardDuty reports suspicious activity it finds in logs. It doesn't block or limit any request.
      - id: waf-rate-rule
        text: An AWS WAF rate-based rule in a web ACL on the API
        variants:
          - text: A rate-based rule in an AWS WAF web ACL attached to the API
          - text: A WAF web ACL on the API, with a rate-based rule
        explanation:
          text: Correct. A rate-based rule limits how many requests one client address may send in a time window, and WAF attaches to API Gateway REST APIs.
      - id: config-rule-busy
        text: An AWS Config rule that marks the busiest client addresses as noncompliant
        variants:
          - text: An AWS Config rule that flags the busiest callers as noncompliant
          - text: A Config rule that reports the heaviest client addresses as noncompliant
        explanation:
          text: AWS Config judges resource settings against rules. It doesn't see requests from clients, and it blocks nothing.
    correct_answers: [waf-rate-rule]
    hint:
      text: You need something that reads web requests and counts them per client address.
    explanation:
      text: |
        A rate-based rule in AWS WAF counts the requests each client address sends in a time window
        and acts on the ones over the limit. It is the usual answer to a small flood of web requests.
        WAF can be attached to an API Gateway REST API, so the limit applies before requests reach
        the backend.

  - id: q09-university-new-accounts-web-acl
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Firewall Manager applies the same protections in every account"
    task: "2.4"
    level: application
    topics: [firewall-manager, waf, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university runs 60 AWS accounts in AWS Organizations, and departments create new accounts
        every term. The central security team wants every public load balancer, in every account
        including future ones, to get the approved web ACL automatically, with a report of any that
        don't comply. What should it use?
    choices:
      - id: firewall-manager
        text: AWS Firewall Manager
        variants:
          - text: Firewall Manager
          - text: The AWS Firewall Manager service
        explanation:
          text: Correct. A Firewall Manager WAF policy applies the web ACL to matching resources in every account, including accounts and resources created later, and reports what doesn't comply.
      - id: one-web-acl-mgmt
        text: One AWS WAF web ACL, created in the management account
        variants:
          - text: A single WAF web ACL made in the management account
          - text: An AWS WAF web ACL set up once in the management account
        explanation:
          text: A web ACL is attached to resources one account at a time. Creating it in the management account doesn't attach it to other accounts' load balancers.
      - id: shield-standard-org
        text: AWS Shield Standard
        variants:
          - text: Shield Standard
          - text: The AWS Shield Standard tier
        explanation:
          text: Shield Standard is automatic DDoS protection. It doesn't apply web ACLs or report on them.
      - id: guardduty-org
        text: Amazon GuardDuty
        variants:
          - text: GuardDuty
          - text: The Amazon GuardDuty service
        explanation:
          text: GuardDuty reports threats in activity logs. It doesn't attach firewall rules to anything.
    correct_answers: [firewall-manager]
    hint:
      text: The need is the same protection in many accounts, including ones that don't exist yet.
    explanation:
      text: |
        AWS Firewall Manager writes no rules of its own: it takes a policy, such as "every load
        balancer gets this web ACL", and applies it across every account in the organization,
        including new ones, then reports what doesn't comply. AWS WAF on its own works one account
        at a time.

  - id: q09-firewall-manager-prerequisites-two
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Firewall Manager applies the same protections in every account"
    task: "2.4"
    level: recall
    topics: [firewall-manager, organizations, config]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A shipping group wants to start using AWS Firewall Manager to apply its security group and
        AWS WAF policies across its accounts. Which TWO must be in place first? (Select TWO.)
    choices:
      - id: shield-advanced-everywhere
        text: A Shield Advanced subscription in every account
        variants:
          - text: AWS Shield Advanced subscribed in each account
          - text: Every account subscribed to Shield Advanced
        explanation:
          text: Shield Advanced is one kind of policy Firewall Manager can manage, not something it needs before it can work.
      - id: guardduty-everywhere
        text: Amazon GuardDuty turned on in every Region
        variants:
          - text: GuardDuty enabled in each Region
          - text: Amazon GuardDuty switched on in all Regions
        explanation:
          text: GuardDuty detects threats; Firewall Manager doesn't depend on it.
      - id: in-organizations
        text: All the accounts belong to one AWS Organizations organization
        variants:
          - text: All the accounts are members of one AWS Organizations organization
          - text: The accounts are grouped in AWS Organizations
        explanation:
          text: Correct. Firewall Manager applies policies across the accounts of an organization, and one account becomes its administrator.
      - id: enterprise-support
        text: An Enterprise Support plan on the management account
        variants:
          - text: The management account on an Enterprise Support plan
          - text: Enterprise Support for the management account
        explanation:
          text: No Support plan is a prerequisite for Firewall Manager.
      - id: config-on
        text: AWS Config is turned on in the accounts
        variants:
          - text: AWS Config is enabled in the accounts
          - text: The accounts have AWS Config switched on
        explanation:
          text: Correct. Firewall Manager needs AWS Config to find resources and check their compliance with its policies.
    correct_answers: [in-organizations, config-on]
    explanation:
      text: |
        Firewall Manager works across an organization, so the accounts must be in AWS Organizations,
        with one account named the Firewall Manager administrator, and AWS Config must be on. That
        is why it suits companies with many accounts, and why a single-account business doesn't
        need it yet.

  - id: q09-learning-platform-flood-and-injection
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Choose the protection by the attack, then check the cost"
    task: "2.4"
    level: application
    topics: [waf, rate-based-rule, sql-injection]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online learning platform sees two problems in its logs. A few hundred addresses each send
        far more requests to its search page than any real student would, and some search queries
        contain database commands. Which one service, placed in front of the site, addresses both?
    choices:
      - id: shield-standard-both
        text: AWS Shield Standard
        variants:
          - text: Shield Standard
          - text: The AWS Shield Standard tier
        explanation:
          text: Shield Standard absorbs network and transport layer floods. It doesn't read web requests, so it misses both the request flood and the injected commands.
      - id: waf-both
        text: AWS WAF
        variants:
          - text: WAF
          - text: The AWS WAF service
        explanation:
          text: Correct. A rate-based rule limits each address, and a managed rule group for SQL injection blocks the database commands.
      - id: security-groups-both
        text: The web servers' security groups
        variants:
          - text: Security groups on the web servers
          - text: The security groups around the web servers
        explanation:
          text: The requests arrive on port 443 from addresses the site must allow for real students, so the security groups let them all through.
      - id: detective-both
        text: Amazon Detective
        variants:
          - text: Detective
          - text: The Amazon Detective service
        explanation:
          text: Detective investigates the root cause of a finding after the fact. It blocks nothing.
    correct_answers: [waf-both]
    hint:
      text: Both problems are web requests. Which layer reads them?
    explanation:
      text: |
        Floods of web requests and SQL injection are both problems in the content and number of web
        requests, the layer only AWS WAF reads. One web ACL can hold a rate-based rule for the
        heavy addresses and a managed rule group for SQL injection. Shield Advanced could add
        automatic mitigation for larger floods, but WAF is the first choice for both.

  - id: q09-sftp-server-probe-range-block
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Choose the protection by the attack, then check the cost"
    task: "2.4"
    level: application
    topics: [network-acl, security-groups, waf]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics firm runs an SFTP server on EC2 in a public subnet, for partners to upload files.
        One address range keeps trying to sign in to it, and the firm wants to block that whole range
        from reaching the subnet, while partners keep their access. What should it change?
    choices:
      - id: sg-deny
        text: Add a deny rule for the range to the server's security group
        variants:
          - text: Put a deny rule for the range in the server's security group
          - text: Give the server's security group a rule that denies the range
        explanation:
          text: Security groups have only allow rules. You can't write a deny rule in one.
      - id: waf-ip-set
        text: Add the range to an IP set rule in an AWS WAF web ACL
        variants:
          - text: Block the range with an IP set rule in a WAF web ACL
          - text: Put the range in an AWS WAF IP set and block it in a web ACL
        explanation:
          text: WAF reads web requests on resources such as CloudFront and load balancers. SFTP isn't web traffic, and WAF can't be attached to an EC2 instance.
      - id: guardduty-on
        text: Turn on Amazon GuardDuty in the server's Region
        variants:
          - text: Enable GuardDuty in the Region where the server runs
          - text: Switch on Amazon GuardDuty for the server's Region
        explanation:
          text: GuardDuty would report the guessing attempts, but it doesn't block them.
      - id: nacl-deny
        text: Add a deny rule for the range to the subnet's network ACL
        variants:
          - text: Put a deny rule for the range in the subnet's network ACL
          - text: Give the subnet's network ACL a rule that denies the range
        explanation:
          text: Correct. A network ACL can deny an address range for the whole subnet, numbered before the rule that allows traffic in.
    correct_answers: [nacl-deny]
    hint:
      text: Which filter can say "no" to one range for a whole subnet, for traffic that isn't web requests?
    explanation:
      text: |
        For one bad address range, the choice depends on the traffic. Web traffic can be blocked
        with an AWS WAF IP set rule; any traffic to a subnet can be blocked with a network ACL deny
        rule. Security groups can't deny, and GuardDuty only reports.

  - id: q09-fintech-pentest-own-listed-resources
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Testing your own front door: AWS's penetration-testing policy"
    task: "2.4"
    level: understanding
    topics: [penetration-testing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A payments startup hires a security firm to test its own EC2 instances, its Amazon RDS
        database and its Amazon API Gateway API for weaknesses such as SQL injection and weak
        passwords. Nothing in the plan floods traffic. What does AWS's penetration-testing policy
        require before the work starts?
    choices:
      - id: simulated-events-form
        text: A Simulated Events form, sent to AWS at least two weeks ahead
        variants:
          - text: An AWS Simulated Events request, filed two weeks before testing
          - text: Approval through AWS's Simulated Events form, two weeks in advance
        explanation:
          text: That form is for command-and-control tests, red-team exercises, simulated phishing and similar simulated events, not ordinary testing of your own resources.
      - id: shield-advanced-first
        text: A Shield Advanced subscription on every resource to be tested
        variants:
          - text: AWS Shield Advanced covering each resource in the test
          - text: Every tested resource protected by a Shield Advanced subscription
        explanation:
          text: Shield Advanced comes into testing only for DDoS simulations run by an approved partner. This plan has no DDoS test.
      - id: no-approval
        text: No approval, because it tests its own resources in listed services
        variants:
          - text: Nothing from AWS, since these are its own resources in listed services
          - text: No request to AWS, as it tests its own resources in services on the list
        explanation:
          text: Correct. EC2, RDS and API Gateway are among the listed services, and testing your own resources in them needs no approval.
      - id: support-approval-per-ip
        text: Written approval from AWS Support for each tester's address
        variants:
          - text: AWS Support's written consent for every tester's IP address
          - text: A sign-off from AWS Support for each address the testers use
        explanation:
          text: Under the current policy, testing your own resources in the listed services needs no approval at all.
    correct_answers: [no-approval]
    explanation:
      text: |
        Under AWS's current penetration-testing policy, customers may test their own resources in
        the listed services, which include EC2, RDS, Aurora, CloudFront, API Gateway and Lambda,
        without asking first. What still needs approval, or is forbidden, is anything that could
        harm AWS or other customers, such as simulated events or flooding.

  - id: q09-streaming-tester-forbidden-test
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Testing your own front door: AWS's penetration-testing policy"
    task: "2.4"
    level: understanding
    topics: [penetration-testing, ddos]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A video-streaming company's tester proposes four tests, all against the company's own
        resources. Which one does AWS's penetration-testing policy forbid?
    choices:
      - id: flood-login-api
        text: Sending floods of requests to the sign-in API to find where it breaks
        variants:
          - text: Flooding the sign-in API with requests to see when it fails
          - text: Hitting the sign-in API with request floods until it breaks
        explanation:
          text: Correct. Request flooding, including login and API request flooding, is prohibited under the policy. A real DDoS test needs an AWS-approved partner and Shield Advanced.
      - id: sqli-cloudfront-site
        text: Trying SQL injection against its own site, which is served through CloudFront
        variants:
          - text: Attempting SQL injection on its own site that CloudFront delivers
          - text: Testing its own CloudFront-served site for SQL injection flaws
        explanation:
          text: CloudFront is a listed service, and an injection test sends single requests, not a flood. No approval is needed.
      - id: scan-own-ec2
        text: Scanning its own EC2 instances for ports that were left open by mistake
        variants:
          - text: Checking its own EC2 instances for ports opened by mistake
          - text: Looking for ports left open by accident on its own EC2 instances
        explanation:
          text: Testing your own EC2 instances is allowed without approval.
      - id: fuzz-own-lambda
        text: Sending unexpected input to its own Lambda functions to see how they cope
        variants:
          - text: Feeding odd input to its own Lambda functions to check their handling
          - text: Testing its own Lambda functions with unexpected input
        explanation:
          text: Lambda is a listed service, and testing your own functions needs no approval.
    correct_answers: [flood-login-api]
    explanation:
      text: |
        AWS's policy lets you test your own resources in the listed services without approval, but
        it never allows denial-of-service or flooding tests under this policy, even against your own
        resources, because a flood can harm AWS and other customers. A genuine DDoS test is possible
        only under the separate DDoS simulation testing policy.

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.05, Compliance and governance
  # ---------------------------------------------------------------------------------------------

  - id: q09-partner-wants-aws-datacenter-audit
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Artifact hands you AWS's audit reports, not a verdict on you"
    task: "2.2"
    level: application
    topics: [artifact, shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A freight-tracking startup runs entirely on AWS. A shipping partner's security team asks it
        for an independent auditor's report on the controls AWS operates in its data centers,
        covering a recent period. What should the startup send?
    choices:
      - id: aws-soc-report
        text: AWS's SOC 2 report, downloaded from AWS Artifact
        variants:
          - text: A SOC 2 report about AWS, taken from AWS Artifact
          - text: The SOC 2 report on AWS that Artifact provides
        explanation:
          text: Correct. Artifact provides AWS's own audit reports, written by independent auditors about the controls AWS runs.
      - id: conformance-pack-results
        text: Results of an AWS Config conformance pack run on its own resources
        variants:
          - text: A conformance pack's results from AWS Config in its own account
          - text: The output of AWS Config conformance pack checks on its resources
        explanation:
          text: Conformance packs check the startup's own resource settings. That is evidence for the startup's side of the line, not for AWS's data centers.
      - id: security-hub-score
        text: Its AWS Security Hub score against the CIS benchmark
        variants:
          - text: The CIS benchmark score Security Hub shows for its account
          - text: Its account's security score from AWS Security Hub for CIS
        explanation:
          text: A Security Hub score measures the startup's settings against a standard. It says nothing about the physical controls AWS runs.
      - id: services-in-scope-page
        text: A copy of AWS's Services in Scope by Compliance Program page
        variants:
          - text: The Services in Scope page that lists what each program covers
          - text: AWS's web page of services in scope for each compliance program
        explanation:
          text: That page lists which services a program's assessment included. It isn't an auditor's report on how AWS's controls worked.
    correct_answers: [aws-soc-report]
    hint:
      text: The partner is asking about AWS's half of the controls, not the startup's.
    explanation:
      text: |
        A question about controls AWS runs, such as data center security, is answered with AWS's
        evidence: the independent audit reports in AWS Artifact, free in the console. Some reports
        are confidential, so you accept Artifact's terms before downloading them. Evidence about the
        startup's own settings would come from its own records instead.

  - id: q09-telehealth-accepts-baa
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Artifact hands you AWS's audit reports, not a verdict on you"
    task: "2.2"
    level: understanding
    topics: [artifact, compliance-programs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A US telehealth company is about to store protected health information on AWS. Its lawyer
        says a Business Associate Addendum (BAA) with AWS must be in place first. Where does the
        company review and accept that agreement?
    choices:
      - id: identity-center-permission-sets
        text: In IAM Identity Center, among its permission sets
        variants:
          - text: Through the permission set settings of IAM Identity Center
          - text: In the permission sets that IAM Identity Center manages
        explanation:
          text: Identity Center gives people one sign-in and access to accounts. It holds no legal agreements with AWS.
      - id: trust-center-page
        text: On the AWS Trust Center web pages
        variants:
          - text: On AWS's public Trust Center site
          - text: Through the AWS Trust Center pages
        explanation:
          text: The Trust Center brings AWS's security, compliance and privacy commitments together for reading. You don't accept agreements there.
      - id: artifact-agreements
        text: In AWS Artifact, under agreements
        variants:
          - text: Through AWS Artifact's agreements
          - text: In the agreements part of AWS Artifact
        explanation:
          text: Correct. Artifact agreements let you review, accept, track and end agreements such as the BAA, for one account or a whole organization.
      - id: organizations-root-policy
        text: In AWS Organizations, as a policy on the organization root
        variants:
          - text: As a policy attached to the root in AWS Organizations
          - text: Through an Organizations policy on the organization's root
        explanation:
          text: Organizations policies, such as SCPs, set rules for accounts. They aren't contracts with AWS.
    correct_answers: [artifact-agreements]
    explanation:
      text: |
        AWS Artifact has two parts: reports, which are AWS's audit documents, and agreements, which
        are contracts with AWS that you review, accept, track and end. The BAA is the usual example
        for US healthcare businesses that handle protected health information. Accepting it, and
        then keeping to its terms, is the company's job.

  - id: q09-retailer-pci-report-two
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "\"Artifact checks your compliance\" is wrong"
    task: "2.2"
    level: understanding
    topics: [artifact, shared-responsibility]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A sports retailer's IT manager downloads AWS's PCI DSS report from AWS Artifact and tells
        the board, "We're covered for card payments now." Which TWO statements correct her?
        (Select TWO.)
    choices:
      - id: covers-aws-controls
        text: The report covers controls that AWS runs, not the retailer's
        variants:
          - text: The report is about AWS's controls, not about the retailer's
          - text: The report describes what AWS does, not what the retailer does
        explanation:
          text: Correct. The report is AWS's evidence for AWS's half, such as its data centers and the infrastructure of its services.
      - id: report-certifies-retailer
        text: The report certifies the retailer's own card-payment setup
        variants:
          - text: The report shows the retailer's card environment meets PCI DSS
          - text: The report proves the retailer's own payment setup is compliant
        explanation:
          text: Every Artifact report is about AWS. It can't show anything about how the retailer set up its own services.
      - id: artifact-scanned-account
        text: Artifact scanned the retailer's account before issuing the report
        variants:
          - text: Artifact checked the retailer's resources to produce the report
          - text: The report came from Artifact scanning the retailer's account
        explanation:
          text: Artifact scans nothing. It hands out documents that AWS's auditors wrote about AWS.
      - id: own-evidence-still-needed
        text: The retailer still needs its own evidence for its own settings
        variants:
          - text: The retailer must still prove its own configuration with its records
          - text: Its own records must still show how the retailer set things up
        explanation:
          text: Correct. Its settings, access and staff are its side of the line, proved with its own records such as CloudTrail activity and AWS Config history.
      - id: download-moves-duties
        text: Downloading the report moved card-data duties to AWS
        variants:
          - text: Once downloaded, the report shifts card-data duties onto AWS
          - text: The download transferred responsibility for card data to AWS
        explanation:
          text: No document moves the shared responsibility line. The retailer's data, access and settings stay its responsibility.
    correct_answers: [covers-aws-controls, own-evidence-still-needed]
    explanation:
      text: |
        AWS Artifact gives you AWS's audit reports, which cover the controls AWS operates. A PCI DSS
        report on AWS says nothing about whether the retailer's own setup meets the standard; that
        needs the retailer's own controls, records and assessment. An auditor checks both halves.

  - id: q09-programs-differ-by-country-and-sector
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS lists its compliance programs, and which services each one covers"
    task: "2.2"
    level: recall
    topics: [compliance-programs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software firm based in Germany is opening an office in Australia and will start taking
        card payments. Its compliance officer says each part of the business must check its own
        compliance programs. Why?
    choices:
      - id: one-global-certificate
        text: AWS holds one global certificate that replaces every local program
        variants:
          - text: A single worldwide AWS certificate takes the place of local programs
          - text: AWS's one global certification stands in for each local program
        explanation:
          text: There's no single certificate. AWS lists many programs, from SOC and ISO to country programs such as C5 and IRAP.
      - id: vary-by-country-and-industry
        text: Programs vary by country and industry, as C5, IRAP and PCI DSS show
        variants:
          - text: Requirements depend on location and sector, as with C5, IRAP and PCI DSS
          - text: Countries and industries bring their own programs, like C5, IRAP and PCI DSS
        explanation:
          text: Correct. C5 is a German program, IRAP an Australian one, and PCI DSS applies to card payments.
      - id: set-by-support-plan
        text: Which programs apply depends on the AWS Support plan each office buys
        variants:
          - text: Each office's AWS Support plan decides which compliance programs apply
          - text: The Support plan each office chooses sets which programs it must follow
        explanation:
          text: Support plans buy help from AWS. They don't decide which laws and standards apply to a business.
      - id: region-makes-compliant
        text: Running in a country's AWS Region makes the firm meet that country's laws
        variants:
          - text: Placing workloads in a local Region gives compliance with local law
          - text: Using an in-country Region makes the firm compliant with its laws
        explanation:
          text: A Region can keep data in a country, but compliance still depends on the firm's own controls and evidence.
    correct_answers: [vary-by-country-and-industry]
    explanation:
      text: |
        Compliance needs differ by geography and by industry. AWS's Compliance Programs page shows
        country programs such as C5 (Germany) and IRAP (Australia) beside industry ones such as PCI
        DSS for card payments. The firm works out which apply from its industry, its countries and
        its contracts, and it remains responsible for complying with the laws that apply to it.

  - id: q09-insurer-unlisted-service-no-phi
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "\"Not in Services in Scope means you can't use it\" is wrong"
    task: "2.2"
    level: understanding
    topics: [services-in-scope, compliance-programs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A health insurer has accepted the BAA with AWS. Its marketing team wants to use an AWS
        service that isn't listed under HIPAA on AWS's Services in Scope page, to analyze anonymous
        website visits that contain no patient data. Which statement is true?
    choices:
      - id: aws-blocks-unlisted
        text: AWS blocks every unlisted service in accounts that have accepted a BAA
        variants:
          - text: Accounts with a BAA can't turn on any service missing from the list
          - text: Once a BAA is accepted, AWS disables the services that aren't listed
        explanation:
          text: AWS doesn't block anything. The list records what an assessment covered, not what you may use.
      - id: wait-for-listing
        text: The insurer has to wait until AWS adds the service to the list
        variants:
          - text: The team can't use the service until AWS lists it for HIPAA
          - text: Use must wait for AWS to add the service under HIPAA
        explanation:
          text: A service that isn't listed isn't forbidden, and work that never touches regulated data doesn't depend on the list at all.
      - id: enterprise-support-unlocks
        text: An Enterprise Support plan would bring the service into HIPAA scope
        variants:
          - text: Buying Enterprise Support would add the service to HIPAA's scope
          - text: The service comes into HIPAA scope with an Enterprise Support plan
        explanation:
          text: A Support plan has no effect on which services an audit program covered.
      - id: may-use-outside-regulated
        text: It may use the service, which won't handle the regulated data
        variants:
          - text: It can use it, because the service stays away from regulated data
          - text: Use is fine here, as the service never touches the regulated data
        explanation:
          text: Correct. The insurer decides what data the service handles; with no patient data, the service sits outside the regulated part of its setup.
    correct_answers: [may-use-outside-regulated]
    explanation:
      text: |
        A service missing from Services in Scope isn't forbidden. As part of its shared
        responsibility, the customer decides what data the service will handle and whether that
        brings it into the regulated environment. If an unlisted service would store or process the
        regulated data, the insurer should check with its auditor or AWS before relying on it.

  - id: q09-school-district-remaining-duty-two
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "Your remaining duty: what no AWS document does for you"
    task: "2.2"
    level: understanding
    topics: [shared-responsibility, compliance-programs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A school district keeps student records only in AWS services listed in scope for the privacy
        program it must follow, and it has downloaded AWS's audit reports. Which TWO jobs are still
        the district's? (Select TWO.)
    choices:
      - id: audit-aws-datacenters
        text: Auditing the physical security of AWS's data centers
        variants:
          - text: Checking the physical security of the data centers AWS runs
          - text: Inspecting the buildings of AWS's data centers for security
        explanation:
          text: That's AWS's control, covered by AWS's own audit reports. Customers don't audit AWS's buildings.
      - id: patch-virtualization
        text: Patching the virtualization layer under its servers
        variants:
          - text: Applying patches to the hypervisors its servers run on
          - text: Keeping the host virtualization software patched
        explanation:
          text: AWS runs the hardware and virtualization. That's security of the cloud.
      - id: configure-own-resources
        text: Setting up encryption, access and logging on its own resources
        variants:
          - text: Configuring its own resources' encryption, access and logging
          - text: Turning on encryption, access limits and logging for its resources
        explanation:
          text: Correct. A service in scope that is set up wrongly is still a failure, and the setup is the district's.
      - id: renew-aws-certificates
        text: Renewing AWS's certifications when they expire
        variants:
          - text: Getting AWS's certificates renewed when they lapse
          - text: Keeping AWS's audit certifications up to date
        explanation:
          text: AWS keeps its own programs current. A customer can't renew AWS's certifications.
      - id: produce-own-evidence
        text: Producing its own evidence, such as activity and training records
        variants:
          - text: Keeping its own records, such as account activity and staff training
          - text: Collecting its own proof, like activity logs and training records
        explanation:
          text: Correct. CloudTrail activity, AWS Config history, written policies and training records are the district's to produce.
    correct_answers: [configure-own-resources, produce-own-evidence]
    explanation:
      text: |
        AWS's reports cover AWS's half. The customer's list remains: know which rules apply, classify
        its data, configure services correctly, accept and keep the agreements it needs, produce its
        own evidence, and keep doing it for every audit. "In scope" means AWS's side of a service was
        assessed, not that the district's use of it is compliant.

  - id: q09-fintech-continuous-framework-checks
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "\"Audit Manager is the compliance answer\" is wrong"
    task: "2.2"
    level: understanding
    topics: [audit-manager, config]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A fintech opened its AWS account in 2026. An older study guide tells its team to use AWS
        Audit Manager to check resource settings continuously against a PCI DSS template. What does
        AWS now point new customers to for this kind of technical check?
    choices:
      - id: config-conformance-packs
        text: AWS Config conformance packs
        variants:
          - text: Conformance packs in AWS Config
          - text: AWS Config's conformance packs
        explanation:
          text: Correct. AWS points new customers to conformance packs, which deploy many Config rules as one unit and have templates for frameworks such as PCI DSS.
      - id: audit-manager-assessments
        text: AWS Audit Manager assessments
        variants:
          - text: Assessments in AWS Audit Manager
          - text: Audit Manager's framework assessments
        explanation:
          text: Audit Manager can't be set up in new accounts since 2026-04-30; it's in maintenance mode.
      - id: artifact-reports
        text: AWS Artifact compliance reports
        variants:
          - text: Compliance reports from AWS Artifact
          - text: Artifact's downloadable compliance reports
        explanation:
          text: Artifact's reports describe AWS's controls. They don't check the fintech's resources.
      - id: trusted-advisor-checks
        text: AWS Trusted Advisor best-practice checks
        variants:
          - text: Best-practice checks in AWS Trusted Advisor
          - text: Trusted Advisor's best-practice checks
        explanation:
          text: Trusted Advisor compares the account with AWS's own best practices, not with a PCI DSS template.
    correct_answers: [config-conformance-packs]
    explanation:
      text: |
        AWS Audit Manager has been closed to new accounts since 2026-04-30 (as of 2026-10-24), and
        AWS points customers to AWS Config conformance packs instead. AWS also notes that a pack
        holds only the technical checks a rule can evaluate; no rule checks that you wrote your
        security policies. No single service makes a company compliant.

  - id: q09-ou-policy-reaches-nested-ou
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Organizations groups accounts so you can govern them together"
    task: "2.3"
    level: recall
    topics: [organizations, scp]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A media company's organization has an OU called Production. It holds two accounts and a
        nested OU called Streaming, which holds three more accounts. A policy is attached to
        Production. Which accounts does it apply to?
    choices:
      - id: direct-accounts-only
        text: Only the two accounts placed directly in Production
        variants:
          - text: Just the two accounts that sit directly in Production
          - text: The two accounts directly in Production, and no others
        explanation:
          text: Policies flow down the tree, so accounts in nested OUs get them too.
      - id: management-account-only
        text: Only the organization's management account, which pays the bill
        variants:
          - text: The management account alone, as the account that pays
          - text: Just the management account that pays for the organization
        explanation:
          text: A policy attached to an OU applies to the accounts below that OU. The management account isn't in Production at all.
      - id: all-five-accounts
        text: All five accounts, including those in the nested Streaming OU
        variants:
          - text: Every one of the five, the Streaming OU's accounts included
          - text: The five accounts in Production and in Streaming below it
        explanation:
          text: Correct. A policy on an OU reaches every account below it, at any depth.
      - id: accounts-added-later
        text: Only accounts that are moved into Production after it was attached
        variants:
          - text: Just the accounts that join Production after the attachment
          - text: Only those accounts moved into Production at a later date
        explanation:
          text: A policy applies to the accounts already below it as well as to ones added later.
    correct_answers: [all-five-accounts]
    explanation:
      text: |
        Organizational units group accounts and can be nested. A policy attached to the organization
        root or to an OU applies to every account below it, including accounts in nested OUs. That's
        how one service control policy can set a rule for a whole branch of an organization.

  - id: q09-member-root-stops-config-recorder
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "An SCP is a ceiling: it limits everyone in a member account, and grants nothing"
    task: "2.3"
    level: application
    topics: [scp, root-user]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A pharmacy chain attaches a service control policy (SCP) to the OU holding all its member
        accounts. The SCP denies stopping the AWS Config configuration recorder. In one member
        account, someone signs in as that account's root user and tries to stop the recorder. What
        happens?
    choices:
      - id: allowed-root-bypasses
        text: It works, because the root user is outside every policy
        variants:
          - text: It succeeds, since no policy can restrict a root user
          - text: The recorder stops, because root ignores all policies
        explanation:
          text: In a member account, SCPs limit the root user too. Only the management account is outside SCPs.
      - id: denied-scp-caps-root
        text: It's denied, because SCPs apply to every member account's root user
        variants:
          - text: AWS refuses it, since the SCP caps that account's root user too
          - text: The request fails, as SCPs restrict root in member accounts
        explanation:
          text: Correct. The SCP sets the ceiling for every user and role in the account, root included.
      - id: allowed-root-needs-no-iam
        text: It works, because the root user needs no IAM policy
        variants:
          - text: It succeeds, since root doesn't depend on IAM policies
          - text: The recorder stops, as root needs no IAM permissions
        explanation:
          text: It's true that root needs no IAM policy, but the SCP still sets a ceiling above it.
      - id: denied-only-without-mfa
        text: It's denied only if the root user signed in without MFA
        variants:
          - text: It fails only when root has signed in without MFA
          - text: AWS refuses it only for a root sign-in that skipped MFA
        explanation:
          text: MFA protects the sign-in. It doesn't change what an SCP allows.
    correct_answers: [denied-scp-caps-root]
    hint:
      text: Ask whose permissions an SCP caps in a member account, and whether anyone there is exempt.
    explanation:
      text: |
        An SCP sets the maximum permissions for every user and role in a member account, including
        the account's root user, which no IAM policy inside the account can limit. That's why
        organizations use SCPs to protect evidence such as Config recording and CloudTrail trails.
        The one account SCPs don't reach is the management account.

  - id: q09-management-account-ignores-region-scp
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "An SCP is a ceiling: it limits everyone in a member account, and grants nothing"
    task: "2.3"
    level: application
    topics: [scp, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An airline attaches an SCP to its organization root that denies every action outside two
        European Regions, apart from global services. An administrator in the organization's
        management account then launches an EC2 instance in US East (N. Virginia). What happens?
    choices:
      - id: denied-root-reaches-all
        text: It's denied, because an SCP on the root applies to every account
        variants:
          - text: AWS refuses it, since an SCP on the root reaches all accounts
          - text: It fails, as the root's SCP covers every account in the organization
        explanation:
          text: A root SCP covers every member account, but SCPs never affect the management account.
      - id: denied-scp-beats-iam
        text: It's denied, because the SCP overrides the administrator's policy
        variants:
          - text: It fails, since the SCP wins over the administrator's IAM policy
          - text: AWS refuses it, as the SCP outranks the admin's IAM policy
        explanation:
          text: An SCP would win in a member account, but here it doesn't apply at all.
      - id: allowed-if-full-access
        text: It works only if FullAWSAccess is attached to that account
        variants:
          - text: It succeeds only when the account also has FullAWSAccess
          - text: It's allowed only if FullAWSAccess is attached there
        explanation:
          text: No SCP, FullAWSAccess included, affects the management account.
      - id: allowed-management-exempt
        text: It works, because SCPs never apply to the management account
        variants:
          - text: It succeeds, since the management account is outside SCPs
          - text: The launch goes ahead, as SCPs skip the management account
        explanation:
          text: Correct. The management account has no SCP ceiling at all.
    correct_answers: [allowed-management-exempt]
    hint:
      text: One account in every organization sits outside all SCPs.
    explanation:
      text: |
        SCPs set ceilings for member accounts but never for the management account. That's one reason
        to keep workloads and everyday users out of it: no SCP protects what runs there. The Region
        rule still holds in every member account under the root.

  - id: q09-analytics-ou-allow-list-blocks-rds
    page: guide/09-protecting-and-governing/10-sim-organizations-and-scps.md
    section: "Part 1: predict"
    task: "2.3"
    level: application
    topics: [scp, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's Analytics OU no longer has FullAWSAccess. In its place is an SCP that allows
        only Amazon S3, Amazon Athena and AWS Glue actions. A researcher's account inside that OU
        still has FullAWSAccess attached to the account itself, and her IAM policy allows
        everything. She tries to create an Amazon RDS database. What happens?
    choices:
      - id: denied-ou-leaves-out-rds
        text: It's denied, because the OU above the account doesn't allow RDS
        variants:
          - text: AWS refuses it, since the Analytics OU's SCP leaves out RDS
          - text: It fails, because the OU's allow list doesn't include RDS
        explanation:
          text: Correct. Every level above the account must allow the action, and the Analytics OU doesn't.
      - id: allowed-account-policy-wins
        text: It works, because the account's own FullAWSAccess takes priority
        variants:
          - text: It succeeds, since the SCP on the account itself wins
          - text: The request goes ahead, as the account-level FullAWSAccess prevails
        explanation:
          text: There's no "closest policy wins" rule. A block at any level holds for everything below it.
      - id: allowed-iam-allows-all
        text: It works, because her IAM policy allows every action
        variants:
          - text: It succeeds, since her IAM policy grants all actions
          - text: The request goes ahead, as her IAM policy permits everything
        explanation:
          text: An IAM allow can't lift a request above an SCP.
      - id: denied-needs-resource-policy
        text: It's denied, because RDS also needs a resource-based policy
        variants:
          - text: It fails, since creating the database needs a resource policy too
          - text: AWS refuses it, as RDS requires a resource-based policy as well
        explanation:
          text: Her IAM policy is enough to grant the action; nothing else is required. The block comes from the OU's SCP.
    correct_answers: [denied-ou-leaves-out-rds]
    hint:
      text: An account gets only what every level above it allows.
    explanation:
      text: |
        An action must be allowed by the SCPs at every level: the organization root, each OU above
        the account, and the account itself. The Analytics OU's allow list leaves out RDS, so the
        account's own FullAWSAccess can't bring it back, and no IAM policy can lift a request above
        an SCP.

  - id: q09-clinics-ou-denied-after-tidy-up
    page: guide/09-protecting-and-governing/10-sim-organizations-and-scps.md
    section: "Part 2: diagnose"
    task: "2.3"
    level: application
    topics: [scp, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        On Monday morning, everyone in the three accounts under a hospital group's Clinics OU gets
        "access denied" for every action, while accounts in other OUs work normally. On Friday an
        engineer tidied up the Clinics OU's SCPs, leaving only one that denies Regions outside the
        United States. What is the most likely cause?
    choices:
      - id: identity-center-expired
        text: The OU's IAM Identity Center sessions all expired over the weekend
        variants:
          - text: Sign-in sessions from IAM Identity Center ran out for those accounts
          - text: IAM Identity Center sessions for the Clinics accounts timed out
        explanation:
          text: Expired sessions would ask people to sign in again, not deny every action to people who are signed in, and they have nothing to do with an SCP change.
      - id: deny-list-blocks-unnamed
        text: The Region SCP also blocks US Regions, since SCP denials apply in every Region
        variants:
          - text: The Region SCP denies US Regions too, because an SCP denial covers all Regions
          - text: Because SCP denials reach every Region, the Region SCP blocks the US as well
        explanation:
          text: An SCP denies only what it names, here the Regions outside the United States. The trouble is that nothing at that level allows anything, in any Region.
      - id: full-access-detached
        text: FullAWSAccess was detached, so every action fails at that OU
        variants:
          - text: The OU lost FullAWSAccess, leaving no allow at that level
          - text: Removing FullAWSAccess left that OU allowing no actions
        explanation:
          text: Correct. With only a deny list left, the OU allows nothing, and every account below it inherits the block.
      - id: config-locked-accounts
        text: AWS Config marked the accounts noncompliant and locked them
        variants:
          - text: Config found the accounts noncompliant and blocked them
          - text: The accounts were locked after AWS Config flagged them
        explanation:
          text: Config records and evaluates settings. It never locks accounts.
    correct_answers: [full-access-detached]
    hint:
      text: Every level must allow an action. What still allows anything at the Clinics OU?
    explanation:
      text: |
        AWS attaches FullAWSAccess, which allows every action, at every level by default, so other
        SCPs can simply list what to deny. Detaching it from an OU without a replacement leaves
        nothing allowed there, so every action in the accounts below fails. Reattach FullAWSAccess,
        and test SCP changes on a small OU before applying them to accounts that matter.

  - id: q09-scp-differs-from-iam-policy-two
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "SCP or IAM policy: a ceiling or a key"
    task: "2.3"
    level: understanding
    topics: [scp, iam-policies]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A logistics company's new cloud lead asks how a service control policy (SCP) differs from an
        IAM identity-based policy. Which TWO statements are correct? (Select TWO.)
    choices:
      - id: scp-one-user
        text: An SCP is attached to one IAM user at a time
        variants:
          - text: Each SCP applies to the single IAM user it's attached to
          - text: An SCP works on just the one IAM user it's attached to
        explanation:
          text: SCPs attach to the organization root, OUs or accounts, and apply to every user and role below.
      - id: scp-grants-nothing
        text: An SCP grants no permissions; it only sets the maximum
        variants:
          - text: An SCP sets an upper limit and grants nothing itself
          - text: An SCP only caps permissions and doesn't give any
        explanation:
          text: Correct. People still need identity-based or resource-based policies to be allowed anything.
      - id: iam-above-scp
        text: An IAM policy can grant actions beyond what the SCP allows
        variants:
          - text: IAM policies can raise a user above the SCP's limit
          - text: An IAM allow can take a user past the SCP's ceiling
        explanation:
          text: What someone can do is the overlap of the two; IAM can't lift anything above the SCP.
      - id: scp-limits-member-root
        text: An SCP can limit a member account's root user; IAM policies can't
        variants:
          - text: Unlike IAM policies, an SCP can restrict a member account's root user
          - text: A member account's root user can be capped by an SCP, not an IAM policy
        explanation:
          text: Correct. That's something no IAM policy inside the account can do.
      - id: scp-covers-management
        text: An SCP limits users in the management account as well
        variants:
          - text: SCPs also restrict the management account's users
          - text: Users in the management account are capped by SCPs too
        explanation:
          text: SCPs don't affect the management account; IAM policies work there as anywhere else.
    correct_answers: [scp-grants-nothing, scp-limits-member-root]
    explanation:
      text: |
        An SCP is a ceiling set in AWS Organizations: it applies to every user and role in the member
        accounts below it, root included, and grants nothing. An IAM policy is set inside one account,
        attached to one identity or resource, and is the one that grants. What someone can actually
        do is the overlap of the two.

  - id: q09-bank-branches-governed-accounts
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Control Tower sets up and watches a multi-account environment, on top of Organizations"
    task: "2.3"
    level: application
    topics: [control-tower, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A regional bank's small cloud team must give each of 30 branches its own AWS account. It
        wants shared accounts for logs and for the security team set up automatically, plain-language
        rules applied to whole groups of accounts, and new branch accounts that arrive already
        governed. It doesn't want to design the structure itself. Which service fits best?
    choices:
      - id: organizations-alone
        text: AWS Organizations, with OUs and SCPs it designs itself
        variants:
          - text: Organizations, with its own OUs and SCPs written by the team
          - text: AWS Organizations, using OUs and SCPs the team builds
        explanation:
          text: Organizations provides the parts, but the team would design the OUs, write the policies and set up logging itself, which it wants to avoid.
      - id: control-tower
        text: AWS Control Tower
        variants:
          - text: Control Tower
          - text: The AWS Control Tower service
        explanation:
          text: Correct. Control Tower builds a landing zone with shared log and security accounts, applies controls to OUs, and creates new accounts through Account Factory.
      - id: identity-center
        text: AWS IAM Identity Center
        variants:
          - text: IAM Identity Center
          - text: The IAM Identity Center service
        explanation:
          text: Identity Center gives people one sign-in across accounts. Control Tower uses it, but it doesn't create governed accounts or controls.
      - id: config-conformance-packs
        text: AWS Config conformance packs
        variants:
          - text: Conformance packs in AWS Config
          - text: Config's conformance packs
        explanation:
          text: Packs check resource settings against rules, but they don't build a multi-account environment or create accounts.
    correct_answers: [control-tower]
    hint:
      text: Look for the service that builds and watches the environment for you, on top of the one that only groups accounts.
    explanation:
      text: |
        AWS Control Tower brings together AWS Organizations, AWS Service Catalog and IAM Identity
        Center to set up a landing zone based on best practices, including shared accounts for logs
        and security, then governs it with controls applied per OU. Account Factory creates new
        accounts already governed. Organizations alone gives the building blocks, and you design the
        rest.

  - id: q09-control-tower-checks-before-create
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Control Tower sets up and watches a multi-account environment, on top of Organizations"
    task: "2.3"
    level: recall
    topics: [control-tower]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An AWS Control Tower control examines resources a team deploys with AWS CloudFormation before
        they are created, and stops any that break its rule. Which kind of control is it?
    choices:
      - id: preventive
        text: A preventive control
        variants:
          - text: The preventive kind
          - text: A control of the preventive kind
        explanation:
          text: Preventive controls stop actions using SCPs and RCPs. They don't inspect CloudFormation resources before creation.
      - id: detective
        text: A detective control
        variants:
          - text: The detective kind
          - text: A control of the detective kind
        explanation:
          text: Detective controls use AWS Config rules to find resources that already exist and break a rule.
      - id: corrective
        text: A corrective control
        variants:
          - text: The corrective kind
          - text: A control of the corrective kind
        explanation:
          text: Control Tower's three kinds are preventive, detective and proactive. "Corrective" isn't one of them.
      - id: proactive
        text: A proactive control
        variants:
          - text: The proactive kind
          - text: A control of the proactive kind
        explanation:
          text: Correct. Proactive controls use CloudFormation hooks to check resources before they're created.
    correct_answers: [proactive]
    explanation:
      text: |
        Control Tower has three kinds of control. Preventive controls stop actions, using SCPs and
        RCPs; detective controls find resources that break a rule, using AWS Config rules; proactive
        controls check resources deployed with CloudFormation before they're created, using
        CloudFormation hooks. AWS used to call controls guardrails.

  - id: q09-nonprofit-step-by-step-fix
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "Where AWS publishes security information"
    task: "2.4"
    level: recall
    topics: [security-information]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A nonprofit's part-time administrator keeps running into the same common error while
        setting up an AWS feature, and wants an AWS article that walks through the fix step by step.
        Where should she look?
    choices:
      - id: knowledge-center
        text: AWS Knowledge Center, on AWS re:Post
        variants:
          - text: The Knowledge Center on AWS re:Post
          - text: AWS re:Post's Knowledge Center
        explanation:
          text: Correct. Knowledge Center articles answer common questions and problems step by step.
      - id: security-bulletins
        text: AWS Security Bulletins, on AWS's website
        variants:
          - text: The AWS Security Bulletins web page
          - text: AWS's published Security Bulletins
        explanation:
          text: Bulletins announce vulnerabilities that affect AWS services. They aren't troubleshooting guides.
      - id: artifact
        text: AWS Artifact, in the AWS console
        variants:
          - text: The Artifact portal in the console
          - text: AWS Artifact's portal in the console
        explanation:
          text: Artifact holds AWS's audit reports and agreements, not how-to articles.
      - id: trust-center
        text: AWS Trust Center, on AWS's website
        variants:
          - text: The AWS Trust Center website
          - text: AWS's public Trust Center pages
        explanation:
          text: The Trust Center gathers AWS's security, compliance and privacy commitments. It isn't a troubleshooting library.
    correct_answers: [knowledge-center]
    explanation:
      text: |
        Each AWS source answers a different question. The Knowledge Center, on AWS re:Post, explains
        how to fix common problems step by step; Security Bulletins announce vulnerabilities in AWS
        services; Artifact holds AWS's audit reports; the Trust Center gathers AWS's commitments.

  - id: q09-hospital-library-flaw-statement
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "Where AWS publishes security information"
    task: "2.4"
    level: understanding
    topics: [security-information]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        News breaks of a serious flaw in a widely used open-source library. A hospital's security
        engineer needs AWS's own statement on whether AWS services are affected and whether
        customers must do anything. Where does AWS publish that?
    choices:
      - id: trust-center
        text: AWS Trust Center
        variants:
          - text: The AWS Trust Center
          - text: AWS's Trust Center pages
        explanation:
          text: The Trust Center gathers AWS's security, compliance and privacy commitments; it isn't where AWS announces individual vulnerabilities.
      - id: knowledge-center
        text: AWS Knowledge Center
        variants:
          - text: The AWS Knowledge Center
          - text: Knowledge Center on re:Post
        explanation:
          text: Knowledge Center articles explain how to fix common problems, not whether a new flaw affects AWS's services.
      - id: security-bulletins
        text: AWS Security Bulletins
        variants:
          - text: The AWS Security Bulletins
          - text: AWS's Security Bulletins
        explanation:
          text: Correct. Bulletins announce vulnerabilities that affect AWS services and say whether customers need to act.
      - id: security-hub-findings
        text: Security Hub findings in its account
        variants:
          - text: The findings in its AWS Security Hub
          - text: Its own account's Security Hub findings
        explanation:
          text: Security Hub findings are about the hospital's own resources and settings, not AWS's statements about its services.
    correct_answers: [security-bulletins]
    explanation:
      text: |
        AWS Security Bulletins announce vulnerabilities that affect AWS services, marked Important
        when customers need to act and Informational otherwise. The Knowledge Center explains how to
        fix common problems, the Trust Center gathers AWS's commitments, and the Security Blog shows
        how to set up features and what's new.

  - id: q09-grocery-chain-consolidated-billing
    page: guide/09-protecting-and-governing/10-sim-organizations-and-scps.md
    section: "Part 3: the bill"
    task: "4.2"
    level: understanding
    topics: [consolidated-billing, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A regional grocery chain runs four AWS accounts and is thinking of joining them in AWS
        Organizations "to save money, because usage is pooled". Which statement best describes what
        consolidated billing gives the chain?
    choices:
      - id: fee-per-member-account
        text: Pooled pricing in exchange for a monthly fee per member account
        variants:
          - text: Combined pricing, paid for with a monthly fee for each member account
          - text: Pooled rates, bought with a fee per member account each month
        explanation:
          text: Organizations and consolidated billing cost nothing extra.
      - id: one-bill-shared-discounts
        text: One bill, combined volume tiers and shared commitment discounts
        variants:
          - text: A single bill, pooled pricing tiers and shared commitment discounts
          - text: One bill for all accounts, combined tiers and shared commitment discounts
        explanation:
          text: Correct. AWS treats the accounts as one for pricing, and Reserved Instances or Savings Plans can cover usage in other accounts.
      - id: invoice-per-ou
        text: A separate invoice for each OU, with volume tiers counted per OU
        variants:
          - text: One invoice per OU, each counting its own volume tiers
          - text: Separate bills for each OU, with tiers worked out per OU
        explanation:
          text: The bill doesn't follow the OU tree. The management account receives one bill for every account.
      - id: free-up-to-tier
        text: Free usage in every account up to the combined tier limit
        variants:
          - text: No charge in any account until the combined tier is reached
          - text: Usage that is free in each account up to the pooled tier limit
        explanation:
          text: Combined usage reaches cheaper rates sooner; it never makes usage free.
    correct_answers: [one-bill-shared-discounts]
    explanation:
      text: |
        With consolidated billing, the management account receives one bill for every account and
        pays it, at no extra charge. AWS treats the accounts as one for pricing, so volume tiers
        count combined usage and commitment discounts can be shared. The volume saving is usually
        small; one bill and central guardrails such as SCPs are the bigger reasons for an
        organization.

  # ---------------------------------------------------------------------------------------------
  # Lesson 09.06, A defense map
  # ---------------------------------------------------------------------------------------------

  - id: q09-which-controls-detect
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Each layer stops different attacks"
    task: "2.2"
    level: understanding
    topics: [defense-in-depth, preventive-detective]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A travel agency is sorting the controls on its security map into those that stop something
        and those that notice something after it happens. Which TWO are detective controls?
        (Select TWO.)
    choices:
      - id: scp-deny-leave
        text: An SCP that denies leaving the organization
        variants:
          - text: A service control policy denying removal from the organization
          - text: An SCP blocking any account from leaving the organization
        explanation:
          text: An SCP stops the action from happening, so it is preventive, at the organization layer.
      - id: guardduty-finding
        text: A GuardDuty finding about a key used from an unusual place
        variants:
          - text: A GuardDuty finding on an access key used from an odd location
          - text: GuardDuty reporting an access key used from an unexpected place
        explanation:
          text: Correct. GuardDuty reports what it sees in logs; it doesn't block the request.
      - id: waf-rate-rule
        text: An AWS WAF rate-based rule on the booking site
        variants:
          - text: A rate-based rule in AWS WAF for the booking site
          - text: The booking site's AWS WAF rate-based rule
        explanation:
          text: A rate-based rule limits how many requests one address may send, so it prevents, at the edge.
      - id: block-public-access
        text: S3 Block Public Access on the itinerary bucket
        variants:
          - text: Block Public Access turned on for the itinerary bucket
          - text: The itinerary bucket's S3 Block Public Access settings
        explanation:
          text: Block Public Access stops a bucket from becoming public. It is preventive, at the data layer.
      - id: config-rule-unencrypted
        text: An AWS Config rule that flags unencrypted volumes
        variants:
          - text: An AWS Config rule marking unencrypted volumes noncompliant
          - text: A Config rule reporting volumes that aren't encrypted
        explanation:
          text: Correct. A Config rule evaluates resources after a change and reports the ones that break it.
    correct_answers: [guardduty-finding, config-rule-unencrypted]
    explanation:
      text: |
        A preventive control stops something from happening: an SCP, a WAF rule, Block Public Access.
        A detective control notices and records something after it happens: a GuardDuty finding, a
        Config rule result, a CloudTrail record. A layered plan needs both, because preventive
        controls can be misconfigured without anyone noticing.

  - id: q09-kms-database-layer-and-kind
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Each layer stops different attacks"
    task: "2.2"
    level: understanding
    topics: [defense-in-depth, preventive-detective]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A gym chain draws a defense map with six layers: edge, network, compute, data, identity and
        account, and organization. Where does "encryption with an AWS KMS key on the members
        database" belong, and what kind of control is it?
    choices:
      - id: network-preventive
        text: The network layer, as a preventive control
        variants:
          - text: Network layer, as a control that prevents
          - text: A preventive control in the network layer
        explanation:
          text: The network layer holds subnets, routes, network ACLs and security groups. Encryption protects the stored data itself.
      - id: data-detective
        text: The data layer, as a detective control
        variants:
          - text: Data layer, as a control that detects
          - text: A detective control in the data layer
        explanation:
          text: The layer is right, but encryption doesn't notice or report anything. Macie is the map's detective control for data.
      - id: data-preventive
        text: The data layer, as a preventive control
        variants:
          - text: Data layer, as a control that prevents
          - text: A preventive control in the data layer
        explanation:
          text: Correct. Encryption at rest protects stored data against being read by someone who gets the bytes without the key.
      - id: identity-detective
        text: The identity layer, as a detective control
        variants:
          - text: Identity layer, as a control that detects
          - text: A detective control in the identity layer
        explanation:
          text: The identity layer holds least privilege, MFA and root protection, with CloudTrail and GuardDuty detecting. Encryption is a data control.
    correct_answers: [data-preventive]
    explanation:
      text: |
        The data layer protects what is stored: encryption at rest and in transit, Block Public
        Access, versioning and backups prevent; Amazon Macie detects sensitive data and public
        buckets. Placing each control on a layer, and saying whether it prevents or detects, shows
        which threats are covered and which are not.

  - id: q09-leaked-key-prevent-and-reveal
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Cover every threat with at least two layers: one that stops it and one that finds it"
    task: "2.2"
    level: application
    topics: [defense-in-depth, identity, guardduty]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A game studio's developer once pasted a long-term access key into a public code repository,
        and someone used it to call AWS APIs directly. The studio wants one control that would have
        prevented this and one that would have revealed the misuse. Which pair fits?
    choices:
      - id: identity-plus-guardduty
        text: Roles and MFA instead of long-term keys; GuardDuty and CloudTrail
        variants:
          - text: MFA and roles rather than long-term keys; CloudTrail and GuardDuty
          - text: No long-term keys, with roles and MFA; GuardDuty plus CloudTrail
        explanation:
          text: Correct. The threat lives in the identity layer. Without long-term keys there is nothing to leak, and GuardDuty and CloudTrail reveal a key being misused.
      - id: sg-plus-flow-logs
        text: Tighter security groups on the game servers; VPC Flow Logs
        variants:
          - text: Stricter game-server security groups; VPC Flow Logs
          - text: Narrower security groups on the servers; VPC Flow Logs
        explanation:
          text: Calls to AWS's own APIs don't pass through the studio's VPC, so its network filters and flow logs never see them.
      - id: waf-plus-waf-logs
        text: An AWS WAF web ACL on CloudFront; the WAF logs
        variants:
          - text: A WAF web ACL in front of CloudFront; WAF logs
          - text: An AWS WAF web ACL for CloudFront; its WAF logs
        explanation:
          text: WAF inspects requests to the resources it is attached to, such as CloudFront, not calls to AWS's API endpoints.
      - id: shield-plus-metrics
        text: AWS Shield Advanced on the site; CloudWatch metrics
        variants:
          - text: Shield Advanced for the site; CloudWatch metrics
          - text: The site on AWS Shield Advanced; CloudWatch metrics
        explanation:
          text: Shield protects against DDoS floods, not the misuse of valid credentials.
    correct_answers: [identity-plus-guardduty]
    hint:
      text: Do the stolen key's calls ever pass through the studio's own network or website?
    explanation:
      text: |
        A stolen access key used through ordinary API calls passes every network filter, because the
        calls go to AWS's endpoints, not through the studio's VPC or website. The identity layer
        prevents it (MFA, roles, no long-term keys), GuardDuty and CloudTrail reveal it, and in a
        member account an SCP limits what the key can do.

  - id: q09-portal-plan-missing-detection
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Cover every threat with at least two layers: one that stops it and one that finds it"
    task: "2.2"
    level: application
    topics: [defense-in-depth, preventive-detective]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A clinic's plan for its patient portal lists: CloudFront in front, AWS WAF managed rules,
        private subnets for the database, tight security groups, KMS encryption, S3 Block Public
        Access, and MFA for every staff sign-in. What is the most important gap?
    choices:
      - id: no-shield-advanced
        text: No Shield Advanced subscription for the portal
        variants:
          - text: The portal has no Shield Advanced subscription
          - text: Shield Advanced isn't subscribed for the portal
        explanation:
          text: Shield Advanced strengthens one layer, the edge, against DDoS. A small portal with CloudFront, WAF and Shield Standard may not need it; it wouldn't fill the gap that matters here.
      - id: nothing-detects
        text: No control that detects or records anything
        variants:
          - text: Nothing in the plan detects or records events
          - text: The plan has no detecting or recording control
        explanation:
          text: Correct. Every item prevents. A rule opened by mistake or a leaked password would go unnoticed, and nothing would prove what happened afterwards.
      - id: no-cloudhsm
        text: No CloudHSM cluster for the encryption keys
        variants:
          - text: The keys aren't held in a CloudHSM cluster
          - text: CloudHSM isn't used for the encryption keys
        explanation:
          text: Nothing in the scenario requires single-tenant HSMs; KMS keys are already protected by validated hardware.
      - id: no-second-web-acl
        text: No second web ACL on the load balancer behind CloudFront
        variants:
          - text: The load balancer lacks its own second web ACL
          - text: There's no extra web ACL on the load balancer
        explanation:
          text: If the load balancer accepts traffic only from CloudFront, one web ACL at the edge is enough. It isn't the plan's biggest gap.
    correct_answers: [nothing-detects]
    hint:
      text: Sort the plan's items into ones that stop things and ones that notice things.
    explanation:
      text: |
        Defense in depth covers each threat with a control that stops it and one that finds it,
        because preventive controls fail quietly: a mistake inside the blocking layer is not blocked
        by anything. This plan needs CloudTrail and alarms at least, and GuardDuty if the budget
        allows, so that failures are noticed and can be proved afterwards.

  - id: q09-responsibility-across-layers
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "The shared responsibility model holds at every layer"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, defense-in-depth]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software company runs part of its product on Amazon EC2 and part on AWS Lambda. Which
        statement about the shared responsibility model across its layers is correct?
    choices:
      - id: lambda-moves-data
        text: On Lambda, AWS patches the operating system and decides who may read the data
        variants:
          - text: With Lambda, AWS patches the OS and controls who can read the function's data
          - text: Lambda hands AWS both the OS patching and the choice of who reads the data
        explanation:
          text: Lambda moves the operating system to AWS, not the data. Who can read the data stays the customer's on every service.
      - id: aws-enables-detection
        text: AWS runs the hosts under both services, and it turns on GuardDuty and Config
        variants:
          - text: AWS runs both services' hosts, and it enables GuardDuty and Config for the company
          - text: Both services run on AWS's hosts, and AWS switches on GuardDuty and Config
        explanation:
          text: AWS runs the hosts and provides the detection services, but GuardDuty and Config do nothing until the customer turns them on.
      - id: shield-makes-ddos-aws
        text: Shield Standard protects both automatically, so DDoS resilience is AWS's job
        variants:
          - text: Shield Standard covers both automatically, so resisting DDoS is AWS's duty
          - text: With Shield Standard on for both, DDoS resilience becomes AWS's responsibility
        explanation:
          text: 'AWS runs Shield Standard, but the site''s design is the customer''s: CloudFront in front, WAF rules, scaling, and whether Shield Advanced is worth it.'
      - id: os-moves-data-stays
        text: The service changes who patches the OS, but data and access stay the customer's
        variants:
          - text: Who patches the OS depends on the service; data and access remain the customer's
          - text: OS patching moves with the service, while data and access stay with the customer
        explanation:
          text: Correct. The company patches its EC2 guest operating systems, AWS patches Lambda's, and on both the company owns its data and who can reach it.
    correct_answers: [os-moves-data-stays]
    explanation:
      text: |
        The line between security of the cloud and security in the cloud holds at every layer. The
        service and layer move it: on EC2 you patch the guest operating system, on Lambda AWS does.
        But no service moves the data or identity rows to AWS's side, and most controls on the map
        are off, or wide open, until the customer configures them.

  - id: q09-shield-advanced-leaves-gaps
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Worked example: the bakery's plan after a competitor's attack"
    task: "2.4"
    level: application
    topics: [defense-in-depth, aws-shield]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A consultant tells an independent bookshop: "Subscribe to AWS Shield Advanced and your online
        store is covered." Which threat does that plan leave unaddressed?
    choices:
      - id: syn-flood
        text: A SYN flood aimed at the store's website
        variants:
          - text: A SYN flood against the store's site
          - text: The store's website hit by a SYN flood
        explanation:
          text: Network floods are what Shield covers; Standard handles common ones automatically, and Advanced adds more.
      - id: http-flood
        text: A flood of page requests to the checkout page
        variants:
          - text: The checkout page flooded with page requests
          - text: Masses of page requests aimed at checkout
        explanation:
          text: Shield Advanced adds automatic application layer mitigation, through AWS WAF, for protected resources.
      - id: public-bucket
        text: A bucket of order exports made public by mistake
        variants:
          - text: An order-export bucket accidentally made public
          - text: A bucket holding order exports opened to the public by error
        explanation:
          text: Correct. A public bucket is a data-layer threat. Block Public Access prevents it, and Macie or a Config rule finds it; Shield does neither.
      - id: scaling-charges
        text: Extra scaling charges caused by a DDoS attack
        variants:
          - text: Scaling charges that a DDoS attack drives up
          - text: Added charges from scaling during a DDoS attack
        explanation:
          text: DDoS cost protection, which credits charges an attack causes, is part of Shield Advanced.
    correct_answers: [public-bucket]
    hint:
      text: Shield Advanced strengthens one layer of the map. Which choice sits on a different layer?
    explanation:
      text: |
        Shield Advanced strengthens the edge against DDoS: expert help, application layer mitigation
        and cost protection. It does nothing about a public bucket, a stolen access key, an unpatched
        server or a trail switched off, which sit in other layers. A sound plan covers every threat
        with a preventive and a detective control first, then weighs Shield Advanced on its cost.

flashcards:

  - id: c09-trail-on-day-one
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "\"CloudTrail records everything, forever\" is wrong"
    task: "2.2"
    level: understanding
    topics: [cloudtrail, trails]
    front:
      text: Why do teams create a CloudTrail trail on an account's first day?
    back:
      text: Event history keeps only 90 days. A trail keeps events from the day it's created, for as long as you keep the files; it can't recover anything older.

  - id: c09-event-history-per-region
    page: guide/09-protecting-and-governing/07-lab-12-answer-the-auditor.md
    section: "Part A: follow one change from start to finish (follow-along)"
    task: "2.2"
    level: understanding
    topics: [cloudtrail, event-history]
    front:
      text: You find no root sign-in in CloudTrail Event history for US East (N. Virginia). Why look further?
    back:
      text: Event history shows one Region at a time, and console sign-in events may be recorded in US East (Ohio) or US West (Oregon) instead. Check those Regions too.

  - id: c09-ec2-logs-need-agent
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "CloudWatch shows how things are running, not who changed them"
    task: "2.2"
    level: recall
    topics: [cloudwatch, logs]
    front:
      text: Which reach CloudWatch Logs with nothing installed, Lambda function logs or an EC2 server's application logs?
    back:
      text: Lambda function logs. An EC2 server's operating system and application logs reach CloudWatch Logs only through the CloudWatch agent.

  - id: c09-last-accessed-blind-spot
    page: guide/09-protecting-and-governing/01-who-did-what.md
    section: "Access reports show who can do what, and whether they still use it"
    task: "2.2"
    level: understanding
    topics: [access-reports]
    front:
      text: Why isn't an empty Last Accessed entry proof that nobody can reach a service?
    back:
      text: Last accessed information covers identity-based policies only. Access granted through a resource-based policy, such as a bucket policy, doesn't appear in it.

  - id: c09-detect-fix-prevent
    page: guide/09-protecting-and-governing/09-sim-config-timeline.md
    section: "Decision 2: the owner says, \"Config caught it, so Config would have stopped it next time.\""
    task: "2.2"
    level: understanding
    topics: [aws-config, preventive-detective]
    front:
      text: A Config rule flags a bad setting. What fixes it, and what stops it happening again?
    back:
      text: A remediation action attached to the rule fixes it. IAM permissions that don't allow the change, or an SCP across accounts, prevent it. The rule alone only reports.

  - id: c09-cloudfront-cert-in-n-virginia
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "TLS certificates from ACM protect data in transit"
    task: "2.2"
    level: recall
    topics: [acm, cloudfront]
    front:
      text: A site in Europe is served through Amazon CloudFront. In which Region must its ACM certificate be requested or imported?
    back:
      text: US East (N. Virginia). ACM certificates are Regional, and CloudFront uses certificates from that Region, wherever the site's origin runs.

  - id: c09-why-kms-deletion-waits
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: understanding
    topics: [kms, key-deletion]
    front:
      text: What happens when you delete an AWS KMS key, and what does AWS suggest if you aren't sure?
    back:
      text: After a forced wait of 7 to 30 days (30 by default), the key is gone and everything encrypted under it is unreadable forever. If unsure, disable the key instead.

  - id: c09-rds-encrypt-after-creation
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "KMS holds the keys for data at rest, and records every use"
    task: "2.2"
    level: application
    topics: [kms, rds, encryption-at-rest]
    front:
      text: An Amazon RDS database was created without encryption. How do you end up with an encrypted one?
    back:
      text: Take a snapshot, copy it with encryption turned on, and restore a new database from the copy. Encryption can't be switched on in place.

  - id: c09-encryption-choice-order
    page: guide/09-protecting-and-governing/02-encryption.md
    section: "\"Compliance needs CloudHSM\" is wrong"
    task: "2.2"
    level: understanding
    topics: [kms, cloudhsm, acm]
    front:
      text: Which three questions, in order, choose an encryption and key approach for a piece of data?
    back:
      text: |
        1. Is it moving (TLS, certificates from ACM) or stored?
        2. Must you control or see each use of the key (customer managed KMS key)?
        3. Does a rule require single-tenant HSMs (CloudHSM)?

  - id: c09-guardduty-no-trail-needed
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "GuardDuty watches activity and reports threats happening now"
    task: "2.2"
    level: understanding
    topics: [guardduty]
    front:
      text: Must you create a CloudTrail trail or turn on VPC Flow Logs before Amazon GuardDuty can analyze them?
    back:
      text: No. GuardDuty reads CloudTrail management events, VPC Flow Logs and DNS logs on its own once you turn it on, in each Region where you enable it.

  - id: c09-inspector-vs-guardduty-question
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Inspector scans workloads and reports weaknesses before an attacker finds them"
    task: "2.2"
    level: understanding
    topics: [inspector, guardduty]
    front:
      text: Amazon Inspector and Amazon GuardDuty both raise findings about EC2 instances. What separates them?
    back:
      text: |
        Inspector reads what is installed and reachable: "this could be attacked". GuardDuty reads
        what is happening: "this looks like an attack".

  - id: c09-security-hub-needs-config
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Security Hub gathers every finding and checks your settings, and the name now covers two products"
    task: "2.2"
    level: understanding
    topics: [security-hub, config]
    front:
      text: Why must AWS Config be turned on and recording before AWS Security Hub CSPM's standards work?
    back:
      text: Most of its controls, the checks against standards such as CIS and PCI DSS, run as AWS Config rules.

  - id: c09-trusted-advisor-vs-security-hub
    page: guide/09-protecting-and-governing/03-finding-threats-and-weaknesses.md
    section: "Trusted Advisor is a first look at your settings, with a few security checks free"
    task: "2.4"
    level: understanding
    topics: [trusted-advisor, security-hub]
    front:
      text: AWS Trusted Advisor and AWS Security Hub CSPM both flag weak settings. What does each compare your account with?
    back:
      text: |
        Trusted Advisor: AWS's own best practices, in six categories. Security Hub CSPM: named
        standards, such as CIS, PCI DSS, NIST and AWS Foundational Security Best Practices.

  - id: c09-security-group-misses-sql-injection
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS WAF reads each web request and allows, blocks or challenges it"
    task: "2.4"
    level: understanding
    topics: [waf, security-groups, sql-injection]
    front:
      text: Why can't a security group stop an SQL injection sent to a website?
    back:
      text: |
        The attack arrives on port 443 from an address the group must allow for real customers. A
        security group sees only addresses, ports and protocols, never what the request says.

  - id: c09-cloudfront-strengthens-shield-standard
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "AWS Shield Standard is already protecting every AWS account"
    task: "2.4"
    level: understanding
    topics: [shield-standard, cloudfront, ddos]
    front:
      text: Why does putting CloudFront in front of a whole site strengthen Shield Standard's protection?
    back:
      text: |
        Floods then meet AWS at many edge locations, where Shield Standard protects best, and are
        absorbed far from the servers in the Region.

  - id: c09-shield-waf-fms-one-line-each
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "Firewall Manager applies the same protections in every account"
    task: "2.4"
    level: understanding
    topics: [shield-standard, waf, firewall-manager]
    front:
      text: Shield, AWS WAF, Firewall Manager. What is each one for, in one word each?
    back:
      text: |
        Shield for **volume** (floods), WAF for **content** (what each web request says), Firewall
        Manager for **scale** (the same policies in every account).

  - id: c09-srt-two-requirements
    page: guide/09-protecting-and-governing/04-the-front-door.md
    section: "\"Any Business Support plan brings the Shield Response Team\" is wrong"
    task: "2.4"
    level: recall
    topics: [shield-advanced, shield-response-team, support-plans]
    front:
      text: A company wants the Shield Response Team's help during attacks. Which two things does AWS require?
    back:
      text: |
        A Shield Advanced subscription, and a qualifying AWS Support plan. A Support plan alone
        doesn't bring it; check AWS's SRT page for which plans qualify (as of 2026-10-24).

  - id: c09-artifact-cant-show-your-compliance
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "\"Artifact checks your compliance\" is wrong"
    task: "2.2"
    level: understanding
    topics: [artifact, shared-responsibility]
    front:
      text: What can an AWS Artifact report never tell an auditor about your company?
    back:
      text: Whether your own setup is compliant. Every Artifact report covers AWS's controls; evidence for your data, settings and staff comes from your own records.

  - id: c09-unlisted-service-not-forbidden
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "\"Not in Services in Scope means you can't use it\" is wrong"
    task: "2.2"
    level: understanding
    topics: [services-in-scope]
    front:
      text: A service is missing from AWS's Services in Scope list for a program your data falls under. Can you use it?
    back:
      text: Yes, it isn't forbidden. You decide whether it will handle the regulated data; if it will, check with your auditor or AWS first.

  - id: c09-management-account-no-workloads
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Organizations groups accounts so you can govern them together"
    task: "2.3"
    level: understanding
    topics: [organizations, scp]
    front:
      text: Why should an organization's management account hold no workloads?
    back:
      text: It controls and pays for the whole organization, so a break-in there reaches everything. And SCPs don't apply to it, so no ceiling protects what runs there.

  - id: c09-full-access-detached-no-replacement
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "An SCP is a ceiling: it limits everyone in a member account, and grants nothing"
    task: "2.3"
    level: understanding
    topics: [scp]
    front:
      text: What happens if you detach FullAWSAccess from an OU and leave only deny-list SCPs there?
    back:
      text: Nothing is allowed at that level, so every action in the accounts below fails. Every level must allow; test SCP changes on a small OU first.

  - id: c09-organizations-or-control-tower
    page: guide/09-protecting-and-governing/05-compliance-and-governance.md
    section: "AWS Control Tower sets up and watches a multi-account environment, on top of Organizations"
    task: "2.3"
    level: understanding
    topics: [control-tower, organizations]
    front:
      text: When is AWS Control Tower a better choice than AWS Organizations alone?
    back:
      text: When you want a governed multi-account setup built for you quickly, with a landing zone, ready-made controls and Account Factory. For one bill and your own policies, Organizations is enough.

  - id: c09-preventive-fails-quietly
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "Cover every threat with at least two layers: one that stops it and one that finds it"
    task: "2.2"
    level: understanding
    topics: [defense-in-depth, preventive-detective]
    front:
      text: Why does each threat on a defense map need a detective control as well as a preventive one?
    back:
      text: Preventive controls fail quietly. A mistake inside the blocking layer, such as a rule opened by accident, isn't blocked by anything; detection reveals it, and records prove what happened.

  - id: c09-what-never-moves-to-aws
    page: guide/09-protecting-and-governing/06-a-defense-map.md
    section: "The shared responsibility model holds at every layer"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, defense-in-depth]
    front:
      text: On a defense map, what moves the shared responsibility line, and what never moves to AWS's side?
    back:
      text: The service and layer move it (AWS patches Lambda's operating system, you patch EC2's). Your data and who can reach it stay yours on every service.
