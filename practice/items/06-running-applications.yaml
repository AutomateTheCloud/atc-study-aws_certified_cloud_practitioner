  - id: q06-spiky-store-full-control
    page: guide/06-running-applications/04-simpler-paths.md
    section: "Worked example: matching five requests"
    task: "3.3"
    level: application
    topics: [compute-choice, auto-scaling]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's online store has sharp traffic spikes and needs exact control of its instance
        types, scaling rules and load balancer settings. Which compute setup fits?
    choices:
      - id: lightsail
        text: Amazon Lightsail instances on a fixed monthly bundle plan
        variants:
          - text: Lightsail instances on a set monthly bundle plan
          - text: Amazon Lightsail servers billed as a monthly bundle
        explanation:
          text: Lightsail is simple and predictable, but it offers less control; Upgrade to EC2 is for outgrowing it.
      - id: ec2-asg-lb
        text: Amazon EC2 with Auto Scaling and a load balancer
        variants:
          - text: EC2 instances with Auto Scaling and a load balancer
          - text: An Auto Scaling group of EC2 behind a load balancer
        explanation:
          text: Building it yourself gives the most control of types, scaling rules and the load balancer.
      - id: batch
        text: AWS Batch, with the store's pages submitted as jobs
        variants:
          - text: AWS Batch, submitting the store's pages as queued jobs
          - text: AWS Batch, running the store's pages as queued jobs
        explanation:
          text: Batch runs unattended jobs from a queue, not a website.
      - id: outposts
        text: AWS Outposts racks installed in the company's own building
        variants:
          - text: AWS Outposts racks placed in the company's own building
          - text: Outposts racks set up inside the company's own building
        explanation:
          text: Nothing here needs to run in the company's building.
    correct_answers: [ec2-asg-lb]
    hint:
      text: How much does this company want to build itself?
    explanation:
      text: |
        The lesson's flowchart asks where the work must run, what kind of work it is, and how much
        you want to build. A web app that needs full control of instance types, scaling rules and
        the load balancer lands on EC2 with Auto Scaling and a load balancer, as in lessons 06.01
        and 06.02.

flashcards:

  # ---------------------------------------------------------------- 06.01 Amazon EC2

  - id: c06-family-choice-order
    page: guide/06-running-applications/01-ec2.md
    section: "Worked example: a family for each of the bakery's jobs"
    level: recall
    topics: [instance-families]
    front:
      text: In what order does an expert choose an EC2 instance type for a workload?
    back:
      text: Bottleneck first (what the work runs out of), then the family built for that resource, then the size last.

  - id: c06-type-name-around-the-dot
    page: guide/06-running-applications/01-ec2.md
    section: Read an instance type's name from left to right
    level: recall
    topics: [instance-types]
    front:
      text: In an EC2 instance type name such as `c7g.large`, what comes before the dot, and what after it?
    back:
      text: "Before the dot: the family letter, the generation number and any variant letters (`c`, `7`, `g`). After it: the size (`large`)."

  - id: c06-volume-outlives-instance
    page: guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md
    section: "Part C: terminate, and prove it's gone (on your own)"
    level: understanding
    topics: [instance-states]
    front:
      text: When does an EC2 instance's EBS volume keep billing after the instance is terminated?
    back:
      text: When its delete on termination setting is No. The volume stays, and bills, until you delete it yourself.

  - id: c06-why-ec2-puts-most-on-you
    page: guide/06-running-applications/01-ec2.md
    section: Your side of the line on EC2
    level: understanding
    topics: [shared-responsibility, ec2-instances]
    front:
      text: Why does Amazon EC2 leave more security work with the customer than any other AWS compute service?
    back:
      text: Because the customer runs the guest operating system, so its patches, the software installed on it and the security group rules are all the customer's.

  # ---------------------------------------------------------------- 06.02 Auto Scaling and load balancers

  - id: c06-elasticity-and-ha-sources
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Auto Scaling changes how many; the load balancer chooses which
    level: understanding
    topics: [elasticity, high-availability]
    front:
      text: In an EC2 web tier, where does elasticity come from, and where does high availability come from?
    back:
      text: "Elasticity: Auto Scaling changing the number of instances with demand. High availability: instances in several AZs, kept balanced by Auto Scaling and reached through the load balancer."

  - id: c06-failed-health-check-two-responses
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: A load balancer sends each request to a healthy instance
    level: understanding
    topics: [auto-scaling, load-balancers]
    front:
      text: An instance behind a load balancer fails the load balancer's health check. Its Auto Scaling group is set to use those checks too. What does each service do?
    back:
      text: "The load balancer stops sending it requests (stops the damage). Auto Scaling replaces it to restore the desired capacity (repairs it)."

  - id: c06-scale-ahead-of-a-daily-rush
    page: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
    section: "Decision 5: the lunch rush arrives on time, every day"
    level: understanding
    topics: [auto-scaling, scaling-policies]
    front:
      text: Why is target tracking alone a little late for a rush that arrives at the same time every day, and what fixes it?
    back:
      text: It reacts after load rises, and new instances take minutes to start. Predictive scaling or a scheduled action adds them before the rush.

  - id: c06-choose-a-load-balancer-type
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Choose ALB, NLB or GWLB; Classic is the previous generation
    level: understanding
    topics: [load-balancers]
    front:
      text: "Which load balancer type fits: (a) traffic through firewall appliances; (b) web requests routed by page address; (c) TCP or UDP at very high speed, or a fixed IP?"
    back:
      text: (a) Gateway Load Balancer. (b) Application Load Balancer. (c) Network Load Balancer.

  # ---------------------------------------------------------------- 06.03 Containers and serverless

  - id: c06-ecr-ecs-fargate-together
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "Four names, four jobs: ECR stores, ECS and EKS orchestrate, Fargate supplies the computers"
    level: understanding
    topics: [containers, fargate]
    front:
      text: A container app runs on AWS with no servers to manage, using ECR, ECS and Fargate together. What does each of the three do?
    back:
      text: "ECR stores the image. ECS orchestrates: where containers run, how many, replacing failed copies. Fargate supplies the serverless compute they run on."

  - id: c06-lambda-fargate-or-ec2-rule
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "Lambda or Fargate: short event-driven work, or containers that keep running"
    level: understanding
    topics: [compute-choice]
    front:
      text: What rule of thumb picks between AWS Lambda, AWS Fargate and Amazon EC2 for a job?
    back:
      text: "Short work started by an event: Lambda. A container, or work that keeps running: Fargate. GPUs, full OS control or software that can't be containerized: EC2."

  - id: c06-yours-on-every-compute-option
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Your side of the line
    level: recall
    topics: [shared-responsibility, compute-choice]
    front:
      text: Which security responsibilities stay with the customer on every AWS compute option, from EC2 to Lambda?
    back:
      text: Your code and its libraries, your data, and the permissions your app gets through its IAM role.

  - id: c06-flawed-library-in-a-fargate-image
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Your side of the line
    level: understanding
    topics: [shared-responsibility, fargate]
    front:
      text: On AWS Fargate, how long does a flawed library inside your container image stay flawed?
    back:
      text: Until you rebuild and redeploy the image. AWS patches the platform under the containers, not what's inside your image; ECR scanning helps find the flaw.

  - id: c06-lambda-keeps-no-state
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Lambda runs your code only when an event triggers it
    level: recall
    topics: [lambda]
    front:
      text: Where must a Lambda function put anything it needs to keep for its next run?
    back:
      text: Outside the function, such as in Amazon S3 or a database. You can't rely on Lambda to keep state between runs.

  - id: c06-lambda-needs-no-az-planning
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Lambda runs your code only when an event triggers it
    level: understanding
    topics: [lambda, high-availability]
    front:
      text: Why don't you spread a Lambda function that isn't connected to a VPC across Availability Zones yourself, as you do EC2 web servers?
    back:
      text: Lambda's availability is built in, with no maintenance windows, so there are no servers for you to place. With EC2, placing servers in several AZs is your job.

  # ---------------------------------------------------------------- 06.04 Simpler paths

  - id: c06-beanstalk-what-you-still-decide
    page: guide/06-running-applications/04-simpler-paths.md
    section: Elastic Beanstalk builds and runs the setup for your code
    level: recall
    topics: [elastic-beanstalk, shared-responsibility]
    front:
      text: Elastic Beanstalk builds the setup for your code. What does the customer still decide?
    back:
      text: The instance type and how many instances, whether to turn on managed platform updates, and when to start major platform upgrades.

  - id: c06-ec2-beanstalk-lightsail-difference
    page: guide/06-running-applications/04-simpler-paths.md
    section: "EC2, Elastic Beanstalk or Lightsail: three ways to run a web app"
    level: understanding
    topics: [elastic-beanstalk, lightsail, compute-choice]
    front:
      text: EC2, Elastic Beanstalk and Lightsail can all run the same website. What differs among them?
    back:
      text: "Who assembles the setup and how you pay: you, by each part (EC2); Beanstalk, at no extra charge beyond the parts; or Lightsail, as a fixed monthly bundle."

  - id: c06-what-batch-saves-you-building
    page: guide/06-running-applications/04-simpler-paths.md
    section: Batch runs large numbers of jobs from a queue
    level: understanding
    topics: [batch]
    front:
      text: To run a large queue of jobs on EC2 alone, what would you have to build that AWS Batch does for you?
    back:
      text: "The scheduling: which job runs where and when, and when to add or remove servers."

  - id: c06-outposts-physical-security-line
    page: guide/06-running-applications/04-simpler-paths.md
    section: Your side of the line
    level: understanding
    topics: [outposts, shared-responsibility]
    front:
      text: On AWS Outposts, which work moves to the customer that AWS does in a Region?
    back:
      text: Providing space, power and network, and the physical security and access control around the Outpost. AWS still monitors, patches and maintains it.
