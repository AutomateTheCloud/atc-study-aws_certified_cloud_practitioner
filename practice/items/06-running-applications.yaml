      - id: compute-optimizer
        text: AWS Compute Optimizer
        variants:
          - text: Compute Optimizer
          - text: The AWS Compute Optimizer service
        explanation:
          text: Compute Optimizer recommends better resource sizes; it doesn't scale anything.
      - id: aws-auto-scaling
        text: AWS Auto Scaling
        variants:
          - text: The AWS Auto Scaling service
          - text: AWS Auto Scaling, the service
        explanation:
