  - id: q06-lambda-statements-pick-two
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Lambda runs your code only when an event triggers it
    task: "3.3"
    level: understanding
    topics: [lambda]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A team is deciding whether to run its event processing on AWS Lambda. Which TWO statements
        about Lambda are true? (Select TWO.)
    choices:
      - id: event-triggered
        text: It runs code each time an event, such as an upload, triggers it
        variants:
          - text: It runs a function whenever a trigger, such as an upload, fires
          - text: Its code runs each time a trigger event, like an upload, arrives
        explanation:
          text: Lambda runs a function when a trigger, such as a file landing in S3, fires.
      - id: keeps-state
        text: It can be relied on to keep data in memory between invocations
        variants:
          - text: It reliably holds data in memory from one invocation to the next
          - text: You can count on it to carry data in memory from run to run
        explanation:
          text: You can't rely on anything carrying over between runs; anything to keep goes to S3 or a database.
      - id: runs-copies
        text: It runs many copies side by side when many events arrive at once
        variants:
          - text: It runs several copies in parallel when lots of events arrive
          - text: It starts copies side by side when many events come in together
        explanation:
          text: Scaling is automatic; 300 photos at once means many copies running together.
      - id: choose-type
        text: It needs you to choose an instance type for each function
        variants:
          - text: It requires an instance type to be picked for each function
          - text: Each function needs an instance type that you select
        explanation:
          text: You set only the function's memory; there are no instance types to choose.
      - id: spread-azs
        text: It needs you to deploy each function into two or more AZs
        variants:
          - text: It requires each function to be placed in at least two AZs
          - text: Each function must be deployed by you into several AZs
        explanation:
          text: Availability is built in; you don't spread Lambda across Availability Zones yourself.
    correct_answers: [event-triggered, runs-copies]
    explanation:
      text: |
        AWS Lambda runs your code each time an event triggers it, with no servers to manage, and
        scales automatically by running copies side by side. You can't rely on it to keep anything
        between runs, and its availability is built in: a function that isn't connected to a VPC
        has no Availability Zones for you to plan.

  - id: q06-container-service-all-day-no-servers
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "Lambda or Fargate: short event-driven work, or containers that keep running"
    task: "3.3"
    level: application
    topics: [fargate, compute-choice]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's product-search service is already packaged as a container image and must answer
        requests all day, every day. The team doesn't want to choose, scale or patch servers. Which
        option fits best?
    choices:
      - id: batch-jobs
        text: AWS Batch jobs submitted to a job queue
        variants:
          - text: Jobs sent to an AWS Batch job queue
          - text: An AWS Batch queue of submitted jobs
        explanation:
          text: Batch runs jobs that finish; this service has to keep running.
      - id: ec2-asg
        text: EC2 instances in an Auto Scaling group
        variants:
          - text: An Auto Scaling group of EC2 instances
          - text: EC2 servers managed by Auto Scaling
        explanation:
          text: That works, but the team would choose and patch the instances.
      - id: ecs-fargate-service
        text: An Amazon ECS service on AWS Fargate
        variants:
          - text: An ECS service running on Fargate
          - text: A Fargate-backed Amazon ECS service
        explanation:
          text: An ECS service keeps tasks running all day, and Fargate removes the servers from the team's list.
      - id: ecr-scanning
        text: An Amazon ECR repository with scanning
        variants:
          - text: A scanned repository in Amazon ECR
          - text: Amazon ECR with image scanning on
        explanation:
          text: ECR stores and scans images; it doesn't run them.
    correct_answers: [ecs-fargate-service]
    hint:
      text: It is already a container, and it never stops.
    explanation:
      text: |
        An app already in a container, or one that keeps running, points to Fargate. Under ECS, a
        service keeps a set number of tasks running and replaces any that stop, and Fargate means
        no one chooses, scales or patches servers.

  - id: q06-how-lambda-bills-compute
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: What you pay for
    task: "3.3"
    level: recall
    topics: [lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        How does AWS Lambda bill for the compute a function uses?
    choices:
      - id: hourly-existence
        text: By the hour, for as long as the function exists, used or not
        variants:
          - text: Hourly, for the whole time the function exists, run or not
          - text: For every hour the function exists, whether it runs or not
        explanation:
          text: An idle function costs nothing; Lambda bills only for runs.
      - id: monthly-plan
        text: A fixed monthly plan price covering a set number of runs
        variants:
          - text: A set monthly plan price that includes a number of runs
          - text: One fixed price a month that covers an allowance of runs
        explanation:
          text: Fixed monthly plans are Lightsail's model, not Lambda's.
      - id: instance-type
        text: By the instance type chosen for the function, per second
        variants:
          - text: Per second, at the rate of the function's instance type
          - text: At the per-second rate of the instance type you picked
        explanation:
          text: Lambda has no instance types; you set memory only.
      - id: requests-gb-seconds
        text: Per request, plus memory times run time, in GB-seconds
        variants:
          - text: For each request, plus memory multiplied by run time
          - text: Per invocation, plus GB of memory times seconds run
        explanation:
          text: Lambda bills each request and each GB-second of compute.
    correct_answers: [requests-gb-seconds]
    explanation:
      text: |
        Lambda charges per request plus GB-seconds: the memory given to the function, in GB, times
        the seconds it runs. Nothing runs, or bills, between events, which is why pay-per-use suits
        small or irregular work.

  - id: q06-lambda-customer-tasks-pick-two
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Your side of the line
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company moves its order processing to AWS Lambda functions. Under the shared
        responsibility model, which TWO remain the company's responsibility? (Select TWO.)
    choices:
      - id: code-libraries
        text: The functions' code and the libraries it uses
        variants:
          - text: The function code and the libraries in it
          - text: The code of each function and its libraries
        explanation:
          text: Your code and its libraries are yours on every compute option.
      - id: patch-os
        text: Patching the servers' operating system
        variants:
          - text: Applying patches to the servers' OS
          - text: Keeping the servers' OS patched
        explanation:
          text: AWS patches the servers and operating system under Lambda.
      - id: iam-permissions
        text: The permissions each function's IAM role grants
        variants:
          - text: What each function's IAM role allows it to do
          - text: The permissions in each function's IAM role
        explanation:
          text: The execution role, kept to least privilege, is the customer's.
      - id: add-servers
        text: Adding servers when many events arrive at once
        variants:
          - text: Adding servers when events arrive all at once
          - text: Providing more servers when events pile up
        explanation:
          text: Lambda scales itself by running copies side by side.
      - id: hardware
        text: Maintaining the hardware in AWS data centers
        variants:
          - text: Looking after the hardware in AWS's buildings
          - text: Repairing physical hardware in AWS facilities
        explanation:
          text: Hardware is always AWS's.
    correct_answers: [code-libraries, iam-permissions]
    explanation:
      text: |
        "With serverless, AWS handles the security" is wrong. On Lambda, AWS runs, scales and
        patches the servers, but your code and its libraries, your data, and the permissions your
        function gets through its IAM role stay yours, along with moving off runtimes before AWS
        retires them.

  - id: q06-flawed-library-in-fargate-image
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Your side of the line
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, fargate]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its app on Amazon ECS with AWS Fargate. A security flaw is found in a
        library inside the app's container image. Who fixes it, and how?
    choices:
      - id: company-rebuilds
        text: The company, by rebuilding the image with a fixed library and redeploying it
        variants:
          - text: The company, which rebuilds the image with the fixed library and redeploys
          - text: The company, rebuilding its image with a patched library and redeploying it
        explanation:
          text: Everything inside the image is the customer's; the flaw stays until the image is rebuilt.
      - id: aws-patches-tasks
        text: AWS, by patching the library inside running tasks as it patches the Fargate platform
        variants:
          - text: AWS, which patches the library in running tasks when it patches the Fargate platform
          - text: AWS, fixing the library inside running tasks as part of patching the Fargate platform
        explanation:
          text: AWS patches the platform under the containers, not the libraries inside your image.
      - id: ecr-replaces
        text: AWS, because Amazon ECR replaces flawed libraries in the images it stores
        variants:
          - text: AWS, since Amazon ECR swaps out flawed libraries in the images it holds
          - text: AWS, as Amazon ECR automatically replaces flawed libraries in stored images
        explanation:
          text: ECR's scanning can find known flaws, but it doesn't change your images.
      - id: isolation
        text: Nobody needs to, because Fargate isolates each task in its own environment
        variants:
          - text: No one has to, since Fargate runs each task in its own isolated environment
          - text: It needs no fix, because each Fargate task is isolated in its own environment
        explanation:
          text: Isolation separates tasks from each other; it doesn't remove a flaw in the app's own library.
    correct_answers: [company-rebuilds]
    explanation:
      text: |
        On Fargate, AWS patches the servers and operating system under the containers. Everything
        inside the image is still the customer's: a flawed library stays until the company rebuilds
        and redeploys the image. ECR's image scanning helps find such flaws.

  - id: q06-who-patches-the-server-os
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "The big picture: the further right, the less you manage"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, compute-choice]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        On which of these options does the customer still patch the operating system of the servers
        that run its code?
    choices:
      - id: ecs-fargate
        text: Amazon ECS, with its tasks on AWS Fargate
        variants:
          - text: ECS, running its tasks on AWS Fargate
          - text: Amazon ECS, placing tasks on Fargate
        explanation:
          text: On Fargate, AWS patches the servers' operating system.
      - id: ecs-ec2-self
        text: Amazon ECS, on EC2 instances the customer runs
        variants:
          - text: ECS, with tasks on EC2 instances the customer runs
          - text: Amazon ECS, using EC2 instances the customer runs
        explanation:
          text: The customer chooses, counts and patches these instances, unless it uses ECS Managed Instances.
      - id: lambda
        text: AWS Lambda, with functions on managed runtimes
        variants:
          - text: Lambda, running functions on managed runtimes
          - text: AWS Lambda, using its managed runtimes
        explanation:
          text: AWS runs and patches the servers under Lambda.
      - id: eks-fargate
        text: Amazon EKS, with its containers on AWS Fargate
        variants:
          - text: EKS, running its containers on AWS Fargate
          - text: Amazon EKS, placing containers on Fargate
        explanation:
          text: On Fargate, AWS patches the servers whichever orchestrator places the containers.
    correct_answers: [ecs-ec2-self]
    explanation:
      text: |
        The further you move from EC2 toward Lambda, the less you manage. On ECS or EKS with EC2
        instances, the instances' operating system, patches and count stay the customer's (unless
        it uses ECS Managed Instances or EKS Auto Mode); on Fargate and Lambda, AWS patches the
        servers.

  - id: q06-retiring-lambda-runtime
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Your side of the line
    task: "2.1"
    level: recall
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        AWS announces that a Lambda language runtime a company's functions use will be retired.
        Who must move the functions to a supported runtime?
    choices:
      - id: aws-auto
        text: AWS, which moves every function itself on the retirement date
        variants:
          - text: AWS, which switches every function over on the retirement date
          - text: AWS, which migrates all functions itself when the runtime retires
        explanation:
          text: AWS updates the managed runtimes, but moving off a retiring one is the customer's job.
      - id: nobody
        text: Nobody, because retired runtimes keep getting updates indefinitely
        variants:
          - text: No one, since retired runtimes go on receiving updates indefinitely
          - text: Nobody, as a retired runtime continues to be updated indefinitely
        explanation:
          text: Retiring a runtime means AWS stops maintaining it.
      - id: company
        text: The company, which updates its functions to a supported runtime
        variants:
          - text: The company, by moving its functions to a runtime still supported
          - text: The company, which switches its functions to a supported runtime
        explanation:
          text: Moving off a runtime before AWS retires it is on the customer's side of the line.
      - id: support
        text: AWS Support, which migrates the functions once a ticket is opened
        variants:
          - text: AWS Support, which moves the functions after a ticket is raised
          - text: AWS Support, which migrates the functions when asked in a ticket
        explanation:
          text: Support helps with questions; it doesn't change your functions for you.
    correct_answers: [company]
    explanation:
      text: |
        On Lambda, AWS runs and patches the servers and keeps the managed runtimes updated. Moving
        off a runtime before AWS retires it stays the customer's job, along with the code, its
        libraries and its permissions.

  - id: q06-lambda-and-availability-zones
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Lambda runs your code only when an event triggers it
    task: "3.3"
    level: understanding
    topics: [lambda, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its web servers on EC2 in two Availability Zones. It moves its order
        processing to AWS Lambda functions that aren't connected to a VPC. What must it do about
        Availability Zones for the functions?
    choices:
      - id: copy-per-az
        text: Deploy a copy of each function into each AZ, as with the servers
        variants:
          - text: Put a copy of every function in each AZ, as with the servers
          - text: Deploy each function once per AZ, the way it does its servers
        explanation:
          text: That is the EC2 habit; Lambda doesn't need it.
      - id: alb-two-azs
        text: Place an Application Load Balancer before the functions in two AZs
        variants:
          - text: Put an Application Load Balancer before the functions in two AZs
          - text: Front the functions with an Application Load Balancer in two AZs
        explanation:
          text: A load balancer doesn't give Lambda its availability; Lambda has it built in.
      - id: min-two
        text: Set an Auto Scaling minimum of two functions, one in each AZ
        variants:
          - text: Give the functions an Auto Scaling minimum of two, one per AZ
          - text: Keep at least two functions, one per AZ, with Auto Scaling
        explanation:
          text: Auto Scaling groups manage EC2 instances, not Lambda functions.
      - id: nothing
        text: Nothing, because Lambda has its availability built in
        variants:
          - text: Nothing, since Lambda's availability is built in already
          - text: Nothing, as availability comes built into Lambda itself
        explanation:
          text: AWS runs Lambda with its availability built in and no maintenance windows.
    correct_answers: [nothing]
    explanation:
      text: |
        Lambda's availability is built in, with no maintenance windows, so you don't spread it
        across Availability Zones yourself. With EC2, placing servers in more than one AZ is the
        customer's job.

  - id: q06-what-limits-a-function
    page: guide/06-running-applications/05-lab-07-a-lambda-function.md
    section: Look at the role
    task: "2.1"
    level: recall
    topics: [lambda, shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In AWS Lambda, what decides which AWS resources a function's code is allowed to touch?
    choices:
      - id: execution-role
        text: The function's execution role, an IAM role
        variants:
          - text: Its execution role, which is an IAM role
          - text: The IAM role it runs with, its execution role
        explanation:
          text: Lambda assumes the execution role while the code runs; its policies set what the code may touch.
      - id: trigger
        text: The trigger that starts the function's runs
        variants:
          - text: The trigger that sets the function running
          - text: Whichever trigger starts the function's runs
        explanation:
          text: A trigger decides when the function runs, not what it may touch.
      - id: handler
        text: The handler named in the function's code
        variants:
          - text: The handler that the function's code names
          - text: The handler declared in the function's code
        explanation:
          text: The handler is the part of the code Lambda runs on each invocation; it grants nothing.
      - id: log-group
        text: The log group the function writes its logs to
        variants:
          - text: The log group that receives the function's logs
          - text: The log group where the function's logs are kept
        explanation:
          text: The log group stores log lines; it grants no permissions.
    correct_answers: [execution-role]
    explanation:
      text: |
        A Lambda function's execution role is an IAM role that Lambda assumes while the code runs.
        In Lab 07 the default role only lets the function write its logs: it can log, but it can't,
        say, read your buckets. Keeping the role to least privilege is the customer's job.

  - id: q06-lambda-logs-keep-growing
    page: guide/06-running-applications/05-lab-07-a-lambda-function.md
    section: Read the logs and set retention
    task: "3.3"
    level: understanding
    topics: [lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's Lambda functions have run for a year, and their logs in Amazon CloudWatch Logs
        keep growing, though nobody has changed any settings. What explains this, and what should
        the company do?
    choices:
      - id: region-copies
        text: Lambda copies its logs to every Region daily; turn off that copying
        variants:
          - text: Lambda copies logs to every Region each day; switch the copying off
          - text: Logs are copied to all Regions every day; turn that replication off
        explanation:
          text: Lambda doesn't copy logs between Regions; the logs grow because they never expire.
      - id: never-expire
        text: By default logs never expire; set a retention period on each log group
        variants:
          - text: Logs are kept forever by default; give each log group a retention period
          - text: Log data never expires by default; set each log group's retention period
        explanation:
          text: CloudWatch Logs keeps log data forever unless you set a retention period.
      - id: role-stores
        text: The execution role keeps a log per run; remove the role's permissions
        variants:
          - text: The execution role stores a log for each run; strip the role's permissions
          - text: Each run's log is kept by the execution role; remove the role's policy
        explanation:
          text: The role only allows writing logs; removing it would stop new logs, not delete old ones.
      - id: recreate-monthly
        text: Logs grow until a function is deleted; delete and recreate it monthly
        variants:
          - text: Logs keep growing until deletion; delete and recreate functions monthly
          - text: A function's logs grow until it is deleted; recreate each one monthly
        explanation:
          text: Deleting a function doesn't delete its log group, and a retention setting does the job.
    correct_answers: [never-expire]
    hint:
      text: Lab 07 asked you to look at one column in the log groups list.
    explanation:
      text: |
        By default, CloudWatch Logs keeps a log group's data forever, so stored logs grow every
        month. Setting a retention period, such as one week, deletes older events automatically;
        choose the period from what investigations and any legal requirements need.

  - id: q06-pay-per-use-or-a-flat-server
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: What you pay for
    task: "3.3"
    level: understanding
    topics: [lambda, compute-choice]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company compares running an irregular job on AWS Lambda with running it on one small EC2
        instance all month. Which statement is accurate?
    choices:
      - id: lambda-always
        text: Lambda tends to win for steady heavy use, because it bills each function a flat monthly fee
        variants:
          - text: Lambda usually wins for heavy, steady use, since each function has a flat monthly fee
          - text: Steady heavy use tends to favor Lambda, because it charges each function a flat monthly fee
        explanation:
          text: Lambda has no flat monthly fee; it bills per request and per GB-second, so heavy, steady use raises its cost.
      - id: server-always
        text: The server tends to win for light use, because each Lambda request has a minimum hourly charge
        variants:
          - text: Light use usually favors the server, since every Lambda request bills a minimum hour
          - text: The server is usually cheaper when use is light, as each Lambda request bills a full hour
        explanation:
          text: Lambda bills by the request and the GB-second, not by the hour, so light, irregular use costs a fraction of a server that runs all month.
      - id: follows-work
        text: Lambda's cost follows the work, so light use is cheaper; steady heavy use can favor the server
        variants:
          - text: Lambda costs track the work, so light use wins there; steady heavy use may favor the server
          - text: Lambda's bill follows the work, cheaper when light; steady, heavy use can tip it to the server
        explanation:
          text: The server costs the same for three runs or thousands; Lambda's cost follows each run.
      - id: same-cost
        text: Both tend to cost about the same, because AWS prices its compute by the hour either way
        variants:
          - text: Both usually cost about the same, since AWS prices any kind of compute by the hour
          - text: The two tend to cost much the same, as AWS compute is priced by the hour regardless
        explanation:
          text: Lambda bills per request and per GB-second, not by the hour.
    correct_answers: [follows-work]
    explanation:
      text: |
        A server that runs all month costs the same whether it does three jobs or thousands. Lambda
        bills per request and per GB-second, so its cost follows the work: cents for light, irregular
        use, but steady, heavy use can make the flat-priced server cheaper. Pay per use is cheap for
        small work, not always cheapest.

  # ---------------------------------------------------------------- 06.04 Simpler paths

  - id: q06-upload-code-get-the-setup-built
    page: guide/06-running-applications/04-simpler-paths.md
