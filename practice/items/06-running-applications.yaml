# Module 06, Running applications: compute. Practice questions and concept cards.
# Written from the guide pages in guide/06-running-applications/; plan in practice/work/blueprint-06.md.

questions:

  # ---------------------------------------------------------------- 06.01 Amazon EC2

  - id: q06-family-reports-held-in-memory
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A retailer's reporting tool loads a full year of sales into RAM so it can compare them.
        Monitoring shows memory filling up while the processors stay mostly idle. Which EC2
        instance family fits this workload best?
    choices:
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: The workload runs out of memory first, and memory optimized types give the most memory for their processors.
      - id: compute-optimized
        text: Compute optimized
        variants:
          - text: Compute optimized family
          - text: Compute optimized types
        explanation:
          text: Compute optimized adds processor power, but the processors here are mostly idle.
      - id: storage-optimized
        text: Storage optimized
        variants:
          - text: Storage optimized family
          - text: Storage optimized types
        explanation:
          text: Storage optimized gives fast local disks; this data has to sit in RAM, not on disk.
      - id: accelerated-computing
        text: Accelerated computing
        variants:
          - text: Accelerated computing family
          - text: Accelerated computing types
        explanation:
          text: Accelerated computing adds GPUs and other special chips, which nothing here calls for.
    correct_answers: [memory-optimized]
    hint:
      text: Ask what the program runs out of first.
    explanation:
      text: |
        Choose the family from the bottleneck: the resource the workload runs out of first. Here it
        is memory, and AWS lists analytics on large data sets held in memory as a memory optimized
        workload (the R, X, U and z1d types).

  - id: q06-family-game-servers-busy-cpu
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A game studio runs dedicated multiplayer game servers on Amazon EC2. Monitoring shows
        processor use near 100% for hours, while memory and disk use stay low. Which instance
        family should the studio choose?
    choices:
      - id: general-purpose
        text: General purpose
        variants:
          - text: General purpose family
          - text: General purpose types
        explanation:
          text: General purpose suits balanced loads; this one has a clear processor bottleneck.
      - id: compute-optimized
        text: Compute optimized
        variants:
          - text: Compute optimized family
          - text: Compute optimized types
        explanation:
          text: The processor runs out first, and compute optimized types give the most processor power for their memory.
      - id: storage-optimized
        text: Storage optimized
        variants:
          - text: Storage optimized family
          - text: Storage optimized types
        explanation:
          text: Storage optimized is for fast reads and writes to local disks, and disk use here is low.
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized adds memory, which this workload isn't short of.
    correct_answers: [compute-optimized]
    hint:
      text: Which resource is at its limit while the others have room?
    explanation:
      text: |
        The processors are what run out, so the family is compute optimized (the C types). AWS
        lists dedicated game servers, batch processing and media transcoding among its example
        workloads.

  - id: q06-family-model-training-on-gpus
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup trains machine learning models that tag product photos, and its training code
        is written to run on GPUs. Which EC2 instance family fits the training servers?
    choices:
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized types add memory, not GPUs.
      - id: compute-optimized
        text: Compute optimized
        variants:
          - text: Compute optimized family
          - text: Compute optimized types
        explanation:
          text: Tempting because training is heavy work, but compute optimized adds ordinary processors, not GPUs.
      - id: accelerated-computing
        text: Accelerated computing
        variants:
          - text: Accelerated computing family
          - text: Accelerated computing types
        explanation:
          text: Accelerated computing types carry GPUs and other special chips for work such as machine learning.
      - id: general-purpose
        text: General purpose
        variants:
          - text: General purpose family
          - text: General purpose types
        explanation:
          text: General purpose is for balanced loads with no particular bottleneck.
    correct_answers: [accelerated-computing]
    hint:
      text: The code needs a kind of chip, not just more of an ordinary resource.
    explanation:
      text: |
        Work that needs GPUs or other special chips points to accelerated computing (the P, G,
        Inf and Trn types). AWS lists machine learning, graphics and floating-point calculations
        as its workloads.

  - id: q06-family-nothing-runs-out
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small company runs a web server and a code repository on Amazon EC2. Neither uses much
        processor, memory or disk, and no single resource runs out first. Which instance family
        fits?
    choices:
      - id: compute-optimized
        text: Compute optimized
        variants:
          - text: Compute optimized family
          - text: Compute optimized types
        explanation:
          text: Compute optimized is for a processor bottleneck, and there isn't one.
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized is for data that must sit in memory, which isn't the case here.
      - id: storage-optimized
        text: Storage optimized
        variants:
          - text: Storage optimized family
          - text: Storage optimized types
        explanation:
          text: Storage optimized is for heavy reads and writes to local disks, which isn't the case here.
      - id: general-purpose
        text: General purpose
        variants:
          - text: General purpose family
          - text: General purpose types
        explanation:
          text: With nothing running out first, the balanced family fits.
    correct_answers: [general-purpose]
    hint:
      text: When there is no bottleneck, which family is built for balance?
    explanation:
      text: |
        General purpose types (M and T) balance processor, memory and network. They are the answer
        when nothing in particular runs out, and AWS lists web servers and code repositories among
        their example workloads.

  - id: q06-storage-optimized-is-not-more-space
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: understanding
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's file server on Amazon EC2 is running out of disk space for archived documents.
        A colleague suggests moving it to a storage optimized instance type. Which response is
        accurate?
    choices:
      - id: fast-disks-not-space
        text: It won't help; storage optimized targets heavy local disk reads and writes, so grow EBS or use S3
        variants:
          - text: That misreads the family; it is built for heavy local disk reads and writes, so grow EBS or use S3
          - text: It's the wrong fix; those types target heavy reads and writes on local disks; space comes from EBS or S3
        explanation:
          text: Storage optimized types are for heavy reads and writes to local disks, and those disks are instance store, which a stop erases. Lasting space for an archive comes from a larger EBS volume or from Amazon S3.
      - id: adds-space
        text: It will help; storage optimized types are the family to choose whenever a server needs more space
        variants:
          - text: Good idea; those types are the family for any server that is short of disk space
          - text: That's right; whenever disk space runs short, storage optimized is the family to pick
        explanation:
          text: This is the misconception the lesson names. "Storage optimized" describes workloads that read and write local disks heavily, not a cure for a server short of space.
      - id: keeps-in-ram
        text: It won't help; storage optimized types hold their data in RAM, so the archive needs memory
        variants:
          - text: Wrong family; storage optimized types keep data in memory, so the archive would need RAM
          - text: It's the wrong fix; those types store data in RAM, so the server would need more memory
        explanation:
          text: Storage optimized types have fast local disks. Data that must sit in RAM points to memory optimized, which isn't the issue here.
      - id: gpu-family
        text: It won't help; storage optimized is a family of GPU types for machine learning and graphics
        variants:
          - text: Wrong family; storage optimized types carry GPUs for machine learning and graphics work
          - text: It's the wrong fix; those types are built around GPUs for machine learning and graphics
        explanation:
          text: GPUs and other special chips belong to accelerated computing, not storage optimized.
    correct_answers: [fast-disks-not-space]
    explanation:
      text: |
        Storage optimized types (I, D, H) suit workloads that read and write a lot of data on fast
        local disks, such as high-throughput databases. They are not the answer to "we need more
        space": their local disks are instance store, which doesn't survive a stop, so attach a
        bigger EBS volume, or keep the archive in Amazon S3 (Module 05).

  - id: q06-family-heavy-local-disk-reads-writes
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs a high-throughput database on Amazon EC2. It makes huge numbers of reads and
        writes to the server's local disks, and disk speed is what slows it down. Which instance
        family fits?
    choices:
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized helps when data must fit in RAM; here the bottleneck is disk speed.
      - id: storage-optimized
        text: Storage optimized
        variants:
          - text: Storage optimized family
          - text: Storage optimized types
        explanation:
          text: Fast reads and writes to local disks is exactly what storage optimized types are built for.
      - id: accelerated-computing
        text: Accelerated computing
        variants:
          - text: Accelerated computing family
          - text: Accelerated computing types
        explanation:
          text: Accelerated computing adds GPUs and other chips; it doesn't speed up local disks.
      - id: compute-optimized
        text: Compute optimized
        variants:
          - text: Compute optimized family
          - text: Compute optimized types
        explanation:
          text: Compute optimized adds processor power, but the processor isn't what runs out.
    correct_answers: [storage-optimized]
    hint:
      text: Name the resource that slows it down, then the family built for that resource.
    explanation:
      text: |
        The bottleneck is reading and writing local disks, so the family is storage optimized (I,
        D and H types). AWS lists high-throughput databases and data processing among its example
        workloads.

  - id: q06-burstable-for-mostly-idle-server
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: application
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team's test server sits idle most of the day and is busy for a few minutes at a time when
        developers run their checks. Which kind of EC2 instance suits it?
    choices:
      - id: memory-r
        text: A memory optimized type, such as an R type
        variants:
          - text: An R type from the memory optimized family
          - text: A type from the memory optimized R family
        explanation:
          text: Memory optimized types are for data held in memory; nothing here runs short of memory.
      - id: storage-i
        text: A storage optimized type, such as an I type
        variants:
          - text: An I type from the storage optimized family
          - text: A type from the storage optimized I family
        explanation:
          text: Storage optimized types are for heavy local disk work, which a test server doesn't do.
      - id: burstable-t
        text: A burstable general purpose type, such as a T type
        variants:
          - text: A T type from the burstable general purpose family
          - text: A type from the burstable general purpose T family
        explanation:
          text: T types run at a baseline and burst above it with credits earned while quiet, which matches a mostly idle server.
      - id: accelerated-p
        text: An accelerated computing GPU type, such as a P type
        variants:
          - text: A P type from the accelerated computing GPU family
          - text: A type from the accelerated computing GPU P family
        explanation:
          text: Accelerated computing adds GPUs for work such as machine learning, which a test server doesn't need.
    correct_answers: [burstable-t]
    hint:
      text: The load comes in short bursts with long quiet spells between them.
    explanation:
      text: |
        Burstable (T) instances run at a baseline level of processor use and burst above it using
        credits they earn while quiet. They suit web servers and test systems that are mostly idle
        with occasional short bursts.

  - id: q06-family-tightly-linked-computations
    page: guide/06-running-applications/01-ec2.md
    section: Choose the family from the bottleneck
    task: "3.3"
    level: recall
    topics: [instance-families]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which EC2 instance family is built for very large, tightly linked computations, such as
        complex simulations?
    choices:
      - id: general-purpose
        text: General purpose
        variants:
          - text: General purpose family
          - text: General purpose types
        explanation:
          text: General purpose balances resources for everyday work such as web servers.
      - id: storage-optimized
        text: Storage optimized
        variants:
          - text: Storage optimized family
          - text: Storage optimized types
        explanation:
          text: Storage optimized is for fast reads and writes to local disks.
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized is for data sets held in memory, such as in-memory databases.
      - id: hpc-optimized
        text: HPC optimized
        variants:
          - text: HPC optimized family
          - text: HPC optimized types
        explanation:
          text: HPC (high performance computing) optimized types are for very large, tightly linked computations.
    correct_answers: [hpc-optimized]
    explanation:
      text: |
        HPC optimized (the Hpc types) is the family for high performance computing: very large,
        tightly linked computations such as complex simulations. It is the sixth family in the
        lesson's table, beside general purpose, compute, memory, storage and accelerated.

  - id: q06-type-name-family-letter
    page: guide/06-running-applications/01-ec2.md
    section: Read an instance type's name from left to right
    task: "3.3"
    level: recall
    topics: [instance-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An engineer sees the EC2 instance type `r7g.large` on a bill. Which part of the name tells
        her the instance is memory optimized?
    choices:
      - id: first-letter
        text: The `r` at the start
        variants:
          - text: The first letter, `r`
          - text: The leading letter `r`
        explanation:
          text: The first letter shows the kind of work the type is built for; `r` is memory optimized.
      - id: number
        text: The `7` after the first letter
        variants:
          - text: The number `7` in the middle
          - text: The digit `7` before the `g`
        explanation:
          text: The number is the generation; a higher number is newer.
      - id: variant-letter
        text: The `g` just before the dot
        variants:
          - text: The letter `g` before the dot
          - text: The `g` ending the first part
        explanation:
          text: The `g` is a variant letter, here an AWS Graviton processor.
      - id: size
        text: The `large` after the dot
        variants:
          - text: The part after the dot, `large`
          - text: The word `large` at the end
        explanation:
          text: The part after the dot is the size; it says how much hardware, not what kind of work.
    correct_answers: [first-letter]
    explanation:
      text: |
        Read a type's name from left to right: before the dot come the letter for the kind of work
        (`r`, memory optimized), the generation (`7`) and any variant letters (`g`, Graviton);
        after the dot comes the size (`large`). AWS's naming page calls that first letter the
        series and the whole of `r7g` the family, but either way, the first letter alone tells you
        it is memory optimized.

  - id: q06-purchasing-options-pick-two
    page: guide/06-running-applications/01-ec2.md
    section: Instance types are not purchasing options
    task: "3.3"
    level: recall
    topics: [purchasing-options]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A planning sheet for a new EC2 workload lists five items. Which TWO of them are Amazon EC2
        purchasing options? (Select TWO.)
    choices:
      - id: spot
        text: Spot Instances
        variants:
          - text: EC2 Spot Instances
          - text: Spot
        explanation:
          text: Spot is a way to pay that uses AWS's spare capacity at a discount, for interruptible work.
      - id: memory-optimized
        text: Memory optimized
        variants:
          - text: Memory optimized family
          - text: Memory optimized types
        explanation:
          text: Memory optimized is an instance family, a kind of hardware, not a way to pay.
      - id: reserved
        text: Reserved Instances
        variants:
          - text: EC2 Reserved Instances
          - text: Reserved Instances (RIs)
        explanation:
          text: Reserved Instances are a way to pay, a commitment to one configuration in return for a lower rate.
      - id: m7g-large
        text: The `m7g.large` type
        variants:
          - text: An `m7g.large`
          - text: Type `m7g.large`
        explanation:
          text: "`m7g.large` is an instance type: hardware you can pay for in any of the ways."
      - id: burstable
        text: Burstable instances
        variants:
          - text: Burstable (T) instances
          - text: Burstable performance types
        explanation:
          text: Burstable describes T instance types, which are hardware, not a way to pay.
    correct_answers: [spot, reserved]
    explanation:
      text: |
        An instance type is hardware; a purchasing option is how you pay for it. On-Demand, Savings
        Plans, Reserved Instances and Spot Instances are purchasing options, and the same type can
        be bought any of those ways. The exam guide's list calls them "instance types", so read
        such a question as being about how you pay.

  - id: q06-purchasing-interruptible-rendering
    page: guide/06-running-applications/01-ec2.md
    section: Instance types are not purchasing options
    task: "4.1"
    level: application
    topics: [purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A studio renders animation frames on EC2 overnight. If a server is taken away, the job
        simply redoes the lost frames later, costing only time. The studio wants the lowest compute
        cost and commits to nothing. Which purchasing option fits best?
    choices:
      - id: on-demand
        text: On-Demand Instances
        variants:
          - text: EC2 On-Demand Instances
          - text: On-Demand
        explanation:
          text: On-Demand needs no commitment either, but it doesn't use the work's tolerance for interruption to cut the cost.
      - id: spot
        text: Spot Instances
        variants:
          - text: EC2 Spot Instances
          - text: Spot
        explanation:
          text: Spot needs no commitment and costs less, and AWS reclaiming a server only delays this job.
      - id: reserved
        text: Reserved Instances
        variants:
          - text: EC2 Reserved Instances
          - text: Reserved Instances (RIs)
        explanation:
          text: Reserved Instances need a 1- or 3-year commitment, which the studio doesn't want.
      - id: savings-plans
        text: Savings Plans
        variants:
          - text: A Savings Plan
          - text: AWS Savings Plans
        explanation:
          text: Savings Plans commit to an hourly dollar amount for 1 or 3 years, which the studio doesn't want.
    correct_answers: [spot]
    hint:
      text: Which option trades the risk of interruption for a lower price?
    explanation:
      text: |
        Spot Instances need no commitment and cost less, but AWS can reclaim them with a short
        warning. That suits flexible work that can be interrupted and resumed, such as rendering
        frames that can be redone.

  - id: q06-purchasing-short-unpredictable-trial
    page: guide/06-running-applications/01-ec2.md
    section: Instance types are not purchasing options
    task: "4.1"
    level: application
    topics: [purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team will run a proof of concept on EC2 for about two weeks. It can't predict how many
        hours the servers will run, the work must not be interrupted, and it wants no commitment.
        Which purchasing option fits?
    choices:
      - id: reserved
        text: Reserved Instances
        variants:
          - text: EC2 Reserved Instances
          - text: Reserved Instances (RIs)
        explanation:
          text: Reserved Instances commit to one configuration for a year or more, far longer than two weeks.
      - id: spot
        text: Spot Instances
        variants:
          - text: EC2 Spot Instances
          - text: Spot
        explanation:
          text: Spot needs no commitment, but AWS can reclaim the servers, and this work must not be interrupted.
      - id: on-demand
        text: On-Demand Instances
        variants:
          - text: EC2 On-Demand Instances
          - text: On-Demand
        explanation:
          text: No commitment, no interruptions, and you pay only for the time the servers run.
      - id: savings-plans
        text: Savings Plans
        variants:
          - text: A Savings Plan
          - text: AWS Savings Plans
        explanation:
          text: Savings Plans commit to an hourly amount for 1 or 3 years, which a two-week trial doesn't justify.
    correct_answers: [on-demand]
    hint:
      text: Three conditions; check each option against all of them.
    explanation:
      text: |
        On-Demand commits you to nothing and isn't reclaimed by AWS; for Linux it bills by the
        second, with a 60-second minimum, while the instance runs. That suits short or
        unpredictable work.

  - id: q06-purchasing-steady-same-configuration
    page: guide/06-running-applications/01-ec2.md
    section: Instance types are not purchasing options
    task: "4.1"
    level: application
    topics: [purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's database server will run around the clock on the same `m7g.large`
        configuration for the next three years. The company wants a lower rate in return for a
        commitment, and AWS must never take the server back. Which choice fits?
    choices:
      - id: on-demand
        text: On-Demand Instances
        variants:
          - text: EC2 On-Demand Instances
          - text: On-Demand
        explanation:
          text: On-Demand has no commitment and no lower rate for one.
      - id: spot
        text: Spot Instances
        variants:
          - text: EC2 Spot Instances
          - text: Spot
        explanation:
          text: Spot is cheap, but AWS can reclaim the server, which this database can't allow.
      - id: memory-optimized
        text: Memory optimized types
        variants:
          - text: Memory optimized family
          - text: Memory optimized instances
        explanation:
          text: That's a change of hardware, not a way to pay; it brings no commitment discount.
      - id: reserved
        text: Reserved Instances
        variants:
          - text: EC2 Reserved Instances
          - text: Reserved Instances (RIs)
        explanation:
          text: A Reserved Instance commits to one instance configuration for 1 or 3 years in return for a lower rate.
    correct_answers: [reserved]
    hint:
      text: Look for the option that matches "one configuration, steady use, a term commitment".
    explanation:
      text: |
        Reserved Instances suit steady use of the same type: you commit to one instance
        configuration for 1 or 3 years and get a lower rate. Module 11 compares them with Savings
        Plans, which commit to a dollar amount instead.

  - id: q06-reserved-changes-only-payment
    page: guide/06-running-applications/01-ec2.md
    section: Instance types are not purchasing options
    task: "4.1"
    level: understanding
    topics: [purchasing-options, instance-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company moves its `m7g.large` web servers from On-Demand to Reserved Instances. What
        changes?
    choices:
      - id: only-payment
        text: How it pays, a lower rate for a term commitment, on the same hardware
        variants:
          - text: The billing, a commitment in return for a lower rate, on identical hardware
          - text: The payment terms, cheaper for a commitment, while the hardware stays
        explanation:
          text: A purchasing option changes the price and the commitment, never the hardware.
      - id: newer-generation
        text: The servers move to a newer generation with more memory at the same price
        variants:
          - text: The servers get a newer generation and more memory for the same price
          - text: The servers move up to a newer generation with more memory for the same price
        explanation:
          text: The hardware stays `m7g.large`; a Reserved Instance is a billing discount, not a machine.
      - id: reclaimable
        text: AWS may now reclaim the servers at short notice when it needs the capacity
        variants:
          - text: AWS can now take the servers back with a short warning when capacity is tight
          - text: The servers become reclaimable by AWS at short notice when it needs them
        explanation:
          text: That describes Spot Instances. Reserved Instances aren't reclaimed.
      - id: new-family
        text: The servers become a different instance family, built for steady workloads
        variants:
          - text: The servers switch to another instance family that is meant for steady use
          - text: The servers join a separate family of types designed for steady workloads
        explanation:
          text: This is the misconception that purchasing options are instance types. The family is still general purpose.
    correct_answers: [only-payment]
    explanation:
      text: |
        The same `m7g.large` can be paid for On-Demand, with a Savings Plan, as a Reserved
        Instance or as Spot. Moving to Reserved Instances commits the company to that configuration
        for 1 or 3 years in return for a lower rate; the servers themselves are unchanged.

  - id: q06-stopped-instance-two-charges
    page: guide/06-running-applications/01-ec2.md
    section: Stopping pauses the instance bill; terminating ends it
    task: "4.1"
    level: understanding
    topics: [instance-states]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A developer stops an EC2 test instance for a two-week holiday. It has an EBS root volume
        and an Elastic IP address attached. Which TWO charges continue while it is stopped?
        (Select TWO.)
    choices:
      - id: ebs-storage
        text: Storage for its EBS volume
        variants:
          - text: The EBS volume's storage
          - text: Its EBS root volume's storage
        explanation:
          text: EBS volumes bill for as long as they exist, running or stopped.
      - id: instance-hours
        text: Instance-hour charges
        variants:
          - text: Its hourly instance time
          - text: Instance time by the hour
        explanation:
          text: Instance time is billed only while the instance runs; stopping ends it.
      - id: elastic-ip
        text: The Elastic IP address
        variants:
          - text: Its Elastic IP address
          - text: The Elastic IP it keeps
        explanation:
          text: An Elastic IP address is charged until you release it, even while the instance is stopped.
      - id: standby-fee
        text: A daily fee for being stopped
        variants:
          - text: A per-day stopped-state fee
          - text: A daily standby charge
        explanation:
          text: There is no such fee; the continuing charges are the disk and the kept address.
      - id: instance-store
        text: Storage for its instance store
        variants:
          - text: The instance store's storage
          - text: Its instance store disk space
        explanation:
          text: Instance store is erased when the instance stops; it isn't billed separately as storage.
    correct_answers: [ebs-storage, elastic-ip]
    explanation:
      text: |
        A stopped instance doesn't cost nothing. Stopping ends the instance-time charge, but EBS
        volumes are billed while they exist and an Elastic IP address until it is released. To end
        every charge, terminate the instance, check its volumes are gone and release the address.

  - id: q06-stop-start-public-address
    page: guide/06-running-applications/01-ec2.md
    section: Stopping pauses the instance bill; terminating ends it
    task: "3.3"
    level: understanding
    topics: [instance-states]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A web server on EC2 uses the public IPv4 address that AWS assigned automatically at launch.
        The server is stopped overnight and started the next morning. What happens to its public
        address?
    choices:
      - id: keeps-same
        text: It keeps the same address, because a stop releases nothing at all
        variants:
          - text: It comes back with the same address, since stopping releases nothing
          - text: The address stays the same, as a stop doesn't release anything
        explanation:
          text: The automatically assigned address is released on stop, so it doesn't come back the same.
      - id: new-address
        text: It gets a different address; a fixed one needs an Elastic IP address
        variants:
          - text: It comes back with a new address; keeping one needs an Elastic IP
          - text: The address changes; an Elastic IP address would stay fixed
        explanation:
          text: The automatic address is released on stop and a new one is assigned on start. An Elastic IP address stays yours.
      - id: none-until-relaunch
        text: It gets no public address until it is launched again from its AMI
        variants:
          - text: It has no public address until relaunched from its AMI
          - text: It stays without a public address until a fresh launch from its AMI
        explanation:
          text: A restarted instance gets a new automatic address; no relaunch is needed.
      - id: same-free
        text: It keeps the same address, and AWS stops charging for it while stopped
        variants:
          - text: The address stays the same, and it is free while the server is stopped
          - text: It comes back with the same address, which isn't billed while stopped
        explanation:
          text: That describes neither kind of address. An automatic address is released; an Elastic IP keeps billing.
    correct_answers: [new-address]
    explanation:
      text: |
        An address AWS assigns automatically stays with an instance only until it is stopped or
        terminated; on start it gets a new one. An Elastic IP address is a fixed public address you
        keep, and it is charged until you release it.

  - id: q06-end-every-charge-for-old-server
    page: guide/06-running-applications/01-ec2.md
    section: Stopping pauses the instance bill; terminating ends it
    task: "4.1"
    level: application
    topics: [instance-states]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team has finished a project and will never need its EC2 test server again. It wants every
        charge for the server to end. What should it do?
    choices:
      - id: stop
        text: Stop the instance, so it no longer bills for instance hours or anything else
        variants:
          - text: Stop it, which ends the instance-hour charge and every other charge for it
          - text: Put it in the stopped state, so neither its hours nor anything else is billed
        explanation:
          text: Stopping ends instance-time charges, but the EBS volume and any Elastic IP keep billing.
      - id: smaller-type
        text: Change it to the smallest instance type, so its hourly rate drops close to zero
        variants:
          - text: Resize it to the smallest instance type, so the hourly rate is almost nothing
          - text: Move it to the smallest type available, so it costs next to nothing an hour
        explanation:
          text: A smaller type still bills while it runs, and the disk still bills; nothing ends.
      - id: terminate
        text: Terminate it, then check its volume is gone and release any Elastic IP
        variants:
          - text: Terminate it, confirm its volume was deleted, and release any Elastic IP
          - text: Terminate the instance, check the volume is gone, release any Elastic IP
        explanation:
          text: Termination ends instance charges for good; checking the volume and releasing the address ends the rest.
      - id: spot
        text: Switch it to Spot pricing, so it bills only in the hours AWS lends it capacity
        variants:
          - text: Move it to Spot pricing, so it is billed only when AWS has spare capacity
          - text: Pay for it as a Spot Instance, so charges arise only when capacity is spare
        explanation:
          text: Spot is a cheaper way to pay for running instances; it doesn't end charges for one nobody needs.
    correct_answers: [terminate]
    hint:
      text: Which state is permanent, and what can outlive the instance itself?
    explanation:
      text: |
        Terminating deletes the instance for good, along with volumes set to delete on termination.
        Stopping only pauses the instance bill: the disk and any Elastic IP address still cost
        money. Check that the volume is gone and release any Elastic IP to bring the charges to
        zero.

  - id: q06-ec2-customer-tasks-pick-two
    page: guide/06-running-applications/01-ec2.md
    section: Your side of the line on EC2
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, ec2-instances]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company runs its website on Amazon EC2 instances. Under the AWS shared responsibility
        model, which TWO tasks are the company's? (Select TWO.)
    choices:
      - id: patch-guest-os
        text: Patching the guest operating system
        variants:
          - text: Installing patches on the instances' operating system
          - text: Keeping the instances' guest OS patched
        explanation:
          text: On EC2 the guest operating system, and its security patches, are the customer's.
      - id: host-hardware
        text: Replacing failed disks in the physical hosts
        variants:
          - text: Repairing the physical servers' hardware
          - text: Swapping out failed physical host parts
        explanation:
          text: Physical hardware is always AWS's side of the line.
      - id: security-group-rules
        text: Writing the instances' security group rules
        variants:
          - text: Deciding which ports the security group opens
          - text: Setting who may connect, in the security group
        explanation:
          text: Security group rules are settings, and settings are the customer's.
      - id: virtualization
        text: Maintaining the hosts' virtualization layer
        variants:
          - text: Patching the hypervisor on the physical hosts
          - text: Keeping the host virtualization software updated
        explanation:
          text: The host and its virtualization are AWS's, under the instance.
      - id: building
        text: Guarding the data center buildings
        variants:
          - text: Securing the data center facilities
          - text: Controlling entry to the data centers
        explanation:
          text: Physical security of AWS's facilities is AWS's responsibility.
    correct_answers: [patch-guest-os, security-group-rules]
    explanation:
      text: |
        EC2 puts more on the customer's side than any other compute service, because the customer
        runs the operating system. AWS looks after the buildings, hardware, hosts and
        virtualization; the customer patches the guest OS, installs and updates its software, and
        sets the security group rules, sign-in method, encryption and backups.

  - id: q06-what-the-ami-decides
    page: guide/06-running-applications/01-ec2.md
    section: An instance is a virtual server started from an image
    task: "3.3"
    level: recall
    topics: [ec2-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        When you launch an EC2 instance, what does the Amazon Machine Image (AMI) you choose
        decide?
    choices:
      - id: vcpus-memory
        text: How many vCPUs and how much memory the instance gets
        variants:
          - text: The instance's number of vCPUs and amount of memory
          - text: How much processor and memory the instance receives
        explanation:
          text: That is the instance type's job, such as `t3.micro` or `r7g.large`.
      - id: open-ports
        text: Which ports are open to incoming network traffic
        variants:
          - text: Which ports incoming traffic is allowed to reach
          - text: Which network ports accept incoming connections
        explanation:
          text: That is decided by the security group's rules.
      - id: how-you-pay
        text: Whether you pay On-Demand or with a Reserved Instance
        variants:
          - text: Whether it is billed On-Demand or as a Reserved Instance
          - text: Whether you pay for it On-Demand or through a reservation
        explanation:
          text: That is the purchasing option, which the image has nothing to do with.
      - id: os-and-software
        text: The operating system and software the instance starts with
        variants:
          - text: Which operating system and software are on the new instance
          - text: The operating system and preinstalled software it boots with
        explanation:
          text: An AMI is a template holding the operating system and any preinstalled software.
    correct_answers: [os-and-software]
    explanation:
      text: |
        An AMI is the template an instance starts from: an operating system plus any preinstalled
        software. Launching also involves four other choices: the instance type (hardware), storage,
        the network and security group, and how you sign in.

  - id: q06-why-build-your-own-ami
    page: guide/06-running-applications/01-ec2.md
    section: An instance is a virtual server started from an image
    task: "3.3"
    level: understanding
    topics: [ec2-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company sets up each new web server by hand, installing the same software every time.
        Which is the main benefit of building its own AMI instead?
    choices:
      - id: identical-copies
        text: Every instance started from it is identical and ready in minutes, so copies can launch automatically
        variants:
          - text: Each server launched from it is the same and ready in minutes, so new copies can start automatically
          - text: All instances from it come up identical within minutes, so copies can be launched without anyone acting
        explanation:
          text: That is what an image is for, and it is how Auto Scaling adds servers in lesson 06.02.
      - id: cheaper-hours
        text: Instances started from a custom image are billed at a lower hourly rate than those from AWS images
        variants:
          - text: Servers launched from your own image cost less per hour than servers from AWS's images
          - text: An instance from a custom AMI has a lower hourly price than one from an AWS-provided AMI
        explanation:
          text: The image doesn't set the hourly rate; the instance type and purchasing option do.
      - id: more-memory
        text: Instances started from it get more memory and processor power than the type normally provides
        variants:
          - text: Servers launched from it receive more memory and processing than their type would give
          - text: An instance from it has more memory and CPU than its instance type normally includes
        explanation:
          text: Hardware comes from the instance type; an image holds only software.
      - id: no-patching
        text: Instances started from it never need operating system patches again, because AWS maintains them
        variants:
          - text: Servers launched from it need no further OS patches, since AWS keeps them up to date
          - text: An instance from it is kept patched by AWS, so the company no longer patches the OS
        explanation:
          text: The guest OS stays the customer's to patch; a good practice is to rebuild the image from patched software.
    correct_answers: [identical-copies]
    explanation:
      text: |
        Ten instances started from one AMI are identical, with no setup steps to forget. That lets
        servers be added in minutes, and lets Amazon EC2 Auto Scaling launch new copies
        automatically. Building compute from a known, patched image is also a security best
        practice.

  - id: q06-volume-left-after-terminate
    page: guide/06-running-applications/06-lab-08-launch-and-terminate-an-instance.md
    section: "Part C: terminate, and prove it's gone (on your own)"
    task: "4.1"
    level: understanding
    topics: [instance-states]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After terminating an EC2 instance, a learner finds that its root volume is still listed
        under Volumes and still billing. The instance shows as terminated. What is the most likely
        reason?
    choices:
      - id: thirty-days
        text: Terminated instances keep their volumes for a month in case they are restarted
        variants:
          - text: A terminated instance's volumes are kept for a month so it can be restarted
          - text: Volumes of terminated instances stay for a month in case of a restart
        explanation:
          text: Termination is permanent; there is no restart and no holding period.
      - id: delete-on-termination-no
        text: The volume's delete on termination setting was No, so it stayed behind
        variants:
          - text: Delete on termination was set to No for the volume, so it was kept
          - text: Its delete on termination flag was off, so the volume wasn't removed
        explanation:
          text: Only volumes set to delete on termination are deleted with the instance; others stay, and bill, until you delete them.
      - id: encryption-keeps
        text: EBS encryption by default makes AWS keep encrypted volumes after termination
        variants:
          - text: Encryption by default causes encrypted volumes to be kept after termination
          - text: Encrypted volumes are always kept after termination when encryption is default
        explanation:
          text: Encryption protects the data; it doesn't change what happens to the volume at termination.
      - id: security-group-first
        text: Volumes are deleted only after the instance's security group has been deleted
        variants:
          - text: A volume isn't removed until the instance's security group is deleted too
          - text: The security group must be deleted before the instance's volume can go
        explanation:
          text: Security groups filter network traffic; they have nothing to do with volume deletion.
    correct_answers: [delete-on-termination-no]
    hint:
      text: Lab 08 asked you to look at one storage setting before launching.
    explanation:
      text: |
        Terminating deletes the volumes set to delete on termination, along with any instance
        store data. A volume with that setting at No outlives the instance and keeps billing until
        you delete it, which is why Lab 08 checks the Volumes list after terminating.

  # ---------------------------------------------------------------- 06.02 Auto Scaling and load balancers

  - id: q06-capacity-follows-ticket-sales
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
    level: understanding
    topics: [auto-scaling, elasticity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ticketing website's traffic jumps tenfold when a popular concert goes on sale, then falls
        back within hours. The company wants the number of EC2 web servers to follow that demand up
        and down without anyone acting. Which service does that?
    choices:
      - id: elb
        text: Elastic Load Balancing
        variants:
          - text: Elastic Load Balancing (ELB)
          - text: An Elastic Load Balancing setup
        explanation:
          text: A load balancer spreads requests across the servers that exist; it doesn't add or remove any.
      - id: batch
        text: AWS Batch
        variants:
          - text: The AWS Batch service
          - text: AWS Batch job queues
        explanation:
          text: Batch runs queues of unattended jobs, not a website's web servers.
      - id: ec2-auto-scaling
        text: Amazon EC2 Auto Scaling
        variants:
          - text: EC2 Auto Scaling
          - text: An EC2 Auto Scaling group
        explanation:
          text: It launches instances when demand rises and terminates them when it falls.
      - id: lightsail
        text: Amazon Lightsail
        variants:
          - text: Lightsail
          - text: An Amazon Lightsail plan
        explanation:
          text: Lightsail sells simple servers at a fixed monthly price; it doesn't grow and shrink a fleet with demand.
    correct_answers: [ec2-auto-scaling]
    hint:
      text: Which service changes how many servers exist?
    explanation:
      text: |
        Capacity that follows demand up and down without anyone acting is elasticity, and for EC2
        it comes from Amazon EC2 Auto Scaling. The exam guide lists the related AWS Auto Scaling;
        for "auto scaling provides elasticity", either name points to the same idea.

  - id: q06-auto-scaling-and-elb-divide-work
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Auto Scaling changes how many; the load balancer chooses which
    task: "3.3"
    level: understanding
    topics: [auto-scaling, load-balancers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs its web servers in an Auto Scaling group behind a load balancer. Which
        statement correctly describes how the two services divide the work?
    choices:
      - id: lb-adds
        text: The load balancer adds servers as demand rises; Auto Scaling routes each request
        variants:
          - text: The load balancer launches servers for demand; Auto Scaling sends each request
          - text: New servers come from the load balancer; requests are routed by Auto Scaling
        explanation:
          text: This reverses the two jobs.
      - id: asg-spreads
        text: Auto Scaling spreads each request across servers; the load balancer replaces failures
        variants:
          - text: Auto Scaling shares out the requests; the load balancer replaces failed servers
          - text: Requests are spread by Auto Scaling; failed servers are replaced by the load balancer
        explanation:
          text: This is the misconception that Auto Scaling spreads traffic. It changes the count and replaces failed instances.
      - id: both-spread
        text: Both spread requests across servers; Auto Scaling also caches pages at the edge
        variants:
          - text: Each one spreads requests; Auto Scaling also caches pages at edge locations
          - text: The two both share out requests, and Auto Scaling caches pages near users
        explanation:
          text: Only the load balancer spreads requests, and caching at edge locations is CloudFront's job.
      - id: count-and-route
        text: Auto Scaling sets how many servers run; the load balancer picks which gets each request
        variants:
          - text: Auto Scaling decides the number of servers; the load balancer routes each request
          - text: The count of servers is Auto Scaling's job; choosing one per request is the load balancer's
        explanation:
          text: One service handles the count, the other handles each request.
    correct_answers: [count-and-route]
    explanation:
      text: |
        Amazon EC2 Auto Scaling answers "how many instances, and where?"; Elastic Load Balancing
        answers "which healthy instance gets this request?". They work as a team: Auto Scaling
        registers each new instance with the load balancer and deregisters the ones it terminates.

  - id: q06-auto-scaling-jobs-pick-two
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
    level: understanding
    topics: [auto-scaling]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which TWO jobs does Amazon EC2 Auto Scaling do for a group of instances? (Select TWO.)
    choices:
      - id: replace-unhealthy
        text: Replaces instances that fail the group's health checks
        variants:
          - text: Swaps out instances the group finds unhealthy
          - text: Launches replacements for instances it marks unhealthy
        explanation:
          text: The group heals itself to keep its desired capacity. By default it checks EC2 status; it also acts on the load balancer's health checks only if you turn those on for the group.
      - id: route-requests
        text: Sends each incoming request to a healthy instance
        variants:
          - text: Routes every request to an instance that is healthy
          - text: Picks a healthy instance for each new request
        explanation:
          text: That is the load balancer's job, not Auto Scaling's.
      - id: balance-azs
        text: Spreads the instances evenly across the chosen AZs
        variants:
          - text: Keeps instances balanced across the selected AZs
          - text: Distributes instances evenly over the chosen AZs
        explanation:
          text: Balancing across Availability Zones means one zone's failure leaves the others running.
      - id: decrypt-https
        text: Decrypts HTTPS traffic using a certificate
        variants:
          - text: Handles HTTPS decryption with a certificate
          - text: Decrypts HTTPS requests with an attached certificate
        explanation:
          text: A load balancer can decrypt HTTPS with a certificate from AWS Certificate Manager; Auto Scaling doesn't.
      - id: cache-edge
        text: Caches content at edge locations near users
        variants:
          - text: Keeps copies of content at edge locations
          - text: Serves cached content from the edge near users
        explanation:
          text: Caching at edge locations is Amazon CloudFront's job.
    correct_answers: [replace-unhealthy, balance-azs]
    explanation:
      text: |
        Amazon EC2 Auto Scaling does three jobs: it follows demand by changing the desired
        capacity, it replaces instances that are terminated or impaired, and it balances instances
        across the Availability Zones you choose. Its health checks are EC2 status checks by
        default; it replaces instances that fail the load balancer's checks only when ELB health
        checks are turned on for the group. Routing requests and decrypting HTTPS belong to the
        load balancer.

  - id: q06-load-balancer-provides-pick-two
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: A load balancer sends each request to a healthy instance
    task: "3.3"
    level: understanding
    topics: [load-balancers]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company puts Elastic Load Balancing in front of its EC2 web servers. Which TWO does the
        load balancer provide? (Select TWO.)
    choices:
      - id: one-address
        text: One address for customers, however many servers are behind it
        variants:
          - text: A single front door for users, whatever the number of servers
          - text: One address users connect to, regardless of the server count
        explanation:
          text: Customers use one address while servers come and go behind it.
      - id: launch-instances
        text: New instances launched when average processor use rises
        variants:
          - text: Extra instances started when average CPU use climbs
          - text: Instances added automatically as processor load goes up
        explanation:
          text: Launching instances is Amazon EC2 Auto Scaling's job.
      - id: healthy-only
        text: Requests sent only to targets that pass their health checks
        variants:
          - text: Traffic routed only to targets passing health checks
          - text: Requests kept away from targets that fail health checks
        explanation:
          text: It runs health checks and routes only to healthy targets.
      - id: bigger-type
        text: A larger instance type chosen whenever traffic grows
        variants:
          - text: A bigger instance type picked each time traffic rises
          - text: Instances resized to a larger type as traffic increases
        explanation:
          text: Neither service changes instance types; the type comes from the launch template.
      - id: forecast
        text: A forecast of tomorrow's traffic from past patterns
        variants:
          - text: A prediction of the next day's traffic from history
          - text: Tomorrow's traffic forecast from earlier patterns
        explanation:
          text: Forecasting is predictive scaling, part of Auto Scaling.
    correct_answers: [one-address, healthy-only]
    explanation:
      text: |
        A load balancer is one front door that spreads incoming requests across targets in one or
        more Availability Zones, sending them only to targets that pass its health checks. AWS
        scales the load balancer itself, and it can decrypt HTTPS so the servers don't have to.

  - id: q06-why-minimum-of-two
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: "Worked example: the bakery's December"
    task: "1.1"
    level: understanding
    topics: [auto-scaling, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        One web server can handle a company's overnight traffic, yet its Auto Scaling group keeps a
        minimum of 2 instances, one in each of two Availability Zones. Why?
    choices:
      - id: survive-loss
        text: So that losing one server or one AZ still leaves a server taking requests
        variants:
          - text: So a failed server or a lost AZ still leaves one server answering requests
          - text: So that if a server or an AZ fails, another server keeps taking requests
        explanation:
          text: One instance per zone is the price of high availability.
      - id: aws-requires-two
        text: Because Auto Scaling groups can't be created with fewer than two instances
        variants:
          - text: Because AWS doesn't allow an Auto Scaling group with fewer than two instances
          - text: Because an Auto Scaling group must always contain at least two instances
        explanation:
          text: The minimum is the company's choice; it is set at 2 for availability, not because AWS requires it.
      - id: lb-needs-two
        text: Because a load balancer can't send traffic to a group of only one instance
        variants:
          - text: Because a load balancer won't route traffic to a single-instance group
          - text: Because load balancers need at least two instances to send traffic to
        explanation:
          text: A load balancer can route to one target; the second instance is about surviving a failure.
      - id: half-rate
        text: So that the two servers share the cost and each bills at half the rate
        variants:
          - text: So that the bill is split, with each of the two servers at half price
          - text: So that each server is charged half the rate, as the two share the cost
        explanation:
          text: Each instance bills at its full rate; the second one is an extra cost paid for availability.
    correct_answers: [survive-loss]
    explanation:
      text: |
        With every server in one place, losing that server or its Availability Zone stops the site.
        A minimum of one instance per AZ means a failure still leaves a server running, and the
        extra overnight server is the price of high availability.

  - id: q06-why-set-a-maximum
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
    level: understanding
    topics: [auto-scaling]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Why does a company set a maximum capacity on its Auto Scaling group?
    choices:
      - id: survive-az
        text: To make sure the site stays up if an Availability Zone fails
        variants:
          - text: To keep the site running when an Availability Zone goes down
          - text: To guarantee the site survives the failure of an Availability Zone
        explanation:
          text: Surviving an AZ failure comes from the minimum spread across zones, not the maximum.
      - id: cap-cost
        text: To cap the cost if a fault or a flood of bots drives demand up
        variants:
          - text: To limit spending if a fault or bot traffic pushes the measure up
          - text: To put a ceiling on cost if a fault or a bot flood inflates demand
        explanation:
          text: The group can never run more instances than you are willing to pay for.
      - id: starting-count
        text: To set how many instances the group runs when it is first created
        variants:
          - text: To decide the number of instances the group starts out with
          - text: To fix how many instances run when the group is first launched
        explanation:
          text: The number the group aims for right now is the desired capacity.
      - id: limit-requests
        text: To limit how many requests per second the load balancer accepts
        variants:
          - text: To cap the number of requests a second the load balancer takes
          - text: To restrict how many requests per second reach the load balancer
        explanation:
          text: The maximum limits instances, not the requests the load balancer handles.
    correct_answers: [cap-cost]
    explanation:
      text: |
        An Auto Scaling group stays between a minimum and a maximum, at the desired capacity in
        between. The minimum is the floor kept for availability; the maximum is a ceiling, so a
        fault or a flood of unwanted traffic can't drive the bill up without limit.

  - id: q06-scale-on-average-cpu
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
    level: application
    topics: [auto-scaling, scaling-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company wants its Auto Scaling group to add instances when average processor use climbs
        above about 50% and remove them when it falls back, with no times set in advance. Which way
        of scaling fits?
    choices:
      - id: scheduled
        text: Scheduled scaling
        variants:
          - text: Scaling on a schedule
          - text: A scheduled scaling setup
        explanation:
          text: Scheduled scaling changes capacity at times you set, and the company wants no times.
      - id: predictive
        text: Predictive scaling
        variants:
          - text: Forecast-based scaling
          - text: A predictive scaling setup
        explanation:
          text: Predictive scaling acts on a forecast from past patterns, not on keeping a measure near a value.
      - id: target-tracking
        text: Target tracking
        variants:
          - text: Target tracking scaling
          - text: A target tracking setup
        explanation:
          text: Target tracking adds or removes instances to keep a measure, such as average CPU, near a value.
      - id: manual
        text: Manual scaling
        variants:
          - text: Scaling by hand
          - text: A manual scaling setup
        explanation:
          text: Manual scaling needs someone to change the desired capacity each time.
    correct_answers: [target-tracking]
    hint:
      text: The rule is "keep this measure near this value".
    explanation:
      text: |
        Target tracking keeps a measure such as average processor use near a value you set, adding
        instances when it climbs and removing them when it falls. It is the usual choice for most
        websites.

  - id: q06-scale-for-a-known-opening-time
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
    level: application
    topics: [auto-scaling, scaling-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's course sign-up site opens at 09:00 on a date announced months ahead, and
        traffic surges at that moment. The team wants extra instances already running just before
        09:00 on that date, without anyone acting at the time. Which way of scaling fits best?
    choices:
      - id: target-tracking
        text: Target tracking
        variants:
          - text: Target tracking scaling
          - text: A target tracking setup
        explanation:
          text: Target tracking reacts after the load rises, so new instances arrive a little late.
      - id: predictive
        text: Predictive scaling
        variants:
          - text: Forecast-based scaling
          - text: A predictive scaling setup
        explanation:
          text: Predictive scaling learns daily or weekly patterns from past traffic; a once-a-term opening isn't one.
      - id: manual
        text: Manual scaling
        variants:
          - text: Scaling by hand
          - text: A manual scaling setup
        explanation:
          text: Manual scaling needs someone to act at the time, which the team wants to avoid.
      - id: scheduled
        text: Scheduled scaling
        variants:
          - text: Scaling on a schedule
          - text: A scheduled scaling setup
        explanation:
          text: Scheduled scaling changes capacity at a time you set, which fits a known event.
    correct_answers: [scheduled]
    hint:
      text: The team knows the exact moment in advance.
    explanation:
      text: |
        Scheduled scaling changes capacity at times you set, which suits known events such as
        opening hours or an announced launch. Keeping target tracking as well catches anything the
        schedule misses.

  - id: q06-scale-ahead-of-daily-lunch-rush
    page: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
    section: "Decision 5: the lunch rush arrives on time, every day"
    task: "1.1"
    level: application
    topics: [auto-scaling, scaling-policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A food-delivery site's traffic rises sharply at lunchtime every day. Its target tracking
        policy reacts, but new instances take minutes to start, so they arrive late. The team wants
        AWS to learn the daily pattern from past traffic and add capacity before the rush, without
        setting times by hand. What should it add?
    choices:
      - id: predictive
        text: Predictive scaling
        variants:
          - text: Forecast-based scaling
          - text: A predictive scaling setup
        explanation:
          text: Predictive scaling forecasts traffic from past patterns and starts instances early.
      - id: scheduled
        text: Scheduled scaling
        variants:
          - text: Scaling on a schedule
          - text: A scheduled scaling setup
        explanation:
          text: A schedule would also scale ahead, but someone has to set the times, which the team wants to avoid.
      - id: manual
        text: Manual scaling
        variants:
          - text: Scaling by hand
          - text: A manual scaling setup
        explanation:
          text: Manual scaling needs someone to act every day.
    correct_answers: [predictive]
    hint:
      text: Which way of scaling learns from history?
    explanation:
      text: |
        Predictive scaling forecasts traffic from past daily or weekly patterns and adds capacity
        before the rise arrives, allowing for the minutes an instance needs to start. Keep target
        tracking alongside it for surprises the forecast misses.

  - id: q06-load-balancer-for-web-and-lambda
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Choose ALB, NLB or GWLB; Classic is the previous generation
    task: "3.3"
    level: application
    topics: [load-balancers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's online store receives HTTPS requests. It wants one load balancer that routes
        requests by the page address, sending some paths to EC2 instances and others to Lambda
        functions. Which load balancer type fits?
    choices:
      - id: nlb
        text: Network Load Balancer
        variants:
          - text: Network Load Balancer (NLB)
          - text: A Network Load Balancer
        explanation:
          text: An NLB works with TCP, UDP and TLS connections, not web addresses.
      - id: alb
        text: Application Load Balancer
        variants:
          - text: Application Load Balancer (ALB)
          - text: An Application Load Balancer
        explanation:
          text: An ALB handles HTTP and HTTPS, can route by the page address and can send requests to Lambda functions.
      - id: gwlb
        text: Gateway Load Balancer
        variants:
          - text: Gateway Load Balancer (GWLB)
          - text: A Gateway Load Balancer
        explanation:
          text: A GWLB passes traffic through virtual appliances such as firewalls.
      - id: classic
        text: Classic Load Balancer
        variants:
          - text: Classic Load Balancer (CLB)
          - text: A Classic Load Balancer
        explanation:
          text: Classic is the previous generation, which AWS recommends moving away from.
    correct_answers: [alb]
    hint:
      text: Which type understands web requests, down to the page address?
    explanation:
      text: |
        The Application Load Balancer is the type for web requests (HTTP, HTTPS and gRPC). It can
        route by the page address and can send requests to Lambda functions as well as to
        instances.

  - id: q06-load-balancer-tcp-fixed-ip
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Choose ALB, NLB or GWLB; Classic is the previous generation
    task: "3.3"
    level: application
    topics: [load-balancers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A trading platform accepts TCP connections from partner systems at very high volume and
        needs the lowest possible delay. The partners' firewalls only allow connections to fixed IP
        addresses. Which load balancer type fits?
    choices:
      - id: alb
        text: Application Load Balancer
        variants:
          - text: Application Load Balancer (ALB)
          - text: An Application Load Balancer
        explanation:
          text: An ALB is for web requests such as HTTP and HTTPS, and routes by page address.
      - id: gwlb
        text: Gateway Load Balancer
        variants:
          - text: Gateway Load Balancer (GWLB)
          - text: A Gateway Load Balancer
        explanation:
          text: A GWLB is for passing traffic through appliances such as firewalls.
      - id: nlb
        text: Network Load Balancer
        variants:
          - text: Network Load Balancer (NLB)
          - text: A Network Load Balancer
        explanation:
          text: TCP connections, very high volume with very low delay, and a fixed IP address all point to the NLB.
      - id: classic
        text: Classic Load Balancer
        variants:
          - text: Classic Load Balancer (CLB)
          - text: A Classic Load Balancer
        explanation:
          text: Classic is the previous generation; don't pick it for new work.
    correct_answers: [nlb]
    hint:
      text: The traffic is connections, not web pages.
    explanation:
      text: |
        The Network Load Balancer handles connections (TCP, UDP and TLS). Choose it for very high
        volume with very low delay, or when you need a fixed IP address.

  - id: q06-load-balancer-for-firewall-appliances
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Choose ALB, NLB or GWLB; Classic is the previous generation
    task: "3.3"
    level: recall
    topics: [load-balancers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company must pass all traffic entering its network through a fleet of third-party virtual
        firewall appliances, and wants that fleet to scale and stay available. Which load balancer
        type is built for this?
    choices:
      - id: alb
        text: Application Load Balancer
        variants:
          - text: Application Load Balancer (ALB)
          - text: An Application Load Balancer
        explanation:
          text: An ALB spreads web requests across web targets; it isn't built to pass traffic through appliances.
      - id: nlb
        text: Network Load Balancer
        variants:
          - text: Network Load Balancer (NLB)
          - text: A Network Load Balancer
        explanation:
          text: An NLB handles high-volume TCP and UDP connections to targets, not traffic passed through appliances.
      - id: classic
        text: Classic Load Balancer
        variants:
          - text: Classic Load Balancer (CLB)
          - text: A Classic Load Balancer
        explanation:
          text: Classic is the previous generation and has no appliance role.
      - id: gwlb
        text: Gateway Load Balancer
        variants:
          - text: Gateway Load Balancer (GWLB)
