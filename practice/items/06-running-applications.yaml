        variants:
          - text: EC2 Auto Scaling
          - text: An EC2 Auto Scaling group
        explanation:
          text: EC2 Auto Scaling adjusts EC2 instances, which the company would then manage.
      - id: fargate
        text: AWS Fargate
        variants:
          - text: Fargate
          - text: The AWS Fargate service
        explanation:
          text: Fargate supplies the compute with no servers to pick, scale or patch.
      - id: batch
