      - id: busiest-instance
        text: From the busiest running instance
        variants:
          - text: From the instance with the most load
          - text: From whichever instance is busiest
        explanation:
          text: New instances aren't copied from running ones; they come from the template.
    correct_answers: [launch-template]
    explanation:
      text: |
        A launch template holds the settings for each new instance: the AMI, the instance type, the
        security group and the other launch choices from lesson 06.01. Because every instance comes
        from the same recipe, they are identical.

  - id: q06-scaling-tier-customer-pick-two
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
