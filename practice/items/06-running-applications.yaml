    correct_answers: [gwlb]
    hint:
      text: The traffic passes through something on its way, rather than ending at a web server.
    explanation:
      text: |
        The Gateway Load Balancer is for running third-party virtual appliances, such as firewalls
        or intrusion detection, so they scale and stay available. It is the first question on the
        lesson's flowchart: must traffic pass through appliances?

  - id: q06-classic-load-balancer-for-new-work
    revision: 2
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Choose ALB, NLB or GWLB; Classic is the previous generation
    task: "3.3"
    level: application
    topics: [load-balancers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A florist's online shop was set up years ago behind a Classic Load Balancer. The owner's
        nephew is now building a second HTTPS storefront and plans to copy the old setup exactly.
        What is the best advice?
    choices:
      - id: use-current-type
        text: Put the new storefront behind an Application Load Balancer, a current type
        variants:
          - text: Use an Application Load Balancer, one of the current types, for the new site
          - text: Front the new storefront with an Application Load Balancer, a current type
        explanation:
          text: Classic is the previous generation, and AWS recommends a current type; for HTTPS web traffic that is the Application Load Balancer.
      - id: copy-classic
        text: Copy the old setup, since Classic is still the recommended type for websites
        variants:
          - text: Reuse the Classic setup, since it remains the recommended type for websites
          - text: Keep to Classic, because it is still the type AWS recommends for websites
        explanation:
          text: AWS calls Classic the previous generation and recommends moving to a current type, so it isn't the choice for new work.
      - id: cloudfront-instead
        text: Drop load balancing and use Amazon CloudFront, which took over Classic's job
        variants:
          - text: Skip a load balancer and use Amazon CloudFront, Classic's replacement
          - text: Use Amazon CloudFront instead, since it replaced the Classic Load Balancer
        explanation:
          text: CloudFront caches content at edge locations; it didn't replace any load balancer type, and it doesn't health-check servers behind one address.
      - id: auto-scaling-instead
        text: Drop load balancing and let EC2 Auto Scaling hand out requests to servers
        variants:
          - text: Skip a load balancer and have EC2 Auto Scaling spread the requests
          - text: Let EC2 Auto Scaling share out requests instead of a load balancer
        explanation:
          text: Auto Scaling changes how many servers run; it never routes requests. That is the load balancer's job.
    correct_answers: [use-current-type]
    hint:
      text: Which generation is Classic, and which current type handles web requests?
    explanation:
      text: |
        Elastic Load Balancing has three current types: ALB, NLB and GWLB. The Classic Load
        Balancer is the previous generation, and AWS recommends moving to a current type, so
        recognize the name in older setups but don't copy it for new work. An HTTPS storefront is
        web traffic, which is the Application Load Balancer's job.

  - id: q06-single-az-web-tier-risk
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: "Worked example: the bakery's December"
    task: "1.1"
    level: understanding
    topics: [high-availability, auto-scaling]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's web tier uses an Auto Scaling group behind an Application Load Balancer, but
        every instance runs in one Availability Zone "to keep it simple". What does this design
        give up?
    choices:
      - id: elasticity
        text: Elasticity, since the group can no longer add instances as demand rises
        variants:
          - text: Elasticity, because the group stops adding instances when demand grows
          - text: Elasticity, as the group can't launch more instances when load climbs
        explanation:
          text: Auto Scaling still follows demand inside the one zone, so the design stays elastic.
      - id: high-availability
        text: High availability, since if that zone fails no healthy instance is left
        variants:
          - text: High availability, because a failure of that zone leaves no healthy instance
          - text: High availability, as losing that one zone leaves nothing healthy to serve
        explanation:
          text: With every instance in one zone, the zone is a single point of failure.
      - id: https
        text: HTTPS, since a load balancer in a single zone can't decrypt traffic
        variants:
          - text: HTTPS, because a single-zone load balancer can't handle encryption
          - text: HTTPS, as a load balancer used in one zone can't decrypt requests
        explanation:
          text: Decrypting HTTPS doesn't depend on how many zones the instances use.
      - id: health-checks
        text: Health checks, since they only run when instances span several zones
        variants:
          - text: Health checks, because they run only for instances in several zones
          - text: Health checks, as they work only when instances are in several zones
        explanation:
          text: Health checks run in one zone too; they just have nowhere else to send traffic when the zone fails.
    correct_answers: [high-availability]
    hint:
      text: The design still follows demand. What happens if the zone itself goes down?
    explanation:
      text: |
        Elasticity comes from Auto Scaling, which still works here. High availability comes from
        running in several Availability Zones; with every instance in one zone, losing that zone
        leaves the load balancer nowhere healthy to send requests.

  - id: q06-zone-fails-at-peak-pick-two
    page: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
    section: "Decision 4: AZ b fails at 12:00"
    task: "1.1"
    level: understanding
    topics: [high-availability, auto-scaling, load-balancers]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company's Auto Scaling group spans two Availability Zones behind a load balancer, and the
        group is set to use the load balancer's health checks. One zone loses power at the busiest
        hour of the day. Which TWO things happen automatically? (Select TWO.)
    choices:
      - id: lb-stops-routing
        text: The load balancer stops sending requests to the failed instances
        variants:
          - text: Requests stop going to the failed instances from the load balancer
          - text: The load balancer routes nothing more to the instances that failed
        explanation:
          text: The failed instances fail their health checks, so the load balancer sends traffic only to the other zone.
      - id: region-move
        text: AWS moves the whole group to another Region until power returns
        variants:
          - text: AWS shifts the entire group into another Region until power is back
          - text: The group is relocated by AWS to a different Region for the outage
        explanation:
          text: Nothing moves between Regions automatically; recovering from a Region loss is disaster recovery.
      - id: asg-replaces
        text: Auto Scaling launches replacements in the zone that still works
        variants:
          - text: Auto Scaling starts replacement instances in the working zone
          - text: Replacements are launched by Auto Scaling in the healthy zone
        explanation:
          text: The group replaces instances that fail its health checks to get back to its desired capacity; with one zone down, it can start them only in the other.
      - id: lb-launches
        text: The load balancer launches new instances to replace the failed ones
        variants:
          - text: The load balancer starts new instances in place of the failed ones
          - text: New instances replacing the failed ones are launched by the load balancer
        explanation:
          text: Load balancers never launch instances; that is Auto Scaling's job.
      - id: max-raised
        text: Auto Scaling raises its own maximum capacity to make up for the loss
        variants:
          - text: Auto Scaling increases its maximum capacity to cover the lost zone
          - text: The group's maximum capacity is raised by Auto Scaling to offset the loss
        explanation:
          text: The maximum is a setting you choose; Auto Scaling never changes it itself.
    correct_answers: [lb-stops-routing, asg-replaces]
    hint:
      text: One service acts on requests, the other on the number of instances.
    explanation:
      text: |
        In the first minutes, the load balancer stops the damage: health checks fail for the lost
        zone's instances, so every request goes to the healthy zone. Then Auto Scaling repairs it,
        launching replacements where it can to get back to the desired capacity. The site may slow
        for a few minutes, then recovers with nobody acting. The group acts on the load balancer's
        health checks because they are turned on for it; by default it uses only EC2 status checks.

  - id: q06-where-elasticity-and-ha-come-from
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Auto Scaling changes how many; the load balancer chooses which
    task: "1.1"
    level: understanding
    topics: [elasticity, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement correctly describes where an EC2 web tier gets its elasticity and its high
        availability?
    choices:
      - id: lb-and-bigger-type
        text: Elasticity from the load balancer; high availability from a larger instance type
        variants:
          - text: The load balancer gives elasticity; a bigger instance type gives high availability
          - text: Elasticity comes via the load balancer, and availability via a larger instance
        explanation:
          text: The load balancer doesn't change the number of servers, and one big server is still a single point of failure.
      - id: reserved
        text: Both from Reserved Instances, which keep spare capacity ready in each AZ
        variants:
          - text: Both come from Reserved Instances, holding spare capacity ready in every AZ
          - text: Reserved Instances supply both, by keeping spare capacity waiting in each AZ
        explanation:
          text: A Reserved Instance is a billing discount, not spare capacity or a source of elasticity.
      - id: asg-and-multi-az
        text: Elasticity from Auto Scaling; high availability from instances in several AZs
        variants:
          - text: Auto Scaling gives elasticity; instances spread over several AZs give availability
          - text: Elasticity comes via Auto Scaling, and availability via running in several AZs
        explanation:
          text: Auto Scaling changes the count; several AZs, kept balanced and reached through the load balancer, survive a zone's loss.
      - id: health-checks-and-one-server
        text: Elasticity from health checks; high availability from one large, powerful server
        variants:
          - text: Health checks give elasticity; a single powerful server gives high availability
          - text: Elasticity comes via health checks, and availability via one large server
        explanation:
          text: Health checks find failed instances; they don't change capacity. One server is a single point of failure.
    correct_answers: [asg-and-multi-az]
    explanation:
      text: |
        Elasticity comes from Auto Scaling changing the number of instances with demand. High
        availability comes from running in several Availability Zones, which Auto Scaling keeps
        balanced and the load balancer makes reachable through one address.

  - id: q06-scaling-several-resource-types
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: An Auto Scaling group keeps the right number of instances running
    task: "3.3"
