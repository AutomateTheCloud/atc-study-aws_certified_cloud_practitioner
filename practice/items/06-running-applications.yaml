    explanation:
      text: |
        Fargate doesn't offer GPUs (as of 2026-10-23), so GPU work moves to ECS on EC2 instances,
        with an accelerated computing instance type. That brings back work: choosing the type and
        count and patching the instances, unless the company uses ECS Managed Instances.

  - id: q06-fargate-files-after-the-task-stops
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: Fargate runs containers without servers to manage
    task: "3.3"
    level: understanding
    topics: [fargate]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A task on AWS Fargate writes report files to the task's own temporary storage. The team
        needs those files after the task stops. What should it do?
    choices:
      - id: use-efs
        text: Write the files to Amazon EFS, since the task's own storage is erased when it stops
        variants:
          - text: Save the files on Amazon EFS, because task storage is wiped when the task stops
          - text: Put the files in Amazon EFS, as the task's storage is erased once the task stops
        explanation:
          text: Fargate task storage is temporary, like instance store; EFS keeps files after the task ends.
      - id: nothing
        text: Nothing, because Fargate keeps each task's storage until someone deletes it by hand
        variants:
          - text: Nothing, since Fargate holds on to each task's storage until it is deleted by hand
          - text: Nothing, as each task's storage stays on Fargate until someone removes it manually
        explanation:
          text: Task storage is erased when the task stops.
      - id: ecr
        text: Save the files in Amazon ECR, next to the container image the task started from
        variants:
          - text: Store the files in Amazon ECR, beside the image the task was started from
          - text: Keep the files in Amazon ECR, alongside the container image the task came from
        explanation:
          text: ECR stores container images, not an app's output files.
      - id: more-memory
        text: Give the task more memory, so Fargate holds the files in RAM after the task stops
        variants:
          - text: Raise the task's memory, so the files stay in RAM on Fargate once the task stops
          - text: Assign the task more memory, so its files are kept in RAM after it has stopped
        explanation:
          text: Memory is released when a task stops; it can't hold files afterwards.
    correct_answers: [use-efs]
    explanation:
      text: |
        Each Fargate task gets temporary storage that is erased when the task stops, the same way
        instance store is erased when an instance stops. For files that must last, use lasting
        storage such as Amazon EFS (lesson 05.01).

  - id: q06-good-fits-for-lambda-pick-two
    page: guide/06-running-applications/03-containers-and-serverless.md
