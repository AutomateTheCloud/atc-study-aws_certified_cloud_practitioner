        Lightsail is the simple start; when a site outgrows it, Upgrade to EC2 copies the
        Lightsail instance into Amazon EC2, where the company gets every instance type and pricing
        option and more control over the network.

  - id: q06-ec2-beanstalk-lightsail-what-differs
    page: guide/06-running-applications/04-simpler-paths.md
    section: "EC2, Elastic Beanstalk or Lightsail: three ways to run a web app"
    task: "3.3"
    level: understanding
    topics: [elastic-beanstalk, lightsail, compute-choice]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The same small website could run on Amazon EC2, AWS Elastic Beanstalk or Amazon Lightsail.
        What mainly differs among the three?
    choices:
      - id: who-builds-how-paid
        text: Who assembles the setup, and how the company pays for it
        variants:
          - text: Who builds the setup, and how the company is billed for it
          - text: Who puts the setup together, and how it is paid for
        explanation:
          text: All three run the app on AWS virtual servers; the assembly and the billing differ.
      - id: only-ec2-servers
        text: EC2 alone uses virtual servers; the other two are serverless
        variants:
          - text: Just EC2 has virtual servers; the other two are serverless
          - text: Virtual servers are EC2's alone; the others are serverless
        explanation:
          text: Beanstalk and Lightsail also run on AWS virtual servers that exist and bill.
      - id: lightsail-multi-az
        text: Lightsail alone can run the website in several Availability Zones
        variants:
          - text: Just Lightsail can spread the site across several Availability Zones
          - text: Running the site in several Availability Zones is Lightsail's alone
        explanation:
          text: EC2 and Beanstalk can both run in more than one Availability Zone.
      - id: beanstalk-on-site
        text: Beanstalk alone runs on AWS hardware in the company's building
        variants:
          - text: Just Beanstalk uses AWS hardware inside the company's building
          - text: AWS hardware in the company's building is Beanstalk's alone
        explanation:
          text: AWS hardware in your own building is AWS Outposts.
    correct_answers: [who-builds-how-paid]
    explanation:
      text: |
        All three run your app on AWS virtual servers. On EC2 you build everything and pay for each
        part by use; Beanstalk builds the setup in your account at no extra charge beyond the parts;
        Lightsail sells a bundle at a fixed monthly price. Choose by how much you want to build and
        how you want to be billed.

  - id: q06-thousands-of-long-container-jobs
    page: guide/06-running-applications/04-simpler-paths.md
    section: Batch runs large numbers of jobs from a queue
    task: "3.3"
    level: application
    topics: [batch]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A genomics lab submits thousands of analysis jobs each night. Each is packaged as a
        container and runs for about 12 hours. The lab wants AWS to start compute while jobs wait
        and remove it when the queue is empty. Which service fits?
    choices:
      - id: lambda
        text: AWS Lambda
        variants:
          - text: Lambda
          - text: The AWS Lambda service
        explanation:
          text: A standard Lambda invocation stops at 15 minutes (as of 2026-10-23), far short of 12 hours.
      - id: batch
        text: AWS Batch
        variants:
          - text: The AWS Batch service
          - text: Batch
        explanation:
          text: Batch queues the jobs, launches compute for them and removes it when it's no longer needed.
      - id: lightsail
        text: Amazon Lightsail
        variants:
          - text: Lightsail
          - text: An Amazon Lightsail plan
        explanation:
          text: Lightsail sells a few simple servers at fixed prices, not compute that grows and shrinks with a queue.
      - id: beanstalk
        text: AWS Elastic Beanstalk
        variants:
          - text: Elastic Beanstalk
          - text: The Elastic Beanstalk service
        explanation:
          text: Beanstalk deploys web applications, not queues of unattended jobs.
    correct_answers: [batch]
    hint:
      text: The words "jobs", "queue" and "remove it when the queue is empty" point to one service.
    explanation:
      text: |
        AWS Batch runs batch work at any scale: you package each job as a container and submit it
        to a job queue. Batch decides where each job runs, launches compute when it's needed and
        removes it afterwards. AWS lists genomics among its uses.

  - id: q06-cheaper-compute-for-retryable-jobs
    page: guide/06-running-applications/04-simpler-paths.md
    section: Batch runs large numbers of jobs from a queue
    task: "3.3"
    level: application
    topics: [batch, purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's AWS Batch jobs can be safely retried if they are interrupted. How can it lower
        the cost of the compute they run on?
    choices:
      - id: lambda
        text: Run the jobs as Lambda functions that stop after a few minutes
        variants:
          - text: Turn the jobs into Lambda functions that end after a few minutes
          - text: Make the jobs Lambda functions that stop after a few minutes
        explanation:
          text: Cutting jobs short doesn't finish them; Batch exists for jobs of any length.
      - id: nlb
        text: Put a Network Load Balancer in front of the job queue
        variants:
          - text: Place a Network Load Balancer before the job queue
          - text: Front the job queue with a Network Load Balancer
        explanation:
          text: A load balancer spreads network traffic; it doesn't lower compute prices, and it bills by the hour.
      - id: spot
        text: Use Spot Instances in the jobs' compute environment
        variants:
          - text: Run the compute environment on Spot Instances
          - text: Give the compute environment Spot capacity
        explanation:
          text: Spot is spare EC2 capacity at a discount that AWS can take back; a retried job loses only time.
      - id: lightsail
        text: Move the compute environment onto Lightsail plans
        variants:
          - text: Shift the compute environment to Lightsail plans
          - text: Run the compute environment on Lightsail bundles
        explanation:
          text: Batch's compute environments use EC2 (On-Demand or Spot) or Fargate, not Lightsail.
    correct_answers: [spot]
    hint:
      text: Which way of paying trades the risk of interruption for a discount?
    explanation:
      text: |
        AWS Batch can run jobs on Spot Instances: spare EC2 capacity at a discount, which AWS can
        reclaim with a short warning. That suits jobs that can be retried, because an interruption
        costs time, not results.

  - id: q06-batch-statements-pick-two
    page: guide/06-running-applications/04-simpler-paths.md
    section: Batch runs large numbers of jobs from a queue
    task: "3.3"
    level: understanding
    topics: [batch]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A research group plans to run its overnight simulations with AWS Batch. Which TWO
        statements describe how Batch works? (Select TWO.)
    choices:
      - id: fixed-plan
        text: It is billed as a fixed monthly plan, like a Lightsail bundle
        variants:
          - text: It charges a set monthly plan price, as a Lightsail bundle does
          - text: Its price is a fixed monthly plan, the way Lightsail's is
        explanation:
          text: Batch adds no charge of its own; you pay for the EC2 or Fargate capacity the jobs use.
      - id: queue-containers
        text: Each job is packaged as a container and submitted to a job queue
        variants:
          - text: Jobs are packaged as containers and sent to a job queue
          - text: You package each job as a container and submit it to a queue
        explanation:
          text: The job queue holds submitted jobs until Batch runs them.
      - id: needs-lb
        text: It needs a load balancer in front of each of its job queues
        variants:
          - text: Each of its job queues needs a load balancer in front of it
          - text: It requires a load balancer placed before every job queue
        explanation:
          text: Load balancers spread network requests; job queues don't use them.
      - id: removes-compute
        text: It removes the compute once the jobs no longer need it
        variants:
          - text: It takes the compute away when the jobs no longer need it
          - text: It deletes the compute when it is no longer needed for jobs
        explanation:
          text: The compute exists only while there are jobs, so a nightly run doesn't leave servers billing all day.
      - id: install-scheduler
        text: You install and run its scheduling software on EC2 yourself
        variants:
          - text: You set up and operate its scheduling software on EC2
          - text: Its scheduling software is yours to install and run on EC2
        explanation:
          text: Batch is fully managed, with nothing to install; on EC2 alone you would have to write the scheduling.
    correct_answers: [queue-containers, removes-compute]
    explanation:
      text: |
        You package each job as a container and submit it to a job queue. AWS Batch decides where
        each job runs, launches compute when it's needed, watches the jobs and removes the compute
        afterwards, with nothing to install and no charge beyond the compute used.

  - id: q06-factory-control-systems-on-site
    page: guide/06-running-applications/04-simpler-paths.md
    section: Outposts brings AWS hardware into your own building
    task: "3.1"
    level: application
    topics: [outposts]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manufacturer's assembly-line control systems need responses within milliseconds, and the
        data they use must stay in its own plant. It wants to run EC2 instances there with the same
        APIs and tools it uses in its AWS Region. Which service fits?
    choices:
      - id: local-zone
        text: A Local Zone in the nearest city
        variants:
          - text: The Local Zone in the closest city
          - text: An AWS Local Zone in a nearby city
        explanation:
          text: A Local Zone is close, but it is AWS's site in a city, not the plant itself.
      - id: batch
        text: AWS Batch
        variants:
          - text: The AWS Batch service
          - text: Batch
        explanation:
          text: Batch runs job queues in a Region; it doesn't change where the hardware is.
      - id: lightsail
        text: Amazon Lightsail
        variants:
          - text: Lightsail
          - text: An Amazon Lightsail plan
        explanation:
          text: Lightsail servers run in AWS Regions, not in the plant.
      - id: outposts
        text: AWS Outposts
        variants:
          - text: Outposts
          - text: An AWS Outposts rack
        explanation:
          text: Outposts puts AWS-managed racks or servers in your own building, running EC2 with the same APIs and tools.
    correct_answers: [outposts]
    hint:
      text: The data may not leave the building at all.
    explanation:
      text: |
        AWS Outposts brings AWS racks or servers into your own data center or site, extending an
        Availability Zone of its Region through a service link. It suits low latency to on-site
        systems and data that must stay on premises: a hybrid deployment managed with the same
        tools as the Region.

