  - id: q06-why-a-container-runs-the-same
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: A container packages an app with everything it needs
    task: "3.3"
    level: understanding
    topics: [containers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer's app runs inside a container on her laptop. Why does it run the same way when
        the same container image runs on AWS?
    choices:
      - id: rewrites-code
        text: Because AWS rewrites the app's code for its own servers when the container starts
        variants:
          - text: Because AWS adapts the app's code to its servers each time the container starts
          - text: Because the app's code is rewritten by AWS for its servers when the container starts
        explanation:
          text: AWS doesn't change your code; the image is the same everywhere.
      - id: data-in-s3
        text: Because a container keeps all its files in Amazon S3, which every computer can reach
        variants:
          - text: Because containers store all their files in Amazon S3, where any computer finds them
          - text: Because every container's files live in Amazon S3, which any computer can reach
        explanation:
          text: A container is a package of code, not a storage place like an S3 bucket.
      - id: carries-dependencies
        text: Because the container carries the code together with the libraries and settings it needs
        variants:
          - text: Because the container holds the code along with the libraries and settings it depends on
          - text: Because the code travels in the container with the libraries and settings it relies on
        explanation:
          text: The app brings its dependencies with it, so it behaves the same anywhere.
      - id: fargate-copies-os
        text: Because containers run on AWS Fargate, which copies the laptop's operating system to AWS
        variants:
          - text: Because containers run on Fargate, which clones the laptop's operating system for them
          - text: Because AWS Fargate runs the containers, and it copies the laptop's operating system
        explanation:
          text: Containers also run on EC2 instances under ECS or EKS, and Fargate copies nothing from your laptop.
    correct_answers: [carries-dependencies]
    explanation:
      text: |
        A container holds an application's code together with the libraries and settings it
        depends on. You build the image once, and every container started from it is identical, so
        an app that works on a laptop works the same on AWS.

  - id: q06-containers-that-need-gpus
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "Worked example: compute for the bakery's photo job and inventory app"
    task: "3.3"
