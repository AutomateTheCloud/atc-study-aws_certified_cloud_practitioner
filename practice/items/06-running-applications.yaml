          - text: From the launch template it uses
        explanation:
          text: The launch template is the recipe for every new instance.
      - id: load-balancer
        text: From the load balancer's settings
        variants:
          - text: From the load balancer's configuration
          - text: From settings on the load balancer
        explanation:
          text: The load balancer routes requests; it holds no recipe for instances.
      - id: scaling-policy
        text: From the group's scaling policy
        variants:
          - text: From its scaling policy
          - text: From the scaling policy it follows
        explanation:
