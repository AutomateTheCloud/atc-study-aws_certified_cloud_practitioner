        presents these features (its product page read "AWS Application Auto Scaling" when the
        guide checked it on 2026-10-24), so in real work, check AWS's current pages before
        choosing a scaling plan over a policy set on each service.

  - id: q06-launch-template-is-the-recipe
    page: guide/06-running-applications/02-auto-scaling-and-load-balancers.md
    section: Key terms (skip if you know them)
    task: "3.3"
