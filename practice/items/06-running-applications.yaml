        variants:
          - text: Creating a small copy of each photo, seconds of work, as it is uploaded
          - text: Shrinking each uploaded photo, a few seconds of work, as it arrives
        explanation:
          text: Short, event-driven work that runs only when a photo arrives is Lambda's best case.
      - id: gpu-retraining
        text: Retraining an image model on GPUs over a whole afternoon
        variants:
          - text: Retraining an image model on GPUs across a full afternoon
          - text: Spending a whole afternoon retraining an image model on GPUs
        explanation:
          text: GPU work and long runs point to EC2.
      - id: text-on-signup
        text: Sending a welcome text message each time a customer signs up
        variants:
          - text: Texting a welcome message to every customer who signs up
          - text: Sending each new customer a welcome text when they sign up
        explanation:
          text: A sign-up is an event, and sending a text takes seconds.
      - id: wordpress-all-day
        text: Hosting a WordPress blog that must stay online all day
        variants:
          - text: Running a WordPress blog that has to be online all day
          - text: Serving a WordPress blog that stays up around the clock
        explanation:
          text: WordPress needs a server that keeps running, such as Lightsail or EC2.
      - id: sessions-in-memory
        text: Holding customer sessions in memory from one request to the next
        variants:
          - text: Keeping customer sessions in memory between one request and the next
          - text: Storing customer sessions in memory across successive requests
        explanation:
          text: You can't rely on Lambda to keep state between runs; anything to keep goes to S3 or a database.
    correct_answers: [thumbnail-on-upload, text-on-signup]
    hint:
      text: Look for work that is short and starts when something happens.
    explanation:
      text: |
        Lambda runs code when an event triggers it and bills only for each run, so short,
        event-driven work fits best. It isn't for long or always-on work, GPU work, or anything
        that needs state kept between runs.

  - id: q06-nightly-container-job-no-servers
    page: guide/06-running-applications/03-containers-and-serverless.md
