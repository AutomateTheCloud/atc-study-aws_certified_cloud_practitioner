  - id: q06-quiet-hour-instance-count
    page: guide/06-running-applications/07-sim-elasticity-with-auto-scaling.md
    section: "Decision 1: fill in the table"
    task: "1.1"
    level: application
    topics: [auto-scaling]
    type: multiple_choice
    selection: single
    revision: 2
    prompt:
      text: |
        A shop's web servers each handle about 20 orders an hour. Its Auto Scaling group spans two
        Availability Zones with a minimum of 2 and a maximum of 8, and runs enough instances for
        each hour's orders. One quiet hour brings 8 orders; a flash sale hour brings 190. How many
        instances does the group run in each of those hours?
    choices:
      - id: two-then-eight
        text: 2 in the quiet hour, 8 in the sale hour
        variants:
          - text: Two in the quiet hour and eight in the sale hour
          - text: "Quiet hour: 2; sale hour: 8"
        explanation:
          text: The minimum lifts the quiet hour from 1 to 2, and the maximum caps the sale hour at 8 although 10 would be needed.
      - id: one-then-ten
        text: 1 in the quiet hour, 10 in the sale hour
        variants:
          - text: One in the quiet hour and ten in the sale hour
          - text: "Quiet hour: 1; sale hour: 10"
        explanation:
          text: That is what the orders alone need, but the group stays between its minimum and its maximum.
      - id: two-then-ten
        text: 2 in the quiet hour, 10 in the sale hour
        variants:
          - text: Two in the quiet hour and ten in the sale hour
          - text: "Quiet hour: 2; sale hour: 10"
        explanation:
          text: The quiet hour is right, but the group never runs more than its maximum of 8.
      - id: one-then-eight
        text: 1 in the quiet hour, 8 in the sale hour
        variants:
          - text: One in the quiet hour and eight in the sale hour
          - text: "Quiet hour: 1; sale hour: 8"
        explanation:
          text: The sale hour is right, but the group never runs fewer than its minimum of 2.
    correct_answers: [two-then-eight]
    hint:
      text: Work out what the orders need in each hour, then apply the group's floor and its ceiling.
    explanation:
      text: |
        8 orders need one server and 190 need ten (rounding up), but the group stays between its
        limits. The minimum of 2 keeps one instance in each Availability Zone through the quiet
        hour: the price of high availability. The maximum of 8 caps the sale hour, so the site runs
        short of capacity; the maximum limits cost, and you raise it if peaks like this are expected.

  # ---------------------------------------------------------------- 06.03 Containers and serverless

  - id: q06-private-store-for-container-images
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "Four names, four jobs: ECR stores, ECS and EKS orchestrate, Fargate supplies the computers"
    task: "3.3"
    level: recall
    topics: [containers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A development team builds container images in its pipeline. It needs a private place to
        keep them, with access controlled through IAM, from which Amazon ECS can pull them. Which
        service fits?
    choices:
      - id: ecs
        text: Amazon ECS
        variants:
          - text: Amazon Elastic Container Service
          - text: ECS
        explanation:
          text: ECS orchestrates containers; it pulls images from a registry rather than storing them.
      - id: fargate
        text: AWS Fargate
        variants:
          - text: Fargate
          - text: The AWS Fargate service
        explanation:
          text: Fargate is serverless compute that runs containers; it stores no images.
      - id: ecr
        text: Amazon ECR
        variants:
          - text: Amazon Elastic Container Registry
          - text: ECR
        explanation:
          text: ECR stores container images in private repositories controlled with IAM, or in public ones.
      - id: eks
        text: Amazon EKS
        variants:
          - text: Amazon Elastic Kubernetes Service
          - text: EKS
        explanation:
          text: EKS runs Kubernetes to orchestrate containers; it isn't a registry.
    correct_answers: [ecr]
    explanation:
      text: |
        Amazon Elastic Container Registry (Amazon ECR) is the registry: it stores container images
        in private repositories controlled with IAM, or in public ones, and can scan them for known
        flaws. It runs nothing; ECS or EKS pulls the image from it to start containers.

  - id: q06-accurate-statement-about-fargate
    page: guide/06-running-applications/03-containers-and-serverless.md
    section: "\"Fargate orchestrates containers\" is wrong"
    task: "3.3"
    level: understanding
    topics: [containers, fargate]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement about AWS Fargate is accurate?
    choices:
      - id: orchestrates
        text: It decides where containers run and how many copies there are, in place of ECS or EKS
        variants:
          - text: It chooses where containers run and how many copies are needed, instead of ECS or EKS
          - text: It replaces ECS or EKS by deciding how many containers run and where they go
        explanation:
          text: This is the misconception the lesson names. ECS or EKS decides; Fargate is the capacity underneath.
      - id: stores-images
        text: It stores container images in private repositories and scans them for known flaws
        variants:
          - text: It keeps container images in private repositories and checks them for known flaws
          - text: It holds container images in private repositories and scans them for weaknesses
        explanation:
          text: That is Amazon ECR, the registry.
      - id: kubernetes-control-plane
        text: It runs a managed Kubernetes control plane so existing Kubernetes tools keep working
        variants:
          - text: It provides a managed Kubernetes control plane so teams keep their Kubernetes tools
          - text: It hosts the Kubernetes control plane for you so current Kubernetes tools still work
        explanation:
          text: That is Amazon EKS.
      - id: serverless-capacity
        text: It is serverless compute that ECS or EKS places containers on, with no servers to manage
        variants:
          - text: It is serverless capacity that ECS or EKS runs containers on, with no servers to run
          - text: It supplies serverless compute for containers placed by ECS or EKS, with no servers to run
        explanation:
          text: ECS lists Fargate as a capacity option beside EC2 instances.
    correct_answers: [serverless-capacity]
    explanation:
      text: |
        ECR stores images, ECS and EKS orchestrate, and Fargate supplies the computers. Fargate is
        not an orchestrator: ECS or EKS decides where containers run and how many, and schedules
        them onto Fargate, where you don't pick, scale or patch servers.

