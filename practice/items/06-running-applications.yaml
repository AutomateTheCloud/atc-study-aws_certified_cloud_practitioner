  - id: q06-beanstalk-is-not-serverless
    page: guide/06-running-applications/04-simpler-paths.md
    section: "\"Elastic Beanstalk is serverless\" is wrong"
    task: "3.3"
    level: understanding
    topics: [elastic-beanstalk]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager says Elastic Beanstalk is serverless, like Lambda, so the team pays nothing while
        its site is idle. Which statement corrects this?
    choices:
      - id: real-instances
        text: Beanstalk creates real EC2 instances in the account, and they bill while they run
        variants:
          - text: Beanstalk launches actual EC2 instances in the account, which bill while running
          - text: The EC2 instances Beanstalk creates are real, in the account, and bill as they run
        explanation:
          text: The servers exist, appear on the bill and are updated according to settings you choose.
      - id: hidden-plan
        text: Beanstalk runs code on AWS's hidden servers, billed as one fixed monthly plan price
        variants:
          - text: Beanstalk uses hidden AWS servers for the code, charged as a fixed monthly plan
          - text: The code runs on servers hidden in AWS's account, for one set monthly plan price
        explanation:
          text: The resources are ordinary ones in your account, billed by use; fixed plans are Lightsail's model.
      - id: per-request
        text: Beanstalk adds a per-request fee, like Lambda, on top of the instances it creates
        variants:
          - text: Beanstalk charges per request, as Lambda does, in addition to its instances' cost
          - text: On top of the instances, Beanstalk bills a fee for each request, like Lambda does
        explanation:
          text: Beanstalk adds no charge of its own; you pay only for the resources it creates.
      - id: never-on-bill
        text: Beanstalk keeps the servers in AWS's own account, so they never appear on the bill
        variants:
          - text: The servers sit in AWS's own account under Beanstalk, so they don't show on the bill
          - text: Beanstalk holds the servers in AWS's account, which keeps them off the company's bill
        explanation:
          text: The instances are created in your account and appear on your bill.
    correct_answers: [real-instances]
    explanation:
      text: |
        Elastic Beanstalk isn't serverless. You only upload code and never launch an instance
        yourself, but Beanstalk creates real EC2 instances, or an EKS cluster, in your account, and
        you pay for them while they run.

  - id: q06-managed-platform-updates-do-what
    page: guide/06-running-applications/04-simpler-paths.md
    section: Elastic Beanstalk builds and runs the setup for your code
    task: "2.1"
    level: understanding
    topics: [elastic-beanstalk, shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company turns on managed platform updates for its Elastic Beanstalk environment. What
        does Beanstalk then do?
    choices:
      - id: every-version
        text: Applies every new platform version, major ones included, the moment AWS releases it
        variants:
          - text: Installs each new platform version, majors included, as soon as AWS releases it
          - text: Applies all new platform versions, including majors, the moment they are released
        explanation:
          text: Major version upgrades, which can break your code, are yours to start.
      - id: patch-minor-weekly
        text: Applies patch and minor versions in a weekly window; major upgrades stay the company's
        variants:
          - text: Applies patch and minor versions weekly in a window; majors are the company's to start
          - text: Installs patch and minor versions in a weekly window, leaving majors to the company
        explanation:
          text: Those updates bring operating system and language updates; majors are left to you.
      - id: moves-to-lambda
        text: Moves the environment onto AWS Lambda, so that no servers need updating after that
        variants:
          - text: Shifts the environment to AWS Lambda, so no servers need any updates from then on
          - text: Migrates the environment to AWS Lambda, after which there are no servers to update
        explanation:
          text: The environment stays on EC2 instances (or EKS) in your account.
      - id: patches-app-code
        text: Patches the company's own application code and its libraries during a weekly window
        variants:
          - text: Fixes the company's own application code and libraries in a weekly window
          - text: Updates the company's application code and its libraries during a weekly window
        explanation:
          text: The platform is updated, not your code; your code and its libraries stay yours.
    correct_answers: [patch-minor-weekly]
    explanation:
      text: |
        With managed platform updates turned on, Beanstalk applies new patch and minor platform
        versions, with operating system and language updates, during a weekly maintenance window.
        Major version upgrades, which can break your code, stay yours to start.

  - id: q06-small-site-predictable-price
    page: guide/06-running-applications/04-simpler-paths.md
    section: Lightsail sells a simple server as a bundle with a predictable price
    task: "3.3"
    level: application
    topics: [lightsail]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A yoga teacher wants a small booking website started from a ready-made image. She wants the
        server, storage and data transfer in one predictable monthly price, with as little setup as
        possible. Which service fits best?
    choices:
      - id: beanstalk
        text: AWS Elastic Beanstalk
        variants:
          - text: Elastic Beanstalk
          - text: The Elastic Beanstalk service
        explanation:
          text: Beanstalk bills the parts it creates by use, with no fixed monthly price.
      - id: ec2-asg
        text: Amazon EC2 with Auto Scaling
        variants:
          - text: EC2 instances with Auto Scaling
          - text: An EC2 Auto Scaling setup
        explanation:
          text: It works, but she would assemble and pay for each part separately.
      - id: lightsail
        text: Amazon Lightsail
        variants:
          - text: Lightsail
          - text: An Amazon Lightsail plan
        explanation:
          text: Lightsail bundles a server, storage, a static IP and data transfer into one monthly price, often from a ready-made image.
      - id: batch
        text: AWS Batch
        variants:
          - text: The AWS Batch service
          - text: Batch
        explanation:
          text: Batch runs queues of unattended jobs, not websites.
    correct_answers: [lightsail]
    hint:
      text: Which service is sold as a bundle at a monthly price?
    explanation:
      text: |
        Amazon Lightsail is AWS's simplest way to put a website or small app online. Its plans
        bundle a virtual server, storage, a static IP address and a data transfer allowance into one
        monthly price, and you can start from ready-made images such as WordPress.

  - id: q06-lightsail-statements-pick-two
    page: guide/06-running-applications/04-simpler-paths.md
    section: Lightsail sells a simple server as a bundle with a predictable price
    task: "3.3"
    level: understanding
    topics: [lightsail]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A shop owner is considering Amazon Lightsail for a small website. Which TWO statements
        about Lightsail are true? (Select TWO.)
    choices:
      - id: bundle
        text: A plan bundles a server, storage and data transfer into one monthly price
        variants:
          - text: Each plan packs a server, storage and transfer into one monthly price
          - text: Its plans combine a server, storage and transfer in one monthly price
        explanation:
          text: That bundle, with a predictable price, is what Lightsail sells.
      - id: builds-from-code
        text: It builds load-balanced, auto-scaling environments from code you upload
        variants:
          - text: It creates load-balanced, scaling environments from uploaded code
          - text: It assembles load-balanced, auto-scaling setups from your uploaded code
        explanation:
          text: That is Elastic Beanstalk.
      - id: bills-when-stopped
        text: An instance keeps billing while stopped; only deleting it ends the charge
        variants:
          - text: A stopped instance is still billed; only deleting it stops the charge
          - text: Stopping an instance doesn't end its charge; deleting it does
        explanation:
          text: Unlike EC2, where a stop ends instance-hour charges, Lightsail bills the plan while the instance exists.
      - id: on-premises
        text: It runs on AWS hardware installed in the customer's own building
        variants:
          - text: Its servers are AWS hardware placed in the customer's building
          - text: It puts AWS hardware inside the customer's own building
        explanation:
          text: Lightsail runs in AWS Regions; AWS hardware in your building is Outposts.
      - id: events-only
        text: It runs code as functions, but only when an event triggers them
        variants:
          - text: It runs functions, and only when an event triggers each one
          - text: It runs code in functions, solely when events trigger them
        explanation:
          text: That is AWS Lambda.
    correct_answers: [bundle, bills-when-stopped]
    explanation:
      text: |
        Lightsail sells a simple server as a bundle with a predictable price, charged by the hour
        up to the plan's monthly price. The instance is charged while it is running or stopped, so
        only deleting it ends the charge; that differs from EC2, where a stop ends instance-hour
        charges.

  - id: q06-outgrowing-lightsail
    page: guide/06-running-applications/04-simpler-paths.md
    section: Lightsail sells a simple server as a bundle with a predictable price
