        text: On AWS Fargate, with a larger CPU and memory size for each task
        variants:
          - text: On Fargate, giving each task a bigger CPU and memory setting
          - text: On AWS Fargate, raising the CPU and memory of every task
        explanation:
          text: More CPU and memory isn't a GPU; AWS says to use EC2 for GPU work (as of 2026-10-23).
      - id: ecr-hardware
        text: On Amazon ECR, which runs images that need special hardware
        variants:
          - text: On Amazon ECR, which runs any image needing special chips
          - text: In Amazon ECR, which starts images that need special hardware
        explanation:
          text: ECR stores images; it runs nothing.
      - id: lambda-memory
        text: On AWS Lambda, triggered by each photo, with the most memory
        variants:
          - text: On Lambda, started by each photo and given maximum memory
          - text: On AWS Lambda, run per photo with its memory set to the top
        explanation:
          text: Lambda runs short event-driven functions; memory brings more CPU, not GPUs. The lesson's flowchart sends GPU work to EC2.
      - id: ecs-on-ec2-gpu
        text: On Amazon ECS with EC2 instances of a GPU instance type
        variants:
          - text: On ECS, placed on EC2 instances that have GPUs
