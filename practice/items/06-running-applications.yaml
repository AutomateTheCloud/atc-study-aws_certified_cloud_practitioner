    selection: single
    prompt:
      text: |
        A company wants to set up scaling for its groups of EC2 instances and for its Amazon
        DynamoDB tables together, in one place. Which service, listed by name in the CLF-C02 exam
        guide, does that?
    choices:
      - id: elb
        text: Elastic Load Balancing
        variants:
          - text: Elastic Load Balancing (ELB)
          - text: The Elastic Load Balancing service
        explanation:
          text: Elastic Load Balancing spreads requests; it doesn't scale resources.
      - id: ec2-auto-scaling
        text: Amazon EC2 Auto Scaling
        variants:
          - text: EC2 Auto Scaling
          - text: The Amazon EC2 Auto Scaling service
        explanation:
