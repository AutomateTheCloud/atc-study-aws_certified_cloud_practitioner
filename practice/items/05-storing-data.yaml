    correct_answers: [deep-archive]
    hint:
      text: When a wait of days is fine, how cold can the data go? And which of these can a new customer still use?
    explanation:
      text: |
        S3 Glacier Deep Archive is the lowest-cost class, for records read less than once a year
        and kept for years, such as for compliance. A restore takes 12 to 48 hours depending on the
        option (as of 2026-10-23), which fits a three-day limit, and its 180-day minimum stay is no
        trap for ten-year records. The old Glacier vault service takes no new customers.

  - id: q05-classes-that-need-a-restore
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "The big picture: from hot to cold"
