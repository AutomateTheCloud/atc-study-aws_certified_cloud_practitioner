  - id: q05-keep-running-if-az-fails
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "A Multi-AZ deployment keeps the database running when an Availability Zone fails"
    task: "3.4"
    level: application
    topics: [rds, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A payroll company's RDS database must keep working, automatically, if its Availability Zone
        fails, and it must not lose any committed transactions. What should the company turn on?
    choices:
      - id: multi-az
        text: A Multi-AZ deployment
        variants:
          - text: RDS Multi-AZ for the database
          - text: Multi-AZ for the DB instance
        explanation:
          text: A synchronous standby in another AZ has every committed change and takes over automatically.
      - id: read-replica
        text: A read replica in another AZ
        variants:
          - text: An RDS read replica in a second AZ
          - text: A read-only replica in another AZ
        explanation:
          text: A replica copies asynchronously, so recent transactions can be missing, and someone has to promote it.
      - id: nightly-snapshot
        text: A manual snapshot every night
        variants:
          - text: Manual snapshots taken nightly
          - text: A snapshot of the database each night
        explanation:
          text: A nightly snapshot loses up to a day of data, and a restore creates a new database, which takes time.
      - id: bigger-instance
        text: A larger DB instance size
        variants:
          - text: A bigger instance class for the DB
          - text: More CPU and memory for the database
        explanation:
          text: A bigger server is still one server in one AZ.
    correct_answers: [multi-az]
    hint:
      text: Two requirements - it must take over by itself, and it must already have every change.
    explanation:
      text: |
        A Multi-AZ deployment keeps a standby in another AZ of the same Region, updated
        synchronously, so it always has every committed change. If the primary's AZ fails, RDS fails
        over automatically, typically in one to two minutes. It's high availability, not a backup.

  - id: q05-reports-on-the-standby
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "A Multi-AZ deployment keeps the database running when an Availability Zone fails"
    task: "3.4"
    level: understanding
    topics: [rds, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team runs its RDS database as a Multi-AZ DB instance deployment. To relieve the primary, it
        plans to send month-end reports to the standby. Why won't this work?
    choices:
      - id: standby-other-region
        text: The standby is in another Region, too far away
        variants:
          - text: The standby sits in a different Region
          - text: Reports can't reach a standby in another Region
        explanation:
          text: The standby is in another AZ of the same Region; distance isn't the problem.
      - id: standby-serves-nothing
        text: The standby serves no queries; it only waits to take over
        variants:
          - text: The standby answers no queries until a failover
          - text: In this setup the standby takes no traffic at all
        explanation:
          text: In a Multi-AZ DB instance deployment, the standby serves no reads and no writes.
      - id: standby-lags
        text: The standby lags too far behind the primary for reports
        variants:
          - text: Its copy of the data is too out of date for reporting
          - text: The standby's data trails the primary's by several hours
        explanation:
          text: The standby is updated synchronously, so it's always up to date; it just can't be queried.
      - id: query-triggers-failover
        text: Querying the standby would make RDS fail over
        variants:
          - text: A query on the standby promotes it to primary
          - text: Reports sent to the standby start a failover
        explanation:
          text: Failover happens when the primary's AZ, network, compute or storage fails, not because of queries.
    correct_answers: [standby-serves-nothing]
    explanation:
      text: |
        The standby exists to take over, not to share work: in a Multi-AZ DB instance deployment it
        serves no reads and no writes. Reports need a copy that serves reads, which is a read
        replica. (A Multi-AZ DB cluster has standbys that can serve reads, but that's a different,
        newer setup.)

  - id: q05-read-heavy-news-site
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "A read replica takes read-only work off the primary"
    task: "3.4"
    level: application
    topics: [rds, read-scaling]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A news site's RDS for MySQL database spends most of its time answering reads of articles,
        and the primary is overloaded. Writes are few. Which RDS feature relieves the primary most
        directly?
    choices:
      - id: multi-az
        text: A Multi-AZ deployment
        variants:
          - text: RDS Multi-AZ for the database
          - text: Multi-AZ for the DB instance
        explanation:
          text: The standby in a Multi-AZ DB instance deployment serves no reads, so it adds availability, not capacity.
      - id: longer-retention
        text: Longer automated backup retention
        variants:
          - text: More days of automated backups
          - text: A longer backup retention period
        explanation:
          text: Backups take you back in time; they don't answer queries.
      - id: read-replicas
        text: Read replicas that take the read traffic
        variants:
          - text: RDS read replicas for the article reads
          - text: Added read replicas to serve the reads
        explanation:
          text: Read replicas answer read-only queries, leaving the primary free for writes.
      - id: hourly-snapshots
        text: A manual snapshot every hour
        variants:
          - text: Hourly manual snapshots
          - text: Snapshots taken each hour
        explanation:
          text: Snapshots are copies for recovery; nobody can query them without restoring a new database.
    correct_answers: [read-replicas]
    hint:
      text: The problem is too many reads. Which copy of the database can answer them?
    explanation:
      text: |
        A read replica is a read-only copy that applications can query, so read-heavy work moves off
        the primary. RDS copies changes to it asynchronously, so it can lag a little, which doesn't
        matter for most article reads. You create replicas yourself, and each is billed as a
        database of its own.

  - id: q05-read-replica-statement
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "\"A read replica gives you high availability\" is wrong"
    task: "3.4"
    level: understanding
    topics: [rds, read-scaling, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: For an RDS for PostgreSQL database, which statement about a read replica is correct?
    choices:
      - id: sync-and-takes-over
        text: It copies every write at once and takes over by itself
        variants:
          - text: It's updated synchronously and fails over automatically
          - text: It gets each write at once and fails over on its own
        explanation:
          text: That describes a Multi-AZ standby. A read replica is asynchronous and doesn't take over by itself.
      - id: same-as-multi-az
        text: It gives the same high availability as Multi-AZ
        variants:
          - text: It's as highly available as a Multi-AZ standby
          - text: It offers the high availability of Multi-AZ
        explanation:
          text: For high availability, AWS recommends Multi-AZ, whose standby is always in step and fails over by itself.
      - id: accepts-writes
        text: It accepts writes as well as reads
        variants:
          - text: Applications can both write to it and read it
          - text: It handles writes as well as reads
        explanation:
          text: A read replica is read-only until someone promotes it to a separate database.
      - id: manual-promotion
        text: It must be promoted by hand and may lack recent changes
        variants:
          - text: Someone has to promote it, and it can miss the latest writes
          - text: It needs a manual promotion and can trail the primary
        explanation:
          text: Promotion is manual, and asynchronous copying means the last changes may not have arrived.
    correct_answers: [manual-promotion]
    explanation:
      text: |
        A read replica doesn't take over automatically: someone must promote it, and the application
        must be pointed at its new address. Because copying is asynchronous, changes just before a
        failure may be missing. Keep the jobs apart: standby for availability, replica for reads. In
        Aurora, a replica can be the automatic failover target.

  - id: q05-recover-from-a-wrong-delete
    page: guide/05-storing-data/10-sim-multi-az-vs-read-replica.md
    section: "Decision 1: for each event, which copy keeps the bakery going or gets its data back?"
    task: "3.4"
    level: application
    topics: [rds, backup]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        At 15:42, a staff member runs a wrong `DELETE` that removes yesterday's orders from an RDS
        database. The database has a Multi-AZ standby and a read replica, and automated backups are
        on. How can the company get the orders back?
    choices:
      - id: point-in-time-restore
        text: Restore a new database to 15:41 and copy the orders back
        variants:
          - text: Use point-in-time recovery to just before 15:42
          - text: Restore from backups to a moment before the delete
        explanation:
          text: Automated backups can restore to any second in the retention period, into a new database.
      - id: fail-over
        text: Fail over to the Multi-AZ standby, which still has the orders
        variants:
          - text: Switch to the standby, where the deleted orders still remain
          - text: Force a failover to the standby copy that still holds them
        explanation:
          text: The standby received the delete at the same moment as the primary.
      - id: promote-replica
        text: Promote the read replica, which still has them
        variants:
          - text: Turn the replica, which still holds them, into the primary
          - text: Make the replica, where the orders remain, a database of its own
        explanation:
          text: The replica received the delete shortly after the primary, so it lost the orders too.
      - id: reboot
        text: Reboot the primary to roll back the change
        variants:
          - text: Restart the database to undo the delete
          - text: Reboot the DB instance to reverse it
        explanation:
          text: A reboot doesn't undo committed changes.
    correct_answers: [point-in-time-restore]
    hint:
      text: Which copy stopped changing before 15:42?
    explanation:
      text: |
        Damaged or deleted data needs a backup, the only kind of copy that stops changing. The
        standby copies the delete at once and the replica shortly after. Restoring from automated
        backups creates a new database at a moment before the mistake, from which the orders can be
        copied back.

  - id: q05-how-rds-copies-are-kept
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "Backups and snapshots take you back in time"
    task: "3.4"
    level: understanding
    topics: [rds, high-availability, read-scaling]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO statements correctly describe how Amazon RDS keeps its copies of a database? (Select TWO.)
    choices:
      - id: standby-sync
        text: A Multi-AZ standby receives each write synchronously
        variants:
          - text: Every write reaches the standby at the same moment
          - text: The standby is updated in step with the primary
        explanation:
          text: Synchronous copying is why the standby always has every committed change.
      - id: standby-async
        text: A Multi-AZ standby is updated asynchronously
        variants:
          - text: The standby gets changes some time after the primary
          - text: The standby can fall behind the primary
        explanation:
          text: The standby is synchronous; that's what lets it fail over without losing committed data.
      - id: replica-async
        text: A read replica is updated asynchronously and can lag
        variants:
          - text: Changes reach a read replica a little later
          - text: A read replica can fall behind the primary
        explanation:
          text: The delay is called replication lag, and it can vary a lot.
      - id: replica-sync
        text: A read replica is updated synchronously
        variants:
          - text: Each write reaches the read replica at once
          - text: The read replica is always in step
        explanation:
          text: Replicas use the engine's asynchronous replication.
      - id: backups-serve-reads
        text: Automated backups are a live copy that answers queries
        variants:
          - text: Automated backups can be queried directly
          - text: Backups are a running copy you can read from
        explanation:
          text: Backups answer no queries until you restore them to a new database.
    correct_answers: [standby-sync, replica-async]
    explanation:
      text: |
        The Multi-AZ standby gets every write synchronously, so it's always up to date but serves
        no queries. A read replica gets changes asynchronously, so it can lag, but it answers
        read-only queries. Backups are a daily snapshot plus a log of every change, and answer
        nothing until restored.

  - id: q05-what-amazon-aurora-is
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "Amazon Aurora is AWS's own relational engine in the RDS family"
    task: "3.4"
    level: recall
    topics: [aurora]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes Amazon Aurora?
    choices:
      - id: key-value
        text: AWS's serverless NoSQL database for items fetched by key
        variants:
          - text: A NoSQL database that stores items under a key
          - text: AWS's key-value database with no servers to run
        explanation:
          text: That's Amazon DynamoDB.
      - id: aurora
        text: AWS's relational engine, compatible with MySQL and PostgreSQL
        variants:
          - text: A relational engine built by AWS for MySQL and PostgreSQL apps
          - text: AWS's own MySQL- and PostgreSQL-compatible relational engine
        explanation:
          text: Aurora is part of the RDS family, managed through RDS, with storage copied across three AZs.
      - id: warehouse
        text: AWS's data warehouse for analysis over many years of data
        variants:
          - text: A warehouse that runs analytics on large amounts of historical data
          - text: AWS's service for analyzing many years of business data
        explanation:
          text: That's Amazon Redshift.
      - id: cache
        text: AWS's in-memory cache that answers in microseconds
        variants:
          - text: A cache that serves repeated reads from memory
          - text: AWS's memory-based store for microsecond reads
        explanation:
          text: That's Amazon ElastiCache.
    correct_answers: [aurora]
    explanation:
      text: |
        Amazon Aurora is a relational engine AWS built for the cloud, compatible with MySQL and
        PostgreSQL and managed through RDS. Its storage grows by itself and is copied across three
        AZs, and it supports up to 15 replicas that can also be failover targets. The exam names
        RDS and Aurora as its relational examples.

  - id: q05-oracle-features-needed
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "Amazon Aurora is AWS's own relational engine in the RDS family"
    task: "3.4"
    level: understanding
    topics: [rds, aurora]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's purchasing system depends on features of Oracle Database. The company wants AWS
        to run the database for it. Which option fits?
    choices:
      - id: aurora
        text: Amazon Aurora
        variants:
          - text: An Amazon Aurora DB cluster
          - text: Aurora
        explanation:
          text: Aurora is compatible with MySQL and PostgreSQL, not Oracle.
      - id: documentdb
        text: Amazon DocumentDB
        variants:
          - text: Amazon DocumentDB (with MongoDB compatibility)
          - text: DocumentDB
        explanation:
          text: DocumentDB is a document database compatible with MongoDB, not a relational Oracle engine.
      - id: rds-oracle
        text: Amazon RDS for Oracle
        variants:
          - text: Oracle Database on Amazon RDS
          - text: An RDS for Oracle DB instance
        explanation:
          text: Oracle Database is one of RDS's engines, so AWS runs it while the software keeps its Oracle features.
      - id: dynamodb
        text: Amazon DynamoDB
        variants:
          - text: A table in Amazon DynamoDB
          - text: DynamoDB
        explanation:
          text: DynamoDB is a NoSQL key-value database, not Oracle.
    correct_answers: [rds-oracle]
    hint:
      text: Aurora is compatible with two engines. Is Oracle one of them?
    explanation:
      text: |
        Choose Aurora when you want MySQL or PostgreSQL compatibility with more performance and
        availability built in. When software needs Oracle, SQL Server, Db2, MariaDB, or plain MySQL
        or PostgreSQL, choose that engine on RDS. Here, RDS for Oracle keeps the features and leaves
        the running of the database to AWS.

  - id: q05-database-survives-region-loss
    page: guide/05-storing-data/10-sim-multi-az-vs-read-replica.md
    section: "Decision 5 (challenge): losing the whole Region"
    task: "3.4"
    level: application
    topics: [rds, disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's RDS database runs in one Region with a Multi-AZ deployment. It must be able to
        recover within a day if that whole Region becomes unusable, at the lowest ongoing cost. What
        should it add?
    choices:
      - id: longer-retention
        text: Longer automated backup retention in the same Region
        variants:
          - text: More days of backups, kept in the same Region
          - text: A longer retention period for the local backups
        explanation:
          text: Backups kept only in the lost Region are lost with it.
      - id: second-standby
        text: A second standby in a third Availability Zone
        variants:
          - text: Another standby in a third AZ of the Region
          - text: An extra standby copy in one more AZ
        explanation:
          text: Every AZ is inside the same Region, so a Region-wide outage takes them all.
      - id: same-region-replica
        text: A read replica in another AZ of the same Region
        variants:
          - text: A replica in a different AZ of that Region
          - text: An RDS read replica elsewhere in the Region
        explanation:
          text: A replica in the same Region goes down with the Region.
      - id: cross-region-backup-copies
        text: Backups copied to a second Region on a schedule
        variants:
          - text: Copies of the backups kept in another Region
          - text: Scheduled backup copies to a different Region
        explanation:
          text: Backups copied to another Region, for example by AWS Backup, can be restored there within hours, without paying for a running database.
    correct_answers: [cross-region-backup-copies]
    hint:
      text: Every option inside the Region fails with the Region. What is the cheapest copy outside it?
    explanation:
      text: |
        Multi-AZ protects against losing an AZ, not a Region: both copies are in the same Region.
        Copying backups to a second Region, for example with AWS Backup, allows a restore there
        within hours, which fits a one-day recovery time. A cross-Region read replica would recover
        faster but runs, and bills, all the time.

  - id: q05-backups-kept-too-briefly
    page: guide/05-storing-data/10-sim-multi-az-vs-read-replica.md
    section: "Decision 4: \"Backups are automatic, so we're covered for mistakes.\""
    task: "3.4"
    level: application
    topics: [rds, backup]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A bookkeeper checks a company's orders once a month. The company's RDS database keeps
        automated backups for the default retention period. A mistake made early in the month is
        found only at month-end, too late to restore. What should the company change?
    choices:
      - id: retention-and-snapshots
        text: Raise backup retention and take a manual snapshot each month
        variants:
          - text: Keep backups longer, and add a manual snapshot monthly
          - text: Extend retention and keep a monthly manual snapshot
        explanation:
          text: Longer retention covers more of the month, and manual snapshots stay until you delete them.
      - id: add-multi-az
        text: Add a Multi-AZ standby to hold the older data
        variants:
          - text: Turn on Multi-AZ so a copy keeps the old data
          - text: Use a Multi-AZ standby as the older copy
        explanation:
          text: The standby copies every change at once, mistakes included; it holds no older data.
      - id: add-replica
        text: Add a read replica that keeps the earlier data
        variants:
          - text: Keep last month's data on a read replica
          - text: Use a read replica to hold the earlier orders
        explanation:
          text: A replica receives the same changes, just a little later, so it copies the mistake too.
      - id: nothing-needed
        text: Nothing, because automated backups keep the database's whole history
        variants:
          - text: No change, since automated backups keep every past state of it
          - text: Nothing, as automated backups can go back to any past moment
        explanation:
          text: Automated backups reach back only as far as the retention period.
    correct_answers: [retention-and-snapshots]
    hint:
      text: Backups take you back only as far as you keep them.
    explanation:
      text: |
        RDS keeps automated backups for 7 days by default, up to 35 (as of 2026-10-23), so a
        mistake older than the retention period can't be undone. Raise the retention and take
        monthly manual snapshots, which are kept until you delete them. Backup storage costs money,
        so keep what the checking routine needs.

  - id: q05-stopped-rds-database
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "What you pay for"
    task: "3.4"
    level: understanding
    topics: [rds, database-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: To save money, a team stops an RDS DB instance that it won't need for a month. What should the team know?
    choices:
      - id: free-while-stopped
        text: A stopped database costs nothing until it's started
        variants:
          - text: Nothing is billed while the database is stopped
          - text: Stopping it ends every charge until it restarts
        explanation:
          text: A stopped database still pays for its storage and backups.
      - id: storage-and-restart
        text: Storage is still billed, and RDS restarts it after seven days
        variants:
          - text: It still pays for storage, and RDS restarts it after a week
          - text: Storage charges go on, and it restarts itself after 7 days
        explanation:
          text: Storage and backups keep billing, and RDS starts the database again by itself after seven days.
      - id: deleted-after-week
        text: RDS deletes a database that has stayed stopped for a whole week
        variants:
          - text: After seven days in the stopped state, RDS deletes the database
          - text: A full week in the stopped state makes RDS remove the database
        explanation:
          text: RDS doesn't delete it; it starts it again.
      - id: loses-data
        text: Stopping it erases the data, as with instance store
        variants:
          - text: The data is lost on a stop, like instance store
          - text: A stop wipes its data, just as with instance store
        explanation:
          text: RDS storage persists through a stop; the instance store rule doesn't apply.
    correct_answers: [storage-and-restart]
    explanation:
      text: |
        A stopped RDS database still pays for storage and backups, and RDS starts it again by itself
        after seven days (as of 2026-10-23). A month-long pause therefore needs a plan: stop it
        again, or take a snapshot and delete the database. Instance hours are billed per second
        whenever it runs.

  - id: q05-application-after-failover
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "A Multi-AZ deployment keeps the database running when an Availability Zone fails"
    task: "3.4"
    level: understanding
    topics: [rds, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: An RDS Multi-AZ deployment fails over after its primary's Availability Zone goes down. What must the application do to keep working?
    choices:
      - id: change-address
        text: Switch its connection settings to the standby's own address
        variants:
          - text: Change its configuration to use the standby's address
          - text: Point itself at the standby's separate network address
        explanation:
          text: The application doesn't need the standby's address; RDS moves the name it already uses.
      - id: promote-by-hand
        text: Wait for someone to promote the standby by hand
        variants:
          - text: Have an admin promote the standby, then reconnect
          - text: Reconnect once a person has promoted the standby
        explanation:
          text: Multi-AZ failover is automatic; promotion by hand belongs to read replicas.
      - id: reconnect-same-name
        text: Reconnect to the same name, which RDS has moved
        variants:
          - text: Reconnect to its usual name; RDS repointed it
          - text: Reconnect to the same endpoint, now on the new primary
        explanation:
          text: RDS points the database's name at the standby, which becomes the new primary.
      - id: restore-snapshot
        text: Restore the latest snapshot and connect to it
        variants:
          - text: Connect to a database restored from a snapshot
          - text: Restore from a backup and use the new database
        explanation:
          text: A restore creates a new database and takes time; failover makes it unnecessary.
    correct_answers: [reconnect-same-name]
    explanation:
      text: |
        In a Multi-AZ failover, RDS points the database's name at the standby, which becomes the new
        primary, typically within one to two minutes. The application keeps using the same name and
        simply reconnects; no one has to act.

  # ---------------------------------------------------------------- 05.06 Choosing a database

  - id: q05-ticket-baskets-by-id
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DynamoDB stores items by key, at any scale, with no servers to run"
    task: "3.4"
    level: application
    topics: [dynamodb, choosing-a-database]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A concert-ticket site keeps each visitor's basket while they shop. Baskets are always looked
        up by basket ID, read and written many times a minute, and thrown away after the visit.
        Traffic jumps tenfold when a big show goes on sale. Which database fits the baskets best?
    choices:
      - id: rds-mysql
        text: Amazon RDS for MySQL
        variants:
          - text: A MySQL database on Amazon RDS
          - text: RDS for MySQL
        explanation:
          text: RDS runs on DB instances sized for the peak, and the baskets don't need relational joins.
      - id: redshift
        text: Amazon Redshift
        variants:
          - text: An Amazon Redshift data warehouse
          - text: Redshift
        explanation:
          text: Redshift is a warehouse for analysis, not for the small, fast reads and writes of a shopping session.
      - id: neptune
        text: Amazon Neptune
        variants:
          - text: A graph database in Amazon Neptune
          - text: Neptune
        explanation:
          text: Neptune is for relationships many links deep; a basket fetched by its ID isn't that.
      - id: dynamodb
        text: Amazon DynamoDB
        variants:
          - text: A table in Amazon DynamoDB
          - text: DynamoDB
        explanation:
          text: "Items fetched by one key, at any scale, with no servers to size: the key-value shape DynamoDB is built for."
    correct_answers: [dynamodb]
    hint:
      text: How is each basket found, and what happens to the load when a big show goes on sale?
    explanation:
      text: |
        Baskets are always fetched by one key, which is the key-value shape, so relational joins
        aren't needed. Amazon DynamoDB is serverless, keeps single-digit millisecond responses at
        any scale, and in on-demand mode needs no capacity planning for a spike. AWS lists shopping
        carts among its own examples.

  - id: q05-linked-order-tables
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Relational databases fit structured data that links together"
    task: "3.4"
    level: application
    topics: [relational-databases, choosing-a-database]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A wholesaler's ordering system keeps customers, orders and order lines in tables that link to
        each other. Each order and its lines must be saved together or not at all, and the accounts
        team runs SQL queries that join the tables. Which database fits?
    choices:
      - id: aurora
        text: Amazon Aurora
        variants:
          - text: An Amazon Aurora database
          - text: Aurora
        explanation:
          text: Aurora is a relational engine in the RDS family, with linked tables, transactions and SQL joins.
      - id: dynamodb
        text: Amazon DynamoDB
        variants:
          - text: A table in Amazon DynamoDB
          - text: DynamoDB
        explanation:
          text: DynamoDB stores items fetched by key and doesn't join tables.
      - id: elasticache
        text: Amazon ElastiCache
        variants:
          - text: An Amazon ElastiCache cache
          - text: ElastiCache
        explanation:
          text: ElastiCache is a cache in front of a main store, not the database of record for orders.
      - id: neptune
        text: Amazon Neptune
        variants:
          - text: A graph database in Amazon Neptune
          - text: Neptune
        explanation:
          text: Neptune is a graph database for relationships many links deep, not transactional order tables.
    correct_answers: [aurora]
    hint:
      text: Linked tables, all-or-nothing saves and SQL joins describe one shape of data.
    explanation:
      text: |
        Structured data whose parts relate to each other fits a relational database, which keeps it
        in linked tables and changes several tables together in one transaction, so an order is
        never half-saved. On AWS that means Amazon RDS or Amazon Aurora, the exam's relational
        examples.

  - id: q05-same-queries-thousands-of-times
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "ElastiCache answers from memory in microseconds"
    task: "3.4"
    level: application
    topics: [elasticache, choosing-a-database]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online magazine's database is overloaded by the same few popular article queries,
        repeated thousands of times a minute. The team wants those reads answered in microseconds
        without changing the main database. What should it add?
    choices:
      - id: multi-az
        text: A Multi-AZ standby for the database
        variants:
          - text: RDS Multi-AZ for the main database
          - text: A standby copy of the database in another AZ
        explanation:
          text: A Multi-AZ standby serves no reads; it adds availability, not capacity.
      - id: elasticache
        text: Amazon ElastiCache in front of the database
        variants:
          - text: An ElastiCache cache in front of the main store
          - text: ElastiCache, placed in front of the database
        explanation:
          text: A cache answers the repeated reads from memory in microseconds, so they never reach the database.
      - id: redshift
        text: Amazon Redshift beside the database
        variants:
          - text: A Redshift warehouse next to the database
          - text: Redshift, alongside the main database
        explanation:
          text: Redshift runs large analytical queries; it doesn't serve a website's repeated reads in microseconds.
      - id: documentdb
        text: Amazon DocumentDB in place of the database
        variants:
          - text: DocumentDB as the new main database
          - text: A move of the main store to DocumentDB
        explanation:
          text: Replacing the main database is the change the team wants to avoid, and DocumentDB doesn't answer from memory.
    correct_answers: [elasticache]
    hint:
      text: The same data is read again and again. What keeps those reads from reaching the database at all?
    explanation:
      text: |
        Amazon ElastiCache keeps data in memory and answers in microseconds. Placed in front of a
        slower database as a cache, it answers repeated reads so the database stops seeing them. A
        cache is added in front of a main store, never instead of one.

  - id: q05-catalog-written-for-mongodb
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DocumentDB fits documents; Neptune fits relationships"
    task: "3.4"
    level: application
    topics: [documentdb, choosing-a-database]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team's product catalog application is written with MongoDB drivers and tools, and each
        product's record has different fields. The team wants a managed AWS database it can use
        with few code changes. Which service fits?
    choices:
      - id: dynamodb
        text: Amazon DynamoDB
        variants:
          - text: A table in Amazon DynamoDB
          - text: DynamoDB
        explanation:
          text: DynamoDB also stores documents, but it isn't compatible with MongoDB's drivers and tools.
      - id: neptune
        text: Amazon Neptune
        variants:
          - text: A graph database in Amazon Neptune
          - text: Neptune
        explanation:
          text: Neptune is a graph database for relationships, not MongoDB documents.
      - id: documentdb
        text: Amazon DocumentDB
        variants:
          - text: An Amazon DocumentDB database
          - text: DocumentDB
        explanation:
          text: DocumentDB is a managed document database that works with MongoDB's drivers and tools.
      - id: rds-mysql
        text: Amazon RDS for MySQL
        variants:
          - text: A MySQL database on Amazon RDS
          - text: RDS for MySQL
        explanation:
          text: A relational database expects a fixed schema, and MongoDB code wouldn't work with it unchanged.
    correct_answers: [documentdb]
    hint:
      text: Two AWS databases store documents. Which detail in the question tells them apart?
    explanation:
      text: |
        Amazon DocumentDB (with MongoDB compatibility) is a managed document database for records
        whose fields vary, and it works with MongoDB's drivers and tools. DynamoDB also stores
        documents; the existing MongoDB code is what points to DocumentDB.

  - id: q05-friends-of-friends
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DocumentDB fits documents; Neptune fits relationships"
    task: "3.4"
    level: understanding
    topics: [neptune, choosing-a-database]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A social app wants to suggest new connections by finding people who are friends of a
        user's friends, several links away, across millions of members. Which database is built
        for this shape of data?
    choices:
      - id: documentdb
        text: Amazon DocumentDB
        variants:
          - text: Amazon DocumentDB (with MongoDB compatibility)
          - text: DocumentDB
        explanation:
          text: DocumentDB keeps self-contained documents; following chains of links between them isn't its strength.
      - id: redshift
        text: Amazon Redshift
        variants:
          - text: An Amazon Redshift data warehouse
          - text: Redshift
        explanation:
          text: Redshift analyzes large historical data; it isn't built to follow relationships link by link.
      - id: elasticache
        text: Amazon ElastiCache
        variants:
          - text: An Amazon ElastiCache cache
          - text: ElastiCache
        explanation:
          text: ElastiCache speeds up reads of data stored elsewhere; it isn't a model for relationships.
      - id: neptune
        text: Amazon Neptune
        variants:
          - text: An Amazon Neptune database
          - text: Neptune
        explanation:
          text: Neptune is a managed graph database, built for questions about connections many links deep.
    correct_answers: [neptune]
    hint:
      text: The question is about connections between things, several steps deep.
    explanation:
      text: |
        A graph database stores things and the connections between them, so it answers questions
        that follow relationships many links deep. Amazon Neptune is AWS's; AWS lists
        recommendation engines, fraud detection and knowledge graphs among its uses.

  - id: q05-redshift-statements
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Redshift studies the business; it doesn't run the shop"
    task: "3.4"
    level: recall
    topics: [redshift, choosing-a-database]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO statements describe Amazon Redshift? (Select TWO.)
    choices:
      - id: website-transactions
        text: It's built for the many small writes of a busy website
        variants:
          - text: It's designed for a website's stream of small transactions
          - text: It's meant to handle an online store's order writes
        explanation:
          text: That's transactional work, which RDS and Aurora do; Redshift studies the business.
      - id: warehouse
        text: It's a managed data warehouse for analyzing large amounts of data
        variants:
          - text: It's a managed warehouse for big analytical queries
          - text: It analyzes very large datasets as a managed data warehouse
        explanation:
          text: Redshift is a fully managed data warehouse holding up to petabytes of data.
      - id: key-value
        text: It stores items by key with single-digit millisecond reads
        variants:
          - text: It fetches items by their key in milliseconds
          - text: It's a key-value store answering in milliseconds
        explanation:
          text: That's DynamoDB.
      - id: sql-many-sources
        text: It runs SQL analysis over data gathered from many sources
        variants:
          - text: It uses SQL to query data collected from many systems
          - text: It answers SQL questions across data from many sources
        explanation:
          text: Redshift gathers data from many sources and answers large questions across it in SQL.
      - id: memory-cache
        text: It caches hot data in memory for microsecond reads
        variants:
          - text: It keeps hot data in memory, answering in microseconds
          - text: It serves repeated reads from memory in microseconds
        explanation:
          text: That's ElastiCache.
    correct_answers: [warehouse, sql-many-sources]
    explanation:
      text: |
        Amazon Redshift is a fully managed data warehouse: it gathers data from many sources and runs
        large SQL analyses across it. It studies the business rather than running it; the exam guide
        places it in its analytics category. Both Redshift and RDS use SQL, so the difference is the
        work, not the language.

  - id: q05-checkout-on-redshift
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Redshift studies the business; it doesn't run the shop"
    task: "3.4"
    level: understanding
    topics: [redshift, relational-databases]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer proposes running an online shop's checkout database on Amazon Redshift, because
        it is fast and uses SQL. What is the best response?
    choices:
      - id: use-transactional
        text: Run checkout on RDS or Aurora; Redshift is for analysis
        variants:
          - text: Keep checkout on RDS or Aurora, since Redshift is for analytics
          - text: Use RDS or Aurora for checkout; Redshift studies data instead
        explanation:
          text: Checkout is many small reads and writes, which is transactional work; Redshift runs large analytical queries.
      - id: agree
        text: Agree, since speed and SQL make Redshift fit for checkout
        variants:
          - text: Go ahead, because Redshift's speed and SQL suit checkout
          - text: Accept it, as a fast SQL database suits checkout well
        explanation:
          text: Both kinds of database use SQL; what differs is the work each is built for.
      - id: elasticache-only
        text: Use ElastiCache as the checkout's only database instead
        variants:
          - text: Make ElastiCache the sole database for checkout
          - text: Keep checkout data in ElastiCache alone instead
        explanation:
          text: ElastiCache is a cache in front of a main store, not the database of record for orders.
      - id: neptune
        text: Use Neptune, because orders link customers to products
        variants:
          - text: Choose Neptune, since orders connect customers and products
          - text: Move checkout to Neptune, as orders relate customers to items
        explanation:
          text: Orders link a few tables, which relational databases handle; Neptune is for relationships many links deep.
    correct_answers: [use-transactional]
    explanation:
      text: |
        Redshift is built for big analytical queries over data gathered from many sources, not for
        the stream of small reads and writes a checkout makes. The shop should keep orders in a
        transactional database such as RDS or Aurora, and Redshift can later receive copies of that
        data for analysis.

  - id: q05-dynamodb-statements
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DynamoDB stores items by key, at any scale, with no servers to run"
    task: "3.4"
    level: understanding
    topics: [dynamodb]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO statements about Amazon DynamoDB are correct? (Select TWO.)
    choices:
      - id: joins
        text: It joins tables in SQL, like a relational database
        variants:
          - text: It joins related tables the way RDS does
          - text: It runs SQL joins across its tables
        explanation:
          text: DynamoDB doesn't join tables; AWS recommends shaping data around how it will be read.
      - id: no-servers
        text: There are no servers for you to size or patch
        variants:
          - text: You never size or patch servers for it
          - text: It has no servers for the customer to size or patch
        explanation:
          text: DynamoDB is serverless and fully managed, with no versions to upgrade and no maintenance windows.
      - id: engine-version
        text: You choose and upgrade its database engine version
        variants:
          - text: You pick an engine version and keep it upgraded
          - text: Its engine version is yours to choose and upgrade
        explanation:
          text: There are no engine versions to choose or upgrade in DynamoDB.
      - id: on-demand-per-request
        text: In on-demand mode, it bills per read and write request
        variants:
          - text: On-demand capacity charges for each read and write
          - text: With on-demand capacity, you pay for each request
        explanation:
          text: On-demand mode bills per request, with nothing to plan; an idle table pays only for storage.
      - id: memory-by-default
        text: It answers from memory in microseconds by default
        variants:
          - text: By default its reads come from memory in microseconds
          - text: Out of the box it serves reads in microseconds
        explanation:
          text: DynamoDB answers in single-digit milliseconds; DAX adds a cache for microsecond reads.
    correct_answers: [no-servers, on-demand-per-request]
    explanation:
      text: |
        DynamoDB is serverless NoSQL: no servers to size or patch, no engine versions, single-digit
        millisecond responses at any scale. In on-demand mode it bills per request, which makes it
        a purely variable cost. It doesn't join tables, and microsecond reads need DAX.

  - id: q05-unknown-traffic-new-table
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DynamoDB stores items by key, at any scale, with no servers to run"
    task: "3.4"
    level: application
    topics: [dynamodb, database-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup is launching an app on DynamoDB. It has no idea how much traffic to expect, and
        traffic may spike suddenly. It wants no capacity planning and to pay only for the requests
        it serves. Which option should it choose?
    choices:
      - id: provisioned
        text: Provisioned capacity
        variants:
          - text: Provisioned capacity mode
          - text: The provisioned capacity mode
        explanation:
          text: Provisioned capacity means setting reads and writes per second and paying by the hour, which suits steady, predictable traffic.
      - id: on-demand
        text: On-demand capacity
        variants:
          - text: On-demand capacity mode
          - text: The on-demand capacity mode
        explanation:
          text: On-demand bills per request, with no capacity to plan; it scales up for a spike and back down.
      - id: dax
        text: DynamoDB Accelerator (DAX)
        variants:
          - text: A DAX cache for the table
          - text: DAX in front of the table
        explanation:
          text: DAX is a cache for faster reads; it doesn't change how capacity is planned or billed.
      - id: global-tables
        text: DynamoDB global tables
        variants:
          - text: A global table across Regions
          - text: Global tables in DynamoDB
        explanation:
          text: Global tables copy a table across Regions; they don't remove capacity planning.
    correct_answers: [on-demand]
    hint:
      text: Unknown and spiky traffic, and paying per request - which capacity mode needs nothing set in advance?
    explanation:
      text: |
        DynamoDB's on-demand capacity mode bills per read and write request, with no capacity to
        plan: the table scales up for a spike and back down. Provisioned capacity, where you set
        reads and writes per second, can cost less for steady, predictable traffic.

  - id: q05-players-on-three-continents
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DynamoDB stores items by key, at any scale, with no servers to run"
    task: "3.4"
    level: understanding
    topics: [dynamodb, disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A gaming company's DynamoDB table serves players on three continents. It wants players to
        use a copy of the table in a Region near them, and the game to survive the loss of a whole
        Region. Which feature fits?
    choices:
      - id: dax
        text: DynamoDB Accelerator (DAX)
        variants:
          - text: A DAX cache for the table
          - text: DAX in front of the table
        explanation:
          text: DAX speeds up reads with a cache; it doesn't copy the table to other Regions.
      - id: point-in-time-recovery
        text: Point-in-time recovery
        variants:
          - text: The table's point-in-time recovery
          - text: Point-in-time recovery for the table
        explanation:
          text: Point-in-time recovery restores the table as it was; it doesn't serve players from other Regions.
      - id: global-tables
        text: DynamoDB global tables
        variants:
          - text: A global table across Regions
          - text: Global tables in DynamoDB
        explanation:
          text: A global table is copied across several Regions, for users around the world and for surviving a Region's loss.
      - id: on-demand
        text: On-demand capacity
        variants:
          - text: On-demand capacity mode
          - text: The on-demand capacity mode
        explanation:
          text: On-demand changes how capacity is billed, not where the data lives.
    correct_answers: [global-tables]
    hint:
      text: Both needs call for copies of the table in more than one Region.
    explanation:
      text: |
        DynamoDB global tables copy one table across several Regions, so users around the world
        reach a nearby copy, and the table survives the loss of a Region. Check data-residency rules
        first: adding a Region copies the data there.

  - id: q05-microsecond-dynamodb-reads
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "DynamoDB stores items by key, at any scale, with no servers to run"
    task: "3.4"
    level: recall
    topics: [dynamodb]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An application's DynamoDB reads take single-digit milliseconds, and the team needs them in
        microseconds while keeping DynamoDB. Which feature is built for this?
    choices:
      - id: global-tables
        text: DynamoDB global tables
        variants:
          - text: A global table across Regions
          - text: Global tables in DynamoDB
        explanation:
          text: Global tables copy data across Regions; reads stay in milliseconds.
      - id: provisioned
        text: Provisioned capacity
        variants:
          - text: Provisioned capacity mode
          - text: The provisioned capacity mode
        explanation:
          text: Provisioned capacity changes billing and planning, not where reads come from.
      - id: point-in-time-recovery
        text: Point-in-time recovery
        variants:
          - text: The table's point-in-time recovery
          - text: Point-in-time recovery for the table
        explanation:
          text: Point-in-time recovery is a backup feature.
      - id: dax
        text: DynamoDB Accelerator (DAX)
        variants:
          - text: A DAX cache for the table
          - text: DAX in front of the table
        explanation:
          text: DAX is an in-memory cache built only for DynamoDB, turning millisecond reads into microsecond ones.
    correct_answers: [dax]
    explanation:
      text: |
        DynamoDB Accelerator (DAX) is an in-memory cache built for DynamoDB, which turns its
        millisecond reads into microsecond reads. ElastiCache is the general in-memory service that
        sits in front of other stores, such as an RDS database.

  - id: q05-tool-that-moves-the-data
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Moving a database in: DMS moves the data, SCT converts the schema"
    task: "3.4"
    level: understanding
    topics: [database-migration]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company is moving a database into AWS and must keep the source database running until the
        switch-over. Which service copies the data, and then each new change, into the target?
    choices:
      - id: dms
        text: AWS Database Migration Service (AWS DMS)
        variants:
          - text: AWS DMS
          - text: The AWS Database Migration Service
        explanation:
          text: DMS copies the data while the source keeps running, then keeps copying each new change until you switch over.
      - id: sct
        text: AWS Schema Conversion Tool (AWS SCT)
        variants:
          - text: AWS SCT
          - text: The AWS Schema Conversion Tool
        explanation:
          text: SCT converts the schema when the engine changes; it moves no data.
      - id: datasync
        text: AWS DataSync
        variants:
          - text: The AWS DataSync service
          - text: DataSync
        explanation:
          text: DataSync moves files and objects between storage systems; it doesn't keep a running database's changes in step.
      - id: aws-backup
        text: AWS Backup
        variants:
          - text: A backup plan in AWS Backup
          - text: The AWS Backup service
        explanation:
          text: AWS Backup protects resources already in AWS; it isn't a migration tool.
    correct_answers: [dms]
    explanation:
      text: |
        AWS DMS moves the data. It copies a database into AWS while the source keeps running, then
        copies each new change, called change data capture, until you switch over, which keeps
        downtime short. DMS is used in every database migration; SCT only joins it when the engine
        changes.

  - id: q05-sql-server-to-aurora-mysql
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Moving a database in: DMS moves the data, SCT converts the schema"
    task: "3.4"
    level: application
    topics: [database-migration]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company is moving an on-premises Microsoft SQL Server database to Amazon Aurora MySQL, and
        the database must keep serving the business during the move. Which TWO AWS tools fit this
        move? (Select TWO.)
    choices:
      - id: sct
        text: AWS Schema Conversion Tool (AWS SCT)
        variants:
          - text: AWS SCT
          - text: The AWS Schema Conversion Tool
        explanation:
          text: The engine changes, so the schema must be converted first, with SCT or DMS Schema Conversion.
      - id: datasync
        text: AWS DataSync
        variants:
          - text: The AWS DataSync service
          - text: DataSync
        explanation:
          text: DataSync moves files and objects, not a running database's data and changes.
      - id: dms
        text: AWS Database Migration Service (AWS DMS)
        variants:
          - text: AWS DMS
          - text: The AWS Database Migration Service
        explanation:
          text: DMS moves the data while SQL Server keeps running, and keeps copying changes until the switch-over.
      - id: storage-gateway
        text: AWS Storage Gateway
        variants:
          - text: A Storage Gateway in the company's office
          - text: Storage Gateway
        explanation:
          text: Storage Gateway connects on-premises software to AWS storage; it doesn't migrate databases.
      - id: drs
        text: AWS Elastic Disaster Recovery
        variants:
          - text: Elastic Disaster Recovery (AWS DRS)
          - text: AWS DRS
        explanation:
          text: Elastic Disaster Recovery keeps servers ready for failover; it can't change a database's engine.
    correct_answers: [sct, dms]
    hint:
      text: The engine changes. Which tool translates the structure, and which one moves the data?
    explanation:
      text: |
        Changing engines makes this a heterogeneous migration. First AWS SCT (or DMS Schema
        Conversion) converts the schema, the tables, views, stored procedures and functions. Then AWS
        DMS moves the data with the source still running. SCT alone moves no data, and DMS alone
        can't change the engine.

  - id: q05-same-engine-migration
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Moving a database in: DMS moves the data, SCT converts the schema"
    task: "3.4"
    level: understanding
    topics: [database-migration]
    type: multiple_choice
    selection: single
    prompt:
      text: A company moves an on-premises MySQL database to Amazon RDS for MySQL. Which statement about this migration is correct?
    choices:
      - id: sct-always
        text: It needs AWS SCT first, since every migration converts the schema
        variants:
          - text: AWS SCT must convert the schema before any data moves
          - text: Schema conversion with SCT always has to come first
        explanation:
          text: The schema needs converting only when the engine changes.
      - id: dms-alone
        text: The engine stays the same, so AWS DMS alone can move it
        variants:
          - text: It's homogeneous, so DMS by itself is enough
          - text: As a same-engine move, DMS can move it without SCT
        explanation:
          text: In a homogeneous migration the schema fits as it is, so DMS alone moves the data.
      - id: sct-moves-data
        text: AWS SCT moves the data, so DMS isn't needed
        variants:
          - text: SCT alone copies all the data across
          - text: Only SCT is needed, to copy the data over
        explanation:
          text: SCT moves no data; DMS does the moving in every migration.
      - id: heterogeneous
        text: It's heterogeneous, because the database moves into AWS
        variants:
          - text: Moving into AWS makes it a heterogeneous migration
          - text: Any move into AWS counts as heterogeneous
        explanation:
          text: Heterogeneous means the engine changes; here MySQL stays MySQL.
    correct_answers: [dms-alone]
    explanation:
      text: |
        A homogeneous migration keeps the same engine, such as MySQL to RDS for MySQL, so the schema
        fits as it is and AWS DMS alone can move the data. A heterogeneous migration changes the
        engine and needs the schema converted first, with SCT or DMS Schema Conversion.

  - id: q05-change-data-capture
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Moving a database in: DMS moves the data, SCT converts the schema"
    task: "3.4"
    level: recall
    topics: [database-migration]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After the first full copy, AWS DMS can keep the target in step with everything written to
        the source until the switch-over. What is this called?
    choices:
      - id: schema-conversion
        text: Schema conversion
        variants:
          - text: Converting the schema
          - text: Schema translation
        explanation:
          text: Schema conversion translates the structure for a new engine; it's SCT's job.
      - id: point-in-time-recovery
        text: Point-in-time recovery
        variants:
          - text: Recovery to a point in time
          - text: Point-in-time restore
        explanation:
          text: Point-in-time recovery restores a database as it was; it's a backup feature.
      - id: cdc
        text: Change data capture
        variants:
          - text: Change data capture (CDC)
          - text: CDC, or change data capture
        explanation:
          text: Change data capture copies each new change after the first full copy.
      - id: multi-az
        text: Multi-AZ replication
        variants:
          - text: Replication across AZs
          - text: Multi-AZ copying
        explanation:
          text: Multi-AZ keeps a standby of one RDS database; it isn't a migration feature.
    correct_answers: [cdc]
    explanation:
      text: |
        Change data capture is DMS copying each new change after the first full copy, so the target
        stays in step until you switch over, or for as long as you like. That ongoing copy is the
        "database replication" migration strategy that the exam guide names in task 1.3.

  - id: q05-dynamodb-customer-task
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Your side of the line"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, dynamodb]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A game studio keeps player profiles in Amazon DynamoDB tables. Its security review lists
        four jobs and asks who does each. Which job falls to the studio rather than to AWS?
    choices:
      - id: patch-os
        text: Patching the operating system of DynamoDB's servers
        variants:
          - text: Applying OS updates to the servers behind DynamoDB
          - text: Installing patches on DynamoDB's operating system
        explanation:
          text: DynamoDB is an abstracted service; AWS runs the infrastructure, operating system and platform.
      - id: copy-across-azs
        text: Copying each table's data across three Availability Zones
        variants:
          - text: Replicating every table's data to three AZs
          - text: Keeping copies of each table in three Availability Zones
        explanation:
          text: It sounds like a backup chore, but by default DynamoDB itself copies your data across three Availability Zones.
      - id: add-servers
        text: Adding servers to DynamoDB as traffic grows
        variants:
          - text: Scaling out DynamoDB's servers for more traffic
          - text: Adding DynamoDB servers when traffic rises
        explanation:
          text: There are no servers to add; AWS handles the capacity.
      - id: iam-permissions
        text: Setting the IAM permissions for who can use each table
        variants:
          - text: Deciding with IAM who may read and write each table
          - text: Granting access to each table through IAM
        explanation:
          text: Your data, its encryption options, and the permissions on it stay on your side.
    correct_answers: [iam-permissions]
    explanation:
      text: |
        AWS's shared responsibility model names DynamoDB, with S3, as an abstracted service: AWS
        runs the infrastructure, the operating system and the platform, so there is nothing to
        patch, and by default it copies your data across three Availability Zones. Your data,
        deciding which data is sensitive, and the IAM permissions on each table stay yours.

  - id: q05-load-one-cart
    page: guide/05-storing-data/08-lab-06-a-dynamodb-table.md
    section: "Get one item, then query one cart"
    task: "3.4"
    level: understanding
    topics: [dynamodb]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A DynamoDB table holds shopping-cart items, with the partition key `CartId` and the sort key
        `Product`. How should the application load every item in one customer's cart?
    choices:
      - id: query-partition-key
        text: Query the table by the cart's CartId
        variants:
          - text: Run a query on the CartId partition key
          - text: Query using the cart's CartId value alone
        explanation:
          text: A query finds every item that shares a partition key, which here is one whole cart.
      - id: get-by-product
        text: Get the items using only the Product sort key
        variants:
          - text: Look items up by the Product sort key alone
          - text: Fetch the items with just the Product value
        explanation:
          text: The sort key only tells apart items within one cart; it doesn't pick the cart.
      - id: sql-join
        text: Join the cart table to a products table in SQL
        variants:
          - text: Use a SQL join between the carts and products
          - text: Join the carts with the product table in SQL
        explanation:
          text: DynamoDB doesn't join tables.
      - id: table-per-cart
        text: Create a separate table for each cart and read it
        variants:
          - text: Give every cart its own table, then read that
          - text: Store each cart in a table of its own and read it
        explanation:
          text: One table holds all carts; the partition key groups each cart's items.
    correct_answers: [query-partition-key]
    explanation:
      text: |
        The partition key picks which group an item belongs to, and the sort key tells the items in
        that group apart. A get with both keys finds exactly one item; a query with the partition key
        alone finds the whole group, which is how a site would load one customer's cart.

flashcards:

  # ---------------------------------------------------------------- 05.01 Block, file, object

  - id: c05-storage-shape-first-question
    page: guide/05-storing-data/01-block-file-object.md
    section: "Worked example: placing the bakery's data"
    level: understanding
    topics: [block-storage, file-storage, object-storage]
    front:
      text: Before you name any storage service, which question picks block, file or object storage?
    back:
      text: |
        How does the program reach the data? As its own disk: block. As shared folders: file. As
        whole files over a web API: object.

  - id: c05-ebs-delete-on-termination
    page: guide/05-storing-data/01-block-file-object.md
    section: "Block storage: a disk attached to one server"
    level: recall
    topics: [ebs]
    front:
      text: When does an EBS volume survive the termination of its instance?
    back:
      text: |
        Only when the volume's **Delete on termination** setting is No. Otherwise terminating the
        instance deletes the volume too.

  - id: c05-ebs-fixed-s3-variable
    page: guide/05-storing-data/01-block-file-object.md
    section: "What you pay for"
    level: understanding
    topics: [storage-pricing, ebs, s3]
    front:
      text: Why does an EBS volume behave like a fixed cost, while S3 behaves like a variable one?
    back:
      text: |
        EBS bills for the size you provision, whether you fill it or not. S3 bills for what you
        actually store, request and transfer out.

  - id: c05-what-each-copy-survives
    page: guide/05-storing-data/01-block-file-object.md
    section: "Where the copies live decides what a failure can take"
    level: understanding
    topics: [durability, availability-zones]
    front:
      text: Which failure can take the data in each of these - instance store, an EBS volume, S3 Standard?
    back:
      text: |
        Instance store: one host failing. An EBS volume: its AZ being destroyed. S3 Standard keeps
        copies in at least three AZs, so losing one AZ doesn't take it.

  # ---------------------------------------------------------------- 05.02 S3 in practice

  - id: c05-durability-doesnt-undo-deletes
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "\"S3 is so durable that AWS can always get my file back\" is wrong"
    level: understanding
    topics: [durability, s3-versioning]
    front:
      text: Can AWS recover an object you deleted from an unversioned S3 bucket?
    back:
      text: |
        No. S3 carries out a delete at once, and durability only protects against hardware losing
        data. Versioning, Object Lock or backups are how you recover from mistakes.

  - id: c05-s3-protections-that-start-off
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "The big picture: five layers, three of them already on"
    level: recall
    topics: [s3-security, s3-versioning]
    front:
      text: Which two S3 data protections start off, so that you must set them up yourself?
    back:
      text: |
        Versioning, and a copy somewhere else (replication or backups). Block Public Access,
        private-by-default access and SSE-S3 encryption start on.

  - id: c05-private-bucket-behind-a-website
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Private by default, and Block Public Access keeps it that way"
    level: understanding
    topics: [s3-security, block-public-access]
    front:
      text: How can a website show images from an S3 bucket that stays private?
    back:
      text: |
        The web server reads the images with its own permissions and sends them to visitors. The
        bucket never has to be open to everyone.

  # ---------------------------------------------------------------- 05.03 Storage classes and lifecycle

  - id: c05-three-questions-pick-a-class
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three questions pick a class: how often, how fast, how replaceable"
    level: understanding
    topics: [s3-storage-classes]
    front:
      text: Which three questions place data among S3's storage classes, from hot to cold?
    back:
      text: |
        How often is it read? How fast must it come back? Could you recreate it if an Availability
        Zone were destroyed?

  - id: c05-check-expiration-after-minimum-stay
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three cost traps"
    level: application
    topics: [s3-lifecycle, storage-pricing]
    front:
      text: Before saving a lifecycle rule, how do you check it for the minimum-stay trap?
    back:
      text: |
        Make sure the expiration comes after the last transition plus that class's minimum storage
        duration. Otherwise you pay for days nobody used.

  - id: c05-tiny-files-stay-in-standard
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three cost traps"
    level: understanding
    topics: [s3-storage-classes, storage-pricing]
    front:
      text: Why do many tiny files usually cost less in S3 Standard than in an IA class?
    back:
      text: |
        The IA classes bill each object under 128 KB as 128 KB (as of 2026-10-23), and every
        transition is a billed request. Standard bills tiny files at their real size.

  - id: c05-object-lock-through-lifecycle
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Your side of the line"
    level: recall
    topics: [object-lock, s3-lifecycle]
    front:
      text: Does S3 Object Lock still protect an object after a lifecycle rule moves it to another storage class?
    back:
      text: Yes. Object Lock's protection stays in force as lifecycle rules move the object between classes.

  - id: c05-more-steps-arent-cheaper
    page: guide/05-storing-data/09-sim-lifecycle-cost-timeline.md
    section: "Decision 3: the owner asks why Plan B, with more steps, costs more"
    level: understanding
    topics: [s3-lifecycle, storage-pricing]
    front:
      text: Does a lifecycle plan with more transition steps usually cost less?
    back:
      text: |
        Not necessarily. A step pays only when it matches a real change in how the data is used.
        Faster classes that the rules don't require just buy speed nobody needs.

  # ---------------------------------------------------------------- 05.04 Hybrid storage and backup

  - id: c05-why-storage-gateway-caches
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Storage Gateway lets on-premises software use AWS storage without changing"
    level: understanding
    topics: [hybrid-storage, storage-gateway]
    front:
      text: Why does AWS Storage Gateway keep a local cache in your building?
    back:
      text: |
        So frequently used data reads fast on site while the data itself lives in AWS. That cache
        is why the exam guide gives Storage Gateway as its "cached file system" example.

  - id: c05-hybrid-service-first-question
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Worked example: matching the bakery's needs to services"
    level: understanding
    topics: [hybrid-storage, backup]
    front:
      text: To choose among Storage Gateway, AWS Backup, Elastic Disaster Recovery and DataSync, what do you ask first?
    back:
      text: |
        Where does the software that uses the data run? In AWS already; on premises (staying
        there, or needing to restart in minutes after a disaster); or nowhere, because it's a
        one-time move.

  - id: c05-after-snowball
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "\"Snowball is the answer for moving lots of data\" is wrong"
    level: recall
    topics: [data-transfer, exam-names]
    front:
      text: AWS Snowball is closed to new customers. Where does AWS point them for moving data into AWS?
    back:
      text: |
        AWS DataSync over the network, AWS Data Transfer Terminal (bring your own drives to an
        upload site), or AWS Partners (as of 2026-10-23).

  # ---------------------------------------------------------------- 05.05 Managed or self-managed databases

  - id: c05-name-the-failure-first
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "Backups and snapshots take you back in time"
    level: understanding
    topics: [rds, high-availability, read-scaling]
    front:
      text: Multi-AZ standby, read replica or backup - how do you decide which one a need calls for?
    back:
      text: |
        Name the failure first. An AZ or server fails: a Multi-AZ standby. Too many reads: a read
        replica. Damaged or deleted data: a backup.

  - id: c05-aurora-replica-exception
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "\"A read replica gives you high availability\" is wrong"
    level: recall
    topics: [aurora, read-scaling]
    front:
      text: Where is "a read replica gives you high availability" partly true?
    back:
      text: |
        In Amazon Aurora, where a replica can be the automatic failover target. For the other RDS
        engines, a replica must be promoted by hand.

  - id: c05-multi-az-stays-in-one-region
    page: guide/05-storing-data/10-sim-multi-az-vs-read-replica.md
    section: "Decision 1: for each event, which copy keeps the bakery going or gets its data back?"
    level: understanding
    topics: [rds, disaster-recovery]
    front:
      text: Why doesn't a Multi-AZ deployment protect a database against losing its Region?
    back:
      text: |
        The primary and the standby are both in AZs of the same Region. Surviving a Region's loss
        takes backups copied to, or a replica in, another Region.

  - id: c05-multi-az-write-cost
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "A Multi-AZ deployment keeps the database running when an Availability Zone fails"
    level: understanding
    topics: [rds, high-availability]
    front:
      text: Besides a higher price, what can a Multi-AZ deployment cost an RDS database, and why?
    back:
      text: Slightly slower writes, because each write waits until both the primary and the standby have it.

  # ---------------------------------------------------------------- 05.06 Choosing a database

  - id: c05-run-or-study-the-business
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Worked example: the bakery's databases"
    level: understanding
    topics: [choosing-a-database, redshift]
    front:
      text: Before you pick a database by the shape of its data, which question comes first?
    back:
      text: |
        Does the data run the business (many small reads and writes) or study it (big questions
        over years, from many sources)? Studying it at scale points to Amazon Redshift.

  - id: c05-purpose-built-not-one-per-kind
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "In real work: purpose-built, but no more than you need"
    level: understanding
    topics: [choosing-a-database]
    front:
      text: Does "use purpose-built databases" mean adding a new database for every kind of data?
    back:
      text: |
        No. Match each kind of data to its shape, then ask whether its scale justifies another
        service. Every extra database has to be paid for, secured and backed up.

  - id: c05-why-orders-are-relational
    page: guide/05-storing-data/06-choosing-a-database.md
    section: "Relational databases fit structured data that links together"
    level: understanding
    topics: [relational-databases, choosing-a-database]
    front:
      text: Why do a shop's orders belong in a relational database?
    back:
      text: |
        An order links a customer, order lines and products in related tables, and a transaction
        saves them all or none, so an order is never half-saved.
