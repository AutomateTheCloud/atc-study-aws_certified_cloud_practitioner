        text: Patching the database server's operating system
        variants:
          - text: Applying OS updates to the database server
          - text: Installing operating system patches
        explanation:
          text: On RDS, AWS installs and patches the operating system.
      - id: tune-queries
        text: Tuning the application's slow queries
        variants:
          - text: Making the application's queries efficient
          - text: Fixing slow-running queries
        explanation:
          text: AWS's RDS guide names query tuning as the customer's.
      - id: patch-engine
        text: Installing and patching MySQL
        variants:
          - text: Applying MySQL software updates
          - text: Upgrading and patching the MySQL engine
        explanation:
          text: RDS installs and patches the database software.
      - id: control-access
        text: Deciding who can reach the database
        variants:
          - text: Choosing who may connect to the database
