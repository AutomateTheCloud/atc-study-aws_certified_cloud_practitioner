# Module 05, Storing data: storage and databases. Questions and concept cards written from
# guide/05-storing-data/. Build fields (page, section, task, level, topics) are described in
# source/practice/build_bundle.py. Blueprint: practice/work/blueprint-05.md.

questions:

  # ---------------------------------------------------------------- 05.01 Block, file, object

  - id: q05-os-disk-survives-stop
    page: guide/05-storing-data/01-block-file-object.md
    section: "Block storage: a disk attached to one server"
    task: "3.6"
    level: application
    topics: [block-storage, ebs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        To save money, a small firm stops its EC2 accounting server every evening and starts it
        again each morning. The server boots from its own disk, which also holds the accounting
        software, and nothing on that disk may be lost overnight. What should that disk be?
    choices:
      - id: instance-store
        text: EC2 instance store
        variants:
          - text: The instance's instance store volumes
          - text: Instance store disks on the host
        explanation:
          text: Instance store is temporary. It belongs to the physical host, and the nightly stop would erase every block on it.
      - id: ebs
        text: Amazon EBS
        variants:
          - text: Amazon Elastic Block Store (Amazon EBS)
          - text: An EBS volume
        explanation:
          text: An EBS volume is block storage that exists apart from the instance, so its data persists through every stop and start.
      - id: s3
        text: Amazon S3
        variants:
          - text: Amazon Simple Storage Service (Amazon S3)
          - text: An S3 bucket
        explanation:
          text: S3 is object storage reached through a web API. A server can't boot its operating system from a bucket.
      - id: efs
        text: Amazon EFS
        variants:
          - text: Amazon Elastic File System (Amazon EFS)
          - text: An EFS file system
        explanation:
          text: EFS is a shared file system mounted over the network, for files many servers use. It isn't the disk a server boots from.
    correct_answers: [ebs]
    hint:
      text: A nightly stop is the test. Which disk exists apart from the server, and which belongs to the physical computer it runs on?
    explanation:
      text: |
        A server's own boot disk is block storage. Of AWS's two kinds, only Amazon EBS is
        persistent: the volume exists apart from the instance, so a stop and a start don't touch
        its data. Instance store is erased by every stop, and object or file storage can't serve as
        a boot disk.

  - id: q05-render-frames-after-stop
    page: guide/05-storing-data/01-block-file-object.md
    section: "\"Instance store survives a stop\" is wrong"
    task: "3.6"
    level: understanding
    topics: [block-storage, instance-store]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A video studio keeps temporary render frames on an EC2 instance's instance store volumes.
        An engineer stops the instance on Friday evening and starts it again on Monday morning.
        What has happened to the frames?
    choices:
      - id: kept-like-reboot
        text: They are still there, as after a reboot
        variants:
          - text: They survived, just as they would a reboot
          - text: They are kept, since a stop is a long reboot
        explanation:
          text: "A reboot does keep instance store data, which is why this is tempting. A stop is different: it releases the host's disks."
      - id: moved-to-ebs
        text: AWS moved them to an EBS volume during the stop
        variants:
          - text: AWS copied them to EBS automatically at the stop
          - text: They were saved to EBS before the disks were released
        explanation:
          text: AWS doesn't copy instance store data anywhere. Copying it to EBS, S3 or EFS is the customer's job.
      - id: erased
        text: They are gone, because a stop erases instance store
        variants:
          - text: They were erased when the instance stopped
          - text: They no longer exist; the stop wiped them
        explanation:
          text: Instance store data persists through a reboot only. A stop, hibernation or termination erases every block.
      - id: kept-in-snapshot
        text: They are kept in a snapshot AWS took at the stop
        variants:
          - text: AWS kept them in an automatic snapshot at shutdown
          - text: They are in a snapshot made when the instance stopped
        explanation:
          text: Snapshots belong to EBS volumes, and you take them yourself. Nothing snapshots instance store automatically.
    correct_answers: [erased]
    explanation:
      text: |
        Instance store disks are physically attached to the computer that runs the instance. A
        stop releases them, and AWS erases every block, so the frames are gone. Only a reboot keeps
        instance store data, which is why it suits caches and scratch data the job can rebuild.

  - id: q05-linux-fleet-shared-files
    page: guide/05-storing-data/01-block-file-object.md
    section: "File storage: one folder tree that many servers share"
    task: "3.6"
    level: application
    topics: [file-storage, efs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A research lab runs a group of Linux EC2 instances in several Availability Zones. All of
        them must read and write the same set of files at the same time, and the lab doesn't want
        to size the storage in advance. Which service fits best?
    choices:
      - id: ebs
        text: Amazon EBS
        variants:
          - text: Amazon Elastic Block Store (Amazon EBS)
          - text: An EBS volume
        explanation:
          text: An EBS volume attaches to one instance in one AZ, and you choose its size in advance.
      - id: fsx-windows
        text: Amazon FSx for Windows File Server
        variants:
          - text: FSx for Windows File Server
          - text: The Windows File Server option of Amazon FSx
        explanation:
          text: FSx for Windows File Server provides Windows shares over SMB. These are Linux servers, and nothing says they must match a Windows file system.
      - id: instance-store
        text: EC2 instance store
        variants:
          - text: Instance store volumes
          - text: Instance store disks on each host
        explanation:
          text: Instance store is temporary and belongs to one instance; it can't be shared.
      - id: efs
        text: Amazon EFS
        variants:
          - text: Amazon Elastic File System (Amazon EFS)
          - text: An EFS file system
        explanation:
          text: EFS is AWS's elastic NFS file system for Linux. Many instances connect at once, and it grows and shrinks with the files.
    correct_answers: [efs]
    hint:
      text: Several servers sharing the same files is one shape of storage. Which AWS service in that shape is built for Linux?
    explanation:
      text: |
        Many servers using the same folders and files at once is file storage. Amazon EFS is AWS's
        own file system for Linux, shared over NFS, and it's elastic: there's no capacity to plan.
        A Regional EFS file system also keeps data across several AZs, which suits servers spread
        over AZs.

  - id: q05-windows-share-active-directory
    page: guide/05-storing-data/01-block-file-object.md
    section: "File storage: one folder tree that many servers share"
    task: "3.6"
    level: application
    topics: [file-storage, fsx]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A law office is closing its server room. Its Windows laptops open a shared drive, and the
        drive's folder permissions are set through Microsoft Active Directory groups. The office
        wants the shared drive hosted in AWS and working the same way as today. Which service fits?
    choices:
      - id: fsx-windows
        text: Amazon FSx for Windows File Server
        variants:
          - text: FSx for Windows File Server
          - text: The Windows File Server option of Amazon FSx
        explanation:
          text: It provides Windows file shares over SMB, joined to Active Directory, so the drive and its permissions work as before.
      - id: efs
        text: Amazon EFS
        variants:
          - text: Amazon Elastic File System (Amazon EFS)
          - text: An EFS file system
        explanation:
          text: EFS is AWS's own Linux file system over NFS, and AWS states that using it with Windows-based EC2 instances isn't supported.
      - id: fsx-lustre
        text: Amazon FSx for Lustre
        variants:
          - text: FSx for Lustre
          - text: The Lustre option of Amazon FSx
        explanation:
          text: FSx for Lustre is a high-speed file system for supercomputing and machine learning, not a Windows share for an office.
      - id: fsx-openzfs
        text: Amazon FSx for OpenZFS
        variants:
          - text: FSx for OpenZFS
          - text: The OpenZFS option of Amazon FSx
        explanation:
          text: FSx for OpenZFS is for teams that already run OpenZFS storage, not for a Windows share whose permissions come from Active Directory.
    correct_answers: [fsx-windows]
    hint:
      text: Amazon FSx runs several familiar file systems. Which one is the one these laptops already use?
    explanation:
      text: |
        Windows computers sharing a drive use SMB, and here the permissions come from Active
        Directory. Amazon FSx runs well-known file systems for you, and you pick the one that
        matches what you run today: FSx for Windows File Server provides SMB shares joined to
        Active Directory, so the move is invisible to staff. Windows plus shared files is the usual
        signal for it.

  - id: q05-ebs-volume-in-other-az
    page: guide/05-storing-data/01-block-file-object.md
    section: "Block storage: a disk attached to one server"
    task: "3.6"
    level: understanding
    topics: [block-storage, ebs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team's EC2 instance runs in Availability Zone A. A colleague creates a new EBS volume in
        Availability Zone B and asks the team to attach it to the instance. What happens?
    choices:
      - id: slower
        text: It attaches, but reads are slower across AZs
        variants:
          - text: It attaches, with extra delay for crossing AZs
          - text: It works, though access between AZs is slower
        explanation:
          text: There's no slower cross-AZ mode. A volume attaches only to an instance in its own AZ.
      - id: cannot-attach
        text: It can't attach; both must be in one AZ
        variants:
          - text: The attach fails, as they must share an AZ
          - text: It isn't possible, since the AZs differ
        explanation:
          text: An EBS volume and its instance must be in the same Availability Zone. To use the data in AZ A, snapshot the volume and create a new volume from it there.
      - id: auto-move
        text: AWS moves the volume to AZ A automatically
        variants:
          - text: AWS relocates the volume to the instance's AZ
          - text: The volume is shifted to AZ A without any action
        explanation:
          text: AWS doesn't move volumes between AZs. A snapshot is how you get a volume's data into another AZ.
      - id: read-only
        text: It attaches, but only in read-only mode
        variants:
          - text: It attaches read-only until it's moved to AZ A
          - text: It can be read from but not written to
        explanation:
          text: There's no read-only cross-AZ attachment; the attach isn't possible at all.
    correct_answers: [cannot-attach]
    explanation:
      text: |
        An EBS volume lives in one Availability Zone, and AWS copies its data only within that AZ.
        The volume and the instance it attaches to must be in the same AZ. To use the data
        elsewhere, take a snapshot and create a new volume from it in the AZ you need.

  - id: q05-good-fits-for-s3
    page: guide/05-storing-data/01-block-file-object.md
    section: "Object storage: whole objects in a bucket, reached over the web"
    task: "3.6"
    level: understanding
    topics: [object-storage, s3]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO kinds of data are a good fit for Amazon S3? (Select TWO.)
    choices:
      - id: website-images
        text: Product photos that a website shows to visitors
        variants:
          - text: Images a web store displays to its shoppers
          - text: Pictures that a website serves to visitors
        explanation:
          text: Whole files, written once and read by many, are what object storage is for.
      - id: boot-disk
        text: The disk an EC2 instance boots its operating system from
        variants:
          - text: The operating system volume of an EC2 instance
          - text: An EC2 instance's boot disk
        explanation:
          text: A boot disk is block storage, such as an EBS volume. A server can't boot from a bucket.
      - id: data-lake
        text: Raw log files collected for later analysis
        variants:
          - text: A data lake of raw files kept for analysis
          - text: Collected raw data waiting to be analyzed
        explanation:
          text: AWS lists data lakes, large collections of raw data for analysis, among S3's typical uses.
      - id: smb-share
        text: A Windows drive that staff map over SMB
        variants:
          - text: An SMB file share for Windows desktops
          - text: A mapped network drive for Windows users
        explanation:
          text: A mapped Windows drive is file storage over SMB, which points to FSx for Windows File Server.
      - id: database-disk
        text: The data files of a database running on one EC2 server
        variants:
          - text: A database's files on its EC2 server's disk
          - text: The disk under a database on one EC2 instance
        explanation:
          text: A database on one server needs a disk it reads and writes in place, which is block storage.
    correct_answers: [website-images, data-lake]
    explanation:
      text: |
        Object storage keeps whole files, reached through a web API by any program that has
        permission. AWS lists backups, archives, media, website files, mobile apps and data lakes
        as typical uses. Boot disks and a database's own files need block storage, and mapped
        Windows drives need file storage.

  - id: q05-how-programs-reach-s3
    page: guide/05-storing-data/01-block-file-object.md
    section: "Object storage: whole objects in a bucket, reached over the web"
    task: "3.6"
    level: recall
    topics: [object-storage, s3]
    type: multiple_choice
    selection: single
    prompt:
      text: How do applications store and read data in Amazon S3 directly, through S3's own interface?
    choices:
      - id: mount-nfs
        text: They mount the bucket as a shared folder over NFS
        variants:
          - text: They connect to the bucket as an NFS file system
          - text: They mount it over NFS like a network folder
        explanation:
          text: Mounting over NFS is how servers use file storage such as EFS, not S3.
      - id: attach-block
        text: They attach the bucket to a server as its local disk
        variants:
          - text: They attach it to an instance as a block device
          - text: They format it as a disk attached to one server
        explanation:
          text: Attaching a disk is block storage, such as EBS. There's no disk to attach in S3.
      - id: web-api
        text: They put and get whole objects over HTTPS
        variants:
          - text: They use a web API to put and get objects
          - text: They send web API requests for whole objects
        explanation:
          text: S3 is object storage. A program stores an object with one request and reads the whole object back with another, over HTTPS.
      - id: map-smb
        text: They map the bucket as a Windows share over SMB
        variants:
          - text: They open the bucket as an SMB file share
          - text: They connect to it as a Windows drive over SMB
        explanation:
          text: SMB shares are file storage, such as FSx for Windows File Server.
    correct_answers: [web-api]
    explanation:
      text: |
        In S3 there's no disk to attach and no folder to mount. Programs send web API requests,
        over HTTPS, to put a whole object under its key and to get the whole object back. That's
        why web servers, Lambda functions, phones and other AWS services can all use the same
        bucket, subject to permissions.

  - id: q05-copies-across-azs
    page: guide/05-storing-data/01-block-file-object.md
    section: "Where the copies live decides what a failure can take"
    task: "3.6"
    level: understanding
    topics: [durability, availability-zones]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO storage options keep copies of your data in more than one Availability Zone by design? (Select TWO.)
    choices:
      - id: ebs-volume
        text: An Amazon EBS volume
        variants:
          - text: An Elastic Block Store volume
          - text: An EBS volume
        explanation:
          text: An EBS volume's data is copied across several servers, but all of them are in one AZ.
      - id: s3-standard
        text: Amazon S3 Standard
        variants:
          - text: The S3 Standard storage class
          - text: S3 Standard
        explanation:
          text: S3 Standard keeps copies across at least three Availability Zones.
      - id: instance-store
        text: EC2 instance store
        variants:
          - text: An instance store volume
          - text: Instance store on the host
        explanation:
          text: Instance store lives on one physical host, so it isn't copied anywhere.
      - id: efs-one-zone
        text: An Amazon EFS One Zone file system
        variants:
          - text: Amazon EFS with One Zone storage
          - text: A One Zone EFS file system
        explanation:
          text: One Zone keeps data in a single AZ, and that data can be lost with the AZ.
      - id: efs-regional
        text: An Amazon EFS Regional file system
        variants:
          - text: Amazon EFS with Regional storage
          - text: A Regional EFS file system
        explanation:
          text: A Regional EFS file system stores data across several AZs and keeps working if one is unavailable.
    correct_answers: [s3-standard, efs-regional]
    explanation:
      text: |
        Where the copies live decides which failures data survives. Instance store is on one host,
        and an EBS volume and EFS One Zone keep their copies inside one AZ. S3 Standard and EFS
        Regional spread copies across AZs, so they survive the loss of one. Anything kept in one AZ
        needs a copy elsewhere, such as a snapshot or a backup.

  - id: q05-protect-only-copy-on-ebs
    page: guide/05-storing-data/01-block-file-object.md
    section: "Where the copies live decides what a failure can take"
    task: "3.6"
    level: application
    topics: [ebs, backup]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small company keeps its only copy of a customer database on one EBS volume attached to an
        EC2 instance. Its auditor asks how the data would survive if that volume's Availability
        Zone were destroyed. What should the company do?
    choices:
      - id: second-volume-same-az
        text: Attach a second EBS volume in the same AZ as a mirror
        variants:
          - text: Copy the data to another volume in that AZ
          - text: Mirror the volume onto a second volume in its AZ
        explanation:
          text: A second volume in the same AZ is lost along with the first when that AZ is destroyed.
      - id: instance-store
        text: Copy the data to the instance store each night
        variants:
          - text: Keep a nightly copy on instance store volumes
          - text: Mirror the data onto the instance store nightly
        explanation:
          text: Instance store is temporary and lives on one host in the same AZ, so it's an even weaker copy.
      - id: encryption
        text: Turn on EBS encryption for the volume
        variants:
          - text: Encrypt the volume with EBS encryption
          - text: Enable encryption on the EBS volume
        explanation:
          text: Encryption protects the stored bytes from being read; it makes no extra copy.
      - id: snapshots
        text: Take regular EBS snapshots of the volume
        variants:
          - text: Back the volume up with scheduled EBS snapshots
          - text: Create EBS snapshots of the volume on a schedule
        explanation:
          text: A snapshot exists apart from the volume, and a new volume can be created from it in another AZ of the Region.
    correct_answers: [snapshots]
    hint:
      text: Every copy AWS keeps of an EBS volume is in one place. Which copy exists apart from the volume?
    explanation:
      text: |
        AWS copies an EBS volume's data only within its own Availability Zone, so if that AZ is
        destroyed, every copy goes with it. An EBS snapshot is a point-in-time copy that persists on
        its own, and you can create a new volume from it elsewhere. (AWS keeps snapshots at the
        level of the Region, not inside the volume's AZ.) Backing up the data is the customer's
        side of the line.

  - id: q05-ebs-billed-for-provisioned-size
    page: guide/05-storing-data/01-block-file-object.md
    section: "What you pay for"
    task: "4.1"
    level: understanding
    topics: [storage-pricing, ebs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team creates a 500 GB EBS volume for a new application. In the first month it stores only
        40 GB of data on it. How is the volume's storage billed?
    choices:
      - id: provisioned-size
        text: For the full 500 GB it provisioned
        variants:
          - text: On the 500 GB size of the volume
          - text: For all 500 GB, used or not
        explanation:
          text: EBS bills for what you provision, the size of the volume, whether you fill it or not.
      - id: used-only
        text: For the 40 GB actually stored
        variants:
          - text: Only on the 40 GB of data written
          - text: On just the 40 GB in use
        explanation:
          text: Paying only for data stored is how S3 and EFS bill, not EBS.
      - id: per-request
        text: Per request, the way S3 bills
        variants:
          - text: By the number of reads and writes
          - text: Per read and write request made
        explanation:
          text: EBS storage is billed by provisioned size, not by request.
      - id: free-until-full
        text: Nothing until the volume is full
        variants:
          - text: No storage charge until it fills up
          - text: Free until all 500 GB are used
        explanation:
          text: There's no free period; the provisioned size is billed from the start.
    correct_answers: [provisioned-size]
    explanation:
      text: |
        You pay for an EBS volume's provisioned size, and for any extra performance you reserve,
        whether you fill it or not. That makes a volume behave like a small fixed cost. S3 and EFS
        bill for what you actually store, so their bills follow your usage.

  - id: q05-ebs-customer-tasks
    page: guide/05-storing-data/01-block-file-object.md
    section: "Your side of the line"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, ebs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A startup keeps its EC2 servers' data on Amazon EBS volumes. Its new operations lead lists
        storage jobs and asks which ones the startup must do itself rather than leave to AWS. Which
        TWO belong to the startup? (Select TWO.)
    choices:
      - id: replace-disks
        text: Replacing failed disks under the volumes
        variants:
          - text: Swapping out failed physical drives
          - text: Repairing the hardware that stores volumes
        explanation:
          text: AWS replaces failed hardware on every service.
      - id: turn-on-encryption
        text: Turning on encryption for EBS volumes
        variants:
          - text: Enabling encryption for the volumes
          - text: Switching on EBS volume encryption
        explanation:
          text: Encryption is a setting, and settings are on the customer's side. In a new account checked on 2026-10-23, EBS encryption by default was off.
      - id: copy-within-az
        text: Copying each volume's data across servers in its AZ
        variants:
          - text: Replicating volume data within the Availability Zone
          - text: Mirroring volume data across servers in the AZ
        explanation:
          text: AWS copies an EBS volume's data within its AZ as part of the service.
      - id: take-snapshots
        text: Taking snapshots or backups of the volumes
        variants:
          - text: Backing up the volumes, for example with snapshots
          - text: Making EBS snapshots of the data
        explanation:
          text: Deciding to back up data, and doing it, is the customer's job.
      - id: secure-facilities
        text: Securing the data centers that hold the disks
        variants:
          - text: Physically protecting the storage facilities
          - text: Guarding the buildings where the disks sit
        explanation:
          text: Physical security of the facilities is AWS's side of the line.
    correct_answers: [turn-on-encryption, take-snapshots]
    explanation:
      text: |
        AWS runs the disks, copies EBS data within the AZ and secures the buildings. Your data and
        its settings are yours: turning on encryption, and taking snapshots or other backups. A safe
        setting you don't turn on doesn't protect you.

  - id: q05-existing-ontap-to-aws
    page: guide/05-storing-data/01-block-file-object.md
    section: "File storage: one folder tree that many servers share"
    task: "3.6"
    level: understanding
    topics: [file-storage, fsx]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's engineering team depends on a NetApp ONTAP storage system in its data center.
        It wants to move that file storage to AWS and keep the features and tools it already uses.
        Which service fits best?
    choices:
      - id: efs
        text: Amazon EFS
        variants:
          - text: Amazon Elastic File System (Amazon EFS)
          - text: An EFS file system
        explanation:
          text: EFS is AWS's own NFS file system. It doesn't keep NetApp ONTAP's features and tools.
      - id: s3
        text: Amazon S3
        variants:
          - text: Amazon Simple Storage Service (Amazon S3)
          - text: An S3 bucket
        explanation:
          text: S3 is object storage, not a file system that works like the team's existing one.
      - id: fsx-ontap
        text: Amazon FSx for NetApp ONTAP
        variants:
          - text: FSx for NetApp ONTAP
          - text: The NetApp ONTAP option of Amazon FSx
        explanation:
          text: FSx runs well-known third-party file systems, fully managed; this one is for teams already using NetApp ONTAP.
      - id: fsx-windows
        text: Amazon FSx for Windows File Server
        variants:
          - text: FSx for Windows File Server
          - text: The Windows File Server option of Amazon FSx
        explanation:
          text: This FSx option provides Windows shares over SMB. It's the right family but the wrong file system for a NetApp ONTAP team.
    correct_answers: [fsx-ontap]
    hint:
      text: One AWS family exists so that a file system you already run can move without changing.
    explanation:
      text: |
        Amazon FSx runs familiar third-party file systems for you, so applications move without
        changes: Windows File Server, NetApp ONTAP, OpenZFS or Lustre. When the requirement is to
        keep an existing file system working the same, FSx is the answer, here FSx for NetApp ONTAP.

  - id: q05-fast-scratch-space
    page: guide/05-storing-data/01-block-file-object.md
    section: "Block storage: a disk attached to one server"
    task: "3.6"
    level: application
    topics: [block-storage, instance-store]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A genomics team runs a nightly EC2 job that writes many gigabytes of intermediate files,
        deletes them when it finishes, and can simply start over if they vanish. Which storage gives
        the job fast scratch space at no extra storage charge?
    choices:
      - id: ebs
        text: An Amazon EBS volume
        variants:
          - text: An Amazon Elastic Block Store (Amazon EBS) volume
          - text: An EBS volume attached to the instance
        explanation:
          text: EBS would work, but it is billed on its own for its provisioned size, and the job doesn't need its persistence.
      - id: fsx-lustre
        text: An Amazon FSx for Lustre file system
        variants:
          - text: A file system in FSx for Lustre
          - text: An FSx for Lustre file system
        explanation:
          text: FSx for Lustre is a high-speed file system that many servers share, billed for the resources it uses; one job's disposable files need neither.
      - id: efs
        text: An Amazon EFS file system
        variants:
          - text: An Amazon Elastic File System (Amazon EFS) file system
          - text: An EFS file system mounted on the instance
        explanation:
          text: EFS is shared file storage, billed for what you store; one job's scratch space doesn't need sharing.
      - id: instance-store
        text: An EC2 instance store volume
        variants:
          - text: An instance store volume
          - text: A volume on the instance store
        explanation:
          text: Instance store is fast, included in the instance's price, and fine for scratch data the job can rebuild.
    correct_answers: [instance-store]
    hint:
      text: The files are disposable. Which disk comes with the instance and costs nothing extra?
    explanation:
      text: |
        Instance store is temporary block storage on disks attached to the host, included in the
        instance's price on the instance types that have it. It suits caches and scratch data, where
        losing it on a stop is fine. Anything that must outlive the server belongs on EBS, S3 or EFS
        instead.

  - id: q05-efs-protocol
    page: guide/05-storing-data/01-block-file-object.md
    section: "File storage: one folder tree that many servers share"
    task: "3.6"
    level: recall
    topics: [file-storage, efs]
    type: multiple_choice
    selection: single
    prompt:
      text: Which protocol do Linux servers use to connect to an Amazon EFS file system?
    choices:
      - id: smb
        text: SMB
        variants:
          - text: Server Message Block (SMB)
          - text: The SMB protocol
        explanation:
          text: SMB is the usual Windows way to share files, used by FSx for Windows File Server.
      - id: iscsi
        text: iSCSI
        variants:
          - text: Internet Small Computer Systems Interface (iSCSI)
          - text: The iSCSI protocol
        explanation:
          text: iSCSI presents disks as blocks over a network, not shared folders.
      - id: https
        text: HTTPS
        variants:
          - text: Hypertext Transfer Protocol Secure (HTTPS)
          - text: The HTTPS protocol
        explanation:
          text: HTTPS carries S3's web API requests; EFS is mounted as a file system.
      - id: nfs
        text: NFS
        variants:
          - text: Network File System (NFS)
          - text: The NFS protocol
        explanation:
          text: EFS uses NFS, the usual Linux way to share files over a network.
    correct_answers: [nfs]
    explanation:
      text: |
        Amazon EFS is AWS's own file system for Linux, and clients mount it over NFS. Windows file
        shares use SMB, which points to FSx for Windows File Server instead. HTTPS is how programs
        reach S3, and iSCSI is for disks.

  # ---------------------------------------------------------------- 05.02 S3 in practice

  - id: q05-bpa-account-on-bucket-off
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Private by default, and Block Public Access keeps it that way"
    task: "3.6"
    level: understanding
    topics: [s3-security, block-public-access]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer adds a bucket policy that would let anyone on the internet read a bucket's
        objects. S3 Block Public Access is on for the account, but it has been turned off for this
        bucket. What happens?
    choices:
      - id: rejected
        text: S3 rejects the public grant, since the account setting blocks it
        variants:
          - text: The account-level setting blocks the public policy anyway
          - text: S3 refuses it, because the account-level block still applies
        explanation:
          text: Where levels differ, S3 applies the most restrictive combination, so the account setting blocks the grant on its own.
      - id: policy-applies
        text: The policy applies, because the bucket's own setting is off
        variants:
          - text: The bucket's setting wins, so the objects become public
          - text: Everyone can read the objects, since the bucket allows it
        explanation:
          text: The bucket's own setting doesn't override the account's. Either level can say no on its own.
      - id: public-but-encrypted
        text: The objects become public, but outsiders see only encrypted bytes
        variants:
          - text: Anyone can read them, but encryption hides their contents
          - text: They're public, yet stay unreadable thanks to encryption
        explanation:
          text: The grant is blocked. And if it weren't, S3 would decrypt the objects for anyone the policy allowed.
      - id: root-approval
        text: The policy applies once the root user approves the change
        variants:
          - text: It waits until the root user confirms the change
          - text: The root user must accept the policy before it applies
        explanation:
          text: There's no root approval step for bucket policies; Block Public Access decides.
    correct_answers: [rejected]
    explanation:
      text: |
        Block Public Access can be set for the account, each bucket and a whole organization, and
        S3 applies the most restrictive combination. With the account setting on, a public grant is
        rejected whatever the bucket's own setting says. That's why the account-level settings are
        worth turning on: they protect buckets whose own settings someone changed.

  - id: q05-new-bucket-protections
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "The big picture: five layers, three of them already on"
    task: "3.6"
    level: recall
    topics: [s3-security]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: A company creates a new S3 bucket and changes none of its settings. Which TWO protections are already in place? (Select TWO.)
    choices:
      - id: versioning
        text: Versioning of every object
        variants:
          - text: S3 Versioning on the bucket
          - text: Keeping every version of each object
        explanation:
          text: Versioning starts off; you turn it on per bucket.
      - id: bpa
        text: Block Public Access on the bucket
        variants:
          - text: The bucket's Block Public Access settings
          - text: S3 Block Public Access for the bucket
        explanation:
          text: New buckets have Block Public Access on (for buckets created since April 2023).
      - id: cross-region-replication
        text: Replication to a bucket in another Region
        variants:
          - text: Cross-Region Replication of new objects
          - text: A copy of each object in a second Region
        explanation:
          text: A copy somewhere else is a layer you set up yourself.
      - id: sse-s3
        text: Encryption at rest of new objects with SSE-S3
        variants:
          - text: Server-side encryption of uploads with S3-managed keys
          - text: SSE-S3 encryption of every new upload
        explanation:
          text: S3 encrypts every new object with SSE-S3 by default, at no extra cost.
      - id: object-lock
        text: S3 Object Lock retention on new objects
        variants:
          - text: Object Lock protection for each upload
          - text: A WORM retention period on new objects
        explanation:
          text: Object Lock is an option you choose; nothing is locked by default.
    correct_answers: [bpa, sse-s3]
    explanation:
      text: |
        Three layers start on for a new bucket: Block Public Access, private-by-default access, and
        encryption at rest with SSE-S3. The two layers that protect you from accidents start off:
        versioning, and a copy somewhere else, such as replication or backups. Object Lock is
        optional too.

  - id: q05-what-encryption-at-rest-stops
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "\"Encrypted means safe from everyone\" is wrong"
    task: "3.6"
    level: understanding
    topics: [s3-security, encryption]
    type: multiple_choice
    selection: single
    prompt:
      text: An S3 bucket's objects are encrypted at rest with SSE-S3. Which risk does that encryption reduce?
    choices:
      - id: allowed-reader
        text: An IAM user with read permission downloading the objects
        variants:
          - text: A colleague with read access copying the files
          - text: Someone the bucket policy allows reading the objects
        explanation:
          text: S3 decrypts objects automatically for any caller its policies allow, so encryption doesn't stop an allowed reader.
      - id: stored-bytes
        text: Someone reading the data on a disk that leaves a data center
        variants:
          - text: A storage disk removed from AWS exposing the stored data
          - text: The raw stored bytes being read without the key
        explanation:
          text: Encryption at rest protects the stored bytes, for example on a disk that leaves a data center.
      - id: accidental-delete
        text: A user deleting objects by mistake
        variants:
          - text: An object being removed by accident
          - text: Someone deleting the files in error
        explanation:
          text: Encrypted objects can be deleted like any others. Versioning or Object Lock protects against deletes.
      - id: public-policy
        text: A bucket policy that opens the objects to everyone
        variants:
          - text: Objects exposed by a public bucket policy
          - text: A public grant in the bucket policy
        explanation:
          text: If a public grant got through, S3 would decrypt the objects for the whole world. Block Public Access is the control for this.
    correct_answers: [stored-bytes]
    explanation:
      text: |
        Encryption and access control answer different questions. Encryption at rest asks whether
        the stored bytes can be read without the key; policies ask who is allowed to make a
        request. S3 decrypts for every allowed request, so encryption at rest guards the stored
        bytes, not the front door.

  - id: q05-control-who-decrypts
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Encryption at rest is automatic; you choose who holds the keys"
    task: "3.6"
    level: understanding
    topics: [s3-security, encryption]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A finance company stores audit records in S3. Its auditors require the company to control,
        and be able to show, who can use the key that decrypts the records. Which option meets this?
    choices:
      - id: sse-s3
        text: Keep the default SSE-S3 encryption
        variants:
          - text: Rely on encryption with S3-managed keys
          - text: Leave the default S3-managed encryption on
        explanation:
          text: With SSE-S3, S3 manages the keys entirely; the company can't control or show who uses them.
      - id: bpa
        text: Turn on S3 Block Public Access for the bucket
        variants:
          - text: Enable Block Public Access on the audit bucket
          - text: Apply all four Block Public Access settings
        explanation:
          text: Block Public Access stops public grants; it says nothing about encryption keys.
      - id: sse-kms
        text: Use SSE-KMS with a customer managed key in AWS KMS
        variants:
          - text: Encrypt with SSE-KMS, using a customer managed KMS key
          - text: Choose SSE-KMS with a KMS key the company manages
        explanation:
          text: With SSE-KMS and a customer managed key, the key lives in AWS KMS, and the company controls, and can show, who may use it.
      - id: versioning
        text: Turn on S3 Versioning for the bucket
        variants:
          - text: Enable versioning on the bucket
          - text: Keep every version with S3 Versioning
        explanation:
          text: Versioning protects against overwrites and deletes, not against who can decrypt.
    correct_answers: [sse-kms]
    hint:
      text: The records are already encrypted by default. The requirement is about who holds and controls the key.
    explanation:
      text: |
        S3 already encrypts every new object with SSE-S3, using keys S3 manages. When you must
        control, and prove, who can decrypt the data, choose SSE-KMS with a customer managed key: S3
        encrypts with a key in AWS KMS, whose use you control. SSE-KMS adds AWS KMS request charges.

  - id: q05-recover-overwritten-file
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "3.6"
    level: application
    topics: [s3-versioning]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A designer uploads a draft over the final version of a brochure in an S3 bucket that has
        versioning enabled. How can the team get the final version back?
    choices:
      - id: ask-support
        text: Ask AWS Support to restore the overwritten file
        variants:
          - text: Open a case asking AWS Support to recover it
          - text: Request a restore of the file from AWS Support
        explanation:
          text: AWS can't recover data you overwrote or deleted; recovering from mistakes is the customer's side.
      - id: gone
        text: They can't, because an overwrite replaces it for good
        variants:
          - text: It's lost, since overwriting removes the old data
          - text: Nothing can be done once an object is overwritten
        explanation:
          text: That's true in an unversioned bucket. With versioning on, the old version is kept.
      - id: delete-marker
        text: Remove the delete marker that the upload created
        variants:
          - text: Delete the marker the overwrite placed on top
          - text: Take off the delete marker added by the upload
        explanation:
          text: Delete markers come from deletes, not overwrites. An overwrite adds a new current version.
      - id: restore-version
        text: Restore the previous version, which S3 kept
        variants:
          - text: Copy the earlier, noncurrent version back
          - text: Bring back the older version S3 still stores
        explanation:
          text: With versioning on, the overwrite created a new current version and kept the final one as a noncurrent version.
    correct_answers: [restore-version]
    hint:
      text: With versioning on, what does an upload under the same key do to the object that was already there?
    explanation:
      text: |
        In a versioned bucket, an overwrite creates a new current version, and the old one stays
        under the same key with its own version ID. Copy the earlier version back, and it becomes
        current again. Without versioning, the overwrite would have been final.

  - id: q05-delete-in-versioned-bucket
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "3.6"
    level: understanding
    topics: [s3-versioning]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An intern deletes `report.pdf` from a versioned bucket without choosing a version. The next
        day a teammate turns on **Show versions** in the S3 console. What does the teammate see for
        that key?
    choices:
      - id: marker-on-top
        text: A delete marker on top of the earlier versions
        variants:
          - text: The earlier versions, under a new delete marker
          - text: Old versions still stored beneath a delete marker
        explanation:
          text: A delete that names no version adds a delete marker as the current version; nothing is removed.
      - id: nothing
        text: Nothing, because the delete removed every version
        variants:
          - text: No versions at all, because the file is gone for good
          - text: An empty list, since all of its versions were deleted
        explanation:
          text: Removing versions takes a delete that names each version ID. A plain delete removes nothing.
      - id: only-latest
        text: The latest version alone, flagged as deleted
        variants:
          - text: Just the newest version, marked deleted
          - text: The current version by itself, with a deleted flag
        explanation:
          text: Every version stays, not just the latest, and a separate delete marker sits on top.
      - id: trash-prefix
        text: The file moved into a hidden trash prefix
        variants:
          - text: A copy of the file in a recycle-bin prefix
          - text: The object moved to a deleted-items folder
        explanation:
          text: S3 has no trash folder. The versions stay under the same key.
    correct_answers: [marker-on-top]
    explanation:
      text: |
        In a versioned bucket, a plain delete inserts a delete marker, which becomes the current
        version, so the object looks gone. Its earlier versions are still stored, and billed. Remove
        the marker, or copy an older version back, and the object returns.

  - id: q05-deleted-from-unversioned-bucket
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "\"S3 is so durable that AWS can always get my file back\" is wrong"
    task: "3.6"
    level: understanding
    topics: [s3-versioning, durability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An administrator deletes an important object from an S3 bucket that doesn't have versioning
        turned on. Which statement is correct?
    choices:
      - id: durability-restores
        text: AWS can restore it, because S3 is built for very high durability
        variants:
          - text: S3's durability means AWS can bring it back
          - text: AWS recovers it from the copies it keeps for durability
        explanation:
          text: Durability protects against hardware losing data. S3 faithfully carries out a delete you ask for.
      - id: gone
        text: It was deleted at once, and AWS can't recover it
        variants:
          - text: It's gone, and AWS has no way to bring it back
          - text: S3 removed it for good; AWS can't restore it
        explanation:
          text: The S3 FAQ says deleted data is deleted at once and AWS can't recover it.
      - id: delete-marker
        text: S3 added a delete marker, so it can be restored
        variants:
          - text: A delete marker hides it, and removing that restores it
          - text: It's hidden behind a delete marker you can remove
        explanation:
          text: Delete markers exist only in versioned buckets.
      - id: grace-period
        text: It stays recoverable for a grace period before S3 purges it
        variants:
          - text: S3 keeps it in a recovery window before removing it
          - text: It can be undeleted for some days after the delete
        explanation:
          text: S3 has no undelete window; a delete in an unversioned bucket is final.
    correct_answers: [gone]
    explanation:
      text: |
        Eleven nines of durability means the hardware won't lose your data; it doesn't mean AWS
        can undo your deletes. In an unversioned bucket, a delete is final. Recovering from
        mistakes is the customer's side of the line, through versioning, Object Lock or backups.

  - id: q05-protect-against-deletion
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "3.6"
    level: understanding
    topics: [s3-versioning, object-lock]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: A company wants to protect objects in an S3 bucket against accidental or malicious deletion. Which TWO features help? (Select TWO.)
    choices:
      - id: sse-s3
        text: SSE-S3 encryption at rest
        variants:
          - text: Server-side encryption with S3-managed keys
          - text: Default encryption of stored objects
        explanation:
          text: Encryption protects the stored bytes from being read; encrypted objects can still be deleted.
      - id: versioning
        text: S3 Versioning
        variants:
          - text: Turning on versioning for the bucket
          - text: Keeping every version with versioning
        explanation:
          text: With versioning, a delete adds a marker and an overwrite adds a version, so mistakes can be undone.
      - id: bpa
        text: S3 Block Public Access
        variants:
          - text: Block Public Access for the bucket
          - text: Blocking public grants on the bucket
        explanation:
          text: Block Public Access stops data being made public; it doesn't stop allowed users deleting it.
      - id: object-lock
        text: S3 Object Lock
        variants:
          - text: Object Lock retention on the objects
          - text: WORM protection with S3 Object Lock
        explanation:
          text: Object Lock blocks deletes and overwrites of a version until a date you set.
      - id: durability
        text: The designed durability of S3 Standard
        variants:
          - text: S3 Standard's eleven nines of durability
          - text: S3's built-in durability
        explanation:
          text: Durability protects against hardware failure, not against deletes, which S3 carries out as asked.
    correct_answers: [versioning, object-lock]
    explanation:
      text: |
        Versioning keeps every version, so an accidental overwrite or delete can be undone. Object
        Lock goes further: it stops a version being deleted or overwritten until a set date, and in
        compliance mode nobody can remove that protection early. Encryption, Block Public Access and
        durability protect against other things.

  - id: q05-mfa-delete-who-can-enable
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "3.6"
    level: recall
    topics: [s3-versioning, root-user]
    type: multiple_choice
    selection: single
    prompt:
      text: Who can turn on MFA Delete for an S3 bucket?
    choices:
      - id: any-admin
        text: Any IAM user with administrator permissions
        variants:
          - text: An IAM admin user with full S3 access
          - text: Any IAM identity with administrator access
        explanation:
          text: Even full administrator permissions aren't enough; it's one of the tasks that need root user credentials.
      - id: versioning-permission
        text: Any identity allowed to change versioning
        variants:
          - text: Whoever may edit the bucket's versioning
          - text: Any IAM role that can change bucket settings
        explanation:
          text: Permission to change versioning doesn't extend to MFA Delete; only the root user can turn it on.
      - id: root-user
        text: Only the AWS account root user
        variants:
          - text: The account's root user, and nobody else
          - text: Just the root user of the account
        explanation:
          text: MFA Delete is a root-only task, and it can't be turned on in the console.
      - id: aws-support
        text: AWS Support, on request from the owner
        variants:
          - text: AWS Support, after the account asks
          - text: An AWS Support engineer, when asked
        explanation:
          text: AWS Support doesn't change your bucket settings; this is your side of the line.
    correct_answers: [root-user]
    explanation:
      text: |
        MFA Delete makes a permanent delete of a version require a code from the account's MFA
        device. Only the root user can turn it on, and not in the console. For stronger protection,
        S3 Object Lock blocks deletes until a date you set.

  - id: q05-stop-new-versions
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "3.6"
    level: recall
    topics: [s3-versioning]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team turned on versioning for a bucket last year. Now it wants S3 to stop creating new
        versions. What can it do?
    choices:
      - id: turn-off
        text: Turn versioning off, which returns the bucket to unversioned
        variants:
          - text: Disable versioning and go back to an unversioned bucket
          - text: Switch versioning off, as if it had never been on
        explanation:
          text: Once versioning has been enabled, a bucket can never go back to unversioned.
      - id: nothing
        text: Nothing, because the setting can't change once it's on
        variants:
          - text: No change is possible after versioning is on
          - text: It can't do anything, since the setting is fixed
        explanation:
          text: The setting can change, to suspended. It just can't return to never-versioned.
      - id: edit-policy
        text: Remove the bucket policy statement that turned it on
        variants:
          - text: Delete the policy statement that enabled versioning
          - text: Edit the bucket policy to drop versioning
        explanation:
          text: Versioning is a bucket setting, not a policy statement.
      - id: suspend
        text: Suspend versioning; the existing versions stay
        variants:
          - text: Suspend it, keeping the versions already stored
          - text: Set versioning to suspended, keeping old versions
        explanation:
          text: Suspending stops new versions; the versions already stored stay until deleted, for example by a lifecycle rule.
    correct_answers: [suspend]
    explanation:
      text: |
        Versioning starts off. Once it's on, there's no way back to "off": the bucket can only be
        suspended, which stops new versions while keeping the existing ones. To get rid of old
        versions, delete them, or let a lifecycle rule expire them.

  - id: q05-copy-to-another-region
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "A copy somewhere else: replication and backups"
    task: "3.6"
    level: recall
    topics: [s3-replication]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company keeps product designs in an S3 bucket in one Region. It wants new objects copied
        automatically to a bucket in a different Region, so that a Regional disaster can't take the
        only copy. What should it use?
    choices:
      - id: crr
        text: S3 Cross-Region Replication
        variants:
          - text: Replication to a bucket in another Region
          - text: Cross-Region Replication (CRR) in S3
        explanation:
          text: Cross-Region Replication copies new objects automatically to a bucket in another Region.
      - id: srr
        text: S3 Same-Region Replication
        variants:
          - text: Replication to another bucket in the same Region
          - text: Same-Region Replication (SRR) in Amazon S3
        explanation:
          text: A copy in the same Region doesn't survive a disaster that takes the whole Region.
      - id: versioning
        text: S3 Versioning
        variants:
          - text: Versioning on the existing bucket
          - text: Keeping every version in the bucket
        explanation:
          text: Versions live in the same bucket and Region, so they'd be lost with it.
      - id: intelligent-tiering
        text: S3 Intelligent-Tiering
        variants:
          - text: The Intelligent-Tiering storage class
          - text: Moving objects with Intelligent-Tiering
        explanation:
          text: A storage class changes how objects are stored and billed, not which Region they're in.
    correct_answers: [crr]
    hint:
      text: The failure to survive is the loss of a whole Region. Where must the second copy be?
    explanation:
      text: |
        S3 Replication copies new objects automatically to another bucket: in another Region with
        Cross-Region Replication, or the same Region with Same-Region Replication. To survive a
        Regional disaster, the copy must be in another Region. Objects otherwise stay in their
        bucket's Region.

  - id: q05-s3-customer-tasks
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Your side of the line for S3"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, s3-security]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company keeps its customers' files in Amazon S3. Under the AWS shared responsibility
        model, which TWO tasks belong to the company? (Select TWO.)
    choices:
      - id: copies-across-azs
        text: Storing copies of objects across Availability Zones
        variants:
          - text: Spreading object copies over several AZs
          - text: Keeping copies of the data in multiple AZs
        explanation:
          text: S3 stores copies across AZs as part of the service; that's AWS's side.
      - id: least-privilege
        text: Writing bucket and IAM policies with least privilege
        variants:
          - text: Granting only the access each person needs
          - text: Keeping IAM and bucket policies to least privilege
        explanation:
          text: Who can read, change or delete data is always the customer's decision.
      - id: repair-data
        text: Repairing data that the storage hardware damages
        variants:
          - text: Fixing data corrupted by failing disks
          - text: Running the disks and repairing their data
        explanation:
          text: AWS runs the hardware and repairs damaged data.
      - id: versioning-decision
        text: Deciding whether to turn on versioning
        variants:
          - text: Choosing whether the bucket keeps versions
          - text: Deciding to switch versioning on or not
        explanation:
          text: Versioning starts off, and turning it on, and deciding how long old versions stay, is the customer's job.
      - id: default-encryption
        text: Encrypting every new object with S3-managed keys
        variants:
          - text: Applying default SSE-S3 encryption to uploads
          - text: Running S3's automatic encryption at rest
        explanation:
          text: S3 does this by default. The customer's choice is whether to use SSE-KMS instead.
    correct_answers: [least-privilege, versioning-decision]
    explanation:
      text: |
        AWS stores copies across AZs, repairs damaged data, runs the hardware, and encrypts every
        new object by default. Every decision is the customer's: least-privilege policies,
        versioning, replication or backups, and which data is sensitive. A safe default only helps
        until someone changes it.

  - id: q05-versions-on-the-bill
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Versioning lets you undo an overwrite or a delete"
    task: "4.1"
    level: understanding
    topics: [s3-versioning, storage-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team turns on versioning for a bucket in which a script overwrites a 2 GB file every
        night. There is no lifecycle rule. A month later, how has the storage bill changed?
    choices:
      - id: unchanged
        text: It's unchanged, because only the current version is billed
        variants:
          - text: No change, since S3 bills just the newest version
          - text: It's the same, as old versions are stored for free
        explanation:
          text: Every version is a whole object, billed in full, not only the current one.
      - id: grew
        text: It has grown, because every old version is stored and billed
        variants:
          - text: It rose, since each kept version is billed as a whole file
          - text: It went up, as each noncurrent version is billed in full
        explanation:
          text: Thirty overwrites keep thirty older 2 GB versions, all billed, until a rule or a person deletes them.
      - id: differences-only
        text: It rose slightly, because old versions store only the changes
        variants:
          - text: A little higher, since S3 keeps just the differences
          - text: Slightly up, as each version holds only what changed
        explanation:
          text: S3 keeps each version as a whole object, not as a set of changes.
      - id: fell
        text: It fell, because S3 moves old versions to a cheaper class itself
        variants:
          - text: It dropped, as S3 archives the old versions automatically
          - text: It's lower, since older versions move to Glacier by themselves
        explanation:
          text: Nothing moves old versions unless you write a lifecycle rule for them.
    correct_answers: [grew]
    explanation:
      text: |
        With versioning on, each overwrite keeps the previous object as a noncurrent version, and
        every version is billed as a whole object. A file overwritten nightly piles up a new full
        copy each day. A lifecycle rule that deletes noncurrent versions after a recovery window
        keeps the safety and stops the growth.

  - id: q05-private-bucket-public-website
    page: guide/05-storing-data/02-s3-in-practice.md
    section: "Private by default, and Block Public Access keeps it that way"
    task: "3.6"
    level: application
    topics: [s3-security, block-public-access]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A furniture store's website shows product photos that are stored in S3. The owner wants the
        bucket to stay private, with Block Public Access on. How can visitors still see the photos?
    choices:
      - id: turn-off-bpa
        text: Turn off Block Public Access so visitors can read the bucket
        variants:
          - text: Disable Block Public Access for the photo bucket
          - text: Switch off Block Public Access on the bucket
        explanation:
          text: That opens the bucket to the world, exposing every photo in it, which the owner doesn't want.
      - id: public-acl
        text: Make each photo public with an object ACL
        variants:
          - text: Grant public read on each photo through ACLs
          - text: Use ACLs to open the photos to everyone
        explanation:
          text: Block Public Access overrides ACLs that grant public access, and the owner wants nothing public.
      - id: server-reads
        text: The web server reads them with its own permissions
        variants:
          - text: The site's server fetches them using its own access
          - text: The web server gets them through its IAM permissions
        explanation:
          text: The server is a named identity that a policy allows to read. It sends the photos to visitors, and the bucket stays private.
      - id: sse-c
        text: Encrypt the photos with SSE-C so they're safe in public
        variants:
          - text: Use SSE-C so public photos stay protected
          - text: Protect the public photos with keys you supply
        explanation:
          text: Encryption doesn't make a public bucket safe, and it doesn't help visitors see photos.
    correct_answers: [server-reads]
    hint:
      text: Block Public Access stops grants to everyone. Does it affect access given to a named identity?
    explanation:
      text: |
        A bucket never needs to be public for a website to use its files. The web server reads the
        photos with its own permissions and sends them to visitors. Block Public Access blocks
        grants to everyone, not access given to named identities, so it stays on.

  # ---------------------------------------------------------------- 05.03 Storage classes and lifecycle

  - id: q05-unpredictable-video-library
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three questions pick a class: how often, how fast, how replaceable"
    task: "3.6"
    level: application
    topics: [s3-storage-classes]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online course platform keeps lecture recordings in Amazon S3. A recording can sit
        unwatched for a year and then be assigned to thousands of students overnight, and nobody can
        say which one will be next. The platform wants each recording's storage cost to drop while
        it goes unwatched, with no per-GB fee when it is suddenly read again. Which S3 storage class
        fits?
    choices:
      - id: standard
        text: S3 Standard
        variants:
          - text: The Standard class
          - text: Standard storage
        explanation:
          text: Standard has no retrieval fee, but its storage price never drops, however long a recording goes unwatched.
      - id: intelligent-tiering
        text: S3 Intelligent-Tiering
        variants:
          - text: The Intelligent-Tiering class
          - text: Intelligent-Tiering storage
        explanation:
          text: It moves each object to cheaper tiers when it goes unread and back when it's read, with no retrieval fees, only a small monitoring fee per object.
      - id: glacier-instant
        text: S3 Glacier Instant Retrieval
        variants:
          - text: The Glacier Instant Retrieval class
          - text: Glacier Instant Retrieval storage
        explanation:
          text: It stores cheaply and reads in milliseconds, but it charges a fee per GB read, so a recording that suddenly gets popular costs more.
      - id: standard-ia
        text: S3 Standard-IA
        variants:
          - text: The Standard-IA class
          - text: Standard-Infrequent Access
        explanation:
          text: Standard-IA suits a known, roughly monthly pattern, and it charges a fee per GB read.
    correct_answers: [intelligent-tiering]
    hint:
      text: The first question for any class is how often the data is read. What if the honest answer is "we don't know"?
    explanation:
      text: |
        When the access pattern is unknown or changes, S3 Intelligent-Tiering is the answer. S3
        watches each object, moves it to cheaper tiers after 30 and 90 days without a read, and
        moves it back when it's read, with no retrieval fees. The IA and Glacier classes charge per
        GB read, and fit only when you know how the data cools.

  - id: q05-regenerable-preview-clips
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three questions pick a class: how often, how fast, how replaceable"
    task: "3.6"
    level: application
    topics: [s3-storage-classes]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A mapping service renders map tiles, a few megabytes each, from source data it keeps
        elsewhere, and it can re-render any tile whenever it needs to. Each tile is read about once a
        month and must load in milliseconds. Which S3 storage class costs least for the tiles
        without putting irreplaceable data at risk?
    choices:
      - id: intelligent-tiering
        text: S3 Intelligent-Tiering
        variants:
          - text: The Intelligent-Tiering class
          - text: Intelligent-Tiering storage
        explanation:
          text: Intelligent-Tiering is for patterns you can't predict. This one is known, and it keeps copies across AZs that replaceable tiles don't need.
      - id: standard-ia
        text: S3 Standard-IA
        variants:
          - text: The Standard-IA class
          - text: Standard-Infrequent Access
        explanation:
          text: Standard-IA fits the read pattern, but it pays for copies across AZs that replaceable tiles don't need.
      - id: glacier-flexible
        text: S3 Glacier Flexible Retrieval
        variants:
          - text: The Glacier Flexible Retrieval class
          - text: Glacier Flexible Retrieval storage
        explanation:
          text: Flexible Retrieval needs a restore of minutes to hours before a read, so tiles couldn't load in milliseconds.
      - id: one-zone-ia
        text: S3 One Zone-IA
        variants:
          - text: The One Zone-IA class
          - text: One Zone-Infrequent Access
        explanation:
          text: It costs less than Standard-IA and reads in milliseconds. Losing it with an AZ is acceptable because the tiles can be recreated.
    correct_answers: [one-zone-ia]
    hint:
      text: Ask the third question. Could the company recreate this data if one Availability Zone were destroyed?
    explanation:
      text: |
        Data read about monthly that must come back in milliseconds belongs in an IA class. One
        Zone-IA keeps the data in a single Availability Zone, so it costs less but can lose data
        with that AZ. That's acceptable only for data you can recreate, such as these tiles.

  - id: q05-standard-ia-compared-with-standard
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "\"Standard-IA is as available as Standard\" is wrong"
    task: "3.6"
    level: understanding
    topics: [s3-storage-classes, availability]
    type: multiple_choice
    selection: single
    prompt:
      text: How does S3 Standard-IA compare with S3 Standard?
    choices:
      - id: same-availability
        text: The same availability and durability, at a lower storage price
        variants:
          - text: Equally available and durable, only cheaper to store
          - text: Just as available and durable, for less money per GB
        explanation:
          text: This is the misconception. The durability is the same, but Standard-IA is designed for lower availability.
      - id: lower-durability
        text: Lower designed durability, but the same availability
        variants:
          - text: Less durable by design, though just as available
          - text: The same availability, with reduced durability
        explanation:
          text: It's the other way round. Both classes are designed for the same eleven nines of durability.
      - id: lower-availability
        text: Lower designed availability, but the same durability
        variants:
          - text: Just as durable, though designed to be less available
          - text: The same durability, with reduced availability
        explanation:
          text: Standard-IA is designed for lower availability than Standard, with the same durability.
      - id: one-az
        text: It keeps all of its data in one Availability Zone
        variants:
          - text: It stores every object in a single AZ
          - text: Its data lives in just one AZ
        explanation:
          text: That's One Zone-IA. Standard-IA keeps copies in at least three AZs.
    correct_answers: [lower-availability]
    explanation:
      text: |
        Standard-IA and Standard share the same designed durability, eleven nines, which is where
        the confusion starts. AWS designs Standard for 99.99% availability and Standard-IA for
        99.9%, and One Zone-IA for 99.5% (as of 2026-10-23). Durability and availability are
        different promises.

  - id: q05-scans-read-a-few-times-a-year
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three Glacier classes: archive by how fast you need it back"
    task: "3.6"
    level: application
    topics: [s3-glacier, s3-storage-classes]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A newspaper keeps decades of photo archives in Amazon S3, and it has no other copy. Any one
        photo is opened perhaps a few times a year, but when an editor asks for one, it must appear
        in milliseconds. Which S3 storage class is the most cost-effective fit?
    choices:
      - id: standard-ia
        text: S3 Standard-IA
        variants:
          - text: The Standard-IA class
          - text: Standard-Infrequent Access
        explanation:
          text: Standard-IA reads in milliseconds, but it's built for data read about monthly and costs more to store than the archive class that also answers in milliseconds.
      - id: glacier-flexible
        text: S3 Glacier Flexible Retrieval
        variants:
          - text: The Glacier Flexible Retrieval class
          - text: Glacier Flexible Retrieval storage
        explanation:
          text: Flexible Retrieval needs a restore first, which takes minutes at best.
      - id: glacier-instant
        text: S3 Glacier Instant Retrieval
        variants:
          - text: The Glacier Instant Retrieval class
          - text: Glacier Instant Retrieval storage
        explanation:
          text: Instant Retrieval is the archive class that still reads in milliseconds, for data read about once a quarter.
      - id: one-zone-ia
        text: S3 One Zone-IA
        variants:
          - text: The One Zone-IA class
          - text: One Zone-Infrequent Access
        explanation:
          text: One Zone-IA keeps data in a single AZ, so it suits only data you can recreate; these photos are the only copy.
    correct_answers: [glacier-instant]
    hint:
      text: Among the archive classes, only one answers without a restore step.
    explanation:
      text: |
        The three S3 Glacier classes are chosen by how fast the data must come back. Glacier Instant
        Retrieval reads in milliseconds, like Standard-IA, for data read even less often, and stores
        it for less; AWS names news media as a typical use. The other two Glacier classes need a
        restore before any read.

  - id: q05-dr-backups-restore-in-hours
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three Glacier classes: archive by how fast you need it back"
    task: "3.6"
    level: application
    topics: [s3-glacier, s3-storage-classes]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An engineering firm copies its file server backups to Amazon S3 for disaster recovery and
        expects to read them once or twice a year. A full restore can take hours, but now and then
        one urgent file must be back within minutes. Which S3 storage class has the lowest storage
        cost that still allows this?
    choices:
      - id: glacier-flexible
        text: S3 Glacier Flexible Retrieval
        variants:
          - text: The Glacier Flexible Retrieval class
          - text: Glacier Flexible Retrieval storage
        explanation:
          text: It costs less to store than Instant Retrieval, suits backups read once or twice a year, and offers restores from minutes (expedited) to hours.
      - id: glacier-instant
        text: S3 Glacier Instant Retrieval
        variants:
          - text: The Glacier Instant Retrieval class
          - text: Glacier Instant Retrieval storage
        explanation:
          text: Instant Retrieval reads in milliseconds, a speed these backups don't need, and costs more to store than Flexible Retrieval.
      - id: deep-archive
        text: S3 Glacier Deep Archive
        variants:
          - text: The Glacier Deep Archive class
          - text: Glacier Deep Archive storage
        explanation:
          text: Deep Archive is cheaper still, but its restores take many hours, so the urgent file can't be back in minutes.
      - id: standard
        text: S3 Standard
        variants:
          - text: The Standard class
          - text: Standard storage
        explanation:
          text: Standard reads at once, but it's the most expensive place to keep backups read once or twice a year.
    correct_answers: [glacier-flexible]
    hint:
      text: Line up the archive classes by how fast they return data, then find the cheapest one that can still manage minutes.
    explanation:
      text: |
        Glacier Flexible Retrieval is the archive class for backups and disaster recovery copies
        read once or twice a year. A restore takes about 1 to 5 minutes with the expedited option,
        hours with standard or bulk (as of 2026-10-23). Deep Archive is cheaper but can't return
        data in minutes, and Instant Retrieval pays for speed these backups don't need.

  - id: q05-ten-year-records-lowest-cost
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three Glacier classes: archive by how fast you need it back"
    task: "3.6"
    level: application
    topics: [s3-glacier, s3-storage-classes]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A pharmacy chain, setting up its first AWS account, must keep prescription records for ten
        years. Nobody expects to read them, and if a regulator asks for one, the chain has three days
        to produce it. Which option has the lowest storage cost in AWS that meets these needs?
    choices:
      - id: glacier-flexible
        text: S3 Glacier Flexible Retrieval
        variants:
          - text: The Glacier Flexible Retrieval class
          - text: Glacier Flexible Retrieval storage
        explanation:
          text: It meets the three-day limit easily, but it costs more to store than Deep Archive, and the speed isn't needed.
      - id: deep-archive
        text: S3 Glacier Deep Archive
        variants:
          - text: The Glacier Deep Archive class
          - text: Glacier Deep Archive storage
        explanation:
          text: Deep Archive is S3's lowest-cost class, built for records kept for years and read less than once a year.
      - id: standard-ia
        text: S3 Standard-IA
        variants:
          - text: The Standard-IA class
          - text: Standard-Infrequent Access
        explanation:
          text: Standard-IA is built for data read about monthly, and it costs far more to store than the archive classes.
      - id: glacier-vault
        text: A vault in Amazon Glacier
        variants:
          - text: An Amazon Glacier vault
          - text: A vault in the original Glacier service
        explanation:
