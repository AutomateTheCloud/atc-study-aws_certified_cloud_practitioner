  - id: q05-many-accounts-one-backup-plan
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "AWS Backup runs backups for many services from one set of rules"
    task: "3.6"
    level: application
    topics: [backup, aws-backup]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs EBS volumes, RDS databases and DynamoDB tables in four AWS accounts. Its
        compliance team wants every resource tagged `backup=daily` backed up each night, kept for a
        set period and copied to a second Region, with reports that prove the backups happen. Which
        service fits best?
    choices:
      - id: per-service-snapshots
        text: Each service's own snapshots, set up by each team
        variants:
          - text: Snapshots scheduled separately in every service
          - text: Per-service snapshots configured team by team
        explanation:
          text: That could work, but nothing enforces one schedule across services and accounts or proves it happened.
      - id: drs
        text: AWS Elastic Disaster Recovery
        variants:
          - text: Elastic Disaster Recovery (AWS DRS)
          - text: AWS DRS
        explanation:
          text: It keeps whole servers ready for failover; it isn't built for scheduled retention across services.
      - id: storage-gateway
        text: AWS Storage Gateway
        variants:
          - text: A Storage Gateway in the company's office
          - text: Storage Gateway
        explanation:
          text: Storage Gateway connects on-premises software to AWS storage; these resources are already in AWS.
      - id: aws-backup
        text: AWS Backup
        variants:
          - text: A backup plan in AWS Backup
          - text: The AWS Backup service
        explanation:
          text: One backup plan, assigned by tag, covers the services and accounts, copies to another Region and reports on the backups.
    correct_answers: [aws-backup]
    hint:
      text: The need is one set of rules across many services and accounts, and proof.
    explanation:
      text: |
        AWS Backup puts backups for many services under one backup plan: how often, how long to
        keep each backup, and where to copy it. You assign resources by tag, it works across
        accounts, copies to other Regions, and its audit reports show the backups really happen.

  - id: q05-backups-even-admins-cant-delete
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "AWS Backup runs backups for many services from one set of rules"
    task: "3.6"
    level: recall
    topics: [backup, aws-backup]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company keeps its RDS and EBS backups with AWS Backup and fears that an attacker with
        administrator access could delete them. Which feature can be set so that no one, not even an
        administrator, can delete those backups before their retention period ends?
    choices:
      - id: vault-lock
        text: Vault Lock on the backup vault
        variants:
          - text: A Vault Lock on the vault holding the backups
          - text: Locking the backup vault with Vault Lock
        explanation:
          text: Vault Lock can stop anyone deleting the backups in a vault before their retention ends; that is its job in AWS Backup.
      - id: s3-object-lock
        text: S3 Object Lock on the backup bucket
        variants:
          - text: Object Lock on an S3 bucket for the backups
          - text: Turning on S3 Object Lock for the backups
        explanation:
          text: Object Lock protects object versions in an S3 bucket. These backups sit in an AWS Backup vault, not in a bucket you manage.
      - id: mfa-delete
        text: MFA Delete on the backup bucket
        variants:
          - text: The MFA Delete setting on an S3 bucket
          - text: Turning on MFA Delete for the backups
        explanation:
          text: MFA Delete applies to S3 object versions, and it only adds an MFA code to deletes; it doesn't forbid them.
      - id: snapshot-bpa
        text: Block Public Access for EBS snapshots
        variants:
          - text: EBS snapshot Block Public Access
          - text: Blocking public sharing of snapshots
        explanation:
          text: That stops snapshots being shared publicly; it doesn't stop deletes.
    correct_answers: [vault-lock]
    explanation:
      text: |
        AWS Backup keeps backups encrypted and unchangeable in a backup vault. Vault Lock can make
        those backups impossible for anyone, even an administrator, to delete before their retention
        ends, which protects against mistakes and ransomware. That strict setting is Vault Lock's
        compliance mode; in governance mode, users with the right permissions can still remove the
        lock.

  - id: q05-drs-compared-with-aws-backup
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "\"Elastic Disaster Recovery is a backup service\" is wrong"
    task: "3.6"
    level: understanding
    topics: [backup, disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes how AWS Elastic Disaster Recovery differs from AWS Backup?
    choices:
      - id: reversed
        text: AWS Backup gives back running servers, and DRS gives back data
        variants:
          - text: Backup restores whole running servers, while DRS restores data
          - text: AWS Backup brings back servers fast; DRS brings back data
        explanation:
          text: That's the right distinction the wrong way round.
      - id: drs-servers
        text: DRS gives back running servers, and AWS Backup gives back data
        variants:
          - text: DRS restores whole running servers, while Backup restores data
          - text: DRS brings back servers fast; AWS Backup brings back data
        explanation:
          text: AWS's FAQ draws this line. After an AWS Backup restore, someone still rebuilds or relaunches the servers.
      - id: same-job
        text: They do the same job, so a company needs only one of them
        variants:
          - text: Both are backup services, and either one will do
          - text: They're two names for one kind of backup service
        explanation:
          text: They answer different questions, and AWS designs them to be used together.
      - id: storage-tier
        text: DRS is the low-cost storage tier inside AWS Backup
        variants:
          - text: DRS is where AWS Backup keeps its oldest copies
          - text: DRS is a storage class that AWS Backup uses
        explanation:
          text: DRS is a separate service; AWS Backup's older backups can go to its own cold storage.
    correct_answers: [drs-servers]
    explanation:
      text: |
        A backup is an extra copy of your data; disaster recovery quickly restores access to your
        applications and servers. Elastic Disaster Recovery (DRS) copies whole servers continuously
        and launches them in minutes, while AWS Backup keeps scheduled recovery points of data. Keep
        both: the backup is what you go back to after a mistake or an attack.

  - id: q05-order-server-back-in-minutes
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Elastic Disaster Recovery keeps whole servers ready to launch"
    task: "3.6"
    level: application
    topics: [disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online retailer's order-processing server runs in its own data center. If that site
        fails, the server must be running in AWS within minutes, losing only seconds of data. The
        company wants to pay little while nothing is wrong. Which service fits?
    choices:
      - id: nightly-backup
        text: AWS Backup with a nightly backup plan
        variants:
          - text: A nightly plan in AWS Backup
          - text: Nightly backups through AWS Backup
        explanation:
          text: A nightly backup can lose up to a day of data, and a restore onto a new server takes far longer than minutes.
      - id: volume-stored
        text: Volume Gateway in stored mode
        variants:
          - text: Stored mode of Volume Gateway
          - text: A Volume Gateway in stored mode
        explanation:
          text: It sends point-in-time copies of disks to AWS; it doesn't launch running servers.
      - id: drs
        text: AWS Elastic Disaster Recovery
        variants:
          - text: Elastic Disaster Recovery (AWS DRS)
          - text: AWS DRS
        explanation:
          text: It copies every change continuously to cheap staging storage and launches recovery servers in minutes.
      - id: datasync
        text: AWS DataSync, run every night
        variants:
          - text: A nightly AWS DataSync transfer
          - text: Nightly copies with AWS DataSync
        explanation:
          text: DataSync moves data over the network; it doesn't keep servers ready to launch.
    correct_answers: [drs]
    hint:
      text: Minutes to recover and seconds of data lost rule out anything scheduled.
    explanation:
      text: |
        AWS Elastic Disaster Recovery keeps whole servers copied continuously into a low-cost
        staging area, and launches recovery servers in AWS within minutes. AWS says it supports
        recovery points of seconds. You pay for cheap storage, and for full servers only during
        drills or a recovery: a pilot light.

  - id: q05-before-deleting-test-database
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Snapshots are point-in-time copies of one disk or one database"
    task: "3.6"
    level: application
    topics: [backup, rds]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team is about to delete a test RDS database that has automated backups turned on. It
        might need the database's data again in a few months. What should the team do?
    choices:
      - id: rely-on-automated
        text: Rely on its automated backups to last for months afterward
        variants:
          - text: Count on the automated backups for months after deletion
          - text: Use its automated backups a few months after deleting it
        explanation:
          text: Automated backups last only for their retention period, which is measured in days (35 at most), so they won't be there months later.
      - id: raise-retention
        text: Raise the automated backup retention to its maximum first
        variants:
          - text: Extend the backup retention period before deleting it
          - text: Set the longest automated backup retention, then delete
        explanation:
          text: Even the longest retention is 35 days, about a month, not the few months the team may need.
      - id: ask-support
        text: Ask AWS Support to recover the database later if needed
        variants:
          - text: Request a recovery from AWS Support when it's needed
          - text: Have AWS Support restore it later on request
        explanation:
          text: AWS can't bring back data you deleted; keeping a copy is the customer's job.
      - id: final-snapshot
        text: Take a final manual snapshot before deleting it
        variants:
          - text: Create a manual snapshot as it's deleted
          - text: Keep a final snapshot of it at deletion
        explanation:
          text: Manual snapshots are kept until you delete them, which is why RDS offers a final snapshot when you delete a database.
    correct_answers: [final-snapshot]
    hint:
      text: One kind of RDS copy lasts only for a retention period counted in days. The other stays until you delete it.
    explanation:
      text: |
        RDS automated backups allow a restore to any second within the retention period, but that
        period is counted in days, not months (7 by default, 35 at most, as of 2026-10-23). Manual
        snapshots are kept until you delete them, so before deleting a database you might need
        again, take a final snapshot; it costs storage until you delete it.

  - id: q05-ebs-snapshot-statements
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Snapshots are point-in-time copies of one disk or one database"
    task: "3.6"
    level: recall
    topics: [backup, ebs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO statements about Amazon EBS snapshots are correct? (Select TWO.)
    choices:
      - id: continuous
        text: A snapshot keeps changing as the volume changes
        variants:
          - text: It updates continuously, in step with the volume
          - text: It keeps updating as the volume changes
        explanation:
          text: A snapshot is a point-in-time copy; it stops changing, which is why it can undo a mistake.
      - id: outlives-volume
        text: A snapshot keeps existing after its volume is deleted
        variants:
          - text: It outlives the volume it was taken from
          - text: Deleting the volume leaves the snapshot in place
        explanation:
          text: A snapshot persists on its own, and is billed on its own, after the volume is gone.
      - id: shared-folder
        text: A snapshot can be mounted by many servers as a shared folder
        variants:
          - text: Several servers can mount it as a file share
          - text: Many instances can share it as a file system
        explanation:
          text: You restore a snapshot to a new volume; sharing files among servers is EFS or FSx.
      - id: copy-elsewhere
        text: A snapshot can be copied to another Region or account
        variants:
          - text: You can copy it to a different Region or account
          - text: It can be copied across Regions and accounts
        explanation:
          text: You can copy a snapshot to another Region or account, and restore new volumes from it in any AZ of its Region.
      - id: whole-server
        text: A snapshot copies a whole server, ready to launch in minutes
        variants:
          - text: It captures a full server that can launch quickly
          - text: It saves an entire running server for a fast launch
        explanation:
          text: Keeping whole servers ready to launch is Elastic Disaster Recovery; a snapshot copies one volume.
    correct_answers: [outlives-volume, copy-elsewhere]
    explanation:
      text: |
        An EBS snapshot is a point-in-time copy of one volume. It persists on its own and outlives
        the volume, and you can restore new volumes from it or copy it to another Region or
        account. It gives back data as it was, not running servers.

  - id: q05-one-time-move-into-s3
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "\"Snowball is the answer for moving lots of data\" is wrong"
    task: "3.6"
    level: understanding
    topics: [data-transfer]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A firm with no AWS history plans a single migration of 60 TB of engineering drawings from a
        file server in its office into Amazon S3, over its own internet connection. Which service
        does AWS now point new customers to for this move?
    choices:
      - id: datasync
        text: AWS DataSync
        variants:
          - text: The AWS DataSync service
          - text: DataSync
        explanation:
          text: DataSync moves data over the network between on-premises storage and AWS storage such as S3.
      - id: s3-file-gateway
        text: Amazon S3 File Gateway
        variants:
          - text: S3 File Gateway, a Storage Gateway type
          - text: The S3 File Gateway type of Storage Gateway
        explanation:
          text: S3 File Gateway is a lasting link that office software uses every day, not a tool for moving data once.
      - id: aws-backup
        text: AWS Backup
        variants:
          - text: The AWS Backup service
          - text: A plan in AWS Backup
        explanation:
          text: AWS Backup manages backups of resources under one set of rules; it isn't a tool for migrating a file server's contents.
      - id: snowball
        text: AWS Snowball
        variants:
          - text: An AWS Snowball device
          - text: Snowball Edge
        explanation:
          text: Snowball was the old answer, a shipped device, but it's closed to new customers and its support is ending.
    correct_answers: [datasync]
    explanation:
      text: |
        Moving data once is a different job from a lasting hybrid link such as Storage Gateway. AWS
        DataSync does it over the network. Snowball Edge stopped taking new customers on 2025-11-07,
        and AWS ends support for Snowball devices in its commercial Regions on 2026-12-31 (checked
        2026-10-23); the current exam guide no longer lists the Snow Family.

  - id: q05-jobs-for-aws-backup
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "A snapshot, AWS Backup and Elastic Disaster Recovery side by side"
    task: "3.6"
    level: understanding
    topics: [backup, aws-backup]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO jobs can AWS Backup do? (Select TWO.)
    choices:
      - id: smb-folder
        text: Present a shared folder to on-premises PCs over SMB
        variants:
          - text: Give office PCs an SMB share stored in S3
          - text: Serve a Windows share to computers in the office
        explanation:
          text: That's S3 File Gateway, a type of Storage Gateway.
      - id: cross-region-copies
        text: Copy backups of RDS and EBS to another Region by one plan
        variants:
          - text: Send backup copies to a second Region, as a plan says
          - text: Copy each backup to another Region under one plan
        explanation:
          text: A backup plan can copy every backup to another Region or account.
      - id: launch-servers
        text: Launch running recovery servers in minutes from continuous copies
        variants:
          - text: Start continuously copied servers within minutes
          - text: Keep servers copied nonstop and launch them fast
        explanation:
          text: That's Elastic Disaster Recovery, which brings back servers rather than data.
      - id: locked-vault
        text: Keep backups in a vault where Vault Lock blocks early deletes
        variants:
          - text: Hold backups in a vault that Vault Lock guards from early deletes
          - text: Store backups where Vault Lock stops them being deleted early
        explanation:
          text: Backups sit in a backup vault, and Vault Lock can stop anyone, even an administrator, deleting them before retention ends.
      - id: storage-class
        text: Act as a cheap storage class for files uploaded to S3
        variants:
          - text: Serve as an S3 storage class for archived files
          - text: Work as a low-cost class for new S3 uploads
        explanation:
          text: AWS Backup isn't a storage class or a place for files; it manages backups of resources you already run.
    correct_answers: [cross-region-copies, locked-vault]
    explanation:
      text: |
        AWS Backup runs backups for many services and accounts from one plan, copies them to other
        Regions or accounts, protects them in vaults with Vault Lock, and reports on them. It
        doesn't connect on-premises software to AWS (Storage Gateway) or bring back running servers
        (Elastic Disaster Recovery), and it isn't a storage class.

  - id: q05-backup-customer-duties
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Your side of the line"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, backup]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company protects its data with AWS Backup. Under the AWS shared responsibility model, which
        TWO tasks belong to the company? (Select TWO.)
    choices:
      - id: durable-storage
        text: Keeping the stored backups durable
        variants:
          - text: Making sure hardware doesn't lose the backups
          - text: Keeping the backups' storage reliable
        explanation:
          text: AWS keeps backups durable and encrypted; that's resiliency of the cloud.
      - id: choose-retention
        text: Deciding what is backed up and for how long
        variants:
          - text: Choosing which resources to back up, and how long
          - text: Setting what gets backed up and its retention
        explanation:
          text: What is backed up, how often and for how long is always the customer's decision.
      - id: run-service
        text: Running the servers behind AWS Backup
        variants:
          - text: Patching the systems that run AWS Backup
          - text: Operating AWS Backup's infrastructure
        explanation:
          text: AWS runs AWS Backup; the customer only uses it.
      - id: test-restores
        text: Running test restores to prove the backups work
        variants:
          - text: Testing that the backups can really be restored
          - text: Doing restore drills to check the backups
        explanation:
          text: AWS keeps the backups; only the customer can show that a restore works for its applications.
      - id: secure-facilities
        text: Physically securing the sites that hold the backups
        variants:
          - text: Guarding the data centers that store backups
          - text: Protecting the buildings where backups are kept
        explanation:
          text: Physical security of the facilities is AWS's side of the line.
    correct_answers: [choose-retention, test-restores]
    explanation:
      text: |
        AWS is responsible for resiliency of the cloud: it runs AWS Backup, keeps backups durable
        and encrypted, and copies them where you say. You are responsible for resiliency in the
        cloud: what is backed up, how often and for how long, who may delete backups, and running
        the drills and test restores. An untested backup is a hope.

  # ---------------------------------------------------------------- 05.05 Managed or self-managed databases

  - id: q05-postgres-without-patching
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "AWS recommends a managed database unless you have a reason not to"
    task: "3.4"
    level: application
    topics: [managed-databases, rds]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A two-person team has built a booking app on PostgreSQL. Neither of them wants to apply
        operating system or database updates, or to look after backups. Where should the app's
        database run?
    choices:
      - id: documentdb
        text: Amazon DocumentDB
        variants:
          - text: An Amazon DocumentDB cluster
          - text: DocumentDB
        explanation:
          text: DocumentDB is a managed document database compatible with MongoDB, not PostgreSQL.
      - id: rds-postgres
        text: Amazon RDS for PostgreSQL
        variants:
          - text: PostgreSQL on Amazon RDS
          - text: An RDS for PostgreSQL DB instance
        explanation:
          text: RDS installs and patches the operating system and PostgreSQL, and takes the backups; the team keeps its queries.
      - id: elasticache
        text: Amazon ElastiCache
        variants:
          - text: An Amazon ElastiCache cache
          - text: ElastiCache
        explanation:
          text: ElastiCache keeps frequently read data in memory in front of a database; it isn't the app's PostgreSQL database.
      - id: ec2-postgres
        text: PostgreSQL on an Amazon EC2 instance
        variants:
          - text: A PostgreSQL server the team runs on EC2
          - text: Self-managed PostgreSQL on Amazon EC2
        explanation:
          text: "On EC2 the team installs and patches the operating system and PostgreSQL, and runs the backups: the work it wants to avoid."
    correct_answers: [rds-postgres]
    hint:
      text: The app needs the engine it was written for, and the team wants AWS to do the routine work around it.
    explanation:
      text: |
        AWS's RDS User Guide recommends RDS as the default choice for most relational databases. On
        RDS, AWS installs and patches the operating system and the database software and runs
        backups, failover and the hardware. Running the same engine on EC2 makes all of that the
        team's job.

  - id: q05-reason-to-run-your-own-database
    page: guide/05-storing-data/05-managed-or-self-managed-databases.md
    section: "AWS recommends a managed database unless you have a reason not to"
    task: "3.4"
    level: understanding
    topics: [managed-databases]
    type: multiple_choice
    selection: single
    prompt:
      text: In which situation does running a database on an EC2 instance, instead of on Amazon RDS, make the most sense?
    choices:
      - id: wants-patching
        text: The team wants AWS to apply the database patches
        variants:
          - text: AWS should handle patching the database engine
          - text: The team wants engine patches applied for it
        explanation:
          text: That's a reason to choose RDS, which patches the engine for you.
      - id: wants-failover
        text: The database needs automatic failover to another AZ
        variants:
          - text: It must fail over to another AZ by itself
          - text: Automatic failover between AZs is required
        explanation:
          text: RDS provides automatic failover with Multi-AZ; on EC2 you'd have to build it yourself.
      - id: wants-backups
        text: The team wants backups taken without writing any scripts
        variants:
          - text: Backups must run without the team having to script them
          - text: The team wants its backups handled for it automatically
        explanation:
          text: RDS takes automated backups; on EC2 the backup scripts are yours.
      - id: needs-os-access
        text: The software needs access to the server's operating system
        variants:
          - text: The database software must reach the server's OS
          - text: The team needs control of the database server's OS
        explanation:
          text: A managed service doesn't give you its operating system, because AWS runs that layer.
    correct_answers: [needs-os-access]
    explanation:
      text: |
        Run your own database on EC2 only for a real reason: an engine RDS doesn't offer, or software
        that needs the database server's operating system. Otherwise, running your own buys you
        work, not control you need, and patching by hand is more prone to mistakes.

