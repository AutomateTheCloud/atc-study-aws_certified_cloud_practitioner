    topics: [s3-glacier, exam-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An old training course tells a new AWS customer to create an Amazon Glacier vault to hold
        the company's archives. What should the customer do instead?
    choices:
      - id: vault-is-fine
        text: Create the vault, since vaults are just another name for the S3 Glacier classes
        variants:
          - text: Follow the course, because a vault and an S3 Glacier class are the same thing
          - text: Create the vault as told, since vaults and S3 Glacier classes are one service
        explanation:
          text: They're different. The vault service has its own containers and API, and it doesn't accept new customers.
      - id: backup-vault
        text: Upload the archives into an AWS Backup vault
        variants:
          - text: Put the archives in a backup vault in AWS Backup
          - text: Store the files in a vault created with AWS Backup
        explanation:
          text: A backup vault holds AWS Backup's recovery points of resources; it isn't a place to upload files.
      - id: s3-glacier-class
        text: Store them in an S3 bucket with an S3 Glacier storage class
        variants:
          - text: Use an S3 Glacier storage class in an ordinary bucket
          - text: Put them in S3 under one of the S3 Glacier classes
        explanation:
          text: AWS recommends the S3 Glacier storage classes for new archives; they live in normal S3 buckets.
      - id: ebs-snapshots
        text: Keep the archives as EBS snapshots
        variants:
          - text: Save the archives as snapshots of EBS volumes
          - text: Store the archives in EBS snapshots
        explanation:
          text: EBS snapshots are point-in-time copies of volumes, not an archive store for files.
    correct_answers: [s3-glacier-class]
    explanation:
      text: |
        The original vault service, now called Amazon Glacier, no longer accepts new customers,
        and AWS recommends the S3 Glacier storage classes for new archives (checked 2026-10-23).
        Those classes live inside ordinary S3 buckets and use the S3 API and lifecycle rules. When
        the exam guide says "Amazon S3 Glacier", think of the three classes.

  - id: q05-logs-cool-then-delete
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Lifecycle rules move and delete objects for you"
    task: "3.6"
    level: understanding
    topics: [s3-lifecycle]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company writes application logs to S3. After 30 days the logs are rarely read, and after
        one year they must be deleted. The company wants both to happen automatically, by the age
        of each log. What should it configure?
    choices:
      - id: intelligent-tiering
        text: S3 Intelligent-Tiering for every log object
        variants:
          - text: The Intelligent-Tiering class for all the logs
          - text: Intelligent-Tiering on each of the log files
        explanation:
          text: Intelligent-Tiering moves objects by their reads, not their age, and it never deletes anything.
      - id: versioning
        text: S3 Versioning turned on for the log bucket
        variants:
          - text: Versioning enabled on the bucket of logs
          - text: S3 Versioning switched on for the logs
        explanation:
          text: Versioning keeps more copies; it neither moves nor deletes objects by age.
      - id: replication
        text: S3 Replication to a bucket in a cheaper class
        variants:
          - text: Replicating the logs to a second, cheaper bucket
          - text: Same-Region Replication into a cheaper bucket
        explanation:
          text: Replication adds a copy, and its cost; the originals stay, and nothing is deleted.
      - id: lifecycle-rule
        text: A lifecycle rule that moves, then deletes, them
        variants:
          - text: An S3 Lifecycle rule to transition and expire
          - text: Lifecycle transition and expiration actions
        explanation:
          text: A transition action moves the logs to a colder class at day 30, and an expiration action deletes them at one year.
    correct_answers: [lifecycle-rule]
    hint:
      text: Both steps are decided in advance by each log's age.
    explanation:
      text: |
        An S3 Lifecycle configuration holds rules with two kinds of action: transitions, which move
        objects to another class after a number of days, and expirations, which delete them. Use
        lifecycle rules when you know how data cools with age, as with logs. Intelligent-Tiering
        is for patterns you can't predict.

  - id: q05-lifecycle-and-intelligent-tiering
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Lifecycle rules move and delete objects for you"
    task: "3.6"
    level: understanding
    topics: [s3-lifecycle, s3-storage-classes]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which TWO statements about S3 Lifecycle rules and S3 Intelligent-Tiering are correct? (Select TWO.)
    choices:
      - id: it-retrieval-fee
        text: Intelligent-Tiering charges a retrieval fee when a read moves an object back
        variants:
          - text: Moving an object back in Intelligent-Tiering adds a retrieval fee
          - text: Each read that returns an object to the frequent tier costs a fee
        explanation:
          text: Intelligent-Tiering has no retrieval fees; it charges a small monitoring fee per object instead.
      - id: lifecycle-by-age
        text: Lifecycle rules move objects by their age, on a schedule you set
        variants:
          - text: A lifecycle rule acts after a number of days that you choose
          - text: Lifecycle rules act on objects by age, using days you set
        explanation:
          text: Transitions and expirations happen a set number of days after an object was created, or became noncurrent.
      - id: new-objects-only
        text: Lifecycle rules apply only to objects uploaded after the rule
        variants:
          - text: A new rule affects only objects added after it's created
          - text: Objects already in the bucket are untouched by a new rule
        explanation:
          text: Rules apply to existing objects as well as new ones.
      - id: it-by-reads
        text: Intelligent-Tiering moves each object by how recently it was read
        variants:
          - text: Intelligent-Tiering tiers objects by their own read activity
          - text: Intelligent-Tiering moves objects based on when each was last read
        explanation:
          text: S3 watches each object, moves it to cheaper tiers when unread, and back when it's read.
      - id: policy-blocks-rule
        text: A bucket policy can stop a lifecycle rule from deleting objects
        variants:
          - text: A deny in the bucket policy can block lifecycle expirations
          - text: Lifecycle deletes can be prevented with a bucket policy
        explanation:
          text: A bucket policy can't stop lifecycle rules.
    correct_answers: [lifecycle-by-age, it-by-reads]
    explanation:
      text: |
        Lifecycle rules act by age, on a schedule you decide, so they fit data whose cooling you
        know, such as records. Intelligent-Tiering decides by each object's own reads, so it fits
        data you can't predict, such as photos. Lifecycle rules also apply to existing objects,
        and a bucket policy can't stop them.

  - id: q05-build-artifacts-in-deep-archive
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three cost traps"
    task: "4.1"
    level: application
    topics: [s3-storage-classes, storage-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        To cut costs, a team uploads nightly build artifacts straight into S3 Glacier Deep Archive
        and deletes each one after two weeks. What does this do to the bill?
    choices:
      - id: minimum-stay
        text: Each artifact is billed for the class's full minimum stay
        variants:
          - text: Every object is charged for the minimum storage duration
          - text: Each one is billed as if kept for the minimum stay
        explanation:
          text: Deleting before the minimum storage duration is billed as if the object stayed the full minimum.
      - id: two-weeks-only
        text: Each artifact is billed for two weeks at the lowest price
        variants:
          - text: Only the two weeks of storage are charged, at the low rate
          - text: Two weeks at Deep Archive's low rate, and nothing more
        explanation:
          text: That ignores the minimum stay, the trap this plan walks into.
      - id: deletes-blocked
        text: S3 blocks the deletes until the minimum stay is over
        variants:
          - text: The deletes are refused until the minimum period passes
          - text: S3 refuses to delete them before the minimum stay ends
        explanation:
          text: Deleting early is allowed; it's just billed for the rest of the stay.
      - id: early-delete-refund
        text: Deleting early earns a refund of the unused storage
        variants:
          - text: Early deletion returns the storage charge not used
          - text: The unused days are refunded when they're deleted
        explanation:
          text: There's no refund; early deletion costs more, not less.
    correct_answers: [minimum-stay]
    hint:
      text: Cold classes charge for one thing short-lived data never reaches.
    explanation:
      text: |
        Every class from Standard-IA down has a minimum storage duration. Delete, overwrite or move
        an object out early, and you pay for the rest of the stay; for Deep Archive that's 180 days
        (as of 2026-10-23). Two weeks of data billed as half a year costs more than two weeks in S3
        Standard. Cold classes are for data kept for months or years.

  - id: q05-tiny-files-moved-to-standard-ia
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three cost traps"
    task: "4.1"
    level: understanding
    topics: [s3-storage-classes, storage-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company moves two million files of about 10 KB each from S3 Standard to S3 Standard-IA,
        expecting its storage bill to fall by about half. Instead, the bill rises. What is the main
        reason?
    choices:
      - id: higher-price
        text: Standard-IA charges more per GB stored than Standard does
        variants:
          - text: Standard-IA's storage price per GB is above Standard's
          - text: Each GB costs more to store in Standard-IA than Standard
        explanation:
          text: Standard-IA's price per GB stored is lower than Standard's. The trap is in how small objects are measured.
      - id: minimum-size
        text: Standard-IA bills each small object at a minimum size
        variants:
          - text: Each tiny object is billed as a larger minimum size
          - text: Small objects are charged at a minimum billable size
        explanation:
          text: Standard-IA bills any object under 128 KB as 128 KB, so each 10 KB file is billed at more than twelve times its size.
      - id: more-copies
        text: Standard-IA keeps extra copies of every object
        variants:
          - text: Each object is copied to more AZs in Standard-IA
          - text: Standard-IA stores more copies of each object
        explanation:
          text: Standard-IA keeps copies across at least three AZs, like Standard; there are no extra copies to pay for.
      - id: versioning-on
        text: The transition turned on versioning for the bucket
        variants:
          - text: Moving the files switched versioning on
          - text: A transition enables versioning automatically
        explanation:
          text: Transitions don't change versioning, which only you can turn on.
    correct_answers: [minimum-size]
    explanation:
      text: |
        Standard-IA, One Zone-IA and Glacier Instant Retrieval bill any object under 128 KB as
        128 KB (as of 2026-10-23). For millions of tiny files, that outweighs the lower price per
        GB, and each transition is a billed request too. Small files usually belong in S3 Standard.

  - id: q05-daily-reads-from-standard-ia
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Three cost traps"
    task: "4.1"
    level: understanding
    topics: [s3-storage-classes, storage-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team moves a large dataset that its dashboards read every day from S3 Standard to S3
        Standard-IA to save money. The objects are large, and the bill still rises. Why?
    choices:
      - id: more-copies
        text: Standard-IA stores more copies, so each GB costs more
        variants:
          - text: Extra copies in Standard-IA raise the price per GB
          - text: Each GB costs more because Standard-IA keeps more copies
        explanation:
          text: Standard-IA keeps no more copies than Standard, and its storage price is lower.
      - id: restore-each-read
        text: Each daily read needs a paid restore request first
        variants:
          - text: Every read requires a billed restore before it starts
          - text: Standard-IA makes each read wait for a paid restore
        explanation:
          text: Standard-IA reads in milliseconds with no restore; restores belong to the two coldest Glacier classes.
      - id: retrieval-fee
        text: Standard-IA charges a fee for every GB that is read
        variants:
          - text: Each read from Standard-IA adds a fee per GB
          - text: Reading data from Standard-IA is billed per GB
        explanation:
          text: The retrieval fee is charged on every read, and data read daily pays it every day.
      - id: monitoring-fee
        text: Standard-IA adds a monitoring fee for each object
        variants:
          - text: Each object in Standard-IA pays a monitoring charge
          - text: A per-object monitoring fee applies in Standard-IA
        explanation:
          text: The monitoring fee belongs to Intelligent-Tiering, not Standard-IA.
    correct_answers: [retrieval-fee]
    explanation:
      text: |
        Every class from Standard-IA down charges per GB read. The IA classes are cheaper to store
        but meant for data read about once a month; moving data that's read every day into one can
        cost more than leaving it in Standard. Choose the class by how often the data is read.

  - id: q05-expire-old-versions
    page: guide/05-storing-data/07-lab-05-versions-and-lifecycle.md
    section: "Part B: finish a lifecycle rule (completion)"
    task: "4.1"
    level: application
    topics: [s3-lifecycle, s3-versioning]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A versioned bucket holds files that are overwritten often, and its storage bill keeps
        growing. The team must still be able to recover an overwritten file for 30 days. Which
        lifecycle action fixes the growth and keeps that recovery window?
    choices:
      - id: expire-current
        text: Expire current versions 30 days after they're created
        variants:
          - text: Delete current versions once they're 30 days old
          - text: Expire each object's current version at day 30
        explanation:
          text: In a versioned bucket, expiring a current version only adds a delete marker; the old versions stay and keep growing.
      - id: suspend-versioning
        text: Suspend versioning so that no new versions are ever kept
        variants:
          - text: Set versioning to suspended so it stops making new versions
          - text: Stop all new versions by suspending versioning on the bucket
        explanation:
          text: Suspending stops new versions, which ends recovery, and existing versions stay on the bill.
      - id: transition-current
        text: Move current versions to Standard-IA after 30 days
        variants:
          - text: Transition current versions to Standard-IA at day 30
          - text: Shift current versions into Standard-IA at 30 days
        explanation:
          text: A transition changes where current versions are stored; it doesn't remove the old versions piling up.
      - id: delete-noncurrent
        text: Delete noncurrent versions 30 days after they're replaced
        variants:
          - text: Remove older versions 30 days after they stop being current
          - text: Expire noncurrent versions after 30 days as noncurrent
        explanation:
          text: This keeps a 30-day window to recover an overwritten file, then deletes each old version for good.
    correct_answers: [delete-noncurrent]
    hint:
      text: The growth comes from the old versions, not the current ones.
    explanation:
      text: |
        In a versioned bucket, every overwrite keeps the old version, billed in full. A lifecycle
        action that permanently deletes noncurrent versions a set number of days after they stop
        being current keeps the recovery window and then clears them out. Expiring current versions
        only adds delete markers.

  - id: q05-limit-lifecycle-rule-scope
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "Lifecycle rules move and delete objects for you"
    task: "3.6"
    level: recall
    topics: [s3-lifecycle]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: A lifecycle rule doesn't have to cover a whole bucket. In which TWO ways can a rule's scope be limited? (Select TWO.)
    choices:
      - id: uploader
        text: To objects uploaded by a particular IAM user
        variants:
          - text: To the objects one chosen IAM user uploaded
          - text: To uploads from a single named IAM user
        explanation:
          text: Lifecycle rules don't select objects by who uploaded them.
      - id: prefix
        text: To objects whose keys start with a given prefix
        variants:
          - text: To objects under a key prefix such as logs/
          - text: To keys that begin with a chosen prefix
        explanation:
          text: A rule can cover only objects with a given name prefix, which works like a folder.
      - id: unread
        text: To objects that nobody has read for a set time
        variants:
          - text: To objects left unread for a number of days
          - text: To objects not read in the last 30 days
        explanation:
          text: Moving objects by their reads is what Intelligent-Tiering does; lifecycle rules act by age.
      - id: tag
        text: To objects that carry a given tag
        variants:
          - text: To objects with a particular tag
          - text: To objects tagged with a chosen key and value
        explanation:
          text: A rule can cover only objects with a given tag.
      - id: kms-encrypted
        text: To objects encrypted with SSE-KMS
        variants:
          - text: To objects that use KMS encryption
          - text: To objects encrypted with AWS KMS keys
        explanation:
          text: Encryption type isn't a lifecycle scope.
    correct_answers: [prefix, tag]
    explanation:
      text: |
        A lifecycle rule can cover the whole bucket, or only objects with a given name prefix or a
        given tag. That lets one bucket hold, for example, exports kept a year and logs kept 90
        days, each under its own rule.

  - id: q05-cheapest-plan-that-meets-rules
    revision: 2
    page: guide/05-storing-data/09-sim-lifecycle-cost-timeline.md
    section: "The rules of this simulation"
    task: "4.1"
    level: application
    topics: [s3-lifecycle, storage-pricing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company keeps weekly data exports in Amazon S3 for 180 days, then deletes them. For the
        first 30 days, staff must be able to open any export at once. After that, a wait of up to
        six hours is acceptable, but not longer. Which lifecycle plan meets these rules at the
        lowest storage cost?
    choices:
      - id: standard-then-flexible
        text: Standard for 30 days, then Flexible Retrieval until deletion
        variants:
          - text: Standard until day 30, then Flexible Retrieval until day 180
          - text: Keep it in Standard 30 days, then move it to Flexible Retrieval
        explanation:
          text: This meets the 30-day rule, then uses the coldest class whose restores fit within six hours. The 150-day stay passes its 90-day minimum.
      - id: standard-then-deep-archive
        text: Standard for 30 days, then Deep Archive until deletion
        variants:
          - text: Standard until day 30, then Deep Archive until day 180
          - text: Keep it in Standard 30 days, then move it to Deep Archive
        explanation:
          text: It's cheaper still, but a restore from Deep Archive takes 12 to 48 hours, which breaks the six-hour limit.
      - id: flexible-from-upload
        text: Flexible Retrieval from upload until deletion
        variants:
          - text: Straight into Flexible Retrieval, deleted at day 180
          - text: Flexible Retrieval for the whole 180 days, from day 0
        explanation:
          text: Every read from Flexible Retrieval needs a restore first, so staff couldn't open new exports at once.
      - id: standard-then-ia
        text: Standard for 30 days, then Standard-IA until deletion
        variants:
          - text: Standard until day 30, then Standard-IA until day 180
          - text: Keep it in Standard 30 days, then move it to Standard-IA
        explanation:
          text: It meets the rules, but after day 30 it pays for millisecond reads when a six-hour wait is allowed, so it costs more.
    correct_answers: [standard-then-flexible]
    hint:
      text: Check the first rule first. Then, for days 30 to 180, find the coldest class that can still return data within six hours.
    explanation:
      text: |
        The cheapest plan that keeps the rules puts each stretch of the data's life in the coldest
        class those rules allow. S3 Standard covers the days when exports must open at once. After
        that, Glacier Flexible Retrieval restores in minutes to hours, within the six-hour limit,
        while Deep Archive's 12 to 48 hours would break it. Standard-IA meets the rules but buys
        speed nobody needs.

  # ---------------------------------------------------------------- 05.04 Hybrid storage and backup

  - id: q05-clinic-folder-into-s3
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Storage Gateway lets on-premises software use AWS storage without changing"
    task: "3.6"
    level: application
    topics: [hybrid-storage, storage-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A clinic's staff save scanned forms to a shared folder on a Windows server in the office.
        The clinic wants the files stored in Amazon S3, and staff must keep saving to the folder
        exactly as they do today. Which service fits?
    choices:
      - id: volume-gateway
        text: Volume Gateway
        variants:
          - text: The Volume Gateway type of Storage Gateway
          - text: Storage Gateway's Volume Gateway
        explanation:
          text: Volume Gateway presents disks over iSCSI, not a shared folder that staff save files to.
      - id: tape-gateway
        text: Tape Gateway
        variants:
          - text: The Tape Gateway type of Storage Gateway
          - text: Storage Gateway's Tape Gateway
        explanation:
          text: Tape Gateway serves backup software that writes tapes, not people saving files.
      - id: aws-backup
        text: AWS Backup
        variants:
          - text: A backup plan in AWS Backup
          - text: The AWS Backup service
        explanation:
          text: AWS Backup manages backups of resources; it doesn't present a shared folder to the office.
      - id: s3-file-gateway
        text: Amazon S3 File Gateway
        variants:
          - text: The S3 File Gateway type of Storage Gateway
          - text: Storage Gateway's S3 File Gateway
        explanation:
          text: It presents a shared folder over SMB or NFS, caches recent files locally, and stores each file as an object in S3.
    correct_answers: [s3-file-gateway]
    hint:
      text: The software in the office stays the same. What does it expect to talk to - a folder, a disk or a tape?
    explanation:
      text: |
        AWS Storage Gateway lets software in your building keep using storage the way it always has,
        while the data lives in AWS. Its type follows what the software expects: S3 File Gateway
        presents a shared folder, here over SMB for Windows, and stores each file as an object in an
        S3 bucket.

  - id: q05-stop-handling-tapes
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Storage Gateway lets on-premises software use AWS storage without changing"
    task: "3.6"
    level: application
    topics: [hybrid-storage, storage-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manufacturer's backup software writes weekly backups to a physical tape library, and staff
        carry the tapes off site. The company wants to stop handling tapes without changing its
        backup jobs, and wants the backups to end up in AWS archive storage. Which service fits?
    choices:
      - id: tape-gateway
        text: Tape Gateway
        variants:
          - text: The Tape Gateway type of Storage Gateway
          - text: Storage Gateway's Tape Gateway
        explanation:
          text: It looks like a tape library to the existing software, stores the virtual tapes in S3 and archives them to the S3 Glacier classes.
      - id: s3-file-gateway
        text: Amazon S3 File Gateway
        variants:
          - text: The S3 File Gateway type of Storage Gateway
          - text: Storage Gateway's S3 File Gateway
        explanation:
          text: S3 File Gateway presents a shared folder; the backup jobs would have to change to write files instead of tapes.
      - id: aws-backup
        text: AWS Backup
        variants:
          - text: A backup plan in AWS Backup
          - text: The AWS Backup service
        explanation:
          text: AWS Backup is AWS's own backup service run by plans; it doesn't pose as a tape library for existing software.
      - id: drs
        text: AWS Elastic Disaster Recovery
        variants:
          - text: Elastic Disaster Recovery (AWS DRS)
          - text: AWS DRS
        explanation:
          text: Elastic Disaster Recovery keeps whole servers ready to launch; it doesn't take tape backups.
    correct_answers: [tape-gateway]
    hint:
      text: The backup jobs mustn't change, and they write to tapes.
    explanation:
      text: |
        Tape Gateway is the Storage Gateway type for existing backup software: it presents a virtual
        tape library over iSCSI, keeps recently used tapes in a cache, stores the tapes in S3 and
        archives them to S3 Glacier Flexible Retrieval or Deep Archive. The backup jobs keep running
        as before, and nobody carries tapes.

  - id: q05-volume-gateway-stored-mode
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Storage Gateway lets on-premises software use AWS storage without changing"
    task: "3.6"
    level: understanding
    topics: [hybrid-storage, storage-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: In AWS Storage Gateway's Volume Gateway, which statement describes stored mode?
    choices:
      - id: cached-description
        text: The full data lives in AWS, and the gateway caches the busy part
        variants:
          - text: Data is kept in AWS, with frequently used data cached locally
          - text: AWS holds all the data, while the gateway keeps the busy data
        explanation:
          text: That's cached mode. Ask where the full dataset lives.
      - id: stored-description
        text: The full data stays on premises, with point-in-time copies in AWS
        variants:
          - text: Everything stays local, and AWS holds snapshots of it
          - text: All data is kept in the building, with snapshots sent to AWS
        explanation:
          text: In stored mode the gateway keeps the whole dataset in the building, and AWS receives point-in-time copies as snapshots.
      - id: shared-folder
        text: Servers see the volumes as a shared folder over SMB or NFS
        variants:
          - text: The volumes appear to servers as a network file share
          - text: The gateway presents the data as shared folders
        explanation:
          text: A shared folder over SMB or NFS is S3 File Gateway. Volume Gateway presents disks, over iSCSI.
      - id: tapes
        text: The data is written to virtual tapes and then archived
        variants:
          - text: Volumes are saved as virtual tapes in an archive
          - text: It stores the data as archived virtual tapes
        explanation:
          text: Virtual tapes belong to Tape Gateway.
    correct_answers: [stored-description]
    explanation:
      text: |
        Volume Gateway presents disks over iSCSI, and its two modes differ in where the full dataset
        lives. In cached mode the full data lives in AWS and only frequently used data stays local.
        In stored mode the full data stays on premises, and AWS holds point-in-time copies as EBS
        snapshots.

  - id: q05-cloud-backed-disks
    page: guide/05-storing-data/04-hybrid-storage-and-backup.md
    section: "Storage Gateway lets on-premises software use AWS storage without changing"
