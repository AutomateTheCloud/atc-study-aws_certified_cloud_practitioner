    choices:
      - id: glacier-instant
        text: S3 Glacier Instant Retrieval
        variants:
          - text: The Glacier Instant Retrieval class
          - text: Glacier Instant Retrieval storage
        explanation:
          text: Instant Retrieval reads in milliseconds with no restore step.
      - id: glacier-flexible
        text: S3 Glacier Flexible Retrieval
        variants:
          - text: The Glacier Flexible Retrieval class
          - text: Glacier Flexible Retrieval storage
        explanation:
          text: You request a restore first, which takes minutes to hours.
      - id: standard
        text: S3 Standard
        variants:
          - text: The Standard class
          - text: Standard storage
        explanation:
          text: Standard, the default class, reads in milliseconds with no restore and no retrieval fee.
      - id: deep-archive
        text: S3 Glacier Deep Archive
        variants:
          - text: The Glacier Deep Archive class
          - text: Glacier Deep Archive storage
        explanation:
          text: You request a restore first, which takes many hours.
      - id: standard-ia
        text: S3 Standard-IA
        variants:
          - text: The Standard-IA class
          - text: Standard-Infrequent Access
        explanation:
          text: Standard-IA reads in milliseconds; it charges per GB read but needs no restore.
    correct_answers: [glacier-flexible, deep-archive]
    explanation:
      text: |
        The two coldest classes, Glacier Flexible Retrieval and Glacier Deep Archive, keep data
        that you must restore, making a temporary readable copy, before you can read it. Every
        class from Standard-IA down charges per GB read, but only these two make you wait. Glacier
        Instant Retrieval answers in milliseconds.

  - id: q05-old-course-glacier-vault
    page: guide/05-storing-data/03-storage-classes-and-lifecycle.md
    section: "\"Glacier vaults are the S3 Glacier classes\" is wrong"
    task: "3.6"
