  - id: q03-pilot-light-vs-warm-standby
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Four strategies, from cheap and slow to costly and fast"
    task: "3.2"
    level: understanding
    topics: [dr-strategies]
    type: multiple_choice
    selection: single
    prompt:
      text: What is the key difference between a pilot light and a warm standby?
    choices:
      - id: no-data
        text: A pilot light keeps no copy of the data in the recovery Region.
        variants:
          - text: With a pilot light, no data is copied to the recovery Region.
          - text: A pilot light leaves the recovery Region without any data.
        explanation:
          text: A pilot light copies data continuously and keeps core parts, such as the database, running.
      - id: backups-only
        text: A warm standby keeps backups but runs no servers.
        variants:
          - text: With a warm standby, backups exist but no servers run.
          - text: A warm standby holds backups and runs no servers.
        explanation:
          text: That describes backup and restore. A warm standby is a complete working copy, just smaller.
      - id: both-regions-serve
        text: A pilot light serves customers from both Regions every day.
        variants:
          - text: With a pilot light, both Regions take customers daily.
          - text: A pilot light has both Regions serving customers all the time.
        explanation:
          text: Serving customers from several Regions every day is multi-site active/active.
      - id: can-serve-now
        text: A warm standby can serve customers now; a pilot light can't.
        variants:
          - text: Only the warm standby could take customers right away.
          - text: A warm standby can serve customers at once, unlike a pilot light.
    correct_answers: [can-serve-now]
    explanation:
      text: |
        AWS itself calls this pair hard to tell apart. Ask: could it serve a customer right now? A
        warm standby can, at reduced size, and only has to scale up. A pilot light can't until its
        app servers are switched on, which is why it is cheaper and slower.

  - id: q03-backup-restore-needs-iac
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Four strategies, from cheap and slow to costly and fast"
    task: "3.2"
    level: understanding
    topics: [dr-strategies]
    type: multiple_choice
    selection: single
    prompt:
      text: Why does AWS recommend describing the setup as infrastructure as code for a backup and restore strategy?
    choices:
      - id: rebuild-fast
        text: The setup must be rebuilt after a disaster, fast and correctly.
        variants:
          - text: The setup has to be recreated after a disaster, quickly and without errors.
          - text: After a disaster, the setup must be rebuilt quickly and correctly.
      - id: replaces-backups
        text: Code that describes the setup replaces the need for data backups.
        variants:
          - text: Describing the setup as code makes data backups unnecessary.
          - text: With the setup written as code, data backups aren't needed.
        explanation:
          text: Code rebuilds the setup, not the data. AWS recommends backing up the code along with the data.
      - id: keeps-running
        text: Code keeps the servers running in the recovery Region at all times.
        variants:
          - text: The code keeps servers switched on in the recovery Region.
          - text: Servers in the recovery Region stay running because of the code.
        explanation:
          text: In backup and restore, nothing runs in the recovery Region before a disaster; that's what keeps it cheap.
      - id: required-for-copies
        text: AWS requires it before backups can be copied between Regions.
        variants:
          - text: Backups can't be copied across Regions without it.
          - text: AWS blocks cross-Region backup copies unless it's used.
        explanation:
          text: AWS has no such requirement. Backups can be copied to another Region however the setup is described.
    correct_answers: [rebuild-fast]
    explanation:
      text: |
        In backup and restore, only backups wait in the recovery Region; everything else is rebuilt
        after the disaster. Rebuilding by hand is slow and error-prone under pressure, so AWS
        recommends keeping the setup as code (Module 08) and backing that code up with the data.

  - id: q03-dr-services
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Four strategies, from cheap and slow to costly and fast"
    task: "3.2"
    level: recall
    topics: [disaster-recovery, backups]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which AWS services copy data or whole servers so that a workload can be recovered in
        another Region? (Select TWO.)
    choices:
      - id: local-zones
        text: AWS Local Zones
        variants:
          - text: An AWS Local Zone
          - text: Local Zones
        explanation:
          text: Local Zones run selected services in a large city for low latency. They don't copy workloads for recovery.
      - id: backup
        text: AWS Backup
        variants:
          - text: The AWS Backup service
          - text: Backup, AWS's backup service
      - id: wavelength
        text: AWS Wavelength
        variants:
          - text: AWS Wavelength Zones
          - text: Wavelength
        explanation:
          text: Wavelength puts compute inside 5G carrier networks for mobile devices, and it's out of scope for the exam.
      - id: health-dashboard
        text: AWS Health Dashboard
        variants:
          - text: The AWS Health Dashboard
          - text: Health Dashboard
        explanation:
          text: The Health Dashboard reports events that affect AWS services and your account. It doesn't copy anything.
      - id: drs
        text: AWS Elastic Disaster Recovery
        variants:
          - text: The AWS Elastic Disaster Recovery service
          - text: Elastic Disaster Recovery
    correct_answers: [backup, drs]
    explanation:
      text: |
        AWS Backup schedules backups across many services and can copy them to another Region. AWS
        Elastic Disaster Recovery continuously copies whole servers so they can be launched in
        minutes, a pilot light approach. Module 05 compares them.

  - id: q03-replica-cannot-undo-delete
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: '"Replication replaces backup" is wrong'
    task: "3.2"
    level: application
    topics: [backups]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company replicates its database to a second Region within seconds of every change. An
        employee runs a command that deletes the customers table. What can bring the table back?
    choices:
      - id: fail-over-region
        text: Failing over to the replica in the second Region
        variants:
          - text: Switching to the copy in the other Region
          - text: Moving users onto the second Region's replica
        explanation:
          text: Replication copied the deletion to the second Region within seconds, so the table is gone there too.
      - id: fail-over-az
        text: Failing over to a Multi-AZ standby in the same Region
        variants:
          - text: Switching to the database's standby in another AZ
          - text: Moving users onto the standby copy in a second AZ
        explanation:
          text: A standby receives every change within moments, including the deletion.
      - id: point-in-time
        text: Restoring a backup taken before the deletion
        variants:
          - text: Going back to a snapshot from before the deletion
          - text: Restoring a point-in-time backup made before it
      - id: wait-replication
        text: Waiting for replication to copy the table back again
        variants:
          - text: Letting replication restore the table on its own
          - text: Waiting until replication brings the table back
        explanation:
          text: Replication copies changes in one direction, from the main database. Both copies now agree that the table is gone.
    correct_answers: [point-in-time]
    hint:
      text: Which copy stopped changing before the mistake happened?
    explanation:
      text: |
        Replication faithfully copies every change, including deletions, corruption and an
        attacker's changes, so the replica is damaged along with the original. Only a point-in-time
        backup, a copy that stopped changing before the damage, lets you go back. Any changes made
        after that backup must be recovered another way.

  - id: q03-active-active-still-needs-backups
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: '"Replication replaces backup" is wrong'
    task: "3.2"
    level: understanding
    topics: [backups, dr-strategies]
    type: multiple_choice
    selection: single
    prompt:
      text: A company runs multi-site active/active across two Regions. Does it still need point-in-time backups?
    choices:
      - id: no-two-copies
        text: No, because full copies in two Regions mean no data can be lost.
        variants:
          - text: No; with complete copies in two Regions, nothing can be lost.
          - text: No, since two full Regional copies rule out any data loss.
        explanation:
          text: Both copies receive every change, so a deletion or corruption reaches both. Two copies protect against losing a place, not against damage to the data.
      - id: no-aws-restores
        text: No, because AWS restores deleted data in active/active setups.
        variants:
          - text: No; AWS brings back deleted data for active/active designs.
          - text: No, since AWS recovers deleted data in active/active setups.
        explanation:
          text: AWS doesn't undo customers' deletions. Protecting your data from mistakes is your side of the shared responsibility model.
      - id: yes-damage-copied
        text: Yes, because mistakes and corruption reach every Region.
        variants:
          - text: Yes; deletions and corruption reach every Region's copy.
          - text: Yes, since damage to the data spreads to all the live copies.
      - id: yes-contract
        text: Yes, but only because AWS's customer agreement requires backups.
        variants:
          - text: Yes, though only since AWS's agreement makes backups mandatory.
          - text: Yes, but only because AWS's terms demand that backups exist.
        explanation:
          text: "AWS's agreement doesn't require backups. The reason is technical: live copies share the damage."
    correct_answers: [yes-damage-copied]
    explanation:
      text: |
        Even multi-site active/active needs backups, AWS notes, because every live copy receives
        every change, including mistakes and attacks. Recovering from a data disaster means going
        back to a point before the damage, so some data is lost. Every DR strategy still needs
        point-in-time backups.

  # ---------------------------------------------------------------- Simulation S2

  - id: q03-sim-cooling-failure
    page: guide/03-aws-around-the-world/06-sim-blast-radius.md
