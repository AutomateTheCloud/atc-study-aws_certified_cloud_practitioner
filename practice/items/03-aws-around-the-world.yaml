    task: "3.2"
    level: application
    topics: [high-availability, blast-radius]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A shop runs web servers in two Availability Zones behind a load balancer, with a Multi-AZ
        database. A cooling failure shuts one data center in the first AZ. What protects the shop?
    choices:
      - id: ha
        text: "High availability: the second AZ's copies can take over"
        variants:
          - text: "High availability: the copies in the other AZ can carry on"
          - text: Its multi-AZ layout, since the other AZ can carry on
      - id: dr-region
        text: Disaster recovery, by failing over to a copy in another Region
        variants:
          - text: "Disaster recovery: switching to a copy in a second Region"
          - text: Its DR plan, since a copy in another Region takes over
        explanation:
          text: A data center failure is a lower rung on the ladder. It stays inside one Region, so a second Region isn't needed.
      - id: backup
        text: A point-in-time backup, restored from before the failure
        variants:
          - text: A backup from before the failure, restored afterwards
          - text: Restoring a backup taken earlier than the failure
        explanation:
          text: Backups undo damage to the data. Here the data is fine; a place has failed, and live copies elsewhere handle that.
      - id: nothing
        text: Nothing, because the shop has no copy outside the first AZ
        variants:
