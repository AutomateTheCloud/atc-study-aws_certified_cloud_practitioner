  - id: q03-edge-benefit-origin-load
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Edge locations deliver and answer close to users; they don't run your servers"
    task: "3.2"
    level: understanding
    topics: [edge-locations, cloudfront]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Besides faster answers for users, what is a benefit of serving a website through edge
        locations?
    choices:
      - id: fewer-requests
        text: Fewer requests reach the servers, as the edge answers many.
        variants:
          - text: The servers get fewer requests; the edge handles many itself.
          - text: Many requests stop at the edge, so fewer reach the servers.
      - id: db-standby
        text: The website's database gets a standby copy in a second AZ.
        variants:
          - text: The site's database gains a standby in another Availability Zone.
          - text: A standby copy of the database appears in a second AZ.
        explanation:
          text: A database standby comes from RDS Multi-AZ, not from edge locations.
      - id: one-country
        text: The website's data is kept inside a single country by default.
        variants:
          - text: The site's data stays in one country without extra settings.
          - text: By default, all of the site's data remains in a single country.
        explanation:
          text: The reverse is closer to true. CloudFront keeps copies at edge locations around the world, so check what may be cached outside its home area.
      - id: no-region
        text: The website no longer needs to run in any AWS Region at all.
        variants:
          - text: The site can stop using an AWS Region altogether.
          - text: No AWS Region is needed for the website any more.
        explanation:
          text: The origin, such as an S3 bucket or the web servers, still lives in a Region. The edge fetches from it whenever it has no copy.
    correct_answers: [fewer-requests]
    explanation:
      text: |
        Edge locations give three benefits: faster answers because the first trip is short, fewer
        requests reaching your servers because the edge answers many, and attack traffic absorbed far
        from your servers. CloudFront includes AWS Shield Standard at no extra cost (checked
        2026-10-23).

  - id: q03-edge-vs-region-and-az
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Edge locations deliver and answer close to users; they don't run your servers"
    task: "3.2"
    level: understanding
    topics: [edge-locations, regions-and-azs]
    type: multiple_choice
    selection: single
    prompt:
      text: How do edge locations relate to Regions and Availability Zones?
    choices:
      - id: small-az
        text: Each edge location is a small Availability Zone inside a Region.
        variants:
          - text: An edge location is a smaller AZ that sits within a Region.
          - text: Edge locations are miniature AZs, each inside a Region.
        explanation:
          text: An AZ is one or more full data centers inside a Region. Edge locations are much smaller sites outside the Regions.
      - id: group-of-regions
        text: An edge location groups several Regions on one continent.
        variants:
          - text: Each edge location joins together the Regions of a continent.
          - text: An edge location is a set of Regions on the same continent.
        explanation:
          text: Edge locations are small city sites. Nothing groups Regions into a larger unit.
      - id: dc-in-az
        text: An edge location is a data center inside an AZ, kept for caching.
        variants:
          - text: Each edge location is one data center in an AZ, used for caching.
          - text: An edge location is an AZ's data center set aside for caching.
        explanation:
          text: Edge locations aren't part of any AZ. They are in many more cities, often beside or inside internet providers' networks.
      - id: outside-regions
        text: They are small sites outside the Regions, on AWS's network.
        variants:
          - text: They sit outside the Regions as small sites on AWS's network.
          - text: They are small sites beyond the Regions, linked by AWS's network.
    correct_answers: [outside-regions]
    explanation:
      text: |
        Regions are large groups of data centers in a limited number of places. Edge locations are
        much smaller sites in many more cities, outside the Regions, and AWS's own global network
        links them all. Requests reach the nearest edge first and travel on to a Region only when the
        edge can't answer by itself.

  - id: q03-pick-cloudfront
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Three services use the edge, each in its own way"
    task: "3.2"
    level: application
    topics: [cloudfront, edge-locations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A news site stores its images and article pages in an Amazon S3 bucket in one Region. The
        content is the same for every reader, and readers on other continents say pages load slowly.
        Which service should it add?
    choices:
      - id: route53
        text: Amazon Route 53
        variants:
          - text: The Amazon Route 53 service
          - text: Route 53
        explanation:
          text: Route 53 answers name lookups, telling browsers where the site is. It doesn't deliver or cache the images.
      - id: global-accelerator
        text: AWS Global Accelerator
        variants:
          - text: The AWS Global Accelerator service
          - text: Global Accelerator
        explanation:
          text: Global Accelerator carries traffic over AWS's network but keeps no copies, so every request still travels to the bucket.
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: The Amazon CloudFront service
          - text: CloudFront
      - id: outposts
        text: AWS Outposts
        variants:
          - text: The AWS Outposts service
          - text: Outposts
        explanation:
          text: Outposts puts AWS hardware in the customer's own building. It doesn't bring content closer to readers around the world.
    correct_answers: [cloudfront]
    hint:
      text: The content is the same for everyone and rarely changes. Which service keeps copies of it?
    explanation:
      text: |
        Amazon CloudFront is AWS's content delivery network. It serves each reader from the edge
        location with the lowest latency, answers at once when it already has a copy, and fetches
        from the origin (here the S3 bucket) only when it doesn't. Content that is the same for
        everyone caches well.

  - id: q03-route53-what-it-does
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Three services use the edge, each in its own way"
    task: "3.2"
    level: recall
    topics: [route-53]
    type: multiple_choice
    selection: single
    prompt:
      text: Which statement describes Amazon Route 53?
    choices:
      - id: dns
        text: It answers DNS lookups and can choose which Region a user goes to.
        variants:
          - text: It's a DNS service that can pick the Region to send each user to.
          - text: It answers name lookups and can steer users to a chosen Region.
      - id: cdn
        text: It keeps cached copies of web content at edge locations near users.
        variants:
          - text: It caches websites' content at edge locations close to users.
          - text: It stores copies of web content in edge locations near viewers.
        explanation:
          text: That is CloudFront, AWS's CDN. Route 53 only answers "where is it?"; the content comes from elsewhere.
      - id: fixed-ips
        text: It gives an application fixed addresses announced from the edge.
        variants:
          - text: It provides an application with static addresses from the edge.
          - text: It assigns fixed edge-announced addresses to an application.
        explanation:
          text: That is AWS Global Accelerator.
      - id: edge-servers
        text: It runs application servers inside AWS's edge locations.
        variants:
          - text: It hosts application servers at AWS edge locations.
          - text: It lets applications run on servers in edge locations.
        explanation:
          text: No service runs your application servers at edge locations.
    correct_answers: [dns]
    explanation:
      text: |
        Route 53 is AWS's DNS service: it turns a name into an address, and can choose the answer by
        latency, by the user's location, or by health checks. It is not a CDN; it is often used with
        CloudFront, which delivers the content.

  - id: q03-pick-global-accelerator
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Three services use the edge, each in its own way"
    task: "3.2"
    level: application
    topics: [global-accelerator]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online game uses non-web traffic. The company wants fixed internet addresses for its game
        servers in two Regions, with players' traffic entering AWS's network at the nearest edge and
        travelling on it to the best healthy Region. Nothing needs caching. Which service fits?
    choices:
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: The Amazon CloudFront service
          - text: CloudFront
        explanation:
          text: CloudFront's strength is caching content near users, and the game has nothing to cache.
      - id: global-accelerator
        text: AWS Global Accelerator
        variants:
          - text: The AWS Global Accelerator service
          - text: Global Accelerator
      - id: route53
        text: Amazon Route 53
        variants:
          - text: The Amazon Route 53 service
          - text: Route 53
        explanation:
          text: Route 53 answers DNS lookups. It doesn't provide fixed addresses that carry the players' traffic over AWS's network.
      - id: outposts
        text: AWS Outposts
        variants:
          - text: The AWS Outposts service
          - text: Outposts
        explanation:
          text: Outposts runs AWS hardware in the customer's own building, not in front of servers in two Regions.
    correct_answers: [global-accelerator]
    hint:
      text: Look for fixed addresses, AWS's network from the nearest edge, and no caching.
    explanation:
      text: |
        AWS Global Accelerator gives an application fixed addresses that AWS announces from its edge
        locations. Traffic enters AWS's network at the nearest edge and travels to the best healthy
        endpoint, which suits non-web traffic such as games and fast switching between Regions. It
        caches nothing.

  - id: q03-route53-in-failover
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Three services use the edge, each in its own way"
    task: "3.2"
    level: understanding
    topics: [route-53, disaster-recovery]
    type: multiple_choice
    selection: single
    prompt:
      text: How can Amazon Route 53 help a disaster recovery plan when the main Region fails?
    choices:
      - id: copies-db
        text: It copies the database to the recovery Region as changes happen.
        variants:
          - text: It replicates the database into the recovery Region continuously.
          - text: It keeps a live copy of the database in the recovery Region.
        explanation:
          text: Route 53 doesn't handle data. Copying the database is done by the database service or AWS Backup.
      - id: cached-site
        text: It serves cached copies of the whole site from edge locations.
        variants:
          - text: It delivers the entire site from copies cached at the edge.
          - text: It keeps the site running from cached copies at edge locations.
        explanation:
          text: Caching content is CloudFront's job, and a cache can't take orders or run the application.
      - id: restarts-servers
        text: It restarts the failed servers in another Availability Zone.
        variants:
          - text: It relaunches the failed servers in a different AZ.
          - text: It brings the failed servers back up in another AZ.
        explanation:
          text: Route 53 doesn't launch or restart servers, and another AZ in the failed Region wouldn't help.
      - id: health-checks
        text: It can use health checks to send users to the recovery Region.
        variants:
          - text: Health checks let it point users at the recovery Region.
          - text: It can direct users to the recovery Region based on health checks.
    correct_answers: [health-checks]
    explanation:
      text: |
        Route 53 answers "where is this site?" and can choose the answer. With health checks, it can
        stop sending users to a main site that fails and send them to a standby in the recovery
        Region instead, one way a DR plan fails over.

  - id: q03-pick-local-zone
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    task: "3.2"
    level: application
    topics: [local-zones]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A film studio in a large city needs virtual workstations with single-digit-millisecond
        latency. The nearest Region is several hundred kilometers away, and the studio doesn't want
        any AWS hardware in its own building. Which option fits?
    choices:
      - id: outposts
        text: AWS Outposts
        variants:
          - text: An AWS Outposts rack
          - text: Outposts
        explanation:
          text: Outposts would put AWS hardware in the studio's own building, which it doesn't want.
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: The Amazon CloudFront service
          - text: CloudFront
        explanation:
          text: CloudFront delivers copies of content. Workstations need servers running close by, not cached files.
      - id: local-zone
        text: AWS Local Zones
        variants:
          - text: An AWS Local Zone
          - text: A Local Zone
      - id: wavelength
        text: AWS Wavelength
        variants:
          - text: An AWS Wavelength Zone
          - text: Wavelength
        explanation:
          text: Wavelength sits inside 5G carrier networks for mobile devices, and it's out of scope for the exam.
    correct_answers: [local-zone]
    hint:
      text: The servers must be close to the city, but not in the studio's building.
    explanation:
      text: |
        AWS Local Zones put compute, storage and other selected services in large cities, extending a
        parent Region. AWS names uses such as virtual workstations, live streaming and real-time
        games that need single-digit-millisecond latency.

  - id: q03-local-zone-reasons
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    task: "3.2"
    level: understanding
    topics: [local-zones]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: Which are reasons AWS gives for using a Local Zone? (Select TWO.)
    choices:
      - id: own-building
        text: Running AWS hardware inside your own building
        variants:
          - text: Putting AWS racks on your own premises
          - text: Hosting AWS hardware in your own facility
        explanation:
          text: That is AWS Outposts. A Local Zone is AWS's own site in a city.
      - id: city-latency
        text: Single-digit-millisecond latency for users in one city
        variants:
          - text: Very low latency for users in one large city
          - text: Delay of a few milliseconds for users in one city
      - id: cache-worldwide
        text: Caching content at hundreds of sites worldwide
        variants:
          - text: Keeping copies of content in sites around the world
          - text: Storing cached content at many sites across the world
        explanation:
          text: That is what edge locations do through CloudFront.
      - id: data-in-city
        text: Keeping data in a particular state or city
        variants:
          - text: Holding data inside a specific city or state
          - text: Meeting rules that keep data in one state or city
      - id: mobile-5g
        text: Running compute inside a carrier's 5G network
        variants:
          - text: Placing servers within a telecom 5G network
          - text: Hosting compute in a mobile carrier's 5G network
        explanation:
          text: That is AWS Wavelength, which is out of scope for the exam.
    correct_answers: [city-latency, data-in-city]
    explanation:
      text: |
        A Local Zone extends a parent Region into a large city, running selected services such as
        compute and storage there. AWS names two kinds of use: applications that need
        single-digit-millisecond latency for users in that city, and rules that keep data in a state
        or city.

  - id: q03-pick-outposts
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    task: "3.2"
    level: application
    topics: [outposts]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A bank's regulator requires certain records to stay in the bank's own data center. The bank
        wants to process them there with the same AWS services and tools it uses in its Region.
        Which option fits?
    choices:
      - id: outposts
        text: AWS Outposts
        variants:
          - text: An AWS Outposts rack
          - text: Outposts
      - id: local-zone
        text: An AWS Local Zone
        variants:
          - text: AWS Local Zones
          - text: A Local Zone
        explanation:
          text: A Local Zone is AWS's own site in a city, not the bank's data center, so the records would leave the premises.
      - id: edge-location
        text: An edge location
        variants:
          - text: A CloudFront edge location
          - text: An AWS edge location
        explanation:
          text: Edge locations run a few AWS services, such as CloudFront, and they belong to AWS, not the bank.
      - id: wavelength
        text: AWS Wavelength
        variants:
          - text: An AWS Wavelength Zone
          - text: Wavelength
        explanation:
          text: Wavelength sits inside 5G carrier networks, not in a customer's building, and it's out of scope for the exam.
    correct_answers: [outposts]
    hint:
      text: Where must the work physically happen?
    explanation:
      text: |
        AWS Outposts brings AWS's hardware, services and tools into the customer's own data center or
        site, and AWS operates it as part of a Region. It suits data that must stay on premises and
        systems that need low latency to on-site equipment: the hybrid deployment model.

  - id: q03-outposts-customer-part
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    task: "3.2"
    level: understanding
    topics: [outposts]
    type: multiple_choice
    selection: single
    prompt:
      text: A company installs AWS Outposts in its own data center. What is the company's job?
    choices:
      - id: replace-hardware
        text: Replacing failed parts in the Outposts racks
        variants:
          - text: Swapping out broken parts in the Outposts hardware
          - text: Repairing the Outposts racks when parts fail
        explanation:
          text: AWS maintains the Outposts hardware, including replacing what fails.
      - id: monitor-racks
        text: Monitoring and maintaining the Outposts hardware
        variants:
          - text: Watching over and servicing the Outposts racks
          - text: Keeping the Outposts hardware monitored and maintained
        explanation:
          text: AWS operates, monitors and maintains Outposts as part of a Region.
      - id: space-power-network
        text: Providing the space, power and network link
        variants:
          - text: Supplying the floor space, power and network
          - text: Giving it room, electricity and a network link
      - id: write-services
        text: Writing the software for the AWS services it runs
        variants:
          - text: Building the AWS services that run on it
          - text: Coding the AWS services the racks provide
        explanation:
          text: AWS's own services run on Outposts; the company uses them as it would in a Region.
    correct_answers: [space-power-network]
    explanation:
      text: |
        With Outposts the responsibility shifts: AWS delivers the racks or servers and operates,
        monitors and maintains them, while the customer provides the building, the power and the
        network connection back to the Region.

  - id: q03-where-wavelength-runs
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    task: "3.2"
    level: recall
    topics: [wavelength]
    type: multiple_choice
    selection: single
    prompt:
      text: Where do AWS Wavelength Zones place AWS compute and storage?
    choices:
      - id: own-dc
        text: Inside the customer's own data center
        variants:
          - text: In the customer's own building
          - text: On the customer's premises
        explanation:
          text: That is AWS Outposts.
      - id: big-city
        text: In large cities, for users on home and office networks
        variants:
          - text: In big cities, serving users on ordinary home and office links
          - text: In major cities, for users of everyday office and home networks
        explanation:
          text: That describes AWS Local Zones, which extend a Region into a large city. Wavelength is defined by being inside 5G mobile networks.
      - id: edge-cache
        text: At edge locations that cache content
        variants:
          - text: In edge locations that keep cached copies
          - text: At caching sites near internet users
        explanation:
          text: Edge locations run some AWS services, such as CloudFront; you can't run your own servers there.
      - id: carrier-5g
        text: Inside telecom carriers' 5G networks
        variants:
          - text: Within mobile carriers' 5G networks
          - text: In telecom providers' 5G networks
    correct_answers: [carrier-5g]
    explanation:
      text: |
        AWS Wavelength places compute and storage inside telecom carriers' 5G networks, for
        applications that need very low latency to phones and other mobile devices. The CLF-C02 exam
        guide lists Wavelength as out of scope as a service (checked 2026-10-24), so expect it
        mainly as a distractor.

  - id: q03-run-servers-outside-region
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Region, AZ, edge location, Local Zone, Outposts: where is it?"
    task: "3.2"
    level: understanding
    topics: [local-zones, outposts, edge-locations]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which options let a company run its Amazon EC2 instances physically outside the
        Availability Zones of a Region? (Select TWO.)
    choices:
      - id: edge-locations
        text: Edge locations
        variants:
          - text: AWS edge locations
          - text: Points of presence at the edge
        explanation:
          text: Edge locations run some AWS services, such as CloudFront and Route 53, never your EC2 instances.
      - id: local-zones
        text: AWS Local Zones
        variants:
          - text: A Local Zone
          - text: Local Zones
      - id: cloudfront
        text: Amazon CloudFront
        variants:
          - text: The CloudFront service
          - text: CloudFront
        explanation:
          text: CloudFront delivers content from edge locations; it doesn't run servers for you.
      - id: outposts
        text: AWS Outposts
        variants:
          - text: An Outposts rack
          - text: Outposts
      - id: route53
        text: Amazon Route 53
        variants:
          - text: The Route 53 service
          - text: Route 53
        explanation:
          text: Route 53 is a DNS service. It points users at servers; it doesn't host them.
    correct_answers: [local-zones, outposts]
    explanation:
      text: |
        Local Zones run selected services, including compute, in a large city; Outposts runs AWS
        hardware in your own building. Each extends a Region. (Wavelength Zones also run compute,
        inside 5G networks, but the exam lists Wavelength as out of scope.) Edge locations never run
        your servers.

  - id: q03-cloudfront-data-rules
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Worked example: faster photos for the bakery's German customers"
    task: "3.2"
    level: understanding
    topics: [cloudfront, data-sovereignty]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Before putting Amazon CloudFront in front of some content, which data question should a
        company ask?
    choices:
      - id: three-azs
        text: Whether the content is stored in at least three Availability Zones
        variants:
          - text: Whether the content sits in three or more AZs
          - text: If the content is kept in a minimum of three AZs
        explanation:
          text: How the origin stores the content doesn't decide whether copies may be made elsewhere.
      - id: copied-outside
        text: Whether the content may be copied outside its home area
        variants:
          - text: If copies of the content may leave the area it belongs to
          - text: Whether the content may be copied beyond its allowed area
      - id: multi-az-origin
        text: Whether the origin database has a Multi-AZ standby
        variants:
          - text: If the origin's database runs with a Multi-AZ standby
          - text: Whether a Multi-AZ standby protects the origin database
        explanation:
          text: A standby protects the origin from an AZ failure. It has nothing to do with where cached copies go.
      - id: fixed-ips
        text: Whether its users have fixed internet addresses
        variants:
          - text: If the users connect from static internet addresses
          - text: Whether every user has a fixed internet address
        explanation:
          text: CloudFront serves users wherever they connect from; their addresses aren't the concern.
    correct_answers: [copied-outside]
    explanation:
      text: |
        CloudFront keeps copies of content at edge locations around the world. Content such as
        product photos is usually fine to copy, but data with location rules, such as EU customers'
        orders, shouldn't be cached outside its allowed area. Ask before caching anything.

flashcards:

  - id: c03-data-center-means-two-azs
    page: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
    section: '"An Availability Zone is one data center" is wrong'
    level: understanding
    topics: [regions-and-azs, high-availability]
    front:
      text: A requirement says "survive losing one data center". What does that mean in practice on AWS, and why?
    back:
      text: |
        Run in at least two Availability Zones. You can't see or choose the building a resource is
        in; the AZ is the smallest place you control.

  - id: c03-region-has-vs-account-uses
    page: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
    section: '"A Region can have just two AZs" is wrong'
    level: understanding
    topics: [regions-and-azs]
    front:
      text: Why might your account see fewer Availability Zones than the Region has?
    back:
      text: |
        AWS can limit which AZs an account may use: newer accounts get two of the three in US West
        (N. California), and AWS may stop offering a crowded AZ to new accounts.

  - id: c03-rds-not-multi-az-by-default
    page: guide/03-aws-around-the-world/01-regions-availability-zones-data-centers.md
    section: "Where your resources live: in one AZ, across a Region, or everywhere"
    level: recall
    topics: [regions-and-azs, high-availability]
    front:
      text: Does Amazon RDS run a database across several Availability Zones by default?
    back:
      text: |
        No. It runs in one AZ unless you turn on Multi-AZ, which adds a standby in a second AZ that
        takes over if the first fails.

  - id: c03-region-choice-order
    page: guide/03-aws-around-the-world/02-choosing-a-region.md
    section: "The big picture: two filters, then a trade-off"
    level: understanding
    topics: [choosing-a-region]
    front:
      text: In what order do you weigh the four factors for choosing a Region?
    back:
      text: |
        First the two filters: rules on where data may live, then the services you need. Then rank
        what's left by latency to your users and by price.

  - id: c03-region-name-not-border
    page: guide/03-aws-around-the-world/02-choosing-a-region.md
    section: "Rules first: decide where the data may live"
    level: understanding
    topics: [data-sovereignty]
    front:
      text: Why can't you tell from a Region's name whether it is in the EU?
    back:
      text: |
        Names aren't legal borders. Europe (London) is in the UK and Europe (Zurich) in Switzerland,
        neither in the EU. Check the Region's country.

  - id: c03-copies-follow-data-rules
    page: guide/03-aws-around-the-world/02-choosing-a-region.md
    section: "Rules first: decide where the data may live"
    level: understanding
    topics: [data-sovereignty, disaster-recovery]
    front:
      text: A rule says data must stay in the EU. Which copies of the data does it cover?
    back:
      text: |
        Every copy: backups, replicas and test copies too. A copy in another Region moves the data
        there, so it must also stay in the EU.

  - id: c03-when-pay-pricier-region
    page: guide/03-aws-around-the-world/02-choosing-a-region.md
    section: "Weigh the price: the same thing costs different amounts in different Regions"
    level: understanding
    topics: [choosing-a-region]
    front:
      text: When is a higher-priced Region worth paying for?
    back:
      text: |
        When latency to your users, data residency or sovereignty requires it. Otherwise, prefer a
        lower-priced Region (COST07-BP02).

  - id: c03-what-multi-az-misses
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: '"High availability is the same as disaster recovery" is wrong'
    level: understanding
    topics: [high-availability, disaster-recovery]
    front:
      text: Which failures does high availability across several AZs NOT protect against?
    back:
      text: |
        Losing the whole Region, and a mistake that deletes or damages the data. Those need a
        separate copy and a plan to use it.

  - id: c03-rpo-rto-memory-aid
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "RTO and RPO: how long you can be down, and how much you can lose"
    level: recall
    topics: [rto-rpo]
    front:
      text: What is a quick way to keep RPO and RTO apart?
    back:
      text: |
        The P in RPO is a point in your data: how much you lose, looking back. The T in RTO is time
        without service: how long you're down, looking forward.

  - id: c03-choose-cheapest-strategy
    page: guide/03-aws-around-the-world/06-sim-blast-radius.md
    section: "The rules of this simulation"
    level: understanding
    topics: [dr-strategies]
    front:
      text: What rule picks a disaster recovery strategy from the RTO and RPO?
    back:
      text: |
        Choose the cheapest strategy that meets both the RTO and the RPO, working up from backup and
        restore, the cheapest.

  - id: c03-pilot-light-or-warm-standby-test
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Four strategies, from cheap and slow to costly and fast"
    level: understanding
    topics: [dr-strategies]
    front:
      text: One question tells a pilot light from a warm standby. What is it?
    back:
      text: |
        "Could it serve a customer right now?" A warm standby can, at reduced size. A pilot light
        can't until its app servers are switched on.

  - id: c03-backup-restore-needs-iac
    page: guide/03-aws-around-the-world/03-surviving-failure.md
    section: "Four strategies, from cheap and slow to costly and fast"
    level: understanding
    topics: [dr-strategies]
    front:
      text: Why does a backup and restore strategy need infrastructure as code?
    back:
      text: |
        Everything but the backups is rebuilt after the disaster. Rebuilding by hand is slow and
        error-prone, so keep the setup as code, and back up that code with the data.

  - id: c03-three-edge-services
    revision: 2
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Edge locations deliver and answer close to users; they don't run your servers"
    level: recall
    topics: [edge-locations]
    front:
      text: Which services in this module use edge locations, and what never runs there?
    back:
      text: |
        Amazon CloudFront, Amazon Route 53 and AWS Global Accelerator use them. Your own servers
        never run at an edge location.

  - id: c03-tell-locations-apart
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Region, AZ, edge location, Local Zone, Outposts: where is it?"
    level: understanding
    topics: [edge-locations, local-zones, outposts]
    front:
      text: What one question separates a Region, an AZ, an edge location, a Local Zone and Outposts?
    back:
      text: |
        "Where is it, physically?" For example: a Local Zone is in a big city; Outposts is in your
        own building; an edge location is near internet users.

  - id: c03-wavelength-on-the-exam
    page: guide/03-aws-around-the-world/04-the-edge.md
    section: "Local Zones, Outposts and Wavelength run AWS servers outside a Region"
    level: recall
    topics: [wavelength]
    front:
      text: How should you treat AWS Wavelength on the CLF-C02 exam?
    back:
      text: |
        It's out of scope as a service. Recognize it (compute inside 5G carrier networks, for mobile
        devices) so you can spot it as a wrong answer.
