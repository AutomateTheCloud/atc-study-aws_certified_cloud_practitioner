    correct_answers: [ha]
    hint:
      text: How far does this failure reach, and where are the shop's copies?
    explanation:
      text: |
        One data center is a low rung on the blast-radius ladder. If the AZ has other data centers
        it may carry on; if not, the web server and standby database in the second AZ take over.
        Either way it's high availability, inside one Region.

