        variants:
          - text: An edge location hosts some AWS services, but not your servers.
          - text: You can't run your own servers at an edge location.
      - id: big-regions-only
        text: Edge locations sit inside Regions that have six or more AZs.
        variants:
          - text: Regions with six or more AZs are where edge locations sit.
          - text: Edge locations are found in Regions with six AZs or more.
