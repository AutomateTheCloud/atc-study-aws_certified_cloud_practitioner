    correct_answers: [data-centers]
    hint:
      text: Who would replace the disks and fix the cooling if the clinic used the cloud?
    explanation:
      text: |
        AWS's advantage "stop spending money running and maintaining data centers" means the
        provider does the buying, housing, cooling and repairing of equipment. The organization can
        then spend its time on what sets it apart, here the clinic's appointment app, instead of on
        work every server room needs.

  - id: q02-six-advantages-names
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Six advantages, one picture
    task: "1.1"
    level: recall
    topics: [six-advantages]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A slide for new staff is meant to list AWS's six advantages of cloud computing, but some
        of its lines were made up or misremembered. Which two lines are really among the six?
        (Select TWO.)
    choices:
      - id: design-for-failure
        text: Design for failure
        variants:
          - text: 'The line "Design for failure"'
          - text: 'The phrase "Design for failure"'
        explanation:
          text: |
            "Design for failure" is a slogan from older study material. It isn't one of the six
            advantages, nor a current Well-Architected design principle.
      - id: go-global
        text: Go global in minutes
        variants:
          - text: 'The line "Go global in minutes"'
          - text: 'The phrase "Go global in minutes"'
        explanation:
          text: |
            Correct. You can run your system in Regions around the world, close to users, with a few
            clicks.
      - id: reduce-operating
        text: Reduce operating expenses
        variants:
          - text: 'The line "Reduce operating expenses"'
          - text: 'The phrase "Reduce operating expenses"'
        explanation:
          text: |
            The cloud changes the kind of cost, from fixed to variable; operating bills often go up.
            AWS's advantage is "trade fixed expense for variable expense".
      - id: speed-agility
        text: Increase speed and agility
        variants:
          - text: 'The line "Increase speed and agility"'
          - text: 'The phrase "Increase speed and agility"'
        explanation:
          text: |
            Correct. New resources arrive in minutes instead of weeks, so teams can try ideas
            quickly.
      - id: fixed-price
        text: Pay one fixed price for capacity
        variants:
          - text: 'The line "Pay one fixed price for capacity"'
          - text: 'The phrase "Pay one fixed price for capacity"'
        explanation:
          text: |
            A fixed price is the opposite of the cloud's pay-as-you-go model, where the bill follows
            use.
    correct_answers: [go-global, speed-agility]
    explanation:
      text: |
        AWS's six advantages are: trade fixed expense for variable expense; benefit from massive
        economies of scale; stop guessing capacity; increase speed and agility; stop spending money
        running and maintaining data centers; and go global in minutes. "Reduce operating expenses"
        is a common misreading of the first one.

  # ---------------------------------------------------------------- 02.03 Telling the benefits apart

  - id: q02-tax-deadline-traffic-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "Elasticity: capacity grows and shrinks with demand"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, elasticity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online tax-filing service gets several times its usual traffic in the weeks before the
        filing deadline, and very little afterwards. Its servers are added automatically as traffic
        rises and removed as it falls. Which cloud benefit does this show best?
    choices:
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            Agility is about getting something new quickly to try an idea. Here the same service gets
            more or less capacity in response to demand.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Correct. Capacity follows demand in both directions, which is elasticity.
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            High availability is about staying up when a part fails. Nothing fails in this scenario.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Durability is about stored data not being lost. The scenario is about capacity.
    correct_answers: [elasticity]
    explanation:
      text: |
        Elasticity means capacity grows when demand rises and shrinks when it falls, so you don't
        pay for capacity you no longer need. On AWS it is usually delivered automatically by auto
        scaling. When a scenario describes more or less of the same thing in response to demand, the
        answer is elasticity.

  - id: q02-scalability-elasticity-correction
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: '"Scalability is manual, elasticity is automatic" is a myth'
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, elasticity, scalability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A colleague says, "Scalability is when engineers add servers by hand; elasticity is when the
        cloud adds them for you." Which statement best corrects this?
    choices:
      - id: correct-as-stated
        text: Nothing needs correcting; that is how AWS defines the two terms.
        variants:
          - text: It is accurate; AWS defines the two terms exactly that way.
          - text: No correction is needed; it matches AWS's definitions.
        explanation:
          text: |
            No AWS source defines the terms that way, although the idea circulates in study material.
      - id: reversed
        text: It is reversed; elasticity is the manual one and scalability is automatic.
        variants:
          - text: It is backwards; scalability is automatic and elasticity manual.
          - text: The two are swapped; elasticity is done by hand, scalability automatically.
        explanation:
          text: |
            Swapping the labels keeps the same mistake: the difference isn't about manual versus
            automatic at all.
      - id: up-and-down
        text: The difference is direction; elasticity also shrinks capacity as demand falls.
        variants:
          - text: The real difference is that elastic capacity follows demand down as well as up.
          - text: What matters is that elasticity removes capacity when demand drops, too.
        explanation:
          text: |
            Correct. Scalability means a system can grow; elasticity means capacity follows demand up
            and down. On AWS, elasticity is usually automatic, but that isn't what defines it.
      - id: same-thing
        text: The two terms mean exactly the same thing on AWS, so either fits.
        variants:
          - text: On AWS the two words are exact synonyms, so either is right.
          - text: AWS treats the terms as identical, so they are interchangeable.
        explanation:
          text: |
            They aren't the same. A system can scale up without ever giving capacity back, and that
            isn't elasticity.
    correct_answers: [up-and-down]
    explanation:
      text: |
        "Scalability is manual, elasticity is automatic" is a myth. Scalability, in plain words,
        means a system can grow to handle more; AWS gives no formal definition of it. Elasticity
        means capacity follows demand up and down, so you don't pay for what you no longer need. It
        is usually automatic on AWS, which is why the two ideas get merged.

  - id: q02-grew-never-shrank-missing
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: '"Scalability is manual, elasticity is automatic" is a myth'
    task: "1.1"
    level: application
    topics: [cloud-benefits, elasticity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online forum's servers grew from 2 to 40 over three years as members joined. Servers were
        added when needed, but none were ever removed, even overnight when few members were online.
        What does this setup lack to be a good example of elasticity?
    choices:
      - id: two-azs
        text: Copies of the forum in a second Availability Zone
        variants:
          - text: A second copy of the forum in another Availability Zone
          - text: Forum servers spread across two Availability Zones
        explanation:
          text: |
            Running in two AZs gives high availability, protection from a failed part. It has nothing
            to do with capacity following demand.
      - id: shrink-with-demand
        text: Capacity that shrinks again when demand falls
        variants:
          - text: Servers removed again when demand drops
          - text: Giving capacity back as demand goes down
        explanation:
          text: |
            Correct. The forum scaled up, but capacity never followed demand down, so it pays for
            idle servers every night.
      - id: second-region
        text: A copy of the forum in another AWS Region
        variants:
          - text: A second copy of the forum in a different Region
          - text: Forum servers running in a second AWS Region
        explanation:
          text: |
            A second Region is about global reach or recovery, not about matching capacity to
            demand.
      - id: faster-test-setup
        text: A quicker way to set up new test environments
        variants:
          - text: Faster creation of new test environments
          - text: Test environments that can be built more quickly
        explanation:
          text: |
            Quick test environments are agility: getting something new fast. The forum's issue is
            the amount of the same capacity.
    correct_answers: [shrink-with-demand]
    hint:
      text: Elasticity works in two directions. Which one is missing here?
    explanation:
      text: |
        Elasticity means capacity follows demand in both directions. The forum shows that the system
        can grow, which is scalability, but it never gave capacity back when demand fell, so it pays
        for servers that sit idle. A good example would add servers at busy times and remove them at
        quiet times.

  - id: q02-recommendation-trial-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "Agility: getting something new takes minutes, not weeks"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, agility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A furniture retailer's marketing team wants to try a new product-recommendation feature.
        Within an hour it has test servers running, it runs the trial for two days, and then it
        deletes everything because the results were poor. Which cloud benefit does this show best?
    choices:
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Durability is about stored data not being lost. Nothing here depends on keeping data.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Global reach is about running close to users in new places. The trial is about trying an
            idea, wherever it runs.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Nothing grew or shrank in response to demand. The team made a decision to try something
            new, then removed it.
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            Correct. Getting new resources in minutes and deleting them cheaply lets the team test an
            idea it couldn't otherwise justify.
    correct_answers: [agility]
    explanation:
      text: |
        Agility is the ability to get new resources, and try new ideas, quickly and cheaply. In the
        cloud the time to get something new drops from weeks to minutes, and a failed experiment can
        be deleted, so it stops costing money. AWS lists this as the advantage "increase speed and
        agility".

  - id: q02-elasticity-not-agility-scenarios
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: Elasticity and agility both sound like "fast"
    task: "1.1"
    level: application
    topics: [cloud-benefits, elasticity, agility]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two scenarios show elasticity rather than agility? (Select TWO.)
    choices:
      - id: flash-sale
        text: A shop's servers double during a flash sale and shrink back after it ends.
        variants:
          - text: A store's servers double for a flash sale, then return to normal afterwards.
          - text: An online shop gets twice the servers during a flash sale and fewer after it.
        explanation:
          text: |
            Correct. The amount of the same capacity rises and falls with demand.
      - id: test-copy
        text: A developer sets up a test copy of the company website in ten minutes.
        variants:
          - text: A developer has a test version of the website running within ten minutes.
          - text: In ten minutes, a developer builds a test copy of the company's site.
        explanation:
          text: |
            Getting something new quickly, driven by a person's decision, is agility.
      - id: payday
        text: A payroll system adds capacity on payday and releases it the next day.
        variants:
          - text: A payroll system grows its capacity on payday and gives it back a day later.
          - text: On payday a payroll system gains capacity, which it returns the next day.
        explanation:
          text: |
            Correct. Capacity follows a predictable rise and fall in demand.
      - id: three-designs
        text: A team tries three sign-up page designs in an afternoon and keeps one.
        variants:
          - text: In one afternoon a team tests three sign-up pages and keeps the best.
          - text: A team trials three sign-up page designs in an afternoon, keeping one.
        explanation:
          text: |
            Trying new ideas quickly and cheaply, then deleting what failed, is agility.
      - id: new-country
        text: A company opens a copy of its site for customers in a new country.
        variants:
          - text: A company starts running its site near customers in another country.
          - text: A firm launches a copy of its website for buyers in a new country.
        explanation:
          text: |
            Running close to users in a new place is global reach, not elasticity.
    correct_answers: [flash-sale, payday]
    hint:
      text: Ask what started each story, a change in demand or a person's idea.
    explanation:
      text: |
        Elasticity and agility both involve speed, but different things happen quickly. Elasticity
        changes the amount of the same thing in response to demand. Agility gets you something new,
        quickly and cheaply, because someone decided to try it.

  - id: q02-pharmacy-two-azs-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "High availability: the system keeps working when a part fails"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A pharmacy chain's prescription system runs copies in two Availability Zones. When one
        Availability Zone loses power, pharmacists keep filling prescriptions without interruption.
        Which cloud benefit does this show best?
    choices:
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            Correct. The system kept working when a part, a whole Availability Zone, failed.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Durability is about stored data not being lost. The point here is that the system kept
            working right now.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Nothing changed in response to demand; a part failed.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Both Availability Zones are in one Region; the point isn't running near users in new
            places.
    correct_answers: [high-availability]
    explanation:
      text: |
        High availability means a system keeps working, with little or no downtime, when some of its
        parts fail. The main way to get it on AWS is to avoid having only one of anything: run copies
        in more than one Availability Zone, so that if one fails, the others keep serving users.

  - id: q02-registration-overload-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "High availability: the system keeps working when a part fails"
    task: "1.1"
    level: application
    topics: [cloud-benefits, high-availability, elasticity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's course-registration site fails each semester on the morning registration
        opens, when thousands of students sign in at once. At all other times it works, and no
        hardware is faulty. Which cloud benefit addresses the cause of the failures most directly?
    choices:
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            No data is being lost. The site fails because demand is above capacity.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            The students are not far away; there are simply too many of them at once.
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            This is the trap. High availability protects against a failed part, and nothing here is
            broken; the site is overloaded.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Correct. Adding capacity when sign-ins surge, and removing it afterwards, fixes an
            overload.
    correct_answers: [elasticity]
    hint:
      text: Is the cause a broken part, or more demand than capacity?
    explanation:
      text: |
        High availability is about failure, not load. A site that fails because too many people use
        it at once needs capacity that grows with demand, which is elasticity. High availability
        would protect the site when a server or a data center fails, a different problem that the
        university may also want to solve.

  - id: q02-four-nines-downtime
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "High availability: the system keeps working when a part fails"
    task: "1.1"
    level: recall
    topics: [high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A system is designed to be available 99.99% of the time ("four nines"). About how much
        downtime does that allow over a year?
    choices:
      - id: three-days
        text: About 3.7 days
        variants:
          - text: Roughly 3.7 days
          - text: Around 3.7 days
        explanation:
          text: |
            About 3.7 days a year is 99% availability, two nines.
      - id: nine-hours
        text: About 8.8 hours
        variants:
          - text: Roughly 8.8 hours
          - text: Around 8.8 hours
        explanation:
          text: |
            About 8.8 hours a year is 99.9%, three nines.
      - id: fifty-three-minutes
        text: About 53 minutes
        variants:
          - text: Roughly 53 minutes
          - text: Around 53 minutes
        explanation:
          text: |
            Correct. 0.01% of a year's 8,760 hours is about 0.88 hours, or about 53 minutes.
      - id: five-minutes
        text: About 5 minutes
        variants:
          - text: Roughly 5 minutes
          - text: Around 5 minutes
        explanation:
          text: |
            About 5 minutes a year is 99.999%, five nines.
    correct_answers: [fifty-three-minutes]
    explanation:
      text: |
        Availability is usually measured as the percentage of time a system is working, and each
        extra nine allows a tenth of the downtime. Over a year of 8,760 hours, 99.9% allows about
        8.8 hours, 99.99% about 53 minutes, and 99.999% about 5 minutes.

  - id: q02-family-records-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "Durability: stored data isn't lost"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, durability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A family-history company stores millions of scanned birth and marriage records. Its main
        concern is that a failed disk or server must never cause a scan to be lost for good. Which
        cloud benefit is it looking for?
    choices:
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Elasticity matches capacity to demand. The concern here is losing stored data.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Correct. Durability means stored data is kept safe from loss, even when disks, servers
            or a data center fail.
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            Agility is about getting something new quickly, not about keeping what is stored.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Global reach is about running near users in many places, not about protecting stored
            records.
    correct_answers: [durability]
    explanation:
      text: |
        Durability is about data, not about the system being up: stored data will still exist later,
        even after hardware fails. Amazon S3 is the classic example; for most of its storage classes
        it keeps copies of data across at least three Availability Zones (as of 2026-10-23).

  - id: q02-reachable-later-unchanged
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: Durability isn't availability
    task: "1.1"
    level: understanding
    topics: [durability, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A storage service is designed so that stored files are almost never lost. During a brief
        outage, a customer can't open one of its files; an hour later the file opens, unchanged.
        Which statement explains this?
    choices:
      - id: durability-failed
        text: The service's durability failed while the file was out of reach.
        variants:
          - text: Durability broke down for the time the file couldn't be opened.
          - text: The file's durability failed during the outage.
        explanation:
          text: |
            Durability failing would mean the file was lost for good. It came back unchanged, so
            nothing was lost.
      - id: durable-means-reachable
        text: Durable storage should keep every file reachable at all times.
        variants:
          - text: A durable service ought to make files reachable at every moment.
          - text: Being durable means a file can be opened at any moment.
        explanation:
          text: |
            Being reachable right now is availability, which durability doesn't promise.
      - id: availability-is-existence
        text: Availability measures whether the file will still exist later.
        variants:
          - text: Availability is about whether the file survives over time.
          - text: Availability tracks whether a file will be kept in the future.
        explanation:
          text: |
            This reverses the two terms: whether data will still exist later is durability.
      - id: different-measures
        text: Durability and availability measure different things.
        variants:
          - text: Durability and availability are separate measures.
          - text: Availability and durability describe different properties.
        explanation:
          text: |
            Correct. The file was never lost (durability), only briefly out of reach
            (availability).
    correct_answers: [different-measures]
    hint:
      text: Separate "will the data still exist later?" from "can I reach it right now?".
    explanation:
      text: |
        Durability answers "will my data still exist later?"; availability answers "can I reach it
        right now?". A service can be extremely durable but briefly unavailable. For example, as of
        2026-10-23, S3 Standard is designed for eleven nines of durability but 99.99% availability.

  - id: q02-users-far-away-benefit
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "Global reach: run close to users anywhere, in minutes"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, global-reach]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A language-learning app runs in a Region in Europe. It gains many new users in Australia, who
        complain that every page is slow to load. The company starts running a copy of the app in a
        Region near Australia. Which cloud benefit does this show best?
    choices:
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Correct. Running a copy close to the new users shortens the distance and lowers their
            latency.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            The problem is distance, not too little capacity. Adding servers in Europe wouldn't
            shorten the trip to Australia.
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            Nothing failed; the pages were slow because the users were far away.
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            The scenario stresses where the app runs, close to users, not how fast something new
            was created.
    correct_answers: [global-reach]
    explanation:
      text: |
        Global reach means running your system in many parts of the world, close to users, so they
        get lower latency. AWS calls this advantage "go global in minutes". When a scenario stresses
        where (closer to users, less delay), the answer is global reach; when it stresses how fast
        something new appeared, it is agility.

  - id: q02-benefits-about-failure
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: All five side by side
    task: "1.1"
    level: understanding
    topics: [cloud-benefits]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two cloud benefits are about coping with failing hardware, rather than about load,
        speed or location? (Select TWO.)
    choices:
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Elasticity is about load: capacity following demand.
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            Correct. The system keeps working when a part fails.
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            Agility is about speed: getting something new quickly.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Global reach is about location: running close to users.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Correct. Stored data survives failed disks, servers or even a data center.
    correct_answers: [high-availability, durability]
    explanation:
      text: |
        Each benefit answers a different question about what changed: capacity (elasticity), time
        (agility), failure (high availability), data (durability) or place (global reach). High
        availability keeps the system working through a failure; durability keeps stored data from
        being lost through one. Both belong to the reliability pillar.

  - id: q02-one-server-one-az-in-cloud
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "In real work: the benefits map to the Well-Architected pillars"
    task: "1.1"
    level: understanding
    topics: [cloud-benefits, high-availability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company moves its website to AWS and runs it on a single server in one Availability Zone.
        Which statement about this website is accurate?
    choices:
      - id: ha-by-default
        text: It is highly available because AWS runs the underlying equipment.
        variants:
          - text: AWS running the equipment makes it highly available.
          - text: It is highly available since AWS operates the hardware it runs on.
        explanation:
          text: |
            AWS provides the Availability Zones, but a single server in one AZ is still a single
            point of failure.
      - id: elastic-by-default
        text: It is elastic because AWS adds servers whenever demand rises.
        variants:
          - text: AWS adds servers for it whenever demand goes up, so it is elastic.
          - text: It is elastic since AWS adds capacity each time demand rises.
        explanation:
          text: |
            AWS doesn't add servers on its own. Elasticity needs the customer to set up something
            like auto scaling.
      - id: must-design
        text: It gains the cloud's benefits only if it is designed to use them.
        variants:
          - text: It gets the cloud's benefits only when designed to use them.
          - text: The cloud's benefits apply to it only if its design uses them.
        explanation:
          text: |
            Correct. AWS provides the AZs, auto scaling and Regions; the customer has to design the
            website to use them, for example by running in more than one AZ.
      - id: global-by-default
        text: It has global reach because AWS has Regions around the world.
        variants:
          - text: AWS's worldwide Regions give it global reach.
          - text: It reaches the world since AWS runs Regions everywhere.
        explanation:
          text: |
            The website runs in one place. Global reach needs copies running in Regions near the
            users.
    correct_answers: [must-design]
    hint:
      text: Who decides how many Availability Zones and servers the website uses?
    explanation:
      text: |
        The cloud's benefits are possibilities, not defaults. AWS provides the Availability Zones,
        auto scaling and Regions, but the customer must design its system to use them. A website on
        one server in one AZ isn't highly available just because it runs in the cloud; Module 04
        explains this split of responsibilities.

  - id: q02-benefits-reliability-pillar
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "In real work: the benefits map to the Well-Architected pillars"
    task: "1.1"
    level: application
    topics: [cloud-benefits, well-architected-pillars]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An insurer's claims app runs in two Availability Zones so that it keeps taking claims if one
        of them goes dark, and it stores scanned claim forms where a failed disk won't lose them. In
        a design review, under which Well-Architected pillar do these two choices mainly belong?
    choices:
      - id: cost-optimization
        text: Cost optimization
        variants:
          - text: The cost optimization pillar
          - text: Cost optimization (COST)
        explanation:
          text: |
            Both choices add resources rather than remove waste. Cost optimization asks whether the
            workload delivers its value at the lowest cost.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Correct. Staying up through a zone failure is high availability, and not losing stored
            forms is durability; both serve reliability.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security (SEC)
        explanation:
          text: |
            Security is about protecting data, systems and accounts from people who shouldn't reach
            them. Neither choice guards against an intruder; both guard against things breaking.
      - id: sustainability
        text: Sustainability
        variants:
          - text: The sustainability pillar
          - text: Sustainability (SUS)
        explanation:
          text: |
            Sustainability is about using as few resources and as little energy as possible. A
            second zone uses more, not fewer.
    correct_answers: [reliability]
    hint:
      text: Both choices protect against the same kind of event. What is it?
    explanation:
      text: |
        Running in two Availability Zones gives high availability, and storage that survives a
        failed disk gives durability. Both belong mainly to the reliability pillar, which asks
        whether a workload does its job correctly whenever it is needed and recovers when something
        fails. Neither benefit is automatic: the app gets them only because it was designed to use
        two zones and durable storage.

  - id: q02-elasticity-statements
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "Elasticity: capacity grows and shrinks with demand"
    task: "1.1"
    level: understanding
    topics: [elasticity]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two statements about elasticity are accurate? (Select TWO.)
    choices:
      - id: shrinks-too
        text: Capacity shrinks when demand falls, as well as growing when it rises.
        variants:
          - text: Capacity goes down with falling demand, not only up with rising demand.
          - text: It removes capacity as demand drops, as well as adding it as demand climbs.
        explanation:
          text: |
            Correct. Following demand in both directions is what makes it elasticity rather than
            just growth.
      - id: manual-by-definition
        text: It means adding capacity by hand, unlike automatic scalability.
        variants:
          - text: It is the manual way to add capacity, while scalability is automatic.
          - text: It is capacity added by hand, as opposed to automatic scalability.
        explanation:
          text: |
            The difference between elasticity and scalability isn't manual versus automatic, and on
            AWS elasticity is usually automatic.
      - id: auto-scaling
        text: On AWS it is usually delivered by auto scaling.
        variants:
          - text: AWS normally provides it through auto scaling.
          - text: On AWS, auto scaling is the usual way to get it.
        explanation:
          text: |
            Correct. Auto scaling watches demand and adds or removes servers by rules you set.
      - id: protects-data
        text: It keeps stored data safe when disks fail.
        variants:
          - text: It protects stored data from failing disks.
          - text: It stops stored data being lost when a disk fails.
        explanation:
          text: |
            Keeping stored data safe from loss is durability.
      - id: tries-ideas
        text: It measures how fast a new idea can be tried.
        variants:
          - text: It is about how quickly a new idea can be tested.
          - text: It describes how soon you can try a new idea.
        explanation:
          text: |
            How fast you can get something new to try an idea is agility.
    correct_answers: [shrinks-too, auto-scaling]
    explanation:
      text: |
        Elasticity means capacity follows demand up and down, so you don't pay for capacity you no
        longer need. On AWS it is usually automatic: auto scaling adds or removes servers by rules
        you set. The CLF-C02 exam guide links elasticity to auto scaling.

  # ---------------------------------------------------------------- 02.04 What a data center really costs

  - id: q02-purchase-price-understates-cost
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: On-premises costs come in seven groups
    task: "1.4"
    level: recall
    topics: [on-premises-costs, tco]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A firm's office manager says its file server "costs $4,000", the price it paid for the
        machine. Which idea explains why that figure understates what the server really costs?
    choices:
      - id: economies-of-scale
        text: Economies of scale
        variants:
          - text: The economies of scale
          - text: Scale economies
        explanation:
          text: |
            Economies of scale are the lower unit cost a very large operation reaches. They don't
            describe the costs a purchase price leaves out.
      - id: variable-expense
        text: Variable expense
        variants:
          - text: A variable expense
          - text: Variable cost
        explanation:
          text: |
            A variable expense rises and falls with use. Most costs of an owned server are fixed.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Elasticity is capacity following demand; it isn't a way of counting costs.
      - id: tco
        text: Total cost of ownership
        variants:
          - text: Total cost of ownership (TCO)
          - text: TCO (total cost of ownership)
        explanation:
          text: |
            Correct. TCO counts every cost over the server's life: space, power, cooling, network,
            staff, licenses and its eventual replacement.
    correct_answers: [tco]
    explanation:
      text: |
        Total cost of ownership is every cost of owning and running something over its whole life,
        not only the purchase price. For a server that includes space, power, cooling, network,
        staff, licenses and the hardware refresh, so its TCO can be far above its price tag.

  - id: q02-on-prem-costs-no-visitors
    revision: 2
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: On-premises costs come in seven groups
    task: "1.4"
    level: understanding
    topics: [on-premises-costs, fixed-expense]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small hotel runs its booking site on servers in its own back office. Then comes a month
        in which the site gets almost no visitors. How do the hotel's costs for running the site
        that month compare with a busy month?
    choices:
      - id: fall-with-visits
        text: Most of them fall roughly in step with the number of visits.
        variants:
          - text: Most of them shrink more or less in line with the visits.
          - text: The bulk of them drop roughly as far as the visits do.
        explanation:
          text: |
            That is how a pay-as-you-go bill behaves. Owned servers, the room, the staff and the
            licenses cost the same whether or not anyone visits.
      - id: staff-licenses-stop
        text: Staff and license costs pause until the visitors come back.
        variants:
          - text: Staff and licenses stop costing money until visits return.
          - text: The staff and license bills stop until the visitors return.
        explanation:
          text: |
            Salaries, contracts and licenses are fixed costs; they are due whether the site is busy
            or idle.
      - id: mostly-unchanged
        text: Nearly all of them stay at about the same level.
        variants:
          - text: Almost all of them remain much the same.
          - text: Nearly every one of them stays about level.
        explanation:
          text: |
            Correct. Space, power, cooling, network, staff and licenses are mostly fixed, so they
            continue in a quiet month much as in a busy one.
      - id: line-falls
        text: They stay level, except the internet line, which falls with traffic.
        variants:
          - text: They hold steady, apart from the internet line, which drops with traffic.
          - text: All stay the same but the internet line, which shrinks with traffic.
        explanation:
          text: |
            The internet line is usually a fixed monthly charge, like the rent and the licenses. It
            is still due when the site has almost no visitors.
    correct_answers: [mostly-unchanged]
    hint:
      text: Which of the hotel's costs depend on the equipment existing, rather than on anyone using it?
    explanation:
      text: |
        On-premises costs come in seven groups: hardware and its refresh, space, power, cooling,
        network, staff and licenses. Almost all of them are fixed or mostly fixed, so the hotel pays
        them in a quiet month much as in a busy one. That is why idle months are expensive
        on-premises, and why a bill that follows use can save money when demand varies.

  - id: q02-hidden-cost-waiting
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: On-premises costs come in seven groups
    task: "1.4"
    level: recall
    topics: [on-premises-costs, agility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which cost of running your own servers never appears on an invoice, but can leave customers
        facing a crashed site while new hardware is on its way?
    choices:
      - id: cooling
        text: Cooling the server room
        variants:
          - text: Air conditioning for the servers
          - text: Keeping the equipment cool
        explanation:
          text: |
            Cooling is billed: it shows up in the electricity bill or an air-conditioning contract.
      - id: waiting
        text: Waiting for new servers to arrive
        variants:
          - text: The wait for new hardware to be delivered
          - text: Time spent waiting on new equipment
        explanation:
          text: |
            Correct. New hardware must be ordered, delivered and installed. No invoice shows that
            time, but customers meet an overloaded site while it passes.
      - id: licenses
        text: Software licenses for each server
        variants:
          - text: Per-server software licenses
          - text: License fees for the servers' software
        explanation:
          text: |
            Licenses are invoiced, often per server or per processor.
      - id: space
        text: Rent for the server room
        variants:
          - text: The server room's rent
          - text: Rent paid for the equipment's space
        explanation:
          text: |
            Rent is paid on an invoice every month.
    correct_answers: [waiting]
    explanation:
      text: |
        Two on-premises costs never appear on an invoice: idle capacity, and waiting. New hardware has
        to be ordered, delivered and installed, while AWS says the cloud cuts the time to get new
        resources from weeks to minutes. While a business waits, its customers meet a site that
        can't keep up.

  - id: q02-rented-space-classification
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Capital or operating, fixed or variable: two different questions"
    task: "1.4"
    level: understanding
    topics: [capex-opex, fixed-vs-variable]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company pays the same rent every month for space in a shared data center, where it keeps
        servers it bought. How is the rent best classified?
    choices:
      - id: capital-fixed
        text: A capital expense that is fixed
        variants:
          - text: Capital, and fixed
          - text: A fixed capital expense
        explanation:
          text: |
            Capital expense is a large up-front payment for something that lasts, such as the servers
            themselves. Rent is paid as you go.
      - id: operating-variable
        text: An operating expense that is variable
        variants:
          - text: Operating, and variable
          - text: A variable operating expense
        explanation:
          text: |
            Rent is an operating expense, but it doesn't change with how much the servers are used.
            Operating doesn't mean variable.
      - id: operating-fixed
        text: An operating expense that is fixed
        variants:
          - text: Operating, and fixed
          - text: A fixed operating expense
        explanation:
          text: |
            Correct. It is paid as you go (operating), and it stays the same however much the
            servers are used (fixed).
      - id: capital-variable
        text: A capital expense that is variable
        variants:
          - text: Capital, and variable
          - text: A variable capital expense
        explanation:
          text: |
            Rent is neither an up-front purchase nor a cost that follows use.
    correct_answers: [operating-fixed]
    hint:
      text: Ask two separate questions. When is it paid? Does it change with use?
    explanation:
      text: |
        Capital or operating asks when and how you pay; fixed or variable asks whether the cost
        changes with use. Rent is an operating expense, because it is paid as you go, yet it is
        fixed, because it is the same however much the servers are used. A pay-as-you-go cloud bill,
        by contrast, is operating and variable.

  - id: q02-two-pairs-of-cost-words
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Capital or operating, fixed or variable: two different questions"
    task: "1.4"
    level: understanding
    topics: [capex-opex, fixed-vs-variable]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A finance student treats "capital versus operating" and "fixed versus variable" as two ways
        of saying the same thing. Which statement corrects this?
    choices:
      - id: monthly-is-variable
        text: Any cost that is paid every month is a variable expense.
        variants:
          - text: A cost paid monthly is always a variable expense.
          - text: Whatever is paid each month counts as variable expense.
        explanation:
          text: |
            Rent and salaries are paid monthly and are fixed. How often you pay doesn't make a cost
            variable.
      - id: different-questions
        text: One pair asks when you pay; the other asks if use drives the cost.
        variants:
          - text: One pair is about timing; the other is about whether use changes it.
          - text: One asks how and when you pay; the other, whether use changes it.
        explanation:
          text: |
            Correct. Capital or operating is about timing; fixed or variable is about whether use
            drives the cost. Rent shows the difference: operating, but fixed.
      - id: capex-equals-fixed
        text: Capital expense and fixed expense are two names for one cost.
        variants:
          - text: A capital expense and a fixed expense are the same cost.
          - text: Capital and fixed expense are different words for one thing.
        explanation:
          text: |
            Rent is fixed but not capital, so the two words can't mean the same thing.
      - id: cloud-makes-fixed
        text: Moving to the cloud turns variable costs into fixed costs.
        variants:
          - text: A move to the cloud makes variable costs fixed.
          - text: Going to the cloud changes variable costs into fixed ones.
        explanation:
          text: |
            This is the reverse: AWS describes the move as trading fixed expense for variable
            expense.
    correct_answers: [different-questions]
    explanation:
      text: |
        The two pairs of words answer different questions, and the exam can use either. Capital or
        operating describes when and how you pay; fixed or variable describes whether the cost
        changes with use. For cost, the move from fixed to variable is the part that matters, because
        it lets the bill follow demand.

  - id: q02-what-makes-cloud-most-expensive
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Worked example: the bakery's three-year comparison"
    task: "1.4"
    level: application
    topics: [cloud-economics, idle-capacity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A seasonal business compares three options over three years: buying enough servers for its
        peak, renting cloud servers matched to each month's demand, and a third cloud plan. Renting
        matched to demand comes out cheapest. Which third plan would most likely cost more than
        buying the servers?
    choices:
      - id: rightsize-idle
        text: Renting matched to demand, and moving a mostly idle server to a smaller size
        variants:
          - text: Renting matched to demand, plus shrinking a mostly idle server
          - text: Matching rentals to demand and downsizing a server that is mostly idle
        explanation:
          text: |
            Rightsizing lowers the bill further; it would make the cloud option cheaper, not dearer.
      - id: peak-all-year
        text: Renting enough servers for the peak and leaving them running all year
        variants:
          - text: Renting peak-sized capacity and keeping it running year-round
          - text: Keeping enough rented servers for the peak running every month
        explanation:
          text: |
            Correct. Without scaling down, the business pays rental prices for idle capacity every
            month, which can cost far more than owning.
      - id: stop-test-nights
        text: Renting matched to demand, with test servers stopped every night
        variants:
          - text: Matching rentals to demand and switching test servers off at night
          - text: Renting to match demand, with test servers turned off overnight
        explanation:
          text: |
            Stopping servers when nobody uses them is automation that lowers the bill further.
      - id: remove-after-peak
        text: Renting extra servers for the peak and removing them right after it
        variants:
          - text: Adding servers for the busy season and deleting them once it ends
          - text: Renting more servers at the peak and releasing them straight after
        explanation:
          text: |
            This is renting matched to demand: capacity follows the curve, so it is cheap.
    correct_answers: [peak-all-year]
    hint:
      text: The cloud's savings come from giving capacity back. Which plan never gives any back?
    explanation:
      text: |
        In the guide's three-year comparison, renting matched to demand was cheapest even at a
        higher price per server-month, because demand swung widely and the business scaled down
        after the peak. Left at peak size all year, the same cloud option cost nearly twice as much
        as owning (made-up teaching numbers). The cloud only saves money if capacity follows demand.

  - id: q02-first-month-difference
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Worked example: the bakery's three-year comparison"
    task: "1.4"
    level: understanding
    topics: [cloud-economics, capex-opex]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A business compares buying six servers with renting cloud servers matched to its demand.
        What is the biggest difference between the two options in the first month?
    choices:
      - id: owning-up-front
        text: Owning needs a large up-front payment, while renting starts small.
        variants:
          - text: Buying means a large payment at the start; renting begins with a small bill.
          - text: Owning takes a big payment up front; the cloud bill starts small.
        explanation:
          text: |
            Correct. The servers' price leaves the bank in month one, while the cloud bill covers
            only what runs that month.
      - id: same-start
        text: Both cost about the same, since spending is spread evenly over time.
        variants:
          - text: The two cost about the same, because spending is spread evenly.
          - text: There is little difference, as both spread spending evenly.
        explanation:
          text: |
            Owning isn't spread evenly: the hardware is paid for in one large payment at the start.
      - id: cloud-big-deposit
        text: Renting needs a large deposit, while buying is paid off monthly.
        variants:
          - text: The cloud needs a big up-front deposit; owned servers are paid monthly.
          - text: Renting starts with a large deposit; buying spreads the cost.
        explanation:
          text: |
            This reverses the two. Pay-as-you-go renting has no up-front purchase; buying servers
            does.
      - id: owning-free-start
        text: Owning costs nothing until the servers start doing work.
        variants:
          - text: Owned servers cost nothing until they are put to work.
          - text: There is no cost to owning until the servers are used.
        explanation:
          text: |
            Owned servers are paid for, and need space and power, whether they work or not.
    correct_answers: [owning-up-front]
    explanation:
      text: |
        Owning puts a large capital payment at the start: in the guide's made-up example, more than
        $12,000 leaves the bank in month one, against a first cloud bill of a few hundred dollars.
        Pay-as-you-go turns that up-front purchase into smaller payments that follow use.

  - id: q02-costs-that-stay-after-move
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Moving to the cloud doesn't automatically lower costs
    task: "1.4"
    level: understanding
    topics: [cloud-economics, on-premises-costs]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company moves its applications from its own data center to AWS. Which two kinds of cost
        stay with the company in some form after the move? (Select TWO.)
    choices:
      - id: provider-cooling
        text: Cooling the provider's data centers
        variants:
          - text: Air conditioning in AWS's data centers
          - text: Keeping the provider's buildings cool
        explanation:
          text: |
            The provider's cooling is part of what the usage bill covers; the company doesn't pay
            for it separately.
      - id: staff-time
        text: Staff time to set up, secure and watch systems
        variants:
          - text: People's time to build, protect and monitor systems
          - text: Staff hours spent setting up, securing and monitoring
        explanation:
          text: |
            Correct. Fewer hours go on hardware, but someone still sets up, secures and watches what
            the company runs.
      - id: provider-refresh
        text: Replacing the provider's worn-out servers
        variants:
          - text: Renewing AWS's aging hardware
          - text: The refresh of the provider's old servers
        explanation:
          text: |
            Hardware refresh moves to the provider, inside the usage bill.
      - id: licenses
        text: Licenses for software the company brings
        variants:
          - text: Licenses the company brings for its software
          - text: Software licenses that the company supplies
        explanation:
          text: |
            Correct. Some software has the license included in the price; for other software the
            company brings licenses it owns.
      - id: provider-rent
        text: Rent for the provider's buildings
        variants:
          - text: Rent on AWS's data center buildings
          - text: The cost of the provider's building space
        explanation:
          text: |
            Space is the provider's cost, covered by the usage bill.
    correct_answers: [staff-time, licenses]
    explanation:
      text: |
        Moving to the cloud puts the provider's hardware, space, power, cooling and network inside
        one usage bill. Some costs stay with the customer in some form: staff time (fewer hours,
        different work), software licenses (included in the price, or brought by the customer) and
        data sent out to the internet.

  - id: q02-flat-load-savings
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Moving to the cloud doesn't automatically lower costs
    task: "1.4"
    level: application
    topics: [cloud-economics, fixed-vs-variable]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A weather-data company processes readings at the same load 24 hours a day, every day of the
        year. Compared with a holiday-gift shop whose demand peaks sharply in December, how much is
        the weather company likely to save by switching from owned servers to paying by use?
    choices:
      - id: more-more-hours
        text: More, because it runs its servers for more hours
        variants:
          - text: More, since its servers run for more hours
          - text: A bigger saving, as it uses more server hours
        explanation:
          text: |
            Running more hours means paying for more hours. Savings come from hours you no longer pay
            for.
      - id: same-for-all
        text: The same, because cloud prices are equal for every customer
        variants:
          - text: The same, since every customer pays equal prices
          - text: An equal saving, as prices are the same for all
        explanation:
          text: |
            Equal prices don't mean equal savings. The saving depends on how much idle capacity each
            business gives back.
      - id: more-scale
        text: More, because a constant load benefits from economies of scale
        variants:
          - text: More, since steady load gains from economies of scale
          - text: A bigger saving, as constant load earns economies of scale
        explanation:
          text: |
            Economies of scale lower AWS's prices for every customer; they don't depend on the
            customer's load pattern.
      - id: less-no-idle
        text: Less, because it has little idle capacity to give back
        variants:
          - text: Less, since it has hardly any idle capacity to remove
          - text: A smaller saving, as little of its capacity sits idle
        explanation:
          text: |
            Correct. Paying by use saves the most when demand varies. With a flat load, the
            weather company's servers are busy all the time.
    correct_answers: [less-no-idle]
    hint:
      text: Paying by use saves money by not paying for capacity that would sit idle. How much does each business have?
    explanation:
      text: |
        A workload that runs flat out every hour gains little from paying by the hour, because it has
        no idle capacity to give back. Whether the cloud saves money depends on how demand moves and
        how well capacity is matched to it. AWS offers lower prices for steady, committed use, which
        Module 11 covers.

  - id: q02-smaller-server-from-data
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Rightsizing and automation keep the variable bill small
    task: "1.4"
    level: application
    topics: [rightsizing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        After a month of measurements, a team finds that its database server never uses more than
        20% of its processing power. It moves the database to a smaller, cheaper server type. What
        is this practice called?
    choices:
      - id: rightsizing
        text: Rightsizing
        variants:
          - text: Rightsizing resources
          - text: Resource rightsizing
        explanation:
          text: |
            Correct. Choosing the type and size that meets the need at the lowest cost, based on
            data, is rightsizing.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Elasticity is capacity following demand up and down over time. This is a one-off change
            of size, chosen from measurements.
      - id: economies-of-scale
        text: Economies of scale
        variants:
          - text: The economies of scale
          - text: Scale economies
        explanation:
          text: |
            Economies of scale are the provider's lower unit costs from size, not a customer's
            choice of server.
      - id: hardware-refresh
        text: Hardware refresh
        variants:
          - text: A hardware refresh
          - text: Refreshing hardware
        explanation:
          text: |
            Hardware refresh is replacing worn-out or outdated equipment, an on-premises cost; here
            the team picks a smaller size because the current one is too big.
    correct_answers: [rightsizing]
    hint:
      text: The decision was about the size of the resource, made from data.
    explanation:
      text: |
        Rightsizing means choosing the type, size and number of resources that meet your needs at
        the lowest cost. AWS's Cost Optimization Pillar treats it as something you repeat, based on
        data, because usage, prices and resource types change. On-premises you buy years ahead and
        guess; in the cloud an oversized server can be swapped for a smaller one.

  - id: q02-dev-test-servers-schedule
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Rightsizing and automation keep the variable bill small
    task: "1.4"
    level: application
    topics: [automation, cost-optimization]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A software company's development and test servers are used only during an eight-hour
        working day, five days a week, but they run around the clock. Which action would cut their
        running hours by about three quarters?
    choices:
      - id: schedule-stop
        text: Stopping them automatically outside working hours
        variants:
          - text: Switching them off on a schedule outside work hours
          - text: Having them stop by themselves when work hours end
        explanation:
          text: |
            Correct. Running 40 of the week's 168 hours instead of all of them cuts running time by
            about 75%.
      - id: larger-type
        text: Moving them to a larger server type
        variants:
          - text: Switching them to bigger servers
          - text: Changing them to a larger size of server
        explanation:
          text: |
            A larger server costs more per hour and doesn't change how many hours they run.
      - id: second-az
        text: Running copies of them in a second Availability Zone
        variants:
          - text: Adding copies of them in another Availability Zone
          - text: Duplicating them in a second Availability Zone
        explanation:
          text: |
            Copies in a second AZ add reliability, and double the hours paid for, which is the wrong
            direction here.
      - id: buy-own
        text: Buying servers for them to run on
        variants:
          - text: Purchasing hardware for them instead
          - text: Moving them onto bought servers
        explanation:
          text: |
            Owned servers are paid for whether they run or not; buying them doesn't reduce what the
            company pays for idle hours.
    correct_answers: [schedule-stop]
    hint:
      text: How many of the week's 168 hours are they actually needed?
    explanation:
      text: |
        Automation lets software do repeated work, such as starting and stopping servers on a
        schedule. The Well-Architected cost design principle "adopt a consumption model" gives this
        example: stopping development and test systems outside an eight-hour, five-day week cuts
        their running time from 168 hours a week to 40, a saving of about 75%.

  - id: q02-rightsizing-repeated-why
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Rightsizing and automation keep the variable bill small
    task: "1.4"
    level: understanding
    topics: [rightsizing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Why does AWS's Cost Optimization Pillar treat rightsizing as something to repeat rather than
        a one-time choice?
    choices:
      - id: things-change
        text: Usage, prices and the resource types on offer change over time.
        variants:
          - text: Over time, use changes, prices drop and new resource types appear.
          - text: How much you use, what it costs and what's available all change.
        explanation:
          text: |
            Correct. When any of these change, the right size changes too, so the choice is worth
            revisiting.
      - id: aws-rule
        text: AWS requires customers to resize their resources each month.
        variants:
          - text: AWS makes customers resize their resources every month.
          - text: A monthly resize is mandatory for all AWS customers.
        explanation:
          text: |
            AWS has no such requirement. Rightsizing is a habit the Framework recommends, not a
            rule.
      - id: auto-shrink
        text: Resources shrink by themselves, so their size drifts over time.
        variants:
          - text: Resources get smaller on their own, so sizes drift.
          - text: Sizes drift over time because resources shrink by themselves.
        explanation:
          text: |
            Resources don't change size on their own; someone or something has to choose a new
            size.
      - id: once-a-year
        text: A resource's size can be changed just once a year.
        variants:
          - text: Each resource can be resized just once a year.
          - text: Size changes are limited to one a year per resource.
        explanation:
          text: |
            There is no yearly limit. In the cloud, an oversized server can be swapped for a smaller
            one when the data shows it.
    correct_answers: [things-change]
    explanation:
      text: |
        Rightsizing means choosing the type, size and number of resources that meet your needs at
        the lowest cost. The Cost Optimization Pillar treats it as a repeated task, based on data,
        because usage changes, prices drop and new resource types appear, so yesterday's right size
        may not be today's.

  # ---------------------------------------------------------------- 02.05 The Well-Architected Framework

  - id: q02-pillar-count
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Six pillars, six questions
    task: "1.2"
    level: recall
    topics: [well-architected-pillars]
