# Module 02, Why organizations use the cloud: exam-style questions and concept cards.
# Written from guide/02-why-the-cloud/. Build fields (page, section, task, level, topics) are
# turned into tags and references by source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------- 02.01 What cloud computing is

  - id: q02-cloud-features-besides-internet
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Three features together make something cloud computing
    task: "1.1"
    level: recall
    topics: [cloud-computing-definition]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A hosting company says its service is cloud computing because customers reach their servers
        over the internet. In AWS's definition, which other two features must the service have?
        (Select TWO.)
    choices:
      - id: fixed-contract
        text: A fixed monthly price agreed for a set term
        variants:
          - text: The same price every month for an agreed contract term
          - text: A set monthly fee locked in for the length of a contract
        explanation:
          text: |
            A fixed price for a fixed term is the opposite of paying as you go: the customer pays the
            same whether the servers are busy or idle.
      - id: on-demand
        text: Resources available within minutes of asking
        variants:
          - text: New resources ready a few minutes after a request
          - text: Resources that arrive minutes after you ask for them
        explanation:
          text: |
            Correct. On demand means there is no order, delivery or installation to wait for: you ask,
            and the resource is ready within minutes.
      - id: dedicated-building
        text: Hardware placed in the customer's own building
        variants:
          - text: Equipment installed on the customer's premises
          - text: Servers kept in a building the customer controls
        explanation:
          text: |
            Equipment in the customer's building is on-premises IT. Cloud resources sit in the
            provider's data centers.
      - id: pay-as-you-go
        text: Charges only for what is used, while it is used
        variants:
          - text: Billing that follows actual use and stops when use stops
          - text: Paying just for the resources used, for as long as they run
        explanation:
          text: |
            Correct. Pay as you go means the bill follows use, and deleting a resource ends its
            charges.
      - id: minimum-term
        text: A minimum commitment of one year per server
        variants:
          - text: At least a one-year commitment for every server
          - text: A one-year minimum term on each server
        explanation:
          text: |
            A minimum term ties the customer to paying whether or not it needs the server, which is
            not pay as you go.
    correct_answers: [on-demand, pay-as-you-go]
    explanation:
      text: |
        AWS defines cloud computing by three features that work together: on demand, over the
        internet, and pay as you go. Reaching a server over the internet isn't enough on its own; a
        server bought up front or rented for a fixed term lacks the other two. The test is whether
        you can get resources when you need them and stop paying when you stop using them.

  - id: q02-missing-feature-annual-billing
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Three features together make something cloud computing
    task: "1.1"
    level: application
    topics: [cloud-computing-definition]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A design agency rents virtual servers from a provider through a website. A new server is
        ready about five minutes after the agency asks for it. However, the agency is billed for a
        full year for every server, even if it deletes the server after a week. Which feature of
        cloud computing does this service lack?
    choices:
      - id: on-demand
        text: On demand
        variants:
          - text: On-demand access
          - text: Resources on demand
        explanation:
          text: |
            The service has this one: a server is ready about five minutes after the request.
      - id: over-the-internet
        text: Over the internet
        variants:
          - text: Access over the internet
          - text: Reached through the internet
        explanation:
          text: |
            The service has this one: the agency requests and reaches its servers through the
            provider's website.
      - id: pay-as-you-go
        text: Pay as you go
        variants:
          - text: Pay-as-you-go pricing
          - text: Paying as you go
        explanation:
          text: |
            Correct. Paying for a full year whatever the use means the bill doesn't follow use, and
            deleting a server doesn't stop its charges.
      - id: hybrid-connection
        text: Hybrid connectivity
        variants:
          - text: A hybrid connection
          - text: Hybrid networking
        explanation:
          text: |
            Hybrid is a deployment model (some parts in the cloud, some not), not one of the three
            features that define cloud computing.
    correct_answers: [pay-as-you-go]
    hint:
      text: Check each of the three defining features against the scenario, one at a time.
    explanation:
      text: |
        Cloud computing needs all three features at once: on demand, over the internet, and pay as
        you go. This service is fast and reached online, but a year's charge for a server deleted
        after a week breaks pay as you go. When a resource is deleted, its charges should stop.

  - id: q02-deleted-resource-charges
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Three features together make something cloud computing
    task: "1.1"
    level: understanding
    topics: [cloud-computing-definition, pay-as-you-go]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team rents a server under AWS's pay-as-you-go pricing, uses it for three days, and then
        deletes it. What happens to the charges for that server?
    choices:
      - id: termination-fee
        text: A fee for ending early replaces the remaining charges.
        variants:
          - text: An early-termination fee is charged instead of the rest.
          - text: The team pays a fee for stopping before the term ends.
        explanation:
          text: |
            AWS's pricing page notes that there are no termination fees for pay-as-you-go use.
      - id: rest-of-month
        text: They continue until the end of the billing month.
        variants:
          - text: The team keeps paying until the month is over.
          - text: Charges run on to the end of that month's bill.
        explanation:
          text: |
            Pay as you go means paying for as long as you use a resource, not for a whole month you
            have committed to.
      - id: charges-stop
        text: They stop, and no fee is charged for ending.
        variants:
          - text: The charges end, with no fee for stopping.
          - text: Billing for it ends, and there is no exit fee.
        explanation:
          text: |
            Correct. The team paid for the three days the server ran; deleting it ended the charges.
      - id: until-hardware-reclaimed
        text: They continue until AWS reuses the hardware.
        variants:
          - text: Billing goes on until the hardware is given to someone else.
          - text: The team pays until AWS reassigns the equipment.
        explanation:
          text: |
            What AWS does with its own hardware afterwards isn't the customer's cost. The customer
            pays only for its own use.
    correct_answers: [charges-stop]
    explanation:
      text: |
        Under pay-as-you-go pricing you pay for what you use, for as long as you use it, and deleting
        a resource stops its charges; AWS notes there are no termination fees. That is why every lab
        in the guide ends by deleting what it created: anything left running keeps costing money.

  - id: q02-on-prem-quiet-months-cost
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Before the cloud, organizations owned and ran their own equipment
    task: "1.1"
    level: understanding
    topics: [on-premises, fixed-expense]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manufacturer runs its website on servers it bought and keeps in its own building. For six
        months, visits to the site fall by half. What happens to the cost of those servers during
        those months?
    choices:
      - id: stays-same
        text: It stays about the same, because the equipment is owned and housed either way.
        variants:
          - text: It barely changes, since the owned equipment still needs space and power.
          - text: It hardly moves, because the company paid for and still houses the servers.
        explanation:
          text: |
            Correct. The servers were paid for up front, and space, power and repairs continue
            whether they are busy or idle.
      - id: halves
        text: It falls by about half, because the servers do half the work.
        variants:
          - text: It drops by roughly half, in line with the work the servers do.
          - text: It shrinks by about half, matching the fall in visits.
        explanation:
          text: |
            Falling with use is how a pay-as-you-go bill behaves, not owned equipment. The servers
            cost the same busy or idle.
      - id: return-servers
        text: It falls, because the company can return its unused servers to the seller within minutes.
        variants:
          - text: It drops, since spare servers can be handed back to the seller in minutes.
          - text: It goes down, because idle servers can be given back for a refund within minutes.
        explanation:
          text: |
            Getting or giving back capacity within minutes is a cloud feature. Owned servers can't be
            returned for a refund when demand drops.
      - id: provider-credits
        text: It falls, because the hardware supplier credits the company for the idle time.
        variants:
          - text: It drops, since the hardware supplier refunds the months of low use.
          - text: It goes down, because the hardware vendor gives credit for idle servers.
        explanation:
          text: |
            Once the company has bought the servers, nobody refunds it for using them less. Idle time
            is the owner's cost.
    correct_answers: [stays-same]
    explanation:
      text: |
        On-premises, an organization buys its servers up front and pays for their space, power,
        cooling and repairs whether they are busy or idle. Its server cost doesn't follow demand.
        That is the problem the cloud's pay-as-you-go model addresses.

  - id: q02-classify-retailer-stock-database
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: The three deployment models are cloud, hybrid and on-premises
    task: "3.1"
    level: application
    topics: [deployment-models]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A retailer runs its online store on AWS. Its stock database stays on servers in its
        warehouse, and the online store reads stock levels from that database. Which deployment
        model is this?
    choices:
      - id: cloud
        text: Cloud deployment
        variants:
          - text: A cloud deployment
          - text: The cloud deployment model
        explanation:
          text: |
            Cloud deployment means every part runs in the cloud. The stock database runs in the
            warehouse.
      - id: on-premises
        text: On-premises deployment
        variants:
          - text: An on-premises deployment
          - text: The on-premises deployment model
        explanation:
          text: |
            On-premises means every part runs in the retailer's own buildings. The online store runs
            on AWS.
      - id: private-cloud
        text: Private cloud deployment
        variants:
          - text: A private cloud deployment
          - text: The private cloud model
        explanation:
          text: |
            In AWS's description, a private cloud is the organization's own equipment run with
            sharing software, which is on-premises. Here part of the system runs at AWS.
      - id: hybrid
        text: Hybrid deployment
        variants:
          - text: A hybrid deployment
          - text: The hybrid deployment model
        explanation:
          text: |
            Correct. Some parts run in the cloud and some on-premises, and data flows between them.
    correct_answers: [hybrid]
    hint:
      text: List the parts, and say where each one runs. Then ask whether they work together.
    explanation:
      text: |
        To classify a setup, ask where each part runs. The online store runs at AWS and the stock
        database in the retailer's warehouse, and the two are connected, so it is a hybrid
        deployment. AWS's three deployment models are cloud, hybrid and on-premises.

  - id: q02-classify-two-cloud-providers
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: "Worked example: classifying three setups"
    task: "3.1"
    level: application
    topics: [deployment-models]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A media company runs its video website on AWS and uses an email service that another cloud
        provider runs. It has no servers of its own. Which deployment model describes the company's
        systems?
    choices:
      - id: hybrid
        text: Hybrid, because it uses two different providers
        variants:
          - text: Hybrid, since two separate providers are involved
          - text: Hybrid, because its systems are split across two providers
        explanation:
          text: |
            This is the common trap. Hybrid means some parts are not in the cloud, usually
            on-premises. Using two cloud providers is still all cloud.
      - id: cloud
        text: Cloud, because every part runs at a cloud provider
        variants:
          - text: Cloud, since all of its parts run at cloud providers
          - text: Cloud, because nothing runs outside a cloud provider
        explanation:
          text: |
            Correct. Every part runs at a provider, so the setup is a cloud deployment, however many
            providers there are.
      - id: on-premises
        text: On-premises, because staff use its systems from the office
        variants:
          - text: On-premises, since staff reach the systems from its offices
          - text: On-premises, because employees work on them at the office
        explanation:
          text: |
            Where people sit when they use a system doesn't decide the model. Only where the parts
            run does, and none of them run in the company's buildings.
      - id: community
        text: Community, because the email service is shared with others
        variants:
          - text: Community, since other customers share the email service
          - text: Community, because many organizations use the same email service
        explanation:
          text: |
            "Community" belongs to a different vocabulary. AWS's deployment models are cloud, hybrid
            and on-premises.
    correct_answers: [cloud]
    hint:
      text: Hybrid needs something that is not in the cloud at all. Is there anything like that here?
    explanation:
      text: |
        Only where the parts run decides the deployment model. Here both the website and the email
        run at cloud providers and nothing runs on the company's own equipment, so it is a cloud
        deployment. Using more than one provider doesn't make a setup hybrid.

  - id: q02-classify-office-servers-remote-staff
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: "Worked example: classifying three setups"
    task: "3.1"
    level: application
    topics: [deployment-models]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A law firm keeps its case files and its billing software on two servers in its own office.
        Its lawyers work from home and reach both systems over the internet. Nothing runs at a cloud
        provider. Which deployment model is this?
    choices:
      - id: cloud
        text: Cloud deployment
        variants:
          - text: A cloud deployment
          - text: The cloud deployment model
        explanation:
          text: |
            Reaching a system over the internet doesn't make it cloud. Every part runs on the firm's
            own servers, not at a provider.
      - id: hybrid
        text: Hybrid deployment
        variants:
          - text: A hybrid deployment
          - text: The hybrid deployment model
        explanation:
          text: |
            Hybrid needs some parts at a cloud provider. Working from home is how people reach the
            system, not a second place where it runs.
      - id: on-premises
        text: On-premises deployment
        variants:
          - text: An on-premises deployment
          - text: The on-premises deployment model
        explanation:
          text: |
            Correct. Both systems run on equipment in the firm's own office.
      - id: community
        text: Community deployment
        variants:
          - text: A community deployment
          - text: The community deployment model
        explanation:
          text: |
            "Community" isn't one of AWS's deployment models, which are cloud, hybrid and
            on-premises.
    correct_answers: [on-premises]
    hint:
      text: The question is where the systems run, not where the people using them sit.
    explanation:
      text: |
        A deployment model describes where a system's parts run. Both of the firm's systems run on
        servers in its own office, so it is on-premises, even though people reach them over the
        internet from home. Laptops and home connections are how people reach a system, not where
        it runs.

  - id: q02-private-cloud-is-on-premises
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: '"Public, private and community" are not AWS''s deployment models'
    task: "3.1"
    level: recall
    topics: [deployment-models, private-cloud]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In AWS's description of deployment models, which model does a "private cloud" belong to?
    choices:
      - id: cloud
        text: The cloud deployment model
        variants:
          - text: Cloud deployment
          - text: The model called cloud
        explanation:
          text: |
            Cloud deployment means every part runs at a cloud provider. A private cloud runs on the
            organization's own equipment.
      - id: hybrid
        text: The hybrid deployment model
        variants:
          - text: Hybrid deployment
          - text: The model called hybrid
        explanation:
          text: |
            Hybrid joins parts at a cloud provider with parts elsewhere. A private cloud on its own
            has nothing at a provider.
      - id: separate-model
        text: A fourth model of its own
        variants:
          - text: A separate, fourth deployment model
          - text: Its own fourth model
        explanation:
          text: |
            AWS names only three deployment models. The "public, private, community, hybrid" list
            comes from a different vocabulary.
      - id: on-premises
        text: The on-premises deployment model
        variants:
          - text: On-premises deployment
          - text: The model called on-premises
        explanation:
          text: |
            Correct. AWS uses "private cloud" for an organization's own equipment, shared out with
            software, which is an on-premises deployment.
    correct_answers: [on-premises]
    explanation:
      text: |
        AWS sometimes calls an on-premises deployment a private cloud when the organization uses
        software to share out its own servers flexibly. It is still the organization's own
        equipment, bought and paid for whether used or not, so it lacks most of the cloud's
        benefits. Building a private cloud is not a move to a cloud provider.

  - id: q02-aws-deployment-model-names
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: The three deployment models are cloud, hybrid and on-premises
    task: "3.1"
    level: recall
    topics: [deployment-models]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A study group is listing the cloud deployment models that AWS and the CLF-C02 exam guide
        use. Which two belong on the list? (Select TWO.)
    choices:
      - id: community
        text: Community
        variants:
          - text: Community deployment
          - text: The community model
        explanation:
          text: |
            "Community" comes from a different vocabulary (public, private, community, hybrid) that
            AWS and the exam guide don't use.
      - id: hybrid
        text: Hybrid
        variants:
          - text: Hybrid deployment
          - text: The hybrid model
        explanation:
          text: |
            Correct. Hybrid is one of AWS's three deployment models: some parts in the cloud, some
            not, connected.
      - id: public
        text: Public
        variants:
          - text: Public deployment
          - text: The public model
        explanation:
          text: |
            "Public" also comes from the other vocabulary. AWS's name for running everything at a
            provider is cloud deployment.
      - id: colocation
        text: Colocation
        variants:
          - text: Colocation deployment
          - text: The colocation model
        explanation:
          text: |
            Colocation means renting space for your own servers in someone else's data center. It
            isn't one of AWS's deployment models.
      - id: on-premises
        text: On-premises
        variants:
          - text: On-premises deployment
          - text: The on-premises model
        explanation:
          text: |
            Correct. On-premises is one of AWS's three deployment models: every part runs in the
            organization's own buildings.
    correct_answers: [hybrid, on-premises]
    explanation:
      text: |
        AWS and the CLF-C02 exam guide name three deployment models: cloud, hybrid and on-premises.
        The list "public, private, community" appears in many courses, but it isn't the vocabulary
        the exam uses. Learn the three AWS names so that the exam's wording looks familiar.

  - id: q02-reason-to-keep-part-on-premises
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Hybrid is often a deliberate choice, not a halfway failure
    task: "3.1"
    level: understanding
    topics: [deployment-models, hybrid]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A hospital moves its patient portal to AWS. The software that drives its blood-test
        analyzers stays on servers in the hospital and passes results to the portal. Which reason
        best explains keeping that software on-premises?
    choices:
      - id: fast-link-to-machines
        text: It needs a very fast, low-delay link to equipment on site.
        variants:
          - text: It must reach nearby equipment with almost no delay.
          - text: It depends on a very quick connection to local devices.
        explanation:
          text: |
            Correct. A need for a very fast connection to equipment in the building is one of the
            common reasons for keeping a system on-premises in a hybrid setup.
      - id: hybrid-required
        text: AWS recommends keeping some of each workload on-premises.
        variants:
          - text: AWS advises leaving part of every workload on-premises.
          - text: AWS guidance says part of each workload should stay on-site.
        explanation:
          text: |
            AWS has no such recommendation. Many organizations run entirely in the cloud; hybrid is
            a choice made for specific reasons.
      - id: faster-to-add
        text: Servers in the hospital can be added faster than cloud servers.
        variants:
          - text: New servers arrive faster on site than in the cloud.
          - text: Owned servers can be set up sooner than cloud ones.
        explanation:
          text: |
            This reverses the comparison: owned servers must be ordered, delivered and installed,
            while cloud resources arrive within minutes.
      - id: cloud-cannot-run
        text: Software that controls equipment can't run on cloud servers.
        variants:
          - text: Cloud servers are unable to run equipment-control software.
          - text: Programs that drive devices can't be run in the cloud.
        explanation:
          text: |
            Nothing stops such software from running in the cloud. The reason to keep it close is
            the delay of the link to the equipment, not what the cloud can run.
    correct_answers: [fast-link-to-machines]
    hint:
      text: Think about what this particular software has to talk to, and where that is.
    explanation:
      text: |
        Hybrid is often a deliberate choice rather than a halfway failure. Common reasons to keep
        some parts on-premises are a need for a very fast link to equipment in the building, data
        that must stay in a particular place, and moving to the cloud in stages. The analyzer
        software fits the first reason.

  - id: q02-saas-web-app-grouping
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: "Going deeper (optional): IaaS, PaaS and SaaS"
    task: "3.1"
    level: application
    topics: [service-models]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A school signs in through a web browser to a document-editing application that the provider
        runs entirely. The school manages only its users and their documents. Which grouping of
        cloud services is this?
    choices:
      - id: iaas
        text: Infrastructure as a service (IaaS)
        variants:
          - text: IaaS (infrastructure as a service)
          - text: The infrastructure-as-a-service grouping
        explanation:
          text: |
            IaaS gives you basic building blocks such as computers and storage, and you manage the
            operating systems and software on them. The school runs no servers at all.
      - id: paas
        text: Platform as a service (PaaS)
        variants:
          - text: PaaS (platform as a service)
          - text: The platform-as-a-service grouping
        explanation:
          text: |
            PaaS gives you a place to run your own application. The school didn't write or upload
            any application; it uses a finished one.
      - id: hybrid
        text: Hybrid deployment
        variants:
          - text: A hybrid deployment
          - text: The hybrid deployment model
        explanation:
          text: |
            Hybrid is a deployment model, which describes where a system runs, not what kind of
            service it is. Nothing here runs on-premises either.
      - id: saas
        text: Software as a service (SaaS)
        variants:
          - text: SaaS (software as a service)
          - text: The software-as-a-service grouping
        explanation:
          text: |
            Correct. A finished application run entirely by the provider, used through a browser, is
            software as a service.
    correct_answers: [saas]
    hint:
      text: Ask how much the provider runs for the school, and how much the school runs itself.
    explanation:
      text: |
        IaaS, PaaS and SaaS sort cloud services by how much the provider runs for you. With SaaS the
        provider runs a finished application, and you manage only how you use it and your data in
        it. These groupings describe the kind of service; the deployment model describes where your
        system runs.

  - id: q02-undifferentiated-heavy-lifting
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: "In real work: the deployment model is a business decision"
    task: "1.1"
    level: understanding
    topics: [design-principles, cost-optimization]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A Well-Architected cost optimization design principle says to stop spending money on
        "undifferentiated heavy lifting". For a small online florist, which task is an example of
        that kind of work?
    choices:
      - id: arranging-bouquets
        text: Designing the seasonal bouquets it sells
        variants:
          - text: Creating the bouquet designs for each season
          - text: Planning the flower arrangements it offers
        explanation:
          text: |
            Bouquet design is what sets the florist apart from competitors: differentiated work, the
            kind it should spend its effort on.
      - id: racking-servers
        text: Installing and cooling the servers its site runs on
        variants:
          - text: Setting up and cooling the servers behind its website
          - text: Racking and cooling the machines that run its site
        explanation:
          text: |
            Correct. Every organization that owns servers does this the same way, and customers
            don't choose a florist for how it cools its servers.
      - id: customer-service
        text: Answering customers' questions about their flower orders
        variants:
          - text: Replying to customer questions about deliveries and orders
          - text: Helping customers who ask about their bouquet orders
        explanation:
          text: |
            Customer service is part of how the florist competes and keeps customers; it isn't
            generic infrastructure work.
      - id: choosing-suppliers
        text: Choosing which flower growers to buy its stock from
        variants:
          - text: Picking the growers that supply its flowers
          - text: Selecting the flower growers it buys from
        explanation:
          text: |
            Choosing suppliers shapes the florist's product and prices; it isn't IT work done the same
            way by everyone.
    correct_answers: [racking-servers]
    hint:
      text: '"Undifferentiated" means it doesn''t set the business apart from its competitors.'
    explanation:
      text: |
        Undifferentiated heavy lifting is work every organization must do the same way and that
        doesn't set it apart, such as buying, racking, powering and cooling servers. The cloud hands
        that work to the provider, so the business can spend its effort on what customers actually
        choose it for. AWS's advantage "stop spending money running and maintaining data centers"
        makes the same point.


  # ---------------------------------------------------------------- 02.02 Before and after: the demand curve

  - id: q02-fixed-servers-two-problems
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Buying for normal months turns customers away at the peak
    task: "1.4"
    level: application
    topics: [demand-curve, idle-capacity, lost-sales]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A concert-ticket website owns four servers. In its quietest month it needs one server; in
        the month when a big tour goes on sale it needs seven. Which two problems does owning a
        fixed four servers cause? (Select TWO.)
    choices:
      - id: idle-quiet-months
        text: Paying for servers that sit idle in quiet months
        variants:
          - text: Owned servers doing no work in the quiet months
          - text: Idle servers that are paid for in quiet months
        explanation:
          text: |
            Correct. In the quietest month three of the four owned servers do nothing, but the site
            has paid for all four.
      - id: rising-bill-busy-month
        text: A server bill that jumps in the busiest month
        variants:
          - text: A bill for servers that rises in the peak month
          - text: Server costs that climb sharply at the peak
        explanation:
          text: |
            Owned servers cost the same every month. A bill that rises with use is a variable
            expense, which is how renting behaves.
      - id: lost-sales-peak
        text: Turning away buyers in the month of the tour sale
        variants:
          - text: Losing ticket sales in the peak month
          - text: Customers who can't buy during the busiest month
        explanation:
          text: |
            Correct. Demand needs seven servers and the site has four, so some buyers can't be served
            and the sales are lost.
      - id: slow-to-remove
        text: Charges that continue after servers are deleted
        variants:
          - text: Paying on for servers that have been removed
          - text: Costs that go on after the servers are gone
        explanation:
          text: |
            Owned servers aren't deleted and billed by use; they are bought. The problem is paying for
            them while they are idle, not after they are gone.
      - id: lost-sales-quiet
        text: Turning away buyers in the quietest month
        variants:
          - text: Losing ticket sales in the quiet months
          - text: Customers who can't buy during the slowest month
        explanation:
          text: |
            In the quietest month demand needs one server and the site has four, so every buyer can
            be served. The shortage is at the peak.
    correct_answers: [idle-quiet-months, lost-sales-peak]
    hint:
      text: Draw the year as a demand curve with a flat line at four servers. Look below the line and above it.
    explanation:
      text: |
        Against a flat line of owned capacity, a demand curve shows two costs. Below the line is
        idle capacity: servers paid for but not used, as in the quiet months. Above the line are lost
        sales: customers the site can't serve, as in the tour month. Any fixed number of servers is a
        guess that is wrong somewhere.

  - id: q02-buy-for-peak-main-cost
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Buying for the peak means paying for idle servers
    task: "1.4"
    level: understanding
    topics: [demand-curve, idle-capacity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A garden center buys enough servers for the single busiest hour of its year, a spring sale
        weekend. What is the main cost of this choice?
    choices:
      - id: lost-sales
        text: Customers turned away during the spring sale
        variants:
          - text: Shoppers who can't order during the spring sale
          - text: Lost orders on the spring sale weekend
        explanation:
          text: |
            Buying for the peak means the spring sale is covered. Lost sales come from buying too
            little, not too much.
      - id: variable-bill
        text: A server bill that swings from month to month
        variants:
          - text: Server costs that rise and fall every month
          - text: A monthly bill for servers that keeps changing
        explanation:
          text: |
            Owned servers are a fixed expense: the cost is the same each month. A swinging bill
            belongs to paying by use.
      - id: idle-capacity
        text: Servers paid for but idle most of the year
        variants:
          - text: Owned servers doing nothing for most of the year
          - text: Paying all year for capacity that is mostly unused
        explanation:
          text: |
            Correct. Outside the spring peak, most of the servers do no work, but they were paid for
            and still need space and power.
      - id: slow-checkout
        text: A slow website for most of the year
        variants:
          - text: Slow pages for customers in ordinary months
          - text: Poor website speed outside the peak
        explanation:
          text: |
            With capacity for the peak, ordinary months have more than enough servers. The site
            isn't short of capacity; it has too much.
    correct_answers: [idle-capacity]
    explanation:
      text: |
        Buying for the peak avoids lost sales, but it leaves most of the capacity idle for the rest
        of the year. Idle servers still cost money: they were paid for up front, and they still need
        space and power. AWS's answer to having to choose a number in advance is the advantage it
        calls "stop guessing capacity".

  - id: q02-idle-server-months-count
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Buying for the peak means paying for idle servers
    task: "1.4"
    level: application
    topics: [demand-curve, idle-capacity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A tutoring company owns 5 servers all year. Adding up each month's need, it uses 35
        server-months of capacity over the year, and it never needs more than 5 servers in any
        month. How many server-months of capacity does it pay for but leave idle?
    choices:
      - id: thirty-five
        text: "35"
        variants:
          - text: Thirty-five
          - text: 35 server-months
        explanation:
          text: |
            35 is the capacity the company uses, not the part it leaves idle.
      - id: twenty-five
        text: "25"
        variants:
          - text: Twenty-five
          - text: 25 server-months
        explanation:
          text: |
            Correct. It owns 5 × 12 = 60 server-months and uses 35, so 60 − 35 = 25 are idle.
      - id: sixty
        text: "60"
        variants:
          - text: Sixty
          - text: 60 server-months
        explanation:
          text: |
            60 is everything the company owns over the year (5 × 12), not the part it leaves idle.
      - id: thirty
        text: "30"
        variants:
          - text: Thirty
          - text: 30 server-months
        explanation:
          text: |
            This subtracts the 5 servers from the 35 server-months used, which mixes servers with
            server-months.
    correct_answers: [twenty-five]
    hint:
      text: First work out how many server-months it owns over twelve months.
    explanation:
      text: |
        A server-month is one server running for one month. Owning 5 servers for 12 months is 60
        server-months; the company uses 35 of them, so the other 25 are idle capacity, paid for but
        doing no work. In the cloud, it would rent only the 35 it uses.

  - id: q02-why-cloud-capacity-follows-demand
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: In the cloud, capacity follows the curve
    task: "1.1"
    level: understanding
    topics: [demand-curve, elasticity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Why can a business that rents servers in the cloud avoid both idle servers and lost sales?
    choices:
      - id: bigger-servers
        text: Each cloud server is large enough to handle any peak on its own.
        variants:
          - text: One cloud server is big enough for any busy period by itself.
          - text: A single cloud server can carry every peak without help.
        explanation:
          text: |
            Cloud servers come in many sizes, and none removes the need to match capacity to demand.
            One large server all year would be idle capacity again.
      - id: add-and-remove
        text: It can add servers within minutes and stop paying when it removes them.
        variants:
          - text: Servers arrive in minutes, and removing them ends their charges.
          - text: It gets servers in minutes and stops paying once it deletes them.
        explanation:
          text: |
            Correct. On demand lets capacity rise when demand does; pay as you go means removing
            capacity also removes its cost.
      - id: fixed-price
        text: The provider charges one fixed price whatever the business uses.
        variants:
          - text: The provider bills a single flat price regardless of use.
          - text: One set price covers all use, whatever the amount.
        explanation:
          text: |
            A fixed price whatever the use is a fixed expense; idle capacity would still be paid
            for.
      - id: scale-free-idle
        text: Economies of scale make idle cloud servers free of charge.
        variants:
          - text: Thanks to economies of scale, unused cloud servers cost nothing.
          - text: The provider's scale means idle servers aren't charged for.
        explanation:
          text: |
            Economies of scale lower the price per unit, but a server left running is charged
            whether or not it does any work.
    correct_answers: [add-and-remove]
    explanation:
      text: |
        In the cloud, capacity follows the demand curve instead of sitting at one fixed level.
        Because resources are on demand, servers can be added within minutes when demand rises;
        because they are pay as you go, removing them stops their charges. Lesson 02.03 names this
        ability elasticity.

  - id: q02-example-fixed-to-variable
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Fixed expense becomes variable expense, which isn't the same as cheaper
    task: "1.4"
    level: application
    topics: [fixed-vs-variable]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which change is an example of trading fixed expense for variable expense?
    choices:
      - id: three-year-contract
        text: Signing a three-year hosting contract at the same price each month
        variants:
          - text: Agreeing to a three-year hosting deal with a flat monthly price
          - text: Taking a three-year hosting contract with one monthly rate
        explanation:
          text: |
            The same price every month, whatever the use, is still a fixed expense, even though it
            is paid monthly.
      - id: payment-plan
        text: Buying servers on a payment plan spread over three years
        variants:
          - text: Paying for bought servers in installments over three years
          - text: Purchasing servers with payments split across three years
        explanation:
          text: |
            Spreading the payments doesn't change what is bought: a fixed amount of capacity, paid
            for whether used or not.
      - id: extra-for-growth
        text: Buying extra servers now to cover the next year's growth
        variants:
          - text: Purchasing spare servers today for next year's growth
          - text: Adding owned servers in advance of expected growth
        explanation:
          text: |
            Buying ahead for a guess is the fixed-expense habit the cloud replaces, and it adds idle
            capacity now.
      - id: pay-per-hour
        text: Paying each month only for the server hours that were used
        variants:
          - text: Being billed monthly for just the server hours actually run
          - text: Paying monthly for the server hours used, and no others
        explanation:
          text: |
            Correct. The amount now rises and falls with use, which is what variable expense means.
    correct_answers: [pay-per-hour]
    hint:
      text: A variable expense changes with how much you use. Which bill would change if use fell?
    explanation:
      text: |
        AWS's first advantage of cloud computing is to trade fixed expense for variable expense:
        instead of paying in advance for capacity you may not use, you pay as you use resources, for
        how much you use. A cost is variable only if the amount follows use; paying monthly is not
        enough on its own.

  - id: q02-cloud-cuts-operating-costs-claim
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: The cloud doesn't always cut operating costs
    task: "1.4"
    level: understanding
    topics: [fixed-vs-variable, cloud-economics-misconceptions]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager says, "Once we move to the cloud, our operating costs will certainly go down."
        Which response is most accurate?
    choices:
      - id: wrong-moves-to-capital
        text: She is wrong; the cloud moves server spending into the capital budget.
        variants:
          - text: That's wrong; cloud spending counts as capital, not operating, cost.
          - text: She is mistaken; the cloud turns server costs into capital expense.
        explanation:
          text: |
            This reverses the change. Paying as you go turns an up-front capital purchase into a
            running operating cost, not the other way round.
      - id: running-bills-can-rise
        text: Not necessarily; running bills often rise, and the total depends on use.
        variants:
          - text: She may be wrong; monthly bills often go up, and the total depends on use.
          - text: Not always; operating bills often grow, and the total depends on use.
        explanation:
          text: |
            Correct. Purchases become monthly costs, so operating bills can rise even when the total
            falls. The total depends on how demand varies and whether capacity is removed.
      - id: stay-flat
        text: She is overstating it; operating costs usually stay flat, and capital costs fall.
        variants:
          - text: Not quite; running costs tend to hold steady while capital spending drops.
          - text: She goes too far; operating bills mostly stay level, and capital costs drop.
        explanation:
          text: |
            The capital part is right, since there is less to buy up front, but operating costs
            don't stay flat: the purchases turn into monthly bills, so operating costs often rise.
      - id: mostly-right-first-year
        text: She is mostly right; operating costs usually fall within the first year.
        variants:
          - text: That's largely right; running costs tend to drop in the first year.
          - text: She is broadly correct; operating bills generally shrink in year one.
        explanation:
          text: |
            The hedge sounds careful, but the direction is wrong. Purchases become monthly bills, so
            operating costs usually go up after a move, even when the total falls.
    correct_answers: [running-bills-can-rise]
    explanation:
      text: |
        What the cloud changes for certain is the kind of cost: an up-front purchase becomes a
        running bill, so operating costs often go up. Whether the total cost falls depends on how
        much demand varies and on whether the organization removes capacity it doesn't need. The
        cloud allows you to pay for what you use; it doesn't make you.

  - id: q02-when-paying-by-use-saves-most
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Fixed expense becomes variable expense, which isn't the same as cheaper
    task: "1.4"
    level: understanding
    topics: [fixed-vs-variable]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company is deciding whether paying by use would cut its server costs. Which two conditions
        make the biggest saving likely? (Select TWO.)
    choices:
      - id: demand-varies
        text: Its demand rises and falls a lot over the year.
        variants:
          - text: Its demand swings widely during the year.
          - text: Its demand goes up and down sharply across the year.
        explanation:
          text: |
            Correct. When demand varies, owned capacity sits idle much of the time, so paying only
            for use has the most waste to remove.
      - id: demand-flat
        text: Its demand is flat, hour after hour, through the year.
        variants:
          - text: Its demand is steady around the clock, all year.
          - text: Its demand never changes from hour to hour.
        explanation:
          text: |
            With flat demand there is little idle capacity to give back, so paying by use saves
            little; owning can even cost less.
      - id: removes-capacity
        text: Its team removes capacity when demand falls.
        variants:
          - text: Its team scales capacity down as demand drops.
          - text: Its team gives back capacity it no longer needs.
        explanation:
          text: |
            Correct. The saving comes only if capacity actually goes down with demand.
      - id: keeps-peak
        text: Its team keeps peak capacity running year-round.
        variants:
          - text: Its team leaves peak-sized capacity on all year.
          - text: Its team runs its busiest-month capacity in every month.
        explanation:
          text: |
            Renting the peak all year turns idle equipment into idle rent and can cost more than
            owning.
      - id: new-servers
        text: It bought new servers for its data center last month.
        variants:
          - text: It has just bought new servers for its data center.
          - text: Its data center got new servers a month ago.
        explanation:
          text: |
            Servers already paid for argue for waiting, not for a quick saving from moving.
    correct_answers: [demand-varies, removes-capacity]
    explanation:
      text: |
        Variable expense saves money when use varies and the organization actually reduces capacity
        when demand falls. Both conditions matter: varying demand creates the idle capacity to remove,
        and scaling down removes it. With flat demand or peak capacity left running, the saving
        shrinks or turns into a loss.

  - id: q02-economies-of-scale-scenario
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: "Economies of scale: a very large provider can charge less per unit"
    task: "1.4"
    level: application
    topics: [economies-of-scale, six-advantages]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small analytics startup finds that AWS's pay-as-you-go price for each unit of storage is
        lower than what it could achieve buying and running a few disks itself. Which of AWS's six
        advantages of cloud computing explains this?
    choices:
      - id: economies-of-scale
        text: Benefit from massive economies of scale
        variants:
          - text: 'The "benefit from massive economies of scale" advantage'
          - text: 'The advantage "benefit from massive economies of scale"'
        explanation:
          text: |
            Correct. AWS combines the use of a very large number of customers, buys and runs
            equipment in bulk, and passes that on as lower pay-as-you-go prices.
      - id: stop-guessing
        text: Stop guessing capacity
        variants:
          - text: 'The "stop guessing capacity" advantage'
          - text: 'The advantage "stop guessing capacity"'
        explanation:
          text: |
            This advantage removes the need to choose a fixed amount of capacity in advance; it
            doesn't explain a lower price per unit.
      - id: go-global
        text: Go global in minutes
        variants:
          - text: 'The "go global in minutes" advantage'
          - text: 'The advantage "go global in minutes"'
        explanation:
          text: |
            Going global is about running near users in other parts of the world, not about the
            price of storage.
      - id: speed-agility
        text: Increase speed and agility
        variants:
          - text: 'The "increase speed and agility" advantage'
          - text: 'The advantage "increase speed and agility"'
        explanation:
          text: |
            Speed and agility are about how fast you get new resources, not about how much each unit
            costs.
    correct_answers: [economies-of-scale]
    hint:
      text: Which advantage depends on the provider's size rather than on how you use it?
    explanation:
      text: |
        Economies of scale are the lower cost per unit that a very large operation reaches by
        buying, building and running in bulk. AWS combines the usage of a very large number of
        customers, which it says leads to lower pay-as-you-go prices. A single small company can't
        reach that scale on its own.

  - id: q02-economies-of-scale-what-changes
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: "Economies of scale: a very large provider can charge less per unit"
    task: "1.4"
    level: understanding
    topics: [economies-of-scale, demand-curve]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        On a chart of a company's demand for servers over a year, what do the provider's economies
        of scale change?
    choices:
      - id: price-per-unit
        text: How much each unit of capacity costs
        variants:
          - text: The price of every unit of capacity
          - text: What each unit of capacity costs
        explanation:
          text: |
            Correct. Economies of scale lower the price per unit: how much each column on the chart
            costs.
      - id: shape-of-curve
        text: How much the company's demand rises and falls
        variants:
          - text: How far the company's demand moves up and down
          - text: The size of the company's swings in demand
        explanation:
          text: |
            The shape of demand comes from the company's customers. The provider's size doesn't
            change it.
      - id: amount-needed
        text: How many servers the company needs at its peak
        variants:
          - text: The number of servers needed at the busiest time
          - text: The count of servers the peak requires
        explanation:
          text: |
            The peak need depends on the company's demand, not on how big the provider is.
      - id: idle-line
        text: Where the flat line of owned servers sits
        variants:
          - text: The level of the flat owned-capacity line
          - text: The height of the owned-servers line
        explanation:
          text: |
            The flat line is the capacity the company chose to buy. The provider's economies of
            scale have nothing to do with it.
    correct_answers: [price-per-unit]
    explanation:
      text: |
        Economies of scale affect the price of each unit of capacity, not the shape of the demand
        curve. That is why following the curve saves money even before economies of scale: renting
        only what each month needs removes idle capacity, and a lower unit price is a separate,
        additional saving.

