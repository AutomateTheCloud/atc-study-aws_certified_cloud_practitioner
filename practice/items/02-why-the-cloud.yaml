      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence (OPS)
        explanation:
          text: |
            Correct. Like security, operational excellence is generally not traded away.
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency (PERF)
        explanation:
          text: |
            Performance efficiency can be weighed against cost and the other pillars to fit the
            business's needs.
    correct_answers: [security, operational-excellence]
    explanation:
      text: |
        You can't maximize all six pillars at once, and the Framework expects you to weigh them
        against what the business needs: for example, lower reliability in a development
        environment, or more reliability, at a higher cost, where the business depends on the
        system. It also says security and operational excellence are generally not traded against
        the other pillars.

  - id: q02-acceptable-trade-off
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The pillars can be traded against each other, but not all of them
    task: "1.2"
    level: application
    topics: [trade-offs]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup's architects list four proposed trade-offs. Which one fits the Well-Architected
        Framework's guidance on trade-offs?
    choices:
      - id: weaker-access-test
        text: Weaker sign-in protection on the test system, to save staff time
        variants:
          - text: Looser sign-in controls on the test system, to save staff time
          - text: Less sign-in protection for the test system, to save effort
        explanation:
          text: |
            Security is generally not traded away, and a break-in on a test system can reach the rest
            of the account.
      - id: no-logging-live
        text: No error logs or monitoring on the live system, to save money
        variants:
          - text: Dropping error logs and monitoring on the live system, to cut cost
          - text: Turning off monitoring and logs on the live system, to save money
        explanation:
          text: |
            Seeing what a workload is doing is operational excellence, which is generally not traded
            away either.
      - id: less-reliable-test
        text: Lower reliability for an internal test system, to save money
        variants:
          - text: Less reliability for an internal test system, to cut cost
          - text: Accepting a less reliable internal test system, to save money
        explanation:
          text: |
            Correct. Accepting lower reliability where little is at stake, in exchange for lower
            cost, is the kind of trade the Framework itself describes.
      - id: no-encryption-speed
        text: Unencrypted customer data on the live system, for extra speed
        variants:
          - text: Leaving customer data unencrypted on the live system, for speed
          - text: Dropping encryption of customer data on the live system, for speed
        explanation:
          text: |
            This trades security for performance, and security is generally held whatever else
            changes.
    correct_answers: [less-reliable-test]
    hint:
      text: Two pillars are generally held on every system. Which proposal touches neither of them?
    explanation:
      text: |
        The Framework expects trade-offs based on business needs, and its own example is accepting
        lower reliability in a development or test environment. It also says security and
        operational excellence are generally not traded against the other pillars, so the
        acceptable trade bends reliability toward cost, not security or visibility.

  - id: q02-cost-vs-sustainability-difference
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Pillars that sound alike, side by side
    task: "1.2"
    level: recall
    topics: [well-architected-pillars, cost-optimization, sustainability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The cost optimization and sustainability pillars usually point the same way. What is the
        main difference between them?
    choices:
      - id: reversed
        text: Cost optimization measures energy; sustainability measures money.
        variants:
          - text: Cost optimization tracks energy, and sustainability tracks money.
          - text: Energy is cost optimization's measure; money is sustainability's.
        explanation:
          text: |
            This swaps the two. Cost optimization measures money.
      - id: what-they-measure
        text: Cost optimization measures money; sustainability measures resources and energy.
        variants:
          - text: Cost optimization tracks money, and sustainability tracks resources and energy.
          - text: Money is cost optimization's measure; resources and energy are sustainability's.
        explanation:
          text: |
            Correct. Waste usually costs money and energy at once, which is why they agree so often,
            but they measure different things.
      - id: on-prem-only
        text: Sustainability applies only on-premises; cost optimization only in the cloud.
        variants:
          - text: Sustainability is for on-premises systems; cost optimization is for the cloud.
          - text: Only on-premises systems need sustainability; only cloud ones need cost work.
        explanation:
          text: |
            Both pillars apply to every workload, wherever it runs.
      - id: part-of-cost
        text: Sustainability is a part of the cost pillar, not a pillar of its own.
        variants:
          - text: Sustainability sits inside the cost pillar rather than being separate.
          - text: Sustainability belongs within cost optimization, not as its own pillar.
        explanation:
          text: |
            Sustainability is its own pillar, the sixth. Treating it as part of another is the
            "five pillars" mistake.
    correct_answers: [what-they-measure]
    explanation:
      text: |
        Unused resources waste money and energy at once, so cost optimization and sustainability
        usually agree. The Framework's sustainability example is that two hosts each running at 30%
        are less efficient than one host at 60%. The difference is what each pillar measures: money,
        or resources and energy.

  - id: q02-failure-rehearsal-principle
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Real design principles, and slogans that only sound like them
    task: "1.2"
    level: application
    topics: [design-principles]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Once a quarter, a team rehearses a simulated failure of its main database to see how the
        system and the on-call staff respond. Which general design principle of the Well-Architected
        Framework is it following?
    choices:
      - id: production-scale
        text: Test systems at production scale
        variants:
          - text: 'The "test systems at production scale" principle'
          - text: 'The principle "test systems at production scale"'
        explanation:
          text: |
            This principle is about building a full-size copy for testing and removing it after. The
            team is rehearsing a failure, not building a test copy.
      - id: evolutionary
        text: Consider evolutionary architectures
        variants:
          - text: 'The "consider evolutionary architectures" principle'
          - text: 'The principle "consider evolutionary architectures"'
        explanation:
          text: |
            Evolutionary architectures are about expecting the design to change over time.
      - id: game-days
        text: Improve through game days
        variants:
          - text: 'The "improve through game days" principle'
          - text: 'The principle "improve through game days"'
        explanation:
          text: |
            Correct. Game days are practice runs that rehearse failures and busy days.
      - id: data-driven
        text: Drive architectures using data
        variants:
          - text: 'The "drive architectures using data" principle'
          - text: 'The principle "drive architectures using data"'
        explanation:
          text: |
            This principle is about deciding from measurements rather than opinions; it doesn't
            describe rehearsing failures.
    correct_answers: [game-days]
    hint:
      text: The team is practicing a bad day before it happens.
    explanation:
      text: |
        The Framework's six general design principles are: stop guessing your capacity needs; test
        systems at production scale; automate with architectural experimentation in mind; consider
        evolutionary architectures; drive architectures using data; and improve through game days.
        Rehearsing failures and busy days in practice runs is "improve through game days".

  - id: q02-general-principles-select-two
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Real design principles, and slogans that only sound like them
    task: "1.2"
    level: recall
    topics: [design-principles, wa-misconceptions]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A wiki page headed "Well-Architected general design principles" has picked up pillar-level
        principles and slogans from old study notes. An editor keeps only the entries that are
        general design principles. Which two entries stay? (Select TWO.)
    choices:
      - id: scale-horizontally
        text: Scale horizontally to increase aggregate workload availability
        variants:
          - text: 'The entry "Scale horizontally to increase aggregate workload availability"'
          - text: 'The line "Scale horizontally to increase aggregate workload availability"'
        explanation:
          text: |
            This is real Framework wording, but it is a design principle of the reliability pillar,
            not one of the six general design principles.
      - id: stop-guessing
        text: Stop guessing your capacity needs
        variants:
          - text: 'The entry "Stop guessing your capacity needs"'
          - text: 'The line "Stop guessing your capacity needs"'
        explanation:
          text: |
            Correct. Use as much capacity as you need and scale with demand, instead of buying for a
            guess.
      - id: consumption-model
        text: Adopt a consumption model
        variants:
          - text: 'The entry "Adopt a consumption model"'
          - text: 'The line "Adopt a consumption model"'
        explanation:
          text: |
            This is real Framework wording, but it is a design principle of the cost optimization
            pillar, not one of the six general design principles.
      - id: design-for-failure
        text: Design for failure
        variants:
          - text: 'The entry "Design for failure"'
          - text: 'The line "Design for failure"'
        explanation:
          text: |
            A slogan from older material, not a principle in the current Framework. The idea appears
            in the reliability pillar's "test recovery procedures".
      - id: automate-experimentation
        text: Automate with architectural experimentation in mind
        variants:
          - text: 'The entry "Automate with architectural experimentation in mind"'
          - text: 'The line "Automate with architectural experimentation in mind"'
        explanation:
          text: |
            Correct. Automated builds make it cheap to try a change and undo it.
    correct_answers: [stop-guessing, automate-experimentation]
    explanation:
      text: |
        The six general design principles are: stop guessing your capacity needs; test systems at
        production scale; automate with architectural experimentation in mind; consider
        evolutionary architectures; drive architectures using data; and improve through game days.
        Each pillar has its own design principles as well, such as the cost optimization pillar's
        "adopt a consumption model". Slogans such as "design for failure" aren't
        principles in the current Framework.

  - id: q02-describe-wa-tool
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The Framework is guidance; the Well-Architected Tool applies it
    task: "1.2"
    level: recall
    topics: [well-architected-tool]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement describes the AWS Well-Architected Tool?
    choices:
      - id: whitepapers
        text: The set of AWS whitepapers that lays out the six pillars and their best practices
        variants:
          - text: AWS's whitepapers that set out the six pillars and their best practices
          - text: The AWS documents that describe the six pillars and their best practices
        explanation:
          text: |
            That is the Well-Architected Framework: guidance you read. The Tool is where you apply it
            to one workload.
      - id: workload-review
        text: A console service that reviews one workload against the Framework's questions
        variants:
          - text: A service in the console for reviewing a workload against the Framework
          - text: A console service where you check one workload against the Framework
        explanation:
          text: |
            Correct. You define a workload, answer the Framework's questions about it, and get high
            and medium risks and an improvement plan, with milestones to track progress.
      - id: account-checks
        text: A service that runs automatic checks on an account, grouped into categories
        variants:
          - text: A service that checks an account automatically, by category
          - text: A service running automatic account checks, organized into categories
        explanation:
          text: |
            That describes AWS Trusted Advisor, a different service whose categories are not the
            Framework's pillars.
      - id: certification-audit
        text: An audit by AWS that certifies a workload as well architected
        variants:
          - text: An AWS audit that certifies a workload as well architected
          - text: An audit in which AWS certifies a workload's architecture
        explanation:
          text: |
            A review is a conversation about decisions, not an audit, and nobody passes, fails or
            gets certified.
    correct_answers: [workload-review]
    explanation:
      text: |
        The Framework is guidance: a set of AWS whitepapers. The Well-Architected Tool is a service
        in the AWS console that applies it: you define a workload, answer the Framework's questions,
        and get a list of high and medium risks and an improvement plan. It also lets you apply
        lenses and save milestones.

  - id: q02-review-pass-or-fail
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The Framework is guidance; the Well-Architected Tool applies it
    task: "1.2"
    level: understanding
    topics: [well-architected-tool]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager worries that her team's workload will "fail" its first Well-Architected review.
        What should she be told?
    choices:
      - id: blocks-workload
        text: A failed review stops the workload from running on AWS.
        variants:
          - text: Failing the review prevents the workload from running on AWS.
          - text: If the review fails, AWS stops the workload from running.
        explanation:
          text: |
            A review has no such effect. It produces a list of risks, not a decision about whether a
            workload may run.
      - id: certifies
        text: AWS certifies the workloads that pass the review.
        variants:
          - text: Workloads that pass the review get an AWS certificate.
          - text: Passing the review earns the workload AWS certification.
        explanation:
          text: |
            There is no pass mark and no certificate. A review finds risks for the team to work
            on.
      - id: auditors
        text: AWS auditors will run the review and grade the team.
        variants:
          - text: The review is run by AWS auditors who grade the team.
          - text: AWS auditors carry out the review and score the team.
        explanation:
          text: |
            A review isn't an audit and nobody is graded; you can run one yourself in the
            Well-Architected Tool.
      - id: no-pass-fail
        text: A review finds risks to prioritize; nobody passes or fails.
        variants:
          - text: Nobody passes or fails; the review finds risks to work on.
          - text: The review lists risks to prioritize, with no pass or fail.
        explanation:
          text: |
            Correct. AWS describes a review as a conversation about architecture decisions, not an
            audit.
    correct_answers: [no-pass-fail]
    explanation:
      text: |
        AWS describes a Well-Architected review as a conversation about architecture decisions, not
        an audit. Nobody passes or fails: the review finds risks, and the team decides which to fix
        first. A good review ends with a short list of high risks, each with an owner, not a score.

  # ---------------------------------------------------------------- 02.06 Lab 01

  - id: q02-lab-bucket-minutes-benefit
    page: guide/02-why-the-cloud/06-lab-01-first-resource.md
    section: Recap
    task: "1.1"
    level: understanding
    topics: [agility, cloud-benefits]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A learner times how long it takes to create a new, private storage bucket in AWS: about three
        minutes, most of it spent reading. Buying a physical server would mean choosing it, ordering
        it, waiting for delivery and installing it. Which cloud benefit does the difference show?
    choices:
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Nothing grew or shrank in response to demand. The learner got something new, quickly.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            The bucket is storage, but the lab measures how fast it arrived, not whether stored data
            is kept safe. It stored nothing at all.
      - id: agility
        text: Agility
        variants:
          - text: Business agility
          - text: Speed and agility
        explanation:
          text: |
            Correct. The time to get a new resource falls from days or weeks to minutes, so trying
            something new is quick and cheap.
      - id: economies-of-scale
        text: Economies of scale
        variants:
          - text: The economies of scale
          - text: Scale economies
        explanation:
          text: |
            Economies of scale lower the price per unit. The lab measures time, not price.
    correct_answers: [agility]
    explanation:
      text: |
        Agility is the ability to get new resources, and try new ideas, quickly and cheaply. AWS says
        the cloud cuts the time to get new resources from weeks to minutes; Lab 01 lets you measure
        it. For a business, that means it can try an idea this week and delete what it built if the
        idea fails.

  - id: q02-lab-habits-stop-costs
    page: guide/02-why-the-cloud/06-lab-01-first-resource.md
    section: Clean up
    task: "1.1"
    level: application
    topics: [pay-as-you-go, cost-optimization]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A learner finishes a lab and wants to be sure nothing she created keeps costing money. Which
        two habits from Lab 01 help most? (Select TWO.)
    choices:
      - id: stop-and-keep
        text: Stop the resources and keep them for the next lab
        variants:
          - text: Stop what she created and leave it for next time
          - text: Pause the resources and keep them for later labs
        explanation:
          text: |
            A stopped resource still exists, and some resources keep charging while they exist. The
            habit is to delete, not just stop.
      - id: tag-and-find
        text: Tag every resource so it can be found in all Regions
        variants:
          - text: Tag what she creates so she can find it in every Region
          - text: Label each resource with tags to find it across Regions
        explanation:
          text: |
            Correct. Tags let a tool such as Tag Editor find everything a lab created, across all
            Regions, so nothing is forgotten.
      - id: use-root
        text: Do the lab as the root user so everything is in one place
        variants:
          - text: Sign in as the root user so all resources sit together
          - text: Work as the root user to keep every resource in one place
        explanation:
          text: |
            Labs use an IAM admin user, never the root user. Which user signs in doesn't decide what
            keeps costing money.
      - id: delete-and-confirm
        text: Delete the resources and confirm that they are gone
        variants:
          - text: Delete what she created and check that it has gone
          - text: Remove the resources and verify that none remain
        explanation:
          text: |
            Correct. Under pay as you go, deleting a resource stops its charges; checking afterwards
            catches anything missed.
      - id: open-public-access
        text: Turn off Block Public Access so cleanup is easier
        variants:
          - text: Switch off Block Public Access to make cleanup simpler
          - text: Disable Block Public Access so deletion goes smoothly
        explanation:
          text: |
            Turning off Block Public Access weakens security and has nothing to do with cost. The lab
            says never to turn it off to get past an error.
    correct_answers: [tag-and-find, delete-and-confirm]
    hint:
      text: Under pay as you go, what has to happen to a resource for its charges to stop, and how do you make sure you didn't miss one?
    explanation:
      text: |
        Under pay as you go, you stop paying for a resource when you delete it, so a forgotten
        resource keeps costing money. Tagging what you create lets you find it later in every Region,
        and deleting it, then confirming it is gone, ends its charges. These are the cost
        optimization best practices of adding organization information to resources and
        decommissioning what you no longer need.

  # ---------------------------------------------------------------- 02.07 Simulation S1

  - id: q02-sim-matched-renting-cost
    page: guide/02-why-the-cloud/07-sim-demand-curve.md
    section: "Decision 2: finish the comparison"
    task: "1.4"
    level: application
    topics: [cloud-economics, demand-curve]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In a cost simulation, renting a server costs $250 per server-month (made-up price), and a
        bakery's demand adds up to 25 server-months over the year. Peak demand is 6 servers, in
        December. What does renting exactly what each month needs cost for the year?
    choices:
      - id: three-thousand-seven-fifty
        text: "$3,750"
        variants:
          - text: "$3,750 a year"
          - text: "3,750 dollars"
        explanation:
          text: |
            That is 25 server-months at $150, the owned price, not the $250 rental price.
      - id: eighteen-thousand
        text: "$18,000"
        variants:
          - text: "$18,000 a year"
          - text: "18,000 dollars"
        explanation:
          text: |
            That is 6 servers for all 12 months (72 server-months) at $250: the cost of leaving peak
            capacity running all year.
      - id: ten-thousand-eight-hundred
        text: "$10,800"
        variants:
          - text: "$10,800 a year"
          - text: "10,800 dollars"
        explanation:
          text: |
            That is 6 servers for 12 months at $150, the cost of owning enough for the peak.
      - id: six-thousand-two-fifty
        text: "$6,250"
        variants:
          - text: "$6,250 a year"
          - text: "6,250 dollars"
        explanation:
          text: |
            Correct. 25 server-months × $250 = $6,250, with no idle capacity and no lost orders.
    correct_answers: [six-thousand-two-fifty]
    hint:
      text: Renting matched to demand means paying only for the server-months actually used.
    explanation:
      text: |
        A server-month is one server running for one month. Renting exactly what each month needs
        means paying for the 25 server-months used: 25 × $250 = $6,250. Leaving 6 servers running all
        year would mean paying for 72 server-months, $18,000, the most expensive option in the
        simulation. All figures are made up for teaching.

  - id: q02-sim-what-owned-price-hides
    page: guide/02-why-the-cloud/07-sim-demand-curve.md
    section: "Decision 5: look inside the $150"
    task: "1.4"
    level: understanding
    topics: [on-premises-costs, cloud-economics]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A cost model prices each owned server at a flat $150 a month, which bundles its share of
        hardware, space, power, cooling, network, staff and licenses. Which two real features of
        owning does this flat monthly figure leave out? (Select TWO.)
    choices:
      - id: power-cooling
        text: The electricity and cooling the servers use
        variants:
          - text: Power and cooling for the servers
          - text: What the servers cost to power and cool
        explanation:
          text: |
            Power and cooling are already inside the $150.
      - id: up-front-payment
        text: The large payment made up front for the hardware
        variants:
          - text: The big up-front payment for the servers
          - text: Paying for the hardware in one large sum at the start
        explanation:
          text: |
            Correct. The model spreads the hardware cost evenly over the months, but in reality it is
            paid in one large sum when the servers are bought.
      - id: staff-time
        text: The staff time spent looking after the servers
        variants:
          - text: Staff hours spent maintaining the servers
          - text: People's time to look after the equipment
        explanation:
          text: |
            Staff are already inside the $150.
      - id: weeks-to-install
        text: The weeks it takes to buy and install new servers
        variants:
          - text: The wait of weeks to order and install servers
          - text: Weeks spent buying and installing new servers
        explanation:
          text: |
            Correct. A flat monthly price ignores the wait for new capacity, during which a busy site
            can't serve its customers.
      - id: licenses
        text: The software licenses each server needs
        variants:
          - text: Licenses for the servers' software
          - text: Software license fees for each server
        explanation:
          text: |
            Licenses are already inside the $150.
    correct_answers: [up-front-payment, weeks-to-install]
    hint:
      text: The seven cost groups are all inside the $150. Think about timing instead of amounts.
    explanation:
      text: |
        A flat monthly price is a convenient way to compare owning with renting, but it hides two
        things about owning: the large up-front payment when the servers are bought, and the weeks
        it takes to buy and install them. Both make owning look better in the model than it feels in
        practice, above all when new servers are needed before a peak.

  - id: q02-sim-matched-option-benefit
    page: guide/02-why-the-cloud/07-sim-demand-curve.md
    section: "Decision 6: name the ideas"
    task: "1.1"
    level: understanding
    topics: [elasticity, cloud-benefits]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In a cost simulation, the cheapest option is to rent one or two servers in most months, three
        in November and six in December, paying only for what runs. Which cloud benefit does this
        option depend on?
    choices:
      - id: high-availability
        text: High availability
        variants:
          - text: Being highly available
          - text: High-availability design
        explanation:
          text: |
            High availability is about staying up when a part fails; the option is about matching
            capacity to demand.
      - id: elasticity
        text: Elasticity
        variants:
          - text: Elastic capacity
          - text: Being elastic
        explanation:
          text: |
            Correct. Capacity follows demand up for the holidays and back down afterwards.
      - id: global-reach
        text: Global reach
        variants:
          - text: Reaching users globally
          - text: Worldwide reach
        explanation:
          text: |
            Every server serves the same customers in the same place; nothing runs in a new part of
            the world.
      - id: durability
        text: Durability
        variants:
          - text: Data durability
          - text: Durable storage
        explanation:
          text: |
            Durability is about stored data not being lost, which the comparison doesn't involve.
    correct_answers: [elasticity]
    explanation:
      text: |
        The matched option works only because capacity follows demand up and down, which is
        elasticity. Without scaling down after the peak, the same cloud price gave the most expensive
        option in the simulation. Its idle capacity would concern two Well-Architected pillars: cost
        optimization and sustainability.
flashcards:

  # ---------------------------------------------------------------- 02.01

  - id: c02-classify-by-where-parts-run
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: The three deployment models are cloud, hybrid and on-premises
    level: understanding
    topics: [deployment-models]
    front:
      text: What one question decides a setup's deployment model?
    back:
      text: |
        **Where does each part run?** All at a cloud provider: cloud. All in your own buildings:
        on-premises. Some in each place, connected: hybrid.

  - id: c02-two-providers-not-hybrid
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: "Worked example: classifying three setups"
    level: understanding
    topics: [deployment-models]
    front:
      text: A system runs at two different cloud providers and nowhere else. Is it hybrid?
    back:
      text: |
        **No, it's a cloud deployment.** Hybrid means some parts are *not* in the cloud (usually
        on-premises) and are connected to the cloud parts.

  - id: c02-internet-access-not-enough
    page: guide/02-why-the-cloud/01-what-cloud-computing-is.md
    section: Three features together make something cloud computing
    level: understanding
    topics: [cloud-computing-definition]
    front:
      text: Does reaching a server over the internet make it cloud computing?
    back:
      text: |
        **No.** It must also be **on demand** (ready within minutes) and **pay as you go** (charges
        stop when you delete it). A server bought up front lacks both.

  # ---------------------------------------------------------------- 02.02

  - id: c02-any-fixed-number-is-a-guess
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Buying for normal months turns customers away at the peak
    level: understanding
    topics: [demand-curve]
    front:
      text: With owned servers, why is any fixed number of servers wrong somewhere?
    back:
      text: |
        Buy for the **peak**, and servers sit idle most of the year. Buy for the **average**, and
        customers are turned away at the peak (lost sales).

  - id: c02-when-variable-expense-saves
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: Fixed expense becomes variable expense, which isn't the same as cheaper
    level: understanding
    topics: [fixed-vs-variable]
    front:
      text: When does trading fixed expense for variable expense actually save money?
    back:
      text: |
        When use **varies** and you **remove capacity** as demand falls. Peak capacity left running
        all year can cost more than owning.

  - id: c02-economies-of-scale-change-unit-price
    page: guide/02-why-the-cloud/02-before-and-after-the-demand-curve.md
    section: "Economies of scale: a very large provider can charge less per unit"
    level: understanding
    topics: [economies-of-scale]
    front:
      text: Economies of scale and following the demand curve both save money. What does each change?
    back:
      text: |
        **Economies of scale** lower the price of each unit of capacity. **Following the curve**
        cuts how many units you pay for. They are separate savings.

  # ---------------------------------------------------------------- 02.03

  - id: c02-elasticity-or-agility-rule
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: Elasticity and agility both sound like "fast"
    level: understanding
    topics: [elasticity, agility]
    front:
      text: A scenario mentions speed. How do you tell elasticity from agility?
    back:
      text: |
        **Elasticity:** more or less of the *same* thing, driven by demand. **Agility:** something
        *new*, fast and cheap, driven by a person's idea.

  - id: c02-overload-needs-elasticity
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "High availability: the system keeps working when a part fails"
    level: understanding
    topics: [high-availability, elasticity]
    front:
      text: A site crashes because too many visitors arrive at once. High availability or elasticity?
    back:
      text: |
        **Elasticity.** High availability is about surviving a *failed part*; an overload is a
        capacity problem, fixed by adding capacity as demand rises.

  - id: c02-durability-not-undo
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: Durability isn't availability
    level: understanding
    topics: [durability]
    front:
      text: Does durable storage protect a file you delete by mistake?
    back:
      text: |
        **No.** Durability protects against the storage failing, not against you: a durable service
        deletes reliably too. Features such as keeping earlier versions guard against mistakes.

  - id: c02-global-reach-or-agility-rule
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: Global reach and agility both happen "in minutes"
    level: understanding
    topics: [global-reach, agility]
    front:
      text: A company opens a site abroad within days. Global reach or agility?
    back:
      text: |
        Look at what the scenario stresses. **Where** (closer to users, lower latency): global
        reach. **How fast or cheaply** something new appeared: agility.

  - id: c02-benefits-need-design
    page: guide/02-why-the-cloud/03-telling-the-benefits-apart.md
    section: "In real work: the benefits map to the Well-Architected pillars"
    level: understanding
    topics: [cloud-benefits]
    front:
      text: Is a website on one server in one Availability Zone highly available because it runs on AWS?
    back:
      text: |
        **No.** AWS provides Availability Zones, auto scaling and Regions; you must design your
        system to use them. The benefits are possibilities, not defaults.

  # ---------------------------------------------------------------- 02.04

  - id: c02-operating-but-fixed-example
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Capital or operating, fixed or variable: two different questions"
    level: understanding
    topics: [capex-opex, fixed-vs-variable]
    front:
      text: Give an example of an operating expense that is fixed, and say what it shows.
    back:
      text: |
        **Rent** (or salaries): paid as you go, but the same however much you use. Operating
        doesn't mean variable; the two pairs answer different questions.

  - id: c02-cloud-left-at-peak
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: "Worked example: the bakery's three-year comparison"
    level: understanding
    topics: [cloud-economics, idle-capacity]
    front:
      text: What one habit can make the cloud cost more than owning the same servers?
    back:
      text: |
        **Leaving peak-sized capacity running all year.** You then pay rental prices for idle
        capacity every month, with nothing given back.

  - id: c02-waste-hits-two-pillars
    page: guide/02-why-the-cloud/04-what-a-data-center-really-costs.md
    section: Rightsizing and automation keep the variable bill small
    level: understanding
    topics: [rightsizing, automation, sustainability]
    front:
      text: Why do rightsizing and automation serve sustainability as well as cost optimization?
    back:
      text: |
        A half-idle server wastes **energy** as well as **money**. Using only what you need saves
        both at once.

  # ---------------------------------------------------------------- 02.05

  - id: c02-why-some-say-five-pillars
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Six pillars, six questions
    level: understanding
    topics: [well-architected-pillars, wa-misconceptions]
    front:
      text: Why does some study material say the Well-Architected Framework has five pillars?
    back:
      text: |
        It was written **before AWS added the sustainability pillar**. The current Framework, and
        the CLF-C02 exam guide, list **six**.

  - id: c02-pillars-held-in-trade-offs
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The pillars can be traded against each other, but not all of them
    level: recall
    topics: [trade-offs]
    front:
      text: In a Well-Architected trade-off, which two pillars are generally not traded away?
    back:
      text: |
        **Security** and **operational excellence**. A typical acceptable trade is lower
        reliability in a test environment, to save cost.

  - id: c02-slogans-not-principles
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Real design principles, and slogans that only sound like them
    level: understanding
    topics: [design-principles, wa-misconceptions]
    front:
      text: Is "design for failure" a Well-Architected design principle?
    back:
      text: |
        **No.** It's a slogan from older material. The Framework's wording is "automatically
        recover from failure" and "test recovery procedures", both reliability principles.

  - id: c02-wa-tool-not-trusted-advisor
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The Framework is guidance; the Well-Architected Tool applies it
    level: understanding
    topics: [well-architected-tool]
    front:
      text: Which service reviews one workload against the Framework's questions, Trusted Advisor or the Well-Architected Tool?
    back:
      text: |
        **The Well-Architected Tool.** AWS Trusted Advisor runs automatic checks on an account,
        grouped into categories, not pillars.
