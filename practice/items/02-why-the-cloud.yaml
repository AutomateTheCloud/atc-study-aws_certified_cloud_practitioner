    prompt:
      text: |
        How many pillars does the current AWS Well-Architected Framework have?
    choices:
      - id: four
        text: Four
        variants:
          - text: "4"
          - text: Four pillars
        explanation:
          text: |
            Too few. The Framework has six: operational excellence, security, reliability,
            performance efficiency, cost optimization and sustainability.
      - id: five
        text: Five
        variants:
          - text: "5"
          - text: Five pillars
        explanation:
          text: |
            Five is the count in older material, written before AWS added the sustainability
            pillar.
      - id: six
        text: Six
        variants:
          - text: "6"
          - text: Six pillars
        explanation:
          text: |
            Correct. The CLF-C02 exam guide lists all six.
      - id: seven
        text: Seven
        variants:
          - text: "7"
          - text: Seven pillars
        explanation:
          text: |
            Too many. The Framework has six pillars, plus six general design principles that are not
            pillars.
    correct_answers: [six]
    explanation:
      text: |
        The Framework has six pillars: operational excellence, security, reliability, performance
        efficiency, cost optimization and sustainability. Some material still says five because it
        was written before AWS added sustainability. The CLF-C02 exam guide, under task 1.2, lists
        all six.

  - id: q02-which-are-pillars
    revision: 2
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Six pillars, six questions
    task: "1.2"
    level: recall
    topics: [well-architected-pillars]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A team's architecture review template should get one heading per Well-Architected pillar.
        A new hire has drafted five headings. Which two of the drafts match a real pillar? (Select
        TWO.)
    choices:
      - id: high-availability
        text: High availability
        variants:
          - text: The high availability pillar
          - text: High availability pillar
        explanation:
          text: |
            High availability is a cloud benefit that serves the reliability pillar; it isn't a
            pillar itself.
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency pillar
        explanation:
          text: |
            Correct. Performance efficiency asks whether you use the right kind and amount of
            resources as demand and technology change.
      - id: elasticity
        text: Elasticity
        variants:
          - text: The elasticity pillar
          - text: Elasticity pillar
        explanation:
          text: |
            Elasticity is a cloud benefit that several pillars draw on, such as performance
            efficiency and cost optimization. It isn't a pillar of its own.
      - id: agility
        text: Agility
        variants:
          - text: The agility pillar
          - text: Agility pillar
        explanation:
          text: |
            Agility is one of AWS's six advantages of cloud computing, not a pillar of the
            Framework.
      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence pillar
        explanation:
          text: |
            Correct. Operational excellence asks whether you can run the workload well day to day,
            see what it is doing, and keep improving.
    correct_answers: [performance-efficiency, operational-excellence]
    explanation:
      text: |
        The six pillars are operational excellence, security, reliability, performance efficiency,
        cost optimization and sustainability. Cloud benefits such as high availability, elasticity
        and agility show up inside the pillars' guidance, but none of them is a pillar.

  - id: q02-shared-admin-password-pillar
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Six pillars, six questions
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, security]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        At a dental practice, everyone uses one shared administrator password for the cloud account,
        and it is written on a note at reception. Which Well-Architected pillar does this concern
        most?
    choices:
      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence (OPS)
        explanation:
          text: |
            Operational excellence is about running and improving the workload. The risk here is
            that someone gets into the account.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security (SEC)
        explanation:
          text: |
            Correct. Security asks whether the data, systems and accounts are protected; a shared,
            exposed password protects none of them.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Reliability is about working correctly and recovering from failure. Nothing has
            failed.
      - id: cost-optimization
        text: Cost optimization
        variants:
          - text: The cost optimization pillar
          - text: Cost optimization (COST)
        explanation:
          text: |
            Cost optimization is about delivering value at the lowest cost. The problem is weak
            protection of the account.
    correct_answers: [security]
    explanation:
      text: |
        The security pillar asks whether the data, systems and accounts are protected. One of its
        design principles is "implement a strong identity foundation": each person has their own
        identity, with strong sign-in such as MFA, instead of a shared password anyone can read.

  - id: q02-untracked-manual-changes-pillar
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Six pillars, six questions
    task: "1.2"
    level: application
    topics: [well-architected-pillars, operational-excellence]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online shop's team changes its live website by hand late at night and records nothing
        about what changed. Nothing records errors, so nobody can say how many orders failed last
        week. Which Well-Architected pillar does this concern most?
    choices:
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency (PERF)
        explanation:
          text: |
            Performance efficiency is about the right kind and amount of resources. The problem here
            is how the team works and what it can see.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security (SEC)
        explanation:
          text: |
            Nothing here describes weak protection of data or accounts.
      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence (OPS)
        explanation:
          text: |
            Correct. The team can't see what the workload is doing and changes it in ways it can't
            track or undo, so it can't run or improve it well.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Failed orders touch reliability, but the concern described is the missing record of
            changes and errors, which is how the workload is run.
    correct_answers: [operational-excellence]
    hint:
      text: The scenario is about how the team works and what it can see, not about a single failure.
    explanation:
      text: |
        Operational excellence asks whether you can run a workload well day to day, see what it is
        doing, and keep improving how you work. Untracked manual changes and missing error records
        are its typical concerns; one of its design principles is "make frequent, small, reversible
        changes".

  - id: q02-auto-replace-failed-part-pillar
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Pillars that sound alike, side by side
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, reliability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ticketing company wants its system to notice when a component fails and replace it
        without anyone stepping in, so that sales carry on. Which Well-Architected pillar does this
        goal belong to?
    choices:
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Correct. "Automatically recover from failure" is one of the reliability pillar's design
            principles.
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency (PERF)
        explanation:
          text: |
            Performance efficiency is about using the right kind and amount of resource. The goal
            here is to keep working through a failure.
      - id: sustainability
        text: Sustainability
        variants:
          - text: The sustainability pillar
          - text: Sustainability (SUS)
        explanation:
          text: |
            Sustainability is about using fewer resources and less energy, not about recovering
            from failure.
      - id: cost-optimization
        text: Cost optimization
        variants:
          - text: The cost optimization pillar
          - text: Cost optimization (COST)
        explanation:
          text: |
            Cost optimization is about delivering value at the lowest cost; nothing here is about
            spending less.
    correct_answers: [reliability]
    hint:
      text: Ask what is at risk if the goal isn't met.
    explanation:
      text: |
        The reliability pillar asks whether a workload does its job correctly whenever it is needed,
        and recovers when something fails. Its design principles include "automatically recover
        from failure" and "test recovery procedures". To match a concern to a pillar, decide what is
        at risk: here, the system stopping.

  - id: q02-slow-server-type-pillar
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Pillars that sound alike, side by side
    task: "1.2"
    level: application
    topics: [well-architected-pillars, performance-efficiency]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A video studio renders its films on a general-purpose server type that is far too slow for
        the job, although it never fails. A newer type built for this kind of work would finish in a
        fraction of the time. Which Well-Architected pillar does this concern most?
    choices:
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Nothing fails or needs recovering. Reliability is the pillar for stopping and
            recovering.
      - id: security
        text: Security
        variants:
          - text: The security pillar
          - text: Security (SEC)
        explanation:
          text: |
            Nothing is exposed or unprotected.
      - id: operational-excellence
        text: Operational excellence
        variants:
          - text: The operational excellence pillar
          - text: Operational excellence (OPS)
        explanation:
          text: |
            The issue isn't how the team runs and improves its operations; it is the kind of server
            doing the work.
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency (PERF)
        explanation:
          text: |
            Correct. The work runs, but on the wrong kind of resource for the job.
    correct_answers: [performance-efficiency]
    hint:
      text: The system works. What is wrong with the resource it works on?
    explanation:
      text: |
        Performance efficiency asks whether you use the right kind and amount of resources to meet
        your needs as demand and technology change. A server type that is too slow for the work is a
        typical performance efficiency concern; reliability would apply only if something failed or
        couldn't recover.

  - id: q02-energy-goal-pillar
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Pillars that sound alike, side by side
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, sustainability]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company sets a goal to cut the energy its workloads use and the amount of hardware they
        need, even where the money saved would be small. Which Well-Architected pillar does this
        goal belong to?
    choices:
      - id: cost-optimization
        text: Cost optimization
        variants:
          - text: The cost optimization pillar
          - text: Cost optimization (COST)
        explanation:
          text: |
            Cost optimization measures money. The goal is stated in energy and hardware, even where
            little money is saved.
      - id: sustainability
        text: Sustainability
        variants:
          - text: The sustainability pillar
          - text: Sustainability (SUS)
        explanation:
          text: |
            Correct. Sustainability asks whether you use as few resources and as little energy as
            you can.
      - id: performance-efficiency
        text: Performance efficiency
        variants:
          - text: The performance efficiency pillar
          - text: Performance efficiency (PERF)
        explanation:
          text: |
            Performance efficiency is about meeting needs with the right resources, not about
            using less energy.
      - id: reliability
        text: Reliability
        variants:
          - text: The reliability pillar
          - text: Reliability (REL)
        explanation:
          text: |
            Reliability is about working and recovering from failure.
    correct_answers: [sustainability]
    hint:
      text: Cost optimization and sustainability often agree. What does each one measure?
    explanation:
      text: |
        Cost optimization and sustainability usually point the same way, because unused resources
        waste money and energy at once. The difference is what they measure: money for cost
        optimization, resources and energy for sustainability. A goal stated in energy and hardware
        belongs to sustainability.

  - id: q02-perf-not-reliability-concern
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: Pillars that sound alike, side by side
    task: "1.2"
    level: understanding
    topics: [well-architected-pillars, reliability, performance-efficiency]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which concern belongs to the performance efficiency pillar rather than the reliability
        pillar?
    choices:
      - id: single-server
        text: One server whose failure would stop the whole site
        variants:
          - text: A single server that takes the whole site down if it fails
          - text: The whole site depending on one server that could fail
        explanation:
          text: |
            A single point of failure is a reliability concern: the site stops if it fails.
      - id: untested-restore
        text: A backup that nobody has ever tried restoring
        variants:
          - text: Backups that have never been test-restored
          - text: No one ever having tested a restore from backup
        explanation:
          text: |
            Recovering from failure is reliability; "test recovery procedures" is one of its design
            principles.
      - id: too-slow-type
        text: A server type that is too slow for the work it does
        variants:
          - text: A kind of server too slow for its workload
          - text: Work running on a server type that can't keep up
        explanation:
          text: |
            Correct. The work runs, but on the wrong kind of resource, which is performance
            efficiency.
      - id: az-outage
        text: The site going down when one Availability Zone fails
        variants:
          - text: An outage of the site whenever one AZ fails
          - text: Losing the site if a single Availability Zone goes down
        explanation:
          text: |
            Staying up through the failure of an Availability Zone is reliability.
    correct_answers: [too-slow-type]
    explanation:
      text: |
        Reliability and performance efficiency both care about capacity, so decide by what is at
        risk. If something stops working or can't recover, it is reliability. If it works, but on
        the wrong kind or amount of resource, it is performance efficiency.

  - id: q02-pillars-not-traded-away
    page: guide/02-why-the-cloud/05-the-well-architected-framework.md
    section: The pillars can be traded against each other, but not all of them
    task: "1.2"
