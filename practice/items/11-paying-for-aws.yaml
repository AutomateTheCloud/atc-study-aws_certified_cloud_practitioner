# Module 11, Paying for AWS. Practice questions and concept cards.
# Written from the guide's pages in guide/11-paying-for-aws/; see practice/work/blueprint-11.md.
# Build fields (page, section, task, level, topics) are described in source/practice/build_bundle.py.

questions:

  # ---------------------------------------------------------------------------------------------
  # Lesson 11.01, How AWS charges
  # ---------------------------------------------------------------------------------------------

  - id: q11-consumption-model-principle
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Pay as you go means every charge is a quantity times a rate"
    task: "1.4"
    level: recall
    topics: [cost-drivers, well-architected]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A finance lead wants the team to pay only for the AWS resources it actually uses, and to cut
        whatever it doesn't need. Which cost optimization design principle of the AWS
        Well-Architected Framework describes this?
    choices:
      - id: analyze-attribute
        text: Analyze and attribute expenditure
        variants:
          - text: Analyzing and attributing expenditure
          - text: Attribute and analyze spending
        explanation:
          text: This principle is about knowing which workload and which team each charge belongs to. It explains a bill; it doesn't describe paying only for what you use.
      - id: measure-efficiency
        text: Measure overall efficiency
        variants:
          - text: Measuring overall efficiency
          - text: Measure the overall efficiency
        explanation:
          text: This principle compares a workload's business output with what it costs. It doesn't describe the pay-for-what-you-use model itself.
      - id: consumption-model
        text: Adopt a consumption model
        variants:
          - text: Adopting a consumption model
          - text: Adopt a model of consumption
        explanation:
          text: Correct. Paying for what you consume, and cutting what you don't need, is this principle seen from the customer's side.
      - id: implement-cfm
        text: Implement Cloud Financial Management
        variants:
          - text: Implementing Cloud Financial Management
          - text: Put Cloud Financial Management in place
        explanation:
          text: This principle makes cost a practice with owners and habits. It is about how an organization manages cost, not the pricing model.
    correct_answers: [consumption-model]
    explanation:
      text: |
        AWS prices most services by use, so every line on a bill is a quantity times a rate. The
        Well-Architected design principle "Adopt a consumption model" is that idea from the
        customer's side: pay for what you consume and stop paying for what you don't need. It is
        what makes cloud spending a variable expense rather than a fixed one.

  - id: q11-rate-falls-with-volume
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Pay as you go means every charge is a quantity times a rate"
    task: "1.4"
    level: understanding
    topics: [cost-drivers, economies-of-scale]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A media company stores far more data in Amazon S3 Standard each month than a small startup
        does. On its bill, the company's average price per GB is lower than the startup's. Which
        statement explains this?
    choices:
      - id: volume-tiers
        text: S3 Standard's per-GB rate drops above set monthly tiers
        variants:
          - text: Above set monthly tiers, S3 Standard costs less per GB
          - text: S3 Standard's rate per GB falls past monthly volume tiers
        explanation:
          text: Correct. S3 Standard storage costs less per GB above set monthly volumes, and data out to the internet works the same way. That is economies of scale passed on to each customer.
      - id: age-discount
        text: S3 Standard charges less per GB for data kept over a month
        variants:
          - text: Data held in S3 Standard past a month bills at a lower rate
          - text: S3 Standard lowers the per-GB rate once data is a month old
        explanation:
          text: S3 Standard has no discount for older data; a GB costs the same in its first month and its tenth. The lower average comes from the published volume tiers, which every customer gets automatically.
      - id: region-only
        text: Large customers are billed at the cheapest AWS Region's rates
        variants:
          - text: AWS bills big customers at the lowest-priced Region's rates
          - text: Large accounts pay the rate of the cheapest AWS Region
        explanation:
          text: Rates do differ by Region, but a customer pays the rate of the Region where it actually stores the data. Size doesn't move you to another Region's prices.
      - id: free-tier-share
        text: The Free Tier covers a bigger share of a large customer's storage
        variants:
          - text: Large customers get a larger Free Tier allowance for storage
          - text: Free Tier allowances grow with a customer's storage size
        explanation:
          text: Free allowances don't grow with a customer's size. The lower average comes from rates that fall in tiers as monthly volume rises.
    correct_answers: [volume-tiers]
    explanation:
      text: |
        Every charge is a quantity times a rate, and for some services the rate itself falls as
        monthly volume rises: S3 Standard costs less per GB above a set amount stored, and data out
        to the internet gets cheaper at higher volumes. This is economies of scale (task 1.4) passed
        on per customer, and in an organization the tiers count everyone's combined usage.

  - id: q11-stopped-servers-what-still-bills
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Time-based charges run whether or not anyone uses the resource"
    task: "4.1"
    level: application
    topics: [cost-drivers, idle-cost]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Before a two-week holiday, a team stops the EC2 instances in its test environment but leaves
        everything else in place: the Application Load Balancer, the instances' EBS volumes, an S3
        bucket nobody reads and a Lambda function nobody calls. Which two charges continue during
        the holiday? (Select TWO.)
    choices:
      - id: alb-hours
        text: The load balancer's hourly charge
        variants:
          - text: Hourly charges for the Application Load Balancer
          - text: The Application Load Balancer, billed by the hour
        explanation:
          text: Correct. A load balancer bills for each hour it exists, with or without traffic. It runs on the time meter.
      - id: instance-hours
        text: The instances' hourly compute charge
        variants:
          - text: Compute hours for the stopped instances
          - text: The EC2 instance-hour charge for the stopped servers
        explanation:
          text: Stopping an instance ends its instance-hour charge. That is the one charge the team did stop.
      - id: ebs-storage
        text: The EBS volumes' storage charge
        variants:
          - text: Per-GB-month charges for the EBS volumes
          - text: Storage charges on the instances' EBS disks
        explanation:
          text: Correct. A stopped instance keeps its EBS volumes, and storage bills for the size you set for as long as the volume exists.
      - id: lambda-requests
        text: The Lambda function's request charge
        variants:
          - text: Per-request charges for the Lambda function
          - text: Lambda invocation charges for the function
        explanation:
          text: Lambda charges per invocation and for run time. A function nobody calls doesn't run, so it isn't charged.
      - id: s3-get-requests
        text: The S3 bucket's charge for GET requests
        variants:
          - text: GET request charges on the S3 bucket
          - text: Per-request read charges for the S3 bucket
        explanation:
          text: Requests bill only when someone makes them. A bucket nobody reads has no GET requests. (Its stored data still bills on the storage meter.)
    correct_answers: [alb-hours, ebs-storage]
    explanation:
      text: |
        Time-based charges count the hours a resource exists, not the work it does, and storage
        bills for what you keep. So a load balancer and the disks of stopped instances keep billing
        through a quiet fortnight. Request charges, such as Lambda invocations and S3 GET requests,
        follow use exactly and stop when nobody uses the resource.
    hint:
      text: For each item, ask whether it bills for existing, for being kept, or only for being used.

  - id: q11-sort-line-onto-meter
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Storage bills for what you keep; requests bill for what's used"
    task: "4.1"
    level: understanding
    topics: [cost-drivers]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An analyst sorts each line of a monthly AWS bill onto four meters: time, storage, requests
        and data transfer. Which line belongs on the requests meter?
    choices:
      - id: rds-hours
        text: An RDS database's charge for the hours it existed
        variants:
          - text: Hourly charges for an Amazon RDS database
          - text: The hours an RDS database ran, as a charge
        explanation:
          text: RDS bills for every hour (counted in seconds) the database exists. That's the time meter.
      - id: lambda-invocations
        text: Two million Lambda function invocations
        variants:
          - text: Charges for 2 million AWS Lambda invocations
          - text: 2,000,000 runs of a Lambda function
        explanation:
          text: Correct. Lambda charges per request and per GB-second of run time, so it bills only when something calls it.
      - id: snapshots
        text: A month of keeping 400 GB of EBS snapshots
        variants:
          - text: Charges for 400 GB of EBS snapshots kept all month
          - text: 400 GB of EBS snapshots, stored for the month
        explanation:
          text: Snapshots bill per GB-month for as long as you keep them. That's the storage meter.
      - id: cross-region-copy
        text: 300 GB of backups copied to another Region
        variants:
          - text: Copying 300 GB of backups into a second Region
          - text: 300 GB of backup data sent to a different Region
        explanation:
          text: Copying data between Regions is charged per GB moved. That's the data transfer meter.
    correct_answers: [lambda-invocations]
    explanation:
      text: |
        Most AWS charges count one of four things. Time charges bill while a resource exists
        (instances, databases, load balancers, NAT gateways); storage bills per GB-month for what
        you keep; requests bill per call or per run; and data transfer bills per GB, depending on
        direction. Sorting a bill this way shows which charges follow customers and which don't.

  - id: q11-nat-gateway-on-free-path
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Data transfer is priced by direction: in is free, but out, across and between usually cost"
    task: "4.1"
    level: application
    topics: [data-transfer, nat-gateway]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Instances in a private subnet send 500 GB a month to an S3 bucket in the same Region.
        The traffic leaves the subnet through a NAT gateway. Data transfer from EC2 to S3 in the
        same Region has no transfer charge. What does this traffic still add to the bill?
    choices:
      - id: nothing
        text: Nothing, because EC2 to S3 in one Region is free
        variants:
          - text: No charge, since same-Region EC2-to-S3 traffic is free
          - text: Nothing at all, as the path stays inside one Region
        explanation:
          text: The transfer itself is free, but a service in the path still charges its own fees. The NAT gateway charges for the data it processes.
      - id: nat-processing
        text: The NAT gateway's per-GB fee for the data it processes
        variants:
          - text: A per-GB processing charge from the NAT gateway
          - text: The NAT gateway's charge for each GB passing through it
        explanation:
          text: Correct. A NAT gateway bills per GB processed, as well as for every hour it exists, even when the transfer it carries is free.
      - id: internet-rate
        text: The data-out-to-the-internet rate for all 500 GB
        variants:
          - text: Internet data-out charges on the full 500 GB
          - text: All 500 GB billed as data out to the internet
        explanation:
          text: The data never leaves AWS for the internet; it goes to S3 in the same Region. It isn't billed as data out.
      - id: cross-region-rate
        text: The between-Regions rate, charged on both sides
        variants:
          - text: Inter-Region transfer charges, applied in each direction
          - text: The rate for moving data between Regions, both ways
        explanation:
          text: Both ends are in the same Region, so no inter-Region charge applies. (The each-direction rule belongs to traffic across Availability Zones.)
    correct_answers: [nat-processing]
    explanation:
      text: |
        Data transfer from EC2 to S3 in the same Region is free, but services in the path still
        charge their own fees. A NAT gateway bills for every hour it exists and for every GB it
        processes, so routing free traffic through it costs money. Lesson 11.01's worked example
        shows the same line, "data processed by the NAT gateway", appearing on the bakery's bill.
    hint:
      text: Separate the price of moving the data from the price of the device it passes through.

  - id: q11-cross-az-tradeoff
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Data transfer is priced by direction: in is free, but out, across and between usually cost"
    task: "4.1"
    level: application
    topics: [data-transfer, availability-zones]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's web servers run in one Availability Zone and its database in another, and the
        bill shows a per-GB charge for the traffic between them. An engineer proposes moving the
        database into the web servers' Availability Zone to remove that charge. What does the
        company give up?
    choices:
      - id: free-inbound
        text: Free data transfer in from the internet
        variants:
          - text: Inbound internet traffic staying free of charge
          - text: The free rate on data arriving from the internet
        explanation:
          text: Data in from the internet is free in every Region, whatever the layout. Moving the database doesn't change that.
      - id: s3-access
        text: Free access from the servers to S3 in the Region
        variants:
          - text: Charge-free traffic from the servers to Amazon S3
          - text: The free path from EC2 to S3 in the same Region
        explanation:
          text: EC2 to S3 in the same Region stays free from any AZ. The move doesn't affect it.
      - id: volume-discount
        text: The lower volume rates for data out to the internet
        variants:
          - text: Volume tiers on data sent out to the internet
          - text: Cheaper internet data-out rates at higher volumes
        explanation:
          text: Volume tiers count monthly data out across the account; they don't depend on which AZ the database sits in.
      - id: high-availability
        text: The high availability that two Availability Zones give
        variants:
          - text: Protection from the failure of a single Availability Zone
          - text: Surviving the loss of one Availability Zone
        explanation:
          text: Correct. Traffic within one AZ is free, but with everything in one AZ, a problem in that AZ takes the whole application down. Most teams pay the small cross-AZ charge on purpose.
    correct_answers: [high-availability]
    explanation:
      text: |
        Data across Availability Zones is charged per GB in each direction, while traffic inside one
        AZ is free. Putting both tiers in one AZ removes the charge but gives up the high
        availability that two AZs buy: one AZ's failure would stop the whole application. It's a
        trade-off, and most teams keep two AZs and pay the charge.
    hint:
      text: Ask why the company spread the two tiers over two zones in the first place.

  - id: q11-cross-region-backup-charged
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: '"In is free, out is charged" is only half the rule'
    task: "4.1"
    level: understanding
    topics: [data-transfer]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Each night, a company copies its database backups from a bucket in US East (N. Virginia) to
        a bucket in Europe (Ireland) for disaster recovery. Which statement about the data transfer
        charge for these copies is correct?
    choices:
      - id: free-inside-aws
        text: It's free, because the data stays on AWS's network
        variants:
          - text: No charge applies, since the data stays inside AWS
          - text: It costs nothing, because the copy stays within AWS
        explanation:
          text: Staying inside AWS doesn't make transfer free. Data between Regions, and across Availability Zones, is charged even though it never reaches the internet.
      - id: charged-on-restore
        text: It's charged later, when the backups are restored
        variants:
          - text: A charge applies when a backup is restored later
          - text: Nothing is billed until someone restores a backup
        explanation:
          text: The transfer charge is for moving the data between Regions, and it applies when each copy is made.
      - id: charged-per-gb
        text: It's charged per GB copied, even though it stays in AWS
        variants:
          - text: Each GB copied is billed, although it never leaves AWS
          - text: A per-GB charge applies, though the data stays inside AWS
        explanation:
          text: Correct. Copying data from one Region to another is charged per GB, at a rate that depends on the source and the destination.
      - id: free-s3-to-s3
        text: It's free, because both the source and target are S3
        variants:
          - text: No charge applies, since it's S3 copying to S3
          - text: It costs nothing, because S3 is at both ends
        explanation:
          text: Using the same service at both ends doesn't remove the charge. What matters is that the data crosses from one Region to another.
    correct_answers: [charged-per-gb]
    explanation:
      text: |
        "In is free, out is charged" is only half the rule. Data in from the internet is free, but
        data across Availability Zones and between Regions is charged too, even though it never
        leaves AWS. A backup copied to a second Region pays per GB copied, which belongs in any
        disaster recovery cost estimate.

  - id: q11-bill-line-not-following-customers
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Worked example: why did the bakery's bill nearly triple?"
    task: "4.1"
    level: application
    topics: [cost-drivers, explain-a-bill]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A ticket-booking site's bill rose sharply in its busiest month. The increases were: more
        EC2 instance hours added by Auto Scaling, more data out to the internet, more S3 GET
        requests, and a NAT gateway someone created at the start of the month. Which increase
        should the owner question first, because it won't fall when the busy month ends?
    choices:
      - id: data-out
        text: The extra data sent out to the internet
        variants:
          - text: More data out to the internet
          - text: The growth in internet data-out charges
        explanation:
          text: Data out grows because more customers download pages. It will shrink when they do.
      - id: new-nat-gateway
        text: The NAT gateway created this month
        variants:
          - text: The newly added NAT gateway
          - text: The NAT gateway someone added this month
        explanation:
          text: Correct. A NAT gateway bills every hour it exists, busy or quiet. It's a new fixed cost that someone added, not growth from customers, so it needs a decision.
      - id: auto-scaling-hours
        text: The extra instance hours from Auto Scaling
        variants:
          - text: More EC2 instance hours added by Auto Scaling
          - text: The instance hours Auto Scaling added for the peak
        explanation:
          text: Auto Scaling added servers because demand rose, and it will remove them when demand falls. This is the bill following customers.
      - id: s3-requests
        text: The extra S3 GET requests on the bucket
        variants:
          - text: More GET requests against the S3 bucket
          - text: The growth in S3 GET request charges
        explanation:
          text: Requests follow customers exactly. Fewer visitors next month means fewer requests.
    correct_answers: [new-nat-gateway]
    explanation:
      text: |
        To explain a bill, sort each increase by whether it followed customers. Auto Scaling hours,
        data out and requests rose with demand and will fall with it. A newly created NAT gateway
        bills every hour whether anyone books a ticket or not, so it will still be on next month's
        bill: that's the line to review.
    hint:
      text: Picture next month, when traffic is back to normal. Which line stays the same?

  - id: q11-expert-question-for-increase
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Worked example: why did the bakery's bill nearly triple?"
    task: "4.1"
    level: understanding
    topics: [explain-a-bill]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's AWS bill nearly tripled from one month to the next, and the owner asks whether
        something is wrong. After sorting the line items by meter, which question about each
        increase best tells growth apart from a problem?
    choices:
      - id: cheapest-region
        text: Would this line cost less in another Region?
        variants:
          - text: Is another Region cheaper for this line?
          - text: Could this line be cheaper in a different Region?
        explanation:
          text: Region prices do differ, but that question is about cutting cost later. It doesn't say whether an increase is normal growth or something that needs attention.
      - id: biggest-rate
        text: Which line has the highest rate per unit?
        variants:
          - text: Which line's per-unit price is the highest?
          - text: Which line has the most expensive unit rate?
        explanation:
          text: A high unit rate says nothing about why a line grew. A cheap line can still be the one that shouldn't be there.
      - id: free-tier-ended
        text: Did the account's Free Tier end this month?
        variants:
          - text: Has the Free Tier just run out for this account?
          - text: Is the jump because the Free Tier ended?
        explanation:
          text: That might explain one jump, but it doesn't help judge each line. The expert's test is whether the increase came from customers or from something added.
      - id: followed-customers
        text: Did this line grow with customer use, or was it added?
        variants:
          - text: Did customers drive this line, or did someone add it?
          - text: Is this line customer growth, or a newly added item?
        explanation:
          text: Correct. Increases that followed customers will fall when demand falls; an item someone added keeps billing, so it needs a decision.
    correct_answers: [followed-customers]
    explanation:
      text: |
        An expert reads a grown bill in steps: sort by meter, then ask of each increase whether it
        followed customers. Growth that tracks demand is the business working, and it falls back
        when demand does. A new resource, such as a NAT gateway someone added, keeps billing every
        hour and is the item to review.

  - id: q11-free-plan-what-ends-it
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: understanding
    topics: [free-tier]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A student signs up for a new AWS account and chooses the Free plan. As of 2026-10-24,
        which two events can end the Free plan? (Select TWO.)
    choices:
      - id: six-months
        text: Six months pass since sign-up
        variants:
          - text: The account reaches six months after sign-up
          - text: Half a year goes by after the account opens
        explanation:
          text: Correct. The calendar is one of the Free plan's two clocks.
      - id: twelve-months
        text: Twelve months pass since sign-up
        variants:
          - text: The account reaches twelve months after sign-up
          - text: A full year goes by after the account opens
        explanation:
          text: Twelve months of free usage was the legacy Free Tier, before 2025-07-15. The Free plan ends sooner.
      - id: credits-used
        text: The account's credits are used up
        variants:
          - text: The credit balance runs out
          - text: All of the account's credits are spent
        explanation:
          text: Correct. The credit balance is the other clock. Whichever runs out first ends the plan.
      - id: first-instance
        text: The account launches its first EC2 instance
        variants:
          - text: The first Amazon EC2 instance is launched
          - text: Someone starts the account's first EC2 instance
        explanation:
          text: Launching an instance spends credits; it doesn't end the plan by itself.
      - id: budget-alert
        text: The account's budget sends its first alert
        variants:
          - text: A budget on the account sends its first alert
          - text: The first budget alert arrives for the account
        explanation:
          text: A budget alert only tells you about spending. It changes nothing about the plan.
    correct_answers: [six-months, credits-used]
    explanation:
      text: |
        As of 2026-10-24, a Free plan account runs on two clocks: the calendar, which ends it six
        months after sign-up, and the credit balance, which ends it when the credits are spent.
        Whichever runs out first ends the plan, and the account then closes. "Twelve months free"
        describes the legacy Free Tier.

  - id: q11-paid-plan-only-features
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: recall
    topics: [free-tier, savings-plans]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        As of 2026-10-24, a new AWS customer chooses between the Free plan and the Paid plan. Which
        two are available only on the Paid plan? (Select TWO.)
    choices:
      - id: savings-plans
        text: Buying Savings Plans and Reserved Instances
        variants:
          - text: Purchasing Reserved Instances and Savings Plans
          - text: Commitments such as Savings Plans and Reserved Instances
        explanation:
          text: Correct. The Free plan leaves out anything that could use up the credits quickly, including commitments.
      - id: always-free
        text: Always Free monthly allowances, such as Lambda's
        variants:
          - text: Monthly Always Free offers, like Lambda's
          - text: Always Free allowances each month, such as Lambda's
        explanation:
          text: Always Free offers apply on both plans.
      - id: short-term-trials
        text: Short-term trials that start when a service is activated
        variants:
          - text: Short-term service trials that begin on activation
          - text: Trials that start when you activate a service
        explanation:
          text: Correct. Short-term trials are a Paid plan offer only.
      - id: signup-credits
        text: Credits given at sign-up, plus more for activities
        variants:
          - text: Sign-up credits, and extra credits for activities
          - text: Credits at sign-up and further credits from activities
        explanation:
          text: New customers get credits on either plan, and can earn more on either.
      - id: aws-budgets
        text: Creating budgets and alerts in AWS Budgets
        variants:
          - text: Setting up budgets and alerts with AWS Budgets
          - text: Budgets and their alerts, in AWS Budgets
        explanation:
          text: Budgets, Cost Explorer and Cost Anomaly Detection were available on both plans when the guide's primer was tested (2026-10-23).
    correct_answers: [savings-plans, short-term-trials]
    explanation:
      text: |
        As of 2026-10-24, both plans get sign-up credits and Always Free allowances. The Free plan
        never charges you, so it offers only selected services and leaves out Savings Plans,
        Reserved Instances and short-term trials. The Paid plan gives access to everything and bills
        usage beyond the credits at normal rates.

  - id: q11-twelve-months-free-claim
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: understanding
    topics: [free-tier, legacy-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An older study guide says, "Every new AWS account gets 12 months of free usage on many
        services." How should a learner read this claim today?
    choices:
      - id: still-true
        text: It's still true for new accounts, on either plan
        variants:
          - text: It remains correct for new accounts, on both plans
          - text: New accounts still get it, whichever plan they pick
        explanation:
          text: Accounts created since 2025-07-15 get credits and a choice of plan instead of 12 months of free usage.
      - id: paid-plan-only
        text: It now applies to accounts on the Paid plan instead
        variants:
          - text: Today it holds for Paid plan accounts instead
          - text: It now describes accounts on the Paid plan
        explanation:
          text: Neither plan offers 12 months of free usage. The Paid plan gets the same credits, then bills at normal rates.
      - id: always-free-offers
        text: It describes today's Always Free offers
        variants:
          - text: It is another name for the Always Free offers
          - text: It refers to the current Always Free allowances
        explanation:
          text: Always Free offers are monthly allowances with no end date, not a 12-month period.
      - id: legacy-program
        text: It describes the legacy Free Tier, before July 2025
        variants:
          - text: It's the old Free Tier, for accounts before 2025-07-15
          - text: It describes the program that ended for new accounts in July 2025
        explanation:
          text: Correct. Accounts created before 2025-07-15 stay on the legacy Free Tier; new accounts get credits and a plan.
    correct_answers: [legacy-program]
    explanation:
      text: |
        Since 2025-07-15, the AWS Free Tier works through credits and a choice of the Free or Paid
        plan. "12 months free" was the legacy Free Tier; accounts created before that date stay on
        it, and much older material still describes it. When a question says "12 months free", read
        it as the old program and answer with the current one where you can.

  - id: q11-credits-run-out-plans-differ
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: understanding
    topics: [free-tier]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Two friends opened AWS accounts on the same day, one on the Free plan and one on the Paid
        plan. Both have now used up all their credits, well before six months. As of 2026-10-24,
        what happens to each account?
    choices:
      - id: both-billed
        text: Both accounts are now billed at normal rates
        variants:
          - text: Each account starts paying normal rates
          - text: Normal rates now apply to both accounts
        explanation:
          text: The Free plan never charges you. When its credits run out, the plan ends instead.
      - id: both-close
        text: Both accounts close until their owners upgrade
        variants:
          - text: Each account closes until its owner upgrades
          - text: The two accounts close until someone upgrades them
        explanation:
          text: Only the Free plan closes when credits run out. A Paid plan account never closes for lack of credits.
      - id: free-closes-paid-billed
        text: The Free plan account closes; the Paid plan account is billed
        variants:
          - text: The Free plan one closes, and the Paid plan one pays normal rates
          - text: Free plan account closed, Paid plan account billed at normal rates
        explanation:
          text: Correct. On the Free plan, running out of credits ends the plan and the account closes. On the Paid plan, usage beyond the credits is billed.
      - id: both-continue-free
        text: Both continue free until six months after sign-up
        variants:
          - text: Each stays free until the six-month mark
          - text: The two run free until six months have passed
        explanation:
          text: Credits are a clock of their own. On the Free plan, spending them ends the plan early; on the Paid plan, usage beyond them is charged.
    correct_answers: [free-closes-paid-billed]
    explanation:
      text: |
        As of 2026-10-24, the two plans differ at exactly this point. A Free plan account can't be
        charged, so when its credits run out (or six months pass), the plan ends and the account
        closes; AWS keeps the content for 90 days, and upgrading in that time restores access. A
        Paid plan account bills usage beyond the credits at normal rates and never closes for lack
        of credits.

  - id: q11-join-organization-upgrades-plan
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: understanding
    topics: [free-tier, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A learner's account is on the Free plan. A friend invites the account to join the friend's
        organization in AWS Organizations, and the learner accepts. As of 2026-10-24, what happens
        to the learner's plan?
    choices:
      - id: moves-to-paid
        text: It moves to the Paid plan, and can't move back
        variants:
          - text: It is upgraded to the Paid plan, one way only
          - text: It switches to the Paid plan for good
        explanation:
          text: Correct. Joining AWS Organizations upgrades a Free plan account to the Paid plan, and upgrading can't be undone.
      - id: stays-free
        text: It stays on the Free plan, inside the organization
        variants:
          - text: The account keeps its Free plan as a member
          - text: Nothing changes; it remains on the Free plan
        explanation:
          text: Joining an organization is one of the actions that upgrades a Free plan account automatically.
      - id: credits-pooled
        text: Its credits are pooled with the friend's credits
        variants:
          - text: Its credits join the friend's in a shared pool
          - text: The two accounts' credits are combined
        explanation:
          text: Joining doesn't pool credits. The account moves to the Paid plan, and AWS's terms say it can then no longer use or earn Free Tier credits.
      - id: blocked
        text: The invitation is blocked until six months pass
        variants:
          - text: It can't join until the six-month mark
          - text: Joining is refused until six months have passed
        explanation:
          text: Nothing blocks the invitation. Accepting it is what upgrades the plan.
    correct_answers: [moves-to-paid]
    explanation:
      text: |
        Upgrading from the Free plan to the Paid plan is one way, and some actions do it
        automatically. Creating or joining an organization in AWS Organizations is one of them (as
        of 2026-10-24). From then on, usage beyond the credits is billed, which is why the guide
        teaches consolidated billing through a simulation rather than in your own account.
    hint:
      text: Lesson 11.01 lists actions that change a Free plan account without asking twice.

  - id: q11-always-free-offers
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: recall
    topics: [free-tier]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        As of 2026-10-24, which statement describes the AWS Free Tier's Always Free offers?
    choices:
      - id: first-year
        text: Free usage on many services for the first 12 months
        variants:
          - text: Twelve months of free use on many services
          - text: A first year of free usage on many services
        explanation:
          text: That was the legacy Free Tier. Always Free offers have no end date.
      - id: paid-only-trials
        text: Trials on the Paid plan that start on activation
        variants:
          - text: Paid plan trials that begin when you activate a service
          - text: Trials, on the Paid plan only, that start at activation
        explanation:
          text: Those are short-term trials, a different offer.
      - id: signup-credits
        text: Credits given at sign-up that cover any usage
        variants:
          - text: Sign-up credits that pay for usage of any kind
          - text: Credits from sign-up, applied to whatever you use
        explanation:
          text: Credits are separate from Always Free offers. Usage beyond the always-free allowances is what comes out of the credits.
      - id: monthly-both-plans
        text: Monthly allowances on some services, on both plans
        variants:
          - text: Allowances each month on some services, on either plan
          - text: Some services' monthly allowances, on both plans alike
        explanation:
          text: Correct. More than 30 services, such as Lambda, include a monthly free allowance on both the Free and Paid plans.
    correct_answers: [monthly-both-plans]
    explanation:
      text: |
        The Free Tier has several parts (as of 2026-10-24): credits at sign-up, the Free or Paid
        plan, short-term trials on the Paid plan only, and Always Free offers. Always Free offers
        are monthly allowances on more than 30 services, such as Lambda's monthly requests and
        compute, on both plans and with no end date.

  # ---------------------------------------------------------------------------------------------
  # Lesson 11.02, Purchasing options
  # ---------------------------------------------------------------------------------------------

  - id: q11-options-for-rule-or-guarantee
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "The big picture: purchasing options do three different jobs"
    task: "4.1"
    level: understanding
    topics: [purchasing-options, dedicated-instances, capacity-reservations]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A cost review finds five EC2 purchasing options in use across a company. Which two are
        bought to meet a rule or to guarantee capacity, rather than to lower the price? (Select
        TWO.)
    choices:
      - id: compute-sp
        text: A Compute Savings Plan
        variants:
          - text: Compute Savings Plans
          - text: A Savings Plan of the Compute type
        explanation:
          text: A Savings Plan lowers the rate in return for a commitment. It holds no capacity and changes nothing about the hardware.
      - id: dedicated-instances
        text: Dedicated Instances
        variants:
          - text: EC2 Dedicated Instances
          - text: Instances on dedicated tenancy
        explanation:
          text: Correct. Dedicated Instances meet a rule that hardware mustn't be shared with other customers. They cost the same or more, not less.
      - id: spot
        text: Spot Instances
        variants:
          - text: EC2 Spot Instances
          - text: Instances bought as Spot
        explanation:
          text: Spot lowers the price in return for accepting interruptions. It guarantees nothing.
      - id: capacity-reservation
        text: On-Demand Capacity Reservations
        variants:
          - text: EC2 On-Demand Capacity Reservations
          - text: Capacity Reservations, On-Demand
        explanation:
          text: Correct. A Capacity Reservation makes sure instances can launch in one Availability Zone. It is billed at the On-Demand rate and gives no discount of its own.
      - id: convertible-ri
        text: Convertible Reserved Instances
        variants:
          - text: Reserved Instances of the Convertible kind
          - text: Reserved Instances, Convertible
        explanation:
          text: A Convertible Reserved Instance is a commitment that lowers the rate, with the right to exchange it later.
    correct_answers: [dedicated-instances, capacity-reservation]
    explanation:
      text: |
        EC2 purchasing options do three different jobs. Savings Plans, Reserved Instances and Spot
        lower the price. Dedicated Hosts and Dedicated Instances keep the hardware to yourself when a
        rule or license needs it. Capacity Reservations (and zonal Reserved Instances) make sure
        capacity is there. Only the first group is a discount; the others are bought for a rule or a
        guarantee.

  - id: q11-new-product-starts-on-demand
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "On-Demand is the default and the yardstick"
    task: "4.1"
    level: understanding
    topics: [on-demand, purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup launches a new mobile game next month and has no idea how many players will come.
        Its architect runs the game's servers On-Demand at first, even though it's the highest rate.
        Why is that the sound choice?
    choices:
      - id: no-data-to-commit
        text: There's no usage data yet to size a commitment on
        variants:
          - text: Without usage history, a commitment would be a guess
          - text: No usage record exists yet to base a commitment on
        explanation:
          text: Correct. A commitment is a bet on future use. Running On-Demand first lets the team measure, then commit to the steady part it can see.
      - id: cheapest-short-term
        text: On-Demand is the cheapest rate for the first few months
        variants:
          - text: For a new workload, On-Demand has the lowest early rate
          - text: The On-Demand rate is lowest during the first months
        explanation:
          text: On-Demand is the full rate, the yardstick every discount is measured against. Its value here is flexibility, not price.
      - id: holds-capacity
        text: On-Demand holds capacity for the game in every zone
        variants:
          - text: On-Demand reserves capacity in each Availability Zone
          - text: Running On-Demand guarantees capacity in all zones
        explanation:
          text: On-Demand holds no capacity. Only Capacity Reservations and zonal Reserved Instances do that, each in one Availability Zone.
      - id: commitments-need-a-year
        text: Commitments need a year of history before purchase
        variants:
          - text: AWS sells commitments only after a year of usage
          - text: A year of history is required to buy a commitment
        explanation:
          text: AWS has no such rule; you can buy a commitment at any time. The reason to wait is that a commitment sized on a guess may go unused.
    correct_answers: [no-data-to-commit]
    explanation:
      text: |
        On-Demand means no commitment: you pay the published rate for the time an instance runs.
        It suits work that is short, unpredictable or new. A commitment pays off only for use you
        are sure of, so a new product runs On-Demand, measures its real shape, and then commits to
        the steady base.

  - id: q11-commitments-shared-traits
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "A commitment trades flexibility for a lower rate"
    task: "4.1"
    level: understanding
    topics: [savings-plans, reserved-instances]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A manager is comparing Savings Plans with Reserved Instances. Which two statements are true
        of both? (Select TWO.)
    choices:
      - id: term-one-or-three
        text: You commit for a term of one or three years
        variants:
          - text: The commitment lasts one year or three years
          - text: They run for a one-year or a three-year term
        explanation:
          text: Correct. Both are one- or three-year commitments; the longer term earns the bigger discount.
      - id: cancel-any-time
        text: You can cancel early and get the rest refunded
        variants:
          - text: Early cancellation brings a refund of the remainder
          - text: They can be ended early for a refund of the rest
        explanation:
          text: Neither can be canceled. A Standard Reserved Instance can be sold on the Reserved Instance Marketplace, and only a small, recent Savings Plan can be returned.
      - id: pay-whether-used
        text: You pay for the commitment whether or not you use it
        variants:
          - text: The commitment is billed even when nothing uses it
          - text: Unused commitment is still charged in full
        explanation:
          text: Correct. That's the price of the discount. Usage beyond the commitment is charged at On-Demand rates.
      - id: renew-automatically
        text: They renew automatically at the end of the term
        variants:
          - text: At the end of the term, they renew by themselves
          - text: When the term ends, a new one starts on its own
        explanation:
          text: A Reserved Instance doesn't renew; when it ends, matching instances carry on at On-Demand rates.
      - id: free-plan
        text: You can buy them on the Free plan with credits
        variants:
          - text: Free plan accounts can buy them using credits
          - text: Credits on the Free plan can pay for them
        explanation:
          text: The Free plan doesn't offer Savings Plans or Reserved Instances; you need the Paid plan.
    correct_answers: [term-one-or-three, pay-whether-used]
    explanation:
      text: |
        Savings Plans and Reserved Instances work the same way at heart: a one- or three-year term,
        All, Partial or No Upfront payment, and a bill for the commitment whether you use it or not.
        Neither can be canceled, and a Reserved Instance doesn't renew. The difference is what you
        commit to: dollars per hour, or one instance configuration.

  - id: q11-bigger-discount-choices
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "A commitment trades flexibility for a lower rate"
    task: "4.1"
    level: recall
    topics: [savings-plans, reserved-instances, payment-options]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company is buying a commitment for steady EC2 use. Which two choices generally earn a
        bigger discount? (Select TWO.)
    choices:
      - id: three-year
        text: A three-year term instead of one year
        variants:
          - text: Committing for three years, not one
          - text: The 3-year term rather than the 1-year term
        explanation:
          text: Correct. The longer term earns the bigger discount.
      - id: no-upfront
        text: No Upfront payment instead of All Upfront
        variants:
          - text: Paying monthly with No Upfront, not All Upfront
          - text: The No Upfront option rather than All Upfront
        explanation:
          text: Paying less upfront generally saves less. All Upfront earns the most.
      - id: all-upfront
        text: All Upfront payment instead of No Upfront
        variants:
          - text: Paying everything upfront, not monthly
          - text: The All Upfront option rather than No Upfront
        explanation:
          text: Correct. Paying more upfront generally saves more.
      - id: convertible
        text: A Convertible instead of a Standard Reserved Instance
        variants:
          - text: Convertible Reserved Instances rather than Standard
          - text: Choosing Convertible over Standard Reserved Instances
        explanation:
          text: Convertible gives less discount than Standard, in return for the right to exchange it.
      - id: compute-plan
        text: A Compute instead of an EC2 Instance Savings Plan
        variants:
          - text: The Compute Savings Plan rather than EC2 Instance
          - text: Choosing Compute over EC2 Instance Savings Plans
        explanation:
          text: The Compute plan's extra flexibility costs some discount; the EC2 Instance plan has the deeper maximum.
    correct_answers: [three-year, all-upfront]
    explanation:
      text: |
        Commitments trade flexibility for a lower rate, and the more you give up, the more you
        save. A three-year term earns more than one year, and All Upfront more than Partial or No
        Upfront. Flexibility goes the other way: Convertible Reserved Instances and Compute Savings
        Plans give some discount back in return for freedom to change.

  - id: q11-savings-plan-unused-hour
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Savings Plans: commit to dollars per hour, in four types"
    task: "4.1"
    level: application
    topics: [savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company has a Savings Plan with a commitment of $3.00 an hour. Overnight, its eligible
        usage comes to only $1.80 an hour at the plan's rates. What happens to the other $1.20 in
        each of those hours?
    choices:
      - id: carried-forward
        text: It carries over to the next busy hour
        variants:
          - text: It rolls forward into the next busier hour
          - text: The next busy hour can use it
        explanation:
          text: Each hour stands alone. Unused commitment doesn't carry over.
      - id: refunded
        text: It's refunded at the end of the month
        variants:
          - text: AWS refunds it when the month closes
          - text: It comes back as a refund at month end
        explanation:
          text: The commitment is billed whether or not it is used; nothing is refunded.
      - id: spot-covered
        text: It pays for any Spot usage that hour
        variants:
          - text: It covers that hour's Spot Instances
          - text: Spot usage in that hour soaks it up
        explanation:
          text: Savings Plans don't cover Spot usage, and Spot spending doesn't count toward the commitment.
      - id: paid-and-lost
        text: It's still billed, and buys nothing
        variants:
          - text: It's charged anyway and goes unused
          - text: It is paid for but covers no usage
        explanation:
          text: Correct. You pay the full hourly commitment every hour; whatever usage doesn't fill is lost.
    correct_answers: [paid-and-lost]
    explanation:
      text: |
        A Savings Plan commits to a fixed amount of spending per hour. Each hour, eligible usage is
        charged at the plan's lower rates until that hour's commitment is used up; usage beyond it
        is charged On-Demand. Commitment left unused in an hour is paid for and lost, not carried
        over, which is why you size a plan to the usage you always have.
    hint:
      text: Think about how the commitment is measured, and whether one hour can borrow from another.

  - id: q11-two-newer-savings-plan-types
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"There are two types of Savings Plans" is out of date'
    task: "4.1"
    level: recall
    topics: [savings-plans]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A study note says AWS offers two types of Savings Plans: Compute and EC2 Instance. As of
        2026-10-24, which two types is the note missing? (Select TWO.)
    choices:
      - id: database
        text: Database Savings Plans
        variants:
          - text: The Database Savings Plan type
          - text: Savings Plans for databases
        explanation:
          text: Correct. Database Savings Plans cover services such as Aurora, RDS and DynamoDB across engines, sizes and Regions.
      - id: storage
        text: Storage Savings Plans
        variants:
          - text: The Storage Savings Plan type
          - text: Savings Plans for storage
        explanation:
          text: There is no Storage Savings Plan. Storage costs are cut with storage classes and lifecycle rules, not commitments.
      - id: spot
        text: Spot Savings Plans
        variants:
          - text: The Spot Savings Plan type
          - text: Savings Plans for Spot
        explanation:
          text: There is no such type, and Savings Plans don't cover Spot usage at all.
      - id: sagemaker-ai
        text: SageMaker AI Savings Plans
        variants:
          - text: The SageMaker AI Savings Plan type
          - text: Savings Plans for SageMaker AI
        explanation:
          text: Correct. SageMaker AI Savings Plans cover SageMaker AI instances in any family, size, Region or component.
      - id: network
        text: Data Transfer Savings Plans
        variants:
          - text: The Data Transfer Savings Plan type
          - text: Savings Plans for data transfer
        explanation:
          text: There is no such type. Data transfer is cut by design, such as keeping traffic in one AZ or using CloudFront.
    correct_answers: [database, sagemaker-ai]
    explanation:
      text: |
        As of 2026-10-24, AWS offers four Savings Plans types: Compute, EC2 Instance, Database and
        SageMaker AI. Older material lists two because Compute and EC2 Instance came first, and they
        are still the pair the exam most likely compares. Check the Savings Plans types page for
        the current list.

  - id: q11-compute-plan-moving-to-fargate
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Compute or EC2 Instance Savings Plan: flexibility or a deeper discount"
    task: "4.1"
    level: application
    topics: [savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics company runs `m5` instances in Europe (Ireland) all year. Over the next three
        years it plans to move part of the work into containers on AWS Fargate and part to
        Graviton-based instances in another Region. Which commitment keeps applying through those
        changes?
    choices:
      - id: ec2-instance-sp
        text: An EC2 Instance Savings Plan for the `m5` family
        variants:
          - text: EC2 Instance Savings Plans on `m5` in Ireland
          - text: A Savings Plan of the EC2 Instance type, for `m5`
        explanation:
          text: An EC2 Instance Savings Plan stays with one family in one Region. Work that moves to Fargate, another family or another Region falls outside it.
      - id: standard-regional-ri
        text: Standard Regional Reserved Instances for `m5`
        variants:
          - text: Regional Reserved Instances, Standard, for `m5`
          - text: Standard RIs with Regional scope on `m5`
        explanation:
          text: A Reserved Instance commits to one configuration in one Region. It wouldn't cover Fargate or another Region.
      - id: compute-sp
        text: A Compute Savings Plan for the hourly spend
        variants:
          - text: Compute Savings Plans sized to the hourly spend
          - text: A Savings Plan of the Compute type, per hour
        explanation:
          text: Correct. A Compute Savings Plan follows usage across families, sizes and Regions, and from EC2 to Fargate or Lambda.
      - id: zonal-ri
        text: Zonal Reserved Instances for `m5` in one zone
        variants:
          - text: "`m5` Reserved Instances scoped to one zone"
          - text: Reserved Instances for `m5`, zonal scope
        explanation:
          text: "A zonal Reserved Instance is the least flexible option of all: one configuration in one Availability Zone."
    correct_answers: [compute-sp]
    explanation:
      text: |
        A Compute Savings Plan commits to dollars per hour and keeps applying when usage changes
        instance family, size, Region, operating system or tenancy, and even when it moves from EC2
        to Fargate or Lambda. An EC2 Instance Savings Plan pays a deeper maximum discount for
        staying in one family in one Region. Choose Compute when you expect that kind of change.
    hint:
      text: List what will change during the term, then find the commitment that tolerates all of it.

  - id: q11-ec2-instance-plan-os-change
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Compute or EC2 Instance Savings Plan: flexibility or a deeper discount"
    task: "4.1"
    level: application
    topics: [savings-plans, reserved-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company is sure its fleet will stay in the `c7g` family in one Region for three years.
        During that time it expects to change instance sizes and to move some servers to another
        operating system. It wants the deepest discount that still allows both changes. Which
        should it buy?
    choices:
      - id: compute-sp
        text: A Compute Savings Plan covering the fleet's spend
        variants:
          - text: Compute Savings Plans sized to the fleet's spend
          - text: A Savings Plan of the Compute type for the fleet
        explanation:
          text: It would cover both changes, but its maximum discount is lower, and the flexibility it adds (other families, Regions, Fargate, Lambda) isn't needed here.
      - id: standard-regional-ri
        text: Standard Regional Reserved Instances for `c7g`
        variants:
          - text: Regional Reserved Instances, Standard, for `c7g`
          - text: Standard RIs with Regional scope on `c7g`
        explanation:
          text: A Reserved Instance is tied to one platform. Size flexibility helps with resizing on Linux, but moving to another operating system leaves the reservation unmatched.
      - id: zonal-ri
        text: Zonal Reserved Instances for each `c7g` size
        variants:
          - text: "`c7g` Reserved Instances, zonal, for every size"
          - text: Reserved Instances scoped to one zone, per `c7g` size
        explanation:
          text: Zonal Reserved Instances have no size flexibility and are tied to one platform and one Availability Zone.
      - id: ec2-instance-sp
        text: An EC2 Instance Savings Plan for `c7g` in that Region
        variants:
          - text: EC2 Instance Savings Plans on `c7g` in the Region
          - text: A Savings Plan of the EC2 Instance type for `c7g`
        explanation:
          text: Correct. It covers one family in one Region, with any size, operating system or tenancy, and has the deeper maximum discount of the two EC2 plans.
    correct_answers: [ec2-instance-sp]
    explanation:
      text: |
        An EC2 Instance Savings Plan stays with one instance family in one Region but lets size,
        operating system and tenancy change, and it offers a deeper maximum discount than a Compute
        Savings Plan. Reserved Instances commit to a configuration that includes the platform, so a
        change of operating system breaks the match.
    hint:
      text: Which option lets the operating system change but still pays for staying in one family and Region?

  - id: q11-ri-with-no-matching-instance
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"A Reserved Instance is a server set aside for you" is wrong'
    task: "4.1"
    level: understanding
    topics: [reserved-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company buys a one-year Regional Reserved Instance for an `r7g.large` running Linux, but it
        hasn't launched any `r7g` instances yet. What happens this month?
    choices:
      - id: aws-launches
        text: AWS launches an `r7g.large` for the company to use
        variants:
          - text: A matching `r7g.large` is started for the company
          - text: AWS starts an `r7g.large` instance on its behalf
        explanation:
          text: Nothing launches when you buy a Reserved Instance. It's a billing discount, not a machine.
      - id: charge-waived
        text: The reservation's charge waits until a match runs
        variants:
          - text: Billing for the reservation starts once a match runs
          - text: No charge applies until a matching instance runs
        explanation:
          text: A Reserved Instance bills every hour of its term, used or not.
      - id: pays-for-nothing
        text: It pays for the reservation and gets no benefit
        variants:
          - text: The reservation is billed and discounts nothing
          - text: It's charged for the reservation, with no discount used
        explanation:
          text: Correct. With no matching instance running, there is nothing for the discount to apply to, but the reservation is still billed.
      - id: becomes-savings-plan
        text: AWS turns it into a Savings Plan that covers other use
        variants:
          - text: It converts into a Savings Plan for other usage
          - text: The reservation becomes a Savings Plan automatically
        explanation:
          text: Reserved Instances never turn into Savings Plans. An unused one simply goes unused.
    correct_answers: [pays-for-nothing]
    explanation:
      text: |
        A Reserved Instance is a billing discount that AWS applies automatically to running
        instances that match its attributes: instance type, Region, tenancy and platform. If a
        matching instance is running, its bill drops; if none is, you pay for the reservation and get
        nothing. The name misleads people into thinking a server is set aside.

  - id: q11-convertible-for-family-change
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Standard or Convertible"
    task: "4.1"
    level: application
    topics: [reserved-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company is certain it will run the same amount of EC2 capacity for three years, but its
        engineers expect to switch to a newer instance family halfway through. It wants a Reserved
        Instance it can change to the new family when that happens. Which kind fits?
    choices:
      - id: convertible
        text: A Convertible Reserved Instance
        variants:
          - text: Convertible Reserved Instances
          - text: An RI of the Convertible kind
        explanation:
          text: Correct. A Convertible Reserved Instance can be exchanged for another of a different family, operating system or tenancy, of equal or higher value.
      - id: standard
        text: A Standard Reserved Instance
        variants:
          - text: Standard Reserved Instances
          - text: An RI of the Standard kind
        explanation:
          text: A Standard Reserved Instance gives more discount, but it can't be exchanged for another family; you can only modify some attributes, such as the AZ or size, or sell it.
      - id: zonal
        text: A zonal Reserved Instance
        variants:
          - text: Zonal Reserved Instances
          - text: An RI with zonal scope
        explanation:
          text: Zonal is a scope, not a kind. It reserves capacity in one AZ and is less flexible, not more.
      - id: dedicated-host-reservation
        text: A Dedicated Host Reservation
        variants:
          - text: Dedicated Host Reservations
          - text: A reservation for a Dedicated Host
        explanation:
          text: A Host Reservation discounts a whole physical server you've chosen for licensing reasons. It doesn't solve a family change on shared hardware.
    correct_answers: [convertible]
    explanation:
      text: |
        Standard and Convertible are both one- or three-year commitments to a configuration. A
        Standard Reserved Instance gives the bigger discount and less freedom; a Convertible one
        gives a smaller discount and the right to exchange it for a different family, operating
        system or tenancy, of equal or higher value, in the same Region. Buy Convertible when you're
        sure of the amount of use but not the family.

  - id: q11-standard-ri-sell-when-unneeded
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Standard or Convertible"
    task: "4.1"
    level: understanding
    topics: [reserved-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company closes a project a year into a three-year Standard Reserved Instance and no longer
        needs it. Which option does it have?
    choices:
      - id: cancel-refund
        text: Cancel it and get a refund for the remaining time
        variants:
          - text: End it early for a refund of the time left
          - text: Cancel the reservation and recover the rest
        explanation:
          text: Reserved Instances can't be canceled.
      - id: sell-marketplace
        text: Sell it on the Reserved Instance Marketplace
        variants:
          - text: Offer it for sale on the RI Marketplace
          - text: List it on the Reserved Instance Marketplace
        explanation:
          text: Correct. Standard Reserved Instances can be sold on the Reserved Instance Marketplace; Convertible ones can't.
      - id: exchange-family
        text: Exchange it for a different instance family
        variants:
          - text: Trade it for one in another instance family
          - text: Swap it for a reservation on another family
        explanation:
          text: Exchanging for a different family is what a Convertible Reserved Instance allows, not a Standard one.
      - id: convert-to-sp
        text: Convert it into a Compute Savings Plan
        variants:
          - text: Turn it into a Compute Savings Plan instead
          - text: Change it into a Savings Plan of the Compute type
        explanation:
          text: There is no conversion from a Reserved Instance into a Savings Plan.
    correct_answers: [sell-marketplace]
    explanation:
      text: |
        Neither kind of Reserved Instance can be canceled. What each kind lets you do later
        differs: a Standard Reserved Instance can be sold on the Reserved Instance Marketplace, and a
        Convertible one can be exchanged for different attributes. That ability to sell unused
        Standard reservations is one of the reasons to pick a Reserved Instance over a Savings Plan.

  - id: q11-zonal-ri-two-traits
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Zonal or Regional"
    task: "4.1"
    level: understanding
    topics: [reserved-instances, capacity]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two statements describe a zonal Reserved Instance, compared with a Regional one?
        (Select TWO.)
    choices:
      - id: reserves-capacity
        text: It reserves capacity in one Availability Zone
        variants:
          - text: It holds capacity in a single Availability Zone
          - text: Capacity is reserved for it in one AZ
        explanation:
          text: Correct. That's the zonal Reserved Instance's extra job, and the reason to choose it.
      - id: any-size
        text: Its discount applies to any size in the family
        variants:
          - text: Its discount covers every size in the family
          - text: Any size in the instance family gets its discount
        explanation:
          text: Size flexibility belongs to Regional Reserved Instances (Linux, shared tenancy). A zonal one has none.
      - id: exact-match-in-az
        text: Its discount applies only to exact matches in that AZ
        variants:
          - text: Only exactly matching instances in that AZ get the discount
          - text: The discount is limited to exact matches in its AZ
        explanation:
          text: Correct. A zonal Reserved Instance discounts only instances that match it exactly, in its own Availability Zone.
      - id: any-az
        text: Its discount applies in every AZ of the Region
        variants:
          - text: Instances in any AZ of the Region get its discount
          - text: The discount follows instances across the Region's AZs
        explanation:
          text: That's a Regional Reserved Instance. A zonal one stays in its own AZ.
      - id: covers-fargate
        text: Its discount also covers Fargate and Lambda
        variants:
          - text: Fargate and Lambda usage also get its discount
          - text: The discount extends to Lambda and Fargate
        explanation:
          text: No Reserved Instance covers Fargate or Lambda. Only a Compute Savings Plan does.
    correct_answers: [reserves-capacity, exact-match-in-az]
    explanation:
      text: |
        Every Reserved Instance has a scope. A zonal one reserves capacity in one Availability Zone,
        and its discount applies only to exactly matching instances there. A Regional one reserves
        no capacity, but its discount applies in any AZ of the Region and, for Linux on shared
        tenancy, to any size in the same family. Choose zonal only when you need the capacity
        guarantee.

  - id: q11-size-flexibility-two-mediums
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Zonal or Regional"
    task: "4.1"
    level: application
    topics: [reserved-instances, size-flexibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company owns one Regional Reserved Instance for a `t3.large` running Linux on shared
        tenancy. It replaces that server with two `t3.medium` instances, also Linux. In
        normalization units, a large counts 4 and a medium 2. How much of the two instances' usage
        does the reservation cover?
    choices:
      - id: none
        text: None of it, because the type no longer matches
        variants:
          - text: Nothing, since the instance type has changed
          - text: None, as the type is no longer the same
        explanation:
          text: That would be true of a zonal Reserved Instance, which has no size flexibility. A Regional one for Linux on shared tenancy applies across sizes in the family.
      - id: both-fully
        text: All of both `t3.medium` instances' usage
        variants:
          - text: Both `t3.medium` servers, in full
          - text: The two `t3.medium` instances, completely
        explanation:
          text: Correct. One large is worth 4 units and two mediums are 2 units each, so the reservation covers both.
      - id: one-medium
        text: Only one of the `t3.medium` instances
        variants:
          - text: Just one of the two `t3.medium` servers
          - text: One `t3.medium`, with the other On-Demand
        explanation:
          text: The reservation is worth 4 units, enough for two instances of 2 units each.
      - id: half-each
        text: Half of each `t3.medium` instance's usage
        variants:
          - text: 50% of each `t3.medium` server's usage
          - text: Each `t3.medium` is half covered
        explanation:
          text: "The units add up to a full match: 2 plus 2 equals the reservation's 4."
    correct_answers: [both-fully]
    explanation:
      text: |
        A Regional Reserved Instance for Linux on shared tenancy has instance size flexibility: its
        discount applies to any size in the same family, measured in normalization units (small 1,
        medium 2, large 4, xlarge 8). A `t3.large` reservation is worth 4 units an hour, which
        exactly covers two `t3.medium` instances. A smaller reservation would cover a bigger instance
        only in part.
    hint:
      text: Add up the units the two new instances use, and compare with what the reservation is worth.

  - id: q11-no-size-flexibility
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Zonal or Regional"
    task: "4.1"
    level: understanding
    topics: [reserved-instances, size-flexibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company resizes its instances within the same family from time to time. With which of
        these commitments would a resize leave the instance without its discount?
    choices:
      - id: regional-ri
        text: A Regional Reserved Instance for Linux
        variants:
          - text: A Linux Reserved Instance with Regional scope
          - text: Regional Reserved Instances on Linux
        explanation:
          text: A Regional Reserved Instance for Linux on shared tenancy has instance size flexibility, so a resize in the same family keeps the discount, in proportion.
      - id: zonal-ri
        text: A zonal Reserved Instance for Linux
        variants:
          - text: A Linux Reserved Instance with zonal scope
          - text: Zonal Reserved Instances on Linux
        explanation:
          text: Correct. Size flexibility doesn't apply to zonal Reserved Instances; a different size no longer matches.
      - id: ec2-instance-sp
        text: An EC2 Instance Savings Plan
        variants:
          - text: EC2 Instance Savings Plans
          - text: A Savings Plan of the EC2 Instance type
        explanation:
          text: An EC2 Instance Savings Plan lets size change within its family and Region.
      - id: compute-sp
        text: A Compute Savings Plan
        variants:
          - text: Compute Savings Plans
          - text: A Savings Plan of the Compute type
        explanation:
          text: A Compute Savings Plan follows usage across sizes, families and Regions.
    correct_answers: [zonal-ri]
    explanation:
      text: |
        Both Savings Plans types let instance size change, and a Regional Reserved Instance for Linux
        on shared tenancy applies to any size in its family. A zonal Reserved Instance has no size
        flexibility: its discount applies only to exactly matching instances in its Availability
        Zone. Size flexibility also doesn't apply to Windows, RHEL or SUSE, to dedicated tenancy, or to
        some specialized families.

  - id: q11-zonal-ri-discount-and-capacity
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Savings Plans or Reserved Instances: what follows your usage?"
    task: "4.1"
    level: application
    topics: [reserved-instances, savings-plans, capacity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A payment processor runs the same instance configuration in one Availability Zone around
        the clock and will for three years. It wants a lower rate and also the certainty that its
        instances can always launch in that zone, from a single purchase. Which option does both?
    choices:
      - id: compute-sp
        text: A three-year Compute Savings Plan
        variants:
          - text: Compute Savings Plans for three years
          - text: A Compute-type Savings Plan, 3-year term
        explanation:
          text: A Savings Plan lowers the rate but holds no capacity.
      - id: regional-ri
        text: A three-year Regional Reserved Instance
        variants:
          - text: Regional Reserved Instances for three years
          - text: A Reserved Instance, Regional scope, 3-year term
        explanation:
          text: A Regional Reserved Instance gives the discount in any AZ but reserves no capacity.
      - id: spot
        text: Spot Instances with no commitment
        variants:
          - text: Spot capacity, with nothing committed
          - text: Instances on Spot, uncommitted
        explanation:
          text: "Spot is the opposite of guaranteed: capacity may not be there, and it can be taken back."
      - id: zonal-ri
        text: A three-year zonal Reserved Instance
        variants:
          - text: Zonal Reserved Instances for three years
          - text: A Reserved Instance, zonal scope, 3-year term
        explanation:
          text: Correct. A zonal Reserved Instance is the one commitment that both discounts matching usage and reserves capacity, in its own AZ.
    correct_answers: [zonal-ri]
    explanation:
      text: |
        AWS recommends Savings Plans by default, because they give a similar discount and follow
        your usage. A Reserved Instance still makes sense when you need a zonal capacity reservation
        or want the option to sell unused Standard reservations later. A zonal Reserved Instance does
        both jobs, discount and capacity, for one configuration in one AZ. (A Capacity Reservation
        plus a Savings Plan is the other way, as two purchases.)
    hint:
      text: Only the rightmost column of lesson 11.02's comparison table holds capacity.

  - id: q11-up-to-figure-in-a-budget
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"Up to" is a ceiling, not a promise'
    task: "4.1"
    level: understanding
    topics: [reserved-instances, discounts]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A manager writes next year's budget assuming a one-year, No Upfront Reserved Instance will
        save the "up to" percentage AWS publishes for Reserved Instances. What is wrong with the
        assumption?
    choices:
      - id: ceiling-only
        text: The figure is a best case, not what this purchase gets
        variants:
          - text: That figure is a maximum, beyond what this purchase earns
          - text: It's the most anyone saves, not what this buy will save
        explanation:
          text: Correct. "Up to" is reached only with the longest term, the most paid upfront and the configurations with the biggest gap. A one-year, No Upfront purchase saves noticeably less.
      - id: minimum
        text: The figure is a minimum, so savings will be higher
        variants:
          - text: That figure is a floor, so the real saving is bigger
          - text: It's the least anyone saves, so expect more
        explanation:
          text: "It's the opposite: \"up to\" is a ceiling."
      - id: average
        text: The figure is an average, so half will save less
        variants:
          - text: That figure is an average across all customers
          - text: It's the typical saving, so half save less
        explanation:
          text: AWS publishes averages separately, and they are well below the maximum. "Up to" is the best case.
      - id: nothing-wrong
        text: Nothing; every Reserved Instance gets that figure
        variants:
          - text: It's fine, since all Reserved Instances get it
          - text: No problem; the figure applies to every RI
        explanation:
          text: Savings depend on term, payment option and configuration. No purchase is guaranteed the maximum.
    correct_answers: [ceiling-only]
    explanation:
      text: |
        Any "up to" discount is a ceiling, reached only with the longest term, the most paid upfront
        and the configurations with the biggest gap. AWS's own published averages for Reserved
        Instances are far lower than the maximum. Learn the order (Spot deepest, then commitments,
        Capacity Reservations no discount) and check current figures, rather than memorizing one
        number.
    hint:
      text: Ask what conditions the published maximum needs, and whether this purchase meets them.

  - id: q11-spot-for-restartable-analysis
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Spot Instances: deep discounts for work that can stop"
    task: "4.1"
    level: application
    topics: [spot]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university lab splits a genome analysis into thousands of small pieces across hundreds of
        instances. Each piece saves its result when done and can simply be rerun if lost. The
        deadline is days away, and the lab wants the lowest compute cost with no commitment. Which
        option fits?
    choices:
      - id: dedicated-instances
        text: Dedicated Instances for the whole run
        variants:
          - text: Dedicated Instances throughout the run
          - text: The run on Dedicated Instances
        explanation:
          text: Dedicated Instances meet an isolation rule and cost the same or more. Nothing here needs them.
      - id: capacity-reservation
        text: A Capacity Reservation for the run
        variants:
          - text: Capacity Reservations throughout the run
          - text: The run on reserved capacity
        explanation:
          text: A Capacity Reservation guarantees capacity at the On-Demand rate; it gives no discount.
      - id: three-year-ri
        text: Three-year Reserved Instances for the run
        variants:
          - text: Reserved Instances, three-year, for the run
          - text: The run on three-year Reserved Instances
        explanation:
          text: A three-year commitment for a few days of work would be paid for long after the job ends.
      - id: spot
        text: Spot Instances for the whole run
        variants:
          - text: Spot Instances throughout the run
          - text: The run on Spot Instances
        explanation:
          text: Correct. The work can be interrupted and rerun, and spread across many instances, which is the profile Spot is priced for.
    correct_answers: [spot]
    explanation:
      text: |
        Spot Instances run on spare EC2 capacity at a deep discount, with no commitment. The catch
        is that EC2 can interrupt them, after a two-minute notice, when it needs the capacity back.
        Work that can stop and pick up again, or is split across many instances, such as batch
        analysis, loses only a little time when that happens.
    hint:
      text: Weigh what an interruption would cost this job.

  - id: q11-spot-outside-savings-plan
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Spot Instances: deep discounts for work that can stop"
    task: "4.1"
    level: understanding
    topics: [spot, savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company has a Compute Savings Plan and also runs nightly batch jobs on Spot Instances.
        How do the two relate?
    choices:
      - id: spot-fills-commitment
        text: Spot spending counts toward the plan's hourly commitment
        variants:
          - text: The plan's hourly commitment is filled by Spot spending
          - text: Spot costs help use up the plan's hourly commitment
        explanation:
          text: Spot spending doesn't count toward a Savings Plan commitment.
      - id: extra-discount
        text: The plan adds its discount on top of the Spot price
        variants:
          - text: Spot usage gets the plan's discount as well
          - text: The plan's rate is applied to Spot prices too
        explanation:
          text: Savings Plans don't discount Spot usage at all.
      - id: separate
        text: The plan doesn't cover Spot, and Spot doesn't count toward it
        variants:
          - text: Spot sits outside the plan, neither covered nor counted
          - text: Spot is neither discounted by the plan nor counted in it
        explanation:
          text: Correct. Savings Plans don't apply to Spot usage, and Spot spending doesn't fill the commitment.
      - id: no-interruptions
        text: The plan protects the Spot Instances from interruption
        variants:
          - text: Spot Instances under the plan can't be interrupted
          - text: Having the plan stops EC2 interrupting the Spot jobs
        explanation:
          text: Nothing protects a Spot Instance from interruption; that's the condition of the discount.
    correct_answers: [separate]
    explanation:
      text: |
        Spot and Savings Plans are separate ways to lower the price. Savings Plans don't cover Spot
        usage, and Spot spending doesn't count toward a Savings Plan's hourly commitment. A company
        sizes its plan to the steady On-Demand-style base and runs interruptible work on Spot
        alongside it.

  - id: q11-dedicated-host-why-licenses
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Dedicated Hosts and Dedicated Instances: hardware with no other customers"
    task: "4.1"
    level: understanding
    topics: [dedicated-hosts, licensing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company brings its own database licenses, which are counted per physical core on the
        server they run on. Why does a Dedicated Host suit this, where a Dedicated Instance doesn't?
    choices:
      - id: sees-cores
        text: It shows the sockets and cores, and keeps instances on it
        variants:
          - text: You can see its sockets and cores, and instances stay put
          - text: Its sockets and cores are visible, and instances stay on it
        explanation:
          text: Correct. Per-core licenses need a physical server you can see and keep using. A Dedicated Instance shows nothing of the hardware and may move after a stop and start.
      - id: only-single-tenant
        text: It's the only option where no other customer shares it
        variants:
          - text: Only it keeps other customers off the hardware
          - text: It alone guarantees no other customer on the server
        explanation:
          text: Both a Dedicated Host and a Dedicated Instance run on hardware no other customer uses. That isn't the difference.
      - id: faster
        text: It gives faster, more secure hardware than a Dedicated Instance
        variants:
          - text: Its hardware is quicker and safer than a Dedicated Instance's
          - text: It runs on better, more secure hardware than a Dedicated Instance
        explanation:
          text: AWS describes no difference in performance, security or hardware between Dedicated Hosts and Dedicated Instances. The difference is visibility and control.
      - id: includes-license
        text: AWS includes the database license in the host's price
        variants:
          - text: The host's price already contains the license
          - text: AWS bundles the database license into the host
        explanation:
          text: The point of a Dedicated Host is to bring your own license (BYOL), not to buy one included.
    correct_answers: [sees-cores]
    explanation:
      text: |
        Dedicated Hosts and Dedicated Instances both run on single-tenant hardware, with no
        difference in performance or security. What differs is visibility and control: a Dedicated
        Host shows its sockets, cores and host ID and keeps your instances on the host you choose,
        which licenses counted per socket or core need. A Dedicated Instance is simpler and suits a
        rule that only says "not shared with other customers".

  - id: q11-dedicated-instance-isolation-rule
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Dedicated Hosts and Dedicated Instances: hardware with no other customers"
    task: "4.1"
    level: application
    topics: [dedicated-instances]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A government contract requires that a company's EC2 instances never run on physical
        hardware shared with other AWS customers. The software has no per-core or per-socket
        licensing, and the team wants the simplest option that meets the rule. Which should it use?
    choices:
      - id: dedicated-host
        text: Dedicated Hosts
        variants:
          - text: EC2 Dedicated Hosts
          - text: A whole Dedicated Host
        explanation:
          text: A Dedicated Host also meets the rule, but it adds host management that only per-socket or per-core licensing needs. It isn't the simplest choice.
      - id: capacity-reservation
        text: On-Demand Capacity Reservations
        variants:
          - text: EC2 Capacity Reservations
          - text: Reserved capacity, On-Demand
        explanation:
          text: A Capacity Reservation holds capacity; on default tenancy it says nothing about who shares the hardware.
      - id: zonal-ri
        text: Zonal Reserved Instances
        variants:
          - text: EC2 zonal Reserved Instances
          - text: Reserved Instances, zonal scope
        explanation:
          text: A zonal Reserved Instance is a discount with a capacity reservation. On default tenancy it doesn't keep other customers off the hardware.
      - id: dedicated-instances
        text: Dedicated Instances
        variants:
          - text: EC2 Dedicated Instances
          - text: Instances with dedicated tenancy
        explanation:
          text: Correct. Dedicated Instances run on hardware only your account uses, and AWS handles placement.
    correct_answers: [dedicated-instances]
    explanation:
      text: |
        Both dedicated options give single-tenant hardware. If you only need "not shared with other
        customers", a Dedicated Instance is simpler: you see nothing of the hardware and AWS places
        the instance. Choose a Dedicated Host when you bring licenses counted per socket or core,
        which need the physical server to be visible.
    hint:
      text: Both dedicated options satisfy the rule. Which extra feature would go unused here?

  - id: q11-host-and-instance-in-common
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Dedicated Hosts and Dedicated Instances: hardware with no other customers"
    task: "4.1"
    level: understanding
    topics: [dedicated-hosts, dedicated-instances]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two statements are true of both Dedicated Hosts and Dedicated Instances? (Select
        TWO.)
    choices:
      - id: no-other-customers
        text: No other AWS customer runs on the same hardware
        variants:
          - text: The hardware isn't shared with other AWS customers
          - text: Other AWS customers' instances aren't on that hardware
        explanation:
          text: Correct. Both give single-tenant hardware.
      - id: see-sockets
        text: You can see the server's sockets, cores and host ID
        variants:
          - text: The server's sockets, cores and host ID are visible
          - text: You're shown the host ID, sockets and cores
        explanation:
          text: Only a Dedicated Host shows them. A Dedicated Instance shows nothing of the hardware.
      - id: same-performance
        text: Neither is faster or more secure than the other
        variants:
          - text: They match each other in performance and security
          - text: One is no faster or safer than the other
        explanation:
          text: Correct. AWS describes no difference in performance, security or hardware between the two. What differs is what you can see and control.
      - id: region-fee
        text: They're billed per instance plus a fee per Region
        variants:
          - text: Billing is per instance, plus a per-Region fee
          - text: Each instance is billed, with a Region fee on top
        explanation:
          text: That's how Dedicated Instances are billed. A Dedicated Host is billed per host.
      - id: capacity-reservations
        text: They can be used with Capacity Reservations
        variants:
          - text: Capacity Reservations work with them
          - text: They support On-Demand Capacity Reservations
        explanation:
          text: Dedicated Instances support Capacity Reservations; Dedicated Hosts don't.
    correct_answers: [no-other-customers, same-performance]
    explanation:
      text: |
        What's the same: both run on dedicated physical servers that no other customer uses, and
        AWS describes no difference between them in performance, security or hardware. What differs is visibility and control:
        a Dedicated Host shows sockets and cores, is billed per host and suits per-core licenses; a
        Dedicated Instance shows nothing, is billed per instance plus a per-Region fee, and supports
        Capacity Reservations.

  - id: q11-capacity-reservation-billing
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"A Capacity Reservation gets you a discount" is wrong'
    task: "4.1"
    level: understanding
    topics: [capacity-reservations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team creates an On-Demand Capacity Reservation for ten instances in one Availability Zone
        for immediate use, and runs only six of them. Which statement about its bill is correct?
    choices:
      - id: discounted-rate
        text: All ten are billed at a discounted reserved rate
        variants:
          - text: The ten slots get a lower, reserved rate
          - text: A reduced reserved rate applies to all ten
        explanation:
          text: A Capacity Reservation gives no billing discount on its own.
      - id: on-demand-all-ten
        text: All ten are billed at the On-Demand rate
        variants:
          - text: The On-Demand rate applies to all ten slots
          - text: Ten slots, each billed at the On-Demand rate
        explanation:
          text: Correct. The six running instances are billed as usual, and the four empty slots as unused reservation, at the same On-Demand rate.
      - id: only-running
        text: Only the six running instances are billed
        variants:
          - text: Just the six instances in use are charged
          - text: Billing covers only the six that run
        explanation:
          text: Empty slots are billed too, as unused reservation.
      - id: three-year-term
        text: All ten are billed for a three-year term
        variants:
          - text: A three-year term is billed for all ten
          - text: The ten slots are charged for three years
        explanation:
          text: One for immediate use needs no commitment and can be canceled any time. Only one booked for a future date needs a set duration.
    correct_answers: [on-demand-all-ten]
    explanation:
      text: |
        An On-Demand Capacity Reservation holds capacity for one instance type in one Availability
        Zone. It is charged at the On-Demand rate whether you run instances in it or not; running
        instances pay nothing extra, and empty slots are billed as unused reservation. It is a
        guarantee, not a discount.

  - id: q11-discount-a-capacity-reservation
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"A Capacity Reservation gets you a discount" is wrong'
    task: "4.1"
    level: application
    topics: [capacity-reservations, savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A hospital keeps an On-Demand Capacity Reservation in one Availability Zone for the servers
        behind its patient records system, which runs all year. The finance team wants to lower what
        those servers cost without giving up the reservation. What should it add?
    choices:
      - id: zonal-ri
        text: A zonal Reserved Instance to discount the reservation
        variants:
          - text: Zonal Reserved Instances applied to the reservation
          - text: A Reserved Instance with zonal scope for those slots
        explanation:
          text: A zonal Reserved Instance's discount doesn't apply to a Capacity Reservation. (On its own, a zonal one would hold capacity itself.)
      - id: spot
        text: Spot Instances placed into the reservation
        variants:
          - text: Spot Instances run inside the reservation
          - text: The reservation filled with Spot Instances
        explanation:
          text: Spot can be interrupted, which a patient records system can't accept, and it doesn't discount a reservation.
      - id: second-reservation
        text: A second Capacity Reservation in another zone
        variants:
          - text: Another Capacity Reservation in a second AZ
          - text: An extra reservation in a different zone
        explanation:
          text: Another reservation adds capacity and cost; it gives no discount.
      - id: savings-plan
        text: A Savings Plan that covers the reserved instances
        variants:
          - text: Savings Plans covering the servers in the reservation
          - text: A Savings Plan applied to the reserved servers
        explanation:
          text: Correct. Savings Plans, like Regional Reserved Instances, apply their discount to instances running in a Capacity Reservation.
    correct_answers: [savings-plan]
    explanation:
      text: |
        A Capacity Reservation gives no discount by itself. To lower the price, combine it with a
        Savings Plan or a Regional Reserved Instance, whose discounts apply to instances in it. A
        zonal Reserved Instance's discount doesn't apply to a Capacity Reservation, though a zonal
        Reserved Instance on its own does both jobs for a one- or three-year commitment.
    hint:
      text: Lesson 11.02 names two commitments whose discounts reach reserved capacity, and one whose discount doesn't.

  # ---------------------------------------------------------------------------------------------
  # Simulation S13, the purchasing-option tree
  # ---------------------------------------------------------------------------------------------

  - id: q11-capacity-on-set-saturdays
    page: guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    section: "Decision 1: choose an option for each workload, and give the reason"
    task: "4.1"
    level: application
    topics: [capacity-reservations, purchasing-options]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A concert promoter must be certain that eight extra instances can launch in one particular
        Availability Zone on the three evenings that tickets go on sale this autumn. The rest of the
        year it doesn't need them. Which option gives that guarantee without paying for the rest of
        the year?
    choices:
      - id: ec2-instance-sp
        text: A one-year EC2 Instance Savings Plan for the eight instances
        variants:
          - text: EC2 Instance Savings Plans covering eight instances, one year
          - text: A 1-year Savings Plan of the EC2 Instance type, for eight
        explanation:
          text: A Savings Plan lowers the rate but guarantees no capacity, and a year of commitment for three evenings would sit mostly unused.
      - id: capacity-reservation
        text: On-Demand Capacity Reservations covering the sale periods
        variants:
          - text: Capacity Reservations that cover the three sale periods
          - text: On-Demand Capacity Reservations for the sale periods
        explanation:
          text: Correct. Only a reservation guarantees capacity in one AZ without a long term. Booked ahead for the sale dates, each needs a commitment for a set duration, not a one- or three-year term, and bills at the On-Demand rate while held, used or not.
      - id: spot
        text: Spot Instances launched on each of the three evenings
        variants:
          - text: Spot capacity requested on the three sale evenings
          - text: Instances bought as Spot on each sale evening
        explanation:
          text: "Spot is the opposite of guaranteed: the capacity may not be there, and it can be taken back."
      - id: zonal-ri
        text: One-year zonal Reserved Instances for the eight instances
        variants:
          - text: Zonal Reserved Instances for eight instances, one year
          - text: A year of zonal-scope Reserved Instances for eight
        explanation:
          text: A zonal Reserved Instance would hold the capacity, but it's a year of payments for three evenings.
    correct_answers: [capacity-reservation]
    explanation:
      text: |
        When capacity in one Availability Zone must be there at a set time, the answer is an
        On-Demand Capacity Reservation. One for immediate use needs no commitment and can be
        canceled any time; one booked ahead for a future date, as the promoter would book the sale
        dates, needs a commitment for a set duration, not a one- or three-year term. Either way it
        bills at the On-Demand rate whether used or not, and gives no discount by itself.
        Commitments lower the price over years; they're the wrong tool for a few evenings.
    hint:
      text: The requirement is a guarantee for a short time. Which option guarantees capacity without a one- or three-year term?

  - id: q11-database-savings-plan-engine-change
    page: guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    section: "Decision 1: choose an option for each workload, and give the reason"
    task: "4.1"
    level: application
    topics: [savings-plans, databases]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A retailer's order database on Amazon RDS runs every hour of the year, and the retailer
        expects to keep it for years. Next year it may move the database to another engine or to
        Amazon Aurora. As of 2026-10-24, which commitment keeps its discount through that move?
    choices:
      - id: compute-sp
        text: A Compute Savings Plan
        variants:
          - text: Compute Savings Plans
          - text: A Savings Plan of the Compute type
        explanation:
          text: A Compute Savings Plan covers EC2, Fargate and Lambda. Managed database services such as RDS and Aurora fall under the Database type.
      - id: rds-ri-current-engine
        text: An RDS Reserved Instance for the current engine
        variants:
          - text: RDS Reserved Instances for today's engine
          - text: A Reserved Instance on RDS, current engine
        explanation:
          text: A Reserved Instance commits to one configuration; a move to another engine or to Aurora would leave it unmatched.
      - id: database-sp
        text: A Database Savings Plan
        variants:
          - text: Database Savings Plans
          - text: A Savings Plan of the Database type
        explanation:
          text: Correct. A Database Savings Plan applies across database services, engines, sizes and Regions, including RDS and Aurora. Its term is one year, so the retailer renews it each year.
      - id: spot
        text: Spot Instances for the database
        variants:
          - text: The database on Spot Instances
          - text: Spot capacity for the database
        explanation:
          text: An order database mustn't be interrupted. Spot is for work that can stop and restart.
    correct_answers: [database-sp]
    explanation:
      text: |
        As of 2026-10-24, a Database Savings Plan covers Aurora, RDS, DynamoDB and several other
        database services across engines, sizes and Regions, so it keeps applying when a database
        changes engine or service. It comes only with a one-year term and no upfront payment, so a
        multi-year workload renews it each year.
    hint:
      text: Which commitment is defined by a kind of service rather than one configuration?

  - id: q11-commit-to-the-baseline
    page: guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    section: "Decision 2: commit to 0, 2 or 6 servers?"
    task: "4.1"
    level: application
    topics: [savings-plans, reserved-instances, baseline]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A news site never runs fewer than 4 web servers. On big news days, Auto Scaling adds up to
        12 more for a few hours. The site wants to cut the cost of its web servers with a one-year
        commitment. How much should it commit to?
    choices:
      - id: commit-base
        text: Enough for the 4 servers that always run
        variants:
          - text: The base of 4 servers that run every hour
          - text: The 4 servers that are always running
        explanation:
          text: Correct. Those 4 run every hour, so every committed hour is used. The peaks stay On-Demand.
      - id: commit-peak
        text: Enough for 16 servers, the busiest hour's total
        variants:
          - text: The peak of 16 servers, so every server is covered
          - text: All 16 servers that run at the busiest hour
        explanation:
          text: Committing to the peak pays every hour for servers that run only a few hours on busy days. It can cost more than paying full price.
      - id: commit-average
        text: Enough for 10 servers, between the base and the peak
        variants:
          - text: A middle figure of 10 servers, base to peak
          - text: About 10 servers, halfway to the peak
        explanation:
          text: Anything above the base is idle most hours, and idle commitment is paid for and lost.
      - id: commit-none-spot
        text: Nothing; run all the web servers on Spot
        variants:
          - text: No commitment, with every web server on Spot
          - text: None at all, and every web server as Spot
        explanation:
          text: A site's floor of web servers mustn't all vanish on a two-minute warning, and the steady base is exactly what a commitment fits.
    correct_answers: [commit-base]
    explanation:
      text: |
        A commitment is paid every hour of its term, used or not, so it fits the baseline: the level
        a workload never drops below. Peaks are short and come and go, so they stay On-Demand. The
        guide's bakery example shows that committing to the peak can cost more than paying
        On-Demand for everything.
    hint:
      text: A commitment is billed every hour. In how many hours is each committed server actually used?

  # ---------------------------------------------------------------------------------------------
  # Lesson 11.03, Estimate, watch, analyze
  # ---------------------------------------------------------------------------------------------

  - id: q11-estimate-feature-before-build
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Pricing Calculator estimates a design before it exists"
    task: "4.2"
    level: application
    topics: [pricing-calculator, cost-tools]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A florist's web team has designed a new photo-upload feature using Lambda and S3. Nothing
        is built yet. Before the owner approves it, she wants a monthly cost figure based on the
        team's expected uploads and storage. Which tool produces that figure?
    choices:
      - id: cost-explorer-forecast
        text: AWS Cost Explorer's forecast
        variants:
          - text: A forecast in AWS Cost Explorer
          - text: The forecast that Cost Explorer shows
        explanation:
          text: Cost Explorer forecasts from your past usage. A feature that doesn't exist yet has no history to forecast from.
      - id: budgets-forecast
        text: A forecasted alert in AWS Budgets
        variants:
          - text: AWS Budgets, with a forecasted-cost alert
          - text: A forecast alert set in AWS Budgets
        explanation:
          text: Budgets' forecast predicts the current period's spending from actual costs. It watches real spending; it doesn't price a design.
      - id: pricing-calculator
        text: AWS Pricing Calculator
        variants:
          - text: The AWS Pricing Calculator
          - text: Pricing Calculator, from AWS
        explanation:
          text: Correct. It estimates what services will cost from your assumptions about hours, GB and requests, before anything is used.
      - id: anomaly-detection
        text: AWS Cost Anomaly Detection
        variants:
          - text: The AWS Cost Anomaly Detection service
          - text: A monitor in AWS Cost Anomaly Detection
        explanation:
          text: Anomaly detection compares actual spending with your normal pattern. It needs real spending to work on.
    correct_answers: [pricing-calculator]
    explanation:
      text: |
        Name the stage, then the tool. Before something exists, you estimate it, and that's AWS
        Pricing Calculator: you describe how you'll use each service and it shows monthly, upfront
        and yearly cost, with the working. Every other cost tool works from usage you already have.
    hint:
      text: Ask what each tool works from. Only one works from assumptions about something not yet built.

  - id: q11-public-calculator-two-traits
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Pricing Calculator estimates a design before it exists"
    task: "4.2"
    level: understanding
    topics: [pricing-calculator]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A consultant uses the public AWS Pricing Calculator website to prepare an estimate for a
        client. Which two statements about it are correct? (Select TWO.)
    choices:
      - id: needs-sign-in
        text: It needs a sign-in to the client's AWS account
        variants:
          - text: The client's AWS account must be signed in to use it
          - text: Using it requires signing in to an AWS account
        explanation:
          text: The public calculator needs no AWS account at all.
      - id: link-public
        text: A shared estimate link is stored on AWS's public servers
        variants:
          - text: Shared estimates are kept on AWS's public servers
          - text: A saved estimate's link lives on public AWS servers
        explanation:
          text: Correct. Anyone with the link can open it, so leave names, addresses, account IDs and secrets out of the estimate.
      - id: leaves-out-tax
        text: Its totals leave out tax
        variants:
          - text: The totals it shows don't include tax
          - text: Tax isn't included in its figures
        explanation:
          text: Correct. It also says the service's pricing page wins wherever the two differ.
      - id: uses-client-discounts
        text: It applies the client's own Savings Plans automatically
        variants:
          - text: The client's Savings Plans are applied to it automatically
          - text: It automatically uses the client's own Savings Plans
        explanation:
          text: The public site knows nothing about an account. The version inside the Billing and Cost Management console can use an account's discounts and commitments.
      - id: charges-per-estimate
        text: It charges a small fee for each saved estimate
        variants:
          - text: Each saved estimate costs a small fee
          - text: Saving an estimate is billed per estimate
        explanation:
          text: The public Pricing Calculator site is free.
    correct_answers: [link-public, leaves-out-tax]
    explanation:
      text: |
        The public Pricing Calculator at calculator.aws is free and needs no account. A saved
        estimate becomes a link stored on AWS's public servers, readable by anyone who has it, and
        its totals leave out tax. A separate version in the Billing and Cost Management console can
        use an account's own discounts and commitments.

  - id: q11-estimate-missed-assumptions
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Pricing Calculator estimates a design before it exists"
    task: "4.2"
    level: application
    topics: [pricing-calculator]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team's AWS Pricing Calculator estimate for a new video site said about $400 a month. The
        first full month's bill was about $900, and nothing unexpected was running. What is the most
        likely reason for the gap?
    choices:
      - id: calculator-adds-tax
        text: The calculator added tax that the bill leaves out
        variants:
          - text: Tax was included in the estimate but not the bill
          - text: The estimate counted tax, and the bill didn't
        explanation:
          text: "It's the other way round: the calculator leaves out tax. That would make the bill higher than the estimate, but not by this much."
      - id: calculator-stale
        text: The calculator uses last year's prices
        variants:
          - text: Prices in the calculator are a year old
          - text: The calculator knows the previous year's rates
        explanation:
          text: The calculator shows current prices; where it differs from a pricing page, the page wins. A gap this size comes from the inputs.
      - id: estimate-is-ceiling
        text: Calculator estimates cover a single week of use
        variants:
          - text: Its estimates count the first week of use
          - text: The calculator prices one week of usage
        explanation:
          text: The calculator shows monthly, upfront and yearly figures; it counts 730 hours in a month.
      - id: wrong-inputs
        text: The team's guesses about usage, such as data out, were off
        variants:
          - text: Usage assumptions, such as data out, were wrong or missing
          - text: Its inputs for usage, data out among them, were off
        explanation:
          text: Correct. An estimate is only as good as its inputs. A wrong guess about hours, GB or requests, or a line nobody added, such as data out to viewers, gives a confident, wrong total.
    correct_answers: [wrong-inputs]
    explanation:
      text: |
        The Pricing Calculator turns assumptions into a total, so its main risk is the assumptions:
        hours, GB stored, requests and data transfer. A design that sends video to viewers can easily
        under-count data out to the internet. Once the site runs, compare the estimate with Cost
        Explorer and set a budget a little above it, so you hear when reality drifts.
    hint:
      text: The calculator does the arithmetic correctly. What did a person have to supply?

  - id: q11-retired-calculators
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Pricing Calculator estimates a design before it exists"
    task: "4.2"
    level: recall
    topics: [pricing-calculator, legacy-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A volunteer's bookmarked notes from several years ago link to the "Simple Monthly
        Calculator" for pricing a design. She clicks the link today. What has become of that
        calculator?
    choices:
      - id: still-current
        text: It still works, and it's the tool AWS recommends
        variants:
          - text: It's still running and still AWS's recommended tool
          - text: It works as before and remains the recommended tool
        explanation:
          text: The Simple Monthly Calculator, like the TCO Calculator, is gone.
      - id: sign-in-now
        text: It still works, but now needs an AWS account sign-in
        variants:
          - text: It's still running, but asks you to sign in to AWS first
          - text: It works as before, once you sign in to an AWS account
        explanation:
          text: It doesn't work at all any more. Its replacement, the public Pricing Calculator, needs no account.
      - id: retired
        text: It's gone; the link now leads to AWS Pricing Calculator
        variants:
          - text: It was retired, and the link now opens AWS Pricing Calculator
          - text: It no longer exists; the address goes to AWS Pricing Calculator
        explanation:
          text: Correct. Both the Simple Monthly Calculator and the TCO Calculator are gone, and their addresses lead to AWS Pricing Calculator.
      - id: paid-plan-only
        text: It still works, but only for accounts on the Paid plan
        variants:
          - text: It's still running, for Paid plan accounts alone
          - text: It works as before, if your account is on the Paid plan
        explanation:
          text: It doesn't work for anyone. Estimating today happens in AWS Pricing Calculator, whose public site is free.
    correct_answers: [retired]
    explanation:
      text: |
        Older material may send you to the TCO Calculator or the Simple Monthly Calculator. Both are
        gone, and their addresses now lead to AWS Pricing Calculator, the free tool for estimating a
        design before you build it. For a migration business case, Module 13 uses Migration
        Evaluator instead.

  - id: q11-forecasted-alert-before-spend
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Budgets tells you when you pass a limit; it stops nothing unless you add an action"
    task: "4.2"
    level: application
    topics: [budgets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A charity has a $2,000 monthly AWS budget. Last month it learned it had overspent only when
        the actual-cost alert arrived near the end of the month. This month it wants a warning early
        enough to act before the money is spent. What should it add?
    choices:
      - id: forecasted-alert
        text: A forecasted-cost alert on the same budget
        variants:
          - text: An alert on forecasted cost, on that budget
          - text: A forecast-based alert added to the budget
        explanation:
          text: Correct. It fires when Budgets predicts the period's cost will pass the threshold, before the money is spent.
      - id: actual-at-100
        text: A second actual-cost alert at 100% of the budget
        variants:
          - text: Another alert on actual cost, at 100%
          - text: An extra actual-cost alert at the full amount
        explanation:
          text: An actual-cost alert fires only once the money has been spent. A second one at 100% would arrive even later than the first.
      - id: cur-export
        text: A daily Cost and Usage Report export to S3
        variants:
          - text: A CUR 2.0 export delivered daily to S3
          - text: Daily Cost and Usage Report files in S3
        explanation:
          text: The CUR delivers raw line items to a bucket; it alerts nobody.
      - id: pricing-estimate
        text: A new estimate in AWS Pricing Calculator
        variants:
          - text: A fresh AWS Pricing Calculator estimate
          - text: Another estimate built in the Pricing Calculator
        explanation:
          text: The calculator prices designs before they're built; it doesn't watch actual spending.
    correct_answers: [forecasted-alert]
    explanation:
      text: |
        AWS Budgets can alert on actual cost, once spending passes a threshold, or on forecasted
        cost, when its prediction for the whole period will pass it. The forecasted alert warns
        before the money is spent. (Forecasts need some history; a brand-new account may not get
        them for a few weeks.)
    hint:
      text: One kind of alert looks at what has been spent, the other at where the month is heading.

  - id: q11-budget-alert-arrives-late
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "AWS Budgets tells you when you pass a limit; it stops nothing unless you add an action"
    task: "4.2"
    level: understanding
    topics: [budgets, billing-data-lag]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An engineer launches several large instances by mistake at 09:00. Her account has a cost
        budget with an alert at $50, and the instances pass $50 of cost by 13:00, but the email
        arrives hours later. Why?
    choices:
      - id: weekly-batch
        text: Budgets sends all its alerts in a weekly batch
        variants:
          - text: Budget alerts go out together once a week
          - text: AWS Budgets batches its alerts weekly
        explanation:
          text: Alerts aren't batched weekly. The delay comes from how often the cost data behind the budget is refreshed.
      - id: data-refresh
        text: Budgets data refreshes a few times a day, hours behind
        variants:
          - text: The cost data behind budgets updates only a few times daily
          - text: Budget data lags usage, updating a few times a day
        explanation:
          text: Correct. Budgets data updates up to three times a day, so you can spend past a threshold before an alert can be sent.
      - id: forecast-first
        text: An actual-cost alert waits for the forecast to confirm it
        variants:
          - text: Actual-cost alerts are held until the forecast agrees
          - text: The forecast must confirm before an actual alert goes out
        explanation:
          text: Actual and forecasted alerts are independent. Neither waits for the other.
      - id: month-end
        text: Alerts are sent after the billing period closes
        variants:
          - text: Budgets alerts once the month has closed
          - text: Alerts wait until the billing period is over
        explanation:
          text: Alerts are sent during the period, as soon as refreshed data shows the threshold crossed.
    correct_answers: [data-refresh]
    explanation:
      text: |
        Cost tools don't see usage as it happens. AWS Budgets data updates up to three times a day,
        typically 8 to 12 hours apart (as of 2026-10-24), so an alert can arrive hours after the
        money is spent. That's why alerts are no substitute for deleting what you create, and why a
        forecasted alert or anomaly detection can help warn earlier.

  - id: q11-budget-without-action
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: understanding
    topics: [budgets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement describes what AWS Budgets does when a budget with no budget actions
        crosses its threshold?
    choices:
      - id: alerts-only
        text: It sends alerts, and resources keep running and billing
        variants:
          - text: Alerts go out, and every resource keeps running
          - text: People are alerted; resources carry on billing
        explanation:
          text: Correct. A budget on its own tells people; it changes nothing in the account.
      - id: stops-launches
        text: It blocks new launches until the next period starts
        variants:
          - text: New launches are blocked until the next period
          - text: It prevents new launches for the rest of the period
        explanation:
          text: Blocking launches needs a budget action that applies an IAM policy or SCP. Without one, nothing is blocked.
      - id: refuses-charges
        text: It refuses any charges above the budget amount
        variants:
          - text: Charges beyond the budget amount are refused
          - text: Nothing above the budget amount can be charged
        explanation:
          text: A budget changes nothing about what you're charged. Spending can pass the budget amount freely.
      - id: deletes-newest
        text: It deletes the newest resources to bring cost down
        variants:
          - text: The most recent resources are deleted to cut cost
          - text: It removes the latest resources to lower spending
        explanation:
          text: Nothing in AWS Budgets ever deletes resources, even with actions.
    correct_answers: [alerts-only]
    explanation:
      text: |
        In everyday speech a budget is a limit you can't exceed; an AWS budget is a target you are
        told about. With no budget action, crossing a threshold sends an email or SNS alert, and
        every resource keeps running and billing until someone changes it. Even with actions, a
        budget isn't a cap.

  - id: q11-budget-action-two-kinds
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: recall
    topics: [budgets, budget-actions]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A team is setting up AWS Budgets actions for a test account. Which two can a budget action
        do when its threshold is crossed? (Select TWO.)
    choices:
      - id: iam-policy
        text: Apply an IAM policy that denies launching instances
        variants:
          - text: Attach an IAM policy that blocks instance launches
          - text: Put on an IAM policy denying new instance launches
        explanation:
          text: Correct. Applying an IAM policy, such as one that denies launching new EC2 instances, is one of the three kinds of budget action.
      - id: delete-buckets
        text: Delete the S3 buckets that caused the spending
        variants:
          - text: Remove the S3 buckets behind the spending
          - text: Empty and delete the S3 buckets responsible
        explanation:
          text: Budget actions never delete anything.
      - id: stop-chosen
        text: Stop EC2 or RDS instances chosen in advance
        variants:
          - text: Stop pre-selected EC2 or RDS instances
          - text: Stop the EC2 or RDS instances named beforehand
        explanation:
          text: Correct. An action can stop chosen EC2 or RDS instances in your own account.
      - id: terminate-all
        text: Terminate every running instance in the account
        variants:
          - text: End every instance running in the account
          - text: Shut down and terminate all running instances
        explanation:
          text: Actions stop only the instances you named, and never terminate them.
      - id: cap-bill
        text: Hold the month's bill at exactly the budget amount
        variants:
          - text: Keep the bill capped at the budget amount
          - text: Stop the bill from going above the budget
        explanation:
          text: No action caps a bill. Actions act on data that is hours old, and anything they don't cover keeps billing.
    correct_answers: [iam-policy, stop-chosen]
    explanation:
      text: |
        A budget action is something AWS Budgets does for you when a threshold is crossed, either
        automatically or after someone approves it. There are three kinds: apply an IAM policy,
        attach a service control policy (management account only), or stop chosen EC2 or RDS
        instances. Nothing is deleted, and whatever the action doesn't cover keeps billing.

  - id: q11-deny-policy-running-instances
    page: guide/11-paying-for-aws/08-sim-guardrail-timeline.md
    section: "Decision 3: last month you added a budget action to the $5 budget. Which version would have helped?"
    task: "4.2"
    level: understanding
    topics: [budget-actions]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A sandbox account's budget has an action that, at 100% of actual cost, applies an IAM policy
        denying `ec2:RunInstances` to the developers' group. On Saturday, the action runs. Four
        instances that a developer launched on Friday are still running. What happens to them?
    choices:
      - id: stopped
        text: The action stops the four instances
        variants:
          - text: The four instances are stopped by the action
          - text: They are stopped by the action
        explanation:
          text: This action applies a policy; it doesn't stop instances. Stopping needs a separate action that names chosen instances.
      - id: keep-running
        text: They keep running and billing
        variants:
          - text: The four carry on running and billing
          - text: The four keep running, and keep billing
        explanation:
          text: Correct. A deny policy blocks new launches; instances that already run are untouched.
      - id: terminated
        text: The action terminates the four instances
        variants:
          - text: The four instances are terminated by the action
          - text: They are terminated by the action
        explanation:
          text: Budget actions never terminate or delete anything.
      - id: billing-paused
        text: Their billing pauses until the next month
        variants:
          - text: Charges for them pause until next month
          - text: They run, but billing pauses until next month
        explanation:
          text: Nothing pauses billing. The instances bill for every hour they run.
    correct_answers: [keep-running]
    explanation:
      text: |
        A budget action that applies a deny policy blocks *new* work; it doesn't touch what already
        runs. An action that stops instances stops only the ones chosen when it was set up, and
        storage, NAT gateways and anything else it doesn't name keep billing. Budget actions suit
        known, repeated risks; the step that ends every charge is a person deleting the resources.
    hint:
      text: Read exactly which API call the policy denies.

  - id: q11-scp-action-management-only
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: recall
    topics: [budget-actions, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which kind of budget action can be set up only from an organization's management account?
    choices:
      - id: scp
        text: Attaching a service control policy to an account
        variants:
          - text: Applying an SCP to a member account
          - text: Putting a service control policy on an account
        explanation:
          text: Correct. SCPs are an AWS Organizations feature, so only the management account can attach one through a budget action.
      - id: iam-policy
        text: Applying an IAM policy to users or roles
        variants:
          - text: Attaching an IAM policy to users or roles
          - text: Putting an IAM policy on roles or users
        explanation:
          text: Any account can apply an IAM policy through a budget action in that account.
      - id: stop-instances
        text: Stopping chosen EC2 or RDS instances
        variants:
          - text: Stopping selected EC2 or RDS instances
          - text: Stopping EC2 or RDS instances picked in advance
        explanation:
          text: An account can stop chosen instances in its own account.
      - id: sns-alert
        text: Sending an alert to an Amazon SNS topic
        variants:
          - text: Notifying an Amazon SNS topic
          - text: Publishing an alert to Amazon SNS
        explanation:
          text: Sending alerts by email or SNS is what every budget does; it isn't an action, and any account can do it.
    correct_answers: [scp]
    explanation:
      text: |
        Budget actions come in three kinds: apply an IAM policy, attach a service control policy
        (SCP), or stop chosen EC2 or RDS instances. Attaching an SCP sets a ceiling on a whole
        account (Module 09), and only a management account can do it.

  - id: q11-what-keeps-billing-after-stop
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: understanding
    topics: [budget-actions, idle-cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A test environment has two EC2 instances in a private subnet and a NAT gateway. Its budget
        action stops both instances, which were chosen when the action was set up. Which charge
        continues after the action runs?
    choices:
      - id: instance-hours
        text: The two instances' hourly compute charge
        variants:
          - text: Compute hours for the two stopped instances
          - text: Instance-hour charges for both instances
        explanation:
          text: Stopping an instance ends its instance-hour charge. That's what the action did end.
      - id: nat-hours
        text: The NAT gateway's hourly charge
        variants:
          - text: Hourly charges for the NAT gateway
          - text: The NAT gateway, billed for each hour
        explanation:
          text: Correct. The action named only the instances. A NAT gateway bills every hour it exists, and the instances' EBS volumes keep billing too.
      - id: data-out
        text: Data out from the instances to the internet
        variants:
          - text: Internet data-out charges from the instances
          - text: Data the instances send out to the internet
        explanation:
          text: Stopped instances send nothing, so there's no data out to charge.
      - id: action-fee
        text: A fee per instance that the action stops
        variants:
          - text: A charge for each instance the action stops
          - text: Per-stop fees for each instance stopped
        explanation:
          text: Budget actions have no per-stop fee. Beyond the first two, an action-enabled budget has a small daily charge (as of 2026-10-24), not a per-instance one.
    correct_answers: [nat-hours]
    explanation:
      text: |
        Even with an action, a budget isn't a cap. An action stops only what it names or blocks only
        what comes next, and it acts on data that's hours old. Storage, NAT gateways and anything
        else you didn't target keep billing, and nothing is deleted. Only deleting the resources
        ends every charge.
    hint:
      text: Which resource in this environment bills on the time meter and wasn't named in the action?

  - id: q11-slow-growth-needs-budget
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Cost Anomaly Detection tells you when spending is unusual, not when it is high"
    task: "4.2"
    level: application
    topics: [budgets, cost-anomaly-detection]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A subscription company's AWS spending grows a little every month as it gains customers.
        The owner wants to be told when this year's total is heading past $60,000, the amount the
        board approved. Cost Anomaly Detection is already on. Which tool should the owner add?
    choices:
      - id: annual-budget
        text: An annual cost budget in AWS Budgets
        variants:
          - text: A yearly cost budget, in AWS Budgets
          - text: AWS Budgets, with an annual cost budget
        explanation:
          text: Correct. A budget compares cost with the limit you set, here the board's $60,000, and can alert on actual or forecasted cost.
      - id: anomaly-again
        text: A second Cost Anomaly Detection monitor
        variants:
          - text: Another monitor in Cost Anomaly Detection
          - text: An extra AWS Cost Anomaly Detection monitor
        explanation:
          text: Steady growth is normal to anomaly detection, which allows for natural growth. It doesn't compare spending with a number the owner chose.
      - id: pricing-calculator
        text: An estimate in AWS Pricing Calculator
        variants:
          - text: An AWS Pricing Calculator estimate
          - text: The yearly total from the Pricing Calculator
        explanation:
          text: The calculator prices a design from assumptions. It doesn't watch real spending or send alerts.
      - id: cur
        text: A Cost and Usage Report export
        variants:
          - text: A CUR 2.0 export in AWS Data Exports
          - text: Cost and Usage Report files in S3
        explanation:
          text: The CUR delivers line items to a bucket; it alerts nobody.
    correct_answers: [annual-budget]
    explanation:
      text: |
        AWS Budgets and Cost Anomaly Detection both alert, but on different questions. A budget
        compares cost with a number you chose; anomaly detection compares cost with what is normal
        for you, and slow, steady growth looks normal. Only a fixed limit notices that the total has
        crossed what the business wanted to spend, which is why the guide's primer sets up both.
    hint:
      text: Is the owner's worry that spending is unusual, or that it passes a chosen number?

  - id: q11-new-small-charge-anomaly
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Cost Anomaly Detection tells you when spending is unusual, not when it is high"
    task: "4.2"
    level: application
    topics: [cost-anomaly-detection, budgets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An accounting firm's AWS bill has been steady at about $900 a month for a year, with a
        monthly budget of $1,200. One morning, a forgotten test database starts adding about $4 a
        day in a service the firm uses lightly every month. Which tool is most likely to flag it
        within a day or two?
    choices:
      - id: anomaly-detection
        text: AWS Cost Anomaly Detection
        variants:
          - text: A Cost Anomaly Detection monitor
          - text: The AWS Cost Anomaly Detection service
        explanation:
          text: Correct. It learns the firm's normal pattern, and a new daily cost in a lightly used service stands out against it, even though the total stays under budget.
      - id: budget-actual
        text: The $1,200 budget's actual-cost alert
        variants:
          - text: An actual-cost alert on the $1,200 budget
          - text: The monthly budget's alert on actual cost
        explanation:
          text: An extra $4 a day keeps the month well under $1,200, so the budget's actual-cost alert may never fire.
      - id: cost-explorer
        text: AWS Cost Explorer's monthly view
        variants:
          - text: The monthly chart in AWS Cost Explorer
          - text: Cost Explorer, looking at the month
        explanation:
          text: Cost Explorer shows the charge if someone looks, but it sends no alert of its own.
      - id: pricing-calculator
        text: AWS Pricing Calculator
        variants:
          - text: The AWS Pricing Calculator
          - text: Pricing Calculator, from AWS
        explanation:
          text: The calculator estimates designs before they're built. It never sees actual spending.
    correct_answers: [anomaly-detection]
    explanation:
      text: |
        A budget compares cost with a number you chose; Cost Anomaly Detection compares cost with
        what is normal for you. A small new daily charge in a service you normally use only a little can be an
        anomaly long before any budget notices. Anomaly detection then names likely root causes, by
        service, account, Region and usage type.
    hint:
      text: The total stays well under the limit. What else about this charge is unusual?

  - id: q11-anomaly-detection-two-traits
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Cost Anomaly Detection tells you when spending is unusual, not when it is high"
    task: "4.2"
    level: understanding
    topics: [cost-anomaly-detection]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which two statements about AWS Cost Anomaly Detection are correct? (Select TWO.)
    choices:
      - id: learns-pattern
        text: It uses machine learning to learn your normal spending
        variants:
          - text: Machine learning teaches it your usual spending pattern
          - text: It learns your normal spending pattern with machine learning
        explanation:
          text: Correct. It learns rhythms such as weekly cycles and steady growth, and alerts when spending departs from them.
      - id: stops-resource
        text: It stops the resource that caused an anomaly
        variants:
          - text: The resource behind an anomaly is stopped by it
          - text: It shuts down whatever caused the anomaly
        explanation:
          text: Like Budgets alerts, it only tells people; it never stops anything.
      - id: root-causes
        text: It names likely root causes, such as service and Region
        variants:
          - text: It points to likely causes, such as service and Region
          - text: Likely root causes, by service and Region, are listed
        explanation:
          text: Correct. It ranks likely root causes by cost, by service, account, Region and usage type.
      - id: no-history
        text: It detects anomalies in a new service from its first day
        variants:
          - text: A service's anomalies are caught from its first day of use
          - text: New services are covered from the first day they're used
        explanation:
          text: A service you've just started using needs about 10 days of history before anomalies in it can be detected.
      - id: per-monitor-fee
        text: It charges a monthly fee for each cost monitor
        variants:
          - text: Each cost monitor carries a monthly fee
          - text: Cost monitors are billed monthly, one by one
        explanation:
          text: Cost Anomaly Detection has no charge (as of 2026-10-24).
    correct_answers: [learns-pattern, root-causes]
    explanation:
      text: |
        AWS Cost Anomaly Detection learns your normal spending pattern and alerts when spending
        departs from it, through a cost monitor (what to watch) and an alert subscription (who hears
        and when). It names likely root causes and costs nothing. It needs history, works on data up
        to a day old, and, like Budgets, never stops anything.

  - id: q11-cost-explorer-two-jobs
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Cost Explorer shows where the money went, and forecasts what comes next"
    task: "4.2"
    level: understanding
    topics: [cost-explorer]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A finance manager is learning AWS Cost Explorer. Which two can it do? (Select TWO.)
    choices:
      - id: email-limit
        text: Email her when cost passes a limit she sets
        variants:
          - text: Send her an email once cost passes her limit
          - text: Alert her by email when cost exceeds her limit
        explanation:
          text: Alerting on a limit you set is AWS Budgets' job.
      - id: forecast
        text: Forecast future spending from past usage, with a range
        variants:
          - text: Predict future cost from past usage, as a range
          - text: Project spending ahead from history, with a range
        explanation:
          text: Correct. Its forecast comes with a prediction interval, a range the real figure should usually fall in.
      - id: estimate-design
        text: Estimate the cost of a design not yet built
        variants:
          - text: Price a design that doesn't exist yet
          - text: Work out the cost of an unbuilt design
        explanation:
          text: That's AWS Pricing Calculator. Cost Explorer works from usage you already have.
      - id: recommendations
        text: Recommend Savings Plans and Reserved Instances to buy
        variants:
          - text: Suggest Reserved Instances and Savings Plans purchases
          - text: Advise which Savings Plans and RIs to purchase
        explanation:
          text: Correct. It bases the recommendations on your own usage history.
      - id: stop-resources
        text: Stop resources whose cost is growing too fast
        variants:
          - text: Stop resources when their cost grows too quickly
          - text: Shut down resources with fast-rising costs
        explanation:
          text: Cost Explorer shows and forecasts; it never changes your resources.
    correct_answers: [forecast, recommendations]
    explanation:
      text: |
        AWS Cost Explorer is the tool for "where did the money go, and where is it heading?" It
        filters and groups your costs by service, account, Region, usage type, tag and more,
        forecasts future spending from your history with a prediction interval, and recommends
        Savings Plans and Reserved Instances. It alerts nobody and changes nothing.

  - id: q11-cur-name-today
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "The Cost and Usage Report holds every line item, delivered through Data Exports"
    task: "4.2"
    level: recall
    topics: [cur, data-exports, legacy-names]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The exam guide names the "AWS Cost and Usage Report". As of 2026-10-24, where does a
        customer create this report in the Billing and Cost Management console?
    choices:
      - id: data-exports
        text: In AWS Data Exports, as a CUR 2.0 export
        variants:
          - text: As a CUR 2.0 export, in AWS Data Exports
          - text: Under AWS Data Exports, as CUR 2.0
        explanation:
          text: Correct. AWS calls CUR 2.0 the new and recommended way to get this data; the original report is listed there as the legacy export.
      - id: cost-explorer-prefs
        text: In AWS Cost Explorer's preferences
        variants:
          - text: Under Cost Explorer preferences
          - text: On the AWS Cost Explorer settings page
        explanation:
          text: Cost Explorer shows the same data as charts and CSV downloads, but the report itself is created elsewhere.
      - id: budgets-reports
        text: In AWS Budgets, as a budget report
        variants:
          - text: As a report within AWS Budgets
          - text: Under budget reports in AWS Budgets
        explanation:
          text: Budget reports email a summary of your budgets; they aren't the line-item report.
      - id: pricing-calculator
        text: In AWS Pricing Calculator, as a bill estimate
        variants:
          - text: As a bill estimate, in AWS Pricing Calculator
          - text: Under bill estimates in the Pricing Calculator
        explanation:
          text: A bill estimate models future changes to a bill; it isn't the record of past line items.
    correct_answers: [data-exports]
    explanation:
      text: |
        The exam guide says "AWS Cost and Usage Report". Today you create it in AWS Data Exports, a
        page of the Billing and Cost Management console that exports billing, cost and carbon
        emissions data. CUR 2.0 is AWS's recommended form; the original report is the legacy export.
        Either way, it's the most detailed cost data AWS provides, delivered to your S3 bucket.

  - id: q11-cur-for-chargeback-files
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "The Cost and Usage Report holds every line item, delivered through Data Exports"
    task: "4.2"
    level: application
    topics: [cur, data-exports]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A university's finance office charges 40 departments for their share of AWS each month.
        It needs hourly cost for every resource, with each department's cost allocation tag and the
        resource ID, delivered as files it can load into its own accounting database. What should it
        set up?
    choices:
      - id: cur-export
        text: A CUR 2.0 export with resource IDs, delivered to S3
        variants:
          - text: A Cost and Usage Report export, with resource IDs, to S3
          - text: CUR 2.0 files in S3, including resource IDs
        explanation:
          text: Correct. The CUR holds every line item, by hour, day or month, optionally with resource IDs and a column for each activated cost allocation tag, as CSV or Parquet files in your bucket.
      - id: cost-explorer-report
        text: A saved AWS Cost Explorer report for each department
        variants:
          - text: One saved Cost Explorer report per department
          - text: AWS Cost Explorer reports, saved per department
        explanation:
          text: Cost Explorer's charts are a quick picture, not every line item with resource IDs delivered as files for another system.
      - id: budget-per-dept
        text: An AWS Budgets budget for each department
        variants:
          - text: One AWS Budgets budget per department
          - text: Separate budgets in AWS Budgets, per department
        explanation:
          text: Budgets track spending against limits and send alerts; they don't deliver line items.
      - id: anomaly-monitor
        text: A Cost Anomaly Detection monitor for each department
        variants:
          - text: One Cost Anomaly Detection monitor per department
          - text: Separate anomaly monitors, one per department
        explanation:
          text: Anomaly detection alerts on unusual spending; it delivers no data files.
    correct_answers: [cur-export]
    explanation:
      text: |
        The Cost and Usage Report (CUR 2.0, created in AWS Data Exports) is the most detailed cost
        data AWS provides: every line item, optionally with resource IDs and a column per activated
        cost allocation tag, delivered to an S3 bucket at least once a day. Large organizations use
        it to charge each department its share; you can query it with Athena or load it into your
        own systems.
    hint:
      text: Which tool's output is raw files rather than charts or alerts?

  - id: q11-which-tools-alert
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Pick the tool by the question it answers"
    task: "4.2"
    level: understanding
    topics: [cost-tools, budgets, cost-anomaly-detection]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A small business wants AWS to tell someone by email while a workload is running, rather than
        waiting for someone to look. Which two tools send such alerts? (Select TWO.)
    choices:
      - id: pricing-calculator
        text: AWS Pricing Calculator
        variants:
          - text: The AWS Pricing Calculator
          - text: Pricing Calculator, from AWS
        explanation:
          text: The calculator is for before you build; it never sees actual spending.
      - id: budgets
        text: AWS Budgets
        variants:
          - text: The AWS Budgets service
          - text: Budgets, from AWS
        explanation:
          text: Correct. Budgets alert by email or SNS when actual or forecasted cost passes a threshold you set.
      - id: cost-explorer
        text: AWS Cost Explorer
        variants:
          - text: The AWS Cost Explorer tool
          - text: Cost Explorer, from AWS
        explanation:
          text: Cost Explorer analyzes and forecasts when someone opens it. It sends no alerts of its own.
      - id: anomaly-detection
        text: AWS Cost Anomaly Detection
        variants:
          - text: The AWS Cost Anomaly Detection service
          - text: Cost Anomaly Detection, from AWS
        explanation:
          text: Correct. It sends individual alerts through SNS, or daily or weekly email summaries, when spending is unusual.
      - id: cur
        text: AWS Cost and Usage Report
        variants:
          - text: The AWS Cost and Usage Report (CUR)
          - text: Cost and Usage Report, from AWS
        explanation:
          text: The CUR delivers raw files to S3; it alerts nobody.
    correct_answers: [budgets, anomaly-detection]
    explanation:
      text: |
        Each cost tool serves one stage. AWS Pricing Calculator estimates before you build. While a
        workload runs, AWS Budgets alerts when cost crosses your limit and AWS Cost Anomaly Detection
        alerts when it's unusual for you. After the fact, Cost Explorer shows where the money went,
        and the Cost and Usage Report delivers every line item. None of them changes your resources
        on its own.

  - id: q11-drill-down-next-step
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Worked example: one forgotten instance in January"
    task: "4.2"
    level: application
    topics: [cost-explorer, explain-a-bill]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In AWS Cost Explorer, an analyst groups last month's daily costs by service and sees that
        EC2 instance costs jumped on the 11th, while everything else stayed flat. What is the best
        next step to find the cause?
    choices:
      - id: open-cur
        text: Export the full Cost and Usage Report and search every line
        variants:
          - text: Pull the whole CUR and read through every line item
          - text: Search all line items in a full Cost and Usage Report
        explanation:
          text: The raw CUR is for questions the charts can't answer. Here the next level of grouping in Cost Explorer will show the answer in a click.
      - id: group-instance-type
        text: Filter to EC2 instances and group by instance type
        variants:
          - text: Keep only EC2 instance costs and group them by type
          - text: Narrow to EC2 instances, then group by instance type
        explanation:
          text: Correct. Drilling down one level at a time, from service to instance type or usage type, shows what started on the 11th.
      - id: new-budget
        text: Create a new budget for EC2 and wait for its alert
        variants:
          - text: Set up an EC2 budget and wait until it alerts
          - text: Make a budget for EC2, then wait for an alert
        explanation:
          text: A budget watches future spending. It doesn't explain a jump that has already happened.
      - id: pricing-calculator
        text: Re-price the whole setup in AWS Pricing Calculator
        variants:
          - text: Build a fresh estimate of everything in the calculator
          - text: Estimate the whole setup again in the Pricing Calculator
        explanation:
          text: An estimate works from assumptions; it can't show what actually ran on the 11th.
    correct_answers: [group-instance-type]
    explanation:
      text: |
        The expert's method: separate the flat from the changed, then drill down one level at a
        time, service first, then instance type or usage type. A new block that starts on one day
        usually means one new resource. Don't open the raw CUR for a question the charts can answer;
        once you know the instance type, CloudTrail's event history shows who launched it.
    hint:
      text: You already know the service. What's the next level of detail?

  # ---------------------------------------------------------------------------------------------
  # Lab 15 and Simulation S14
  # ---------------------------------------------------------------------------------------------

  - id: q11-trim-test-copy-hourly-items
    page: guide/11-paying-for-aws/05-lab-15-pricing-calculator.md
    section: "Part 2: find the hourly items, and trim the test copy"
    task: "4.1"
    level: application
    topics: [pricing-calculator, idle-cost]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer's draft test environment copies production: two web servers, an Application
        Load Balancer and two public IPv4 addresses, all running all month. One tester will use it
        for about 40 hours a week. Which change cuts the estimate the most?
    choices:
      - id: smaller-disks
        text: Halve the size of each server's EBS disk
        variants:
          - text: Make each server's EBS disk half the size
          - text: Cut every server's EBS disk to half its size
        explanation:
          text: Disks are a small part of the estimate. The big lines are the ones that bill every hour.
      - id: s3-cheaper-class
        text: Move the test copy's files to a colder S3 class
        variants:
          - text: Put the test copy's files in a colder S3 class
          - text: Store the test files in a cheaper, colder S3 class
        explanation:
          text: The draft holds little or no S3 data; storage class doesn't touch the hourly lines that make up most of the bill.
      - id: one-server-working-hours
        text: Drop the load balancer and one server; run the other in work hours
        variants:
          - text: Remove the load balancer and a server; run one in working hours
          - text: Keep one server for work hours; drop the other and the load balancer
        explanation:
          text: Correct. The servers, load balancer and public addresses bill every hour they exist. Removing whole hourly items, and running one server only when the tester works, removes most of the cost.
      - id: other-region
        text: Run the same copy in a cheaper Region
        variants:
          - text: Build the same copy in a lower-priced Region
          - text: Move the identical copy to a cheaper Region
        explanation:
          text: Regional price differences are small next to removing items that bill every hour for nothing.
    correct_answers: [one-server-working-hours]
    explanation:
      text: |
        Hourly items bill for every hour a resource exists, whether it does any work or not, and they
        make up almost all of a small web tier's estimate. One tester needs one server and no load
        balancer, and that server only needs to run in working hours. Its disk keeps billing while
        it's stopped, so only deleting the disk ends that charge.
    hint:
      text: Sort each line by whether it bills by the hour, by size, or by use.

  - id: q11-anomaly-silent-new-account
    page: guide/11-paying-for-aws/08-sim-guardrail-timeline.md
    section: "Decision 2: why is Cost Anomaly Detection silent?"
    task: "4.2"
    level: application
    topics: [cost-anomaly-detection, billing-data-lag]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A learner opened an AWS account a week ago and has barely used EC2. On Friday evening a
        tutorial launches several instances, which run all weekend. The account's Cost Anomaly
        Detection monitor sends nothing by Monday. What is the most likely reason?
    choices:
      - id: management-only
        text: It works in management accounts, not standalone ones
        variants:
          - text: Management accounts can use it; standalone ones can't
          - text: It runs in management accounts, not in standalone ones
        explanation:
          text: Anomaly detection works in standalone accounts too; the primer sets it up in one.
      - id: forecast-only
        text: It alerts on forecasted cost, not actual cost
        variants:
          - text: Its alerts cover forecasts, not actual cost
          - text: It watches forecasted cost rather than actual cost
        explanation:
          text: Forecasted alerts belong to AWS Budgets. Anomaly detection compares actual spending with your normal pattern.
      - id: needs-history
        text: It hasn't got enough history for EC2 in this account
        variants:
          - text: The account lacks enough EC2 history for it to judge
          - text: There isn't yet enough EC2 history to compare with
        explanation:
          text: Correct. A service needs about 10 days of history before anomalies in it can be detected, and the monitor also works on data up to a day old.
      - id: weekends-off
        text: It doesn't watch spending at weekends
        variants:
          - text: Weekend spending is outside what it checks
          - text: It pauses its checks over weekends
        explanation:
          text: It runs about three times a day, every day. The problem is the missing history and the data delay.
    correct_answers: [needs-history]
    explanation:
      text: |
        Cost Anomaly Detection compares spending with your own normal pattern, so it needs a pattern
        first: about 10 days of history for a service. It also works on data up to 24 hours old, and
        daily summaries arrive the next day. It's a backstop for established accounts, not a fast
        alarm for a new one, which is why budgets matter more at the start.
    hint:
      text: To call something unusual, a tool must first know what usual looks like.

  - id: q11-production-action-needs-approval
    page: guide/11-paying-for-aws/08-sim-guardrail-timeline.md
    section: "Decision 5 (challenge): write the bakery's production guardrails"
    task: "4.2"
    level: application
    topics: [budget-actions, budgets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An online shop wants guardrails on the AWS account that runs its live website and order
        database. Which budget action design best protects against overspending without risking
        the shop itself?
    choices:
      - id: auto-stop-prod
        text: Stop the live web servers automatically at 100%
        variants:
          - text: At 100%, automatically stop the live web servers
          - text: Have the live web servers stop by themselves at 100%
        explanation:
          text: Taking the shop offline to save a small overspend costs far more than it saves. The live site should never be stopped automatically.
      - id: auto-stop-db
        text: Stop the order database automatically at 85%
        variants:
          - text: At 85%, automatically stop the order database
          - text: Have the order database stop by itself at 85%
        explanation:
          text: Stopping the order database halts every sale. It's exactly what must never be stopped automatically.
      - id: no-alerts
        text: Rely on the action alone and turn off alert emails
        variants:
          - text: Depend only on the action, with alert emails off
          - text: Switch off alert emails and trust the action
        explanation:
          text: Alerts are how a person learns there's a problem. An action stops only what it names, so alerts must still reach someone who will act.
      - id: approval-in-prod
        text: Use an action that waits for a person to approve it
        variants:
          - text: Set the action to run only after someone approves
          - text: Choose an action that needs approval before it runs
        explanation:
          text: Correct. In production, an action that waits for approval lets a person judge the alert first. Automatic actions suit sandbox or test accounts.
    correct_answers: [approval-in-prod]
    explanation:
      text: |
        Budget actions can run automatically or wait until someone approves them. Automatic actions
        suit known, repeated risks in sandbox or test accounts, such as denying new launches. In
        production, alerts should reach a shared team address and any action should wait for
        approval, because stopping the live site or database automatically costs more than it
        saves.
    hint:
      text: What would an automatic stop cost a shop that is taking orders?

  # ---------------------------------------------------------------------------------------------
  # Lesson 11.04, Many accounts, one bill (and Lab 16)
  # ---------------------------------------------------------------------------------------------

  - id: q11-member-bills-informational
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Consolidated billing combines usage and sends one bill"
    task: "4.2"
    level: understanding
    topics: [consolidated-billing, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A design agency puts its six AWS accounts into one organization with consolidated billing.
        Which statement describes how the accounts are billed?
    choices:
      - id: each-pays
        text: Each account still pays its own invoice, with an org discount
        variants:
          - text: Every account pays its own invoice, minus an org discount
          - text: Separate invoices continue, each with an org discount
        explanation:
          text: Consolidated billing produces one bill. Member accounts' own bills are for information only.
      - id: fee-per-member
        text: The management account pays one bill, plus a fee per member
        variants:
          - text: One bill to the management account, with a per-member fee
          - text: The management account pays, plus a fee for each member
        explanation:
          text: Consolidated billing has no extra fee, and AWS Organizations has no additional charge.
      - id: largest-pays
        text: The account with the highest usage pays the whole bill
        variants:
          - text: Whichever account uses most pays everything
          - text: The heaviest-using account pays for all of them
        explanation:
          text: The paying account is always the management account, whatever each account uses.
      - id: management-pays
        text: The management account pays one bill; member bills are informational
        variants:
          - text: One bill, paid by the management account; members' bills are for information
          - text: The management account pays a single bill; members get bills for information
        explanation:
          text: Correct. The management account pays for every member account on one bill, and can see every account's costs.
    correct_answers: [management-pays]
    explanation:
      text: |
        Consolidated billing, a feature of AWS Organizations, sends every member account's charges to
        one bill, paid by the management account at no extra fee. Each member account's own bill is
        for information. For pricing, the organization counts as one account, so volume tiers apply
        to combined usage and commitment discounts are shared.

  - id: q11-combined-volume-tiers
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Consolidated billing combines usage and sends one bill"
    task: "4.2"
    level: understanding
    topics: [consolidated-billing, economies-of-scale]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Three accounts in one organization each store a large amount of data in S3 Standard. Each
        account's own storage is below the volume at which S3 Standard's per-GB rate drops, but the
        three together are above it. How are they priced under consolidated billing?
    choices:
      - id: separately
        text: Each account is priced on its own volume, at the higher rate
        variants:
          - text: Every account's volume is priced alone, at the higher rate
          - text: Each is charged on its own storage, at the higher rate
        explanation:
          text: That's how three standalone accounts would be priced. In an organization, the volumes are added together.
      - id: combined
        text: Their storage is added together, so part gets the lower rate
        variants:
          - text: The three volumes are combined, so some is priced lower
          - text: Combined storage reaches the cheaper tier for the excess
        explanation:
          text: Correct. For pricing, the organization counts as one account, so volume tiers apply to combined usage.
      - id: all-lowest
        text: All storage in the organization gets the lowest rate
        variants:
          - text: Every GB in the organization is priced at the lowest rate
          - text: The lowest rate applies to all the organization's storage
        explanation:
          text: "Tiers still apply in order: only the combined volume above each threshold gets the lower rate."
      - id: no-tiers
        text: Volume tiers don't apply inside an organization
        variants:
          - text: Organizations get no volume tiers at all
          - text: Tiered rates are switched off in an organization
        explanation:
          text: Tiers do apply, and they count everyone's usage together, which is one of consolidated billing's benefits.
    correct_answers: [combined]
    explanation:
      text: |
        For pricing, an organization with consolidated billing counts as one account. Volume tiers,
        such as S3 Standard's lower rate above a set amount stored, apply to the members' combined
        usage, so the organization reaches cheaper tiers sooner than any one account would. That is
        economies of scale applied across accounts.
    hint:
      text: Ask how many accounts AWS sees when it prices an organization's usage.

  - id: q11-savings-plan-shared-to-dev
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A commitment discount goes to its owner first, then to matching usage anywhere in the organization"
    task: "4.1"
    level: understanding
    topics: [discount-sharing, savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In an organization where nobody has changed the billing preferences, the `prod` account
        bought a Compute Savings Plan. In one hour, `prod` uses only half of the commitment, and
        the `dev` account runs eligible EC2 instances. What happens to the rest of `prod`'s
        commitment that hour?
    choices:
      - id: lost
        text: It goes unused, because the plan belongs to `prod`
        variants:
          - text: It's wasted, since the plan is `prod`'s
          - text: Nothing uses it; the plan belongs to `prod`
        explanation:
          text: That happens only in a standalone account, or when the management account turns sharing off.
      - id: covers-dev
        text: It covers `dev`'s eligible usage at the plan's rates
        variants:
          - text: The plan's rates apply to `dev`'s eligible usage
          - text: Eligible usage in `dev` gets the plan's discount
        explanation:
          text: Correct. The purchasing account comes first; the rest applies to eligible usage elsewhere in the organization.
      - id: carried-over
        text: It carries over to `prod`'s next busy hour
        variants:
          - text: It rolls into `prod`'s next busier hour
          - text: The next busy hour in `prod` can use it
        explanation:
          text: Savings Plans commitments never carry over from one hour to the next.
      - id: dev-pays-prod
        text: It covers `dev` once `dev` pays `prod` for it
        variants:
          - text: It helps `dev` after `dev` pays `prod` its share
          - text: The `dev` account must pay `prod` to get it
        explanation:
          text: No payment between accounts is needed; the management account pays one bill.
    correct_answers: [covers-dev]
    explanation:
      text: |
        A Savings Plan or Reserved Instance is a billing discount, not a machine, so it can move. Each
        hour it applies first to the purchasing account's usage, then to matching usage in other
        accounts of the organization, because for billing the organization counts as one account.
        Sharing is on by default; only the management account can turn it off.
    hint:
      text: For billing, how many accounts does an organization look like?

  - id: q11-ris-before-savings-plans
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A commitment discount goes to its owner first, then to matching usage anywhere in the organization"
    task: "4.1"
    level: recall
    topics: [discount-sharing, reserved-instances, savings-plans]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An organization owns both Reserved Instances and Savings Plans. In each hour, in what order
        does AWS apply them to usage?
    choices:
      - id: sp-first
        text: Savings Plans first, then Reserved Instances on the rest
        variants:
          - text: First the Savings Plans, then Reserved Instances on what's left
          - text: Savings Plans before Reserved Instances
        explanation:
          text: "It's the other way round: Reserved Instances apply first."
      - id: customer-choice
        text: Whichever order the customer sets for each hour
        variants:
          - text: In an order the customer chooses for each hour
          - text: The customer picks the order hour by hour
        explanation:
          text: The order is fixed by AWS. The management account controls who shares, not the order.
      - id: ri-first
        text: Reserved Instances first, then Savings Plans on the rest
        variants:
          - text: First the Reserved Instances, then Savings Plans on what's left
          - text: Reserved Instances before Savings Plans
        explanation:
          text: Correct. Savings Plans then cover the rest, EC2 Instance Savings Plans before Compute Savings Plans.
      - id: compute-first
        text: Compute Savings Plans first, then everything else
        variants:
          - text: First Compute Savings Plans, then the others
          - text: Compute Savings Plans ahead of all other commitments
        explanation:
          text: Compute Savings Plans come last, after Reserved Instances and EC2 Instance Savings Plans.
    correct_answers: [ri-first]
    explanation:
      text: |
        Each hour, Reserved Instances are applied first, to the purchasing account's matching usage
        and then to other accounts with sharing on. Savings Plans then cover what is left: EC2
        Instance Savings Plans before Compute Savings Plans, the owner's usage first, and the usage
        with the biggest saving first. Anything still uncovered is billed at On-Demand rates.

  - id: q11-zonal-capacity-stays-home
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A commitment discount goes to its owner first, then to matching usage anywhere in the organization"
    task: "4.1"
    level: understanding
    topics: [discount-sharing, reserved-instances, capacity]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The `analytics` account owns a zonal Reserved Instance that it isn't using this month. With
        sharing on, its discount covers a matching instance in the `reporting` account, in the same
        Availability Zone. What does `reporting` receive?
    choices:
      - id: discount-and-capacity
        text: The discount and the reserved capacity
        variants:
          - text: Both the discount and the capacity reservation
          - text: The reserved capacity along with the discount
        explanation:
          text: The capacity reservation stays with the account that bought the zonal Reserved Instance.
      - id: discount-only
        text: The discount, but not the reserved capacity
        variants:
          - text: Only the discount, without the capacity reservation
          - text: The discount alone; the capacity stays behind
        explanation:
          text: Correct. The discount travels; the capacity doesn't.
      - id: capacity-only
        text: The reserved capacity, but not the discount
        variants:
          - text: Only the capacity reservation, without the discount
          - text: The capacity alone; the discount stays behind
        explanation:
          text: "It's the reverse: the discount moves to matching usage, and the capacity stays with its owner."
      - id: nothing
        text: Nothing, because zonal reservations are never shared
        variants:
          - text: Neither, since zonal reservations can't be shared
          - text: Nothing at all; zonal reservations don't share
        explanation:
          text: The discount of a zonal Reserved Instance is shared like any other. Only its capacity reservation isn't.
    correct_answers: [discount-only]
    explanation:
      text: |
        In an organization, a Reserved Instance's discount follows matching usage across accounts
        unless sharing is turned off. A zonal Reserved Instance also reserves capacity, but that
        capacity serves only its own account, even when its discount covers another account's
        instance. The discount travels; the capacity doesn't.

  - id: q11-sharing-turned-off
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Discounts are shared across the organization unless the management account turns sharing off"
    task: "4.1"
    level: understanding
    topics: [discount-sharing]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The management account turns discount sharing off for the `dev` account. The `prod`
        account has Reserved Instances it isn't fully using, and `dev` runs matching instances. What
        happens?
    choices:
      - id: dev-still-covered
        text: "`dev` is still covered, because both are in the organization"
        variants:
          - text: "`dev` keeps the discount, as both share one organization"
          - text: "The discount still reaches `dev` inside the organization"
        explanation:
          text: With sharing off for `dev`, no other account's commitment can cover it. It still uses its own commitments, if it has any.
      - id: prod-refunded
        text: "`prod` is refunded for the hours it doesn't use"
        variants:
          - text: "`prod` gets a refund for the unused hours"
          - text: "The unused hours are refunded to `prod`"
        explanation:
          text: A Reserved Instance is billed every hour of its term, used or not. Sharing decides who benefits, not what you pay for the commitment.
      - id: dev-on-demand
        text: "`dev` pays On-Demand, and `prod`'s spare reservation goes unused"
        variants:
          - text: "`dev` is billed On-Demand while `prod`'s spare hours sit idle"
          - text: "`prod`'s spare reservation idles, and `dev` pays On-Demand"
        explanation:
          text: Correct. Both accounts must have sharing on for a discount to pass between them. The unused reservation is still billed, so turning sharing off can raise the bill.
      - id: dev-free
        text: "`dev`'s matching instances run without any charge"
        variants:
          - text: "`dev`'s matching instances are free of charge"
          - text: "No charge applies to `dev`'s matching instances"
        explanation:
          text: Turning sharing off never makes usage free; it makes `dev` pay On-Demand rates.
    correct_answers: [dev-on-demand]
    explanation:
      text: |
        The management account controls discount sharing. It can turn sharing off for any account,
        and both the purchasing and the receiving account must have sharing on for a discount to pass
        between them. Unused reservations are still paid for, so turning sharing off can raise the
        monthly bill, which is why AWS offers gentler group sharing.

  - id: q11-prioritized-group-sharing
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Discounts are shared across the organization unless the management account turns sharing off"
    task: "4.1"
    level: application
    topics: [discount-sharing, cost-categories]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's retail division paid for a set of Savings Plans and wants its own accounts to
        get first claim on the discount. Finance doesn't want any of the commitment to go to waste
        if the retail accounts can't use it all. Which setting fits?
    choices:
      - id: prioritized
        text: Prioritized group sharing for the retail group
        variants:
          - text: Retail's accounts in a prioritized sharing group
          - text: A prioritized group for the retail accounts
        explanation:
          text: Correct. A commitment serves its owner, then the group, then the rest of the organization, so retail comes first and nothing is wasted.
      - id: turn-off-others
        text: Turn sharing off for every account outside retail
        variants:
          - text: Switch off sharing for all non-retail accounts
          - text: Disable sharing everywhere except retail's accounts
        explanation:
          text: That keeps the discount in retail, but any commitment retail can't use is wasted, and the bill can rise.
      - id: restricted
        text: Restricted group sharing for the retail group
        variants:
          - text: Retail's accounts in a restricted sharing group
          - text: A restricted group for the retail accounts
        explanation:
          text: Restricted group sharing never lets the commitment leave the group, even if it goes unused.
      - id: separate-org
        text: Move retail's accounts into their own organization
        variants:
          - text: Put the retail accounts in a separate organization
          - text: Give retail its own new organization
        explanation:
          text: A separate organization would stop all sharing with the rest of the company, so unused commitment would be wasted.
    correct_answers: [prioritized]
    explanation:
      text: |
        Besides turning sharing on or off, the management account can choose group sharing, with
        groups defined by cost categories. Prioritized group sharing serves the owner, then the group,
        then the rest of the organization. Restricted group sharing keeps the commitment inside the
        group even if it goes unused. AWS warns that turning sharing off can raise the bill.
    hint:
      text: Two group options exist. Which one still lets leftover discount reach other accounts?

  - id: q11-tag-types-in-common
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A tag reaches your cost reports only after you activate it"
    task: "4.2"
    level: understanding
    topics: [cost-allocation-tags]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Cost allocation tags come in two types: AWS-generated and user-defined. Which two statements
        are true of both types? (Select TWO.)
    choices:
      - id: must-activate
        text: They must be activated before cost reports show them
        variants:
          - text: Cost reports show them only once they're activated
          - text: Activation is needed before reports can use them
        explanation:
          text: Correct. Whichever type, nothing reaches Cost Explorer, Budgets or the CUR until someone activates the key.
      - id: applied-by-aws
        text: AWS applies them to resources automatically
        variants:
          - text: They're put on resources by AWS, automatically
          - text: Resources get them from AWS without anyone tagging
        explanation:
          text: Only AWS-generated tags, such as `aws:createdBy`, are applied by AWS. User-defined tags are yours to apply.
      - id: from-activation
        text: By default they label usage only from activation onward
        variants:
          - text: By default they mark only usage after activation
          - text: Usage is labeled from activation on, by default
        explanation:
          text: Correct. Neither type is retroactive by default; only a backfill reaches earlier months.
      - id: user-prefix
        text: Reports show them with the prefix `user:`
        variants:
          - text: In reports, they carry the `user:` prefix
          - text: Their names appear in reports as `user:` keys
        explanation:
          text: Only user-defined tags get the `user:` prefix; AWS-generated tags appear with `aws:`.
      - id: any-member
        text: Any member account can activate them for itself
        variants:
          - text: Each member account activates them on its own
          - text: Member accounts can each switch them on themselves
        explanation:
          text: In an organization, the management account activates cost allocation tags. A standalone account can activate its own user-defined tags.
    correct_answers: [must-activate, from-activation]
    explanation:
      text: |
        AWS-generated tags (such as `aws:createdBy`, applied by AWS) and user-defined tags (your own
        keys, shown as `user:` in reports) differ in who applies them and how they appear. They are
        the same in the step people miss: both must be activated as cost allocation tags before any
        cost report shows them, and both label usage only from activation onward unless a backfill
        is requested.

  - id: q11-budget-cannot-filter-tag
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: '"A tag shows costs" is wrong'
    task: "4.2"
    level: understanding
    topics: [cost-allocation-tags, budgets]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company tagged all its resources `department=research` a month ago. The research lead now
        tries to create an AWS Budgets budget filtered to that tag, but the `department` key isn't
        offered. What is the most likely cause?
    choices:
      - id: budgets-no-tags
        text: AWS Budgets can't filter by tags of any kind
        variants:
          - text: Budgets has no way to filter by any tag
          - text: No tag can be used as a filter in AWS Budgets
        explanation:
          text: Budgets can filter by cost allocation tags once they're activated.
      - id: ninety-days
        text: New tags take 90 days to reach billing tools
        variants:
          - text: Billing tools see new tags only after 90 days
          - text: A tag reaches billing tools 90 days after use
        explanation:
          text: After activation, a tag takes up to 24 hours to appear; there's no 90-day wait.
      - id: not-activated
        text: The key was never activated as a cost allocation tag
        variants:
          - text: Nobody activated the key as a cost allocation tag
          - text: The key hasn't been switched on for cost allocation
        explanation:
          text: Correct. A tag on a resource is invisible to billing tools until its key is activated.
      - id: aws-only
        text: Only AWS-generated tags can be used in budgets
        variants:
          - text: Budgets accept AWS-generated tags alone
          - text: Just AWS-generated tags work in a budget
        explanation:
          text: Both types work in Budgets, Cost Explorer and the CUR once they're activated.
    correct_answers: [not-activated]
    explanation:
      text: |
        Tagging a resource isn't enough for billing. In the Billing and Cost Management console,
        someone in the management account (or a standalone account) activates the tag keys billing
        should use. Only those keys appear in Cost Explorer, Budgets, Cost Anomaly Detection and the
        CUR, up to 24 hours after activation, and only for usage from then on.
    hint:
      text: Finding resources by tag and grouping costs by tag are separate systems.

  - id: q11-backfill-needs-tag-at-the-time
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: '"A tag shows costs" is wrong'
    task: "4.2"
    level: application
    topics: [cost-allocation-tags, tag-backfill]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team first tagged its resources `project=atlas` this month and activated the key the same
        day. Finance now wants last quarter's costs grouped by `project`. What can the management
        account do?
    choices:
      - id: backfill-works
        text: Request a tag backfill, which labels last quarter's costs
        variants:
          - text: Ask for a tag backfill to label last quarter
          - text: Backfill the tag so last quarter's costs carry it
        explanation:
          text: A backfill re-applies the activation to earlier months only where the resource carried the tag at the time. These resources had no tag last quarter.
      - id: reactivate
        text: Deactivate and reactivate the key to reset its start date
        variants:
          - text: Turn the key off and on to move its start date back
          - text: Switch the key off, then on, to reset when it started
        explanation:
          text: Activation counts from the moment it happens. Toggling it doesn't reach back in time.
      - id: nothing-possible
        text: Nothing; those months can't carry a tag they never had
        variants:
          - text: No tool can label months when the tag wasn't on
          - text: Nothing, as the tag wasn't on the resources then
        explanation:
          text: Correct. Tagging a resource today never labels last quarter's costs, even with a backfill.
      - id: cur-history
        text: Turn on the CUR, which adds tags to past months
        variants:
          - text: Start a CUR export, which tags earlier months
          - text: Enable the CUR to apply the tag to past months
        explanation:
          text: The CUR shows activated tags as columns; it can't add a tag to months when the resource had none.
    correct_answers: [nothing-possible]
    explanation:
      text: |
        Activation labels usage from then on; it isn't retroactive by default. A management account
        can request a tag backfill, which re-applies the current activation to up to the previous
        twelve months, but only where the resource carried the tag at the time. Months before the
        resource was tagged stay empty, which is why the guide says to tag on creation and activate
        on day one.
    hint:
      text: A backfill reapplies the activation. What must already be true of the resource in those months?

  - id: q11-who-activates-in-org
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A tag reaches your cost reports only after you activate it"
    task: "4.2"
    level: recall
    topics: [cost-allocation-tags, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A member account in an organization has tagged its resources `team=kitchen`. Who can
        activate the `team` key as a cost allocation tag?
    choices:
      - id: member-account
        text: The member account that applied the tags
        variants:
          - text: The member account where the tags were applied
          - text: Whichever member account put the tags on
        explanation:
          text: In an organization, a member account can't activate cost allocation tags. A standalone account can activate its own.
      - id: aws-automatic
        text: AWS, automatically, a day after tagging
        variants:
          - text: AWS does it on its own, a day after tagging
          - text: Nobody; AWS activates it a day after tagging
        explanation:
          text: AWS lists the key on the cost allocation tags page within about a day, but someone still has to activate it.
      - id: management-account
        text: The organization's management account
        variants:
          - text: The management account of the organization
          - text: The organization's paying management account
        explanation:
          text: Correct. In an organization, the management account activates tag keys for billing, for all accounts.
      - id: any-iam-admin
        text: Any IAM administrator in any member account
        variants:
          - text: An IAM administrator in any member account
          - text: Whichever member account's IAM administrator acts
        explanation:
          text: Administrator rights in a member account don't help; activation belongs to the management account.
    correct_answers: [management-account]
    explanation:
      text: |
        In an organization, only the management account activates cost allocation tags, and a
        standalone account activates its own. An account that moves to a new organization loses its
        activations, and the new management account must activate the keys again.

  - id: q11-tag-key-case-split
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A tag reaches your cost reports only after you activate it"
    task: "4.2"
    level: application
    topics: [cost-allocation-tags]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        One team tags its resources `Team=delivery` and another tags theirs `team=delivery`. Both
        keys are activated as cost allocation tags. What will a Cost Explorer report grouped by the
        `team` key show?
    choices:
      - id: merged
        text: Both teams' costs together, because tag keys ignore case
        variants:
          - text: Both teams combined, since keys aren't case-sensitive
          - text: One combined group, as tag keys ignore letter case
        explanation:
          text: Tag keys are case-sensitive. `Team` and `team` are two different keys.
      - id: only-lowercase
        text: Only the costs tagged with the lowercase key
        variants:
          - text: Just the costs under the lowercase key
          - text: Only costs carrying the lowercase `team` key
        explanation:
          text: Correct. `Team` is a separate key, so its costs appear only when you group by `Team`, and fall under "no tag" here.
      - id: error
        text: Nothing, because two similar keys block the report
        variants:
          - text: No data, since the similar keys block reporting
          - text: An empty report, blocked by the two similar keys
        explanation:
          text: Similar keys don't block anything; they simply count as two keys.
      - id: capital-only
        text: Only the costs tagged with the capitalized key
        variants:
          - text: Just the costs under the capitalized key
          - text: Only costs carrying the capitalized `Team` key
        explanation:
          text: The report groups by the key you chose, `team`; the capitalized key is a different one.
    correct_answers: [only-lowercase]
    explanation:
      text: |
        Cost allocation tag keys are case-sensitive: `team` and `Team` are two different keys, and a
        report grouped by one doesn't include the other. That's why teams agree the exact spelling
        of each key before tagging, and enforce it, for example with AWS Organizations tag policies.

  - id: q11-createdby-who-launched
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A tag reaches your cost reports only after you activate it"
    task: "4.2"
    level: application
    topics: [cost-allocation-tags]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's cost reports keep showing expensive resources that nobody admits to creating.
        It wants each new resource's costs to carry the identity of whoever created it, without
        relying on people to tag their work. What should the management account do?
    choices:
      - id: createdby
        text: Activate the AWS-generated `aws:createdBy` tag
        variants:
          - text: Switch on the AWS-generated tag `aws:createdBy`
          - text: Turn on `aws:createdBy`, the AWS-generated tag
        explanation:
          text: Correct. AWS applies it to supported resources created after activation, recording the IAM user, role or root user that created them.
      - id: user-owner-tag
        text: Create a user-defined `owner` tag key and activate it
        variants:
          - text: Activate a new user-defined tag key named `owner`
          - text: Define an `owner` tag of its own and activate that
        explanation:
          text: A user-defined key is applied by people, which is the step the company can't rely on.
      - id: cost-category
        text: Build a cost category with one rule per account
        variants:
          - text: Set up a cost category with a rule for each account
          - text: Create a cost category, one rule per account
        explanation:
          text: A cost category groups costs by rules such as account or tag; it doesn't record who created a resource.
      - id: backfill
        text: Request a tag backfill for the last twelve months
        variants:
          - text: Ask for a backfill covering the past twelve months
          - text: Backfill tags across the previous twelve months
        explanation:
          text: A backfill re-applies existing activations to past months; it doesn't create a record of who launched anything.
    correct_answers: [createdby]
    explanation:
      text: |
        AWS-generated cost allocation tags are created and applied by AWS. The main one,
        `aws:createdBy`, records who created a resource. Only the management account can activate it,
        once, for every member account, and AWS applies it only to supported resources created after
        activation, in a listed set of Regions. Activating it early is what makes it useful.
    hint:
      text: Which type of tag doesn't depend on a person remembering to apply it?

  - id: q11-accounts-split-without-tags
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Give each team a view: accounts first, tags inside shared accounts, cost categories to name the groups"
    task: "4.2"
    level: understanding
    topics: [cost-allocation, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company gives each of its four product teams its own AWS account in one organization, and
        each team runs only its own resources there. What does the company need in order to see
        each team's costs separately?
    choices:
      - id: tags-required
        text: A team tag on every resource, activated for billing
        variants:
          - text: An activated team tag on each resource
          - text: Every resource tagged by team, with the key activated
        explanation:
          text: Tags split costs inside an account. When each team has its own account, the account already does the job.
      - id: cur-required
        text: A Cost and Usage Report, since Cost Explorer can't split by account
        variants:
          - text: The CUR, because Cost Explorer can't group by account
          - text: A CUR export, as Cost Explorer has no account grouping
        explanation:
          text: Cost Explorer can filter and group by account; the CUR isn't required for this.
      - id: separate-orgs
        text: A separate organization for each team
        variants:
          - text: Its own organization for every team
          - text: One organization per team
        explanation:
          text: Separate organizations would split the bill and stop shared discounts and combined tiers, for no gain.
      - id: nothing-extra
        text: Nothing extra; each charge already belongs to an account
        variants:
          - text: No extra step; every charge already has an account
          - text: Nothing more, as charges already belong to accounts
        explanation:
          text: Correct. Accounts split costs with no extra work, and account costs can't be mislabeled. Tags are needed only inside an account that several teams share.
    correct_answers: [nothing-extra]
    explanation:
      text: |
        Every charge already belongs to an account, so accounts split costs with no extra work.
        Tags split costs inside an account that several teams share, and a cost category puts the
        two together under names the business uses. Use accounts wherever they already split the
        costs, and tag only where they can't.

  - id: q11-split-charge-shared-account
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "Give each team a view: accounts first, tags inside shared accounts, cost categories to name the groups"
    task: "4.2"
    level: application
    topics: [cost-categories, cost-allocation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company groups costs into a cost category with the values `Sales`, `Support` and
        `Shared`. The `Shared` value holds a central logging account that every team depends on.
        Finance wants those logging costs spread across the other two values in proportion to their
        own costs. Which feature does that?
    choices:
      - id: discount-sharing
        text: Discount sharing between the accounts
        variants:
          - text: Sharing discounts across the accounts
          - text: Commitment discount sharing between accounts
        explanation:
          text: Discount sharing decides which account's usage a commitment covers. It doesn't spread one account's costs over others.
      - id: tag-backfill
        text: A tag backfill on the logging account
        variants:
          - text: Backfilling tags in the logging account
          - text: A backfill of the logging account's tags
        explanation:
          text: A backfill re-applies tag activations to past months; it doesn't divide costs.
      - id: consolidated-billing
        text: Consolidated billing for the logging account
        variants:
          - text: The logging account's consolidated billing
          - text: Putting the logging account on consolidated billing
        explanation:
          text: Consolidated billing puts all accounts on one bill. It doesn't decide how a shared account's costs are divided.
      - id: split-charge
        text: A split charge rule in the cost category
        variants:
          - text: The cost category's split charge rule
          - text: A rule that splits charges, in the cost category
        explanation:
          text: Correct. A split charge rule divides one value's costs among others, proportionally, evenly or by fixed percentages.
    correct_answers: [split-charge]
    explanation:
      text: |
        A cost category is a set of rules that assigns each cost to a value by account, tag, service
        and more. A split charge rule divides one value's costs among others, proportionally, evenly
        or by fixed percentages, which is how shared costs such as a logging account get spread
        fairly. Cost categories aren't named in the exam guide; the guide teaches them as how real
        organizations finish the job tags start.
    hint:
      text: The tool that names the groups also has a rule for dividing one group's costs.

flashcards:

  - id: c11-idle-load-balancer-vs-lambda
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Time-based charges run whether or not anyone uses the resource"
    task: "4.1"
    level: understanding
    topics: [cost-drivers, idle-cost]
    front:
      text: Why does an idle load balancer keep billing overnight, while a Lambda function nobody calls costs nothing?
    back:
      text: The load balancer is on the time meter, billed for every hour it exists. Lambda is on the requests meter, billed only when something invokes it.

  - id: c11-in-free-across-charged
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: '"In is free, out is charged" is only half the rule'
    task: "4.1"
    level: understanding
    topics: [data-transfer]
    front:
      text: Besides data out to the internet, which two kinds of data transfer are charged even though the data never leaves AWS?
    back:
      text: Data across Availability Zones (charged in each direction) and data between Regions.

  - id: c11-explain-bill-question
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "Worked example: why did the bakery's bill nearly triple?"
    task: "4.1"
    level: understanding
    topics: [explain-a-bill]
    front:
      text: After sorting a grown bill by meter, what question sorts each increase into "fine" or "review this"?
    back:
      text: Did it grow with customer use, or did someone add it? Customer-driven lines fall back when demand does; an added resource, such as a NAT gateway, keeps billing.

  - id: c11-free-plan-two-clocks
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: recall
    topics: [free-tier]
    front:
      text: What are the Free plan's "two clocks", and what happens when one runs out (as of 2026-10-24)?
    back:
      text: Six months from sign-up, and the credit balance. Whichever runs out first ends the plan, and the account closes; upgrading within 90 days restores access.

  - id: c11-upgrade-one-way
    page: guide/11-paying-for-aws/01-how-aws-charges.md
    section: "The Free Tier now: two plans, credits and two clocks"
    task: "4.2"
    level: recall
    topics: [free-tier, organizations]
    front:
      text: Can an account move from the Paid plan back to the Free plan, and what is one action that upgrades a Free plan account automatically?
    back:
      text: No; upgrading is one way. Joining AWS Organizations is one action that upgrades a Free plan account automatically (as of 2026-10-24).

  - id: c11-commitment-doesnt-renew
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "A commitment trades flexibility for a lower rate"
    task: "4.1"
    level: recall
    topics: [reserved-instances]
    front:
      text: A one-year Reserved Instance reaches the end of its term while the matching instance keeps running. What happens?
    back:
      text: Nothing renews. The instance simply carries on at On-Demand rates until you buy a new commitment.

  - id: c11-savings-plan-each-hour
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Savings Plans: commit to dollars per hour, in four types"
    task: "4.1"
    level: understanding
    topics: [savings-plans]
    front:
      text: In a Savings Plan, what happens to usage above the hourly commitment, and to commitment that goes unused in an hour?
    back:
      text: Usage above it is charged at On-Demand rates. Unused commitment is still paid for and lost; it never carries over to another hour.

  - id: c11-compute-or-ec2-instance-plan
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Compute or EC2 Instance Savings Plan: flexibility or a deeper discount"
    task: "4.1"
    level: understanding
    topics: [savings-plans]
    front:
      text: Compute or EC2 Instance Savings Plan? Which question decides?
    back:
      text: "Will the instance family or Region change during the term, or will work move to Fargate or Lambda? Yes: Compute. Confident it won't: EC2 Instance, for the deeper discount."

  - id: c11-standard-or-convertible-later
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Standard or Convertible"
    task: "4.1"
    level: recall
    topics: [reserved-instances]
    front:
      text: What can you do later with a Standard Reserved Instance that you can't with a Convertible one, and the reverse?
    back:
      text: Standard can be sold on the Reserved Instance Marketplace. Convertible can be exchanged for another of a different family, operating system or tenancy, of equal or higher value.

  - id: c11-zonal-or-regional
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Zonal or Regional"
    task: "4.1"
    level: understanding
    topics: [reserved-instances, capacity]
    front:
      text: Zonal or Regional Reserved Instance? What does each give that the other doesn't?
    back:
      text: Zonal reserves capacity in one Availability Zone. Regional reserves none, but its discount applies in any AZ and, for Linux on shared tenancy, to any size in the family.

  - id: c11-capacity-reservation-no-discount
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: '"A Capacity Reservation gets you a discount" is wrong'
    task: "4.1"
    level: understanding
    topics: [capacity-reservations]
    front:
      text: An On-Demand Capacity Reservation gives no discount of its own. What lowers the price of instances in one?
    back:
      text: A Savings Plan or a Regional Reserved Instance, whose discounts apply to it. A zonal Reserved Instance's discount doesn't.

  - id: c11-host-or-instance
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Dedicated Hosts and Dedicated Instances: hardware with no other customers"
    task: "4.1"
    level: understanding
    topics: [dedicated-hosts, dedicated-instances]
    front:
      text: Dedicated Host or Dedicated Instance? Which need decides?
    back:
      text: "Licenses counted per socket or core, which need a visible physical server: Dedicated Host. Only a rule against sharing hardware with other customers: Dedicated Instance, the simpler one."

  - id: c11-spot-fits-what
    page: guide/11-paying-for-aws/02-purchasing-options.md
    section: "Spot Instances: deep discounts for work that can stop"
    task: "4.1"
    level: understanding
    topics: [spot]
    front:
      text: What must be true of a workload for Spot Instances to suit it, and what warning does EC2 give before taking one back?
    back:
      text: It can stop and pick up again, or is split across many instances. EC2 gives a two-minute interruption notice.

  - id: c11-commit-to-baseline
    page: guide/11-paying-for-aws/07-sim-purchasing-option-tree.md
    section: "Decision 2: commit to 0, 2 or 6 servers?"
    task: "4.1"
    level: understanding
    topics: [baseline, savings-plans]
    front:
      text: Why commit only to a workload's baseline and run the peaks On-Demand?
    back:
      text: A commitment is paid every hour of its term, used or not. The baseline uses every committed hour; commitment sized for peaks sits idle most of the time and can cost more than On-Demand.

  - id: c11-budget-without-action
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: understanding
    topics: [budgets]
    front:
      text: A budget with no actions passes 100%. What happens to the resources causing the spending?
    back:
      text: Nothing. The budget sends alerts, hours after the spending; resources keep running and billing until someone changes them.

  - id: c11-budget-action-kinds
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: '"A budget caps your spending" is wrong'
    task: "4.2"
    level: recall
    topics: [budget-actions]
    front:
      text: Name the three kinds of budget action.
    back:
      text: Apply an IAM policy; attach a service control policy (management account only); stop chosen EC2 or RDS instances. None deletes anything.

  - id: c11-budget-or-anomaly
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Cost Anomaly Detection tells you when spending is unusual, not when it is high"
    task: "4.2"
    level: understanding
    topics: [budgets, cost-anomaly-detection]
    front:
      text: What does AWS Budgets compare your cost with, and what does Cost Anomaly Detection compare it with?
    back:
      text: Budgets compares it with a number you chose. Cost Anomaly Detection compares it with what is normal for you, so slow steady growth looks normal to it.

  - id: c11-tool-by-keyword
    page: guide/11-paying-for-aws/03-estimate-watch-analyze.md
    section: "Pick the tool by the question it answers"
    task: "4.2"
    level: recall
    topics: [cost-tools]
    front:
      text: A cost question says "most detailed" or "every line item in S3". Which tool, under its exam name and its current form?
    back:
      text: The AWS Cost and Usage Report, today created as a CUR 2.0 export in AWS Data Exports and delivered to your S3 bucket.

  - id: c11-discount-sharing-order
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: "A commitment discount goes to its owner first, then to matching usage anywhere in the organization"
    task: "4.1"
    level: recall
    topics: [discount-sharing]
    front:
      text: In an organization with sharing on, in what order does a Reserved Instance's discount look for usage each hour?
    back:
      text: First the purchasing account's matching usage, then matching usage in any other account with sharing on. Savings Plans apply after Reserved Instances.

  - id: c11-tag-reaches-reports
    page: guide/11-paying-for-aws/04-many-accounts-one-bill.md
    section: '"A tag shows costs" is wrong'
    task: "4.2"
    level: understanding
    topics: [cost-allocation-tags, tag-backfill]
    front:
      text: Why doesn't tagging a resource today label last month's costs, even with a tag backfill?
    back:
      text: Activation labels usage only from then on. A backfill re-applies it to up to 12 earlier months, but only where the resource already carried the tag at the time.
