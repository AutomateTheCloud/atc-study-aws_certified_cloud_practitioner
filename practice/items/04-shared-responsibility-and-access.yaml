        variants:
          - text: Independent auditors' reports on AWS
          - text: Third-party audit reports AWS shares
      - id: site-visit
        text: A visit to inspect an AWS data center
        variants:
          - text: An inspection tour of an AWS data center
          - text: Walking through an AWS facility in person
        explanation:
          text: >-
            Customers can't enter AWS's buildings or reach its machines; that is part of why
            physical security is AWS's alone.
      - id: host-agent
        text: Monitoring agents it installs on AWS's hosts
        variants:
          - text: Its own monitoring agents on AWS's hosts
          - text: Agents it places on AWS's physical servers
        explanation:
          text: >-
            The host operating system and hardware are AWS's; customers have no access to install
            anything there.
      - id: own-security-groups
        text: A review of its own security group rules
        variants:
          - text: Checking its own security group settings
          - text: An audit of its own firewall rules
        explanation:
          text: >-
            Reviewing its own settings checks the company's side of the line, not AWS's.
    correct_answers: [audit-reports]
    explanation:
      text: >-
        Independent auditors regularly test AWS's security, and AWS makes their reports available to
        customers. A customer uses them as evidence for the controls it relies on AWS for, and shows
        its own records for its own side. Module 09 covers where to find the reports.

  # ------------------------------------------------------------------ 04.02 Shared, inherited and customer-specific controls

  - id: q04-server-room-controls-inherited
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Inherited controls: AWS does all of it"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A law firm's old server room had door locks, fire suppression and backup power. The firm has moved all its systems to AWS. In the shared responsibility model, what kind of control are these protections now for the firm?
    choices:
      - id: shared
        text: Shared controls
        variants:
          - text: Controls the firm shares with AWS
          - text: Shared ones
        explanation:
          text: >-
            A shared control leaves work on both sides. Here the firm has nothing left to do: it
            can't enter AWS's buildings.
      - id: customer-specific
        text: Customer-specific controls
        variants:
          - text: Controls specific to the firm
          - text: Customer-specific ones
        explanation:
          text: >-
            Customer-specific controls come from what the customer builds, such as keeping certain
            data in certain protected areas. Buildings and power aren't that.
      - id: inherited
        text: Inherited controls
        variants:
          - text: Controls the firm inherits from AWS
          - text: Inherited ones
    correct_answers: [inherited]
    hint:
      text: >-
        After the move, does the firm have any work left to do for these protections?
    explanation:
      text: >-
        Physical and environmental controls, such as building access, fire protection, power and
        cooling, are AWS's example of inherited controls: AWS carries them out completely, and the
        customer gets the benefit. The firm's evidence for them is AWS's audit reports.

  - id: q04-shared-control-examples-two
    revision: 2
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Shared controls: each side does its own half"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A payroll firm that runs on AWS is sorting its controls for an auditor. It wants the kinds of control where AWS does the work for its own infrastructure and the firm does its own, separate version for what it runs. Which belong in that group? (Select TWO.)
    choices:
      - id: building-entry
        text: Controlling who may enter the data center buildings
        variants:
          - text: Deciding who may enter the data center buildings
          - text: Limiting who can enter the data center buildings
        explanation:
          text: >-
            Entry to the buildings is a physical and environmental control. The firm inherits it
            completely from AWS and has nothing to do.
      - id: settings-config
        text: Configuring systems and settings securely
        variants:
          - text: Setting up systems and settings securely
          - text: Keeping system settings configured securely
      - id: data-zoning
        text: Keeping payroll data inside one isolated network zone
        variants:
          - text: Holding payroll data in a single isolated network zone
          - text: Confining payroll data to one isolated network zone
        explanation:
          text: >-
            This is zone security, AWS's example of a customer-specific control. Only the firm knows
            which of its data needs it, so AWS has no matching half.
      - id: hardware-replace
        text: Replacing failed disks and servers at end of life
        variants:
          - text: Swapping out failed disks and retiring old servers
          - text: Replacing worn-out disks and end-of-life servers
        explanation:
          text: >-
            Hardware is AWS's alone on every service, so the firm has no half of this work.
      - id: staff-training
        text: Training people to recognize security threats
        variants:
          - text: Teaching people to recognize security threats
          - text: Training people to spot security threats
    correct_answers: [settings-config, staff-training]
    hint:
      text: >-
        For each control, ask whether the firm has any work to do, and whether AWS does its own
        version for its infrastructure.
    explanation:
      text: >-
        AWS gives three examples of shared controls: patch management, configuration management,
        and awareness and training. AWS configures its own devices and trains its own staff; the
        firm configures its own systems and resource settings and trains its own people. Building
        entry and hardware are inherited from AWS; zoning payroll data is customer-specific.

  - id: q04-training-is-each-sides-own
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Shared controls: each side does its own half"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Awareness and training is a shared control. What does that mean for a company that runs on AWS?
    choices:
      - id: aws-covers-staff
        text: AWS's security training also covers the company's staff
        variants:
          - text: The company's staff are covered by AWS's own training
          - text: AWS's staff training extends to the company's people
        explanation:
          text: >-
            AWS's training does nothing for the company's staff. Each side trains its own people.
      - id: joint-sessions
        text: AWS and the company run joint training for both staffs
        variants:
          - text: The company and AWS train their people in joint sessions
          - text: Both staffs are trained together by AWS and the company
        explanation:
          text: >-
            "Shared" doesn't mean done together. Each side does its own half, separately.
      - id: inherited-once-on-aws
        text: Training stops being needed once the company is on AWS
        variants:
          - text: Moving to AWS removes the company's need to train staff
          - text: The company no longer has to train staff after the move
        explanation:
          text: >-
            That would make training inherited. It isn't: if the company skips its half, nobody
            does it.
      - id: each-trains-own
        text: AWS trains its employees, and the company trains its own
        variants:
          - text: The company trains its people, and AWS trains its own
          - text: Each side trains its own staff, AWS and the company alike
    correct_answers: [each-trains-own]
    explanation:
      text: >-
        A shared control is one kind of work that both sides do, each for its own things, in
        separate contexts. AWS trains AWS employees; the customer must train everyone with access to
        its account, including new staff.

  - id: q04-shared-control-definition
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: '"Shared" doesn''t mean both sides do the same task'
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement correctly describes a shared control in the AWS shared responsibility model?
    choices:
      - id: same-kind-own-things
        text: Both sides do the same kind of work, each on its own systems
        variants:
          - text: Each side does the same type of work for its own systems
          - text: The same kind of work is done by each side, on its own systems
      - id: same-task-together
        text: Both sides carry out each task of the control together
        variants:
          - text: AWS and the customer perform every task of it jointly
          - text: Every task of the control is done by both sides together
        explanation:
          text: >-
            This is the everyday meaning of "shared", and it's the misconception the lesson refutes.
            Any specific task belongs to one side.
      - id: aws-does-customer-checks
        text: AWS carries out the control, and the customer checks it
        variants:
          - text: The customer reviews the control, and AWS carries it out
          - text: AWS performs the control while the customer verifies it
        explanation:
          text: >-
            That describes relying on AWS for a control, closer to an inherited control. In a
            shared control, the customer has real work of its own.
      - id: customer-does-aws-approves
        text: The customer carries out the control, and AWS approves it
        variants:
          - text: AWS signs off on the control after the customer performs it
          - text: The customer performs the control while AWS approves it
        explanation:
          text: >-
            AWS doesn't approve the customer's half; it does its own half for its infrastructure.
    correct_answers: [same-kind-own-things]
    explanation:
      text: >-
        A shared control applies to both AWS's infrastructure and the customer's part, in completely
        separate contexts. In patch management, for example, AWS patches its hosts and the customer
        patches its own guest operating systems. A question about one specific task always has one
        side as its answer.

  - id: q04-customer-specific-example
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Customer-specific controls: only you can do these"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which of these is an example of a customer-specific control?
    choices:
      - id: data-center-access
        text: Limiting who can enter the data center buildings
        variants:
          - text: Controlling entry to the data center buildings
          - text: Deciding who may walk into the data centers
        explanation:
          text: >-
            Physical access is an inherited control: AWS does all of it.
      - id: zone-sensitive-data
        text: Keeping payment data reachable only from one application
        variants:
          - text: Letting only one application reach the payment data
          - text: Restricting the payment data to a single application
      - id: patch-guest
        text: Keeping the guest operating systems patched
        variants:
          - text: Applying patches to the guest operating systems
          - text: Updating the guest operating systems regularly
        explanation:
          text: >-
            This is the customer's half of patch management, which is a shared control: AWS patches
            its own infrastructure.
      - id: staff-training
        text: Teaching staff to recognize fake sign-in pages
        variants:
          - text: Training staff to spot fake sign-in pages
          - text: Showing employees how to detect fake sign-in pages
        explanation:
          text: >-
            Training is a shared control: AWS trains its staff and the customer trains its own.
    correct_answers: [zone-sensitive-data]
    explanation:
      text: >-
        A customer-specific control depends only on what the customer builds, so AWS has no matching
        half. AWS's example is service and communications protection, or zone security: keeping
        certain data inside certain protected areas, or sending it only along certain paths. Only
        the customer knows which of its data needs that.

  - id: q04-insurer-fire-power-answer
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Worked example: answering the insurer's questionnaire"
    task: "2.1"
    level: application
    topics: [shared-responsibility, control-types, compliance]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An insurer asks a company that runs entirely on AWS, "How are your servers protected from fire, floods and power cuts?" What is the best answer?
    choices:
      - id: own-generators
        text: Describe the company's own backup generators and alarms
        variants:
          - text: List the company's own generators and fire alarms
          - text: Explain the company's own alarms and backup power
        explanation:
          text: >-
            The company no longer runs any servers in its own building, so its own generators
            don't protect them.
      - id: aws-audit-report
        text: AWS carries out those controls, as its audit reports show
        variants:
          - text: AWS performs those controls, with its audit reports as proof
          - text: Those are AWS's controls, and its audit reports show it
      - id: joint-power
        text: The company and AWS manage power and cooling jointly
        variants:
          - text: AWS and the company share the work on power and cooling
          - text: Power and cooling are run jointly by AWS and the company
        explanation:
          text: >-
            Physical and environmental controls are inherited: the customer has no part in them.
      - id: not-applicable
        text: The question doesn't apply, because cloud servers aren't physical
        variants:
          - text: It's not relevant, since servers in the cloud aren't physical
          - text: No answer is needed, as cloud servers have no physical form
        explanation:
          text: >-
            Cloud servers run on real machines in real buildings. AWS protects them, and the
            customer can show evidence of that.
    correct_answers: [aws-audit-report]
    hint:
      text: >-
        Sort the control first: does the company have anything to do for it? Then ask who can show
        the evidence.
    explanation:
      text: >-
        Fire, flood and power protection are physical and environmental controls, which the customer
        inherits from AWS. Inheriting a control doesn't remove the need for evidence: AWS suggests
        reviewing its third-party audit reports to see which controls you inherit, and those reports
        are the company's evidence.

  - id: q04-evidence-for-customer-half
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Customer-specific controls: only you can do these"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types, compliance]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An auditor asks a company to prove that the guest operating systems on its Amazon EC2 servers are kept patched. What evidence should the company provide?
    choices:
      - id: aws-reports-only
        text: AWS's third-party audit reports alone
        variants:
          - text: Only the audit reports AWS publishes
          - text: Just AWS's independent audit reports
        explanation:
          text: >-
            AWS's reports cover AWS's half, such as patching its hosts. They say nothing about the
            company's own servers.
      - id: support-letter
        text: A confirmation letter from AWS Support
        variants:
          - text: A written confirmation from AWS Support
          - text: A statement issued by AWS Support
        explanation:
          text: >-
            AWS doesn't patch or track the customer's guest operating systems, so it can't confirm
            them.
      - id: own-patch-records
        text: The company's own patch records
        variants:
          - text: Its own records of applied patches
          - text: Patch records the company keeps itself
      - id: no-evidence-needed
        text: None, since patching is AWS's job
        variants:
          - text: Nothing, as AWS handles all patching
          - text: No evidence, because AWS does patching
        explanation:
          text: >-
            On EC2, patching the guest operating system is the customer's half of a shared control.
    correct_answers: [own-patch-records]
    explanation:
      text: >-
        Who does the work decides who shows the evidence. For a shared control such as patch
        management, AWS's audit reports cover AWS's half, and the customer's own records cover its
        half. The guest operating system on EC2 is the customer's half.

  - id: q04-control-kinds-statements-two
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Customer-specific controls: only you can do these"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which statements about the three kinds of control in the AWS shared responsibility model are correct? (Select TWO.)
    choices:
      - id: shared-same-task
        text: For a shared control, AWS and the customer do each task together.
        variants:
          - text: In a shared control, each task is done by AWS and the customer jointly.
          - text: A shared control means both sides work on every task together.
        explanation:
          text: >-
            Each side does its own half, for its own things. No single task is done by both.
      - id: inherited-nothing
        text: For an inherited control, the customer has nothing to do.
        variants:
          - text: An inherited control leaves no work for the customer.
          - text: With an inherited control, there is no customer work at all.
      - id: patch-inherited
        text: Patch management is an inherited control.
        variants:
          - text: Patching is an example of an inherited control.
          - text: Patch management counts as inherited.
        explanation:
          text: >-
            Patch management is shared: customers still patch their own systems, such as the guest
            OS on EC2.
      - id: customer-specific-no-aws-half
        text: For a customer-specific control, AWS has no matching half.
        variants:
          - text: A customer-specific control has no counterpart on AWS's side.
          - text: With a customer-specific control, AWS has no half to do.
      - id: physical-shared
        text: Physical security of the data centers is a shared control.
        variants:
          - text: Data center physical security is shared.
          - text: Securing the data center buildings is a shared control.
        explanation:
          text: >-
            Physical and environmental controls are inherited: AWS does all of it.
    correct_answers: [inherited-nothing, customer-specific-no-aws-half]
    explanation:
      text: >-
        The three kinds differ in who does the work. Inherited: AWS only, and the customer shows
        AWS's audit reports. Shared: each side does its own half, in its own context. Customer-specific:
        only the customer, because the control depends only on what it builds.

  - id: q04-configuration-management-customer-half
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Shared controls: each side does its own half"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company reviews its configuration management, a shared control, after moving to AWS. Which task belongs to the company's half?
    choices:
      - id: aws-network-devices
        text: Configuring the network devices inside AWS's data centers
        variants:
          - text: Setting up the network equipment in AWS's data centers
          - text: Managing the configuration of AWS's data center switches
        explanation:
          text: >-
            AWS configures its own infrastructure devices; that's AWS's half.
      - id: virtualization-settings
        text: Setting the virtualization layer's options on its EC2 hosts
        variants:
          - text: Choosing the virtualization settings on the EC2 hosts
          - text: Adjusting the hypervisor's options on the EC2 hosts
        explanation:
          text: >-
            The virtualization layer is AWS's on every service; customers can't reach it.
      - id: approve-aws-changes
        text: Approving the configuration changes AWS makes to its hosts
        variants:
          - text: Signing off on AWS's configuration changes to its hosts
          - text: Reviewing and approving how AWS configures its hosts
        explanation:
          text: >-
            AWS configures its own hosts without customer approval. A shared control means separate
            halves, not one side approving the other.
      - id: block-public-access
        text: Keeping Block Public Access turned on for its S3 buckets
        variants:
          - text: Leaving Block Public Access on for its own S3 buckets
          - text: Making sure its S3 buckets keep Block Public Access on
    correct_answers: [block-public-access]
    hint:
      text: >-
        Configuration management splits by whose things are being configured.
    explanation:
      text: >-
        In configuration management, AWS keeps its own infrastructure devices set up correctly, and
        the customer keeps its guest operating systems, databases and applications set up correctly,
        along with the settings of the AWS resources it creates, such as Block Public Access, a
        password policy and security group rules.

  # ------------------------------------------------------------------ Simulation S3: the responsibility slider

  - id: q04-sim-onprem-to-ec2-moves-two
    page: guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md
    section: "Decision 1: from the back room to EC2"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, ec2]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company moves its web server from its own server room to an Amazon EC2 instance. Which security tasks move from the company to AWS? (Select TWO.)
    choices:
      - id: guest-os
        text: Patching the server's operating system
        variants:
          - text: Updating the server's OS
          - text: Applying OS patches to the server
        explanation:
          text: >-
            On EC2 the guest operating system is still the customer's, with its patches.
      - id: power-cooling
        text: Providing power and cooling
        variants:
          - text: Supplying power and cooling
          - text: Keeping the machines powered and cool
      - id: web-software
        text: Updating the website software
        variants:
          - text: Patching the website's software
          - text: Keeping the web software current
        explanation:
          text: >-
            Any software the customer installs on an EC2 instance stays the customer's.
      - id: server-hardware
        text: Maintaining the physical servers
        variants:
          - text: Looking after the server hardware
          - text: Repairing the physical machines
      - id: firewall-rules
        text: Writing the server's firewall rules
        variants:
          - text: Setting the server's firewall rules
          - text: Deciding the server's firewall rules
        explanation:
          text: >-
            On EC2 the firewall is the instance's security group, and AWS puts its rules on the
            customer.
    correct_answers: [power-cooling, server-hardware]
    explanation:
      text: >-
        On premises the company does everything. On EC2 only the bottom layer moves to AWS: the
        facilities, power, cooling and hardware, along with the host operating system and
        virtualization. The guest OS, installed software and security group rules stay with the
        customer.

  - id: q04-sim-container-image-rebuild
    page: guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md
    section: "Decision 3: the order functions on Lambda"
    task: "2.1"
    level: application
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company packages one of its AWS Lambda functions as a container image. A security fix is published in a newer version of the base image. Who rebuilds the function's image?
    choices:
      - id: company-rebuilds
        text: The company, from the latest base image
        variants:
          - text: The company, using the newest base image
          - text: The company, starting from the updated base image
      - id: aws-auto-rebuild
        text: AWS, which rebuilds the image automatically
        variants:
          - text: AWS, which rebuilds container images on its own
          - text: AWS, through automatic rebuilds of the image
        explanation:
          text: >-
            Automatic runtime updates apply to functions on managed runtimes. A container image is
            built by the customer, so rebuilding it is the customer's.
      - id: both-sides
        text: AWS and the company, working together
        variants:
          - text: The company and AWS jointly
          - text: Both of them, in a joint effort
        explanation:
          text: >-
            A specific task belongs to one side. Lambda's runtime documentation puts this one on
            the customer.
      - id: no-one
        text: No one, because Lambda patches containers live
        variants:
          - text: No one, since Lambda patches running containers
          - text: Nobody, as Lambda updates containers in place
        explanation:
          text: >-
            Lambda doesn't change a customer's image in place; the customer rebuilds and deploys it.
    correct_answers: [company-rebuilds]
    hint:
      text: >-
        Who built the image in the first place?
    explanation:
      text: >-
        Lambda's runtime documentation puts container-image rebuilds on the customer, along with the
        function code, its dependencies, and moving off deprecated runtimes. AWS's automatic runtime
        updates cover functions that use the managed runtimes.

  - id: q04-sim-not-stated-check-docs
    page: guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md
    section: "Decision 5: a cell AWS doesn't fill"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team is mapping who does each security task for the services it uses. For one task on one service, the AWS pages it is using don't say who is responsible. What should the team do?
    choices:
      - id: assume-aws
        text: Assume AWS does it, because the service is managed
        variants:
          - text: Treat it as AWS's, since the service is managed
          - text: Count it as AWS's job, as the service is managed
        explanation:
          text: >-
            How "managed" a service sounds doesn't decide anything; the service's own statement
            does.
      - id: check-service-docs
        text: Check that service's own documentation before deciding
        variants:
          - text: Look it up in the service's documentation first
          - text: Read that service's documentation before deciding
      - id: assume-shared
        text: Record it as shared, so that both sides are covered
        variants:
          - text: Mark it as shared, so both sides will cover it
          - text: Write it down as shared, so neither side misses it
        explanation:
          text: >-
            "Shared" means each side does its own half, not that an unknown task is split. Guessing
            a split can leave the task undone.
      - id: assume-nothing
        text: Leave it out, since unlisted tasks need no owner
        variants:
          - text: Drop it, as tasks AWS doesn't list need no owner
          - text: Skip it, because tasks not listed have no owner
        explanation:
          text: >-
            A task with no owner is a task nobody does. Find out who owns it.
    correct_answers: [check-service-docs]
    explanation:
      text: >-
        AWS says the customer's share depends on the services it uses, so each service's own
        documentation fills in the detail. AWS advises reviewing the security chapter of each
        service's documentation. "AWS doesn't say that here; let me check" is part of the skill,
        never a guessed split.

  - id: q04-sim-line-climbs
    page: guide/04-shared-responsibility-and-access/08-sim-responsibility-slider.md
    section: The whole slider
    task: "2.1"
    level: understanding
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company moves workloads step by step from its own servers to Amazon EC2, then Amazon RDS, then AWS Lambda and Amazon S3. What happens to its security tasks along the way?
    choices:
      - id: grows
        text: The company's list grows as it adopts more services
        variants:
          - text: The company has more tasks with each service it adds
          - text: Each added service gives the company more tasks
        explanation:
          text: >-
            Moving toward managed and abstracted services hands AWS more layers, so the customer's
            list shrinks.
      - id: all-to-aws
        text: Every task has moved to AWS by the S3 step
        variants:
          - text: By the S3 step, AWS has taken every task
          - text: All tasks belong to AWS once it reaches S3
        explanation:
          text: >-
            Even on S3 the customer keeps its data, its encryption choices and who can access it.
      - id: aws-takes-more
        text: AWS takes on more layers, but never the data or access
        variants:
          - text: AWS takes over more layers, though never data or access
          - text: More layers pass to AWS, but data and access never do
      - id: unchanged
        text: The split between AWS and the company stays the same
        variants:
          - text: The division of tasks doesn't change from step to step
          - text: Who does what stays fixed whichever service is used
        explanation:
          text: >-
            The split moves with the service. That's the main idea of task 2.1.
    correct_answers: [aws-takes-more]
    explanation:
      text: >-
        The line between AWS and the customer climbs as services become more managed: on EC2 the
        customer runs the guest OS; on RDS AWS also runs the database software; on Lambda and S3 AWS
        runs everything under the customer's code or data. One row never moves: on every service, the
        customer's data and who can access it.

  # ------------------------------------------------------------------ 04.03 Identities

  - id: q04-expired-token-authentication
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Authentication asks who you are; authorization asks what you may do
    task: "2.3"
    level: application
    topics: [iam, authentication]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A reporting program sends a request to AWS using temporary credentials that expired an hour ago, and AWS turns it away. Which check did the request fail?
    choices:
      - id: authentication
        text: Authentication, because AWS can't confirm who is asking
        variants:
          - text: Authentication, since AWS can't tell who is asking
          - text: Authentication, as AWS can't verify the caller's identity
      - id: authorization
        text: Authorization, because no policy allows the request
        variants:
          - text: Authorization, since no policy permits the request
          - text: Authorization, as nothing allows this request
        explanation:
          text: >-
            Authorization comes only after AWS knows who is asking. Expired credentials stop the
            request before that.
      - id: encryption
        text: Encryption, because the request wasn't encrypted
        variants:
          - text: Encryption, since the request was sent unencrypted
          - text: Encryption, as the request lacked encryption
        explanation:
          text: >-
            Nothing in the scenario is about encryption. AWS asks two questions of every request:
            who are you, and may you do this?
      - id: explicit-deny
        text: An explicit deny in the program's permissions policy
        variants:
          - text: A Deny statement in the program's permissions policy
          - text: An explicit Deny in the policy the program uses
        explanation:
          text: >-
            A deny is part of authorization. With expired credentials, AWS never gets that far.
    correct_answers: [authentication]
    hint:
      text: >-
        Credentials answer one of AWS's two questions; policies answer the other.
    explanation:
      text: >-
        Authentication asks who you are, and is decided by credentials such as a password with MFA,
        access keys or a temporary token. Expired credentials no longer prove anything, so the
        request fails there. A quick test: if AWS knows who you are and still says no, it's
        authorization.

  - id: q04-authorization-meaning
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Authentication asks who you are; authorization asks what you may do
    task: "2.3"
    level: recall
    topics: [iam, authentication]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In AWS, what is authorization?
    choices:
      - id: proving-identity
        text: Proving who you are when you sign in
        variants:
          - text: Showing who you are at sign-in
          - text: Confirming your identity as you sign in
        explanation:
          text: >-
            That is authentication, the first of the two checks.
      - id: once-at-sign-in
        text: Granting an identity all its permissions once at sign-in
        variants:
          - text: Handing an identity every permission at sign-in, once
          - text: Giving all of an identity's permissions when it signs in
        explanation:
          text: >-
            Everyday English uses "authorized" for "let in". In AWS, authorization repeats on every
            single request.
      - id: issuing-credentials
        text: Issuing temporary credentials to a role that is assumed
        variants:
          - text: Handing out temporary credentials when a role is assumed
          - text: Giving temporary credentials to whoever assumes a role
        explanation:
          text: >-
            AWS STS issues temporary credentials; authorization is the policy check that follows.
      - id: per-request-check
        text: Checking on every request whether that identity may do it
        variants:
          - text: Deciding, request by request, whether the identity may act
          - text: A check, on each request, that the identity is permitted
    correct_answers: [per-request-check]
    explanation:
      text: >-
        Authentication happens at sign-in, or when a program presents credentials: who are you?
        Authorization follows on every request: may this identity do this action on this resource?
        Policies decide it, and being recognized gives no permissions by itself.

  - id: q04-user-group-facts-two
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An AWS account has four kinds of identity
    task: "2.3"
    level: understanding
    topics: [iam, identities]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which statements about IAM user groups are true? (Select TWO.)
    choices:
      - id: nested
        text: A group can contain other groups.
        variants:
          - text: Groups can be placed inside other groups.
          - text: One group can be a member of another.
        explanation:
          text: >-
            Groups contain users only; they can't be nested.
      - id: several-groups
        text: A user can belong to several groups at once.
        variants:
          - text: One user can be a member of more than one group.
          - text: A user may be in several groups at the same time.
      - id: principal
        text: A bucket policy can name a group as its principal.
        variants:
          - text: A resource-based policy can name a group as a principal.
          - text: A group can be the principal in a bucket policy.
        explanation:
          text: >-
            A group isn't a principal, so a resource's policy can't name it.
      - id: no-sign-in
        text: Nobody can sign in as a group.
        variants:
          - text: A group can't be used to sign in.
          - text: Signing in as a group isn't possible.
      - id: temp-creds
        text: A group gets temporary credentials for its members.
        variants:
          - text: A group issues temporary credentials to its users.
          - text: Each group hands its members temporary credentials.
        explanation:
          text: >-
            A group has no credentials at all; it only carries policies for its members.
    correct_answers: [several-groups, no-sign-in]
    explanation:
      text: >-
        A group is a set of IAM users; a policy on the group applies to every member. It has no
        credentials and isn't a principal, so nobody signs in as it and resource policies can't name
        it. A user can be in several groups and gets the permissions of each, but groups can't
        contain other groups.

  - id: q04-identity-credential-pairing
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An AWS account has four kinds of identity
    task: "2.3"
    level: understanding
    topics: [iam, identities, credentials]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which pairing of an IAM identity with the credentials it uses is correct?
    choices:
      - id: group-password
        text: IAM user group, with a shared password
        variants:
          - text: IAM user group, with one password for all
          - text: IAM user group, with a group password
        explanation:
          text: >-
            A group has no credentials of any kind.
      - id: root-temporary
        text: Root user, with no credentials of its own
        variants:
          - text: Root user, with no credentials at all
          - text: Root user, with nothing to sign in with
        explanation:
          text: >-
            The root user has long-term credentials: the sign-up email and password, plus MFA.
      - id: role-long-term
        text: IAM role, with long-term access keys
        variants:
          - text: IAM role, with permanent access keys
          - text: IAM role, with access keys that never expire
        explanation:
          text: >-
            A role has no password or keys of its own. This is the reverse of the correct pairing.
      - id: role-temporary
        text: IAM role, with temporary credentials
        variants:
          - text: IAM role, with credentials that expire
          - text: IAM role, with short-lived credentials
    correct_answers: [role-temporary]
    explanation:
      text: >-
        Whoever is allowed to assume a role takes on its permissions for a session, with temporary
        credentials. The root user and IAM users have long-term credentials that work until someone
        changes them, and a group has none.

  - id: q04-app-on-ec2-reads-s3
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: "Worked example: an identity for every need at the bakery"
    task: "2.3"
    level: application
    topics: [iam, identities, roles]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An application running on an Amazon EC2 instance needs to read objects from an Amazon S3 bucket. What is the most secure way to give it access?
    choices:
      - id: user-keys-file
        text: An IAM user's access keys saved in a file on the instance
        variants:
          - text: Access keys for an IAM user, kept in a file on the instance
          - text: A config file on the instance holding an IAM user's keys
        explanation:
          text: >-
            Access keys are long-term: anyone who copies them can use them until someone deletes
            them.
      - id: root-keys-env
        text: Root user access keys in the instance's settings
        variants:
          - text: The root user's access keys in the instance's settings
          - text: Access keys for the root user, set on the instance
        explanation:
          text: >-
            Root access keys give unlimited access and should never be created.
      - id: role
        text: An IAM role that the instance uses
        variants:
          - text: An IAM role assumed by the instance
          - text: A role in IAM that the instance takes on
      - id: group-for-app
        text: An IAM user group created for the application
        variants:
          - text: A user group in IAM set up for the application
          - text: A dedicated IAM user group for the application
        explanation:
          text: >-
            A group isn't an identity anything can act as; it only carries policies for users.
    correct_answers: [role]
    hint:
      text: >-
        Which identity's credentials expire and renew on their own, so nothing long-lived sits on
        the server?
    explanation:
      text: >-
        Programs on AWS should use an IAM role. The application gets temporary credentials that
        expire and renew automatically, so no long-term key is stored on the server where it could
        be copied. This is the Well-Architected practice of using temporary credentials.

  - id: q04-team-same-access-group
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: "Worked example: an identity for every need at the bakery"
    task: "2.3"
    level: application
    topics: [iam, identities, groups]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Five analysts in a single AWS account need identical read-only access to the same resources, and more analysts will join next quarter. Which approach is easiest to manage?
    choices:
      - id: users-in-group
        text: An IAM user for each, in a group that carries the policy
        variants:
          - text: A user per analyst, all in one group holding the policy
          - text: Separate IAM users, joined to a group with the policy
      - id: shared-user
        text: One IAM user whose password all the analysts share
        variants:
          - text: A single IAM user, with its password shared by everyone
          - text: One shared IAM user for every analyst to sign in as
        explanation:
          text: >-
            Shared credentials make it impossible to tell who did what, and one leak exposes
            everyone.
      - id: policy-per-user
        text: An IAM user for each, with the policy attached to each user
        variants:
          - text: A user per analyst, the policy attached to each one
          - text: Separate IAM users, attaching the policy to every user
        explanation:
          text: >-
            It works, but it means repeated work for every new analyst and permissions that drift
            apart.
      - id: role-keys
        text: A role for each analyst, with access keys for the role
        variants:
          - text: One role per analyst, each role given its own access keys
          - text: Separate roles for the analysts, each with access keys
        explanation:
          text: >-
            A role has no access keys of its own; it gives temporary credentials to whoever assumes
            it.
    correct_answers: [users-in-group]
    hint:
      text: >-
        Think about what happens when the sixth analyst starts.
    explanation:
      text: >-
        A policy attached to a group applies to every member, so the analysts stay identical and a
        new analyst is one step: add them to the group. Giving permissions to groups rather than one
        person at a time is the Well-Architected practice of using user groups. (A company with many
        accounts would use IAM Identity Center instead, as lesson 04.05 explains.)

  - id: q04-partner-account-role
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: "Worked example: an identity for every need at the bakery"
    task: "2.3"
    level: application
    topics: [iam, identities, cross-account]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A logistics partner has its own AWS account. Its staff need to read shipping files in a company's AWS account, and the company doesn't want to manage users for the partner's staff. What should the company create?
    choices:
      - id: user-per-partner
        text: An IAM user in its account for each partner employee
        variants:
          - text: One IAM user per partner employee, in its own account
          - text: Separate IAM users in its account for the partner's staff
        explanation:
          text: >-
            That is exactly the user management the company wants to avoid, with long-term
            credentials for outsiders.
      - id: cross-account-role
        text: A role in its account that the partner's account may assume
        variants:
          - text: An IAM role in its account that the partner can assume
          - text: A role the partner's account is allowed to take on
      - id: share-admin-keys
        text: A copy of its IAM admin's access keys for the partner
        variants:
          - text: Its IAM admin's access keys, shared with the partner
          - text: The access keys of its own IAM admin, sent to the partner
        explanation:
          text: >-
            Sharing an admin's keys hands over full, long-term access and breaks least privilege.
      - id: group-for-partner
        text: A user group in its account that names the partner's account
        variants:
          - text: An IAM user group that lists the partner's account
          - text: A group in IAM with the partner's account as a member
        explanation:
          text: >-
            Groups contain only users from the same account; another account can't be a member.
    correct_answers: [cross-account-role]
    hint:
      text: >-
        Outsiders with their own AWS account, and no users to manage: which identity can someone
        take on for a while?
    explanation:
      text: >-
        A cross-account role lives in the account that owns the resources. Its trust policy names
        the partner's account, and the partner's staff assume it to get temporary credentials. The
        company manages one role, not a user per person.

  - id: q04-admin-cannot-do-root-tasks
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An IAM admin is not the root user
    task: "2.3"
    level: understanding
    topics: [iam, root-user, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's IAM user has the AWS managed policy `AdministratorAccess` attached. Which statement about this user is correct?
    choices:
      - id: same-as-root
        text: It has exactly the same powers as the root user.
        variants:
          - text: Its powers are identical to the root user's.
          - text: It can do everything the root user can do.
        explanation:
          text: >-
            This is the misconception the lesson refutes. Some tasks need the root user itself.
      - id: cannot-be-limited
        text: No IAM policy can restrict what it is allowed to do.
        variants:
          - text: Its permissions can't be narrowed by any IAM policy.
          - text: IAM policies are unable to limit what it may do.
        explanation:
          text: >-
            Its power comes from a policy, which can be removed, narrowed or blocked by a deny. It's
            the root user that IAM policies can't limit.
      - id: no-root-tasks
        text: It still can't perform the tasks that require root.
        variants:
          - text: The tasks that need root are still out of its reach.
          - text: It remains unable to do the root-only tasks.
      - id: can-close-account
        text: It can close the account if it has MFA turned on.
        variants:
          - text: With MFA on, it is able to close the account.
          - text: It may close the account once MFA is enabled.
        explanation:
          text: >-
            Closing the account is a root-only task; MFA on an IAM user doesn't change that.
    correct_answers: [no-root-tasks]
    explanation:
      text: >-
        An IAM admin isn't the root user, for two reasons. Some tasks need the root user's own
        credentials, and no policy lets an IAM user do them. And an admin's power comes from
        policies that can be narrowed or denied, while AWS in general allows the root user's
        requests on the account's own resources.

  - id: q04-owner-everyday-identity
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: "Worked example: an identity for every need at the bakery"
    task: "2.3"
    level: application
    topics: [iam, identities, root-user]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        The owner of a small business holds its AWS account's root user. She occasionally needs to create users and review settings. What should she use for that work?
    choices:
      - id: owner-root-mfa
        text: The root user, protected with MFA
        variants:
          - text: The root user, with MFA turned on
          - text: Her root user sign-in, secured by MFA
        explanation:
          text: >-
            MFA protects root, but root is only for root-only tasks. Creating users and reviewing
            settings don't need it.
      - id: owner-iam-user
        text: An IAM user of her own, with MFA
        variants:
          - text: Her own IAM user, protected with MFA
          - text: An IAM user for herself, with MFA on
      - id: owner-group
        text: An admin user group that she signs in as
        variants:
          - text: Signing in as an IAM user group with admin rights
          - text: A user group in IAM that she signs in as
        explanation:
          text: >-
            Nobody can sign in as a group; it only carries policies for its users.
      - id: owner-root-keys
        text: The root user's access keys, kept safe
        variants:
          - text: Access keys for the root user, stored safely
          - text: Root access keys that she keeps secure
        explanation:
          text: >-
            AWS advises never creating root access keys at all.
    correct_answers: [owner-iam-user]
    hint:
      text: >-
        Is either of her tasks on the list that only the root user can do?
    explanation:
      text: >-
        The root user stays locked away with MFA, for root-only tasks. For everything else the owner
        uses an IAM identity of her own, protected with MFA. Using root only for the tasks that need
        it is the Well-Architected best practice for the root user; any other use is an
        anti-pattern.

  - id: q04-service-linked-roles
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An AWS account has four kinds of identity
    task: "2.3"
    level: recall
    topics: [iam, roles]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A new administrator finds roles in IAM that nobody at the company created. An AWS service created them so it can act for the company. What are they?
    choices:
      - id: inline-roles
        text: Inline roles, which you can edit but not reuse
        variants:
          - text: Inline roles, editable but never reusable
          - text: Inline roles, which can be changed but not shared
        explanation:
          text: >-
            "Inline" describes a kind of policy, not a kind of role.
      - id: cross-account-roles
        text: Cross-account roles, which you must delete
        variants:
          - text: Cross-account roles that must be removed
          - text: Roles for other accounts, which you have to delete
        explanation:
          text: >-
            A cross-account role lets another account in; nothing in the scenario involves another
            account.
      - id: root-sessions
        text: Root user sessions, which expire on their own
        variants:
          - text: Sessions of the root user, which time out
          - text: Root sessions that expire by themselves
        explanation:
          text: >-
            The root user isn't a role, and its sessions don't appear as roles in IAM.
      - id: service-linked
        text: Service-linked roles, which you can view but not edit
        variants:
          - text: Service-linked roles, viewable but not editable
          - text: Service-linked roles, which you can read but not change
    correct_answers: [service-linked]
    explanation:
      text: >-
        A service-linked role is a role an AWS service creates and owns so it can act for you. You
        can view its permissions but not edit them. The IAM dashboard shows them even in a new
        account.

  - id: q04-root-only-tasks-two
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Only the root user can do a short list of tasks
    task: "2.3"
    level: recall
    topics: [iam, root-user]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        In a standalone AWS account, which of these tasks require the root user's credentials? (Select TWO.)
    choices:
      - id: change-support-plan
        text: Changing the AWS Support plan
        variants:
          - text: Upgrading to a paid AWS Support plan
          - text: Switching the account's Support plan
        explanation:
          text: >-
            Much older material says so, but it isn't on AWS's current root-only list (as of
            2026-10-23).
      - id: change-root-email
        text: Changing the account's sign-up email address
        variants:
          - text: Updating the email address used to sign up
          - text: Changing the root user's email address
      - id: create-role
        text: Creating an IAM role for an application
        variants:
          - text: Setting up an IAM role for an app
          - text: Making a new IAM role for a program
        explanation:
          text: >-
            Creating IAM identities is ordinary IAM work that an IAM admin can do.
      - id: mfa-delete
        text: Turning on MFA Delete for an S3 bucket
        variants:
          - text: Enabling MFA Delete on an S3 bucket
          - text: Switching on MFA Delete for a bucket
      - id: create-budget
        text: Creating a budget with an email alert
        variants:
          - text: Setting up a budget that sends an email
          - text: Making a budget with an alert by email
        explanation:
          text: >-
            Once IAM access to billing is on, an IAM user with permission can create budgets.
    correct_answers: [change-root-email, mfa-delete]
    explanation:
      text: >-
        Both are on AWS's list of tasks that require root user credentials (as of 2026-10-23; the
        email change applies to a standalone account). Root-only tasks change the account itself or
        rescue it from a lockout. The list changes, so check AWS's current page before relying on
        it.

  - id: q04-support-plan-change-identity
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: '"Changing the Support plan needs root" is out of date'
    task: "2.3"
    level: understanding
    topics: [iam, root-user, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company wants to move its standalone AWS account from Basic Support to a paid Support plan. According to AWS's current documentation, who can make the change?
    choices:
      - id: iam-with-permission
        text: An IAM identity with permission
        variants:
          - text: Any IAM identity allowed to do it
          - text: An IAM user or role with permission
      - id: root-only
        text: Only the root user
        variants:
          - text: The root user alone
          - text: Nobody but the root user
        explanation:
          text: >-
            This is the out-of-date claim found in older material and many practice questions. AWS's
            current root-only list doesn't include it (as of 2026-10-23).
      - id: alternate-contact
        text: Only the billing alternate contact
        variants:
          - text: The billing alternate contact alone
          - text: Nobody but the billing contact
        explanation:
          text: >-
            Alternate contacts receive notices; they aren't identities that sign in and change
            settings.
      - id: aws-support-staff
        text: Only an AWS Support engineer
        variants:
          - text: An AWS Support engineer alone
          - text: Nobody but AWS Support staff
        explanation:
          text: >-
            The customer chooses its own Support plan; AWS Support staff don't change it for you.
    correct_answers: [iam-with-permission]
    explanation:
      text: >-
        Changing the AWS Support plan isn't on AWS's current list of root-only tasks (checked
        2026-10-23), so an IAM user or role with the right permissions can do it. The claim that it
        needs root is everywhere in older material, which is why it's worth knowing that it's out of
        date.

  - id: q04-root-only-pattern
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Only the root user can do a short list of tasks
    task: "2.3"
    level: understanding
    topics: [iam, root-user]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        What do the tasks that only the root user can perform generally have in common?
    choices:
      - id: big-spending
        text: They start large amounts of spending
        variants:
          - text: They commit the account to big costs
          - text: They create large charges on the bill
        explanation:
          text: >-
            Most spending, such as launching servers, needs no root. Cost isn't the pattern.
      - id: many-regions
        text: They affect resources in every Region
        variants:
          - text: They change resources in all Regions
          - text: They reach across every AWS Region
        explanation:
          text: >-
            Many ordinary IAM tasks are global too. Scope across Regions isn't what makes a task
            root-only.
      - id: account-or-lockout
        text: They change the account itself or end a lockout
        variants:
          - text: They alter the account itself or fix a lockout
          - text: They change the account or rescue it from lockout
      - id: create-identities
        text: They create or delete IAM identities
        variants:
          - text: They add or remove IAM identities
          - text: They make or remove users and roles
        explanation:
          text: >-
            Creating users, groups and roles is ordinary IAM work that an IAM admin can do.
    correct_answers: [account-or-lockout]
    explanation:
      text: >-
        Root-only tasks change the account itself, such as closing it or changing its sign-up email
        address, or rescue it from a lockout, such as restoring permissions when the only IAM admin
        has locked themselves out. Learning the pattern helps more than memorizing a list that AWS
        changes.

  - id: q04-root-mfa-requirement
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Root MFA isn't optional
    task: "2.3"
    level: recall
    topics: [iam, root-user, mfa, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        What does AWS currently require for multi-factor authentication (MFA) on the root user?
    choices:
      - id: optional
        text: Nothing; root MFA is recommended but optional
        variants:
          - text: Nothing; MFA on root is advised but optional
          - text: Nothing; root MFA is a suggested extra
        explanation:
          text: >-
            Root MFA was once optional, which is why older material says so. That is out of date.
      - id: required-all
        text: MFA on the root user of every kind of account
        variants:
          - text: MFA for the root user in all types of account
          - text: MFA on root, whatever the type of account
      - id: management-only
        text: MFA only on organization management accounts
        variants:
          - text: MFA for management accounts in AWS Organizations only
          - text: MFA solely on an organization's management account
        explanation:
          text: >-
            AWS's requirement covers the root user of every kind of account (as of 2026-10-23).
      - id: paid-support-only
        text: MFA only on accounts with a paid Support plan
        variants:
          - text: MFA solely for accounts on paid Support plans
          - text: MFA just for accounts that pay for Support
        explanation:
          text: >-
            The Support plan has nothing to do with MFA requirements.
    correct_answers: [required-all]
    explanation:
      text: >-
        AWS now requires MFA on the root user of every kind of account, registered within 14 days
        of the first sign-in attempt (as of 2026-10-23). Root is the one identity IAM policies
        can't limit, so it needs the strongest protection, ideally a passkey or security key.

  - id: q04-root-best-practices-two
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Protecting the root user is your job, and you've already done it
    task: "2.3"
    level: application
    topics: [iam, root-user]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Two founders have just opened a standalone AWS account and set up an IAM administrator user for each of them. What should they now do about the account's root user? (Select TWO.)
    choices:
      - id: root-keys-safe
        text: Create root access keys and lock them in a safe
        variants:
          - text: Make root access keys and keep them in a safe
          - text: Store a set of root access keys in a locked safe
        explanation:
          text: >-
            AWS advises never creating root access keys, however carefully they're stored. They
            skip the password and MFA and give unlimited access to anyone who copies them.
      - id: root-passkey
        text: Give root a passkey or security key for MFA
        variants:
          - text: Register a passkey or security key as root's MFA
          - text: Protect root with a passkey or security key
      - id: mfa-optional
        text: Leave root without MFA, as AWS only recommends it
        variants:
          - text: Skip MFA on root, since AWS only recommends it
          - text: Treat root MFA as optional, as AWS only advises it
        explanation:
          text: >-
            Root MFA was once optional, but AWS now requires it on the root user of every kind of
            account (as of 2026-10-23).
      - id: root-for-bills
        text: Sign in as root each month to read the bills
        variants:
          - text: Use the root user each month to read the bills
          - text: Read the monthly bills by signing in as root
        explanation:
          text: >-
            Turning on IAM access to the billing pages is root-only, but it's done once. After that,
            an IAM identity with permission reads the bills.
      - id: daily-iam
        text: Leave root unused for their daily work
        variants:
          - text: Keep root out of their everyday work
          - text: Not use root for their day-to-day work
    correct_answers: [root-passkey, daily-iam]
    hint:
      text: >-
        Root can do everything, IAM policies can't limit it, and only a short list of tasks needs
        it.
    explanation:
      text: >-
        AWS's advice for the root user: use MFA, preferably a passkey or security key; never create
        root access keys; keep recovery details such as the email address and phone number under
        control; watch for root activity; and don't use root for everyday work. The founders' IAM
        admins cover daily work, so root stays locked away, protected, and ready for root-only tasks.

  - id: q04-locked-out-admin-root
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Only the root user can do a short list of tasks
    task: "2.3"
    level: application
    topics: [iam, root-user]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A small company's only IAM administrator accidentally removes their own permissions, and no other IAM identity can manage IAM. How can the company restore access?
    choices:
      - id: support-signs-in
        text: Ask AWS Support to sign in and fix the permissions
        variants:
          - text: Have AWS Support sign in and restore the permissions
          - text: Get AWS Support to log in and repair the permissions
        explanation:
          text: >-
            AWS Support doesn't sign in to customer accounts to change IAM. Managing access is the
            customer's side of the line.
      - id: wait-expiry
        text: Wait for the change to expire after its session ends
        variants:
          - text: Let the change lapse once the session has ended
          - text: Wait until the change times out with the session
        explanation:
          text: >-
            Policy changes don't expire; the user stays without permissions until someone puts
            them back.
      - id: new-account
        text: Create a new account and move the resources into it
        variants:
          - text: Open a fresh account and transfer the resources
          - text: Move the resources over to a newly created account
        explanation:
          text: >-
            Drastic and unnecessary. The account's own root user can fix the lockout.
      - id: root-restores
        text: Sign in as the root user and restore the permissions
        variants:
          - text: Use the root user to put the permissions back
          - text: Restore the permissions while signed in as root
    correct_answers: [root-restores]
    hint:
      text: >-
        One identity's power doesn't come from IAM policies at all.
    explanation:
      text: >-
        Restoring permissions when the only IAM admin has locked themselves out is on AWS's list of
        root-only tasks (as of 2026-10-23). It fits the pattern: root-only tasks change the account
        itself or rescue it from a lockout. It's one reason root must stay usable, protected by MFA.

  # ------------------------------------------------------------------ 04.04 Policies and least privilege

  - id: q04-policy-effect-element
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "A policy is a list of statements: Effect, Action, Resource"
    task: "2.3"
    level: recall
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which element of an IAM policy statement says whether the statement allows or denies?
    choices:
      - id: effect
        text: Effect
        variants:
          - text: The Effect element
          - text: Effect (element)
      - id: action
        text: Action
        variants:
          - text: The Action element
          - text: Action (element)
        explanation:
          text: >-
            Action names what may be done, written as `service:action`, such as `s3:GetObject`.
      - id: resource
        text: Resource
        variants:
          - text: The Resource element
          - text: Resource (element)
        explanation:
          text: >-
            Resource names which things the statement covers, by their ARNs.
      - id: condition
        text: Condition
        variants:
          - text: The Condition element
          - text: Condition (element)
        explanation:
          text: >-
            Condition is optional and adds "only when", such as only when the request used MFA.
    correct_answers: [effect]
    explanation:
      text: >-
        Each statement says whether it allows or denies (Effect), what may be done (Action), and to
        which thing (Resource). An optional Condition adds "only when". Effect is either Allow or
        Deny.

  - id: q04-resource-based-policy-names-principal
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: Identity-based policies follow the identity; resource-based policies sit on the thing
    task: "2.3"
    level: understanding
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        What is a key difference between an identity-based policy and a resource-based policy?
    choices:
      - id: names-principal
        text: Only a resource-based policy names a principal
        variants:
          - text: A resource-based policy names a principal; the other doesn't
          - text: The resource-based kind names a principal, unlike the other
      - id: aws-writes-identity
        text: Only AWS can write identity-based policies
        variants:
          - text: Identity-based policies are always written by AWS
          - text: AWS alone writes the identity-based kind
        explanation:
          text: >-
            Customer managed and inline policies are identity-based policies you write yourself.
      - id: resource-no-deny
        text: A resource-based policy can't contain a Deny
        variants:
          - text: Deny statements aren't allowed in resource-based policies
          - text: The resource-based kind can only allow, never deny
        explanation:
          text: >-
            Both kinds use the same statements, with Effect set to Allow or Deny.
      - id: identity-on-buckets
        text: Identity-based policies attach to S3 buckets
        variants:
          - text: S3 buckets carry identity-based policies
          - text: An identity-based policy is attached to a bucket
        explanation:
          text: >-
            That's reversed: a policy on a bucket is a resource-based policy, called a bucket
            policy.
    correct_answers: [names-principal]
    explanation:
      text: >-
        An identity-based policy sits on a user, group or role and applies to whoever holds it, so
        it names no principal. A resource-based policy, such as a bucket policy, sits on the resource
        and must say who it applies to. Both use the same statements, and AWS evaluates them
        together.

  - id: q04-bucket-policy-is-resource-based
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: Identity-based policies follow the identity; resource-based policies sit on the thing
    task: "2.3"
    level: recall
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A policy attached directly to an Amazon S3 bucket says which principals may read the bucket's objects. What kind of policy is it?
    choices:
      - id: aws-managed
        text: An AWS managed policy
        variants:
          - text: An AWS managed IAM policy
          - text: A managed policy written by AWS
        explanation:
          text: >-
            AWS managed policies are identity-based: they attach to users, groups and roles, not to
            buckets.
      - id: resource-based
        text: A resource-based policy
        variants:
          - text: A policy based on the resource
          - text: A resource-based kind of policy
      - id: identity-based
        text: An identity-based policy
        variants:
          - text: A policy based on an identity
          - text: An identity-based kind of policy
        explanation:
          text: >-
            Identity-based policies attach to a user, group or role, and name no principal.
      - id: customer-managed
        text: A customer managed policy
        variants:
          - text: A customer managed IAM policy
          - text: An IAM customer managed policy
        explanation:
          text: >-
            Customer managed policies are identity-based policies you write and attach to users,
            groups and roles.
    correct_answers: [resource-based]
    explanation:
      text: >-
        A policy that sits on a resource, such as an S3 bucket, is a resource-based policy; on a
        bucket it's called a bucket policy. It must name a principal, the identity or account it
        allows or denies. Because it can let other identities in, it deserves the same review as an
        identity's policy.

  - id: q04-explicit-deny-on-role
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "How AWS decides: default deny, then allows, then an explicit deny wins"
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A role has two policies. One allows every Amazon DynamoDB action on all tables. The other denies `dynamodb:DeleteTable` on all tables. An application using the role tries to delete a table. What happens?
    choices:
      - id: allowed-broad
        text: It's allowed, because the broader policy allows every action
        variants:
          - text: Allowed, since one policy permits every DynamoDB action
          - text: It goes through, as the wider policy allows all actions
        explanation:
          text: >-
            Allows add up only until a matching deny appears. An explicit deny overrides every
            allow.
      - id: order-decides
        text: It depends on which of the two policies was attached first
        variants:
          - text: The policy attached earlier decides the outcome
          - text: Whichever policy came first settles the result
        explanation:
          text: >-
            Order doesn't matter. AWS evaluates every applicable policy together.
      - id: denied-explicit
        text: It's denied, because a matching explicit deny overrides the allow
        variants:
          - text: Denied, since the matching Deny beats any allow
          - text: It fails, as an explicit deny wins over the allow
      - id: denied-one-policy
        text: It's denied, because roles can't hold two policies
        variants:
          - text: Denied, since a role may carry only one policy
          - text: It fails, as roles are limited to one policy
        explanation:
          text: >-
            A role can have several policies. The deny here is explicit, from the second policy.
    correct_answers: [denied-explicit]
    hint:
      text: >-
        Look for a matching Deny first; if there is one, nothing else matters.
    explanation:
      text: >-
        AWS denies every request by default; an allow overrides that default; and an explicit deny
        in any applicable policy overrides every allow. The second policy's Deny matches
        `dynamodb:DeleteTable`, so the request is denied whatever the first policy allows.

  - id: q04-role-with-no-policy
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "How AWS decides: default deny, then allows, then an explicit deny wins"
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer creates an IAM role for a test application but forgets to attach any permissions policy. The application assumes the role and tries to write to an Amazon S3 bucket in the same account. No bucket policy mentions the role. What happens?
    choices:
      - id: allowed-assumed
        text: Allowed, because assuming the role succeeded
        variants:
          - text: Allowed, since the role was assumed without error
          - text: Allowed, as the application took on the role
        explanation:
          text: >-
            Assuming a role is authentication: it gives credentials, not permissions. Permissions
            come only from policies.
      - id: allowed-creator
        text: Allowed, because the role inherits its creator's rights
        variants:
          - text: Allowed, since roles get their creator's permissions
          - text: Allowed, as the role takes the developer's permissions
        explanation:
          text: >-
            Roles don't inherit anything from whoever created them; they have only the policies
            attached to them.
      - id: denied-explicit-default
        text: Denied, because new roles carry a built-in Deny
        variants:
          - text: Denied, since every new role has a default Deny
          - text: Denied, as AWS adds a Deny to new roles
        explanation:
          text: >-
            The result is denied, but not for this reason. No Deny statement is needed: the
            default is an implicit deny.
      - id: denied-implicit
        text: Denied, because nothing allows the request
        variants:
          - text: Denied, since no policy permits the request
          - text: Denied, as nothing grants the request
    correct_answers: [denied-implicit]
    hint:
      text: >-
        What does AWS do with a request that no policy mentions?
    explanation:
      text: >-
        By default every request is denied: an implicit deny, with nothing having to say "no". Only
        an allow in an identity-based or resource-based policy overrides that default, and here
        there is none.

  - id: q04-customer-managed-for-reuse
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "AWS managed, customer managed or inline: who writes it, and how far it reaches"
    task: "2.3"
    level: application
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team writes a policy that grants access to one project's resources. It will attach the policy to a user group now and to a role next month, and wants to update the policy in one place. Which kind of policy should it use?
    choices:
      - id: inline
        text: An inline policy
        variants:
          - text: An inline policy on each identity
          - text: A policy written inline
        explanation:
          text: >-
            An inline policy belongs to exactly one identity, so the team would keep two copies to
            update.
      - id: aws-managed
        text: An AWS managed policy
        variants:
          - text: A policy that AWS manages
          - text: A managed policy from AWS
        explanation:
          text: >-
            AWS writes and updates these; the team can't edit one to fit its project.
      - id: customer-managed
        text: A customer managed policy
        variants:
          - text: A policy the customer manages
          - text: A managed policy of its own
      - id: scp
        text: A service control policy
        variants:
          - text: An SCP in AWS Organizations
          - text: A service control policy (SCP)
        explanation:
          text: >-
            An SCP only sets limits for accounts in an organization; it grants nothing to a group or
            role.
    correct_answers: [customer-managed]
    hint:
      text: >-
        The team writes it, it attaches to more than one identity, and it must be editable.
    explanation:
      text: >-
        A customer managed policy is one you write and manage yourself, a standalone policy you can
        attach to many users, groups and roles in your account and edit in one place. When the exam
        guide says "custom policies", this is what it means.

  - id: q04-inline-for-strict-one-to-one
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "AWS managed, customer managed or inline: who writes it, and how far it reaches"
    task: "2.3"
    level: application
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        One role needs a single extra permission that must never be attached to any other identity and must disappear automatically if the role is deleted. Which kind of policy fits?
    choices:
      - id: one-off-aws-managed
        text: An AWS managed policy
        variants:
          - text: A managed policy from AWS
          - text: A policy that AWS maintains
        explanation:
          text: >-
            AWS managed policies are shared by every customer and stay when an identity is deleted.
      - id: one-off-inline
        text: An inline policy
        variants:
          - text: A policy written inline
          - text: An inline policy on the role
      - id: one-off-customer-managed
        text: A customer managed policy
        variants:
          - text: A managed policy of your own
          - text: A policy the customer manages
        explanation:
          text: >-
            A customer managed policy stands alone: it stays when the role is deleted and can be
            attached to other identities.
      - id: one-off-bucket-policy
        text: A bucket policy
        variants:
          - text: A policy on a bucket
          - text: A bucket's own policy
        explanation:
          text: >-
            A bucket policy is a resource-based policy on a bucket, not a policy that belongs to the
            role.
    correct_answers: [one-off-inline]
    hint:
      text: >-
        Which kind of policy lives inside one identity?
    explanation:
      text: >-
        An inline policy is written directly into one identity and is deleted with it. AWS advises
        using one only for a strict one-to-one case; if a policy could apply to more than one
        identity, use a managed policy instead.

  - id: q04-aws-managed-not-least-privilege
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "AWS managed, customer managed or inline: who writes it, and how far it reaches"
    task: "2.3"
    level: understanding
    topics: [iam, policies, least-privilege]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An administrator attaches an AWS managed policy to a new role. Why might the role then hold more permissions than its task needs?
    choices:
      - id: beats-deny
        text: The policy outranks any explicit deny on the role
        variants:
          - text: Its allows win over any explicit deny on the role
          - text: No explicit deny on the role can override it
        explanation:
          text: >-
            An explicit deny in any policy that applies beats every allow, the allows in an AWS
            managed policy included.
      - id: creator-perms
        text: The role gains the permissions of whoever attached it
        variants:
          - text: The role picks up the permissions of whoever attached it
          - text: Whoever attached it passes their permissions to the role
        explanation:
          text: >-
            A role gets its permissions only from its own policies, not from the person who set it
            up.
      - id: shared-broad
        text: It's written for all customers, not this task
        variants:
          - text: AWS wrote it for every customer, not this task
          - text: It serves all customers, not this one task
      - id: role-group
        text: The role also takes on its user group's policies
        variants:
          - text: The role also receives the policies of its user group
          - text: Its user group's policies are added to the role too
        explanation:
          text: >-
            User groups contain IAM users only. A role can't be put in a group, so it gets nothing
            from one.
    correct_answers: [shared-broad]
    explanation:
      text: >-
        AWS managed policies are a quick start, but they're shared by every customer, so they may
        grant more than a particular case needs. AWS advises starting with them and moving toward
        least privilege with customer managed policies written for your own case.

  - id: q04-least-privilege-meaning
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "Least privilege: grant only what the task needs, then keep trimming"
    task: "2.3"
    level: recall
    topics: [iam, least-privilege]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement describes the principle of least privilege?
    choices:
      - id: only-what-task-needs
        text: Grant each identity only the permissions its task needs
        variants:
          - text: Give every identity just the permissions its task requires
          - text: Allow each identity only what its task actually needs
      - id: seniority
        text: Grant permissions according to each person's seniority
        variants:
          - text: Give people permissions based on how senior they are
          - text: Match each person's permissions to their seniority
        explanation:
          text: >-
            Least privilege is about the task, not the person: even a trusted owner's lab admin
            rights fit only because the task is "administer everything".
      - id: broad-then-trim
        text: Grant broad permissions first, then remove them later
        variants:
          - text: Start with wide permissions and cut them back afterward
          - text: Give broad access now and trim it at a later date
        explanation:
          text: >-
            AWS says it's safer to start small and add permissions. Broad access now is risk now,
            and "later" often never comes.
      - id: admins-all
        text: Grant every administrator full access to the account
        variants:
          - text: Give all administrators complete access to the account
          - text: Let every administrator have full account access
        explanation:
          text: >-
            Full access fits only a task that really is "administer everything", such as the one
            owner of a lab account.
    correct_answers: [only-what-task-needs]
    explanation:
      text: >-
        Least privilege means giving each identity only the permissions it needs for its task:
        specific actions, on specific resources, under specific conditions. If the identity is
        misused or makes a mistake, less can go wrong.

  - id: q04-narrow-broad-policy-two
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "Least privilege: grant only what the task needs, then keep trimming"
    task: "2.3"
    level: application
    topics: [iam, least-privilege]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A user's only job is to upload files to one S3 bucket, but her policy allows every S3 action (`s3:*`) on every resource (`*`). Which changes apply the principle of least privilege? (Select TWO.)
    choices:
      - id: limit-action
        text: Limit the Action to `s3:PutObject`
        variants:
          - text: Narrow the Action to `s3:PutObject` only
          - text: Allow only the `s3:PutObject` action
      - id: make-inline
        text: Move the same policy inline onto her user
        variants:
          - text: Rewrite the same policy as an inline policy
          - text: Attach the same policy inline instead
        explanation:
          text: >-
            Where a policy is attached doesn't change what it allows. The same statements grant the
            same access.
      - id: limit-resource
        text: Limit the Resource to that bucket's objects
        variants:
          - text: Narrow the Resource to the one bucket's files
          - text: Name only that bucket's objects as the Resource
      - id: second-group
        text: Add her to a second group with read access
        variants:
          - text: Put her in another group that allows reading
          - text: Join her to a further group granting reads
        explanation:
          text: >-
            Another group adds permissions; it doesn't remove any.
      - id: full-access-managed
        text: Swap it for an AWS managed full-access S3 policy
        variants:
          - text: Replace it with AWS's managed full S3 access policy
          - text: Use an AWS managed policy for full S3 access
        explanation:
          text: >-
            A full-access policy grants every S3 action, the same breadth she has now.
    correct_answers: [limit-action, limit-resource]
    explanation:
      text: >-
        A policy can be narrowed three ways: fewer actions (only the upload action), fewer resources
        (one bucket's ARN, not `*`), and conditions (for example, only with MFA). Each makes a smaller
        grant, so a mistake or a stolen password can do less.

  - id: q04-access-analyzer-validation
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "Least privilege: grant only what the task needs, then keep trimming"
    task: "2.3"
    level: understanding
    topics: [iam, least-privilege, iam-tools]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A security engineer wants IAM to check each new policy as it is written and warn about overly broad statements. Which IAM feature does that?
    choices:
      - id: simulator
        text: The IAM policy simulator
        variants:
          - text: IAM's policy simulator
          - text: The policy simulator in IAM
        explanation:
          text: >-
            The simulator tests whether requests would be allowed or denied; it doesn't review a
            policy for broad statements.
      - id: last-accessed
        text: Last accessed information
        variants:
          - text: IAM's last accessed information
          - text: The last accessed data in IAM
        explanation:
          text: >-
            Last accessed information shows which services an identity has used, after the fact.
      - id: generation
        text: IAM Access Analyzer policy generation
        variants:
          - text: Policy generation in IAM Access Analyzer
          - text: Access Analyzer's policy generation
        explanation:
          text: >-
            Policy generation drafts a policy from what an identity actually did, using CloudTrail
            records. It doesn't check a policy you're writing.
      - id: validation
        text: IAM Access Analyzer policy validation
        variants:
          - text: Policy validation in IAM Access Analyzer
          - text: Access Analyzer's policy validation
    correct_answers: [validation]
    explanation:
      text: >-
        IAM Access Analyzer's policy validation checks a policy as you write it, with over 100
        checks, and warns about errors and overly broad statements. AWS's IAM best practices ask you
        to validate policies this way; in the console it appears as a pane under the policy editor.

  - id: q04-trim-unused-permissions-two
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "In real work: permissions shrink over time"
    task: "2.3"
    level: application
    topics: [iam, least-privilege, iam-tools]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A role was given broad permissions a year ago. The team now wants to cut them back to what the role actually uses. Which IAM features help? (Select TWO.)
    choices:
      - id: trim-last-accessed
        text: Last accessed information
        variants:
          - text: IAM's last accessed information
          - text: The last accessed data in IAM
      - id: trim-simulator
        text: The IAM policy simulator
        variants:
          - text: IAM's policy simulator
          - text: The policy simulator in IAM
        explanation:
          text: >-
            The simulator tests requests you choose against the policies; it can't tell you what
            the role has actually used.
      - id: trim-password-policy
        text: The account password policy
        variants:
          - text: The account's password rules
          - text: IAM's account password policy
        explanation:
          text: >-
            A password policy sets rules for IAM user passwords; roles have no passwords.
      - id: trim-generation
        text: IAM Access Analyzer policy generation
        variants:
          - text: Policy generation in IAM Access Analyzer
          - text: Access Analyzer's policy generation
      - id: trim-validation
        text: IAM Access Analyzer policy validation
        variants:
          - text: Policy validation in IAM Access Analyzer
          - text: Access Analyzer's policy validation
        explanation:
          text: >-
            Validation checks a policy's grammar and best practices as you write it; it doesn't
            know what the role has used.
    correct_answers: [trim-last-accessed, trim-generation]
    hint:
      text: >-
        You need tools that look at what the role has actually done, not at what it might do.
    explanation:
      text: >-
        Last accessed information shows which services an identity has used and when, so you can
        remove the rest. Access Analyzer's policy generation drafts a policy from the identity's
        actual activity in CloudTrail records. Together they support the Well-Architected practice
        of reducing permissions continuously.

  # ------------------------------------------------------------------ Lab 03

  - id: q04-lab03-list-and-get-arns
    page: guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md
    section: Write the policy
    task: "2.3"
    level: understanding
    topics: [iam, policies]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A policy must let a group list the files in the bucket `shop-photos` and download them. The bucket's ARN is `arn:aws:s3:::shop-photos`, and the ARN for the files in it is `arn:aws:s3:::shop-photos/*`. Which pairing of actions and resources is correct?
    choices:
      - id: both-on-files
        text: '`s3:ListBucket` and `s3:GetObject`, both on the files ARN'
        variants:
          - text: 'Both `s3:ListBucket` and `s3:GetObject` on the ARN ending `/*`'
          - text: '`s3:ListBucket` plus `s3:GetObject`, each on the files ARN'
        explanation:
          text: >-
            Listing is something you do to the bucket itself, so `s3:ListBucket` needs the bucket's
            ARN, without `/*`.
      - id: list-bucket-get-files
        text: '`s3:ListBucket` on the bucket ARN, `s3:GetObject` on the files ARN'
        variants:
          - text: '`s3:GetObject` on the files ARN, `s3:ListBucket` on the bucket ARN'
          - text: '`s3:ListBucket` on the bucket, `s3:GetObject` on the ARN ending `/*`'
      - id: swapped
        text: '`s3:ListBucket` on the files ARN, `s3:GetObject` on the bucket ARN'
        variants:
          - text: '`s3:GetObject` on the bucket ARN, `s3:ListBucket` on the files ARN'
          - text: '`s3:ListBucket` on the ARN ending `/*`, `s3:GetObject` on the bucket'
        explanation:
          text: >-
            That's reversed: downloading acts on files, whose ARN ends in `/*`, and listing acts on
            the bucket.
      - id: both-on-bucket
        text: '`s3:ListBucket` and `s3:GetObject`, both on the bucket ARN'
        variants:
          - text: 'Both `s3:ListBucket` and `s3:GetObject` on the ARN without `/*`'
          - text: '`s3:ListBucket` plus `s3:GetObject`, each on the bucket ARN'
        explanation:
          text: >-
            `s3:GetObject` acts on files, so its resource must be the files ARN, ending in `/*`.
    correct_answers: [list-bucket-get-files]
    explanation:
      text: >-
        `s3:ListBucket` acts on the bucket, so its resource is the bucket's ARN,
        `arn:aws:s3:::shop-photos`. `s3:GetObject` acts on files, so its resource is
        `arn:aws:s3:::shop-photos/*`, meaning every file in the bucket. Getting this wrong is the
        usual cause of an unexpected "denied" in Lab 03.

  - id: q04-lab03-simulator-purpose
    page: guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md
    section: Test it in the policy simulator
    task: "2.3"
    level: understanding
    topics: [iam, iam-tools]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        What does the IAM policy simulator do?
    choices:
      - id: sends-test-requests
        text: Sends real test requests to resources and reports what happened
        variants:
          - text: Makes live test requests to resources and reports the results
          - text: Sends genuine requests to resources and shows the outcomes
        explanation:
          text: >-
            The simulator never sends a request, which is why Lab 04's bucket doesn't need to exist.
      - id: drafts-from-cloudtrail
        text: Drafts a new policy from an identity's activity in CloudTrail
        variants:
          - text: Writes a draft policy from an identity's CloudTrail activity
          - text: Builds a new policy from what CloudTrail shows an identity did
        explanation:
          text: >-
            That's IAM Access Analyzer's policy generation.
      - id: works-out-result
        text: Works out whether chosen policies would allow or deny requests
        variants:
          - text: Calculates if the chosen policies would allow or deny requests
          - text: Determines whether requests would be allowed under the policies
      - id: checks-grammar
        text: Checks a policy's JSON grammar as you type it in the editor
        variants:
          - text: Validates the JSON grammar of a policy while you type it
          - text: Reviews a policy's JSON syntax as you write it in the editor
        explanation:
          text: >-
            That's IAM Access Analyzer's policy validation, the pane under the policy editor.
    correct_answers: [works-out-result]
    explanation:
      text: >-
        The policy simulator works out whether requests would be allowed or denied by the policies
        you choose, without sending them. AWS warns that its results can differ from the live
        account, so in real work you'd also test with a real sign-in.

  - id: q04-lab03-upload-implicit-deny
    page: guide/04-shared-responsibility-and-access/06-lab-03-a-group-and-a-policy.md
    section: Test it in the policy simulator
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation, iam-tools]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A group's only policy allows `s3:ListBucket` on a bucket and `s3:GetObject` on its files. In the policy simulator, you test `s3:PutObject` on a file in that bucket. What result do you expect?
    choices:
      - id: denied-implicit
        text: Denied, as an implicit deny; no statement matches
        variants:
          - text: Denied, by default, since no statement matches
          - text: Denied implicitly, because nothing matches
      - id: allowed-get-covers
        text: Allowed, because `s3:GetObject` includes writing
        variants:
          - text: Allowed, since `s3:GetObject` also covers uploads
          - text: Allowed, as `s3:GetObject` takes in writes too
        explanation:
          text: >-
            `s3:GetObject` reads a file; adding or replacing one is `s3:PutObject`, a separate
            action.
      - id: denied-explicit
        text: Denied, by an explicit deny in the group's policy
        variants:
          - text: Denied, by a Deny statement in the group's policy
          - text: Denied, because the group's policy says Deny
        explanation:
          text: >-
            The policy has no Deny statement. An explicit deny would name a policy in the result
            details.
      - id: allowed-same-bucket
        text: Allowed, because the bucket is already in the policy
        variants:
          - text: Allowed, since the policy names that bucket already
          - text: Allowed, as the bucket appears in the policy
        explanation:
          text: >-
            Naming a bucket allows only the listed actions on it, not every action.
    correct_answers: [denied-implicit]
    hint:
      text: >-
        Does any statement mention the upload action? Does any statement say Deny?
    explanation:
      text: >-
        No statement allows `s3:PutObject`, so the request falls to the default: an implicit deny.
        The simulator reports it as "implicit deny due to no statement(s) matching" (as of
        2026-10-24). Nothing in the policy needs to say "Deny" for the upload to be refused.

  # ------------------------------------------------------------------ Lab 04

  - id: q04-lab04-fix-overbroad-deny
    page: guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
    section: "Part C: uploads fail (break-fix)"
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A group has two policies. One allows uploading photos (`s3:PutObject`) to a bucket. The other was meant only to stop anyone deleting the bucket, but its Deny statement lists both `s3:DeleteBucket` and `s3:PutObject`. Uploads fail. What is the best fix?
    choices:
      - id: add-allow
        text: Add another Allow for `s3:PutObject` to the group
        variants:
          - text: Attach a second policy allowing `s3:PutObject`
          - text: Give the group an extra Allow for `s3:PutObject`
        explanation:
          text: >-
            An explicit deny beats every allow, so another allow changes nothing.
      - id: delete-protect
        text: Delete the protecting policy from the group
        variants:
          - text: Remove the protecting policy altogether
          - text: Detach and delete the protecting policy
        explanation:
          text: >-
            Uploads would work, but the protection against deleting the bucket would be gone.
      - id: remove-putobject
        text: Remove `s3:PutObject` from the Deny statement
        variants:
          - text: Take `s3:PutObject` out of the Deny statement
          - text: Edit the Deny so it no longer lists `s3:PutObject`
      - id: bucket-policy-allow
        text: Allow `s3:PutObject` in the bucket policy instead
        variants:
          - text: Grant `s3:PutObject` through the bucket policy
          - text: Put an Allow for `s3:PutObject` in the bucket policy
        explanation:
          text: >-
            An explicit deny in any applicable policy still overrides an allow from a bucket
            policy.
    correct_answers: [remove-putobject]
    hint:
      text: >-
        Keep what the deny was meant to protect, and remove what it blocks by mistake.
    explanation:
      text: >-
        The explicit deny on `s3:PutObject` overrides the upload allow, wherever an allow is added.
        The fix is to narrow the Deny to its real job: `s3:DeleteBucket` on the bucket's ARN. Uploads
        are then allowed, and deleting the bucket stays denied.

  - id: q04-lab04-why-keep-deny
    page: guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
    section: "Part C: uploads fail (break-fix)"
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        No policy allows a group to delete a bucket, so deleting it is already denied by default. Why might a team still attach an explicit Deny for `s3:DeleteBucket`?
    choices:
      - id: implicit-expires
        text: Implicit denies stop applying after a set time
        variants:
          - text: A default deny lapses after a period of time
          - text: Implicit denies wear off after a while
        explanation:
          text: >-
            The default deny never expires; it applies to every request that nothing allows.
      - id: holds-if-broadened
        text: It still holds if a broader policy is attached later
        variants:
          - text: It keeps working even if wider rights are added later
          - text: It stays in force if someone grants more access later
      - id: groups-need-deny
        text: Default denies don't apply to members of groups
        variants:
          - text: Group members aren't covered by the default deny
          - text: The default deny skips identities in a group
        explanation:
          text: >-
            Every request from every identity is denied by default, whether or not it's in a group.
      - id: faster
        text: An explicit deny makes requests evaluate faster
        variants:
          - text: Requests are decided faster with an explicit deny
          - text: Explicit denies speed up the evaluation of requests
        explanation:
          text: >-
            The reason is protection, not speed.
    correct_answers: [holds-if-broadened]
    explanation:
      text: >-
        An implicit deny lasts only until something allows the action. An explicit deny keeps
        working even if someone later attaches a broader policy to the group, because an explicit
        deny beats every allow. That is what makes it a guardrail: a limit that holds whatever else
        is granted.

  # ------------------------------------------------------------------ Simulation S4: the policy playground

  - id: q04-sim-cross-account-both-sides-two
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 2: fix case 5"
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation, cross-account]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A user in Account B needs to download objects from an S3 bucket in Account A. No organization policies are involved. Which policies must allow the request? (Select TWO.)
    choices:
      - id: bucket-policy-a
        text: A bucket policy in Account A that lets Account B in
        variants:
          - text: Account A's bucket policy, allowing Account B
          - text: A policy on Account A's bucket that admits Account B
      - id: managed-in-a
        text: An AWS managed policy attached in Account A
        variants:
          - text: An AWS managed policy on an identity in Account A
          - text: A policy managed by AWS, attached in Account A
        explanation:
          text: >-
            A policy on an identity in Account A gives permissions to that identity, not to anyone
            in Account B.
      - id: identity-policy-b
        text: An identity-based policy on the user in Account B
        variants:
          - text: Account B's identity-based policy on the user
          - text: A policy on the user's identity in Account B
      - id: root-approval-a
        text: Approval from Account A's root user
        variants:
          - text: Sign-off from the root user of Account A
          - text: Permission from Account A's root user
        explanation:
          text: >-
            Root approval isn't part of policy evaluation; policies decide the request.
      - id: inline-on-bucket-owner
        text: An inline policy on Account A's admin user
        variants:
          - text: An inline policy on the admin user in Account A
          - text: Account A's admin user, with an inline policy
        explanation:
          text: >-
            A policy on Account A's admin gives permissions to that admin only.
    correct_answers: [bucket-policy-a, identity-policy-b]
    explanation:
      text: >-
        Within one account, an allow in either an identity-based or a resource-based policy is
        enough. Across two accounts, both sides must allow: the resource's policy must let the other
        account in, and the requester's own account must allow the action through an identity-based
        policy. Account A can't grant the second half; only Account B can.

  - id: q04-sim-scp-caps-admin
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 1: predict all eight"
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A member account in AWS Organizations has a service control policy (SCP) that allows only Amazon S3 actions. An IAM user there with `AdministratorAccess` tries to create a new IAM user. What happens?
    choices:
      - id: allowed-admin
        text: Allowed, because `AdministratorAccess` allows every action
        variants:
          - text: Allowed, since `AdministratorAccess` permits all actions
          - text: Allowed, as `AdministratorAccess` covers everything
        explanation:
          text: >-
            Limit-setting policies must allow a request too. The SCP caps the whole account at S3
            actions.
      - id: allowed-iam-exempt
        text: Allowed, because IAM actions are exempt from SCPs
        variants:
          - text: Allowed, since SCPs don't cover IAM actions
          - text: Allowed, as IAM actions sit outside any SCP
        explanation:
          text: >-
            SCPs cap what users and roles in a member account can do, IAM actions included.
      - id: denied-users-cannot
        text: Denied, because IAM users can never create users
        variants:
          - text: Denied, since an IAM user can't create other users
          - text: Denied, as IAM users aren't able to create users
        explanation:
          text: >-
            Creating IAM users is ordinary IAM work an IAM admin can do; here the SCP is what stops
            it.
      - id: denied-scp
        text: Denied, because the request falls outside the SCP
        variants:
          - text: Denied, since the SCP doesn't allow the request
          - text: Denied, as the action is outside what the SCP allows
    correct_answers: [denied-scp]
    hint:
      text: >-
        Some policy types grant nothing but set a ceiling on everything else.
    explanation:
      text: >-
        An SCP caps what users and roles in a member account can do. It grants nothing, but if one
        applies, it must allow the request too. `AdministratorAccess` allows everything, yet the SCP
        allows only S3 actions, so creating an IAM user is denied.

  - id: q04-sim-scp-allows-all-no-policy
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 1: predict all eight"
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation, organizations]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A member account's service control policy (SCP) allows every action. A new IAM user in that account has no policies and no group, and no resource policy mentions it. It tries to download a file from an S3 bucket in the account. What happens?
    choices:
      - id: scp-denied-default
        text: Denied, because no policy grants it anything
        variants:
          - text: Denied, since nothing grants it the action
          - text: Denied, as no policy gives it permission
      - id: scp-allowed
        text: Allowed, because the SCP allows every action
        variants:
          - text: Allowed, since the SCP permits all actions
          - text: Allowed, as every action passes the SCP
        explanation:
          text: >-
            An SCP grants nothing; it only sets the ceiling. The user still needs an allow in an
            identity-based or resource-based policy.
      - id: scp-denied-explicit
        text: Denied, because SCPs deny new users at first
        variants:
          - text: Denied, since an SCP blocks new users at first
          - text: Denied, as new users start out denied by SCPs
        explanation:
          text: >-
            The result is denied, but by the default implicit deny, not by anything the SCP says
            about new users.
      - id: scp-allowed-account
        text: Allowed, because the bucket is in its own account
        variants:
          - text: Allowed, since the bucket sits in the same account
          - text: Allowed, as user and bucket share an account
        explanation:
          text: >-
            Being in the same account means either kind of policy can grant access, but one still
            has to.
    correct_answers: [scp-denied-default]
    explanation:
      text: >-
        SCPs, permissions boundaries and session policies only set limits; none of them grants a
        permission. With no identity-based or resource-based policy allowing the download, the
        request ends in the default deny, however permissive the SCP is.

  - id: q04-sim-bucket-policy-same-account
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 1: predict all eight"
    task: "2.3"
    level: application
    topics: [iam, policy-evaluation]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An IAM user has no identity-based policies. A bucket in the same account has a bucket policy that names this user and allows `s3:GetObject`. Nothing else applies. The user downloads a file from the bucket. What happens?
    choices:
      - id: needs-identity-policy
        text: Denied, because users always need an identity policy
        variants:
          - text: Denied, since a user must have an identity policy
          - text: Denied, since an identity policy is always required
        explanation:
          text: >-
            Across accounts, both sides must allow. Within one account, an allow in either kind of
            policy is enough.
      - id: allowed-resource-policy
        text: Allowed, because the bucket policy grants it
        variants:
          - text: Allowed, since the bucket's policy permits it
          - text: Allowed, as the bucket policy gives access
      - id: bucket-policy-accounts-only
        text: Denied, because bucket policies name only accounts
        variants:
          - text: Denied, since a bucket policy can't name a user
          - text: Denied, as bucket policies list only accounts
        explanation:
          text: >-
            A resource-based policy names principals, which can be users or roles as well as
            accounts.
      - id: explicit-deny-default
        text: Denied, because new users carry an explicit deny
        variants:
          - text: Denied, since every new user has a built-in deny
          - text: Denied, as an explicit deny comes with new users
        explanation:
          text: >-
            There's no built-in explicit deny. The default is an implicit deny, which the bucket
            policy's allow overrides.
    correct_answers: [allowed-resource-policy]
    hint:
      text: >-
        Requester and resource are in the same account. How many sides must allow?
    explanation:
      text: >-
        Within one account, an allow in either an identity-based or a resource-based policy is
        enough, and nothing denies the request. That surprises people, and it's why a bucket policy
        deserves the same review as an identity's policy.

  # ------------------------------------------------------------------ 04.05 Credentials and federation

  - id: q04-password-policy-scope
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Passwords and MFA protect a person's sign-in
    task: "2.3"
    level: understanding
    topics: [iam, credentials, password-policy]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company sets a custom IAM account password policy that requires 16-character passwords. Which credentials does that policy apply to?
    choices:
      - id: pw-iam-users
        text: The console passwords of the account's IAM users
        variants:
          - text: IAM users' console passwords in the account
          - text: The passwords IAM users sign in to the console with
      - id: pw-root-too
        text: The IAM users' passwords and the root user's password
        variants:
          - text: Both the root password and the IAM users' passwords
          - text: The root user's password as well as the IAM users'
        explanation:
          text: >-
            The password policy doesn't cover the root user's password. Root's protection is
            required MFA and a strong password you choose yourself.
      - id: pw-access-keys
        text: The IAM users' passwords and their access keys
        variants:
          - text: Both IAM users' passwords and their access keys
          - text: IAM users' access keys as well as their passwords
        explanation:
          text: >-
            Access keys aren't passwords, and the password policy doesn't govern them.
      - id: pw-roles
        text: The passwords of IAM roles that people assume
        variants:
          - text: Passwords belonging to IAM roles people assume
          - text: The roles' passwords, used when people assume them
        explanation:
          text: >-
            Roles have no passwords at all; assuming one gives temporary credentials.
    correct_answers: [pw-iam-users]
    explanation:
      text: >-
        An IAM password policy is the account's rule for IAM user passwords: length, character
        types, expiry and reuse. It doesn't cover the root user's password or access keys, and it
        has no lockout setting, so AWS recommends a strong policy plus MFA.

  - id: q04-phishing-resistant-mfa
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Passwords and MFA protect a person's sign-in
    task: "2.3"
    level: recall
    topics: [iam, mfa]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which kind of multi-factor authentication (MFA) that AWS supports resists phishing?
    choices:
      - id: authenticator-app
        text: A virtual authenticator app showing six-digit codes
        variants:
          - text: An authenticator app on a phone with six-digit codes
          - text: A virtual MFA app that displays six-digit codes
        explanation:
          text: >-
            A code from an app can be typed into a fake sign-in page and reused by an attacker.
      - id: hardware-totp
        text: A hardware token that shows six-digit codes
        variants:
          - text: A small hardware device displaying six-digit codes
          - text: A physical TOTP token with a six-digit display
        explanation:
          text: >-
            Like an app, it shows a code a person can be tricked into typing into a fake page.
      - id: passkey
        text: A passkey or a physical security key
        variants:
          - text: A security key, or a passkey on a device
          - text: A passkey, or a security key you touch
      - id: long-password
        text: A password of at least 16 characters
        variants:
          - text: A password with 16 or more characters
          - text: A sixteen-character or longer password
        explanation:
          text: >-
            A password isn't a second factor, and any password can be stolen through a fake
            sign-in page.
    correct_answers: [passkey]
    explanation:
      text: >-
        AWS supports three kinds of MFA: passkeys or security keys, virtual authenticator apps, and
        hardware TOTP tokens. Only passkeys and security keys resist phishing, which is why AWS
        recommends them first; a six-digit code can be typed into a fake page.

  - id: q04-cli-without-keys-two
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: '"Access keys are the normal way to use the command line" is out of date'
    task: "2.3"
    level: application
    topics: [iam, credentials, access-keys, misconception]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A developer wants to run AWS CLI commands without creating any long-term access keys. Which options let her do that? (Select TWO.)
    choices:
      - id: cloudshell
        text: Use AWS CloudShell from the console
        variants:
          - text: Run the commands in AWS CloudShell
          - text: Open AWS CloudShell in the console
      - id: user-access-key
        text: Create an access key for her IAM user
        variants:
          - text: Generate an IAM user access key
          - text: Make an access key on her IAM user
        explanation:
          text: >-
            An IAM user's access key is the long-term credential she wants to avoid. It was the
            standard method for years, which is why the old advice lingers.
      - id: aws-login
        text: Run `aws login` with her console sign-in
        variants:
          - text: Sign in to the CLI with `aws login`
          - text: Use `aws login` with her console credentials
      - id: root-key
        text: Use the root user's access key instead
        variants:
          - text: Switch to an access key for the root user
          - text: Create a root user access key for the CLI
        explanation:
          text: >-
            Root access keys are long-term too, and give unlimited access; AWS advises never
            creating them.
      - id: password-in-config
        text: Save her console password in the CLI config
        variants:
          - text: Put her console password in the CLI settings
          - text: Store her password in the CLI configuration
        explanation:
          text: >-
            The CLI doesn't sign requests with a console password, and storing a password in a file
            is a long-term secret on disk.
    correct_answers: [cloudshell, aws-login]
    hint:
      text: >-
        Look for the options that give temporary credentials.
    explanation:
      text: >-
        AWS's best practices tell people to use temporary credentials. CloudShell runs in the
        console with the signed-in identity, and `aws login`, added in November 2025 (AWS CLI 2.32.0
        or later), gives the CLI temporary credentials from a console sign-in. Neither needs a
        long-term access key.

  - id: q04-access-key-secret-once
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: "Access keys are long-term secrets: avoid them where you can"
    task: "2.3"
    level: recall
    topics: [iam, credentials, access-keys]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which statement about IAM access keys is true?
    choices:
      - id: expire-12h
        text: They stop working on their own after 12 hours.
        variants:
          - text: They expire by themselves after 12 hours.
          - text: After 12 hours they stop working automatically.
        explanation:
          text: >-
            Access keys are long-term: they work until someone deletes them. Temporary credentials
            are the ones that expire.
      - id: mfa-each-use
        text: They prompt for an MFA code each time they're used.
        variants:
          - text: Each use of them asks for an MFA code.
          - text: They need an MFA code every time they're used.
        explanation:
          text: >-
            An access key lets a program act without a password or MFA, which is part of the risk.
      - id: root-cannot
        text: They can't be created for the root user at all.
        variants:
          - text: The root user is unable to have them.
          - text: No access key can ever exist for the root user.
        explanation:
          text: >-
            Root access keys can exist, and that's the danger: AWS advises never creating them.
      - id: secret-once
        text: The secret part is shown only once, at creation.
        variants:
          - text: The secret access key is shown just once, when created.
          - text: Their secret is displayed only once, when they're made.
    correct_answers: [secret-once]
    explanation:
      text: >-
        An access key has two parts: an access key ID and a secret access key, and the secret is
        shown only once, when the key is created. A key works until someone deletes it, and lets a
        program act as an IAM user (or the root user) without a password or MFA.

  - id: q04-temporary-beats-access-keys
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: "Access keys are long-term secrets: avoid them where you can"
    task: "2.3"
    level: understanding
    topics: [iam, credentials]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Why does AWS recommend temporary credentials over IAM user access keys?
    choices:
      - id: cheaper
        text: Temporary credentials cost less to issue than access keys
        variants:
          - text: Issuing temporary credentials is cheaper than access keys
          - text: Access keys cost more to issue than temporary credentials
        explanation:
          text: >-
            Cost isn't the reason. The difference is how long a leaked copy keeps working.
      - id: more-permissions
        text: Temporary credentials carry more permissions than access keys
        variants:
          - text: Access keys carry fewer permissions than temporary credentials
          - text: Temporary credentials grant wider permissions than access keys
        explanation:
          text: >-
            Credentials prove who you are; permissions come from policies either way.
      - id: leak-expires
        text: A leaked temporary credential soon stops working on its own
        variants:
          - text: A leaked temporary credential becomes useless before long
          - text: If leaked, temporary credentials soon stop working by themselves
      - id: cli-keys-not-work
        text: Access keys no longer work with the AWS CLI
        variants:
          - text: The AWS CLI no longer accepts access keys
          - text: Access keys have stopped working in the AWS CLI
        explanation:
          text: >-
            Access keys still work with the CLI; AWS simply advises keyless options instead.
    correct_answers: [leak-expires]
    explanation:
      text: >-
        An access key works until someone deletes it, so a copy leaked in code or a screenshot can
        be used for months. Temporary credentials stop working on their own within hours, so a
        leaked copy soon becomes useless, and nothing long-lived has to be stored or rotated.

  - id: q04-unavoidable-access-key-practice
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: '"Access keys are the normal way to use the command line" is out of date'
    task: "2.3"
    level: application
    topics: [iam, credentials, access-keys]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A program on a company's own servers, outside AWS, can't use IAM roles, so the team decides it must use an IAM user's access key. Which practice should the team follow for that key?
    choices:
      - id: key-in-source
        text: Put the key in the program's source code for reliability
        variants:
          - text: Write the key into the source code so it's always there
          - text: Keep the key in the program's code so it never goes missing
        explanation:
          text: >-
            Keys in code leak easily, for example into a public repository.
      - id: key-hygiene
        text: Rotate it when needed, watch its last use, delete it when unused
        variants:
          - text: Rotate it as needed, check when it was last used, delete if unused
          - text: Rotate when needed, monitor last use, and remove it when idle
      - id: key-shared
        text: Share one key across all programs to keep it simple
        variants:
          - text: Use a single key for every program, for simplicity
          - text: Let every program use the same key, to keep it simple
        explanation:
          text: >-
            One shared key means one leak exposes every program, and you can't tell them apart.
      - id: key-root
        text: Create the key on the root user so it never lacks access
        variants:
          - text: Make it a root user key so access is never missing
          - text: Use a root user key so the program never lacks access
        explanation:
          text: >-
            Root keys give unlimited access to anyone who copies them; never create them.
    correct_answers: [key-hygiene]
    hint:
      text: >-
        The key is long-term, so the practice should limit how long a leaked copy is useful.
    explanation:
      text: >-
        Long-term keys still have a few legitimate uses, such as a workload outside AWS that can't
        use roles. If you must have one, rotate it when needed, watch its "last used" information,
        delete it when it's unused, and never put it in code.

  - id: q04-db-password-rotation-store
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Your application's secrets belong in a store, not in the code
    task: "2.3"
    level: application
    topics: [secrets, secrets-manager]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's application connects to an Amazon RDS database. The security team requires the database password to be kept out of the code and changed automatically on a schedule. Where should it be stored?
    choices:
      - id: parameter-string
        text: Systems Manager Parameter Store, as a String parameter
        variants:
          - text: A String parameter in Systems Manager Parameter Store
          - text: AWS Systems Manager Parameter Store, String type
        explanation:
          text: >-
            Parameter Store has no automatic rotation, and a String parameter isn't encrypted.
      - id: encrypted-file-repo
        text: An encrypted file kept in the code repository
        variants:
          - text: An encrypted file stored with the source code
          - text: A file in the code repository, encrypted
        explanation:
          text: >-
            That keeps the secret with the code, and changing it means editing and redeploying.
      - id: iam-access-key
        text: An IAM user's access key with the same value
        variants:
          - text: An access key on an IAM user, set to the password
          - text: The secret part of an IAM user's access key
        explanation:
          text: >-
            Access keys are AWS credentials, not a store for other passwords.
      - id: secrets-manager
        text: AWS Secrets Manager, with rotation turned on
        variants:
          - text: AWS Secrets Manager, with automatic rotation
          - text: A secret in AWS Secrets Manager that rotates
    correct_answers: [secrets-manager]
    hint:
      text: >-
        Of AWS's two stores, which one changes a secret on a schedule?
    explanation:
      text: >-
        AWS Secrets Manager stores secrets such as database passwords, always encrypted, and can
        rotate them automatically on a schedule, with built-in rotation for some databases. On the
        exam, "rotate automatically" points to Secrets Manager.

  - id: q04-config-value-parameter-store
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Your application's secrets belong in a store, not in the code
    task: "2.3"
    level: application
    topics: [secrets, parameter-store]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A web application needs a few configuration values at run time, such as the name of its S3 bucket. The values aren't secret and never need rotating. Which AWS capability is designed for storing them?
    choices:
      - id: cfg-parameter-store
        text: AWS Systems Manager Parameter Store
        variants:
          - text: Parameter Store, in AWS Systems Manager
          - text: Systems Manager Parameter Store
      - id: cfg-secrets-manager
        text: AWS Secrets Manager
        variants:
          - text: Secrets Manager
          - text: The AWS Secrets Manager service
        explanation:
          text: >-
            Secrets Manager is built for secrets through their life, with rotation, and charges per
            secret. A plain setting doesn't need it.
      - id: cfg-identity-center
        text: AWS IAM Identity Center
        variants:
          - text: IAM Identity Center
          - text: The AWS IAM Identity Center service
        explanation:
          text: >-
            Identity Center signs people in to AWS accounts; it doesn't hold application settings.
      - id: cfg-sts
        text: AWS Security Token Service (AWS STS)
        variants:
          - text: AWS STS
          - text: The AWS Security Token Service
        explanation:
          text: >-
            AWS STS issues temporary credentials; it doesn't store values.
    correct_answers: [cfg-parameter-store]
    hint:
      text: >-
        One store is built for secrets, the other for settings.
    explanation:
      text: >-
        Parameter Store, a capability of AWS Systems Manager, keeps configuration values such as
        settings, IDs and addresses out of the code, with standard parameters at no additional
        charge (as of 2026-10-23). Values can be encrypted with the `SecureString` type when needed.

  - id: q04-secrets-vs-parameters-two
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Your application's secrets belong in a store, not in the code
    task: "2.3"
    level: understanding
    topics: [secrets, secrets-manager, parameter-store]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which statements correctly compare AWS Secrets Manager with AWS Systems Manager Parameter Store? (Select TWO.)
    choices:
      - id: only-sm-rotates
        text: Only Secrets Manager rotates values automatically.
        variants:
          - text: Automatic rotation is offered only by Secrets Manager.
          - text: Secrets Manager alone can rotate values automatically.
      - id: ps-always-encrypts
        text: Parameter Store encrypts every value it holds.
        variants:
          - text: Every value in Parameter Store is always encrypted.
          - text: Parameter Store always encrypts its values.
        explanation:
          text: >-
            That's reversed: Secrets Manager always encrypts; Parameter Store encrypts only
            `SecureString` values.
      - id: ps-securestring
        text: Parameter Store can encrypt values that use `SecureString`.
        variants:
          - text: Parameter Store encrypts a value if it's a `SecureString`.
          - text: A `SecureString` value in Parameter Store is encrypted.
      - id: sm-for-config
        text: Secrets Manager is built mainly for plain settings.
        variants:
          - text: Secrets Manager is designed mostly for plain settings.
          - text: Plain settings are Secrets Manager's main purpose.
        explanation:
          text: >-
            That's Parameter Store's job. Secrets Manager is built for secrets such as passwords
            and API keys.
      - id: both-hold-aws-keys
        text: Both are the right place for an app's AWS access keys.
        variants:
          - text: Either one should hold an app's AWS access keys.
          - text: An app's AWS access keys belong in either one.
        explanation:
          text: >-
            AWS's own credentials belong in neither: give the code an IAM role instead.
    correct_answers: [only-sm-rotates, ps-securestring]
    explanation:
      text: >-
        Both keep values out of code, and code reads them at run time with permissions from IAM.
        Secrets Manager is built for secrets, always encrypts with AWS KMS, and can rotate them on a
        schedule. Parameter Store is built for configuration, with optional encryption through the
        `SecureString` type and no rotation.

  - id: q04-aws-keys-in-secrets-manager
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Your application's secrets belong in a store, not in the code
    task: "2.3"
    level: application
    topics: [secrets, roles, credentials]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A developer plans to store an IAM user's access keys in AWS Secrets Manager so that an application on Amazon EC2 can read them and call other AWS services. What does AWS advise instead?
    choices:
      - id: securestring-instead
        text: Store the keys in Parameter Store as a `SecureString`
        variants:
          - text: Keep the keys as a `SecureString` in Parameter Store
          - text: Put the keys in Parameter Store, encrypted as `SecureString`
        explanation:
          text: >-
            Moving the keys to another store still leaves long-term AWS credentials to leak and
            rotate.
      - id: role-instead
        text: Give the application an IAM role with the permissions
        variants:
          - text: Have the app's instance use an IAM role with the access
          - text: Let the application use an IAM role with the access
      - id: rotate-daily
        text: Keep the plan, but rotate the keys every day
        variants:
          - text: Go ahead, but rotate the keys daily
          - text: Keep it as planned, with daily key rotation
        explanation:
          text: >-
            Rotation shortens the risk but doesn't remove it. A role removes long-term keys
            altogether.
      - id: encrypt-in-code
        text: Encrypt the keys and keep them in the source code
        variants:
          - text: Put encrypted copies of the keys in the code
          - text: Keep the keys, encrypted, inside the source code
        explanation:
          text: >-
            Secrets in code are exactly what the stores exist to prevent.
    correct_answers: [role-instead]
    hint:
      text: >-
        Is there a way for the application to get AWS credentials without anyone storing them?
    explanation:
      text: >-
        AWS's own credentials don't belong in either store. Secrets Manager's documentation points
        back to IAM: give the code a role. On AWS compute, AWS delivers the role's temporary
        credentials to the program automatically, so nothing long-lived is stored.

  - id: q04-workforce-sso-many-accounts
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: "Federation: sign in once, elsewhere, and receive temporary access"
    task: "2.3"
    level: application
    topics: [federation, identity-center]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company runs 12 AWS accounts in AWS Organizations. It wants employees to sign in once, with MFA, and then choose the account and level of access they need, without an IAM user for each person in each account. Which service should it use?
    choices:
      - id: ws-cognito
        text: Amazon Cognito
        variants:
          - text: Cognito
          - text: The Amazon Cognito service
        explanation:
          text: >-
            Cognito signs in the customers of your own web or mobile app, not your workforce.
      - id: ws-directory-service
        text: AWS Directory Service
        variants:
          - text: Directory Service
          - text: The AWS Directory Service
        explanation:
          text: >-
            Directory Service provides or connects a Microsoft Active Directory. It can be a source
            of identities for Identity Center, but on its own it doesn't give single sign-on to AWS
            accounts.
      - id: ws-identity-center
        text: AWS IAM Identity Center
        variants:
          - text: IAM Identity Center
          - text: The AWS IAM Identity Center service
      - id: ws-secrets-manager
        text: AWS Secrets Manager
        variants:
          - text: Secrets Manager
          - text: The AWS Secrets Manager service
        explanation:
          text: >-
            Secrets Manager stores application secrets; it doesn't sign people in.
    correct_answers: [ws-identity-center]
    hint:
      text: >-
        Whose sign-in is it: the company's staff, or its customers?
    explanation:
      text: >-
        IAM Identity Center is AWS's recommended way to give a workforce single sign-on: one
        sign-in, with MFA, to many AWS accounts and business applications. Staff pick an account and
        a permission set in the access portal and receive temporary credentials. Its old name was
        AWS Single Sign-On, until 2022-07-26.

  - id: q04-app-customers-cognito
    revision: 2
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Four identity services, side by side
    task: "2.3"
    level: application
    topics: [federation, cognito]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A travel company lists four sign-in needs it must meet on AWS. For which need is Amazon Cognito the service designed?
    choices:
      - id: need-partner-account
        text: A partner's AWS account must read one of its buckets
        variants:
          - text: A partner's AWS account needs to read one of its buckets
          - text: One of its buckets must be readable by a partner's AWS account
        explanation:
          text: >-
            People or programs in another AWS account get in through a cross-account IAM role.
      - id: need-staff-accounts
        text: Staff need one sign-in for its eight AWS accounts
        variants:
          - text: Its staff need a single sign-in for eight AWS accounts
          - text: Staff want one sign-in across its eight AWS accounts
        explanation:
          text: >-
            Workforce single sign-on across many AWS accounts is the job of IAM Identity Center.
      - id: need-on-prem-ad
        text: Staff sign-ins must pass to its on-premises Active Directory
        variants:
          - text: Staff sign-ins must go to its on-premises Active Directory
          - text: Its on-premises Active Directory must check staff sign-ins
        explanation:
          text: >-
            Passing sign-ins to an existing Microsoft Active Directory is AWS Directory Service, with
            AD Connector.
      - id: need-travelers
        text: Travelers must sign up and sign in to its booking app
        variants:
          - text: Travelers must register and sign in to its booking app
          - text: Its booking app must let travelers sign up and sign in
    correct_answers: [need-travelers]
    hint:
      text: >-
        Ask whose sign-in each need is about: staff, another AWS account, or the company's own
        customers.
    explanation:
      text: >-
        Amazon Cognito handles sign-up and sign-in for the customers of a web or mobile app. Its
        user pools sign app users in, including with Google, Apple or Facebook accounts, and its
        identity pools can swap that sign-in for temporary, limited AWS credentials. "Customers"
        points to Cognito; "employees" points to Identity Center.

  - id: q04-active-directory-directory-service
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Four identity services, side by side
    task: "2.3"
    level: understanding
    topics: [federation, directory-service]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's staff accounts live in Microsoft Active Directory in its own data center. It wants AWS to pass sign-ins to that existing directory instead of creating a second set of accounts. Which AWS service provides this?
    choices:
      - id: ad-directory-service
        text: AWS Directory Service
        variants:
          - text: Directory Service
          - text: The AWS Directory Service
      - id: ad-cognito
        text: Amazon Cognito
        variants:
          - text: Cognito
          - text: The Amazon Cognito service
        explanation:
          text: >-
            Cognito is for the customers of your own app, not a company's Active Directory.
      - id: ad-sts
        text: AWS Security Token Service (AWS STS)
        variants:
          - text: AWS STS
          - text: The AWS Security Token Service
        explanation:
          text: >-
            AWS STS issues temporary credentials; it doesn't connect to a directory.
      - id: ad-secrets-manager
        text: AWS Secrets Manager
        variants:
          - text: Secrets Manager
          - text: The AWS Secrets Manager service
        explanation:
          text: >-
            Secrets Manager stores application secrets, not staff accounts.
    correct_answers: [ad-directory-service]
    hint:
      text: >-
        The key word is Active Directory.
    explanation:
      text: >-
        AWS Directory Service is for Microsoft Active Directory. It offers AWS Managed Microsoft AD,
        a managed directory on AWS, and AD Connector, which passes sign-ins to an existing
        on-premises directory. It is often used as the identity source for IAM Identity Center.

  - id: q04-single-sign-on-current-name
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: '"AWS Single Sign-On" is the old name'
    task: "2.3"
    level: recall
    topics: [federation, identity-center, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An older study guide recommends "AWS Single Sign-On" for workforce access to many AWS accounts. What is that service called today?
    choices:
      - id: sso-organizations
        text: AWS Organizations
        variants:
          - text: Organizations
          - text: The AWS Organizations service
        explanation:
          text: >-
            Organizations runs many accounts together. Identity Center works with it, but it's a
            different service.
      - id: sso-cognito
        text: Amazon Cognito
        variants:
          - text: Cognito
          - text: The Amazon Cognito service
        explanation:
          text: >-
            Cognito signs in the customers of an app; it was never called AWS Single Sign-On.
      - id: sso-directory
        text: AWS Directory Service
        variants:
          - text: Directory Service
          - text: The AWS Directory Service
        explanation:
          text: >-
            Directory Service is for Microsoft Active Directory, a separate service.
      - id: sso-identity-center
        text: AWS IAM Identity Center
        variants:
          - text: IAM Identity Center
          - text: The AWS IAM Identity Center service
    correct_answers: [sso-identity-center]
    explanation:
      text: >-
        AWS renamed AWS Single Sign-On to AWS IAM Identity Center on July 26, 2022. It's the same
        service, so pick Identity Center when a scenario asks for workforce single sign-on. The old
        name survives in some command names, which is one reason it lingers.

  - id: q04-staff-and-customers-two
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: "Worked example: the bakery grows"
    task: "2.3"
    level: application
    topics: [federation, identity-center, cognito]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A restaurant chain's staff work in three AWS accounts, and its customers order through the chain's mobile app. The chain wants a sign-in approach for each group. Which services should it use? (Select TWO.)
    choices:
      - id: two-identity-center-staff
        text: AWS IAM Identity Center for the staff
        variants:
          - text: IAM Identity Center, for the staff
          - text: The staff sign in through IAM Identity Center
      - id: two-directory-customers
        text: AWS Directory Service for the customers
        variants:
          - text: Directory Service, for the customers
          - text: The customers sign in through Directory Service
        explanation:
          text: >-
            Directory Service is for Microsoft Active Directory, which holds staff accounts, not
            app customers.
      - id: two-cognito-customers
        text: Amazon Cognito for the customers
        variants:
          - text: Cognito, for the customers
          - text: The customers sign in through Cognito
      - id: two-iam-users-customers
        text: IAM users in each account for the customers
        variants:
          - text: An IAM user per customer, in each account
          - text: The customers get IAM users in every account
        explanation:
          text: >-
            Customers should never be IAM users; there may be thousands, and they need no access to
            the AWS accounts.
      - id: two-secrets-staff
        text: AWS Secrets Manager for the staff
        variants:
          - text: Secrets Manager, for the staff
          - text: The staff sign in through Secrets Manager
        explanation:
          text: >-
            Secrets Manager stores application secrets; it doesn't sign anyone in.
    correct_answers: [two-identity-center-staff, two-cognito-customers]
    hint:
      text: >-
        Ask whose sign-in each one is: staff reaching AWS accounts, or customers using an app.
    explanation:
      text: >-
        The key question is whose identities a service holds. IAM Identity Center gives a workforce
        single sign-on across many AWS accounts, with temporary credentials. Amazon Cognito gives an
        app's customers their own sign-up and sign-in.

  - id: q04-temporary-credential-sources-two
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: "The big picture: match the credential to who is asking"
    task: "2.3"
    level: understanding
    topics: [credentials, roles, federation]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which of these give the person or program temporary credentials that expire on their own? (Select TWO.)
    choices:
      - id: tmp-user-key
        text: An access key created for an IAM user
        variants:
          - text: An IAM user's access key
          - text: An access key on an IAM user
        explanation:
          text: >-
            An IAM user's access key is long-term: it works until someone deletes it.
      - id: tmp-assume-role
        text: Assuming an IAM role
        variants:
          - text: Taking on an IAM role
          - text: Assuming a role in IAM
      - id: tmp-user-password
        text: An IAM user's console password
        variants:
          - text: The console password of an IAM user
          - text: A console password for an IAM user
        explanation:
          text: >-
            Passwords are long-term credentials; under the default policy they never expire.
      - id: tmp-identity-center
        text: Signing in through IAM Identity Center
        variants:
          - text: A sign-in through IAM Identity Center
          - text: Signing in with IAM Identity Center
      - id: tmp-root-password
        text: The root user's password
        variants:
          - text: The password of the root user
          - text: A root user password
        explanation:
          text: >-
            The root user's password is long-term, like any password.
    correct_answers: [tmp-assume-role, tmp-identity-center]
    explanation:
      text: >-
        Temporary credentials are issued by AWS STS for a limited time, from minutes to hours, and
        then stop working. Roles and federation, including IAM Identity Center, are built on them.
        Passwords and access keys are long-term: they work until someone changes or deletes them.

  # ------------------------------------------------------------------ Simulation S4: decisions 3 and 5

  - id: q04-sim-cross-account-role-parts-two
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 3: a role instead of a bucket policy"
    task: "2.3"
    level: application
    topics: [iam, roles, cross-account]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company wants users from a partner's AWS account to read files in one of its buckets through a cross-account role, rather than through its bucket policy. Which pieces does the company create in its own account? (Select TWO.)
    choices:
      - id: xr-trust-policy
        text: A role whose trust policy names the partner's account
        variants:
          - text: A role with a trust policy naming the partner's account
          - text: A role that trusts the partner's account in its trust policy
      - id: xr-user-per-partner
        text: An IAM user for each of the partner's users
        variants:
          - text: One IAM user per partner user
          - text: A separate IAM user for every partner user
        explanation:
          text: >-
            Avoiding a user per outsider is the point of a cross-account role.
      - id: xr-permissions-policy
        text: A permissions policy on the role allowing reads
        variants:
          - text: A permissions policy on that role that allows reading
          - text: The role's permissions policy, allowing reads
      - id: xr-shared-key
        text: An access key to send to the partner
        variants:
          - text: An access key shared with the partner
          - text: An access key handed over to the partner
        explanation:
          text: >-
            Assuming the role gives temporary credentials; no long-term key is shared between the
            businesses.
      - id: xr-identity-policy-partner
        text: An identity policy on the partner's users
        variants:
          - text: An identity-based policy for the partner's users
          - text: A policy attached to the partner's users
        explanation:
          text: >-
            That piece is needed, but the partner creates it in its own account; the company
            controls only its own identities.
    correct_answers: [xr-trust-policy, xr-permissions-policy]
    hint:
      text: >-
        A role has two policies: one says who may assume it, the other what it may do.
    explanation:
      text: >-
        A cross-account role lives in the account that owns the resources. Its trust policy names
        the account allowed to assume it, and its permissions policy says what it may do. The third
        piece, an identity policy letting the partner's users assume the role, lives in the
        partner's account. Assuming the role gives temporary credentials.

  - id: q04-sim-permission-set
    page: guide/04-shared-responsibility-and-access/09-sim-policy-playground.md
    section: "Decision 5: thirty staff, ten shop accounts"
    task: "2.3"
    level: recall
    topics: [federation, identity-center]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        In AWS IAM Identity Center, what does an administrator create to describe a job's access, which Identity Center then turns into IAM roles in the AWS accounts chosen?
    choices:
      - id: ps-scp
        text: A service control policy
        variants:
          - text: An SCP
          - text: Service control policies
        explanation:
          text: >-
            An SCP, set in AWS Organizations, caps what a member account can do; it doesn't create
            roles.
      - id: ps-user-group
        text: An IAM user group
        variants:
          - text: The IAM user group
          - text: IAM user groups
        explanation:
          text: >-
            An IAM user group holds IAM users in one account. Identity Center users don't need IAM
            users at all.
      - id: ps-permission-set
        text: A permission set
        variants:
          - text: The permission set
          - text: Permission sets
      - id: ps-trust-policy
        text: A trust policy
        variants:
          - text: The trust policy
          - text: Trust policies
        explanation:
          text: >-
            A trust policy says who may assume one particular role. It isn't a bundle of
            permissions that becomes roles in many accounts.
    correct_answers: [ps-permission-set]
    explanation:
      text: >-
        A permission set is Identity Center's bundle of permissions. Identity Center creates the
        matching IAM roles in each account you assign it to, and staff sign in once at the access
        portal, pick an account and a permission set, and receive short-term credentials.

flashcards:

  # ------------------------------------------------------------------ 04.01

  - id: c04-layers-that-never-move
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "Worked example: who patches what at the bakery"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility]
    front:
      text: Under the shared responsibility model, which layers stay on the same side whatever the service?
    back:
      text: >-
        Always AWS's: buildings, hardware, the host operating system and virtualization. Always
        yours: your data, who can access it, and code you wrote or added. Only the middle layers
        move with the service.

  - id: c04-ec2-customer-three
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: recall
    topics: [shared-responsibility, ec2]
    front:
      text: On Amazon EC2, which three things does AWS say the customer manages?
    back:
      text: >-
        The guest operating system, including its updates and security patches; any software
        installed on the server; the rules of its security group.

  - id: c04-s3-customer-three
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: recall
    topics: [shared-responsibility, s3]
    front:
      text: On an abstracted service such as Amazon S3, which three things are the customer's?
    back:
      text: >-
        Its data, including which encryption options to use; classifying that data; using IAM to
        say who can do what. AWS runs the infrastructure, operating system and platform.

  - id: c04-rds-what-stays
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "A database three ways: on-premises, on EC2, on RDS"
    task: "2.1"
    level: recall
    topics: [shared-responsibility, rds]
    front:
      text: On Amazon RDS, what does the RDS User Guide leave with the customer?
    back:
      text: >-
        Application optimization, meaning tuning its queries. The customer also still decides who
        can reach the database, with IAM and security groups.

  - id: c04-ec2-to-rds-hands-aws
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "A database three ways: on-premises, on EC2, on RDS"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, rds]
    front:
      text: When a database moves from an EC2 instance to Amazon RDS, what work passes to AWS?
    back:
      text: >-
        Installing and patching the operating system and the database software, plus backups,
        scaling and high availability. Hardware, power and cooling were already AWS's on EC2.

  - id: c04-lambda-what-stays
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: '"With serverless, AWS handles the security" is wrong'
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, lambda, misconception]
    front:
      text: AWS runs and patches the servers behind AWS Lambda. What security work stays with the customer?
    back:
      text: >-
        The function code and its libraries; moving functions off retired runtimes; the permissions
        of the function's IAM role. Its data stays the customer's too, as on every service.

  # ------------------------------------------------------------------ 04.02

  - id: c04-one-task-one-side
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: '"Shared" doesn''t mean both sides do the same task'
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types, misconception]
    front:
      text: A question asks who does one specific task, such as patching the guest OS on EC2. Can the answer be "both AWS and the customer"?
    back:
      text: >-
        No. A specific task belongs to one side. "Shared" describes a kind of control (patch
        management, configuration management, training), in which each side does its own half.

  - id: c04-inherited-control-evidence
    page: guide/04-shared-responsibility-and-access/02-shared-inherited-customer-specific.md
    section: "Inherited controls: AWS does all of it"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, control-types, compliance]
    front:
      text: How does a customer show an auditor that an inherited control, such as fire protection in AWS's data centers, works?
    back:
      text: >-
        With AWS's third-party audit reports. The customer does none of the work for an inherited
        control, so its evidence comes from AWS.

  # ------------------------------------------------------------------ 04.03

  - id: c04-why-role-for-program
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: "Worked example: an identity for every need at the bakery"
    task: "2.3"
    level: understanding
    topics: [iam, roles, credentials]
    front:
      text: Why should a program running on AWS use an IAM role rather than an IAM user's access keys?
    back:
      text: >-
        A role gives temporary credentials that expire and renew on their own, so nothing
        long-lived sits on the server to be stolen. Access keys keep working until someone deletes
        them.

  - id: c04-root-only-examples
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: Only the root user can do a short list of tasks
    task: "2.3"
    level: recall
    topics: [iam, root-user]
    front:
      text: Name three tasks only the root user can do, and the pattern they share.
    back:
      text: >-
        Close the account; change its sign-up email address; restore permissions when the only IAM
        admin is locked out (as of 2026-10-23). Pattern: they change the account itself or rescue
        it from a lockout.

  - id: c04-support-plan-not-root
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: '"Changing the Support plan needs root" is out of date'
    task: "2.3"
    level: recall
    topics: [iam, root-user, misconception]
    front:
      text: Does changing the AWS Support plan require the root user?
    back:
      text: >-
        No. It isn't on AWS's current list of root-only tasks (checked 2026-10-23), so an IAM
        identity with permission can do it. Older material and many practice questions still say it
        needs root.

  - id: c04-why-root-strongest-protection
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An AWS account has four kinds of identity
    task: "2.3"
    level: understanding
    topics: [iam, root-user, mfa]
    front:
      text: Why does the root user need the strongest sign-in protection in the account?
    back:
      text: >-
        It has complete access to every service and resource, and IAM policies can't be attached
        to it, so nothing inside the account narrows what a stolen root sign-in could do.

  - id: c04-admin-not-root-reasons
    page: guide/04-shared-responsibility-and-access/03-identities.md
    section: An IAM admin is not the root user
    task: "2.3"
    level: understanding
    topics: [iam, root-user, misconception]
    front:
      text: Give two reasons an IAM user with `AdministratorAccess` isn't equal to the root user.
    back:
      text: >-
        Some tasks need root itself, and no policy grants them. And an admin's power comes from
        policies that can be narrowed or blocked by a deny; root's doesn't come from IAM policies.

  # ------------------------------------------------------------------ 04.04, labs 03 and 04, simulation S4

  - id: c04-explicit-deny-wins
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: '"An allow somewhere means it''s allowed" is wrong'
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation]
    front:
      text: One policy allows an action and another applicable policy explicitly denies it. What happens?
    back:
      text: >-
        The action is denied. An explicit deny in any policy that applies beats every allow,
        wherever the allow is: allows add up only until a deny appears.

  - id: c04-limit-only-policy-types
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "How AWS decides: default deny, then allows, then an explicit deny wins"
    task: "2.3"
    level: recall
    topics: [iam, policy-evaluation]
    front:
      text: Which three policy types only set limits and grant nothing by themselves?
    back:
      text: >-
        Service control policies (SCPs), permissions boundaries and session policies. If one
        applies, it must also allow the request, on top of a real allow elsewhere.

  - id: c04-one-vs-two-accounts
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: Identity-based policies follow the identity; resource-based policies sit on the thing
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation, cross-account]
    front:
      text: Which policies must allow a request within one account, and which across two accounts?
    back:
      text: >-
        Within one account, an allow in either an identity-based or a resource-based policy is
        enough. Across two accounts, both must allow: the resource's policy and the requester's
        identity-based policy.

  - id: c04-three-ways-to-narrow
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "Least privilege: grant only what the task needs, then keep trimming"
    task: "2.3"
    level: recall
    topics: [iam, least-privilege]
    front:
      text: What are the three ways to narrow a policy toward least privilege?
    back:
      text: >-
        Fewer actions (read, not delete); fewer resources (one bucket's ARN, not `*`); conditions
        (for example, only when signed in with MFA).

  - id: c04-managed-to-customer-path
    page: guide/04-shared-responsibility-and-access/04-policies-and-least-privilege.md
    section: "AWS managed, customer managed or inline: who writes it, and how far it reaches"
    task: "2.3"
    level: understanding
    topics: [iam, policies, least-privilege]
    front:
      text: What path does AWS advise from AWS managed policies toward least privilege, and why?
    back:
      text: >-
        Start with AWS managed policies as a quick start, then move to customer managed policies
        written for your own case. AWS managed policies are shared by every customer, so they may
        grant more than you need.

  - id: c04-simulator-implicit-vs-explicit
    page: guide/04-shared-responsibility-and-access/07-lab-04-finish-and-fix-a-policy.md
    section: Recap
    task: "2.3"
    level: understanding
    topics: [iam, policy-evaluation, iam-tools]
    front:
      text: In the IAM policy simulator, how do you tell an implicit deny from an explicit deny?
    back:
      text: >-
        An explicit deny names the policy and statement that said Deny. An implicit deny names
        none, because no statement matched the request.

  # ------------------------------------------------------------------ 04.05

  - id: c04-akia-vs-asia
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Warm-up
    task: "2.3"
    level: recall
    topics: [credentials, access-keys]
    front:
      text: One access key ID starts with `AKIA`, another with `ASIA`. What's the difference?
    back:
      text: >-
        `AKIA` marks a long-term access key that works until someone deletes it. `ASIA` marks
        temporary credentials that stop working within hours.

  - id: c04-password-policy-no-lockout
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Passwords and MFA protect a person's sign-in
    task: "2.3"
    level: recall
    topics: [iam, password-policy]
    front:
      text: Can an IAM password policy lock a user out after several wrong guesses?
    back:
      text: >-
        No, it has no lockout setting (as of 2026-10-23). AWS recommends a strong password policy
        plus MFA instead.

  - id: c04-aws-credentials-for-code
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Your application's secrets belong in a store, not in the code
    task: "2.3"
    level: understanding
    topics: [secrets, roles]
    front:
      text: Should an application's AWS credentials go in Secrets Manager or Parameter Store?
    back:
      text: >-
        Neither. Give the code an IAM role, and AWS delivers temporary credentials to it. The two
        stores are for the application's other secrets and settings.

  - id: c04-sso-renamed
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: '"AWS Single Sign-On" is the old name'
    task: "2.3"
    level: recall
    topics: [federation, identity-center, misconception]
    front:
      text: What is "AWS Single Sign-On" called now, and when did the name change?
    back:
      text: >-
        AWS IAM Identity Center, renamed on July 26, 2022. It's the same service; the old name
        lingers in older questions and some command names.

  - id: c04-why-labs-use-iam-user
    page: guide/04-shared-responsibility-and-access/05-credentials-and-federation.md
    section: Why our labs use an IAM user anyway
    task: "2.3"
    level: understanding
    topics: [identity-center, free-plan]
    front:
      text: AWS recommends IAM Identity Center for people. Why do this guide's labs use an IAM user instead?
    back:
      text: >-
        In one account, the instance that gives console access creates an organization, which moves
        a Free plan account to the Paid plan (as of 2026-10-23). An IAM user with MFA is AWS's
        single-account baseline.
