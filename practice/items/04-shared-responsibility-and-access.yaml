            AWS publishes security updates for the runtimes it manages and, by default, applies them
            automatically.
    correct_answers: [ec2-os, function-libraries]
    hint:
      text: >-
        For each service, find where the line sits: below the operating system, or below your code?
    explanation:
      text: >-
        On EC2 the line sits below the operating system, so the shop patches the guest OS and the
        software it installs. On Lambda the line sits below the code, so the shop updates its code
        and libraries. On RDS and S3, AWS patches everything the shop doesn't write.

  - id: q04-rds-os-patch-who
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "Worked example: who patches what at the bakery"
    task: "2.1"
    level: application
    topics: [shared-responsibility, rds]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A clinic keeps its appointment database in Amazon RDS. A security patch is released for the operating system that RDS database servers use. Who is responsible for applying it?
    choices:
      - id: clinic-admin
        text: The clinic, since the database holds its data
        variants:
          - text: The clinic, as the data in it is the clinic's
          - text: The clinic, because the records belong to it
        explanation:
          text: >-
            The data is the clinic's, and so is access to it, but on RDS the operating system under
            the database is AWS's.
      - id: joint
        text: AWS and the clinic, since patching is shared
        variants:
          - text: Both of them, as patch management is shared
          - text: The clinic with AWS, because patching is shared
        explanation:
          text: >-
            Patch management is a shared kind of control, but a specific task, this patch, belongs
            to one side.
      - id: aws-rds
        text: AWS, since RDS is a managed database service
        variants:
          - text: AWS, as Amazon RDS is managed for the customer
          - text: AWS, because RDS is a managed database
      - id: app-vendor
        text: The clinic's software vendor, not AWS or the clinic
        variants:
          - text: The vendor of the clinic's app, not AWS or the clinic
          - text: Whoever wrote the clinic's app, not AWS or the clinic
        explanation:
          text: >-
            An application vendor has no access to the servers under RDS. AWS runs them.
    correct_answers: [aws-rds]
    hint:
      text: >-
        Compare a database the clinic runs on its own EC2 server with one it runs on RDS.
    explanation:
      text: >-
        The RDS User Guide puts operating system installation and patching, and database software
        patching, on AWS. In practice the clinic may be able to choose when some updates run, within
        its maintenance window, but AWS does the patching. The clinic still tunes its queries and
        decides who can connect. Had it run the database on EC2, the OS patch would have been its own.

  - id: q04-aws-assurance-audit-reports
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: AWS is responsible for security of the cloud
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, compliance]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's security officer wants evidence that AWS actually carries out its share of the shared responsibility model. What can the company rely on?
    choices:
      - id: audit-reports
