# Practice questions and concept cards for Module 04, Who secures what: shared responsibility and access.
# Written from the guide's pages only; build fields (page, section, task, level, topics) are described in
# source/practice/build_bundle.py. Blueprint: practice/work/blueprint-04.md.

questions:

  # ------------------------------------------------------------------ 04.01 Security of vs in the cloud

  - id: q04-security-of-the-cloud-meaning
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: AWS is responsible for security of the cloud
    task: "2.1"
    level: recall
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Under the AWS shared responsibility model, which statement describes "security of the cloud"?
    choices:
      - id: aws-customer-jointly
        text: AWS and the customer configure each resource's settings together
        variants:
          - text: The customer and AWS set up every resource's settings jointly
          - text: Both parties work together on the settings of each resource
        explanation:
          text: >-
            No task in the model is done jointly. Resource settings are configuration the customer
            chooses, on its side of the line.
      - id: aws-protects-infrastructure
        text: AWS protects the infrastructure that runs its services
        variants:
          - text: AWS secures the facilities, hardware and software behind its services
          - text: The infrastructure under every AWS service is protected by AWS
      - id: customer-protects-data
        text: The customer protects the data it stores in AWS services
        variants:
          - text: The customer secures the data it puts into AWS
          - text: Data a customer keeps in AWS is protected by that customer
        explanation:
          text: >-
            That is true, but it is security **in** the cloud, the customer's part, not security of
            the cloud.
      - id: customer-guest-os
        text: The customer patches its guest operating systems and sets firewall rules
        variants:
          - text: The customer updates its own guest OS and writes its firewall rules
          - text: Guest operating system patches and firewall rules are handled by the customer
        explanation:
          text: >-
            These are customer tasks on Amazon EC2, which makes them security **in** the cloud.
    correct_answers: [aws-protects-infrastructure]
    explanation:
      text: >-
        Security **of** the cloud is AWS's share: the infrastructure that runs every AWS service, from
        the host operating system and virtualization layer down to the physical security of the
        buildings. Security **in** the cloud is the customer's share: its data, its settings, who can
        reach them, and any software it runs.

  - id: q04-security-in-depends-on-services
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: recall
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        According to AWS, the amount of security work a customer does "in the cloud" depends mainly on what?
    choices:
      - id: support-plan
        text: The AWS Support plan the customer pays for
        variants:
          - text: Which AWS Support plan the customer has bought
          - text: The level of AWS Support the customer subscribes to
        explanation:
          text: >-
            A Support plan buys help and guidance; it doesn't move any security task from the
            customer to AWS.
      - id: region-count
        text: The number of AWS Regions the customer uses
        variants:
          - text: How many AWS Regions the customer deploys into
          - text: The count of Regions the customer's resources are spread over
        explanation:
          text: >-
            Using more Regions changes where resources run, not which layers the customer must
            secure.
      - id: services-chosen
        text: The AWS services the customer chooses to use
        variants:
          - text: Which AWS services the customer selects
          - text: The particular AWS services the customer picks
      - id: account-age
        text: How long the customer has had its AWS account
        variants:
          - text: The age of the customer's AWS account
          - text: How many years the customer has been with AWS
        explanation:
          text: >-
            The split of responsibilities is the same for a new account and an old one.
    correct_answers: [services-chosen]
    explanation:
      text: >-
        AWS says the customer's share depends on the services it selects, how they connect to its
        other systems, and the laws that apply to it. On Amazon EC2 the customer runs the guest
        operating system; on an abstracted service such as Amazon S3, AWS runs everything under the
        customer's data and settings.

  - id: q04-ec2-guest-os-update
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: application
    topics: [shared-responsibility, ec2]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A retailer runs its website on Linux virtual servers in Amazon EC2. A security update is released for the Linux operating system on those servers. Who is responsible for installing it?
    choices:
      - id: aws-host
        text: AWS, because it runs the virtualization layer
        variants:
          - text: AWS, since it operates the virtualization layer
          - text: AWS, as the owner of the virtualization software
        explanation:
          text: >-
            AWS runs and patches the host operating system and virtualization layer, but the Linux
            inside the virtual server is the guest operating system, which sits above that line.
      - id: aws-managed
        text: AWS, because EC2 is a managed service
        variants:
          - text: AWS, since Amazon EC2 is fully managed
          - text: AWS, as EC2 is one of its managed services
        explanation:
          text: >-
            EC2 is infrastructure as a service: you get basic building blocks and run the rest
            yourself, including the operating system.
      - id: both
        text: Both, because patch management is shared
        variants:
          - text: AWS and the retailer together, as patching is shared
          - text: Both sides jointly, because patching is a shared control
        explanation:
          text: >-
            Patch management is a shared **kind** of control, but each specific task belongs to one
            side. The guest operating system is the customer's alone.
      - id: retailer
        text: The retailer, because it runs the guest OS
        variants:
          - text: The retailer, since the guest OS is its own
          - text: The retailer, as it manages the guest operating system
    correct_answers: [retailer]
    hint:
      text: >-
        Two operating systems are involved on EC2: one on the physical machine, one inside your
        virtual server. Which one is this?
    explanation:
      text: >-
        On Amazon EC2, AWS says the customer manages the guest operating system, including its
        updates and security patches, plus any software it installs and its security group rules.
        AWS patches only the host operating system and virtualization layer underneath.

  - id: q04-ec2-customer-tasks-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, ec2]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        Which of these are the customer's responsibility when it uses Amazon EC2? (Select TWO.)
    choices:
      - id: host-os
        text: Patching the host operating system
        variants:
          - text: Updating the host OS on the physical machine
          - text: Installing security patches on the host operating system
        explanation:
          text: >-
            The host operating system runs on the physical machine, under the virtualization layer.
            AWS runs and patches it.
      - id: security-group-rules
        text: Writing the instance's security group rules
        variants:
          - text: Setting the rules of the server's security group
          - text: Deciding the security group rules for the instance
      - id: hardware
        text: Replacing failed disks in the physical servers
        variants:
          - text: Swapping out broken disks in AWS's machines
          - text: Repairing the physical server's failed drives
        explanation:
          text: >-
            Hardware is infrastructure, which is security of the cloud and AWS's job on every
            service.
      - id: guest-os-patches
        text: Patching the guest operating system
        variants:
          - text: Updating the guest OS inside the virtual server
          - text: Installing security patches on the guest operating system
      - id: virtualization
        text: Maintaining the virtualization software
        variants:
          - text: Updating the virtualization layer
          - text: Keeping the hypervisor software patched
        explanation:
          text: >-
            Virtualization is what AWS runs to split one physical machine into many virtual
            servers. It sits on AWS's side of the line.
    correct_answers: [security-group-rules, guest-os-patches]
    explanation:
      text: >-
        AWS lists three things an EC2 customer manages: the guest operating system with its updates
        and security patches, any software installed on the server, and the security group's rules.
        Everything from the host operating system and virtualization down to the hardware and
        buildings is AWS's.

  - id: q04-s3-customer-tasks-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: You are responsible for security in the cloud, and how much depends on the service
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, s3]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company stores documents in Amazon S3. Which of these are the company's responsibility under the AWS shared responsibility model? (Select TWO.)
    choices:
      - id: s3-os
        text: Patching the operating system that runs S3
        variants:
          - text: Updating the OS underneath Amazon S3
          - text: Installing patches on S3's operating system
        explanation:
          text: >-
            S3 is an abstracted service: AWS runs its infrastructure, operating system and platform.
      - id: encryption-choice
        text: Choosing the encryption options for its data
        variants:
          - text: Deciding which encryption options its data uses
          - text: Selecting how its stored data is encrypted
      - id: s3-hardware
        text: Maintaining the storage hardware behind S3
        variants:
          - text: Looking after the disks that hold S3 data
          - text: Keeping S3's storage devices in working order
        explanation:
          text: >-
            Hardware is AWS's on every service.
      - id: iam-access
        text: Deciding with IAM who can access the documents
        variants:
          - text: Using IAM to control who can reach the documents
          - text: Setting, through IAM, who may read the documents
      - id: s3-platform
        text: Updating the software platform S3 runs on
        variants:
          - text: Patching the platform software behind S3
          - text: Keeping S3's platform software up to date
        explanation:
          text: >-
            On abstracted services AWS runs the platform too; the customer has nothing to patch in
            S3.
    correct_answers: [encryption-choice, iam-access]
    explanation:
      text: >-
        For abstracted services such as Amazon S3, AWS runs the infrastructure, the operating system
        and the platform. The customer is responsible for its data, including which encryption
        options to use, for classifying that data, and for using IAM to say who can do what.

  - id: q04-ec2-to-rds-moves-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "A database three ways: on-premises, on EC2, on RDS"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, rds]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company runs its database on an Amazon EC2 instance and plans to move it to Amazon RDS. Which tasks will move from the company to AWS? (Select TWO.)
    choices:
      - id: db-software-patching
        text: Installing and patching the database software
        variants:
          - text: Installing and updating the database engine
          - text: Setting up and patching the database software
      - id: query-tuning
        text: Tuning the company's database queries
        variants:
          - text: Optimizing the queries the company runs
          - text: Making the company's queries run efficiently
        explanation:
          text: >-
            Query tuning, which AWS calls application optimization, stays with the customer even on
            RDS.
      - id: access-control
        text: Deciding which employees may connect to the database
        variants:
          - text: Choosing which staff can reach the database
          - text: Controlling which employees can connect to it
        explanation:
          text: >-
            Who can reach your data is yours on every service. On RDS you control it with IAM and
            security groups.
      - id: os-patching
        text: Installing and patching the operating system
        variants:
          - text: Installing and updating the server's OS
          - text: Setting up and patching the operating system
      - id: hardware-lifecycle
        text: Replacing the server hardware at end of life
        variants:
          - text: Swapping out aging server hardware
          - text: Managing the server hardware lifecycle
        explanation:
          text: >-
            Tempting, but hardware was already AWS's while the database ran on EC2, so it doesn't
            move in this change.
    correct_answers: [db-software-patching, os-patching]
    explanation:
      text: >-
        The Amazon RDS User Guide compares the three setups. Moving to EC2 hands AWS the physical
        work (hardware, power, network, cooling). Moving on to RDS also hands AWS the operating
        system and database software, along with backups, scaling and high availability. Query
        tuning and access to the data stay with the customer.

  - id: q04-rds-query-tuning-stays
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "A database three ways: on-premises, on EC2, on RDS"
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, rds]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's order database runs on Amazon RDS. Which of these tasks is still the company's?
    choices:
      - id: rds-query-tuning
        text: Tuning the queries its application sends
        variants:
          - text: Optimizing the queries its application runs
          - text: Making its application's queries efficient
      - id: rds-os
        text: Patching the database server's operating system
        variants:
          - text: Updating the OS of the database server
          - text: Applying OS patches to the database host
        explanation:
          text: >-
            On RDS, AWS installs and patches the operating system.
      - id: rds-engine-install
        text: Installing the database engine software
        variants:
          - text: Setting up the database software
          - text: Putting the database engine in place
        explanation:
          text: >-
            Database software installation and patching are AWS's on RDS. That is much of what
            "managed database" means.
      - id: rds-power
        text: Providing power and cooling for the server
        variants:
          - text: Keeping the server powered and cooled
          - text: Supplying the server's power and cooling
        explanation:
          text: >-
            Power, network and cooling are AWS's on RDS, and already were on EC2.
    correct_answers: [rds-query-tuning]
    explanation:
      text: >-
        In the RDS User Guide's comparison, application optimization is the one task that stays with
        the customer on RDS; the guide calls it query tuning. The customer also still decides who can
        reach the database, with IAM and security groups.

  - id: q04-ec2-only-customer-os
    revision: 2
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Four services side by side
    task: "2.1"
    level: understanding
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A team compares who looks after each layer of a workload on Amazon EC2, Amazon RDS, AWS Lambda and Amazon S3. Which of these layers is the customer's on EC2 but AWS's on the other three?
    choices:
      - id: data-access
        text: The stored data, and who can access it
        variants:
          - text: The data itself, and who may reach it
          - text: Stored data, and the access to that data
        explanation:
          text: >-
            Data and who can access it are the customer's on every service, on EC2 and the other
            three alike.
      - id: hardware
        text: The physical servers and their hardware
        variants:
          - text: The physical servers and the hardware in them
          - text: Server hardware in the data centers
        explanation:
          text: >-
            Servers, hardware and buildings are AWS's on all four services, EC2 included.
      - id: guest-os
        text: The workload's operating system
        variants:
          - text: The operating system under the workload
          - text: The OS that the workload runs on
      - id: app-code
        text: The code the customer writes and deploys
        variants:
          - text: The code that the customer writes and deploys
          - text: Code written and deployed by the customer
        explanation:
          text: >-
            Code stays the customer's: installed software on EC2, function code and its libraries on
            Lambda, query tuning on RDS. AWS doesn't take it over.
    correct_answers: [guest-os]
    hint:
      text: >-
        Look for the layer where the dividing line between AWS and the customer moves.
    explanation:
      text: >-
        On EC2 the customer installs and patches the guest operating system; on RDS, Lambda and S3,
        AWS runs the operating system. Data and access are the customer's everywhere, and hardware
        is AWS's everywhere, so those layers never move. That is why the line sits lowest on EC2.

  - id: q04-lambda-library-flaw
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Four services side by side
    task: "2.1"
    level: application
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A company's AWS Lambda functions bundle an open-source library for creating PDF files. A security flaw is announced in that library. Who must update it?
    choices:
      - id: aws-runtime-updates
        text: AWS, through its automatic runtime updates
        variants:
          - text: AWS, as part of applying runtime updates
          - text: AWS, when it next updates the runtime
        explanation:
          text: >-
            AWS's automatic updates cover the managed runtime itself, the language software, not
            libraries the customer adds to its function.
      - id: company-library
        text: The company, as the library is part of its code
        variants:
          - text: The company, since its code includes the library
          - text: The company, because the library ships with its code
      - id: aws-serverless
        text: AWS, because Lambda functions are serverless
        variants:
          - text: AWS, since Lambda is a serverless service
          - text: AWS, as serverless means it manages everything
        explanation:
          text: >-
            Serverless means AWS runs and patches the servers. The function's code and its libraries
            are still the customer's.
      - id: library-author
        text: Nobody at AWS or the company; the library's authors
        variants:
          - text: The library's authors, not AWS or the company
          - text: Only the open-source project that wrote it
        explanation:
          text: >-
            The authors may publish a fixed version, but someone has to put it into the function.
            That is the company's job.
    correct_answers: [company-library]
    hint:
      text: >-
        Separate the runtime that AWS manages from what the customer packages with its function.
    explanation:
      text: >-
        Lambda's runtime documentation says the customer updates its function code, including the
        libraries it depends on, when they have security flaws. AWS patches the servers and, by
        default, applies security updates to the managed runtimes automatically.

  - id: q04-lambda-runtime-deprecated
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Four services side by side
    task: "2.1"
    level: application
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        AWS announces that a language runtime used by a company's AWS Lambda functions will be retired. What should the company do?
    choices:
      - id: patch-lambda-os
        text: Start patching the operating system of the Lambda servers
        variants:
          - text: Take over OS patching for the servers running its functions
          - text: Begin applying OS updates to the servers behind Lambda
        explanation:
          text: >-
            Lambda manages server maintenance and patching; customers never reach those servers.
      - id: wait-for-aws
        text: Nothing, because AWS moves the functions to a new runtime
        variants:
          - text: Nothing, since AWS upgrades each function's runtime for it
          - text: Wait, as AWS will switch the functions to a newer runtime
        explanation:
          text: >-
            AWS keeps a supported runtime patched, but moving a function off a retired runtime is
            the customer's job.
      - id: request-extension
        text: Ask AWS Support to keep patching the old runtime for it
        variants:
          - text: Have AWS Support continue patching the old runtime
          - text: Request that AWS keep updating the retiring runtime
        explanation:
          text: >-
            The guide gives no such option: AWS says the customer moves its functions to a
            supported runtime before the old one is retired.
      - id: migrate-runtime
        text: Move the functions to a supported runtime before the date
        variants:
          - text: Upgrade the functions to a supported runtime in time
          - text: Switch its functions to a supported runtime before retirement
    correct_answers: [migrate-runtime]
    hint:
      text: >-
        Think about which runtime work AWS does automatically and which step it leaves to the
        customer.
    explanation:
      text: >-
        For runtimes AWS manages, AWS publishes security updates and, by default, applies them. Once
        a runtime is being retired, the customer must move its functions to a supported runtime in
        time. That step is one of the things Lambda leaves on the customer's side, with the function
        code, its libraries and its permissions.

  - id: q04-lambda-aws-tasks-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Four services side by side
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, lambda]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A company runs its order processing in AWS Lambda functions. Which of these are AWS's responsibility? (Select TWO.)
    choices:
      - id: function-role
        text: Deciding what the functions' IAM role may do
        variants:
          - text: Choosing the permissions of the functions' IAM role
          - text: Setting which actions the functions' role allows
        explanation:
          text: >-
            The function's role decides which other AWS resources it may use, and its permissions
            are the customer's choice, as on every service.
      - id: server-patching
        text: Patching the servers the functions run on
        variants:
          - text: Updating the servers that run the functions
          - text: Applying patches to the servers under the functions
      - id: dependency-updates
        text: Updating the libraries the function code uses
        variants:
          - text: Fixing flaws in the function code's libraries
          - text: Keeping the code's dependencies up to date
        explanation:
          text: >-
            Libraries are part of the customer's function code, so their security fixes are the
            customer's.
      - id: scaling
        text: Adding capacity when requests increase
        variants:
          - text: Scaling capacity up as requests grow
          - text: Providing more capacity as traffic rises
      - id: data-sensitivity
        text: Judging how sensitive the order data is
        variants:
          - text: Deciding how sensitive the order records are
          - text: Classifying the sensitivity of the order data
        explanation:
          text: >-
            AWS says the customer stays responsible for how sensitive its data is and the laws that
            apply to it.
    correct_answers: [server-patching, scaling]
    explanation:
      text: >-
        AWS says Lambda manages server maintenance, capacity provisioning, scaling and patching, and
        it applies security updates to the runtimes it manages. The customer keeps its code and the
        libraries it uses, the move off retired runtimes, the function's permissions, and its data.

  - id: q04-serverless-security-claim
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: '"With serverless, AWS handles the security" is wrong'
    task: "2.1"
    level: understanding
    topics: [shared-responsibility, lambda, misconception]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        A startup's founder says, "We built everything on AWS Lambda, so security is now AWS's job." Which reply is accurate?
    choices:
      - id: still-code-and-access
        text: Not quite, since the startup still owns its code, libraries and access
        variants:
          - text: Partly, because code, libraries and permissions remain the startup's
          - text: Not entirely, as the startup keeps its code, libraries and access
      - id: correct-all-aws
        text: Right, because serverless moves every security task to AWS
        variants:
          - text: Correct, since going serverless hands AWS all of security
          - text: True, as a serverless design gives AWS every security task
        explanation:
          text: >-
            The servers leave the customer's list, but the code, its libraries, its permissions and
            its data don't.
      - id: customer-patches-os
        text: No, because on Lambda the startup patches the operating system
        variants:
          - text: Wrong, since Lambda customers patch the operating system
          - text: Not so, as the startup must update the servers' operating system
        explanation:
          text: >-
            This overcorrects. Lambda manages server maintenance and patching; the operating system
            is AWS's.
      - id: only-billing
        text: Mostly, because only billing settings stay with the startup
        variants:
          - text: Almost, since the startup keeps nothing but its billing settings
          - text: Largely, as just the billing settings remain the startup's
        explanation:
          text: >-
            Billing isn't the point. The startup's code, libraries, permissions and data all stay
            its own responsibility.
    correct_answers: [still-code-and-access]
    explanation:
      text: >-
        Serverless removes the servers from the customer's list, not everything. On Lambda the
        customer still owns its function code and the libraries it depends on, the move off retired
        runtimes, the permissions of the function's role, and its data. An old library or an
        over-broad permission is a common way in.

  - id: q04-public-bucket-responsibility
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Your data, and who can reach it, are always yours
    task: "2.1"
    level: application
    topics: [shared-responsibility, s3]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        An employee turns off Block Public Access on one of the company's Amazon S3 buckets to share a file, and private customer records in the bucket are exposed. Under the shared responsibility model, whose responsibility was the bucket's access setting?
    choices:
      - id: aws-abstracted
        text: AWS's, because S3 is an abstracted service
        variants:
          - text: AWS's, since Amazon S3 is abstracted
          - text: AWS's, as S3 is one of its abstracted services
        explanation:
          text: >-
            On abstracted services AWS runs the infrastructure, operating system and platform. The
            customer's data and who can access it stay with the customer.
      - id: company
        text: The company's, because it controls access to its data
        variants:
          - text: The company's, since access to its data is its own
          - text: The company's, as it decides who reaches its data
      - id: aws-infrastructure
        text: AWS's, because the data sat on AWS's infrastructure
        variants:
          - text: AWS's, since AWS's hardware held the records
          - text: AWS's, as the records were stored on its machines
        explanation:
          text: >-
            AWS protects the infrastructure the data sits on, not who may read the data. This is the
            "AWS protects my data because it's in AWS" mistake.
      - id: shared-equally
        text: Both, because data protection is shared equally
        variants:
          - text: AWS and the company equally, as protection is shared
          - text: Both sides, since data protection is a joint task
        explanation:
          text: >-
            No single task is done by both sides. A bucket's access setting is the customer's alone.
    correct_answers: [company]
    hint:
      text: >-
        Ask which layer the setting belongs to, and whether that layer ever moves to AWS.
    explanation:
      text: >-
        On every AWS service, the customer decides what data it stores and who can reach it. AWS
        provides safe defaults (new buckets block public access), but keeping the right settings is
        the customer's job. Here AWS's default was safe, and the company undid it.

  - id: q04-always-customer-every-service
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: Your data, and who can reach it, are always yours
    task: "2.1"
    level: recall
    topics: [shared-responsibility]
    type: multiple_choice
    selection: single
    prompt:
      text: |
        Which responsibility stays with the customer on every AWS service, from Amazon EC2 to Amazon S3?
    choices:
      - id: patch-os
        text: Patching the operating system
        variants:
          - text: Updating the operating system
          - text: Installing operating system patches
        explanation:
          text: >-
            Only on EC2 does the customer patch the operating system. On RDS, Lambda and S3, AWS
            does.
      - id: install-db
        text: Installing the database software
        variants:
          - text: Setting up the database engine
          - text: Putting the database software in place
        explanation:
          text: >-
            On RDS, AWS installs and patches the database software.
      - id: runtime-updates
        text: Updating the language runtime
        variants:
          - text: Patching the language runtime
          - text: Applying updates to the runtime
        explanation:
          text: >-
            On Lambda, AWS applies security updates to the runtimes it manages.
      - id: who-can-access
        text: Deciding who can access its data
        variants:
          - text: Controlling who can reach its data
          - text: Choosing who may get at its data
    correct_answers: [who-can-access]
    explanation:
      text: >-
        The middle layers, such as the operating system and platform software, move between AWS and
        the customer depending on the service. The top layer never moves: on every service the
        customer decides what data it puts in AWS and who can reach it.

  - id: q04-bakery-updates-still-yours-two
    page: guide/04-shared-responsibility-and-access/01-security-of-vs-in-the-cloud.md
    section: "Worked example: who patches what at the bakery"
    task: "2.1"
    level: application
    topics: [shared-responsibility]
    type: multiple_choice
    selection: multiple
    selection_count: 2
    prompt:
      text: |
        A shop runs its website on Amazon EC2, its order database on Amazon RDS, small order functions on AWS Lambda, and its photos in Amazon S3. Which security updates are still the shop's to install? (Select TWO.)
    choices:
      - id: rds-engine
        text: Patches for the RDS database engine
        variants:
          - text: Updates to the database software on RDS
          - text: Security fixes for the RDS database engine
        explanation:
          text: >-
            On RDS, AWS installs and patches the database software.
      - id: ec2-os
        text: Patches for the web server's operating system
        variants:
          - text: Updates to the EC2 web server's OS
          - text: Security fixes for the web server's operating system
      - id: s3-platform-updates
        text: Patches for the platform under S3
        variants:
          - text: Updates to the software S3 runs on
          - text: Security fixes for S3's platform
        explanation:
          text: >-
            S3 leaves the customer nothing to patch; AWS runs everything under the stored data.
      - id: function-libraries
        text: Patches for the libraries in its functions
        variants:
          - text: Updates to its functions' code libraries
          - text: Security fixes for its functions' dependencies
      - id: managed-runtime
        text: Patches for Lambda's managed runtime
        variants:
          - text: Updates to the managed Lambda runtime
          - text: Security fixes for the runtime Lambda manages
        explanation:
