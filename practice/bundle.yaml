description: |
  Practice questions and flashcards to go with Automate the Cloud's **Study Guide for the AWS
  Certified Cloud Practitioner Exam (CLF-C02)**. The questions follow the exam's style: short
  business scenarios, one correct answer, or two correct answers where the question says
  "Select TWO". Each answer appears in one of several wordings, so learn what an answer means,
  not what it looks like. The flashcards cover the guide's glossary terms, the pairs people mix
  up, and the major ideas of each module.

  **What it covers.** The modules of the guide written so far: Module 02 (why organizations use
  the cloud) to Module 07 (networks and the edge). Items for later modules are added as those
  modules are written.

  **Following along with the guide.** Every item is tagged so you can practice one part at a
  time:

  - `module-05`: everything from Module 05;
  - `clf-05-03`: everything from one page of the guide (the guide's page ID);
  - `domain-3` and `task-3-6`: the exam domain and task statement a question serves;
  - `recall`, `understanding`, `application`: what a question asks you to do;
  - `exam-style` (questions), `concept`, `glossary-term`, `confused-pair` and `abbreviation`
    (flashcards).

  Each item's reference names the guide page and section it was written from.

  **What it isn't.** These are original practice items, not questions from the real exam, and a
  practice score doesn't predict an exam result. AWS changes often: when an item depends on a
  dated fact, the explanation says so. The items were drafted with AI assistance from the guide
  and checked against it, and have not yet been reviewed by a subject expert.

